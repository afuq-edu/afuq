<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>أُحِبُّ لُغَتي — ألعاب الصف الأول</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --green:#1a9e4b; --green2:#3ec96f; --red:#d7263d; --red2:#ff6b6b; --sand:#f4c95d; --sand2:#ffe39a;
  --sea:#1b8fd6; --sea2:#5fc4ff; --ink:#2b1e3c; --paper:#fffaf0; --purple:#7b4fd6; --orange:#ff8c42;
  --sh:0 10px 0 rgba(0,0,0,.12), 0 18px 30px rgba(0,0,0,.18);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;font-family:'Baloo Bhaijaan 2','Segoe UI',Tahoma,sans-serif;color:var(--ink);background:#dff3ff}
button{font-family:inherit;border:0;cursor:pointer;color:inherit}
#app{position:fixed;inset:0;overflow:hidden}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;overflow:hidden;animation:fadeIn .5s both}
@keyframes fadeIn{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:none}}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}

/* ---------- Scenes (Omani environments) ---------- */
.scene{position:absolute;inset:0;z-index:0;overflow:hidden}
.scene svg{position:absolute;width:100%;height:100%;left:0;top:0}
.scene.sky{background:linear-gradient(#8fd3ff 0%,#dff6ff 55%,#a8e07a 56%,#5fbf4a 100%)}
.scene.sea{background:linear-gradient(#ffd27a 0%,#ffb066 18%,#7fd6ff 19%,#1b8fd6 60%,#0d5aa0 100%)}
.scene.desert{background:linear-gradient(#ffe9a8 0%,#ffcf6b 45%,#e9a94a 46%,#c9862a 100%)}
.scene.mountain{background:linear-gradient(#bfe8ff 0%,#eaf8ff 50%,#4d8a3a 51%,#2f6b2a 100%)}
.scene.night{background:linear-gradient(#0f1f4d 0%,#26377a 60%,#1c3b2a 61%,#0f2a1c 100%)}
.scene.souq{background:linear-gradient(#5a2d82 0%,#8a4bb8 50%,#c98a3c 51%,#8a5a1f 100%)}
.scene.classroom{background:linear-gradient(#fff4d6 0%,#ffe6b3 60%,#c98a5a 61%,#a86a3a 100%)}
.scene.garden{background:linear-gradient(#a6e3ff 0%,#e6fbff 45%,#8bd65a 46%,#3c9a3a 100%)}
.cloud{position:absolute;width:120px;height:44px;background:#fff;border-radius:50px;opacity:.9;animation:drift linear infinite}
.cloud:before,.cloud:after{content:"";position:absolute;background:#fff;border-radius:50%}
.cloud:before{width:55px;height:55px;left:18px;top:-26px}.cloud:after{width:40px;height:40px;right:22px;top:-18px}
@keyframes drift{from{transform:translateX(-30vw)}to{transform:translateX(130vw)}}
.sun{position:absolute;top:22px;left:26px;width:80px;height:80px;border-radius:50%;background:radial-gradient(#fff6a8,#ffd23f 60%,#ffb703);box-shadow:0 0 40px 12px rgba(255,210,63,.55);animation:spin 18s linear infinite}
.sun:after{content:"";position:absolute;inset:-18px;border-radius:50%;background:repeating-conic-gradient(rgba(255,210,63,.35) 0 10deg,transparent 10deg 20deg)}
@keyframes spin{to{transform:rotate(360deg)}}
.wave{position:absolute;left:-10%;width:120%;height:70px;bottom:0;background:radial-gradient(circle at 50% 120%,transparent 40%,rgba(255,255,255,.35) 41%,transparent 60%) 0 0/120px 70px repeat-x;animation:wave 4s ease-in-out infinite}
@keyframes wave{0%,100%{transform:translateX(0)}50%{transform:translateX(30px)}}
.deco{position:absolute;font-size:44px;filter:drop-shadow(0 6px 4px rgba(0,0,0,.2));animation:bob 3s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}

/* ---------- Header ---------- */
.top{position:relative;z-index:2;display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top,0px)) 12px 10px}
.btn-round{width:54px;height:54px;border-radius:50%;background:#fff;box-shadow:var(--sh);font-size:26px;display:grid;place-items:center;transition:transform .15s}
.btn-round:active{transform:scale(.9) translateY(4px);box-shadow:0 4px 0 rgba(0,0,0,.12)}
.top h1{flex:1;margin:0;font-size:26px;text-align:center;color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.25),0 0 18px rgba(0,0,0,.2)}
.top .stars{font-size:22px;letter-spacing:-2px;color:#ffd23f;text-shadow:0 2px 0 rgba(0,0,0,.3)}

/* ---------- Home ---------- */
.hero{position:relative;z-index:2;text-align:center;padding:10px 16px 0}
.hero .title{font-size:52px;font-weight:800;color:#fff;margin:0;line-height:1;text-shadow:0 5px 0 var(--red),0 10px 22px rgba(0,0,0,.35);animation:bounceIn .9s both}
.hero .sub{font-size:20px;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.3);margin:6px 0 0}
@keyframes bounceIn{0%{transform:scale(.3);opacity:0}60%{transform:scale(1.1)}80%{transform:scale(.95)}100%{transform:scale(1);opacity:1}}
.units{position:relative;z-index:2;padding:16px 14px 40px;display:flex;flex-direction:column;gap:18px;max-width:760px;margin:0 auto;width:100%}
.unit{background:rgba(255,255,255,.55);backdrop-filter:blur(6px);border-radius:28px;padding:14px;box-shadow:0 12px 30px rgba(0,0,0,.12)}
.unit h2{margin:0 0 10px;font-size:24px;text-align:center;color:var(--purple)}
.unit h2 span{display:inline-block;background:#fff;border-radius:40px;padding:2px 20px;box-shadow:0 4px 0 rgba(0,0,0,.08)}
.lessons{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.lesson-card{position:relative;background:#fff;border-radius:24px;padding:14px 8px 12px;text-align:center;box-shadow:var(--sh);transition:transform .15s;animation:popIn .5s both}
.lesson-card:active{transform:scale(.95) translateY(4px)}
@keyframes popIn{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}
.lesson-card .big{font-size:56px;line-height:1;font-weight:800;color:var(--red);display:block;text-shadow:0 3px 0 #fbd5da}
.lesson-card .emo{font-size:46px;display:block;line-height:1.2}
.lesson-card .name{font-size:18px;font-weight:700;display:block;margin-top:6px;line-height:1.2}
.lesson-card .st{font-size:16px;color:#ffb703;letter-spacing:-1px;margin-top:4px;display:block}
.lesson-card .badge{position:absolute;top:-8px;right:-6px;background:var(--green);color:#fff;font-size:14px;padding:2px 10px;border-radius:20px;font-weight:700;box-shadow:0 3px 0 #0e6b30}

/* ---------- Lesson page ---------- */
.stages{position:relative;z-index:2;padding:10px 14px 30px;display:flex;flex-direction:column;gap:16px;max-width:640px;margin:0 auto;width:100%}
.letter-hero{position:relative;z-index:2;text-align:center;padding:6px}
.letter-hero .L{font-size:120px;font-weight:800;color:#fff;line-height:1;text-shadow:0 8px 0 var(--red),0 14px 30px rgba(0,0,0,.35);animation:bounceIn 1s both}
.letter-hero .forms{display:flex;justify-content:center;gap:10px;margin-top:6px;flex-wrap:wrap}
.letter-hero .forms span{background:#fff;border-radius:16px;padding:2px 14px;font-size:34px;font-weight:800;color:var(--red);box-shadow:0 5px 0 rgba(0,0,0,.15);animation:popIn .5s both}
.stage{display:flex;align-items:center;gap:14px;background:#fff;border-radius:26px;padding:12px 14px;box-shadow:var(--sh);text-align:right;transition:transform .15s;animation:slideIn .5s both;width:100%}
.stage:active{transform:scale(.97) translateY(4px)}
@keyframes slideIn{from{transform:translateX(60px);opacity:0}to{transform:none;opacity:1}}
.stage .ic{width:76px;height:76px;border-radius:22px;display:grid;place-items:center;font-size:42px;color:#fff;flex:none;box-shadow:inset 0 -6px 0 rgba(0,0,0,.15)}
.stage .ic.s1{background:linear-gradient(135deg,#ff8c42,#ffb703)}.stage .ic.s2{background:linear-gradient(135deg,#1b8fd6,#5fc4ff)}.stage .ic.s3{background:linear-gradient(135deg,#7b4fd6,#c77dff)}
.stage .ic.s4{background:linear-gradient(135deg,#1a9e4b,#3ec96f)}
.stage .tx{flex:1}.stage .tx b{display:block;font-size:22px}.stage .tx small{display:block;font-size:16px;color:#7a6b8f}
.stage .st{font-size:20px;color:#ffb703;letter-spacing:-2px}

/* ---------- Game screen ---------- */
.gamewrap{position:relative;z-index:2;flex:1;display:flex;flex-direction:column;min-height:0}
.instruct{margin:0 12px 6px;background:rgba(255,255,255,.92);border-radius:20px;padding:8px 14px;font-size:20px;font-weight:700;text-align:center;box-shadow:0 6px 0 rgba(0,0,0,.08);display:flex;align-items:center;gap:8px;justify-content:center;line-height:1.3}
.instruct .spk{background:var(--sea);color:#fff;border-radius:50%;width:40px;height:40px;font-size:20px;flex:none;display:grid;place-items:center;box-shadow:0 4px 0 #0d5aa0}
.progress{margin:0 14px 8px;height:18px;background:rgba(255,255,255,.5);border-radius:20px;overflow:hidden;box-shadow:inset 0 2px 4px rgba(0,0,0,.15)}
.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--green),var(--green2));border-radius:20px;transition:width .5s cubic-bezier(.34,1.56,.64,1)}
.area{flex:1;position:relative;overflow:auto;padding:8px 12px 20px;min-height:0}
.grid{display:grid;gap:12px;justify-content:center;align-content:start}
.card{background:#fff;border-radius:22px;box-shadow:var(--sh);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:10px;transition:transform .15s,background .3s;position:relative;min-height:110px}
.card:active{transform:scale(.93)}
.card .e{font-size:64px;line-height:1.1;filter:drop-shadow(0 4px 3px rgba(0,0,0,.15))}
.card .w{font-size:30px;font-weight:800;line-height:1.2}
.card.ok{background:linear-gradient(#e8ffe8,#b7f5c2);box-shadow:0 0 0 5px var(--green),var(--sh);animation:jelly .6s}
.card.bad{animation:shake .5s;background:#ffe0e0}
.card.gone{opacity:0;transform:scale(0);pointer-events:none}
.card.sel{box-shadow:0 0 0 5px var(--orange),var(--sh);transform:scale(1.05)}
@keyframes jelly{0%,100%{transform:scale(1)}30%{transform:scale(1.15,.85)}50%{transform:scale(.9,1.1)}70%{transform:scale(1.05,.95)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-12px)}40%,80%{transform:translateX(12px)}}
.bigword{font-size:44px;font-weight:800;text-align:center;background:#fff;border-radius:24px;padding:10px 18px;margin:6px auto 12px;box-shadow:var(--sh);max-width:95%;line-height:1.5}
.bigword .hl{color:var(--red)}
.bigword .blank{display:inline-block;min-width:60px;border-bottom:5px dashed var(--orange);color:var(--orange);margin:0 4px;font-size:44px}
.prompt{display:flex;flex-direction:column;align-items:center;gap:6px;margin:4px auto 12px}
.prompt .e{font-size:110px;line-height:1;filter:drop-shadow(0 8px 6px rgba(0,0,0,.2));animation:bob 2.5s ease-in-out infinite}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;max-width:620px;margin:0 auto}
.opt{background:#fff;border-radius:22px;padding:14px 10px;font-size:34px;font-weight:800;text-align:center;box-shadow:var(--sh);transition:transform .15s;min-height:84px;display:flex;align-items:center;justify-content:center;gap:8px;line-height:1.2}
.opt .e{font-size:56px}
.opt:active{transform:scale(.94)}
.opt.ok{background:#b7f5c2;box-shadow:0 0 0 5px var(--green),var(--sh);animation:jelly .6s}
.opt.bad{animation:shake .5s;background:#ffd6d6}
.opt.dim{opacity:.35;pointer-events:none}
.chip{display:inline-flex;align-items:center;justify-content:center;background:#fff;border-radius:18px;padding:6px 16px;font-size:34px;font-weight:800;box-shadow:0 6px 0 rgba(0,0,0,.14),0 10px 20px rgba(0,0,0,.12);margin:5px;transition:transform .15s;min-width:64px;line-height:1.3}
.chip:active{transform:scale(.92)}
.chip.used{opacity:.25;pointer-events:none;transform:scale(.8)}
.chip.ok{background:#b7f5c2}.chip.bad{animation:shake .5s;background:#ffd6d6}
.chips{display:flex;flex-wrap:wrap;justify-content:center;padding:6px}
.slot-row{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:8px auto}
.slot{min-width:70px;height:78px;border-radius:18px;border:4px dashed rgba(255,255,255,.9);background:rgba(255,255,255,.35);display:grid;place-items:center;font-size:34px;font-weight:800;color:#fff}
.slot.filled{background:#fff;color:var(--ink);border-style:solid;border-color:var(--green);animation:popIn .3s}
.bins{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:8px 0}
.bin{background:rgba(255,255,255,.9);border-radius:22px;min-height:120px;padding:8px;text-align:center;box-shadow:var(--sh);border:4px solid transparent;transition:transform .15s}
.bin.hot{transform:scale(1.04);border-color:var(--orange)}
.bin h4{margin:0 0 4px;font-size:30px;color:var(--red);line-height:1.1}
.bin .lbl{font-size:14px;color:#7a6b8f;display:block;line-height:1.1}
.bin .got{display:flex;flex-wrap:wrap;justify-content:center;gap:4px;min-height:40px}
.bin .got span{background:#e8ffe8;border-radius:12px;padding:0 8px;font-size:20px;font-weight:700}
.bin .got span.e{font-size:28px;background:transparent}
.fly{position:fixed;z-index:50;pointer-events:none;font-size:40px;font-weight:800;transition:all .6s cubic-bezier(.4,0,.2,1)}
.cta{display:block;margin:14px auto;background:linear-gradient(#3ec96f,#1a9e4b);color:#fff;font-size:28px;font-weight:800;padding:12px 40px;border-radius:40px;box-shadow:0 8px 0 #0e6b30,0 14px 24px rgba(0,0,0,.25);transition:transform .15s;animation:pulse 1.6s infinite}
.cta:active{transform:translateY(6px);box-shadow:0 2px 0 #0e6b30}
.cta.blue{background:linear-gradient(#5fc4ff,#1b8fd6);box-shadow:0 8px 0 #0d5aa0,0 14px 24px rgba(0,0,0,.25)}
.cta.orange{background:linear-gradient(#ffb703,#ff8c42);box-shadow:0 8px 0 #b85c1a,0 14px 24px rgba(0,0,0,.25)}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}

/* story */
.story{background:var(--paper);border-radius:26px;padding:14px 18px;margin:6px auto;max-width:640px;box-shadow:var(--sh);font-size:27px;line-height:2;text-align:right;position:relative}
.story h3{margin:0 0 6px;text-align:center;color:var(--red);font-size:32px}
.story .hl{color:var(--red);font-weight:800}
.story .emo{font-size:60px;text-align:center;line-height:1.2}

/* floating objects (balloons / fish) */
.float-area{position:absolute;inset:0;overflow:hidden}
.balloon{position:absolute;width:96px;height:118px;border-radius:50% 50% 50% 50%/45% 45% 55% 55%;display:grid;place-items:center;font-size:40px;font-weight:800;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.3);box-shadow:inset -12px -14px 0 rgba(0,0,0,.12),0 10px 16px rgba(0,0,0,.2);animation:floatUp linear both;cursor:pointer;transition:transform .1s}
.balloon:after{content:"";position:absolute;bottom:-26px;left:50%;width:3px;height:28px;background:rgba(0,0,0,.35)}
.balloon:before{content:"";position:absolute;top:14px;left:18px;width:18px;height:28px;border-radius:50%;background:rgba(255,255,255,.4);transform:rotate(25deg)}
@keyframes floatUp{from{transform:translateY(110vh)}to{transform:translateY(-160px)}}
.balloon.pop{animation:popB .35s forwards}
@keyframes popB{to{transform:scale(1.6);opacity:0}}
.balloon.shake{animation:shake .4s}
.fish{position:absolute;font-size:34px;font-weight:800;color:#fff;background:linear-gradient(135deg,#ffb703,#ff6b6b);padding:6px 18px;border-radius:40px 40px 40px 8px;box-shadow:0 8px 0 rgba(0,0,0,.18);animation:fall linear both;white-space:nowrap}
.fish:before{content:"🐟";position:absolute;right:-30px;top:2px;font-size:30px;transform:scaleX(-1)}
@keyframes fall{from{transform:translateY(-120px)}to{transform:translateY(110vh)}}
.fish.caught{animation:popB .3s forwards}
.fish.bad{animation:shake .4s}
.hud{position:absolute;top:8px;left:12px;z-index:5;background:#fff;border-radius:20px;padding:4px 16px;font-size:24px;font-weight:800;box-shadow:var(--sh)}
.hud b{color:var(--red)}
.timerbar{position:absolute;bottom:0;left:0;height:12px;background:linear-gradient(90deg,var(--red),var(--orange));transition:width 1s linear;z-index:5}

/* scene words */
.sw{position:absolute;background:#fff;border-radius:18px;padding:4px 14px;font-size:32px;font-weight:800;box-shadow:var(--sh);animation:bob 3s ease-in-out infinite;transition:transform .2s}
.sw.ok{background:#b7f5c2;box-shadow:0 0 0 5px var(--green),var(--sh)}
.sw.bad{animation:shake .5s;background:#ffd6d6}

/* pairs */
.pairs{display:grid;grid-template-columns:1fr 60px 1fr;gap:10px;max-width:640px;margin:0 auto;align-items:stretch}
.pairs .col{display:flex;flex-direction:column;gap:12px}
.pairs .pc{background:#fff;border-radius:20px;padding:10px;font-size:26px;font-weight:800;text-align:center;box-shadow:var(--sh);min-height:80px;display:flex;align-items:center;justify-content:center;gap:6px;line-height:1.2;transition:transform .15s}
.pairs .pc .e{font-size:48px}
.pairs .pc.sel{box-shadow:0 0 0 5px var(--orange),var(--sh)}
.pairs .pc.done{background:#b7f5c2;pointer-events:none}
.pairs .pc.bad{animation:shake .5s}
.pairs .mid{display:flex;flex-direction:column;gap:12px}
.pairs .mid div{min-height:80px;display:grid;place-items:center;font-size:32px;color:#fff;opacity:0}
.pairs .mid div.on{opacity:1;animation:popIn .4s}

/* memory */
.mem{display:grid;gap:10px;justify-content:center;max-width:560px;margin:0 auto}
.mcard{aspect-ratio:1;position:relative;transform-style:preserve-3d;transition:transform .5s;cursor:pointer;min-height:96px}
.mcard.flip{transform:rotateY(180deg)}
.mcard .f{position:absolute;inset:0;border-radius:20px;backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:var(--sh);font-size:22px;font-weight:800;line-height:1.2}
.mcard .front{background:linear-gradient(135deg,var(--red),#ff8c42);color:#fff;font-size:50px}
.mcard .back{background:#fff;transform:rotateY(180deg)}
.mcard .back .e{font-size:46px}
.mcard.done .back{background:#b7f5c2}

/* order */
.orderlist{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;max-width:640px;margin:0 auto}
.ocard{background:#fff;border-radius:22px;padding:12px;text-align:center;box-shadow:var(--sh);position:relative;transition:transform .15s}
.ocard .e{font-size:70px;line-height:1.1}
.ocard .t{font-size:22px;font-weight:700;line-height:1.3}
.ocard .num{position:absolute;top:-12px;right:-8px;width:44px;height:44px;border-radius:50%;background:var(--green);color:#fff;font-size:24px;font-weight:800;display:grid;place-items:center;box-shadow:0 4px 0 #0e6b30;animation:popIn .4s}
.ocard.done{background:#e8ffe8}
.ocard.bad{animation:shake .5s}

/* maze */
.maze{display:grid;gap:4px;margin:6px auto;max-width:440px;width:100%}
.mz{aspect-ratio:1;border-radius:12px;background:rgba(255,255,255,.35);display:grid;place-items:center;font-size:28px;transition:background .2s}
.mz.wall{background:#5a3b1a;box-shadow:inset 0 -6px 0 rgba(0,0,0,.25)}
.mz.path{background:#fff;box-shadow:inset 0 -4px 0 rgba(0,0,0,.08)}
.mz.walked{background:#ffd23f;box-shadow:inset 0 -4px 0 #d9a400}
.mz.here{background:#3ec96f}
.mz.bad{animation:shake .4s;background:#ffb3b3}

/* wheel */
.wheelwrap{position:relative;width:min(78vw,300px);height:min(78vw,300px);margin:6px auto}
.wheel{width:100%;height:100%;border-radius:50%;box-shadow:0 0 0 10px #fff,0 0 0 16px var(--red),var(--sh);transition:transform 3.2s cubic-bezier(.17,.67,.12,1);position:relative}
.wheel span{position:absolute;left:50%;top:50%;transform-origin:0 0;font-size:34px;font-weight:800;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.4)}
.pointer{position:absolute;top:-22px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:18px solid transparent;border-right:18px solid transparent;border-top:36px solid var(--red);filter:drop-shadow(0 4px 0 rgba(0,0,0,.25));z-index:3}
.wheel .hub{position:absolute;inset:38%;background:#fff;border-radius:50%;display:grid;place-items:center;font-size:34px;box-shadow:inset 0 -6px 0 rgba(0,0,0,.1)}

/* race */
.track{position:relative;height:110px;margin:6px 8px 10px;background:linear-gradient(#5fc4ff,#1b8fd6);border-radius:30px;overflow:hidden;box-shadow:inset 0 6px 14px rgba(0,0,0,.2)}
.track .finish{position:absolute;left:8px;top:0;bottom:0;width:40px;background:repeating-linear-gradient(45deg,#fff 0 10px,#222 10px 20px);opacity:.8}
.track .racer{position:absolute;top:18px;font-size:64px;transition:right 1s cubic-bezier(.34,1.56,.64,1);filter:drop-shadow(0 6px 4px rgba(0,0,0,.3));animation:bob 1.5s ease-in-out infinite}
.track.sand{background:linear-gradient(#ffe39a,#e9a94a)}
.track .wave{height:40px;bottom:0}

/* trace */
.tracewrap{position:relative;width:min(92vw,360px);height:min(92vw,360px);margin:4px auto;background:#fff;border-radius:28px;box-shadow:var(--sh);overflow:hidden;touch-action:none}
.tracewrap canvas{position:absolute;inset:0;width:100%;height:100%}
.pal{display:flex;justify-content:center;gap:12px;margin:8px}
.pal div{width:56px;height:56px;border-radius:50%;box-shadow:0 5px 0 rgba(0,0,0,.2);border:4px solid #fff;transition:transform .15s}
.pal div.sel{transform:scale(1.2);box-shadow:0 0 0 4px var(--ink)}

/* flag */
.flagwrap{width:min(92vw,420px);margin:6px auto;background:#fff;border-radius:22px;padding:10px;box-shadow:var(--sh)}
.flagwrap svg{width:100%;display:block}
.flagwrap rect,.flagwrap path{cursor:pointer;transition:fill .3s}

/* feedback overlay */
#fb{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:80;pointer-events:none}
#fb span{font-size:120px;animation:bounceIn .6s;filter:drop-shadow(0 10px 10px rgba(0,0,0,.3))}
#fb.on{display:flex}

/* results */
.result{position:relative;z-index:2;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;gap:8px}
.result .rs{font-size:80px;letter-spacing:-6px;color:#ffd23f;text-shadow:0 6px 0 #b8860b;animation:bounceIn 1s both}
.result h2{margin:0;font-size:40px;color:#fff;text-shadow:0 4px 0 rgba(0,0,0,.3)}
.result p{font-size:24px;color:#fff;margin:0;text-shadow:0 2px 0 rgba(0,0,0,.3)}
.result .char{font-size:110px;animation:bob 2s ease-in-out infinite}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:70}
.mascot{position:absolute;bottom:10px;right:14px;font-size:70px;z-index:2;animation:bob 2.6s ease-in-out infinite;filter:drop-shadow(0 8px 6px rgba(0,0,0,.25))}
.tip{position:relative;z-index:2;text-align:center;color:#fff;font-size:18px;text-shadow:0 2px 0 rgba(0,0,0,.3);margin:4px}
.nasheed{background:var(--paper);border-radius:26px;padding:14px;margin:6px auto;max-width:560px;box-shadow:var(--sh);text-align:center}
.nasheed .ln{font-size:28px;font-weight:700;line-height:1.9;padding:2px 6px;border-radius:12px;transition:background .3s}
.nasheed .ln.now{background:#fff2b3}
.nasheed .ln.done{color:var(--green)}
.hint{font-size:18px;color:#fff;text-align:center;margin:4px;text-shadow:0 2px 0 rgba(0,0,0,.3)}
</style>

const SFX = (()=>{
  let ctx; const g=()=>{ctx=ctx||new (window.AudioContext||window.webkitAudioContext)(); if(ctx.state==='suspended')ctx.resume(); return ctx};
  const tone=(f,t,dur,type='sine',vol=.25,slide)=>{try{const c=g(),o=c.createOscillator(),v=c.createGain();o.type=type;o.frequency.setValueAtTime(f,c.currentTime+t);if(slide)o.frequency.exponentialRampToValueAtTime(slide,c.currentTime+t+dur);v.gain.setValueAtTime(0,c.currentTime+t);v.gain.linearRampToValueAtTime(vol,c.currentTime+t+.02);v.gain.exponentialRampToValueAtTime(.001,c.currentTime+t+dur);o.connect(v).connect(c.destination);o.start(c.currentTime+t);o.stop(c.currentTime+t+dur+.05)}catch(e){}};
  return {
    click:()=>tone(660,0,.08,'triangle',.15),
    pop:()=>{tone(520,0,.06,'square',.15,220)},

})();

function makeScene(name){
  const s=h(`<div class="scene ${name}"></div>`);

  if(!['night','souq','classroom'].includes(name)){s.appendChild(h('<div class="sun"></div>'));
    for(let i=0;i<3;i++){const c=h('<div class="cloud"></div>');c.style.top=(30+i*60)+'px';c.style.animationDuration=(40+i*15)+'s';c.style.animationDelay=(-i*17)+'s';c.style.transform+='scale('+(0.7+i*.25)+')';s.appendChild(c)}}

  return s;
}

function feedback(ok){const f=$('#fb');f.querySelector('span').textContent=ok?shuffle(['⭐','🎉','👏','✅','🌟'])[0]:'🙈';f.classList.remove('on');void f.offsetWidth;f.classList.add('on');clearTimeout(fbT);fbT=setTimeout(()=>f.classList.remove('on'),700)}

/* --- القصاصات الورقية --- */
function confetti(){const c=$('#confetti'),x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;const P=[];const cols=['#d7263d','#1a9e4b','#ffd23f','#1b8fd6','#ff8c42','#fff'];for(let i=0;i<160;i++)P.push({x:Math.random()*c.width,y:-20-Math.random()*300,r:6+Math.random()*8,c:cols[i%cols.length],v:2+Math.random()*4,a:Math.random()*6,s:Math.random()*.2-.1});let t=0;const go=()=>{x.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.y+=p.v;p.a+=p.s;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.c;x.fillRect(-p.r/2,-p.r/2,p.r,p.r*1.6);x.restore()});if(++t<220)requestAnimationFrame(go);else x.clearRect(0,0,c.width,c.height)};go()}

function gameScreen(l,gi){
  const g=l.games[gi];
  const s=h('<div class="screen"></div>');s.appendChild(makeScene(g.scene||l.scene||'sky'));
  const top=h(`<div class="top"><button class="btn-round">↩️</button><h1>${g.name}</h1><button class="btn-round">🔁</button></div>`);
  top.children[0].onclick=()=>{SFX.click();show(lessonScreen(l))};
  top.children[2].onclick=()=>{SFX.click();show(gameScreen(l,gi))};
  s.appendChild(top);
  const wrap=h('<div class="gamewrap"></div>');
  const ins=h(`<div class="instruct"><button class="spk">🔊</button><span>${g.instruct}</span></div>`);
  ins.querySelector('.spk').onclick=()=>speak(ins.querySelector('span').textContent);
  const prog=h('<div class="progress"><i></i></div>');
  const area=h('<div class="area"></div>');
  wrap.append(ins,prog,area);s.appendChild(wrap);
  let wrong=0,started=Date.now();
  const api={
    area, lesson:l, game:g,
    say:t=>speak(t),
    instruct:t=>{ins.querySelector('span').textContent=t},
    progress:(i,n)=>{prog.querySelector('i').style.width=Math.round(100*i/n)+'%'},
    correct:()=>{SFX.ok();feedback(true)},
    wrong:()=>{wrong++;SFX.bad();feedback(false)},
    done:(bonus)=>{const stars=wrong===0?3:wrong<=2?2:1;saveStars(l.id,gi,stars);setTimeout(()=>show(resultScreen(l,gi,stars)),700)}
  };
  setTimeout(()=>speak(g.instruct),400);
  const run=()=>{GAMES[g.kind](api,g)};
  if(g.kind==='storyQuiz') { show(storyScreen(l,()=>{show(s);run()})); return s; }
  run();
  return s;
}

  const s=h('<div class="screen"></div>');s.appendChild(makeScene('sky'));

  const r=h(`<div class="result"><div class="char">${l.emo}</div><div class="rs"></div><h2>${stars===3?'مُمْتاز!':stars===2?'رائِع!':'أَحْسَنْت!'}</h2><p>${msgs[stars-1]}</p></div>`);
  const btns=h('<div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center"></div>');
  const again=h('<button class="cta orange">🔁 أُعيدُ اللُّعْبَة</button>');again.onclick=()=>{SFX.click();show(gameScreen(l,gi))};
  btns.appendChild(again);

GAMES.memory = (api,g)=>{
  const pairs=shuffle(g.pairs).slice(0,6);
  const cards=shuffle(pairs.flatMap((p,i)=>g.mode==='word'?[{i,html:`<div class="e">${p.e}</div>`,say:p.w},{i,html:`<div>${p.w}</div>`,say:p.w}]:[{i,html:`<div class="e">${p.e}</div><div>${p.w}</div>`,say:p.w},{i,html:`<div class="e">${p.e}</div><div>${p.w}</div>`,say:p.w}]));
  const grid=h('<div class="mem" style="grid-template-columns:repeat(4,1fr)"></div>');
  let open=[],lock=false,found=0;
  cards.forEach(c=>{const el=h(`<div class="mcard"><div class="f front">❓</div><div class="f back">${c.html}</div></div>`);
    el.onclick=()=>{if(lock||el.classList.contains('flip'))return;SFX.flip();el.classList.add('flip');api.say(c.say);open.push({el,c});
      if(open.length===2){lock=true;const [a,b]=open;if(a.c.i===b.c.i){found++;api.correct();a.el.classList.add('done');b.el.classList.add('done');open=[];lock=false;api.progress(found,pairs.length);if(found===pairs.length)api.done()}
        else{api.wrong();setTimeout(()=>{a.el.classList.remove('flip');b.el.classList.remove('flip');open=[];lock=false},900)}}};
    grid.appendChild(el)});
  api.area.appendChild(grid);api.progress(0,pairs.length);
};

/* --- الصيد بالسمع (اضغط ما تسمعه) --- */
GAMES.hunt = (api,g)=>{
  const items=shuffle(g.items);let order=shuffle(items),i=0;
  const grid=h('<div class="grid" style="grid-template-columns:repeat(3,minmax(90px,1fr))"></div>');
  const btn=h('<button class="cta blue" style="margin:6px auto">🔊 أَسْتَمِعُ مَرَّةً أُخْرى</button>');
  const ask=()=>{if(i>=order.length){api.done();return}api.progress(i,order.length);api.instruct('أَيْنَ: '+order[i].w+'؟');setTimeout(()=>api.say(order[i].w),300)};
  btn.onclick=ask;
  items.forEach(it=>{const c=h(`<div class="card"><div class="e">${it.e}</div></div>`);
    c.onclick=()=>{if(c.classList.contains('gone'))return;if(it===order[i]){api.correct();c.classList.add('ok');api.say(it.w);setTimeout(()=>{c.classList.add('gone');i++;ask()},700)}else{api.wrong();c.classList.add('bad');setTimeout(()=>c.classList.remove('bad'),500)}};
    grid.appendChild(c)});
  api.area.append(btn,grid);ask();
};

/* --- الاختيار من متعدد (بطاقة/إكمال/شخصيات/سباق/نشيد/صح-خطأ) --- */
GAMES.quiz = (api,g)=>{
  const rounds=g.rounds;let i=0;const box=h('<div></div>');api.area.appendChild(box);
  let track,racer;
  if(g.theme==='race'){track=h(`<div class="track ${g.track||''}"><div class="finish"></div><div class="racer">${g.racer}</div>${g.track==='sea'?'<div class="wave"></div>':''}</div>`);racer=track.querySelector('.racer');racer.style.right='8px';api.area.insertBefore(track,box)}
  const next=()=>{
    if(i>=rounds.length){api.done();return}
    const r=rounds[i];api.progress(i,rounds.length);box.innerHTML='';
    let opts;
    if(g.theme==='fill'){box.appendChild(h(`<div class="prompt"><div class="e">${r.e}</div></div><div class="bigword">${r.word[0]}<span class="blank">؟</span>${r.word[1]}</div>`));opts=r.opts.map(t=>({t}));api.say(r.say)}
    else if(g.theme==='chars'){box.appendChild(h(`<div class="bigword">💬 ${r.q}</div>`));opts=g.chars;api.say(r.q)}
    else if(g.theme==='nasheed'){box.appendChild(h(`<div class="bigword" style="font-size:34px">🎵 ${r.line.replace('____','<span class="blank">؟</span>')}</div>`));opts=r.opts.map(t=>({t}));api.say(r.line.replace('____','...'))}
    else if(r.tf){box.appendChild(h(`<div class="bigword" style="font-size:32px">${r.q}</div>`));opts=[{t:'نَعَمْ',e:'✅'},{t:'لا',e:'❌'}];api.say(r.q)}
    else {if(r.e)box.appendChild(h(`<div class="prompt"><div class="e">${r.e}</div></div>`));box.appendChild(h(`<div class="bigword" style="font-size:${g.theme==='card'?'40px':'30px'}">${r.q||'ما الصَّوْتُ الْأَوَّل؟'}</div>`));opts=(r.opts||[]).map(o=>typeof o==='string'?{t:o}:o);api.say(r.say||r.q)}
    const ol=h('<div class="opts"></div>');
    opts.forEach((o,k)=>{const b=h(`<button class="opt">${o.e?`<span class="e">${o.e}</span>`:''}${o.t?`<span>${o.t}</span>`:''}</button>`);
      b.onclick=()=>{if(b.classList.contains('dim'))return;if(k===r.a){api.correct();b.classList.add('ok');[...ol.children].forEach(x=>x!==b&&x.classList.add('dim'));api.say(o.t||'');
          if(racer){const pct=(i+1)/rounds.length;racer.style.right=`calc(8px + ${pct} * (100% - 100px))`}
          i++;setTimeout(next,1100)}
        else{api.wrong();b.classList.add('bad');setTimeout(()=>b.classList.add('dim'),400)}};
      ol.appendChild(b)});
    box.appendChild(ol);
  };
  next();
};
GAMES.storyQuiz = (api,g)=>{ GAMES.quiz(api,Object.assign({theme:'plain'},g)); };

/* --- ما الذي اختفى --- */
GAMES.missing = (api,g)=>{
  let round=0;const total=g.rounds||4;
  const play=()=>{
    if(round>=total){api.done();return}
    api.progress(round,total);api.area.innerHTML='';
    const items=shuffle(g.items).slice(0,6);const gone=items[Math.floor(Math.random()*items.length)];
    api.instruct('أَنْظُرُ جَيِّدًا... أَحْفَظُ الْأَشْياء 👀');
    const grid=h('<div class="grid" style="grid-template-columns:repeat(3,minmax(90px,1fr))"></div>');
    items.forEach(it=>grid.appendChild(h(`<div class="card"><div class="e">${it.e}</div><div class="w" style="font-size:20px">${it.w}</div></div>`)));
    const cover=h('<div class="bigword" style="font-size:80px;display:none">☁️</div>');
    api.area.append(grid,cover);
    let t=5;const cnt=h('<div class="bigword">٥</div>');api.area.insertBefore(cnt,grid);
    const iv=setInterval(()=>{t--;SFX.tick();cnt.textContent=AR(t);if(t<=0){clearInterval(iv);cnt.remove();grid.style.display='none';cover.style.display='block';SFX.whoosh();
      setTimeout(()=>{cover.style.display='none';grid.style.display='grid';api.instruct('ما الَّذي اخْتَفى؟ أَضْغَطُ الشَّيْءَ الْمَفْقود');api.say('ما الذي اختفى؟');
        [...grid.children].forEach((c,k)=>{if(items[k]===gone){c.querySelector('.e').textContent='❔';c.querySelector('.w').textContent='؟'}});
        const opts=h('<div class="opts"></div>');shuffle(items.slice(0,4).includes(gone)?items.slice(0,4):[gone,...items.filter(x=>x!==gone).slice(0,3)]).forEach(it=>{const b=h(`<button class="opt"><span class="e">${it.e}</span></button>`);b.onclick=()=>{if(it===gone){api.correct();b.classList.add('ok');api.say(it.w);round++;setTimeout(play,1000)}else{api.wrong();b.classList.add('bad')}};opts.appendChild(b)});
        api.area.appendChild(opts)},900)}},1000);
  };play();
};

/* --- التصنيف في صناديق/سلال/غيوم --- */
GAMES.sort = (api,g)=>{

      else{api.wrong();el.classList.add('hot');setTimeout(()=>el.classList.remove('hot'),400);cur.classList.add('bad');setTimeout(()=>cur.classList.remove('bad'),500)}};
    bins.appendChild(el)});

  api.area.append(bins,stage);nextItem();
};

  const cells={};let pos=[...g.start],steps=0;
  rows.forEach((r,y)=>r.forEach((ch,x)=>{const el=h(`<div class="mz ${ch==='#'?'wall':'path'}"></div>`);if(ch==='#')el.textContent=['🌳','🌴','🪨'][(x*3+y)%3];cells[y+','+x]=el;el.onclick=()=>step(y,x);grid.appendChild(el)}));
  cells[g.start.join(',')].textContent=g.walker;cells[g.start.join(',')].classList.add('here');cells[g.end.join(',')].textContent=g.goal;cells[g.end.join(',')].classList.remove('wall');cells[g.end.join(',')].classList.add('path');
  const step=(y,x)=>{const el=cells[y+','+x];const adj=Math.abs(y-pos[0])+Math.abs(x-pos[1])===1;
    if(!adj||el.classList.contains('wall')||el.classList.contains('walked')){api.wrong();el.classList.add('bad');setTimeout(()=>el.classList.remove('bad'),400);return}
    SFX.pop();const old=cells[pos.join(',')];old.classList.remove('here');old.classList.add('walked');old.textContent='👣';pos=[y,x];steps++;api.progress(Math.min(steps,12),12);
    if(y===g.end[0]&&x===g.end[1]){el.textContent='🎉';api.correct();api.say('أحسنت، وصلت إلى المدرسة');setTimeout(api.done,800)}else{el.classList.add('here');el.textContent=g.walker}};
  api.area.appendChild(h('<div class="hint">🏠 مِنَ الْبَيْتِ ← إِلى الْمَدْرَسَة 🏫</div>'));api.area.appendChild(grid);
};

/* --- صيد الكلمات الساقطة --- */
GAMES.catch = (api,g)=>{
  const fa=h('<div class="float-area"></div>');const hud=h('<div class="hud">🎣 <b>0</b> / '+g.goal+'</div>');const tb=h('<div class="timerbar" style="width:100%"></div>');
  api.area.style.overflow='hidden';api.area.append(fa,hud,tb);
  let score=0,alive=true,t=60;const pool=shuffle([...g.good,...g.good,...g.bad,...g.bad]);let pi=0;
  const spawn=()=>{if(!alive)return;const w=pool[pi++%pool.length];const el=h(`<div class="fish">${w}</div>`);if(g.fishless)el.style.setProperty('--x','');el.style.left=(5+Math.random()*60)+'%';el.style.animationDuration=(6+Math.random()*3)+'s';
    el.onclick=()=>{if(!alive||el.classList.contains('caught'))return;if(has(w,g.target)){api.correct();api.say(w);el.classList.add('caught');score++;hud.querySelector('b').textContent=score;api.progress(score,g.goal);if(score>=g.goal){alive=false;setTimeout(api.done,600)}}else{api.wrong();el.classList.add('bad');setTimeout(()=>el.classList.remove('bad'),400)}};
    el.addEventListener('animationend',()=>el.remove());fa.appendChild(el);setTimeout(spawn,1400)};
  spawn();setTimeout(spawn,700);
  const iv=setInterval(()=>{if(!alive){clearInterval(iv);return}t--;tb.style.width=(t/60*100)+'%';if(t<=0){alive=false;clearInterval(iv);api.instruct('اِنْتَهى الْوَقْت! حاوِلْ مَرَّةً أُخْرى');api.say('انتهى الوقت');if(score>=g.goal/2)api.done()}},1000);
  cleanup=()=>{alive=false;clearInterval(iv)};
};

/* --- البالونات --- */
GAMES.pop = (api,g)=>{
  const fa=h('<div class="float-area"></div>');api.area.style.overflow='hidden';api.area.appendChild(fa);
  const goodList=g.target?g.items.filter(w=>has(w,g.target)):g.items;const badList=g.target?g.items.filter(w=>!has(w,g.target)):g.bad;
  const goal=Math.min(goodList.length,10);let score=0,alive=true;
  const hud=h('<div class="hud">🎈 <b>0</b> / '+goal+'</div>');api.area.appendChild(hud);
  const cols=['#d7263d','#1a9e4b','#1b8fd6','#ff8c42','#7b4fd6','#ffb703'];const pool=shuffle([...goodList,...badList,...goodList]);let pi=0;
  const spawn=()=>{if(!alive)return;const w=pool[pi++%pool.length];const el=h(`<div class="balloon">${w}</div>`);el.style.background=cols[pi%cols.length];el.style.left=(5+Math.random()*70)+'%';el.style.animationDuration=(7+Math.random()*4)+'s';
    el.onclick=()=>{if(!alive||el.classList.contains('pop'))return;const ok=g.target?has(w,g.target):goodList.includes(w);if(ok){SFX.pop();api.correct();api.say(w);el.classList.add('pop');score++;hud.querySelector('b').textContent=score;api.progress(score,goal);if(score>=goal){alive=false;setTimeout(api.done,600)}}else{api.wrong();el.classList.add('shake');setTimeout(()=>el.classList.remove('shake'),400)}};
    el.addEventListener('animationend',()=>{if(!el.classList.contains('pop'))el.remove()});fa.appendChild(el);setTimeout(spawn,1500)};
  spawn();setTimeout(spawn,800);cleanup=()=>{alive=false};
};

/* --- الكلمات في المشهد --- */
GAMES.scene = (api,g)=>{
  const items=shuffle(g.items);const need=items.filter(w=>has(w,g.target)).length;let got=0;
  const box=h('<div style="position:relative;min-height:520px;max-width:600px;margin:0 auto"></div>');
  items.forEach((w,k)=>{const el=h(`<div class="sw">${w}</div>`);const col=k%3,row=Math.floor(k/3);el.style.left=(4+col*32+Math.random()*6)+'%';el.style.top=(row*88+Math.random()*20)+'px';el.style.animationDelay=(-k*.4)+'s';
    el.onclick=()=>{if(el.classList.contains('ok'))return;if(has(w,g.target)){api.correct();api.say(w);el.classList.add('ok');el.innerHTML=w.replace(new RegExp(g.target,'g'),`<span style="color:var(--red)">${g.target}</span>`);got++;api.progress(got,need);if(got===need)api.done()}else{api.wrong();el.classList.add('bad');setTimeout(()=>el.classList.remove('bad'),500)}};
    box.appendChild(el)});
  api.area.appendChild(h(`<div class="hint">اِبْحَثْ عَنْ <b style="font-size:30px;color:#ffd23f">${g.target}</b> — ${AR(need)} كَلِمات</div>`));api.area.appendChild(box);api.progress(0,need);
};

/* --- التوصيل بين عمودين --- */
GAMES.pairs = (api,g)=>{
  const pairs=g.pairs;const L=pairs.map((p,i)=>({...p.a,i})),R=shuffle(pairs.map((p,i)=>({...p.b,i})));
  const wrap=h('<div class="pairs"><div class="col"></div><div class="mid"></div><div class="col"></div></div>');
  const [cl,mid,cr]=wrap.children;let sel=null,done=0;
  const mk=(o)=>h(`<div class="pc">${o.e?`<span class="e">${o.e}</span>`:''}${o.t?`<span>${o.t}</span>`:''}</div>`);
  L.forEach(o=>{const el=mk(o);el.onclick=()=>{if(el.classList.contains('done'))return;api.say(o.t||'');[...cl.children].forEach(x=>x.classList.remove('sel'));el.classList.add('sel');sel=o;SFX.click()};cl.appendChild(el);mid.appendChild(h('<div>🔗</div>'))});
  R.forEach(o=>{const el=mk(o);el.onclick=()=>{if(!sel||el.classList.contains('done'))return;api.say(o.t||'');if(o.i===sel.i){api.correct();el.classList.add('done');const le=cl.children[sel.i];le.classList.add('done');le.classList.remove('sel');mid.children[sel.i].classList.add('on');sel=null;done++;api.progress(done,pairs.length);if(done===pairs.length)api.done()}else{api.wrong();el.classList.add('bad');setTimeout(()=>el.classList.remove('bad'),500)}};cr.appendChild(el)});
  api.area.appendChild(wrap);api.progress(0,pairs.length);
};

/* --- تركيب الكلمة من المقاطع --- */
GAMES.build = (api,g)=>{
  const words=g.words;let i=0;
  const next=()=>{if(i>=words.length){api.done();return}api.progress(i,words.length);api.area.innerHTML='';const w=words[i];let pos=0;
    api.area.appendChild(h(`<div class="prompt"><div class="e">${w.e}</div></div>`));
    const slots=h('<div class="slot-row"></div>');w.syl.forEach(()=>slots.appendChild(h('<div class="slot">؟</div>')));
    const chips=h('<div class="chips"></div>');
    shuffle(w.syl.map((s,k)=>({s,k}))).forEach(({s,k})=>{const c=h(`<span class="chip">${s}</span>`);c.onclick=()=>{if(c.classList.contains('used'))return;api.say(s);if(k===pos){SFX.pop();c.classList.add('used');const sl=slots.children[pos];sl.textContent=s;sl.classList.add('filled');pos++;if(pos===w.syl.length){api.correct();api.say(w.w);slots.insertAdjacentHTML('afterend',`<div class="bigword">${w.w}</div>`);i++;setTimeout(next,1300)}}else{api.wrong();c.classList.add('bad');setTimeout(()=>c.classList.remove('bad'),500)}};chips.appendChild(c)});
    api.area.append(slots,chips);api.say(w.w)};
  next();
};

/* --- عجلة المقاطع --- */
GAMES.wheel = (api,g)=>{
  const segs=g.segs,n=segs.length;let rounds=0,total=6,angle=0,busy=false;
  const cols=['#d7263d','#1a9e4b','#1b8fd6','#ff8c42','#7b4fd6','#ffb703'];
  const ww=h(`<div class="wheelwrap"><div class="pointer"></div><div class="wheel"><div class="hub">🎡</div></div></div>`);const wheel=ww.querySelector('.wheel');
  wheel.style.background=`conic-gradient(${segs.map((s,i)=>`${cols[i%cols.length]} ${i*360/n}deg ${(i+1)*360/n}deg`).join(',')})`;
  segs.forEach((s,i)=>{const sp=h(`<span>${s}</span>`);const a=(i+.5)*360/n;sp.style.transform=`rotate(${a-90}deg) translate(60%,-50%) rotate(90deg)`;sp.style.transformOrigin='0 0';sp.style.left='50%';sp.style.top='50%';sp.style.position='absolute';sp.style.transform=`translate(-50%,-50%) rotate(${a}deg) translateY(-95px) rotate(${-a}deg)`;wheel.appendChild(sp)});
  const btn=h('<button class="cta orange">🎡 أُديرُ الْعَجَلَة</button>');const q=h('<div></div>');
  api.area.append(ww,btn,q);api.progress(0,total);
  btn.onclick=()=>{if(busy)return;busy=true;q.innerHTML='';SFX.whoosh();const pick=Math.floor(Math.random()*n);const target=(360*(4+Math.floor(Math.random()*2)))-(pick+.5)*360/n;angle=Math.floor(angle/360)*360+target+360;wheel.style.transform=`rotate(${angle}deg)`;
    setTimeout(()=>{const syl=segs[pick];api.say(syl);const good=shuffle(g.words.filter(w=>w.s===syl))[0];const bads=shuffle(g.words.filter(w=>w.s!==syl&&!w.w.includes(syl))).slice(0,2);const opts=shuffle([good,...bads]);
      q.appendChild(h(`<div class="bigword">أَيْنَ الْمَقْطَعُ <span class="hl">${syl}</span>؟</div>`));const ol=h('<div class="opts"></div>');
      opts.forEach(o=>{const b=h(`<button class="opt"><span class="e">${o.e}</span><span>${o.w}</span></button>`);b.onclick=()=>{if(b.classList.contains('dim'))return;api.say(o.w);if(o===good){api.correct();b.classList.add('ok');[...ol.children].forEach(x=>x!==b&&x.classList.add('dim'));rounds++;api.progress(rounds,total);busy=false;if(rounds>=total)setTimeout(api.done,800);else api.instruct('أَحْسَنْت! أَدِرِ الْعَجَلَةَ مَرَّةً أُخْرى')}else{api.wrong();b.classList.add('bad');b.classList.add('dim')}};ol.appendChild(b)});q.appendChild(ol)},3400)};
};

/* --- الكتابة بالإصبع --- */
GAMES.trace = (api,g)=>{
  let i=0;const shapes=g.shapes;
  const next=()=>{if(i>=shapes.length){api.done();return}api.progress(i,shapes.length);api.area.innerHTML='';const s=shapes[i];api.say(s);
    const tw=h('<div class="tracewrap"><canvas class="bg"></canvas><canvas class="ink"></canvas></div>');api.area.appendChild(tw);
    (document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve()).then(()=>requestAnimationFrame(()=>{
    const [bg,ink]=tw.querySelectorAll('canvas');const size=tw.clientWidth||340;[bg,ink].forEach(c=>{c.width=size;c.height=size});
    const bx=bg.getContext('2d');bx.fillStyle='#e6e0ff';bx.font=`800 ${size*.7}px "Baloo Bhaijaan 2",sans-serif`;bx.textAlign='center';bx.textBaseline='middle';bx.direction='rtl';bx.fillText(s,size/2,size/2);
    const mask=bx.getImageData(0,0,size,size).data;let total=0;for(let p=0;p<mask.length;p+=4)if(mask[p+3]>0)total++;
    bx.strokeStyle='#b8a9ff';bx.setLineDash([8,8]);bx.lineWidth=2;bx.strokeText(s,size/2,size/2);
    const ix=ink.getContext('2d');ix.lineCap='round';ix.lineJoin='round';ix.lineWidth=size*.09;ix.strokeStyle='#d7263d';let drawing=false;
    const pt=e=>{const r=ink.getBoundingClientRect();const t=e.touches?e.touches[0]:e;return[(t.clientX-r.left)*size/r.width,(t.clientY-r.top)*size/r.height]};
    ink.onpointerdown=e=>{drawing=true;const[x,y]=pt(e);ix.beginPath();ix.moveTo(x,y);ink.setPointerCapture(e.pointerId)};
    ink.onpointermove=e=>{if(!drawing)return;const[x,y]=pt(e);ix.lineTo(x,y);ix.stroke()};
    ink.onpointerup=ink.onpointercancel=()=>{drawing=false;check()};
    const check=()=>{const d=ix.getImageData(0,0,size,size).data;let hit=0;for(let p=0;p<mask.length;p+=4)if(mask[p+3]>0&&d[p+3]>0)hit++;const pct=hit/total;api.instruct(`أُمَرِّرُ إِصْبَعي فَوْقَ (${s}) — ${AR(Math.round(pct*100))}٪`);if(pct>.55){api.correct();api.say('أحسنت');i++;setTimeout(next,900)}};
    const clr=h('<button class="cta blue">🧽 أَمْسَحُ وَأُعيد</button>');clr.onclick=()=>ix.clearRect(0,0,size,size);api.area.appendChild(clr);
    api.area.appendChild(h(`<div class="bigword" style="font-size:56px;color:var(--red)">${s}</div>`))}))};
  next();
};

/* --- تلوين علم عُمان --- */
GAMES.flag = (api,g)=>{
  const cols={green:'#1a9e4b',red:'#d7263d',white:'#ffffff'};let sel='red',done={};
  const pal=h('<div class="pal"></div>');Object.entries(cols).forEach(([k,v])=>{const d=h('<div></div>');d.style.background=v;if(k===sel)d.classList.add('sel');d.onclick=()=>{sel=k;[...pal.children].forEach(x=>x.classList.remove('sel'));d.classList.add('sel');SFX.click();api.say({green:'أخضر',red:'أحمر',white:'أبيض'}[k])};pal.appendChild(d)});
  const fw=h(`<div class="flagwrap"><svg viewBox="0 0 600 300" xmlns="http://www.w3.org/2000/svg"><rect id="z-top" x="150" y="0" width="450" height="100" fill="#e8e8e8" stroke="#999" stroke-width="2"/><rect id="z-mid" x="150" y="100" width="450" height="100" fill="#e8e8e8" stroke="#999" stroke-width="2"/><rect id="z-bot" x="150" y="200" width="450" height="100" fill="#e8e8e8" stroke="#999" stroke-width="2"/><rect id="z-side" x="0" y="0" width="150" height="300" fill="#e8e8e8" stroke="#999" stroke-width="2"/><g pointer-events="none" fill="none" stroke="#fff" stroke-width="5"><path d="M45 40 l60 60 M105 40 l-60 60"/><path d="M75 30 v75 M60 105 h30"/><rect x="65" y="60" width="20" height="14" fill="#fff"/></g></svg></div>`);
  const want={'z-top':'white','z-mid':'red','z-bot':'green','z-side':'red'};
  Object.keys(want).forEach(id=>{const el=fw.querySelector('#'+id);el.onclick=()=>{if(done[id])return;if(sel===want[id]){el.setAttribute('fill',cols[sel]);done[id]=1;api.correct();const n=Object.keys(done).length;api.progress(n,4);if(n===4){api.say('أحسنت، هذا علم عُمان');setTimeout(api.done,900)}}else{api.wrong();el.setAttribute('fill','#ffb3b3');setTimeout(()=>el.setAttribute('fill','#e8e8e8'),400)}}});
  api.area.appendChild(h('<div class="bigword" style="font-size:30px">🇴🇲 أُلَوِّنُ عَلَمَ عُمانَ بِـ: <span style="color:#1a9e4b">الْأَخْضَر</span> <span style="color:#d7263d">الْأَحْمَر</span> الْأَبْيَض</div>'));
  api.area.append(pal,fw);api.progress(0,4);
};

/* ===================== التشغيل ===================== */
document.addEventListener('touchstart',()=>{},{passive:true});
show(homeScreen());
</script>
<script>window.__NAV={"pre": [], "levels": ["button.lesson-card", "button.stage"]}</script><script>(function(){var N=window.__NAV,q=new URLSearchParams(location.search).get("go");if(!N||!q)return;
var P=q.split(".").map(Number);if(P.some(isNaN))return;
var steps=(N.pre||[]).map(function(p){return{sel:p.sel,idx:p.idx||0}}).concat(P.map(function(v,i){return{sel:N.levels[i],idx:v}}));
function vis(e){var r=e.getBoundingClientRect(),c=getComputedStyle(e);return r.width>4&&r.height>4&&c.visibility!=="hidden"&&c.display!=="none"}
function run(i){if(i>=steps.length)return;var s=steps[i],t=0;(function w(){var l=[].filter.call(document.querySelectorAll(s.sel),vis);
if(l.length>s.idx){l[s.idx].scrollIntoView({block:"center"});l[s.idx].click();setTimeout(function(){run(i+1)},700)}else if(t++<48)setTimeout(w,250)})()}
function go(){setTimeout(function(){run(0)},900)}if(document.readyState==="complete")go();else addEventListener("load",go)})();</script>
