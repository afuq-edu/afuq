<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>ديني حياتي الصف الأول</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Baloo+Bhaijaan+2:wght@400;600;700;800&display=swap">
<style>:root{
  --ink:#1F3B57; --ink2:#46627D; --sky:#CDEFFB; --sky2:#EFFAFE; --teal:#13A39A; --teal2:#D3F3EF;
  --rasp:#E0457B; --rasp2:#FCE1EA; --sun:#FFC83D; --sun2:#FFF1C7; --grass:#6BBF47; --grass2:#E3F5D8;
  --paper:#FFFFFF; --soft:#F2F8FB; --ok:#1FAF62; --bad:#E5484D; --sand:#F6E6C4;
  --u:var(--teal); --u2:var(--teal2);
  --r:18px; --bd:3px solid var(--ink); --sh:0 5px 0 var(--ink);
  --f:'Baloo Bhaijaan 2','Segoe UI',Tahoma,Arial,sans-serif;
  --q:'Amiri Quran','Amiri','Traditional Arabic','Times New Roman',serif;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--sky2);color:var(--ink);font-family:var(--f);font-size:19px;line-height:1.55;overflow:hidden}
button{font-family:inherit;color:inherit;cursor:pointer}
#app{height:100%;display:flex;flex-direction:column;direction:rtl}
.bar{flex:none;display:flex;align-items:center;gap:10px;padding:8px 14px;background:var(--paper);border-bottom:var(--bd);z-index:5}
.bar-title{flex:1;font-weight:800;font-size:19px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ibtn{width:44px;height:44px;border-radius:14px;border:var(--bd);background:var(--sun2);box-shadow:0 3px 0 var(--ink);font-size:21px;display:grid;place-items:center;padding:0;flex:none}
.ibtn:active{transform:translateY(3px);box-shadow:none}
.starpill{font-weight:800;background:var(--sun);border:var(--bd);border-radius:99px;padding:2px 12px;font-variant-numeric:tabular-nums;white-space:nowrap}
#view{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;position:relative}
.wrap{max-width:1040px;margin:0 auto;padding-inline:16px;padding-block:14px 40px}

/* buttons */
.btn{border:var(--bd);border-radius:16px;background:var(--sun);box-shadow:var(--sh);font-weight:800;font-size:19px;padding:10px 20px;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;transition:transform .08s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.btn.teal{background:var(--teal);color:#fff}.btn.rasp{background:var(--rasp);color:#fff}.btn.white{background:#fff}.btn.green{background:var(--ok);color:#fff}
.btn:disabled{opacity:.45;pointer-events:none}
.spk{border:2px solid var(--ink);background:#fff;border-radius:99px;width:38px;height:38px;font-size:18px;display:inline-grid;place-items:center;padding:0;vertical-align:middle;margin-inline-start:6px;box-shadow:0 2px 0 var(--ink);flex:none}
.spk:active{transform:translateY(2px);box-shadow:none}

/* home */
.hero{position:relative;background:linear-gradient(180deg,#9FDDF5 0%,var(--sky) 60%,var(--sky2) 100%);padding:26px 16px 70px;text-align:center;overflow:hidden;border-bottom:var(--bd)}
.hero h1{font-size:clamp(46px,11vw,86px);line-height:1;margin:6px 0 4px;color:var(--rasp);-webkit-text-stroke:2px var(--ink);text-shadow:0 6px 0 var(--ink);font-weight:800;letter-spacing:0}
.hero p,.hero h1{position:relative;z-index:1}.hero p{margin:4px 0;font-weight:700;font-size:20px}
.hero .sub{font-size:16px;font-weight:600;color:var(--ink2)}
.sunball{position:absolute;top:16px;left:22px;width:70px;height:70px;border-radius:50%;background:var(--sun);border:var(--bd);box-shadow:0 0 0 10px rgba(255,200,61,.35);animation:spin 18s linear infinite}
.cloud{position:absolute;z-index:0;opacity:.9;background:#fff;border:var(--bd);border-radius:99px;height:30px;animation:drift 26s linear infinite}
.cloud::before{content:"";position:absolute;width:44%;height:150%;background:#fff;border:var(--bd);border-bottom:none;border-radius:99px 99px 0 0;top:-60%;left:22%}
.hill{position:absolute;bottom:-40px;left:-10%;right:-10%;height:90px;background:var(--grass);border-top:var(--bd);border-radius:50% 50% 0 0}
.mosque-row{position:absolute;bottom:26px;right:8%;font-size:46px;line-height:1}
@keyframes drift{from{transform:translateX(-120px)}to{transform:translateX(110vw)}}
@keyframes spin{to{transform:rotate(360deg)}}
.unit{margin-top:22px}
.unit h2{display:flex;align-items:center;gap:10px;font-size:25px;margin:0 0 12px}
.unit h2 .tag{background:var(--u);color:#fff;border:var(--bd);border-radius:12px;padding:0 12px;font-size:18px}
.lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.lcard{position:relative;border:var(--bd);border-radius:var(--r);background:#fff;box-shadow:var(--sh);padding:12px 10px 10px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px;transition:transform .12s}
.lcard:hover{transform:translateY(-3px) rotate(-1deg)}
.lcard:active{transform:translateY(3px);box-shadow:0 2px 0 var(--ink)}
.lnum{position:absolute;top:-12px;right:-8px;width:36px;height:36px;border-radius:50%;background:var(--u);color:#fff;border:var(--bd);display:grid;place-items:center;font-weight:800;font-size:18px}
.lart{font-size:50px;line-height:1.2;height:66px;display:grid;place-items:center;width:100%;background:var(--u2);border-radius:12px;border:2px dashed var(--u)}
.ltitle{font-weight:800;font-size:18px;line-height:1.3;min-height:47px;display:grid;place-items:center}
.dots{display:flex;gap:5px}
.dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--ink);background:#fff}
.dots i.on{background:var(--sun)}
.u1{--u:var(--teal);--u2:var(--teal2)} .u2{--u:var(--rasp);--u2:var(--rasp2)}
.homefoot{margin-top:26px;text-align:center;color:var(--ink2);font-size:15px}

/* lesson page */
.lhead{display:flex;align-items:center;gap:16px;background:var(--u2);border:var(--bd);border-radius:22px;padding:14px 16px;box-shadow:var(--sh)}
.lhead .big{font-size:64px;line-height:1;flex:none}
.lhead h1{margin:0;font-size:clamp(26px,6vw,38px);line-height:1.2}
.lhead p{margin:2px 0 0;font-weight:700;color:var(--ink2)}
.path{position:relative;display:grid;gap:18px;margin-top:22px}
.station{display:flex;align-items:center;gap:14px;border:var(--bd);border-radius:20px;background:#fff;box-shadow:var(--sh);padding:12px 14px;text-align:start;width:100%}
.station:active{transform:translateY(3px);box-shadow:0 2px 0 var(--ink)}
.station .ico{width:64px;height:64px;border-radius:18px;border:var(--bd);display:grid;place-items:center;font-size:34px;flex:none}
.station .k{font-size:15px;font-weight:800;color:var(--ink2)}
.station .n{font-size:22px;font-weight:800;line-height:1.25}
.station .d{font-size:15px;color:var(--ink2);font-weight:600}
.station .st{margin-inline-start:auto;font-size:20px;white-space:nowrap;letter-spacing:-2px}
.station .stepn{position:absolute;margin-top:-58px;margin-inline-start:-8px;width:28px;height:28px;border-radius:50%;background:var(--ink);color:#fff;font-size:15px;display:grid;place-items:center;font-weight:800}
.s-pre .ico{background:var(--sun2)} .s-pres .ico{background:var(--teal2)} .s-game .ico{background:var(--rasp2)} .s-post .ico{background:var(--grass2)}
@media (min-width:760px){.path{grid-template-columns:1fr 1fr}}

/* slides */
.deck{max-width:980px;margin:0 auto;padding-inline:16px;padding-block:12px 20px;display:flex;flex-direction:column;min-height:100%}
.slide{flex:1;border:var(--bd);border-radius:24px;background:#fff;box-shadow:var(--sh);padding:18px 18px 22px;position:relative;animation:slin .35s ease both;min-height:420px;display:flex;flex-direction:column}
@keyframes slin{from{opacity:.2;transform:translateX(-24px)}to{opacity:1;transform:none}}
.slide h2{margin:0 0 12px;font-size:clamp(24px,5.4vw,34px);line-height:1.25;display:flex;align-items:center;gap:8px;flex-wrap:wrap;text-wrap:balance}
.slide h2 .lbl{font-size:15px;background:var(--u);color:#fff;border-radius:10px;padding:2px 10px;border:2px solid var(--ink)}
.deck-nav{display:flex;align-items:center;gap:10px;margin-top:10px;position:sticky;bottom:0;background:var(--sky2);padding-block:8px;z-index:4}
.deck-nav .pdots{flex:1;display:flex;justify-content:center;gap:6px;flex-wrap:wrap}
.deck-nav .pdots{gap:4px}.pdots i{width:10px;height:10px;border-radius:50%;background:#fff;border:2px solid var(--ink)}
.pdots i.on{background:var(--u);transform:scale(1.25)}
.cover{align-items:center;justify-content:center;text-align:center;background:radial-gradient(circle at 50% 30%,var(--u2),#fff 70%)}
.cover .art{font-size:110px;line-height:1.1;animation:bob 3s ease-in-out infinite}
.cover h1{font-size:clamp(34px,8vw,58px);margin:10px 0 0;line-height:1.2}
.cover p{font-size:20px;font-weight:700;color:var(--ink2);margin:6px 0}
@keyframes bob{50%{transform:translateY(-10px)}}
.flipgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.fcard{perspective:900px;border:none;background:none;padding:0;min-height:150px;text-align:center}
.fcard .in{position:relative;width:100%;height:100%;min-height:150px;transition:transform .5s;transform-style:preserve-3d}
.fcard.open .in{transform:rotateY(180deg)}
.fcard .fa,.fcard .fb{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border:var(--bd);border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px;gap:4px}
.fcard .fa{background:var(--u);color:#fff;font-weight:800;font-size:21px}
.fcard .fa .e{font-size:48px;line-height:1.1}
.fcard .fb{background:var(--sun2);transform:rotateY(180deg);font-weight:700;font-size:19px}
.fcard .fb .e{font-size:40px;line-height:1.1}
.tap-hint{font-size:14px;font-weight:700;color:var(--ink2);text-align:center;margin-top:6px}
.qbox{font-family:var(--q);font-size:clamp(26px,6vw,40px);line-height:2.2;text-align:center;background:var(--sun2);border:var(--bd);border-radius:20px;padding:12px 14px;direction:rtl}
.qbox .v{cursor:pointer;border-radius:12px;padding:0 4px;transition:background .2s}
.qbox .v.hl{background:var(--sun);box-shadow:0 0 0 3px var(--sun)}
.qbox .n{font-family:var(--q);color:var(--teal);font-size:.8em}
.qmeta{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:10px}
.pill{border:2px solid var(--ink);border-radius:99px;padding:2px 12px;background:#fff;font-weight:800;font-size:16px}
.vmean{margin-top:10px;min-height:54px;text-align:center;font-weight:700;font-size:20px;background:var(--teal2);border:2px dashed var(--teal);border-radius:14px;padding:8px}
.hadith{font-size:clamp(22px,5vw,30px);font-weight:700;line-height:1.9;text-align:center;background:var(--rasp2);border:var(--bd);border-radius:20px;padding:16px}
.hadith .src{display:block;font-size:14px;font-weight:600;color:var(--ink2);margin-top:6px}
.words{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:12px}
.comic{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}
.panel{border:var(--bd);border-radius:18px;background:var(--soft);padding:10px;min-height:190px;position:relative;opacity:.25;transition:opacity .3s}
.panel.on{opacity:1;background:linear-gradient(180deg,var(--sky2),#fff)}
.panel .cast{display:flex;justify-content:space-around;align-items:flex-end;gap:6px;min-height:110px;font-size:52px}
.bub{position:relative;background:#fff;border:2px solid var(--ink);border-radius:16px;padding:6px 12px;font-weight:700;font-size:17px;margin:6px 0;line-height:1.55}
.bub b{color:var(--rasp)}
.bub.hid{visibility:hidden}
.bub.pop{animation:pop .3s ease}
@keyframes pop{0%{transform:scale(.6)}70%{transform:scale(1.06)}100%{transform:scale(1)}}
.narr{background:var(--sun2);border:2px solid var(--ink);border-radius:14px;padding:8px 12px;font-weight:700;margin-bottom:10px}
.plist{display:grid;gap:12px}
.pitem{display:flex;align-items:center;gap:12px;border:var(--bd);border-radius:16px;padding:10px 12px;background:#fff;text-align:start;font-weight:700;font-size:20px;width:100%}
.pitem .e{font-size:40px;flex:none;width:56px;text-align:center}
.pitem.hide .t{filter:blur(7px);opacity:.5}
.pitem.hide::after{content:"اضغط";font-size:14px;background:var(--sun);border:2px solid var(--ink);border-radius:99px;padding:0 10px;margin-inline-start:auto}
.valuebox{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px}
.valuebox .art{font-size:90px;line-height:1.1}
.valuebox .t{font-size:clamp(24px,5.6vw,36px);font-weight:800;background:var(--grass2);border:var(--bd);border-radius:20px;padding:14px 18px;line-height:1.5}
.qa{display:grid;gap:10px}
.qa button{text-align:start;border:var(--bd);border-radius:16px;background:#fff;padding:10px 14px;font-weight:700;font-size:19px}
.qa .a{display:none;margin-top:6px;color:var(--teal);font-weight:800}
.qa .open .a{display:block}
.nas{display:grid;gap:10px}
.nas button{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;border:var(--bd);border-radius:16px;background:#fff;padding:10px;font-weight:800;font-size:clamp(18px,4.4vw,24px)}
.nas button.hl{background:var(--sun2)}
.nas .sep{color:var(--rasp)}

/* activity */
.act{max-width:1000px;margin:0 auto;padding-inline:16px;padding-block:10px 30px}
.act-head{display:flex;flex-direction:column;gap:6px;margin-bottom:10px}
.kind{align-self:flex-start;border:2px solid var(--ink);border-radius:99px;padding:0 12px;font-weight:800;font-size:15px;background:var(--sun2)}
.kind.game{background:var(--rasp2)} .kind.post{background:var(--grass2)}
.act-head h2{margin:0;font-size:clamp(24px,5.4vw,32px);line-height:1.2}
.instr{margin:0;display:flex;align-items:center;gap:6px;font-weight:700;font-size:19px;background:#fff;border:2px solid var(--ink);border-radius:14px;padding:6px 10px}
.instr span{flex:1}
.hud{display:flex;gap:10px;align-items:center;justify-content:space-between;font-weight:800;margin-bottom:8px;flex-wrap:wrap}
.hud .h{background:#fff;border:2px solid var(--ink);border-radius:99px;padding:2px 12px;font-variant-numeric:tabular-nums}
.stage{position:relative}
.area{position:relative;width:100%;border:var(--bd);border-radius:20px;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;background:var(--sky)}
.chips{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.chip{border:var(--bd);border-radius:14px;background:#fff;box-shadow:0 4px 0 var(--ink);font-weight:800;font-size:19px;padding:8px 14px;min-height:50px;touch-action:none;user-select:none;-webkit-user-select:none}
.chip:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.chip.sel{background:var(--sun);transform:translateY(-3px)}
.chip.used{opacity:.3;pointer-events:none}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.good{background:#C9F2D9!important;border-color:var(--ok)!important}
.wrong{background:#FFD8D9!important}
.center{display:flex;justify-content:center;align-items:center;gap:12px;flex-wrap:wrap}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:12px}
.opt{border:var(--bd);border-radius:18px;background:#fff;box-shadow:var(--sh);padding:12px;font-weight:800;font-size:21px;display:flex;flex-direction:column;align-items:center;gap:4px}
.opt .e{font-size:46px;line-height:1.1}
.opt:active{transform:translateY(3px);box-shadow:0 2px 0 var(--ink)}
.floatmsg{position:absolute;z-index:30;pointer-events:none;font-weight:800;font-size:18px;background:#fff;border:2px solid var(--ink);border-radius:12px;padding:2px 10px;animation:up 1.1s ease forwards;white-space:nowrap}
@keyframes up{to{transform:translateY(-50px);opacity:0}}

/* overlay/result */
#overlay{position:fixed;inset:0;background:rgba(31,59,87,.55);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
#overlay.on{display:flex}
.modal{background:#fff;border:var(--bd);border-radius:26px;box-shadow:0 8px 0 var(--ink);padding:22px 18px;max-width:440px;width:100%;text-align:center;animation:pop .35s ease}
.modal h3{margin:0;font-size:30px}
.modal .big{font-size:70px;line-height:1.1}
.bigstars{font-size:52px;letter-spacing:4px;margin:6px 0}
.bigstars span{display:inline-block;animation:starin .5s ease both}
.bigstars span.off{filter:grayscale(1);opacity:.3}
@keyframes starin{from{transform:scale(0) rotate(-90deg)}to{transform:none}}
.modal .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:60}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(140px);background:var(--ink);color:#fff;border-radius:16px;padding:10px 18px;font-weight:700;z-index:70;transition:transform .3s;max-width:90vw;text-align:center;direction:rtl}
#toast.on{transform:translateX(-50%) translateY(0)}
@media (max-width:520px){body{font-size:18px}.lgrid{grid-template-columns:1fr 1fr}.lart{font-size:42px;height:58px}.station .ico{width:54px;height:54px;font-size:28px}.station .n{font-size:20px}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
:focus-visible{outline:4px solid var(--sun);outline-offset:2px}
</style>
<div id="app" dir="rtl" lang="ar"><header class="bar"><button id="backBtn" class="ibtn" aria-label="رجوع">➜</button><div class="bar-title" id="barTitle">ديني حياتي</div><span class="starpill" id="starCount">⭐ ٠</span><button id="muteBtn" class="ibtn" aria-label="الصوت">🔊</button></header><main id="view"></main></div>

<script>'use strict';
/* ========== utilities ========== */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const rand=(a,b)=>a+Math.random()*(b-a), ri=(a,b)=>Math.floor(rand(a,b+1));
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const AR=n=>String(n).replace(/\d/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const strip=s=>String(s).replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim();
function html(s){const t=document.createElement('template');t.innerHTML=s.trim();return t.content.firstElementChild}
function flash(el,cls='shake'){if(!el)return;el.classList.remove(cls);void el.offsetWidth;el.classList.add(cls);setTimeout(()=>el.classList.remove(cls),450)}
function floatMsg(parent,x,y,text){const m=html(`<div class="floatmsg">${text}</div>`);m.style.left=x+'px';m.style.top=y+'px';parent.appendChild(m);setTimeout(()=>m.remove(),1150)}

/* ========== storage ========== */
const Store={k:'dh1-progress-v1',d:{},
  load(){try{this.d=JSON.parse(localStorage.getItem(this.k)||'{}')||{}}catch(e){this.d={}}},
  save(){try{localStorage.setItem(this.k,JSON.stringify(this.d))}catch(e){}},
  get(l,k){return (this.d[l]||{})[k]||0},
  set(l,k,v){this.d[l]=this.d[l]||{};if(v>(this.d[l][k]||0)){this.d[l][k]=v;this.save()}},
  total(){let t=0;for(const l in this.d){if(l==='_')continue;for(const k in this.d[l])if(k!=='pres')t+=+this.d[l][k]||0}return t}
};
function addCSS(s){const e=document.createElement('style');e.textContent=s;document.head.appendChild(e)}
function sizeByWidth(area,sel='[data-s]'){const f=()=>{const w=area.clientWidth;$$(sel,area).forEach(e=>e.style.fontSize=(w*(+e.dataset.s)/100)+'px')};f();Scope.on(window,'resize',f);return f}

/* ========== sound (Web Audio, no files) ========== */
const Snd={ctx:null,on:true,
  init(){try{if(!this.ctx)this.ctx=new (window.AudioContext||window.webkitAudioContext)();if(this.ctx.state==='suspended')this.ctx.resume()}catch(e){}},
  tone(f,d=.15,type='sine',v=.18,t0=0,f2){if(!this.on||!this.ctx)return;const c=this.ctx,t=c.currentTime+t0,o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.015);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+d+.05)},
  noise(d=.2,v=.2,t0=0,f1=2000,f2=400){if(!this.on||!this.ctx)return;const c=this.ctx,t=c.currentTime+t0,n=Math.floor(c.sampleRate*d),b=c.createBuffer(1,n,c.sampleRate),a=b.getChannelData(0);for(let i=0;i<n;i++)a[i]=Math.random()*2-1;const s=c.createBufferSource();s.buffer=b;const fl=c.createBiquadFilter();fl.type='bandpass';fl.Q.value=1.2;fl.frequency.setValueAtTime(f1,t);fl.frequency.exponentialRampToValueAtTime(f2,t+d);const g=c.createGain();g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(fl);fl.connect(g);g.connect(c.destination);s.start(t);s.stop(t+d)}
};

const TTS={ok:'speechSynthesis' in window,voice:null,
  pick(){if(!this.ok)return;const vs=speechSynthesis.getVoices()||[];this.voice=vs.find(v=>/^ar[-_]?(SA|OM|AE)?/i.test(v.lang))||vs.find(v=>/^ar/i.test(v.lang))||null},
  say(t,manual){if(!Snd.on||!t)return;if(!this.ok){if(manual)toast('القراءة الصوتية غير متاحة في هذا المتصفح');return}this.pick();if(!this.voice){if(manual)toast('لا يوجد صوت عربي مثبّت في هذا الجهاز، اطلب من معلمك القراءة');return}
    try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(strip(t).replace(/ﷺ/g,' صلى الله عليه وسلم ').replace(/[﴿﴾«»]/g,''));u.voice=this.voice;u.lang=this.voice.lang;u.rate=.82;u.pitch=1.05;speechSynthesis.speak(u)}catch(e){}},
  stop(){try{this.ok&&speechSynthesis.cancel()}catch(e){}}
};

let toastT;

function confetti(){const c=$('#confetti'),x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;const cols=['#FFC83D','#E0457B','#13A39A','#6BBF47','#5AB8E8','#fff'];
  const P=Array.from({length:130},()=>({x:rand(0,c.width),y:rand(-c.height*.6,-10),vx:rand(-2,2),vy:rand(2,6),s:rand(6,12),r:rand(0,6),vr:rand(-.2,.2),c:cols[ri(0,5)]}));
  let t=0;(function f(){x.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);x.restore()});if(++t<150)requestAnimationFrame(f);else x.clearRect(0,0,c.width,c.height)})()}

/* ========== pointer drag helper ========== */
function dragify(el,{onDrop,onMove,onStart,axis}={}){
  el.style.touchAction='none';
  let sx,sy,dx=0,dy=0,active=false,id;
  el.addEventListener('pointerdown',e=>{if(e.button>0)return;active=true;id=e.pointerId;sx=e.clientX;sy=e.clientY;dx=dy=0;try{el.setPointerCapture(id)}catch(_){}el.style.transition='none';el.style.zIndex=40;el.classList.add('dragging');onStart&&onStart(e);e.preventDefault()});
  el.addEventListener('pointermove',e=>{if(!active||e.pointerId!==id)return;dx=axis==='y'?0:e.clientX-sx;dy=axis==='x'?0:e.clientY-sy;el.style.transform=`translate(${dx}px,${dy}px)`;onMove&&onMove(e,dx,dy)});
  const end=e=>{if(!active||e.pointerId!==id)return;active=false;el.classList.remove('dragging');
    el.style.visibility='hidden';const under=document.elementFromPoint(e.clientX,e.clientY);el.style.visibility='';
    const back=()=>{el.style.transition='transform .25s';el.style.transform='';setTimeout(()=>{el.style.zIndex=''},260)};
    const moved=Math.hypot(dx,dy)>8;
    const r=onDrop?onDrop(under,e,{dx,dy,moved,back}):false;if(r!=='keep'&&!r)back();};
  el.addEventListener('pointerup',end);el.addEventListener('pointercancel',end);
}

let cleanup=null, curBack=null;
const Scope={t:[],i:[],r:[],l:[],
  after(f,ms){const id=setTimeout(f,ms);this.t.push(id);return id},
  every(f,ms){const id=setInterval(f,ms);this.i.push(id);return id},
  loop(f){let on=true,last=performance.now();const s={stop(){on=false}};const g=now=>{if(!on)return;const dt=Math.min(50,now-last)/16.67;last=now;f(dt,now);if(on)requestAnimationFrame(g)};requestAnimationFrame(g);this.r.push(s);return s},
  on(t,ev,f,o){t.addEventListener(ev,f,o);this.l.push([t,ev,f,o])},
  clear(){this.t.forEach(clearTimeout);this.i.forEach(clearInterval);this.r.forEach(s=>s.stop());this.l.forEach(([t,e,f,o])=>t.removeEventListener(e,f,o));this.t=[];this.i=[];this.r=[];this.l=[]}
};

/* ========== slides ========== */
function goSlides(id,start=0){leave();const l=L(id);setBar('العرض · '+l.title,()=>goLesson(id));
  let i=start;const n=l.slides.length;
  const v=view();v.innerHTML=`<div class="deck u${l.unit}"><div class="slide" id="sl"></div><div class="deck-nav"><button class="btn white" id="prv" aria-label="السابق">→</button><div class="pdots">${l.slides.map(()=>'<i></i>').join('')}</div><button class="btn teal" id="nxt">التالي ←</button></div></div>`;
  const show=()=>{TTS.stop();const s=l.slides[i],box=$('#sl');box.className='slide'+(s.t==='cover'?' cover':'');box.innerHTML=renderSlide(s,l);void box.offsetWidth;box.style.animation='none';void box.offsetWidth;box.style.animation='';wireSlide(s,box);
    $$('.pdots i').forEach((d,j)=>d.classList.toggle('on',j===i));$('#prv').disabled=i===0;$('#nxt').innerHTML=i===n-1?'أنهيت العرض ✓':'التالي ←';};
  $('#prv').onclick=()=>{if(i>0){i--;sfx.flip();show()}};
  $('#nxt').onclick=()=>{if(i<n-1){i++;sfx.flip();show()}else{Store.set(id,'pres',1);sfx.win();confetti();resultModal({title:'أحسنت!',big:'📺',msg:'أنهيت العرض التقديمي للدرس',stars:0,retry:()=>goSlides(id),next:nextOf(id,'pres')})}};
  let tx=null;Scope.on(v,'touchstart',e=>{tx=e.touches[0].clientX},{passive:true});
  Scope.on(v,'touchend',e=>{if(tx==null)return;const d=e.changedTouches[0].clientX-tx;tx=null;if(Math.abs(d)>70&&!e.target.closest('.area')){d>0?$('#nxt').click():$('#prv').click()}},{passive:true});
  Scope.on(document,'keydown',e=>{if(e.key==='ArrowLeft')$('#nxt').click();if(e.key==='ArrowRight')$('#prv').click()});
  show();
}
function renderSlide(s,l){
  const H=(t,lbl)=>`<h2>${lbl?`<span class="lbl">${lbl}</span>`:''}${t}${s.say!==false?spk(t):''}</h2>`;
  switch(s.t){
  case 'cover':return `<div class="art">${s.art}</div><h1>${s.title}</h1>${s.sub?`<p>${s.sub}</p>`:''}<p style="font-size:16px">اضغط «التالي» لنبدأ الدرس</p>`;
  case 'flip':return H(s.title,s.lbl)+(s.intro?`<p style="margin:0 0 10px;font-weight:700">${s.intro}</p>`:'')+`<div class="flipgrid">${s.cards.map(c=>`<button class="fcard"><div class="in"><div class="fa"><span class="e">${c.fe||'❓'}</span>${c.f}</div><div class="fb"><span class="e">${c.be||''}</span>${c.b}</div></div></button>`).join('')}</div><p class="tap-hint">اضغط على كل بطاقة لتقلبها</p>`;
  case 'points':return H(s.title,s.lbl)+(s.intro?`<div class="narr">${s.intro}</div>`:'')+`<div class="plist">${s.items.map(p=>`<button class="pitem ${s.reveal===false?'':'hide'}"><span class="e">${p.e}</span><span class="t">${p.t}</span></button>`).join('')}</div>`+(s.outro?`<div class="narr" style="margin-top:12px">${s.outro}</div>`:'');
  case 'quran':return `<h2>${s.lbl?`<span class="lbl">${s.lbl}</span>`:''}${s.title}</h2>`+(s.meta?`<div class="qmeta">${s.meta.map(m=>`<span class="pill">${m}</span>`).join('')}</div>`:'')+`<div class="qbox">${s.basmala?'<div>بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ</div>':''}${s.verses.map((v,j)=>`<span class="v" data-j="${j}">${v}</span> <span class="n">﴿${AR(s.nums?s.nums[j]:j+1)}﴾</span> `).join('')}</div><div class="vmean" id="vm">${s.hint||'اضغط على الآية لتظهر فكرتها ✨'}</div><p class="tap-hint">نستمع إلى التلاوة من المعلم ونردد معه</p>`;
  case 'hadith':return H(s.title,s.lbl)+`<div class="hadith">${s.intro?`<div style="font-size:.75em">${s.intro}</div>`:''}${s.text}<span class="src">${s.src||''}</span></div>`+(s.words?`<div class="words">${s.words.map(w=>`<button class="chip" data-m="${esc(w.m)}">${w.w}</button>`).join('')}</div><div class="vmean" id="vm">اضغط على الكلمة لتعرف معناها</div>`:'')+(s.art?`<div style="text-align:center;font-size:60px;margin-top:10px">${s.art}</div>`:'');
  case 'comic':return H(s.title,s.lbl)+(s.narr?`<div class="narr">${s.narr}</div>`:'')+`<div class="comic">${s.panels.map(p=>`<div class="panel"><div class="cast">${p.cast}</div>${p.lines.map(ln=>`<div class="bub hid"><b>${ln[0]}:</b> ${ln[1]}</div>`).join('')}</div>`).join('')}</div><div class="center" style="margin-top:12px"><button class="btn rasp" id="cnext">▶ أكمل القصة</button></div>`;
  case 'qa':return H(s.title,s.lbl)+(s.art?`<div class="center" style="margin-bottom:12px;font-size:60px">${s.art}</div>`:'')+`<div class="qa">${s.items.map(q=>`<button><div>❓ ${q.q}</div><div class="a">✔ ${q.a}</div></button>`).join('')}</div><p class="tap-hint">فكّر في الإجابة، ثم اضغط على السؤال لتتأكد</p>`;
  case 'nasheed':return H(s.title,s.lbl)+`<div class="nas">${s.lines.map(ln=>`<button data-say="${esc(ln[0]+' '+ln[1])}"><span>${ln[0]}</span><span class="sep">✦</span><span>${ln[1]}</span></button>`).join('')}</div><p class="tap-hint">${s.poet||''} · اضغط على البيت لتسمعه وتردده</p>`;
  case 'value':return `<div class="valuebox"><div class="art">${s.art}</div><div class="t">${s.text}</div>${spk(s.text)}</div>`;
  case 'html':return H(s.title,s.lbl)+s.html;

function goAct(id,k){leave();const l=L(id),c=l[k];setBar(KIND[k].k+' · '+l.title,()=>goLesson(id));
  const v=view();v.innerHTML=`<div class="act u${l.unit}"><div class="act-head"><span class="kind ${k}">${KIND[k].k} · ${c.name}</span><h2>${c.title}</h2><p class="instr"><span>${c.instr}</span>${spk(c.instr)}</p></div><div class="hud" id="hud"></div><div class="stage" id="stage"></div></div>`;
  const stage=$('#stage');let finished=false;
  const api={stage,l,
    hud(h){$('#hud').innerHTML=h},
    done(score,max,starsOverride){if(finished)return;finished=true;const r=max?score/max:1;let s=starsOverride||(r>=.99?3:r>=.66?2:1);Store.set(id,k,s);Scope.after(()=>{sfx.win();if(s>=2)confetti();
      resultModal({title:s===3?'ممتاز!':s===2?'أحسنت!':'محاولة جيدة!',big:s===3?'🏆':s===2?'🌟':'👍',msg:c.win||'أنهيت النشاط',stars:s,retry:()=>goAct(id,k),next:nextOf(id,k)})},700)},
  };
  cleanup=MECH[c.type](stage,c,api)||null;
}
function resultModal({title,big,msg,stars,retry,next}){const o=$('#overlay');
  o.innerHTML=`<div class="modal"><div class="big">${big}</div><h3>${title}</h3>${stars?`<div class="bigstars">${[1,2,3].map(i=>`<span class="${i<=stars?'':'off'}" style="animation-delay:${i*.18}s">⭐</span>`).join('')}</div>`:''}<p style="font-weight:700;font-size:19px;margin:6px 0">${msg}</p><div class="row"><button class="btn white" id="mR">↻ أعد</button><button class="btn teal" id="mN">التالي ←</button></div></div>`;
  o.classList.add('on');$('#mR').onclick=()=>{sfx.tap();retry()};$('#mN').onclick=()=>{sfx.tap();next()};$('#starCount').textContent='⭐ '+AR(Store.total());TTS.say(title+' '+msg)}
const MECH={};

MECH.train=(st,c,api)=>{let r=0,err=0;const total=c.rounds.reduce((a,x)=>a+x.words.length,0);
  st.innerHTML=`<div class="tr-scene"><div class="tr-label" id="trl"></div><div class="tr-train" id="trn"></div></div><div class="chips" id="tpool" style="margin-top:16px"></div>`;
  const round=()=>{const R=c.rounds[r],trn=$('#trn',st);let k=0;$('#trl',st).textContent=R.label;trn.style.transition='none';trn.style.transform='';trn.innerHTML='<div class="loco">🚂</div>';
    const hud=()=>api.hud(`<span class="h">القطار ${AR(r+1)} من ${AR(c.rounds.length)}</span><span class="h">العربات ${AR(k)} / ${AR(R.words.length)}</span>`);hud();
    $('#tpool',st).innerHTML=shuffle(R.words.map((w,i)=>({w,i}))).map(o=>`<button class="chip wag" data-i="${o.i}">${o.w}</button>`).join('');
    $$('#tpool .wag',st).forEach(b=>b.onclick=()=>{if(+b.dataset.i===k){k++;b.classList.add('used');sfx.chug();trn.appendChild(html(`<div class="wagon"><span>${b.textContent}</span><i></i><i></i></div>`));hud();
        if(k===R.words.length){sfx.bell();Scope.after(()=>{sfx.whoosh();trn.style.transition='transform 1.6s ease-in';trn.style.transform='translateX(-140%)'},700);Scope.after(()=>{r++;r<c.rounds.length?round():api.done(Math.max(0,total-err),total)},2500)}}

  st.innerHTML=`<div class="area road" id="rd"><span class="tree" style="left:2%;top:40%">🌳</span><span class="tree" style="right:3%;top:62%">🌴</span><span class="tree" style="left:4%;top:78%">🌷</span><div class="dash"></div><button class="sign r" data-s="r"></button><button class="sign l" data-s="l"></button><div class="hero-ch">${P('ahmed','happy',80)}</div></div>`;
  const rd=$('#rd',st),sr=$('.sign.r',st),sl=$('.sign.l',st);let goodSide;
  const hud=()=>api.hud(`<span class="h">👣 ${AR(i)} / ${AR(c.forks.length)}</span><span class="h">اختر اللافتة الصحيحة</span>`);
  const show=()=>{hud();const F=c.forks[i];goodSide=Math.random()<.5?'r':'l';const g=`<span class="e">${F.ge}</span>${F.g}`,b=`<span class="e">${F.be}</span>${F.b}`;
    sr.innerHTML=goodSide==='r'?g:b;sl.innerHTML=goodSide==='l'?g:b;[sr,sl].forEach(s=>{s.className='sign '+s.dataset.s;s.classList.add('gone');void s.offsetWidth;s.classList.remove('gone')});busy=false};
  [sr,sl].forEach(s=>s.onclick=()=>{if(busy)return;const F=c.forks[i];
    if(s.dataset.s===goodSide){busy=true;sfx.ok();s.classList.add('good');TTS.say(strip(s.innerHTML));const ch=$('.hero-ch',rd);ch.style.transform=`translateX(${goodSide==='r'?'40%':'-140%'})`;
      Scope.after(()=>{[sr,sl].forEach(x=>x.classList.add('gone'));ch.style.transform='';rd.classList.add('walk');sfx.step();Scope.after(sfx.step,300);Scope.after(sfx.step,600)},500);
      Scope.after(()=>{rd.classList.remove('walk');i++;if(i<c.forks.length)show();else{hud();sfx.bell();sr.className='sign r';sl.className='sign l';sr.style.left='3%';sr.style.width='94%';sr.innerHTML=`<span class="e">🏁</span>${c.end}`;sl.remove();Scope.after(()=>api.done(Math.max(0,c.forks.length-err),c.forks.length),900)}},1500)}
    else{err++;sfx.bad();s.classList.add('wrong');flash(s);flash($('.hero-ch',rd));toast(F.why||'هذا ليس من الطريق المستقيم')}});
  show();
};

/* 4 rub teeth clean */
MECH.rub=(st,c,api)=>{
  st.innerHTML=`<div class="center" style="margin-bottom:8px">${P('ahmed','sleepy',64)}<div class="bub" id="rbub">${c.say}</div></div><div class="area mouth" id="mo"><svg viewBox="0 0 400 260" preserveAspectRatio="none"><ellipse cx="200" cy="130" rx="190" ry="122" fill="#C0395B" stroke="#1F3B57" stroke-width="6"/><ellipse cx="200" cy="140" rx="150" ry="70" fill="#7A1631"/><ellipse cx="200" cy="175" rx="90" ry="34" fill="#F07A96"/>${[0,1,2,3,4,5].map(k=>`<rect x="${58+k*48}" y="26" width="42" height="72" rx="14" fill="#fff" stroke="#1F3B57" stroke-width="3"/><rect x="${58+k*48}" y="168" width="42" height="64" rx="14" fill="#fff" stroke="#1F3B57" stroke-width="3"/>`).join('')}</svg><canvas id="cv"></canvas><div class="brush" id="br">🪥</div></div><div class="meter"><i id="mt"></i></div>`;
  const mo=$('#mo',st),cv=$('#cv',st),x=cv.getContext('2d'),br=$('#br',st);let W,H,init=0,doneF=false,last=null,lastSnd=0;
  const setup=()=>{W=cv.width=mo.clientWidth;H=cv.height=mo.clientHeight;const sx=W/400,sy=H/260;x.globalCompositeOperation='source-over';
    for(let k=0;k<6;k++)for(const [y0,h0] of [[26,72],[168,64]]){for(let n=0;n<5;n++){x.fillStyle=`rgba(${ri(180,205)},${ri(150,170)},${ri(30,60)},.95)`;x.beginPath();x.ellipse((58+k*48+rand(6,36))*sx,(y0+rand(8,h0-8))*sy,rand(12,20)*sx,rand(10,18)*sy,rand(0,3),0,7);x.fill()}}
    x.font=`${Math.round(26*sx)}px sans-serif`;for(let n=0;n<5;n++)x.fillText('🦠',(60+ri(0,5)*48+ri(0,10))*sx,(ri(0,1)?80:210)*sy);
    init=count()};
  const count=()=>{const d=x.getImageData(0,0,W,H).data;let n=0;for(let p=3;p<d.length;p+=64)if(d[p]>40)n++;return n};
  const pos=e=>{const r=cv.getBoundingClientRect();return [e.clientX-r.left,e.clientY-r.top]};
  const erase=(a,b)=>{x.globalCompositeOperation='destination-out';x.lineCap='round';x.lineWidth=Math.max(34,W*.08);x.beginPath();x.moveTo(a[0],a[1]);x.lineTo(b[0],b[1]);x.stroke()};
  Scope.on(cv,'pointerdown',e=>{last=pos(e);erase(last,last);try{cv.setPointerCapture(e.pointerId)}catch(_){}});
  Scope.on(cv,'pointermove',e=>{const p=pos(e);br.style.left=p[0]+'px';br.style.top=p[1]+'px';if(last&&!doneF){erase(last,p);last=p;const n=performance.now();if(n-lastSnd>260){sfx.water();lastSnd=n}}});
  const up=()=>{last=null};Scope.on(cv,'pointerup',up);Scope.on(cv,'pointerleave',up);
  Scope.every(()=>{if(doneF||!init)return;const left=count(),p=Math.round(100*(1-left/init));$('#mt',st).style.width=p+'%';api.hud(`<span class="h">🦷 نظافة الأسنان ${AR(Math.min(100,p))}٪</span>`);
    if(p>=86){doneF=true;x.clearRect(0,0,W,H);$('#mt',st).style.width='100%';for(let n=0;n<8;n++){const s=html('<div class="it" style="font-size:30px">✨</div>');s.style.left=rand(12,88)+'%';s.style.top=rand(12,88)+'%';mo.appendChild(s)}
      $('#rbub',st).textContent=c.win;$('.center svg',st).outerHTML=P('ahmed','happy',64);TTS.say(c.win);api.done(3,3)}},400);
  requestAnimationFrame(setup);api.hud('<span class="h">🦷 نظافة الأسنان ٠٪</span>');
};

/* 5 swipe cards */
MECH.swipe=(st,c,api)=>{const cards=shuffle(c.cards);let i=0,sc=0;
  st.innerHTML=`<div class="sw-wrap" id="sw"><div class="sw-bin yes"><div><b>✓</b>${c.yes}</div></div><div class="sw-bin no"><div><b>✗</b>${c.no}</div></div></div><div class="center" style="margin-top:10px"><button class="btn green" id="by">✓ ${c.yes}</button><button class="btn rasp" id="bn">✗ ${c.no}</button></div>`;
  const sw=$('#sw',st);
  const hud=()=>api.hud(`<span class="h">البطاقة ${AR(Math.min(i+1,cards.length))} / ${AR(cards.length)}</span><span class="h">✔ ${AR(sc)}</span>`);
  const render=()=>{$$('.swc',sw).forEach(e=>e.remove());for(let k=Math.min(i+2,cards.length-1);k>=i;k--){const C=cards[k],el=html(`<div class="swc ${k===i?'':'back'+(k-i)}"><span class="e">${C.e}</span>${C.t}${k===i?spk(C.t):''}</div>`);sw.appendChild(el);
      if(k===i)dragify(el,{axis:'x',onMove:(e,dx)=>{el.style.transform=`translateX(${dx}px) rotate(${dx/14}deg)`},onDrop:(u,e,{dx})=>{if(dx>70){judge(true,el);return 'keep'}if(dx<-70){judge(false,el);return 'keep'}return false}})}hud()};
  const judge=(yes,el)=>{const C=cards[i];el=el||$('.swc:last-child',sw);el.style.transition='transform .4s,opacity .4s';el.style.transform=`translateX(${yes?160:-160}%) rotate(${yes?25:-25}deg)`;el.style.opacity=0;
    if(yes===C.ok){sc++;sfx.ok()}else{sfx.bad();toast(C.ok?'هذا سلوك صحيح نحافظ عليه ✓':'هذا سلوك خطأ نتركه ✗')}
    i++;Scope.after(()=>{i<cards.length?render():(hud(),api.done(sc,cards.length))},420)};
  $('#by',st).onclick=()=>i<cards.length&&judge(true);$('#bn',st).onclick=()=>i<cards.length&&judge(false);render();
};

/* 6 catch falling items */
MECH.catcher=(st,c,api)=>{let sc=0,lives=3,over=false,bx=.5,items=[];
  st.innerHTML=`<div class="area catch" id="ca"><div class="basket" id="bk">🧺<small>${c.basket}</small></div></div><p class="tap-hint">حرّك السلة بإصبعك يمينًا ويسارًا</p>`;
  const ca=$('#ca',st),bk=$('#bk',st);
  const hud=()=>api.hud(`<span class="h">🧺 ${AR(sc)} / ${AR(c.goal)}</span><span class="h">${'❤️'.repeat(lives)}${'🤍'.repeat(3-lives)}</span>`);hud();
  const place=()=>{bk.style.left=(bx*100)+'%'};place();
  const mv=e=>{const r=ca.getBoundingClientRect();bx=Math.min(.92,Math.max(.08,(e.clientX-r.left)/r.width));place()};
  Scope.on(ca,'pointerdown',mv);Scope.on(ca,'pointermove',mv);
  Scope.on(document,'keydown',e=>{if(e.key==='ArrowLeft')bx=Math.max(.08,bx-.08);if(e.key==='ArrowRight')bx=Math.min(.92,bx+.08);place()});
  const spawn=()=>{if(over)return;const good=Math.random()<.62,src=good?c.good:c.bad,[e,t]=src[ri(0,src.length-1)];const el=html(`<div class="fall"><span class="e">${e}</span><span class="t">${t}</span></div>`);const it={el,x:rand(.1,.9),y:-60,v:rand(1.9,2.6)+sc*.08,good,t};el.style.left=it.x*100+'%';ca.appendChild(el);items.push(it)};
  Scope.every(spawn,1150);spawn();
  Scope.loop(dt=>{if(over)return;const H=ca.clientHeight,W=ca.clientWidth;const br=bk.offsetTop;
    items=items.filter(it=>{it.y+=it.v*dt;it.el.style.top=it.y+'px';
      if(it.y>br-40&&it.y<br+20&&Math.abs(it.x-bx)*W<70){it.el.remove();if(it.good){sc++;sfx.coin();floatMsg(ca,bx*W-10,br-40,'+١')}else{lives--;sfx.bad();floatMsg(ca,bx*W-40,br-40,'✗ '+it.t);flash(bk)}hud();
        if(sc>=c.goal){over=true;api.done(lives,3)}else if(lives<=0){over=true;api.done(sc,c.goal)}return false}
      if(it.y>H+10){it.el.remove();return false}return true})});
};

/* 7 spot the difference */
MECH.spotdiff=(st,c,api)=>{let found=new Set(),miss=0;
  const scene=(side)=>`<div><div class="sd-cap">${side==='a'?c.capA:c.capB}</div><div class="area sd-scene" data-side="${side}">${c.base.map(b=>`<div class="it" data-s="${b.s}" style="left:${b.x}%;top:${b.y}%">${b.h}</div>`).join('')}${c.diffs.map((d,j)=>`<div class="it" data-s="${d.s}" style="left:${d.x}%;top:${d.y}%">${d[side]}</div>`).join('')}</div></div>`;
  st.innerHTML=`<div class="sd-grid">${scene('a')}${scene('b')}</div><div class="found-list" id="fl"></div>`;
  $$('.sd-scene',st).forEach(a=>sizeByWidth(a));
  const hud=()=>api.hud(`<span class="h">🔍 الفروق ${AR(found.size)} / ${AR(c.diffs.length)}</span>`);hud();
  $$('.sd-scene',st).forEach(a=>a.addEventListener('pointerdown',e=>{const r=a.getBoundingClientRect(),px=(e.clientX-r.left)/r.width*100,py=(e.clientY-r.top)/r.height*100;
    let hit=-1,best=1e9;c.diffs.forEach((d,j)=>{const dd=Math.hypot(px-d.x,(py-d.y)*.75);if(dd<(d.r||12)&&dd<best){best=dd;hit=j}});
    if(hit>=0&&!found.has(hit)){found.add(hit);const d=c.diffs[hit];sfx.ok();$$('.sd-scene',st).forEach(s=>{const g=html('<div class="ring"></div>');g.style.left=d.x+'%';g.style.top=d.y+'%';g.style.width=g.style.height=(d.r||12)*2+'%';g.style.aspectRatio='1';s.appendChild(g)});
      $('#fl',st).appendChild(html(`<span>✔ ${d.note}</span>`));TTS.say(d.note);hud();if(found.size===c.diffs.length)api.done(Math.max(0,c.diffs.length-Math.floor(miss/2)),c.diffs.length)}
    else if(hit<0){miss++;sfx.tap();floatMsg(a,e.clientX-r.left-8,e.clientY-r.top-20,'✗')}}));
};

/* 8 dialogue bubbles */
MECH.bubbles=(st,c,api)=>{let r=0,err=0,sel=null;const total=c.rounds.reduce((a,x)=>a+x.turns.length,0);
  const round=()=>{const R=c.rounds[r];sel=null;
    st.innerHTML=`<div class="narr">${R.place}</div><div class="dlg">${R.turns.map((t,j)=>`<div class="turn"><div class="who">${P(t.p,t.m||'happy',64)}<br>${t.who}</div><div class="slot" data-j="${j}" data-n="${AR(j+1)}">اضغط هنا</div></div>`).join('')}</div><div class="chips" style="margin-top:14px">${shuffle([...R.turns.map(t=>t.say),...R.extra]).map(s=>`<button class="chip bchip">${s}</button>`).join('')}</div>`;
    api.hud(`<span class="h">الموقف ${AR(r+1)} من ${AR(c.rounds.length)}</span><span class="h">اختر العبارة ثم اضغط على الفقاعة، أو اسحبها إليها</span>`);
    const put=(chip,slot)=>{if(!slot||slot.classList.contains('filled'))return false;const t=R.turns[+slot.dataset.j];

        if($$('.slot.filled',st).length===R.turns.length){Scope.after(()=>{r++;r<c.rounds.length?round():api.done(Math.max(0,total-err),total)},1600)}return 'keep'}
      err++;sfx.bad();flash(slot);toast('ليست هذه العبارة المناسبة هنا');return false};
    $$('.bchip',st).forEach(ch=>{ch.onclick=()=>{$$('.bchip',st).forEach(x=>x.classList.remove('sel'));ch.classList.add('sel');sel=ch;sfx.tap()};
      dragify(ch,{onDrop:(u,e,{moved})=>{if(!moved)return false;const s=u&&u.closest('.slot');const res=put(ch,s);if(res==='keep'){ch.style.transform='';}return res}})});
    $$('.slot',st).forEach(s=>s.onclick=()=>{if(sel)put(sel,s);else{flash(s);toast('اختر عبارة من الأسفل أولًا')}});
  };round();
};

  const ts=$('#ts',st),aa=$('#aa',st),fb=$('#fb',st),mt=$('#mt',st);let tm=[];

    const n=ri(3,7);let k=0;const iv=Scope.every(()=>{if(state!=='tickle'){clearInterval(iv);return}k++;aa.textContent='آ'.repeat(k)+'...';mt.style.transition='width .3s';mt.style.width=(k/n*100)+'%';sfx.tap();
      if(k>=n){clearInterval(iv);state='window';face('sneeze');aa.textContent='آآ... تشـ!';ts.style.background='';const W=win[r];mt.style.transition=`width ${W}ms linear`;mt.style.width='0';
        Scope.after(()=>{if(state==='window'){state='miss';sfx.sneeze();ts.classList.add('spray');face('sad');aa.textContent='أوه! تطاير الرذاذ على الطعام';toast('غطِّ فمك وأنفك بسرعة عند العطاس');r++;Scope.after(next,1900)}},W)}},ri(420,560))};

/* 10 jigsaw */
MECH.jigsaw=(st,c,api)=>{const N=9,url=`url("data:image/svg+xml;charset=utf-8,${encodeURIComponent(c.svg)}")`;let pos=[...Array(N).keys()],sel=null,moves=0,done=false;

  st.innerHTML=`<div class="jig" id="jg">${pos.map((p,i)=>`<button class="tile" data-i="${i}" aria-label="قطعة"></button>`).join('')}</div><div class="center" style="margin-top:12px"><button class="btn white" id="pv">👁️ أرِني الصورة</button></div><div id="cap"></div>`;
  const paint=()=>$$('.tile',st).forEach((t,i)=>{const p=pos[i];t.style.backgroundImage=url;t.style.backgroundPosition=`${(p%3)*50}% ${Math.floor(p/3)*50}%`});paint();
  const hud=()=>api.hud(`<span class="h">🧩 الحركات ${AR(moves)}</span>`);hud();
  $$('.tile',st).forEach(t=>t.onclick=()=>{if(done)return;const i=+t.dataset.i;if(sel===null){sel=i;t.classList.add('sel');sfx.tap();return}
    if(sel!==i){[pos[sel],pos[i]]=[pos[i],pos[sel]];moves++;sfx.flip();paint();hud()}$$('.tile',st).forEach(x=>x.classList.remove('sel'));sel=null;
    if(pos.every((p,k)=>p===k)){done=true;$('#jg',st).classList.add('solved');sfx.bell();$('#cap',st).innerHTML=`<div class="narr" style="text-align:center;margin-top:12px;font-size:22px">${c.caption}</div>`;TTS.say(c.caption);api.done(moves<=10?3:moves<=18?2:1,3,moves<=10?3:moves<=18?2:1)}});
  let pv=false;$('#pv',st).onclick=()=>{pv=!pv;$$('.tile',st).forEach((t,i)=>t.style.backgroundPosition=pv?`${(i%3)*50}% ${Math.floor(i/3)*50}%`:`${(pos[i]%3)*50}% ${Math.floor(pos[i]/3)*50}%`);$('#pv',st).textContent=pv?'🧩 أكمل الأحجية':'👁️ أرِني الصورة';$$('.tile',st).forEach(t=>t.disabled=pv)};
};

/* 12 grid maze */
MECH.maze=(st,c,api)=>{const G=c.grid.map(r=>r.split(''));const R=G.length,C=G[0].length;let pr,pc,got=0,done=false;
  G.forEach((row,i)=>row.forEach((ch,j)=>{if(ch==='S'){pr=i;pc=j}}));
  st.innerHTML=`<div class="maze" id="mz" style="grid-template-columns:repeat(${C},1fr)">${G.map((row,i)=>row.map((ch,j)=>`<div class="cell ${ch==='#'?'w':'p'} ${'123'.includes(ch)?'coin':''}" data-r="${i}" data-c="${j}">${ch==='E'?'<span>🏠</span>':'123'.includes(ch)?'<span>📜</span>':''}</div>`).join('')).join('')}<div class="mz-p" id="pl">${P('ahmed','happy',30)}</div></div>
  <div class="dpad"><span></span><button data-d="u">⬆️</button><span></span><button data-d="l">⬅️</button><button data-d="d">⬇️</button><button data-d="r">➡️</button></div><p class="tap-hint">حرّك أحمد بالأسهم أو اسحب بإصبعك على المتاهة</p>`;
  const mz=$('#mz',st),pl=$('#pl',st);
  const place=()=>{pl.style.width=(100/C)+'%';pl.style.height=(100/R)+'%';pl.style.left=(pc*100/C)+'%';pl.style.top=(pr*100/R)+'%';const s=pl.querySelector('svg');s.setAttribute('width','80%');s.setAttribute('height','90%')};place();
  const hud=()=>api.hud(`<span class="h">📜 البطاقات ${AR(got)} / ٣</span><span class="h">الهدف: ${c.goal}</span>`);hud();
  const move=(dr,dc)=>{if(done)return;$('.factpop',st)&&$('.factpop',st).remove();const nr=pr+dr,nc=pc+dc;if(nr<0||nc<0||nr>=R||nc>=C||G[nr][nc]==='#'){sfx.tap();flash(pl);return}
    const ch=G[nr][nc];if(ch==='E'&&got<3){toast('اجمع البطاقات الثلاث 📜 أولًا');sfx.bad();return}
    pr=nr;pc=nc;place();sfx.step();
    if('123'.includes(ch)){G[nr][nc]='.';got++;const cell=$(`.cell[data-r="${nr}"][data-c="${nc}"]`,mz);cell.innerHTML='';cell.classList.remove('coin');sfx.coin();const f=c.facts[ch];mz.appendChild(html(`<div class="factpop">${f}</div>`));TTS.say(f);hud()}
    if(ch==='E'){done=true;sfx.bell();mz.appendChild(html(`<div class="factpop">🏠 ${c.end}</div>`));TTS.say(c.end);api.done(3,3)}};
  $$('.dpad button',st).forEach(b=>b.onclick=()=>({u:()=>move(-1,0),d:()=>move(1,0),l:()=>move(0,-1),r:()=>move(0,1)})[b.dataset.d]());
  Scope.on(document,'keydown',e=>{const m={ArrowUp:[-1,0],ArrowDown:[1,0],ArrowLeft:[0,-1],ArrowRight:[0,1]}[e.key];if(m){e.preventDefault();move(...m)}});
  let sx,sy;mz.addEventListener('pointerdown',e=>{sx=e.clientX;sy=e.clientY});mz.addEventListener('pointerup',e=>{if(sx==null)return;const dx=e.clientX-sx,dy=e.clientY-sy;sx=null;if(Math.max(Math.abs(dx),Math.abs(dy))<22)return;Math.abs(dx)>Math.abs(dy)?move(0,dx>0?1:-1):move(dy>0?1:-1,0)});
};

/* 13 hidden objects */

/* 14 magnifier inspector */
MECH.magnifier=(st,c,api)=>{let seen=0,sc=0,ans=0;
  st.innerHTML=`<div class="center"><span class="magnifier" id="mg">🔍</span><span style="font-weight:700">اسحب العدسة إلى ثوب الطفل، أو اضغط عليه</span></div><div class="mag-grid">${c.kids.map((k,j)=>`<div class="mcard" data-j="${j}">${P(k.p,'wow',96)}<span class="stain" style="background:${k.color}"></span><div class="cause">؟</div><div class="ab"><button class="btn rasp" data-a="1">نجاسة</button><button class="btn green" data-a="0">ليست نجاسة</button></div></div>`).join('')}</div>`;

  const inspect=card=>{if(!card||card.classList.contains('seen'))return;card.classList.add('seen');seen++;sfx.whoosh();const k=c.kids[+card.dataset.j];$('.cause',card).innerHTML=`<span class="e">${k.e}</span>${k.name}`;TTS.say(k.name);hud()};
  dragify($('#mg',st),{onDrop:(u)=>{inspect(u&&u.closest('.mcard'));return false}});
  $$('.mcard',st).forEach(card=>{card.addEventListener('click',e=>{if(!e.target.closest('.ab'))inspect(card)});
    $$('.ab button',card).forEach(b=>b.onclick=()=>{const k=c.kids[+card.dataset.j];if(card.dataset.done)return;card.dataset.done=1;ans++;const ok=(b.dataset.a==='1')===k.najis;
      if(ok){sc++;sfx.ok();card.classList.add('good')}else{sfx.bad();card.classList.add('wrong');toast(k.najis?'هذه نجاسة يجب تطهيرها':'هذه ليست نجاسة')}
      $('.ab',card).innerHTML=`<b>${k.najis?'نجاسة ✋':'ليست نجاسة ✓'}</b>`;hud();if(ans===c.kids.length)api.done(sc,c.kids.length)})});
};

/* 15 river stepping stones */
MECH.stones=(st,c,api)=>{const N=c.rows;let cur=0,lives=3,busy=false;
  const rows=Array.from({length:N},()=>{const g=c.good[ri(0,c.good.length-1)],b=shuffle(c.bad).slice(0,2);return shuffle([{...g,ok:1},...b.map(x=>({...x,ok:0}))])});
  st.innerHTML=`<div class="area river" id="rv" style="touch-action:manipulation"><div class="bank" id="startB">${c.start}</div>${rows.map((row,i)=>`<div class="srow" data-i="${i}">${row.map((s,j)=>`<button class="stone" data-j="${j}"><span class="e">${s.e}</span>${s.t}</button>`).join('')}</div>`).join('')}<div class="bank" id="endB" style="background:var(--sun2)">🕌 ${c.end}</div><div class="hopper" id="hp">${P('ahmed','happy',48)}</div></div>`;
  const rv=$('#rv',st),hp=$('#hp',st);
  const hopTo=el=>{const a=rv.getBoundingClientRect(),b=el.getBoundingClientRect();hp.style.left=(b.left-a.left+b.width/2-24)+'px';hp.style.top=(b.top-a.top+b.height/2-62)+'px'};
  const hud=()=>api.hud(`<span class="h">🪨 ${AR(cur)} / ${AR(N)}</span><span class="h">${'❤️'.repeat(lives)}${'🤍'.repeat(3-lives)}</span>`);
  const mark=()=>{$$('.srow',rv).forEach((r,i)=>r.classList.toggle('cur',i===cur));hud();const cr=$('.srow.cur',rv);if(cr&&cur>0)try{cr.scrollIntoView({block:'center',behavior:'smooth'})}catch(_){}};
  requestAnimationFrame(()=>{hopTo($('#startB',rv));mark();try{$('#startB',rv).scrollIntoView({block:'end'})}catch(_){}});Scope.on(window,'resize',()=>hopTo(cur===0?$('#startB',rv):$(`.srow[data-i="${cur-1}"] .stone.good`,rv)||$('#startB',rv)));
  $$('.srow',rv).forEach(row=>$$('.stone',row).forEach(s=>s.onclick=()=>{const i=+row.dataset.i;if(busy||i!==cur||s.classList.contains('sink'))return;const S=rows[i][+s.dataset.j];
    if(S.ok){busy=true;s.classList.add('good');sfx.step();hopTo(s);cur++;Scope.after(()=>{busy=false;mark();if(cur===N){hopTo($('#endB',rv));sfx.bell();TTS.say(c.end);Scope.after(()=>api.done(lives,3),700)}},480)}
    else{lives--;sfx.splash();s.classList.add('sink');floatMsg(rv,s.offsetLeft,s.offsetTop,'✋ '+S.t);toast(c.why);hud();if(lives<=0){busy=true;Scope.after(()=>api.done(cur,N),600)}}}));
};

/* 16 blessings wheel */
MECH.wheel=(st,c,api)=>{const n=c.segs.length,got=new Set();let rot=0,err=0,spinning=false;const cols=['#FFC83D','#13A39A','#E0457B','#6BBF47','#5AB8E8','#F29B1D'];
  const arc=(i)=>{const a0=(i*360/n-90)*Math.PI/180,a1=((i+1)*360/n-90)*Math.PI/180;return `M150 150 L${150+140*Math.cos(a0)} ${150+140*Math.sin(a0)} A140 140 0 0 1 ${150+140*Math.cos(a1)} ${150+140*Math.sin(a1)}Z`};
  const lab=(i,r)=>{const a=((i+.5)*360/n-90)*Math.PI/180;return [150+r*Math.cos(a),150+r*Math.sin(a)]};
  st.innerHTML=`<div class="wheelbox"><div class="ptr">🔻</div><svg viewBox="0 0 300 300" id="wh"><circle cx="150" cy="150" r="146" fill="#fff" stroke="#1F3B57" stroke-width="6"/>${c.segs.map((s,i)=>{const [x,y]=lab(i,95),[x2,y2]=lab(i,56);return `<path d="${arc(i)}" fill="${cols[i%6]}" stroke="#1F3B57" stroke-width="3"/><text x="${x}" y="${y+12}" font-size="36" text-anchor="middle">${s.e}</text><text x="${x2}" y="${y2+6}" font-size="15" font-weight="800" text-anchor="middle" fill="#1F3B57" font-family="Baloo Bhaijaan 2,Tahoma">${s.w}</text><text class="ck" data-i="${i}" x="${x}" y="${y-22}" font-size="22" text-anchor="middle" opacity="0">✅</text>`}).join('')}</svg><button class="btn rasp hub" id="go">لُفّ</button></div><div id="pp"></div>`;
  const wh=$('#wh',st);
  const hud=()=>api.hud(`<span class="h">🎁 النعم ${AR(got.size)} / ${AR(n)}</span>`);hud();
  $('#go',st).onclick=()=>{if(spinning)return;spinning=true;sfx.spin();const left=[...Array(n).keys()].filter(i=>!got.has(i));const t=left[ri(0,left.length-1)];const center=(t+.5)*360/n;
    const base=Math.ceil(rot/360)*360+360*4;rot=base+(360-center)+rand(-12,12);wh.style.transform=`rotate(${rot}deg)`;
    Scope.after(()=>{const S=c.segs[t];sfx.bell();const box=html(`<div class="bpop"><div class="e">${S.e}</div><div style="font-size:24px;font-weight:800">${S.t}</div><div style="font-weight:700">ماذا أقول لأشكر الله على هذه النعمة؟</div><div class="center">${shuffle(c.choices).map(ch=>`<button class="btn ${ch===c.right?'':''} white">${ch}</button>`).join('')}</div></div>`);
      $('.wheelbox',st).appendChild(box);TTS.say(S.t);
      $$('button',box).forEach(b=>b.onclick=()=>{if(b.textContent===c.right){got.add(t);sfx.ok();TTS.say('الحمد لله على '+S.t);$(`.ck[data-i="${t}"]`,st).setAttribute('opacity','1');box.remove();spinning=false;hud();if(got.size===n)api.done(Math.max(0,n-err),n)}else{err++;sfx.bad();flash(b);toast('نشكر الله فنقول: الحمد لله')}})},3300)};
};

/* 17 connect with lines */
MECH.lines=(st,c,api)=>{const n=c.pairs.length,bOrder=shuffle([...Array(n).keys()]);let sel=null,done=new Set(),err=0;
  st.innerHTML=`<div class="lines" id="ln"><svg id="lsv"></svg>${c.pairs.map((p,i)=>`<button class="lk a" data-i="${i}" style="grid-column:1;grid-row:${i+1}">${p.a}<span class="dot"></span></button><button class="lk b" data-i="${bOrder[i]}" style="grid-column:2;grid-row:${i+1}">${c.pairs[bOrder[i]].b}<span class="dot"></span></button>`).join('')}</div>`;
  const ln=$('#ln',st),sv=$('#lsv',st);
  const pt=el=>{const a=ln.getBoundingClientRect(),d=$('.dot',el).getBoundingClientRect();return [d.left-a.left+d.width/2,d.top-a.top+d.height/2]};
  const line=(i,col,tmp)=>{const A=pt($(`.lk.a[data-i="${i[0]}"]`,ln)),B=pt($(`.lk.b[data-i="${i[1]}"]`,ln));const l=document.createElementNS('http://www.w3.org/2000/svg','line');l.setAttribute('x1',A[0]);l.setAttribute('y1',A[1]);l.setAttribute('x2',B[0]);l.setAttribute('y2',B[1]);l.setAttribute('stroke',col);l.setAttribute('stroke-width','6');l.setAttribute('stroke-linecap','round');sv.appendChild(l);if(tmp)setTimeout(()=>l.remove(),600)};
  const redraw=()=>{sv.innerHTML='';done.forEach(i=>line([i,i],'#1FAF62'))};Scope.on(window,'resize',redraw);
  const hud=()=>api.hud(`<span class="h">🔗 ${AR(done.size)} / ${AR(n)}</span><span class="h">اضغط على بطاقة من اليمين ثم ما يناسبها من اليسار</span>`);hud();
  $$('.lk.a',ln).forEach(b=>b.onclick=()=>{if(done.has(+b.dataset.i))return;$$('.lk.a',ln).forEach(x=>x.classList.remove('sel'));b.classList.add('sel');sel=+b.dataset.i;sfx.tap();TTS.say(b.textContent)});
  $$('.lk.b',ln).forEach(b=>b.onclick=()=>{const j=+b.dataset.i;if(done.has(j))return;if(sel===null){toast('ابدأ بالبطاقة في اليمين');flash($('.lk.a:not(.good)',ln));return}
    if(sel===j){done.add(j);$(`.lk.a[data-i="${j}"]`,ln).classList.add('good');b.classList.add('good');$$('.lk.a',ln).forEach(x=>x.classList.remove('sel'));line([j,j],'#1FAF62');sfx.ok();sel=null;hud();if(done.size===n)api.done(Math.max(0,n-err),n)}
    else{err++;sfx.bad();line([sel,j],'#E5484D',true);flash(b)}});
};

/* 18 balloon pop */
MECH.balloons=(st,c,api)=>{let sc=0,lives=3,over=false,bs=[];const cols=['#FFC83D','#FF9EBB','#9BE3D9','#B9A0E4','#A8E08A','#FFB870'];
  st.innerHTML=`<div class="area sky" id="sk"><span class="it" style="left:12%;top:14%;font-size:40px">☁️</span><span class="it" style="left:78%;top:30%;font-size:50px">☁️</span></div>`;
  const sk=$('#sk',st);
  const hud=()=>api.hud(`<span class="h">🎈 ${AR(sc)} / ${AR(c.goal)}</span><span class="h">${'❤️'.repeat(lives)}${'🤍'.repeat(3-lives)}</span>`);hud();
  const spawn=()=>{if(over)return;const good=Math.random()<.58,src=good?c.good:c.bad,t=src[ri(0,src.length-1)];const el=html(`<div class="bal" style="background:${cols[ri(0,5)]}">${t}</div>`);const b={el,x:rand(14,86),y:sk.clientHeight+30,v:rand(1.1,1.6),ph:rand(0,6),good,t};el.style.left=b.x+'%';sk.appendChild(el);bs.push(b);
    el.addEventListener('pointerdown',e=>{if(over||b.dead)return;b.dead=true;el.classList.add('popd');sfx.pop();const r=sk.getBoundingClientRect();
      if(good){sc++;floatMsg(sk,e.clientX-r.left,e.clientY-r.top,'+١ '+'👍');TTS.say(t)}else{lives--;sfx.bad();floatMsg(sk,e.clientX-r.left-40,e.clientY-r.top,'✗ ليس شكرًا');flash(sk)}hud();
      if(sc>=c.goal){over=true;api.done(lives,3)}else if(lives<=0){over=true;api.done(sc,c.goal)}})};
  Scope.every(spawn,1400);spawn();
  Scope.loop((dt,now)=>{bs=bs.filter(b=>{if(b.dead){if(!b.gone){b.gone=1;setTimeout(()=>b.el.remove(),260)}return false}b.y-=b.v*dt*(1+sc*.04);b.el.style.top=b.y+'px';b.el.style.transform=`translateX(${Math.sin(now/700+b.ph)*10}px)`;if(b.y<-170){b.el.remove();return false}return true})});
};

.sw.sel,.stkb.sel{outline:4px solid var(--rasp);outline-offset:2px}
.stkb{font-size:30px;width:54px;height:54px;border:var(--bd);border-radius:14px;background:#fff}
.story{display:grid;gap:12px}
.scene{border:var(--bd);border-radius:20px;background:linear-gradient(#FFF6E4 0 70%,#EAD7B0 70%);padding:12px;min-height:200px;display:flex;flex-direction:column;align-items:center;gap:8px}
.scene .cast{display:flex;gap:14px;align-items:flex-end;justify-content:center;font-size:54px;flex-wrap:wrap}
.meterh{font-size:24px;letter-spacing:2px}
.room{aspect-ratio:4/3;background:linear-gradient(#FDEBD3 0 62%,#D9A86C 62%)}
.room .tgt{position:absolute;border:var(--bd);border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;font-size:14px;background:#fff9}
.room .toy{position:absolute;font-size:clamp(32px,7vw,48px);line-height:1;margin:-.5em 0 0 -.5em;cursor:grab;touch-action:none}
.room .toy.sel{filter:drop-shadow(0 0 6px #E0457B)}
.hold{user-select:none;-webkit-user-select:none;touch-action:none}
.holes{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:640px;margin:0 auto}
.hole{position:relative;aspect-ratio:1/1;border-radius:18px;overflow:hidden;background:radial-gradient(ellipse at 50% 88%,#5B3A1E 0 30%,transparent 31%),linear-gradient(#A8E08A,#7CC75A);border:var(--bd)}
.mole{position:absolute;left:6%;right:6%;bottom:8%;top:10%;border:3px solid var(--ink);border-radius:16px 16px 6px 6px;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-weight:800;font-size:clamp(12px,3.2vw,16px);line-height:1.25;padding:4px;transform:translateY(110%);transition:transform .25s;cursor:pointer}
.mole .e{font-size:clamp(26px,7vw,40px);line-height:1.1}
.mole.up{transform:translateY(0)}
.hammer{position:absolute;font-size:46px;pointer-events:none;animation:ham .35s forwards;z-index:3}
@keyframes ham{0%{transform:rotate(-40deg)}60%{transform:rotate(20deg)}100%{transform:rotate(10deg);opacity:0}}
.dress{display:grid;grid-template-columns:1fr 1.2fr;gap:14px;align-items:start}
@media (max-width:640px){.dress{grid-template-columns:1fr}}
.mirror{border:var(--bd);border-radius:120px 120px 20px 20px;background:linear-gradient(#E6F6FD,#fff);min-height:260px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px;position:relative;text-align:center;font-weight:800}
.wardrobe{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.wopt{border:var(--bd);border-radius:18px;background:#fff;box-shadow:0 4px 0 var(--ink);padding:8px;display:flex;flex-direction:column;align-items:center;font-weight:800;font-size:16px;text-align:center;gap:4px;min-height:140px;justify-content:center}
.wopt .e{font-size:48px;line-height:1.1}
.belt{height:250px;background:linear-gradient(#EAF6FB 0 62%,#555 62% 64%,#777 64% 78%,#555 78% 80%,#EAF6FB 80%)}
.belt .stripes{position:absolute;left:0;right:0;top:64%;height:14%;background:repeating-linear-gradient(90deg,transparent 0 30px,rgba(255,255,255,.35) 30px 36px);animation:beltmv .6s linear infinite}
@keyframes beltmv{to{background-position:-36px 0}}
.belt .scan{position:absolute;left:38%;width:24%;top:4%;bottom:20%;border:3px dashed var(--rasp);border-radius:16px;background:rgba(255,200,61,.12)}
.bitem{position:absolute;top:18%;width:120px;margin-left:-60px;display:flex;flex-direction:column;align-items:center;text-align:center}
.bitem .e{font-size:56px;line-height:1;position:relative}
.bitem .st{position:absolute;width:22px;height:18px;border-radius:50%;left:50%;top:50%;margin:-6px 0 0 -6px;border:2px solid rgba(0,0,0,.2)}
.bitem .t{font-size:14px;font-weight:800;background:#fff;border:2px solid var(--ink);border-radius:8px;padding:0 6px;white-space:nowrap}
.trace-box{position:relative;aspect-ratio:2/1;max-height:52vh;width:100%;border:var(--bd);border-radius:20px;background:#fff;overflow:hidden;touch-action:none}
.trace-box canvas{position:absolute;inset:0;width:100%;height:100%}
.tree{aspect-ratio:1/1;max-width:560px;margin:0 auto;background:linear-gradient(#DFF4FC 0 78%,#C9E8B5 78%)}
.tslot{position:absolute;transform:translate(-50%,-50%);min-width:30%;text-align:center;border:3px dashed var(--ink);border-radius:18px;background:#fffc;padding:4px 8px;font-weight:800;font-size:clamp(14px,3.6vw,20px);line-height:1.3}
.tslot small{display:block;font-size:.72em;color:var(--ink2)}
.tslot.cur{background:var(--sun2);animation:glow 1.4s ease-in-out infinite}
.tslot.good{border-style:solid}
.leaves{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:12px}
.leaf{border:var(--bd);border-radius:0 40px 0 40px;background:#8BD06A;box-shadow:0 4px 0 var(--ink);padding:10px 18px;font-weight:800;font-size:19px}
.palette{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:10px}
.crayon{width:46px;height:86px;border:var(--bd);border-radius:10px 10px 6px 6px;position:relative;transition:transform .2s}
.crayon::before{content:"";position:absolute;top:-20px;left:50%;margin-left:-14px;border:14px solid transparent;border-bottom:20px solid currentColor;border-top:0}
.crayon.sel{transform:translateY(-12px)}
.shapes{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;max-width:720px;margin:10px auto 0}
.shape{border:none;background:none;padding:0}
.shape svg{width:100%;height:auto;display:block}
.shape path,.shape polygon{transition:fill .5s}
.track{height:190px;background:linear-gradient(#DFF4FC 0 20%,#8C8C99 20% 90%,var(--grass) 90%)}
.track .lane{position:absolute;left:0;right:0;height:2px;top:55%;background:repeating-linear-gradient(90deg,#fff 0 30px,transparent 30px 60px)}
.track .car{position:absolute;font-size:52px;line-height:1;transition:right .8s cubic-bezier(.3,1.4,.5,1)}
.track .fin{position:absolute;left:0;top:0;bottom:0;width:70px;background:repeating-conic-gradient(#1F3B57 0 25%,#fff 0 50%) 0 0/20px 20px;display:flex;align-items:flex-start;justify-content:center}
.track .fin span{font-size:36px;background:#fff;border-radius:10px;margin-top:4px}
`);

/* 19 delivery of help */
MECH.delivery=(st,c,api)=>{let err=0,doneN=0,sel=null;
  st.innerHTML=`<div class="dl-people">${c.people.map((p,j)=>`<div class="person" data-j="${j}"><span class="need">${p.need}</span><span class="av">${P(p.p,p.m,90)}</span>${p.t}</div>`).join('')}</div><div class="dl-items">${shuffle(c.items).map(it=>`<div class="gift" data-id="${it.id}"><span class="e">${it.e}</span>${it.t}</div>`).join('')}</div><p class="tap-hint">اسحب الشيء إلى من يحتاجه، أو اضغط عليه ثم على الشخص</p>`;
  const hud=()=>api.hud(`<span class="h">🤲 ${AR(doneN)} / ${AR(c.people.length)}</span>`);hud();
  const give=(g,pc)=>{if(!pc||pc.classList.contains('good'))return false;const p=c.people[+pc.dataset.j];
    if(p.want===g.dataset.id){pc.classList.add('good');$('.av',pc).innerHTML=P(p.p,'happy',90);$('.need',pc).textContent=g.querySelector('.e').textContent;g.remove();doneN++;sfx.ok();TTS.say(p.thanks);floatMsg(pc,20,40,p.thanks);hud();sel=null;if(doneN===c.people.length)Scope.after(()=>{toast(c.win);api.done(Math.max(0,c.people.length-err),c.people.length)},900);return 'keep'}
    err++;sfx.bad();flash(pc);toast('هذا لا يحتاج إلى هذا الشيء');return false};
  $$('.gift',st).forEach(g=>{dragify(g,{onDrop:(u,e,{moved})=>{if(!moved){$$('.gift',st).forEach(x=>x.classList.remove('sel'));g.classList.add('sel');sel=g;sfx.tap();return false}return give(g,u&&u.closest('.person'))}})});
  $$('.person',st).forEach(pc=>pc.onclick=()=>{if(sel)give(sel,pc)});
};

/* 20 tap-to-underline words */
MECH.highlight=(st,c,api)=>{let got=0,err=0;const T=c.targets.length;
  st.innerHTML=`<div class="hl-box">${c.verses.map((v,i)=>v.split(' ').map(w=>`<span class="w">${w}</span>`).join(' ')+` <span class="n">﴿${AR(c.nums[i])}﴾</span>`).join(' ')}</div><div class="vmean" id="vm">اضغط على كلمة تدل على محبة ربي لي</div>`;
  const hud=()=>api.hud(`<span class="h">✏️ ${AR(got)} / ${AR(T)}</span>`);hud();
  $$('.w',st).forEach(w=>w.onclick=()=>{if(w.classList.contains('on'))return;const k=c.targets.indexOf(w.textContent);
    if(k>=0){w.classList.add('on');got++;sfx.ok();$('#vm',st).innerHTML=`<b style="font-family:var(--q)">${w.textContent}</b> ← ${c.means[k]}`;TTS.say(c.means[k]);hud();if(got===T)api.done(Math.max(0,T-err),T)}
    else{err++;sfx.bad();flash(w);$('#vm',st).textContent='هذه الكلمة ليست منها، ابحث عن فعل يفعله الله لي'}});
};

/* 21 memory pairs */
MECH.memory=(st,c,api)=>{const cards=shuffle(c.pairs.flatMap((p,i)=>[{i,h:`<span class="e">${p.a.e}</span>${p.a.t}`},{i,h:`<span class="bw">${p.b}</span>`}]));let open=[],lock=false,moves=0,got=0;const n=c.pairs.length;
  st.innerHTML=`<div class="mem">${cards.map((k,j)=>`<button class="mc" data-j="${j}"><div class="in"><div class="fa">⭐</div><div class="fb">${k.h}</div></div></button>`).join('')}</div>`;
  const hud=()=>api.hud(`<span class="h">🃏 الأزواج ${AR(got)} / ${AR(n)}</span><span class="h">المحاولات ${AR(moves)}</span>`);hud();
  $$('.mc',st).forEach(b=>b.onclick=()=>{if(lock||b.classList.contains('up')||b.classList.contains('ok'))return;b.classList.add('up');sfx.flip();open.push(b);
    if(open.length===2){moves++;lock=true;const [x,y]=open;if(cards[x.dataset.j].i===cards[y.dataset.j].i){Scope.after(()=>{x.classList.add('ok');y.classList.add('ok');sfx.ok();got++;open=[];lock=false;hud();TTS.say(c.pairs[cards[x.dataset.j].i].say||'');if(got===n){const s=moves<=n+3?3:moves<=n+7?2:1;api.done(s,3,s)}},450)}
      else Scope.after(()=>{x.classList.remove('up');y.classList.remove('up');open=[];lock=false;hud()},1000)}});
};

/* 22 connect the dots */
MECH.dots=(st,c,api)=>{let k=1,err=0;const pts=c.pts,N=pts.length;
  st.innerHTML=`<svg class="dots-svg" viewBox="0 0 400 260" id="ds"><g id="lns"></g><g id="art" opacity="0"></g>${pts.map((p,i)=>`<g class="dt" data-i="${i}"><circle cx="${p[0]}" cy="${p[1]}" r="22" fill="transparent"/><circle cx="${p[0]}" cy="${p[1]}" r="13" fill="${i===0?'#FFC83D':'#fff'}" stroke="#1F3B57" stroke-width="3"/><text x="${p[0]}" y="${p[1]+5}" text-anchor="middle" font-size="14" font-weight="800" fill="#1F3B57">${AR(i+1)}</text></g>`).join('')}</svg><div id="ph"></div>`;
  const ds=$('#ds',st),lns=$('#lns',ds);
  const seg=(a,b)=>{lns.insertAdjacentHTML('beforeend',`<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="#E0457B" stroke-width="6" stroke-linecap="round"/>`)};
  const hud=()=>api.hud(`<span class="h">🔢 النقطة التالية: ${AR(Math.min(k+1,N))}</span>`);hud();
  $$('.dt',ds).forEach(g=>g.addEventListener('pointerdown',()=>{const i=+g.dataset.i;if(k>N)return;
    if(i===k&&k<N){seg(pts[k-1],pts[k]);g.children[1].setAttribute('fill','#FFC83D');k++;sfx.step();hud();
      if(k===N){seg(pts[N-1],pts[0]);k=N+1;sfx.bell();const art=$('#art',ds);art.innerHTML=`<polygon points="${pts.map(p=>p.join(',')).join(' ')}" fill="#5AB8E8" stroke="#1F3B57" stroke-width="4"/>${c.extra}`;art.setAttribute('opacity','1');
        let j=0;const show=()=>{if(j>=c.parts.length){$('#ph',st).innerHTML=`<div class="phrase">${c.phrase}</div>`;TTS.say(c.phrase);api.done(Math.max(0,6-err),6);return}const p=c.parts[j++];art.insertAdjacentHTML('beforeend',`<text x="${p[0]}" y="${p[1]}" text-anchor="middle" font-size="17" font-weight="800" fill="${p[3]||'#1F3B57'}" font-family="Baloo Bhaijaan 2,Tahoma" style="paint-order:stroke" stroke="${p[3]?'#1F3B57':'#fff'}" stroke-width="4">${p[2]}</text>`);sfx.pop();Scope.after(show,650)};Scope.after(show,500)}}
    else if(i!==k-1&&!(i<k)){err++;sfx.bad();flash(g.closest('svg'));toast('ابحث عن الرقم '+AR(k+1))}}));
};

/* 23 verse lights (Simon) */
MECH.simon=(st,c,api)=>{const V=c.verses,cols=['#FFC83D','#13A39A','#E0457B','#6BBF47','#5AB8E8','#F29B1D'],freqs=[392,440,494,523,587,659];let len=c.start||2,step=0,err=0,phase='show';
  st.innerHTML=`<div class="simon" id="sm"></div><div class="center" style="margin-top:12px"><button class="btn white" id="again">▶ شاهد الأضواء مرة أخرى</button></div>`;
  const sm=$('#sm',st);let order=[];
  const hud=(m)=>api.hud(`<span class="h">الجولة ${AR(len-(c.start||2)+1)} من ${AR(V.length-(c.start||2)+1)}</span><span class="h">${m}</span>`);
  const build=()=>{order=shuffle([...Array(V.length).keys()]);sm.innerHTML=order.map(v=>`<button class="pad" data-v="${v}" style="background:${cols[v]}">${V[v]}</button>`).join('');$$('.pad',sm).forEach(p=>p.onclick=()=>tap(+p.dataset.v,p))};
  const light=(v,ms=650)=>{const p=$(`.pad[data-v="${v}"]`,sm);if(!p)return;p.classList.add('lit');Snd.tone(freqs[v],ms/1000*.8,'triangle',.16);Scope.after(()=>p.classList.remove('lit'),ms)};
  const play=()=>{phase='show';hud('👀 شاهد');for(let i=0;i<len;i++)Scope.after(()=>light(i),400+i*900);Scope.after(()=>{phase='input';step=0;hud('👆 دورك: اضغط بالترتيب')},400+len*900)};
  const tap=(v,p)=>{if(phase!=='input')return;if(v===step){light(v,300);step++;if(step===len){phase='wait';sfx.ok();if(len===V.length){Scope.after(()=>api.done(Math.max(0,V.length-err),V.length),700);return}len++;Scope.after(()=>{build();play()},1100)}}
    else{err++;phase='wait';sfx.bad();flash(p);toast('انتبه للترتيب… شاهد مرة أخرى');Scope.after(play,1200)}};
  $('#again',st).onclick=()=>{if(phase==='input')play()};build();Scope.after(play,600);
};

/* 24 treasure chests */
MECH.chests=(st,c,api)=>{let q=0,sc=0,first=true,busy=false;
  const round=()=>{const Q=c.qs[q];first=true;busy=false;
    st.innerHTML=`<div class="chest-wrap"><div class="qcard">${Q.q} ${spk(Q.q)}</div>${Q.surah?`<details style="width:100%;max-width:620px"><summary class="btn white" style="list-style:none">📖 اعرض السورة لأعدّ</summary><div class="qbox" style="font-size:26px;margin-top:8px">${c.surah}</div></details>`:''}<div class="chest" id="ch"><div class="body"><div class="band"></div></div><div class="lid"><div class="band"></div></div><div class="gem">💎</div><div class="lock">🔒</div></div><div class="keys">${shuffle(Q.keys.map((k,i)=>({k,i}))).map(o=>`<button class="key" data-i="${o.i}">🗝️ ${o.k}</button>`).join('')}</div><p class="tap-hint">اسحب المفتاح الصحيح إلى القفل أو اضغط عليه</p></div>`;
    api.hud(`<span class="h">صندوق ${AR(q+1)} من ${AR(c.qs.length)}</span><span class="h">💎 ${AR(sc)}</span>`);TTS.say(Q.q);
    const tryKey=b=>{if(busy)return false;if(+b.dataset.i===Q.ok){busy=true;b.classList.add('good');const ch=$('#ch',st);$('.lock',ch).textContent='🔓';sfx.coin();Scope.after(()=>{ch.classList.add('open');sfx.bell()},250);if(first)sc++;TTS.say(Q.note||'');toast('✔ '+(Q.note||'أحسنت'));
        Scope.after(()=>{q++;q<c.qs.length?round():api.done(sc,c.qs.length)},2300);return 'keep'}first=false;sfx.bad();flash(b);flash($('#ch',st));return false};
    $$('.key',st).forEach(b=>dragify(b,{onDrop:(u,e,{moved})=>{if(!moved)return tryKey(b);const on=u&&u.closest('.chest');return on?tryKey(b):false}}));
  };round();
};

/* 25 hearts for parents */
MECH.hearts=(st,c,api)=>{let i=0,err=0,cnt={m:0,f:0};
  st.innerHTML=`<div class="scene" style="min-height:0"><div class="cast">${P('man','happy',80)}<div class="bub" id="ask" style="font-size:22px"></div></div></div><div class="hp-row"><button class="parent" data-a="m">${P('mom','happy',86)}أُمُّكَ<span class="heart" id="hm">❤️</span><span class="tally" id="tm"></span></button><button class="parent" data-a="f">${P('dad','happy',86)}أَبُوكَ<span class="heart" id="hf">💙</span><span class="tally" id="tf"></span></button></div><div id="sum"></div>`;
  const ask=()=>{$('#ask',st).innerHTML=`${c.steps[i]}`;api.hud(`<span class="h">السؤال ${AR(i+1)} من ${AR(c.steps.length)}</span><span class="h">ماذا أجاب الرسول ﷺ؟</span>`);TTS.say(c.steps[i])};
  $$('.parent',st).forEach(b=>b.onclick=()=>{if(i>=c.steps.length)return;const a=b.dataset.a;
    if(a===c.ans[i]){cnt[a]++;sfx.ok();$('#h'+a,st).style.transform=`scale(${1+cnt[a]*.45})`;$('#t'+a,st).textContent='× '+AR(cnt[a]);TTS.say(a==='m'?'أمك':'ثم أبوك');i++;
      if(i<c.steps.length)Scope.after(ask,900);else{$('#sum',st).innerHTML=`<div class="phrase">${c.sum}</div>`;TTS.say(c.sum);api.done(Math.max(0,c.steps.length-err),c.steps.length)}}
    else{err++;sfx.bad();flash(b);toast(i<3?'تذكّر: الأم أولًا… أعاد الرسول ﷺ ذكرها ثلاث مرات':'بعد الأم ثلاث مرات يأتي الأب')}});
  ask();
};

/* 26 fishing */
MECH.fishing=(st,c,api)=>{let sc=0,lives=3,over=false,fish=[],hook={s:'idle',x:.5,y:0,caught:null},bx=.5,t0=performance.now();
  st.innerHTML=`<div class="area sea" id="se"><div class="boat" id="bt">${P('man','happy',46)}<span class="hull">🚣</span></div><div class="fline" id="fl"></div><div class="hook" id="hk">🪝</div></div><div class="center" style="margin-top:10px"><button class="btn rasp" id="cast">🎣 ارمِ الصنارة</button></div><p class="tap-hint">يتحرك القارب وحده… اضغط «ارمِ» عندما يكون فوق سمكة جميلة</p>`;
  const se=$('#se',st),bt=$('#bt',st),fl=$('#fl',st),hk=$('#hk',st);
  const hud=()=>api.hud(`<span class="h">🐟 ${AR(sc)} / ${AR(c.goal)}</span><span class="h">${'❤️'.repeat(lives)}${'🤍'.repeat(3-lives)}</span>`);hud();
  const lanes=[.34,.5,.66,.82];
  const add=(lane)=>{const good=Math.random()<.55,src=good?c.good:c.bad,t=src[ri(0,src.length-1)],dir=Math.random()<.5?1:-1;const el=html(`<div class="fish"><span class="e" style="transform:scaleX(${dir>0?-1:1})">${good?'🐠':'🐡'}</span><span class="t">${t}</span></div>`);se.appendChild(el);fish.push({el,x:dir>0?-.15:1.15,lane,v:rand(.0018,.003)*dir,good,t})};
  lanes.forEach((l,i)=>{add(l);});
  const cast=()=>{if(over||hook.s!=='idle')return;hook.s='down';hook.x=bx;hook.y=.2;sfx.whoosh()};
  $('#cast',st).onclick=cast;Scope.on(se,'pointerdown',cast);
  Scope.loop((dt,now)=>{if(over)return;const W=se.clientWidth,H=se.clientHeight;bx=.5+.38*Math.sin((now-t0)/2300);bt.style.left=bx*100+'%';
    fish.forEach(f=>{if(f===hook.caught)return;f.x+=f.v*dt;if(f.x>1.2||f.x<-.2){f.el.remove();f.dead=1}f.el.style.left=f.x*100+'%';f.el.style.top=(f.lane*100-5)+'%'});
    fish=fish.filter(f=>!f.dead);lanes.forEach(l=>{if(!fish.some(f=>f.lane===l))add(l)});
    if(hook.s==='idle'){hook.x=bx;hook.y=.2}
    else if(hook.s==='down'){hook.y+=.012*dt;const hit=fish.find(f=>Math.abs(f.lane-hook.y)<.05&&Math.abs(f.x-hook.x)*W<60);if(hit){hook.caught=hit;hook.s='up';sfx.pop()}else if(hook.y>.95)hook.s='up'}
    else if(hook.s==='up'){hook.y-=.016*dt;if(hook.caught){hook.caught.x=hook.x;hook.caught.el.style.left=hook.x*100+'%';hook.caught.el.style.top=(hook.y*100-4)+'%'}
      if(hook.y<=.2){hook.s='idle';const f=hook.caught;hook.caught=null;if(f){f.el.remove();f.dead=1;fish=fish.filter(x=>x!==f);

/* 33 finger tracing */
MECH.trace=(st,c,api)=>{let pi=0,tot=0;

    const tb=$('#tb',st),g=$('#g',st),d=$('#d',st),gx=g.getContext('2d'),dx=d.getContext('2d');let W,H,pts=[],hit,grid={},cell=24,lw,last=null,pct=0,fin=false;
    const setup=()=>{W=g.width=d.width=tb.clientWidth;H=g.height=d.height=tb.clientHeight;const f=`800 ${Math.round(H*.5)}px 'Baloo Bhaijaan 2',Tahoma,sans-serif`;
      const m=document.createElement('canvas');m.width=W;m.height=H;const mx=m.getContext('2d');let fs=Math.round(H*.55);mx.font=`800 ${fs}px 'Baloo Bhaijaan 2',Tahoma,sans-serif`;while(mx.measureText(PH.guide).width>W*.9&&fs>20){fs-=2;mx.font=`800 ${fs}px 'Baloo Bhaijaan 2',Tahoma,sans-serif`}
      [mx,gx].forEach(x=>{x.font=`800 ${fs}px 'Baloo Bhaijaan 2',Tahoma,sans-serif`;x.textAlign='center';x.textBaseline='middle';x.direction='rtl'});
      mx.fillStyle='#000';mx.fillText(PH.guide,W/2,H*.55);
      gx.fillStyle='#EEF3F6';gx.fillText(PH.guide,W/2,H*.55);gx.setLineDash([4,6]);gx.lineWidth=2.5;gx.strokeStyle='#8AA0B3';gx.strokeText(PH.guide,W/2,H*.55);
      gx.setLineDash([]);gx.strokeStyle='#E7EDF1';gx.lineWidth=2;[.25,.85].forEach(y=>{gx.beginPath();gx.moveTo(10,H*y);gx.lineTo(W-10,H*y);gx.stroke()});
      const data=mx.getImageData(0,0,W,H).data;const step=Math.max(4,Math.round(fs/14));pts=[];for(let y=0;y<H;y+=step)for(let x=0;x<W;x+=step)if(data[(y*W+x)*4+3]>128)pts.push([x,y]);
      hit=new Uint8Array(pts.length);grid={};cell=Math.max(16,Math.round(fs/5));pts.forEach((p,k)=>{const key=((p[0]/cell)|0)+','+((p[1]/cell)|0);(grid[key]=grid[key]||[]).push(k)});lw=Math.max(12,fs*.16);
      dx.lineCap='round';dx.lineJoin='round';dx.lineWidth=lw;dx.strokeStyle='#E0457B'};
    const mark=(x,y)=>{const R=lw*.95,cx=(x/cell)|0,cy=(y/cell)|0;for(let i=-2;i<=2;i++)for(let j=-2;j<=2;j++){const a=grid[(cx+i)+','+(cy+j)];if(a)a.forEach(k=>{if(!hit[k]&&Math.hypot(pts[k][0]-x,pts[k][1]-y)<R)hit[k]=1})}};
    const upd=()=>{let n=0;for(const v of hit)n+=v;pct=pts.length?Math.round(100*n/pts.length):0;$('#tm',st).style.width=pct+'%';$('#fin',st).disabled=pct<70;if(pct>=92&&!fin)finish()};
    const pos=e=>{const r=d.getBoundingClientRect();return [e.clientX-r.left,e.clientY-r.top]};
    d.addEventListener('pointerdown',e=>{last=pos(e);try{d.setPointerCapture(e.pointerId)}catch(_){}dx.beginPath();dx.moveTo(...last);dx.lineTo(...last);dx.stroke();mark(...last);upd()});
    d.addEventListener('pointermove',e=>{if(!last)return;const p=pos(e);dx.beginPath();dx.moveTo(...last);dx.lineTo(...p);dx.stroke();const steps=Math.ceil(Math.hypot(p[0]-last[0],p[1]-last[1])/6);for(let s=1;s<=steps;s++)mark(last[0]+(p[0]-last[0])*s/steps,last[1]+(p[1]-last[1])*s/steps);last=p;upd()});
    ['pointerup','pointercancel','pointerleave'].forEach(ev=>d.addEventListener(ev,()=>{last=null}));
    $('#clr',st).onclick=()=>{dx.clearRect(0,0,W,H);hit.fill(0);upd();sfx.whoosh()};
    const finish=()=>{if(fin)return;fin=true;tot+=pct;sfx.ok();TTS.say(PH.show);Scope.after(()=>{pi++;pi<c.phrases.length?round():api.done(tot/c.phrases.length>=85?3:2,3,tot/c.phrases.length>=85?3:2)},900)};

      else{err++;sfx.bad();b.classList.add('wrong');b.disabled=true;flash(me)}})};
