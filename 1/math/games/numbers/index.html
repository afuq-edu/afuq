<!doctype html>
<html lang="ar" dir="rtl">
<head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>أرقام وأشكال</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;600;700;800&family=Tajawal:wght@400;500;700;800&display=swap">
<style>
:root{
  color-scheme: light;
  --sky:#EAF4FB; --sky2:#D9ECF8; --paper:#FFFFFF; --ink:#1C3346; --ink2:#587086; --line:#D3E4F0;
  --blue:#1A8FD8; --blue-d:#0F6FAD; --blue-l:#DDEFFC;
  --yellow:#F2BC16; --yellow-d:#B98700; --yellow-l:#FFF4CC;
  --green:#4BB548; --green-d:#2F8A2D; --green-l:#E1F6DF;
  --coral:#EE5D52; --coral-l:#FFE3E0; --plum:#8A5BD0; --plum-l:#EFE6FC; --orange:#F28A1E;
  --ok:#2FA84F; --bad:#E0473C;
  --r-s:12px; --r-m:18px; --r-l:26px;
  --sh:0 2px 0 rgba(28,51,70,.08), 0 8px 24px -12px rgba(28,51,70,.28);
  --f-disp:"Baloo Bhaijaan 2","Tajawal","Segoe UI",Tahoma,sans-serif;
  --f-body:"Tajawal","Segoe UI",Tahoma,Arial,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--sky);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.6;direction:rtl;overflow-x:hidden}
button{font-family:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--plum);outline-offset:2px}
.num,.disp{font-family:var(--f-disp)}
h1,h2,h3{font-family:var(--f-disp);margin:0;line-height:1.25;text-wrap:balance}
[hidden]{display:none!important}
svg{max-width:100%}

/* ---------- shell ---------- */
#app{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:14px 60px}
.topbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:6px 14px}
.brand{display:flex;align-items:center;gap:12px;margin-inline-end:auto}
.brand h1{font-size:clamp(26px,4.2vw,38px);font-weight:800;letter-spacing:0}
.brand h1 b{color:var(--blue)} .brand h1 i{font-style:normal;color:var(--yellow-d)} .brand h1 u{text-decoration:none;color:var(--green-d)}
.brand small{display:block;font-size:14px;color:var(--ink2);font-weight:500}
.iconbtn{width:46px;height:46px;border-radius:14px;background:var(--paper);box-shadow:var(--sh);font-size:21px;display:grid;place-items:center;transition:transform .15s}
.iconbtn:active{transform:scale(.92)} .iconbtn.off{opacity:.45}
.pillbtn{display:inline-flex;align-items:center;gap:8px;height:46px;padding-inline:16px;border-radius:14px;background:var(--paper);box-shadow:var(--sh);font-weight:700;font-size:16px}

.hero{display:grid;grid-template-columns:1.3fr 1fr;gap:16px;margin-bottom:18px}
@media (max-width:820px){.hero{grid-template-columns:1fr}}
.card{background:var(--paper);border-radius:var(--r-l);box-shadow:var(--sh);padding:18px}
.hero .welcome{display:flex;gap:16px;align-items:center;background:linear-gradient(135deg,#fff 0,#fff 55%,var(--yellow-l) 100%)}
.hero .welcome h2{font-size:clamp(22px,3vw,28px)}
.hero .welcome p{margin:.3em 0 0;color:var(--ink2)}
.stats{display:flex;gap:10px;margin-top:10px;flex-wrap:wrap}
.stat{background:var(--sky);border-radius:14px;padding:6px 12px;font-weight:700;font-size:15px}
.stat b{font-family:var(--f-disp);font-size:20px;color:var(--blue-d)}

.levels{display:flex;flex-direction:column;gap:8px}
.levels h3{font-size:18px}
.levels .row{display:flex;gap:8px;flex-wrap:wrap}
.lvl{flex:1 1 90px;border-radius:16px;padding:8px 10px;background:var(--sky);border:2px solid transparent;text-align:center;font-weight:800;font-size:16px;transition:.15s}
.lvl small{display:block;font-weight:500;font-size:12.5px;color:var(--ink2);line-height:1.3}
.lvl.on{background:var(--paper);border-color:var(--lc);box-shadow:0 0 0 4px color-mix(in srgb,var(--lc) 20%,transparent)}
.lvl[data-l="1"]{--lc:var(--green)} .lvl[data-l="2"]{--lc:var(--blue)} .lvl[data-l="3"]{--lc:var(--plum)}
.levels p{margin:0;font-size:13.5px;color:var(--ink2)}

.tabs{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:4px 0 14px}
.tab{padding:10px 18px;border-radius:999px;background:var(--paper);box-shadow:var(--sh);font-weight:800;font-size:17px;font-family:var(--f-disp)}
.tab.on{background:var(--ink);color:#fff}
.legend{display:flex;gap:12px;margin-inline-start:auto;flex-wrap:wrap;font-size:14px;color:var(--ink2);font-weight:700}
.legend span::before{content:"";display:inline-block;width:12px;height:12px;border-radius:4px;background:var(--c);margin-inline-end:6px;vertical-align:-1px}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.lcard{position:relative;text-align:right;background:var(--paper);border-radius:var(--r-m);box-shadow:var(--sh);padding:14px 14px 12px;border-top:7px solid var(--sc);display:flex;flex-direction:column;gap:6px;transition:transform .15s,box-shadow .15s;min-height:168px}
.lcard:hover{transform:translateY(-3px)}
.lcard .pg{position:absolute;top:10px;left:12px;font-family:var(--f-disp);font-size:13px;font-weight:700;color:var(--ink2);background:var(--sky);border-radius:8px;padding:0 8px}
.lcard .ico{width:56px;height:56px;border-radius:16px;background:var(--sl);display:grid;place-items:center;font-size:30px}
.lcard .ico svg{width:40px;height:40px}
.lcard h3{font-size:19px;font-weight:700}
.lcard .no{font-size:13px;color:var(--ink2);font-weight:700}
.lcard .steps{display:flex;gap:5px;margin-top:auto}
.lcard .steps i{flex:1;height:7px;border-radius:5px;background:var(--line)}
.lcard .steps i.d{background:var(--sc)}
.lcard .sc{font-size:13px;color:var(--ink2);font-weight:700;display:flex;gap:8px}
.s-n{--sc:var(--blue);--sl:var(--blue-l)} .s-g{--sc:var(--yellow);--sl:var(--yellow-l)} .s-m{--sc:var(--green);--sl:var(--green-l)}

/* ---------- lesson page ---------- */
.lhead{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.lhead .t{margin-inline-end:auto;display:flex;gap:12px;align-items:center}
.lhead .ico{width:64px;height:64px;border-radius:18px;background:var(--sl);display:grid;place-items:center;font-size:34px;border:3px solid var(--sc)}
.lhead h2{font-size:clamp(24px,3.6vw,34px)}
.lhead small{color:var(--ink2);font-weight:700;font-size:14px}
.goal{background:var(--paper);border-radius:var(--r-m);padding:12px 16px;box-shadow:var(--sh);margin-bottom:16px;display:flex;gap:10px;align-items:flex-start;border-inline-start:6px solid var(--sc)}
.goal b{font-family:var(--f-disp);color:var(--sc)}
.path{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
@media (max-width:900px){.path{grid-template-columns:repeat(2,1fr)}}
@media (max-width:440px){.path{grid-template-columns:1fr}}
.stepc{background:var(--paper);border-radius:var(--r-m);box-shadow:var(--sh);padding:16px 14px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px;position:relative;transition:transform .15s;min-height:190px}
.stepc:hover{transform:translateY(-3px)}
.stepc .n{position:absolute;top:10px;right:12px;width:30px;height:30px;border-radius:50%;background:var(--sky);font-family:var(--f-disp);font-weight:800;display:grid;place-items:center;font-size:16px}
.stepc .big{font-size:44px;line-height:1.1;margin-top:8px}
.stepc h3{font-size:19px}
.stepc p{margin:0;font-size:14px;color:var(--ink2);line-height:1.4}
.stepc .st{margin-top:auto;font-weight:800;font-size:14px;border-radius:999px;padding:3px 12px;background:var(--sky)}
.stepc .st.ok{background:var(--green-l);color:var(--green-d)}
.stepc.pre{border-bottom:6px solid var(--green)} .stepc.show{border-bottom:6px solid var(--blue)} .stepc.game{border-bottom:6px solid var(--orange)} .stepc.post{border-bottom:6px solid var(--plum)}
.compare{margin-top:16px}

/* ---------- stage (full screen) ---------- */
.stage{position:fixed;inset:0;background:var(--sky);z-index:50;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);animation:stIn .25s ease}
@keyframes stIn{from{opacity:0;transform:translateY(12px)}}
.sbar{display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--paper);box-shadow:0 2px 10px -6px rgba(0,0,0,.25);z-index:2}
.sbar h3{font-size:clamp(17px,2.4vw,22px);margin-inline-end:auto;display:flex;align-items:center;gap:8px}
.sbar .tag{font-family:var(--f-body);font-size:13px;font-weight:800;padding:2px 10px;border-radius:999px;background:var(--tc,var(--sky));color:#fff}
.sbody{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;align-items:center}
.sin{width:100%;max-width:980px;display:flex;flex-direction:column;gap:14px;flex:1}
.dots{display:flex;gap:5px;flex-wrap:wrap;justify-content:center}
.dots i{width:12px;height:12px;border-radius:50%;background:var(--line)}
.dots i.cur{background:var(--blue);transform:scale(1.25)} .dots i.ok{background:var(--ok)} .dots i.no{background:var(--coral)}

.qcard{background:var(--paper);border-radius:var(--r-l);box-shadow:var(--sh);padding:18px;display:flex;flex-direction:column;gap:14px;align-items:center;position:relative}
.qtext{display:flex;gap:10px;align-items:center;justify-content:center;font-size:clamp(20px,2.8vw,27px);font-weight:800;text-align:center;font-family:var(--f-disp);line-height:1.4}
.say{width:42px;height:42px;flex:none;border-radius:50%;background:var(--blue-l);font-size:20px;display:grid;place-items:center}
.vis{width:100%;display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:12px}
.opts{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;width:100%}
.opt{min-width:84px;min-height:78px;padding:8px 16px;border-radius:20px;background:var(--sky);border:3px solid var(--line);font-family:var(--f-disp);font-size:34px;font-weight:800;display:grid;place-items:center;transition:transform .12s,background .15s;box-shadow:0 4px 0 var(--line)}
.opt:hover{transform:translateY(-2px)} .opt:active{transform:translateY(2px);box-shadow:none}
.opt.sm{font-size:22px;min-height:60px}
.opt.pic{padding:10px;font-size:18px}
.opt.good{background:var(--green-l);border-color:var(--ok);box-shadow:0 4px 0 var(--ok)}
.opt.wrong{background:var(--coral-l);border-color:var(--bad);box-shadow:0 4px 0 var(--bad);animation:shake .4s}
.opt[disabled]{pointer-events:none}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.shake{animation:shake .4s}
.hintbtn{position:absolute;top:12px;left:12px;background:var(--yellow-l);border-radius:999px;padding:4px 12px;font-weight:800;font-size:14px}
.hintbox{background:var(--yellow-l);border:2px dashed var(--yellow);border-radius:16px;padding:10px 14px;font-weight:700;display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;text-align:center}
.fb{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--paper);border-radius:999px;box-shadow:0 10px 30px -8px rgba(0,0,0,.35);padding:10px 22px 10px 14px;display:flex;align-items:center;gap:10px;font-family:var(--f-disp);font-size:22px;font-weight:800;z-index:80;animation:pop .3s}
.fb.ok{color:var(--ok)} .fb.no{color:var(--bad)}
@keyframes pop{from{transform:translateX(-50%) scale(.6);opacity:0}}
.btn{border-radius:16px;padding:12px 22px;font-weight:800;font-size:18px;background:var(--blue);color:#fff;box-shadow:0 4px 0 var(--blue-d);font-family:var(--f-disp)}
.btn:active{transform:translateY(3px);box-shadow:none}
.btn.g{background:var(--green);box-shadow:0 4px 0 var(--green-d)} .btn.y{background:var(--yellow);color:var(--ink);box-shadow:0 4px 0 var(--yellow-d)}
.btn.w{background:var(--paper);color:var(--ink);box-shadow:0 4px 0 var(--line);border:2px solid var(--line)}
.btn.p{background:var(--plum);box-shadow:0 4px 0 #5f3aa0}
.btn[disabled]{opacity:.4;pointer-events:none}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;align-items:center}

/* keypad */
.kp{display:grid;grid-template-columns:repeat(5,64px);gap:8px;justify-content:center}
.kp button{height:58px;border-radius:14px;background:var(--sky);font-family:var(--f-disp);font-size:28px;font-weight:800;box-shadow:0 3px 0 var(--line)}
.kpout{min-width:130px;height:70px;border-radius:18px;border:3px dashed var(--blue);font-family:var(--f-disp);font-size:44px;font-weight:800;display:grid;place-items:center;color:var(--blue-d);background:var(--blue-l)}
@media (max-width:420px){.kp{grid-template-columns:repeat(5,52px)}}

/* order / sort / match / build */
.slots{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;min-height:84px;padding:8px;border-radius:18px;background:var(--sky);width:100%}
.slot{min-width:74px;min-height:70px;border-radius:14px;border:3px dashed #b7cfe0;display:grid;place-items:center;font-family:var(--f-disp);font-size:30px;font-weight:800;background:#fff}
.tile{min-width:74px;min-height:70px;padding:6px 10px;border-radius:16px;background:#fff;border:3px solid var(--line);box-shadow:0 4px 0 var(--line);display:grid;place-items:center;font-family:var(--f-disp);font-size:30px;font-weight:800;transition:.15s}
.tile.sel{border-color:var(--plum);box-shadow:0 0 0 4px var(--plum-l);transform:translateY(-4px)}
.tile.used{opacity:.25;pointer-events:none}
.tile.done{border-color:var(--ok);background:var(--green-l)}
.bins{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;width:100%}
.bin{min-height:140px;border-radius:20px;border:3px dashed var(--bc,#b7cfe0);background:color-mix(in srgb,var(--bc,#b7cfe0) 10%,#fff);padding:8px;display:flex;flex-direction:column;align-items:center;gap:6px}
.bin>b{font-family:var(--f-disp);font-size:21px}
.bin .in{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.bin .in>*{transform:scale(.8)}
.mcols{display:grid;grid-template-columns:1fr 1fr;gap:18px 40px;width:100%;max-width:620px}
.mcols .col{display:flex;flex-direction:column;gap:12px}
.mcols .tile{width:100%}
.mcols .tile.m1{background:#E1F6DF;border-color:#4BB548}.mcols .tile.m2{background:#DDEFFC;border-color:#1A8FD8}.mcols .tile.m3{background:#FFF4CC;border-color:#F2BC16}.mcols .tile.m4{background:#EFE6FC;border-color:#8A5BD0}.mcols .tile.m5{background:#FFE3E0;border-color:#EE5D52}.mcols .tile.m6{background:#E6F7F6;border-color:#27A59C}
.tray{min-height:90px;width:100%;border-radius:18px;background:var(--sky);display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center;padding:8px}
.total{font-family:var(--f-disp);font-size:26px;font-weight:800}

/* results */
.result{text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px;padding:10px}
.stars{font-size:54px;letter-spacing:6px}
.stars .off{filter:grayscale(1);opacity:.3}
.bars{display:flex;gap:28px;align-items:flex-end;justify-content:center;height:190px;padding-top:10px}
.bar{width:74px;border-radius:14px 14px 6px 6px;position:relative;display:flex;justify-content:center;transition:height .8s cubic-bezier(.2,.9,.3,1.2)}
.bar span{position:absolute;top:-34px;font-family:var(--f-disp);font-weight:800;font-size:22px}
.bar em{position:absolute;bottom:-30px;font-style:normal;font-weight:800;font-size:15px;white-space:nowrap}

/* slides */
.slide{background:var(--paper);border-radius:var(--r-l);box-shadow:var(--sh);padding:20px;display:flex;flex-direction:column;gap:14px;align-items:center;flex:1;min-height:340px;animation:slin .35s ease}
@keyframes slin{from{opacity:0;transform:translateX(-30px)}}
.slide h2{font-size:clamp(22px,3.2vw,32px);text-align:center;color:var(--sc,var(--ink))}
.slide .txt{font-size:clamp(18px,2.3vw,22px);font-weight:700;text-align:center;max-width:720px;line-height:1.6}
.snav{display:flex;align-items:center;gap:12px;justify-content:center;flex-wrap:wrap}
.note{background:var(--blue-l);border-radius:14px;padding:8px 14px;font-weight:700;text-align:center}
.vocab{display:inline-flex;gap:6px;align-items:center;background:var(--coral-l);color:#b0322a;border-radius:999px;padding:2px 12px;font-weight:800;font-size:15px}

/* objects & visuals */
.objs{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;max-width:560px}
.objs>span{font-size:var(--os,40px);line-height:1.1;position:relative;display:inline-grid;place-items:center;transition:transform .15s;user-select:none}
.objs.tc>span{cursor:pointer}
.objs>span.c{transform:scale(.9);filter:saturate(1.2)}
.objs>span .bd{position:absolute;top:-6px;left:-6px;background:var(--plum);color:#fff;font-family:var(--f-disp);font-size:15px;min-width:24px;height:24px;border-radius:12px;display:grid;place-items:center;font-weight:800;animation:pop2 .25s}
@keyframes pop2{from{transform:scale(0)}}
.grp{border:3px solid var(--line);border-radius:18px;padding:10px;background:#fff;display:flex;flex-wrap:wrap;gap:4px;justify-content:center;align-items:center}
.bignum{font-family:var(--f-disp);font-size:clamp(70px,12vw,130px);font-weight:800;line-height:1;color:var(--c,var(--blue))}
.tf{display:inline-grid;grid-template-columns:repeat(5,var(--cs,46px));grid-template-rows:repeat(2,var(--cs,46px));gap:4px;background:#8C9BA8;padding:5px;border-radius:10px}
.tf>i{background:#fff;border-radius:4px;display:grid;place-items:center;cursor:default}
.tf>i>b{width:78%;height:78%;border-radius:50%;display:block;box-shadow:inset -3px -3px 0 rgba(0,0,0,.18);animation:pop2 .2s}
.tf.tap>i{cursor:pointer}
.cr{background:#E8413A}.cy{background:#F6CF1B}.cg{background:#35A949}.cb{background:#4A86D8}.cp{background:#9B5BD4}.co{background:#F28A1E}
.ntrack{display:flex;flex-wrap:wrap;justify-content:center;gap:0;border:2px solid #6E7FC0;border-radius:6px;overflow:hidden;background:#fff}
.ntrack>span{width:var(--w,48px);height:52px;display:grid;place-items:center;font-family:var(--f-disp);font-size:26px;font-weight:800;border-inline-start:2px solid #6E7FC0;cursor:pointer;transition:background .15s}
.ntrack>span:first-child{border-inline-start:0}
.ntrack>span.hl{background:var(--yellow-l);transform:scale(1.05)}
.hsq{display:grid;grid-template-columns:repeat(10,minmax(26px,1fr));gap:2px;background:#8FC6CF;padding:3px;border-radius:8px;width:100%;max-width:560px;direction:rtl}
.hsq>span{background:#FFFBE8;aspect-ratio:1;display:grid;place-items:center;font-family:var(--f-disp);font-weight:800;font-size:clamp(12px,2.1vw,19px);cursor:pointer;border-radius:2px;transition:background .2s,transform .2s}
.hsq>span.hl{background:var(--hc,#FFD447);transform:scale(1.08)}
.hsq>span.hid{color:transparent;background:#BFD8E3}
.clockw{display:inline-block}
.jarw{display:inline-flex;flex-direction:column;align-items:center;gap:4px;font-weight:800}
.bal{position:relative;width:min(420px,92vw);height:230px}
.bal .post{position:absolute;left:50%;bottom:10px;width:16px;height:150px;margin-left:-8px;background:linear-gradient(90deg,#b46bd8,#8a3fb3);border-radius:8px}
.bal .base{position:absolute;left:50%;bottom:0;width:130px;height:24px;margin-left:-65px;background:#8a3fb3;border-radius:60px 60px 10px 10px}
.bal .beam{position:absolute;left:10%;right:10%;top:62px;height:12px;background:#9c4ec5;border-radius:6px;transform:rotate(var(--ang,0deg));transition:transform .9s cubic-bezier(.3,1.5,.5,1)}
.bal .pan{position:absolute;top:70px;width:34%;display:flex;flex-direction:column;align-items:center;transition:transform .9s cubic-bezier(.3,1.5,.5,1)}
.bal .pan .dish{width:100%;height:18px;background:#c378e8;border-radius:0 0 90px 90px}
.bal .pan .load{min-height:56px;display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:center;font-size:44px;line-height:1;gap:2px;padding-inline:4px}
.bal .pan .str{width:70%;height:30px;border-left:2px solid #9c4ec5;border-right:2px solid #9c4ec5;border-top:0;margin-bottom:-2px}
.bal .pan.l{left:0} .bal .pan.r{right:0}
.bal .top{position:absolute;left:50%;top:52px;width:26px;height:26px;margin-left:-13px;border-radius:50%;background:#8a3fb3}

"use strict";
/* ================= utilities ================= */

  S.arena.append(basket);

  st.body.append(ctl);
  const drop = () => { if (!W()) return; const f = g.fall(lv); const e = h('div', { class: 'itm', html: f.html, style: `top:-60px;left:${rnd(8, 88)}%;transform:translateX(-50%);font-size:${f.size || 30}px;min-width:56px;min-height:56px;border-radius:50%;background:${f.bg || '#fff'};box-shadow:0 3px 8px rgba(0,0,0,.2);padding:4px` }); S.arena.append(e); items.push({ e, y: -60, good: f.good, v: [0, 1.4, 1.9, 2.5][lv] * (0.8 + Math.random() * .5) }); };
  stI(drop, [0, 1700, 1300, 1000][lv]); drop();
  function loop() {
    if (!W()) return; const H0 = S.arena.clientHeight, W0 = S.arena.clientWidth;
    items.forEach(it => {

      }

/* ---- 8 frog on number line ---- */
GAMES.frog = (st, g, lv, done) => {
  const R = g.rounds || 6, S = gShell(st, R, { bg: 'linear-gradient(#9FDDFB,#5DB7E8)' }); let r = 0, first, it, pads = [], frog, at;
  S.arena.style.minHeight = '260px';
  function build() {
    S.arena.innerHTML = ''; pads = [];
    const n = it.to - it.from + 1;
    for (let v = it.from; v <= it.to; v++) {
      const k = v - it.from, p = h('div', { class: 'pad', style: `right:${2 + k * (96 / n)}%;width:${Math.min(8, 90 / n)}%` }, AR(v)); p._v = v;
      p.onclick = () => jump(v); S.arena.append(p); pads.push(p);
    }
    frog = h('div', { class: 'frog' }, '🐸'); S.arena.append(frog); at = it.start; placeFrog(at);
  }
  function placeFrog(v) { const p = pads[v - it.from]; if (!p) return; frog.style.right = `calc(${p.style.right} + ${parseFloat(p.style.width) / 2}% - 20px)`; frog.style.bottom = `calc(22% + ${p.offsetHeight * .6}px)`; }
  async function jump(v) {

    const step = v > at ? 1 : -1;
    while (at !== v && W()) { at += step; SFX.jump(); frog.style.bottom = `calc(22% + ${pads[0].offsetHeight + 40}px)`; placeFrog(at); await sleep(220); frog.style.bottom = `calc(22% + ${pads[0].offsetHeight * .6}px)`; await sleep(200); }
    if (!W()) return;
    if (v === it.ans) { pads[v - it.from].style.background = '#FFD447'; if (first) S.add(); feedback(true); stT(round, 1100); }
    else { first = false; feedback(false); pads[v - it.from].classList.add('shake'); stT(() => { at = it.start; placeFrog(at); S._busy = false; }, 900); return; }
  }
  function round() { if (!W()) return; if (r >= R) return done(S.score, R); r++; S.round(r); first = true; S._busy = false; it = g.item(lv); S.setQ(it.q, it.say); build(); }
  round();
};

const LV = (lv, a, b, c) => [a, b, c][lv - 1];

const MIX = ['🍎', '⭐', '🐟', '🌸', '🚗', '🎈', '🐞', '🍓', '⚽', '🐚', '🧁', '🦋', '🐤', '🍩'];
const dots = (n, c = '#4A86D8', s = 18) => `<div style="display:grid;grid-template-columns:repeat(${n > 6 ? 5 : 3},${s}px);gap:4px;justify-content:center">${range(1, n).map(() => `<i style="width:${s}px;height:${s}px;border-radius:50%;background:${c};display:block"></i>`).join('')}</div>`;
const handsPair = (a, b, s = 70) => `<div class="row" style="gap:4px;flex-wrap:nowrap">${V.hand(a, undefined, s)}${V.hand(b, undefined, s, '#35A949')}</div>`;
const withAns = (ans, pool, k) => shuffle([ans, ...shuffle(uniq(pool.map(String))).filter(x => x !== String(ans)).map(x => typeof ans === 'number' ? +x : x)].slice(0, k));
const small = t => `<span style="font-size:20px">${t}</span>`;
