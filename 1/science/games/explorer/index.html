<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>مُستكشِف العلوم</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@400;500;600;700;800&display=swap">
<style>:root{
  --ink:#1D3B4F; --ink2:#4A6678; --muted:#7D93A3;
  --sky:#DDF1FF; --sky2:#BFE4FB; --sun:#FFC83D; --cream:#FFF9EA;
  --card:#FFFFFF; --line:#D5E7F2; --soft:#F2F9FE;
  --leaf:#34A853; --leaf-d:#23813D; --leaf-l:#E3F6E7;
  --sunflower:#F29E0C; --sunflower-d:#C47A00; --sunflower-l:#FFF1D2;
  --coral:#EE6A55; --coral-d:#C94B38; --coral-l:#FFE6E1;
  --blue:#2D98DA; --blue-d:#1C74AE; --blue-l:#E1F2FC;
  --violet:#8A67E0; --violet-l:#EFE9FC;
  --ok:#2EAF5B; --bad:#E5484D;
  --u:var(--blue); --u-d:var(--blue-d); --u-l:var(--blue-l);
  --r:22px; --fs:19px;
  --font:"Baloo Bhaijaan 2","Tajawal","Segoe UI",Tahoma,Arial,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;font-family:var(--font);font-size:var(--fs);color:var(--ink);direction:rtl;
  background:linear-gradient(180deg,#D6EEFF 0%,#EAF6FF 38%,#FFF8E4 100%) fixed;background-color:#EAF6FF;
  line-height:1.6;overflow-x:hidden}
button{font-family:inherit;color:inherit}
img,svg{max-width:100%}
.unit1{--u:var(--leaf);--u-d:var(--leaf-d);--u-l:var(--leaf-l)}
.unit2{--u:var(--sunflower);--u-d:var(--sunflower-d);--u-l:var(--sunflower-l)}
.unit3{--u:var(--coral);--u-d:var(--coral-d);--u-l:var(--coral-l)}
.unit4{--u:var(--violet);--u-d:#6A48C2;--u-l:var(--violet-l)}
.unit5{--u:var(--blue);--u-d:var(--blue-d);--u-l:var(--blue-l)}

/* decorative sky */
.sky-deco{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.sky-deco .cl{position:absolute;opacity:.85;animation:drift 60s linear infinite}
@keyframes drift{from{transform:translateX(-10vw)}to{transform:translateX(110vw)}}
.sky-deco .sunb{position:absolute;top:-60px;left:-60px;width:200px;height:200px;border-radius:50%;
  background:radial-gradient(circle,#FFE27A 0 45%,rgba(255,226,122,.35) 46% 60%,transparent 61%);animation:spin 40s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* top bar */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;display:flex;align-items:center;gap:10px;
  padding:10px 16px;background:rgba(255,255,255,.82);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border-bottom:2px solid var(--line)}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:1.15rem;cursor:pointer;color:var(--ink);white-space:nowrap}
.brand svg{width:40px;height:40px}
.brand small{display:block;font-size:.72rem;font-weight:600;color:var(--ink2);line-height:1}
.crumb{flex:1;min-width:0;font-weight:700;color:var(--ink2);font-size:.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-actions{display:flex;gap:6px}
.icon-btn{width:44px;height:44px;border-radius:14px;border:2px solid var(--line);background:#fff;font-size:1.25rem;
  display:grid;place-items:center;cursor:pointer;transition:transform .12s}
.icon-btn:active{transform:scale(.92)}
.icon-btn.off{opacity:.45;filter:grayscale(1)}

.wrap{position:relative;z-index:1;max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:18px 60px}
.screen{animation:fadeUp .35s ease both}
@keyframes fadeUp{from{opacity:.001;transform:translateY(14px)}to{opacity:1;transform:none}}

/* buttons */
.btn{--b:var(--u);--bd:var(--u-d);border:0;border-radius:18px;padding:12px 22px;font-size:1.05rem;font-weight:800;cursor:pointer;
  background:var(--b);color:#fff;box-shadow:0 5px 0 var(--bd);transition:transform .1s,box-shadow .1s;display:inline-flex;align-items:center;gap:8px;justify-content:center;min-height:52px}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--bd)}
.btn.ghost{background:#fff;color:var(--ink);box-shadow:0 5px 0 var(--line);border:2px solid var(--line)}
.btn.ok{--b:var(--ok);--bd:#1F8443}
.btn.sun{--b:var(--sun);--bd:#D79D00;color:var(--ink)}
.btn.sm{padding:8px 14px;min-height:42px;font-size:.95rem;border-radius:14px}
.btn[disabled]{opacity:.45;pointer-events:none}
:focus-visible{outline:3px solid var(--blue);outline-offset:3px}

/* home */
.hero{display:grid;grid-template-columns:1.2fr .8fr;gap:18px;align-items:center;background:#fff;border-radius:30px;padding:26px;
  border:2px solid var(--line);box-shadow:0 8px 0 rgba(29,59,79,.06);overflow:hidden;position:relative}
.hero h1{margin:0;font-size:clamp(1.8rem,4.6vw,3rem);line-height:1.2;text-wrap:balance}
.hero h1 span{color:var(--leaf)}
.hero p{margin:.4rem 0 1rem;color:var(--ink2);font-size:1.05rem}
.hero .art{display:grid;place-items:center}
.hero .art svg{width:100%;max-width:300px;height:auto}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip-i{background:var(--soft);border:2px solid var(--line);border-radius:999px;padding:4px 12px;font-weight:700;font-size:.9rem;color:var(--ink2)}
.sec-title{display:flex;align-items:center;gap:10px;margin:28px 4px 12px;font-size:1.35rem;font-weight:800}
.sec-title .pill{font-size:.85rem;background:#fff;border:2px solid var(--line);border-radius:999px;padding:2px 12px;color:var(--ink2)}
.units{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.unit-card{background:#fff;border-radius:26px;border:2px solid var(--line);overflow:hidden;display:flex;flex-direction:column;box-shadow:0 7px 0 rgba(29,59,79,.06)}
.unit-head{background:var(--u);color:#fff;padding:16px 18px 44px;position:relative}
.unit-head .num{font-size:.9rem;font-weight:700;opacity:.9}
.unit-head h3{margin:0;font-size:1.6rem;line-height:1.25}
.unit-head .big{position:absolute;left:14px;top:8px;font-size:3.2rem;filter:drop-shadow(0 4px 0 rgba(0,0,0,.12))}
.unit-head::after{content:"";position:absolute;inset:auto 0 -1px 0;height:30px;background:#fff;border-radius:50% 50% 0 0/100% 100% 0 0}
.lessons{display:flex;flex-direction:column;gap:8px;padding:4px 14px 16px}
.l-tile{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:16px;background:var(--u-l);cursor:pointer;border:2px solid transparent;transition:transform .12s,border-color .12s;text-align:right;width:100%;font-size:1rem}
.l-tile:hover{border-color:var(--u)}
.l-tile:active{transform:scale(.98)}
.l-tile .no{min-width:44px;height:44px;border-radius:14px;background:#fff;color:var(--u-d);font-weight:800;display:grid;place-items:center;font-size:.95rem}
.l-tile .tt{flex:1;font-weight:700;line-height:1.3}
.l-tile .tt small{display:block;font-weight:600;color:var(--ink2);font-size:.8rem}
.mini-stars{font-size:.8rem;letter-spacing:-2px;white-space:nowrap}
.extras{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.x-card{background:#fff;border:2px solid var(--line);border-radius:24px;padding:18px;display:flex;gap:14px;align-items:center;cursor:pointer;box-shadow:0 6px 0 rgba(29,59,79,.06);text-align:right;font-size:1rem}
.x-card .ic{font-size:2.4rem;width:64px;height:64px;border-radius:20px;background:var(--u-l);display:grid;place-items:center;flex:none}
.x-card b{font-size:1.15rem;display:block}
.x-card span{color:var(--ink2);font-size:.9rem}

/* lesson screen */
.l-header{background:#fff;border:2px solid var(--line);border-radius:28px;padding:18px 20px;display:flex;gap:16px;align-items:center;box-shadow:0 6px 0 rgba(29,59,79,.06);flex-wrap:wrap}
.l-header .badge{background:var(--u);color:#fff;font-weight:800;border-radius:18px;padding:8px 14px;font-size:1.3rem}
.l-header h2{margin:0;font-size:clamp(1.3rem,3vw,1.9rem);line-height:1.3;flex:1;min-width:220px;text-wrap:balance}
.l-header h2 small{display:block;font-size:.85rem;color:var(--ink2);font-weight:600}
.cans{display:flex;flex-direction:column;gap:6px;margin-top:14px}
.can{display:flex;gap:8px;align-items:flex-start;background:var(--u-l);border-radius:14px;padding:8px 12px;font-weight:600;font-size:.98rem}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:16px}
.step{background:#fff;border:2px solid var(--line);border-radius:22px;padding:16px 12px 14px;cursor:pointer;text-align:center;position:relative;transition:transform .12s,border-color .12s;box-shadow:0 6px 0 rgba(29,59,79,.06);font-size:1rem}
.step:hover{border-color:var(--u);transform:translateY(-2px)}
.step .ic{font-size:2.3rem;line-height:1.1}
.step b{display:block;font-size:1.1rem;margin-top:4px}
.step span{display:block;font-size:.82rem;color:var(--ink2);line-height:1.35}
.step .n{position:absolute;top:10px;right:12px;width:26px;height:26px;border-radius:50%;background:var(--u-l);color:var(--u-d);font-weight:800;font-size:.85rem;display:grid;place-items:center}
.step .st{position:absolute;top:8px;left:10px;font-size:.8rem}
.panel{background:#fff;border:2px solid var(--line);border-radius:28px;padding:18px;margin-top:16px;box-shadow:0 6px 0 rgba(29,59,79,.06)}
.panel-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.panel-head h3{margin:0;flex:1;font-size:1.3rem}
.lvl-badge{border-radius:999px;padding:4px 12px;font-weight:800;font-size:.9rem;background:var(--u-l);color:var(--u-d)}

/* slides */
.slides{position:relative}
.slide{min-height:420px;display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:center;animation:slideIn .35s ease both}
.slide.full{grid-template-columns:1fr}
@keyframes slideIn{from{opacity:.001;transform:translateX(-24px)}to{opacity:1;transform:none}}
.s-text h3{margin:0 0 8px;font-size:clamp(1.4rem,3.2vw,2rem);line-height:1.3;color:var(--u-d);text-wrap:balance}
.s-text p{margin:.35rem 0;font-size:clamp(1.1rem,2.4vw,1.35rem);line-height:1.75}
.s-text .kw{color:var(--u-d);font-weight:800;background:var(--u-l);border-radius:8px;padding:0 6px}
.s-art{display:grid;place-items:center;min-height:260px}
.s-art svg{width:100%;height:auto;max-height:420px}
.s-nav{display:flex;align-items:center;gap:10px;margin-top:14px;justify-content:space-between}
.dots{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;flex:1}
.dots i{width:12px;height:12px;border-radius:50%;background:var(--line);cursor:pointer}
.dots i.on{background:var(--u);width:28px;border-radius:8px}
.say{border:2px solid var(--line);background:#fff;border-radius:12px;width:40px;height:40px;cursor:pointer;font-size:1.1rem;display:inline-grid;place-items:center;vertical-align:middle;flex:none}
.say.speaking{background:var(--u-l);border-color:var(--u);animation:pulse .8s infinite}
@keyframes pulse{50%{transform:scale(1.1)}}
.q-list{display:flex;flex-direction:column;gap:10px;margin-top:8px}
.q-item{display:flex;gap:10px;align-items:center;background:var(--soft);border:2px solid var(--line);border-radius:16px;padding:10px 12px;font-weight:700;font-size:1.1rem}
.q-item .qa{margin-inline-start:auto}
.q-ans{display:block;color:var(--leaf-d);font-weight:700;font-size:1rem;margin-top:4px}

.scene{position:relative;width:100%;aspect-ratio:16/10;border-radius:24px;overflow:hidden;border:3px solid #fff;box-shadow:0 6px 18px rgba(29,59,79,.15)}
.scene .it{position:absolute;transform:translate(-50%,-50%);font-size:var(--s,2.4rem);cursor:pointer;line-height:1;transition:transform .15s;user-select:none;filter:drop-shadow(0 3px 2px rgba(0,0,0,.15))}
.scene .it:hover{transform:translate(-50%,-50%) scale(1.15)}
.scene .it.found{animation:found .5s}
.scene .it.done::after{content:"✔";position:absolute;top:-10px;left:-10px;font-size:.9rem;background:var(--ok);color:#fff;border-radius:50%;width:22px;height:22px;display:grid;place-items:center}
.scene .it.nope::after{content:"✖";position:absolute;top:-10px;left:-10px;font-size:.9rem;background:var(--bad);color:#fff;border-radius:50%;width:22px;height:22px;display:grid;place-items:center}
@keyframes found{50%{transform:translate(-50%,-50%) scale(1.5)}}
.tag{position:absolute;transform:translate(-50%,-130%);background:#fff;border-radius:12px;padding:3px 10px;font-size:.9rem;font-weight:800;white-space:nowrap;box-shadow:0 3px 10px rgba(0,0,0,.18);pointer-events:none;z-index:5;animation:pop .25s}
.tag.ok{color:var(--leaf-d)} .tag.no{color:var(--coral-d)}
@keyframes pop{from{transform:translate(-50%,-100%) scale(.5)}}
.bg-garden{background:linear-gradient(180deg,#9BD7FF 0 45%,#8FD16A 45% 72%,#9B6B43 72% 100%)}
.bg-meadow{background:linear-gradient(180deg,#A7DDFF 0 50%,#7FCB5E 50%)}
.bg-sea{background:linear-gradient(180deg,#9BD7FF 0 30%,#4FB3E8 30% 100%)}
.bg-desert{background:linear-gradient(180deg,#FFE0A6 0 40%,#F3C77A 40% 100%)}
.bg-farm{background:linear-gradient(180deg,#B6E3FF 0 45%,#B5DB6A 45% 100%)}
.bg-home{background:linear-gradient(180deg,#FFF1DA 0 70%,#D9A877 70% 100%)}
.bg-zoo{background:linear-gradient(180deg,#C9ECFF 0 50%,#F4DE9A 50% 100%)}
.bg-forest{background:linear-gradient(180deg,#BDE8C8 0 45%,#5FAE4E 45% 100%)}
.bg-room{background:linear-gradient(180deg,#F5EFE3 0 72%,#D8C3A0 72% 100%)}
.bg-class{background:linear-gradient(180deg,#EAF4E8 0 70%,#C9B79A 70% 100%)}
.bg-night{background:linear-gradient(180deg,#2A3A6B,#4E5F98)}

.vocab-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.flip{perspective:800px;height:150px;cursor:pointer}
.flip-in{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.flip.on .flip-in{transform:rotateY(180deg)}
.flip .f,.flip .b{position:absolute;inset:0;border-radius:20px;display:grid;place-items:center;backface-visibility:hidden;-webkit-backface-visibility:hidden;border:3px solid var(--u);text-align:center;padding:8px}
.flip .f{background:var(--u-l);font-size:3.4rem}
.flip .f small{display:block;font-size:.8rem;color:var(--ink2)}
.flip .b{background:#fff;transform:rotateY(180deg);font-size:1.35rem;font-weight:800;color:var(--u-d)}
.pts{display:grid;gap:10px}
.pt{display:flex;gap:12px;align-items:center;background:var(--u-l);border-radius:18px;padding:12px 14px;font-size:1.15rem;font-weight:700;animation:fadeUp .35s both}
.pt .e{font-size:2rem;width:52px;height:52px;background:#fff;border-radius:16px;display:grid;place-items:center;flex:none}
.act-card{border:3px dashed var(--u);border-radius:24px;padding:16px;background:var(--u-l)}
.act-card .tagx{display:inline-block;background:var(--u);color:#fff;border-radius:12px;padding:2px 14px;font-weight:800}
.need{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.need span{background:#fff;border-radius:14px;padding:6px 12px;font-weight:700;border:2px solid var(--line)}
.chk{display:flex;gap:10px;align-items:flex-start;background:#fff;border-radius:14px;padding:8px 12px;margin-top:8px;cursor:pointer;font-weight:600;font-size:1.05rem;border:2px solid transparent}
.chk .bx{width:28px;height:28px;border-radius:9px;border:3px solid var(--u);flex:none;display:grid;place-items:center;font-size:1rem;color:#fff;margin-top:2px}
.chk.on{border-color:var(--ok)} .chk.on .bx{background:var(--ok);border-color:var(--ok)}
.learned{background:linear-gradient(135deg,#FFF6D8,#FFFDF5);border:3px solid var(--sun);border-radius:26px;padding:20px}
.learned h3{margin:0 0 10px;color:#B07A00;font-size:1.7rem}
.learned .li{display:flex;gap:10px;align-items:center;font-size:1.25rem;font-weight:700;padding:8px 0;border-bottom:2px dashed #F3DE9C}
.learned .li:last-child{border:0}

/* tasks */
.prog{height:14px;border-radius:999px;background:var(--soft);border:2px solid var(--line);overflow:hidden;flex:1;min-width:120px}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--u),var(--sun));border-radius:999px;transition:width .4s}
.prompt{display:flex;gap:10px;align-items:center;background:var(--u-l);border-radius:20px;padding:12px 16px;font-size:clamp(1.15rem,2.6vw,1.45rem);font-weight:800;margin:12px 0;line-height:1.5}
.prompt .txt{flex:1}
.tip{background:#FFF8DC;border:2px dashed var(--sun);border-radius:16px;padding:8px 14px;font-weight:700;margin-top:8px;animation:fadeUp .3s}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}
.opt{background:#fff;border:3px solid var(--line);border-radius:22px;padding:12px 8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;font-weight:800;font-size:1.05rem;transition:transform .12s,border-color .12s;min-height:120px;justify-content:center;text-align:center;line-height:1.3;user-select:none}
.opt .e{font-size:3rem;line-height:1.1}
.opt .e svg{width:64px;height:64px}
.opt:hover{border-color:var(--u)}
.opt:active{transform:scale(.95)}
.opt.sel{border-color:var(--blue);background:var(--blue-l);transform:scale(1.03)}
.opt.right{border-color:var(--ok);background:#E4F7EA}
.opt.wrong{border-color:var(--bad);background:#FDE8E8;animation:shake .4s}
.opt.missed{border-color:var(--sun);border-style:dashed}
.opt.gone{opacity:.25;pointer-events:none}
.opt.txt-only{min-height:70px;font-size:1.2rem}
@keyframes shake{25%{transform:translateX(8px)}50%{transform:translateX(-8px)}75%{transform:translateX(5px)}}
.shake{animation:shake .4s}
.task-foot{display:flex;gap:10px;justify-content:space-between;align-items:center;margin-top:16px;flex-wrap:wrap}
.bins{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:14px}
.bin{border:3px dashed var(--line);border-radius:22px;min-height:150px;padding:10px;display:flex;flex-direction:column;align-items:center;gap:6px;transition:background .15s,border-color .15s;position:relative;background-size:cover}
.bin .bh{font-weight:800;font-size:1.1rem;display:flex;gap:6px;align-items:center;background:rgba(255,255,255,.88);border-radius:12px;padding:2px 10px}
.bin .bh .e{font-size:1.6rem}
.bin.hot{border-color:var(--blue);background-color:var(--blue-l);transform:scale(1.02)}
.bin .in{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;font-size:1.9rem}
.bin .in span{animation:pop2 .3s}
@keyframes pop2{from{transform:scale(0)}}
.tray{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;padding:12px;background:var(--soft);border-radius:20px;border:2px solid var(--line);min-height:96px}
.tok{background:#fff;border:3px solid var(--line);border-radius:18px;padding:6px 12px;cursor:grab;display:flex;flex-direction:column;align-items:center;font-weight:800;font-size:.95rem;user-select:none;touch-action:none;min-width:84px;transition:transform .12s}
.tok .e{font-size:2.4rem;line-height:1.15}
.tok .e svg{width:48px;height:48px}
.tok.sel{border-color:var(--blue);background:var(--blue-l);transform:scale(1.07)}
.tok.word{font-size:1.15rem;padding:10px 16px;min-width:0}
.ghost-drag{position:fixed;pointer-events:none;z-index:999;opacity:.92;transform:translate(-50%,-50%) scale(1.1);margin:0}
.match{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:12vw;max-width:680px;margin:0 auto}
.match .col{display:flex;flex-direction:column;gap:12px;position:relative;z-index:2}
.match svg.lines{position:absolute;inset:0;width:100%;height:100%;z-index:1;pointer-events:none;overflow:visible}
.m-it{background:#fff;border:3px solid var(--line);border-radius:18px;padding:8px;display:flex;align-items:center;gap:8px;cursor:pointer;font-weight:800;min-height:72px;justify-content:center;font-size:1.05rem;user-select:none}
.m-it .e{font-size:2.3rem}
.m-it .e svg{width:48px;height:48px}

/* ---------- Read aloud (Arabic TTS) ---------- */
const TTS = (() => {
  const sy = window.speechSynthesis; let voice = null, curBtn = null;
  function pickVoice() { if (!sy) return; const vs = sy.getVoices(); voice = vs.find(v => /^ar/i.test(v.lang) && /female|zeina|laila|hoda|salma|google/i.test(v.name)) || vs.find(v => /^ar/i.test(v.lang)) || null; }
  if (sy) { pickVoice(); sy.onvoiceschanged = pickVoice; }
  function clean(t) { return String(t).replace(/<[^>]+>/g, ' ').replace(/[🔊✔✖]/g, ''); }
  function speak(text, btn) {
    if (!sy || !ST.tts) return;
    try {
      sy.cancel(); if (curBtn) curBtn.classList.remove('speaking');
      const u = new SpeechSynthesisUtterance(clean(text)); u.lang = voice ? voice.lang : 'ar-SA'; if (voice) u.voice = voice; u.rate = .85; u.pitch = 1.05;
      if (btn) { curBtn = btn; btn.classList.add('speaking'); u.onend = u.onerror = () => btn.classList.remove('speaking'); }
      sy.speak(u);
    } catch (e) { }
  }
  return { speak, stop: () => { try { sy && sy.cancel(); } catch (e) { } }, ok: !!sy };
})();
function sayBtn(textOrFn) {
  const b = h('button', { class: 'say', title: 'استمع', 'aria-label': 'استمع' }, '🔊');

  return b;
}

/* ---------- Drag & drop (pointer + tap-tap) ---------- */
/* makeDraggable(el, data, {onDrop(target, data, el), targets: selector}) */
const DND = { sel: null };
function makeDraggable(el, opts) {
  let sx, sy, ghost = null, moved = false, hot = null;
  el.addEventListener('pointerdown', ev => {
    if (el.classList.contains('used')) return;
    sx = ev.clientX; sy = ev.clientY; moved = false;
    const move = e => {
      if (!moved && Math.hypot(e.clientX - sx, e.clientY - sy) > 8) {
        moved = true; ghost = el.cloneNode(true); ghost.classList.add('ghost-drag'); ghost.style.width = el.offsetWidth + 'px'; document.body.append(ghost); SFX.pick();
      }
      if (moved) {
        ghost.style.left = e.clientX + 'px'; ghost.style.top = e.clientY + 'px';
        ghost.style.display = 'none'; const t = document.elementFromPoint(e.clientX, e.clientY); ghost.style.display = '';
        const tg = t && t.closest(opts.targets);
        if (hot && hot !== tg) hot.classList.remove('hot'); hot = tg; if (hot) hot.classList.add('hot');
      }
    };
    const up = e => {
      removeEventListener('pointermove', move); removeEventListener('pointerup', up); removeEventListener('pointercancel', up);
      if (hot) hot.classList.remove('hot');
      if (moved) {
        ghost.remove(); ghost = null;
        const t = document.elementFromPoint(e.clientX, e.clientY); const tg = t && t.closest(opts.targets);
        if (tg) opts.onDrop(tg, el);
      } else {
        // tap-select mode
        $$('.tok.sel,.opt.sel', el.parentElement.parentElement || document).forEach(x => x !== el && x.classList.remove('sel'));
        el.classList.toggle('sel'); DND.sel = el.classList.contains('sel') ? { el, opts } : null; SFX.tap();
      }
      hot = null;
    };
    addEventListener('pointermove', move); addEventListener('pointerup', up); addEventListener('pointercancel', up);
  });
}
function makeDropTarget(tg) {
  tg.addEventListener('click', () => {
    if (!DND.sel) return; const { el, opts } = DND.sel;
    if (!document.body.contains(el)) { DND.sel = null; return; }
    if (!tg.matches(opts.targets)) return;
    el.classList.remove('sel'); DND.sel = null; opts.onDrop(tg, el);
  });
}
function flyTo(fromEl, toEl, content) {
  const a = fromEl.getBoundingClientRect(), b = toEl.getBoundingClientRect();
  const f = h('div', { style: { position: 'fixed', left: a.left + a.width / 2 + 'px', top: a.top + a.height / 2 + 'px', transform: 'translate(-50%,-50%)', fontSize: '2.4rem', zIndex: 500, transition: 'all .45s cubic-bezier(.5,-0.3,.5,1.3)', pointerEvents: 'none' } }, content);
  document.body.append(f);
  requestAnimationFrame(() => { f.style.left = b.left + b.width / 2 + 'px'; f.style.top = b.top + b.height / 2 + 'px'; f.style.transform = 'translate(-50%,-50%) scale(.6)'; f.style.opacity = '.3'; });
  setTimeout(() => f.remove(), 480);
}

function footBar(root, task, ctx, { hint, check, checkLabel = 'تحقّق ✔' } = {}) {

  const els = items.map(it => { const o = h('div', { class: 'opt', role: 'button', tabindex: 0 }, eNode(it.e), it.n); o.onclick = () => { if (grid.dataset.lock) return; o.classList.toggle('sel'); SFX.tap(); if (ctx.level === 1) TTS.speak(it.n); }; grid.append(o); return o; });

/* 3. match pairs with lines */
ENG.match = (root, t, done, ctx) => {

  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg'); svg.setAttribute('class', 'lines');
  wrap.append(svg, colA, colB); root.append(wrap);
  let sel = null, left = t.pairs.length, got = 0; const miss = {}; const lines = [];
  const mk = (it, side, id) => { const el = h('div', { class: 'm-it', 'data-id': id, 'data-side': side }, eNode(it.e), it.n ? h('span', {}, it.n) : null); el.onclick = () => click(el); return el; };
  shuffle(t.pairs.map((p, i) => [p[0], i])).forEach(([it, i]) => colA.append(mk(it, 'a', i)));
  shuffle(t.pairs.map((p, i) => [p[1], i])).forEach(([it, i]) => colB.append(mk(it, 'b', i)));
  function draw() { svg.innerHTML = ''; const R = wrap.getBoundingClientRect(); lines.forEach(([a, b]) => { const A = a.getBoundingClientRect(), B = b.getBoundingClientRect(); const x1 = A.left - R.left, y1 = A.top + A.height / 2 - R.top, x2 = B.right - R.left, y2 = B.top + B.height / 2 - R.top; const l = document.createElementNS('http://www.w3.org/2000/svg', 'path'); l.setAttribute('d', `M${x1} ${y1} C${(x1 + x2) / 2} ${y1} ${(x1 + x2) / 2} ${y2} ${x2} ${y2}`); l.setAttribute('stroke', '#2EAF5B'); l.setAttribute('stroke-width', '5'); l.setAttribute('fill', 'none'); l.setAttribute('stroke-linecap', 'round'); svg.append(l); }); }
  addEventListener('resize', draw);
  function click(el) {
    if (el.classList.contains('done')) return; SFX.tap();
    if (!sel || sel.dataset.side === el.dataset.side) { $$('.m-it.sel', wrap).forEach(x => x.classList.remove('sel')); sel = el; el.classList.add('sel'); if (ctx.level === 1) TTS.speak(el.textContent); return; }
    if (sel.dataset.id === el.dataset.id) {

  }

};
