<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>مختبر الأحياء التفاعلي — الصف العاشر</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Baloo+Bhaijaan+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4faf8;--card:#ffffff;--ink:#12342e;--muted:#5c7a74;--line:#dcebe6;
  --p:#0f9d8a;--p2:#0b7d6e;--pl:#d7f3ee;--a:#ff7a59;--al:#ffe6de;--y:#ffc43d;--yl:#fff4d6;
  --g:#22c55e;--gl:#dcfce7;--r:#ef4444;--rl:#fee2e2;--b:#3b82f6;--bl:#dbeafe;--v:#8b5cf6;--vl:#ede9fe;
  --sh:0 10px 30px rgba(15,60,50,.10);--sh2:0 4px 14px rgba(15,60,50,.08);--rad:22px;
  --u:#0f9d8a;--ul:#d7f3ee;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:'Cairo',system-ui,sans-serif;font-size:17px;line-height:1.6;min-height:100%;}
body{background:
  radial-gradient(1200px 500px at 90% -10%, #d9f4ee 0%, transparent 60%),
  radial-gradient(900px 500px at -10% 110%, #ffe9e2 0%, transparent 55%),var(--bg);}
h1,h2,h3,h4{font-family:'Baloo Bhaijaan 2','Cairo',sans-serif;margin:0;line-height:1.3}
button{font-family:inherit;font-size:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,textarea{font-family:inherit;font-size:inherit}
.hidden{display:none!important}
.wrap{max-width:1180px;margin:0 auto;padding:14px 16px 60px}
/* header */
.top{position:sticky;top:0;z-index:50;backdrop-filter:blur(10px);background:rgba(244,250,248,.85);border-bottom:1px solid var(--line)}
.top .in{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:8px 16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;flex:1;min-width:200px}
.brand .logo{width:46px;height:46px;border-radius:14px;background:linear-gradient(135deg,var(--p),#5ee0c7);display:grid;place-items:center;font-size:26px;box-shadow:var(--sh2)}
.brand h1{font-size:20px}
.brand small{display:block;color:var(--muted);font-size:13px;font-weight:600}
.tools{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.tb{width:42px;height:42px;border-radius:13px;background:#fff;border:1px solid var(--line);display:grid;place-items:center;font-size:19px;box-shadow:var(--sh2);transition:.15s}
.tb:hover{transform:translateY(-2px)}
.tb.off{opacity:.45;filter:grayscale(1)}
.prog{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:4px 12px;font-weight:700;color:var(--p2);font-size:14px}
.prog .bar{width:90px;height:8px;background:var(--pl);border-radius:6px;overflow:hidden}
.prog .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--p),#5ee0c7);width:0;transition:.6s}
/* hero */
.hero{display:grid;grid-template-columns:1.2fr .8fr;gap:18px;align-items:center;background:var(--card);border-radius:28px;box-shadow:var(--sh);padding:26px 30px;margin:16px 0 22px;overflow:hidden;position:relative}
.hero h2{font-size:34px;color:var(--p2)}
.hero p{color:var(--muted);margin:8px 0 14px;font-size:16px}
.hero .stats{display:flex;gap:10px;flex-wrap:wrap}
.stat{background:var(--pl);border-radius:14px;padding:8px 14px;font-weight:700;color:var(--p2);font-size:14px;display:flex;align-items:center;gap:6px}
.hero .art{height:220px;display:grid;place-items:center}
.hero .art svg{width:100%;height:100%}
@media(max-width:800px){.hero{grid-template-columns:1fr}.hero .art{height:150px}.hero h2{font-size:26px}}
/* units */
.units{display:grid;gap:18px}
.unit{background:var(--card);border-radius:var(--rad);box-shadow:var(--sh);overflow:hidden;border-top:8px solid var(--u)}
.unit .uh{display:flex;align-items:center;gap:14px;padding:16px 20px;cursor:pointer}
.unit .uh .ic{width:58px;height:58px;border-radius:18px;background:var(--ul);display:grid;place-items:center;font-size:30px;flex-shrink:0}
.unit .uh h3{font-size:22px;color:var(--ink)}
.unit .uh small{color:var(--muted);font-weight:600;display:block;font-size:13px}
.unit .uh .n{margin-inline-start:auto;background:var(--ul);color:var(--u);border-radius:12px;padding:4px 12px;font-weight:800;font-size:14px;white-space:nowrap}
.unit .uh .chev{font-size:22px;color:var(--muted);transition:.3s}
.unit.open .uh .chev{transform:rotate(180deg)}
.lessons{display:none;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;padding:0 20px 20px}
.unit.open .lessons{display:grid}
.les{background:#fff;border:2px solid var(--line);border-radius:18px;padding:14px;cursor:pointer;transition:.18s;position:relative;display:flex;flex-direction:column;gap:6px}
.les:hover{border-color:var(--u);transform:translateY(-3px);box-shadow:var(--sh2)}
.les .num{width:34px;height:34px;border-radius:11px;background:var(--u);color:#fff;display:grid;place-items:center;font-weight:900;font-size:14px}
.les h4{font-size:17px;line-height:1.35}
.les .en{color:var(--muted);font-size:12px;font-weight:600;font-family:'Cairo'}
.les .dots{display:flex;gap:5px;margin-top:4px}
.les .dots i{width:22px;height:8px;border-radius:5px;background:var(--line)}
.les .dots i.on{background:var(--g)}
.les.ws{background:linear-gradient(135deg,#fff,var(--yl))}
.les .tag{position:absolute;top:10px;left:10px;font-size:11px;background:var(--yl);color:#9a6a00;padding:2px 8px;border-radius:8px;font-weight:800}
/* lesson view */
.lhead{display:flex;align-items:center;gap:12px;margin:12px 0 14px;flex-wrap:wrap}
.back{background:#fff;border:1px solid var(--line);border-radius:14px;padding:8px 14px;font-weight:800;color:var(--p2);display:flex;gap:6px;align-items:center;box-shadow:var(--sh2)}
.lhead h2{font-size:24px;flex:1;min-width:200px}
.lhead h2 span{display:block;font-size:13px;color:var(--muted);font-family:'Cairo';font-weight:700}
.stepper{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px}
.step{background:#fff;border:2px solid var(--line);border-radius:16px;padding:10px 8px;text-align:center;cursor:pointer;transition:.18s;font-weight:800;font-size:14px;display:flex;flex-direction:column;align-items:center;gap:2px;position:relative}
.step .ic{font-size:24px}
.step.on{border-color:var(--u);background:var(--ul);color:var(--u)}
.step.done::after{content:'✓';position:absolute;top:6px;left:8px;width:20px;height:20px;border-radius:50%;background:var(--g);color:#fff;font-size:12px;display:grid;place-items:center}
@media(max-width:600px){.step{font-size:12px}.step .ic{font-size:20px}}
.panel{background:var(--card);border-radius:var(--rad);box-shadow:var(--sh);padding:20px;min-height:400px;position:relative;overflow:hidden}
.panel .ph{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.panel .ph h3{font-size:22px;color:var(--u)}
.panel .ph .sub{color:var(--muted);font-weight:600;font-size:14px;flex:1}
.pill{background:var(--ul);color:var(--u);border-radius:12px;padding:4px 12px;font-weight:800;font-size:13px}
.btn{background:var(--u);color:#fff;border-radius:14px;padding:10px 20px;font-weight:800;font-size:16px;box-shadow:0 6px 16px rgba(0,0,0,.12);transition:.15s;display:inline-flex;align-items:center;gap:8px}
.btn:hover{transform:translateY(-2px);filter:brightness(1.05)}
.btn:active{transform:scale(.97)}
.btn.sec{background:#fff;color:var(--u);border:2px solid var(--u);box-shadow:none}
.btn.ghost{background:var(--pl);color:var(--p2);box-shadow:none}
.btn.warm{background:var(--a)}
.btn.sm{padding:6px 14px;font-size:14px;border-radius:11px}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spacer{flex:1}
/* activity items */
.item{background:#fff;border:2px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px;animation:pop .35s ease}
.item .q{font-weight:800;font-size:18px;margin-bottom:10px;display:flex;gap:10px;align-items:flex-start}
.item .q .n{width:30px;height:30px;border-radius:10px;background:var(--ul);color:var(--u);display:grid;place-items:center;font-size:14px;flex-shrink:0}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px}
.opt{background:#fbfefd;border:2px solid var(--line);border-radius:14px;padding:10px 14px;text-align:start;font-weight:700;transition:.15s;position:relative;display:flex;gap:8px;align-items:center}
.opt:hover{border-color:var(--u);background:var(--ul)}
.opt .l{width:26px;height:26px;border-radius:8px;background:var(--line);display:grid;place-items:center;font-size:13px;flex-shrink:0}
.opt.ok{border-color:var(--g);background:var(--gl)}
.opt.ok .l{background:var(--g);color:#fff}
.opt.bad{border-color:var(--r);background:var(--rl);animation:shake .4s}
.opt.bad .l{background:var(--r);color:#fff}
.opt.dis{pointer-events:none}
.why{margin-top:10px;background:var(--yl);border-inline-start:5px solid var(--y);border-radius:10px;padding:8px 12px;font-size:15px;animation:pop .3s}
.why.ok{background:var(--gl);border-color:var(--g)}
.why.bad{background:var(--rl);border-color:var(--r)}
.tfb{display:flex;gap:10px}
.tfb .opt{justify-content:center;font-size:17px}
.cloud{display:flex;flex-wrap:wrap;gap:8px}
.cw{background:#fff;border:2px solid var(--line);border-radius:30px;padding:6px 16px;font-weight:800;transition:.15s;cursor:pointer}
.cw.sel{border-color:var(--b);background:var(--bl)}
.cw.ok{border-color:var(--g);background:var(--gl)}
.cw.bad{border-color:var(--r);background:var(--rl)}
.cw.miss{border-color:var(--y);background:var(--yl)}
textarea.open{width:100%;min-height:90px;border:2px solid var(--line);border-radius:14px;padding:10px 12px;resize:vertical;background:#fbfefd}
.saved{font-size:13px;color:var(--g);font-weight:800}
/* slides */
.slide{display:grid;grid-template-columns:1fr 1.1fr;gap:18px;align-items:stretch;min-height:380px}
@media(max-width:820px){.slide{grid-template-columns:1fr}}
.slide .txt h3{font-size:26px;color:var(--ink);margin-bottom:10px}
.slide .txt ul{margin:0;padding:0;list-style:none;display:grid;gap:8px}
.slide .txt li{background:#fbfefd;border:1.5px solid var(--line);border-radius:14px;padding:9px 14px 9px 12px;font-size:17px;position:relative;padding-inline-start:38px;animation:slideIn .4s both}
.slide .txt li::before{content:'';position:absolute;inset-inline-start:12px;top:17px;width:14px;height:14px;border-radius:50%;background:var(--u);box-shadow:0 0 0 4px var(--ul)}
.slide .txt li:nth-child(2){animation-delay:.08s}.slide .txt li:nth-child(3){animation-delay:.16s}.slide .txt li:nth-child(4){animation-delay:.24s}.slide .txt li:nth-child(5){animation-delay:.32s}.slide .txt li:nth-child(6){animation-delay:.4s}
.slide .txt li b{color:var(--u)}
.slide .note{margin-top:10px;background:var(--yl);border-radius:14px;padding:8px 12px;font-size:15px;border-inline-start:5px solid var(--y)}
.slide .note::before{content:'💡 '}
.vis{background:linear-gradient(160deg,#fbfffe,#eef8f5);border:2px solid var(--line);border-radius:20px;min-height:300px;display:flex;align-items:center;justify-content:center;padding:12px;position:relative;overflow:hidden}
.vis svg{width:100%;height:auto;max-height:420px;direction:ltr}
.vis .cap{position:absolute;bottom:8px;inset-inline-start:12px;font-size:13px;color:var(--muted);font-weight:700;background:rgba(255,255,255,.8);padding:2px 10px;border-radius:8px}
.snav{display:flex;align-items:center;gap:10px;margin-top:16px;flex-wrap:wrap}
.snav .dots{display:flex;gap:6px;flex:1;justify-content:center;flex-wrap:wrap}
.snav .dots i{width:10px;height:10px;border-radius:50%;background:var(--line);cursor:pointer;transition:.2s}
.snav .dots i.on{background:var(--u);transform:scale(1.35)}
.snav .dots i.seen{background:#9fd8cc}
.speak{background:#fff;border:2px solid var(--line);border-radius:12px;padding:6px 12px;font-weight:800;color:var(--p2);display:inline-flex;gap:6px;align-items:center}
.speak.on{background:var(--pl);border-color:var(--p)}
/* generic visuals */
.gv{width:100%;direction:rtl}
.flow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:center}
.flow .fn{background:#fff;border:2px solid var(--u);border-radius:16px;padding:10px 14px;font-weight:800;text-align:center;min-width:100px;box-shadow:var(--sh2);animation:pop .4s both;font-size:15px}
.flow .fn .fi{font-size:28px;display:block}
.flow .fa{font-size:22px;color:var(--u);font-weight:900}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}
.cmp .c{background:#fff;border-radius:16px;padding:12px;border-top:6px solid var(--u);box-shadow:var(--sh2)}
.cmp .c:last-child{border-color:var(--a)}
.cmp .c h4{font-size:17px;margin-bottom:6px;text-align:center}
.cmp .c ul{margin:0;padding-inline-start:18px;font-size:14px}
.cmp .c .ci{font-size:34px;text-align:center}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;width:100%}
.cards .cd{background:#fff;border-radius:16px;padding:12px 10px;text-align:center;box-shadow:var(--sh2);border:1.5px solid var(--line);animation:pop .4s both}
.cards .cd .ci{font-size:36px}
.cards .cd h5{margin:4px 0 2px;font-size:15px;color:var(--u)}
.cards .cd p{margin:0;font-size:13px;color:var(--muted)}
table.tbl{width:100%;border-collapse:separate;border-spacing:0;background:#fff;border-radius:14px;overflow:hidden;font-size:14px;box-shadow:var(--sh2)}
table.tbl th{background:var(--u);color:#fff;padding:8px;font-weight:800}
table.tbl td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:center}
table.tbl tr:last-child td{border-bottom:0}
table.tbl td:first-child{font-weight:800;background:var(--ul)}
.cycle{position:relative;width:min(100%,360px);aspect-ratio:1;margin:auto}
.cycle .cn{position:absolute;width:104px;padding:6px 6px;background:#fff;border:2px solid var(--u);border-radius:14px;text-align:center;font-weight:800;font-size:12.5px;transform:translate(-50%,-50%);box-shadow:var(--sh2);line-height:1.3}
.cycle .cn .ci{font-size:22px;display:block}
.cycle .ctr{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:44px;animation:spin 12s linear infinite}
.stepsv{display:grid;gap:8px;width:100%}
.stepsv .sv{display:flex;gap:10px;align-items:center;background:#fff;border-radius:14px;padding:8px 12px;box-shadow:var(--sh2);animation:slideIn .4s both}
.stepsv .sv .n{width:32px;height:32px;border-radius:50%;background:var(--u);color:#fff;display:grid;place-items:center;font-weight:900;flex-shrink:0}
.stepsv .sv .si{font-size:26px}
.stepsv .sv p{margin:0;font-size:15px}
.bars{display:flex;align-items:flex-end;gap:12px;height:220px;width:100%;padding:10px 6px 0;justify-content:center}
.bars .b{flex:1;max-width:80px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
.bars .b i{display:block;width:100%;background:linear-gradient(180deg,var(--u),#5ee0c7);border-radius:10px 10px 4px 4px;animation:grow 1s ease both;transform-origin:bottom}
.bars .b span{font-size:12px;font-weight:800;text-align:center;margin-top:4px}
.bars .b b{font-size:13px;color:var(--u)}
/* games */
.ghub{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.gc{background:#fff;border:2px solid var(--line);border-radius:18px;padding:14px;text-align:center;cursor:pointer;transition:.18s;position:relative}
.gc:hover{border-color:var(--u);transform:translateY(-3px);box-shadow:var(--sh2)}
.gc .gi{font-size:40px}
.gc h4{font-size:16px;margin-top:4px}
.gc small{color:var(--muted);font-weight:700;font-size:12px}
.gc .best{position:absolute;top:8px;left:10px;background:var(--yl);color:#9a6a00;border-radius:8px;padding:1px 8px;font-size:12px;font-weight:900}
.ghead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.ghead h3{font-size:22px;flex:1}
.score{background:var(--yl);color:#9a6a00;border-radius:12px;padding:4px 14px;font-weight:900;font-size:16px}
.timer{background:var(--bl);color:#1e40af;border-radius:12px;padding:4px 14px;font-weight:900;font-size:16px;font-variant-numeric:tabular-nums}
.timer.low{background:var(--rl);color:#b91c1c;animation:pulse .6s infinite}
.tbar{height:10px;background:var(--line);border-radius:6px;overflow:hidden;margin-bottom:12px}
.tbar i{display:block;height:100%;background:linear-gradient(90deg,var(--b),#60a5fa);transition:width 1s linear}
.instr{background:var(--pl);border-radius:14px;padding:8px 14px;font-weight:700;margin-bottom:12px;font-size:15px;color:var(--p2)}
.instr::before{content:'🎯 '}
.mcols{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mcol{display:grid;gap:8px;align-content:start}
.mc{background:#fff;border:2px solid var(--line);border-radius:14px;padding:10px 12px;font-weight:700;cursor:pointer;transition:.15s;min-height:52px;display:flex;align-items:center;gap:8px;font-size:15px}
.mc:hover{border-color:var(--u)}
.mc.sel{border-color:var(--b);background:var(--bl);transform:scale(1.03)}
.mc.ok{border-color:var(--g);background:var(--gl);pointer-events:none;opacity:.85}
.mc.bad{animation:shake .4s;border-color:var(--r)}
.mc .ci{font-size:24px}
.bins{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:12px}
.bin{border:3px dashed var(--u);border-radius:18px;padding:10px;min-height:120px;background:#fbfffe;transition:.15s}
.bin h5{margin:0 0 6px;text-align:center;font-size:16px;color:var(--u)}
.bin.over{background:var(--ul);transform:scale(1.02)}
.bin .bi{background:var(--gl);border-radius:10px;padding:4px 10px;font-size:14px;font-weight:700;margin:4px 0;animation:pop .3s}
.pool{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;min-height:60px;padding:8px;background:var(--bg);border-radius:16px}
.chip{background:#fff;border:2px solid var(--line);border-radius:30px;padding:8px 16px;font-weight:800;cursor:grab;transition:.15s;user-select:none;touch-action:none;font-size:15px}
.chip:hover{border-color:var(--u)}
.chip.sel{border-color:var(--b);background:var(--bl);transform:scale(1.06)}
.chip.bad{animation:shake .4s;border-color:var(--r);background:var(--rl)}
.chip.drag{position:fixed;z-index:999;pointer-events:none;opacity:.9;transform:scale(1.08)}
.seq{display:grid;gap:8px;margin-bottom:12px}
.seq .sq{display:flex;gap:10px;align-items:center;background:var(--gl);border-radius:14px;padding:8px 12px;font-weight:700;animation:pop .3s}
.seq .sq .n{width:30px;height:30px;border-radius:50%;background:var(--g);color:#fff;display:grid;place-items:center;font-weight:900;flex-shrink:0}
.seq .ph{border:2px dashed var(--line);border-radius:14px;padding:10px;text-align:center;color:var(--muted);font-weight:700}
.race{background:linear-gradient(180deg,#e8f6f2,#fff);border-radius:16px;padding:14px 12px 6px;margin-bottom:14px;position:relative;border:2px solid var(--line)}
.race .trk{height:14px;background:repeating-linear-gradient(90deg,#c9e6de 0 20px,#e3f2ee 20px 40px);border-radius:8px;position:relative}
.race .rn{position:absolute;top:-30px;font-size:34px;transition:right .6s cubic-bezier(.5,1.6,.4,1);transform:scaleX(-1)}
.race .fl{position:absolute;left:0;top:-32px;font-size:26px}
.qq{font-size:20px;font-weight:800;margin-bottom:12px;background:#fff;border-radius:16px;padding:14px;border:2px solid var(--line)}
.blank{display:inline-block;min-width:90px;border-bottom:3px dashed var(--u);text-align:center;color:var(--u);font-weight:900;padding:0 6px;margin:0 4px;border-radius:6px}
.blank.ok{background:var(--gl);border-color:var(--g);color:#166534;border-bottom-style:solid}
.blank.cur{background:var(--ul);animation:pulse 1s infinite}
.memg{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.mem{aspect-ratio:1;perspective:800px;cursor:pointer}
.mem .inner{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.mem.flip .inner{transform:rotateY(180deg)}
.mem .f,.mem .bk{position:absolute;inset:0;border-radius:16px;display:grid;place-items:center;padding:8px;text-align:center;font-weight:800;backface-visibility:hidden;font-size:14px}
.mem .f{background:linear-gradient(135deg,var(--u),#5ee0c7);color:#fff;font-size:34px}
.mem .bk{background:#fff;border:2px solid var(--u);transform:rotateY(180deg)}
.mem.done .bk{background:var(--gl);border-color:var(--g)}
.mem.done{pointer-events:none}
.lblwrap{display:grid;grid-template-columns:1.4fr .6fr;gap:12px}
@media(max-width:760px){.lblwrap{grid-template-columns:1fr}.mcols{grid-template-columns:1fr}}
.lblvis{position:relative;background:#fff;border-radius:16px;border:2px solid var(--line);padding:6px}
.lblvis svg{width:100%;height:auto;direction:ltr}
.hot{position:absolute;width:30px;height:30px;border-radius:50%;background:#fff;border:3px solid var(--a);transform:translate(-50%,-50%);display:grid;place-items:center;font-weight:900;font-size:13px;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.2);animation:pulse 1.4s infinite;z-index:3}
.hot.ok{background:var(--g);border-color:var(--g);color:#fff;animation:none}
.hot.bad{animation:shake .4s;border-color:var(--r)}
.hot.cur{background:var(--bl);border-color:var(--b)}
.lbls{display:grid;gap:8px;align-content:start}
.lbl{background:#fff;border:2px solid var(--line);border-radius:12px;padding:8px 12px;font-weight:800;cursor:pointer;font-size:15px}
.lbl.sel{border-color:var(--b);background:var(--bl)}
.lbl.ok{border-color:var(--g);background:var(--gl);opacity:.7;pointer-events:none}
.tfcard{background:#fff;border-radius:22px;border:2px solid var(--line);padding:30px 20px;text-align:center;font-size:22px;font-weight:800;min-height:150px;display:grid;place-items:center;animation:pop .35s;margin-bottom:14px}
.bigtf{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.bigtf button{border-radius:18px;padding:16px;font-size:22px;font-weight:900;color:#fff;box-shadow:var(--sh2)}
.bigtf .t{background:var(--g)}.bigtf .f{background:var(--r)}
.letters{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.lt{width:44px;height:48px;border-radius:12px;background:#fff;border:2px solid var(--u);display:grid;place-items:center;font-size:22px;font-weight:900;cursor:pointer;transition:.15s}
.lt:hover{background:var(--ul)}
.lt.used{opacity:.25;pointer-events:none}
.lt.ok{background:var(--gl);border-color:var(--g)}
.lt.bad{background:var(--rl);border-color:var(--r)}
.build{display:flex;gap:6px;justify-content:center;min-height:56px;margin:10px 0;flex-wrap:wrap}
.build .lt{border-style:dashed;cursor:pointer}
.build .lt.filled{border-style:solid;background:var(--ul)}
.hunt{position:relative;height:380px;background:linear-gradient(180deg,#dff5ff,#f2fcff);border-radius:20px;overflow:hidden;border:2px solid var(--line)}
.bal{position:absolute;bottom:-160px;width:150px;padding:12px 10px 20px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;text-align:center;font-weight:800;font-size:13px;cursor:pointer;animation:rise linear forwards;box-shadow:inset -8px -8px 20px rgba(0,0,0,.08);line-height:1.35;display:flex;align-items:center;justify-content:center;min-height:110px}
.bal::after{content:'';position:absolute;bottom:-26px;left:50%;width:2px;height:26px;background:#999}
.bal.pop{animation:popout .3s forwards}
.wheelwrap{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:center}
@media(max-width:760px){.wheelwrap{grid-template-columns:1fr}}
.wheel{position:relative;width:min(100%,320px);aspect-ratio:1;margin:auto}
.wheel svg{width:100%;height:100%;transition:transform 4s cubic-bezier(.17,.67,.12,1)}
.wheel .ptr{position:absolute;top:-6px;left:50%;transform:translateX(-50%);font-size:34px;z-index:2}
.secretw{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:14px 0}
.secretw .lt{border-style:dashed}
.secretw .lt.show{border-style:solid;background:var(--gl)}
.plant{display:grid;place-items:center;height:130px}
.kbd{display:flex;flex-wrap:wrap;gap:5px;justify-content:center}
.kbd .lt{width:38px;height:42px;font-size:18px}
.result{text-align:center;padding:26px 16px;animation:pop .5s}
.result .big{font-size:70px}
.result h3{font-size:28px;color:var(--u);margin:6px 0}
.result p{color:var(--muted);font-weight:700}
.stars{font-size:34px;letter-spacing:4px}
.badge{display:inline-flex;align-items:center;gap:8px;background:linear-gradient(135deg,var(--y),#ffdf8a);color:#7a4d00;border-radius:16px;padding:8px 16px;font-weight:900;margin-top:10px;box-shadow:var(--sh2)}
/* team board */
.teams{position:fixed;bottom:14px;inset-inline-start:14px;z-index:60;display:flex;gap:8px;align-items:center}
.team{background:#fff;border-radius:16px;box-shadow:var(--sh);padding:6px 10px;display:flex;align-items:center;gap:6px;font-weight:900;border:2px solid var(--line)}
.team .nm{font-size:13px;color:var(--muted)}
.team .sc{font-size:20px;min-width:28px;text-align:center}
.team button{width:28px;height:28px;border-radius:8px;background:var(--pl);font-weight:900;color:var(--p2)}
.team.a{border-color:var(--b)}.team.b{border-color:var(--a)}
.teams .tog{width:40px;height:40px;border-radius:50%;background:var(--ink);color:#fff;font-size:18px;box-shadow:var(--sh)}
/* toast, confetti */
.toast{position:fixed;top:70px;left:50%;transform:translateX(-50%) translateY(-20px);background:var(--ink);color:#fff;padding:10px 20px;border-radius:14px;font-weight:800;z-index:100;opacity:0;transition:.3s;pointer-events:none;box-shadow:var(--sh)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.conf{position:fixed;inset:0;pointer-events:none;z-index:200;overflow:hidden}
.conf i{position:absolute;top:-20px;width:10px;height:16px;border-radius:3px;animation:fall 2.4s ease-in forwards}
.fx{position:fixed;font-size:30px;pointer-events:none;z-index:150;animation:fly 1s ease-out forwards;font-weight:900}
/* keyframes */
@keyframes pop{from{transform:scale(.92);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes slideIn{from{transform:translateX(20px);opacity:0}to{transform:none;opacity:1}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(15,157,138,.35)}50%{box-shadow:0 0 0 8px rgba(15,157,138,0)}}
@keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg)}}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg);opacity:.6}}
@keyframes fly{to{transform:translateY(-80px) scale(1.4);opacity:0}}
@keyframes rise{to{bottom:110%}}
@keyframes popout{to{transform:scale(1.6);opacity:0}}
@keyframes flowdash{to{stroke-dashoffset:-40}}
@keyframes blink{50%{opacity:.25}}
@keyframes beat{0%,100%{transform:scale(1)}30%{transform:scale(1.08)}}
@keyframes drift{0%{offset-distance:0}100%{offset-distance:100%}}
@keyframes wob{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
/* svg helpers used by presets */
.sv-flow{stroke-dasharray:8 6;animation:flowdash 1s linear infinite}
.sv-flow.slow{animation-duration:2s}
.sv-blink{animation:blink 1.2s ease-in-out infinite}
.sv-beat{animation:beat 1s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.sv-wob{animation:wob 2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.sv-fade{animation:fadeUp .8s ease both}
.sv-spin{animation:spin 8s linear infinite;transform-box:fill-box;transform-origin:center}
svg text{font-family:'Cairo',sans-serif;font-weight:700}
.print-hide{}
</style>
</head>
<body>
<div class="top"><div class="in">
  <div class="brand"><div class="logo">🧬</div><div><h1 id="appTitle">مختبر الأحياء التفاعلي — الصف العاشر</h1><small id="appSub">الفصل الدراسي الأول · كتاب النشاط</small></div></div>
  <div class="tools">
    <div class="prog"><span id="progTxt">0%</span><div class="bar"><i id="progBar"></i></div></div>
    <button class="tb" id="btnTeams" title="لوحة الفرق">🏆</button>
    <button class="tb" id="btnTTS" title="القراءة الصوتية">🗣️</button>
    <button class="tb" id="btnSound" title="المؤثرات الصوتية">🔊</button>
    <button class="tb" id="btnFull" title="ملء الشاشة">⛶</button>
    <button class="tb" id="btnHome" title="الرئيسية">🏠</button>
  </div>
</div></div>
<div class="wrap" id="app"></div>
<div class="teams hidden" id="teams">
  <div class="team a"><span class="nm">فريق أ</span><button data-t="a" data-d="-1">−</button><span class="sc" id="scA">0</span><button data-t="a" data-d="1">+</button></div>
  <div class="team b"><span class="nm">فريق ب</span><button data-t="b" data-d="-1">−</button><span class="sc" id="scB">0</span><button data-t="b" data-d="1">+</button></div>
  <button class="tog" id="teamsReset" title="تصفير">↺</button>
</div>
<div class="toast" id="toast"></div>
<div class="conf" id="conf"></div>
<script>
/* presets_g10.js — رسوم الصف العاشر (أحياء) — 22 رسمًا تعليميًا متحركًا */
(function(){
const H='#12342e';
const txt=(x,y,t,s=13,a='middle',c=H,extra='')=>`<text x="${x}" y="${y}" font-size="${s}" font-weight="700" text-anchor="${a}" fill="${c}" ${extra}>${t}</text>`;
const mk=(opts)=>{const L=!opts.nolabels; const r=L?6:8; return {L,
  lab:(x,y,t,s=13,c=H,extra='')=>L?txt(x,y,t,s,'middle',c,extra):'',
  hot:(id,x,y)=>`<circle data-hot="${id}" cx="${x}" cy="${y}" r="${r}" fill="#fff" stroke="#ff7a59" stroke-width="3"/>`,
  lead:(x1,y1,x2,y2)=>L?`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#6f8c86" stroke-width="1.3" stroke-dasharray="3 3"/>`:''};};
const mover=(path,fill,dur,r=5,begin=0,extra='',inner='')=>`<circle r="${r}" fill="${fill}" stroke="rgba(0,0,0,.25)" stroke-width="1" ${extra}><animateMotion dur="${dur}s" begin="${begin}s" repeatCount="indefinite" path="${path}"/>${inner}</circle>`;
const svg=(inner,h=380)=>`<svg viewBox="0 0 600 ${h}" xmlns="http://www.w3.org/2000/svg">${inner}</svg>`;
const tube=(d,outer,inner,w)=>`<path d="${d}" fill="none" stroke="${outer}" stroke-width="${w+8}" stroke-linecap="round" stroke-linejoin="round"/><path d="${d}" fill="none" stroke="${inner}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"/>`;
const flow=(d,c='#fff',w=3,slow=false)=>`<path d="${d}" fill="none" stroke="${c}" stroke-width="${w}" stroke-linecap="round" stroke-dasharray="8 6" class="sv-flow${slow?' slow':''}" opacity=".85"/>`;
const arrow=(x,y,angle,c=H,s=1)=>`<polygon points="${-8*s},${-6*s} ${8*s},0 ${-8*s},${6*s}" fill="${c}" transform="translate(${x} ${y}) rotate(${angle})"/>`;
// legend: نقطة ملوّنة ثم نص إلى يمينها (أنكور middle دائمًا لتفادي مشاكل rtl)
const legend=(x,y,items)=>items.map((it,i)=>`<circle cx="${x}" cy="${y+i*20}" r="6" fill="${it[0]}" stroke="rgba(0,0,0,.3)"/>${txt(x+14+it[1].length*3.4,y+4+i*20,it[1],12)}`).join('');
const BLUE='#4f7fe3', BLUED='#2a56b8', RED='#ef5a4c', REDD='#b8322a', MIX='#a66bd6';
const P={};
/* ---------- 1. القلب ---------- */
P.heart=(opts={})=>{const {lab,hot,lead}=mk(opts);
const bluePath="M55 122 Q120 118 165 140 L205 170 L205 232 L228 300 L262 282 L270 200 L270 96 Q270 70 236 70 L186 70";
const redPath="M500 150 L440 152 L398 175 L380 228 L380 300 L345 240 L338 200 L338 76 Q338 42 372 42 L430 42 Q468 42 468 80";
return svg(`
<defs>
 <linearGradient id="heart_gm" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f7bdb3"/><stop offset="1" stop-color="#e58a7c"/></linearGradient>
 <style>@keyframes heart_pump{0%,100%{transform:scale(1)}25%{transform:scale(1.035)}} .heart_body{animation:heart_pump 1s ease-in-out infinite;transform-box:fill-box;transform-origin:center}</style>
</defs>
${txt(300,18,'القلب البشري — مقطع أمامي',15)}
<!-- الأوعية خلف القلب -->
${tube('M50 122 Q120 118 168 140',BLUED,BLUE,22)}
${tube('M60 300 Q120 262 168 192',BLUED,BLUE,18)}
${tube('M436 150 H500',REDD,RED,14)}
${tube('M436 185 H500',REDD,RED,14)}
<!-- عضلة القلب والحجرات -->
<g class="heart_body">
 <path d="M150 140 Q150 98 200 98 H400 Q460 98 460 150 V235 Q458 316 345 362 Q300 378 248 352 Q148 308 150 232 Z" fill="url(#heart_gm)" stroke="#b9443a" stroke-width="4"/>
 <rect x="160" y="115" width="88" height="92" rx="14" fill="#8fb1f5" stroke="${BLUED}" stroke-width="3"/>
 <rect x="352" y="115" width="88" height="92" rx="14" fill="#f7a39a" stroke="${REDD}" stroke-width="3"/>
 <path d="M160 207 H288 V298 Q288 336 246 344 Q196 340 168 290 Z" fill="#8fb1f5" stroke="${BLUED}" stroke-width="3"/>
 <path d="M322 207 H422 Q426 282 390 320 Q348 338 322 292 Z" fill="#f7a39a" stroke="${REDD}" stroke-width="3"/>
 <!-- الصمامات -->
 <path d="M174 207 L198 228 M234 207 L210 228 M334 207 L358 228 M410 207 L386 228" stroke="${H}" stroke-width="3" fill="none" stroke-linecap="round"/>
 <path d="M256 196 q14 -13 28 0 M324 196 q14 -13 28 0" stroke="${H}" stroke-width="2.5" fill="none"/>
</g>
<!-- الشريان الرئوي والأورطي (أمام) -->
${tube('M270 96 Q300 84 326 92',BLUED,BLUE,14)}
${tube('M270 212 V96 Q270 70 236 70 L186 70',BLUED,BLUE,22)}
${tube('M338 212 V76 Q338 42 372 42 L430 42 Q468 42 468 80',REDD,RED,24)}
<!-- كريات الدم -->
${[0,-2,-4].map(b=>mover(bluePath,'#2f5fc4',6,5,b)).join('')}
${[0,-2,-4].map(b=>mover(redPath,'#d93b2e',6,5,b)).join('')}
<!-- النقاط والتسميات -->
${lab(204,145,'الأذين الأيمن',12)}${hot('ra',204,170)}
${lab(396,145,'الأذين الأيسر',12)}${hot('la',396,170)}
${lab(218,270,'البطين الأيمن',12)}${hot('rv',218,295)}
${lab(372,262,'البطين الأيسر',12)}${hot('lv',372,288)}
${lead(468,66,505,66)}${lab(540,70,'الأبهر')}${hot('aorta',468,66)}
${lab(200,44,'الشريان الرئوي',12)}${hot('pa',270,130)}
${lead(500,150,522,132)}${lab(548,126,'الوريد الرئوي',12)}${hot('pv',482,150)}
${lab(92,97,'الوريد الأجوف',12)}${hot('vc',95,122)}
${lab(75,330,'الوريد الأجوف السفلي',11)}
${lead(304,270,304,332)}${lab(304,346,'الحاجز',12)}${hot('septum',304,262)}
${lab(180,250,'صمام',12)}${hot('valve',206,228)}
${legend(28,352,[[BLUED,'دم غير مؤكسج'],[REDD,'دم مؤكسج']])}
${txt(505,372,'الرسم كما يُرى من الأمام',11,'middle','#5f7a75')}
`);};

/* ---------- 2. الدورة الدموية المزدوجة ---------- */
P.double_circ=(opts={})=>{const {lab,hot}=mk(opts);
const pulm="M275 160 C275 100 185 112 190 62 C196 14 404 14 410 62 C415 112 325 100 325 160";
const sys="M325 232 C325 288 415 270 410 318 C404 362 196 362 190 318 C185 270 275 288 275 232";
const grad=(id)=>`<linearGradient id="${id}" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="${BLUE}"/><stop offset=".42" stop-color="${BLUE}"/><stop offset=".58" stop-color="${RED}"/><stop offset="1" stop-color="${RED}"/></linearGradient>`;
const cell=(path,vals,dur,b)=>`<circle r="5" stroke="rgba(0,0,0,.25)"><animateMotion dur="${dur}s" begin="${b}s" repeatCount="indefinite" path="${path}"/><animate attributeName="fill" values="${vals}" keyTimes="0;.42;.58;1" dur="${dur}s" begin="${b}s" repeatCount="indefinite"/></circle>`;
return svg(`
<defs>${grad('double_circ_g')}</defs>
${txt(470,20,'الدورة الدموية المزدوجة',15)}

<!-- الرئتان -->
<g>
 <rect x="292" y="28" width="16" height="30" rx="5" fill="#fbd0cb" stroke="#c9736a" stroke-width="3"/>
 <ellipse cx="243" cy="68" rx="42" ry="38" fill="#fbd0cb" stroke="#c9736a" stroke-width="3"/>
 <ellipse cx="357" cy="68" rx="42" ry="38" fill="#fbd0cb" stroke="#c9736a" stroke-width="3"/>
</g>
<!-- الجسم -->
<rect x="205" y="300" width="190" height="70" rx="18" fill="#fde8c9" stroke="#d9a15b" stroke-width="3"/>
<!-- القلب -->
<g>
 <path d="M300 168 Q250 150 250 195 Q250 225 300 240 Q350 225 350 195 Q350 150 300 168Z" fill="${RED}" stroke="${REDD}" stroke-width="3"/>
 <path d="M300 168 Q250 150 250 195 Q250 225 300 240Z" fill="${BLUE}" stroke="${BLUED}" stroke-width="3"/>
 <line x1="255" y1="197" x2="345" y2="197" stroke="#fff" stroke-width="2" opacity=".8"/>
</g>
<!-- المسارات -->
<path d="${pulm}" fill="none" stroke="rgba(0,0,0,.25)" stroke-width="20" stroke-linecap="round"/>
<path d="${pulm}" fill="none" stroke="url(#double_circ_g)" stroke-width="14"/>
${flow(pulm)}
<path d="${sys}" fill="none" stroke="rgba(0,0,0,.25)" stroke-width="20" stroke-linecap="round"/>
<path d="${sys}" fill="none" stroke="url(#double_circ_g)" stroke-width="14"/>
${flow(sys)}
${arrow(369,107,118,H,.9)}${arrow(231,278,-62,H,.9)}
${[0,-2,-4,-6].map(b=>cell(pulm,`${BLUE};${BLUE};${RED};${RED}`,8,b)).join('')}
${[0,-2,-4,-6].map(b=>cell(sys,`${RED};${RED};${BLUE};${BLUE}`,8,b)).join('')}
<!-- تسميات -->
${lab(300,120,'الرئتان')}${txt(300,136,'يدخل O₂ ويخرج CO₂',10,'middle','#5f7a75')}${hot('lungs',243,72)}
${lab(300,258,'القلب')}${hot('heart',300,200)}
${lab(300,334,'أنسجة الجسم')}${hot('body',300,308)}
${lab(112,92,'الدورة الرئوية')}${hot('pulm',201,90)}
${lab(490,296,'الدورة الجهازية')}${hot('sys',399,292)}
${legend(28,44,[[BLUE,'دم غير مؤكسج'],[RED,'دم مؤكسج']])}
${txt(110,372,'يمرّ الدم بالقلب مرتين في الدورة الكاملة',11,'middle','#5f7a75')}
`);};

/* ---------- 3. دورة مفردة مقابل مزدوجة ---------- */
P.single_circ=(opts={})=>{const {lab,hot}=mk(opts);
const s1="M150 280 A95 95 0 0 1 150 90", s2="M150 90 A95 95 0 0 1 245 185", s3="M245 185 A95 95 0 0 1 150 280";
const full=s1+" A95 95 0 0 1 245 185 A95 95 0 0 1 150 280";
const pulm="M440 165 C440 118 385 128 388 80 C392 40 518 40 522 80 C525 128 470 118 470 165";
const sys="M470 215 C470 262 525 252 522 300 C518 340 392 340 388 300 C385 252 440 262 440 215";
const grad=(id)=>`<linearGradient id="${id}" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="${BLUE}"/><stop offset=".42" stop-color="${BLUE}"/><stop offset=".58" stop-color="${RED}"/><stop offset="1" stop-color="${RED}"/></linearGradient>`;
const cellF=(b)=>`<circle r="5" stroke="rgba(0,0,0,.25)"><animateMotion dur="7s" begin="${b}s" repeatCount="indefinite" path="${full}"/><animate attributeName="fill" values="${BLUE};${BLUE};${RED};${RED};${BLUE};${BLUE}" keyTimes="0;.45;.52;.72;.78;1" dur="7s" begin="${b}s" repeatCount="indefinite"/></circle>`;
const cell=(path,vals,b)=>`<circle r="4.5" stroke="rgba(0,0,0,.25)"><animateMotion dur="6s" begin="${b}s" repeatCount="indefinite" path="${path}"/><animate attributeName="fill" values="${vals}" keyTimes="0;.42;.58;1" dur="6s" begin="${b}s" repeatCount="indefinite"/></circle>`;
return svg(`
<defs>${grad('single_circ_g')}</defs>
<line x1="300" y1="40" x2="300" y2="370" stroke="#b9c8c4" stroke-width="2" stroke-dasharray="6 6"/>
${txt(150,22,'دورة مفردة (سمكة)',15)}${txt(455,22,'دورة مزدوجة (ثديي)',15)}
<!-- سمكة صغيرة -->
<g transform="translate(40 45)"><path d="M0 0 Q20 -14 40 0 Q20 14 0 0 Z" fill="#7fb3e6" stroke="#2f6fa8" stroke-width="2"/><path d="M40 0 L52 -8 L52 8 Z" fill="#7fb3e6" stroke="#2f6fa8" stroke-width="2"/><circle cx="10" cy="-2" r="2" fill="#12342e"/></g>
<!-- حلقة السمكة -->
<path d="${s1}" fill="none" stroke="rgba(0,0,0,.25)" stroke-width="18" stroke-linecap="round"/>
<path d="${s1}" fill="none" stroke="${BLUE}" stroke-width="12"/>
<path d="${s2}" fill="none" stroke="rgba(0,0,0,.25)" stroke-width="18" stroke-linecap="round"/>
<path d="${s2}" fill="none" stroke="${RED}" stroke-width="12"/>
<path d="${s3}" fill="none" stroke="rgba(0,0,0,.25)" stroke-width="18" stroke-linecap="round"/>
<path d="${s3}" fill="none" stroke="${BLUE}" stroke-width="12"/>

      {title:'لماذا الدورة المزدوجة أفضل؟', text:['بعد مرور الدم بالشعيرات الرقيقة في الرئتين **ينخفض ضغطه**؛ فيعود إلى القلب ليُضخّ من جديد **بضغط عالٍ** إلى الجسم.','النتيجة: وصول الأكسجين والغذاء إلى الأنسجة **أسرع وبكمية أكبر**.','يدعم ذلك **معدّل الأيض المرتفع** عند الثدييات والطيور، وثبات حرارة الجسم، والنشاط الكبير.','في السمكة يصل الدم إلى الجسم بضغط منخفض بعد الخياشيم، فتكون الحيوانات ذات الدورة المفردة أقل في معدّل الأيض عادةً.'], vis:{kind:'compare', cols:[{icon:'🐟',title:'دورة مفردة',items:['قلب بحجرتَين','الدم يمرّ بالقلب مرة واحدة','ضغط منخفض بعد الخياشيم','معدّل أيض أقل']},{icon:'🐪',title:'دورة مزدوجة',items:['قلب بأربع حجرات','الدم يمرّ بالقلب مرتين','ضغط عالٍ إلى الجسم','معدّل أيض مرتفع']}]}, q:{t:'mcq', q:'ما السبب الرئيس لارتفاع الضغط الذي يصل به الدم إلى أنسجة الثديي؟', opts:['الرئتان تضخّان الدم','الدم يُضخّ من القلب مرة ثانية بعد الرئتين','الشعيرات الدموية واسعة','الدم أكثر لزوجة'], a:1, why:'عودة الدم إلى القلب بعد الرئتين تسمح بإعادة ضخّه بضغط عالٍ إلى الجسم.'}},
      {title:'مهام تمرين ١-١', tag:'تطبيق', text:['**أ**: ارسم مخططًا للجهاز الدوري المفرد (قلب ← خياشيم ← جسم ← قلب).','**ب**: كائن له جهاز دوري مزدوج: الإنسان أو أي ثديي (أو طائر).','**ج**: كائن له جهاز دوري مفرد: السمكة.','**د**: الحيوانات ذات الدورة المزدوجة معدّل أيضها مرتفع لأن الدم يصلها بضغط عالٍ فتحصل على الأكسجين بسرعة أكبر لتنفّس خلوي أنشط.'], vis:{kind:'steps', steps:[{icon:'✏️',t:'رسم المخطط المفرد بثلاثة مستطيلات وحلقة واحدة'},{icon:'🐪',t:'مثال للمزدوج: الجمل العربي'},{icon:'🐟',t:'مثال للمفرد: سمكة الهامور'},{icon:'🔥',t:'الربط: ضغط عالٍ ← أكسجين أكثر ← أيض مرتفع'}]}},

      {title:'رحلة الأكسجين من الأم إلى الجنين', text:['في **المشيمة** ينتشر الأكسجين من دم الأم إلى دم الجنين (دون اختلاط الدمَين).','يحمل **الوريد السرّي** الدم المؤكسج إلى **الوريد الأجوف** ثم إلى **الأذين الأيمن**.','هذا يختلف عن البالغ: عند البالغ يصل الدم المؤكسج أولًا إلى **الأذين الأيسر**.'], vis:{kind:'flow', steps:[{icon:'🤰',t:'دم الأم'},{icon:'🟣',t:'المشيمة'},{icon:'🧵',t:'الوريد السرّي'},{icon:'🔵',t:'الوريد الأجوف'},{icon:'🫀',t:'الأذين الأيمن'}]}, q:{t:'mcq', q:'الحجرة التي تتلقّى الدم المؤكسج أولًا في الجنين هي:', opts:['الأذين الأيسر','الأذين الأيمن','البطين الأيسر','البطين الأيمن'], a:1, why:'يصل الدم المؤكسج عبر الوريد الأجوف إلى الأذين الأيمن (الإجابة عن البند ب في التمرين).'}},
      {title:'الثقبة البيضوية: مختصر بين الأذينَين', text:['في **الحاجز** بين الأذين الأيمن والأذين الأيسر يوجد ثقب يُسمّى **الثقبة البيضوية (foramen ovale)**.','يمرّ معظم الدم من الأذين الأيمن **مباشرة إلى الأذين الأيسر**، ثم إلى البطين الأيسر والأبهر والجسم.','بذلك **يتجاوز الدم الرئتَين** غير العاملتَين، فلا يُهدر جهد القلب.'], note:'💡 هذا هو الجواب عن البند (ج): وظيفة الثقب هي السماح للدم بتجاوز الدورة الرئوية.', vis:{kind:'steps', steps:[{icon:'1️⃣',t:'الدم المؤكسج يدخل الأذين الأيمن'},{icon:'2️⃣',t:'يعبر الثقبة البيضوية إلى الأذين الأيسر'},{icon:'3️⃣',t:'البطين الأيسر يضخّه في الأبهر'},{icon:'4️⃣',t:'يصل الأكسجين إلى دماغ الجنين وجسمه'}]}},
      {title:'القناة الشريانية: مختصر ثانٍ', text:['بعض الدم يصل إلى **البطين الأيمن** ويُضخّ في **الشريان الرئوي**.','وعاء قصير يُسمّى **القناة الشريانية (ductus arteriosus)** يصل الشريان الرئوي بالأبهر، فيتحوّل الدم إلى الأبهر بدل الرئتين.','يظهر هذا الوعاء في رسم الكتاب **منقّطًا** لأنه يقع خلف الشريان الرئوي.'], vis:'fetal_heart', cap:'المختصران: الثقبة البيضوية (بين الأذينَين) والقناة الشريانية (شريان رئوي ← أبهر).', q:{t:'mcq', q:'القناة الشريانية تصل بين:', opts:['الأذينَين','البطينَين','الشريان الرئوي والأبهر','الوريد الأجوف والوريد الرئوي'], a:2, why:'تحوّل الدم من الشريان الرئوي إلى الأبهر متجاوزًا الرئتَين.'}},
      {title:'مقارنة: قلب الجنين وقلب البالغ', text:['في البالغ الجانبان **منفصلان تمامًا**، وفي الجنين توجد **وصلتان** تتجاوزان الرئتَين.','في الجنين يختلط الدم المؤكسج (من المشيمة) بقليل من الدم غير المؤكسج، لذا يكون دمه أقل تأكسجًا من دم البالغ.','بعد الولادة يجب أن يصبح القلب مثل قلب البالغ **بسرعة**.'], vis:{kind:'table', head:['وجه المقارنة','قلب الجنين','قلب البالغ'], rows:[['مصدر الأكسجين','المشيمة (دم الأم)','الرئتان'],['أول حجرة تتلقّى الدم المؤكسج','الأذين الأيمن','الأذين الأيسر'],['الحاجز بين الأذينَين','فيه الثقبة البيضوية','مغلق تمامًا'],['شريان رئوي ← أبهر','القناة الشريانية مفتوحة','لا وصلة'],['الدم إلى الرئتين','قليل جدًا','كل دم الجانب الأيمن']]}},
      {title:'الأنفاس الأولى وإغلاق الثقب', text:['عند الولادة يأخذ المولود **أول أنفاسه**: تتمدّد الرئتان وتمتلئان هواءً ويزداد تدفّق الدم إليهما.','يتغيّر الضغط بين الأذينَين فتنطبق سديلة على **الثقبة البيضوية** فتنغلق، وتنقبض **القناة الشريانية** وتنغلق خلال أيام.','**أهمية ذلك**: يجب أن يمرّ كل دم الجانب الأيمن بالرئتين ليتأكسج؛ وإلّا اختلط الدم غير المؤكسج بالمؤكسج فقلّ الأكسجين الواصل إلى الأنسجة.'], note:'💡 إذا لم ينغلق الثقب («ثقب في القلب») يظهر على الطفل ازرقاق وتعب سريع، وقد يحتاج إلى تدخّل طبي.', vis:{kind:'cycle', center:'👶', steps:[{icon:'🌬️',t:'أول نفَس'},{icon:'🫁',t:'الرئتان تتمدّدان'},{icon:'🩸',t:'دم أكثر إلى الرئتين'},{icon:'⚖️',t:'يتغيّر الضغط بين الأذينَين'},{icon:'🚪',t:'تنغلق الثقبة البيضوية'},{icon:'✅',t:'دورة مزدوجة كاملة'}]}, q:{t:'mcq', q:'لماذا يجب أن تنغلق الثقبة البيضوية بسرعة بعد الولادة؟', opts:['لتقليل ضربات القلب','لأن الرئتين بدأتا العمل ويجب أن يمرّ بهما دم الجانب الأيمن كله','لمنع الدم من الوصول إلى المشيمة','لأن الحاجز يصغر'], a:1, why:'بعد أول نفَس تصبح الرئتان مصدر الأكسجين، فلا بدّ من فصل الدورتَين لمنع الاختلاط.'}},
      {title:'ربط بالحياة', text:['يُجرى للمواليد في مستشفيات سلطنة عُمان فحص باستخدام **السماعة** وقياس **تشبّع الأكسجين** لاكتشاف أي عيب خلقي في القلب مبكرًا.','بقاء الثقبة البيضوية مفتوحة هو أحد أشيع العيوب البسيطة، وكثير من الحالات تنغلق تلقائيًّا في السنة الأولى.','فهم دورة الجنين يساعد الأطباء على تفسير سبب **ازرقاق** بعض المواليد.'], vis:{kind:'cards', items:[{icon:'🩺',title:'الفحص المبكر',text:'السماعة وقياس الأكسجين'},{icon:'💙',title:'ازرقاق',text:'دلالة على اختلاط الدم'},{icon:'⏳',title:'انغلاق تلقائي',text:'غالبًا في السنة الأولى'},{icon:'🏥',title:'تدخّل طبي',text:'إغلاق الثقب عند الحاجة'}]}},
      {title:'الخلاصة', tag:'خلاصة', text:['الجنين يحصل على الأكسجين من **المشيمة**، ويصل الدم المؤكسج إلى **الأذين الأيمن** أولًا.','**الثقبة البيضوية** (بين الأذينَين) و**القناة الشريانية** (شريان رئوي ← أبهر) تتجاوزان الرئتَين غير العاملتَين.','مع **أول نفَس** تنغلق الوصلتان فيصبح القلب مضخّتَين منفصلتَين كقلب البالغ.'], vis:{kind:'compare', cols:[{icon:'👶',title:'قبل الولادة',items:['رئتان غير عاملتَين','ثقبة بيضوية مفتوحة','قناة شريانية مفتوحة','الأكسجين من المشيمة']},{icon:'🧒',title:'بعد الولادة',items:['رئتان عاملتان','الثقبة مغلقة','القناة مغلقة','الأكسجين من الهواء']}]}}

    slides:[
      {title:'رقم يُنقذ حياة', tag:'تمهيد', text:['في عيادات القلب يستخدم الأطباء **جداول بيانات** لتقدير احتمال إصابة الشخص بنوبة قلبية خلال السنوات المقبلة.','في هذا التمرين ستتدرّب على **اختيار المعلومات المناسبة من جدول** واستخدامها في موقف من الحياة اليومية.','أولًا: لنفهم ما النوبة القلبية ولماذا تحدث.'], vis:'coronary', cap:'القلب مع الشرايين التاجية، ولويحة دهنية تُضيّق أحدها.'},
      {title:'الشرايين التاجية ومرض القلب التاجي', text:['**الشرايين التاجية** تتفرّع من الأبهر وتجري على سطح القلب لتزوّد **عضلة القلب** بالدم المؤكسج والجلوكوز.','**مرض القلب التاجي (CHD)**: تتراكم **لويحة دهنية** (كوليسترول ودهون) في جدار الشريان التاجي فيضيق ويتصلّب.','تصل عضلة القلب كمية أقل من الأكسجين، فيشعر المريض بـ**ألم في الصدر** (الذبحة) خاصة عند الجهد.'], vis:{kind:'steps', steps:[{icon:'🍔',t:'دهون زائدة في الدم'},{icon:'🟡',t:'تراكم لويحة في جدار الشريان التاجي'},{icon:'⛔',t:'تضيّق التجويف وقلة الأكسجين للعضلة'},{icon:'🩸',t:'تكوّن خثرة على اللويحة'},{icon:'💔',t:'انسداد كامل: نوبة قلبية'}]}, q:{t:'mcq', q:'الشرايين التاجية تزوّد بالدم:', opts:['الدماغ','عضلة القلب','الرئتين','الكليتين'], a:1, why:'Coronary أي تاجية: تحيط بالقلب كالتاج وتغذّي عضلته.'}},
      {title:'ما النوبة القلبية؟', text:['إذا تكوّنت **خثرة (جلطة)** على اللويحة فقد تسدّ الشريان التاجي **تمامًا**.','الجزء من عضلة القلب بعد الانسداد **يُحرم من الأكسجين** فيتوقّف تنفّسه الخلوي وقد تموت خلاياه.','قد يفقد القلب قدرته على الضخّ المنتظم، وهذا هو **النوبة القلبية**، وقد تكون قاتلة.'], note:'💡 الإسعاف السريع مهم: كل دقيقة تأخير تعني موت مزيد من خلايا العضلة.', vis:'coronary', cap:'اللويحة ← الخثرة ← الانسداد.'},
      {title:'عوامل الخطر', text:['**التدخين**: النيكوتين يرفع الضغط وأول أكسيد الكربون يقلّل الأكسجين ويضرّ بجدار الأوعية.','**الغذاء** الغني بالدهون المشبعة والملح، و**السمنة**، و**قلة الحركة**.','**السكّري**: خلل في تنظيم تركيز الجلوكوز يضرّ بالأوعية على المدى الطويل (يمكن السيطرة عليه لا شفاؤه).','**الضغط النفسي**، **التقدّم في العمر**، **الوراثة**، والذكور أكثر عرضة من النساء قبل سنّ الخمسين.'], vis:{kind:'cards', items:[{icon:'🚬',title:'التدخين',text:'يرفع الخطر إلى الضعف أو أكثر'},{icon:'🍟',title:'الغذاء والسمنة',text:'دهون مشبعة وملح'},{icon:'🍬',title:'السكّري',text:'يضرّ بجدار الأوعية'},{icon:'🛋️',title:'قلة الحركة',text:'ضعف اللياقة'},{icon:'😰',title:'الضغط النفسي',text:'يرفع ضغط الدم'},{icon:'🎂',title:'العمر والوراثة',text:'لا يمكن تغييرهما'}]}, q:{t:'mcq', q:'أي عامل خطر لا يمكن للشخص تغييره؟', opts:['التدخين','الغذاء','التقدّم في العمر','قلة الحركة'], a:2, why:'العمر والوراثة والجنس عوامل غير قابلة للتعديل؛ الباقي نمط حياة.'}},
      {title:'الجدول ١-١: احتمال الإصابة خلال ٥ سنوات (نساء)', tag:'بيانات', text:['النسبة المئوية للنساء المتوقّع تعرّضهن لنوبة قلبية في غضون **خمس سنوات**، بحسب **العمر** و**التدخين** و**السكّري**.','لاحظ: في كل عمر يزيد التدخين الخطر، ويزيده السكّري أكثر، ويجتمع الاثنان فيتضاعف.','لاحظ أيضًا أن الخطر يرتفع مع **العمر** في كل الفئات.'], vis:{kind:'table', head:['العمر','غير مدخّنة سليمة','غير مدخّنة مصابة بالسكّري','مدخّنة سليمة','مدخّنة مصابة بالسكّري'], rows:[['٤٠','١٪','٣٪','٤٪','٧٪'],['٥٠','٣٪','٧٪','٦٪','١٣٪'],['٦٠','٥٪','١٢٪','١٢٪','٢٢٪'],['٧٠','٧٪','٢٣٪','١٥٪','٣٣٪']]}, cap:'الجدول ١-١ من كتاب النشاط (نساء).'},
      {title:'قراءة البيانات بصريًّا', text:['عند عمر ٦٠ سنة: غير المدخّنة السليمة ٥٪، والمدخّنة المصابة بالسكّري ٢٢٪ — أي **أكثر من أربعة أمثال**.','العاملان معًا (تدخين + سكّري) أخطر بكثير من أحدهما وحده.'], vis:{kind:'bars', items:[{t:'غير مدخّنة سليمة',v:5,label:'٥٪'},{t:'غير مدخّنة + سكّري',v:12,label:'١٢٪'},{t:'مدخّنة سليمة',v:12,label:'١٢٪'},{t:'مدخّنة + سكّري',v:22,label:'٢٢٪'}], cap:'احتمال النوبة القلبية خلال ٥ سنوات عند عمر ٦٠ سنة'}, q:{t:'mcq', q:'عند عمر ٧٠: كم يزيد التدخين الخطر لدى امرأة سليمة من السكّري؟', opts:['من ٧٪ إلى ١٥٪','من ٧٪ إلى ٢٣٪','من ١٪ إلى ٤٪','من ٢٣٪ إلى ٣٣٪'], a:0, why:'العمود «غير مدخّنة سليمة» عند ٧٠ = ٧٪، و«مدخّنة سليمة» = ١٥٪.'}},
      {title:'الحالة: مريضة عمرها ٥٤ سنة، مدخّنة ومصابة بالسكّري', tag:'تطبيق', text:['**(أ)** عمرها بين ٥٠ و٦٠؛ الخطر للمدخّنة المصابة بالسكّري: ١٣٪ عند ٥٠ و٢٢٪ عند ٦٠ ← احتمالها **نحو ١٣–٢٢٪** (تقريبًا ١٦–١٧٪)، أي نحو واحدة من كل ستّ نساء مثلها.','**(ب)** الإجراءات: **الإقلاع عن التدخين** (يهبط الخطر إلى ٧٪ عند ٥٠)، **ضبط السكّري** بالدواء والغذاء، تقليل الدهون المشبعة والملح، **ممارسة الرياضة**، إنقاص الوزن، تقليل الضغط النفسي.','**(ج)** كيف حُدّدت البيانات؟ بدراسات تتبّعت **أعدادًا كبيرة من النساء لسنوات** مع تسجيل العمر والتدخين والسكّري، وحُسبت نسبة من أُصبن فعلًا بنوبة قلبية في كل فئة.'], vis:{kind:'flow', steps:[{icon:'🔎',t:'اختيار الصفّ والعمود المناسبَين'},{icon:'🔢',t:'تقدير الخطر بين ٥٠ و٦٠'},{icon:'💬',t:'إخبار المريضة بلغة واضحة'},{icon:'✅',t:'اقتراح إجراءات تقلّل الخطر'}]}},
      {title:'ربط بالحياة في عُمان', text:['أمراض القلب من أهمّ أسباب الوفاة في سلطنة عُمان والعالم؛ لذلك تنظّم وزارة الصحة **حملات للإقلاع عن التدخين** وفحص السكّري وضغط الدم.','المشي في الحدائق والكورنيش، وتقليل المشروبات السكّرية، والحلوى الغنية بالدهون، خيارات بسيطة تُخفض الخطر.','تذكّر: عوامل الخطر تتجمّع؛ إزالة عامل واحد (مثل التدخين) تُحدث فرقًا كبيرًا في الجدول.'], vis:{kind:'compare', cols:[{icon:'⚠️',title:'يزيد الخطر',items:['التدخين','الدهون المشبعة والملح','قلة الحركة والسمنة','السكّري غير المنضبط']},{icon:'💚',title:'يقلّل الخطر',items:['الإقلاع عن التدخين','غذاء متوازن بالخضروات والفاكهة','٣٠ دقيقة حركة يوميًّا','فحوص دورية وضبط السكّري']}]}},
      {title:'الخلاصة', tag:'خلاصة', text:['**مرض القلب التاجي**: تضيّق الشرايين التاجية بلويحات دهنية ← نقص أكسجين لعضلة القلب ← خثرة وانسداد ← **نوبة قلبية**.','عوامل الخطر: تدخين، غذاء غني بالدهون والملح، قلة حركة، سكّري، ضغط نفسي، عمر، وراثة.','قراءة الجدول: اختر العمر ثم العمود المناسب للتدخين والسكّري؛ العاملان معًا يضاعفان الخطر.'], vis:{kind:'cards', items:[{icon:'🫀',title:'الشريان التاجي',text:'يغذّي عضلة القلب'},{icon:'🟡',title:'اللويحة',text:'دهون تُضيّق التجويف'},{icon:'🩸',title:'الخثرة',text:'انسداد كامل'},{icon:'📊',title:'الجدول',text:'العمر × التدخين × السكّري'}]}}

        {q:'من الجدول ١-١: احتمال إصابة امرأة غير مدخّنة مصابة بالسكّري عمرها ٥٠ سنة:', opts:['٣٪','٧٪','٦٪','١٣٪'], a:1, why:'صفّ ٥٠، عمود «غير مدخّنة مصابة بالسكّري».'},
        {q:'المريضة في التمرين (٥٤ سنة، مدخّنة، مصابة بالسكّري): احتمالها التقريبي:', opts:['أقل من ٣٪','بين ١٣٪ و٢٢٪','٣٣٪','٧٠٪'], a:1, why:'بين قيمتَي ٥٠ (١٣٪) و٦٠ (٢٢٪) للمدخّنة المصابة بالسكّري.'},
        {q:'إذا أقلعت المريضة نفسها عن التدخين وضبطت السكّري، فأي قيمة يقترب منها خطرها بعد سنوات؟', opts:['٣٣٪','١٣٪','نحو ٣–٥٪','٢٣٪'], a:2, why:'غير مدخّنة سليمة بين ٥٠ (٣٪) و٦٠ (٥٪)؛ الضبط يقرّبها من هذه الفئة.'},
        {q:'أي مقارنة صحيحة من الجدول؟', opts:['التدخين يقلّل الخطر عند الكبار','السكّري وحده عند ٧٠ (٢٣٪) أخطر من التدخين وحده عند ٧٠ (١٥٪)','العمر لا يؤثّر','المدخّنة السليمة عند ٤٠ أخطر من غير المدخّنة المصابة بالسكّري عند ٧٠'], a:1, why:'قارن الأعمدة في صفّ ٧٠: ٢٣٪ مقابل ١٥٪.'},
        {q:'لماذا يجب على الطبيب ألّا يقول للمريضة «ستُصابين حتمًا»؟', opts:['لأن النسبة احتمال في فئة كبيرة لا حكم على فرد','لأن الجدول خاطئ','لأن النوبة لا تحدث للنساء','لأن السكّري يحمي القلب'], a:0, why:'١٧٪ تعني أن نحو ١٧ من كل ١٠٠ امرأة مثلها يُصبن؛ الباقي لا.'},
        {q:'أي إجراء يقلّل خطر النوبة القلبية؟', opts:['زيادة الدهون المشبعة','ممارسة الرياضة بانتظام','التدخين باعتدال','إهمال فحص السكّري'], a:1, why:'الرياضة تقوّي القلب وتخفض الوزن والضغط.'},
        {q:'لماذا تُصنَّف بيانات الجدول بحسب العمر؟', opts:['لأن الخطر يزيد مع العمر في كل الفئات','لأن الشابّات لا يُصبن أبدًا','لأن العمر يقلّل الخطر','بلا سبب'], a:0, why:'لكل فئة عمرية قيم مختلفة تزداد مع التقدّم في العمر.'},
        {q:'أفضل وصف لكيفية بناء جدول مثل الجدول ١-١:', opts:['دراسة تتبّع آلاف النساء لسنوات مع تسجيل من أُصيبت بنوبة وعواملها','قياس نبض امرأة واحدة','تجربة على الجرذان','استفتاء عن الرأي'], a:0, why:'الدراسات الوبائية طويلة المدى تعطي النسب الفعلية.'}
      ],
      reflect:['أي عامل خطر في حياتك أو حياة أحد أفراد عائلتك يمكن تغييره من اليوم؟ وما الخطوة الأولى؟','لماذا تظنّ أن إخبار المريض بـ«نسبة مئوية» أفضل من إخباره بـ«خطر مرتفع» فقط؟'],
      summary:'**مرض القلب التاجي** هو تضيّق الشرايين التاجية بلويحات دهنية، وقد تسدّها **خثرة** فتُحرم عضلة القلب من الأكسجين وتحدث **النوبة القلبية**. **عوامل الخطر** تشمل التدخين والغذاء الدهني وقلة الحركة والسكّري والضغط النفسي والعمر والوراثة، وتتضاعف عند اجتماعها. تعلّمنا قراءة **جدول بيانات** لتقدير خطر فرد وتقديم نصيحة مبنية على الدليل.'
    }

  { id:'l1_4', num:'٤-١', title:'التغيرات التي تطرأ على الدم في المرتفعات', en:'Changes in blood at high altitude', ws:false,
    preIntro:'من يصعد جبل شمس (أعلى قمم عُمان) يلاحظ أن تنفّسه أسرع وقلبه أسرع. ماذا يحدث في دمه لو بقي هناك أسابيع؟',
    pre:[
      {t:'mcq', q:'ما وظيفة خلايا الدم الحمراء؟', opts:['مقاومة الميكروبات','نقل الأكسجين بالهيموجلوبين','تجلّط الدم','هضم الغذاء'], a:1, why:'يرتبط الأكسجين بالهيموجلوبين في خلايا الدم الحمراء وينتقل إلى الأنسجة.'},
      {t:'tf', q:'كمية الأكسجين في كل نفَس تقلّ عند الارتفاعات الشاهقة لأن الهواء أقل كثافة.', a:true, why:'الهواء في المرتفعات أقل كثافة، فتدخل الرئتين كمية أقل من الأكسجين في كل شهيق.'},
      {t:'cloud', q:'اختر ما يرتبط بخلايا الدم الحمراء:', words:[{w:'الهيموجلوبين',ok:true},{w:'نقل الأكسجين',ok:true},{w:'بلا نواة',ok:true},{w:'إنتاج الأجسام المضادة',ok:false},{w:'شكل قرصي مقعّر',ok:true},{w:'تجلّط الدم',ok:false},{w:'الحديد',ok:true},{w:'الكلوروفيل',ok:false},{w:'تصنيع في نخاع العظم',ok:true}], why:'خلايا الدم الحمراء: قرص مقعّر الوجهَين، بلا نواة، مملوءة بالهيموجلوبين الحاوي للحديد، تُصنع في نخاع العظم.'},
      {t:'visual', vis:'altitude', q:'ماذا يحدث لعدد خلايا الدم الحمراء كلما بقي الشخص في المرتفعات؟', opts:['يقلّ','يبقى ثابتًا','يزداد تدريجيًّا','يختفي'], a:2, why:'يزداد إنتاجها لتعويض قلة الأكسجين في الهواء.'},
      {t:'open', q:'توقّع: لماذا يتدرّب كثير من العدّائين في مناطق مرتفعة قبل بطولات تُقام قرب مستوى سطح البحر؟'}
    ],
    slides:[
      {title:'هواء خفيف في القمم', tag:'تمهيد', text:['في الارتفاعات الشاهقة **تقلّ كثافة الهواء**، فتقلّ **كمية الأكسجين** الداخلة إلى الرئتين في كل نفَس.','عندما ينتقل شخص من مستوى سطح البحر إلى منطقة جبلية مرتفعة **تطرأ تغيّرات على دمه**.','في هذا التمرين نصف **الأنماط في التمثيل البياني بالأعمدة**، ونفسّرها بما نعرفه عن وظائف الدم، ثم نضع **تنبّؤات**.'], vis:'altitude', cap:'كلما ارتفعنا قلّ الأكسجين المتاح، وازداد عدد خلايا الدم الحمراء مع الأيام.'},
      {title:'تذكير: خلايا الدم الحمراء والهيموجلوبين', text:['خلية قرصية مقعّرة الوجهَين، **بلا نواة**، مملوءة بـ**الهيموجلوبين**.','يرتبط الأكسجين بالهيموجلوبين في الرئتين مكوّنًا **أوكسي هيموجلوبين**، ثم يتحرّر في الأنسجة.','كلما زاد عدد الخلايا الحمراء زادت **سعة الدم لحمل الأكسجين**.','تُصنع خلايا الدم الحمراء في **نخاع العظم**.'], vis:{kind:'cards', items:[{icon:'🔴',title:'الشكل',text:'قرص مقعّر: مساحة سطح كبيرة'},{icon:'🚫',title:'بلا نواة',text:'مكان أكبر للهيموجلوبين'},{icon:'🧲',title:'الهيموجلوبين',text:'بروتين بالحديد يرتبط بالأكسجين'},{icon:'🦴',title:'المصدر',text:'نخاع العظم'}]}, q:{t:'mcq', q:'الجزيء الذي يرتبط به الأكسجين داخل الخلية الحمراء:', opts:['الجلوكوز','الهيموجلوبين','الكوليسترول','الإنزيم'], a:1, why:'يحوي الحديد ويرتبط بالأكسجين بشكل عكوس.'}},
      {title:'دراسة الحالة: سنتان في المرتفعات', text:['شخص يعيش عند **مستوى سطح البحر** انتقل إلى منطقة مرتفعة وبقي **سنتَين** ثم عاد.','قِيس له **معدّل النبض** (نبضة/دقيقة) و**عدد خلايا الدم الحمراء** (مليون لكل مليمتر مكعّب) على مدار الأسابيع.','المخطط في الكتاب تمثيل بالأعمدة بمفتاح: أعمدة للنبض وأعمدة لعدد الخلايا.'], vis:{kind:'table', head:['المرحلة','الزمن (أسابيع)','ماذا نتوقّع؟'], rows:[['عند مستوى سطح البحر','٠','قيم طبيعية (النبض نحو ٧٠، الخلايا نحو ٥ ملايين)'],['الوصول إلى الارتفاع الشاهق','١ – ٥','النبض يرتفع أولًا؛ الخلايا تبدأ بالزيادة'],['الاستقرار في المرتفعات','١٥ – ١٠٠','النبض يعود قريبًا من الطبيعي؛ الخلايا مرتفعة'],['العودة إلى مستوى سطح البحر','١٠٢ – ١٠٦','الخلايا تعود تدريجيًّا إلى الطبيعي']]}},
      {title:'(أ) نمط معدّل النبض', tag:'وصف الأنماط', text:['عند الوصول إلى الارتفاع يرتفع النبض **بسرعة** في الأسابيع الأولى: القلب يضخّ أسرع ليعوّض قلة الأكسجين في كل لتر دم.','مع مرور الأسابيع **ينخفض النبض تدريجيًّا** ويقترب من قيمته الأصلية لأن الدم أصبح أغنى بخلايا الدم الحمراء.','عند العودة إلى مستوى سطح البحر يعود النبض إلى قيمته الطبيعية أو أقل قليلًا مؤقّتًا.'], note:'💡 القيم في الأعمدة تقريبية توضيحية لقراءة النمط؛ اعتمد في إجابتك على قراءة أعمدة الكتاب.', vis:{kind:'bars', items:[{t:'الأسبوع ٠ (بحر)',v:70,label:'~٧٠'},{t:'الأسبوع ١ (جبل)',v:82,label:'مرتفع'},{t:'الأسبوع ٥',v:76,label:'يهبط'},{t:'الأسبوع ١٥',v:72,label:'يقترب'},{t:'الأسبوع ١٠٠',v:70,label:'~طبيعي'},{t:'الأسبوع ١٠٦ (بحر)',v:68,label:'طبيعي'}], cap:'معدّل النبض (نبضة/دقيقة) — نمط توضيحي'}, q:{t:'mcq', q:'لماذا يرتفع النبض في الأسابيع الأولى بالمرتفعات؟', opts:['بسبب البرد','لتعويض قلة الأكسجين بضخّ دم أكثر إلى الأنسجة في كل دقيقة','لأن الدم أصبح أثقل','لأن الرئتين توقّفتا'], a:1, why:'القلب يعوّض نقص الأكسجين في كل لتر دم بزيادة عدد اللترات المضخوخة في الدقيقة.'}},
      {title:'(ب) نمط عدد خلايا الدم الحمراء', text:['عند مستوى سطح البحر نحو **٥ ملايين** لكل مليمتر مكعّب.','في المرتفعات يزداد العدد **تدريجيًّا على مدى أسابيع** حتى يصل إلى نحو ٦–٧ ملايين ويبقى مرتفعًا طوال الإقامة.','بعد العودة إلى مستوى سطح البحر **ينخفض العدد تدريجيًّا** عائدًا إلى قيمته الأصلية خلال أسابيع.','الزيادة **أبطأ** من تغيّر النبض لأن صنع خلايا جديدة في نخاع العظم يستغرق وقتًا.'], vis:{kind:'bars', items:[{t:'الأسبوع ٠ (بحر)',v:5,label:'~٥'},{t:'الأسبوع ١',v:5.1,label:'~٥'},{t:'الأسبوع ٥',v:5.7,label:'يزداد'},{t:'الأسبوع ١٥',v:6.4,label:'مرتفع'},{t:'الأسبوع ١٠٠',v:6.8,label:'~٧'},{t:'الأسبوع ١٠٦ (بحر)',v:5.6,label:'يهبط'}], cap:'عدد خلايا الدم الحمراء (مليون/مم³) — نمط توضيحي'}},
      {title:'(ج، د) التفسير: لماذا تزداد الخلايا الحمراء؟', text:['وظيفة الخلايا الحمراء: **نقل الأكسجين** من الرئتين إلى الأنسجة.','في الهواء الخفيف يحمل الدم أكسجينًا أقل، فيستشعر الجسم النقص ويحفّز **نخاع العظم** على إنتاج **مزيد من الخلايا الحمراء**.','خلايا أكثر = هيموجلوبين أكثر = **سعة أكبر لحمل الأكسجين** من كل نفَس، فيتكيّف الجسم ويعود النبض إلى الطبيعي.'], vis:{kind:'cycle', center:'🏔️', steps:[{icon:'🌬️',t:'هواء أقل كثافة'},{icon:'📉',t:'أكسجين أقل في الدم'},{icon:'❤️‍🔥',t:'النبض يرتفع مؤقّتًا'},{icon:'🦴',t:'نخاع العظم ينتج خلايا حمراء أكثر'},{icon:'🔴',t:'هيموجلوبين أكثر'},{icon:'✅',t:'أكسجين كافٍ للأنسجة، النبض يعود طبيعيًّا'}]}, q:{t:'mcq', q:'أين تُصنع خلايا الدم الحمراء الإضافية؟', opts:['في الرئتين','في نخاع العظم','في القلب','في الكبد فقط'], a:1, why:'نخاع العظم هو مصنع خلايا الدم.'}},
      {title:'(هـ) تدريب الرياضيين في المرتفعات', tag:'تطبيق', text:['تحتاج العضلات إلى **إمداد جيّد من الأكسجين** لتعمل بجهد وسرعة (تنفّس هوائي يحرّر طاقة).','بعد أشهر من التدريب في المرتفعات يصبح لدى الرياضي **عدد أكبر من خلايا الدم الحمراء**.','عند النزول للمنافسة قرب مستوى سطح البحر يبقى العدد مرتفعًا **لأسابيع** (كما يُظهر المخطط بعد العودة)، فيحمل دمه أكسجينًا أكثر إلى عضلاته، فيؤدّي أفضل ويتأخّر إجهاده.'], note:'💡 توقيت النزول مهم: لو تأخّر أشهرًا لعاد عدد الخلايا إلى الطبيعي وضاعت الفائدة.', vis:{kind:'flow', steps:[{icon:'🏔️',t:'أشهر تدريب في المرتفعات'},{icon:'🔴',t:'خلايا حمراء أكثر'},{icon:'⬇️',t:'النزول للمنافسة'},{icon:'💨',t:'أكسجين أكثر للعضلات'},{icon:'🏆',t:'أداء أفضل وإجهاد أقل'}]}},
      {title:'ربط بعُمان', text:['**جبل شمس** يرتفع نحو ٣٠٠٠ متر؛ زوّاره من الساحل يشعرون بسرعة النبض والتنفّس في اليوم الأول.','يُتوقّع، بحسب ما تعلّمناه، أن يكون عدد خلايا الدم الحمراء لدى المقيمين دائمًا في قرى **الجبل الأخضر** أعلى قليلًا منه لدى سكان مسقط الساحلية.','مرتفعات إثيوبيا وكينيا التي يتدرّب فيها عدّاؤو المسافات الطويلة تزيد على ٢٠٠٠ متر.'], vis:{kind:'compare', cols:[{icon:'🏖️',title:'مسقط (سطح البحر)',items:['هواء كثيف، أكسجين وفير','نبض راحة طبيعي','خلايا حمراء نحو ٥ ملايين/مم³']},{icon:'🏔️',title:'جبل شمس (~٣٠٠٠ م)',items:['هواء أخفّ، أكسجين أقل','نبض أسرع أول أيام','خلايا حمراء تزداد مع الأسابيع']}]}},
      {title:'الخلاصة', tag:'خلاصة', text:['في المرتفعات يقلّ الأكسجين في كل نفَس ← **يرتفع النبض** مؤقّتًا ← يزداد **عدد خلايا الدم الحمراء** تدريجيًّا ← يتكيّف الجسم ويعود النبض طبيعيًّا.','بعد العودة إلى مستوى سطح البحر يعود العدد إلى الطبيعي **خلال أسابيع**.','يستفيد الرياضيون من هذا التكيّف بالتدريب في المرتفعات قبل المنافسة.'], vis:{kind:'steps', steps:[{icon:'1️⃣',t:'قلة الأكسجين في الهواء'},{icon:'2️⃣',t:'ارتفاع النبض السريع'},{icon:'3️⃣',t:'زيادة الخلايا الحمراء البطيئة'},{icon:'4️⃣',t:'تكيّف وعودة النبض'},{icon:'5️⃣',t:'العودة: انخفاض الخلايا تدريجيًّا'}]}}
    ],
    games:[
      {id:'g1', type:'quiz', time:20, runner:'🏔️', qs:[
        {q:'لماذا تقلّ كمية الأكسجين الداخلة للرئتين في المرتفعات؟', opts:['لأن الهواء أكثر كثافة','لأن الهواء أقل كثافة','لأن الرئتين تصغران','لأن الأكسجين يتجمّد'], a:1, why:'كما ورد في نص التمرين: تقلّ كثافة الهواء.'},
        {q:'وظيفة خلايا الدم الحمراء:', opts:['نقل الأكسجين','مقاومة العدوى','تجلّط الدم','نقل الهرمونات فقط'], a:0, why:'بواسطة الهيموجلوبين.'},
        {q:'التغيّر الأسرع بعد الوصول إلى المرتفعات:', opts:['زيادة عدد الخلايا الحمراء','ارتفاع معدّل النبض','نموّ الرئتين','زيادة الطول'], a:1, why:'النبض يستجيب فورًا؛ إنتاج الخلايا يحتاج أسابيع.'},

      {title:'الصمامات: يغلقها ضغط الدم', text:['بين كل أذين وبطين **صمام أذيني-بطيني**، وعند مخرج كل بطين **صمام هلالي**.','عندما ينقبض البطين الأيسر **يرتفع ضغط الدم** داخله فيدفع سديلتَي الصمام الأذيني-البطيني إلى الانطباق فتنغلق، فلا يرتدّ الدم إلى الأذين.','الصمام **لا يغلق تلقائيًّا بنفسه**؛ لا عضلات فيه، بل يستجيب لفرق الضغط. العبارة الصحيحة في الزوج ٢: **(أ)**.'], note:'💡 صوت «لَب-دَب» الذي يسمعه الطبيب بالسماعة هو صوت انغلاق الصمامات: الأذينية-البطينية ثم الهلالية.', vis:'heart', cap:'الصمامات تضمن جريان الدم في اتجاه واحد.'},
      {title:'لماذا يتسارع النبض عند الجهد؟', text:['عند الركض تعمل العضلات بقوة وتحتاج إلى **مزيد من الأكسجين والجلوكوز** للتنفّس الخلوي، وتنتج **ثاني أكسيد الكربون** أكثر.','يضرب القلب أسرع وأقوى ليضخّ **دمًا أكثر في الدقيقة** إلى العضلات ويحمل ثاني أكسيد الكربون بعيدًا.','التنفّس السريع نتيجة موازية لا سبب. العبارة الصحيحة في الزوج ٣: **(ب)**.'], vis:{kind:'bars', items:[{t:'راحة',v:70,label:'~٧٠'},{t:'مشي',v:100,label:'~١٠٠'},{t:'هرولة',v:130,label:'~١٣٠'},{t:'ركض سريع',v:170,label:'~١٧٠'}], cap:'معدّل النبض التقريبي (نبضة/دقيقة) بحسب الجهد'}, q:{t:'mcq', q:'السبب الصحيح لتسارع القلب في الرياضة:', opts:['لأننا نتنفّس بسرعة','لحاجة العضلات إلى مزيد من الأكسجين','لأن الدم يصبح أخفّ','لأن الصمامات تفتح أكثر'], a:1, why:'الأكسجين والجلوكوز للتنفّس الخلوي في العضلات العاملة.'}},
      {title:'لماذا جدار البطين الأيسر أسمك؟', text:['البطين الأيمن يضخّ الدم إلى الرئتَين القريبتَين فقط: **مسافة قصيرة وضغط منخفض**.','البطين الأيسر يضخّ الدم إلى **الجسم كله** (حتى أصابع القدم): يحتاج إلى **ضغط كبير** فجداره العضلي **أسمك**.','السماكة لا علاقة لها بكون الدم مؤكسجًا. العبارة الصحيحة في الزوج ٤: **(ب)**.'], vis:{kind:'compare', cols:[{icon:'🫁',title:'البطين الأيمن',items:['جدار أقل سماكة','يضخّ إلى الرئتَين فقط','ضغط منخفض','مسافة قصيرة']},{icon:'💪',title:'البطين الأيسر',items:['جدار عضلي سميك','يضخّ إلى الجسم كله','ضغط عالٍ','مسافة طويلة']}]}},
      {title:'الحاجز ومرض القلب التاجي', text:['**الحاجز** جدار عضلي يفصل **الدم المؤكسج** (الجانب الأيسر) عن **الدم غير المؤكسج** (الجانب الأيمن)؛ لا يفصل بين ضغطَين. الصحيحة في الزوج ٥: **(أ)**.','**مرض القلب التاجي** ينتج عن انسداد **الشرايين التاجية** التي تزوّد **عضلة القلب** بالدم المؤكسج، لا الشرايين المغذّية للدماغ (انسدادها يسبّب السكتة الدماغية). الصحيحة في الزوج ٦: **(أ)**.'], vis:'coronary', cap:'الشرايين التاجية على سطح القلب تغذّي عضلته.', q:{t:'mcq', q:'انسداد الشرايين المغذّية للدماغ يسبّب:', opts:['نوبة قلبية','سكتة دماغية','ربوًا','فقر دم'], a:1, why:'مرض القلب التاجي يخصّ شرايين القلب فقط.'}},
      {title:'قياس النبض عمليًّا', tag:'مهارة', text:['ضع إصبعَي السبّابة والوسطى (لا الإبهام) على **الرسغ** تحت قاعدة الإبهام، أو على **جانب الرقبة**.','اعدّ النبضات لمدة **٣٠ ثانية** واضرب في ٢، أو لمدة دقيقة كاملة للدقة.','قِس في الراحة، ثم بعد دقيقة من القفز، ثم كل دقيقة حتى يعود إلى الطبيعي: **زمن الاستشفاء** يقصر كلما زادت اللياقة.'], vis:'pulse', cap:'مواضع قياس النبض: الرسغ (الشريان الكعبري) والرقبة (الشريان السباتي).'},
      {title:'ورقة العمل: الأزواج الستة', tag:'ملخّص الإجابات', text:['١: **(ب)** ينقبض الجانبان معًا.','٢: **(أ)** ضغط الدم يغلق الصمام، لا «تلقائيًّا».','٣: **(ب)** لحاجة العضلات إلى الأكسجين.','٤: **(ب)** لإنتاج ضغط كبير، لا لأن الدم مؤكسج.','٥: **(أ)** الحاجز يفصل المؤكسج عن غير المؤكسج.','٦: **(أ)** انسداد شرايين عضلة القلب (التاجية).'], vis:{kind:'table', head:['الزوج','العبارة الصحيحة','خطأ العبارة الأخرى'], rows:[['١','ب','لا يسبق جانب الآخر'],['٢','أ','الصمام لا يغلق تلقائيًّا بل بالضغط'],['٣','ب','التنفّس السريع نتيجة لا سبب'],['٤','ب','السماكة للضغط لا لنوع الدم'],['٥','أ','الحاجز لا يفصل ضغطَين'],['٦','أ','الشرايين التاجية تغذّي القلب لا الدماغ']]}},
      {title:'الخلاصة', tag:'خلاصة', text:['الأذينان ينقبضان معًا ثم البطينان معًا؛ **الصمامات** تنغلق بفرق الضغط لمنع الارتداد.','النبض يتسارع عند الجهد لتزويد العضلات بـ**الأكسجين والجلوكوز**.','**البطين الأيسر** أسمك لأنه يضخّ بضغط عالٍ إلى الجسم كله؛ **الحاجز** يفصل الدم المؤكسج عن غير المؤكسج؛ **مرض القلب التاجي** انسداد شرايين عضلة القلب.'], vis:{kind:'cards', items:[{icon:'⏱️',title:'معًا',text:'الجانبان ينقبضان في الوقت نفسه'},{icon:'🚪',title:'الصمام',text:'يغلقه ضغط الدم'},{icon:'🏃',title:'الجهد',text:'أكسجين أكثر للعضلات'},{icon:'💪',title:'البطين الأيسر',text:'أسمك لضغط أعلى'},{icon:'🧱',title:'الحاجز',text:'يفصل نوعَي الدم'},{icon:'🫀',title:'التاجي',text:'شرايين عضلة القلب'}]}}

    slides:[
      {title:'ثلاثة أنواع من الأنابيب', tag:'تمهيد', text:['يجري الدم في شبكة طولها عشرات الآلاف من الكيلومترات من **الشرايين** و**الأوردة** و**الشعيرات الدموية**.','كل نوع **تركيبه يلائم وظيفته**: ضغط عالٍ، أو عودة هادئة، أو تبادل مع الخلايا.','في ورقة العمل ننظر إلى قطاع عرضي في **الشريان الأبهر (الأورطي)** و**الوريد الأجوف** ونصف الاختلافات في التركيب والمحتويات، ثم نصحّح خطأ شائعًا.'], vis:'vessels', cap:'قطاعات عرضية: شريان، وريد، شعيرة دموية.'},
      {title:'الشريان: جدار سميك لضغط عالٍ', text:['يستقبل الشريان الدم **مباشرة من البطين** بضغط عالٍ ونبضات قوية.','جداره **سميك** يحوي **عضلات وألياف مرنة** تتمدّد مع كل نبضة ثم تعود، فتحافظ على الدفع وتمنع تمزّق الجدار.','**التجويف ضيق** نسبيًّا مقارنة بسماكة الجدار.','الأبهر أكبر شريان؛ يخرج من البطين الأيسر ويحمل دمًا **مؤكسجًا**.'], vis:{kind:'cards', items:[{icon:'🧱',title:'جدار سميك',text:'عضلات وألياف مرنة'},{icon:'⭕',title:'تجويف ضيق',text:'نسبة الجدار إلى التجويف كبيرة'},{icon:'⚡',title:'ضغط عالٍ',text:'من انقباض البطين'},{icon:'💓',title:'نبض',text:'تمدّد الجدار مع كل انقباض'}]}, q:{t:'mcq', q:'لماذا يحتاج جدار الشريان إلى ألياف مرنة؟', opts:['ليمتصّ الأكسجين','ليتمدّد مع دفعة الدم ثم يعود فيحافظ على الضغط','ليمنع ارتداد الدم بالصمامات','ليصنع خلايا الدم'], a:1, why:'المرونة تُخفّف ذبذبات الضغط وتدفع الدم إلى الأمام.'}},
      {title:'الوريد: تجويف واسع وصمامات', text:['يعود الدم إلى القلب في الأوردة **بضغط منخفض** وبلا نبض واضح.','الجدار **رقيق** قليل العضلات، و**التجويف واسع** يستوعب كمية كبيرة من الدم.','**صمامات** على طول الوريد تمنع ارتداد الدم إلى الخلف، ويساعد **انقباض العضلات** المجاورة على دفعه نحو القلب.','الوريد الأجوف أكبر وريد؛ يصبّ في الأذين الأيمن ويحمل دمًا **غير مؤكسج**.'], vis:{kind:'cards', items:[{icon:'📄',title:'جدار رقيق',text:'قليل العضلات'},{icon:'⭕',title:'تجويف واسع',text:'يستوعب دمًا كثيرًا'},{icon:'🐢',title:'ضغط منخفض',text:'بلا نبض'},{icon:'🚪',title:'صمامات',text:'تمنع الارتداد'}]}},
      {title:'الشعيرات الدموية: موقع التبادل', text:['أوعية دقيقة جدًا جدارها **بسماكة خلية واحدة** وتجويفها يمرّ فيه كريّة واحدة تلو الأخرى.','المسافة القصيرة تسمح بـ**انتشار** سريع للأكسجين والجلوكوز إلى الخلايا، وثاني أكسيد الكربون والفضلات إلى الدم.','تُشكّل **شبكة واسعة** تصل الشرايين الصغيرة بالأوردة الصغيرة في كل نسيج.'], vis:{kind:'flow', steps:[{icon:'🔴',t:'شريان'},{icon:'🔸',t:'شريان صغير'},{icon:'🕸️',t:'شبكة شعيرات: تبادل'},{icon:'🔹',t:'وريد صغير'},{icon:'🔵',t:'وريد'}]}, q:{t:'mcq', q:'الميزة الأهمّ لجدار الشعيرة بسماكة خلية واحدة:', opts:['تحمّل الضغط العالي','مسافة انتشار قصيرة للتبادل السريع','منع ارتداد الدم','تخزين الدم'], a:1, why:'قِصر المسافة يسرّع الانتشار.'}},
      {title:'(١) اختلافان في الرسم: الأبهر مقابل الوريد الأجوف', tag:'ورقة العمل', text:['**الاختلاف الأول**: جدار الشريان الأبهر **أسمك بكثير** (عضلات وألياف مرنة) من جدار الوريد الأجوف الرقيق.','**الاختلاف الثاني**: تجويف الأبهر **أضيق** نسبيًّا ودائري منتظم، بينما تجويف الوريد الأجوف **أوسع** وقد يبدو غير منتظم الشكل.','(اختلاف إضافي قد يظهر: وجود **صمام** في الوريد ولا صمام في الشريان.)'], vis:'vessels', cap:'قارن سماكة الجدار وسعة التجويف بين الشريان والوريد.'},
      {title:'(٢) اختلافان في المحتويات', text:['**الاختلاف الأول**: دم الأبهر **غني بالأكسجين** (مؤكسج)، ودم الوريد الأجوف **قليل الأكسجين** (غير مؤكسج).','**الاختلاف الثاني**: دم الوريد الأجوف **غني بثاني أكسيد الكربون** (العائد من الأنسجة)، ودم الأبهر **قليل ثاني أكسيد الكربون**.','(أيضًا: يحمل دم الوريد الأجوف فضلات أكثر مثل **اليوريا**؛ ومن حيث الجريان: دم الأبهر تحت **ضغط عالٍ ونابض** ودم الوريد الأجوف تحت **ضغط منخفض**.)'], vis:{kind:'table', head:['وجه المقارنة','الشريان الأبهر','الوريد الأجوف'], rows:[['سماكة الجدار','سميك عضلي مرن','رقيق'],['التجويف','ضيق نسبيًّا','واسع'],['الصمامات','لا (إلا عند مخرج القلب)','نعم'],['الأكسجين في الدم','مرتفع','منخفض'],['ثاني أكسيد الكربون','منخفض','مرتفع'],['الضغط','عالٍ ونابض','منخفض ومنتظم'],['اتجاه الجريان','من القلب إلى الجسم','من الجسم إلى القلب']]}, q:{t:'mcq', q:'أي عبارة تصف محتوى الوريد الأجوف؟', opts:['غني بالأكسجين وبضغط عالٍ','قليل الأكسجين وبضغط منخفض','غني بالأكسجين وبضغط منخفض','قليل ثاني أكسيد الكربون'], a:1, why:'دم عائد من الأنسجة بعد تسليم الأكسجين.'}},
      {title:'(٣) تصحيح خطأ شائع', tag:'تفكير ناقد', text:['كتب طالب: «للشرايين جدران أكثر سماكة من جدران الأوردة لأنها تحمل الدم المؤكسج».','**الخطأ**: ربط سماكة الجدار بنوع الدم. الدليل: **الشريان الرئوي** جداره سميك مع أنه يحمل دمًا **غير مؤكسج**، و**الوريد الرئوي** جداره رقيق مع أنه يحمل دمًا **مؤكسجًا**.','**التصحيح**: للشرايين جدران أسمك لأن الدم فيها **تحت ضغط عالٍ** خارجًا من البطينَين، فيجب أن تتحمّل الضغط وتحافظ عليه.'], vis:{kind:'compare', cols:[{icon:'❌',title:'تفسير خاطئ',items:['السماكة بسبب الدم المؤكسج','ينقضه الشريان الرئوي (غير مؤكسج وسميك)','ينقضه الوريد الرئوي (مؤكسج ورقيق)']},{icon:'✅',title:'تفسير صحيح',items:['السماكة بسبب الضغط العالي','الدم يخرج مباشرة من البطين','الجدار يتحمّل الضغط ويحافظ عليه']}]}},
      {title:'ربط بالحياة', text:['عند قياس **ضغط الدم** في المركز الصحي، يُقاس ضغط الدم في الشريان (مثل ١٢٠/٨٠)؛ الرقم الأعلى عند انقباض البطين والأدنى عند انبساطه.','**الدوالي** في الساقَين تنتج عن ضعف صمامات الأوردة فيتجمّع الدم؛ يساعد المشي وتحريك عضلات الساق على دفع الدم عائدًا.','سحب عيّنة الدم في المختبر يكون من **الوريد** (ضغط منخفض وجدار رقيق يسهل اختراقه).'], vis:{kind:'cards', items:[{icon:'🩺',title:'ضغط الدم',text:'يُقاس في الشريان'},{icon:'🦵',title:'الدوالي',text:'ضعف صمامات الأوردة'},{icon:'💉',title:'عيّنة الدم',text:'تُسحب من الوريد'},{icon:'🚶',title:'المشي',text:'العضلات تضغط الأوردة'}]}},
      {title:'الخلاصة', tag:'خلاصة', text:['**الشريان**: جدار سميك عضلي مرن، تجويف ضيق، ضغط عالٍ، بلا صمامات (يحمل الدم من القلب).','**الوريد**: جدار رقيق، تجويف واسع، ضغط منخفض، صمامات (يعيد الدم إلى القلب).','**الشعيرة**: جدار بسماكة خلية واحدة للتبادل.','سماكة جدار الشريان بسبب **الضغط** لا بسبب **نوع الدم**.'], vis:{kind:'compare', cols:[{icon:'🔴',title:'الشريان الأبهر',items:['جدار سميك','تجويف ضيق','دم مؤكسج','ضغط عالٍ']},{icon:'🔵',title:'الوريد الأجوف',items:['جدار رقيق','تجويف واسع','دم غير مؤكسج','ضغط منخفض']}]}}

      {title:'ربط بالحياة', text:['في أثناء جائحة **كوفيد-١٩** (يسبّبه فيروس كورونا قريب من فيروس السارس) استخدمت مستشفيات عُمان أجهزة **قياس تشبّع الأكسجين** وأجهزة التنفّس الصناعي؛ الآلية ذاتها: تلف الحويصلات يقلّل الأكسجين.','**الكمّامة** والتباعد يمنعان انتقال القطرات التي تحمل الفيروس.','الغبار والرمال في الأجواء العُمانية يُرشّحها شعر الأنف والمخاط والأهداب قبل أن تصل إلى الحويصلات.'], vis:{kind:'cards', items:[{icon:'😷',title:'الكمّامة',text:'تحجز قطرات اللعاب'},{icon:'🩸',title:'تشبّع الأكسجين',text:'مؤشّر على كفاءة الحويصلات'},{icon:'🏥',title:'التنفّس الصناعي',text:'يدفع الهواء إلى الحويصلات'},{icon:'🌬️',title:'الأنف',text:'مرشّح طبيعي للغبار'}]}},

  { id:'l2_2', num:'٢-٢', title:'أسطح تبادل الغازات في جسم الجرذ', en:'Gas exchange surfaces in a rat', ws:false,
    preIntro:'الجرذ ثديي صغير تشبه رئتاه رئتَي الإنسان في التركيب. قاس باحثون مساحة حويصلاته الهوائية بأعمار مختلفة. ما الذي نتوقّع أن يحدث لها مع النموّ؟',

      {t:'mcq', q:'لماذا يحتاج الحيوان الأكبر كتلةً إلى مساحة تبادل غازات أكبر؟', opts:['لأن خلاياه أكبر','لأن عدد خلاياه التي تحتاج إلى الأكسجين أكبر','لأنه يشرب ماءً أكثر','لأن قلبه أصغر'], a:1, why:'كل خلية تتنفّس؛ خلايا أكثر تعني حاجة أكبر إلى الأكسجين.'},
      {t:'visual', vis:'alveolus', q:'ما الذي يقيسه الباحثون عندما يذكرون «المساحة السطحية للحويصلات»؟', opts:['حجم الرئة','مجموع مساحة جدران كل الحويصلات المتاحة للتبادل','طول القصبة','عدد الشعيرات'], a:1, why:'مساحة السطح هي ما يحدّد كمية الغاز المنتشرة في الثانية.'},
      {t:'cloud', q:'اختر ما يلزم لرسم تمثيل بياني خطّي جيّد:', words:[{w:'مسطرة',ok:true},{w:'عنوان لكل محور مع الوحدة',ok:true},{w:'مقياس مناسب ومنتظم',ok:true},{w:'إشارة x صغيرة لكل نقطة',ok:true},{w:'ألوان كثيرة عشوائية',ok:false},{w:'خط مستقيم بين كل نقطتَين',ok:true},{w:'رسم بالقلم الحبر السميك',ok:false},{w:'مفتاح يميّز المنحنيَين',ok:true},{w:'تخمين مواقع النقاط',ok:false}], why:'هذه هي معايير التقويم الذاتي في الكتاب: محاور بمسطرة، مقياس مناسب، عناوين ووحدات، نقاط دقيقة، خطوط واضحة.'},
      {t:'open', q:'توقّع: مع نموّ الجرذ من ٢١ يومًا إلى ٩٥ يومًا، هل تزداد نسبة مساحة الحويصلات إلى كتلة الجسم أم تقلّ؟ لماذا؟'}
