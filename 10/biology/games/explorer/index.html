    slides:[
      {title:'رئتا الجرذ ورئتا الإنسان', tag:'تمهيد', text:['هناك **تشابه في التركيب** بين رئتَي الجرذ ورئتَي الإنسان: قصبة، شعب، شعيبات، وحويصلات محاطة بشعيرات.','قام باحثون بقياس **المساحة السطحية للحويصلات** لإناث وذكور جرذان من أعمار مختلفة، وقياس **كتلة كل جرذ**.','في هذا التمرين نتدرّب على **رسم منحنيَين** على المحاور نفسها، و**تفسير البيانات** والتفكير في آثارها، مع **الاستشهاد بأرقام فعلية** في المقارنة.'], vis:'alveolus', cap:'الحويصلة سطح التبادل في كل الثدييات، صغيرها وكبيرها.'},
      {title:'الجدول ١-٢: النتائج', tag:'بيانات', text:['نسبة المساحة السطحية للحويصلات إلى كتلة الجسم (سم² لكل جرام) بحسب **العمر بالأيام**.','لاحظ أن العمر على المحور السيني **غير منتظم الفواصل** (٢١، ٣٣، ٤٥، ٦٠، ٩٥)؛ لذلك يجب اختيار مقياس منتظم للمحور ووضع كل نقطة في موقعها الصحيح.'], vis:{kind:'table', head:['العمر (بالأيام)','الذكور (سم²/جم)','الإناث (سم²/جم)'], rows:[['٢١','٢١٫٦','٢٣٫١'],['٣٣','١٥٫٤','١٥٫٢'],['٤٥','١٢٫٩','١٢٫١'],['٦٠','١٣٫٤','١٠٫٩'],['٩٥','١٣٫٤','٩٫٤']]}, cap:'الجدول ١-٢ من كتاب النشاط.', q:{t:'mcq', q:'عند أي عمر كانت النسبة لدى الإناث أعلى من الذكور؟', opts:['٢١ يومًا','٤٥ يومًا','٦٠ يومًا','٩٥ يومًا'], a:0, why:'٢٣٫١ مقابل ٢١٫٦ عند ٢١ يومًا فقط؛ بعدها الذكور أعلى.'}},
      {title:'قراءة البيانات بصريًّا: الذكور', text:['تنخفض النسبة **بسرعة** من ٢١٫٦ عند ٢١ يومًا إلى ١٢٫٩ عند ٤٥ يومًا.','ثم **تستقرّ** عند نحو ١٣٫٤ من ٦٠ إلى ٩٥ يومًا.','الانخفاض الكلّي: ٢١٫٦ − ١٣٫٤ = **٨٫٢ سم²/جم** (نحو ٣٨٪).'], vis:{kind:'bars', items:[{t:'٢١ يومًا',v:21.6,label:'٢١٫٦'},{t:'٣٣ يومًا',v:15.4,label:'١٥٫٤'},{t:'٤٥ يومًا',v:12.9,label:'١٢٫٩'},{t:'٦٠ يومًا',v:13.4,label:'١٣٫٤'},{t:'٩٥ يومًا',v:13.4,label:'١٣٫٤'}], cap:'الذكور: نسبة مساحة الحويصلات إلى كتلة الجسم (سم²/جم)'}},
      {title:'قراءة البيانات بصريًّا: الإناث', text:['تنخفض النسبة **باستمرار** طوال الفترة: من ٢٣٫١ عند ٢١ يومًا إلى ٩٫٤ عند ٩٥ يومًا.','الانخفاض الكلّي: ٢٣٫١ − ٩٫٤ = **١٣٫٧ سم²/جم** (نحو ٥٩٪)، أي أكبر بكثير من الذكور.','لا يوجد استقرار كما عند الذكور.'], vis:{kind:'bars', items:[{t:'٢١ يومًا',v:23.1,label:'٢٣٫١'},{t:'٣٣ يومًا',v:15.2,label:'١٥٫٢'},{t:'٤٥ يومًا',v:12.1,label:'١٢٫١'},{t:'٦٠ يومًا',v:10.9,label:'١٠٫٩'},{t:'٩٥ يومًا',v:9.4,label:'٩٫٤'}], cap:'الإناث: نسبة مساحة الحويصلات إلى كتلة الجسم (سم²/جم)'}, q:{t:'mcq', q:'الفرق بين الذكور والإناث عند ٩٥ يومًا:', opts:['١٫٥','٢٫٥','٤٫٠','٠٫٢'], a:2, why:'١٣٫٤ − ٩٫٤ = ٤٫٠ سم²/جم.'}},
      {title:'(أ) كيف أرسم التمثيل الخطّي؟', tag:'مهارة', text:['المحور السيني: **العمر (بالأيام)** بمقياس منتظم يغطي ٠–١٠٠؛ المحور الصادي: **النسبة (سم²/جم)** يغطي ٠–٢٥.','ضع إشارة **x** صغيرة دقيقة لكل نقطة؛ منحنى للذكور وآخر للإناث بلونَين أو رمزَين مختلفَين مع **مفتاح**.','صِل كل زوج نقاط بخط مستقيم **بالمسطرة** (أو خط اتّجاه مناسب).','استخدم **قائمة معايير التقويم الذاتي**: المحاور، المقياس، العناوين والوحدات، دقة النقاط، وضوح الخطوط — المجموع من ١٢.'], vis:{kind:'steps', steps:[{icon:'📏',t:'ارسم المحاور بالمسطرة واستغلّ معظم الورقة'},{icon:'🔢',t:'مقياس منتظم بالآحاد أو الخمسات أو العشرات'},{icon:'🏷️',t:'عنوان كل محور مع الوحدة'},{icon:'✖️',t:'إشارة x صغيرة دقيقة لكل نقطة'},{icon:'📈',t:'خط مستقيم بين كل نقطتَين ومفتاح للمنحنيَين'}]}},
      {title:'(ب) لماذا النسبة إلى كتلة الجسم وليس المساحة فقط؟', text:['الجرذان **بأعمار مختلفة** لها **كتل مختلفة**؛ الجرذ الأكبر له رئتان أكبر ومساحة أكبر تلقائيًّا.','ما يهمّ الخلايا هو **كمية سطح التبادل المتاح لكل جرام من الأنسجة** التي تحتاج إلى الأكسجين.','النسبة تُتيح **مقارنة عادلة** بين جرذان مختلفة الحجم، وبين الذكور والإناث.'], vis:{kind:'compare', cols:[{icon:'❌',title:'المساحة وحدها',items:['تزداد مع الحجم تلقائيًّا','لا تُقارن جرذًا صغيرًا بكبير','لا تُخبرنا عن كفاية الأكسجين للأنسجة']},{icon:'✅',title:'النسبة إلى الكتلة',items:['تُلغي أثر اختلاف الحجم','سم² لكل جرام يحتاج إلى أكسجين','مقارنة عادلة بين الأعمار والجنسَين']}]}, q:{t:'mcq', q:'الفكرة الأساسية في استخدام النسبة:', opts:['تسهيل الحساب','إلغاء أثر اختلاف كتلة الجسم للمقارنة العادلة','زيادة الأرقام','تقليل عدد الجرذان'], a:1, why:'المقارنة بين أحجام مختلفة تتطلّب قياسًا نسبيًّا.'}},
      {title:'(ج) مقارنة الذكور بالإناث بأرقام', tag:'الاستشهاد بالبيانات', text:['**تشابه**: تنخفض النسبة في كلا الجنسَين من ٢١ إلى ٤٥ يومًا (الذكور من ٢١٫٦ إلى ١٢٫٩؛ الإناث من ٢٣٫١ إلى ١٢٫١).','**مع ذلك**، عند ٢١ يومًا كانت الإناث أعلى (٢٣٫١ مقابل ٢١٫٦)، **إلا أن** الذكور أصبحوا أعلى منذ ٣٣ يومًا (١٥٫٤ مقابل ١٥٫٢).','**لكن** الفرق يتّسع مع العمر: ذكور الجرذان تستقرّ عند ١٣٫٤ بعد ٦٠ يومًا، بينما تستمرّ الإناث في الانخفاض حتى ٩٫٤ عند ٩٥ يومًا (فرق ٤٫٠).','إجمالي الانخفاض: الذكور ٨٫٢ (٣٨٪) مقابل الإناث ١٣٫٧ (٥٩٪).'], vis:{kind:'table', head:['المقارنة','الذكور','الإناث'], rows:[['القيمة عند ٢١ يومًا','٢١٫٦','٢٣٫١ (أعلى)'],['القيمة عند ٩٥ يومًا','١٣٫٤ (أعلى)','٩٫٤'],['إجمالي الانخفاض','٨٫٢ (٣٨٪)','١٣٫٧ (٥٩٪)'],['النمط بعد ٤٥ يومًا','يستقرّ','يستمرّ في الانخفاض']]}},
      {title:'(د) الحمل والأكسجين: مفارقة تستحقّ التفكير', text:['تستطيع إناث الجرذان **الحمل عند ٦٠ يومًا** تقريبًا، ثم يجب أن تزوّد رئتاها **جسمها وجسم الجنين** بالأكسجين (يحصل الجنين على الأكسجين من دم الأم عبر المشيمة).','كنا نتوقّع أن تكون نسبة الإناث **أعلى** بعد ٦٠ يومًا، لكن البيانات تُظهر أنها **الأدنى** (١٠٫٩ ثم ٩٫٤)!','تفسيرات ممكنة: زيادة كتلة الجسم (ومنها الجنين) تُخفض النسبة حسابيًّا؛ أو تعتمد الأنثى على تكيّفات أخرى مثل **زيادة معدّل التنفّس وضربات القلب** أو كفاءة أعلى في تبادل الغازات.','هذا مثال على أن البيانات قد **تفاجئنا** وتدفعنا إلى أسئلة بحثية جديدة.'], note:'💡 عند الإجابة عن سؤال «اقترح»، تُقبل أي فرضية معقولة مبنية على البيانات ومنطق علمي.', vis:{kind:'cycle', center:'🤔', steps:[{icon:'📊',t:'ملاحظة: الإناث أدنى نسبة بعد ٦٠ يومًا'},{icon:'❓',t:'المفارقة: الحمل يحتاج إلى أكسجين أكثر'},{icon:'💡',t:'فرضية ١: كتلة الجسم تزداد فتقلّ النسبة'},{icon:'💡',t:'فرضية ٢: تكيّفات أخرى (تنفّس وقلب أسرع)'},{icon:'🔬',t:'تجربة جديدة للتحقّق'}]}},
      {title:'الخلاصة', tag:'خلاصة', text:['رئتا الجرذ تشبهان رئتَي الإنسان؛ تُقاس كفاءة سطح التبادل بـ**نسبة مساحة الحويصلات إلى كتلة الجسم** لتصحيح أثر الحجم.','تنخفض النسبة مع العمر في الجنسَين؛ **الذكور تستقرّ** عند نحو ١٣٫٤ بعد ٦٠ يومًا، و**الإناث تستمرّ في الانخفاض** حتى ٩٫٤.','عند المقارنة استشهد بـ**أرقام فعلية** واربط العبارات بـ«مع ذلك، إلا أن، لكن»، واحسب الفروق والإجماليات.'], vis:{kind:'cards', items:[{icon:'📏',title:'النسبة',text:'سم² لكل جرام: مقارنة عادلة'},{icon:'📉',title:'النمط',text:'انخفاض مع العمر'},{icon:'♂️',title:'الذكور',text:'تستقرّ عند ١٣٫٤'},{icon:'♀️',title:'الإناث',text:'تهبط إلى ٩٫٤'},{icon:'🔢',title:'المقارنة',text:'بأرقام وفروق'}]}}

    slides:[
      {title:'ماذا في السيجارة؟', tag:'تمهيد', text:['يحوي دخان السجائر أكثر من **٤٠٠٠ مادة كيميائية**، كثير منها سامّ.','نركّز على أربعة مكوّنات رئيسة: **النيكوتين**، **القطران**، **أول أكسيد الكربون**، **الجسيمات**.','لكل مكوّن **تأثيرات محدّدة على الجسم**؛ مهمتك إكمال الجدول بها.'], vis:'smoking', cap:'مكوّنات الدخان وأثر كل منها، ورئة سليمة مقابل رئة مدخّن.'},
      {title:'النيكوتين', text:['مادة **مخدّرة تسبّب الإدمان**؛ لهذا يصعب الإقلاع عن التدخين.','يُحفّز الجهاز العصبي فيرفع **معدّل ضربات القلب** و**ضغط الدم**.','يُضيّق الأوعية الدموية ويزيد خطر تكوّن **الخثرات**، فيرفع خطر **مرض القلب التاجي** والسكتة الدماغية.'], vis:{kind:'cards', items:[{icon:'🧠',title:'إدمان',text:'الرغبة الملحّة في التدخين'},{icon:'💓',title:'قلب أسرع',text:'ارتفاع النبض والضغط'},{icon:'🩸',title:'أوعية أضيق',text:'خثرات وخطر تاجي'}]}, q:{t:'mcq', q:'المكوّن المسؤول عن الإدمان:', opts:['القطران','النيكوتين','أول أكسيد الكربون','الجسيمات'], a:1, why:'مادة مخدّرة تُحدث اعتمادًا.'}},
      {title:'القطران', text:['مادة **لزجة بنّية سوداء** تترسّب في الممرّات الهوائية والحويصلات.','يحوي مواد **مسرطنة (carcinogens)** تسبّب طفرات في خلايا بطانة الرئة ← **سرطان الرئة** (وسرطان الفم والحنجرة).','يُشلّ ويُتلف **الأهداب** فيتراكم المخاط والغبار ← سعال مزمن و**التهاب الشعب المزمن**.','يُتلف جدران الحويصلات فتتمزّق وتقلّ مساحة السطح ← **الانتفاخ الرئوي (emphysema)** وصعوبة تنفّس دائمة.'], vis:{kind:'steps', steps:[{icon:'🟤',t:'القطران يترسّب في الرئة'},{icon:'🧬',t:'مواد مسرطنة تُغيّر الخلايا ← سرطان'},{icon:'🪥',t:'شلّ الأهداب ← تراكم مخاط ← التهاب شعب'},{icon:'💥',t:'تمزّق الحويصلات ← انتفاخ رئوي'}]}, q:{t:'mcq', q:'لماذا يسعل المدخّن كثيرًا؟', opts:['لأن الأكسجين كثير','لأن القطران يشلّ الأهداب فيتراكم المخاط ولا سبيل لإخراجه إلا السعال','لأن النيكوتين يُنظّف الرئة','لأن الحويصلات تتّسع'], a:1, why:'الأهداب هي الجهاز الطبيعي لدفع المخاط للأعلى.'}},
      {title:'أول أكسيد الكربون', text:['غاز سامّ **بلا لون ولا رائحة** ينتج عن الاحتراق غير الكامل للتبغ.','يرتبط بـ**الهيموجلوبين** ارتباطًا قويًّا مكوّنًا **كاربوكسي هيموجلوبين**، فيحتلّ مكان الأكسجين.','النتيجة: **تقلّ سعة الدم لحمل الأكسجين** ← تعب سريع، ضيق تنفّس، وإجهاد القلب.','عند الحامل: يقلّ الأكسجين الواصل إلى الجنين ← **انخفاض وزن المولود** ونموّ أبطأ.'], vis:{kind:'compare', cols:[{icon:'🟢',title:'دم غير مدخّن',items:['الهيموجلوبين يحمل الأكسجين','تسليم أكسجين كامل للأنسجة','تحمّل جيّد للجهد']},{icon:'⚫',title:'دم مدخّن',items:['أول أكسيد الكربون يحتلّ الهيموجلوبين','أكسجين أقل للأنسجة','تعب سريع وإجهاد للقلب']}]}, q:{t:'mcq', q:'كيف يُقلّل أول أكسيد الكربون الأكسجين في الجسم؟', opts:['يحلّل الأكسجين','يرتبط بالهيموجلوبين فيحتلّ مكان الأكسجين','يوقف التنفّس','يسدّ الأنف'], a:1, why:'ارتباط قوي يُشكّل كاربوكسي هيموجلوبين.'}},
      {title:'الجسيمات (الجُسيمات الدقيقة)', text:['**جسيمات صلبة دقيقة** (رماد وسناج) في الدخان تصل حتى الشعيبات والحويصلات.','تُهيّج بطانة الممرّات الهوائية وتسبّب **التهابًا** وزيادة إفراز المخاط.','تتراكم في الرئتين مع الزمن وتُسهم في **التهاب الشعب المزمن** و**تلف الحويصلات**، وتُعيق تبادل الغازات.'], vis:{kind:'cards', items:[{icon:'🌫️',title:'تهيّج',text:'التهاب البطانة'},{icon:'🤧',title:'مخاط أكثر',text:'سعال مزمن'},{icon:'🫧',title:'تراكم',text:'إعاقة تبادل الغازات'}]}},

      {title:'قصة تسعين سنة', tag:'تمهيد', text:['يبيّن التمثيل البياني **عدد السجائر التي يدخّنها الرجال سنويًّا** و**عدد المتوفّين بسرطان الرئة** في أحد البلدان بين عامَي **١٩١١ و٢٠٠١**.','في **خمسينات القرن العشرين** نشر العلماء أول دراسات تُثبت أن التدخين يسبّب سرطان الرئة.','مهمتنا: وصف التغيّرات بالأرقام، تفسير الانخفاض في الستينات، تقدير **الفارق الزمني**، وفهم لماذا لا يزال البعض يدخّن.'], vis:'cancer_graph', cap:'العلاقة بين التدخين وخطر سرطان الرئة علاقة طردية.'},
      {title:'قراءة المحاور', text:['المحور السيني: **السنوات** من ١٩١١ إلى ٢٠٠١ (كل ١٠ سنوات).','المحور الصادي الأيسر: **عدد السجائر المدخّنة سنويًّا** (لكل رجل) من ٠ إلى ٤٥٠٠.','المحور الصادي الأيمن: **عدد الوفيات بسرطان الرئة سنويًّا بالآلاف** من ٠ إلى ٣٠.','منحنيان بمفتاح: السجائر، والوفيات. اقرأ كل منحنى بمحوره الخاص!'], vis:{kind:'table', head:['العنصر','ماذا يمثّل','المدى'], rows:[['المحور السيني','السنوات','١٩١١ – ٢٠٠١'],['المحور الصادي الأيسر','عدد السجائر المدخّنة سنويًّا','٠ – ٤٥٠٠'],['المحور الصادي الأيمن','الوفيات بسرطان الرئة سنويًّا (بالآلاف)','٠ – ٣٠'],['المفتاح','يميّز منحنى السجائر عن منحنى الوفيات','—']]}, q:{t:'mcq', q:'الوفيات في المخطط مقاسة بـ:', opts:['الأفراد','الآلاف سنويًّا','الملايين','النسبة المئوية'], a:1, why:'المحور الأيمن: عدد الوفيات سنويًّا بالآلاف.'}},
      {title:'(١) التغيّر في عدد السجائر', tag:'وصف بالأرقام', text:['**أ. ١٩١١–١٩٥١**: ارتفاع **كبير ومتسارع** من بضع مئات إلى نحو ٤٠٠٠ سيجارة سنويًّا للرجل.','**ب. ١٩٥١–٢٠٠١**: استمرّ الارتفاع قليلًا حتى **القمة في الستينات** (نحو ٤٠٠٠–٤٥٠٠)، ثم **انخفض انخفاضًا مستمرًّا** ليصل إلى نحو ثلث القمة عام ٢٠٠١.','عند الوصف اذكر: الاتّجاه، القيم التقريبية في البداية والنهاية، وسنة القمة.'], note:'💡 القيم في الأعمدة تقريبية مقروءة من المخطط للتوضيح؛ اعتمد على قراءة مخطط الكتاب.', vis:{kind:'bars', items:[{t:'١٩١١',v:500,label:'~٥٠٠'},{t:'١٩٣١',v:2000,label:'~٢٠٠٠'},{t:'١٩٥١',v:4000,label:'~٤٠٠٠'},{t:'١٩٦١',v:4400,label:'قمة'},{t:'١٩٨١',v:3000,label:'~٣٠٠٠'},{t:'٢٠٠١',v:1500,label:'~١٥٠٠'}], cap:'عدد السجائر المدخّنة سنويًّا للرجل — قيم تقريبية'}},
      {title:'(٢) التغيّر في الوفيات بسرطان الرئة ١٩١١–١٩٨١', text:['في ١٩١١ كانت الوفيات **قليلة جدًا** (أقل من ألف).','ارتفعت **ببطء** حتى الثلاثينات، ثم **بسرعة كبيرة** بعد الأربعينات.','وصلت إلى **القمة نحو ١٩٨١** بقرابة **٣٠ ألف** وفاة سنويًّا، ثم بدأت تنخفض بعد ذلك.'], vis:{kind:'bars', items:[{t:'١٩١١',v:0.5,label:'<١'},{t:'١٩٣١',v:2,label:'~٢'},{t:'١٩٥١',v:9,label:'~٩'},{t:'١٩٦١',v:15,label:'~١٥'},{t:'١٩٧١',v:23,label:'~٢٣'},{t:'١٩٨١',v:29,label:'قمة ~٣٠'},{t:'٢٠٠١',v:21,label:'~٢١'}], cap:'الوفيات بسرطان الرئة سنويًّا (بالآلاف) — قيم تقريبية'}, q:{t:'mcq', q:'متى بلغت الوفيات بسرطان الرئة قمّتها تقريبًا؟', opts:['١٩٥١','١٩٦١','١٩٨١','٢٠٠١'], a:2, why:'نحو عشرين سنة بعد قمة التدخين.'}},
      {title:'(٣) لماذا انخفض التدخين في الستينات؟', text:['في **الخمسينات** نُشرت دراسات علمية كبيرة (تتبّعت آلاف الأطباء والمرضى) أثبتت العلاقة بين التدخين وسرطان الرئة.','انتشر **الوعي الصحي**: تحذيرات على العلب، حملات توعية، قيود على الإعلانات، وارتفاع الأسعار.','فبدأ كثير من الناس يقلّلون أو **يقلعون**، وقلّ عدد من يبدؤون التدخين.'], vis:{kind:'steps', steps:[{icon:'🔬',t:'الخمسينات: دراسات تربط التدخين بالسرطان'},{icon:'📰',t:'نشر النتائج وتحذيرات صحية'},{icon:'📢',t:'حملات توعية وقيود على الإعلان'},{icon:'📉',t:'الستينات: بدء انخفاض عدد السجائر'}]}},
      {title:'(٤) الفارق الزمني: ~٢٠ سنة', tag:'تحليل', text:['قمة **التدخين** نحو **١٩٦١**، وقمة **الوفيات** نحو **١٩٨١**: الفارق نحو **٢٠ سنة**.','وكذلك: بدأ التدخين يرتفع بسرعة نحو ١٩٢٠ وبدأت الوفيات ترتفع بسرعة نحو ١٩٤٠.','التفسير: السرطان **يتطوّر ببطء**؛ تتراكم الطفرات في خلايا الرئة على مدى سنوات من التعرّض للقطران قبل ظهور المرض والوفاة.','لهذا استمرّت الوفيات في الارتفاع عشرين سنة **بعد** أن بدأ التدخين ينخفض.'], vis:{kind:'flow', steps:[{icon:'🚬',t:'بدء التدخين'},{icon:'⏳',t:'سنوات من تراكم القطران'},{icon:'🧬',t:'تراكم طفرات في خلايا الرئة'},{icon:'🦠',t:'نموّ الورم'},{icon:'📈',t:'ظهور المرض والوفاة بعد ~٢٠ سنة'}]}, q:{t:'mcq', q:'لماذا استمرّت الوفيات في الارتفاع بعد انخفاض التدخين؟', opts:['لأن الدخان صار أخطر','لأن السرطان يستغرق سنوات طويلة ليتطوّر بعد التعرّض','لأن الناس دخّنوا سرًّا','لأن المخطط خاطئ'], a:1, why:'الفارق الزمني ~٢٠ سنة.'}},
      {title:'(٥) لماذا لا يزال البعض يدخّن؟', text:['**الإدمان على النيكوتين**: يصعب الإقلاع حتى مع معرفة الضرر.','**ضغط الأقران** وتقليد الكبار، والبدء في سنّ صغيرة قبل فهم الخطر.','**الإعلانات** والصور النمطية، والاعتقاد بأن «الضرر لن يصيبني» أو أنه بعيد جدًا في الزمن.','التخفيف من **التوتّر** مؤقّتًا، والعادات الاجتماعية (مجالس الشيشة).'], vis:{kind:'cards', items:[{icon:'🧠',title:'الإدمان',text:'النيكوتين يجعل الإقلاع صعبًا'},{icon:'👥',title:'ضغط الأقران',text:'البدء في سنّ صغيرة'},{icon:'📺',title:'الإعلان',text:'صور نمطية جاذبة'},{icon:'⏳',title:'الخطر بعيد',text:'٢٠ سنة تبدو زمنًا طويلًا'},{icon:'😰',title:'التوتّر',text:'تهدئة مؤقّتة'},{icon:'🫖',title:'العادات',text:'المجالس والشيشة'}]}},
      {title:'ارتباط أم سببية؟', tag:'تفكير علمي', text:['المخطط يُظهر **ارتباطًا** بين التدخين والوفيات مع **فارق زمني** ثابت، وهذا دليل قوي لكنه وحده لا يكفي.','ما جعل العلماء يقولون **«يسبّب»**: العلاقة **الطردية بالجرعة** (كلما زاد عدد السجائر يوميًّا زاد الخطر)، وانخفاض الخطر بعد الإقلاع، ووجود **مواد مسرطنة** معروفة في القطران، وتجارب معملية.','منحنى الجرعة–الخطر أمامك: من يدخّن ٤٠ سيجارة يوميًّا خطره أعلى بكثير ممن يدخّن ١٠.'], vis:'cancer_graph', cap:'كلما زاد عدد السجائر يوميًّا تصاعد خطر سرطان الرئة.'},
      {title:'الخلاصة', tag:'خلاصة', text:['**السجائر**: ارتفاع كبير ١٩١١–١٩٥١، قمة في الستينات، ثم انخفاض مستمرّ حتى ٢٠٠١.','**الوفيات**: ارتفاع بطيء ثم سريع حتى قمة نحو ١٩٨١ (~٣٠ ألفًا) ثم انخفاض.','**الفارق الزمني ~٢٠ سنة** لأن السرطان يتطوّر ببطء.','انخفض التدخين في الستينات بعد **اكتشاف العلاقة في الخمسينات**؛ ولا يزال البعض يدخّن بسبب **الإدمان** وضغط الأقران والإعلان.'], vis:{kind:'cycle', center:'📊', steps:[{icon:'📈',t:'التدخين يرتفع'},{icon:'⏳',t:'٢٠ سنة'},{icon:'💀',t:'الوفيات ترتفع'},{icon:'🔬',t:'العلم يكشف العلاقة'},{icon:'📉',t:'التدخين ينخفض'},{icon:'⏳',t:'٢٠ سنة'},{icon:'🕊️',t:'الوفيات تنخفض'}]}}

        {title:'ما التلقيح؟', tag:'مفهوم', text:['**التلقيح (Pollination)**: عملية نقل **حبوب اللقاح** من التركيب الذكري (**المتك**) إلى التركيب الأنثوي (**الميسم**) في نفس النوع من النبات.','حبوب اللقاح تحمل **المشيج الذكري**، لكنها لا تستطيع الانتقال من تلقاء نفسها.','لذلك تعتمد الأزهار على **ناقل**: الحشرات أو الرياح (وأحيانًا الطيور أو الإنسان).'], vis:{kind:'flow', steps:[{icon:'🌼',t:'المتك يُنتج حبوب اللقاح'},{icon:'🦋',t:'ناقل: حشرة أو رياح'},{icon:'🎯',t:'حبوب اللقاح تصل إلى الميسم'},{icon:'✅',t:'حدث التلقيح'}]}},

        {title:'من ينقل حبوب اللقاح؟', tag:'الملقّحات', text:['**أزهار الحشرات**: بتلات كبيرة ملوّنة، رائحة، **رحيق**، مياسم ومتوك داخل الزهرة.','**أزهار الرياح**: بتلات صغيرة أو غائبة، متوك ومياسم **متدلّية خارج** الزهرة، حبوب لقاح كثيرة خفيفة.','نبات **البهشية (الإيلكس)** في بحثنا تُلقّحه **الفراشات**.'], vis:'pollination', cap:'زهرة تُلقَّح بالحشرات (يسار) وزهرة تُلقَّح بالرياح (يمين)', note:'💡 سنفصّل هذه التكيّفات في ورقة العمل ٢-٣.'},
        {title:'البحث: ثلاث مناطق في الغابة', tag:'الاستقصاء', text:['درس الباحثون تلقيح أزهار **البهشية** بواسطة **الفراشات** في ثلاث مناطق مختلفة من الغابة.','**المنطقة (أ)**: مساحات حرجية **واسعة ومتّصلة** ببعضها بممرّات طويلة من الأشجار.','**المنطقة (ب)**: مساحات **واسعة** مماثلة في الحجم لكنها **غير متّصلة**.','**المنطقة (ج)**: مساحات **صغيرة** الحجم و**غير متّصلة**.','فحص الباحثون عيّنات من الأزهار وأحصوا **المبايض التي تحوّلت إلى ثمار**، ثم حسبوا **متوسط عدد الثمار لكل زهرة**.'], vis:{kind:'cards', items:[{icon:'🌳🌳🌳',title:'المنطقة (أ)',text:'واسعة + متّصلة بممرّات أشجار'},{icon:'🌳 🌳',title:'المنطقة (ب)',text:'واسعة + غير متّصلة'},{icon:'🌲 🌲',title:'المنطقة (ج)',text:'صغيرة + غير متّصلة'}]}, q:{t:'mcq', q:'لماذا عدّ الباحثون الثمار وليس الأزهار؟', opts:['لأن الثمار أسهل في العدّ','لأن تكوّن الثمرة دليل على حدوث التلقيح ثم الإخصاب','لأن الأزهار تتساقط','لأن الثمار أكبر حجمًا'], a:1, why:'لا يتحوّل المبيض إلى ثمرة إلا إذا حدث التلقيح فالإخصاب؛ فعدد الثمار مقياس غير مباشر لنجاح التلقيح.'}},
        {title:'النتائج', tag:'بيانات', text:['يمثّل التمثيل البياني بالأعمدة **متوسط عدد الثمار في كل زهرة** لكل منطقة.','كانت أقل قيمة في المنطقة **(أ)** الواسعة المتّصلة، وأعلى قيمة في المنطقة **(ج)** الصغيرة غير المتّصلة.','**وصف النتائج** يعني: ذكر الاتجاه العام + مقارنة القيم + استخدام الأرقام من الرسم.'], vis:{kind:'bars', items:[{t:'المنطقة (أ)',v:15,label:'≈ 0.15'},{t:'المنطقة (ب)',v:30,label:'≈ 0.3'},{t:'المنطقة (ج)',v:50,label:'≈ 0.5'}], cap:'متوسط عدد الثمار في كل زهرة (قراءة تقريبية من الرسم، المحور من 0 إلى 0.6)'}, note:'💡 عند وصف تمثيل بياني اذكر دائمًا الوحدة والمقياس على المحور.'},

        {title:'هل النتائج تُثبت التفسير؟ نخطّط لاستقصاء', tag:'مهارة', text:['النتائج **لا تُثبت** التفسير بشكل كامل؛ فهي تُظهر **ارتباطًا** لا **سببًا** مؤكدًا.','لاختبار الاقتراح يمكن: **عدّ زيارات الفراشات** للأزهار عند الأطراف وفي العمق داخل المساحة نفسها.','أو مقارنة **عدد الثمار** في أزهار الأطراف مع أزهار العمق في المنطقة (أ).','أو تتبّع الفراشات (وسْم) لمعرفة المسافة التي تدخلها في الغابة.','في أي استقصاء: **متغير مستقل** (المسافة من الطرف)، **متغير تابع** (عدد الثمار/الزيارات)، **متغيرات ضابطة** (نوع النبات، الموسم، حجم العينة).'], vis:{kind:'table', head:['عنصر التصميم','مثال في استقصائنا'], rows:[['المتغير المستقل','المسافة من طرف الغابة'],['المتغير التابع','متوسط الثمار لكل زهرة / عدد زيارات الفراشات'],['متغيرات ضابطة','نوع النبات، الموسم، عدد الأزهار في العيّنة'],['التكرار','عيّنات كثيرة من مواقع عدة'],['الضبط','نفس طريقة العدّ والفحص في كل موقع']]}},

        {title:'التكاثر الجنسي', tag:'تعريف', text:['**التكاثر الجنسي**: عملية إنتاج نسل من كائنات حية **مختلفة جينيًا** عن طريق **دمج نواتَي مشيجَين** (خليتَين جنسيتَين) من أبوَين مختلفَين لتكوين **الزيجوت** (اللقحة أو البويضة المخصّبة).','في النبات: المشيج الذكري في **حبة اللقاح** والمشيج الأنثوي في **البويضة**؛ يجمعهما **التلقيح** ثم **الإخصاب**.','ينمو الزيجوت إلى جنين داخل **بذرة**، والبذرة داخل **ثمرة**.'], vis:{kind:'flow', steps:[{icon:'🌼',t:'تلقيح بالحشرات'},{icon:'🧬',t:'إخصاب: اندماج النواتَين'},{icon:'⚪',t:'زيجوت'},{icon:'🌰',t:'بذرة في ثمرة'},{icon:'🌱',t:'نبات جديد مختلف وراثيًا'}]}, q:{t:'mcq', q:'الزيجوت هو:', opts:['حبة اللقاح','البويضة قبل الإخصاب','البويضة المخصّبة','البذرة الناضجة'], a:2, why:'الزيجوت هو الخلية الناتجة عن اندماج نواتَي المشيجَين؛ أي البويضة المخصّبة.'}},
        {title:'الفراولة: سيقان جارية أم بذور؟', tag:'مقارنة', text:['نباتات **السيقان الجارية**: نسخ **متماثلة جينيًا** للنبات الأم، تنمو **قريبة** من الأم، **سريعة** النمو وتُثمر مبكرًا.','نباتات **البذور**: **مختلفة جينيًا** عن الأبوَين وعن بعضها، تنتشر **بعيدًا**، وتحتاج وقتًا أطول لتُثمر.','هذا هو جوهر السؤال (أ) في التمرين: **ما الفروق** بين النوعَين من النباتات؟'], vis:{kind:'table', head:['وجه المقارنة','نباتات السيقان الجارية','نباتات البذور'], rows:[['التماثل الوراثي','متماثلة للأم تمامًا','مختلفة عن الأبوَين'],['المسافة عن الأم','قريبة (متجمّعة حولها)','بعيدة (تنتشر بالحيوانات)'],['سرعة النمو والإثمار','سريعة','أبطأ'],['الحاجة إلى ملقّح','لا','نعم (الحشرات)'],['عدد الأفراد اللازم','واحد','اثنان (عادةً)']]}},
        {title:'لماذا يفيد التكاثر اللاجنسي المزارعين؟', tag:'مزايا', text:['**ضمان الصفات**: النباتات الجديدة نسخ من نبات أم ممتاز (ثمار كبيرة، طعم حلو، مقاومة).','**سرعة**: لا انتظار للإزهار والتلقيح والبذور؛ النباتات الصغيرة جاهزة للغرس.','**لا يعتمد على الحشرات** أو التلقيح، ويمكن الحصول على أعداد كبيرة بتكلفة قليلة.','**تجانس** المحصول يسهّل الحصاد والتسويق.'], vis:{kind:'cards', items:[{icon:'📋',title:'نسخة مضمونة',text:'صفات الأم نفسها'},{icon:'⚡',title:'أسرع',text:'لا حاجة إلى بذور'},{icon:'🐝❌',title:'بلا ملقّح',text:'لا يعتمد على الحشرات'},{icon:'📦',title:'محصول متجانس',text:'حصاد وتسويق أسهل'}]}},
        {title:'عيوب التكاثر اللاجنسي للمزارعين', tag:'عيوب', text:['**لا تباين وراثي**: كل النباتات متماثلة؛ إن أصاب **مرض** أو **آفة** أحدها أصابها كلها → قد يُفقد المحصول بأكمله.','**ضعف التكيّف**: لا توجد أفراد مختلفة قد تتحمّل تغيّر المناخ أو التربة.','**ازدحام**: النباتات الجديدة متجمّعة حول الأم وتتنافس على الضوء والماء والأملاح.','**انتقال الأمراض** من النبات الأم إلى كل نسخه (فيروسات مثلًا).'], vis:{kind:'steps', steps:[{icon:'🦠',t:'يظهر مرض جديد'},{icon:'🧬',t:'كل النباتات لها الجينات نفسها'},{icon:'❌',t:'لا يوجد فرد مقاوم'},{icon:'💸',t:'خسارة المحصول كله'}]}, q:{t:'mcq', q:'أكبر خطر في حقل من نباتات متماثلة وراثيًا هو:', opts:['بطء النمو','انتشار مرض يقضي على الجميع','قلّة الثمار','كثرة الأزهار'], a:1, why:'غياب التباين يعني غياب أفراد مقاومة، فينتشر المرض في المحصول كله.'}},
        {title:'مزايا التكاثر الجنسي وانتشار البذور', tag:'مزايا', text:['ينتج **تباينًا وراثيًا**: بعض الأفراد قد يقاوم الأمراض أو يتحمّل الجفاف → **بقاء النوع** عند تغيّر البيئة.','ثمار الفراولة **زاهية اللون وحلوة** فتأكلها **الحيوانات**، وتمرّ البذور في **القناة الهضمية** دون ضرر وتُخرَج **بعيدًا** لتنبت.','**الانتشار بعيدًا** يقلّل **التنافس** مع النبات الأم ويستعمر مناطق جديدة — مقابل السيقان الجارية التي تبقى قريبة ومزدحمة.','البذور **تصمد** فترات طويلة (سكون) حتى تتحسّن الظروف.'], vis:{kind:'cycle', center:'🍓', steps:[{icon:'🌸',t:'زهرة → ثمرة حلوة'},{icon:'🐦',t:'حيوان يأكل الثمرة'},{icon:'🚶',t:'يبتعد عن النبات الأم'},{icon:'💩',t:'تُخرَج البذور سليمة'},{icon:'🌱',t:'تنبت في مكان جديد'}]}},
        {title:'ربط بالحياة: نخيل عُمان', tag:'عُمان', text:['**الفسائل**: يأخذ المزارع العُماني فسيلة من نخلة أم ممتازة (خلاص، فرض...) فتُنتج نخلة **بالصفات نفسها** — تكاثر **لاجنسي**.','**النوى**: نخلة من نواة قد تكون **ذكرًا أو أنثى** وبصفات غير معروفة — تكاثر **جنسي** فيه **تباين**.','لذلك تعتمد البساتين على الفسائل للإنتاج، بينما يفيد التكاثر الجنسي في **استنباط أصناف جديدة** ومقاومة الآفات.'], vis:{kind:'compare', cols:[{icon:'🌴',title:'فسيلة (لاجنسي)',items:['صفات الأم مضمونة','تُثمر أسرع','جنسها معلوم','بلا تباين']},{icon:'🌰',title:'نواة (جنسي)',items:['صفات غير متوقعة','قد تكون ذكرًا','تباين وراثي','أساس الأصناف الجديدة']}]}, q:{t:'mcq', q:'مزارع يريد بستانًا من صنف «الخلاص» بالصفات نفسها، أيهما يستخدم؟', opts:['النوى','الفسائل','حبوب اللقاح','الأوراق'], a:1, why:'الفسيلة نسخة لاجنسية تحمل صفات الأم نفسها.'}},
        {title:'خلاصة: الجنسي واللاجنسي وجهًا لوجه', tag:'خلاصة', text:['**اللاجنسي**: فرد واحد، بلا أمشاج، نسل **متماثل**، سريع ومضمون، لكنه **ضعيف أمام الأمراض والتغيّر**.','**الجنسي**: مشيجان وإخصاب، نسل **مختلف**، تباين يعين على البقاء والانتشار، لكنه أبطأ ويعتمد على الملقّحات.','كثير من النباتات (مثل الفراولة) تستخدم **الطريقتَين معًا** لتجمع مزايا كل منهما.'], vis:{kind:'table', head:['','التكاثر اللاجنسي','التكاثر الجنسي'], rows:[['عدد الأبوَين','واحد','اثنان (عادةً)'],['الأمشاج والإخصاب','لا','نعم'],['النسل','متماثل جينيًا','مختلف جينيًا'],['السرعة','سريع','أبطأ'],['التباين والتكيّف','لا تباين','تباين يساعد على البقاء'],['الانتشار','قريب من الأم','بعيد بالبذور'],['مثال','سيقان جارية، درنة، بصلة، فسيلة','بذور الفراولة، نوى التمر']]}}

      slides:[
        {title:'رحلة المشيج الذكري', tag:'تمهيد', text:['في هذه الورقة نُكمل **فقرتَين** عن التكاثر **اللاجنسي** و**الجنسي** في النبات باستخدام 16 مصطلحًا.','السؤال الأهم: كيف يصل **المشيج الذكري** من المتك إلى **البويضة** المختبئة في المبيض؟','سنتتبّع: تلقيح → إنبات حبة اللقاح → أنبوبة اللقاح → إخصاب → زيجوت → بذرة.'], vis:{kind:'flow', steps:[{icon:'🌼',t:'متك'},{icon:'💨🐝',t:'تلقيح'},{icon:'🎯',t:'ميسم'},{icon:'🧵',t:'أنبوبة لقاح'},{icon:'⚪',t:'بويضة: إخصاب'},{icon:'🌰',t:'بذرة'}]}},
        {title:'الفقرة الأولى: التكاثر اللاجنسي', tag:'الفقرة ١', text:['تتكاثر نباتات كثيرة **لاجنسيًا وجنسيًا**.','في التكاثر اللاجنسي يُنتج **نبات واحد** نباتات جديدة **متجمّعة** حول النبات الأم.','وتكون النباتات الناتجة من هذا التكاثر **متماثلة جينيًا**.','(المصطلح من القائمة: **متماثلة**، وليس «مختلفة».)'], vis:'asexual_plant', q:{t:'mcq', q:'النباتات الناتجة عن التكاثر اللاجنسي تكون جينيًا:', opts:['مختلفة','متماثلة','عشوائية','أقوى دائمًا'], a:1, why:'نسخ من نبات أم واحد بلا اندماج أمشاج.'}},
        {title:'الفقرة الثانية: أين الأمشاج؟', tag:'الفقرة ٢', text:['في التكاثر **الجنسي** تتكوّن الأمشاج **الذكرية** والأمشاج **الأنثوية** في **الأزهار**.','توجد الأمشاج الذكرية في **حبوب اللقاح** التي تتكوّن داخل **المتوك**.','وتوجد الأمشاج الأنثوية في **البويضات** التي تتكوّن داخل **المبيض**.'], vis:'flower', cap:'المتوك تصنع حبوب اللقاح، والمبيض يحوي البويضات', q:{t:'mcq', q:'أي مصطلح يكمل: «حبوب اللقاح تتكوّن داخل ___»؟', opts:['المياسم','المتوك','المبيض','الجذر'], a:1, why:'المتك يصنع حبوب اللقاح؛ الميسم يستقبلها فقط.'}},
        {title:'الإخصاب: اندماج النواتَين', tag:'مفهوم', text:['يتضمّن التكاثر الجنسي دائمًا عملية **الإخصاب**، التي تندمج فيها **نواة** المشيج الذكري مع **نواة** المشيج الأنثوي.','تحدث هذه العملية داخل **المبايض** (داخل البويضة تحديدًا).','الناتج: خلية واحدة تُسمّى **الزيجوت**.','لاحظ الفرق: **التلقيح** يحدث على الميسم، أما **الإخصاب** فيحدث في البويضة داخل المبيض.'], vis:{kind:'compare', cols:[{icon:'🎯',title:'التلقيح',items:['وصول حبة اللقاح إلى الميسم','خارجي: بالحشرات أو الرياح','لا اندماج بعد']},{icon:'🧬',title:'الإخصاب',items:['اندماج نواة المشيج الذكري بنواة البويضة','داخلي: في المبيض','يكوّن الزيجوت']}]}},
        {title:'حبوب اللقاح تحتاج ناقلًا', tag:'الفقرة ٢', text:['**لا تستطيع** الأمشاج الذكرية للزهرة الانتقال من تلقاء نفسها.','لذا تستفيد الأزهار من **الحشرات** أو **الرياح** لنقل حبوب اللقاح من **المتوك** إلى **المياسم**.','هذا هو **التلقيح**.'], vis:'pollination', note:'💡 بعض النباتات تلقّحها الطيور أو الخفافيش، وبعضها ينقل الإنسان لقاحها بيده كما في النخيل.'},
        {title:'إنبات حبة اللقاح وأنبوبة اللقاح', tag:'الفقرة ٢', text:['بعد وصولها إلى الميسم، تبدأ حبة اللقاح **بالإنبات**: تنمو منها **أنبوبة اللقاح**.','تنمو أنبوبة اللقاح عبر **القلم** باتجاه **البويضة**.','ينتقل **المشيج الذكري** (النواة الذكرية) عبر أنبوبة اللقاح إلى داخل البويضة.','تدخل الأنبوبة البويضة عبر فتحة صغيرة، فيندمج المشيج الذكري مع المشيج **الأنثوي**.'], vis:'fertilisation_plant', cap:'حبة لقاح على الميسم تنمو أنبوبة لقاح عبر القلم إلى البويضة حيث يحدث الإخصاب', q:{t:'mcq', q:'ما وظيفة أنبوبة اللقاح؟', opts:['جذب الحشرات','نقل النواة الذكرية من الميسم إلى البويضة','تكوين الرحيق','حماية المبيض'], a:1, why:'تنمو عبر القلم لتوصل المشيج الذكري إلى البويضة.'}},
        {title:'من الزيجوت إلى البذرة', tag:'الفقرة ٢', text:['يندمج المشيجان **لإنتاج الزيجوت**.','ينمو الزيجوت (بالانقسام) إلى **نبات جنيني** (جنين).','تتحوّل **البويضة** إلى **بذرة** تحوي الجنين ومخزون غذاء، ويتحوّل **المبيض** إلى **ثمرة**.','هكذا تكتمل الفقرة: ... الزيجوت الذي ينمو إلى نبات جنيني داخل **بذرة**.'], vis:{kind:'steps', steps:[{icon:'🧬',t:'إخصاب → زيجوت'},{icon:'🔁',t:'انقسامات متكرّرة'},{icon:'🌱',t:'جنين نباتي'},{icon:'🌰',t:'البويضة → بذرة'},{icon:'🍎',t:'المبيض → ثمرة'}]}},
        {title:'ماذا عن المصطلحات الزائدة؟', tag:'تنبيه', text:['القائمة فيها مصطلحات **لا تُستخدم**: **سيتوبلازم**، **خيوط**، **جذر**، **مختلفة**. (أما **القلم** فقد يلزم لوصف مسار أنبوبة اللقاح نحو المبيض.)','**مختلفة** عكس المطلوب في التكاثر اللاجنسي (متماثلة).','**الجذر** و**السيتوبلازم** لا علاقة مباشرة لهما بالفقرتَين.','مهارة: اقرأ الفقرة كاملة قبل اختيار المصطلح، وتأكّد أن المعنى العلمي صحيح.'], vis:{kind:'table', head:['مصطلح','هل يُستخدم؟','مكانه'], rows:[['متماثلة','✅','نسل التكاثر اللاجنسي'],['حبوب اللقاح / متوك','✅','الأمشاج الذكرية'],['البويضات / مبيض','✅','الأمشاج الأنثوية'],['الإخصاب / نواة','✅','اندماج النواتَين'],['مياسم / أنبوبة اللقاح','✅','التلقيح ونقل المشيج'],['الزيجوت / بذرة','✅','ناتج الإخصاب ومآله'],['مختلفة / جذر / سيتوبلازم / خيوط','❌','غير مطلوبة']]}},
        {title:'خلاصة الورقة', tag:'خلاصة', text:['**لاجنسي**: نبات واحد → نباتات متجمّعة **متماثلة** جينيًا.','**جنسي**: أمشاج ذكرية في **حبوب اللقاح** (من **المتوك**) وأنثوية في **البويضات** (في **المبيض**).','**تلقيح** بالحشرات أو الرياح إلى **المياسم** → **أنبوبة اللقاح** تحمل **النواة** الذكرية → **إخصاب** → **زيجوت** → جنين في **بذرة**.'], vis:{kind:'cycle', center:'🌸', steps:[{icon:'🌼',t:'متك: حبوب لقاح'},{icon:'🐝',t:'تلقيح إلى الميسم'},{icon:'🧵',t:'أنبوبة اللقاح'},{icon:'🧬',t:'إخصاب في البويضة'},{icon:'⚪',t:'زيجوت'},{icon:'🌰',t:'بذرة → نبات جديد'}]}}

          {q:'ما الذي يندمج أثناء الإخصاب؟', opts:['جداران خلويان','نواتان','بتلتان','حبتا لقاح'], a:1, why:'نواة المشيج الذكري مع نواة المشيج الأنثوي.'},

      slides:[
        {title:'زهرتان... طريقتان', tag:'تمهيد', text:['يبيّن رسم ورقة العمل تركيب **زهرتَين مختلفتَين** وحبوب اللقاح فيهما.','**الزهرة (1)** تُلقَّح بالحشرات، و**الزهرة (2)** تُلقَّح بالرياح.','مهمتنا: تحديد أيّ الميزات (أ–ن) تتّصف بها كل زهرة، ثم وصف ما يحدث **بعد** وصول حبة اللقاح إلى الميسم.'], note:'💡 كل تركيب في الزهرة «تكيّف»: صفة تساعدها على أداء وظيفتها بكفاءة.', vis:'pollination', cap:'زهرة الحشرات (1) وزهرة الرياح (2)'},
        {title:'تكيّفات زهرة الحشرات (1): الجذب', tag:'الزهرة 1', text:['**أ.** بتلات **كبيرة** ملوّنة مع **خطوط مرشدة** تقود الحشرة إلى الداخل.','**د.** **غدة رحيقية** عند قاعدة البتلة تُنتج رحيقًا سكريًا مكافأةً للحشرة.','**ح.** **رائحة عطرة** تجذب الحشرات من بعيد.','**م.** لذلك **تُلقَّح بواسطة الحشرات**.'], vis:{kind:'cards', items:[{icon:'🌺',title:'أ. بتلات كبيرة',text:'ملوّنة بخطوط مرشدة'},{icon:'🍯',title:'د. غدة رحيقية',text:'مكافأة سكرية عند القاعدة'},{icon:'👃',title:'ح. رائحة عطرة',text:'إشارة من بعيد'},{icon:'🐝',title:'م. تلقيح بالحشرات',text:'النتيجة'}]}, q:{t:'mcq', q:'الغدة الرحيقية تقع عند:', opts:['قمة الميسم','قاعدة البتلة','داخل المتك','في الجذر'], a:1, why:'ذكرت ورقة العمل: غدة رحيقية عند قاعدة البتلة؛ فتضطر الحشرة للدخول عميقًا فتلمس المتوك.'}},
        {title:'تكيّفات زهرة الحشرات (1): الالتصاق', tag:'الزهرة 1', text:['**ك.** **المتوك داخل الزهرة**: تلمسها الحشرة عند دخولها للرحيق فيلتصق اللقاح بجسمها.','**ل.** **المياسم داخل الزهرة**: تلمسها الحشرة القادمة من زهرة أخرى فتترك اللقاح عليها.','**ج.** **حبوب لقاح شوكية** (أو لاصقة) تعلق بشعيرات جسم الحشرة، وعددها **أقل** لأن النقل دقيق.'], vis:{kind:'steps', steps:[{icon:'🐝',t:'الحشرة تدخل طلبًا للرحيق'},{icon:'🌼',t:'تلمس المتوك الداخلية'},{icon:'📌',t:'اللقاح الشوكي يعلق بجسمها'},{icon:'✈️',t:'تطير إلى زهرة أخرى'},{icon:'🎯',t:'تلمس الميسم الداخلي فيلتقط اللقاح'}]}},
        {title:'تكيّفات زهرة الرياح (2): لا جذب', tag:'الزهرة 2', text:['**و.** **بتلات صغيرة** (أو غائبة) غالبًا خضراء أو بنية؛ لا حاجة إلى الجذب.','**هـ.** **ليس لها رائحة عطرة**.','**ز.** **لا تحتوي على غدة رحيقية** — لا مكافأة لأن الرياح لا تحتاج إليها.','**ن.** لذلك **تُلقَّح بواسطة الرياح**.','توفير الطاقة: لا تُهدر الزهرة موادها في بتلات ورحيق ورائحة.'], vis:{kind:'cards', items:[{icon:'🍃',title:'و. بتلات صغيرة',text:'بلا ألوان زاهية'},{icon:'🚫👃',title:'هـ. بلا رائحة',text:'لا حاجة لجذب'},{icon:'🚫🍯',title:'ز. بلا رحيق',text:'لا مكافأة'},{icon:'💨',title:'ن. تلقيح بالرياح',text:'النتيجة'}]}},
        {title:'تكيّفات زهرة الرياح (2): التعرّض للهواء', tag:'الزهرة 2', text:['**ب.** **متوك تتدلّى خارج الزهرة** على خيوط طويلة لتهزّها الرياح فتنثر اللقاح.','**ي.** **ميسم كبير (ريشي) يتدلّى خارج الزهرة** ليلتقط اللقاح المتطاير — مساحة سطح كبيرة.','**ط.** **حبوب لقاح صغيرة ملساء خفيفة الوزن** وبأعداد **ضخمة** لتحملها الرياح بعيدًا.'], vis:'pollination', cap:'لاحظ المتوك المتدلّية والميسم الريشي خارج زهرة الرياح', q:{t:'mcq', q:'لماذا الميسم في زهرة الرياح كبير وريشي؟', opts:['لجذب الحشرات','لزيادة مساحة السطح لالتقاط اللقاح من الهواء','لإنتاج رحيق','لحماية البتلات'], a:1, why:'المساحة الكبيرة المتفرّعة تزيد احتمال اصطياد حبوب اللقاح المتطايرة.'}},
        {title:'مقارنة حبوب اللقاح', tag:'مقارنة', text:['**زهرة الحشرات**: حبوب لقاح **أكبر**، **شوكية/لاصقة**، **أقل عددًا** — تلتصق بجسم الحشرة.','**زهرة الرياح**: حبوب **أصغر**، **ملساء**، **خفيفة**، **كثيرة جدًا** — تطير مع الهواء ومعظمها يضيع.','هذا يفسّر «موسم الحساسية» من غبار الطلع في الهواء.'], vis:{kind:'compare', cols:[{icon:'🐝',title:'لقاح زهرة الحشرات',items:['شوكي / لاصق (ج)','أكبر حجمًا','أقل عددًا','يعلق بشعيرات الحشرة']},{icon:'💨',title:'لقاح زهرة الرياح',items:['أملس خفيف (ط)','أصغر حجمًا','بأعداد ضخمة','يطير مع الهواء']}]}},
        {title:'الجدول الكامل: أ–ن', tag:'الإجابة', text:['**الزهرة (1) — الحشرات**: أ، ج، د، ح، ك، ل، م.','**الزهرة (2) — الرياح**: ب، هـ، و، ز، ط، ي، ن.','لاحظ التقابل: كل ميزة في زهرة تقابلها ميزة معاكسة في الأخرى.'], vis:{kind:'table', head:['الميزة','زهرة (1) حشرات','زهرة (2) رياح'], rows:[['البتلات','أ. كبيرة بخطوط مرشدة','و. صغيرة'],['الرائحة','ح. عطرة','هـ. بلا رائحة'],['الرحيق','د. غدة رحيقية','ز. لا غدة رحيقية'],['المتوك','ك. داخل الزهرة','ب. تتدلّى خارجها'],['المياسم','ل. داخل الزهرة','ي. كبير يتدلّى خارجها'],['حبوب اللقاح','ج. شوكية','ط. صغيرة ملساء خفيفة'],['طريقة التلقيح','م. بالحشرات','ن. بالرياح']]}, q:{t:'mcq', q:'الميزة «ي. ميسم كبير يتدلّى خارج الزهرة» تخصّ:', opts:['الزهرة (1)','الزهرة (2)','كلتَيهما','لا واحدة'], a:1, why:'الميسم الخارجي الريشي من تكيّفات التلقيح بالرياح.'}},
        {title:'السؤال ٢: ماذا يحدث بعد وصول اللقاح إلى الميسم؟', tag:'الإخصاب', text:['تُنبت حبة اللقاح **أنبوبة لقاح** تنمو **عبر القلم** إلى **المبيض**.','تدخل الأنبوبة **البويضة**، وتنتقل خلالها **النواة الذكرية**.','تندمج النواة الذكرية مع نواة **المشيج الأنثوي** = **الإخصاب** → **زيجوت**.','ينمو الزيجوت إلى **جنين**، وتصبح البويضة **بذرة** والمبيض **ثمرة**.'], vis:'fertilisation_plant', cap:'من الميسم إلى البويضة: إنبات، أنبوبة لقاح، إخصاب'},
        {title:'تكيّفات من عُمان', tag:'عُمان', text:['**النخيل**: أزهار بلا بتلات زاهية ولا رحيق، لقاح غزير خفيف — تلقيح **بالرياح**، ويساعده المزارع بالتنبيت.','**الأعشاب والحشائش**: مياسم ريشية ومتوك متدلّية — رياح.','**ورد الجبل الأخضر (الورد الدمشقي)** والفل والأشجار المثمرة (المانجو، الليمون): بتلات ورائحة ورحيق — **حشرات** (نحل).'], vis:{kind:'compare', cols:[{icon:'🌴',title:'بالرياح في عُمان',items:['النخيل','الحشائش والأعشاب','لقاح كثير خفيف']},{icon:'🌹',title:'بالحشرات في عُمان',items:['ورد الجبل الأخضر','الفل والياسمين','المانجو والليمون']}]}},

      slides:[
        {title:'عضوان مختلفان... ووظيفة مشتركة', tag:'تمهيد', text:['**المشيمة** و**الرئتان** عضوان مختلفان تمامًا، لكنهما يشتركان في وظيفة: **تبادل المواد بالانتشار** عبر سطح.','**المشيمة**: بين دم الأم ودم الجنين (دون أن يختلطا).','**الرئتان**: بين هواء الحويصلات والدم.','سنستخدم **بيانات الجدول 1-4** للمقارنة وتفسير لماذا تمتصّ الرئتان أكسجينًا أكثر.'], vis:'placenta_lung', cap:'تبادل الغازات في المشيمة (يسار) وفي الرئتين (يمين)', note:'💡 مهارة الدرس: استخدام الأرقام في الجدول لتدعيم الشرح — «لأن السمك 0.5 μm مقابل 3.5 μm ...».'},
        {title:'ما المشيمة؟', tag:'تركيب', text:['**المشيمة** عضو ينمو في **جدار الرحم** أثناء الحمل، يتّصل بالجنين عبر **الحبل السري**.','**تتيح لدم الأم ودم جنينها أن يتجاورا بشكل وثيق دون أن يختلطا**.','عبرها ينتقل من الأم إلى الجنين: **الأكسجين** والجلوكوز والأحماض الأمينية والماء والأجسام المضادة.','ومن الجنين إلى الأم: **ثاني أكسيد الكربون** واليوريا وفضلات أخرى.','يحيط بالجنين **الكيس الأمنيوني** الممتلئ بـ**السائل الأمنيوني** الذي يحميه من الصدمات.'], vis:'placenta', cap:'الجنين في الرحم: المشيمة، الحبل السري، الكيس والسائل الأمنيوني', q:{t:'mcq', q:'هل يختلط دم الأم بدم الجنين في المشيمة؟', opts:['نعم يختلطان تمامًا','لا؛ يتجاوران بشكل وثيق ويتبادلان المواد بالانتشار','يختلطان فقط عند الولادة','يختلطان في الحبل السري'], a:1, why:'الدمان منفصلان بحاجز رقيق تنتشر المواد عبره.'}},
        {title:'لماذا لا يختلط الدمان؟', tag:'تفسير', text:['ضغط دم الأم **أعلى** بكثير؛ لو اختلطا لتضرّرت أوعية الجنين الدقيقة.','قد تختلف **فصيلة الدم** بين الأم والجنين فيحدث تفاعل مناعي.','الفصل يسمح للمشيمة بأن تكون **حاجزًا انتقائيًا** يمنع بعض المواد الضارة (وليس كلها: النيكوتين وأول أكسيد الكربون وبعض الأدوية والفيروسات تعبر!).'], vis:{kind:'cards', items:[{icon:'🩸',title:'ضغط مختلف',text:'ضغط الأم أعلى'},{icon:'🅰️🅱️',title:'فصائل دم',text:'قد تختلف'},{icon:'🚧',title:'حاجز انتقائي',text:'يمنع بعض الضار'},{icon:'⚠️',title:'ليس كاملًا',text:'النيكوتين وبعض الأدوية تعبر'}]}, note:'💡 لهذا يُحذَّر من التدخين أثناء الحمل: أول أكسيد الكربون يقلّل الأكسجين الذي يصل الجنين.'},
        {title:'الجدول 1-4: المشيمة مقابل الرئتَين', tag:'بيانات', text:['**سمك الحاجز** الذي تنتشر عبره المواد: المشيمة **3.5 μm**، الرئتان **0.5 μm**.','**المساحة الإجمالية**: المشيمة **16 m²**، الرئتان **55 m²**.','**المعدل التقريبي لتدفّق الدم**: المشيمة **500 cm³/min**، الرئتان **5000 cm³/min**.','خطّط قبل الإجابة: أي رقم يخدم أي نقطة؟'], vis:{kind:'table', head:['الخاصية','المشيمة','الرئتان'], rows:[['سمك الحاجز الذي تنتشر المواد عبره (μm)','3.5','0.5'],['المساحة الإجمالية (m²)','16','55'],['المعدل التقريبي لتدفّق الدم (cm³/min)','500','5000']]}, q:{t:'mcq', q:'كم مرة يكون حاجز المشيمة أسمك من حاجز الرئتَين؟', opts:['مرتَين','7 مرات','10 مرات','35 مرة'], a:1, why:'3.5 ÷ 0.5 = 7 مرات.'}},
        {title:'البيانات بصريًا', tag:'تحليل', text:['الرئتان تتفوّقان في **كل** عامل يسرّع الانتشار: حاجز **أرقّ** 7 مرات، مساحة **أكبر** نحو 3.4 مرة، تدفّق دم **أكبر** 10 مرات.','تدفّق الدم الأكبر **يحافظ على تدرّج التركيز**: يحمل الأكسجين بعيدًا بسرعة ويجلب دمًا فقيرًا بالأكسجين.','المساحة الأكبر → **جزيئات أكثر تنتشر في الوقت نفسه**.','الحاجز الأرقّ → **مسافة انتشار أقصر** → انتشار أسرع.'], vis:{kind:'bars', items:[{t:'مساحة المشيمة (m²)',v:16,label:'16'},{t:'مساحة الرئتَين (m²)',v:55,label:'55'},{t:'تدفّق دم المشيمة (×100 cm³/min)',v:5,label:'500'},{t:'تدفّق دم الرئتَين (×100 cm³/min)',v:50,label:'5000'}], cap:'المساحة وتدفّق الدم — الرئتان تتفوّقان بوضوح'}},
        {title:'السؤال (أ): كيف يوفّر تركيب الرئتَين مساحة كبيرة؟', tag:'تركيب الرئتَين', text:['تتفرّع **القصبة الهوائية** إلى **شعبتَين** ثم إلى **شعيبات** كثيرة متفرّعة.','تنتهي الشعيبات بـ**ملايين الحويصلات الهوائية** الصغيرة الكروية.','مجموع أسطح هذه الحويصلات الصغيرة = مساحة ضخمة (**55 m²**).','كل حويصلة **محاطة بشبكة شعيرات دموية**، جدارها **بسماكة خلية واحدة** (0.5 μm) و**رطب**.'], vis:'alveolus', cap:'حويصلة هوائية مكبّرة مع شعيرة دموية: جدار رقيق وانتشار الغازات', q:{t:'mcq', q:'ما الذي يُعطي الرئتَين مساحة السطح الكبيرة؟', opts:['حجم القصبة الهوائية','ملايين الحويصلات الهوائية الصغيرة','سمك جدار الصدر','طول الحجاب الحاجز'], a:1, why:'مجموع مساحات الحويصلات الصغيرة الكثيرة يبلغ عشرات الأمتار المربعة.'}},
        {title:'السؤال (ب): من أين وإلى أين ينتقل الأكسجين؟', tag:'الانتشار', text:['**١. في الرئتَين**: ينتقل الأكسجين من **الهواء داخل الحويصلة الهوائية** إلى **الدم في الشعيرات الدموية** المحيطة بها (ثم إلى خلايا الدم الحمراء).','**في المشيمة**: من **دم الأم** إلى **دم الجنين**.','**٢. لماذا هذا الاتجاه؟** لأن **تركيز الأكسجين في هواء الحويصلة أعلى** من تركيزه في الدم القادم إلى الرئتَين (دم فقير بالأكسجين من الجسم).','ينتقل الأكسجين بـ**الانتشار** مع **تدرّج التركيز**: من الأعلى إلى الأقل، عبر الجدارَين الرقيقَين، دون حاجة إلى طاقة.','التهوية المستمرة (جلب هواء جديد) وتدفّق الدم المستمر **يحافظان على التدرّج**.'], vis:'placenta_lung', q:{t:'mcq', q:'لماذا يبقى تركيز الأكسجين في الدم القادم إلى الرئتَين منخفضًا؟', opts:['لأن الدم لا يحمل الأكسجين أبدًا','لأن الخلايا في الجسم استهلكت الأكسجين في التنفس','لأن الرئتَين تمتصّانه','لأن الدم بارد'], a:1, why:'الدم العائد من الجسم فقد أكسجينه للخلايا فيعود فقيرًا بالأكسجين، فيتكوّن تدرّج تركيز في الرئتَين.'}},
        {title:'السؤال (ج): لماذا تمتصّ الرئتان أكسجينًا أكثر في الدقيقة؟', tag:'تفسير بالبيانات', text:['**١. الحاجز أرقّ**: 0.5 μm مقابل 3.5 μm → مسافة انتشار أقصر → انتشار **أسرع**.','**٢. المساحة أكبر**: 55 m² مقابل 16 m² → عدد أكبر من جزيئات الأكسجين ينتشر **في الوقت نفسه**.','**٣. تدفّق الدم أكبر**: 5000 مقابل 500 cm³/min → يُزال الأكسجين المنتشر بسرعة ويأتي دم جديد فقير بالأكسجين → **تدرّج تركيز أشدّ**.','**٤.** في الرئتَين المصدر **هواء** غني بالأكسجين (حوالي 21%) وتتجدّد تهويته، أما في المشيمة فالمصدر **دم الأم** الذي تركيز أكسجينه أقل من الهواء.','قاعدة الإجابة الممتازة: **اذكر الرقمَين + قارن + اربط بمبدأ الانتشار**.'], vis:{kind:'steps', steps:[{icon:'📏',t:'حاجز أرقّ (0.5 مقابل 3.5 μm) → مسافة أقصر'},{icon:'📐',t:'مساحة أكبر (55 مقابل 16 m²) → جزيئات أكثر معًا'},{icon:'🌊',t:'تدفّق أكبر (5000 مقابل 500 cm³/min) → تدرّج محفوظ'},{icon:'💨',t:'مصدر غني بالأكسجين (هواء متجدّد) → تدرّج أشدّ'},{icon:'✅',t:'الرئتان تمتصّان أكسجينًا أكثر كل دقيقة'}]}},
        {title:'ماذا يكفي الجنين؟', tag:'ربط', text:['رغم أن المشيمة أقل كفاءة، فهي **تكفي الجنين**: حجمه صغير، ولا يتحرّك كثيرًا، ودمه يحوي هيموجلوبينًا جنينيًا **يرتبط بالأكسجين بقوة أكبر** فيسحبه من دم الأم.','عند الولادة تتمدّد الرئتان مع **أول شهيق**، وتبدأ الدورة الرئوية في العمل، ويُقطع الحبل السري.','كل ما يقلّل أكسجين دم الأم (التدخين، فقر الدم) يقلّل ما يصل الجنين.'], vis:{kind:'compare', cols:[{icon:'🤰',title:'قبل الولادة',items:['الأكسجين من دم الأم عبر المشيمة','الرئتان لا تعملان','هيموجلوبين جنيني عالي الألفة','الحبل السري ينقل الدم']},{icon:'👶',title:'بعد الولادة',items:['أول شهيق يفتح الحويصلات','الأكسجين من الهواء','الدورة الرئوية تعمل','يُقطع الحبل السري']}]}},
        {title:'خلاصة', tag:'خلاصة', text:['**المشيمة** و**الرئتان** سطحان لتبادل الغازات بـ**الانتشار** مع تدرّج التركيز.','في الرئتَين: من **هواء الحويصلة** إلى **الدم**؛ في المشيمة: من **دم الأم** إلى **دم الجنين** دون اختلاط.','الرئتان أكفأ لأن حاجزهما **أرقّ** (0.5 مقابل 3.5 μm)، ومساحتهما **أكبر** (55 مقابل 16 m²)، وتدفّق الدم فيهما **أكبر** (5000 مقابل 500 cm³/min).'], vis:{kind:'table', head:['','المشيمة','الرئتان'], rows:[['المصدر','دم الأم','هواء الحويصلات'],['المستقبِل','دم الجنين','دم الشعيرات الرئوية'],['الطريقة','انتشار','انتشار'],['سمك الحاجز','3.5 μm','0.5 μm'],['المساحة','16 m²','55 m²'],['تدفّق الدم','500 cm³/min','5000 cm³/min'],['متى تعمل','أثناء الحمل','بعد الولادة']]}}

      slides:[
        {title:'أعضاء لها وظائف محدّدة', tag:'تمهيد', text:['التكاثر في الإنسان **جنسي**: يحتاج **مشيجَين** من جهازَين تناسليَين مختلفَين.','**الجهاز الذكري** يُنتج الحيوانات المنوية ويوصلها، و**الجهاز الأنثوي** يُنتج البويضات ويوفّر مكان الإخصاب ونموّ الجنين.','في ورقة العمل عشرة أعضاء (أ–ي): نحدّد الجهاز الذي ينتمي إليه كل عضو ونصف وظيفته.'], vis:{kind:'compare', cols:[{icon:'♂️',title:'الجهاز الذكري',items:['الخصيتان','كيس الصفن','الوعاء الناقل','غدة البروستات','الإحليل','القضيب']},{icon:'♀️',title:'الجهاز الأنثوي',items:['المبيضان','قناتا البيض','الرحم','عنق الرحم','المهبل']}]}},
        {title:'الجهاز التناسلي الذكري: نظرة عامة', tag:'الذكري', text:['**الخصيتان** داخل **كيس الصفن** → **الوعاء الناقل** → يلتقي بـ**الإحليل** بعد أن تضيف **غدة البروستات** (والحويصلتان المنويتان) سوائلها → **القضيب**.','**المثانة** في الرسم ليست عضوًا تناسليًا، لكن الإحليل يشترك في نقل البول والسائل المنوي (في أوقات مختلفة).'], vis:'male_system', cap:'مخطط جانبي للجهاز التناسلي الذكري', q:{t:'mcq', q:'أي تركيب في الرسم ليس من الجهاز التناسلي؟', opts:['الخصية','الوعاء الناقل','المثانة','غدة البروستات'], a:2, why:'المثانة من الجهاز البولي؛ الإحليل مشترك بين الجهازَين.'}},
        {title:'وظائف الأعضاء الذكرية', tag:'الذكري', text:['**ب. الخصيتان**: تُنتجان **الحيوانات المنوية** وهرمون **التستوستيرون**.','**ح. كيس الصفن**: كيس جلدي يحمل الخصيتَين **خارج الجسم** عند درجة حرارة أقل قليلًا من حرارة الجسم — وهي الأنسب لإنتاج الحيوانات المنوية.','**و. الوعاء الناقل**: قناة تنقل الحيوانات المنوية من الخصية إلى الإحليل.','**هـ. غدة البروستات**: تُفرز سائلًا **يغذّي** الحيوانات المنوية ويساعدها على **السباحة**؛ السائل + الحيوانات المنوية = **السائل المنوي**.','**ز. القضيب**: ينقل السائل المنوي عبر **الإحليل** إلى الجهاز الأنثوي.'], vis:{kind:'table', head:['العضو','الوظيفة'], rows:[['الخصيتان','إنتاج الحيوانات المنوية والتستوستيرون'],['كيس الصفن','حمل الخصيتَين خارج الجسم بدرجة حرارة أقل'],['الوعاء الناقل','نقل الحيوانات المنوية إلى الإحليل'],['غدة البروستات','إفراز سائل مغذٍّ يساعد الحيوانات المنوية على السباحة'],['الإحليل','قناة تمرّ خلالها الحيوانات المنوية (والبول في أوقات أخرى)'],['القضيب','نقل السائل المنوي إلى الجهاز الأنثوي']]}, q:{t:'mcq', q:'لماذا تقع الخصيتان في كيس الصفن؟', opts:['لتكون أقرب إلى القلب','لأن إنتاج الحيوانات المنوية يحتاج درجة حرارة أقل قليلًا من حرارة الجسم','لتخزين البول','لإنتاج البويضات'], a:1, why:'الحرارة الأقل قليلًا هي الأنسب لتكوين الحيوانات المنوية.'}},
        {title:'الجهاز التناسلي الأنثوي: نظرة عامة', tag:'الأنثوي', text:['**المبيضان** → **قناتا البيض** → **الرحم** → **عنق الرحم** → **المهبل**.','تُطلَق بويضة من أحد المبيضَين كل شهر تقريبًا (**الإباضة**) وتُدفَع في قناة البيض بالأهداب.','إن التقت حيوانًا منويًا في القناة حدث **الإخصاب**، وانتقل الجنين إلى الرحم **لينغرس** في بطانته.'], vis:'female_system', cap:'مخطط أمامي للجهاز التناسلي الأنثوي مع بويضة تتحرّك في قناة البيض', q:{t:'mcq', q:'أين يحدث الإخصاب عادةً؟', opts:['في المبيض','في قناة البيض','في الرحم','في عنق الرحم'], a:1, why:'تلتقي الحيوانات المنوية بالبويضة في قناة البيض.'}},
        {title:'وظائف الأعضاء الأنثوية', tag:'الأنثوي', text:['**أ. المبيض**: يُنتج **البويضات** وهرمونَي **الإستروجين** و**البروجستيرون**.','**ط. قناتا البيض** (قناتا فالوب): تنقلان البويضة إلى الرحم بالأهداب؛ **موقع الإخصاب**.','**ج. الرحم**: عضو **عضلي** تنغرس فيه البويضة المخصّبة وينمو فيه **الجنين** مع المشيمة؛ يتقلّص عند الولادة.','**د. عنق الرحم**: حلقة عضلية تفصل الرحم عن المهبل؛ تبقى مغلقة أثناء الحمل وتتّسع عند الولادة.','**ي. المهبل**: قناة عضلية يمرّ عبرها الطفل عند الولادة (قناة الولادة) ويستقبل السائل المنوي.'], vis:{kind:'table', head:['العضو','الوظيفة'], rows:[['المبيض','إنتاج البويضات والهرمونات الأنثوية'],['قناتا البيض','نقل البويضة إلى الرحم؛ موقع الإخصاب'],['الرحم','مكان انغراس الجنين ونموّه'],['عنق الرحم','حلقة عضلية بين الرحم والمهبل؛ تتّسع عند الولادة'],['المهبل','استقبال السائل المنوي؛ قناة الولادة']]}},
        {title:'أعضاء متقابلة', tag:'مقارنة', text:['**الخصية ↔ المبيض**: كلاهما **غدد تناسلية** تُنتج الأمشاج والهرمونات.','**الوعاء الناقل ↔ قناة البيض**: كلاهما **قنوات** تنقل المشيج.','**غدة البروستات**: لا مقابل مباشر؛ تُضيف سائلًا مغذّيًا.','**الرحم**: فريد؛ مكان نموّ الجنين.'], vis:{kind:'compare', cols:[{icon:'♂️',title:'ذكري',items:['خصية: تُنتج الحيوانات المنوية','وعاء ناقل: ينقل المشيج','بروستات: سائل مغذٍّ','إحليل + قضيب: توصيل']},{icon:'♀️',title:'أنثوي',items:['مبيض: يُنتج البويضات','قناة البيض: تنقل المشيج + إخصاب','رحم: نموّ الجنين','عنق الرحم + مهبل: قناة الولادة']}]}, q:{t:'mcq', q:'العضو الأنثوي الذي يقابل الخصية في الوظيفة:', opts:['الرحم','المبيض','المهبل','عنق الرحم'], a:1, why:'كلاهما غدة تناسلية تُنتج الأمشاج والهرمونات.'}},
        {title:'رحلة الحيوان المنوي إلى البويضة', tag:'مسار', text:['الخصية → الوعاء الناقل → (إضافة سائل البروستات) → الإحليل → المهبل → عنق الرحم → الرحم → **قناة البيض** حيث البويضة.','رحلة طويلة نسبيًا لخلية بهذا الحجم؛ لذلك يلزم **الذيل** و**الميتوكوندريا** و**الأعداد الكبيرة** (تذكّر درس الأمشاج).'], vis:{kind:'flow', steps:[{icon:'🏭',t:'الخصية'},{icon:'➡️',t:'الوعاء الناقل'},{icon:'💧',t:'سائل البروستات'},{icon:'🚪',t:'الإحليل'},{icon:'🏊',t:'المهبل → عنق الرحم → الرحم'},{icon:'🎯',t:'قناة البيض: الإخصاب'}]}},
        {title:'الإجابة الكاملة لورقة العمل', tag:'الإجابة', text:['**ذكري**: ب. الخصيتان، هـ. غدة البروستات، و. الوعاء الناقل، ز. القضيب، ح. كيس الصفن.','**أنثوي**: أ. المبيض، ج. الرحم، د. عنق الرحم، ط. قناتا البيض، ي. المهبل.','لكل عضو وظيفة واحدة واضحة على الأقل — راجع الجدولَين السابقَين.'], vis:{kind:'table', head:['الرمز','العضو','الجهاز','الوظيفة المختصرة'], rows:[['أ','المبيض','أنثوي','إنتاج البويضات والهرمونات'],['ب','الخصيتان','ذكري','إنتاج الحيوانات المنوية والتستوستيرون'],['ج','الرحم','أنثوي','نموّ الجنين'],['د','عنق الرحم','أنثوي','حلقة عضلية تتّسع عند الولادة'],['هـ','غدة البروستات','ذكري','سائل مغذٍّ للحيوانات المنوية'],['و','الوعاء الناقل','ذكري','نقل الحيوانات المنوية'],['ز','القضيب','ذكري','نقل السائل المنوي'],['ح','كيس الصفن','ذكري','حمل الخصيتَين بحرارة أقل'],['ط','قناتا البيض','أنثوي','نقل البويضة؛ موقع الإخصاب'],['ي','المهبل','أنثوي','استقبال السائل المنوي؛ قناة الولادة']]}},
        {title:'خلاصة', tag:'خلاصة', text:['**الجهاز الذكري**: الخصيتان (في كيس الصفن) تُنتجان الحيوانات المنوية → الوعاء الناقل → سائل البروستات → الإحليل → القضيب.','**الجهاز الأنثوي**: المبيض يُنتج البويضة → قناة البيض (الإخصاب) → الرحم (نموّ الجنين) → عنق الرحم → المهبل (قناة الولادة).','كل عضو **تكيّف لوظيفة**؛ والعمل معًا يحقّق **التكاثر الجنسي**.'], vis:'female_system'}

          {q:'وظيفة الخصيتَين:', opts:['تخزين البول','إنتاج الحيوانات المنوية والتستوستيرون','إنتاج البويضات','نقل السائل المنوي'], a:1, why:'غدة تناسلية ذكرية.'},
          {q:'ينتمي عنق الرحم إلى:', opts:['الجهاز الذكري','الجهاز الأنثوي','الجهاز الدوري','الجهاز التنفسي'], a:1, why:'حلقة عضلية بين الرحم والمهبل.'},
          {q:'وظيفة غدة البروستات:', opts:['إنتاج الحيوانات المنوية','إفراز سائل مغذٍّ يساعد الحيوانات المنوية على السباحة','إنتاج البويضات','نقل البول فقط'], a:1, why:'سائلها يكوّن مع الحيوانات المنوية السائل المنوي.'},
          {q:'وظيفة قناتَي البيض:', opts:['إنتاج البويضات','نقل البويضة إلى الرحم وهما موقع الإخصاب','نموّ الجنين','إفراز الهرمونات فقط'], a:1, why:'تنقل البويضة بالأهداب ويحدث فيها الإخصاب.'},
          {q:'العضو الذي ينغرس فيه الجنين وينمو:', opts:['المبيض','الرحم','المهبل','قناة البيض'], a:1, why:'جدار الرحم العضلي وبطانته.'},
          {q:'لماذا تُحمَل الخصيتان في كيس الصفن خارج الجسم؟', opts:['لحمايتهما من الضوء','لأن إنتاج الحيوانات المنوية يحتاج حرارة أقل قليلًا من حرارة الجسم','لتقليل الوزن','لإنتاج الهرمونات الأنثوية'], a:1, why:'درجة الحرارة الأقل أنسب لتكوين الحيوانات المنوية.'},
          {q:'ينقل الوعاء الناقل:', opts:['البويضات','الحيوانات المنوية من الخصية إلى الإحليل','البول من الكلية','الدم إلى القلب'], a:1, why:'قناة ذكرية للمشيج.'},
          {q:'المهبل يُعرف أيضًا بأنه:', opts:['قناة الولادة','موقع الإخصاب','مكان إنتاج البويضات','الغدة التناسلية'], a:0, why:'يمرّ عبره الطفل عند الولادة.'},
          {q:'أي زوج من الأعضاء يُقابل أحدهما الآخر في الوظيفة؟', opts:['الخصية والمبيض','الرحم والبروستات','الإحليل والمبيض','كيس الصفن والرحم'], a:0, why:'كلاهما غدة تناسلية تُنتج الأمشاج والهرمونات.'}

        reflect:['لماذا يُعدّ وجود قناة البيض كموقع للإخصاب أفضل من حدوثه في الرحم مباشرة؟','ما الذي يميّز الأعضاء التي تُنتج الأمشاج عن الأعضاء التي تنقلها؟'],
        summary:'**الجهاز الذكري**: **الخصيتان** (في **كيس الصفن**) تُنتجان الحيوانات المنوية → **الوعاء الناقل** → سائل **غدة البروستات** → **الإحليل** → **القضيب**. **الجهاز الأنثوي**: **المبيض** يُنتج البويضات → **قناتا البيض** (موقع الإخصاب) → **الرحم** (نموّ الجنين) → **عنق الرحم** → **المهبل** (قناة الولادة).' }

    /* ============================ ورقة عمل ٢-٤ ============================ */
    { id:'w4_2', num:'ورقة عمل ٢-٤', title:'فيروس نقص المناعة في الإنسان HIV ومرض الإيدز AIDS في منطقة البحر الكاريبي', en:'HIV and AIDS in the Caribbean', ws:true,
      preIntro:'قبل قراءة جدول البيانات، لنتأكّد من فهمنا لما هو فيروس HIV وكيف ينتقل.',
      pre:[
        {t:'tf', q:'HIV فيروس، والإيدز AIDS هو المرض الذي قد يسبّبه هذا الفيروس بعد سنوات.', a:true, why:'HIV = فيروس نقص المناعة البشرية؛ AIDS = متلازمة نقص المناعة المكتسب، وهي المرحلة المتقدّمة من العدوى.'},
        {t:'mcq', q:'أي خلايا يهاجمها فيروس HIV أساسًا؟', opts:['خلايا الدم الحمراء','الخلايا الليمفاوية التائية المساعدة في جهاز المناعة','الخلايا العصبية','خلايا الكبد'], a:1, why:'يهاجم الفيروس الخلايا التائية المساعدة فيضعف جهاز المناعة، فيُصاب الشخص بعدوى انتهازية.'},
        {t:'cloud', q:'اختر طرق انتقال فيروس HIV:', words:[{w:'الاتصال الجنسي غير المشروع',ok:true},{w:'مشاركة الإبر والحقن',ok:true},{w:'نقل دم ملوّث',ok:true},{w:'من الأم إلى الجنين أو الرضيع',ok:true},{w:'المصافحة',ok:false},{w:'العطاس والسعال',ok:false},{w:'مشاركة الطعام',ok:false},{w:'لدغة البعوض',ok:false},{w:'الجلوس في الصف نفسه',ok:false},{w:'أدوات حادّة ملوّثة بالدم',ok:true}], why:'ينتقل الفيروس عبر سوائل الجسم (الدم وغيرها) فقط، ولا ينتقل بالتعامل اليومي العادي.'},
        {t:'visual', vis:'hiv', q:'انظر إلى تركيب الفيروس: ما نوع المادة الوراثية فيه؟', opts:['DNA','RNA','بروتين فقط','سكر'], a:1, why:'فيروس HIV من الفيروسات الارتجاعية (القهقرية) التي تحمل RNA وإنزيم النسخ العكسي.'},
        {t:'mcq', q:'في جدول ورقة العمل، ما معنى «النسبة المئوية للبالغين المصابين»؟', opts:['عدد المصابين الكلي','عدد المصابين من كل 100 بالغ في البلد','عدد الوفيات','عدد الأطفال المصابين'], a:1, why:'النسبة المئوية تُعبّر عن الانتشار نسبةً إلى عدد السكان البالغين، لا العدد المطلق.'},
        {t:'open', q:'بلد فيه 120000 مصاب وبلد آخر فيه 6500 مصاب. هل يعني ذلك بالضرورة أن المرض أكثر انتشارًا في الأول؟ فكّر في عدد السكان.'}
      ],
      slides:[
        {title:'فيروس صغير... وأثر كبير', tag:'تمهيد', text:['**HIV** (فيروس نقص المناعة البشرية) يُضعف جهاز المناعة تدريجيًا حتى تظهر **الإيدز AIDS** (متلازمة نقص المناعة المكتسب).','في هذه الورقة نقرأ **بيانات حقيقية** عن الإصابات والوفيات في **7 بلدان كاريبية** (نهاية 2011) ونحسب ونقارن ونقترح.','مهارات: قراءة الجدول، التمييز بين **العدد** و**النسبة المئوية**، الجمع، والتفكير في **التوعية**.'], vis:'hiv', cap:'تركيب فيروس HIV وطرق انتقاله'},
        {title:'تركيب فيروس HIV', tag:'تركيب', text:['**غلاف** دهني خارجي عليه **بروتينات سطحية** (أشواك) يرتبط بها بمستقبلات الخلية التائية المساعدة.','بداخله **RNA** (مادته الوراثية) وإنزيم **النسخ العكسي** الذي يحوّل RNA إلى DNA داخل الخلية المصابة.','ليس خلية: لا يتكاثر إلا **داخل خلية حيّة**، ويستخدم آلياتها لصنع نسخ منه.'], vis:'hiv', q:{t:'mcq', q:'لماذا يُعدّ HIV «فيروسًا ارتجاعيًا»؟', opts:['لأنه يعود بعد الشفاء','لأنه يحوّل RNA إلى DNA بإنزيم النسخ العكسي','لأنه يهاجم الخلايا الحمراء','لأنه يتحرّك للخلف'], a:1, why:'اتجاه النسخ من RNA إلى DNA معاكس للمعتاد، لذا يُسمّى «ارتجاعيًا/عكسيًا».'}},
        {title:'كيف يُضعف الفيروس المناعة؟', tag:'آلية', text:['يدخل الفيروس **الخلية التائية المساعدة** ويتكاثر فيها ثم يدمّرها.','الخلايا التائية المساعدة تنسّق الاستجابة المناعية (تنشّط الخلايا البائية المنتجة للأجسام المضادة).','مع تناقص عددها يصبح الجسم عاجزًا عن مقاومة **عدوى انتهازية** (التهابات رئوية، السل، أنواع من السرطان) = **الإيدز**.','قد تمرّ **سنوات** بين الإصابة وظهور الأعراض؛ لذلك قد ينقل المصاب الفيروس دون أن يعرف.'], vis:{kind:'steps', steps:[{icon:'🦠',t:'دخول HIV إلى الدم'},{icon:'🎯',t:'يرتبط بالخلية التائية المساعدة'},{icon:'🔁',t:'يتكاثر داخلها ويدمّرها'},{icon:'📉',t:'انخفاض عدد الخلايا التائية'},{icon:'🤒',t:'عدوى انتهازية → الإيدز'}]}, note:'💡 الفحص المبكر والأدوية المضادة للفيروسات الارتجاعية تُبطئ تطوّر المرض كثيرًا وتقلّل نقل العدوى.'},
        {title:'طرق الانتقال', tag:'انتقال', text:['ينتقل عبر **سوائل الجسم**: **الاتصال الجنسي** غير المشروع مع شخص مصاب.','**مشاركة الإبر** والحقن وأدوات الوشم والحلاقة غير المعقّمة.','**نقل دم** أو منتجاته غير مفحوصة.','من **الأم المصابة إلى الجنين** أثناء الحمل أو الولادة، أو إلى **الرضيع** عبر الرضاعة.','**لا ينتقل** بالمصافحة أو العناق أو العطاس أو الطعام أو المرافق المشتركة أو لدغ البعوض.'], vis:{kind:'compare', cols:[{icon:'⚠️',title:'ينتقل بـ',items:['الاتصال الجنسي غير المشروع','مشاركة الإبر والحقن','دم ملوّث غير مفحوص','من الأم إلى الجنين/الرضيع']},{icon:'✅',title:'لا ينتقل بـ',items:['المصافحة والعناق','العطاس والسعال','مشاركة الطعام والأدوات المنزلية','لدغ البعوض','الجلوس والدراسة معًا']}]}, q:{t:'mcq', q:'أي ممّا يأتي لا ينقل HIV؟', opts:['مشاركة الإبر','نقل دم غير مفحوص','المصافحة','من الأم إلى الرضيع'], a:2, why:'الفيروس لا ينتقل بالتلامس اليومي العادي.'}},
        {title:'طرق الوقاية', tag:'وقاية', text:['**العفّة** والالتزام بالعلاقة الزوجية المشروعة والإخلاص فيها.','**عدم مشاركة** الإبر والحقن والأدوات الحادّة، واستخدام أدوات **معقّمة** أو ذات استعمال واحد.','**فحص الدم** المتبرَّع به قبل نقله.','**فحص الأمهات** الحوامل وعلاج المصابات بالأدوية لتقليل انتقال العدوى إلى الجنين.','**التوعية** والتثقيف الصحي، والفحص الطوعي المبكر، والعلاج المنتظم للمصابين.'], vis:{kind:'cards', items:[{icon:'💍',title:'العفّة والإخلاص',text:'سلوك آمن'},{icon:'💉',title:'إبر معقّمة',text:'لا مشاركة'},{icon:'🩸',title:'فحص الدم',text:'قبل النقل'},{icon:'🤱',title:'رعاية الأمهات',text:'فحص وعلاج'},{icon:'📢',title:'التوعية',text:'معرفة تحمي'},{icon:'💊',title:'العلاج',text:'يقلّل الفيروس والنقل'}]}},
        {title:'الجدول: الإيدز في الكاريبي (نهاية 2011)', tag:'بيانات', text:['سبعة بلدان، ثلاثة أعمدة: **عدد المصابين**، **النسبة المئوية للبالغين المصابين**، **عدد الوفيات سنة 2005**.','لاحظ: بعض الخانات «أقل من ...» أي قيمة تقريبية قصوى.','لاحظ أيضًا أن الوفيات تخصّ سنة **2005** بينما الإصابات لنهاية **2011**.'], vis:{kind:'table', head:['البلد','عدد المصابين بالإيدز','% البالغين المصابين','الوفيات بالإيدز 2005'], rows:[['جزر البهاما','6500','2.8','أقل من 500'],['بربادوس','1400','0.9','أقل من 200'],['كوبا','14100','0.2','أقل من 100'],['جمهورية الدومينيكان','44000','0.7','1700'],['هايتي','120000','1.8','5800'],['جامايكا','30000','1.8','1600'],['ترينيداد وتوباغو','13000','1.5','أقل من 1000']]}, q:{t:'mcq', q:'أي بلد سجّل أكبر عدد من المصابين؟', opts:['جزر البهاما','هايتي','كوبا','جامايكا'], a:1, why:'هايتي 120000 مصاب — أكبر عدد بفارق كبير.'}},
        {title:'العدد مقابل النسبة المئوية', tag:'تحليل', text:['**(أ) أعلى نسبة مئوية**: **جزر البهاما** (2.8%) رغم أن عدد مصابيها 6500 فقط — لأن عدد سكانها صغير.','**(ب) أكبر عدد**: **هايتي** (120000) بنسبة 1.8% — لأن عدد سكانها كبير.','**كوبا**: عدد كبير نسبيًا (14100) لكن أقل نسبة (0.2%) — سكانها كثيرون وبرامجها الصحية قوية.','الدرس: **العدد** يعتمد على حجم السكان؛ **النسبة** تُظهر شدّة الانتشار.'], vis:{kind:'bars', items:[{t:'البهاما',v:28,label:'2.8%'},{t:'هايتي',v:18,label:'1.8%'},{t:'جامايكا',v:18,label:'1.8%'},{t:'ترينيداد',v:15,label:'1.5%'},{t:'بربادوس',v:9,label:'0.9%'},{t:'الدومينيكان',v:7,label:'0.7%'},{t:'كوبا',v:2,label:'0.2%'}], cap:'النسبة المئوية للبالغين المصابين بالإيدز (نهاية 2011)'}, q:{t:'mcq', q:'لماذا نسبة البهاما أعلى من هايتي رغم أن عدد مصابيها أقل بكثير؟', opts:['لأن البيانات خاطئة','لأن عدد سكان البهاما أصغر بكثير','لأن الوفيات فيها أكثر','لأن المناخ مختلف'], a:1, why:'النسبة = المصابون ÷ البالغون × 100؛ سكان قليلون يُعطون نسبة أعلى للعدد نفسه.'}},
        {title:'(ج) حساب الإجمالي', tag:'حساب', text:['نجمع عدد المصابين في البلدان السبعة:','6500 + 1400 + 14100 + 44000 + 120000 + 30000 + 13000','= **229000** مصاب تقريبًا.','هايتي وحدها تمثّل أكثر من **نصف** الإجمالي (120000 ÷ 229000 ≈ 52%).'], vis:{kind:'bars', items:[{t:'البهاما',v:6.5,label:'6500'},{t:'بربادوس',v:1.4,label:'1400'},{t:'كوبا',v:14.1,label:'14100'},{t:'الدومينيكان',v:44,label:'44000'},{t:'هايتي',v:120,label:'120000'},{t:'جامايكا',v:30,label:'30000'},{t:'ترينيداد',v:13,label:'13000'}], cap:'عدد المصابين بالإيدز في كل بلد (المجموع ≈ 229000)'}},
        {title:'(د) كيف تُساهم التوعية في تقليل الأرقام؟', tag:'اقتراح', text:['**معرفة طرق الانتقال** → تجنّب السلوكيات الخطرة (العفّة، عدم مشاركة الإبر).','**إزالة الخوف والوصمة** → يُقبل الناس على **الفحص المبكر** فيعرف المصاب حالته ولا ينقل العدوى.','**تشجيع العلاج المنتظم** → يقلّ الفيروس في الدم فيقلّ الانتقال (ومن الأم إلى الجنين خاصةً).','**تصحيح المفاهيم الخاطئة** (لا ينتقل بالمصافحة) → تعامل إنساني مع المصابين ودعمهم.','**استهداف الفئات الأكثر عرضة** ببرامج تثقيف صحي في المدارس والمراكز الصحية ووسائل الإعلام.'], vis:{kind:'cycle', center:'📢', steps:[{icon:'📚',t:'معرفة طرق الانتقال'},{icon:'🛡️',t:'سلوك آمن'},{icon:'🧪',t:'فحص مبكر'},{icon:'💊',t:'علاج منتظم'},{icon:'📉',t:'انتقال أقل'},{icon:'❤️',t:'دعم المصابين بلا وصمة'}]}},
        {title:'خلاصة', tag:'خلاصة', text:['**HIV** فيروس بـRNA يهاجم **الخلايا التائية المساعدة** فيُضعف المناعة حتى **الإيدز**.','ينتقل عبر **سوائل الجسم** (اتصال جنسي غير مشروع، إبر مشتركة، دم ملوّث، من الأم إلى الجنين) ولا ينتقل بالتعامل اليومي.','في الكاريبي 2011: أعلى نسبة **البهاما** (2.8%)، أكبر عدد **هايتي** (120000)، الإجمالي ≈ **229000**.','**التوعية** + الفحص + العلاج + السلوك الآمن = أرقام أقل.'], vis:'hiv'}
      ],
      games:[
        {id:'g1', type:'label', title:'سمِّ أجزاء فيروس HIV', vis:'hiv', labels:[{id:'envelope',text:'الغلاف'},{id:'rna',text:'RNA'},{id:'spikes',text:'البروتينات السطحية'},{id:'tcell',text:'الخلية التائية المساعدة'}]},
        {id:'g2', type:'quiz', title:'سباق البيانات', time:25, runner:'📊', qs:[
          {q:'البلد الذي سجّل أعلى نسبة مئوية من البالغين المصابين:', opts:['هايتي','جزر البهاما','كوبا','جامايكا'], a:1, why:'2.8% في البهاما.'},
          {q:'البلد الذي سجّل أكبر عدد من المصابين:', opts:['جمهورية الدومينيكان','هايتي','جامايكا','ترينيداد وتوباغو'], a:1, why:'120000 مصاب.'},
          {q:'إجمالي عدد المصابين في البلدان السبعة تقريبًا:', opts:['129000','229000','329000','120000'], a:1, why:'6500+1400+14100+44000+120000+30000+13000 = 229000.'},
          {q:'البلد ذو أقل نسبة مئوية:', opts:['كوبا','بربادوس','الدومينيكان','البهاما'], a:0, why:'0.2% في كوبا.'},
          {q:'البلدان التي تساوت نسبتهما (1.8%):', opts:['البهاما وبربادوس','هايتي وجامايكا','كوبا وترينيداد','الدومينيكان وهايتي'], a:1, why:'هايتي 1.8% وجامايكا 1.8%.'},
          {q:'عدد الوفيات بالإيدز في هايتي سنة 2005:', opts:['1600','1700','5800','أقل من 500'], a:2, why:'5800 وفاة — الأعلى في الجدول.'},
          {q:'لماذا يختلف ترتيب البلدان بين العدد والنسبة؟', opts:['لأن الجدول خاطئ','لأن النسبة تعتمد على حجم السكان بينما العدد مطلق','لأن الوفيات تختلف','لأن سنة الوفيات 2005'], a:1, why:'النسبة تُعبّر عن الانتشار نسبةً إلى السكان.'},
          {q:'الخلايا التي يهاجمها HIV:', opts:['خلايا الدم الحمراء','الخلايا التائية المساعدة','الصفائح الدموية','خلايا العظم'], a:1, why:'فيضعف جهاز المناعة.'},
          {q:'أي إجراء يقلّل انتقال HIV من الأم إلى الجنين؟', opts:['العطاس بعيدًا','فحص الحوامل وعلاج المصابات بالأدوية','تناول الفيتامينات','تجنّب المصافحة'], a:1, why:'العلاج يقلّل الفيروس في دم الأم فيقلّ الانتقال.'},

<script>
/* ===================== ENGINE CORE ===================== */
(function(){
'use strict';
const D = window.BIO_DATA;
const PRESETS = window.BIO_PRESETS || {};
const $ = (s,el=document)=>el.querySelector(s);
const $$ = (s,el=document)=>[...el.querySelectorAll(s)];
const app = $('#app');
const KEY = 'bio_'+D.grade+'_v1';
const esc = s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle = a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const AR = ['أ','ب','ج','د','هـ','و'];
const ARN = n=>String(n).replace(/\d/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]);

/* ---------- state ---------- */
let S = load();
function load(){ try{ return JSON.parse(localStorage.getItem(KEY))||{lessons:{},settings:{sound:true,tts:true},teams:{a:0,b:0}}; }catch(e){ return {lessons:{},settings:{sound:true,tts:true},teams:{a:0,b:0}}; } }
function save(){ try{ localStorage.setItem(KEY,JSON.stringify(S)); }catch(e){} }
function LS(id){ return S.lessons[id] || (S.lessons[id]={pre:false,slide:0,slidesDone:false,games:{},post:null}); }
const allLessons = ()=>D.units.flatMap(u=>u.lessons.map(l=>({...l,unit:u})));
function lessonPct(l){ const s=LS(l.id); let n=0; if(s.pre)n++; if(s.slidesDone)n++; if(Object.keys(s.games).length)n++; if(s.post!=null)n++; return n; }
function totalPct(){ const ls=allLessons(); const n=ls.reduce((a,l)=>a+lessonPct(l),0); return Math.round(100*n/(ls.length*4)); }
function updateProg(){ const p=totalPct(); $('#progTxt').textContent=ARN(p)+'%'; $('#progBar').style.width=p+'%'; }

/* ---------- audio ---------- */
let AC=null;
function ac(){ if(!AC){ try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){} } if(AC&&AC.state==='suspended')AC.resume(); return AC; }
function tone(f,t,dur,type='sine',vol=.18,slide=0){ const c=ac(); if(!c||!S.settings.sound)return; const o=c.createOscillator(),g=c.createGain(); o.type=type; o.frequency.setValueAtTime(f,c.currentTime+t); if(slide)o.frequency.exponentialRampToValueAtTime(slide,c.currentTime+t+dur); g.gain.setValueAtTime(0,c.currentTime+t); g.gain.linearRampToValueAtTime(vol,c.currentTime+t+.01); g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+t+dur); o.connect(g).connect(c.destination); o.start(c.currentTime+t); o.stop(c.currentTime+t+dur+.02); }
const SFX={
  click:()=>tone(600,0,.06,'triangle',.08),
  ok:()=>{tone(523,0,.12,'triangle');tone(659,.1,.12,'triangle');tone(784,.2,.2,'triangle');},
  bad:()=>{tone(220,0,.18,'sawtooth',.12,160);},
  win:()=>{[523,659,784,1047].forEach((f,i)=>tone(f,i*.12,.25,'triangle',.16));tone(1319,.5,.5,'triangle',.14);},
  flip:()=>tone(880,0,.05,'sine',.06),
  pop:()=>tone(900,0,.08,'square',.06,300),
  tick:()=>tone(1200,0,.03,'square',.03),
  whoosh:()=>tone(300,0,.25,'sine',.08,900),
  star:()=>{tone(1047,0,.1,'sine',.1);tone(1568,.08,.2,'sine',.1);}
};
/* TTS */
let voices=[]; function loadVoices(){ try{voices=speechSynthesis.getVoices();}catch(e){} }
if('speechSynthesis' in window){ loadVoices(); speechSynthesis.onvoiceschanged=loadVoices; }
function speak(text){ if(!S.settings.tts||!('speechSynthesis' in window))return; try{ speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(String(text).replace(/[*_#]/g,'')); u.lang='ar-SA'; const v=voices.find(v=>/^ar/i.test(v.lang)); if(v)u.voice=v; u.rate=.95; speechSynthesis.speak(u);}catch(e){} }
function stopSpeak(){ try{speechSynthesis.cancel();}catch(e){} }

/* ---------- fx ---------- */
function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('show'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),1800); }
function confetti(n=80){ const c=$('#conf'); const cols=['#0f9d8a','#ff7a59','#ffc43d','#3b82f6','#8b5cf6','#22c55e']; for(let i=0;i<n;i++){ const e=document.createElement('i'); e.style.left=Math.random()*100+'vw'; e.style.background=cols[i%cols.length]; e.style.animationDelay=(Math.random()*.6)+'s'; e.style.transform=`rotate(${Math.random()*360}deg)`; c.appendChild(e); setTimeout(()=>e.remove(),3200);} }
function fx(x,y,txt,color){ const e=document.createElement('div'); e.className='fx'; e.textContent=txt; e.style.left=x+'px'; e.style.top=y+'px'; e.style.color=color||'#22c55e'; document.body.appendChild(e); setTimeout(()=>e.remove(),1000); }
function goodAt(ev){ SFX.ok(); const p=ev&&ev.clientX?ev:{clientX:innerWidth/2,clientY:innerHeight/2}; fx(p.clientX,p.clientY,'+1 ✓','#22c55e'); }
function badAt(ev){ SFX.bad(); const p=ev&&ev.clientX?ev:{clientX:innerWidth/2,clientY:innerHeight/2}; fx(p.clientX,p.clientY,'✗','#ef4444'); }
function stars(p){ const n=p>=.9?3:p>=.6?2:p>0?1:0; return '<div class="stars">'+'⭐'.repeat(n)+'<span style="opacity:.25">'+'⭐'.repeat(3-n)+'</span></div>'; }
function praise(p){ return p>=.9?'ممتاز! أداء رائع 🌟':p>=.7?'أحسنت! عمل جيد جدًا 👏':p>=.5?'جيد، يمكنك التحسّن 💪':'حاول مرة أخرى، ستنجح 🌱'; }

/* ---------- header buttons ---------- */
function setTB(){ $('#btnSound').classList.toggle('off',!S.settings.sound); $('#btnTTS').classList.toggle('off',!S.settings.tts); }
$('#btnSound').onclick=()=>{S.settings.sound=!S.settings.sound;save();setTB();if(S.settings.sound)SFX.click();};
$('#btnTTS').onclick=()=>{S.settings.tts=!S.settings.tts;save();setTB();if(S.settings.tts)speak('تم تفعيل القراءة الصوتية');else stopSpeak();};
$('#btnFull').onclick=()=>{ if(!document.fullscreenElement)document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen(); else document.exitFullscreen(); };
$('#btnHome').onclick=()=>{stopSpeak();renderHome();};
$('#btnTeams').onclick=()=>{$('#teams').classList.toggle('hidden');};
$$('#teams .team button').forEach(b=>b.onclick=()=>{ const t=b.dataset.t; S.teams[t]=Math.max(0,S.teams[t]+(+b.dataset.d)); save(); renderTeams(); SFX.click(); });
$('#teamsReset').onclick=()=>{S.teams={a:0,b:0};save();renderTeams();};
function renderTeams(){ $('#scA').textContent=ARN(S.teams.a); $('#scB').textContent=ARN(S.teams.b); }
setTB(); renderTeams();

/* ---------- unit theming ---------- */
function theme(u){ document.documentElement.style.setProperty('--u',u?u.color:'#0f9d8a'); document.documentElement.style.setProperty('--ul',u?(u.light||hexA(u.color,.16)):'#d7f3ee'); }
function hexA(h,a){ const n=parseInt(h.slice(1),16); return `rgba(${n>>16},${(n>>8)&255},${n&255},${a})`; }

/* ===================== HOME ===================== */
function renderHome(){
  theme(null); window.scrollTo(0,0);
  const ls=allLessons(); const done=ls.filter(l=>lessonPct(l)===4).length;
  const games=ls.reduce((a,l)=>a+(l.games||[]).length,0);
  app.innerHTML=`
  <div class="hero">
    <div>
      <h2>${esc(D.title)}</h2>
      <p>${esc(D.intro||'رحلة تفاعلية عبر كل درس: نشاط قبلي، عرض بصري متحرك، ألعاب تعليمية متنوعة، ونشاط ختامي مع تقييم فوري ودعم صوتي.')}</p>
      <div class="stats">
        <span class="stat">📚 ${ARN(D.units.length)} وحدات</span>
        <span class="stat">📖 ${ARN(ls.length)} درسًا</span>
        <span class="stat">🎮 ${ARN(games)} لعبة</span>
        <span class="stat">✅ ${ARN(done)} درس مكتمل</span>
      </div>
      <div class="row" style="margin-top:14px">
        <button class="btn" id="startBtn">🚀 ابدأ التعلّم</button>
        <button class="btn ghost" id="resetBtn">↺ إعادة ضبط التقدّم</button>
      </div>
    </div>
    <div class="art">${heroArt()}</div>
  </div>
  <div class="units">${D.units.map((u,ui)=>`
    <section class="unit ${ui===0?'open':''}" style="--u:${u.color};--ul:${u.light||hexA(u.color,.16)}" data-u="${u.id}">
      <div class="uh">
        <div class="ic">${u.icon}</div>
        <div><h3>${esc(u.title)}</h3><small>${esc(u.en||'')} · ${ARN(u.lessons.length)} دروس</small></div>
        <span class="n">${ARN(Math.round(100*u.lessons.reduce((a,l)=>a+lessonPct(l),0)/(u.lessons.length*4)))}%</span>
        <span class="chev">⌄</span>
      </div>
      <div class="lessons">${u.lessons.map((l,li)=>{const s=LS(l.id);return `
        <div class="les ${l.ws?'ws':''}" data-l="${l.id}">
          ${l.ws?`<span class="tag">${esc(l.num||'ورقة عمل')}</span>`:''}
          <div class="num">${l.ws?'📄':esc(l.num||ARN(li+1))}</div>
          <h4>${esc(l.title)}</h4>
          ${l.en?`<div class="en">${esc(l.en)}</div>`:''}
          <div class="dots" title="قبلي · عرض · ألعاب · ختامي"><i class="${s.pre?'on':''}"></i><i class="${s.slidesDone?'on':''}"></i><i class="${Object.keys(s.games).length?'on':''}"></i><i class="${s.post!=null?'on':''}"></i></div>
        </div>`;}).join('')}</div>
    </section>`).join('')}
  </div>`;
  $$('.unit .uh').forEach(h=>h.onclick=()=>{h.parentElement.classList.toggle('open');SFX.click();});

  $('#resetBtn').onclick=()=>{ if(confirm('هل تريد إعادة ضبط كل التقدّم المحفوظ؟')){ S.lessons={}; save(); renderHome(); updateProg(); toast('تمت إعادة الضبط'); } };
  updateProg();
}
function heroArt(){
  return `<svg viewBox="0 0 300 200" xmlns="http://www.w3.org/2000/svg">
  <defs><linearGradient id="hg1" x1="0" x2="1"><stop offset="0" stop-color="#0f9d8a"/><stop offset="1" stop-color="#5ee0c7"/></linearGradient></defs>
  <g class="sv-wob"><circle cx="150" cy="100" r="78" fill="#e6f7f3"/><circle cx="150" cy="100" r="60" fill="none" stroke="url(#hg1)" stroke-width="6" stroke-dasharray="20 10" class="sv-spin" style="animation-duration:20s"/></g>
  <g transform="translate(110,60)">

let CUR=null, STEP=0, TIMERS=[];
function clearTimers(){ TIMERS.forEach(t=>{clearInterval(t);clearTimeout(t);}); TIMERS=[]; stopSpeak(); }
function openLesson(id, step){
  clearTimers();
  const l=allLessons().find(x=>x.id===id); if(!l)return; CUR=l; theme(l.unit); window.scrollTo(0,0);
  const s=LS(id);
  STEP = step!=null?step: (!s.pre?0 : !s.slidesDone?1 : !Object.keys(s.games).length?2 : 3);
  app.innerHTML=`
  <div class="lhead">
    <button class="back" id="backBtn">🏠 الرئيسية</button>
    <h2>${esc(l.title)}<span>${esc(l.unit.title)}${l.en?' · '+esc(l.en):''}</span></h2>
    <div class="row"><button class="back" id="prevL">◀ السابق</button><button class="back" id="nextL">التالي ▶</button></div>
  </div>
  <div class="stepper">
    ${[['🎯','نشاط قبلي'],['📽️','العرض التفاعلي'],['🎮','الألعاب'],['🏁','نشاط ختامي']].map((x,i)=>`<div class="step ${i===STEP?'on':''} ${stepDone(l,i)?'done':''}" data-s="${i}"><span class="ic">${x[0]}</span>${x[1]}</div>`).join('')}
  </div>
  <div class="panel" id="panel"></div>`;
  $('#backBtn').onclick=()=>{clearTimers();renderHome();};
  const ls=allLessons(); const idx=ls.findIndex(x=>x.id===id);
  $('#prevL').disabled=idx===0; $('#nextL').disabled=idx===ls.length-1;
  $('#prevL').onclick=()=>openLesson(ls[idx-1].id,0); $('#nextL').onclick=()=>openLesson(ls[idx+1].id,0);
  $$('.step').forEach(e=>e.onclick=()=>{STEP=+e.dataset.s;renderStep();});
  renderStep();
}
function stepDone(l,i){ const s=LS(l.id); return [s.pre,s.slidesDone,Object.keys(s.games).length>0,s.post!=null][i]; }
function refreshStepper(){ $$('.step').forEach((e,i)=>{e.classList.toggle('on',i===STEP);e.classList.toggle('done',stepDone(CUR,i));}); updateProg(); }
function renderStep(){ clearTimers(); refreshStepper(); const p=$('#panel'); p.style.animation='none'; p.offsetHeight; p.style.animation='pop .35s'; [renderPre,renderSlides,renderGames,renderPost][STEP](); }
function nextStepBtn(label){ return `<div class="row" style="margin-top:16px;justify-content:flex-end"><button class="btn" id="nextStep">${label||'التالي'} ▶</button></div>`; }
function bindNext(){ const b=$('#nextStep'); if(b)b.onclick=()=>{ if(STEP<3){STEP++;renderStep();} else { const ls=allLessons(); const i=ls.findIndex(x=>x.id===CUR.id); if(i<ls.length-1)openLesson(ls[i+1].id,0); else renderHome(); } }; }

/* ---------- activity items (pre/post) ---------- */
function renderItems(items, container, onAllDone){
  let done=0, correct=0, total=items.filter(i=>i.t!=='open').length;
  container.innerHTML=items.map((it,i)=>itemHTML(it,i)).join('');
  items.forEach((it,i)=>{
    const el=container.children[i];
    const finish=(ok)=>{ done++; if(ok)correct++; if(done===items.length&&onAllDone)onAllDone(correct,total); };
    if(it.t==='tf'){ $$('.opt',el).forEach(o=>o.onclick=(ev)=>{ const v=o.dataset.v==='1'; const ok=v===!!it.a; $$('.opt',el).forEach(x=>x.classList.add('dis')); o.classList.add(ok?'ok':'bad'); if(!ok)$$('.opt',el).find(x=>(x.dataset.v==='1')===!!it.a).classList.add('ok'); ok?goodAt(ev):badAt(ev); el.insertAdjacentHTML('beforeend',`<div class="why ${ok?'ok':'bad'}">${ok?'✅ صحيح! ':'❌ '}${esc(it.why||'')}</div>`); finish(ok); }); }
    else if(it.t==='mcq'||it.t==='visual'){ $$('.opt',el).forEach(o=>o.onclick=(ev)=>{ const k=+o.dataset.k; const ok=k===it.a; $$('.opt',el).forEach(x=>x.classList.add('dis')); o.classList.add(ok?'ok':'bad'); if(!ok)$$('.opt',el)[it.a].classList.add('ok'); ok?goodAt(ev):badAt(ev); el.insertAdjacentHTML('beforeend',`<div class="why ${ok?'ok':'bad'}">${ok?'✅ أحسنت! ':'❌ الإجابة الصحيحة: <b>'+esc(it.opts[it.a])+'</b>. '}${esc(it.why||'')}</div>`); finish(ok); }); }
    else if(it.t==='cloud'){ const words=$$('.cw',el); const chk=$('.chk',el); words.forEach(w=>w.onclick=()=>{w.classList.toggle('sel');SFX.click();}); chk.onclick=()=>{ let ok=true; words.forEach(w=>{ const good=w.dataset.ok==='1', sel=w.classList.contains('sel'); w.classList.remove('sel'); if(good&&sel)w.classList.add('ok'); else if(!good&&sel){w.classList.add('bad');ok=false;} else if(good&&!sel){w.classList.add('miss');ok=false;} w.style.pointerEvents='none'; }); chk.disabled=true; ok?SFX.ok():SFX.bad(); el.insertAdjacentHTML('beforeend',`<div class="why ${ok?'ok':'bad'}">${ok?'✅ اختيار موفق! ':'الكلمات الخضراء صحيحة، الصفراء فاتتك، والحمراء لا علاقة لها. '}${esc(it.why||'')}</div>`); finish(ok); }; }
    else if(it.t==='open'){ const ta=$('textarea',el); const k=CUR.id+'_open_'+STEP+'_'+i; ta.value=(S.open||{})[k]||''; ta.oninput=()=>{ S.open=S.open||{}; S.open[k]=ta.value; save(); $('.saved',el).textContent=ta.value?'✓ محفوظ':''; }; if(ta.value)$('.saved',el).textContent='✓ محفوظ'; done++; }
  });
}
function itemHTML(it,i){

function renderSlides(){

/* ---------- VISUALS ---------- */
function renderVis(v){
  if(!v) return '<div style="font-size:80px;opacity:.4">🧬</div>';
  if(typeof v==='string'){ return PRESETS[v]?wrapSVG(PRESETS[v]({})): `<div style="font-size:90px">${v}</div>`; }
  try{
    switch(v.kind){
      case 'preset': return PRESETS[v.name]?wrapSVG(PRESETS[v.name](v.opts||{})):`<div style="font-size:60px">🧪<br><small style="font-size:14px">${esc(v.name)}</small></div>`;
      case 'svg': return v.code;
      case 'emoji': return `<div style="text-align:center"><div style="font-size:${v.size||110}px;line-height:1.1;animation:pop .5s">${v.icon}</div>${v.label?`<div style="font-weight:800;font-size:18px;color:var(--u)">${esc(v.label)}</div>`:''}</div>`;
      case 'flow': return `<div class="gv flow">${v.steps.map((s,i)=>`${i?'<span class="fa">←</span>':''}<div class="fn" style="animation-delay:${i*.12}s">${s.icon?`<span class="fi">${s.icon}</span>`:''}${esc(s.t||s)}</div>`).join('')}</div>`;
      case 'compare': return `<div class="gv cmp">${v.cols.map(c=>`<div class="c">${c.icon?`<div class="ci">${c.icon}</div>`:''}<h4>${esc(c.title)}</h4><ul>${c.items.map(x=>`<li>${md(x)}</li>`).join('')}</ul></div>`).join('')}</div>`;
      case 'cards': return `<div class="gv cards">${v.items.map((c,i)=>`<div class="cd" style="animation-delay:${i*.08}s"><div class="ci">${c.icon||'•'}</div><h5>${esc(c.title)}</h5>${c.text?`<p>${esc(c.text)}</p>`:''}</div>`).join('')}</div>`;
      case 'table': return `<div class="gv"><table class="tbl"><thead><tr>${v.head.map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${v.rows.map(r=>`<tr>${r.map(c=>`<td>${md(String(c))}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
      case 'cycle': { const n=v.steps.length; return `<div class="gv cycle">${v.center?`<div class="ctr">${v.center}</div>`:''}${v.steps.map((s,i)=>{const a=-Math.PI/2+i*2*Math.PI/n; const x=50+40*Math.cos(a), y=50+40*Math.sin(a); return `<div class="cn" style="left:${x}%;top:${y}%">${s.icon?`<span class="ci">${s.icon}</span>`:''}${esc(s.t||s)}</div>`;}).join('')}</div>`; }
      case 'steps': return `<div class="gv stepsv">${v.steps.map((s,i)=>`<div class="sv" style="animation-delay:${i*.1}s"><span class="n">${ARN(i+1)}</span>${s.icon?`<span class="si">${s.icon}</span>`:''}<p>${md(s.t||s)}</p></div>`).join('')}</div>`;
      case 'bars': { const mx=Math.max(...v.items.map(b=>b.v)); return `<div class="gv"><div class="bars">${v.items.map(b=>`<div class="b"><b>${esc(b.label||b.v)}</b><i style="height:${Math.max(4,100*b.v/mx)}%;${b.color?'background:'+b.color:''}"></i><span>${esc(b.t)}</span></div>`).join('')}</div>${v.cap?`<div style="text-align:center;font-size:13px;color:var(--muted);font-weight:700">${esc(v.cap)}</div>`:''}</div>`; }
      case 'labels': { const svg=PRESETS[v.name]?PRESETS[v.name](v.opts||{}):''; return wrapSVG(svg)+`<div class="cards" style="margin-top:8px">${(v.items||[]).map(x=>`<div class="cd" style="padding:6px"><h5>${esc(x)}</h5></div>`).join('')}</div>`; }
    }
  }catch(e){ console.error(e); }
  return '<div style="font-size:80px;opacity:.4">🧬</div>';
}
function wrapSVG(s){ return `<div style="width:100%">${s}</div>`; }

function finishGame(g,i,score,total,extraHTML){
  clearTimers(); const pct=total?Math.round(100*score/total):100; const st=LS(CUR.id); const key=g.id||i; st.games[key]=Math.max(st.games[key]||0,pct); save(); refreshStepper();

function startTimer(sec,onTick,onEnd){ let t=sec; const el=$('#gtimer'), bar=$('#tbarI'); const upd=()=>{ if(el){el.textContent=ARN(t)+' ث';el.classList.toggle('low',t<=5);} if(bar)bar.style.width=(100*t/sec)+'%'; }; upd(); const id=setInterval(()=>{ t--; upd(); if(t<=5&&t>0)SFX.tick(); if(onTick)onTick(t); if(t<=0){clearInterval(id);onEnd();} },1000); TIMERS.push(id); return ()=>{clearInterval(id);}; }
function playGame(g,i){
  clearTimers();
  const f={match:gMatch,sort:gSort,order:gOrder,quiz:gQuiz,blanks:gBlanks,memory:gMemory,label:gLabel,tf:gTF,scramble:gScramble,hunt:gHunt,wheel:gWheel,secret:gSecret}[g.type];

}
