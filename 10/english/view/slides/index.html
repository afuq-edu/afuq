heck."}, {"q": "6 Renewable energy is better for the environment.", "a": "Predict: T/F? 🎧 Check."}], "icon": "🎧"}, {"type": "quiz", "title": "Complete the sentences", "icon": "✏️", "qs": [{"q": "Oil, coal and natural gas will ___ one day.", "o": ["run out", "run in", "grow"], "a": 0}, {"q": "Energy from the sun is ___ power.", "o": ["solar", "wind", "nuclear"], "a": 0}, {"q": "Energy from moving water is ___ .", "o": ["hydropower", "biofuel", "coal"], "a": 0}, {"q": "Heat from inside the Earth gives ___ power.", "o": ["geothermal", "solar", "wind"], "a": 0}, {"q": "Wind and the sun are ___ sources.", "o": ["renewable", "non-renewable"], "a": 0}]}, {"type": "ask", "title": "Discuss with a partner", "qs": [{"q": "1 What is the difference between renewable and non-renewable energy?", "a": "Renewable energy comes from sources that never run out, like the sun and wind. Non-renewable energy comes from sources that will run out, like oil and coal."}, {"q": "2 Do you think renewable energy is important? Why? Why not?", "a": "Yes, I think it is important because it is better for the environment and oil and gas will run out one day."}, {"q": "Which renewable source is best for Oman?", "a": "Solar power, because Oman has a lot of sunshine all year."}], "img": "L15_c4", "icon": "👥"}, {"type": "wheel", "title": "Energy wheel", "items": [{"q": "Name two non-renewable sources.", "a": "Oil and natural gas."}, {"q": "Which renewable source works at night?", "a": "Wind or water (hydropower)."}, {"q": "Why is the sun a good source for Oman?", "a": "Because it is sunny almost every day."}, {"q": "What is biomass?", "a": "Organic mass from plants and animals."}, {"q": "What will happen when oil runs out?", "a": "We will need other sources of energy."}, {"q": "How can your school use renewable energy?", "a": "It can put solar panels on the roof."}], "icon": "🎡"}, {"type": "race", "title": "Team race", "qs": [{"q": "Which is renewable?", "options": ["wind", "coal", "oil"], "a": 0}, {"q": "Which is non-renewable?", "options": ["the sun", "natural gas", "water"], "a": 1}, {"q": "‘run out’ means …", "options": ["be used up", "go outside"], "a": 0}, {"q": "Energy from moving water:", "options": ["hydropower", "geothermal"], "a": 0}, {"q": "Nuclear power is …", "options": ["renewable", "non-renewable"], "a": 1}, {"q": "Biofuel comes from …", "options": ["plants and animals", "rocks"], "a": 0}], "icon": "🏎️"}, {"type": "steps", "title": "Let's remember!", "icon": "🧠", "steps": ["Renewable: the sun, wind, water, geothermal heat, biomass – they never run out.", "Non-renewable: oil, coal, natural gas, nuclear power – they will run out.", "Solar power, wind power, hydropower, geothermal power, biofuel."]}, {"type": "exit", "title": "Exit ticket", "items": [{"k": "3", "text": "Name three renewable sources of energy."}, {"k": "2", "text": "What does ‘run out’ mean?"}, {"k": "1", "text": "Is renewable energy important? Why?"}], "icon": "🎟️"}, {"type": "homework", "title": "Homework", "head": "My homework", "items": ["Copy the Act. 1 table (renewable / non-renewable) into your exercise book.", "Write the meanings of the bold words in CB p. 25 Act. 2.", "Write 4 sentences: Why is renewable energy important for Oman?"], "icon": "🏠"}]}, {"id": "L16", "unit": "U3", "unitName": "Unit 3 · Renewable Energy", "title": "Reading and Understanding · Emails between Luke and Bill", "code": "", "theme": "library", "emo": "📧", "slides": [{"type": "cover", "say": "Reading and Understanding · Emails and an infographic"}, {"type": "goals", "title": "Today's goals", "items": ["I can understand the purpose of an email.", "I can find details in two emails."], "icon": "🎯"}, {"type": "goals", "title": "Today's goals", "items": ["I can understand facts about types of renewable energy.", "I can think critically and suggest solutions."], "icon": "🎯"}, {"type": "riddle", "title": "Which energy am I?", "items": [{"clues": ["I am moving air.", "I turn big turbines.", "You can find me on wind farms."], "a": "wind power", "emo": "🌬️"}, {"clues": ["I come from the sky.", "Panels collect my heat.", "Oman has a lot of me."], "a": "solar energy", "emo": "☀️"}, {"clues": ["I am water.", "I pass through dams.", "I turn turbines too."], "a": "hydropower", "emo": "💧"}, {"clues": ["I am natural heat and steam.", "I live in the ground.", "I can generate electricity."], "a": "geothermal energy", "emo": "🌋"}], "icon": "🤔"}, {"type": "ask", "title": "Shopping problems", "qs": [{"q": "Do you help your family with the shopping?", "a": "Yes, I push the trolley in the supermarket."}, {"q": "What is difficult about pushing a shopping trolley?", "a": "It gets very heavy when it is full."}, {"q": "Can you think of an invention to make shopping easier?", "a": "A trolley that moves by itself!"}], "icon": "🛒"}, {"type": "read", "title": "Luke's email", "paras": ["To: bill.hope@hotmail.com · Subject: Request for help", "Hi Bill", "How are you? I hope you are well. I’m emailing to ask if you can help with a school project. I have to design an [[invention]] that is powered by a renewable energy source."], "img": "L16_c1", "icon": "📧"}, {"type": "read", "title": "Luke's email", "paras": ["My idea is an automatic shopping trolley. When we go shopping, my father always asks me to push the trolley. But it gets really heavy and I find it difficult to push. So I want to design a trolley that can move by itself. The trolley will be powered by the lights in the mall. It will have a small panel which will convert light from the mall into [[electricity]]."], "img": "L16_c1", "icon": "📧"}, {"type": "read", "title": "Luke's email", "paras": ["I know that you know a lot about renewable energy, so I want to ask what you think about my idea. Any suggestions you have would be great!", "Thanks, Luke"], "img": "L16_c1", "icon": "📧"}, {"type": "read", "title": "Bill's reply", "paras": ["To: luke2005@gmail.com · Subject: RE: Request for help", "Hello there Luke,", "Thanks for your email. I’d love to help you with your project. Your idea sounds great! I have the same problem when I go shopping and I always wish someone would come up with an idea to make shopping easier."], "img": "L16_c2", "icon": "📧"}, {"type": "read", "title": "Bill's reply", "paras": ["I think that there are a couple of things you need to consider. Firstly, is it possible to [[convert]] energy from electric lights into electricity? Are the lights in a shopping mall a [[renewable source]] of energy? Secondly, is there a more suitable source of renewable energy you could use [[to power]] the trolley?"], "img": "L16_c2", "icon": "📧"}, {"type": "read", "title": "Bill's reply", "paras": ["I have attached some information about renewable energy for you to take a look at. Hopefully this will help you with your project.", "Take care, Bill · Attachment: Types of Renewable Energy"], "img": "L16_c2", "icon": "📧"}, {"type": "quiz", "title": "Read and answer", "qs": [{"q": "1 What is the purpose of Luke’s email to Bill?", "o": ["to ask for help with a school project", "to invite Bill to the mall", "to complain about a trolley"], "a": 0}, {"q": "2 What does Bill attach to his email?", "o": ["a photo of a trolley", "information about types of renewable energy", "a shopping list"], "a": 1}], "icon": "✅"}, {"type": "ask", "title": "Read and answer", "qs": [{"q": "1 What does Luke have to do for his school project?", "a": "He has to design an invention that is powered by a renewable energy source."}, {"q": "2 What problem does Luke face when he goes shopping?", "a": "His father asks him to push the trolley, but it gets really heavy and difficult to push."}, {"q": "3 What does Luke want to invent?", "a": "An automatic shopping trolley that can move by itself, powered by the lights in the mall."}], "icon": "💡"}, {"type": "ask", "title": "Read and answer", "qs": [{"q": "4 Why does Luke ask Bill for help?", "a": "Because Bill knows a lot about renewable energy."}, {"q": "5 What does Bill think about Luke‘s idea?", "a": "He thinks it sounds great, but Luke needs to consider a couple of things."}, {"q": "6 What kind of information is included in the attachment?", "a": "Types of renewable energy: wind power, geothermal energy, biofuel, solar energy and hydropower."}], "icon": "💡"}, {"type": "read", "title": "Types of Renewable Energy", "paras": ["🌬️ Wind Power – The wind can be used to power wind [[turbines]] on wind farms which [[generate]] electricity.", "🌋 Geothermal Energy – Natural heat and steam in the ground can be used to generate electricity.", "🌽 Biofuel – Organic mass from plants and animals can be burned to create electricity or used to power vehicles."], "img": "L16_c3", "icon": "📎"}, {"type": "read", "title": "Types of Renewable Energy", "paras": ["☀️ Solar Energy – Heat from the sun can be collected using [[solar panels]] and converted into electricity.", "💧 Hydropower – Hydropower plants use turbines which are turned by water passing through dams or from waves in the ocean to generate electricity."], "img": "L16_c3", "icon": "📎"}, {"type": "match", "title": "Which energy?", "pairs": [["Wind Power", "turbines on wind farms"], ["Geothermal Energy", "natural heat and steam in the ground"], ["Biofuel", "organic mass from plants and animals"], ["Solar Energy", "heat from the sun collected by panels"], ["Hydropower", "water passing through dams or ocean waves"]], "icon": "🧩"}, {"type": "quiz", "title": "Renewable Energy Facts", "icon": "✏️", "qs": [{"q": "1 ___ of energy include solar, wind and hydropower.", "o": ["Renewable sources", "Inventions", "Turbines"], "a": 0}, {"q": "2 Energy from renewable sources can be used to ___ electricity.", "o": ["generate", "invention", "solar panels"], "a": 0}, {"q": "3 ___ are used on wind farms and hydropower plants.", "o": ["Turbines", "Solar panels", "Electricity"], "a": 0}, {"q": "4 ___ are used to convert heat from the sun into electricity.", "o": ["Solar panels", "Turbines", "Inventions"], "a": 0}, {"q": "5 Natural heat from the earth or geothermal energy can also be used to generate ___ .", "o": ["electricity", "invention", "convert"], "a": 0}, {"q": "6 Electricity generated from renewable sources can be used ___ our homes, schools, offices and even whole cities.", "o": ["to power", "generate", "convert"], "a": 0}]}, {"type": "explain", "title": "Think critically", "lines": ["Try to think critically and creatively when you evaluate ideas and suggest solutions to problems.", "Ask: Is it possible? Is it really renewable? Is there a better way?"], "rule": "Evaluate → suggest a better solution", "icon": "🧠"}, {"type": "flip", "title": "Think critically 🧠 – examples", "cards": [{"front": "Mall lights use electricity → [[not a renewable source]] 🤔", "icon": "💡", "back": "evaluate"}, {"front": "The sun outside the mall → [[solar panels]] on the trolley or the car park ☀️", "icon": "✨", "back": "suggest"}]}, {"type": "ask", "title": "Answer Bill's questions", "qs": [{"q": "1 Is it possible to convert energy from electric lights into electricity? Why? Why not?", "a": "A small panel can change some light into electricity, but it is very little energy – and the lights already use electricity, so we do not gain energy."}, {"q": "2 Are the lights in a shopping mall a renewable source of energy? Why? Why not?", "a": "No. The lights are powered by electricity, which often comes from burning fossil fuels. They are not a natural source like the sun or wind."}, {"q": "3 Is there a more suitable source of renewable energy that could be used to power the trolley?", "a": "Yes – solar energy: the trolley could charge a battery with solar panels in the car park, then move by itself inside the mall."}], "icon": "💬"}, {"type": "tf", "title": "True or false?", "items": [{"text": "Luke’s mother asks him to push the trolley.", "a": false, "fix": "His father always asks him to push the trolley."}, {"text": "Bill has the same problem when he goes shopping.", "a": true, "fix": "I have the same problem when I go shopping."}, {"text": "Luke’s trolley will have a small panel.", "a": true, "fix": "It will have a small panel which will convert light from the mall into electricity."}, {"text": "Bill ends his email with ‘Kind regards’.", "a": false, "fix": "He ends with ‘Take care, Bill’ – an informal ending."}], "icon": "✔✘"}, {"type": "race", "title": "Team race", "qs": [{"q": "Luke wants to invent an automatic …", "options": ["shopping trolley", "bicycle", "phone"], "a": 0}, {"q": "Luke's trolley will be powered by …", "options": ["the lights in the mall", "the wind", "petrol"], "a": 0}, {"q": "Turbines are used on wind farms and …", "options": ["hydropower plants", "solar panels"], "a": 0}, {"q": "‘convert’ means …", "options": ["change into", "keep"], "a": 0}, {"q": "Biofuel is organic mass from …", "options": ["plants and animals", "the sun"], "a": 0}, {"q": "Bill's email ends with …", "options": ["Take care", "Kind regards"], "a": 0}], "icon": "🏎️"}, {"type": "steps", "title": "Let's remember!", "icon": "🧠", "steps": ["Luke asks Bill for help: an automatic shopping trolley powered by renewable energy.", "Bill: Are mall lights really a renewable source? Is there a better source?", "Five types: wind, geothermal, biofuel, solar, hydropower.", "Key words: generate, convert, turbines, solar panels, to power."]}, {"type": "exit", "title": "Exit ticket", "items": [{"k": "3", "text": "What is the purpose of Luke’s email?"}, {"k": "2", "text": "Why are mall lights not a renewable source?"}, {"k": "1", "text": "Suggest a better energy source for the trolley."}], "icon": "🎟️"}, {"type": "homework", "title": "Homework", "head": "My homework", "items": ["Write the answers to CB p. 27 Act. 2 in your exercise book.", "Imagine you are Luke: write a short reply to Bill (4–5 sentences) with your new idea.", "Learn the words: generate, convert, turbines, solar panels, to power."], "icon": "🏠"}]}, {"id": "L17", "unit": "U3", "unitName": "Unit 3 · Renewable Energy", "title": "Grammar: Conjunctions & Adjectives", "code": "", "theme": "library", "emo": "🔗", "slides": [{"type": "cover"}, {"type": "goals", "title": "Today's goals", "items": ["I can understand facts about eco-friendly stadiums.", "I can use conjunctions to add, contrast and give reasons and results."], "icon": "🎯"}, {"type": "goals", "title": "Today's goals", "items": ["I can form adjectives with -able, -ful, -ous, -ive, -al.", "I can find adjectives in a text."], "icon": "🎯"}, {"type": "enter", "title": "Catch the words that link ideas.", "gate": "✓", "items": [{"text": "moreover", "in": true}, {"text": "in addition", "in": true}, {"text": "but", "in": true}, {"text": "solar", "in": false}, {"text": "generate", "in": false}, {"text": "football", "in": false}]}, {"type": "read", "title": "The Greenest Football Stadiums in the World", "paras": ["1 ___ generates its own electricity because the roof of the stadium is covered in solar panels. The stadium also supplies electricity to 1,000 homes per year.", "2 The ___ only uses renewable energy so it has reduced its carbon footprint by 20,000 tonnes. That is the same as flying an airplane around the Earth 500 times."], "img": "L17_c1", "icon": "📖"}, {"type": "read", "title": "The Greenest Football Stadiums in the World", "paras": ["3 The ___ is one of the most eco-friendly stadiums in the world. There are 4,200 solar panels on its roof and the stadium is cooled using water from a nearby lake. In addition, its seats are 100% renewable as they are made from sugarcane instead of plastic."], "img": "L17_c1", "icon": "📖"}, {"type": "read", "title": "The Greenest Football Stadiums in the World", "paras": ["4 Football pitches are usually made of grass and designed to play football on. However, there are 200 [[kinetic tiles]] under the pitch at the ___ stadium. These tiles turn the players’ movements into energy to power the stadium lights."], "img": "L17_c1", "icon": "📖"}, {"type": "quiz", "title": "Stadium facts", "qs": [{"q": "Stadium 1 supplies electricity to … homes per year.", "o": ["1,000", "4,200", "200"], "a": 0}, {"q": "Stadium 2 has reduced its carbon footprint by …", "o": ["20,000 tonnes", "500 tonnes", "1,000 tonnes"], "a": 0}, {"q": "Stadium 3 is cooled using …", "o": ["water from a nearby lake", "air conditioners", "ice"], "a": 0}, {"q": "Stadium 3's seats are made from …", "o": ["sugarcane", "plastic", "wood"], "a": 0}, {"q": "Stadium 4's tiles turn players’ movements into …", "o": ["energy", "water", "grass"], "a": 0}], "img": "L17_c1", "icon": "✅"}, {"type": "explain", "title": "Conjunctions that add information", "lines": ["Conjunctions are linking words that join clauses and sentences. They help make writing clear and cohesive.", "Add information: moreover, in addition, also"], "img": "L17_c2", "rule": "also: before a main verb (I also play) · after can / be (I can also speak, I am also studying)", "icon": "➕"}, {"type": "flip", "title": "Conjunctions that add information ➕ – examples", "cards": [{"front": "Renewable energy is good for the environment. [[Moreover]] it will not run out.", "icon": "💡", "back": "➕"}, {"front": "Learning English is fun. [[In addition]], it will help me in my future career.", "icon": "✨", "back": "➕"}, {"front": "In my free time, I like taking photographs. I [[also]] like watching films.", "icon": "🔎", "back": "➕"}]}, {"type": "explain", "title": "Contrast & reasons / results", "lines": ["Contrast two different ideas: however, on the other hand, but", "Reasons/causes and results: because, so, therefore"], "img": "L17_c2", "rule": "because + reason · so / therefore + result", "icon": "⚖️"}, {"type": "flip", "title": "Contrast & reasons / results ⚖️ – examples", "cards": [{"front": "Solar power has a lot of potential. [[On the other hand]], solar panels are quite expensive.", "icon": "💡", "back": "↔️"}, {"front": "Some video games contain violent content. [[However]], not all video games are bad.", "icon": "✨", "back": "↔️"}, {"front": "I ate a snack [[because]] I was hungry. / I was hungry [[so]] I ate a snack.", "icon": "🔎", "back": "because = reason · so = result"}, {"front": "I am doing a project about renewable energy. [[Therefore]], I would like to visit your company.", "icon": "📌", "back": "therefore = for this reason"}]}, {"type": "sort", "title": "Sort the conjunctions", "bins": [{"label": "Add information", "icon": "➕"}, {"label": "Contrast", "icon": "↔️"}, {"label": "Reason / result", "icon": "➡️"}], "cards": [{"text": "moreover", "icon": "", "bin": 0}, {"text": "in addition", "icon": "", "bin": 0}, {"text": "also", "icon": "", "bin": 0}, {"text": "however", "icon": "", "bin": 1}, {"text": "on the other hand", "icon": "", "bin": 1}, {"text": "but", "icon": "", "bin": 1}, {"text": "because", "icon": "", "bin": 2}, {"text": "so", "icon": "", "bin": 2}, {"text": "therefore", "icon": "", "bin": 2}], "icon": "🗂️"}, {"type": "quiz", "title": "Choose the conjunction", "icon": "✏️", "qs": [{"q": "The stadium generates its own electricity ___ the roof is covered in solar panels.", "o": ["because", "however", "moreover"], "a": 0}, {"q": "It only uses renewable energy, ___ it has reduced its carbon footprint.", "o": ["so", "because", "but"], "a": 0}, {"q": "There are 4,200 solar panels on its roof. ___ , its seats are made from sugarcane.", "o": ["In addition", "However", "Because"], "a": 0}, {"q": "Pitches are usually made of grass. ___ , there are 200 kinetic tiles under this pitch.", "o": ["However", "Therefore", "Moreover"], "a": 0}, {"q": "Solar energy is clean. ___ , solar panels are quite expensive.", "o": ["On the other hand", "In addition", "So"], "a": 0}, {"q": "Oman has lots of sunshine. ___ , solar power is a good choice.", "o": ["Therefore", "But", "However"], "a": 0}]}, {"type": "build", "title": "Where does ‘also’ go?", "mode": "words", "items": [{"a": "I play the piano. I also play the guitar.", "hint": "I play the piano. / I / also / play the guitar.", "emo": "🎸"}, {"a": "I can speak French. I can also speak Spanish  Renewable Energy", "title": "Writing · A request email", "code": "", "theme": "library", "emo": "✉️", "slides": [{"type": "cover", "say": "Writing · A formal request email"}, {"type": "goals", "title": "Today's goals", "items": ["I can identify the purpose of an email.", "I can understand the structure of a formal request email."], "icon": "🎯"}, {"type": "goals", "title": "Today's goals", "items": ["I can recognise formal and informal language.", "I can write a polite request email."], "icon": "🎯"}, {"type": "enter", "title": "Catch only the FORMAL phrases.", "gate": "✓", "items": [{"text": "Hi Bill", "in": false}, {"text": "Thanks,", "in": false}, {"text": "I hope that you are very well.", "in": true}, {"text": "I would like to …", "in": true}, {"text": "Kind regards,", "in": true}, {"text": "Hello there Luke,", "in": false}]}, {"type": "read", "title": "Visit request", "paras": ["To: s.brown@miraah.com · Subject: Visit request", "Dear Mr Brown,", "I hope that you are very well."], "img": "L19_c1", "icon": "📧"}, {"type": "read", "title": "Visit request", "paras": ["My name is Mazin. I am a third-year student at the Science and Technology College. I study Engineering and as part of our course this year, we have been learning about renewable energy. For our final [[assignment]], we have to research and write a report about a [[sustainable]] project in Oman."], "img": "L19_c1", "icon": "📧"}, {"type": "read", "title": "Visit request", "paras": ["My team would like to write a report about the Mir’aah project. Therefore, I am writing to [[request]] a visit to the Mir’aah site. We would like to learn about how the plant [[operates]] and the environmental benefits of using steam instead of gas to extract oil. In addition, it would also be helpful to speak to an engineer because we have some questions about how the plant was built. We would also like to take some photographs for our report."], "img": "L19_c1", "icon": "📧"}, {"type": "read", "title": "Visit request", "paras ed.»"}], "icon": "📚"}, {"type": "flip", "title": "Words in bold", "cards": [{"front": "leader", "icon": "👑", "back": "the person who leads a group or country\n«Greece had no one leader.»"}, {"front": "archaeologists", "icon": "⛏️", "back": "people who study the past by digging up old objects\n«Archaeologists found old coins.»"}, {"front": "discovered", "icon": "🔍", "back": "found for the first time\n«Treasures were discovered in the pyramids.»"}], "icon": "📚"}, {"type": "quiz", "title": "Ancient Civilisation Facts", "qs": [{"q": "1 This civilisation conquered many lands; its citizens were 12% of the world population.", "o": ["Roman", "Majan", "Mayan"], "a": 0}, {"q": "2 This ancient kingdom was an important source of copper and famous for building ships.", "o": ["Greek", "Majan", "Egyptian"], "a": 1}, {"q": "3 Responsible for many important inventions. Art and culture also thrived.", "o": ["Sumerian", "Mayan", "Majan"], "a": 0}, {"q": "4 Great importance to knowledge; not one united country with one king or leader.", "o": ["Egyptian", "Greek", "Roman"], "a": 1}, {"q": "5 Archaeologists do not know why this civilisation in Central America collapsed.", "o": ["Mayan", "Sumerian", "Roman"], "a": 0}, {"q": "6 Treasures were discovered in the pyramids built during this time.", "o": ["Greek", "Egyptian", "Majan"], "a": 1}], "img": "L22_c2", "icon": "🔍"}, {"type": "quiz", "title": "Use the new words", "icon": "✏️", "qs": [{"q": "The Roman ___ conquered many lands.", "o": ["empire", "leader", "culture"], "a": 0}, {"q": "Majan was an ___ kingdom.", "o": ["ancient", "united", "modern"], "a": 0}, {"q": "___ do not know why the Mayan civilisation collapsed.", "o": ["Archaeologists", "Citizens", "Leaders"], "a": 0}, {"q": "Many treasures were ___ in the pyramids.", "o": ["discovered", "conquered", "thrived"], "a": 0}, {"q": "Art and ___ thrived in this civilisation.", "o": ["culture", "copper", "leader"], "a": 0}]}, {"type": "memory", "title": "Civilisation memory", "pairs": [["Egyptian", "🔺 pyramids"], ["Roman", "🏟️ the Colosseum"], ["Greek", "🏛️ the Parthenon"], ["Majan", "⛵ copper and ships"], ["Sumerian", "🧱 the ziggurat"], ["Mayan", "🛕 Central America"]], "icon": "🧠"}, {"type": "sort", "title": "Where were they?", "bins": [{"label": "Middle East & Africa", "icon": "🌍"}, {"label": "Europe", "icon": "🏛️"}, {"label": "the Americas", "icon": "🌎"}], "cards": [{"text": "Majan (Oman)", "icon": "", "bin": 0}, {"text": "Sumerian (Iraq)", "icon": "", "bin": 0}, {"text": "Egyptian", "icon": "", "bin": 0}, {"text": "Roman", "icon": "", "bin": 1}, {"text": "Greek", "icon": "", "bin": 1}, {"text": "Mayan", "icon": "", "bin": 2}], "icon": "🌍"}, {"type": "ask", "title": "Discuss", "qs": [{"q": "What else do you know about these ancient civilisations?", "a": "The Egyptians wrote with hieroglyphics. Majan exported copper from Oman. The Romans built roads."}, {"q": "Why is it important to study ancient civilisations?", "a": "Because we learn about our history and identity, and we can learn from their inventions and mistakes."}, {"q": "Which civilisation would you like to visit? Why?", "a": "I would like to visit Majan because it was in Oman and they were great sailors."}], "img": "L22_c1", "icon": "💬"}, {"type": "race", "title": "Team race", "qs": [{"q": "Majan was famous for copper and …", "options": ["ships", "pyramids", "the Colosseum"], "a": 0}, {"q": "The pyramids were built by the …", "options": ["Egyptians", "Mayans", "Greeks"], "a": 0}, {"q": "The Colosseum is …", "options": ["Roman", "Sumerian"], "a": 0}, {"q": "People who study the past by digging:", "options": ["archaeologists", "citizens"], "a": 0}, {"q": "‘ancient’ means …", "options": ["very old", "very new"], "a": 0}, {"q": "The Mayan civilisation was in …", "options": ["Central America", "Oman"], "a": 0}], "icon": "🏎️"}, {"type": "steps", "title": "Let's remember!", "icon": "🧠", "steps": ["Six civilisations: Mayan, Majan, Egyptian, Roman, Greek, Sumerian.", "Majan = an ancient kingdom in ociety]], we are very interested in sports and games. Last week, my father took us to the Colossuem. I was amazed at the size of the building which can seat 50,000 people. It was built using a new material called concrete. We watched gladiators fighting some big animals like lions and bears."], "img": "L23_c4", "icon": "📖"}, {"type": "read", "title": "1 Livia & 2 Mubarak", "paras": ["2 It is the year 950 BC. My name is Mubarak and my father is a trader. He also owns a copper mine. We live in Al Asil, in Sohar. The people here are very skilled at building ships. My father has a fleet of dhows and he sails to many places to [[trade]] copper. He navigates using the stars. Sometimes I sail with him and I have visited many beautiful places."], "img": "L23_c4", "icon": "📖"}, {"type": "read", "title": "3 Iskur & 4 Atet", "paras": ["3 It is 2100 BC and my name is Iskur. I am training to be a ‘Sangu’ which means accountant. I have to write information on clay tablets using a form of writing called ‘cuneiform’. My older brother is an architect. He helped build the Great Ziggurat at Ur. The ziggurat is a huge [[monument]] that was constructed using clay bricks. Some people think it is the tallest and most beautiful building in the world."], "img": "L23_c6", "icon": "📖"}, {"type": "read", "title": "3 Iskur & 4 Atet", "paras": ["4 It is 1500 BC and my name is Atet. [[Agriculture]] is the main industry in our [[economy]]. My family owns a lot of land which means we are wealthy. Because of this I was able to have an education. I learned how to read hieroglyphics. I will get married soon so I have to help my mother and learn how to run the household. Feasts are important in our culture. We often have big parties for our family and friends with lots of music and dancing."], "img": "L23_c6", "icon": "📖"}, {"type": "match", "title": "Who is from where?", "pairs": [["Livia 👧 (100 AD)", "The Roman Empire"], ["Mubarak 👦 (950 BC)", "The ancient kingdom of Majan"], ["Iskur 🧒 (2100 BC)", "Ancient Sumerian civilisation"], ["Atet 👩 (1500 BC)", "Ancient Egypt"]], "icon": "🧩"}, {"type": "ask", "title": "Read and answer", "qs": [{"q": "1 What jobs are mentioned in the texts?", "a": "trader, accountant (Sangu), architect – and gladiators."}, {"q": "2 Which teenagers talk about buildings?", "a": "Livia (the Colosseum) and Iskur (the Great Ziggurat at Ur)."}, {"q": "3 What are the two forms of writing mentioned?", "a": "Cuneiform and hieroglyphics."}, {"q": "4 Which teenager was born first?", "a": "Iskur (2100 BC)."}, {"q": "5 In which civilisation would you like to be a teenager? Why?", "a": "I would like to be a teenager in Majan because I could sail on a dhow and visit many places."}], "img": "L23_c7", "icon": "💡"}, {"type": "order", "title": "Who lived first?", "items": ["Iskur – 2100 BC", "Atet – 1500 BC", "Mubarak – 950 BC", "Livia – 100 AD"], "icon": "⏳"}, {"type": "quiz", "title": "Read and complete", "icon": "✏️", "qs": [{"q": "1 To ___ means to buy, sell or exchange goods and services.", "o": ["trade", "economy", "monument"], "a": 0}, {"q": "2 A ___ is a large group of people who live together in an organised way.", "o": ["society", "empire", "trade"], "a": 0}, {"q": "3 ___ means the work of farming.", "o": ["Agriculture", "Economy", "Society"], "a": 0}, {"q": "4 An ___ is a group of countries ruled by a single person, government or country.", "o": ["empire", "economy", "agriculture"], "a": 0}, {"q": "5 ___ means the system of trade and industry that generates wealth in a country.", "o": ["Economy", "Empire", "Monument"], "a": 0}, {"q": "6 A structure or building that is built to honour a special person or event is called a ___ .", "o": ["monument", "society", "trade"], "a": 0}]}, {"type": "tf", "title": "True or false?", "items": [{"text": "The Colosseum can seat 50,000 people.", "a": true, "fix": "… the building which can seat 50,000 people."}, {"text": "Mubarak lives in Muscat.", "a": false, "fix": "We live in Al Asil, in Sohar."}, {"text": "Mubarak's father navigates using the stars.", "a": true, "fix": "He navigates using the stars."}], "icon": "✔✘"}, {"type": "tf", "title": "True or false?", "items": [{"text": "The ziggurat was built with stones.", "a": false, "fix": "It was constructed using clay bricks."}, {"text": "Atet's family is poor.", "a": false, "fix": "My family owns a lot of land which means we are wealthy."}], "icon": "✔✘"}, {"type": "riddle", "title": "Role play: guess the civilisation", "items": [{"clues": ["We conquered many lands.", "At our largest, our citizens were 12% of the world population.", "We built a huge building for 50,000 people using concrete."], "a": "Roman", "emo": "🏟️"}, {"clues": ["My kingdom is famous for copper.", "We are very skilled at building ships.", "My father sails a fleet of dhows from Sohar."], "a": "Majan", "emo": "⛵"}, {"clues": ["We write on clay tablets.", "Our writing is called cuneiform.", "We built the Great Ziggurat at Ur."], "a": "Sumerian", "emo": "🧱"}], "icon": "🎭"}, {"type": "riddle", "title": "Role play: guess the civilisation", "items": [{"clues": ["Agriculture is the main industry in our economy.", "We read hieroglyphics.", "Treasures were discovered in our pyramids."], "a": "Egyptian", "emo": "🔺"}, {"clues": ["We gave great importance to knowledge.", "We were not one united country with one king.", "We had many important thinkers."], "a": "Greek", "emo": "🏛️"}, {"clues": ["We lived in Central America.", "We built step pyramids.", "Archaeologists do not know why our civilisation collapsed."], "a": "Mayan", "emo": "🛕"}], "icon": "🎭"}, {"type": "ask", "title": "Your role play card", "qs": [{"q": "Imagine you are a teenager from an ancient civilisation. Start like this:", "a": "It is the year … My name is … I live in …"}, {"q": "Talk about your family, your job or your education.", "a": "My father is a … / I am training to be a … / I learned how to …"}, {"q": "Talk about a building, writing, trade or culture.", "a": "We built … / We write … / We trade … / Feasts are important …"}, {"q": "Ask the group:", "a": "Which civilisation am I from? (Don't say its name!)"}], "img": "L23_c3", "icon": "✍️"}, {"type": "race", "title": "Team race", "qs": [{"q": "Iskur is training to be a …", "options": ["Sangu (accountant)", "trader", "sailor"], "a": 0}, {"q": "Mubarak's father trades …", "options": ["copper", "gold", "frankincense"], "a": 0}, {"q": "Atet learned to read …", "options": ["hieroglyphics", "cuneiform"], "a": 0}, {"q": "The Colosseum was built using …", "options": ["concrete", "clay bricks"], "a": 0}, {"q": "‘Agriculture’ means …", "options": ["the work of farming", "trade"], "a": 0}, {"q": "Who was born first?", "options": ["Iskur", "Livia"], "a": 0}], "icon": "🏎️"}, {"type": "steps", "title": "Let's remember!", "icon": "🧠", "steps": ["Livia – Roman · Mubarak – Majan (Sohar) · Iskur – Sumerian · Atet – Egyptian.", "Writing: cuneiform (Sumer) and hieroglyphics (Egypt).", "Words: trade, society, agriculture, empire, economy, monument."]}, {"type": "exit", "title": "Exit ticket", "items": [{"k": "3", "text": "Which teenager is from Oman? How do you know?"}, {"k": "2", "text": "What is a monument? Give an example in Oman."}, {"k": "1", "text": "Write two sentences as a teenager from Majan."}], "icon": "🎟️"}, {"type": "homework", "title": "Homework", "head": "My homework", "items": ["Write the six definitions from CB p. 39 Act. 4 in your vocabulary notebook.", "Write your own ‘voice from the past’ (60–80 words) about Majan.", "Find one more fact about Majan or Sohar copper."], "icon": "🏠"}]}, {"id": "L24", "unit": "U4", "unitName": "Unit 4 · Civilisation", "title": "Grammar: Past Passive & Adverbs of Degree", "code": "", "theme": "park", "emo": "🧱", "slides": [{"type": "cover"}, {"type": "goals", "title": "Today's goals", "items": ["I can understand when we use the passive.", "I can form the past passive: was/were + past participle (+ by)."], "icon": "🎯"}, {"type": "goals", "title": "Today's goals", "items": ["I can use adverbs of degree to make opinions stronger or weaker.", "I can sort opinions For and Against in a debate."], "icon": "🎯"}, {"type": "enter", "title": "Catch the past participles.", "gate": "✓", "items": [{"text": "build", "in": false}, {"text": "eaten", "in": true}, {"text": "invent", "in": false}, {"text": "invented", "in": true}, {"text": "buy", "in": false}, {"text": "bought", "in": true}]}, {"type": "ask", "title": "Listen and match", "qs": [{"q": "a Cuneiform was invented by the Sumerians.", "a": "A possible question: Who invented cuneiform? 🎧 Match with the recording."}, {"q": "b Because they were used as tombs for the Egyptian pharaohs", "a": "A possible question: Why were the pyramids built?"}, {"q": "c He was born in Sohar.", "a": "A possible question: Where was he born? 🎧 Listen to find out who."}, {"q": "d It was built in the 3rd century BC. · e The Lost City of Ubar was found by archaeologists. · f The Roman city of Pompei was destroyed.", "a": "🎧 Listen to the six questions and match."}, {"q": "2 What do you notice about the tense of the verbs in the answers?", "a": "They are in the past passive: was/were + past participle (was invented, were used, was built, was found, was destroyed)."}], "img": "L24_c1", "icon": "🎧"}, {"type": "explain", "title": "Active or passive?", "lines": ["We use an active verb when we want to say what the subject does.", "We use a passive verb when we want to say what happens to the object, want to emphasise the object of the sentence, or who or what causes the action is unknown or unimportant."], "img": "L24_c2", "rule": "object → subject of a passive sentence", "icon": "📌"}, {"type": "flip", "title": "Active or passive? 📌 – examples", "cards": [{"front": "[[People]] traded [[Frankincense]] in ancient times.", "icon": "💡", "back": "(active)"}, {"front": "[[Frankincense]] was traded in ancient times.", "icon": "✨", "back": "(passive)"}]}, {"type": "explain", "title": "was / were + past participle", "lines": ["The past passive is formed using was/were + past participle.", "If we want to say who or what causes an action to happen, we use by.", "Past participle: usually + -ed (invented, painted, destroyed); irregular: bought, eaten, sung."], "img": "L24_c2", "rule": "was/were + past participle (+ by …)", "icon": "📌"}, {"type": "flip", "title": "was / were + past participle 📌 – examples", "cards": [{"front": "The city [[was attacked]].", "icon": "💡", "back": "singular → was"}, {"front": "The Pyramids [[were built]] in Egypt.", "icon": "✨", "back": "plural → were"}, {"front": "Concrete [[was invented by]] the Romans.", "icon": "🔎", "back": "+ by"}, {"front": "The houses [[were destroyed by]] a flood.", "icon": "📌", "back": "+ by"}]}, {"type": "sort", "title": "was or were?", "bins": [{"label": "was + p.p.", "icon": ""}, {"label": "were + p.p.", "icon": ""}], "cards": [{"text": "Concrete … invented", "icon": "", "bin": 0}, {"text": "Cuneiform … invented", "icon": "", "bin": 0}, {"text": "The ziggurat … constructed", "icon": "", "bin": 0}, {"text": "Frankincense … traded", "icon": "", "bin": 0}, {"text": "The Pyramids … built", "icon": "", "bin": 1}, {"text": "The houses … destroyed", "icon": "", "bin": 1}, {"text": "Treasures … discovered", "icon": "", "bin": 1}, {"text": "Dhows … built in Sohar", "icon": "", "bin": 1}], "icon": "🗂️"}, {"type": "quiz", "title": "Make it passive", "icon": "✏️", "qs": [{"q": "The Colosseum ___ using concrete. (build)", "o": ["was built", "were built", "built"], "a": 0}, {"q": "Many treasures ___ in the pyramids. (discover)", "o": ["were discovered", "was discovered", "discovered"], "a": 0}, {"q": "Cuneiform ___ by the Sumerians. (invent)", "o": ["was invented", "were invented", "invented"], "a": 0}, {"q": "The Roman city of Pompei ___ . (destroy)", "o": ["was destroyed", "were destroyed", "destroyed"], "a": 0}, {"q": "Copper ___ from Majan to many places. (trade)", "o": ["was traded", "were traded", "traded"], "a": 0}, {"q": "The Great Ziggurat ___ with clay bricks. (construct)", "o": ["was constructed", "were constructed", "constructed"], "a": 0}]}, {"type": "build", "title": "Build passive sentences", "mode": "words", "items": [{"a": "Concrete was invented by the Romans.", "hint": "was invented / Concrete / by the Romans.", "emo": "🏟️"}, {"a": "The Pyramids were built in Egypt.", "hint": "were built / The Pyramids / in Egypt.", "emo": "🔺"}, {"a": "The Lost City of Ubar was found by archaeologists.", "hint": "was found / The Lost City of Ubar / by archaeologists.", "emo": "⛏️"}, {"a": "Frankincense was traded in ancient times.", "hint": "was traded / Frankincense / in ancient times.", "emo": "🌿"}], "icon": "🧱"}, {"type": "enter", "title": "Catch the past passive! (CB p. 38)", "gate": "✓", "items": [{"text": "It was built using a new material", "in": true}, {"text": "I learned how to read hieroglyphics", "in": false}, {"text": "a monument that was constructed of clay bricks", "in": true}, {"text": "He helped build the Great Ziggurat", "in": false}]}, {"type": "read", "title": "Inventions are more important than people", "paras": ["1 Some inventions like air conditioning are [[quite]] important because they keep people cool.", "2 Laws, morals and religion are [[absolutely]] essential to civilisation. The way people behave is more important than the inventions they create."], "img": "L24_c3", "icon": "🗣️"}, {"type": "read", "title": "Inventions are more important than people", "paras": ["3 Inventions are [[very]] important because they improve people’s lives. For example, because of smartphones we can stay connected to our family and friends wherever we are.", "4 People are [[definitely]] more important because they make inventions. There would be no inventions without people."], "img": "L24_c3", "icon": "🗣️"}, {"type": "read", "title": "Inventions are more important than people", "paras": ["5 Many civilisations invented things, so I suppose inventions are [[fairly]] important.", "6 I [[certainly]] think that inventions are more important than people, because inventions last forever.", "7 Some inventions are [[really]] dangerous. For example, nuclear weapons were designed to kill large numbers of people."], "img": "L24_c3", "icon": "🗣️"}, {"type": "sort", "title": "For or Against?", "bins": [{"label": "F – For", "icon": ""}, {"label": "A – Against", "icon": ""}], "cards": [{"text": "1 air conditioning … quite important", "icon": "", "bin": 0}, {"text": "3 Inventions are very important …", "icon": "", "bin": 0}, {"text": "5 … inventions are fairly important", "icon": "", "bin": 0}, {"text": "6 I certainly think that inventions are more important …", "icon": "", "bin": 0}, {"text": "2 Laws, morals and religion are absolutely essential …", "icon": "", "bin": 1}, {"text": "4 People are definitely more important …", "icon": "", "bin": 1}, {"text": "7 Some inventions are really dangerous …", "icon": "", "bin": 1}], "icon": "⚖️"}, {"type": "explain", "title": "Adverbs of degree", "lines": ["We use adverbs of degree to express something more strongly.", "Some adverbs make an opinion less strong."], "img": "L24_c4", "rule": "stronger: very, really, absolutely, definitely, certainly · less strong: quite, fairly", "icon": "📌"}, {"type": "flip", "title": "Adverbs of degree 📌 – examples", "cards": [{"front": "Studying is important. → Studying is [[very]] important.", "icon": "💡", "back": "stronger"}, {"front": "I love camping in the mountains. → I [[absolutely]] love camping in the mountains.", "icon": "✨", "back": "stronger"}, {"front": "Inventions are [[fairly]] / [[quite]] important.", "icon": "🔎", "back": "less strong"}]}, {"type": "sort", "title": "Stronger or less strong?", "bins": [{"label": "Stronger opinions", "icon": "💪"}, {"label": "Less strong opinions", "icon": "🙂"}], "cards": [{"text": "absolutely", "icon": "", "bin": 0}, {"text": "very", "icon": "", "bin": 0}, {"text": "definitely", "icon": "", "bin": 0}, {"text": "certainly", "icon": "", "bin": 0}, {"text": "really", "icon": "", "bin": 0}, {"text": "quite", "icon": "", "bin": 1}, {"text": "fairly", "icon": "", "bin": 1}], "icon": "💪"}, {"type": "quiz", "title": "Make it stronger or weaker", "icon": "✏️", "qs": [{"q": "(stronger) Majan was ___ important for the copper trade.", "o": ["very", "fairly", "quite"], "a": 0}, {"q": "(less strong) The film was ___ good, but not great.", "o": ["fairly", "absolutely", "definitely"], "a": 0}, {"q": "(stronger) I ___ love visiting Nizwa Fort.", "o": ["absolutely", "fairly", "quite"], "a": 0}, {"q": "(stronger) People are ___ more important than inventions.", "o": ["definitely", "fairly", "quite"], "a": 0}]}, {"type": "ask", "title": "Debate: inventions or people?", "qs": [{"q": "Are inventions more important than people in a civilisation?", "a": "I definitely think people are more important because they make inventions."}, {"q": "Which invention is absolutely essential for you?", "a": "The air conditioner is absolutely essential in the Omani summer!"}, {"q": "Which invention is really dangerous?", "a": "Nuclear weapons are really dangerous."}], "img": "L24_c3", "icon": "💬"}, {"type": "race", "title": "Team race", "qs": [{"q": "Concrete ___ invented by the Romans.", "options": ["was", "were", "is"], "a": 0}, {"q": "The Pyramids ___ built in Egypt.", "options": ["were", "was"], "a": 0}, {"q": "Past participle of ‘eat’:", "options": ["eaten", "ate", "eated"], "a": 0}, {"q": "Who did it? We use …", "options": ["by", "with", "for"], "a": 0}, {"q": "A less strong adverb:", "options": ["fairly", "absolutely"], "a": 0}, {"q": "A strong adverb:", "options": ["definitely", "quite"], "a": 0}], "icon": "🏎️"}, {"type": "steps", "title": "Let's remember!", "icon": "🧠", "steps": ["Passive: we emphasise the object, or the doer is unknown/unimportant.", "Past passive = was/were + past participle (+ by …).", "Stronger: very, really, absolutely, definitely, certainly · less strong: quite, fairly."]}, {"type": "exit", "title": "Exit ticket", "items": [{"k": "3", "text": "Change to passive: People traded frankincense."}, {"k": "2", "text": "Write one passive sentence with ‘by’."}, {"k": "1", "text": "Write your opinion about smartphones with a strong adverb."}], "icon": "🎟️"}, {"type": "homework", "title": "Homework", "head": "My homework", "items": ["Write 6 past passive sentences about places in Oman (e.g. Nizwa Fort was built …).", "Write 4 opinions about inventions using four different adverbs of degree.", "Learn the past participles: built, found, bought, eaten, sung, made, written."], "icon": "🏠"}]}, {"id": "L25", "unit": "U4", "unitName": "Unit 4 · Civilisation", "title": "Listening and Speaking · The United Nations and human rights", "code": "", "theme": "park", "emo": "🇺🇳", "slides": [{"type": "cover", "say": "Listening and Speaking · The UN and human rights"}, {"type": "goals", "title": "Today's goals", "items": ["I can discuss the meaning of famous quotes.", "I can listen for facts about the United Nations."], "icon": "🎯"}, {"type": "goals", "title": "Today's goals", "items": ["I can explain articles of the Universal Declaration of Human Rights in my own words.", "I can vary my responses in a discussion."], "icon": "🎯"}, {"type": "ask", "title": "What do these quotes mean?", "qs": [{"q": "1 Sultan Qaboos: “Our country in the past was famous and strong. If we work in unity and cooperation we will regenerate that glorious past and we will take a respectable place in the world.”", "a": "I think it means that if Omanis work together, Oman will be great again, like in the past."}, {"q": "4 Mahatma Gandhi: “An eye for eye only ends up making the whole world blind.”", "a": "I think it means that revenge only makes things worse for everyone."}, {"q": "6 Malala Yousafzai: “One child, one teacher, one book, one pen can change the world.”", "a": "It means that education is very powerful."}], "img": "L25_c1", "icon": "💭"}, {"type": "match", "title": "Match the words to the quotes", "pairs": [["1 Sultan Qaboos – unity and cooperation", "cooperation"], ["2 Jeannette Rankin – “You can no more win a war …”", "war"], ["3 Cree proverb – “… we cannot eat money.”", "the environment"]], "icon": "🧩"}, {"type": "match", "title": "Match the words to the quotes", "pairs": [["4 Mahatma Gandhi – “An eye for eye …”", "revenge"], ["5 Martin Luther King – “I have a dream …”", "equality"], ["6 Malala Yousafzai – “One child, one teacher …”", "education"]], "icon": "🧩"}, {"type": "read", "title": "The United Nations", "paras": ["The United Nations is an international organisation formed by governments around the world to maintain [[peace]], develop friendly relations between nations and achieve international [[cooperation]]."], "img": "L25_c2", "icon": "🇺🇳"}, {"type": "read", "title": "The United Nations", "paras": ["It also works to address 21st century issues such as [[human rights]], climate change, sustainable development, [[equality]], and humanitarian and health emergencies."], "img": "L25_c2", "icon": "🇺🇳"}, {"type": "ask", "title": "Listen and choose", "qs": [{"q": "1 The UN Charter was signed on the … 1945. (25th of April / 26th of June / 24th of October)", "a": "🎧 Listen and choose."}, {"q": "2 The UN has … official languages. (6 / 50 / 193)", "a": "🎧 Listen and choose."}, {"q": "3 The leader of the UN is the … (UN Secretariat / Secretary General / General Assembly)", "a": "🎧 Listen and choose."}, {"q": "4 … is the unofficial name of the UN and its partner programmes. (The UN family / UNESCO / UNICEF)", "a": "🎧 Listen and choose."}, {"q": "5 In 2017, the UN provided food to … million people. (3 / 65.3 / 80)", "a": "🎧 Listen and choose."}], "icon": "🎧"}, {"type": "ask", "title": "Listen and complete", "qs": [{"q": "On the 10th of December, (1) … the Universal Declaration of Human Rights was (2) … by the United Nations.", "a": "(1) a year · (2) a verb in the past passive. 🎧 Listen and complete."}, {"q": "The document contains (3) … articles.", "a": "(3) a number. 🎧 Listen."}, {"q": "It has been translated into over (4) … languages.", "a": "(4) a number. 🎧 Listen."}, {"q": "International (5) … Day is celebrated every year on the 10th of December.", "a": "(5) a noun. 🎧 Listen."}], "img": "L25_c5", "icon": "🎧"}, {"type": "read", "title": "The Universal Declaration of Human Rights", "paras": ["Article 1 – All human beings are born free and have equal rights. Everyone should respect each other.", "Article 2 – Everyone has the same human rights whatever their race, colour, gender, language or religion.", "Article 3 – Everyone has the right to life, freedom and security."], "img": "L25_c3", "icon": "📜"}, {"type": "read", "title": "The Universal Declaration of Human Rights", "paras": ["Article 6 – Everyone has the right to be treated equally by the law.", "Article 15 – Everyone has the right to a [[nationality]].", "Article 26 – Everyone has the right to an education."], "img": "L25_c3", "icon": "📜"}, {"type": "match", "title": "Articles and topics", "pairs": [["Article 1", "born free, equal rights, respect"], ["Article 2", "same rights whatever race, colour, gender, language or religion"], ["Article 3", "life, freedom and security"]], "icon": "🧩"}, {"type": "match", "title": "Articles and topics", "pairs": [["Article 6", "equal treatment by the law"], ["Article 15", "a nationality"], ["Article 26", "education"]], "icon": "🧩"}, {"type": "explain", "title": "Vary your responses", "lines": ["Don't always say ‘Yes’ or ‘I agree’. Use different expressions."], "img": "L25_c4", "rule": "Explain · agree · move on · partly agree", "icon": "🔁"}, {"type": "flip", "title": "Vary your responses 🔁 – examples", "cards": [{"front": "[[I think that]] Article 1 is about equality. [[It means that]] …", "icon": "💡", "back": "explain"}, {"front": "[[I agree.]] [[What about]] Article 2?", "icon": "✨", "back": "agree + move on"}, {"front": "[[You’re exactly right!]] / [[I have the same opinion.]]", "icon": "🔎", "back": "agree"}, {"front": "[[That’s true, but …]] / [[I see what you’re saying, but …]]", "icon": "📌", "back": "partly agree"}]}, {"type": "ask", "title": "Explain in your own words", "qs": [{"q": "Article 1", "a": "I think that Article 1 is about equality. It means that every person has the same rights and so we should treat people respectfully and kindly."}, {"q": "Article 2", "a": "It means that nobody should be treated differently because of their colour, language or religion."}, {"q": "Article 6", "a": "It means that the law is the same for rich and poor people."}, {"q": "Article 26", "a": "I think it means that every child should go to school."}], "img": "L25_c4", "icon": "💬"}, {"type": "write", "title": "Write three new articles", "task": "Work in groups. Discuss what universal rules would make the world a better place. Write three articles to add to the Universal Declaration of Human Rights.", "steps": ["Think: what makes the world a better place?", "Start each article with ‘Everyone has the right to …’ or ‘Everyone should …’.", "Keep each article short and clear.", "Present your articles and explain why they are important."], "words": ["Everyone has the right to …", "Everyone should …", "No one should …", "clean water", "a safe environment", "the internet", "respect"], "model": "Article A – Everyone has the right to clean water and clean air.\nArticle B – Everyone should protect the environment for future generations.\nArticle C – No one should be bullied, online or at school.", "icon": "✍️"}, {"type": "wheel", "title": "Respond in different ways", "items": [{"q": "Education is the most important right.", "a": "You’re exactly right! / That’s true, but …"}, {"q": "Revenge never solves problems.", "a": "I have the same opinion. For example, …"}, {"q": "Everyone should learn two languages.", "a": "I see what you’re saying, but …"}, {"q": "Clean water should be a human right.", "a": "I agree. What about clean air?"}, {"q": "Countries should cooperate more.", "a": "I think that … It means that …"}, {"q": "Peace is more important than money.", "a": "Absolutely! The reason for this is …"}], "icon": "🎡"}, {"type": "race", "title": "Team race", "qs": [{"q": "Gandhi's quote is about …", "options": ["revenge", "education"], "a": 0}, {"q": "Malala's quote is about …", "options": ["education", "war"], "a": 0}, {"q": "Martin Luther King's quote is about …", "options": ["equality", "the environment"], "a": 0}, {"q": "Article 26: everyone has the right to …", "options": ["an education", "a car"], "a": 0}, {"q": "Article 15: everyone has the right to …", "options": ["a nationality", "a phone"], "a": 0}, {"q": "The UN works to maintain …", "options": ["peace", "war"], "a": 0}], "icon": "🏎️"}, {"type": "steps", "title": "Let's remember!", "icon": "🧠", "steps": ["Quotes: cooperation, war, the environment, revenge, equality, education.", "The UN: peace, friendly relations, cooperation, human rights.", "UDHR articles: equality, life and freedom, equal treatment, nationality, education.", "Vary your responses: I think it means … / I agree. What about …?"]}, {"type": "exit", "title": "Exit ticket", "items": [{"k": "3", "text": "Choose one quote and explain it in one sentence."}, {"k": "2", "text": "Explain one article of the UDHR in your own words."}, {"k": "1", "text": "Write one new article."}], "icon": "🎟️"}, {"type": "homework", "title": "Homework", "head": "My homework", "items": ["Write your group's three new articles neatly with a reason for each.", "Choose your favourite quote from CB p. 42 and write 4 sentences about it.", "Learn: peace, cooperation, equality, human rights, nationality."], "icon": "🏠"}]}, {"id": "L26", "unit": "U4", "unitName": "Unit 4 · Civilisation", "title": "Writing · A biography of Ahmed Bin Majid", "code": "", "theme": "park", "emo": "🧭", "slides": [{"type": "cover", "say": "Writing · A biography"}, {"type": "goals", "title": "Today's goals", "items": ["I can talk about famous Omani people.", "I can read a biography and find the main facts."], "icon": "🎯"}, {"type": "goals", "title": "Today's goals", "items": ["I can use biography phrases and time expressions in order.", "I can write sentences about Dr Lamya Al Haj."], "icon": "🎯"}, {"type": "ask", "title": "Famous Omani people", "qs": [{"q": "Historical figures", "a": "Ahmed Bin Majid, the famous sailor and navigator."}, {"q": "Public figures and scientists", "a": "Dr Lamya Al Haj, a scientist and university lecturer (CB p. 45)."}, {"q": "Sports people, entrepreneurs, ambassadors – who do you know?", "a": "Students give names they know and say why they are famous."}], "img": "L26_c3", "icon": "🇴🇲"}, {"type": "read", "title": "Ahmed Bin Majid (1)", "paras": ["Ahmed Bin Majid [[was a famous]] Omani sailor and navigator. He was known as the ‘Lion of the Sea’ for his expertise in sailing and navigation."], "img": "L26_c2", "icon": "📖"}, {"type": "read", "title": "Ahmed Bin Majid (1)", "paras": ["Ibn Majid was born around 1421 in Oman. He was raised in a family of professional sailors. [[At a young age]], Ibn Majid took his first sailing trip with his father. His father taught him everything he knew about sailing and navigation. He also insisted that Ibn Majid had a clear understanding of the Qu’ran."], "img": "L26_c2", "icon": "📖"}, {"type": "read", "title": "Ahmed Bin Majid (1)", "paras": ["[[At the age of]] seventeen, Ibn Majid became a sailor. He quickly progressed to the position of Master Mariner."], "img": "L26_c2", "icon": "📖"}, {"type": "read", "title": "Ahmed Bin Majid (2)", "paras": ["However, he was not only famous for his sailing ability. Perhaps [[his most important achievement was]] the books he wrote to record his knowledge of sailing, navigation and the ports of the Arab trading empire. His most famous book is called ‘Al-Fawaid Fi Usul ilm Al-Bahr Wa Al-Qawaid ‘. He also wrote almost 40 poems."], "img": "L26_c2", "icon": "📖"}, {"type": "read", "title": "Ahmed Bin Majid (2)", "paras": ["Ibn Majid invented the ‘kamal’ a simple but effective tool for navigation. He also redesigned the compass which was originally invented by the Chinese. His compass was far superior and the compasses we use today are based on his design."], "img": "L26_c2", "icon": "📖"}, {"type": "read", "title": "Ahmed Bin Majid (2)", "paras": ["The exact date of Ibn Majid’s death is not known. Historians think he probably died around 1500. He [[will be remembered as]] one of the most famous navigators and explorers of all time."], "img": "L26_c2", "icon": "📖"}, {"type": "quiz", "title": "Read and answer", "qs": [{"q": "According to the text, what three things was Ahmed famous for?", "o": ["sailing and navigation, his books, inventing the kamal and redesigning the compass", "building ships, trading copper, fishing", "writing poems only"], "a": 0}, {"q": "He was known as the …", "o": ["Lion of the Sea", "King of Sohar", "Father of Ships"], "a": 0}, {"q": "He was born around …", "o": ["1421", "1500", "1600"], "a": 0}, {"q": "He became a sailor at the age of …", "o": ["seventeen", "seven", "twenty-seven"], "a": 0}, {"q": "He wrote almost … poems.", "o": ["40", "14", "400"], "a": 0}], "icon": "✅"}, {"type": "order", "title": "Ibn Majid's life in order", "items": ["He was born around 1421 in Oman.", "At a young age, he took his first sailing trip with his father.", "At the age of seventeen, he became a sailor.", "He progressed to Master Mariner.", "He wrote books and almost 40 poems, and invented the kamal.", "He probably died around 1500."], "icon": "⏳"}, {"type": "explain", "title": "Biography phrases", "lines": ["(Name) is/was a famous/well known … · (Name) is famous because …", "At/From a young age … · At the age of … he/she … · In (year) he/she … · One year later, …", "He/She studied (subject) at (university) · His/her most important achievement was … · One of his/her greatest achievements is …", "(Name) will be remembered as/for … · (Name) currently … · In the future, he/she hopes to …"], "img": "L26_c5", "rule": "Who? → childhood → education/work → achievements → today/future", "icon": "📌"}, {"type": "flip", "title": "Biography phrases 📌 – examples", "cards": [{"front": "Ahmed Bin Majid [[was a famous]] Omani sailor and navigator.", "icon": "💡", "back": "✓ used"}, {"front": "[[At the age of]] seventeen, Ibn Majid became a sailor.", "icon": "✨", "back": "✓ used"}, {"front": "He [[will be remembered as]] one of the most famous navigators.", "icon": "🔎", "back": "✓ used"}]}, {"type": "enter", "title": "Catch the Useful Language phrases that ARE used in the Ahmed Bin Majid biography.", "gate": "✓", "items": [{"text": "will be remembered as …", "in": true}, {"text": "At a young age …", "in": true}, {"text": "was a famous …", "in": true}, {"text": "He studied … at …", "in": false}, {"text": "One of his greatest achievements is …", "in": false}, {"text": "currently …", "in": false}]}, {"type": "ask", "title": "Ask and answer: Dr Lamya Al Haj", "qs": [{"q": "When and where was she born?", "a": "She was born on 31st May 1982 in Buraimi, Oman."}, {"q": "Where did she study for her BSc? When did she graduate?", "a": "At Sultan Qaboos University; she graduated in 2004 with a high distinction."}, {"q": "What did she study in Australia and in the UK?", "a": "An MSc in Environmental Science at the University of New South Wales (2006) and a PhD in Molecular Biology at University College London (2014)."}], "img": "L26_c4", "icon": "👩‍🔬"}, {"type": "ask", "title": "Ask and answer: Dr Lamya Al Haj", "qs": [{"q": "What does she do now?", "a": "She works as an Assistant Professor at Sultan Qaboos University, publishes research and presents at conferences."}, {"q": "What awards did she receive?", "a": "2003: the Award of Excellence from His Majesty Sultan Qaboos; 2018: the L’Oreal UNESCO Award for Women in Science and the National Research Award in renewable energy."}, {"q": "What does she hope to do?", "a": "She hopes to empower Omani youth and unleash their potential in creating positive change and development in Oman."}], "icon": "👩‍🔬"}, {"type": "build", "title": "Sentences about Dr Lamya", "mode": "words", "items": [{"a": "Dr Lamya Al Haj is a well-known Omani scientist.", "hint": "a well-known / Dr Lamya Al Haj is / Omani scientist.", "emo": "👩‍🔬"}, {"a": "In 2004, she graduated from Sultan Qaboos University with a BSc in Science.", "hint": "she graduated / In 2004, / with a BSc in Science. / from Sultan Qaboos University", "emo": "🎓"}, {"a": "In 2016, she was the first Omani invited to address the HBS Crossroad Conference in Dubai.", "hint": "she was the first Omani / In 2016, / invited to address / the HBS Crossroad Conference in Dubai.", "emo": "🎤"}, {"a": "In the future, she hopes to empower Omani youth.", "hint": "she hopes / In the future, / to empower Omani youth.", "emo": "🌟"}], "icon": "🧱"}, {"type": "write", "title": "Write about Dr Lamya Al Haj", "task": "Write five sentences about Dr Lamya Al Haj. Use the information from Act. 3 and the phrases from the Useful Language box.", "steps": ["Who is she? (is a well-known …)", "Born when and where?", "Education: She studied … at …", "Achievements: One of her greatest achievements is …", "Today and the future: She currently … · In the future, she hopes to …"], "words": ["is a well-known …", "was born on …", "In 2004, …", "She studied … at …", "One of her greatest achievements is …", "She currently …", "In the future, she hopes to …"], "model": "Dr Lamya Al Haj is a well-known Omani scientist. She was born on 31st May 1982 in Buraimi, Oman. In 2004, she graduated from Sultan Qaboos University with a BSc in Science. One of her greatest achievements is the L’Oreal UNESCO Award for Women in Science, which she received in 2018. She currently works as an Assistant Professor at Sultan Qaboos University, and in the future, she hopes to empower Omani youth.", "icon": "✍️"}, {"type": "race", "title": "Team race", "qs": [{"q": "Ahmed Bin Majid invented the …", "options": ["kamal", "telescope", "dhow"], "a": 0}, {"q": "The compass was originally invented by the …", "options": ["Chinese", "Romans", "Greeks"], "a": 0}, {"q": "Dr Lamya was born in …", "options": ["Buraimi", "Sohar", "Salalah"], "a": 0}, {"q": "Biography ending phrase:", "options": ["will be remembered as", "At a young age"], "a": 0}, {"q": "Ibn Majid probably died around …", "options": ["1500", "1421"], "a": 0}, {"q": "Dr Lamya's PhD subject:", "options": ["Molecular Biology", "History"], "a": 0}], "icon": "🏎️"}, {"type": "steps", "title": "Let's remember!", "icon": "🧠", "steps": ["Ahmed Bin Majid: the ‘Lion of the Sea’ – sailor, navigator, writer, inventor of the kamal.", "A biography tells a life in chronological order.", "Phrases: was a famous …, At a young age, At the age of …, In (year), His most important achievement was …, will be remembered as …"]}, {"type": "exit", "title": "Exit ticket", "items": [{"k": "3", "text": "Give three things Ahmed Bin Majid was famous for."}, {"k": "2", "text": "Write one sentence about Dr Lamya with ‘In (year)’."}, {"k": "1", "text": "Which biography phrase ends a biography?"}], "icon": "🎟️"}, {"type": "homework", "title": "Homework", "head": "My homework", "items": ["Write your five sentences about Dr Lamya Al Haj (CB p. 45 Act. 4).", "Write a short biography (80–100 words) of a member of your family or a famous Omani.", "Underline the time phrases in your biography."], "icon": "🏠"}]}, {"id": "L27", "unit": "U4", "unitName": "Unit 4 · Civilisation", "title": "Project · A leaflet about an archaeological site in Oman", "code": "", "theme": "park", "emo": "🏺", "slides": [{"type": "cover", "say": "Project · An information leaflet"}, {"type": "goals", "title": "Today's goals", "items": ["I can talk about archaeological sites in Oman.", "I can compare research methods and reliable sources."], "icon": "🎯"}, {"type": "goals", "title": "Today's goals", "items": ["I can find facts in an information leaflet.", "I can plan and make a leaflet with my group."], "icon": "🎯"}, {"type": "build", "title": "Site words", "mode": "letters", "items": [{"a": "ruins", "hint": "what is left of old buildings", "emo": "🏚️"}, {"a": "port", "hint": "a town where ships stop", "emo": "⚓"}, {"a": "fort", "hint": "a strong building for defence", "emo": "🏰"}], "icon": "🔤"}, {"type": "build", "title": "Site words", "mode": "letters", "items": [{"a": "museum", "hint": "a place where old objects are shown", "emo": "🏛️"}, {"a": "leaflet", "hint": "a small printed paper with information", "emo": "📄"}, {"a": "source", "hint": "where information comes from", "emo": "🔎"}], "icon": "🔤"}, {"type": "ask", "title": "Archaeological sites in Oman", "qs": [{"q": "1 What are the names of these archaeological sites?", "a": "1 looks like Al Baleed (the columns in the leaflet photo on p. 47); 3 looks like the beehive tombs of Al Ayn; 2 and 4: students suggest names (e.g. Bibi Maryam's tomb in Qalhat; Sumhuram)."}, {"q": "2 Do you know anything about any of these sites?", "a": "Al Baleed was an important ancient port in Salalah and a centre of the frankincense trade."}, {"q": "3 Have you ever visited any of these sites?", "a": "Yes, I visited Al Baleed with my family during the Khareef."}], "img": "L27_c1", "icon": "🇴🇲"}, {"type": "ask", "title": "Listen and identify", "qs": [{"q": "a) looking for information online · b) in a book · c) asking a history teacher", "a": "🎧 Did Maha's group talk about it? Listen and tick."}, {"q": "d) contacting the Ministry of Heritage and Culture · e) visiting the site", "a": "🎧 Listen and tick."}, {"q": "f) the national museum · g) videos on YouTube", "a": "🎧 Listen and tick."}], "img": "L27_c3", "icon": "🎧"}, {"type": "sort", "title": "How reliable is it?", "bins": [{"label": "Usually more reliable", "icon": "✅"}, {"label": "Check carefully", "icon": "⚠️"}], "cards": [{"text": "the Ministry of Heritage and Culture", "icon": "", "bin": 0}, {"text": "the national museum", "icon": "", "bin": 0}, {"text": "a history book", "icon": "", "bin": 0}, {"text": "a history teacher", "icon": "", "bin": 0}, {"text": "an official website (.gov.om)", "icon": "", "bin": 0}, {"text": "a random YouTube video", "icon": "", "bin": 1}, {"text": "a social media post", "icon": "", "bin": 1}, {"text": "an unknown blog", "icon": "", "bin": 1}], "icon": "🔎"}, {"type": "ask", "title": "Research methods", "qs": [{"q": "1 What are the advantages and disadvantages of each method?", "a": "Online: fast, but some information is not true. Visiting the site: you see it yourself, but it takes time and money."}, {"q": "2 Which sources will be the most and least reliable? Why?", "a": "The Ministry and the national museum are the most reliable because experts check the information. Random videos are the least reliable."}, {"q": "3 Why is it important to use information from reliable sources?", "a": "Because our leaflet must give true facts to visitors."}], "icon": "💬"}, {"type": "read", "title": "The Al Baleed Archaeological Park (1)", "paras": ["The History of Al Baleed – Al Baleed was the most important ancient [[port]] on the Arabian Sea. It is located in Salalah, Dhofar. The Al Baleed site dates back to 2000 BC. The port city of Al Baleed was established in the 11th century and it became the centre of the frankincense trade."], "img": "L27_c4", "icon": "📄"}, {"type": "read", "title": "The Al Baleed Archaeological Park (1)", "paras": ["Al Baleed was discovered in 1930. The huge 64,000 hectre site is still being [[excavated]] by archaeologists today. In 2000, the site was given UNESCO World Heritage Site status."], "img": "L27_c4", "icon": "📄"}, {"type": "read", "title": "The Al Baleed Archaeological Park (2)", "paras": ["The Al Baleed Archaeological Site – The ancient city of Al Baleed was divided into three main sections: commercial, residential and services. One of the most important discoveries was the Al Baleed mosque, which archaeologists believe was built in the 11th century. The mosque was located in the west of the city. It had 144 columns and some of the columns can still be seen today. The remains of a 13 metre high fort were also found in the same part of the city. The city was surrounded by a wall to protect it from floods during the Khareef season in Dhofar."], "img": "L27_c2", "icon": "📄"}, {"type": "read", "title": "The Al Baleed Archaeological Park (2)", "paras": ["Visiting the Al Baleed Archaeological Park – The Al Baleed Archaeological Park is a must see attraction for any visitors to Dhofar. It is part of the Frankincense Route and is located in Salalah. Opening hours are 8am - 8pm and the entrance fee is 2 OMR per car. In addition to exploring the ruins of Al Baleed, visitors can also visit the Frankincense Land Museum. (Source: http://www.omantourism.gov.om)"], "img": "L27_c2", "icon": "📄"}, {"type": "quiz", "title": "Facts from the leaflet", "icon": "✏️", "qs": [{"q": "Al Baleed is located in ___ , Dhofar.", "o": ["Salalah", "Sohar", "Nizwa"], "a": 0}, {"q": "The site dates back to ___ .", "o": ["2000 BC", "1930", "the 11th century"], "a": 0}, {"q": "It became the centre of the ___ trade.", "o": ["frankincense", "copper", "dates"], "a": 0}, {"q": "Al Baleed was discovered in ___ .", "o": ["1930", "2000", "1421"], "a": 0}, {"q": "The mosque had ___ columns.", "o": ["144", "13", "64"], "a": 0}, {"q": "The entrance fee is ___ OMR per car.", "o": ["2", "8", "20"], "a": 0}]}, {"type": "ask", "title": "Read and discuss", "qs": [{"q": "1 What kind of information is provided in the leaflet?", "a": "History, the archaeological site (what was found) and practical information for visitors."}, {"q": "2 What facts have been included? Make a list.", "a": "Salalah, Dhofar · 2000 BC · port city from the 11th century · frankincense trade · discovered 1930 · 64,000 hectares · UNESCO 2000 · mosque with 144 columns · 13 m fort · wall against Khareef floods · 8am–8pm · 2 OMR per car · Frankincense Land Museum."}, {"q": "3 Is there any other information that could be added?", "a": "A map, how to get there, the best time to visit, a phone number, more photos."}, {"q": "4 What do you think about the design of the leaflet?", "a": "It is clear: headings, photos and short paragraphs."}], "icon": "💡"}, {"type": "ask", "title": "Plan your leaflet", "qs": [{"q": "1 Which archaeological site do you want to make a leaflet about?", "a": "Bahla Fort in Ad Dakhiliyah."}, {"q": "2 How will you research it?", "a": "We will read official websites, ask our history teacher and look in books."}, {"q": "3 What information will you include?", "a": "History, what to see, opening hours, entrance fee, how to get there."}, {"q": "4 How will you design your leaflet?", "a": "A4 folded in three, brown and gold colours, three photos, headings for each part."}], "icon": "🗒️"}, {"type": "write", "title": "Make your leaflet", "task": "Design and make an information leaflet about an archaeological site in Oman. Use reliable sources.", "steps": ["Title + a photo.", "The History of … (when it was built / discovered).", "The site: what can visitors see?", "Visiting: location, opening hours, entrance fee.", "Source: write where your information comes from."], "words": ["is located in …", "dates back to …", "was built in …", "was discovered in …", "is a must see attraction", "Opening hours are …", "In addition to …, visitors can also …", "Source: …"], "model": "BAHLA FORT – The History of Bahla Fort: Bahla Fort is located in the town of Bahla in Ad Dakhiliyah. It is one of the oldest and largest forts in Oman. In 1987, it was given UNESCO World Heritage Site status. Visiting Bahla Fort: The fort is a must see attraction for visitors to the interior of Oman. In addition to exploring the fort, visitors can also walk around the old town and its famous pottery shops. (Check opening hours and fees on an official website.)", "icon": "✍️"}, {"type": "race", "title": "Team race", "qs": [{"q": "Al Baleed was an ancient …", "options": ["port", "mountain", "desert"], "a": 0}, {"q": "UNESCO status was given in …", "options": ["2000", "1930", "1500"], "a": 0}, {"q": "The city wall protec     o.forEach((x,i)=>{const bl=el('div','balloon');bl.style.cssText=`left:calc(${(i+.5)*100/n}% - 150px);animation-delay:${(-i*.8).toFixed(1)}s`;bl.innerHTML=`<div class="bb" style="background:${BC[(i+k)%6]};font-size:${String(x.t).length>24?28:String(x.t).length>12?34:42}px">${fmt(x.t)}</div><div class="str"></div>`;bl._ok=x.ok;bl.onclick=()=>pop(bl);area.append(bl)});dt(k)};
  const pop=bl=>{if(done||!bl)return;if(bl._ok){done=true;bl.classList.add('popd');area.querySelectorAll('.balloon').forEach(x=>{if(x!==bl)x.classList.add('gone')});const qb=q.querySelector('.qb');if(qb){qb.innerHTML=bl.querySelector('.bb').innerHTML;qb.classList.add('okc')}SND.ok();confetti()}else{bl.classList.add('shake');SND.no();setTimeout(()=>bl.classList.remove('shake'),500)}};
  if(rs.length)show();w._step=()=>{if(!done&&rs.length){pop([...area.children].find(x=>x._ok));return true}if(k<rs.length-1){k++;show();return true}return false}};
R.mystery=(s,L,w)=>{const b=banner({title:s.title||'Mystery picture',icon:'🧩'});w.append(b);const qs=s.qs||[];
  const box=el('div','pic');box.style.cssText='left:60px;top:190px;width:780px;height:620px';box.innerHTML=img(s.img);const cv=el('div','tiles');const TC=['#ff8a9a','#6fb1ff','#ffd166','#7ddc9a','#b9a2f5','#ffb07a'];const tl=[];for(let i=0;i<9;i++){const t=el('div','tile','❔');t.style.background=TC[(i*5)%6];cv.append(t);tl.push(t)}box.append(cv);w.append(box);
  const order=shuffle(tl);const per=Math.ceil(9/Math.max(1,qs.length));const qa=el('div','');qa.style.cssText='position:absolute;left:880px;right:60px;top:190px';w.append(qa);

  const finish=()=>{order.splice(0).forEach(t=>t.classList.add('gone'));if(s.answer)fin.style.display='block';SND.win();confetti()};
  const show=()=>{const it=qs[k];done=false;qa.innerHTML=`<div class="qbub" style="position:relative;font-size:${fzOf(it.q,30,34,38,42)}px">${NUM(k,qs.length)}${fmt(it.q)}</div>`;const og=el('div','');og.style.cssText='display:flex;flex-direction:column;gap:14px;margin-top:18px';
    shuffle((it.o||[]).map((t,i)=>({t,ok:i===(it.a||0)}))).forEach((o,i)=>{const c=el('button','card '+COL[i%4],`<span class="mid" style="font-weight:800">${fmt(o.t)}</span>`);c.style.cssText='text-align:center;padding:10px 20px';c._ok=o.ok;c.onclick=()=>pick(c);og.append(c)});qa.append(og)};
  const pick=c=>{if(done||!c)return;if(c._ok){done=true;c.classList.add('okc');SND.ok();for(let i=0;i<per;i++){const t=order.shift();if(t)t.classList.add('gone')}if(k===qs.length-1)setTimeout(finish,700)}else{c.classList.add('noc','shake');SND.no();setTimeout(()=>c.classList.remove('shake'),500)}};
  if(qs.length)show();w._step=()=>{if(qs.length&&!done){pick([...qa.querySelectorAll('button')].find(x=>x._ok));return true}if(k<qs.length-1){k++;show();return true}if(order.length){finish();return true}return false}};
R.poem=(s,L,w)=>{const b=banner({title:s.title,icon:s.icon||'🎵'});w.append(b);const ls=s.lines||[];const hasImg=!!s.img;

  const pb=el('div','poem');pb.style.cssText=hasImg?'left:540px;right:60px;top:190px':'left:110px;right:110px;top:190px';const n=ls.length;const mx=Math.max(...ls.map(v=>Array.isArray(v)?v.join(' ').length:String(v).length));const fz=Math.min(n>7?30:n>5?34:n>3?40:46,mx>70?30:mx>50?36:60);

/* ---------- core ---------- */
const stage=$('#stage');let W=null;
function fit(){const k=Math.min(innerWidth/1600,innerHeight/900);stage.style.transform=`scale(${k})`}
function go(i,dir){if(i<0||i>=FLAT.length)return;if(W&&W._cleanup)W._cleanup();cur=i;try{localStorage.setItem(D.store+'-pos',i)}catch(e){}
  const {L,s}=FLAT[i];stage.innerHTML='';const theme=s.scene||L.theme||'lab';stage.insertAdjacentHTML('beforeend',(SC[theme]||SC.lab)());
  W=el('div','slide in');stage.append(W);const f=R[s.type]||R.text;try{f(s,L,W)}catch(err){W.innerHTML=`<div class="panel" style="top:300px">⚠️ ${esc(err.message)}</div>`;console.error(err)}
  $('#count').textContent=(i+1)+' / '+FLAT.length;$('#note').textContent=s.note||'';
  $('#prev').style.visibility=i?'visible':'hidden';$('#next').style.visibility=i<FLAT.length-1?'visible':'hidden'}
function next(){if(W&&W._step&&W._step())return;go(cur+1)}
function prev(){go(cur-1)}
$('#next').onclick=next;$('#prev').onclick=prev;
addEventListener('keydown',e=>{if($('#menu').classList.contains('on')){if(e.key==='Escape')$('#menu').classList.remove('on');return}
  const FW=LANG==='en'?'ArrowRight':'ArrowLeft',BW=LANG==='en'?'ArrowLeft':'ArrowRight';if([FW,'PageDown',' ','Enter'].includes(e.key)){e.preventDefault();next()}else if([BW,'PageUp','Backspace'].includes(e.key)){e.preventDefault();prev()}else if(e.key==='Home')go(0);else if(e.key.toLowerCase()==='f')fs();else if(e.key.toLowerCase()==='n')$('#note').classList.toggle('on');else if(e.key.toLowerCase()==='m')openMenu()});
function fs(){if(!document.fullscreenElement)document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen();else document.exitFullscreen()}
function openMenu(){const m=$('#menu');const box=m.querySelector('.mbox');const curL=FLAT[cur].L.id;let h=`<h2>${esc(D.title)}</h2><div class="msub">${esc(D.sub||'')} · اختر الدرس أو الحصة</div>`;
  D.units.forEach(u=>{const ls=D.lessons.filter(l=>l.unit===u.id);if(!ls.length)return;h+=`<div class="unit">${esc(u.name)}</div><div class="lgrid">`;ls.forEach(l=>{h+=`<div class="les${l.id===curL?' cur':''}"><b data-i="${LSTART[l.id]}">${l.emo||'📘'} ${fmt(l.title)}</b><div class="ps">${PSTART[l.id].map(p=>`<button data-i="${p.i}">الحصة ${p.n}</button>`).join('')}</div></div>`});h+='</div>'});
  h+=`<div class="tools"><button id="tFs">⛶ ملء الشاشة (F)</button><button id="tMute">${muted?'🔇 الصوت مغلق':'🔊 الصوت يعمل'}</button><button id="tNote">📝 ملاحظة المعلم (N)</button><button id="tClose">✕ إغلاق</button></div>`;box.innerHTML=h;
  box.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{m.classList.remove('on');go(+b.dataset.i)});box.querySelector('#tFs').onclick=fs;box.querySelector('#tClose').onclick=()=>m.classList.remove('on');box.querySelector('#tNote').onclick=()=>{$('#note').classList.toggle('on');m.classList.remove('on')};box.querySelector('#tMute').onclick=e=>{muted=!muted;try{localStorage.setItem('ictdeck-mute',muted?'1':'0')}catch(x){}e.target.textContent=muted?'🔇 الصوت مغلق':'🔊 الصوت يعمل'};m.classList.add('on')}
$('#menuBtn').onclick=openMenu;$('#menu').onclick=e=>{if(e.target.id==='menu')$('#menu').classList.remove('on')};
addEventListener('resize',fit);fit();go(cur);
window.__deck={go,FLAT,count:()=>FLAT.length};
