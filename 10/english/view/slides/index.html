:root{--ink:#14284b;--ink2:#3b4f72;--cream:#fdf6e9;--gold:#e3b45a;--pink:#fde3e6;--pinkb:#e8798a;--blue:#dcecff;--blueb:#6aa2e8;--yel:#fff1c9;--yelb:#e2b13c;--grn:#dff3e0;--grnb:#5fb873;--pur:#ece4ff;--purb:#9b84e6;--org:#ffe6d5;--orgb:#f0965f;--ok:#2fa35a;--no:#e05561}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#0e1830;overflow:hidden;font-family:'Baloo Bhaijaan 2','Noto Naskh Arabic',system-ui,sans-serif;color:var(--ink)}
button{font:inherit;cursor:pointer}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#stage{position:relative;width:1600px;height:900px;transform-origin:center center;overflow:hidden;border-radius:6px;background:#fff}
.scene{position:absolute;inset:0;width:100%;height:100%}
.slide{position:absolute;inset:0}
.slide.in{animation:sIn .5s ease}
@keyframes sIn{from{opacity:0;transform:scale(1.015)}to{opacity:1;transform:none}}
bdi.en{font-family:'Baloo Bhaijaan 2',system-ui,sans-serif;unicode-bidi:isolate}
mark{background:linear-gradient(transparent 45%,#ffe27a 45%,#ffe27a 92%,transparent 92%);color:inherit;padding:0 .1em}
/* banner (top title card) */
.banner{position:absolute;top:26px;left:50%;transform:translateX(-50%);min-width:760px;max-width:1300px;padding:14px 92px 16px;background:var(--cream);border:5px solid var(--gold);border-radius:34px;box-shadow:0 8px 0 rgba(0,0,0,.12),inset 0 0 0 4px #fff;text-align:center;z-index:5}
.banner:before{content:"";position:absolute;inset:8px;border:2.5px dashed #e9cf98;border-radius:26px;pointer-events:none}
.banner h1{margin:0;font-weight:800;font-size:54px;line-height:1.25;color:var(--ink)}
.banner h1 .k{color:#d6344f}
.banner .ico{position:absolute;top:50%;transform:translateY(-50%);font-size:52px}
.banner .ico.r{right:18px}.banner .ico.l{left:18px}
.banner.pink{background:#fff0f2;border-color:var(--pinkb)}.banner.pink:before{border-color:#f3b5bf}
.pill{position:absolute;left:50%;transform:translateX(-50%);background:#fffaf0;border:3px solid #d7b878;border-radius:22px;padding:4px 30px 6px;font-size:32px;font-weight:600;color:var(--ink2);white-space:nowrap;z-index:5;box-shadow:0 4px 0 rgba(0,0,0,.08)}
/* generic cards */
.card{position:relative;background:var(--cream);border:5px solid var(--gold);border-radius:30px;box-shadow:0 8px 0 rgba(0,0,0,.13);padding:18px 26px}
.card:before{content:"";position:absolute;inset:8px;border:2.5px dashed rgba(0,0,0,.14);border-radius:22px;pointer-events:none}
.c0{background:var(--pink);border-color:var(--pinkb)}.c1{background:var(--blue);border-color:var(--blueb)}.c2{background:var(--yel);border-color:var(--yelb)}.c3{background:var(--grn);border-color:var(--grnb)}.c4{background:var(--pur);border-color:var(--purb)}.c5{background:var(--org);border-color:var(--orgb)}
.big{font-size:44px;font-weight:700;line-height:1.45}
.mid{font-size:38px;font-weight:600;line-height:1.5}
.emo{font-size:72px;line-height:1;filter:drop-shadow(0 4px 0 rgba(0,0,0,.12))}
.hide{visibility:hidden}
.tap{cursor:pointer}
.panel{position:absolute;left:50%;transform:translateX(-50%);background:rgba(255,253,247,.94);border:5px solid #d9c08e;border-radius:34px;box-shadow:0 10px 0 rgba(0,0,0,.12);padding:26px 34px}
/* nav */
.nav{position:fixed;bottom:16px;width:64px;height:64px;border-radius:50%;border:0;background:rgba(255,255,255,.88);color:#14284b;font-size:30px;font-weight:800;box-shadow:0 4px 14px rgba(0,0,0,.25);z-index:50;display:flex;align-items:center;justify-content:center;transition:transform .15s,opacity .3s;opacity:.55}
.nav:hover{opacity:1;transform:scale(1.08)}
#next{left:16px}#prev{right:16px}
#menuBtn{position:fixed;top:14px;right:14px;width:50px;height:50px;border-radius:14px;border:0;background:rgba(255,255,255,.6);font-size:26px;z-index:50;opacity:.45;transition:opacity .3s}
#menuBtn:hover{opacity:1}
#count{position:fixed;bottom:30px;left:92px;color:#fff;font-size:15px;opacity:.55;z-index:50;font-family:system-ui;direction:ltr;text-shadow:0 1px 3px #000}
/* menu */
#menu{position:fixed;inset:0;background:rgba(10,20,42,.82);backdrop-filter:blur(6px);z-index:100;display:none;overflow:auto;padding:30px}
#menu.on{display:block}
#menu .mbox{max-width:1180px;margin:0 auto;background:#fffaf0;border-radius:28px;padding:22px 30px 30px;border:5px solid var(--gold)}
#menu h2{margin:0 0 4px;font-size:34px}
#menu .msub{color:#5b6782;font-size:18px;margin-bottom:12px}
#menu .unit{margin:16px 0 8px;font-size:22px;font-weight:800;color:#2f7d5b}
#menu .lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
#menu .les{border:3px solid #e5d6b5;border-radius:18px;background:#fff;padding:10px 14px}
#menu .les b{display:block;font-size:21px;line-height:1.35;cursor:pointer}
#menu .les b:hover{color:#d6344f}
#menu .les .ps{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
#menu .les .ps button{border:2px solid #9cc9d3;background:#eef8fa;color:#226b7a;border-radius:12px;padding:2px 12px;font-size:16px;font-weight:700}
#menu .les.cur{border-color:#e8798a;background:#fff5f6}
#menu .tools{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
#menu .tools button{border:2px solid #d7b878;background:#fff;border-radius:14px;padding:6px 16px;font-size:18px;font-weight:700}
#note{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);max-width:900px;background:#fffbe6;border:2px solid #e3b45a;border-radius:14px;padding:10px 18px;font-size:18px;z-index:60;display:none;box-shadow:0 6px 20px rgba(0,0,0,.3)}
#note.on{display:block}
/* fx */
.shake{animation:shake .45s}
@keyframes shake{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
.pop{animation:pop .45s}
@keyframes pop{50%{transform:scale(1.08)}}
.okc{outline:6px solid var(--ok)!important;outline-offset:3px;background:#e4f7e9!important}
.noc{outline:6px solid var(--no)!important;outline-offset:3px;background:#fde8ea!important}
.fade{opacity:.35}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:90}
/* ---------- gate (cover / lock / enter) ---------- */
.gate{position:absolute;width:560px;height:560px;overflow:hidden;border-radius:40px 40px 0 0}
.gate .frame{position:absolute;inset:0;border-radius:40px 40px 0 0;background:linear-gradient(#d9dfea,#b9c3d6);border:6px solid #2b3a55}
.gate .sign{position:absolute;top:16px;left:16px;right:16px;height:96px;background:#1f2d4d;border-radius:18px;display:flex;align-items:center;justify-content:center;gap:16px;color:#fff;font-size:40px;font-weight:800}
.gate .sign .tag{background:#ffcb3d;color:#1f2d4d;border-radius:12px;padding:0 16px;font-size:44px}
.gate .door{position:absolute;top:128px;bottom:0;width:calc(50% - 22px);background:linear-gradient(135deg,#d6e8ff,#a5c4eb);border:5px solid #2b3a55;transition:transform 1.1s cubic-bezier(.6,.05,.3,1)}
.gate .door.l{left:22px;border-radius:8px 0 0 0}.gate .door.r{right:22px;border-radius:0 8px 0 0}
.gate.open .door.l{transform:translateX(-96%)}.gate.open .door.r{transform:translateX(96%)}
.gate .inside{position:absolute;top:128px;bottom:0;left:22px;right:22px;background:radial-gradient(circle at 50% 40%,#fff9d6,#ffe08a 60%,#ffc94a);display:flex;align-items:center;justify-content:center;text-align:center;font-size:44px;font-weight:800;padding:20px;overflow:hidden}
.gate .lock{position:absolute;top:50%;left:50%;width:150px;height:150px;margin:-40px 0 0 -75px;border-radius:50%;background:rgba(255,255,255,.4);border:6px solid #fff;display:flex;align-items:center;justify-content:center;font-size:80px;transition:transform .6s,opacity .6s;z-index:3}
.gate.open .lock{transform:translateY(-200px) rotate(-30deg);opacity:0}
.gate .tape{position:absolute;left:-20px;right:-20px;top:62%;height:40px;background:repeating-linear-gradient(-45deg,#e8414f 0 30px,#fff 30px 60px);border:4px solid #2b3a55;border-radius:6px;z-index:4;transition:transform .8s,opacity .8s}
.gate.open .tape{transform:translateY(300px) rotate(8deg);opacity:0}
.gate .chev{position:absolute;bottom:40px;font-size:60px;color:#ffcb3d;font-weight:900;z-index:2}
.carpet{position:absolute;bottom:0;height:140px;background:linear-gradient(#e94a5a,#c92f42);clip-path:polygon(18% 0,82% 0,100% 100%,0 100%)}
/* cover card */
.ttlcard{position:absolute;left:50%;top:400px;transform:translateX(-50%) scale(.6);opacity:0;transition:all .9s .5s cubic-bezier(.3,1.4,.5,1);width:820px;padding:40px 50px;text-align:center;background:#fff2f4;border:7px solid #e8798a;border-radius:46px;box-shadow:0 14px 0 rgba(0,0,0,.15);z-index:6}
.ttlcard.on{transform:translateX(-50%) scale(1);opacity:1}
.ttlcard .lbl{display:inline-block;background:#ffd8df;border-radius:18px;padding:2px 26px;font-size:36px;font-weight:700}
.ttlcard .t{font-size:84px;font-weight:800;line-height:1.25;margin-top:14px}
.ttlcard .u{font-size:28px;color:#5b6782;margin-top:6px}
.ttlcard .h{position:absolute;top:-58px;left:50%;transform:translateX(-50%);width:210px;height:60px;border:12px solid #2b3a55;border-bottom:0;border-radius:30px 30px 0 0}
/* goals tickets */
.ticket{position:absolute;left:50%;transform:translateX(-50%);width:1080px;min-height:150px;display:flex;align-items:stretch;border-radius:30px;border:5px solid;box-shadow:0 8px 0 rgba(0,0,0,.12);overflow:hidden;transition:opacity .5s,transform .5s}
.ticket .st{width:120px;flex:none;display:flex;align-items:center;justify-content:center;font-size:56px;color:#fff;border-left:4px dashed rgba(255,255,255,.7)}
.ticket .n{width:110px;flex:none;display:flex;align-items:center;justify-content:center;font-size:66px;font-weight:800;border-left:3px dashed rgba(0,0,0,.18)}
.ticket .tx{flex:1;display:flex;align-items:center;padding:12px 30px;font-size:42px;font-weight:700;line-height:1.4}
.ticket .ic{width:130px;flex:none;display:flex;align-items:center;justify-content:center;font-size:72px}
.ticket.hid{opacity:0;transform:translateX(-50%) translateY(30px)}
/* list rows (tf / enter) */
.row{display:flex;align-items:center;gap:18px;background:#fff6f7;border:5px solid #f0a9b4;border-radius:30px;padding:10px 20px;box-shadow:0 6px 0 rgba(0,0,0,.1);font-size:40px;font-weight:700;transition:transform .7s,opacity .7s}
.row .num{width:64px;height:64px;border-radius:50%;background:#e8414f;color:#fff;display:flex;align-items:center;justify-content:center;font-size:36px;flex:none;border:4px solid #fff;box-shadow:0 0 0 3px #e8414f}
.row .txt{flex:1;line-height:1.35}
.row .ico{font-size:52px}
.yn{display:flex;gap:10px}
.yn button{border:4px solid #2b3a55;border-radius:18px;font-size:30px;font-weight:800;padding:4px 16px;background:#fff}
.yn .y{background:#e3f6e8;border-color:#2fa35a;color:#1d7a40}.yn .n2{background:#fde6e8;border-color:#e05561;color:#b8283a}
.row.gone{transform:translateX(-640px) scale(.3);opacity:0}
/* sort */
.bin{position:absolute;border-radius:30px;border:5px solid;box-shadow:0 8px 0 rgba(0,0,0,.12);padding:12px}
.bin .bh{display:flex;align-items:center;justify-content:center;gap:12px;background:rgba(255,255,255,.75);border:3px dashed rgba(0,0,0,.2);border-radius:20px;font-size:40px;font-weight:800;padding:4px 10px}
.bin .bb{margin-top:10px;min-height:110px;border:3px dashed rgba(0,0,0,.25);border-radius:20px;display:flex;flex-wrap:wrap;gap:8px;padding:8px;align-content:flex-start}
.bin.hot{transform:scale(1.03)}
.dcard{background:#fff8ea;border:5px solid #e2b13c;border-radius:26px;padding:10px 18px;font-size:36px;font-weight:800;text-align:center;box-shadow:0 6px 0 rgba(0,0,0,.12);cursor:grab;touch-action:none;user-select:none;display:inline-flex;align-items:center;gap:10px}
.dcard .e{font-size:44px}
.dcard.sel{outline:6px solid #5fa8ff;outline-offset:3px}
.dcard.drag{position:fixed;z-index:200;pointer-events:none;transform:rotate(-3deg) scale(1.05)}
.bin .dcard{font-size:28px;padding:4px 12px;cursor:default;box-shadow:none}
.bin .dcard .e{font-size:32px}
/* concept cards */
.ccard{position:absolute;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:6px;padding:22px 26px;cursor:pointer;transition:transform .3s}
.ccard:hover{transform:translateY(-4px)}
.ccard .hd{font-size:46px;font-weight:800;line-height:1.3}
.ccard .bd{font-size:36px;font-weight:600;line-height:1.45;transition:opacity .4s,max-height .5s;overflow:hidden}
.ccard.closed .bd{opacity:0;max-height:0}
.ccard .q{font-size:24px;opacity:.6}
.ccard:not(.closed) .q{display:none}
/* picture */
.pic{position:absolute;background:#fff;border:6px solid #2b3a55;border-radius:22px;box-shadow:0 10px 0 rgba(0,0,0,.18);overflow:hidden;display:flex;align-items:center;justify-content:center}
.pic img{max-width:100%;max-height:100%;display:block}
.pin{position:absolute;width:62px;height:62px;margin:-31px 0 0 -31px;border-radius:50%;background:#e8414f;color:#fff;font-size:32px;font-weight:800;border:5px solid #fff;box-shadow:0 0 0 4px #e8414f,0 6px 12px rgba(0,0,0,.3);display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:3;animation:pulse 1.8s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 10px rgba(232,65,79,.35),0 6px 12px rgba(0,0,0,.3)}}
.pin.done{background:#2fa35a;box-shadow:0 0 0 4px #2fa35a;animation:none}
.plabel{position:absolute;background:#fffaf0;border:4px solid #e3b45a;border-radius:16px;padding:2px 14px;font-size:28px;font-weight:800;white-space:nowrap;z-index:4;transform:translate(-50%,40px);box-shadow:0 4px 0 rgba(0,0,0,.12)}
.qbub{position:absolute;background:#fff;border:5px solid #5fa8ff;border-radius:30px;padding:16px 26px;font-size:38px;font-weight:700;line-height:1.4;box-shadow:0 8px 0 rgba(0,0,0,.12)}
.qbub .ans{margin-top:10px;padding-top:10px;border-top:3px dashed #9cc4f5;color:#1d7a40;display:none}
.qbub.on .ans{display:block;animation:pop .4s}
.qbub .rv{display:inline-block;margin-top:8px;font-size:26px;border:3px solid #5fa8ff;background:#eaf3ff;color:#2a5ea8;border-radius:14px;padding:0 16px}
.qbub.on .rv{display:none}
/* steps */
.steps{position:absolute;display:flex;flex-direction:column;gap:14px}
.step{display:flex;align-items:center;gap:16px;background:#fff;border:5px solid #9cc4f5;border-radius:26px;padding:10px 20px;font-size:36px;font-weight:700;line-height:1.35;box-shadow:0 6px 0 rgba(0,0,0,.1);transition:opacity .4s,transform .4s}
.step .sn{width:58px;height:58px;flex:none;border-radius:50%;background:#5fa8ff;color:#fff;display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:800}
.step.hid{opacity:0;transform:translateY(16px)}
/* mcq */
.opts{position:absolute;display:grid;grid-template-columns:1fr 1fr;gap:22px}
.opt{display:flex;align-items:center;gap:16px;border:5px solid #2b3a55;border-radius:28px;padding:16px 22px;font-size:40px;font-weight:800;color:#fff;text-align:start;box-shadow:0 8px 0 rgba(0,0,0,.2);min-height:120px;line-height:1.3}
.opt .sh{font-size:40px;width:60px;flex:none;text-align:center;opacity:.9}
.opt.o0{background:#e8586a}.opt.o1{background:#4f8fdf}.opt.o2{background:#e7a92d}.opt.o3{background:#3fa66a}
.opt.okc{background:#2fa35a!important;color:#fff;outline-color:#fff}
.opt.noc{background:#9aa3b5!important;color:#fff}
.opt.dim{opacity:.35}
.qcard{position:absolute;left:50%;transform:translateX(-50%);background:#fff;border:6px solid #2b3a55;border-radius:34px;padding:22px 34px;text-align:center;font-size:48px;font-weight:800;line-height:1.4;box-shadow:0 10px 0 rgba(0,0,0,.15)}
.why{position:absolute;left:50%;transform:translateX(-50%);background:#e8f8ee;border:4px solid #2fa35a;border-radius:22px;padding:8px 24px;font-size:30px;font-weight:700;color:#1d6b3a;display:none;max-width:1300px;text-align:center}
.why.on{display:block;animation:pop .4s}
/* tf */
.tfbtn{width:96px;height:80px;border-radius:22px;border:5px solid #2b3a55;font-size:46px;font-weight:900;background:#fff}
.tfbtn.t{color:#1d7a40}.tfbtn.f{color:#c22d40}
/* match */
.mcol{position:absolute;display:flex;flex-direction:column;gap:16px}
.mitem{background:#fff;border:5px solid #9cc4f5;border-radius:24px;padding:10px 18px;font-size:34px;font-weight:800;text-align:center;box-shadow:0 6px 0 rgba(0,0,0,.1);min-height:84px;display:flex;align-items:center;justify-content:center;line-height:1.3}
.mitem.sel{outline:6px solid #ffb703;outline-offset:3px}
.mitem.m0{background:#ffe1e5;border-color:#e8798a}.mitem.m1{background:#dcecff;border-color:#6aa2e8}.mitem.m2{background:#fff1c9;border-color:#e2b13c}.mitem.m3{background:#dff3e0;border-color:#5fb873}.mitem.m4{background:#ece4ff;border-color:#9b84e6}.mitem.m5{background:#ffe6d5;border-color:#f0965f}
svg.lines{position:absolute;inset:0;pointer-events:none;z-index:1}
/* order */
.olist{position:absolute;display:flex;flex-direction:column;gap:14px}
.oitem{display:flex;align-items:center;gap:16px;background:#fff;border:5px solid #c9b6f2;border-radius:24px;padding:8px 18px;font-size:36px;font-weight:700;box-shadow:0 6px 0 rgba(0,0,0,.1);cursor:pointer;line-height:1.3}
.oitem .on{width:56px;height:56px;flex:none;border-radius:16px;background:#9b84e6;color:#fff;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:800}
.oitem.sel{outline:6px solid #ffb703;outline-offset:3px}
.chk{position:absolute;left:50%;transform:translateX(-50%);border:5px solid #2b3a55;background:#ffcb3d;border-radius:22px;padding:6px 40px;font-size:36px;font-weight:800;box-shadow:0 6px 0 rgba(0,0,0,.2)}
/* fill */
.ftext{position:absolute;left:50%;transform:translateX(-50%);background:#fff;border:6px solid #2b3a55;border-radius:30px;padding:26px 36px;font-size:46px;font-weight:700;line-height:2;text-align:center;box-shadow:0 10px 0 rgba(0,0,0,.15)}
.blank{display:inline-block;min-width:200px;border-bottom:5px dashed #5fa8ff;color:#2a5ea8;text-align:center;padding:0 10px;cursor:pointer;line-height:1.4}
.blank.okc{border-bottom-color:#2fa35a;outline:0!important;background:none!important;color:#1d7a40}
.bank{position:absolute;left:50%;transform:translateX(-50%);display:flex;flex-wrap:wrap;gap:16px;justify-content:center}
.chip{background:#fff1c9;border:5px solid #e2b13c;border-radius:22px;padding:6px 22px;font-size:36px;font-weight:800;box-shadow:0 6px 0 rgba(0,0,0,.12)}
.chip.sel{outline:6px solid #5fa8ff;outline-offset:3px}
.chip.used{opacity:.3;pointer-events:none}
/* memory */
.mem{position:absolute;display:grid;gap:18px}
.mcard{perspective:900px;cursor:pointer}
.mcard .in{position:relative;width:100%;height:100%;transition:transform .6s;transform-style:preserve-3d}
.mcard.f .in,.mcard.done .in{transform:rotateY(180deg)}
.mcard .fr,.mcard .bk{position:absolute;inset:0;backface-visibility:hidden;border-radius:24px;border:5px solid #2b3a55;display:flex;align-items:center;justify-content:center;text-align:center;padding:8px;box-shadow:0 6px 0 rgba(0,0,0,.15)}
.mcard .fr{background:repeating-linear-gradient(45deg,#5fa8ff 0 18px,#79b8ff 18px 36px);font-size:60px;color:#fff}
.mcard .bk{background:#fff;transform:rotateY(180deg);font-size:30px;font-weight:800;line-height:1.3}
.mcard.done .bk{background:#e3f6e8;border-color:#2fa35a}
/* wheel */
.wheelw{position:absolute;width:600px;height:600px}
.wheel{width:100%;height:100%;border-radius:50%;border:10px solid #2b3a55;transition:transform 4s cubic-bezier(.15,.85,.25,1);box-shadow:0 12px 0 rgba(0,0,0,.18)}
.wptr{position:absolute;top:-24px;left:50%;margin-left:-28px;width:0;height:0;border-left:28px solid transparent;border-right:28px solid transparent;border-top:60px solid #e8414f;z-index:3;filter:drop-shadow(0 4px 0 rgba(0,0,0,.25))}
.whub{position:absolute;top:50%;left:50%;width:120px;height:120px;margin:-60px;border-radius:50%;background:#ffcb3d;border:8px solid #2b3a55;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:900;cursor:pointer;z-index:2}
/* race */
.track{position:absolute;left:60px;right:60px;display:flex;flex-direction:column;gap:12px}
.lane{position:relative;height:78px;border-radius:40px;background:#fff;border:5px solid #2b3a55;overflow:hidden;cursor:pointer}
.lane .fill{position:absolute;top:0;bottom:0;right:0;transition:width .8s}
.lane .car{position:absolute;top:50%;transform:translate(50%,-50%) scaleX(-1);font-size:56px;transition:right .8s}
.lane .nm{position:absolute;top:50%;right:20px;transform:translateY(-50%);font-size:28px;font-weight:800;z-index:2;mix-blend-mode:multiply}
.lane .fin{position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:46px}
.lane.turn{outline:6px solid #ffb703;outline-offset:3px}
/* boxes */
.boxes{position:absolute;display:grid;gap:22px}
.gbox{position:relative;border-radius:26px;border:5px solid #2b3a55;box-shadow:0 8px 0 rgba(0,0,0,.18);cursor:pointer;display:flex;align-items:center;justify-content:center;text-align:center;padding:12px;font-size:32px;font-weight:800;line-height:1.35;transition:transform .3s}
.gbox .lid{position:absolute;inset:0;border-radius:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:64px;transition:transform .6s,opacity .6s;z-index:2}
.gbox .lid small{font-size:34px;color:#fff;font-weight:800}
.gbox.open .lid{transform:translateY(-60px) rotate(-12deg);opacity:0;pointer-events:none}
.gbox .a{display:none;color:#1d7a40;margin-top:6px}
.gbox.ans .a{display:block}
/* mind map */
.mm{position:absolute;inset:0}
.mm .center{position:absolute;left:50%;top:520px;transform:translate(-50%,-50%);width:360px;min-height:150px;border-radius:50%;background:#ffcb3d;border:7px solid #2b3a55;display:flex;align-items:center;justify-content:center;text-align:center;font-size:44px;font-weight:900;padding:20px;box-shadow:0 10px 0 rgba(0,0,0,.18);z-index:2}
.mm .br{position:absolute;transform:translate(-50%,-50%);width:400px;padding:14px 18px;font-size:32px;font-weight:700;text-align:center;line-height:1.35;cursor:pointer;z-index:2}
.mm .br.closed{color:transparent}
.mm .br.closed:after{content:"؟";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#2b3a55;font-size:54px}
/* compare */
.cmp{position:absolute;display:flex;gap:30px}
.cmp .side{flex:1;padding:20px 26px}
.cmp .side h3{margin:0 0 10px;font-size:44px;text-align:center}
.cmp .side li{font-size:34px;font-weight:700;line-height:1.5;margin:6px 0;list-style:none;transition:opacity .4s}
.cmp .side li.hid{opacity:0}
.cmp .side li:before{content:"◆ ";color:rgba(0,0,0,.35)}
/* flip */
.flips{position:absolute;display:grid;gap:26px}
.flip{perspective:1000px;cursor:pointer}
.flip .in{position:relative;width:100%;height:100%;transition:transform .7s;transform-style:preserve-3d}
.flip.f .in{transform:rotateY(180deg)}
.flip .fr,.flip .bk{position:absolute;inset:0;backface-visibility:hidden;border-radius:30px;border:6px solid;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:16px;box-shadow:0 8px 0 rgba(0,0,0,.14)}
.flip .fr .e{font-size:84px}.flip .fr .t{font-size:44px;font-weight:900;line-height:1.25}.flip .fr .en2{font-size:30px;color:#3b4f72;font-weight:700;direction:ltr}
.flip .bk{transform:rotateY(180deg);background:#fff;font-size:34px;font-weight:700;line-height:1.45}
/* timer (try) */
.timer{position:absolute;width:250px;height:250px}
.timer svg{width:100%;height:100%;transform:rotate(-90deg)}
.timer .tv{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:62px;font-weight:900}
.timer .tv small{font-size:22px}
.timer button{position:absolute;bottom:-62px;left:50%;transform:translateX(-50%);border:4px solid #2b3a55;border-radius:16px;background:#ffcb3d;font-size:26px;font-weight:800;padding:2px 22px;white-space:nowrap}
/* exit ticket */
.exit{position:absolute;display:flex;gap:26px}
.exit .xc{flex:1;padding:22px;text-align:center;cursor:pointer}
.exit .xc .k{font-size:90px;font-weight:900;line-height:1}
.exit .xc .p{font-size:34px;font-weight:800;line-height:1.4;margin-top:8px}
/* homework */
.hwc{position:absolute;left:50%;transform:translateX(-50%) rotate(-1deg);width:1080px;background:#fffef6;border:6px solid #2b3a55;border-radius:20px;padding:30px 50px 34px;box-shadow:0 12px 0 rgba(0,0,0,.18);background-image:repeating-linear-gradient(transparent 0 62px,#cfe3f3 62px 64px)}
.hwc h3{margin:0 0 6px;font-size:50px;color:#d6344f}
.hwc li{font-size:38px;font-weight:700;line-height:64px}
.hwc .pin2{position:absolute;top:-28px;left:50%;font-size:56px;transform:translateX(-50%)}
.mascot{position:absolute;width:300px;height:300px;pointer-events:none}
.mascot svg{width:100%;height:100%;overflow:visible}
.say{position:absolute;background:#fff;border:5px solid #2b3a55;border-radius:28px;padding:10px 22px;font-size:32px;font-weight:800;line-height:1.35;box-shadow:0 6px 0 rgba(0,0,0,.14)}
.periodcard{position:absolute;left:50%;top:210px;transform:translateX(-50%);width:1000px;text-align:center;padding:36px}
.periodcard .pn{font-size:100px;font-weight:900;color:#d6344f;line-height:1.1}
.periodcard .ax{font-size:44px;font-weight:800;margin-top:12px;line-height:1.35}

/* live web editor (R.web, G10) */
.webed,.webpv{position:absolute;border-radius:22px;overflow:hidden;box-shadow:0 10px 0 rgba(0,0,0,.14);display:flex;flex-direction:column;z-index:4}
.webed{background:#1f2433;border:5px solid #3b4566}
.webpv{background:#fff;border:5px solid var(--gold);transition:all .35s}
.webpv.big{left:50px!important;width:1500px!important;z-index:9}
.webed .bar,.webpv .bar{display:flex;align-items:center;gap:14px;padding:8px 16px;font-size:24px;font-weight:700}
.webed .bar{background:#2c3349;color:#c9d3f0}.webpv .bar{background:#f2ece0;color:#5b6782}
.webed .dots i{display:inline-block;width:14px;height:14px;border-radius:50%;margin-left:6px;background:#ff6b6b}.webed .dots i:nth-child(2){background:#ffd166}.webed .dots i:nth-child(3){background:#6ccf8e}
.webed .fn{direction:ltr;font-family:Consolas,'Courier New',monospace;color:#ffd166}.webed .lb,.webpv .lb{margin-inline-start:auto;white-space:nowrap}
.webpv .url{flex:1;direction:ltr;text-align:left;background:#fff;border-radius:14px;padding:2px 14px;font-size:20px;font-family:Consolas,'Courier New',monospace;color:#3b4566;overflow:hidden;white-space:nowrap}
.webed textarea{flex:1;width:100%;border:0;outline:0;resize:none;background:transparent;color:#e8edff;caret-color:#ffd166;font:600 25px/1.45 Consolas,'Courier New',monospace;padding:14px 18px;direction:ltr;text-align:left;white-space:pre;tab-size:2}
.webpv iframe{flex:1;width:100%;border:0;background:#fff}
.webbt{position:absolute;display:flex;gap:14px;z-index:5}
.webbt button{font:700 24px 'Baloo Bhaijaan 2',sans-serif;padding:4px 22px;border-radius:18px;border:4px solid #3b4566;background:#fffaf0;color:#2c3349;cursor:pointer;box-shadow:0 5px 0 rgba(0,0,0,.12)}
.webbt button.sol{border-color:#e2b13c;background:#fff4d6}
/* ===== deck2 additions ===== */
.dots{position:absolute;bottom:22px;left:50%;transform:translateX(-50%);display:flex;gap:12px;z-index:6}
.dots i{width:22px;height:22px;border-radius:50%;background:#fff;border:4px solid #2b3a55;transition:.3s}
.dots i.c{background:#ffcb3d;transform:scale(1.35)}
.dots i.d{background:#6ccf8e}
.qn{font-size:24px;color:#5b6782;font-weight:700;margin-bottom:4px}
.askb{min-height:260px;line-height:1.45;padding:26px 40px;display:flex;flex-direction:column;justify-content:center}
.askb .ans{font-size:.9em}
.blank.qb{display:inline-block;min-width:150px;border-bottom:6px solid #e2b13c;color:#c0902c;padding:0 14px;margin:0 6px}
.blank.qb.okc{color:#1d7a40;border-color:#2fa35a;background:#e9fbef;border-radius:12px}
.readc{position:absolute;background:#fffdf6;border:5px solid #e2b13c;border-radius:30px;padding:24px 40px 24px;box-shadow:0 8px 0 rgba(0,0,0,.12);line-height:1.7;font-weight:600;max-height:690px;overflow:hidden}
.readc p{margin:0 0 12px;transition:opacity .4s,background .4s;border-radius:14px;padding:2px 10px}
.readc p.dim2{opacity:.28}
.readc p.cur{background:#fff3c4}
.readc.listen p.dim2{opacity:1;filter:blur(9px)}
.readc.quran{font-family:'Amiri','Noto Naskh Arabic',serif;line-height:2}

le", "title": "What chart am I?", "items": [{"clues": ["I am round.", "I am divided into slices.", "My slices show percentages."], "a": "a pie chart", "emo": "🥧"}, {"clues": ["I have bars.", "My bars stand up from the bottom.", "Patrick's family chart is like me."], "a": "a column chart", "emo": "📊"}, {"clues": ["I have points.", "Lines join my points.", "I show changes over time."], "a": "a line graph", "emo": "📈"}, {"clues": ["I have bars too.", "But my bars lie down from left to right.", "I am horizontal."], "a": "a bar chart", "emo": "📶"}], "icon": "🤔"}, {"type": "match", "title": "Match the charts", "pairs": [["Chart 1 (vertical bars)", "Column Chart"], ["Chart 2 (points and lines)", "Line Graph"], ["Chart 3 (horizontal bars)", "Bar Chart"], ["Chart 4 (a circle in slices)", "Pie Chart"]], "icon": "🧩"}, {"type": "ask", "title": "Read and answer", "qs": [{"q": "1 What do the two pie charts show?", "a": "Social media used by men and women, aged 18–24 years, in the USA, in 2018."}, {"q": "2 What is the most popular type of social media for both men and women?", "a": "Facebook (39% of men, 40% of women)."}, {"q": "3 What is the least popular type for both?", "a": "WhatsApp (9% of men, 10% of women)."}, {"q": "4 Do the pie charts show any significant difference?", "a": "Yes: Snapchat (11% men, 21% women) and Twitter (22% men, 9% women)."}], "img": "L05_c1", "icon": "🥧"}, {"type": "quiz", "title": "Read the numbers", "icon": "✏️", "qs": [{"q": "Facebook: men ___ , women 40%", "o": ["39%", "22%", "9%"], "a": 0}, {"q": "Instagram: men 19%, women ___", "o": ["20%", "10%", "21%"], "a": 0}, {"q": "Snapchat: men 11%, women ___", "o": ["21%", "9%", "40%"], "a": 0}, {"q": "Twitter: men ___ , women 9%", "o": ["22%", "11%", "19%"], "a": 0}, {"q": "WhatsApp: men 9%, women ___", "o": ["10%", "20%", "39%"], "a": 0}]}, {"type": "read", "title": "The summary", "paras": ["The two pie charts [[illustrate]] the social media platforms used by men and women in the USA, aged 18 – 24 years, in 2018. (1) [[Overall]], Facebook is the most popular social media platform for both [[genders]], with 40% of women and 39% of men using the website. (2) The least popular type of social media for young people in this age group is WhatsApp with only 9% of men and 10% of women using the application. (3)"], "img": "L05_c3", "icon": "📖"}, {"type": "read", "title": "The summary", "paras": ["Instagram is also used fairly equally by both men and women, with 19% and 20% [[respectively]] using the application. The most [[significant]] difference in social media preference between men and women is seen with Snapchat and Twitter. Snapchat is more popular with women than men, with 21% of women using it compared with only 11% of men. [[In contrast]], Twitter is not as popular as Snapchat with women. Only 9% of women use Twitter, [[whereas]] 22% of men use it. (4-8)"], "img": "L05_c3", "icon": "📖"}, {"type": "read", "title": "The summary", "paras": ["Overall, social media use between young men and women in the USA in 2018 is fairly similar. The most significant difference between the genders is seen with the use of Snapchat and Twitter. (9)"], "img": "L05_c3", "icon": "📖"}, {"type": "ask", "title": "About the summary", "qs": [{"q": "1 Which three main pieces of data are discussed?", "a": "The most popular platform (Facebook), the least popular (WhatsApp) and the significant differences (Snapchat and Twitter)."}, {"q": "2 How is the data from the charts used?", "a": "Percentages are used to support each comparison."}, {"q": "3 What tense is the summary written in?", "a": "The present simple (is, use, is seen)."}, {"q": "4 Has the author included their opinion?", "a": "No. A summary only describes the data."}], "icon": "💡"}, {"type": "match", "title": "Sentences and their jobs", "pairs": [["Sentence (1)", "b) an introductory sentence – overview"], ["Sentence (2)", "e) the highest proportion"], ["Sentence (3)", "c) the lowest proportion"], ["Sentences (4–8)", "a) analysis of det mperature in 2001–2010:", "o": ["14.47 °C", "13.59 °C"], "a": 0}], "icon": "🕵️"}, {"type": "ask", "title": "Discuss the chart", "qs": [{"q": "1 What does the chart show?", "a": "The average global temperature for every ten years from 1881 to 2010. It rose from 13.68 °C to 14.47 °C."}, {"q": "2 What do you think is causing this trend?", "a": "Human activity: burning fossil fuels and producing greenhouse gases."}, {"q": "When did the temperature start to rise very quickly?", "a": "After 1981 – the red bars: 14.12, 14.26, 14.47."}], "img": "L09_c1", "icon": "📈"}, {"type": "read", "title": "Climate Change (1–2)", "paras": ["1 Climate change is an issue that affects every country in the world. When we talk about climate change we are referring to changes in the Earth's weather, in particular [[global warming]] or the increase in the planet's temperature."], "img": "L09_c2", "icon": "📖"}, {"type": "read", "title": "Climate Change (1–2)", "paras": ["2 In the last 200 years, human activity has resulted in excessive amounts of [[greenhouse gases]] being produced. When people burn [[fossil fuels]], such as coal, oil and gas they release the greenhouse gas, carbon dioxide into the [[atmosphere]]. Methane, another greenhouse gas is produced by bacteria in landfill sites and from modern agriculture. These gases trap heat in the atmosphere, just like the glass walls of a greenhouse trap the sun's heat. This is causing the Earth's temperature to rise."], "img": "L09_c2", "icon": "📖"}, {"type": "read", "title": "Climate Change (3)", "paras": ["3 Climate change is having a devastating effect on our planet. We are experiencing longer and more [[extreme]] heat waves. In some areas, farmers cannot grow crops or find suitable land for their animals because of droughts. If temperatures continue to rise, many plants and animals will not be able to survive. In other areas, climate change is causing heavier rainfall and severe floods. In addition, many cities and countries located at sea-level are at risk from flooding due to rising sea levels caused by melting ice caps and glaciers. If we do not take action, these problems will probably get worse."], "img": "L09_c2", "icon": "📖"}, {"type": "read", "title": "Climate Change (4–5)", "paras": ["4 If we want to reduce climate change, we must reduce our 'carbon footprint' which is the amount of greenhouse gases we [[release]] into the atmosphere. Small changes in our daily lives can make a big difference. For example, we can turn off lights and electronic devices when we are not using them, walk or ride a bike instead of travelling by car, take shorter showers to save water, use reusable bags instead of plastic bags and recycle our waste."], "img": "L09_c2", "icon": "📖"}, {"type": "read", "title": "Climate Change (4–5)", "paras": ["5 Climate change is a serious threat to our planet. Some people think that governments have to solve climate change but fighting climate change should be considered everyone's responsibility. As it is caused by human actions, we must all take action to stop it."], "img": "L09_c2", "icon": "📖"}, {"type": "match", "title": "Paragraphs and subheadings", "pairs": [["Paragraph 1", "d) What is climate change?"], ["Paragraph 2", "b) What causes climate change?"], ["Paragraph 3", "e) What are the effects of climate change?"], ["Paragraph 4", "c) How can we stop climate change?"], ["Paragraph 5", "a) What is our responsibility?"]], "icon": "🧩"}, {"type": "quiz", "title": "Read and choose", "qs": [{"q": "1 The Earth is getting hotter because there are more …", "o": ["greenhouses on Earth", "greenhouse gases in the atmosphere", "ice caps melting"], "a": 1}, {"q": "2 Greenhouse gases are produced by …", "o": ["the atmosphere", "trapped heat", "burning fossil fuels and bacteria"], "a": 2}, {"q": "3 The metaphor compares greenhouse gases to …", "o": ["the glass walls of a greenhouse", "growing plants in a greenhouse", "the sun's heat"], "a": 0}, {"q": "4 Countries and cities at sea-level are at risk from …", "o": ["heat waves", "droughts", "floods"], "a": 2}, {"q": "5 If we do not stop climate change, there will be …", "o": ["more animals and plants", "serious consequences", "small changes"], "a": 1}], "icon": "✅"}, {"type": "explain", "title": "Meaning from context", "lines": ["To help infer the meaning of a word from the context, look at the information in the sentence around the word."], "img": "L09_c3", "rule": "Look before and after the word!", "icon": "🔍"}, {"type": "flip", "title": "Meaning from context 🔍 – examples", "cards": [{"front": "When people burn [[fossil fuels]], [[such as coal, oil and gas]] …", "icon": "💡", "back": "examples explain the word"}, {"front": "… the increase in the planet's temperature = [[global warming]]", "icon": "✨", "back": "‘or’ gives the meaning"}, {"front": "These gases trap heat … [[just like]] the glass walls of a greenhouse", "icon": "🔎", "back": "a comparison (metaphor)"}]}, {"type": "ask", "title": "Read and think", "qs": [{"q": "global warming (example)", "a": "an increase in temperatures on Earth"}, {"q": "greenhouse gases", "a": "gases like carbon dioxide and methane that trap heat in the atmosphere"}, {"q": "fossil fuels", "a": "fuels such as coal, oil and gas that we burn for energy"}], "icon": "💭"}, {"type": "ask", "title": "Read and think", "qs": [{"q": "atmosphere", "a": "the layer of air around the Earth"}, {"q": "extreme", "a": "very strong or severe, much more than usual"}, {"q": "release", "a": "to let something go out, e.g. gases into the air"}], "icon": "💭"}, {"type": "sort", "title": "Causes, effects or solutions?", "bins": [{"label": "Causes", "icon": "🔥"}, {"label": "Effects", "icon": "🌊"}, {"label": "Solutions", "icon": "✅"}], "cards": [{"text": "burning coal, oil and gas", "icon": "", "bin": 0}, {"text": "severe floods", "icon": "", "bin": 1}, {"text": "bacteria in landfill sites", "icon": "", "bin": 0}, {"text": "droughts", "icon": "", "bin": 1}, {"text": "reusable bags", "icon": "", "bin": 2}, {"text": "modern agriculture", "icon": "", "bin": 0}, {"text": "recycle our waste", "icon": "", "bin": 2}, {"text": "rising sea levels", "icon": "", "bin": 1}, {"text": "ride a bike", "icon": "", "bin": 2}, {"text": "turn off lights", "icon": "", "bin": 2}], "icon": "🗂️"}, {"type": "tf", "title": "True or false?", "items": [{"text": "Climate change affects only a few countries.", "a": false, "fix": "It is an issue that affects every country in the world."}, {"text": "Methane is produced by bacteria in landfill sites.", "a": true, "fix": "Methane … is produced by bacteria in landfill sites and from modern agriculture."}, {"text": "Your carbon footprint is the amount of greenhouse gases you release.", "a": true, "fix": "… the amount of greenhouse gases we release into the atmosphere."}, {"text": "Small changes in our daily lives make no difference.", "a": false, "fix": "Small changes in our daily lives can make a big difference."}], "icon": "✔✘"}, {"type": "ask", "title": "Everyone's responsibility?", "qs": [{"q": "‘… fighting climate change should be considered everyone's responsibility.’ Do you agree or disagree?", "a": "I agree, because climate change is caused by human actions, so we must all take action."}, {"q": "What can governments do?", "a": "They can make laws, build solar and wind power plants and improve public transport."}, {"q": "What can you do at home and at school?", "a": "I can turn off lights, take shorter showers, use reusable bags and recycle."}], "icon": "💬"}, {"type": "wheel", "title": "My carbon footprint", "items": [{"q": "Do you turn off the lights when you leave a room?", "a": "Yes, always. / Sometimes I forget."}, {"q": "How do you go to school?", "a": "I go by school bus – it is better than going by car."}, {"q": "How long are your showers?", "a": "About five minutes."}, {"q": "Does your family use reusable bags?", "a": "Yes, we take cloth bags to the supermarket."}, {"q": "What do you recycle at home?", "a": "We recycle plastic bottles and paper."}, {"q": "What is one change you can make this week?", "a": "I will walk to the mosque instead of going by car."}], "icon": "🎡"}, {"type": "race", "title": "Team race", "qs": [{"q": "Carbon dioxide is released when people burn …", "options": ["fossil fuels", "water", "ice"], "a": 0}, {"q": "Greenhouse gases trap …", "options": ["heat", "rain", "light bulbs"], "a": 0}, {"q": "Paragraph 4 answers:", "options": ["How can we stop climate change?", "What causes climate change?"], "a": 0}, {"q": "‘release’ means …", "options": ["let out", "keep in"], "a": 0}, {"q": "Cities at sea-level are at risk from …", "options": ["floods", "droughts"], "a": 0}, {"q": "Fighting climate change is …", "options": ["everyone's responsibility", "only governments' job"], "a": 0}], "icon": "🏎️"}, {"type": "steps", "title": "Let's remember!", "icon": "🧠", "steps": ["Global temperature rose from 13.68 °C (1881–1890) to 14.47 °C (2001–2010).", "Cause: greenhouse gases (carbon dioxide, methane) trap heat like a greenhouse.", "Effects: heat waves, droughts, floods, rising sea levels.", "Reduce your carbon footprint – it is everyone's responsibility."]}, {"type": "exit", "title": "Exit ticket", "items": [{"k": "3", "text": "What is a carbon footprint?"}, {"k": "2", "text": "Give two causes and two effects of climate change."}, {"k": "1", "text": "Write one thing you will do to reduce your carbon footprint."}], "icon": "🎟️"}, {"type": "homework", "title": "Homework", "head": "My homework", "items": ["Complete the Act. 4 table (CB p. 15) in your exercise book.", "Write 5 sentences: agree or disagree – ‘Fighting climate change is everyone's responsibility.’", "Make a poster: five ways to reduce your carbon footprint."], "icon": "🏠"}]}, {"id": "L10", "unit": "U2", "unitName": "Unit 2 · Climate Change", "title": "Grammar: Cause & Effect, Compound Nouns", "code": "", "theme": "city", "emo": "🐻‍❄️", "slides": [{"type": "cover"}, {"type": "goals", "title": "Today's goals", "items": ["I can tell the difference between a cause and an effect.", "I can link cause and effect with so, therefore, consequently, due to, because of, as a result of …"], "icon": "🎯"}, {"type": "goals", "title": "Today's goals", "items": ["I can recognise and form compound nouns.", "I can play a compound noun picture game."], "icon": "🎯"}, {"type": "ask", "title": "What happens when …?", "qs": [{"q": "What happens when global temperatures rise?", "a": "The Arctic sea ice melts."}, {"q": "What happens to polar bears when the ice melts?", "a": "It is harder for them to survive, so many polar bears are dying."}, {"q": "What happens when we leave the lights on all day?", "a": "We use more electricity and release more greenhouse gases."}], "icon": "🤔"}, {"type": "explain", "title": "Cause or effect?", "lines": ["We often link cause and effect.", "The cause is what happens. e.g. global temperatures are rising", "The effect is the result, e.g. the Arctic sea ice is melting"], "img": "L10_c1", "rule": "cause ➜ effect", "icon": "📌"}, {"type": "flip", "title": "Cause or effect? 📌 – examples", "cards": [{"front": "[[Cause]] (What makes something happen?)", "icon": "💡", "back": "🔥"}, {"front": "[[Effect]] (The result)", "icon": "✨", "back": "💥"}]}, {"type": "ask", "title": "Read and complete", "qs": [{"q": "(1) cause → Arctic sea ice melting at a rate of 9% per decade", "a": "Global temperatures are rising. (Grammar Focus)"}, {"q": "Melting ice → (2) effect", "a": "Many polar bears are dying. (Grammar Focus)"}, {"q": "(3), (4), (5), (6) – turtles and koalas", "a": "These come from the texts on page 12 of the Skills Book. Use them if you have the Skills Book."}], "img": "L10_c2", "icon": "📋"}, {"type": "explain", "title": "Cause first ➜ effect", "lines": ["Sometimes we write the cause first.", "Use: consequently / therefore / so", "Or: One consequence of / One result of / One effect of + cause, is + effect."], "img": "L10_c1", "rule": "cause + so / therefore / consequently + effect", "icon": "📌"}, {"type": "flip", "title": "Cause first ➜ effect 📌 – examples", "cards": [{"front": "As the ice melts, it is harder for polar bears to survive [[therefore]] many polar bears are dying.", "icon": "💡", "back": "consequently / therefore / so"}, {"front": "[[One consequence of]] melting ice, is many polar bears are dying.", "icon": "✨", "back": "One result of / One effect of"}]}, {"type": "explain", "title": "Effect first ⬅ cause", "lines": ["Sometimes we write the effect first.", "Use: due to / because of / as a result of + noun"], "img": "L10_c1", "rule": "effect + due to / because of / as a result of + cause", "icon": "📌"}, {"type": "flip", "title": "Effect first ⬅ cause 📌 – examples", "cards": [{"front": "Polar bears are dying [[due to]] melting ice.", "icon": "💡", "back": "effect ⬅ cause"}, {"front": "Polar bears are dying [[because of]] melting ice.", "icon": "✨", "back": "effect ⬅ cause"}, {"front": "Polar bears are dying [[as a result of]] melting ice.", "icon": "🔎", "back": "effect ⬅ cause"}]}, {"type": "sort", "title": "Which order?", "bins": [{"label": "cause ➜ effect", "icon": ""}, {"label": "effect ⬅ cause", "icon": ""}], "cards": [{"text": "so", "icon": "", "bin": 0}, {"text": "therefore", "icon": "", "bin": 0}, {"text": "consequently", "icon": "", "bin": 0}, {"text": "One result of …, is …", "icon": "", "bin": 0}, {"text": "One effect of …, is …", "icon": "", "bin": 0}, {"text": "due to", "icon": "", "bin": 1}, {"text": "because of", "icon": "", "bin": 1}, {"text": "as a result of", "icon": "", "bin": 1}], "icon": "🗂️"}, {"type": "match", "title": "Causes and effects from the text", "pairs": [["People burn fossil fuels.", "Carbon dioxide goes into the atmosphere."], ["Gases trap heat in the atmosphere.", "The Earth's temperature rises."], ["There are droughts.", "Farmers cannot grow crops."], ["Ice caps and glaciers melt.", "Sea levels rise."], ["Sea levels rise.", "Cities at sea-level are at risk from flooding."]], "icon": "🧩"}, {"type": "quiz", "title": "Choose the connector", "icon": "✏️", "qs": [{"q": "People burn fossil fuels; ___, carbon dioxide is released into the atmosphere.", "o": ["therefore", "because of", "due to"], "a": 0}, {"q": "Farmers cannot grow crops ___ droughts.", "o": ["because of", "so", "therefore"], "a": 0}, {"q": "Cities are at risk from flooding ___ rising sea levels.", "o": ["due to", "so", "consequently"], "a": 0}, {"q": "The ice caps are melting, ___ sea levels are rising.", "o": ["so", "due to", "because of"], "a": 0}, {"q": "One ___ of climate change is more extreme heat waves.", "o": ["result", "because", "so"], "a": 0}, {"q": "Many animals die ___ eating plastic.", "o": ["as a result of", "therefore", "so"], "a": 0}]}, {"type": "build", "title": "Build the sentence", "mode": "words", "items": [{"a": "Polar bears are dying because of melting ice.", "hint": "because of / Polar bears are dying / melting ice.", "emo": "🐻‍❄️"}, {"a": "Global temperatures are rising, so the Arctic sea ice is melting.", "hint": "so / Global temperatures are rising, / the Arctic sea ice is melting.", "emo": "🌡️"}, {"a": "One effect of droughts is that farmers cannot grow crops.", "hint": "One effect of droughts / farmers cannot grow crops. / is that", "emo": "🏜️"}], "icon": "🧱"}, {"type": "quiz", "title": "Guess the compound noun", "qs": [{"q": "1 🦶 + ⚽", "o": ["football", "footprint", "handball"], "a": 0}, {"q": "2 🧊 + 🧢", "o": ["ice cream", "ice cap", "ice hat"], "a": 1}, {"q": "3 🔥 + 👨", "o": ["fireman", "fireplace", "firework"], "a": 0}, {"q": "4 🦴 fossil + ⛽ fuel", "o": ["fossil fuel", "fuel tank", "oil field"], "a": 0}, {"q": "5 ☕ tea + 👜 bag", "o": ["teabag", "teacup", "handbag"], "a": 0}, {"q": "6 🏡 greenhouse + 🛢️ gas", "o": ["greenhouse gas", "gas station", "glasshouse"], "a": 0}], "img": "L10_c3", "icon": "🖼️"}, {"type": "explain", "title": "Compound nouns", "lines": ["A compound noun is a noun that is made up of two or more words.", "A dictionary will show you the correct way to write a compound noun."], "img": "L10_c4", "rule": "joined · hyphenated · separate", "icon": "📌"}, {"type": "flip", "title": "Compound nouns 📌 – examples", "cards": [{"front": "Joined: [[armchair]], [[classmate]], [[sunglasses]], [[textbook]], [[thunderstorm]]", "icon": "💡", "back": "one word"}, {"front": "Hyphen: [[dry-cleaning]], [[one-year-old]], [[passer-by]]", "icon": "✨", "back": "with -"}, {"front": "Separate: [[air conditioner]], [[alarm clock]], [[fossil fuel]], [[ice cream]]", "icon": "🔎", "back": "two words"}]}, {"type": "sort", "title": "How do we write them?", "bins": [{"label": "Joined", "icon": "🔗"}, {"label": "Hyphen", "icon": "➖"}, {"label": "Separate", "icon": "␣"}], "cards": [{"text": "armchair", "icon": "", "bin": 0}, {"text": "classmate", "icon": "", "bin": 0}, {"text": "sunglasses", "icon": "", "bin": 0}, {"text": "thunderstorm", "icon": "", "bin": 0}, {"text": "dry-cleaning", "icon": "", "bin": 1}, {"text": "one-year-old", "icon": "", "bin": 1}, {"text": "passer-by", "icon": "", "bin": 1}, {"text": "air conditioner", "icon": "", "bin": 2}, {"text": "alarm clock", "icon": "", "bin": 2}, {"text": "ice cream", "icon": "", "bin": 2}], "icon": "🗂️"}, {"type": "memory", "title": "Compound noun memory", "pairs": [["sun + glasses", "sunglasses 🕶️"], ["class + mate", "classmate 👫"], ["text + book", "textbook 📘"], ["thunder + storm", "thunderstorm ⛈️"], ["alarm + clock", "alarm clock ⏰"], ["air + conditioner", "air conditioner ❄️"]], "icon": "🧠"}, {"type": "ask", "title": "Play a game: draw and guess", "qs": [{"q": "☀️ + 👓 – Can you guess the compound noun?", "a": "Is it sunglasses? – Yes!"}, {"q": "🏫 + 🚌", "a": "school bus"}, {"q": "🌧️ + 🌈 (bow)", "a": "rainbow"}, {"q": "🦷 + 🪥 (brush)", "a": "toothbrush"}, {"q": "Your turn: think of a compound noun, draw two pictures, ask your partner.", "a": "Can you guess the compound noun?"}], "img": "L10_c5", "icon": "✏️"}, {"type": "race", "title": "Team race", "qs": [{"q": "Polar bears are dying ___ melting ice.", "options": ["due to", "so", "therefore"], "a": 0}, {"q": "The ice is melting, ___ sea levels are rising.", "options": ["so", "because of", "due to"], "a": 0}, {"q": "‘the result’ =", "options": ["cause", "effect"], "a": 1}, {"q": "Which is hyphenated?", "options": ["passer-by", "classmate", "ice cream"], "a": 0}, {"q": "Which is written as two words?", "options": ["alarm clock", "armchair", "textbook"], "a": 0}, {"q": "fossil + fuel =", "options": ["fossil fuel", "fossilfuel", "fossil-fuel"], "a": 0}], "icon": "🏎️"}, {"type": "steps", "title": "Let's remember!", "icon": "🧠", "steps": ["Cause = what happens · Effect = the result.", "Cause first: so, therefore, consequently, One result/effect/consequence of …", "Effect first: due to, because of, as a result of + noun.", "Compound nouns: joined (classmate), hyphen (passer-by), separate (fossil fuel)."]}, {"type": "exit", "title": "Exit ticket", "items": [{"k": "3", "text": "Write one cause-first sentence with ‘therefore’."}, {"k": "2", "text": "Write one effect-first sentence with ‘because of’."}, {"k": "1", "text": "Give one compound noun of each type."}], "icon": "🎟️"}, {"type": "homework", "title": "Homework", "head": "My homework", "items": ["Write 6 cause and effect sentences about climate change using six different connectors.", "Find 8 compound nouns in CB pp. 13–17 and sort them: joined / hyphen / separate.", "Draw picture clues for two compound nouns for the next lesson."], "icon": "🏠"}]}, {"id": "L11", "unit": "U2", "unitName": "Unit 2 · Climate Change", "title": "Listening and Speaking · A debate on global warming", "code": "", "theme": "city", "emo": "⚖️", "slides": [{"type": "cover", "say": "Listening and Speaking · Governments and global warming"}, {"type": "goals", "title": "Today's goals", "items": ["I can understand debate words: policy, emission, regulate, consumer, eco-friendly.", "I can identify the topic of a debate and its arguments."], "icon": "🎯"}, {"type": "goals", "title": "Today's goals", "items": ["I can agree and disagree in a debate.", "I can suggest ways to reduce my carbon footprint."], "icon": "🎯"}, {"type": "build", "title": "Debate words", "mode": "letters", "items": [{"a": "policy", "hint": "a set of ideas officially agreed by a government", "emo": "📜"}, {"a": "emission", "hint": "releasing gas, heat or light", "emo": "💨"}, {"a": "consumer", "hint": "a person who buys goods", "emo": "🛒"}], "icon": "🔤"}, {"type": "build", "title": "Debate words", "mode": "letters", "items": [{"a": "regulate", "hint": "to control something", "emo": "🎛️"}, {"a": "debate", "hint": "a formal discussion: for and against", "emo": "🗣️"}, {"a": "law", "hint": "a rule made by a government", "emo": "⚖️"}], "icon": "🔤"}, {"type": "quiz", "title": "Read and choose: a or b?", "qs": [{"q": "1 policy (n)", "o": ["a set of ideas, officially agreed by a group, business or government", "a new law"], "a": 0}, {"q": "2 emission (n)", "o": ["the act of releasing gas, heat or light", "the act of burning fossil fuels"], "a": 0}, {"q": "3 responsibility (n)", "o": ["something that you are paid to deal with", "something that is your job or duty to deal with"], "a": 1}, {"q": "4 to regulate (v)", "o": ["to control something", "to stop something"], "a": 0}, {"q": "5 consumer (n)", "o": ["a person who sells goods or services", "a person who buys goods or services for their own use"], "a": 1}, {"q": "6 eco-friendly (adj)", "o": ["something that does not produce greenhouse gases", "something that has been designed not to damage the environment"], "a": 1}], "img": "L11_c2", "icon": "📚"}, {"type": "quiz", "title": "Use the new words", "icon": "✏️", "qs": [{"q": "The government has a new ___ to protect the environment.", "o": ["policy", "consumer", "emission"], "a": 0}, {"q": "Cars produce carbon dioxide ___ .", "o": ["emissions", "policies", "consumers"], "a": 0}, {"q": "Laws ___ how much gas factories can release.", "o": ["regulate", "consume", "emit"], "a": 0}, {"q": "A ___ buys goods for their own use.", "o": ["consumer", "policy", "reporter"], "a": 0}, {"q": "This bag is made of recycled bottles – it is ___ .", "o": ["eco-friendly", "excessive", "extreme"], "a": 0}]}, {"type": "ask", "title": "What is the debate about?", "qs": [{"q": "1 Governments alone cannot stop global warming.", "a": "Key words: alone, cannot."}, {"q": "2 Governments are responsible for stopping global warming.", "a": "Key words: responsible."}, {"q": "3 Governments should do more to stop global warming.", "a": "Key words: should do more."}, {"q": "Which one is the topic?", "a": "🎧 Listen to the Grade 10 students and choose 1, 2 or 3."}], "img": "L11_c1", "icon": "🎧"}, {"type": "ask", "title": "For or against?", "qs": [{"q": "1 We need new policies and laws to control global warming.", "a": "This argument says governments must act with laws. 🎧 F or A? Listen."}, {"q": "2 People are unlikely to change their habits.", "a": "This says individuals will not change. 🎧 Listen and decide."}, {"q": "3 Governments have a responsibility to educate people about climate change.", "a": "This says governments must teach people. 🎧 Listen and decide."}], "icon": "🎧"}, {"type": "ask", "title": "For or against?", "qs": [{"q": "4 Many people cannot afford to buy products that are more eco-friendly.", "a": "This is about money and consumers. 🎧 Listen and decide."}, {"q": "5 Saving the planet is more important than money.", "a": "🎧 Listen and decide."}, {"q": "6 Individual people have to take more responsibility and change their habits.", "a": "This says people, not only governments, must act. 🎧 Listen and decide."}], "icon": "🎧"}, {"type": "explain", "title": "Debate language", "lines": ["Agree or disagree politely, then give a reason and an example.", "Stress the important word to make your point stronger."], "rule": "Agree/disagree + reason + example + STRESS", "icon": "🗣️"}, {"type": "flip", "title": "Debate language 🗣️ – examples", "cards": [{"front": "[[I agree.]] Governments [[MUST]] make new laws.", "icon": "💡", "back": "👍 + stress"}, {"front": "[[I see what you’re saying, but]] people [[ALSO]] have to change.", "icon": "✨", "back": "👎"}, {"front": "[[The reason for this is]] that factories produce [[MOST]] emissions.", "icon": "🔎", "back": "reason"}, {"front": "[[For example]], Oman is building solar power plants.", "icon": "📌", "back": "example"}]}, {"type": "ask", "title": "Our class debate", "qs": [{"q": "Team A: Governments should do more to stop global warming.", "a": "We need new policies and laws. Governments have a responsibility to educate people."}, {"q": "Team B: People must change their own habits.", "a": "Individual people have to take more responsibility. Saving the planet starts at home."}, {"q": "Reply to the other team politely.", "a": "That’s true, but many people cannot afford eco-friendly products, so governments should help."}], "img": "L11_c1", "icon": "🏛️"}, {"type": "read", "title": "Reduce your carbon footprint (1)", "paras": ["1 Turn off electronic devices when you are not using them. All electronic devices use electricity which is created by burning fossil fuels."], "img": "L11_c3", "icon": "📖"}, {"type": "read", "title": "Reduce your carbon footprint (1)", "paras": ["2 Heating and cooling houses is one of the biggest [[contributors]] to an individual’s carbon footprint. Reduce your use of air conditioners and electric fans so that they use less electricity. Or turn them off if possible.", "3 Fill up the kettle with only as much water as you need."], "img": "L11_c3", "icon": "📖"}, {"type": "read", "title": "Reduce your carbon footprint (1)", "paras": ["4 Switch off lights when you leave a room. Use [[energy saving light bulbs]]", "5 Take showers instead of baths to save water."], "img": "L11_c3", "icon": "📖"}, {"type": "read", "title": "Reduce your carbon footprint (2)", "paras": ["6 Give away very old electrical [[appliances]] and buy new ones. Old water heaters, fridges, air conditioners and cookers use more energy than new ones.", "7 Cars use fossil fuels and release greenhouse gases. Walk, ride a bike or take public transport instead of travelling by car."], "img": "L11_c4", "icon": "📖"}, {"type": "read", "title": "Reduce your carbon footprint (2)", "paras": ["8 Look for fruits and vegetables that are grown locally or grow your own. Transporting food around the world burns fossil fuels and adds to global warming."], "img": "L11_c4", "icon": "📖"}, {"type": "read", "title": "Reduce your carbon footprint (2)", "paras": ["9 Find out where wood products come from. Furniture should come from [[sustainable]] forests and paper should be recycled. Don’t use products that result in trees being cut down. We need trees to [[absorb]] greenhouse gases."], "img": "L11_c4", "icon": "📖"}, {"type": "sort", "title": "Sort the tips", "bins": [{"label": "Save electricity at home", "icon": "⚡"}, {"label": "Save water", "icon": "🚿"}, {"label": "Transport, food & wood", "icon": "🚲"}], "cards": [{"text": "Turn off electronic devices", "icon": "", "bin": 0}, {"text": "Use the air conditioner less", "icon": "", "bin": 0}, {"text": "Switch off lights", "icon": "", "bin": 0}, {"text": "Buy new, efficient appliances", "icon": "", "bin": 0}, {"text": "Take showers instead of baths", "icon": "", "bin": 1}, {"text": "Fill the kettle with only the water you need", "icon": "", "bin": 1}, {"text": "Walk or ride a bike", "icon": "", "bin": 2}, {"text": "Buy local fruits and vegetables", "icon": "", "bin": 2}, {"text": "Use wood from sustainable forests", "icon": "", "bin": 2}], "icon": "🗂️"}, {"type": "ask", "title": "Which tips suit your family?", "qs": [{"q": "Which tips are the most suitable for you and your family?", "a": "Switching off lights and taking showers instead of baths are the easiest for my family."}, {"q": "Which tip is the most difficult in Oman? Why?", "a": "Using the air conditioner less is difficult because summers are very hot."}, {"q": "Which local fruits and vegetables can you buy or grow?", "a": "Dates, bananas, lemons and tomatoes grow in Oman."}], "icon": "💬"}, {"type": "wheel", "title": "Debate wheel", "items": [{"q": "Should the government make plastic bags illegal?", "a": "I agree, because …"}, {"q": "Should schools turn off air conditioners in winter?", "a": "I see what you’re saying, but …"}, {"q": "Should everyone use public transport?", "a": "That’s true, but …"}, {"q": "Are eco-friendly products too expensive?", "a": "I have the same opinion. For example, …"}, {"q": "Should we plant more trees in our cities?", "a": "You’re exactly right! The reason for this is …"}, {"q": "Is saving the planet more important than money?", "a": "I believe that … For instance, …"}], "icon": "🎡"}, {"type": "race", "title": "Team race", "qs": [{"q": "‘to regulate’ =", "options": ["to control something", "to stop something"], "a": 0}, {"q": "A consumer …", "options": ["buys goods", "sells goods"], "a": 0}, {"q": "‘emission’ =", "options": ["releasing gas, heat or light", "a new law"], "a": 0}, {"q": "Showers instead of baths save …", "options": ["water", "wood"], "a": 0}, {"q": "We need trees to ___ greenhouse gases.", "options": ["absorb", "release"], "a": 0}, {"q": "Polite disagreement:", "options": ["I see what you’re saying, but …", "You’re exactly right!"], "a": 0}], "icon": "🏎️"}, {"type": "steps", "title": "Let's remember!", "icon": "🧠", "steps": ["Debate words: policy, emission, responsibility, regulate, consumer, eco-friendly.", "In a debate: agree / disagree + reason + example; stress important words.", "Reduce your carbon footprint: save electricity and water, walk, buy local, use sustainable wood."]}, {"type": "exit", "title": "Exit ticket", "items": [{"k": "3", "text": "What does ‘eco-friendly’ mean?"}, {"k": "2", "text": "Write one argument: Governments should do more to stop global warming."}, {"k": "1", "text": "Which carbon footprint tip will you try this week?"}], "icon": "🎟️"}, {"type": "homework", "title": "Homework", "head": "My homework", "items": ["Learn the six words from CB p. 18 Act. 1 with their correct definitions.", "Write three arguments FOR and three AGAINST: ‘Governments should do more to stop global warming.’", "Choose three tips from CB p. 19 and explain how your family can use them."], "icon": "🏠"}]}, {"id": "L12", "unit": "U2", "unitName": "Unit 2 · Climate Change", "title": "Writing · An opinion essay about plastic", "code": "", "theme": "city", "emo": "🐢", "slides": [{"type": "cover", "say": "Writing · An opinion essay"}, {"type": "goals", "title": "Today's goals", "items": ["I can discuss facts about plastic in the oceans.", "I can understand the structure of an opinion essay."], "icon": "🎯"}, {"type": "goals", "title": "Today's goals", "items": ["I can find phrasal verbs, compound nouns and cause and effect in an essay.", "I can write an opinion essay with four paragraphs."], "icon": "🎯"}, {"type": "enter", "title": "Catch the things we use ONCE and throw away.", "gate": "✓", "items": [{"text": "ceramic mug", "in": false}, {"text": "plastic bottles", "in": true}, {"text": "reusable bottle", "in": false}, {"text": "plastic bags", "in": true}, {"text": "cloth bag", "in": false}, {"text": "plastic straws", "in": true}]}, {"type": "ask", "title": "Plastic facts", "qs": [{"q": "1 Every year, we put 8 million tonnes of plastic into the oceans. How do you feel?", "a": "I am shocked – that is a huge amount!"}, {"q": "2 Hundreds of thousands of marine animals die per year because they eat or become trapped in plastic. Which animals?", "a": "Turtles, fish, dolphins and sea birds."}, {"q": "3 It is predicted that by 2050, there will be more plastic in the oceans than fish. Is this possible?", "a": "Yes, if we do not use less plastic now."}], "img": "L12_c1", "icon": "😮"}, {"type": "read", "title": "The essay (1)", "paras": ["We should use less plastic to protect our oceans. Do you agree or disagree?"], "img": "L12_c2", "icon": "📖"}, {"type": "read", "title": "The essay (1)", "paras": ["Our oceans are under threat because of plastic pollution. Plastic waste, such as [[packaging]], cups and straws is [[lightweight]] and so it often gets blown or washed into the ocean. Some people do not want to stop using plastic products because they are [[convenient]]. However, I believe that we must use less plastic to protect the oceans."], "img": "L12_c2", "icon": "📖"}, {"type": "read", "title": "The essay (1)", "paras": ["One reason why we should use less plastic is that plastic pollution is dangerous to both [[marine life]] and humans. Many marine animals die as a result of getting [[tangled]] in plastic or eating plastic. Furthermore, scientists have discovered that if you eat fish, you may be eating pieces of plastic that the fish has eaten. Therefore, it is essential to take action to address this problem."], "img": "L12_c2", "icon": "📖"}, {"type": "read", "title": "The essay (2)", "paras": ["Another reason we should use less plastic is because it is easy to do and making small changes in our daily lives will help improve this problem. For example, a million plastic bottles are sold every minute worldwide. They are used once and then thrown away. However, we could easily use [[reusable]] bottles instead and this would help reduce the amount of plastic that end up in the ocean."], "img": "L12_c2", "icon": "📖"}, {"type": "read", "title": "The essay (2)", "paras": ["To sum up, plastic waste is a serious threat to our oceans, but we can all reduce the amount of plastic we use and protect the oceans."], "img": "L12_c2", "icon": "📖"}, {"type": "ask", "title": "Read and answer", "qs": [{"q": "1 According to the author, how does plastic end up in our oceans?", "a": "Plastic waste is lightweight, so it often gets blown or washed into the ocean."}, {"q": "2 Which single-use plastic items does the author mention?", "a": "Packaging, cups, straws and plastic bottles."}, {"q": "3 Why is plastic in the oceans also a threat to humans?", "a": "If you eat fish, you may be eating pieces of plastic that the fish has eaten."}, {"q": "4 In which paragraph does the author first state his or her opinion?", "a": "Paragraph 1: ‘However, I believe that we must use less plastic to protect the oceans.’"}], "icon": "💡"}, {"type": "match", "title": "Paragraphs and functions", "pairs": [["Paragraph 1", "d Explain the topic in your own words and state your opinion."], ["Paragraph 2", "a Present an idea with examples to support your opinion."], ["Paragraph 3", "b Present another idea with examples to support your opinion."], ["Paragraph 4", "c Summarise your points and remind the reader of your opinion."]], "icon": "🧩"}, {"type": "order", "title": "Build the essay", "items": ["Our oceans are under threat because of …", "However, I believe that …", "One reason why we should …", "Furthermore, …", "Another reason we should … For example, …", "To sum up, …"], "icon": "🔢"}, {"type": "explain", "title": "Opinion essay language", "lines": ["Opinion: I believe that …", "Ideas: One reason why … / Another reason …", "Add: Furthermore, …  Example: For example, …"], "img": "L12_c2", "icon": "📌"}, {"type": "explain", "title": "Opinion essay language", "lines": ["Contrast: However, …  Result: Therefore, …", "Conclusion: To sum up, …"], "rule": "Intro + opinion → idea 1 → idea 2 → conclusion", "icon": "📌"}, {"type": "flip", "title": "Opinion essay language 📌 – examples", "cards": [{"front": "[[However]], I believe that we must use less plastic.", "icon": "💡", "back": "opinion"}, {"front": "[[One reason why]] we should use less plastic is that …", "icon": "✨", "back": "idea 1"}, {"front": "[[To sum up]], plastic waste is a serious threat to our oceans.", "icon": "🔎", "back": "conclusion"}]}, {"type": "sort", "title": "Language review", "bins": [{"label": "Phrasal verbs", "icon": ""}, {"label": "Compound nouns", "icon": ""}, {"label": "Cause and effect", "icon": ""}], "cards": [{"text": "end up", "icon": "", "bin": 0}, {"text": "thrown away", "icon": "", "bin": 0}, {"text": "sum up", "icon": "", "bin": 0}, {"text": "plastic pollution", "icon": "", "bin": 1}, {"text": "marine life", "icon": "", "bin": 1}, {"text": "plastic bottles", "icon": "", "bin": 1}, {"text": "because of plastic pollution", "icon": "", "bin": 2}, {"text": "as a result of getting tangled", "icon": "", "bin": 2}, {"text": "Therefore, it is essential …", "icon": "", "bin": 2}], "icon": "🔎"}, {"type": "quiz", "title": "Complete the essay sentences", "icon": "✏️", "qs": [{"q": "Our oceans are under threat ___ plastic pollution.", "o": ["because of", "therefore", "so"], "a": 0}, {"q": "Plastic waste is lightweight ___ it often gets blown into the ocean.", "o": ["and so", "because of", "due to"], "a": 0}, {"q": "Many marine animals die ___ getting tangled in plastic.", "o": ["as a result of", "so", "therefore"], "a": 0}, {"q": "___ , it is essential to take action.", "o": ["Therefore", "Because of", "Due to"], "a": 0}, {"q": "They are used once and then ___ away.", "o": ["thrown", "ended", "summed"], "a": 0}]}, {"type": "ask", "title": "Plastic pollution in Oman", "qs": [{"q": "Think of an example of plastic pollution that you have seen in Oman.", "a": "I have seen plastic bottles and bags on the beach after picnics."}, {"q": "Think of three possible solutions to stop this kind of pollution.", "a": "1 Put more rubbish bins on beaches. 2 Bring reusable bottles. 3 Organise beach clean-ups with our school."}, {"q": "Who should do it?", "a": "Everyone: families, schools, the municipality and be'ah."}], "img": "L12_c3", "icon": "🇴🇲"}, {"type": "write", "title": "Write your opinion essay", "task": "Write an opinion essay (120–150 words): ‘We should stop using plastic bags in Oman. Do you agree or disagree?’", "steps": ["Paragraph 1: explain the topic and state your opinion.", "Paragraph 2: idea 1 + example.", "Paragraph 3: idea 2 + example.", "Paragraph 4: To sum up, … remind the reader of your opinion."], "words": ["I believe that …", "One reason why …", "Furthermore, …", "Another reason …", "For example, …", "because of / as a result of", "Therefore, …", "To sum up, …"], "model": "Plastic bags are everywhere in Oman: in shops, on beaches and in the desert. Some people like them because they are free and convenient. However, I believe that we should stop using plastic bags. One reason why we should stop is that plastic bags are dangerous to animals. Many turtles die as a result of eating bags that look like jellyfish. Furthermore, camels and goats sometimes eat them in the desert. Another reason is that it is easy to change. For example, we can take cloth bags to the supermarket. Therefore, small changes can make a big difference. To sum up, plastic bags harm our animals and our environment, so we should all stop using them.", "icon": "✍️"}, {"type": "balloons", "title": "Pop the right answer!", "rounds": [{"q": "How much plastic do we put into the oceans every year?", "o": ["8 million tonnes", "8 thousand tonnes", "80 tonnes"], "a": 0}, {"q": "By 2050 there may be more plastic than …", "o": ["fish", "water", "ships"], "a": 0}, {"q": "Where do you state your opinion first?", "o": ["Paragraph 1", "Paragraph 3", "Paragraph 4"], "a": 0}], "icon": "🎈"}, {"type": "balloons", "title": "Pop the right answer!", "rounds": [{"q": "Conclusion starts with …", "o": ["To sum up,", "One reason why", "For example,"], "a": 0}, {"q": "‘end up’ is a …", "o": ["phrasal verb", "compound noun"], "a": 0}, {"q": "Plastic bottles sold every minute:", "o": ["a million", "a thousand", "a hundred"], "a": 0}], "icon": "🎈"}, {"type": "steps", "title": "Let's remember!", "icon": "🧠", "steps": ["Opinion essay = 4 paragraphs: intro + opinion, idea 1, idea 2, conclusion.", "Support ideas with examples and facts.", "Use connectors: However, Furthermore, Therefore, For example, To sum up.", "Use less plastic – choose reusable!"]}, {"type": "exit", "title": "Exit ticket", "items": [{"k": "3", "text": "What is the job of paragraph 1 in an opinion essay?"}, {"k": "2", "text": "Give one fact about plastic in the oceans."}, {"k": "1", "text": "Write a topic sentence for paragraph 2 of your essay."}], "icon": "🎟️"}, {"type": "homework", "title": "Homework", "head": "My homework", "items": ["Write your opinion essay (120–150 words) in your exercise book.", "Underline the connectors you used in your essay.", "Write your Oman plastic pollution example and three solutions (Act. 5)."], "icon": "🏠"}]}, {"id": "L13", "unit": "U2", "unitName": "Unit 2 · Climate Change", "title": "Project · Design a reusable shopping bag", "code": "", "theme": "city", "emo": "🛍️", "slides": [{"type": "cover", "say": "Project · Design a reusable shopping bag"}, {"type": "goals", "title": "Today's goals", "items": ["I can discuss the message, image and slogan of a bag design.", "I can understand what makes a good design."], "icon": "🎯"}, {"type": "goals", "title": "Today's goals", "items": ["I can plan and design a reusable shopping bag with my group.", "I can write a short explanation and evaluate designs."], "icon": "🎯"}, {"type": "build", "title": "Design words", "mode": "letters", "items": [{"a": "slogan", "hint": "a short, memorable phrase", "emo": "💬"}, {"a": "message", "hint": "the main idea you want people to understand", "emo": "📢"}, {"a": "image", "hint": "a picture", "emo": "🖼️"}], "icon": "🔤"}, {"type": "build", "title": "Design words", "mode": "letters", "items": [{"a": "material", "hint": "what something is made of", "emo": "🧵"}, {"a": "reusable", "hint": "can be used again", "emo": "♻️"}, {"a": "colour", "hint": "blue, green, red …", "emo": "🎨"}], "icon": "🔤"}, {"type": "ask", "title": "Look at the bags", "qs": [{"q": "1 Which design do you like the most and why?", "a": "I like bag 4 because the picture of plastic in the ocean is shocking."}, {"q": "2 How does the message on each bag connect to climate change?", "a": "Bag 1: go green; Bag 2: reduce your carbon footprint; Bag 3: save electricity; Bag 4: plastic pollution in the oceans."}, {"q": "3 What do you notice abo ly]] [[material]] and if we recycle plastic bottles, fewer will end up in the ocean."], "img": "L13_c2", "icon": "📖"}, {"type": "quiz", "title": "Check the example", "qs": [{"q": "The message of the bag is about …", "o": ["plastic pollution in the ocean", "saving electricity", "walking to school"], "a": 0}, {"q": "Why did they choose this message?", "o": ["They live near the sea.", "Their teacher told them.", "It was easy."], "a": 0}, {"q": "What is their slogan?", "o": ["a fact", "a rhyme", "a question"], "a": 0}, {"q": "Why is the main colour blue?", "o": ["to represent the ocean", "because it is cheap", "it is their favourite"], "a": 0}, {"q": "The bag will be made of …", "o": ["recycled plastic bottles", "paper", "leather"], "a": 0}], "icon": "✅"}, {"type": "explain", "title": "Be creative!", "lines": ["Think outside the box about how you will present your design.", "Your illustration can be a drawing, a collage, a digital illustration, a 3D model.", "Your written explanation can be a paragraph, bullet points or a spider diagram."], "rule": "message · image · slogan · colours · material", "icon": "🎨"}, {"type": "flip", "title": "Be creative! 🎨 – examples", "cards": [{"front": "Message → [[what]] is it about?", "icon": "💡", "back": "📢"}, {"front": "Image + slogan → [[how]] will people remember it?", "icon": "✨", "back": "🖼️💬"}, {"front": "Colours + material → [[why]] did you choose them?", "icon": "🔎", "back": "🎨🧵"}]}, {"type": "ask", "title": "Plan your bag", "qs": [{"q": "1 What is the overall message of your bag about?", "a": "Saving water in Oman."}, {"q": "2 What image will be on your bag?", "a": "A falaj with a water drop that has a smiling face."}, {"q": "3 What is your slogan?", "a": "‘Every drop counts – don't let it go!’"}, {"q": "4 What colours will you use?", "a": "Blue for water and green for the farms."}, {"q": "5 What material will your bag be made from?", "a": "Cotton, because it is strong and can be washed and reused."}], "icon": "🗒️"}, {"type":
