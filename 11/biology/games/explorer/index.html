function md(t){ return esc(t).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>'); }

/* ---------- VISUALS ---------- */
function renderVis(v){
  if(!v) return '<div style="font-size:80px;opacity:.4">🧬</div>';
  if(typeof v==='string'){ return PRESETS[v]?wrapSVG(PRESETS[v]({})): `<div style="font-size:90px">${v}</div>`; }
  try{
    switch(v.kind){
      case 'preset': return PRESETS[v.name]?wrapSVG(PRESETS[v.name](v.opts||{})):`<div style="font-size:60px">🧪<br><small style="font-size:14px">${esc(v.name)}</small></div>`;
      case 'svg': return v.code;
      case 'emoji': return `<div style="text-align:center"><div style="font-size:${v.size||110}px;line-height:1.1;animation:pop .5s">${v.icon}</div>${v.label?`<div style="font-weight:800;font-size:18px;color:var(--u)">${esc(v.label)}</div>`:''}</div>`;
      case 'flow': return `<div class="gv flow">${v.steps.map((s,i)=>`${i?'<span class="fa">←</span>':''}<div class="fn" style="animation-delay:${i*.12}s">${s.icon?`<span class="fi">${s.icon}</span>`:''}${esc(s.t||s)}</div>`).join('')}</div>`;
      case 'compare': return `<div class="gv cmp">${v.cols.map(c=>`<div class="c">${c.icon?`<div class="ci">${c.icon}</div>`:''}<h4>${esc(c.title)}</h4><ul>${c.items.map(x=>`<li>${md(x)}</li>`).join('')}</ul></div>`).join('')}</div>`;
      case 'cards': return `<div class="gv cards">${v.items.map((c,i)=>`<div class="cd" style="animation-delay:${i*.08}s"><div class="ci">${c.icon||'•'}</div><h5>${esc(c.title)}</h5>${c.text?`<p>${esc(c.text)}</p>`:''}</div>`).join('')}</div>`;
      case 'table': return `<div class="gv"><table class="tbl"><thead><tr>${v.head.map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${v.rows.map(r=>`<tr>${r.map(c=>`<td>${md(String(c))}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
      case 'cycle': { const n=v.steps.length; return `<div class="gv cycle">${v.center?`<div class="ctr">${v.center}</div>`:''}${v.steps.map((s,i)=>{const a=-Math.PI/2+i*2*Math.PI/n; const x=50+40*Math.cos(a), y=50+40*Math.sin(a); return `<div class="cn" style="left:${x}%;top:${y}%">${s.icon?`<span class="ci">${s.icon}</span>`:''}${esc(s.t||s)}</div>`;}).join('')}</div>`; }
      case 'steps': return `<div class="gv stepsv">${v.steps.map((s,i)=>`<div class="sv" style="animation-delay:${i*.1}s"><span class="n">${ARN(i+1)}</span>${s.icon?`<span class="si">${s.icon}</span>`:''}<p>${md(s.t||s)}</p></div>`).join('')}</div>`;
      case 'bars': { const mx=Math.max(...v.items.map(b=>b.v)); return `<div class="gv"><div class="bars">${v.items.map(b=>`<div class="b"><b>${esc(b.label||b.v)}</b><i style="height:${Math.max(4,100*b.v/mx)}%;${b.color?'background:'+b.color:''}"></i><span>${esc(b.t)}</span></div>`).join('')}</div>${v.cap?`<div style="text-align:center;font-size:13px;color:var(--muted);font-weight:700">${esc(v.cap)}</div>`:''}</div>`; }
      case 'labels': { const svg=PRESETS[v.name]?PRESETS[v.name](v.opts||{}):''; return wrapSVG(svg)+`<div class="cards" style="margin-top:8px">${(v.items||[]).map(x=>`<div class="cd" style="padding:6px"><h5>${esc(x)}</h5></div>`).join('')}</div>`; }
    }
  }catch(e){ console.error(e); }
  return '<div style="font-size:80px;opacity:.4">🧬</div>';
}
function wrapSVG(s){ return `<div style="width:100%">${s}</div>`; }

  blanks:['✍️','أكمل الفراغ','اختر الكلمة المناسبة لكل فراغ'],
  memory:['🃏','بطاقات الذاكرة','اقلب البطاقات وابحث عن الأزواج'],

function finishGame(g,i,score,total,extraHTML){
  clearTimers(); const pct=total?Math.round(100*score/total):100; const st=LS(CUR.id); const key=g.id||i; st.games[key]=Math.max(st.games[key]||0,pct); save(); refreshStepper();
  if(pct>=60){SFX.win();confetti(pct>=90?120:60);} else SFX.bad();
  $('#garea').innerHTML=`<div class="result"><div class="big">${pct>=90?'🏆':pct>=60?'🎉':'💪'}</div><h3>${praise(pct/100)}</h3>${stars(pct/100)}<p>النتيجة: ${ARN(score)} من ${ARN(total)} (${ARN(pct)}%)</p>${extraHTML||''}<div class="row" style="justify-content:center;margin-top:12px"><button class="btn sec" id="again">🔁 إعادة</button><button class="btn" id="toGames">🎮 ألعاب أخرى</button></div></div>`;
  $('#again').onclick=()=>playGame(g,i); $('#toGames').onclick=()=>renderGames();
}
function startTimer(sec,onTick,onEnd){ let t=sec; const el=$('#gtimer'), bar=$('#tbarI'); const upd=()=>{ if(el){el.textContent=ARN(t)+' ث';el.classList.toggle('low',t<=5);} if(bar)bar.style.width=(100*t/sec)+'%'; }; upd(); const id=setInterval(()=>{ t--; upd(); if(t<=5&&t>0)SFX.tick(); if(onTick)onTick(t); if(t<=0){clearInterval(id);onEnd();} },1000); TIMERS.push(id); return ()=>{clearInterval(id);}; }
function playGame(g,i){
  clearTimers();
  const f={match:gMatch,sort:gSort,order:gOrder,quiz:gQuiz,blanks:gBlanks,memory:gMemory,label:gLabel,tf:gTF,scramble:gScramble,hunt:gHunt,wheel:gWheel,secret:gSecret}[g.type];
  if(f) f(g,i); else { gameShell(g,i).innerHTML='<p>نوع لعبة غير معروف.</p>'; }
}
function setScore(n){ const e=$('#gscore'); if(e)e.textContent=ARN(n); }

/* match */
function gMatch(g,i){
  const area=gameShell(g,i); const pairs=shuffle(g.pairs).slice(0,10); let sel=null, score=0, done=0, tries=0;
  const L=shuffle(pairs.map((p,k)=>({k,t:p.a,ic:p.icon}))), R=shuffle(pairs.map((p,k)=>({k,t:p.b})));
  area.innerHTML=`<div class="mcols"><div class="mcol" id="mL">${L.map(x=>`<div class="mc" data-k="${x.k}" data-side="L">${x.ic?`<span class="ci">${x.ic}</span>`:''}${esc(x.t)}</div>`).join('')}</div><div class="mcol" id="mR">${R.map(x=>`<div class="mc" data-k="${x.k}" data-side="R">${esc(x.t)}</div>`).join('')}</div></div>`;
  $$('.mc',area).forEach(c=>c.onclick=(ev)=>{
    if(c.classList.contains('ok'))return; SFX.click();
    if(!sel){sel=c;c.classList.add('sel');return;}
    if(sel===c){c.classList.remove('sel');sel=null;return;}
    if(sel.dataset.side===c.dataset.side){sel.classList.remove('sel');sel=c;c.classList.add('sel');return;}
    tries++;
    if(sel.dataset.k===c.dataset.k){ sel.classList.remove('sel'); sel.classList.add('ok'); c.classList.add('ok'); score++; done++; setScore(score); goodAt(ev); if(done===pairs.length)setTimeout(()=>finishGame(g,i,Math.max(pairs.length-Math.max(0,tries-pairs.length),Math.ceil(pairs.length/2)),pairs.length,`<p>عدد المحاولات: ${ARN(tries)}</p>`),600); }
    else { sel.classList.remove('sel'); sel.classList.add('bad'); c.classList.add('bad'); badAt(ev); const a=sel,b=c; setTimeout(()=>{a.classList.remove('bad');b.classList.remove('bad');},450); }
    sel=null;
  });
}
/* sort */
function gSort(g,i){
  const area=gameShell(g,i); const items=shuffle(g.items); let score=0, placed=0, sel=null, wrong=0;
  area.innerHTML=`<div class="bins">${g.cats.map((c,k)=>`<div class="bin" data-c="${k}"><h5>${c.icon||''} ${esc(c.name)}</h5><div class="bc"></div></div>`).join('')}</div><div class="pool" id="pool">${items.map((it,k)=>`<div class="chip" data-k="${k}" data-c="${it.c}">${esc(it.t)}</div>`).join('')}</div>`;
  const bins=$$('.bin',area);
  function place(chip,bin,ev){ if(!chip)return; if(+bin.dataset.c===+chip.dataset.c){ chip.remove(); const d=document.createElement('div'); d.className='bi'; d.textContent=chip.textContent; $('.bc',bin).appendChild(d); score++; placed++; setScore(score); goodAt(ev); if(placed===items.length)setTimeout(()=>finishGame(g,i,Math.max(0,items.length-wrong),items.length),500); } else { wrong++; chip.classList.add('bad'); badAt(ev); setTimeout(()=>chip.classList.remove('bad'),450); } sel=null; $$('.chip',area).forEach(c=>c.classList.remove('sel')); }
  area.onclick=(ev)=>{ const chip=ev.target.closest('.chip'); const bin=ev.target.closest('.bin'); if(chip){ $$('.chip',area).forEach(c=>c.classList.remove('sel')); sel=chip; chip.classList.add('sel'); SFX.click(); } else if(bin&&sel){ place(sel,bin,ev); } };
