    { id:'l1_6', num:'١-٦', title:'الخلايا النباتية والحيوانية كما تبدو تحت المجهر الإلكتروني', en:'Plant and animal cells as seen with an electron microscope', ws:false,
      preIntro:'الخلية مدينة صغيرة: محطّات طاقة، مصانع، شبكة طرق، مركز تحكّم، ووحدة تدوير. لنتعرّف إلى سكّانها كما يكشفهم المجهر الإلكتروني.',
      pre:[
        {t:'visual', vis:'animal_cell', q:'أيّ العضيات في الرسم يُوصَف بأنه «محطة الطاقة» في الخلية؟', opts:['النواة','الميتوكوندريون','جهاز جولجي','الليسوسوم'], a:1, why:'الميتوكوندريا موقع التنفّس الهوائي الذي ينتج ATP.'},
        {t:'tf', q:'الرايبوسومات محاطة بغشاء مثل بقية العضيات.', a:false, why:'الرايبوسومات عضيات غير غشائية، مكوّنة من RNA رايبوسومي وبروتين.'},
        {t:'mcq', q:'ما الذي يميّز الشبكة الإندوبلازمية الخشنة من الملساء؟', opts:['وجود DNA','وجود رايبوسومات على سطحها','وجود كلوروفيل','أنها خارج الخلية'], a:1, why:'الخشنة تحمل رايبوسومات تُظهرها «خشنة»، والملساء بلا رايبوسومات.'},
        {t:'cloud', q:'اختر العضيات التي تحوي DNA خاصًّا بها:', words:[{w:'النواة',ok:true},{w:'الميتوكوندريون',ok:true},{w:'البلاستيدة الخضراء',ok:true},{w:'الرايبوسوم',ok:false},{w:'جهاز جولجي',ok:false},{w:'الليسوسوم',ok:false},{w:'الشبكة الإندوبلازمية',ok:false},{w:'المريكز',ok:false}], why:'الميتوكوندريا والبلاستيدات تحوي DNA حلقيًا ورايبوسومات 70S خاصة بها إضافة إلى DNA النواة.'},
        {t:'open', q:'لو قارنت الخلية بمصنع، فما الأجزاء التي تتوقّع أن تجدها: مركز تحكّم؟ خطوط إنتاج؟ تغليف وشحن؟ إزالة نفايات؟ توقّع أيّ عضية تقابل كل جزء.'}
      ],
      slides:[
        {title:'الخلية مدينة مزدحمة', tag:'تمهيد', text:['تحت المجهر الإلكتروني لا تبدو الخلية كيسًا من الهلام، بل **مدينة** منظّمة بأجزاء متخصّصة تُسمّى **العضيات**.','العضيات **الغشائية**: النواة، الشبكة الإندوبلازمية، جولجي، الليسوسومات، الميتوكوندريا، البلاستيدات، الفجوة.','العضيات **غير الغشائية**: الرايبوسومات، المريكزات، الأنيبيبات الدقيقة.','تقسيم الخلية إلى حجرات غشائية يسمح بتفاعلات مختلفة في أماكن منفصلة.'], vis:'animal_cell', cap:'خلية حيوانية كما تكشفها الصورة الإلكترونية النافذة.'},
        {title:'النواة: مركز التحكّم', tag:'عضية 1', text:['أكبر عضية (نحو **10 µm**)، محاطة بـ**غلاف نووي** من غشاءَين فيهما **ثقوب نووية** تسمح بمرور mRNA والرايبوسومات إلى السيتوبلازم.','تحوي **الكروماتين**: DNA ملتفّ حول بروتينات هستونية، يتكاثف إلى **كروموسومات** عند الانقسام.','**النوية**: منطقة داكنة تصنع **RNA الرايبوسومي** وتجمّع الرايبوسومات.','النواة تتحكّم في أنشطة الخلية عبر التعليمات في DNA.'], vis:'nucleus_er_golgi', cap:'من النواة تخرج التعليمات (mRNA) إلى الرايبوسومات على الشبكة الخشنة.', q:{t:'mcq', q:'ما وظيفة النوية؟', opts:['تخزين النشا','صنع RNA الرايبوسومي وتجميع الرايبوسومات','إنتاج ATP','هضم العضيات القديمة'], a:1, why:'النوية غنية بـ rRNA والبروتينات وهي مصنع الرايبوسومات.'}},
        {title:'الشبكة الإندوبلازمية والرايبوسومات', tag:'عضية 2 و3', text:['**الشبكة الإندوبلازمية الخشنة (RER)**: أكياس غشائية مسطّحة متصلة بالغلاف النووي، تحمل **رايبوسومات**؛ تصنع البروتينات وتنقلها داخل تجاويفها.','**الشبكة الملساء (SER)**: بلا رايبوسومات؛ تصنع **الليبيدات والستيرويدات** (كالكوليسترول والهرمونات الجنسية).','**الرايبوسومات**: حبيبات من rRNA وبروتين بوحدتَين؛ **80S** (≈ 25 nm) في سيتوبلازم حقيقيات النواة، و**70S** (أصغر، ≈ 20 nm) في الميتوكوندريا والبلاستيدات وبدائيات النواة.','الرايبوسومات الحرّة تصنع بروتينات للخلية نفسها، والمرتبطة بالشبكة تصنع بروتينات للإفراز أو للأغشية.'], note:'💡 الرمز S (سفيدبرج) يعبّر عن سرعة الترسيب عند الطرد المركزي، وليس الحجم مباشرة؛ لذلك 80S ليست ضعف 70S.', vis:{kind:'compare', cols:[{icon:'🧱',title:'الشبكة الخشنة RER',items:['رايبوسومات على السطح','بناء البروتينات','نقل البروتينات في التجاويف','متصلة بالغلاف النووي']},{icon:'🫧',title:'الشبكة الملساء SER',items:['بلا رايبوسومات','بناء الليبيدات والستيرويدات','أنابيب أكثر من أكياس','وفيرة في خلايا الكبد والغدد']}]}},
        {title:'جهاز جولجي: التعديل والتغليف', tag:'عضية 4', text:['رزمة من **أكياس غشائية مسطّحة** تتكوّن باندماج حويصلات آتية من الشبكة الخشنة.','**يعدّل** البروتينات (يضيف سكريات → **بروتينات سكرية**) ويرتّبها ويغلّفها في **حويصلات جولجي**.','الحويصلات تتجه إلى غشاء الخلية للإفراز بـ**الإخراج الخلوي**، أو تصبح **ليسوسومات**.','في النبات ينقل مواد بناء **الجدار الخلوي** (عديدات السكر).'], vis:{kind:'flow', steps:[{icon:'⚫',t:'النواة (DNA → mRNA)'},{icon:'🧱',t:'الشبكة الخشنة (بناء البروتين)'},{icon:'🫧',t:'حويصلات نقل'},{icon:'📦',t:'جهاز جولجي (تعديل وتغليف)'},{icon:'🚚',t:'حويصلة إفرازية'},{icon:'🚪',t:'الإخراج الخلوي عبر الغشاء'}]}, q:{t:'mcq', q:'إنزيم هاضم يُفرَز من خلية في البنكرياس. ما ترتيب مروره؟', opts:['جولجي ← RER ← غشاء','RER ← جولجي ← حويصلة ← غشاء','ليسوسوم ← RER ← جولجي','SER ← نواة ← غشاء'], a:1, why:'يُبنى في RER، يُعدَّل ويُغلَّف في جولجي، ثم تحمله حويصلة إلى الغشاء للإخراج الخلوي.'}},
        {title:'الليسوسومات: وحدة الهضم والتدوير', tag:'عضية 5', text:['حويصلات كروية صغيرة (**0.1–0.5 µm**) بغشاء واحد، مليئة بـ**إنزيمات هضمية** (بروتييز، ليبيز، نيوكلييز).','تهضم **العضيات المستهلكة** وتعيد تدوير مكوّناتها.','في خلايا الدم البيضاء تهضم **البكتيريا** المبتلعة بالبلعمة.','في **رأس الحيوان المنوي** (الجسيم الطرفي) تهضم غلاف البويضة للإخصاب.','قد تحلّل الخلية كلّها بعد موتها (**التحلّل الذاتي**).'], vis:{kind:'cards', items:[{icon:'♻️',title:'تدوير العضيات',text:'هضم الميتوكوندريا القديمة مثلًا.'},{icon:'🦠',title:'قتل البكتيريا',text:'في الخلايا البلعمية.'},{icon:'🎯',title:'الجسيم الطرفي',text:'يفتح طريق الحيوان المنوي.'},{icon:'💥',title:'التحلّل الذاتي',text:'تفكيك الخلية الميتة.'}]}},
        {title:'الميتوكوندريا: محطّات الطاقة', tag:'عضية 6', text:['عضية بـ**غشاءَين**؛ الخارجي أملس، والداخلي مطويّ إلى **أعراف (كريستا)** تزيد مساحة السطح.','داخلها **الحشوة** (Matrix) تحوي إنزيمات، و**DNA حلقيًا** و**رايبوسومات 70S** خاصة بها.','موقع **التنفّس الهوائي** الذي يحوّل طاقة الجلوكوز إلى **ATP**، عملة الطاقة في الخلية.','نحو **1 µm** عرضًا؛ تكثر في الخلايا النشطة (العضلات، الكبد، الحيوان المنوي).'], vis:'mitochondrion', cap:'الأعراف تحمل إنزيمات إنتاج ATP، ومساحتها الكبيرة تعني إنتاجًا أكبر.', q:{t:'mcq', q:'لماذا الغشاء الداخلي للميتوكوندريون مطويّ؟', opts:['لتخزين DNA','لزيادة مساحة السطح لإنزيمات إنتاج ATP','لصنع البروتين','لحفظ الشكل الكروي'], a:1, why:'الطيّات (الأعراف) تضاعف المساحة المتاحة لتفاعلات التنفّس الهوائي.'}},
        {title:'البلاستيدات الخضراء: مصانع الغذاء', tag:'عضية 7 (نبات)', text:['محاطة بـ**غلاف** من غشاءَين، داخلها **الستروما** السائلة.','أغشية داخلية على شكل أقراص **ثايلاكويدات** مرصوصة في **جرانا**، وفيها **الكلوروفيل**.','تحوي **حبيبات نشا** وقطرات دهن و**DNA حلقيًا** و**رايبوسومات 70S**.','موقع **البناء الضوئي**: تحويل الطاقة الضوئية إلى طاقة كيميائية في السكريات.','أكبر من الميتوكوندريا (**3–10 µm** طولًا) وتُرى بالمجهر الضوئي.'], vis:'chloroplast'},
        {title:'الجدار والفجوة والبلازموديزماتا', tag:'تراكيب نباتية', text:['**الجدار الخلوي**: ألياف **سليلوز** دقيقة في مصفوفة؛ منفذ تمامًا؛ الجدر المتجاورة تلتصق بـ**الصفيحة الوسطى**.','**البلازموديزماتا**: قنوات دقيقة تعبر الجدر بين الخلايا المتجاورة، مبطّنة بغشاء الخلية، تربط سيتوبلازم الخلايا فتسمح بمرور المواد بينها.','**الفجوة**: محاطة بـ**التونوبلاست**، تخزّن العصير الخلوي وتحفظ امتلاء الخلية.'], vis:'plant_cell', cap:'الخلية النباتية بالمجهر الإلكتروني: لاحظ البلازموديزماتا التي تصل الخلايا المتجاورة.'},
        {title:'الهيكل الخلوي: المريكزات والأهداب والأسواط', tag:'تراكيب غير غشائية', text:['**الأنيبيبات الدقيقة**: أنابيب بروتينية (**تيوبيولين**) قطرها 25 nm، تدعم الخلية، تنقل العضيات والحويصلات، وتكوّن خيوط المغزل.','**المريكزان**: أسطوانتان متعامدتان قرب النواة في **الجسم المركزي**، كلّ منهما 9 ثلاثيات من الأنيبيبات (**9+0**)؛ يعملان أجسامًا قاعدية لبناء الأهداب والأسواط.','**الأهداب والأسواط**: امتدادات متحرّكة بتركيب **9+2** (9 أزواج محيطية + زوج مركزي)؛ الأهداب كثيرة قصيرة (تحرّك المخاط في القصبة الهوائية)، والأسواط قليلة طويلة (ذيل الحيوان المنوي).','**الزغابات الدقيقة**: نتوءات إصبعية من الغشاء تزيد مساحة السطح للامتصاص (خلايا الأمعاء).'], vis:'cilia_flagella'},
        {title:'خلاصة الدرس', tag:'خلاصة', text:['**النواة** (غلاف بثقوب، كروماتين، نوية) تتحكّم؛ **RER + رايبوسومات** تبني البروتين؛ **SER** تبني الليبيدات؛ **جولجي** يعدّل ويغلّف؛ **الليسوسومات** تهضم.','**الميتوكوندريا** تنتج ATP؛ **البلاستيدات الخضراء** تصنع الغذاء؛ كلتاهما بغشاءَين وDNA حلقي ورايبوسومات 70S.','نباتي فقط: **جدار سليلوزي، فجوة بتونوبلاست، بلاستيدات، بلازموديزماتا**. حيواني فقط: **مريكزات**.','**الأنيبيبات الدقيقة** (25 nm) تكوّن المريكزات (9+0) والأهداب والأسواط (9+2).'], vis:{kind:'table', head:['العضية','الأغشية','الوظيفة الرئيسة'], rows:[['النواة','غلاف مزدوج بثقوب','تحمل DNA وتتحكّم في الخلية'],['RER','غشاء واحد + رايبوسومات','بناء ونقل البروتين'],['SER','غشاء واحد','بناء الليبيدات والستيرويدات'],['جولجي','غشاء واحد (أكياس)','تعديل وتغليف وإفراز'],['الليسوسوم','غشاء واحد','هضم وتدوير'],['الميتوكوندريون','مزدوج (أعراف)','التنفّس الهوائي → ATP'],['البلاستيدة الخضراء','مزدوج (غلاف) + ثايلاكويدات','البناء الضوئي'],['الرايبوسوم','بلا غشاء','بناء البروتين'],['المريكز','بلا غشاء (9+0)','بناء الأهداب والأسواط']]}}

      slides:[
        {title:'أصغر الكائنات الحية وأكثرها', tag:'تمهيد', text:['في غرام واحد من تربة مزرعة عُمانية **مليارات** البكتيريا، وفي أمعائك عدد يفوق خلايا جسمك!','البكتيريا **بدائية النواة**: خلايا صغيرة (1–5 µm) بسيطة التركيب، بلا نواة ولا عضيات غشائية.','في هذا الدرس نتعرّف تركيب الخلية البكتيرية النموذجية كما يُظهره المجهر الإلكتروني.'], vis:'bacterium', q:{t:'mcq', q:'كم خلية بكتيرية طولها 2 µm تصطفّ في 1 mm؟', opts:['50','500','5000','50 000'], a:1, why:'1 mm = 1000 µm؛ 1000 ÷ 2 = 500.'}},
        {title:'الجدار والغشاء والمحفظة', tag:'الحدود الخارجية', text:['**الجدار الخلوي**: من **الببتيدوجليكان** (ببتيدات + سكريات) لا السليلوز؛ يحمي من الانفجار الأسموزي ويحفظ الشكل.','**غشاء سطح الخلية**: تحت الجدار، طبقة فوسفوليبيدية مزدوجة كما في حقيقيات النواة؛ وقد يُظهر انثناءات داخلية تحمل إنزيمات التنفّس أو البناء الضوئي.','**المحفظة** (أو الطبقة اللزجة): غلاف من عديدات السكر خارج الجدار في بعض البكتيريا؛ يحمي من الجفاف ومن خلايا المناعة ويساعد على الالتصاق.'], note:'💡 كثير من المضادّات الحيوية (كالبنسلين) تمنع بناء الببتيدوجليكان فتنفجر البكتيريا، ولا تؤثّر في خلايانا التي لا جدار لها.', vis:{kind:'steps', steps:[{icon:'🛡️',t:'المحفظة (خارجية، عديدات سكر) — حماية والتصاق'},{icon:'🧱',t:'الجدار الخلوي (ببتيدوجليكان) — شكل ومنع الانفجار'},{icon:'🫧',t:'غشاء سطح الخلية (فوسفوليبيد) — تنظيم الدخول والخروج'},{icon:'💧',t:'السيتوبلازم — التفاعلات والرايبوسومات'}]}},
        {title:'المادة الوراثية: DNA حلقي وبلازميدات', tag:'الداخل', text:['**DNA الرئيس**: جزيء واحد **حلقي** كبير حرّ في السيتوبلازم في منطقة تُسمّى **النيوكليويد**، غير محاط بغلاف، وغير مرتبط ببروتينات هستونية.','**البلازميدات**: حلقات DNA **صغيرة إضافية** تحمل جينات غير أساسية لكنها مفيدة، مثل **مقاومة المضادّات الحيوية**.','يمكن أن تنتقل البلازميدات **بين البكتيريا**، وهذا سبب انتشار المقاومة، وأداة العلماء في الهندسة الجينية.'], vis:{kind:'compare', cols:[{icon:'⭕',title:'DNA الرئيس (النيوكليويد)',items:['حلقي كبير','واحد في الخلية','يحمل الجينات الأساسية','حرّ بلا غلاف نووي']},{icon:'💍',title:'البلازميد',items:['حلقي صغير','واحد أو أكثر','جينات إضافية (مقاومة)','ينتقل بين البكتيريا']}]}, q:{t:'mcq', q:'أيّ تركيب يُفسّر انتقال مقاومة المضادّ الحيوي من بكتيريا إلى أخرى؟', opts:['الجدار الخلوي','البلازميد','الرايبوسوم','السوط'], a:1, why:'البلازميدات حلقات DNA صغيرة تحمل جينات المقاومة ويمكن نقلها بين الخلايا.'}},
        {title:'الرايبوسومات والسيتوبلازم', tag:'الداخل', text:['**الرايبوسومات 70S**: أصغر من رايبوسومات حقيقيات النواة (80S)، لكنها تؤدّي الوظيفة نفسها: **بناء البروتين**.','منتشرة بكثافة في السيتوبلازم؛ لا شبكة إندوبلازمية تحملها.','**لا عضيات غشائية**: لا ميتوكوندريا ولا جولجي ولا ليسوسومات؛ التنفّس يجري على الغشاء الخلوي وفي السيتوبلازم.','قد توجد **حبيبات تخزين** (جلايكوجين، دهون).'], note:'💡 بعض المضادّات الحيوية (كالستربتومايسين) تستهدف الرايبوسومات 70S تحديدًا دون 80S، فتوقف بناء البروتين في البكتيريا فقط.', vis:'bacterium', cap:'رايبوسومات كثيفة حرّة، وDNA حلقي، وبلازميدات: لا حجرات غشائية.'},
        {title:'السوط والأهلاب: الحركة والالتصاق', tag:'الزوائد', text:['**السوط البكتيري**: خيط بروتيني رفيع يدور كالمروحة (لا يتموّج) ويدفع الخلية؛ تركيبه **يختلف تمامًا** عن السوط 9+2 في حقيقيات النواة (لا أنيبيبات دقيقة).','قد يكون للبكتيريا سوط واحد أو عدّة أسواط أو لا شيء.','**الأهلاب (Pili)**: زوائد قصيرة كثيرة تساعد على **الالتصاق** بالأسطح والخلايا المضيفة، وبعضها ينقل **البلازميدات** بين بكتيريَّتين (الاقتران).'], vis:'cilia_flagella', cap:'قارن: السوط في حقيقيات النواة (9+2) يتموّج، أمّا السوط البكتيري فخيط بروتيني بسيط يدور.', q:{t:'mcq', q:'أيّ عبارة صحيحة عن السوط البكتيري؟', opts:['تركيبه 9+2 من الأنيبيبات','يدور كالمروحة وتركيبه يختلف عن سوط حقيقيات النواة','مصنوع من السليلوز','يوجد داخل السيتوبلازم'], a:1, why:'السوط البكتيري خيط بروتيني يدور بمحرّك في الغشاء، ولا يحوي أنيبيبات دقيقة.'}},

        {title:'كيف تتكاثر؟ ولماذا تنجح؟', tag:'إضاءة', text:['تتكاثر البكتيريا بـ**الانشطار الثنائي**: يتضاعف DNA الحلقي ثم تنقسم الخلية إلى خليتَين متماثلتَين.','قد يستغرق ذلك **20 دقيقة** فقط في ظروف مثالية.','صغر الحجم يعني **نسبة مساحة سطح إلى حجم كبيرة**، فتبادل المواد سريع، والنمو سريع.','النتيجة: تكيّف سريع وانتشار واسع، لكن أيضًا **تطوّر سريع للمقاومة**.'], vis:{kind:'cycle', center:'🦠', steps:[{icon:'⭕',t:'DNA حلقي واحد'},{icon:'⭕⭕',t:'تضاعف DNA'},{icon:'↔️',t:'استطالة الخلية'},{icon:'✂️',t:'تكوّن حاجز'},{icon:'🦠🦠',t:'خليتان متماثلتان'}]}},
        {title:'البكتيريا في عُمان: نعمة وتحدٍّ', tag:'ربط بالحياة', text:['**اللبن والجبن العُماني** ينتجهما تخمير بكتيريا حمض اللاكتيك.','بكتيريا **تثبيت النيتروجين** في جذور البقوليات تغني تربة المزارع.','في المقابل، **مقاومة المضادّات الحيوية** تحدٍّ صحي عالمي؛ لذلك تحذّر وزارة الصحة من استخدام المضادّات دون وصفة.'], vis:{kind:'cards', items:[{icon:'🥛',title:'صناعة الألبان',text:'تخمير اللاكتوز إلى حمض اللاكتيك.'},{icon:'🌱',title:'التربة',text:'تثبيت النيتروجين وتحليل المواد.'},{icon:'💊',title:'المضادّات الحيوية',text:'تستهدف الجدار أو الرايبوسوم 70S.'},{icon:'⚠️',title:'المقاومة',text:'تنتشر عبر البلازميدات.'}]}},

        {q:'خلية قطرها 2 µm، بلا نواة، جدارها ببتيدوجليكان. أيّ تركيب لا تتوقّع فيها؟', opts:['رايبوسومات','DNA حلقي','جهاز جولجي','غشاء خلوي'], a:2, why:'لا عضيات غشائية في بدائيات النواة.'},
        {q:'ما ميزة النسبة الكبيرة لمساحة السطح إلى الحجم في البكتيريا؟', opts:['تبادل سريع للمواد ونمو سريع','حماية من المضادّات','تكوين نواة','بناء الأسواط'], a:0, why:'الحجم الصغير يجعل الانتشار عبر الغشاء كافيًا وسريعًا.'},
        {q:'في الانشطار الثنائي:', opts:['تتكوّن خيوط مغزل','يتضاعف DNA الحلقي ثم تنقسم الخلية إلى خليتَين','تندمج خليتان','تتكوّن أمشاج'], a:1, why:'تكاثر لاجنسي بسيط دون مغزل أو كروموسومات خطية.'}
      ], reflect:['لماذا يُعدّ استخدام المضادّات الحيوية دون حاجة خطرًا على المجتمع كلّه لا على الفرد وحده؟ اربط بالبلازميدات.','لو صمّمت مضادًّا حيويًا جديدًا، أيّ تركيب بكتيري تستهدف كي لا يضرّ خلايا الإنسان؟ ولماذا؟'],
      summary:'البكتيريا خلايا **بدائية النواة** (1–5 µm) لها **جدار من الببتيدوجليكان** وغشاء وسيتوبلازم و**DNA حلقيًا** حرًّا و**رايبوسومات 70S**، وقد تحمل **بلازميدات ومحفظة وسوطًا وأهلابًا**. لا نواة ولا عضيات غشائية فيها، وتتكاثر بالانشطار الثنائي؛ وهذه الفروق تفسّر عمل المضادّات الحيوية وانتشار المقاومة.' }
    },

    { id:'l1_8', num:'١-٨', title:'مقارنة الخلايا بدائية النواة بالخلايا حقيقية النواة', en:'Comparing prokaryotic cells with eukaryotic cells', ws:false,
      preIntro:'درسنا الخلية النباتية والحيوانية ثم البكتيرية. حان وقت وضعها جنبًا إلى جنب: ما المشترك؟ وما الفروق الحاسمة؟',

        {t:'visual', vis:'pro_vs_eu', q:'كم مرة تقريبًا تكبر الخلية حقيقية النواة النموذجية (40 µm) الخلية البكتيرية (2 µm) في الطول؟', opts:['مرتَين','20 مرة','200 مرة','2000 مرة'], a:1, why:'40 ÷ 2 = 20 مرة في الطول (وأكثر بكثير في الحجم).'},
        {t:'tf', q:'الخلايا بدائية النواة وحقيقية النواة كلتاهما تحوي رايبوسومات.', a:true, why:'الرايبوسومات في كل الخلايا، لكنها 70S في بدائيات النواة و80S في سيتوبلازم حقيقيات النواة.'},

        {t:'open', q:'الميتوكوندريا تشبه البكتيريا في الحجم وDNA الحلقي والرايبوسومات 70S. ماذا يمكن أن يعني ذلك عن تاريخ الخلية حقيقية النواة؟'}
      ],
      slides:[
        {title:'عالمان من الخلايا', tag:'تمهيد', text:['كل خلية على الأرض تنتمي إلى أحد نمطَين: **بدائية النواة** (البكتيريا والعتائق) أو **حقيقية النواة** (النبات، الحيوان، الفطريات، الطلائعيات).','بدائيات النواة ظهرت أولًا قبل نحو 3.5 مليار سنة، وحقيقيات النواة بعدها بنحو ملياري سنة.','الاسم يكشف الفرق الجوهري: **pro** = قبل، **eu** = حقيقي، **karyon** = نواة.'], vis:'pro_vs_eu', cap:'الفرق في الحجم وحده صارخ: 1–5 µm مقابل نحو 40 µm.'},
        {title:'الحجم والتنظيم', tag:'مقارنة 1', text:['**بدائية النواة**: 1–5 µm، بسيطة، بلا حجرات داخلية.','**حقيقية النواة**: عادةً 10–100 µm (نموذجيًا 40 µm للنباتية)، معقّدة، مقسّمة إلى **حجرات غشائية** (عضيات).','التقسيم إلى حجرات يسمح بتفاعلات متعارضة في الوقت نفسه (هضم في الليسوسوم، بناء في الرايبوسوم).','حجم الخلية حقيقية النواة أكبر بآلاف المرات من حيث الحجم (وليس الطول فقط).'], vis:{kind:'bars', items:[{t:'فيروس',v:0.1,label:'0.1 µm'},{t:'بكتيريا',v:2,label:'2 µm'},{t:'خلية حيوانية',v:20,label:'20 µm'},{t:'خلية نباتية',v:40,label:'40 µm'}], cap:'الأطوال النموذجية بالميكرومتر'}, q:{t:'mcq', q:'ما فائدة تقسيم الخلية حقيقية النواة إلى عضيات غشائية؟', opts:['تصغير الخلية','فصل تفاعلات مختلفة وتنظيمها','التخلّص من الرايبوسومات','منع دخول الماء'], a:1, why:'كل حجرة توفّر بيئة مناسبة لعمليتها (كإنزيمات الليسوسوم الحمضية).'}},
        {title:'المادة الوراثية', tag:'مقارنة 2', text:['**بدائية النواة**: جزيء DNA **حلقي** واحد حرّ في السيتوبلازم (النيوكليويد)، غير مرتبط بهستونات، وغالبًا **بلازميدات**.','**حقيقية النواة**: DNA **خطّي** في عدّة كروموسومات، مرتبط ببروتينات **هستونية**، محاط بـ**غلاف نووي** بثقوب.','في حقيقيات النواة يوجد DNA إضافي حلقي في **الميتوكوندريا والبلاستيدات**.'], vis:'nucleus_er_golgi', cap:'الغلاف النووي بثقوبه: حدّ فاصل لا تملكه بدائيات النواة.'},
        {title:'الرايبوسومات والعضيات', tag:'مقارنة 3', text:['**الرايبوسومات**: 70S في بدائيات النواة؛ 80S في سيتوبلازم حقيقيات النواة (و70S داخل الميتوكوندريا والبلاستيدات).','**العضيات الغشائية** (ميتوكوندريا، شبكة إندوبلازمية، جولجي، ليسوسومات، بلاستيدات): في حقيقيات النواة **فقط**.','**الهيكل الخلوي** من أنيبيبات دقيقة (25 nm) والمريكزات: في حقيقيات النواة.','بدائيات النواة تجري التنفّس على **الغشاء الخلوي** وانثناءاته.'], vis:{kind:'compare', cols:[{icon:'🦠',title:'بدائية النواة',items:['رايبوسومات 70S فقط','لا عضيات غشائية','لا شبكة إندوبلازمية ولا جولجي','التنفّس على الغشاء الخلوي']},{icon:'🧫',title:'حقيقية النواة',items:['80S في السيتوبلازم + 70S في العضيات','ميتوكوندريا (وبلاستيدات في النبات)','شبكة إندوبلازمية وجولجي وليسوسومات','هيكل خلوي من أنيبيبات دقيقة']}]}, q:{t:'mcq', q:'أين توجد رايبوسومات 70S في الخلية النباتية؟', opts:['في السيتوبلازم الحرّ','في الميتوكوندريا والبلاستيدات الخضراء','في النواة','لا توجد'], a:1, why:'العضيتان تحملان رايبوسومات 70S وDNA حلقيًا يشبهان ما في البكتيريا.'}},
        {title:'الجدار والأسواط والانقسام', tag:'مقارنة 4', text:['**الجدار الخلوي**: ببتيدوجليكان في البكتيريا؛ **سليلوز** في النبات؛ **كيتين** في الفطريات؛ **لا جدار** في الحيوان.','**الأسواط**: خيط بروتيني بسيط يدور في البكتيريا؛ تركيب **9+2** من الأنيبيبات يتموّج في حقيقيات النواة.','**الانقسام**: **انشطار ثنائي** بسيط في بدائيات النواة؛ **انقسام متساوٍ** (وأحيانًا اختزالي) بخيوط مغزل في حقيقيات النواة.'], vis:{kind:'table', head:['الصفة','بدائية النواة','حقيقية النواة'], rows:[['الجدار','ببتيدوجليكان','سليلوز (نبات) / كيتين (فطر) / لا شيء (حيوان)'],['السوط','بروتيني يدور','9+2 يتموّج'],['الانقسام','انشطار ثنائي','انقسام متساوٍ بمغزل'],['البلازميدات','شائعة','نادرة']]}},
        {title:'ما المشترك بينهما؟', tag:'التشابه', text:['**غشاء سطح الخلية** فوسفوليبيدي في كلتَيهما.','**السيتوبلازم** وسط التفاعلات.','**DNA** يحمل الشيفرة الوراثية نفسها.','**رايبوسومات** تبني البروتين بالآلية نفسها.','كلتاهما **خلية حية** تنمو وتتنفّس وتتكاثر، على خلاف الفيروسات.'], vis:{kind:'cycle', center:'🤝', steps:[{icon:'🫧',t:'غشاء خلوي'},{icon:'💧',t:'سيتوبلازم'},{icon:'🧬',t:'DNA'},{icon:'⚙️',t:'رايبوسومات'},{icon:'⚡',t:'إنزيمات وتفاعلات'}]}, q:{t:'mcq', q:'أيّ ممّا يأتي مشترك بين البكتيريا وخلية الكبد؟', opts:['الغلاف النووي','جهاز جولجي','غشاء سطح الخلية والرايبوسومات','الميتوكوندريا'], a:2, why:'الغشاء والرايبوسومات في كل الخلايا؛ الغلاف النووي وجولجي والميتوكوندريا في حقيقيات النواة فقط.'}},
        {title:'الجدول الشامل', tag:'تلخيص', text:['هذا الجدول هو الذي يُطلب منك في الامتحان؛ احفظ الفروق **بالأزواج**.','انتبه إلى أن الميتوكوندريا والبلاستيدات (70S، DNA حلقي) تحمل «بصمة بدائية» داخل الخلية حقيقية النواة.'], vis:{kind:'table', head:['الصفة','بدائية النواة','حقيقية النواة'], rows:[['الحجم','1–5 µm','حتى 40 µm أو أكثر'],['النواة','لا (نيوكليويد)','نعم، بغلاف نووي وثقوب'],['DNA','حلقي، حرّ، بلا هستونات','خطّي، كروموسومات مع هستونات'],['الرايبوسومات','70S','80S (و70S في العضيات)'],['الميتوكوندريا','لا','نعم'],['شبكة إندوبلازمية وجولجي','لا','نعم'],['البلاستيدات','لا','في النبات والطحالب'],['الجدار','ببتيدوجليكان','سليلوز / كيتين / لا شيء'],['السوط','بروتيني بسيط','9+2 أنيبيبات'],['الانقسام','انشطار ثنائي','انقسام متساوٍ']]}},
        {title:'لماذا يهمّنا الفرق؟', tag:'ربط بالحياة', text:['**المضادّات الحيوية** تستهدف ما تنفرد به البكتيريا: الجدار الببتيدوجليكاني أو الرايبوسوم 70S، فلا تضرّ خلايانا.','لكن لأن الميتوكوندريا تحوي 70S، قد تظهر لبعض المضادّات آثار جانبية.','فهم الفرق أساس **الهندسة الجينية**: إدخال جينات بشرية في بلازميدات بكتيرية لإنتاج الإنسولين.'], vis:{kind:'cards', items:[{icon:'💊',title:'مضادّات انتقائية',text:'تستهدف 70S أو الببتيدوجليكان.'},{icon:'⚠️',title:'آثار جانبية',text:'ميتوكوندرياتنا تحوي 70S أيضًا.'},{icon:'🧬',title:'الهندسة الجينية',text:'بلازميدات تحمل جينات بشرية.'},{icon:'🔬',title:'التشخيص',text:'تمييز عدوى بكتيرية من غيرها.'}]}},
        {title:'خلاصة الدرس', tag:'خلاصة', text:['**بدائية النواة**: صغيرة، DNA حلقي حرّ، 70S، لا عضيات غشائية، جدار ببتيدوجليكان، انشطار ثنائي.','**حقيقية النواة**: كبيرة، نواة بغلاف، DNA خطّي مع هستونات، 80S، عضيات غشائية، انقسام متساوٍ.','**المشترك**: غشاء، سيتوبلازم، DNA، رايبوسومات.','الميتوكوندريا والبلاستيدات تحمل صفات بدائية (70S، DNA حلقي).'], vis:'pro_vs_eu'}

    { id:'l1_9', num:'١-٩', title:'الفيروسات', en:'Viruses', ws:false,
      preIntro:'الإنفلونزا، كورونا، الحصبة… كلّها فيروسات. لكن هل الفيروس خلية؟ وهل هو حيّ أصلًا؟ لنستدعِ ما نعرفه ونتوقّع.',
      pre:[
        {t:'tf', q:'الفيروسات أصغر من البكتيريا بكثير.', a:true, why:'الفيروسات 20–300 nm، أمّا البكتيريا فنحو 1000–5000 nm (1–5 µm).'},
        {t:'mcq', q:'لماذا لا تفيد المضادّات الحيوية في علاج نزلة البرد الفيروسية؟', opts:['لأن الفيروس أكبر من البكتيريا','لأن الفيروس بلا جدار ولا رايبوسومات تستهدفها المضادّات','لأن الفيروس يقتل المضادّ','لأن الفيروسات نباتية'], a:1, why:'المضادّات الحيوية تستهدف تراكيب بكتيرية (الجدار، 70S) لا يملكها الفيروس.'},
        {t:'visual', vis:'virus', q:'ما الذي يحيط بالحمض النووي في كل فيروس؟', opts:['غشاء فوسفوليبيدي دائمًا','محفظة بروتينية (كابسيد)','جدار ببتيدوجليكان','سيتوبلازم'], a:1, why:'الكابسيد غلاف بروتيني في كل الفيروسات؛ الغلاف الدهني في بعضها فقط.'},
        {t:'cloud', q:'اختر ما يوجد في الفيروس:', words:[{w:'DNA أو RNA',ok:true},{w:'كابسيد بروتيني',ok:true},{w:'غلاف دهني (في بعضها)',ok:true},{w:'رايبوسومات',ok:false},{w:'سيتوبلازم',ok:false},{w:'ميتوكوندريا',ok:false},{w:'جدار خلوي',ok:false},{w:'بروتينات سطحية (أشواك)',ok:true},{w:'نواة',ok:false}], why:'الفيروس حمض نووي داخل كابسيد بروتيني، وربما غلاف دهني بأشواك بروتينية؛ لا عضيات ولا سيتوبلازم.'},
        {t:'open', q:'الفيروس لا يتنفّس ولا يتغذّى ولا يتكاثر إلا داخل خلية حية. هل تعدّه كائنًا حيًّا؟ دافع عن رأيك.'}
      ],
      slides:[
        {title:'ليست خلايا!', tag:'تمهيد', text:['فيروس الإنفلونزا نحو **100 nm**؛ أي إن **400 فيروس** تصطفّ في عرض خلية 40 µm.','الفيروس **ليس خلية**: لا سيتوبلازم، لا رايبوسومات، لا عضيات، لا غشاء خلوي خاص، ولا أيض (تفاعلات حيوية) مستقل.','هو **جسيم** من حمض نووي داخل غلاف بروتيني، لا يتكاثر إلا **داخل خلية حية**.'], vis:'virus', cap:'مقارنة الحجم: الفيروس نقطة صغيرة بجوار البكتيريا.', q:{t:'mcq', q:'كم فيروسًا قطره 100 nm يصطفّ في طول بكتيريا 2 µm؟', opts:['2','20','200','2000'], a:1, why:'2 µm = 2000 nm؛ 2000 ÷ 100 = 20.'}},
        {title:'التركيب الأساسي', tag:'المكوّنات', text:['**الحمض النووي**: إما **DNA** أو **RNA** (لا كلاهما)، مفرد أو مزدوج السلسلة؛ يحمل الجينات القليلة للفيروس.','**الكابسيد** (المحفظة البروتينية): يحيط بالحمض النووي ويحميه؛ مكوّن من وحدات بروتينية متكرّرة تُسمّى **الكابسوميرات**.','الشكل: متعدّد السطوح (عشروني الوجوه)، حلزوني، أو مركّب (كالفيروسات الآكلة للبكتيريا ذات الرأس والذيل).'], vis:{kind:'cards', items:[{icon:'🧬',title:'الحمض النووي',text:'DNA أو RNA، مفرد أو مزدوج.'},{icon:'🛡️',title:'الكابسيد',text:'غلاف بروتيني من كابسوميرات.'},{icon:'🔷',title:'الأشكال',text:'عشروني الوجوه، حلزوني، مركّب.'},{icon:'📏',title:'الحجم',text:'20–300 nm.'}]}},
        {title:'الغلاف الدهني: في بعضها فقط', tag:'الغلاف', text:['بعض الفيروسات (كالإنفلونزا وHIV وكورونا) لها **غلاف** من **فوسفوليبيدات** تأخذه من غشاء الخلية المضيفة عند خروجها.','في الغلاف **بروتينات سكرية** (أشواك) تتعرّف مستقبلات الخلية المضيفة وتساعد الفيروس على الدخول.','الفيروسات **غير المغلّفة** (كفيروس شلل الأطفال) لها كابسيد عارٍ فقط، وهي أكثر مقاومة للمطهّرات والصابون.'], note:'💡 الصابون يذيب الغلاف الدهني لفيروس كورونا، ولهذا كان غسل اليدين فعّالًا.', vis:'virus', cap:'غلاف دهني بأشواك بروتينية في الفيروسات المغلّفة.', q:{t:'mcq', q:'من أين يأتي الغلاف الدهني للفيروسات المغلّفة؟', opts:['يصنعه الفيروس بنفسه','من غشاء الخلية المضيفة','من الكابسيد','من جدار البكتيريا'], a:1, why:'الفيروس لا يملك أيضًا لصنع الليبيدات؛ يلتقط الغلاف من غشاء المضيف عند التبرعم.'}},
        {title:'كيف يتكاثر؟ طفيلي إجباري', tag:'التكاثر', text:['الفيروس **طفيلي داخل خلوي إجباري**: لا يستطيع التكاثر خارج خلية حية تُسمّى **الخلية المضيفة** (العائل).','يرتبط بمستقبلات الخلية، يُدخل حمضه النووي، فتستخدم **رايبوسومات المضيف وإنزيماته وطاقته** لنسخ الحمض النووي وبناء بروتينات الكابسيد.','تتجمّع الفيروسات الجديدة وتخرج (بتحطيم الخلية أو التبرعم)، فتصيب خلايا أخرى.','بعض الفيروسات تصيب البكتيريا (**الفيروسات الآكلة للبكتيريا**)، وأخرى النبات (فيروس موزاييك التبغ) والحيوان.'], vis:{kind:'cycle', center:'🦠', steps:[{icon:'🔗',t:'الارتباط بمستقبلات المضيف'},{icon:'⬇️',t:'إدخال الحمض النووي'},{icon:'📄',t:'نسخ الجينوم بإنزيمات المضيف'},{icon:'⚙️',t:'بناء بروتينات الكابسيد على رايبوسومات المضيف'},{icon:'🧩',t:'تجميع فيروسات جديدة'},{icon:'💥',t:'الخروج وإصابة خلايا جديدة'}]}},
        {title:'فيروس مقابل بكتيريا', tag:'مقارنة', text:['البكتيريا **خلية حية** كاملة؛ الفيروس **جسيم** بلا خلية.','البكتيريا تتكاثر **وحدها** بالانشطار الثنائي؛ الفيروس **يحتاج مضيفًا**.','المضادّات الحيوية تقتل البكتيريا؛ ولا تؤثّر في الفيروسات (تُستخدم **مضادّات الفيروسات** و**اللقاحات**).'], vis:{kind:'table', head:['الصفة','الفيروس','البكتيريا'], rows:[['الحجم','20–300 nm','1–5 µm'],['خلية؟','لا','نعم (بدائية النواة)'],['الحمض النووي','DNA أو RNA','DNA (حلقي) دائمًا'],['الغلاف الخارجي','كابسيد بروتيني (± غلاف دهني)','جدار ببتيدوجليكان + غشاء'],['رايبوسومات','لا','70S'],['الأيض','لا','نعم'],['التكاثر','داخل مضيف فقط','مستقل (انشطار ثنائي)'],['العلاج','مضادّات فيروسات / لقاحات','مضادّات حيوية']]}, q:{t:'mcq', q:'أيّ العبارات تميّز الفيروس من البكتيريا؟', opts:['له جدار خلوي','يحوي رايبوسومات 70S','لا يتكاثر إلا داخل خلية حية','ينقسم انشطارًا ثنائيًا'], a:2, why:'الفيروس طفيلي إجباري لا يملك آلية التكاثر الذاتي.'}},
        {title:'هل الفيروس حيّ؟', tag:'نقاش', text:['**مع الحياة**: يحمل مادة وراثية، يتكاثر (داخل المضيف)، يتطوّر بالطفرات.','**ضدّ الحياة**: ليس خلية، لا أيض، لا نمو، لا استجابة مستقلّة، خامل تمامًا خارج المضيف (يمكن بلورته!).','معظم العلماء يصفونه بأنه «على حدّ الحياة»؛ **لا تنطبق عليه نظرية الخلية**.'], vis:{kind:'compare', cols:[{icon:'✅',title:'صفات شبه حية',items:['مادة وراثية DNA/RNA','يتكاثر داخل المضيف','يتطوّر بالطفرات','يتخصّص بمضيف معيّن']},{icon:'❌',title:'صفات غير حية',items:['ليس خلية','لا أيض ولا تنفّس','لا نمو','خامل خارج الخلية']}]}},
        {title:'الفيروسات في حياتنا', tag:'ربط بعُمان', text:['**اللقاحات الوطنية** في عُمان (الحصبة، شلل الأطفال، التهاب الكبد B) تدرّب المناعة على الكابسيد أو الأشواك البروتينية.','جائحة **كوفيد-19** أظهرت أهمية فهم الغلاف الدهني (الصابون والمطهّرات) والأشواك (اللقاحات).','**فيروسات النبات** تهدّد محاصيل مثل الطماطم في مزارع الباطنة.','**الفيروسات الآكلة للبكتيريا** تُدرَس كبديل للمضادّات الحيوية.'], vis:{kind:'cards', items:[{icon:'💉',title:'اللقاحات',text:'تدريب المناعة على بروتينات الفيروس.'},{icon:'🧼',title:'النظافة',text:'الصابون يذيب الغلاف الدهني.'},{icon:'🍅',title:'الزراعة',text:'فيروسات تصيب المحاصيل.'},{icon:'🔬',title:'البحث',text:'فيروسات لعلاج العدوى البكتيرية.'}]}},
        {title:'خلاصة الدرس', tag:'خلاصة', text:['الفيروس **ليس خلية**: 20–300 nm، حمض نووي (**DNA أو RNA**) داخل **كابسيد** بروتيني، وربما **غلاف** دهني بأشواك.','لا سيتوبلازم ولا رايبوسومات ولا أيض؛ **طفيلي إجباري** يتكاثر بآلات الخلية المضيفة.','لا تؤثّر فيه المضادّات الحيوية؛ الوقاية باللقاحات والنظافة.'], vis:'virus'}
      ],

        {title:'من الوحدة إلى الجزيء الكبير', tag:'الفكرة الكبرى', text:['كل مجموعة من الجزيئات الكبيرة لها **وحدتها البنائية** الخاصة.','ترتبط الوحدات بروابط تساهمية عبر **تفاعل التكاثف** (تفصيله في الدرس القادم).','التنوّع الهائل ينشأ من **عدد الوحدات وترتيبها** وطريقة ارتباطها.'], vis:{kind:'table', head:['الوحدة البنائية','الجزيء الكبير','أمثلة'], rows:[['سكر أحادي (جلوكوز)','عديد السكريات','نشا، جلايكوجين، سليلوز'],['حمض أميني','عديد الببتيد / بروتين','هيموجلوبين، إنزيمات'],['نيوكليوتيد','عديد النيوكليوتيد','DNA، RNA'],['جليسرول + أحماض دهنية','جليسريد ثلاثي (ليس بوليمرًا)','دهون، زيوت']]}, q:{t:'mcq', q:'ما الوحدة البنائية للأحماض النووية؟', opts:['الحمض الأميني','النيوكليوتيد','الجلوكوز','الجليسرول'], a:1, why:'DNA وRNA عديدات نيوكليوتيد.'}},
        {title:'السكريات الأحادية', tag:'الوحدة ١', text:['**السكريات الأحادية** (Monosaccharides) سكريات بسيطة صيغتها العامة **(CH₂O)n**.','تُصنّف بعدد ذرات الكربون: **ثلاثية** (n=3)، **خماسية** (n=5: الرايبوز والديوكسي رايبوز)، **سداسية** (n=6: الجلوكوز، الفركتوز، الجالاكتوز).','الجلوكوز **C₆H₁₂O₆** أهمها: مصدر الطاقة الرئيس للخلايا، ويوجد في صورة حلقية في المحاليل.','الفركتوز والجالاكتوز لهما الصيغة نفسها لكن بترتيب مختلف للذرات (**أيزومرات**).'], vis:'glucose_ring', cap:'حلقة الجلوكوز: ست ذرات كربون مرقّمة C1–C6 ومجموعات OH.', q:{t:'mcq', q:'الرايبوز سكر خماسي؛ ما صيغته الجزيئية؟', opts:['C₃H₆O₃','C₅H₁₀O₅','C₆H₁₂O₆','C₁₂H₂₂O₁₁'], a:1, why:'بتطبيق (CH₂O)n مع n=5.'}},
        {title:'الأحماض الأمينية', tag:'الوحدة ٢', text:['في البروتينات **20 نوعًا** من الأحماض الأمينية.','تركيبها العام: ذرة كربون مركزية ترتبط بـ **مجموعة أمين (–NH₂)**، **مجموعة كربوكسيل (–COOH)**، ذرة **هيدروجين**، و**مجموعة R**.','**مجموعة R** هي ما يختلف بين الأحماض الأمينية؛ في أبسطها (الجلايسين) هي ذرة هيدروجين، وبعضها يحوي **الكبريت**.'], note:'💡 مجموعة الأمين قاعدية ومجموعة الكربوكسيل حمضية، ومن هنا الاسم «حمض أميني».', vis:'amino_acid', cap:'أمين وكربوكسيل وهيدروجين ومجموعة R حول كربون مركزي.', q:{t:'mcq', q:'أي مجموعتين تشتركان في تكوين الرابطة الببتيدية بين حمضَين أمينيَّين؟', opts:['R وR','الأمين والكربوكسيل','الهيدروجين والأمين','الكربوكسيل والكربوكسيل'], a:1, why:'ترتبط مجموعة الأمين لحمض بمجموعة الكربوكسيل للآخر مع خروج ماء.'}},
        {title:'النيوكليوتيدات', tag:'الوحدة ٣', text:['**النيوكليوتيد** يتكوّن من ثلاثة أجزاء: **مجموعة فوسفات**، **سكر خماسي** (رايبوز في RNA، ديوكسي رايبوز في DNA)، و**قاعدة نيتروجينية**.','ترتبط النيوكليوتيدات في سلاسل طويلة (**عديد النيوكليوتيد**) تكوّن DNA وRNA.','بعض النيوكليوتيدات لها وظائف مستقلة، مثل **ATP** عملة الطاقة في الخلية.'], vis:{kind:'flow', steps:[{icon:'🟠',t:'فوسفات'},{icon:'⬠',t:'سكر خماسي'},{icon:'🟦',t:'قاعدة نيتروجينية'},{icon:'🧬',t:'نيوكليوتيد'}]}, cap:'ثلاثة أجزاء في كل نيوكليوتيد.'},
        {title:'الجليسرول والأحماض الدهنية', tag:'الوحدة ٤', text:['**الجليسرول**: كحول صغير بثلاث ذرات كربون وثلاث مجموعات **هيدروكسيل (–OH)**.','**الحمض الدهني**: سلسلة هيدروكربونية طويلة تنتهي بمجموعة **كربوكسيل (–COOH)**.','جليسرول واحد + ثلاثة أحماض دهنية ← **جليسريد ثلاثي** (دهن أو زيت).','الليبيدات **ليست بوليمرات**؛ عدد وحداتها قليل وثابت.'], vis:'triglyceride', cap:'سنفصّل تكوين الجليسريدات الثلاثية في درس الليبيدات.'},
        {title:'من الطبق إلى الخلية', tag:'ربط بالحياة', text:['نأكل جزيئات **كبيرة** (نشا الخبز، بروتين اللحم والسمك، دهون الزيت).','**الهضم** يفكّكها إلى وحداتها البنائية الصغيرة القابلة للامتصاص إلى الدم.','خلايا الجسم **تعيد تركيب** هذه الوحدات لبناء جزيئاتها الخاصة: جلايكوجين، بروتينات، دهون مخزّنة.'], note:'💡 بروتين السمك وبروتين عضلاتك مبنيّان من الأحماض الأمينية العشرين نفسها، لكن بترتيب مختلف.', vis:{kind:'flow', steps:[{icon:'🍽️',t:'جزيئات كبيرة في الطعام'},{icon:'🧪',t:'هضم (تحلل مائي)'},{icon:'🔹',t:'وحدات بنائية صغيرة'},{icon:'🩸',t:'امتصاص إلى الدم'},{icon:'🏗️',t:'بناء جزيئات الخلية'}]}},
        {title:'لماذا هذه الوحدات مناسبة للبناء؟', tag:'تحليل', text:['**صغيرة وذائبة في الماء** (معظمها)، فتنتقل بسهولة في السيتوبلازم والدم.','تحمل **مجموعات كيميائية نشطة** (OH، NH₂، COOH) تسمح لها بالارتباط بغيرها.','قابلة **للربط والتفكيك** بتفاعلات عكوسة تتحكّم فيها الإنزيمات.'], vis:{kind:'compare', cols:[{icon:'🔹',title:'الوحدة البنائية',items:['صغيرة','ذائبة غالبًا','تحمل مجموعات نشطة','تنتقل عبر الأغشية']},{icon:'🔷',title:'الجزيء الكبير',items:['ضخم','غير ذائب غالبًا','مستقر للتخزين والبناء','يبقى داخل الخلية']}]}, q:{t:'mcq', q:'لماذا يُنقل الجلوكوز في الدم بدلًا من النشا؟', opts:['لأن النشا سام','لأن الجلوكوز صغير وذائب في الماء','لأن النشا لا يحوي طاقة','لأن الجلوكوز غير ذائب'], a:1, why:'الجلوكوز صغير ذائب فيسهل نقله وامتصاصه، أما النشا فكبير وغير ذائب.'}},
        {title:'خلاصة الدرس', tag:'خلاصة', text:['أربعة أنواع من الوحدات البنائية تبني جزيئات الحياة الكبيرة.','**السكريات الأحادية** (CH₂O)n ← عديدات السكريات.','**الأحماض الأمينية** (20 نوعًا) ← البروتينات.','**النيوكليوتيدات** (فوسفات + سكر خماسي + قاعدة) ← الأحماض النووية.','**الجليسرول والأحماض الدهنية** ← الجليسريدات الثلاثية (ليست بوليمرًا).'], vis:{kind:'steps', steps:[{icon:'🍬',t:'سكر أحادي ← عديد سكريات'},{icon:'🧩',t:'حمض أميني ← بروتين'},{icon:'🔩',t:'نيوكليوتيد ← DNA / RNA'},{icon:'🛢️',t:'جليسرول + أحماض دهنية ← دهون'}]}}

        {t:'visual', vis:'monomer_polymer', q:'في الرسم: التفاعل الذي يفكّك البوليمر إلى مونومرات بإضافة الماء يُسمّى:', opts:['التكاثف','التحلل المائي','الأكسدة','التخمّر'], a:1, why:'التحلل المائي (Hydrolysis) = تفكيك بالماء.'},
        {t:'open', q:'عند طهي الأرز يمتص الماء ويلين، وعند هضمه يتحوّل نشاؤه إلى جلوكوز. أيهما تغيّر كيميائي حقيقي في الروابط؟ ولماذا؟'}

      slides:[
        {title:'خرزات وعقود', tag:'تمهيد', text:['تخيّل **خرزات** متشابهة تُنظم في **عقد** طويل: الخرزة **مونومر**، والعقد **بوليمر**.','الأهداف: تعريف المونومر والبوليمر والجزيء الكبير، وفهم **تفاعل التكاثف** و**التحلل المائي**.','سؤال: لماذا يخرج ماء عند بناء البوليمر، ويُستهلك ماء عند تفكيكه؟'], vis:'monomer_polymer', cap:'مونومرات تتحد بالتكاثف وتنفصل بالتحلل المائي.'},
        {title:'المونومر والبوليمر', tag:'تعريفات', text:['**المونومر** (Monomer): وحدة صغيرة يمكن أن ترتبط بوحدات مماثلة.','**البوليمر** (Polymer): جزيء كبير مكوّن من **مونومرات كثيرة** متكرّرة مرتبطة بروابط تساهمية.','قد تكون المونومرات متماثلة (كالجلوكوز في النشا) أو متنوّعة (20 حمضًا أمينيًا في البروتين).'], vis:{kind:'table', head:['المونومر','البوليمر','اسم الرابطة'], rows:[['سكر أحادي','عديد السكريات','جلايكوسيدية'],['حمض أميني','عديد الببتيد','ببتيدية'],['نيوكليوتيد','عديد النيوكليوتيد','فوسفوثنائية الإستر']]}, q:{t:'mcq', q:'ما الرابطة بين مونومرات عديد السكريات؟', opts:['ببتيدية','جلايكوسيدية','إستر','هيدروجينية'], a:1, why:'السكريات ترتبط بروابط جلايكوسيدية.'}},
        {title:'الجزيئات الكبيرة (Macromolecules)', tag:'مفهوم', text:['**الجزيء الكبير**: جزيء ضخم يتكوّن من مئات إلى آلاف الذرات.','الأنواع الثلاثة الرئيسة في الكائنات الحية: **عديدات السكريات**، **البروتينات**، **الأحماض النووية** — وكلها بوليمرات.','**الليبيدات** (كالجليسريدات الثلاثية) **ليست بوليمرات**؛ فهي مبنية من عدد قليل ثابت من الجزيئات، وهي أصغر نسبيًا من الجزيئات الكبيرة.'], note:'💡 كل بوليمر حيوي جزيء كبير؛ أمّا الليبيدات فليست بوليمرات، وليست من أنواع الجزيئات الكبيرة الثلاثة.', vis:{kind:'compare', cols:[{icon:'🧬',title:'بوليمرات (جزيئات كبيرة)',items:['النشا والجلايكوجين والسليلوز','البروتينات','DNA وRNA']},{icon:'🛢️',title:'ليست بوليمرات',items:['الجليسريدات الثلاثية','الفوسفوليبيدات','الكوليسترول']}]}},
        {title:'تفاعل التكاثف', tag:'البناء', text:['**تفاعل التكاثف** (Condensation): ارتباط مونومرَين برابطة تساهمية مع **نزع جزيء ماء**.','يخرج **–OH** من أحد المونومرين و**–H** من الآخر فيتكوّن H₂O.','كل رابطة جديدة = جزيء ماء واحد؛ فربط 100 مونومر يُنتج 99 جزيء ماء.','تحفّزه **إنزيمات** وتستهلك الخلية **طاقة** في البناء.'], vis:{kind:'flow', steps:[{icon:'🔹',t:'مونومر'},{icon:'➕',t:'مونومر'},{icon:'💧',t:'خروج H₂O'},{icon:'🔗',t:'رابطة تساهمية'},{icon:'🔷',t:'ثنائي ← بوليمر'}]}, q:{t:'mcq', q:'كم جزيء ماء يخرج عند ربط 5 جلوكوز في سلسلة واحدة؟', opts:['3','4','5','6'], a:1, why:'عدد الروابط = عدد المونومرات − 1 = 4، وكل رابطة تُخرج جزيء ماء.'}},
        {title:'التحلل المائي', tag:'التفكيك', text:['**التحلل المائي** (Hydrolysis): كسر الرابطة التساهمية **بإضافة جزيء ماء**.','يُعاد –OH إلى أحد الجزيئين و–H إلى الآخر.','هو عكس التكاثف، ويحدث في **الهضم** (تفكيك النشا والبروتينات) وعند **استهلاك المخزون** (تحويل الجلايكوجين إلى جلوكوز).','تحفّزه إنزيمات هاضمة مثل **الأميليز** و**البروتييز**.'], vis:'monomer_polymer', cap:'الماء يدخل فتنكسر الرابطة وتنفصل الوحدات.'},
        {title:'تكاثف مقابل تحلل مائي', tag:'مقارنة', text:['عمليتان **متعاكستان** تربطهما الخلية في دورة مستمرة من البناء والهدم.','التكاثف: **بناء** (Anabolism) يخرج ماء.','التحلل المائي: **هدم** (Catabolism) يستهلك ماء.'], vis:{kind:'compare', cols:[{icon:'🏗️',title:'التكاثف',items:['ربط مونومرات','خروج جزيء ماء','تكوّن رابطة تساهمية','مثال: بناء الجلايكوجين في الكبد']},{icon:'🔨',title:'التحلل المائي',items:['تفكيك بوليمر','إضافة جزيء ماء','كسر رابطة تساهمية','مثال: هضم النشا إلى جلوكوز']}]}, q:{t:'mcq', q:'أي عملية تحدث عند تحويل جلوكوز الدم الزائد إلى جلايكوجين في الكبد؟', opts:['تحلل مائي','تكاثف','تبخّر','انتشار'], a:1, why:'ربط وحدات الجلوكوز في بوليمر الجلايكوجين تكاثف يُخرج ماء.'}},
        {title:'في حياتنا: من الهضم إلى المخزون', tag:'ربط بالحياة', text:['في الفم يبدأ **الأميليز** تحليل نشا الخبز مائيًا إلى مالتوز، ولهذا يصبح الخبز أحلى إن مضغته طويلًا.','في العضلات تُبنى **البروتينات** بالتكاثف من الأحماض الأمينية بعد التمرين.','عند صيام رمضان يُفكّك **الجلايكوجين** بالتحلل المائي ليُحافظ على جلوكوز الدم.'], vis:{kind:'cards', items:[{icon:'🍞',title:'الفم',text:'أميليز: نشا ← مالتوز (تحلل مائي)'},{icon:'💪',title:'العضلة',text:'أحماض أمينية ← بروتين (تكاثف)'},{icon:'🌙',title:'الصيام',text:'جلايكوجين ← جلوكوز (تحلل مائي)'},{icon:'🌴',title:'النخلة',text:'جلوكوز ← نشا في التمر (تكاثف)'}]}},
        {title:'خلاصة الدرس', tag:'خلاصة', text:['**المونومر** وحدة صغيرة؛ **البوليمر** سلسلة من مونومرات كثيرة.','**الجزيئات الكبيرة**: عديدات السكريات، البروتينات، الأحماض النووية (بوليمرات)؛ الليبيدات ليست بوليمرات.','**التكاثف**: ربط + خروج ماء. **التحلل المائي**: تفكيك + إضافة ماء.'], vis:{kind:'steps', steps:[{icon:'1️⃣',t:'مونومر ← (تكاثف، −H₂O) ← بوليمر'},{icon:'2️⃣',t:'بوليمر ← (تحلل مائي، +H₂O) ← مونومرات'},{icon:'3️⃣',t:'الجزيئات الكبيرة الثلاثة بوليمرات'},{icon:'4️⃣',t:'الليبيدات ليست بوليمرات'}]}}

      slides:[
        {title:'من التمر إلى جذع النخلة', tag:'تمهيد', text:['**الكربوهيدرات**: جزيئات من الكربون والهيدروجين والأكسجين بنسبة H:O = 2:1 غالبًا.','وظائفها: **مصدر طاقة** (جلوكوز)، **تخزين** (نشا، جلايكوجين)، **بناء** (سليلوز)، و**نقل** (سكروز في النبات).','الأهداف: التمييز بين السكريات الأحادية والثنائية والعديدة، وفهم الرابطة الجلايكوسيدية، ومعرفة الاختبارات الكيميائية للكربوهيدرات.'], note:'💡 التمر العُماني من أغنى الأغذية بالسكريات (جلوكوز وفركتوز وسكروز)، ولهذا كان زاد المسافرين.', vis:{kind:'cards', items:[{icon:'⚡',title:'طاقة',text:'الجلوكوز في التنفس'},{icon:'📦',title:'تخزين',text:'نشا (نبات)، جلايكوجين (حيوان)'},{icon:'🧱',title:'بناء',text:'سليلوز الجدر الخلوية'},{icon:'🚚',title:'نقل',text:'سكروز في اللحاء'}]}},
        {title:'تصنيف الكربوهيدرات', tag:'تصنيف', text:['**السكريات الأحادية** (Monosaccharides): وحدة واحدة؛ جلوكوز، فركتوز، جالاكتوز، رايبوز.','**السكريات الثنائية** (Disaccharides): وحدتان؛ مالتوز، سكروز، لاكتوز.','**السكريات العديدة** (Polysaccharides): مئات إلى آلاف الوحدات؛ نشا، جلايكوجين، سليلوز.','الأحادية والثنائية **سكريات** حلوة ذائبة؛ العديدة غير حلوة وغير ذائبة غالبًا.'], vis:{kind:'table', head:['النوع','عدد الوحدات','أمثلة','الخصائص'], rows:[['أحادية','1','جلوكوز، فركتوز، جالاكتوز','حلوة، ذائبة، بلّورية'],['ثنائية','2','مالتوز، سكروز، لاكتوز','حلوة، ذائبة'],['عديدة','كثيرة جدًا','نشا، جلايكوجين، سليلوز','غير حلوة، غير ذائبة']]}, q:{t:'mcq', q:'أي مما يأتي سكر ثنائي؟', opts:['الجلوكوز','النشا','اللاكتوز','السليلوز'], a:2, why:'اللاكتوز = جلوكوز + جالاكتوز.'}},
        {title:'ألفا-جلوكوز وبيتا-جلوكوز', tag:'الجلوكوز', text:['الجلوكوز **C₆H₁₂O₆** يوجد في المحاليل على صورة **حلقة** من 5 كربونات وأكسجين، مع الكربون السادس خارج الحلقة.','**ألفا-جلوكوز (α)**: مجموعة –OH على الكربون 1 **أسفل** مستوى الحلقة.','**بيتا-جلوكوز (β)**: مجموعة –OH على الكربون 1 **أعلى** مستوى الحلقة.','فرق صغير، لكنه يجعل النشا (من α) والسليلوز (من β) مختلفَين كليًا!'], vis:'glucose_ring', cap:'موضع OH على C1 هو الفرق الوحيد بين ألفا وبيتا.', q:{t:'mcq', q:'الفرق بين ألفا-جلوكوز وبيتا-جلوكوز هو في:', opts:['عدد ذرات الكربون','موضع مجموعة OH على الكربون 1','الصيغة الجزيئية','عدد ذرات الأكسجين'], a:1, why:'الصيغة نفسها، والفرق في اتجاه OH على C1.'}},
        {title:'السكريات الثنائية والرابطة الجلايكوسيدية', tag:'الرابطة', text:['يرتبط سكران أحاديان بـ**تفاعل تكاثف** فتتكوّن **رابطة جلايكوسيدية** (Glycosidic bond) ويخرج جزيء ماء.','**المالتوز** = جلوكوز + جلوكوز (رابطة α-1,4)؛ ينتج من هضم النشا.','**السكروز** = جلوكوز + فركتوز؛ سكر المائدة، وسكر النقل في النبات.','**اللاكتوز** = جلوكوز + جالاكتوز؛ سكر الحليب.'], note:'💡 الرقمان 1,4 يعنيان أن الرابطة بين الكربون 1 في الوحدة الأولى والكربون 4 في الثانية.', vis:'disaccharide', cap:'التحلل المائي للرابطة الجلايكوسيدية يعيد السكرين الأحاديين.', q:{t:'mcq', q:'ما مكوّنا السكروز؟', opts:['جلوكوز + جلوكوز','جلوكوز + جالاكتوز','جلوكوز + فركتوز','فركتوز + جالاكتوز'], a:2, why:'السكروز = جلوكوز + فركتوز.'}},
        {title:'النشا: مخزن طاقة النبات', tag:'عديدة', text:['**النشا** (Starch) خليط من بوليمرَين لـ**ألفا-جلوكوز**:','**الأميلوز**: سلسلة طويلة **غير متفرّعة** بروابط α-1,4 تلتفّ على صورة **حلزون** مضغوط.','**الأميلوبكتين**: سلاسل α-1,4 مع **تفرّعات** بروابط α-1,6.','مناسب للتخزين: **غير ذائب** (لا يؤثر في الضغط الأسموزي)، **مضغوط**، ويُتحلّل بسهولة إلى جلوكوز. يُخزّن في **حبيبات النشا** في البلاستيدات وأعضاء التخزين.'], vis:'polysaccharides', cap:'الأميلوز حلزوني والأميلوبكتين متفرّع.'},
        {title:'الجلايكوجين: مخزن طاقة الحيوان', tag:'عديدة', text:['**الجلايكوجين** (Glycogen) بوليمر من **ألفا-جلوكوز** يشبه الأميلوبكتين لكنه **أكثر تفرّعًا** وسلاسله أقصر.','يُخزّن على صورة حبيبات في خلايا **الكبد** و**العضلات**.','كثرة التفرّعات تعني **نهايات كثيرة** يمكن للإنزيمات أن تفكّكها بسرعة عند الحاجة إلى الجلوكوز.','لا يوجد الجلايكوجين في النباتات، ولا النشا في الحيوانات.'], vis:{kind:'compare', cols:[{icon:'🌱',title:'النشا (نبات)',items:['أميلوز + أميلوبكتين','تفرّع أقل','حبيبات في البلاستيدات والدرنات والبذور']},{icon:'🐄',title:'الجلايكوجين (حيوان)',items:['بوليمر واحد','تفرّع أكثر، سلاسل أقصر','حبيبات في الكبد والعضلات']}]}, q:{t:'mcq', q:'لماذا يفيد التفرّع الكثير في الجلايكوجين؟', opts:['يجعله ذائبًا في الماء','يوفّر نهايات كثيرة لتحرير الجلوكوز بسرعة','يجعله أقوى للبناء','يجعله حلو الطعم'], a:1, why:'نهايات كثيرة = إنزيمات كثيرة تعمل معًا = تحرير سريع للطاقة.'}},
        {title:'السليلوز: مادة بناء الجدار الخلوي', tag:'عديدة', text:['**السليلوز** (Cellulose) بوليمر من **بيتا-جلوكوز** بروابط β-1,4؛ كل وحدة **مقلوبة 180°** بالنسبة للمجاورة.','النتيجة سلاسل **مستقيمة** غير متفرّعة تصطف جنبًا إلى جنب وترتبط بـ**روابط هيدروجينية** كثيرة.','السلاسل تكوّن **أليافًا دقيقة** (Microfibrils) ثم أليافًا أكبر، ذات **قوة شدّ** عالية.','يكوّن **الجدار الخلوي** للنبات؛ الإنسان لا يهضمه (ألياف غذائية)، وأكثر الجزيئات العضوية وفرة على الأرض.'], note:'💡 القطن والورق والخشب أساسها السليلوز.', vis:'polysaccharides', cap:'سلاسل بيتا مستقيمة مرتبطة بروابط هيدروجينية إلى ألياف دقيقة.', q:{t:'mcq', q:'ما الذي يمنح السليلوز قوة الشدّ العالية؟', opts:['تفرّعاته الكثيرة','الروابط الهيدروجينية الكثيرة بين السلاسل المستقيمة','شكله الحلزوني','ذوبانه في الماء'], a:1, why:'السلاسل المستقيمة المتراصّة تربطها روابط هيدروجينية كثيرة فتكوّن أليافًا قوية.'}},
        {title:'مقارنة عديدات السكريات الثلاثة', tag:'مقارنة', text:['ثلاثة بوليمرات من **الجلوكوز**، لكن نوع الوحدة ونوع الرابطة يحدّدان الشكل والوظيفة.','النشا والجلايكوجين **للتخزين**؛ السليلوز **للبناء**.'], vis:{kind:'table', head:['','النشا','الجلايكوجين','السليلوز'], rows:[['المونومر','ألفا-جلوكوز','ألفا-جلوكوز','بيتا-جلوكوز'],['الروابط','1,4 و1,6','1,4 و1,6 (تفرّع أكثر)','1,4 فقط'],['الشكل','حلزوني + متفرّع','متفرّع جدًا','سلاسل مستقيمة'],['الوظيفة','تخزين في النبات','تخزين في الحيوان','بناء الجدار الخلوي'],['الذوبان','غير ذائب','غير ذائب','غير ذائب']]}},
        {title:'الاختبارات الكيميائية للكربوهيدرات', tag:'تجربة', text:['**اختبار بندكت للسكر المختزل**: أضف كاشف بندكت (أزرق) وسخّن في حمّام ماء ساخن؛ يتكوّن راسب **أخضر ← أصفر ← برتقالي ← أحمر قرميدي** حسب التركيز. السكريات المختزلة: كل الأحادية وبعض الثنائية (**المالتوز واللاكتوز**).','**السكر غير المختزل (السكروز)**: نتيجة بندكت سالبة؛ سخّنه مع **حمض هيدروكلوريك مخفّف** (تحلل مائي)، عادِله بـ**بيكربونات الصوديوم**، ثم أعد اختبار بندكت ← موجب.','**اختبار اليود للنشا**: محلول اليود في يوديد البوتاسيوم **برتقالي بني ← أزرق أسود**.','يمكن جعل اختبار بندكت **شبه كمي**: بمقارنة شدة اللون أو باستخدام **مقياس الألوان** (Colorimeter) مع محاليل معلومة التركيز.'], vis:'food_tests', cap:'بندكت للسكر المختزل، اليود للنشا.', q:{t:'mcq', q:'أعطى محلول نتيجة سالبة مع بندكت، وبعد تسخينه مع حمض مخفّف ومعادلته أعطى نتيجة موجبة. ما السكر؟', opts:['جلوكوز','مالتوز','سكروز','لاكتوز'], a:2, why:'السكروز غير مختزل، ويتحلّل بالحمض إلى جلوكوز وفركتوز المختزلَين.'}},
        {title:'خلاصة الدرس', tag:'خلاصة', text:['الكربوهيدرات: **أحادية** (جلوكوز)، **ثنائية** (مالتوز، سكروز، لاكتوز)، **عديدة** (نشا، جلايكوجين، سليلوز).','**الرابطة الجلايكوسيدية** تتكوّن بالتكاثف وتنكسر بالتحلل المائي.','**ألفا-جلوكوز** ← نشا وجلايكوجين (تخزين)؛ **بيتا-جلوكوز** ← سليلوز (بناء).','**بندكت** للسكر المختزل (بالتسخين)، **اليود** للنشا.'], vis:{kind:'steps', steps:[{icon:'1️⃣',t:'أحادية ← ثنائية ← عديدة'},{icon:'2️⃣',t:'رابطة جلايكوسيدية (تكاثف)'},{icon:'3️⃣',t:'ألفا: تخزين، بيتا: بناء'},{icon:'4️⃣',t:'بندكت واليود للكشف'}]}}
      ],

          {q:'المالتوز يتكوّن من:', opts:['جلوكوز + فركتوز','جلوكوز + جالاكتوز','جلوكوز + جلوكوز','فركتوز + فركتوز'], a:2, why:'وحدتا ألفا-جلوكوز برابطة 1,4.'},

        ]},

        {t:'cloud', q:'اختر ما يرتبط بالليبيدات:', words:[{w:'الجليسرول',ok:true},{w:'الأحماض الدهنية',ok:true},{w:'رابطة الإستر',ok:true},{w:'الفوسفوليبيد',ok:true},{w:'كاره للماء',ok:true},{w:'الرابطة الجلايكوسيدية',ok:false},{w:'الحمض الأميني',ok:false},{w:'النشا',ok:false},{w:'رابطة مزدوجة C=C',ok:true},{w:'كاشف بندكت',ok:false}], why:'الليبيدات تُبنى من الجليسرول والأحماض الدهنية بروابط إستر، وهي كارهة للماء.'},

      slides:[
        {title:'ما الليبيدات؟', tag:'تمهيد', text:['**الليبيدات** (Lipids): مجموعة متنوّعة من الجزيئات العضوية تشترك في أنها **لا تذوب في الماء** وتذوب في **المذيبات العضوية** (كالإيثانول).','تحوي C وH وO، لكن نسبة الأكسجين فيها **أقل** بكثير من الكربوهيدرات.','أهم أنواعها: **الجليسريدات الثلاثية** (الدهون والزيوت) و**الفوسفوليبيدات**.','الأهداف: تركيب الجليسريد الثلاثي ورابطة الإستر، المشبع وغير المشبع، الفوسفوليبيد، وظائف الليبيدات، واختبار المستحلب.'], vis:{kind:'cards', items:[{icon:'🧈',title:'دهون',text:'صلبة، حيوانية غالبًا'},{icon:'🫒',title:'زيوت',text:'سائلة، نباتية غالبًا'},{icon:'🧫',title:'فوسفوليبيدات',text:'أساس الأغشية'},{icon:'💧',title:'خاصية مشتركة',text:'لا تذوب في الماء'}]}},
        {title:'الأحماض الدهنية', tag:'المكوّنات', text:['**الحمض الدهني**: مجموعة **كربوكسيل (–COOH)** متصلة بـ**سلسلة هيدروكربونية** طويلة.','السلسلة **غير قطبية** (كارهة للماء)؛ ولهذا لا تذوب الليبيدات في الماء.','**مشبع** (Saturated): لا روابط مزدوجة C=C؛ السلسلة مستقيمة وتحمل أقصى عدد من الهيدروجين.','**غير مشبع** (Unsaturated): رابطة C=C واحدة (أحادي) أو أكثر (عديد)؛ تسبّب **انثناءً** في السلسلة.'], note:'💡 الانثناء يمنع الجزيئات من التراصّ بإحكام، فتكون الزيوت غير المشبعة سائلة في درجة حرارة الغرفة.', vis:{kind:'compare', cols:[{icon:'➖',title:'حمض دهني مشبع',items:['لا C=C','سلسلة مستقيمة','تراصّ محكم','دهون صلبة (حيوانية غالبًا)']},{icon:'〰️',title:'حمض دهني غير مشبع',items:['C=C واحدة أو أكثر','انثناء في السلسلة','تراصّ أقل','زيوت سائلة (نباتية غالبًا)']}]}, q:{t:'mcq', q:'ما الذي يميّز الحمض الدهني غير المشبع؟', opts:['وجود مجموعة أمين','وجود رابطة مزدوجة C=C واحدة على الأقل','قِصَر السلسلة','ذوبانه في الماء'], a:1, why:'الرابطة المزدوجة تعني أن السلسلة غير مشبعة بالهيدروجين.'}},
        {title:'الجليسريدات الثلاثية ورابطة الإستر', tag:'التركيب', text:['**الجليسريد الثلاثي** (Triglyceride) = **جليسرول** واحد + **ثلاثة أحماض دهنية**.','ترتبط كل مجموعة –OH في الجليسرول بمجموعة –COOH في حمض دهني بـ**تفاعل تكاثف** فتتكوّن **رابطة إستر** (Ester bond) ويخرج جزيء ماء.','ثلاث روابط إستر ← **ثلاثة جزيئات ماء**.','الجزيء الناتج **غير قطبي وكاره للماء** كليًا.'], vis:'triglyceride', cap:'جليسرول + 3 أحماض دهنية ← جليسريد ثلاثي + 3 ماء.', q:{t:'mcq', q:'كم جزيء ماء يخرج عند تكوين جليسريد ثلاثي واحد؟', opts:['1','2','3','6'], a:2, why:'كل رابطة إستر تُخرج جزيء ماء، وهناك ثلاث روابط.'}},
        {title:'لماذا الليبيدات مخزن طاقة ممتاز؟', tag:'وظيفة', text:['تحرّر الجليسريدات الثلاثية عند أكسدتها **نحو ضعف الطاقة** التي تحرّرها الكتلة نفسها من الكربوهيدرات، لأنها أغنى بالهيدروجين وأقل أكسجينًا.','**لا تذوب في الماء** فلا تؤثر في الضغط الأسموزي، وتُخزّن بلا ماء إضافي فتكون **خفيفة الوزن**.','تُخزّن في **الخلايا الدهنية** تحت الجلد وحول الأعضاء، وفي بذور النباتات (مثل زيت السمسم واللوز).','أكسدتها تُنتج **ماءً أيضيًا** كثيرًا؛ يعتمد عليه الجمل في سنامه وبعض حيوانات الصحراء.'], vis:{kind:'bars', items:[{t:'كربوهيدرات',v:17,label:'≈17 kJ/g'},{t:'بروتين',v:17,label:'≈17 kJ/g'},{t:'ليبيدات',v:39,label:'≈39 kJ/g'}], cap:'الطاقة التقريبية المحرّرة لكل جرام.'}},
        {title:'وظائف أخرى لليبيدات', tag:'وظائف', text:['**عزل حراري**: طبقة الدهن تحت جلد الثدييات البحرية والحيوانات في المناطق الباردة.','**حماية**: دهن حول الأعضاء الحيوية كالكليتين.','**طفو**: الدهن أقل كثافة من الماء فيساعد الحيوانات البحرية.','**مقاومة الماء**: الشموع على أوراق النباتات وريش الطيور وفرو الحيوانات.','**بناء الأغشية**: الفوسفوليبيدات والكوليسترول.'], vis:{kind:'cards', items:[{icon:'🔋',title:'تخزين طاقة',text:'خلايا دهنية، بذور'},{icon:'🧊',title:'عزل',text:'دهن الحوت تحت الجلد'},{icon:'🛡️',title:'حماية',text:'حول الكليتين والقلب'},{icon:'🌊',title:'طفو',text:'أقل كثافة من الماء'},{icon:'☔',title:'مقاومة الماء',text:'شمع الأوراق والريش'},{icon:'🧫',title:'أغشية',text:'فوسفوليبيدات'}]}, q:{t:'mcq', q:'أي وظيفة لليبيدات تفسّر بقاء الحوت دافئًا في المياه القطبية؟', opts:['الطفو','العزل الحراري','مقاومة الماء','بناء الأغشية'], a:1, why:'طبقة الدهن السميكة تحت الجلد تقلّل فقد الحرارة.'}},
        {title:'الفوسفوليبيدات', tag:'نوع خاص', text:['**الفوسفوليبيد** (Phospholipid): جليسريد يُستبدل فيه أحد الأحماض الدهنية الثلاثة بـ**مجموعة فوسفات**.','**الرأس** (جليسرول + فوسفات) **قطبي محب للماء** (Hydrophilic).','**الذيلان** (حمضان دهنيان) **غير قطبيَّين كارهَين للماء** (Hydrophobic).','في الماء تترتّب تلقائيًا في **طبقة مزدوجة** (Bilayer): الرؤوس إلى الخارج نحو الماء والذيول إلى الداخل؛ هذا أساس **غشاء الخلية**.'], vis:'phospholipid', cap:'رأس محب للماء وذيلان كارهان له ← طبقة مزدوجة.', q:{t:'mcq', q:'في الطبقة المزدوجة، أين تتّجه ذيول الأحماض الدهنية؟', opts:['نحو الماء خارج الطبقة','إلى الداخل بعيدًا عن الماء','تتوزّع عشوائيًا','نحو الفوسفات'], a:1, why:'الذيول كارهة للماء فتختبئ في وسط الطبقة، والرؤوس المحبة للماء تواجه الماء.'}},
        {title:'اختبار المستحلب للليبيدات', tag:'تجربة', text:['١. رجّ العينة مع **إيثانول** (الليبيدات تذوب في الإيثانول).','٢. اسكب المحلول في **ماء**.','٣. تظهر **طبقة أو مستحلب أبيض غائم** إن وُجدت ليبيدات؛ لأن الليبيد يخرج من المحلول على صورة قطرات دقيقة في الماء.','النتيجة السالبة: يبقى الخليط **رائقًا**.'], vis:'food_tests', cap:'اختبار المستحلب: إيثانول ثم ماء ← مستحلب أبيض.', q:{t:'mcq', q:'لماذا يُستخدم الإيثانول في اختبار الليبيدات؟', opts:['لأنه يلوّن الليبيدات','لأن الليبيدات تذوب فيه ولا تذوب في الماء','لأنه يسخّن العينة','لأنه يحلّل الليبيدات مائيًا'], a:1, why:'الإيثانول يذيب الليبيد أولًا، ثم عند إضافة الماء يترسّب الليبيد على شكل قطرات دقيقة (مستحلب).'}},
        {title:'خلاصة الدرس', tag:'خلاصة', text:['الليبيدات **كارهة للماء**، تذوب في المذيبات العضوية.','**الجليسريد الثلاثي** = جليسرول + 3 أحماض دهنية بثلاث **روابط إستر** (تكاثف).','**مشبع** (لا C=C، صلب) مقابل **غير مشبع** (C=C، انثناء، سائل).','**الفوسفوليبيد**: رأس محب للماء وذيلان كارهان ← **طبقة مزدوجة** في الأغشية.','وظائف: طاقة، عزل، حماية، طفو، مقاومة ماء. الكشف: **اختبار المستحلب**.'], vis:{kind:'steps', steps:[{icon:'1️⃣',t:'جليسرول + 3 أحماض دهنية ← جليسريد ثلاثي'},{icon:'2️⃣',t:'رابطة إستر بالتكاثف'},{icon:'3️⃣',t:'مشبع مستقيم / غير مشبع منثنٍ'},{icon:'4️⃣',t:'فوسفوليبيد ← طبقة مزدوجة'},{icon:'5️⃣',t:'إيثانول + ماء ← مستحلب أبيض'}]}}

      slides:[
        {title:'أكثر الجزيئات تنوّعًا', tag:'تمهيد', text:['**البروتينات** أكثر الجزيئات البيولوجية تنوّعًا في الوظيفة: **إنزيمات**، **نقل** (هيموجلوبين)، **بناء** (كولاجين، كيراتين)، **حركة** (عضلات)، **دفاع** (أجسام مضادة)، **هرمونات** (إنسولين).','جميعها **بوليمرات من الأحماض الأمينية** العشرين.','الأهداف: الرابطة الببتيدية، مستويات التركيب الأربعة وروابطها، الهيموجلوبين والكولاجين، البروتينات الكروية والليفية، واختبار بيوريت.'], vis:{kind:'cards', items:[{icon:'⚙️',title:'إنزيمات',text:'تحفيز التفاعلات'},{icon:'🩸',title:'هيموجلوبين',text:'نقل الأكسجين'},{icon:'🦴',title:'كولاجين',text:'قوة الأوتار والجلد'},{icon:'🛡️',title:'أجسام مضادة',text:'دفاع'},{icon:'💪',title:'أكتين وميوسين',text:'انقباض العضلة'},{icon:'📨',title:'إنسولين',text:'هرمون'}]}},
        {title:'الأحماض الأمينية والرابطة الببتيدية', tag:'الأساس', text:['كل حمض أميني: كربون مركزي + **أمين (–NH₂)** + **كربوكسيل (–COOH)** + **H** + **مجموعة R** مميّزة.','ترتبط مجموعة **الأمين** لحمض بمجموعة **الكربوكسيل** لآخر بتفاعل **تكاثف** ← **رابطة ببتيدية** (Peptide bond) + جزيء ماء.','حمضان ← **ثنائي الببتيد**؛ كثير ← **عديد الببتيد** (Polypeptide).','الرابطة الببتيدية تُكسر بالتحلل المائي (كما في هضم البروتين).'], vis:'amino_acid', cap:'أمين + كربوكسيل ← رابطة ببتيدية + ماء.', q:{t:'mcq', q:'عديد ببتيد من 150 حمضًا أمينيًا يحوي كم رابطة ببتيدية؟', opts:['150','149','151','75'], a:1, why:'الروابط = عدد الأحماض − 1.'}},
        {title:'التركيب الأولي', tag:'المستوى ١', text:['**التركيب الأولي** (Primary structure): **تتابع** الأحماض الأمينية في سلسلة عديد الببتيد وعددها.','يحدّده **الجين** الذي يشفّر البروتين.','التتابع يحدّد كل المستويات الأعلى، ومن ثم **الشكل والوظيفة**.','تغيّر حمض أميني واحد قد يغيّر وظيفة البروتين (كما في أنيميا الخلايا المنجلية).'], vis:'protein_levels', cap:'سلسلة خرزات: كل خرزة حمض أميني.', q:{t:'mcq', q:'التركيب الأولي للبروتين هو:', opts:['طيّه ثلاثي الأبعاد','تتابع أحماضه الأمينية','عدد سلاسله','روابطه الهيدروجينية'], a:1, why:'التتابع الخطي للأحماض الأمينية.'}},
        {title:'التركيب الثانوي', tag:'المستوى ٢', text:['**التركيب الثانوي** (Secondary structure): التفاف أجزاء من السلسلة أو طيّها بانتظام بسبب **روابط هيدروجينية** بين مجموعات **C=O** و**N–H** في العمود الفقري للسلسلة.','**حلزون ألفا** (α-helix): التفاف السلسلة كالزنبرك.','**صفيحة بيتا المطوية** (β-pleated sheet): أجزاء من السلسلة تصطف جنبًا إلى جنب على صورة صفيحة متعرّجة.','الروابط الهيدروجينية ضعيفة منفردة لكنها كثيرة فتمنح ثباتًا.'], vis:'protein_levels', cap:'حلزون ألفا وصفيحة بيتا: روابط هيدروجينية في العمود الفقري.'},
        {title:'التركيب الثالثي وروابطه', tag:'المستوى ٣', text:['**التركيب الثالثي** (Tertiary structure): **طيّ السلسلة كلها** إلى شكل ثلاثي الأبعاد محدّد بدقة، تثبّته روابط بين **مجموعات R**:','**روابط هيدروجينية** بين مجموعات R القطبية.','**روابط أيونية** بين مجموعات R موجبة وسالبة الشحنة.','**روابط ثنائي الكبريتيد** (Disulfide bonds): تساهمية قوية بين حمضَي **سيستين** (S–S).','**التفاعلات الكارهة للماء**: مجموعات R غير القطبية تتجمّع بعيدًا عن الماء في داخل البروتين.'], note:'💡 الحرارة العالية أو تغيّر pH يكسر هذه الروابط فيتغيّر الشكل ويفقد البروتين وظيفته: **الدنترة** (كما في سلق البيض).', vis:'protein_levels', cap:'أربعة أنواع من الروابط تثبّت الشكل الثالثي.', q:{t:'mcq', q:'أقوى الروابط في التركيب الثالثي هي:', opts:['الهيدروجينية','الأيونية','ثنائي الكبريتيد (تساهمية)','التفاعلات الكارهة للماء'], a:2, why:'رابطة S–S تساهمية بين سيستينين.'}},
        {title:'التركيب الرابعي: كروي وليفي', tag:'المستوى ٤', text:['**التركيب الرابعي** (Quaternary structure): ارتباط **سلسلتَين أو أكثر** من عديد الببتيد في بروتين واحد، بالروابط نفسها (هيدروجينية، أيونية، ثنائي كبريتيد، كارهة للماء).','**البروتينات الكروية** (Globular): مطوية إلى شكل كروي مضغوط، مجموعات R المحبة للماء في الخارج فهي **ذائبة**؛ لها وظائف **أيضية**: إنزيمات، هيموجلوبين، أجسام مضادة.','**البروتينات الليفية** (Fibrous): سلاسل طويلة متوازية، **غير ذائبة**، قوية؛ وظائف **بنائية**: كولاجين، كيراتين.'], vis:{kind:'compare', cols:[{icon:'⚽',title:'كروي',items:['شكل كروي مضغوط','ذائب في الماء','R المحبة للماء خارجًا','إنزيمات، هيموجلوبين، أجسام مضادة']},{icon:'🧵',title:'ليفي',items:['سلاسل طويلة متوازية','غير ذائب','تتابع متكرّر بسيط','كولاجين، كيراتين']}]}, q:{t:'mcq', q:'أي بروتين يُتوقّع أن يكون ذائبًا في الماء؟', opts:['الكولاجين في الأوتار','الكيراتين في الشعر','إنزيم في السيتوبلازم','ألياف الجدار الخلوي'], a:2, why:'الإنزيمات بروتينات كروية ذائبة.'}},
        {title:'الهيموجلوبين: بروتين كروي', tag:'مثال', text:['**الهيموجلوبين** بروتين كروي بتركيب **رابعي**: **4 سلاسل** عديد ببتيد (**سلسلتا ألفا** و**سلسلتا بيتا**).','كل سلسلة تحمل **مجموعة هيم** (Haem)، وهي **مجموعة إضافية غير بروتينية** (Prosthetic group) تحوي أيون **حديد Fe²⁺**.','يرتبط كل هيم بجزيء **أكسجين** واحد ← جزيء هيموجلوبين يحمل **4 O₂**.','ذائب في سيتوبلازم خلايا الدم الحمراء لأن مجموعات R المحبة للماء في الخارج والكارهة في الداخل.'], vis:'haemoglobin_collagen', cap:'أربع سلاسل وأربع مجموعات هيم.', q:{t:'mcq', q:'كم جزيء أكسجين يحمله جزيء هيموجلوبين واحد عند التشبع؟', opts:['1','2','4','8'], a:2, why:'4 مجموعات هيم، كل منها تحمل O₂ واحدًا.'}},
        {title:'الكولاجين: بروتين ليفي', tag:'مثال', text:['**الكولاجين** أكثر البروتينات وفرة في الحيوانات (نحو ربع بروتين الثدييات): في **الجلد والأوتار والعظام والغضاريف وجدر الشرايين**.','**3 سلاسل** عديد ببتيد تلتفّ معًا في **حلزون ثلاثي** (Triple helix) تثبّته **روابط هيدروجينية** بين السلاسل.','كل ثالث حمض أميني تقريبًا **جلايسين** (أصغر الأحماض) فتتراصّ السلاسل بإحكام.','ترتبط جزيئات الكولاجين معًا بـ**روابط متصالبة** تساهمية وبترتيب **متعاقب** ← **لييفات** ← **ألياف** ذات **قوة شدّ** عالية، وغير ذائبة.'], note:'💡 قوة الشد في وتر الكولاجين تقارب قوة سلك من الصلب بالقطر نفسه.', vis:'haemoglobin_collagen', cap:'ثلاث سلاسل ملتوية وروابط متصالبة ← ألياف قوية.', q:{t:'mcq', q:'لماذا يتكرّر الجلايسين كل ثالث حمض أميني في الكولاجين؟', opts:['لأنه يحوي كبريتًا','لأنه صغير فيسمح للسلاسل الثلاث بالتراصّ بإحكام','لأنه محب للماء','لأنه يكوّن مجموعة هيم'], a:1, why:'مجموعة R في الجلايسين ذرة هيدروجين فقط.'}},
        {title:'اختبار بيوريت للبروتين', tag:'تجربة', text:['أضف **هيدروكسيد الصوديوم** إلى العينة، ثم قطرات من **كبريتات النحاس (II)** المخفّفة (أو كاشف بيوريت الجاهز).','النتيجة الموجبة: يتحوّل اللون من **الأزرق** إلى **البنفسجي (الأرجواني/الليلكي)**.','**لا يحتاج تسخينًا**، ويكشف عن **الروابط الببتيدية**.','النتيجة السالبة: يبقى أزرق.'], vis:'food_tests', cap:'بيوريت: أزرق ← بنفسجي مع البروتين، بلا تسخين.', q:{t:'mcq', q:'ما الذي يكشفه اختبار بيوريت تحديدًا؟', opts:['مجموعات R','الروابط الببتيدية','الأحماض الأمينية الحرة فقط','روابط ثنائي الكبريتيد'], a:1, why:'لهذا يعطي البروتينات والببتيدات نتيجة موجبة، لا الأحماض الأمينية المنفردة.'}},
        {title:'خلاصة الدرس', tag:'خلاصة', text:['البروتينات بوليمرات من **20 حمضًا أمينيًا** بروابط **ببتيدية**.','**أولي**: التتابع. **ثانوي**: حلزون ألفا وصفيحة بيتا بروابط هيدروجينية. **ثالثي**: طي ثلاثي الأبعاد بروابط هيدروجينية وأيونية وثنائي كبريتيد وتفاعلات كارهة للماء. **رابعي**: أكثر من سلسلة.','**كروي** ذائب (هيموجلوبين: 4 سلاسل + هيم بحديد) مقابل **ليفي** غير ذائب (كولاجين: حلزون ثلاثي + روابط متصالبة).','**بيوريت**: أزرق ← بنفسجي.'], vis:{kind:'steps', steps:[{icon:'1️⃣',t:'أولي: تتابع الأحماض الأمينية'},{icon:'2️⃣',t:'ثانوي: حلزون ألفا / صفيحة بيتا'},{icon:'3️⃣',t:'ثالثي: طي 3D بأربعة أنواع روابط'},{icon:'4️⃣',t:'رابعي: عدة سلاسل (هيموجلوبين)'},{icon:'🧪',t:'بيوريت ← بنفسجي'}]}}

      slides:[
        {title:'جزيء الحياة', tag:'تمهيد', text:['**الماء** أكثر الجزيئات وفرة في الخلايا، وغالبًا أكثر من ثلثَي كتلة الكائن.','هو **الوسط** الذي تجري فيه كل تفاعلات الخلية، و**وسيلة النقل** في الدم والخشب، و**مشارك** في تفاعلات كالتحلل المائي والبناء الضوئي.','الأهداف: فهم ثنائية القطب والروابط الهيدروجينية، وتفسير خصائص الماء (مذيب، سعة حرارية، حرارة تبخّر، تماسك، كثافة الجليد) وأهميتها للكائنات.'], note:'💡 كل البحث عن الحياة في الكواكب الأخرى يبدأ بالبحث عن الماء السائل.', vis:'water', cap:'جزيء الماء وروابطه الهيدروجينية.'},
        {title:'ثنائي القطب والروابط الهيدروجينية', tag:'التركيب', text:['H₂O: ذرتا هيدروجين مرتبطتان بذرة أكسجين برابطتين **تساهميتين**.','الأكسجين يجذب الإلكترونات أكثر، فيصبح **سالبًا جزئيًا (δ−)** والهيدروجين **موجبًا جزئيًا (δ+)**: الجزيء **ثنائي القطب** (Dipole) أي **قطبي**.','ينجذب H (δ+) في جزيء إلى O (δ−) في جزيء مجاور مكوّنًا **رابطة هيدروجينية** (Hydrogen bond).','الرابطة الهيدروجينية ضعيفة منفردة لكنها كثيرة ومتجدّدة، وهي سرّ خصائص الماء.'], vis:'water', cap:'δ− على الأكسجين وδ+ على الهيدروجين ← روابط هيدروجينية بين الجزيئات.', q:{t:'mcq', q:'أي ذرة في جزيء الماء تحمل شحنة سالبة جزئية؟', opts:['الهيدروجين','الأكسجين','كلتاهما','لا شيء'], a:1, why:'الأكسجين أكثر جذبًا للإلكترونات.'}},
        {title:'الماء مذيب ممتاز', tag:'خاصية ١', text:['لأنه **قطبي**، يحيط الماء بـ**الأيونات** (مثل Na⁺ وCl⁻) وبالجزيئات **القطبية** (كالجلوكوز والأحماض الأمينية) فتذوب.','المواد الذائبة في الماء **محبة للماء** (Hydrophilic)؛ وغير القطبية كالليبيدات **كارهة للماء** (Hydrophobic).','المذاب يتحرّك بحرية ويتفاعل: الماء **وسط التفاعلات الأيضية**.','**وسيلة نقل**: الدم في الحيوانات، والخشب واللحاء في النباتات، يحملان مواد ذائبة.'], vis:{kind:'cards', items:[{icon:'🧂',title:'أيونات',text:'Na⁺ وCl⁻ تحيط بها جزيئات الماء'},{icon:'🍬',title:'جزيئات قطبية',text:'جلوكوز، أحماض أمينية'},{icon:'🩸',title:'نقل',text:'الدم، الخشب، اللحاء'},{icon:'⚗️',title:'وسط التفاعلات',text:'كل الأيض في محلول مائي'}]}, q:{t:'mcq', q:'لماذا يذوب كلوريد الصوديوم في الماء؟', opts:['لأن الماء غير قطبي','لأن أقطاب الماء تنجذب إلى الأيونات وتحيط بها','لأن الملح ينصهر','لأن الماء ساخن'], a:1, why:'δ− نحو Na⁺ وδ+ نحو Cl⁻ فينفصل الأيونان ويذوبان.'}},
        {title:'سعة حرارية نوعية عالية', tag:'خاصية ٢', text:['**السعة الحرارية النوعية**: كمية الحرارة اللازمة لرفع درجة حرارة 1 kg من المادة درجة واحدة.','الماء يحتاج **طاقة كبيرة** ليسخن، لأن جزءًا من الطاقة يُستهلك في **كسر الروابط الهيدروجينية** لا في زيادة حركة الجزيئات.','النتيجة: درجة حرارة الماء **ثابتة نسبيًا**؛ فالبحار والبرك موائل مستقرة الحرارة، ودرجة حرارة الجسم تبقى مستقرة.','مهم للإنزيمات التي تتأثر بالحرارة.'], note:'💡 لهذا تكون مدن الساحل العُماني أقل تقلّبًا في الحرارة بين الليل والنهار من الصحراء الداخلية.', vis:{kind:'compare', cols:[{icon:'🌊',title:'الماء',items:['سعة حرارية عالية','يسخن ويبرد ببطء','حرارة مستقرة','موئل آمن للأحياء المائية']},{icon:'🏜️',title:'الرمل',items:['سعة حرارية منخفضة','يسخن ويبرد بسرعة','تقلّب كبير بين الليل والنهار']}]}},
        {title:'حرارة تبخّر كامنة عالية', tag:'خاصية ٣', text:['**حرارة التبخّر الكامنة**: الطاقة اللازمة لتحويل السائل إلى غاز.','عالية في الماء لأن التبخّر يتطلّب **كسر روابط هيدروجينية كثيرة**.','تبخّر قليل من الماء يزيل **حرارة كبيرة**: أساس التبريد بـ**التعرّق** في الإنسان، و**النتح** في النباتات، واللهاث في الكلاب.','والعكس: **الحرارة الكامنة للانصهار** عالية أيضًا، فمحتوى الخلايا يقاوم التجمّد.'], vis:{kind:'flow', steps:[{icon:'☀️',t:'حرارة من الجسم'},{icon:'💦',t:'عرق على الجلد'},{icon:'🔗',t:'كسر روابط هيدروجينية'},{icon:'💨',t:'تبخّر'},{icon:'❄️',t:'يبرد الجلد'}]}, q:{t:'mcq', q:'التعرّق يبرّد الجسم لأن:', opts:['العرق بارد','تبخّر الماء يحتاج طاقة كبيرة يأخذها من الجلد','العرق يذيب الأملاح','الماء عازل'], a:1, why:'حرارة التبخّر الكامنة العالية.'}},
        {title:'التماسك والتوتر السطحي', tag:'خاصية ٤', text:['**التماسك** (Cohesion): تجاذب جزيئات الماء معًا بالروابط الهيدروجينية.','يسمح بسحب **أعمدة متصلة من الماء** في أوعية **الخشب** من الجذور إلى الأوراق دون انقطاع.','**التوتر السطحي** (Surface tension): جزيئات السطح تنجذب إلى الداخل فيكوّن السطح «غشاءً» مرنًا يحمل الحشرات الصغيرة.','**الالتصاق** (Adhesion): تجاذب الماء مع جدر الأوعية القطبية يساعد أيضًا في ارتفاعه.'], vis:{kind:'cards', items:[{icon:'🌳',title:'الخشب',text:'عمود ماء متصل من الجذر إلى الورقة'},{icon:'🦟',title:'الحشرات',text:'تمشي على سطح الماء'},{icon:'💧',title:'القطرة',text:'شكل كروي بسبب التماسك'},{icon:'🧲',title:'الالتصاق',text:'الماء يلتصق بجدر الأوعية'}]}, q:{t:'mcq', q:'ما الذي يمكّن الماء من الارتفاع عمودًا متصلًا في خشب شجرة طولها 30 مترًا؟', opts:['التوتر السطحي فقط','التماسك بين جزيئات الماء بالروابط الهيدروجينية','انخفاض السعة الحرارية','كثافة الجليد'], a:1, why:'التماسك يجعل العمود يُسحب كوحدة واحدة عند النتح.'}},
        {title:'الكثافة والجليد', tag:'خاصية ٥', text:['عند التجمّد تترتّب جزيئات الماء في **شبكة منتظمة من الروابط الهيدروجينية** أكثر تباعدًا، فيكون **الجليد أقل كثافة** من الماء السائل و**يطفو**.','طبقة الجليد السطحية **تعزل** الماء تحتها فتبقى الأحياء المائية حية في الشتاء.','الجليد الطافي **موئل** لحيوانات كالدببة القطبية والفقمات.','معظم المواد تكون أكثر كثافة في حالتها الصلبة؛ الماء استثناء حيوي.'], vis:{kind:'compare', cols:[{icon:'🧊',title:'الجليد',items:['شبكة روابط هيدروجينية ثابتة','جزيئات متباعدة','كثافة أقل','يطفو ويعزل']},{icon:'🌊',title:'الماء السائل',items:['روابط هيدروجينية متجدّدة','جزيئات أقرب','كثافة أعلى','يبقى سائلًا تحت الجليد']}]}},
        {title:'الماء في حياة عُمان', tag:'ربط بالحياة', text:['**الأفلاج**: نظام ريّ عُماني قديم يعتمد على انسياب الماء وتماسكه في قنوات طويلة.','**التمر والنخيل**: تنقل أوعية الخشب الماء إلى قمم النخيل العالية بالتماسك والالتصاق.','**البحر**: سعته الحرارية العالية تعتدل بها حرارة المدن الساحلية وتستقر بيئة الشعاب المرجانية.','**الصحراء**: التعرّق والماء الأيضي في الجمال يقيهما الحرارة والعطش.'], vis:{kind:'cards', items:[{icon:'🏞️',title:'الأفلاج',text:'انسياب وتماسك'},{icon:'🌴',title:'النخيل',text:'عمود ماء متصل في الخشب'},{icon:'🐠',title:'الشعاب',text:'حرارة مستقرة بالسعة الحرارية'},{icon:'🐪',title:'الجمل',text:'تبريد بالتبخّر وماء أيضي'}]}, q:{t:'mcq', q:'أي خاصية للماء تفسّر استقرار حرارة البيئة البحرية للشعاب المرجانية؟', opts:['التوتر السطحي','السعة الحرارية النوعية العالية','كثافة الجليد','كونه مذيبًا'], a:1, why:'يمتص الماء حرارة كبيرة دون أن ترتفع درجة حرارته كثيرًا.'}},
        {title:'خلاصة الدرس', tag:'خلاصة', text:['الماء **ثنائي القطب** تربط جزيئاته **روابط هيدروجينية**؛ منها تنبع كل خصائصه.','**مذيب** للأيونات والجزيئات القطبية ← وسط التفاعلات والنقل.','**سعة حرارية نوعية عالية** ← حرارة مستقرة. **حرارة تبخّر كامنة عالية** ← تبريد بالتعرّق والنتح.','**تماسك وتوتر سطحي** ← أعمدة الماء في الخشب. **الجليد أقل كثافة** ← يطفو ويعزل.'], vis:{kind:'steps', steps:[{icon:'1️⃣',t:'ثنائي القطب ← روابط هيدروجينية'},{icon:'2️⃣',t:'مذيب ووسط نقل وتفاعل'},{icon:'3️⃣',t:'سعة حرارية وحرارة تبخّر عاليتان'},{icon:'4️⃣',t:'تماسك، توتر سطحي'},{icon:'5️⃣',t:'الجليد يطفو ويعزل'}]}}

    slides:[
      {title:'كيف يميّز الإنزيم ركيزته؟', tag:'تمهيد', text:['الإنزيم **اللاكتيز** يحلّل اللاكتوز فقط، ولا يقترب من السكروز رغم تشابههما!','أهداف الدرس: وصف فرضية **القفل والمفتاح** وفرضية **التلاؤم المستحث**، وتتبّع خطوات التحفيز، وتفسير تخفيض طاقة التنشيط.','جزيئات الإنزيم والركيزة تتحرّك عشوائيًا في المحلول وتتصادم — التحفيز يبدأ بتصادم ناجح.'], note:'💡 كثير من الناس في المنطقة لا يستطيعون هضم اللاكتوز لقلّة إنزيم اللاكتيز في أمعائهم.', vis:{kind:'cards', items:[{icon:'🔐',title:'قفل ومفتاح',text:'شكل مكمّل تمامًا'},{icon:'🤝',title:'تلاؤم مستحث',text:'الموقع يعدّل شكله'},{icon:'🔗',title:'المعقّد',text:'إنزيم-ركيزة'},{icon:'📤',title:'النواتج',text:'تنطلق والإنزيم يبقى'}]}},
      {title:'فرضية القفل والمفتاح', tag:'فرضية 1', text:['اقترحها **إميل فيشر** (1894): الموقع الفعّال له شكل **ثابت** مكمّل تمامًا لشكل الركيزة، كما يناسب القفل مفتاحه.','الركيزة (المفتاح) تدخل الموقع الفعّال (القفل) فقط إذا تطابق الشكلان.','تفسّر الفرضية **التخصّص**: ركيزة بشكل مختلف لا تناسب الموقع الفعّال.','لكنها لا تفسّر كل الملاحظات — لذلك عُدّلت لاحقًا.'], vis:'enzyme_lock', cap:'القفل والمفتاح: تطابق تام بين الموقع الفعّال والركيزة.', q:{t:'mcq', q:'ماذا تفسّر فرضية القفل والمفتاح تفسيرًا جيدًا؟', opts:['تخصّص الإنزيم لركيزته','سبب حاجة الإنزيم إلى الحرارة','لماذا تُستهلك الإنزيمات','تكوين الروابط الببتيدية'], a:0, why:'تطابق الشكل يفسّر عمل كل إنزيم على ركيزة محدّدة.'}},
      {title:'فرضية التلاؤم المستحث', tag:'فرضية 2', text:['اقترحها **كوشلاند** (1958): الموقع الفعّال **ليس مكمّلًا تمامًا** للركيزة قبل الارتباط.','عند اقتراب الركيزة **يتغيّر شكل الموقع الفعّال قليلًا** ليحيط بها بإحكام — كما تتشكّل القفّاز حول اليد.','هذا التغيّر يضع المجموعات الوظيفية للأحماض الأمينية في الوضع الأمثل لإجهاد روابط الركيزة.','دليلها: صور إنزيم **الليزوزيم** (lysozyme) تُظهر تغيّر شكله عند ارتباط الركيزة.'], vis:{kind:'preset', name:'enzyme_lock', opts:{}}, cap:'التلاؤم المستحث: الموقع الفعّال «يستقبل» الركيزة ويعدّل شكله.', q:{t:'mcq', q:'الفرق الرئيس بين الفرضيتين:', opts:['في التلاؤم المستحث يتغيّر شكل الموقع الفعّال عند الارتباط','في القفل والمفتاح تُستهلك الركيزة','في التلاؤم المستحث لا يوجد موقع فعّال','لا فرق بينهما'], a:0, why:'القفل والمفتاح: شكل ثابت. التلاؤم المستحث: تغيّر طفيف في الشكل يحكم الارتباط.'}},
      {title:'خطوات التحفيز', tag:'آلية', text:['1) تتصادم الركيزة بالموقع الفعّال بالحركة العشوائية وترتبط به بروابط ضعيفة مؤقتة.','2) يتكوّن **معقد الإنزيم-الركيزة** (enzyme–substrate complex).','3) تُجهَد روابط الركيزة وتنكسر أو تتكوّن روابط جديدة → **معقد الإنزيم-الناتج** (enzyme–product complex).','4) لا تناسب النواتج الموقع الفعّال فتنطلق، ويعود الإنزيم **حرًّا دون تغيّر** ليستقبل ركيزة جديدة.'], vis:{kind:'flow', steps:[{icon:'⚙️➕🔹',t:'إنزيم + ركيزة'},{icon:'🔗',t:'معقد إنزيم-ركيزة'},{icon:'⚙️🔸🔸',t:'معقد إنزيم-ناتج'},{icon:'⚙️ ➕ 🔸🔸',t:'إنزيم حر + نواتج'}]}},
      {title:'كيف يخفّض الإنزيم طاقة التنشيط؟', tag:'تفسير', text:['تقريب الركائز بعضها إلى بعض في **اتجاه صحيح** يسهّل تكوين الرابطة (في تفاعلات البناء).','**إجهاد روابط** الركيزة عند التلاؤم المستحث يجعل كسرها أسهل (في تفاعلات الهدم).','مجموعات R في الموقع الفعّال قد تكون حمضية أو قاعدية أو مشحونة فتوفّر بيئة كيميائية مناسبة.','النتيجة: **حاجز طاقة أقل** ← عدد أكبر من التصادمات الناجحة في الثانية.'], vis:'activation_energy', cap:'القمة الأدنى تمثّل التفاعل المحفَّز بالإنزيم.'},
      {title:'التفاعل قابل للعكس', tag:'مفهوم', text:['يستطيع الإنزيم الواحد تحفيز التفاعل **في الاتجاهين**: من الركيزة إلى النواتج ومن النواتج إلى الركيزة.','اتجاه التفاعل الفعلي يحدّده **تركيز** المواد وظروف الخلية، وليس الإنزيم نفسه.','مثال: **الكاربونيك أنهيدريز** في كريات الدم الحمراء يحفّز تحوّل CO₂ + H₂O إلى حمض الكربونيك في الأنسجة، والعكس في الرئتين.','أحد الطرفين يسمّى «ركيزة» تبعًا للاتجاه الذي نتحدّث عنه.'], vis:{kind:'cycle', center:'⚙️', steps:[{icon:'🔹',t:'الركيزة'},{icon:'🔗',t:'معقد ES'},{icon:'🔸',t:'النواتج'},{icon:'↩️',t:'الاتجاه المعاكس ممكن'}]}, q:{t:'mcq', q:'ما الذي يحدّد اتجاه التفاعل المحفَّز بإنزيم؟', opts:['الإنزيم وحده','تركيز المواد وظروف الخلية','لون المحلول','حجم الموقع الفعّال'], a:1, why:'الإنزيم يسرّع الاتجاهين؛ التراكيز والظروف تحدّد الاتجاه الصافي.'}},
      {title:'مثال تطبيقي: هضم اللاكتوز', tag:'ربط بالحياة', text:['**اللاكتوز** (سكر الحليب) ركيزة إنزيم **اللاكتيز** في الأمعاء الدقيقة.','يرتبط اللاكتوز بالموقع الفعّال ← معقد إنزيم-ركيزة ← تحلّل مائي للرابطة الجلايكوسيدية ← **جلوكوز + جالاكتوز**.','السكروز شكله مختلف فلا يناسب موقع اللاكتيز الفعّال — التخصّص عمليًا.','قلّة اللاكتيز تسبّب **عدم تحمّل اللاكتوز**: يبقى السكر في الأمعاء وتخمّره البكتيريا.'], vis:{kind:'flow', steps:[{icon:'🥛',t:'لاكتوز'},{icon:'⚙️',t:'اللاكتيز'},{icon:'🔹',t:'جلوكوز'},{icon:'🔹',t:'جالاكتوز'}]}, cap:'التحلّل المائي للاكتوز يحفّزه اللاكتيز.'},
      {title:'خلاصة الدرس', tag:'خلاصة', text:['**القفل والمفتاح**: موقع فعّال ثابت مكمّل تمامًا للركيزة.','**التلاؤم المستحث**: الموقع الفعّال يغيّر شكله قليلًا عند الارتباط ليحيط بالركيزة — الفرضية المقبولة اليوم.','التسلسل: إنزيم + ركيزة ← **معقد إنزيم-ركيزة** ← **معقد إنزيم-ناتج** ← إنزيم حر + نواتج.','الإنزيم يخفّض **طاقة التنشيط** بتقريب الركائز وإجهاد روابطها.'], vis:{kind:'steps', steps:[{icon:'1️⃣',t:'تصادم وارتباط بالموقع الفعّال'},{icon:'2️⃣',t:'تلاؤم مستحث ومعقد ES'},{icon:'3️⃣',t:'كسر/تكوين روابط (معقد EP)'},{icon:'4️⃣',t:'انطلاق النواتج والإنزيم حر'}]}}

      {title:'تجربة الكاتاليز وبيروكسيد الهيدروجين', tag:'استقصاء 1', text:['**الكاتاليز** يحلّل بيروكسيد الهيدروجين (ماء أكسجيني) السام الناتج عن الأيض: **2H₂O₂ ← 2H₂O + O₂**.','نضع محلول H₂O₂ في دورق مع مصدر الإنزيم (خلاصة بطاطس أو كبد أو خميرة) ونجمع **الأكسجين** في محقنة غاز أو مخبار مقلوب فوق الماء.','نسجّل حجم الغاز كل 30 ثانية مع تثبيت **درجة الحرارة** و**pH** وتركيز الإنزيم.','**ضابط تجريبي**: إنزيم مغليّ (محلّل) يجب ألّا يعطي غازًا.'], vis:{kind:'steps', steps:[{icon:'🧪',t:'محلول H₂O₂ بتركيز معلوم في الدورق'},{icon:'🥔',t:'إضافة خلاصة الكاتاليز وسدّ الدورق فورًا'},{icon:'⏱️',t:'تسجيل حجم O₂ في المحقنة كل 30 ثانية'},{icon:'🌡️',t:'حمّام مائي لتثبيت درجة الحرارة'},{icon:'📈',t:'رسم حجم O₂ مقابل الزمن'}]}, q:{t:'mcq', q:'المتغيّر المستقل في متابعة تقدّم التفاعل هو:', opts:['حجم الأكسجين','الزمن','درجة الحرارة','تركيز الإنزيم'], a:1, why:'نغيّر الزمن (نقرأ عند أزمنة مختلفة) ونقيس حجم الأكسجين (المتغيّر التابع).'}},
      {title:'منحنى الناتج مقابل الزمن', tag:'قراءة منحنى', text:['يكون المنحنى **حادّ الميل في البداية**: تركيز الركيزة أعلى ما يكون فتكثر التصادمات مع المواقع الفعّالة.','مع الزمن **يقلّ الميل** لأن الركيزة تُستهلك وتقلّ التصادمات (وقد تتراكم النواتج).','في النهاية **يثبت المنحنى** (plateau): استُهلكت الركيزة كلّها فلا يتكوّن ناتج جديد.','ملاحظة: الإنزيم لم يُستهلك — لو أضفنا ركيزة جديدة لعاد التفاعل!'], vis:'enzyme_progress', cap:'ميل المنحنى في أي لحظة = معدل التفاعل في تلك اللحظة.', q:{t:'mcq', q:'لماذا يقلّ ميل المنحنى مع الزمن؟', opts:['لأن الإنزيم يُستهلك','لأن تركيز الركيزة يقلّ فتقلّ التصادمات','لأن درجة الحرارة تنخفض','لأن الإنزيم يتحلّل'], a:1, why:'كلما استُهلكت الركيزة قلّ احتمال تصادمها بالمواقع الفعّالة.'}},
      {title:'المعدل الابتدائي: لماذا وكيف؟', tag:'حساب', text:['**المعدل الابتدائي** (initial rate) = معدل التفاعل عند t = 0، ونحسبه من **ميل المماس** للمنحنى عند نقطة البداية.','لماذا الابتدائي؟ لأنه اللحظة الوحيدة التي نعرف فيها **تركيز الركيزة بدقة** (التركيز الذي وضعناه) ولا توجد نواتج بعد.','الحساب: ميل المماس = التغيّر في الناتج ÷ التغيّر في الزمن.','مثال: مماس عند البداية يمرّ بالنقطتين (0 s, 0 cm³) و(50 s, 30 cm³) ← المعدل الابتدائي = 30 ÷ 50 = **0.6 cm³ s⁻¹**.'], vis:{kind:'table', head:['الزمن (s)','حجم O₂ (cm³)','المعدل في الفترة (cm³ s⁻¹)'], rows:[['0','0','—'],['30','15','15 ÷ 30 = 0.50'],['60','25','10 ÷ 30 = 0.33'],['90','31','6 ÷ 30 = 0.20'],['120','34','3 ÷ 30 = 0.10'],['150','35','1 ÷ 30 = 0.03'],['180','35','0 (ثبات)']]}, cap:'بيانات توضيحية لتجربة كاتاليز: لاحظ تناقص المعدل حتى يصل صفرًا.'},
      {title:'تدريب على الحساب', tag:'تطبيق', text:['من الجدول السابق: المعدل المتوسّط بين 60 و90 ثانية = (31 − 25) ÷ 30 = **0.2 cm³ s⁻¹**.','المعدل المتوسّط للتفاعل كله حتى الثبات (150 s) = 35 ÷ 150 ≈ **0.23 cm³ s⁻¹** — أقلّ بكثير من الابتدائي.','لمقارنة ظروف مختلفة (حرارة، pH، تركيز) نكرّر التجربة ونقارن **المعدلات الابتدائية** فقط، لأنها الأعدل.','وحدة المعدل: وحدة الناتج ÷ وحدة الزمن (مثل cm³ s⁻¹ أو cm³ min⁻¹).'], vis:{kind:'bars', items:[{t:'0–30 s',v:50,label:'0.50'},{t:'30–60',v:33,label:'0.33'},{t:'60–90',v:20,label:'0.20'},{t:'90–120',v:10,label:'0.10'},{t:'120–150',v:3,label:'0.03'}], cap:'معدل التفاعل (cm³ s⁻¹) في كل فترة 30 ثانية — يتناقص باستهلاك الركيزة.'}, q:{t:'mcq', q:'إذا مرّ المماس عند البداية بالنقطة (20 s, 16 cm³) فإن المعدل الابتدائي =', opts:['0.4 cm³ s⁻¹','0.8 cm³ s⁻¹','1.25 cm³ s⁻¹','320 cm³ s⁻¹'], a:1, why:'16 ÷ 20 = 0.8 cm³ s⁻¹.'}},
      {title:'تجربة الأميليز والنشا', tag:'استقصاء 2', text:['**الأميليز** يحلّل **النشا** إلى مالتوز. هنا نتابع **اختفاء الركيزة** بدلًا من ظهور الناتج.','نخلط النشا بالأميليز، ونأخذ عيّنة كل 30 ثانية ونضيفها إلى قطرة **يود**: أزرق أسود = نشا باقٍ، وتدرّج نحو البني البرتقالي = النشا يختفي.','قياس أدقّ باستخدام **جهاز قياس الألوان** (colorimeter): يقيس كمية الضوء الممتصّ أو النافذ عبر المحلول؛ كلما قلّ النشا قلّ الامتصاص.','يمكن أيضًا قياس **الزمن اللازم لاختفاء النشا** واستخدام **1 ÷ الزمن** كمقياس للمعدل.'], vis:{kind:'flow', steps:[{icon:'🍞➕⚙️',t:'نشا + أميليز'},{icon:'⏱️',t:'عيّنة كل 30 s'},{icon:'🟤',t:'إضافة يود'},{icon:'📟',t:'قياس اللون بالكولوريمتر'},{icon:'📉',t:'منحنى تناقص النشا'}]}, cap:'الكولوريمتر يحوّل شدّة اللون إلى رقم يمكن رسمه.'},
      {title:'منحنى الركيزة مقابل الزمن', tag:'قراءة منحنى', text:['عند تتبّع الركيزة يكون المنحنى **هابطًا**: يبدأ عاليًا وينخفض بسرعة ثم يتباطأ حتى يصل إلى الصفر (أو يثبت).','الميل هنا **سالب**، لكن المعدل الابتدائي يُحسب بالطريقة نفسها من مماس البداية (نأخذ القيمة المطلقة).','مثال: انخفض تركيز النشا من 10 إلى 6 وحدات في أول 20 ثانية على المماس ← المعدل الابتدائي = 4 ÷ 20 = **0.2 وحدة s⁻¹**.','المنحنيان (الناتج الصاعد والركيزة الهابط) صورتان لنفس التفاعل.'], vis:{kind:'compare', cols:[{icon:'📈',title:'تتبّع الناتج',items:['منحنى صاعد','ميل موجب يتناقص','يثبت عند استهلاك الركيزة','مثال: O₂ من الكاتاليز']},{icon:'📉',title:'تتبّع الركيزة',items:['منحنى هابط','ميل سالب يتناقص','يصل إلى الصفر','مثال: النشا مع الأميليز']}]}, q:{t:'mcq', q:'في منحنى تناقص الركيزة، أين يكون المعدل أعلى ما يمكن؟', opts:['في النهاية','في البداية','في المنتصف','لا يتغيّر'], a:1, why:'في البداية تركيز الركيزة أعلى فيكون الميل أحدّ.'}},
      {title:'ضوابط الاستقصاء الجيد', tag:'مهارات', text:['**ثبّت** كل المتغيّرات غير المدروسة: درجة الحرارة (حمّام مائي)، pH (محلول منظّم buffer)، تركيز الإنزيم وحجومه.','**كرّر** كل قياس ثلاث مرات على الأقل واحسب المتوسّط لتقليل الخطأ العشوائي.','**ضابط**: تجربة مماثلة بإنزيم مغليّ أو بماء بدل الإنزيم لإثبات أن الإنزيم هو سبب التغيّر.','ابدأ التوقيت **لحظة** خلط الإنزيم بالركيزة، واستخدم حجومًا مقيسة بدقة.'], vis:{kind:'cards', items:[{icon:'🌡️',title:'حمّام مائي',text:'حرارة ثابتة'},{icon:'🧫',title:'محلول منظّم',text:'pH ثابت'},{icon:'🔁',title:'تكرار ×3',text:'متوسّط أدقّ'},{icon:'🚫',title:'ضابط',text:'إنزيم مغليّ'}]}},
      {title:'خلاصة الدرس', tag:'خلاصة', text:['نتابع التفاعل بقياس **الناتج** (O₂ من الكاتاليز) أو **الركيزة** (النشا مع الأميليز باليود والكولوريمتر) مقابل الزمن.','المنحنى حادّ أولًا ثم يتباطأ ويثبت باستهلاك الركيزة.','**المعدل الابتدائي** = ميل المماس عند t = 0، وهو الأعدل للمقارنة لأن تركيز الركيزة معلوم عندها.','ثبّت المتغيّرات الأخرى، كرّر، واستخدم ضابطًا.'], vis:{kind:'steps', steps:[{icon:'1️⃣',t:'اختر ما تقيسه: ناتج أو ركيزة'},{icon:'2️⃣',t:'سجّل القيم مع الزمن بظروف ثابتة'},{icon:'3️⃣',t:'ارسم المنحنى'},{icon:'4️⃣',t:'ارسم مماس البداية واحسب ميله'}]}}
