        {q:'لماذا نستخدم المعدل الابتدائي عند مقارنة أثر درجة الحرارة على الإنزيم؟', opts:['لأنه أكبر رقم','لأن تركيز الركيزة معلوم ومتساوٍ في كل التجارب عند البداية','لأن الإنزيم يكون قد تحلّل','لأن النواتج تكون قد تراكمت'], a:1, why:'المقارنة العادلة تحتاج إلى ظروف ركيزة متطابقة، وهذا يتحقّق عند t = 0 فقط.'},
        {q:'إذا أُضيف مزيد من بيروكسيد الهيدروجين بعد ثبات المنحنى فإن:', opts:['لا يحدث شيء لأن الإنزيم استُهلك','يعود التفاعل لأن الإنزيم لم يُستهلك','يتحلّل الإنزيم','يتحوّل الأكسجين إلى ماء'], a:1, why:'الإنزيم محفّز باقٍ، والثبات كان بسبب نفاد الركيزة.'},
        {q:'استُهلك النشا كليًا بعد 50 ثانية في تجربة، و100 ثانية في أخرى. مقياس المعدل (1 ÷ الزمن) للأولى مقارنة بالثانية:', opts:['نصفه','ضعفه','مساوٍ له','ربعه'], a:1, why:'1/50 = 0.02 مقابل 1/100 = 0.01؛ الأولى أسرع مرتين.'}
      ],
      reflect:['لو لم تثبّت درجة الحرارة أثناء التجربة، كيف يمكن أن تتأثّر نتائجك واستنتاجك؟','ما ميزات وعيوب قياس اختفاء الركيزة مقارنة بقياس ظهور الناتج؟'],
      summary:'نتابع تقدّم التفاعل بقياس **الناتج** (حجم O₂ من **الكاتاليز**) أو **الركيزة** (النشا مع **الأميليز** باليود و**جهاز قياس الألوان**) مقابل الزمن. المنحنى حادّ أولًا ثم يثبت باستهلاك الركيزة، و**المعدل الابتدائي** = ميل المماس عند البداية، وهو الأنسب للمقارنة بين الظروف.'
    }
  },
  // ───────────────────────── ٣-٤ العوامل المؤثرة في عمل الإنزيم ─────────────────────────
  { id:'l3_4', num:'٣-٤', title:'العوامل المؤثرة في عمل الإنزيم', en:'Factors that affect enzyme action', ws:false,
    preIntro:'لماذا تُفسد الحمّى الشديدة عمل الجسم؟ ولماذا نحفظ الطعام في الثلاجة؟ الإجابة في العوامل المؤثرة في الإنزيمات.',
    pre:[
      {t:'mcq', q:'عند تسخين بياض البيض يتحوّل من سائل شفاف إلى صلب أبيض. ما الذي حدث لبروتيناته؟', opts:['تحلّلت إلى أحماض أمينية','تغيّر تركيبها الثالثي (دنترة)','تحوّلت إلى كربوهيدرات','ازداد ذوبانها'], a:1, why:'الحرارة تكسر الروابط التي تثبّت التركيب الثالثي فيتغيّر شكل البروتين تغيّرًا دائمًا — الدنترة.'},
      {t:'tf', q:'يزداد نشاط الإنزيم كلما ارتفعت درجة الحرارة بلا حدود.', a:false, why:'يزداد حتى الدرجة المثلى ثم ينهار بسرعة بسبب الدنترة.'},
      {t:'cloud', q:'اختر العوامل التي تتوقّع أنها تؤثّر في معدل تفاعل يحفّزه إنزيم:', words:[{w:'درجة الحرارة',ok:true},{w:'pH',ok:true},{w:'تركيز الركيزة',ok:true},{w:'تركيز الإنزيم',ok:true},{w:'لون المحلول',ok:false},{w:'شكل الدورق',ok:false},{w:'وجود مثبّطات',ok:true},{w:'شدّة الضوء (لغير الضوئية)',ok:false},{w:'اسم الإنزيم',ok:false}], why:'الحرارة وpH يؤثّران في شكل الموقع الفعّال، وتركيز الركيزة والإنزيم في عدد التصادمات.'},
      {t:'visual', vis:'enzyme_factors', q:'في منحنى درجة الحرارة، ما سبب الهبوط الحادّ بعد القمة؟', opts:['نفاد الركيزة','دنترة الإنزيم بتحطّم تركيبه الثالثي','زيادة تركيز الإنزيم','تجمّد المحلول'], a:1, why:'فوق الدرجة المثلى تنكسر روابط التركيب الثالثي ويفقد الموقع الفعّال شكله.'},
      {t:'open', q:'الببسين في المعدة يعمل في وسط حمضي جدًا، بينما يعمل التربسين في الأمعاء في وسط قلوي. ما تتوقّع أن يحدث لو تبادلا مكانيهما؟'},
      {t:'mcq', q:'من الدرس السابق: إذا زاد تركيز الركيزة، فما الذي تتوقّعه لمعدل التفاعل الابتدائي؟', opts:['ينخفض دائمًا','يزيد ثم قد يثبت','لا يتغيّر','يصبح صفرًا'], a:1, why:'المزيد من الركيزة = مزيد من التصادمات، حتى تنشغل كل المواقع الفعّالة.'}
    ],
    slides:[
      {title:'ما الذي يغيّر سرعة الإنزيم؟', tag:'تمهيد', text:['في حمّى شديدة (فوق 41°C) تتعطّل إنزيمات الجسم، وفي الثلاجة تتباطأ إنزيمات البكتيريا فيبقى الطعام صالحًا.','أهداف الدرس: تفسير أثر **درجة الحرارة**، و**pH**، و**تركيز الركيزة**، و**تركيز الإنزيم** في معدل التفاعل، ورسم المنحنيات وتفسيرها.','المبدأ العام: أي شيء يغيّر **عدد التصادمات الناجحة** أو **شكل الموقع الفعّال** يغيّر المعدل.'], note:'💡 في صيف عُمان الحار تفسد الأطعمة المكشوفة بسرعة لأن إنزيمات الميكروبات تعمل بأقصى نشاطها.', vis:'enzyme_factors', cap:'أربعة عوامل، أربعة منحنيات مختلفة الشكل.'},
      {title:'درجة الحرارة: قبل الدرجة المثلى', tag:'عامل 1', text:['ارتفاع الحرارة يزيد **الطاقة الحركية** للجزيئات فتتحرّك أسرع وتزداد **التصادمات** بين الركيزة والموقع الفعّال.','كما تمتلك الجزيئات المتصادمة طاقة أكبر فيسهل تجاوز **طاقة التنشيط**.','قاعدة تقريبية: يتضاعف المعدل تقريبًا لكل ارتفاع 10°C (**Q₁₀ ≈ 2**) في هذا المدى.','مثال: معدل 3 وحدات عند 20°C يصير نحو 6 وحدات عند 30°C ← Q₁₀ = 6 ÷ 3 = 2.'], vis:{kind:'bars', items:[{t:'10°C',v:15,label:'1.5'},{t:'20°C',v:30,label:'3'},{t:'30°C',v:60,label:'6'},{t:'40°C',v:100,label:'10'},{t:'50°C',v:20,label:'2'},{t:'60°C',v:0,label:'0'}], cap:'معدل تفاعل توضيحي (وحدات اعتباطية) لإنزيم بشري: يتصاعد حتى نحو 40°C ثم ينهار.'}, q:{t:'mcq', q:'معدل التفاعل 4 وحدات عند 25°C و8 وحدات عند 35°C. قيمة Q₁₀ =', opts:['0.5','2','4','12'], a:1, why:'Q₁₀ = المعدل عند (t+10) ÷ المعدل عند t = 8 ÷ 4 = 2.'}},
      {title:'درجة الحرارة: الدرجة المثلى والدنترة', tag:'عامل 1', text:['**الدرجة المثلى** (optimum): الدرجة التي يكون فيها المعدل أقصى ما يمكن؛ لمعظم إنزيمات الإنسان نحو **40°C**.','فوقها تهتزّ الجزيئات بشدّة فتنكسر **الروابط الهيدروجينية والأيونية** التي تثبّت التركيب الثالثي.','يتغيّر شكل **الموقع الفعّال** فلا تناسبه الركيزة ← **الدنترة** (denaturation)، وهي عادةً **غير عكسية**.','الهبوط بعد القمة **حادّ** لأن الدنترة تحدث بسرعة، بينما الصعود قبلها تدريجي.'], vis:'protein_levels', cap:'الدنترة = فقدان التركيب الثالثي؛ التتابع الأولي يبقى لكن الشكل يضيع.', q:{t:'mcq', q:'الدنترة تعني:', opts:['تكسّر الروابط الببتيدية','تغيّر التركيب الثالثي وفقدان شكل الموقع الفعّال','زيادة عدد الأحماض الأمينية','ذوبان الإنزيم'], a:1, why:'تنكسر الروابط الضعيفة (هيدروجينية/أيونية) فيتغيّر الشكل 3D، لا الروابط الببتيدية.'}},
      {title:'إنزيمات تتحدّى الحرارة', tag:'ربط بالحياة', text:['بكتيريا **الينابيع الحارة** تملك إنزيمات درجتها المثلى قد تتجاوز 80°C؛ تركيبها الثالثي مثبّت بروابط أكثر وأقوى.','تُستخدم هذه الإنزيمات في **المنظّفات الحيوية** وتفاعل **PCR** في المختبرات (DNA بوليميريز مقاوم للحرارة).','على العكس، إنزيمات كائنات القطب تعمل بكفاءة عند درجات قريبة من الصفر.','**الدرجة المثلى** إذن ليست ثابتة، بل تتكيّف مع بيئة الكائن.'], vis:{kind:'compare', cols:[{icon:'🧊',title:'كائنات الأجواء الباردة',items:['درجة مثلى منخفضة','مرونة أكبر في التركيب','تتحلّل بحرارة معتدلة']},{icon:'🌋',title:'بكتيريا الينابيع الحارة',items:['درجة مثلى > 80°C','روابط أكثر تثبّت الشكل','مفيدة في الصناعة وPCR']}]}},
      {title:'الرقم الهيدروجيني pH', tag:'عامل 2', text:['لكل إنزيم **pH أمثل**؛ معظم الإنزيمات داخل الخلايا تعمل قرب pH 7، بينما **الببسين** في المعدة قرب pH 2 و**التربسين** في الأمعاء قرب pH 8.','تغيّر pH يغيّر **شحنات** مجموعات R للأحماض الأمينية (H⁺ يرتبط بها أو ينفصل عنها).','هذا يؤثّر في **الروابط الأيونية والهيدروجينية** ← يتغيّر شكل الموقع الفعّال وتضعف قدرته على الارتباط بالركيزة.','ابتعاد بسيط عن الأمثل يخفّض المعدل؛ ابتعاد كبير يسبّب **دنترة**.'], vis:{kind:'table', head:['الإنزيم','pH الأمثل','مكان العمل'], rows:[['الببسين','نحو 2','المعدة (وسط حمضي قوي)'],['الأميليز اللعابي','نحو 7','الفم'],['معظم الإنزيمات داخل الخلايا','نحو 7','السيتوبلازم'],['التربسين','نحو 8','الأمعاء الدقيقة (وسط قلوي)']]}, cap:'لكل إنزيم قمة نشاط عند pH أمثل يناسب بيئة عمله، وينخفض المعدل على جانبَي القمة.', q:{t:'mcq', q:'لماذا يتوقّف الببسين عن العمل عند وصوله إلى الأمعاء الدقيقة؟', opts:['لأن الأمعاء أدفأ','لأن pH الأمعاء قلوي بعيد عن الأمثل له فيتغيّر شكل موقعه الفعّال','لأن الركيزة نفدت','لأن التربسين يبتلعه'], a:1, why:'pH الأمثل للببسين نحو 2؛ الوسط القلوي يغيّر شحنات مجموعات R وشكل الموقع الفعّال.'}},
      {title:'تركيز الركيزة', tag:'عامل 3', text:['عند تركيز ركيزة منخفض تكون كثير من المواقع الفعّالة **خالية**؛ زيادة الركيزة تزيد التصادمات فيزيد المعدل **بشكل شبه خطّي**.','مع الاستمرار تبدأ الزيادة في التباطؤ، ثم **يثبت** المعدل: كل المواقع الفعّالة **مشغولة** طول الوقت (الإنزيم **مشبّع**).','عندها يكون **تركيز الإنزيم** هو **العامل المحدّد**؛ وزيادة الركيزة لا تفيد.','المعدل الأقصى عند التشبّع يسمّى **Vmax** — سندرسه في الدرس التالي.'], vis:'vmax_km', cap:'منحنى يرتفع ثم يثبت عند Vmax.', q:{t:'mcq', q:'عند ثبات المنحنى مع زيادة تركيز الركيزة، العامل المحدّد هو:', opts:['تركيز الركيزة','تركيز الإنزيم (عدد المواقع الفعّالة)','درجة الحرارة','pH'], a:1, why:'كل المواقع الفعّالة مشغولة؛ فقط زيادة الإنزيم ترفع المعدل.'}},
      {title:'تركيز الإنزيم', tag:'عامل 4', text:['إذا كانت **الركيزة فائضة**، فإن زيادة تركيز الإنزيم تزيد عدد **المواقع الفعّالة** المتاحة فيزيد المعدل **بتناسب طردي** (خط مستقيم).','مضاعفة الإنزيم ← مضاعفة المعدل الابتدائي؛ مثال: 0.3 cm³ s⁻¹ عند 1% إنزيم ← نحو 0.6 cm³ s⁻¹ عند 2%.','لو كانت الركيزة **محدودة** فسينتهي التناسب ويثبت المعدل عندما تصبح الركيزة هي العامل المحدّد.','لذلك في التجارب نستخدم ركيزة فائضة عند دراسة أثر تركيز الإنزيم.'], vis:{kind:'table', head:['تركيز الإنزيم (%)','المعدل الابتدائي (cm³ s⁻¹)','النسبة'], rows:[['0.5','0.15','×1'],['1.0','0.30','×2'],['2.0','0.60','×4'],['4.0','1.20','×8']]}, cap:'بيانات توضيحية: تضاعف التركيز يضاعف المعدل (ركيزة فائضة).'},
      {title:'مقارنة المنحنيات الأربعة', tag:'تلخيص بصري', text:['**الحرارة**: صعود تدريجي ← قمة عند الأمثل ← هبوط حادّ (دنترة).','**pH**: قمة متماثلة تقريبًا حول الأمثل، وهبوط على الجانبين.','**تركيز الركيزة**: صعود ثم ثبات (تشبّع المواقع الفعّالة).','**تركيز الإنزيم**: خط مستقيم صاعد (مع ركيزة فائضة).'], vis:'enzyme_factors'},
      {title:'خلاصة الدرس', tag:'خلاصة', text:['الحرارة تزيد التصادمات حتى **الدرجة المثلى** (نحو 40°C للإنسان)، وفوقها تحدث **الدنترة** غير العكسية.','لكل إنزيم **pH أمثل**؛ الابتعاد عنه يغيّر شحنات مجموعات R وشكل الموقع الفعّال.','زيادة **تركيز الركيزة** ترفع المعدل حتى **تشبّع** المواقع الفعّالة (Vmax).','زيادة **تركيز الإنزيم** ترفع المعدل خطّيًا ما دامت الركيزة فائضة.'], vis:{kind:'cards', items:[{icon:'🌡️',title:'الحرارة',text:'قمة ثم دنترة'},{icon:'🧪',title:'pH',text:'أمثل لكل إنزيم'},{icon:'🔹',title:'الركيزة',text:'صعود ثم تشبّع'},{icon:'⚙️',title:'الإنزيم',text:'خطّي مع ركيزة فائضة'}]}}
    ],

        {q:'سبب زيادة معدل التفاعل مع ارتفاع الحرارة قبل الأمثل:', opts:['دنترة الإنزيم','زيادة الطاقة الحركية والتصادمات','نقص الركيزة','تكوّن روابط جديدة في الإنزيم'], a:1, why:'جزيئات أسرع = تصادمات أكثر وأقوى.'},
        {q:'الدنترة تنتج عن:', opts:['كسر الروابط الببتيدية','كسر الروابط الهيدروجينية والأيونية المثبّتة للتركيب الثالثي','زيادة تركيز الركيزة','نقص الماء'], a:1, why:'تنكسر الروابط الضعيفة فيتغيّر شكل الموقع الفعّال.'},
        {q:'pH الأمثل للببسين نحو:', opts:['2','7','8','10'], a:0, why:'يعمل في الوسط الحمضي للمعدة.'},

        {q:'يثبت معدل التفاعل مع زيادة تركيز الركيزة لأن:', opts:['الإنزيم تحلّل','كل المواقع الفعّالة مشغولة','pH تغيّر','الركيزة نفدت'], a:1, why:'الإنزيم مشبّع وتركيزه هو العامل المحدّد.'},
        {q:'مع ركيزة فائضة، مضاعفة تركيز الإنزيم:', opts:['تضاعف المعدل','لا تغيّر المعدل','تنصّف المعدل','تسبّب دنترة'], a:0, why:'تناسب طردي: مواقع فعّالة أكثر = تفاعلات أكثر.'},
        {q:'معدل التفاعل 5 وحدات عند 15°C و10 وحدات عند 25°C. Q₁₀ =', opts:['0.5','2','5','15'], a:1, why:'10 ÷ 5 = 2.'},
        {q:'لماذا الهبوط بعد الدرجة المثلى حادّ بينما الصعود قبلها تدريجي؟', opts:['لأن الركيزة تنفد فجأة','لأن الدنترة تحدث بسرعة وتُعطّل الإنزيم تمامًا','لأن pH يتغيّر','لأن الإنزيم يذوب'], a:1, why:'فقدان شكل الموقع الفعّال يوقف العمل كليًا وبسرعة.'},
        {q:'إنزيمات بكتيريا الينابيع الحارة تتحمّل الحرارة لأن:', opts:['ليس لها موقع فعّال','تركيبها الثالثي مثبّت بروابط أكثر وأقوى','ليست بروتينات','تعمل بدون ركيزة'], a:1, why:'روابط إضافية تمنع تغيّر الشكل عند الحرارة العالية.'}

  { id:'l3_5', num:'٣-٥', title:'مقارنة ألفة الإنزيمات', en:'Comparing enzyme affinities', ws:false,

      {t:'tf', q:'الإنزيم الذي يصل إلى نصف معدله الأقصى عند تركيز ركيزة منخفض يرتبط بركيزته بقوة أكبر.', a:true, why:'يحتاج ركيزة قليلة ليعمل بكفاءة — ألفة عالية.'},

    slides:[
      {title:'ما الألفة؟', tag:'تمهيد', text:['**الألفة** (affinity): مدى «سهولة» أو قوة ارتباط الإنزيم بركيزته لتكوين معقد ES.','إنزيم عالي الألفة يعمل بكفاءة حتى عند **تركيز ركيزة منخفض**.','أهداف الدرس: تعريف **Vmax** و**Km**، قراءتهما من المنحنى، ومقارنة ألفة إنزيمين.','السؤال المحوري: ما تركيز الركيزة الذي يحتاجه الإنزيم ليعمل بنصف طاقته؟'], vis:{kind:'cards', items:[{icon:'🧲',title:'ألفة عالية',text:'يمسك الركيزة حتى لو قلّت'},{icon:'🪶',title:'ألفة منخفضة',text:'يحتاج ركيزة كثيرة'},{icon:'🏁',title:'Vmax',text:'السرعة القصوى (المعدل الأقصى)'},{icon:'📍',title:'Km',text:'مقياس الألفة'}]}},
      {title:'المعدل الأقصى Vmax', tag:'مفهوم', text:['**Vmax** (السرعة القصوى / المعدل الأقصى): أقصى معدل يمكن أن يصل إليه التفاعل عند تركيز إنزيم معيّن، عندما تكون **كل المواقع الفعّالة مشغولة** (الإنزيم مشبّع).','على المنحنى يمثّله **الخط الأفقي** الذي يقترب منه المنحنى ولا يتجاوزه.','يعتمد Vmax على **تركيز الإنزيم**: مضاعفة الإنزيم تضاعف Vmax.','مثال: إنزيم يصل معدله إلى 20 μmol min⁻¹ ولا يزيد مهما أضفنا ركيزة ← Vmax = 20 μmol min⁻¹.'], vis:'vmax_km', cap:'المنحنى يقترب من Vmax تدريجيًا كلما زاد تركيز الركيزة.', q:{t:'mcq', q:'عند Vmax:', opts:['نصف المواقع الفعّالة مشغولة','كل المواقع الفعّالة مشغولة باستمرار','الركيزة نفدت','الإنزيم دنتر'], a:1, why:'التشبّع الكامل هو ما يحدّد Vmax.'}},
      {title:'ثابت ميكايليس-منتن Km', tag:'مفهوم', text:['**ثابت ميكايليس-منتن (Km)**: **تركيز الركيزة** الذي يعمل عنده الإنزيم بـ**نصف معدله الأقصى** (½Vmax).','وحدته وحدة تركيز (مثل mmol dm⁻³) لأنه تركيز ركيزة، **ليس** معدلًا.','خطوات قراءته: حدّد Vmax ← احسب ½Vmax ← ارسم خطًا أفقيًا من ½Vmax إلى المنحنى ← أسقط خطًا عموديًا إلى محور تركيز الركيزة ← اقرأ Km.','مثال: Vmax = 20 ← ½Vmax = 10 ← المنحنى يبلغ 10 عند تركيز 2 mmol dm⁻³ ← **Km = 2 mmol dm⁻³**.'], vis:{kind:'steps', steps:[{icon:'1️⃣',t:'اقرأ Vmax من الخط الأفقي'},{icon:'2️⃣',t:'احسب ½Vmax'},{icon:'3️⃣',t:'خط أفقي من ½Vmax حتى المنحنى'},{icon:'4️⃣',t:'خط عمودي إلى محور تركيز الركيزة'},{icon:'5️⃣',t:'القراءة على المحور = Km'}]}, q:{t:'mcq', q:'Km هو:', opts:['المعدل الأقصى للتفاعل','تركيز الركيزة عند نصف Vmax','نصف تركيز الإنزيم','زمن الوصول إلى Vmax'], a:1, why:'Km تركيز ركيزة يقابل ½Vmax.'}},
      {title:'Km مقياس الألفة', tag:'تفسير', text:['**Km صغير** ← الإنزيم يبلغ نصف سرعته الأقصى بركيزة قليلة ← **ألفة عالية** للركيزة.','**Km كبير** ← يحتاج ركيزة كثيرة ليبلغ نصف سرعته ← **ألفة منخفضة**.','العلاقة **عكسية**: كلما صغر Km زادت الألفة.','Km خاصّية للإنزيم مع ركيزة معيّنة، ولا يتغيّر بتغيّر تركيز الإنزيم (على عكس Vmax).'], vis:{kind:'compare', cols:[{icon:'🧲',title:'Km صغير',items:['ألفة عالية','يصل إلى ½Vmax بركيزة قليلة','المنحنى يرتفع بحدّة في البداية','مناسب عند ندرة الركيزة']},{icon:'🪶',title:'Km كبير',items:['ألفة منخفضة','يحتاج ركيزة كثيرة لـ ½Vmax','المنحنى يرتفع ببطء','يستجيب لتغيّرات تركيز الركيزة']}]}, q:{t:'mcq', q:'إنزيم X له Km = 0.5 mmol dm⁻³ وإنزيم Y له Km = 5 mmol dm⁻³. أيّهما أعلى ألفة؟', opts:['X','Y','متساويان','لا يمكن المعرفة'], a:0, why:'Km الأصغر = ألفة أعلى.'}},
      {title:'قراءة منحنى: إنزيمان', tag:'تطبيق', text:['إنزيمان لهما نفس Vmax = 20 μmol min⁻¹ لكن منحنياهما مختلفان.','**الإنزيم A** يبلغ 10 μmol min⁻¹ (½Vmax) عند تركيز ركيزة 2 mmol dm⁻³ ← Km(A) = 2.','**الإنزيم B** يبلغ 10 μmol min⁻¹ عند 8 mmol dm⁻³ ← Km(B) = 8.','الاستنتاج: A أعلى ألفة (Km أصغر أربع مرات)، ويعمل بكفاءة عند تراكيز ركيزة منخفضة.'], vis:{kind:'table', head:['تركيز الركيزة (mmol dm⁻³)','معدل الإنزيم A','معدل الإنزيم B'], rows:[['0','0','0'],['1','6.7','2.2'],['2','10 (½Vmax)','4'],['4','13.3','6.7'],['8','16','10 (½Vmax)'],['16','17.8','13.3'],['كبير جدًا','→ 20','→ 20']]}, cap:'بيانات توضيحية (μmol min⁻¹): Km(A) = 2 و Km(B) = 8.'},
      {title:'لماذا تختلف الألفة بين الإنزيمات؟', tag:'تفسير', text:['تختلف قوة الارتباط بحسب **شكل الموقع الفعّال** ونوع الروابط الضعيفة التي تتكوّن مع الركيزة.','الإنزيمات في **مسارات أيضية حرجة** غالبًا عالية الألفة لتعمل رغم ندرة الركيزة.','بعض الإنزيمات منخفضة الألفة عن قصد: يزيد نشاطها فقط عندما يتراكم تركيز الركيزة — نوع من **التنظيم**.','قيم Km الحقيقية تتفاوت بشدّة بين الإنزيمات، من أقلّ من 0.01 إلى عشرات mmol dm⁻³.'], vis:{kind:'cards', items:[{icon:'🎯',title:'شكل الموقع الفعّال',text:'تكامل أدقّ = ارتباط أقوى'},{icon:'🔗',title:'روابط ضعيفة',text:'هيدروجينية وأيونية مع الركيزة'},{icon:'⚖️',title:'تنظيم',text:'Km كبير يعني استجابة للتراكم'},{icon:'🧬',title:'تطوّر',text:'كل إنزيم مناسب لدوره'}]}},
      {title:'الألفة والحياة اليومية', tag:'ربط بالحياة', text:['**الهيموجلوبين** ليس إنزيمًا لكن مفهوم الألفة نفسه يفسّر كيف يلتقط الأكسجين في الرئتين ويطلقه في الأنسجة.','في **تصميم الأدوية** يبحث الكيميائيون عن مركّبات عالية الألفة للإنزيم المستهدف كي تعمل بجرعات صغيرة.','في **الصناعة** يُفضَّل إنزيم ذو Km صغير عندما تكون الركيزة مكلفة، ليتحوّل معظمها إلى ناتج.','مقارنة Km تسمح للعلماء باختيار الإنزيم الأمثل لكل تطبيق.'], vis:{kind:'flow', steps:[{icon:'📈',t:'ارسم المنحنى'},{icon:'🔍',t:'اقرأ Km'},{icon:'⚖️',t:'قارن الألفة'},{icon:'✅',t:'اختر الإنزيم الأنسب'}]}},

  { id:'l3_6', num:'٣-٦', title:'مثبّطات الإنزيمات', en:'Enzyme inhibitors', ws:false,
    preIntro:'كيف تعمل بعض السموم والأدوية؟ وكيف «تُطفئ» الخلية إنزيمًا عندما لا تحتاجه؟',

    slides:[
      {title:'إطفاء الإنزيم', tag:'تمهيد', text:['**المثبّط** (inhibitor): مادة تقلّل معدل التفاعل المحفَّز بإنزيم أو توقفه بالارتباط بالإنزيم.','بعض السموم والمضادّات الحيوية والأدوية مثبّطات إنزيمية، والخلية نفسها تستخدم مثبّطات **لتنظيم** الأيض.','أهداف الدرس: التمييز بين المثبّط **التنافسي** و**غير التنافسي**، والتثبيط **العكسي وغير العكسي**، وشرح **تثبيط الناتج النهائي**.'], note:'💡 بعض أدوية الضغط والكوليسترول تعمل بتثبيط إنزيمات محدّدة في الجسم.', vis:'inhibitors', cap:'طريقتان لتعطيل الإنزيم: احتلال الموقع الفعّال أو تغيير شكله.'},
      {title:'المثبّط التنافسي', tag:'نوع 1', text:['جزيء **شكله يشبه شكل الركيزة** فيدخل **الموقع الفعّال** ويحتلّه مؤقتًا.','**يتنافس** مع الركيزة على الموقع الفعّال؛ أثناء وجوده لا تستطيع الركيزة الارتباط فلا يتكوّن ناتج.','الارتباط **عكسي** عادةً: المثبّط ينفصل ويعود الإنزيم للعمل.','درجة التثبيط تعتمد على **النسبة** بين تركيز المثبّط وتركيز الركيزة.'], vis:'inhibitors', q:{t:'mcq', q:'ما الذي يمكّن المثبّط التنافسي من دخول الموقع الفعّال؟', opts:['حجمه الكبير','تشابه شكله مع شكل الركيزة','شحنته المعاكسة للإنزيم','ارتباطه بالناتج'], a:1, why:'التكامل في الشكل مع الموقع الفعّال.'}},
      {title:'التغلّب على التثبيط التنافسي', tag:'تفسير', text:['زيادة **تركيز الركيزة** تزيد فرصة أن يجد الإنزيم ركيزة بدل المثبّط ← يقلّ أثر التثبيط.','عند تركيز ركيزة عالٍ جدًا يمكن الوصول إلى **Vmax نفسه** كما في غياب المثبّط.','لكن يلزم تركيز ركيزة أكبر لبلوغ ½Vmax ← **Km الظاهري يزداد** (تبدو الألفة أقل).','على المنحنى: المنحنى مع مثبّط تنافسي ينحرف إلى اليمين لكنه يصل إلى نفس الارتفاع في النهاية.'], vis:{kind:'table', head:['','بدون مثبّط','مع مثبّط تنافسي'], rows:[['Vmax','20','20 (نفسه، عند ركيزة عالية)'],['Km','2','6 (يزداد)'],['أثر زيادة الركيزة','—','يقلّ التثبيط'],['موقع الارتباط','—','الموقع الفعّال']]}, cap:'قيم توضيحية: التنافسي لا يغيّر Vmax لكن يرفع Km الظاهري.', q:{t:'mcq', q:'كيف يمكن تقليل أثر مثبّط تنافسي؟', opts:['بتقليل تركيز الركيزة','بزيادة تركيز الركيزة','بتبريد المحلول','بتقليل الإنزيم'], a:1, why:'الركيزة الأكثر تفوز بالتنافس على المواقع الفعّالة.'}},
      {title:'المثبّط غير التنافسي', tag:'نوع 2', text:['يرتبط بالإنزيم في **موقع آخر** غير الموقع الفعّال (يسمّى أحيانًا الموقع الألوستيري).','ارتباطه **يغيّر التركيب الثالثي** للإنزيم فيتغيّر **شكل الموقع الفعّال** ولا تناسبه الركيزة.','**لا يتنافس** مع الركيزة، لذلك **زيادة الركيزة لا تقلّل** التثبيط.','النتيجة: **Vmax ينخفض** لأن جزءًا من جزيئات الإنزيم معطَّل فعليًا، بينما Km لا يتغيّر تقريبًا.'], vis:{kind:'preset', name:'inhibitors', opts:{}}, cap:'المثبّط غير التنافسي يعمل «من بعيد» بتشويه الموقع الفعّال.', q:{t:'mcq', q:'لماذا لا تفيد زيادة الركيزة مع مثبّط غير تنافسي؟', opts:['لأن الركيزة تتحلّل','لأن المثبّط لا يحتلّ الموقع الفعّال بل يشوّه شكله','لأن المثبّط يتحوّل إلى ركيزة','لأن الإنزيم يُستهلك'], a:1, why:'المشكلة في شكل الموقع الفعّال لا في التنافس عليه.'}},
      {title:'مقارنة النوعين', tag:'مقارنة', text:['التنافسي: يشبه الركيزة ← يرتبط بالموقع الفعّال ← يُتغلَّب عليه بزيادة الركيزة ← Vmax ثابت وKm يزداد.','غير التنافسي: لا يشبه الركيزة ← يرتبط بموقع آخر ← يغيّر شكل الموقع الفعّال ← Vmax ينخفض وKm ثابت.','كلاهما قد يكون **عكسيًا** (ارتباط ضعيف مؤقت) أو **غير عكسي** (ارتباط قوي دائم).'], vis:{kind:'compare', cols:[{icon:'🥊',title:'تنافسي',items:['يشبه الركيزة','يرتبط بالموقع الفعّال','زيادة الركيزة تقلّله','Vmax ثابت، Km يزداد']},{icon:'🔧',title:'غير تنافسي',items:['لا يشبه الركيزة','يرتبط بموقع آخر','زيادة الركيزة لا تفيد','Vmax ينخفض، Km ثابت']}]}},
      {title:'عكسي أم غير عكسي؟', tag:'تصنيف', text:['**التثبيط العكسي**: المثبّط يرتبط بروابط ضعيفة (هيدروجينية/أيونية) وينفصل بسهولة؛ يزول التثبيط بإزالة المثبّط — وهو الأساس في **التنظيم** داخل الخلية.','**التثبيط غير العكسي**: المثبّط يرتبط ارتباطًا قويًا (تساهميًا غالبًا) فيعطّل الإنزيم بشكل دائم.','أمثلة على مثبّطات غير عكسية: أيونات **الفلزات الثقيلة** (الزئبق، الرصاص) وبعض السموم، وهذا ما يجعلها شديدة الخطورة.','كثير من المضادّات الحيوية والأدوية مثبّطات لإنزيمات الميكروب أو الجسم.'], vis:{kind:'cards', items:[{icon:'🔁',title:'عكسي',text:'روابط ضعيفة، ينفصل، تنظيم'},{icon:'🔒',title:'غير عكسي',text:'ارتباط دائم، تعطيل نهائي'},{icon:'☠️',title:'فلزات ثقيلة',text:'زئبق ورصاص تدمّر الإنزيمات'},{icon:'💊',title:'أدوية',text:'تثبيط مستهدف لإنزيم معيّن'}]}},
      {title:'تثبيط الناتج النهائي', tag:'تنظيم', text:['في **مسار أيضي** متعدّد الخطوات (A ← B ← C ← D) يحفّز كل خطوة إنزيم مختلف.','عندما يتراكم **الناتج النهائي** (D) يعمل **مثبّطًا غير تنافسي عكسي** للإنزيم الأول في المسار.','يتوقّف إنتاج D، وعندما يُستهلك D وينخفض تركيزه ينفصل عن الإنزيم ويعود المسار للعمل.','هذه **تغذية راجعة سالبة** توفّر الطاقة والمواد وتمنع التراكم الضارّ — مثال: تراكم ATP يثبّط أحد إنزيمات التنفس الخلوي.'], vis:{kind:'cycle', center:'🔄', steps:[{icon:'🔹',t:'A ← B ← C ← D بالإنزيمات'},{icon:'📈',t:'يتراكم D'},{icon:'🛑',t:'D يثبّط الإنزيم الأول'},{icon:'📉',t:'ينخفض D بالاستهلاك'},{icon:'▶️',t:'ينفصل D ويعود المسار'}]}, q:{t:'mcq', q:'في تثبيط الناتج النهائي يرتبط الناتج بـ:', opts:['الإنزيم الأخير في المسار','الإنزيم الأول (أو مبكّر) في المسار','الركيزة الأولى','الناتج نفسه'], a:1, why:'تثبيط البداية يوقف المسار كله ويوفّر المواد الوسطية.'}},
      {title:'خلاصة الدرس', tag:'خلاصة', text:['**المثبّط التنافسي** يشبه الركيزة ويحتلّ الموقع الفعّال؛ تقلّله زيادة الركيزة (Vmax ثابت، Km يزداد).','**المثبّط غير التنافسي** يرتبط بموقع آخر ويغيّر شكل الموقع الفعّال؛ لا تفيد زيادة الركيزة (Vmax ينخفض).','التثبيط **العكسي** أساس التنظيم، و**غير العكسي** (فلزات ثقيلة) تعطيل دائم.','**تثبيط الناتج النهائي**: الناتج يثبّط الإنزيم الأول عكسيًا — تغذية راجعة سالبة.'], vis:'inhibitors'}

      {t:'cloud', q:'اختر ما تتوقّع أن يرتبط بتثبيت الإنزيمات:', words:[{w:'كريات ألجينات',ok:true},{w:'عمود',ok:true},{w:'إعادة الاستخدام',ok:true},{w:'ناتج غير ملوّث بالإنزيم',ok:true},{w:'الانقسام الاختزالي',ok:false},{w:'اللاكتيز',ok:true},{w:'قوة التكبير',ok:false},{w:'ثبات حراري أعلى',ok:true},{w:'كروموسوم',ok:false}], why:'التثبيت يحبس الإنزيم في مادة خاملة (ألجينات) داخل عمود، فيُعاد استخدامه ويخرج الناتج نقيًا ويزداد ثباته.'},

    slides:[
      {title:'إنزيمات في قفص!', tag:'تمهيد', text:['الإنزيمات النقية **غالية**، والصناعة تحتاجها بكميات كبيرة ولمرات كثيرة.','**تثبيت الإنزيم** (immobilisation): حبس الإنزيم أو ربطه بمادة **خاملة** بحيث يبقى في مكانه ويمرّ عليه محلول الركيزة.','أهداف الدرس: وصف طريقة التثبيت في **كريات الألجينات**، وشرح مزايا الإنزيمات المثبَّتة وعيوبها، ومثال **اللاكتيز**.'], note:'💡 الحليب الخالي من اللاكتوز في أسواقنا يُنتَج غالبًا بإنزيم لاكتيز مثبَّت.', vis:'immobilised', cap:'كريات تحوي الإنزيم داخل عمود؛ الركيزة تدخل من الأعلى والناتج يخرج من الأسفل.'},
      {title:'طرق التثبيت', tag:'مفهوم', text:['**الحبس داخل هلام** (entrapment): خلط الإنزيم مع محلول يتصلّب حول جزيئاته مكوّنًا كريات، مثل **الألجينات** (مستخلص من الطحالب البحرية).','**الربط بسطح** (adsorption / covalent bonding): تثبيت الإنزيم على سطح خامل مثل حبيبات زجاج أو راتنج بروابط ضعيفة أو تساهمية.','**التغليف** داخل كبسولات دقيقة ذات غشاء ينفذ منه الركيزة والناتج لا الإنزيم.','في جميع الطرق: الموقع الفعّال يبقى **متاحًا** للركيزة قدر الإمكان.'], vis:{kind:'cards', items:[{icon:'🫧',title:'حبس في هلام',text:'كريات ألجينات'},{icon:'🧲',title:'ربط بسطح',text:'حبيبات زجاج أو راتنج'},{icon:'💊',title:'تغليف',text:'كبسولات دقيقة منفذة'},{icon:'🎯',title:'الشرط',text:'موقع فعّال متاح'}]}, q:{t:'mcq', q:'المادة الهلامية الشائعة لتثبيت الإنزيمات في المختبر المدرسي:', opts:['السليلوز','الألجينات','النشا','الجلايكوجين'], a:1, why:'ألجينات الصوديوم تتصلّب في محلول كلوريد الكالسيوم مكوّنةً كريات.'}},
      {title:'صنع كريات الألجينات', tag:'عملي', text:['1) اخلط محلول **الإنزيم** (مثل اللاكتيز) مع محلول **ألجينات الصوديوم**.','2) أسقط الخليط بالتقطير من محقنة في محلول **كلوريد الكالسيوم**؛ تتصلّب كل قطرة فورًا إلى **كرية** ألجينات كالسيوم تحبس الإنزيم داخلها.','3) اترك الكريات دقائق لتتماسك، ثم اغسلها بالماء المقطّر لإزالة أي إنزيم على السطح.','4) ضع الكريات في **عمود** (محقنة كبيرة أو أنبوب) وأمرّ محلول الركيزة من الأعلى، واجمع الناتج من الأسفل.'], vis:{kind:'steps', steps:[{icon:'🧪',t:'إنزيم + ألجينات الصوديوم'},{icon:'💧',t:'تقطير في كلوريد الكالسيوم'},{icon:'🫧',t:'تكوّن الكريات وتماسكها'},{icon:'🚿',t:'غسل الكريات'},{icon:'🏛️',t:'تعبئة العمود وإمرار الركيزة'},{icon:'🥛',t:'جمع الناتج'}]}},
      {title:'مثال: حليب خالٍ من اللاكتوز', tag:'تطبيق', text:['**اللاكتيز** المثبَّت في كريات داخل عمود، ويمرّ عليه **الحليب** (يحوي اللاكتوز).','ينتشر اللاكتوز إلى داخل الكريات ويرتبط بالمواقع الفعّالة ← تحلّل مائي ← **جلوكوز + جالاكتوز** ينتشران خارجًا مع الحليب.','الحليب الخارج **خالٍ من اللاكتوز** و**خالٍ من الإنزيم** ← مناسب لمن يعانون عدم تحمّل اللاكتوز، وأحلى مذاقًا قليلًا.','العمود يعمل **باستمرار** لفترات طويلة قبل الحاجة إلى تغيير الكريات.'], vis:'immobilised', q:{t:'mcq', q:'لماذا لا يحوي الحليب الخارج من العمود إنزيمًا؟', opts:['لأن الإنزيم استُهلك','لأن الإنزيم محبوس في الكريات ولا يخرج معه','لأن الحرارة دنترته','لأن اللاكتوز يدمّره'], a:1, why:'الكريات تحبس الإنزيم وتسمح بمرور الجزيئات الصغيرة فقط.'}},
      {title:'مزايا الإنزيمات المثبَّتة', tag:'مزايا', text:['**إعادة الاستخدام**: الإنزيم يبقى في العمود فيُستخدم مرارًا ← توفير كبير في التكلفة.','**ناتج غير ملوّث** بالإنزيم ← لا حاجة إلى خطوات فصل وتنقية مكلفة.','**ثبات أعلى**: المادة الخاملة تدعم تركيب الإنزيم فيتحمّل تغيّرات **درجة الحرارة وpH** أكثر ويقلّ تعرّضه للدنترة.','**عملية مستمرة** وسهلة التحكّم: يمكن إيقاف التفاعل بمجرد إزالة الكريات أو وقف التدفّق.'], vis:{kind:'cards', items:[{icon:'♻️',title:'إعادة استخدام',text:'يبقى الإنزيم في العمود'},{icon:'✨',title:'ناتج نقي',text:'بلا إنزيم مخلوط'},{icon:'🛡️',title:'ثبات أعلى',text:'يتحمّل حرارة وpH أوسع'},{icon:'🎛️',title:'تحكّم أسهل',text:'عملية مستمرة'}]}, q:{t:'mcq', q:'أي ميزة تفسّر انخفاض تكلفة الإنتاج بشكل مباشر؟', opts:['تغيّر لون الناتج','إعادة استخدام الإنزيم عدّة مرات','زيادة حجم الكريات','ارتفاع Km'], a:1, why:'الإنزيم مكلف، وعدم فقده مع كل دفعة يوفّر كثيرًا.'}},
      {title:'العيوب والقيود', tag:'مقارنة', text:['**انخفاض معدل التفاعل**: الركيزة تحتاج إلى **الانتشار** إلى داخل الكريات، وبعض المواقع الفعّالة أقلّ إتاحة أو تغيّر شكلها قليلًا بالتثبيت.','**تكلفة أولية** للتثبيت والمواد والمعدّات.','لا تناسب كل الإنزيمات أو كل الركائز (الجزيئات الكبيرة جدًا تنتشر بصعوبة).','لذلك يُقارن دائمًا: وفورات إعادة الاستخدام مقابل انخفاض المعدل.'], vis:{kind:'compare', cols:[{icon:'✅',title:'مزايا',items:['إعادة الاستخدام','ناتج نقي بلا إنزيم','ثبات حراري وpH أعلى','عملية مستمرة سهلة التحكّم']},{icon:'⚠️',title:'عيوب',items:['معدل تفاعل أقل','الركيزة تنتشر ببطء داخل الكريات','تكلفة تثبيت أولية','بعض المواقع الفعّالة أقل إتاحة']}]}},
      {title:'تجربة مقارنة: حرّ مقابل مثبَّت', tag:'قراءة بيانات', text:['قِيس نشاط اللاكتيز الحرّ والمثبَّت عند درجات حرارة مختلفة (بيانات توضيحية، نسبة مئوية من الأقصى).','الإنزيم **الحرّ** أسرع عند 40°C (100% مقابل 70%)، لكنه ينهار عند 60°C (10%).','الإنزيم **المثبَّت** يحتفظ بنشاط عالٍ عند 60°C (55%) ← ثبات حراري أعلى.','الاستنتاج: التثبيت يخفّض المعدل الأقصى لكنه يوسّع مدى الظروف التي يعمل فيها الإنزيم.'], vis:{kind:'bars', items:[{t:'حرّ 40°C',v:100,label:'100%'},{t:'مثبَّت 40°C',v:70,label:'70%'},{t:'حرّ 60°C',v:10,label:'10%'},{t:'مثبَّت 60°C',v:55,label:'55%'}], cap:'نشاط نسبي توضيحي للاكتيز الحرّ والمثبَّت.'}, q:{t:'mcq', q:'ما الاستنتاج الصحيح من هذه البيانات؟', opts:['المثبَّت أسرع دائمًا','الحرّ أكثر ثباتًا حراريًا','المثبَّت أبطأ عند الأمثل لكنه يتحمّل الحرارة أكثر','لا فرق بينهما'], a:2, why:'70% < 100% عند 40°C، لكن 55% ≫ 10% عند 60°C.'}},
      {title:'تطبيقات أخرى', tag:'ربط بالحياة', text:['**أشرطة اختبار الجلوكوز** لمرضى السكري: إنزيم جلوكوز أوكسيديز مثبَّت على الشريط يتفاعل مع جلوكوز الدم ويغيّر اللون.','**شراب الفركتوز** الصناعي: إنزيم مثبَّت يحوّل الجلوكوز إلى فركتوز الأحلى مذاقًا.','**تنقية العصائر** وإزالة المرارة، وإنتاج **المضادّات الحيوية** شبه الصناعية.','**المستشعرات الحيوية** (biosensors) تستخدم إنزيمات مثبَّتة للكشف السريع عن مواد معيّنة.'], vis:{kind:'cards', items:[{icon:'🩸',title:'شرائط السكر',text:'جلوكوز أوكسيديز مثبَّت'},{icon:'🍯',title:'شراب الفركتوز',text:'تحويل الجلوكوز'},{icon:'🧃',title:'العصائر',text:'تنقية وإزالة مرارة'},{icon:'📡',title:'مستشعرات حيوية',text:'كشف سريع ودقيق'}]}},
      {title:'خلاصة الدرس', tag:'خلاصة', text:['**التثبيت**: حبس الإنزيم في مادة خاملة (كريات **ألجينات** الكالسيوم) أو ربطه بسطح، داخل **عمود** يمرّ عليه محلول الركيزة.','**المزايا**: إعادة الاستخدام، ناتج غير ملوّث، ثبات أعلى تجاه الحرارة وpH، عملية مستمرة.','**العيوب**: معدل أقل (انتشار الركيزة إلى الكريات) وتكلفة أولية.','مثال رئيس: **اللاكتيز** المثبَّت لإنتاج حليب خالٍ من اللاكتوز (لاكتوز ← جلوكوز + جالاكتوز).'], vis:{kind:'flow', steps:[{icon:'🥛',t:'حليب باللاكتوز'},{icon:'🏛️',t:'عمود كريات اللاكتيز'},{icon:'🔹🔹',t:'جلوكوز + جالاكتوز'},{icon:'✅',t:'حليب خالٍ من اللاكتوز والإنزيم'}]}}
    ],

        {title:'الهستونات والنيوكليوسوم', tag:'التغليف ١', text:['**الهستونات** بروتينات موجبة الشحنة ترتبط بقوة بـ DNA سالب الشحنة.','يلتفّ DNA حول مجموعة من **ثمانية** جزيئات هستون مكوّنًا **النيوكليوسوم**.','تبدو النيوكليوسومات تحت المجهر الإلكتروني مثل **خرزات على خيط**.','هذا أول مستوى من التغليف يقصّر DNA كثيرًا.'], vis:{kind:'flow', steps:[{icon:'➰',t:'حلزون DNA المزدوج'},{icon:'🧵',t:'يلتف حول 8 هستونات'},{icon:'📿',t:'نيوكليوسوم (خرزة)'},{icon:'🪢',t:'خرزات على خيط'}]}, cap:'النيوكليوسوم: الوحدة الأساسية لتغليف DNA.'},
        {title:'من النيوكليوسوم إلى الكروموسوم', tag:'التغليف ٢', text:['خيط النيوكليوسومات يلتفّ على نفسه مكوّنًا **ليفة كروماتين** أسمك.','تلتفّ الليفة وتتطوّى في **عُرى** ثم تتكاثف أكثر.','أعلى درجات التكاثف تعطي **الكروموسوم** المرئي أثناء الانقسام.','**الكروماتين** = مركّب DNA + البروتينات في كل مستويات التغليف.'], vis:{kind:'steps', steps:[{icon:'1️⃣',t:'DNA (قطر 2 نانومتر)'},{icon:'2️⃣',t:'نيوكليوسومات: خرزات على خيط'},{icon:'3️⃣',t:'ليفة كروماتين ملتفة'},{icon:'4️⃣',t:'عُرى مطوية'},{icon:'5️⃣',t:'كروموسوم مكثّف (أثناء الانقسام)'}]}, q:{t:'mcq', q:'ما الاسم الذي يُطلق على مركّب DNA مع البروتينات الهستونية؟', opts:['الكروماتين','الرايبوسوم','السنترومير','النوية'], a:0, why:'الكروماتين هو مادة الكروموسومات: DNA مع بروتيناته.'}},
        {title:'الكروماتين في الطور البيني والكروموسوم في الانقسام', tag:'مقارنة', text:['في **الطور البيني** يكون الكروماتين ممتدًا رفيعًا؛ الجينات نشطة ويمكن نسخها وتضاعفها.','عند **الانقسام** يتكاثف الكروماتين إلى كروموسومات قصيرة سميكة يسهل توزيعها دون تشابك.','الكروموسوم المتكاثف **غير نشط** جينيًا مؤقتًا.'], vis:{kind:'compare', cols:[{icon:'🧶',title:'كروماتين (الطور البيني)',items:['خيوط رفيعة ممتدة','غير مرئية كل على حدة','الجينات تُنسخ ويتضاعف DNA','يشغل النواة كلها']},{icon:'🧬',title:'كروموسوم (الانقسام)',items:['قصير سميك مكثّف','مرئي بالمجهر الضوئي','يسهل فصله وتوزيعه','لا نسخ للجينات أثناء التكاثف']}]}},
        {title:'أجزاء الكروموسوم المتضاعف', tag:'التركيب', text:['**الكروماتيدان الشقيقان**: نسختان متطابقتان من DNA.','**السنترومير**: منطقة ضيقة تربط الكروماتيدَين، ويتكوّن عليها **الكينيتوكور** الذي ترتبط به خيوط المغزل.','**التيلوميرات**: تتابعات DNA متكررة في طرفَي الكروموسوم تحميه (درس ٤-٥).','الجينات مرتبة بمواقع محددة على طول الكروموسوم.'], vis:'chromosome', cap:'ركّز على مواقع: الكروماتيد، السنترومير، التيلومير، الهستون.'},
        {title:'العدد الكروموسومي في الإنسان', tag:'الإنسان', text:['خلايا جسم الإنسان تحوي **46** كروموسومًا = **23 زوجًا**.','كل زوج **كروموسومان متماثلان**: أحدهما من الأب والآخر من الأم، متساويان في الطول وموقع السنترومير ويحملان **الجينات نفسها** في المواقع نفسها.','الخلية التي تحوي نسختَين (زوجًا) من كل كروموسوم تُسمّى **ثنائية المجموعة الكروموسومية (2n)**.','الزوج 23 هو زوج **الكروموسومات الجنسية**: XX في الأنثى وXY في الذكر.'], note:'💡 لكل نوع من الكائنات الحية عدد كروموسومي ثابت خاص به يختلف عن الأنواع الأخرى.', vis:{kind:'table', head:['الصفة','الكروموسومان المتماثلان','الكروماتيدان الشقيقان'], rows:[['المصدر','أحدهما من الأب والآخر من الأم','نسختان من كروموسوم واحد بعد التضاعف'],['الجينات','الجينات نفسها في المواقع نفسها (قد تختلف الأليلات)','متطابقان تمامًا'],['الاتصال','منفصلان في الخلية','متصلان بالسنترومير'],['متى؟','طوال حياة الخلية','من تضاعف DNA حتى الطور الانفصالي']]}, q:{t:'mcq', q:'كم زوجًا من الكروموسومات المتماثلة في خلية جلدية بشرية؟', opts:['46','23','92','44'], a:1, why:'46 كروموسومًا مرتبة في 23 زوجًا متماثلًا.'}},
        {title:'الكروموسومات تحت المجهر', tag:'مهارة', text:['أفضل وقت لرؤية الكروموسومات هو **الطور الاستوائي** حيث تكون في أقصى تكاثفها.','ترتيب الكروموسومات حسب الحجم وموقع السنترومير يُسمّى **النمط النووي (الكاريوتايب)**.','صبغات مثل **الأسيتو أورسين** أو **الأسيتو كارمين** تصبغ الكروموسومات في قمم الجذور النامية.'], vis:{kind:'cards', items:[{icon:'🔬',title:'العينة',text:'قمة جذر البصل أو الثوم النامية غنية بالخلايا المنقسمة'},{icon:'🎨',title:'الصبغة',text:'أسيتو أورسين يصبغ الكروموسومات بلون داكن'},{icon:'👆',title:'الهرس',text:'هرس النسيج لنشر الخلايا في طبقة واحدة'},{icon:'📷',title:'الملاحظة',text:'رسم الخلايا في مراحل الانقسام المختلفة'}]}},

        {t:'cloud', q:'اختر ما ينتمي إلى الطور البيني:', words:[{w:'نمو الخلية',ok:true},{w:'تضاعف DNA',ok:true},{w:'انفصال الكروماتيدات',ok:false},{w:'زيادة عدد العضيات',ok:true},{w:'بناء البروتينات',ok:true},{w:'تكوّن خيوط المغزل',ok:false},{w:'اصطفاف الكروموسومات في الوسط',ok:false},{w:'تخزين الطاقة',ok:true},{w:'اختفاء الغلاف النووي',ok:false}], why:'الطور البيني مرحلة نشاط أيضي ونمو وتضاعف DNA؛ أما أحداث المغزل والكروموسومات فتخص الانقسام المتساوي.'},
        {t:'visual', vis:'chromosome', q:'في هذا الرسم يظهر الكروموسوم بكروماتيدَين. في أي مرحلة من دورة الخلية تكوّن الكروماتيد الثاني؟', opts:['أثناء تضاعف DNA في الطور البيني','أثناء الانقسام السيتوبلازمي','في الطور الانفصالي','بعد انتهاء الانقسام'], a:0, why:'تضاعف DNA (المرحلة S) هو ما يجعل الكروموسوم يتكون من كروماتيدَين متطابقَين.'},
        {t:'open', q:'الخلايا العصبية في دماغك لا تنقسم عادةً بعد النضج، بينما خلايا بطانة أمعائك تنقسم باستمرار. ما الذي تتوقّع أن يختلف في «دورة الخلية» بينهما؟'}

      slides:[
        {title:'دورة حياة الخلية', tag:'تمهيد', text:['**دورة الخلية (Cell cycle)**: تتابع منتظم من الأحداث بين تكوّن الخلية وانقسامها إلى خليتَين.','تتألف من مرحلتَين كبيرتَين: **الطور البيني** (Interphase) الطويل و**المرحلة M** (انقسام النواة + انقسام السيتوبلازم).','هدف الدورة: **نسخ كل شيء** ثم **توزيعه بدقة** على خليتَين.'], note:'💡 خلايا بطانة أمعائك تكمل دورة كاملة كل يوم تقريبًا، بينما خلاياك العصبية الناضجة تتوقف عن الدورة.', vis:'cell_cycle', cap:'دورة الخلية: G1 ← S ← G2 (الطور البيني) ← M (الانقسام).'},
        {title:'الطور البيني: أطول مراحل الدورة', tag:'مفهوم', text:['**الطور البيني** ليس «راحة»؛ الخلية فيه في أقصى **نشاطها الأيضي**.','تنمو الخلية، وتبني البروتينات، وتزداد أعداد العضيات (ميتوكوندريا، رايبوسومات).','الكروموسومات فيه على هيئة **كروماتين** ممتد غير مرئي بالمجهر الضوئي.','ينقسم إلى ثلاث مراحل: **G1** و**S** و**G2**.'], vis:{kind:'bars', items:[{t:'G1',v:40,label:'G1'},{t:'S',v:30,label:'S'},{t:'G2',v:20,label:'G2'},{t:'M',v:10,label:'M'}], cap:'نسب تقريبية توضيحية لأزمنة المراحل: الطور البيني يستغرق معظم الدورة والانقسام أقصرها.'}, q:{t:'mcq', q:'أي وصف يناسب الطور البيني؟', opts:['مرحلة نشاط أيضي ونمو وتضاعف DNA','مرحلة راحة بلا نشاط','مرحلة انفصال الكروماتيدات','مرحلة تكوّن خيوط المغزل'], a:0, why:'الخلية في الطور البيني تنمو وتضاعف DNA وتزيد عضياتها.'}},
        {title:'المرحلة G1: النمو الأول', tag:'G1', text:['**G1 (Gap 1)**: تبدأ بعد الانقسام مباشرة؛ الخلية صغيرة فتنمو.','تُبنى **البروتينات** والإنزيمات، وتتكاثر **العضيات** كالميتوكوندريا والرايبوسومات.','كل كروموسوم يتكون من **كروماتيد واحد** (جزيء DNA واحد).','بعض الخلايا المتخصصة (كالخلايا العصبية) تتوقف هنا ولا تكمل الدورة.'], vis:{kind:'cards', items:[{icon:'📏',title:'نمو الحجم',text:'زيادة السيتوبلازم وحجم الخلية'},{icon:'🏭',title:'بناء البروتين',text:'إنزيمات وبروتينات لازمة للنسخ والانقسام'},{icon:'⚡',title:'تضاعف العضيات',text:'ميتوكوندريا ورايبوسومات جديدة'},{icon:'🧬',title:'كروماتيد واحد',text:'DNA لم يتضاعف بعد'}]}},
        {title:'المرحلة S: تضاعف DNA', tag:'S', text:['**S (Synthesis)**: تُنسخ كل جزيئات **DNA** نسخًا شبه محافظ.','يصبح كل كروموسوم مكوّنًا من **كروماتيدَين شقيقَين** متطابقَين متصلَين بالسنترومير.','يتضاعف **DNA** لكن **يبقى عدد الكروموسومات** ثابتًا (46 في الإنسان).','تتضاعف أيضًا **المريكزات** في الخلية الحيوانية استعدادًا لتكوين المغزل.'], vis:{kind:'flow', steps:[{icon:'🧬',t:'كروموسوم بكروماتيد واحد'},{icon:'🔁',t:'تضاعف DNA'},{icon:'🧬',t:'كروماتيدان شقيقان متطابقان'},{icon:'📍',t:'متصلان بالسنترومير'}]}, cap:'بعد S: كمية DNA تضاعفت، وعدد الكروموسومات كما هو.', q:{t:'mcq', q:'خلية بشرية أنهت المرحلة S. كم كروموسومًا وكم كروماتيدًا فيها؟', opts:['46 كروموسومًا و46 كروماتيدًا','46 كروموسومًا و92 كروماتيدًا','92 كروموسومًا و92 كروماتيدًا','23 كروموسومًا و46 كروماتيدًا'], a:1, why:'العدد الكروموسومي ثابت (46) لكن كل كروموسوم صار كروماتيدَين: 92 كروماتيدًا.'}},
        {title:'المرحلة G2: الاستعداد للانقسام', tag:'G2', text:['**G2 (Gap 2)**: نمو إضافي وبناء بروتينات لازمة للانقسام (مثل بروتينات **الأنيبيبات الدقيقة** للمغزل).','تُفحص نسخة DNA الجديدة و**تُصلَح الأخطاء** قبل الانقسام.','تخزّن الخلية **الطاقة** اللازمة لحركة الكروموسومات.','بنهاية G2 تكون الخلية جاهزة للدخول في **المرحلة M**.'], note:'💡 توجد **نقاط تفتيش** في الدورة تتأكد من اكتمال تضاعف DNA وسلامته قبل السماح بالانقسام؛ خللها أحد أسباب السرطان.', vis:{kind:'steps', steps:[{icon:'🔍',t:'فحص DNA المتضاعف وإصلاح الأخطاء'},{icon:'🧱',t:'بناء بروتينات المغزل'},{icon:'🔋',t:'تخزين الطاقة للانقسام'},{icon:'🚦',t:'نقطة تفتيش: هل الخلية جاهزة؟'},{icon:'▶️',t:'الدخول في المرحلة M'}]}},
        {title:'المرحلة M: الانقسام', tag:'M', text:['**المرحلة M** تشمل حدثَين: **الانقسام المتساوي** (انقسام النواة) ثم **الانقسام السيتوبلازمي** (انقسام السيتوبلازم).','يتكاثف الكروماتين إلى **كروموسومات** مرئية، وتتكوّن **خيوط المغزل**، وتنفصل الكروماتيدات الشقيقة.','النتيجة: **خليتان** متطابقتان جينيًا تبدأ كلٌّ منهما دورة جديدة من G1.'], vis:'mitosis', cap:'المرحلة M: أربعة أطوار للانقسام المتساوي يليها الانقسام السيتوبلازمي (التفاصيل في الدرس ٤-٤).', q:{t:'mcq', q:'ما الفرق بين الانقسام المتساوي والانقسام السيتوبلازمي؟', opts:['الأول انقسام النواة والثاني انقسام السيتوبلازم','الأول في النبات والثاني في الحيوان','الأول ينصّف الكروموسومات والثاني يضاعفها','لا فرق بينهما'], a:0, why:'الانقسام المتساوي يفصل المادة الوراثية، والانقسام السيتوبلازمي يقسم الخلية إلى خليتَين.'}},
        {title:'كمية DNA خلال الدورة', tag:'تحليل', text:['في **G1** كمية DNA في النواة = **1×** (كل كروموسوم كروماتيد واحد).','خلال **S** تزداد تدريجيًا حتى تصل **2×** في **G2** والانقسام.','بعد **الانقسام السيتوبلازمي** تعود كل خلية جديدة إلى **1×**.','عدد الكروموسومات لا يتغير في كل هذه المراحل (2n).'], vis:{kind:'table', head:['المرحلة','كمية DNA في النواة','كروماتيدات لكل كروموسوم','الحدث الرئيس'], rows:[['G1','1×','1','نمو وبناء بروتينات وعضيات'],['S','من 1× إلى 2×','1 ← 2','تضاعف DNA'],['G2','2×','2','فحص DNA والاستعداد'],['M','2× ثم 1× بعد الانقسام','2 ← 1','انقسام النواة ثم السيتوبلازم']]}},
        {title:'خلايا تنقسم وخلايا لا تنقسم', tag:'ربط بالحياة', text:['خلايا **بطانة الأمعاء** و**نخاع العظم** و**الجلد** تدور بسرعة لتعويض الفاقد المستمر.','خلايا **الكبد** تنقسم نادرًا لكنها تستأنف الدورة عند الإصابة.','الخلايا **العصبية** الناضجة وخلايا العضلات القلبية تتوقف عن الدورة غالبًا.','فقدان السيطرة على الدورة يؤدي إلى انقسام غير منضبط: **السرطان** (درس ٤-٧).'], note:'💡 لهذا يصعب شفاء إصابات الدماغ والحبل الشوكي، بينما يلتئم جرح الجلد بسرعة.', vis:{kind:'compare', cols:[{icon:'🔁',title:'تنقسم باستمرار',items:['بطانة الأمعاء','نخاع العظم','البشرة (الجلد)','قمم جذور النبات']},{icon:'⏸️',title:'نادرًا أو لا تنقسم',items:['الخلايا العصبية الناضجة','خلايا العضلة القلبية','خلايا الكبد (إلا عند الإصابة)','خلايا الدم الحمراء (بلا نواة)']}]}},
        {title:'خلاصة الدرس', tag:'خلاصة', text:['**دورة الخلية** = **الطور البيني** (G1 نمو ← S تضاعف DNA ← G2 استعداد وفحص) + **المرحلة M** (انقسام متساوٍ + انقسام سيتوبلازمي).','الطور البيني أطول المراحل وأنشطها أيضيًا.','عدد الكروموسومات ثابت طوال الدورة، أما كمية DNA فتتضاعف في S وتعود بعد الانقسام.'], vis:{kind:'cycle', center:'🔄', steps:[{icon:'📏',t:'G1: نمو'},{icon:'🧬',t:'S: تضاعف DNA'},{icon:'🔍',t:'G2: فحص واستعداد'},{icon:'🔬',t:'انقسام متساوٍ'},{icon:'✂️',t:'انقسام سيتوبلازمي'}]}}

          {q:'أهم ما يميّز الطور البيني:', opts:['اختفاء النواة','النشاط الأيضي والنمو وتضاعف DNA','انفصال الكروماتيدات','تكوّن الصفيحة الخلوية'], a:1, why:'الطور البيني مرحلة النمو والتحضير.'},
          {q:'خلية نباتية تحوي 20 كروموسومًا في G1. كم كروماتيدًا فيها في G2؟', opts:['10','20','40','80'], a:2, why:'20 كروموسومًا × 2 كروماتيدات = 40 كروماتيدًا.'},
          {q:'لماذا يجب أن يسبق تضاعف DNA الانقسام المتساوي؟', opts:['ليحصل كل من النواتَين على نسخة كاملة من المعلومات الوراثية','لزيادة حجم الخلية','لتكوين أمشاج','لإذابة الغلاف النووي'], a:0, why:'بدون تضاعف ستحصل كل نواة على نصف المعلومات فقط.'},
          {q:'خلية تحوي DNA غير مكتمل التضاعف. ما الذي يُتوقع أن يحدث عند نقطة التفتيش في G2؟', opts:['تدخل الانقسام مباشرة','تتوقف الدورة حتى يكتمل التضاعف ويُصلَح الخلل','تتحول إلى مشيج','تنقسم إلى أربع خلايا'], a:1, why:'نقاط التفتيش تمنع تمرير DNA ناقص أو متضرر إلى الخلايا الناتجة.'},
          {q:'لماذا تلتئم جروح الجلد بسرعة بينما يصعب شفاء إصابات الحبل الشوكي؟', opts:['خلايا الجلد تدور باستمرار في دورة الخلية والخلايا العصبية توقفت عنها','الجلد بلا خلايا','الخلايا العصبية تنقسم بسرعة أكبر','الجلد لا يحوي DNA'], a:0, why:'قدرة النسيج على الإصلاح تعتمد على استمرار خلاياه في الانقسام.'},
          {q:'استنتج: رسم بياني لكمية DNA في نواة خلية مع الزمن أظهر ارتفاعًا تدريجيًا من 1× إلى 2×. أي مرحلة يمثّل هذا الجزء؟', opts:['G1','S','G2','الانقسام السيتوبلازمي'], a:1, why:'الزيادة التدريجية في DNA هي التضاعف الذي يحدث في S.'},
          {q:'في أي مرحلة تعود كمية DNA في النواة إلى 1×؟', opts:['بداية S','نهاية G2','بعد الانقسام المتساوي والانقسام السيتوبلازمي','منتصف G1'], a:2, why:'بعد انفصال الكروماتيدات وتوزيعها على نواتَين تعود الكمية إلى 1× في كل خلية.'}

        summary:'**دورة الخلية** تتابع من **الطور البيني** (G1: نمو، S: تضاعف DNA، G2: فحص واستعداد) و**المرحلة M** (انقسام متساوٍ ثم انقسام سيتوبلازمي). الطور البيني أطول المراحل وأنشطها أيضيًا؛ عدد الكروموسومات ثابت بينما تتضاعف كمية DNA في S وتعود إلى 1× بعد الانقسام.'

    { id:'l4_4', num:'٤-٤', title:'الانقسام المتساوي', en:'Mitosis', ws:false,
      preIntro:'كيف تفصل الخلية 92 كروماتيدًا إلى مجموعتَين متطابقتَين تمامًا دون أن تخطئ؟ لنرَ ما تتوقّعه.',

        {t:'tf', q:'في الانقسام المتساوي ينفصل الكروماتيدان الشقيقان ويتجه كلٌّ منهما إلى قطب مختلف من الخلية.', a:true, why:'هذا ما يحدث في الطور الانفصالي، وهو أساس تطابق النواتَين الناتجتَين.'},
        {t:'mcq', q:'ما الشرط الأساسي حتى تحصل كل نواة ناتجة على نسخة كاملة من الكروموسومات؟', opts:['أن يتضاعف DNA قبل الانقسام','أن تختفي الكروموسومات','أن تنقسم الميتوكوندريا','أن يكبر حجم الخلية'], a:0, why:'التضاعف في المرحلة S يوفّر كروماتيدَين متطابقَين لكل كروموسوم.'},
        {t:'cloud', q:'اختر ما يرتبط بالانقسام المتساوي:', words:[{w:'خيوط المغزل',ok:true},{w:'الصفيحة الاستوائية',ok:true},{w:'الكينيتوكور',ok:true},{w:'التلقيح',ok:false},{w:'المريكزات',ok:true},{w:'الإنترون',ok:false},{w:'الطور الانفصالي',ok:true},{w:'الأمشاج',ok:false},{w:'الغلاف النووي',ok:true},{w:'الجهاز الهضمي',ok:false}], why:'المغزل والمريكزات والكينيتوكور والغلاف النووي والأطوار كلها عناصر في الانقسام المتساوي.'},
        {t:'visual', vis:{kind:'preset', name:'mitosis', opts:{stage:2}}, q:'في هذا الطور تصطف الكروموسومات في منتصف الخلية. ما اسمه؟', opts:['الطور الاستوائي','الطور التمهيدي','الطور النهائي','الطور البيني'], a:0, why:'الاصطفاف على الصفيحة الاستوائية هو علامة الطور الاستوائي.'},
        {t:'open', q:'الخلية النباتية محاطة بجدار صلب. كيف تتوقّع أن تنقسم إلى خليتَين مقارنةً بخلية حيوانية لينة؟'}
      ],
      slides:[
        {title:'رقصة الكروموسومات', tag:'تمهيد', text:['**الانقسام المتساوي** عملية متصلة، لكننا نقسمها إلى أربعة أطوار لتسهيل الدراسة: **التمهيدي، الاستوائي، الانفصالي، النهائي**.','ثم يأتي **الانقسام السيتوبلازمي** لتقسيم الخلية.','أهداف الدرس: وصف أحداث كل طور، ودور **خيوط المغزل** و**المريكزات** و**الكينيتوكور**، ومقارنة الانقسام السيتوبلازمي في النبات والحيوان.'], note:'💡 حيلة للحفظ: «تَـسـ‌ـفَـنْ» = تمهيدي، استوائي، انفصالي، نهائي.', vis:'mitosis', cap:'الأطوار الأربعة معًا — سنكبّر كل طور في شريحة مستقلة.'},
        {title:'الطور التمهيدي (Prophase)', tag:'الطور ١', text:['يتكاثف **الكروماتين** فتصبح الكروموسومات أقصر وأسمك و**مرئية**؛ كل كروموسوم **كروماتيدان** متصلان بالسنترومير.','تختفي **النوية**، وفي نهاية الطور يتحلّل **الغلاف النووي**.','في الخلية الحيوانية يتحرك زوجا **المريكزات** إلى القطبَين المتقابلَين.','تتكوّن **خيوط المغزل** (أنيبيبات دقيقة من البروتين) بين القطبَين.'], vis:{kind:'preset', name:'mitosis', opts:{stage:1}}, cap:'الطور التمهيدي: كروموسومات مكثّفة، مريكزات عند القطبَين، غلاف نووي يتحلّل.', q:{t:'mcq', q:'أي حدث لا ينتمي إلى الطور التمهيدي؟', opts:['تكاثف الكروموسومات','اختفاء النوية','انفصال الكروماتيدات الشقيقة','تحرك المريكزات إلى القطبَين'], a:2, why:'انفصال الكروماتيدات يحدث في الطور الانفصالي.'}},
        {title:'الطور الاستوائي (Metaphase)', tag:'الطور ٢', text:['ترتبط خيوط المغزل بـ **الكينيتوكور** على سنترومير كل كروموسوم.','تُدفع الكروموسومات لتصطف على **الصفيحة الاستوائية** في منتصف الخلية.','يتجه كل كروماتيد من الكروماتيدَين نحو **قطب مختلف**.','أفضل طور لعدّ الكروموسومات ورؤيتها في أقصى تكاثفها.'], vis:{kind:'preset', name:'mitosis', opts:{stage:2}}, cap:'الطور الاستوائي: الكروموسومات على خط الاستواء، وكل سنترومير مرتبط بخيوط من القطبَين.'},
        {title:'الطور الانفصالي (Anaphase)', tag:'الطور ٣', text:['ينقسم **السنترومير** فينفصل الكروماتيدان الشقيقان.','تُسحب الكروماتيدات نحو **القطبَين المتقابلَين** بتقصّر خيوط المغزل، **السنترومير أولًا** فتظهر بشكل V.','كل كروماتيد صار الآن **كروموسومًا** مستقلًا.','النتيجة: مجموعتان **متطابقتان** من الكروموسومات عند القطبَين.'], note:'💡 هذه المرحلة تستهلك ATP؛ لذلك تخزّن الخلية الطاقة في G2.', vis:{kind:'preset', name:'mitosis', opts:{stage:3}}, cap:'الطور الانفصالي: الكروماتيدات تتحرك نحو القطبَين على شكل V.', q:{t:'mcq', q:'خلية بشرية في الطور الانفصالي. كم كروموسومًا يتحرك نحو كل قطب؟', opts:['23','46','92','69'], a:1, why:'ينفصل 92 كروماتيدًا إلى مجموعتَين، كل مجموعة 46 كروموسومًا.'}},
        {title:'الطور النهائي (Telophase)', tag:'الطور ٤', text:['تصل الكروموسومات إلى القطبَين وتبدأ **بفكّ تكاثفها** لتعود كروماتين.','يتكوّن **غلاف نووي** جديد حول كل مجموعة، وتظهر **النوية** من جديد.','تتحلّل **خيوط المغزل**.','أصبح للخلية **نواتان** متطابقتان جينيًا.'], vis:{kind:'preset', name:'mitosis', opts:{stage:4}}, cap:'الطور النهائي: نواتان جديدتان، والخلية تستعد للانقسام السيتوبلازمي.'},
        {title:'الانقسام السيتوبلازمي: حيوان ونبات', tag:'Cytokinesis', text:['في **الخلية الحيوانية**: تتقلّص حلقة من خيوط بروتينية دقيقة تحت الغشاء فيظهر **أخدود انقسام** يضيق حتى تنفصل الخليتان.','في **الخلية النباتية**: تتجمع حويصلات من **جهاز جولجي** عند الاستواء مكوّنةً **الصفيحة الخلوية** التي تنمو إلى **جدار خلوي** جديد وغشاءَين.','السبب: الجدار الصلب يمنع «الخنق» من الخارج، فتُبنى الفاصلة من الداخل.'], vis:{kind:'compare', cols:[{icon:'🐾',title:'خلية حيوانية',items:['أخدود انقسام من الخارج إلى الداخل','حلقة تقلّص من خيوط بروتينية','لا جدار خلوي','تحوي مريكزات تكوّن المغزل']},{icon:'🌿',title:'خلية نباتية',items:['صفيحة خلوية من الوسط إلى الخارج','حويصلات جولجي تحمل مواد الجدار','يتكوّن جدار خلوي جديد','لا مريكزات، ويتكوّن المغزل رغم ذلك']}]}, q:{t:'mcq', q:'ما مصدر مواد الصفيحة الخلوية في الخلية النباتية المنقسمة؟', opts:['حويصلات جهاز جولجي','الميتوكوندريا','النوية','خيوط المغزل'], a:0, why:'حويصلات جولجي تنقل مكونات الجدار والغشاء إلى مستوى الاستواء.'}},
        {title:'خيوط المغزل والمريكزات والكينيتوكور', tag:'الأدوار', text:['**خيوط المغزل**: أنيبيبات دقيقة بروتينية تمتد بين القطبَين، تحرّك الكروموسومات.','**المريكزات** (في الحيوان): تنظّم تكوين المغزل من القطبَين؛ النبات يكوّن المغزل بدونها.','**الكينيتوكور**: بروتين على السنترومير يُمسك بخيوط المغزل ويُحرّك الكروموسوم عند تقصّرها.'], vis:{kind:'cards', items:[{icon:'🕸️',title:'خيوط المغزل',text:'أنيبيبات دقيقة تنمو من القطبَين وتتقلص لتسحب الكروماتيدات'},{icon:'🎯',title:'المريكزات',text:'زوجان يتحركان إلى القطبَين في الطور التمهيدي (خلية حيوانية)'},{icon:'🪝',title:'الكينيتوكور',text:'نقطة الالتحام بين الكروموسوم والمغزل'},{icon:'📍',title:'السنترومير',text:'ينقسم في الطور الانفصالي لتحرير الكروماتيدَين'}]}},
        {title:'لماذا الخلايا الناتجة متطابقة جينيًا؟', tag:'تحليل', text:['**التضاعف الدقيق** لـ DNA ينتج كروماتيدَين متطابقَين لكل كروموسوم.','**الاصطفاف** على الاستواء ثم **انفصال** الكروماتيدَين إلى قطبَين مختلفَين يضمن أن تحصل كل نواة على **نسخة واحدة من كل كروموسوم**.','لذلك تحوي كل خلية ناتجة العدد نفسه (2n) والمعلومات نفسها: **نسائل**.'], vis:{kind:'flow', steps:[{icon:'🧬',t:'تضاعف: كروماتيدان متطابقان'},{icon:'↔️',t:'اصطفاف على الاستواء'},{icon:'✂️',t:'انفصال الكروماتيدَين إلى قطبَين'},{icon:'👯',t:'نواتان متطابقتان'}]}},
        {title:'مشاهدة الانقسام في قمة الجذر', tag:'مهارة', text:['قمة جذر **البصل أو الثوم** تحوي منطقة انقسام نشطة.','نصبغ بـ **الأسيتو أورسين** ونهرس النسيج ليصبح طبقة واحدة.','نحدد الطور من شكل الكروموسومات: مبعثرة (تمهيدي)، على خط (استوائي)، مجموعتان V (انفصالي)، نواتان (نهائي).','يمكن حساب **الدليل الانقسامي**: نسبة الخلايا المنقسمة إلى العدد الكلي.'], vis:{kind:'table', head:['الطور','ما تراه تحت المجهر','ملاحظة مميزة'], rows:[['التمهيدي','كروموسومات سميكة مبعثرة داخل النواة','لا غلاف نووي واضح في نهايته'],['الاستوائي','كروموسومات على خط في منتصف الخلية','أوضح طور لعدّ الكروموسومات'],['الانفصالي','مجموعتان على شكل V تتباعدان','السنترومير يتقدّم'],['النهائي','مجموعتان عند القطبَين تبدأان بالاختفاء','يظهر خط الفصل أو الصفيحة الخلوية']]}},
        {title:'خلاصة الدرس', tag:'خلاصة', text:['**تمهيدي**: تكاثف، اختفاء النوية والغلاف النووي، تكوّن المغزل.','**استوائي**: اصطفاف على الصفيحة الاستوائية بالكينيتوكور.','**انفصالي**: انقسام السنترومير وسحب الكروماتيدات إلى القطبَين.','**نهائي**: غلافان نوويان جديدان ثم **انقسام سيتوبلازمي** (أخدود في الحيوان، صفيحة خلوية في النبات).'], vis:{kind:'steps', steps:[{icon:'1️⃣',t:'التمهيدي: تكاثف وتكوّن المغزل'},{icon:'2️⃣',t:'الاستوائي: اصطفاف في الوسط'},{icon:'3️⃣',t:'الانفصالي: انفصال الكروماتيدات'},{icon:'4️⃣',t:'النهائي: نواتان جديدتان'},{icon:'5️⃣',t:'الانقسام السيتوبلازمي: خليتان'}]}}

        {title:'أطراف رباط الحذاء', tag:'تمهيد', text:['رباط الحذاء دون طرف بلاستيكي **يتفتّت** وتضيع خيوطه.','للكروموسوم أطراف واقية مماثلة تُسمّى **التيلوميرات (Telomeres)**.','سؤال الدرس: ممّا تحمي التيلوميرات؟ ولماذا تتقلّص؟ وما علاقتها بالشيخوخة والسرطان؟'], vis:{kind:'emoji', icon:'👟', size:120, label:'الطرف الواقي يحفظ الرباط من التفتّت'}},
        {title:'ما التيلوميرات؟', tag:'مفهوم', text:['**التيلوميرات**: تتابعات قصيرة من DNA **متكررة مرات كثيرة** في طرفَي كل كروموسوم.','لا تحوي **جينات**؛ فهي DNA غير مشفّر يعمل «غطاءً واقيًا».','يوجد تيلومير في كل طرف من طرفَي كل كروماتيد.'], vis:'telomere', cap:'التيلوميرات في أطراف الكروموسوم، وتيلوميريز يعيد بناءها في بعض الخلايا.', q:{t:'mcq', q:'التيلوميرات هي:', opts:['تتابعات متكررة غير مشفّرة في أطراف الكروموسوم','جينات تصنع الهستونات','بروتينات على السنترومير','إنزيمات نسخ DNA'], a:0, why:'تتابعات DNA متكررة لا تحمل جينات، وظيفتها الحماية.'}},
        {title:'مشكلة نسخ الأطراف', tag:'لماذا تلزم؟', text:['عند **تضاعف DNA** لا تستطيع الإنزيمات نسخ **الجزء الأخير** من أحد طرفَي الجزيء.','فيُفقد جزء صغير من الطرف عند **كل تضاعف**.','لولا التيلوميرات لفُقد جزء من **الجينات** في كل انقسام.','التيلوميرات «قابلة للتضحية»: يُفقد منها لا من الجينات.'], vis:{kind:'steps', steps:[{icon:'🧬',t:'تضاعف DNA في المرحلة S'},{icon:'⚠️',t:'الطرف الأخير لا يُنسخ'},{icon:'✂️',t:'يُفقد جزء صغير من التيلومير'},{icon:'🛡️',t:'الجينات المهمة تبقى سليمة'}]}},
        {title:'وظائف التيلوميرات', tag:'الأدوار', text:['**حماية الجينات** من الفقد عند التضاعف.','**منع تلاصق** أطراف الكروموسومات بعضها ببعض.','**منع** الخلية من التعامل مع طرف الكروموسوم كأنه **كسر** في DNA يحتاج إلى «إصلاح».','تعمل **عدّادًا** لعدد الانقسامات التي مرت بها الخلية.'], vis:{kind:'cards', items:[{icon:'🛡️',title:'حماية الجينات',text:'ما يُفقد عند التضاعف يكون من التيلومير لا من الجينات'},{icon:'🚫',title:'منع الالتحام',text:'تمنع اندماج أطراف الكروموسومات'},{icon:'🩹',title:'ليس كسرًا',text:'تُعلِم آليات الإصلاح أن الطرف طبيعي'},{icon:'⏱️',title:'عدّاد الانقسام',text:'طولها يقلّ مع كل انقسام'}]}, q:{t:'mcq', q:'لماذا يبقى محتوى الجينات ثابتًا رغم فقد جزء من طرف DNA عند كل تضاعف؟', opts:['لأن المفقود يكون من التيلوميرات غير المشفّرة','لأن DNA لا يُفقد أبدًا','لأن الجينات في السنترومير فقط','لأن الخلية تصنع جينات جديدة'], a:0, why:'التيلومير يُفقد منه بدلًا من الجينات.'}},
        {title:'التقلّص مع الانقسامات والشيخوخة', tag:'تحليل', text:['مع كل انقسام تصبح التيلوميرات **أقصر**.','عندما تصل إلى طول حرج **تتوقف الخلية عن الانقسام** (شيخوخة خلوية).','هذا يحدّ من عدد الانقسامات الممكنة لمعظم خلايا الجسم، ويرتبط بـ **تقدّم العمر**.','وهو أيضًا **حماية**: خلية بـ DNA قديم متضرر لا تستمر في الانقسام إلى الأبد.'], vis:{kind:'bars', items:[{t:'خلية جديدة',v:100,label:'طويل'},{t:'بعد انقسامات قليلة',v:75,label:''},{t:'بعد انقسامات كثيرة',v:45,label:''},{t:'الطول الحرج',v:15,label:'توقف'}], cap:'يقلّ طول التيلومير مع تعاقب الانقسامات حتى يصل إلى الطول الحرج (رسم توضيحي).'}},
        {title:'إنزيم التيلوميريز', tag:'الحل', text:['**التيلوميريز (Telomerase)**: إنزيم يضيف التتابعات المتكررة إلى أطراف الكروموسومات فيعيد **إطالة** التيلوميرات.','نشِط في **الخلايا الجذعية** وخلايا **الخط الجنسي** المنتجة للأمشاج والخلايا **الجنينية**.','**غير نشط** في معظم خلايا الجسم البالغة، لذلك تشيخ.','نشِط أيضًا في **الخلايا السرطانية** فتنقسم بلا حدود.'], note:'💡 هدف بحثي: تثبيط التيلوميريز في الخلايا السرطانية دون التأثير في الخلايا الجذعية.', vis:{kind:'compare', cols:[{icon:'🔁',title:'تيلوميريز نشِط',items:['خلايا جذعية','خلايا الخط الجنسي (الأمشاج)','خلايا جنينية','خلايا سرطانية','انقسام غير محدود']},{icon:'⏸️',title:'تيلوميريز غير نشِط',items:['معظم خلايا الجسم البالغة','التيلوميرات تتقلّص','عدد انقسامات محدود','شيخوخة الخلية']}]}, q:{t:'mcq', q:'لماذا تستطيع الخلايا السرطانية الانقسام بلا حدود؟', opts:['لأن التيلوميريز فيها نشِط فلا تتقلّص تيلوميراتها','لأنها بلا كروموسومات','لأن سنتروميراتها أطول','لأنها لا تضاعف DNA'], a:0, why:'التيلوميريز يعيد بناء التيلوميرات فتتجاوز الخلية حدّ الانقسامات.'}},
        {title:'التيلوميرات في حياتنا', tag:'ربط بالحياة', text:['قياس طول التيلوميرات مؤشر مقترح على **العمر البيولوجي** للخلايا.','فهم التيلوميريز يفتح أبوابًا لعلاج **السرطان** (تثبيطه) ولإبطاء **شيخوخة** الأنسجة (تنشيطه بحذر).','الخلايا الجذعية في نخاع العظم تحتاج تيلوميريز نشِطًا لتستمر في إنتاج خلايا الدم طوال العمر.'], vis:{kind:'flow', steps:[{icon:'🧬',t:'تيلومير طويل'},{icon:'🔬',t:'انقسامات متكررة'},{icon:'📉',t:'تقلّص التيلومير'},{icon:'⏹️',t:'توقف الانقسام / شيخوخة'},{icon:'🔁',t:'أو: تيلوميريز يعيد الإطالة'}]}},

        {title:'ما الخلية الجذعية؟', tag:'مفهوم', text:['**الخلية الجذعية**: خلية **غير متخصصة** قادرة على الانقسام بالانقسام المتساوي **عددًا غير محدود** من المرات.','عند انقسامها قد تبقى الخلية الناتجة **جذعية** أو **تتمايز** إلى خلية متخصصة.','**التمايز (Differentiation)**: اكتساب الخلية شكلًا ووظيفة متخصصَين بتشغيل جينات معينة وإطفاء أخرى.','الخلايا المتخصصة الناضجة تفقد عادةً القدرة على الانقسام.'], vis:{kind:'flow', steps:[{icon:'🌱',t:'خلية جذعية'},{icon:'🔬',t:'انقسام متساوٍ'},{icon:'🌱',t:'خلية تبقى جذعية (تجديد ذاتي)'},{icon:'🧠',t:'خلية تتمايز (عصبية، عضلية، دم...)'}]}, q:{t:'mcq', q:'أي صفة تميّز الخلية الجذعية عن الخلية العصبية الناضجة؟', opts:['قادرة على الانقسام والتمايز','تحوي جينات أكثر','لا تحوي نواة','لا تحوي DNA'], a:0, why:'كل خلايا الجسم تحمل الجينات نفسها؛ الفرق في القدرة على الانقسام والتمايز.'}},
        {title:'التمايز: الجينات نفسها، تعبير مختلف', tag:'مفهوم', text:['كل خلايا الجسم تحمل **الجينات نفسها**.','عند التمايز تُشغَّل جينات معينة وتُطفأ أخرى فتصنع الخلية **بروتينات مختلفة**.','خلية عضلية تصنع بروتينات التقلّص، وخلية دم حمراء تمتلئ بالهيموجلوبين وتفقد نواتها.','التمايز في الغالب **لا رجعة فيه** في الجسم.'], vis:{kind:'cards', items:[{icon:'🧠',title:'خلية عصبية',text:'زوائد طويلة لنقل السيالات'},{icon:'💪',title:'خلية عضلية',text:'خيوط بروتينية للتقلّص'},{icon:'🩸',title:'خلية دم حمراء',text:'هيموجلوبين، بلا نواة'},{icon:'🛡️',title:'خلية دم بيضاء',text:'دفاع ومناعة'}]}},
        {title:'أنواع الخلايا الجذعية حسب القدرة على التمايز', tag:'التصنيف', text:['**كلية القدرة (Totipotent)**: الزيجوت وخلايا الانقسامات الأولى؛ تكوّن **أي خلية** بما فيها خلايا المشيمة.','**متعددة القدرة (Pluripotent)**: الخلايا الجذعية **الجنينية**؛ تكوّن أي خلية من خلايا الجسم لكن لا المشيمة.','**محدودة القدرة (Multipotent)**: الخلايا الجذعية **البالغة** كخلايا نخاع العظم؛ تكوّن مدى محدودًا من الخلايا (مثل خلايا الدم).'], vis:{kind:'steps', steps:[{icon:'🥚',t:'كلية القدرة: الزيجوت — كل الخلايا والمشيمة'},{icon:'👶',t:'متعددة القدرة: جذعية جنينية — كل خلايا الجسم'},{icon:'🦴',t:'محدودة القدرة: جذعية بالغة — مدى محدود (دم)'},{icon:'🧠',t:'خلية متخصصة: لا تنقسم غالبًا'}]}, cap:'تتناقص القدرة على التمايز كلما تقدّم النمو.', q:{t:'mcq', q:'خلايا جذعية في نخاع العظم تنتج خلايا الدم بأنواعها فقط. تصنيفها:', opts:['كلية القدرة','متعددة القدرة','محدودة القدرة','متخصصة نهائيًا'], a:2, why:'المدى المحدود من الخلايا الناتجة يعني محدودة القدرة (Multipotent).'}},
        {title:'مصادر الخلايا الجذعية', tag:'المصادر', text:['**الخلايا الجذعية الجنينية**: من الجنين في مراحله المبكرة؛ متعددة القدرة.','**الخلايا الجذعية البالغة**: في **نخاع العظم** (تنتج خلايا الدم)، وفي الجلد وبطانة الأمعاء والكبد.','**دم الحبل السري** عند الولادة مصدر غني بخلايا جذعية للدم.','الخلايا الجذعية البالغة موجودة في أنسجة كثيرة لتعويض الفاقد وإصلاح الإصابات.'], vis:{kind:'compare', cols:[{icon:'👶',title:'جذعية جنينية',items:['من الجنين المبكر','متعددة القدرة: أي خلية في الجسم','إمكانات علاجية واسعة','جدل أخلاقي حول استخدامها']},{icon:'🦴',title:'جذعية بالغة',items:['نخاع العظم، الجلد، الأمعاء','محدودة القدرة','تُؤخذ من المريض نفسه أحيانًا','أقل إشكالًا أخلاقيًا']}]}},
        {title:'التطبيقات الطبية', tag:'ربط بالحياة', text:['**زرع نخاع العظم** لعلاج **اللوكيميا (سرطان الدم)**: تُدمَّر الخلايا السرطانية ثم تُزرع خلايا جذعية سليمة لتعيد بناء الدم.','**إصلاح الأنسجة** المتضررة: أبحاث لاستبدال خلايا القلب بعد النوبة، والخلايا العصبية بعد إصابات الحبل الشوكي، وخلايا البنكرياس في السكري.','**البحث العلمي**: دراسة التمايز واختبار الأدوية على خلايا بشرية دون تجارب على المرضى.'], note:'💡 التبرع بالخلايا الجذعية من نخاع العظم أو الدم يمكن أن ينقذ حياة مريض لوكيميا.', vis:{kind:'cards', items:[{icon:'🩸',title:'زرع نخاع العظم',text:'علاج اللوكيميا بخلايا جذعية سليمة'},{icon:'❤️',title:'إصلاح القلب',text:'تعويض خلايا القلب المتضررة (أبحاث)'},{icon:'🧠',title:'الجهاز العصبي',text:'إصلاح إصابات الحبل الشوكي (أبحاث)'},{icon:'💊',title:'اختبار الأدوية',text:'خلايا بشرية متمايزة في المختبر'}]}, q:{t:'mcq', q:'لماذا يُعالَج مريض اللوكيميا بزرع خلايا جذعية بعد تدمير نخاعه؟', opts:['لتعيد الخلايا الجذعية بناء خلايا الدم السليمة','لتنتج خلايا عصبية','لتزيد الخلايا السرطانية','لتكوين المشيمة'], a:0, why:'الخلايا الجذعية محدودة القدرة في نخاع العظم تتمايز إلى كل خلايا الدم.'}},
        {title:'قضايا أخلاقية واجتماعية', tag:'نقاش', text:['استخدام **الخلايا الجذعية الجنينية** يثير جدلًا لأنه يتضمن التعامل مع أجنّة مبكرة.','الخلايا الجذعية **البالغة** ودم الحبل السري أقل إشكالًا أخلاقيًا لكن قدرتها على التمايز أقل.','يجب الموازنة بين **الفائدة العلاجية** والاعتبارات الأخلاقية والدينية والقانونية.'], vis:{kind:'table', head:['الاعتبار','جذعية جنينية','جذعية بالغة'], rows:[['القدرة على التمايز','متعددة القدرة','محدودة القدرة'],['المصدر','جنين مبكر','نخاع العظم، دم الحبل السري، أنسجة'],['الإشكال الأخلاقي','كبير','قليل'],['خطر الرفض المناعي','ممكن','منخفض إذا كانت من المريض نفسه']]}},
        {title:'خلاصة الدرس', tag:'خلاصة', text:['**الخلية الجذعية**: غير متخصصة، تنقسم بلا حدود، وتستطيع **التمايز**.','التصنيف: **كلية القدرة** (الزيجوت) ← **متعددة القدرة** (جنينية) ← **محدودة القدرة** (بالغة كنخاع العظم).','التطبيقات: زرع نخاع العظم للوكيميا، إصلاح الأنسجة، البحث؛ مع مراعاة الأخلاقيات.'], vis:{kind:'cycle', center:'🌱', steps:[{icon:'🌱',t:'خلية جذعية'},{icon:'🔬',t:'انقسام'},{icon:'🔁',t:'تجديد ذاتي'},{icon:'🧠',t:'تمايز'},{icon:'🩹',t:'إحلال وإصلاح'}]}}

        summary:'**الخلية الجذعية** خلية غير متخصصة تنقسم بالانقسام المتساوي بلا حدود وتستطيع **التمايز**. تصنَّف إلى **كلية القدرة** (الزيجوت)، **متعددة القدرة** (الجذعية الجنينية)، **محدودة القدرة** (البالغة مثل نخاع العظم). تُستخدم في **زرع نخاع العظم** لعلاج **اللوكيميا** وفي أبحاث إصلاح الأنسجة، مع مراعاة **الاعتبارات الأخلاقية**.'

    { id:'l4_7', num:'٤-٧', title:'السرطانات', en:'Cancers', ws:false,

        {t:'mcq', q:'في الدرس السابق عرفنا أن نقاط التفتيش تتحقق من سلامة DNA. لو تعطّلت، فما المتوقع؟', opts:['انقسام خلايا بـ DNA متضرر دون توقف','توقف النمو تمامًا','تحوّل الخلايا إلى أمشاج','زيادة طول التيلوميرات'], a:0, why:'نقاط التفتيش تمنع انقسام الخلايا المتضررة؛ تعطلها يسمح بانقسام غير منضبط.'},
        {t:'cloud', q:'اختر ما تتوقّع أن يرتبط بالسرطان:', words:[{w:'طفرة',ok:true},{w:'انقسام غير منضبط',ok:true},{w:'ورم',ok:true},{w:'التدخين',ok:true},{w:'الإشعاع',ok:true},{w:'النقائل',ok:true},{w:'التمثيل الضوئي',ok:false},{w:'الهيموجلوبين',ok:false},{w:'الانقسام الاختزالي',ok:false},{w:'السليلوز',ok:false}], why:'السرطان انقسام غير منضبط نتيجة طفرات تسببها مسرطنات كالتدخين والإشعاع، وينتج أورامًا قد تنتشر (نقائل).'},
        {t:'visual', vis:'cancer', q:'في هذا الرسم تنتقل خلايا من الورم عبر الدم إلى مكان آخر. ما اسم هذه العملية؟', opts:['النقائل (الانبثاث)','التمايز','الإخصاب','الانقسام السيتوبلازمي'], a:0, why:'انتشار الخلايا السرطانية إلى أعضاء أخرى وتكوين أورام ثانوية هو النقائل.'},
        {t:'open', q:'لماذا تتوقّع أن السرطان أكثر شيوعًا عند كبار السن منه عند الأطفال؟'}
      ],
      slides:[
        {title:'عندما تتعطل الفرامل', tag:'تمهيد', text:['دورة الخلية تُنظَّم بدقة: **جينات** تأمر بالانقسام وأخرى **تكبحه**، ونقاط تفتيش تتأكد من سلامة DNA.','**السرطان**: مجموعة أمراض تنشأ عندما تنقسم الخلايا **انقسامًا متساويًا غير منضبط**.','أهداف الدرس: كيف يبدأ السرطان، ما الفرق بين الورم الحميد والخبيث، ما المسرطنات، وكيف نقلّل الخطر.'], note:'💡 السرطان من أهم أسباب الوفاة عالميًا، وكثير من حالاته يمكن الوقاية منها بتجنّب المسرطنات.', vis:'cancer', cap:'من طفرة في خلية واحدة إلى ورم ثم انتشار.'},
        {title:'السرطان يبدأ بطفرة', tag:'السبب', text:['**الطفرة**: تغيّر عشوائي في تتابع DNA.','عندما تحدث طفرات في **الجينات المنظّمة لدورة الخلية** (التي تأمر بالانقسام أو تكبحه أو تصلح DNA) تفقد الخلية السيطرة على انقسامها.','تلزم عادةً **عدة طفرات** في الخلية نفسها قبل أن تتحول إلى خلية سرطانية.','الطفرات **تتراكم** مع الزمن، لذلك يزداد خطر السرطان مع **التقدّم في العمر**.'], vis:{kind:'flow', steps:[{icon:'⚡',t:'مسرطن يتلف DNA'},{icon:'🧬',t:'طفرة في جين منظّم للانقسام'},{icon:'➕',t:'تراكم طفرات أخرى'},{icon:'🔬',t:'انقسام غير منضبط'},{icon:'🟣',t:'ورم'}]}, q:{t:'mcq', q:'لماذا يزداد خطر السرطان مع التقدّم في العمر؟', opts:['لأن الطفرات تتراكم في الخلايا مع الزمن','لأن الخلايا تتوقف عن الانقسام','لأن التيلوميرات تطول','لأن عدد الكروموسومات يزداد'], a:0, why:'تحوّل الخلية يحتاج عدة طفرات، وتراكمها يستغرق سنوات.'}},
        {title:'صفات الخلية السرطانية', tag:'الخلية', text:['لا تستجيب للإشارات التي **توقف** الانقسام، وتتجاوز **نقاط التفتيش**.','**قليلة التمايز** أو غير متمايزة؛ لا تؤدي وظيفة النسيج.','**التيلوميريز** فيها نشِط فتنقسم بلا حدود ولا تشيخ.','قد تحوي **عددًا غير طبيعي** من الكروموسومات وشكلًا غير منتظم للنواة.'], vis:{kind:'compare', cols:[{icon:'✅',title:'خلية طبيعية',items:['تنقسم عند الحاجة فقط','تستجيب لإشارات التوقف','متمايزة وتؤدي وظيفتها','عدد محدود من الانقسامات','تبقى في مكانها']},{icon:'⚠️',title:'خلية سرطانية',items:['تنقسم باستمرار','تتجاهل إشارات التوقف','غير متمايزة','تيلوميريز نشِط: انقسام بلا حدود','قد تنفصل وتنتشر']}]}},
        {title:'الورم الحميد والورم الخبيث', tag:'الأورام', text:['**الورم (Tumour)**: كتلة من الخلايا الناتجة عن انقسام غير منضبط.','**الورم الحميد (Benign)**: ينمو ببطء، محاط بغلاف، **لا يغزو** الأنسجة المجاورة ولا ينتشر؛ يمكن استئصاله (مثل الثآليل).','**الورم الخبيث (Malignant)**: سرطاني؛ ينمو بسرعة، **يغزو** الأنسجة المجاورة، وتنفصل خلاياه لتنتشر.','الورم الخبيث يضغط على الأعضاء ويستهلك غذاءها ويعطّل وظيفتها.'], vis:{kind:'table', head:['الصفة','ورم حميد','ورم خبيث'], rows:[['سرعة النمو','بطيء','سريع'],['الحدود','واضحة، محاط بغلاف','غير واضحة، يغزو ما حوله'],['الانتشار','لا ينتشر','ينتشر (نقائل)'],['الخطورة','قليلة غالبًا، يُستأصل','مهددة للحياة'],['مثال','الثؤلول، بعض أورام الرحم الحميدة','سرطان الرئة، سرطان الثدي']]}, q:{t:'mcq', q:'أهم ما يميّز الورم الخبيث عن الحميد:', opts:['قدرته على غزو الأنسجة والانتشار','حجمه الأصغر','نموّه الأبطأ','وجود غلاف حوله'], a:0, why:'الغزو والانتشار (النقائل) صفتان مميزتان للأورام الخبيثة.'}},
        {title:'النقائل (الانبثاث)', tag:'الانتشار', text:['**النقائل (Metastasis)**: انفصال خلايا من الورم الخبيث الأولي وانتقالها عبر **الدم** أو **اللمف** إلى أعضاء أخرى.','تستقر الخلايا في العضو الجديد وتنقسم مكوّنةً **أورامًا ثانوية**.','هذا ما يجعل السرطان المتأخر صعب العلاج: الأورام تكون في أكثر من موضع.','لذلك يُعدّ **الكشف المبكر** قبل الانتشار عاملًا حاسمًا في نجاح العلاج.'], vis:{kind:'steps', steps:[{icon:'🟣',t:'ورم خبيث أولي'},{icon:'✂️',t:'انفصال خلايا من الورم'},{icon:'🩸',t:'انتقال عبر الدم أو اللمف'},{icon:'📍',t:'استقرار في عضو آخر'},{icon:'🟣',t:'أورام ثانوية'}]}},
        {title:'المسرطنات', tag:'العوامل', text:['**المسرطن (Carcinogen)**: أي عامل يزيد احتمال حدوث الطفرات ومن ثمّ السرطان.','**الإشعاع**: الإشعاع المؤيّن (الأشعة السينية وأشعة جاما) والأشعة **فوق البنفسجية** من الشمس (سرطان الجلد).','**المواد الكيميائية**: **القطران** في دخان التبغ (سرطان الرئة)، الأسبستوس، بعض الأصباغ.','**الفيروسات**: بعضها يُدخل جيناته أو يعطّل الجينات المنظّمة، مثل فيروس الورم الحليمي البشري (سرطان عنق الرحم) وفيروس التهاب الكبد B (سرطان الكبد).','**عوامل وراثية**: بعض الأشخاص يرثون طفرة تزيد قابليتهم للإصابة.'], note:'💡 التعرض لأشعة الشمس القوية دون حماية في عُمان يزيد خطر سرطان الجلد؛ القبعة والواقي من الشمس وقاية بسيطة.', vis:{kind:'cards', items:[{icon:'🚬',title:'التدخين',text:'القطران وعشرات المواد المسرطنة: سرطان الرئة والفم والحنجرة'},{icon:'☢️',title:'الإشعاع',text:'الأشعة السينية وجاما (مؤيّنة) والأشعة فوق البنفسجية تتلف DNA'},{icon:'🦠',title:'الفيروسات',text:'فيروس الورم الحليمي وفيروس التهاب الكبد B'},{icon:'🧪',title:'كيماويات',text:'الأسبستوس، بعض الأصباغ والملوّثات'},{icon:'🧬',title:'الوراثة',text:'طفرات موروثة تزيد القابلية'}]}, q:{t:'mcq', q:'القاسم المشترك بين كل المسرطنات أنها:', opts:['تزيد احتمال حدوث طفرات في DNA','تقتل الخلايا فورًا','تنقل السرطان بالعدوى','تزيد عدد الميتوكوندريا'], a:0, why:'المسرطنات تتلف DNA أو تسبب طفرات في الجينات المنظّمة للانقسام.'}},
        {title:'التدخين وسرطان الرئة', tag:'ربط بالحياة', text:['دخان التبغ يحوي **القطران** الذي يترسّب على خلايا بطانة القصبات ويحوي مواد مسرطنة.','تتراكم الطفرات في الخلايا المبطّنة حتى يظهر ورم خبيث في الرئة قد ينتشر إلى الكبد والعظام والدماغ.','كلما زاد عدد السجائر وسنوات التدخين زاد الخطر، والإقلاع يقلّله تدريجيًا.','التدخين السلبي يعرّض غير المدخنين للمسرطنات نفسها.'], vis:{kind:'bars', items:[{t:'غير مدخن',v:10,label:'منخفض'},{t:'مدخن خفيف',v:40,label:''},{t:'مدخن متوسط',v:70,label:''},{t:'مدخن شديد',v:100,label:'مرتفع'}], cap:'يزداد خطر سرطان الرئة مع زيادة التدخين (رسم توضيحي للاتجاه لا لقيم دقيقة).'}},
        {title:'الوقاية والعلاج', tag:'ربط بالحياة', text:['**الوقاية**: الامتناع عن التدخين، الحماية من الشمس، التطعيم ضد الفيروسات المسرطنة، تجنّب الكيماويات الخطرة، غذاء صحي.','**الكشف المبكر**: الفحص الدوري يكشف الورم قبل النقائل.','**العلاج**: الاستئصال الجراحي، **العلاج الإشعاعي**، **العلاج الكيميائي** الذي يستهدف الخلايا سريعة الانقسام.','أثر جانبي للعلاج الكيميائي: يصيب أيضًا خلايا الجسم سريعة الانقسام (بصيلات الشعر، بطانة الأمعاء، نخاع العظم).'], vis:{kind:'cards', items:[{icon:'🛡️',title:'الوقاية',text:'تجنّب المسرطنات والتطعيم'},{icon:'🔍',title:'الكشف المبكر',text:'قبل حدوث النقائل'},{icon:'🔪',title:'الجراحة',text:'استئصال الورم'},{icon:'☢️',title:'العلاج الإشعاعي',text:'إتلاف DNA الخلايا السرطانية'},{icon:'💊',title:'العلاج الكيميائي',text:'أدوية توقف انقسام الخلايا'}]}, q:{t:'mcq', q:'لماذا يتساقط الشعر أثناء العلاج الكيميائي؟', opts:['لأنه يستهدف الخلايا سريعة الانقسام ومنها خلايا بصيلات الشعر','لأنه يزيد نشاط التيلوميريز','لأنه يقتل الخلايا العصبية','لأنه يمنع تكوين الجدار الخلوي'], a:0, why:'العلاج الكيميائي لا يميّز بين الخلايا السرطانية والخلايا الطبيعية سريعة الانقسام.'}},
        {title:'خلاصة الوحدة', tag:'خلاصة', text:['**السرطان**: انقسام متساوٍ **غير منضبط** نتيجة **طفرات** متراكمة في الجينات المنظّمة لدورة الخلية.','**الورم الحميد** لا ينتشر؛ **الخبيث** يغزو وينتشر عبر الدم واللمف (**النقائل**).','**المسرطنات**: التدخين، الإشعاع (المؤيّن وفوق البنفسجي)، بعض الفيروسات، الكيماويات، مع عوامل وراثية.','ربط الوحدة: دورة الخلية المنظّمة ← انقسام دقيق ← خلايا متطابقة؛ وفقدان التنظيم ← سرطان.'], vis:{kind:'cycle', center:'⚠️', steps:[{icon:'🚬',t:'مسرطن'},{icon:'🧬',t:'طفرة'},{icon:'🔬',t:'انقسام غير منضبط'},{icon:'🟣',t:'ورم'},{icon:'🩸',t:'نقائل'},{icon:'🛡️',t:'وقاية وكشف مبكر'}]}}

          {q:'الطفرة هي:', opts:['تغيّر في تتابع DNA','زيادة في عدد الخلايا','انقسام السيتوبلازم','تكوّن خيوط المغزل'], a:0, why:'تعريف الطفرة.'},
          {q:'كتلة من الخلايا الناتجة عن انقسام غير منضبط تُسمّى:', opts:['ورمًا','نسيجًا','عضوًا','مشيجًا'], a:0, why:'الورم كتلة خلوية غير طبيعية.'},

          {q:'انتشار الخلايا السرطانية عبر الدم إلى أعضاء أخرى يُسمّى:', opts:['التمايز','النقائل','الإخصاب','الانقسام السيتوبلازمي'], a:1, why:'النقائل (الانبثاث) تكوين أورام ثانوية.'},

<script>
/* ===================== ENGINE CORE ===================== */
(function(){
'use strict';
const D = window.BIO_DATA;
const PRESETS = window.BIO_PRESETS || {};
const $ = (s,el=document)=>el.querySelector(s);
const $$ = (s,el=document)=>[...el.querySelectorAll(s)];
const app = $('#app');
const KEY = 'bio_'+D.grade+'_v1';
const esc = s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle = a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const AR = ['أ','ب','ج','د','هـ','و'];
const ARN = n=>String(n).replace(/\d/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]);

/* ---------- state ---------- */

function load(){ try{ return JSON.parse(localStorage.getItem(KEY))||{lessons:{},settings:{sound:true,tts:true},teams:{a:0,b:0}}; }catch(e){ return {lessons:{},settings:{sound:true,tts:true},teams:{a:0,b:0}}; } }
function save(){ try{ localStorage.setItem(KEY,JSON.stringify(S)); }catch(e){} }
function LS(id){ return S.lessons[id] || (S.lessons[id]={pre:false,slide:0,slidesDone:false,games:{},post:null}); }
const allLessons = ()=>D.units.flatMap(u=>u.lessons.map(l=>({...l,unit:u})));
function lessonPct(l){ const s=LS(l.id); let n=0; if(s.pre)n++; if(s.slidesDone)n++; if(Object.keys(s.games).length)n++; if(s.post!=null)n++; return n; }
function totalPct(){ const ls=allLessons(); const n=ls.reduce((a,l)=>a+lessonPct(l),0); return Math.round(100*n/(ls.length*4)); }
function updateProg(){ const p=totalPct(); $('#progTxt').textContent=ARN(p)+'%'; $('#progBar').style.width=p+'%'; }

/* ---------- audio ---------- */
let AC=null;
function ac(){ if(!AC){ try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){} } if(AC&&AC.state==='suspended')AC.resume(); return AC; }
function tone(f,t,dur,type='sine',vol=.18,slide=0){ const c=ac(); if(!c||!S.settings.sound)return; const o=c.createOscillator(),g=c.createGain(); o.type=type; o.frequency.setValueAtTime(f,c.currentTime+t); if(slide)o.frequency.exponentialRampToValueAtTime(slide,c.currentTime+t+dur); g.gain.setValueAtTime(0,c.currentTime+t); g.gain.linearRampToValueAtTime(vol,c.currentTime+t+.01); g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+t+dur); o.connect(g).connect(c.destination); o.start(c.currentTime+t); o.stop(c.currentTime+t+dur+.02); }
const SFX={
  click:()=>tone(600,0,.06,'triangle',.08),
  ok:()=>{tone(523,0,.12,'triangle');tone(659,.1,.12,'triangle');tone(784,.2,.2,'triangle');},
  bad:()=>{tone(220,0,.18,'sawtooth',.12,160);},
  win:()=>{[523,659,784,1047].forEach((f,i)=>tone(f,i*.12,.25,'triangle',.16));tone(1319,.5,.5,'triangle',.14);},
  flip:()=>tone(880,0,.05,'sine',.06),
  pop:()=>tone(900,0,.08,'square',.06,300),
  tick:()=>tone(1200,0,.03,'square',.03),
  whoosh:()=>tone(300,0,.25,'sine',.08,900),
  star:()=>{tone(1047,0,.1,'sine',.1);tone(1568,.08,.2,'sine',.1);}

/* TTS */
let voices=[]; function loadVoices(){ try{voices=speechSynthesis.getVoices();}catch(e){} }
if('speechSynthesis' in window){ loadVoices(); speechSynthesis.onvoiceschanged=loadVoices; }
function speak(text){ if(!S.settings.tts||!('speechSynthesis' in window))return; try{ speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(String(text).replace(/[*_#]/g,'')); u.lang='ar-SA'; const v=voices.find(v=>/^ar/i.test(v.lang)); if(v)u.voice=v; u.rate=.95; speechSynthesis.speak(u);}catch(e){} }
function stopSpeak(){ try{speechSynthesis.cancel();}catch(e){} }

/* ---------- fx ---------- */
function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('show'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),1800); }
function confetti(n=80){ const c=$('#conf'); const cols=['#0f9d8a','#ff7a59','#ffc43d','#3b82f6','#8b5cf6','#22c55e']; for(let i=0;i<n;i++){ const e=document.createElement('i'); e.style.left=Math.random()*100+'vw'; e.style.background=cols[i%cols.length]; e.style.animationDelay=(Math.random()*.6)+'s'; e.style.transform=`rotate(${Math.random()*360}deg)`; c.appendChild(e); setTimeout(()=>e.remove(),3200);} }
function fx(x,y,txt,color){ const e=document.createElement('div'); e.className='fx'; e.textContent=txt; e.style.left=x+'px'; e.style.top=y+'px'; e.style.color=color||'#22c55e'; document.body.appendChild(e); setTimeout(()=>e.remove(),1000); }
function goodAt(ev){ SFX.ok(); const p=ev&&ev.clientX?ev:{clientX:innerWidth/2,clientY:innerHeight/2}; fx(p.clientX,p.clientY,'+1 ✓','#22c55e'); }

function theme(u){ document.documentElement.style.setProperty('--u',u?u.color:'#0f9d8a'); document.documentElement.style.setProperty('--ul',u?(u.light||hexA(u.color,.16)):'#d7f3ee'); }

function stepDone(l,i){ const s=LS(l.id); return [s.pre,s.slidesDone,Object.keys(s.games).length>0,s.post!=null][i]; }
function refreshStepper(){ $$('.step').forEach((e,i)=>{e.classList.toggle('on',i===STEP);e.classList.toggle('done',stepDone(CUR,i));}); updateProg(); }
function renderStep(){ clearTimers(); refreshStepper(); const p=$('#panel'); p.style.animation='none'; p.offsetHeight; p.style.animation='pop .35s'; [renderPre,renderSlides,renderGames,renderPost][STEP](); }
function nextStepBtn(label){ return `<div class="row" style="margin-top:16px;justify-content:flex-end"><button class="btn" id="nextStep">${label||'التالي'} ▶</button></div>`; }

/* ---------- activity items (pre/post) ---------- */
function renderItems(items, container, onAllDone){
  let done=0, correct=0, total=items.filter(i=>i.t!=='open').length;
  container.innerHTML=items.map((it,i)=>itemHTML(it,i)).join('');
  items.forEach((it,i)=>{
    const el=container.children[i];
    const finish=(ok)=>{ done++; if(ok)correct++; if(done===items.length&&onAllDone)onAllDone(correct,total); };
    if(it.t==='tf'){ $$('.opt',el).forEach(o=>o.onclick=(ev)=>{ const v=o.dataset.v==='1'; const ok=v===!!it.a; $$('.opt',el).forEach(x=>x.classList.add('dis')); o.classList.add(ok?'ok':'bad'); if(!ok)$$('.opt',el).find(x=>(x.dataset.v==='1')===!!it.a).classList.add('ok'); ok?goodAt(ev):badAt(ev); el.insertAdjacentHTML('beforeend',`<div class="why ${ok?'ok':'bad'}">${ok?'✅ صحيح! ':'❌ '}${esc(it.why||'')}</div>`); finish(ok); }); }
    else if(it.t==='mcq'||it.t==='visual'){ $$('.opt',el).forEach(o=>o.onclick=(ev)=>{ const k=+o.dataset.k; const ok=k===it.a; $$('.opt',el).forEach(x=>x.classList.add('dis')); o.classList.add(ok?'ok':'bad'); if(!ok)$$('.opt',el)[it.a].classList.add('ok'); ok?goodAt(ev):badAt(ev); el.insertAdjacentHTML('beforeend',`<div class="why ${ok?'ok':'bad'}">${ok?'✅ أحسنت! ':'❌ الإجابة الصحيحة: <b>'+esc(it.opts[it.a])+'</b>. '}${esc(it.why||'')}</div>`); finish(ok); }); }
    else if(it.t==='cloud'){ const words=$$('.cw',el); const chk=$('.chk',el); words.forEach(w=>w.onclick=()=>{w.classList.toggle('sel');SFX.click();}); chk.onclick=()=>{ let ok=true; words.forEach(w=>{ const good=w.dataset.ok==='1', sel=w.classList.contains('sel'); w.classList.remove('sel'); if(good&&sel)w.classList.add('ok'); else if(!good&&sel){w.classList.add('bad');ok=false;} else if(good&&!sel){w.classList.add('miss');ok=false;} w.style.pointerEvents='none'; }); chk.disabled=true; ok?SFX.ok():SFX.bad(); el.insertAdjacentHTML('beforeend',`<div class="why ${ok?'ok':'bad'}">${ok?'✅ اختيار موفق! ':'الكلمات الخضراء صحيحة، الصفراء فاتتك، والحمراء لا علاقة لها. '}${esc(it.why||'')}</div>`); finish(ok); }; }
    else if(it.t==='open'){ const ta=$('textarea',el); const k=CUR.id+'_open_'+STEP+'_'+i; ta.value=(S.open||{})[k]||''; ta.oninput=()=>{ S.open=S.open||{}; S.open[k]=ta.value; save(); $('.saved',el).textContent=ta.value?'✓ محفوظ':''; }; if(ta.value)$('.saved',el).textContent='✓ محفوظ'; done++; }
  });
}
function itemHTML(it,i){

function renderSlides(){
  const l=CUR, p=$('#panel'), slides=l.slides||[]; let i=Math.min(LS(l.id).slide||0, slides.length-1); if(i<0)i=0;

    const s=slides[i]; seen.add(i); LS(l.id).slide=i; LS(l.id).seen=[...seen]; if(seen.size>=slides.length){LS(l.id).slidesDone=true;} save(); refreshStepper();
    p.innerHTML=`<div class="ph"><h3>📽️ العرض التفاعلي</h3><span class="sub">شريحة ${ARN(i+1)} من ${ARN(slides.length)}</span><span class="pill">${esc(s.tag||l.unit.title)}</span></div>
    <div class="slide">

        <div class="row" style="margin-top:12px"><button class="speak" id="spk">🔊 اقرأ الشريحة</button>${s.q?`<button class="speak" id="askBtn">❓ سؤال سريع</button>`:''}</div>

    </div>

      <button class="btn sec" id="prv" ${i===0?'disabled':''}>◀ السابقة</button>
      <div class="dots">${slides.map((_,k)=>`<i class="${k===i?'on':seen.has(k)?'seen':''}" data-k="${k}"></i>`).join('')}</div>
      ${i<slides.length-1?`<button class="btn" id="nxt">التالية ▶</button>`:`<button class="btn warm" id="nextStep">إلى الألعاب 🎮</button>`}
    </div>`;
    $('#spk').onclick=()=>speak(s.title+'. '+(s.text||[]).join('. ')+(s.note?'. '+s.note:''));

    if($('#prv'))$('#prv').onclick=()=>{i--;SFX.whoosh();draw();};
