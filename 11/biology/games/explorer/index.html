<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>مختبر الأحياء التفاعلي — الصف الحادي عشر</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Baloo+Bhaijaan+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4faf8;--card:#ffffff;--ink:#12342e;--muted:#5c7a74;--line:#dcebe6;
  --p:#0f9d8a;--p2:#0b7d6e;--pl:#d7f3ee;--a:#ff7a59;--al:#ffe6de;--y:#ffc43d;--yl:#fff4d6;
  --g:#22c55e;--gl:#dcfce7;--r:#ef4444;--rl:#fee2e2;--b:#3b82f6;--bl:#dbeafe;--v:#8b5cf6;--vl:#ede9fe;
  --sh:0 10px 30px rgba(15,60,50,.10);--sh2:0 4px 14px rgba(15,60,50,.08);--rad:22px;
  --u:#0f9d8a;--ul:#d7f3ee;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:'Cairo',system-ui,sans-serif;font-size:17px;line-height:1.6;min-height:100%;}
body{background:
  radial-gradient(1200px 500px at 90% -10%, #d9f4ee 0%, transparent 60%),
  radial-gradient(900px 500px at -10% 110%, #ffe9e2 0%, transparent 55%),var(--bg);}
h1,h2,h3,h4{font-family:'Baloo Bhaijaan 2','Cairo',sans-serif;margin:0;line-height:1.3}
button{font-family:inherit;font-size:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,textarea{font-family:inherit;font-size:inherit}
.hidden{display:none!important}
.wrap{max-width:1180px;margin:0 auto;padding:14px 16px 60px}
/* header */
.top{position:sticky;top:0;z-index:50;backdrop-filter:blur(10px);background:rgba(244,250,248,.85);border-bottom:1px solid var(--line)}
.top .in{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:8px 16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;flex:1;min-width:200px}
.brand .logo{width:46px;height:46px;border-radius:14px;background:linear-gradient(135deg,var(--p),#5ee0c7);display:grid;place-items:center;font-size:26px;box-shadow:var(--sh2)}
.brand h1{font-size:20px}
.brand small{display:block;color:var(--muted);font-size:13px;font-weight:600}
.tools{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.tb{width:42px;height:42px;border-radius:13px;background:#fff;border:1px solid var(--line);display:grid;place-items:center;font-size:19px;box-shadow:var(--sh2);transition:.15s}
.tb:hover{transform:translateY(-2px)}
.tb.off{opacity:.45;filter:grayscale(1)}
.prog{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:4px 12px;font-weight:700;color:var(--p2);font-size:14px}
.prog .bar{width:90px;height:8px;background:var(--pl);border-radius:6px;overflow:hidden}
.prog .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--p),#5ee0c7);width:0;transition:.6s}
/* hero */
.hero{display:grid;grid-template-columns:1.2fr .8fr;gap:18px;align-items:center;background:var(--card);border-radius:28px;box-shadow:var(--sh);padding:26px 30px;margin:16px 0 22px;overflow:hidden;position:relative}
.hero h2{font-size:34px;color:var(--p2)}
.hero p{color:var(--muted);margin:8px 0 14px;font-size:16px}
.hero .stats{display:flex;gap:10px;flex-wrap:wrap}
.stat{background:var(--pl);border-radius:14px;padding:8px 14px;font-weight:700;color:var(--p2);font-size:14px;display:flex;align-items:center;gap:6px}
.hero .art{height:220px;display:grid;place-items:center}
.hero .art svg{width:100%;height:100%}
@media(max-width:800px){.hero{grid-template-columns:1fr}.hero .art{height:150px}.hero h2{font-size:26px}}
/* units */
.units{display:grid;gap:18px}
.unit{background:var(--card);border-radius:var(--rad);box-shadow:var(--sh);overflow:hidden;border-top:8px solid var(--u)}
.unit .uh{display:flex;align-items:center;gap:14px;padding:16px 20px;cursor:pointer}
.unit .uh .ic{width:58px;height:58px;border-radius:18px;background:var(--ul);display:grid;place-items:center;font-size:30px;flex-shrink:0}
.unit .uh h3{font-size:22px;color:var(--ink)}
.unit .uh small{color:var(--muted);font-weight:600;display:block;font-size:13px}
.unit .uh .n{margin-inline-start:auto;background:var(--ul);color:var(--u);border-radius:12px;padding:4px 12px;font-weight:800;font-size:14px;white-space:nowrap}
.unit .uh .chev{font-size:22px;color:var(--muted);transition:.3s}
.unit.open .uh .chev{transform:rotate(180deg)}
.lessons{display:none;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;padding:0 20px 20px}
.unit.open .lessons{display:grid}
.les{background:#fff;border:2px solid var(--line);border-radius:18px;padding:14px;cursor:pointer;transition:.18s;position:relative;display:flex;flex-direction:column;gap:6px}
.les:hover{border-color:var(--u);transform:translateY(-3px);box-shadow:var(--sh2)}
.les .num{width:34px;height:34px;border-radius:11px;background:var(--u);color:#fff;display:grid;place-items:center;font-weight:900;font-size:14px}
.les h4{font-size:17px;line-height:1.35}
.les .en{color:var(--muted);font-size:12px;font-weight:600;font-family:'Cairo'}
.les .dots{display:flex;gap:5px;margin-top:4px}
.les .dots i{width:22px;height:8px;border-radius:5px;background:var(--line)}
.les .dots i.on{background:var(--g)}
.les.ws{background:linear-gradient(135deg,#fff,var(--yl))}
.les .tag{position:absolute;top:10px;left:10px;font-size:11px;background:var(--yl);color:#9a6a00;padding:2px 8px;border-radius:8px;font-weight:800}
/* lesson view */
.lhead{display:flex;align-items:center;gap:12px;margin:12px 0 14px;flex-wrap:wrap}
.back{background:#fff;border:1px solid var(--line);border-radius:14px;padding:8px 14px;font-weight:800;color:var(--p2);display:flex;gap:6px;align-items:center;box-shadow:var(--sh2)}
.lhead h2{font-size:24px;flex:1;min-width:200px}
.lhead h2 span{display:block;font-size:13px;color:var(--muted);font-family:'Cairo';font-weight:700}
.stepper{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px}
.step{background:#fff;border:2px solid var(--line);border-radius:16px;padding:10px 8px;text-align:center;cursor:pointer;transition:.18s;font-weight:800;font-size:14px;display:flex;flex-direction:column;align-items:center;gap:2px;position:relative}
.step .ic{font-size:24px}
.step.on{border-color:var(--u);background:var(--ul);color:var(--u)}
.step.done::after{content:'✓';position:absolute;top:6px;left:8px;width:20px;height:20px;border-radius:50%;background:var(--g);color:#fff;font-size:12px;display:grid;place-items:center}
@media(max-width:600px){.step{font-size:12px}.step .ic{font-size:20px}}
.panel{background:var(--card);border-radius:var(--rad);box-shadow:var(--sh);padding:20px;min-height:400px;position:relative;overflow:hidden}
.panel .ph{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.panel .ph h3{font-size:22px;color:var(--u)}
.panel .ph .sub{color:var(--muted);font-weight:600;font-size:14px;flex:1}
.pill{background:var(--ul);color:var(--u);border-radius:12px;padding:4px 12px;font-weight:800;font-size:13px}
.btn{background:var(--u);color:#fff;border-radius:14px;padding:10px 20px;font-weight:800;font-size:16px;box-shadow:0 6px 16px rgba(0,0,0,.12);transition:.15s;display:inline-flex;align-items:center;gap:8px}
.btn:hover{transform:translateY(-2px);filter:brightness(1.05)}
.btn:active{transform:scale(.97)}
.btn.sec{background:#fff;color:var(--u);border:2px solid var(--u);box-shadow:none}
.btn.ghost{background:var(--pl);color:var(--p2);box-shadow:none}
.btn.warm{background:var(--a)}
.btn.sm{padding:6px 14px;font-size:14px;border-radius:11px}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spacer{flex:1}
/* activity items */
.item{background:#fff;border:2px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px;animation:pop .35s ease}
.item .q{font-weight:800;font-size:18px;margin-bottom:10px;display:flex;gap:10px;align-items:flex-start}
.item .q .n{width:30px;height:30px;border-radius:10px;background:var(--ul);color:var(--u);display:grid;place-items:center;font-size:14px;flex-shrink:0}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px}
.opt{background:#fbfefd;border:2px solid var(--line);border-radius:14px;padding:10px 14px;text-align:start;font-weight:700;transition:.15s;position:relative;display:flex;gap:8px;align-items:center}
.opt:hover{border-color:var(--u);background:var(--ul)}
.opt .l{width:26px;height:26px;border-radius:8px;background:var(--line);display:grid;place-items:center;font-size:13px;flex-shrink:0}
.opt.ok{border-color:var(--g);background:var(--gl)}
.opt.ok .l{background:var(--g);color:#fff}
.opt.bad{border-color:var(--r);background:var(--rl);animation:shake .4s}
.opt.bad .l{background:var(--r);color:#fff}
.opt.dis{pointer-events:none}
.why{margin-top:10px;background:var(--yl);border-inline-start:5px solid var(--y);border-radius:10px;padding:8px 12px;font-size:15px;animation:pop .3s}
.why.ok{background:var(--gl);border-color:var(--g)}
.why.bad{background:var(--rl);border-color:var(--r)}
.tfb{display:flex;gap:10px}
.tfb .opt{justify-content:center;font-size:17px}
.cloud{display:flex;flex-wrap:wrap;gap:8px}
.cw{background:#fff;border:2px solid var(--line);border-radius:30px;padding:6px 16px;font-weight:800;transition:.15s;cursor:pointer}
.cw.sel{border-color:var(--b);background:var(--bl)}
.cw.ok{border-color:var(--g);background:var(--gl)}
.cw.bad{border-color:var(--r);background:var(--rl)}
.cw.miss{border-color:var(--y);background:var(--yl)}
textarea.open{width:100%;min-height:90px;border:2px solid var(--line);border-radius:14px;padding:10px 12px;resize:vertical;background:#fbfefd}
.saved{font-size:13px;color:var(--g);font-weight:800}
/* slides */
.slide{display:grid;grid-template-columns:1fr 1.1fr;gap:18px;align-items:stretch;min-height:380px}
@media(max-width:820px){.slide{grid-template-columns:1fr}}
.slide .txt h3{font-size:26px;color:var(--ink);margin-bottom:10px}
.slide .txt ul{margin:0;padding:0;list-style:none;display:grid;gap:8px}
.slide .txt li{background:#fbfefd;border:1.5px solid var(--line);border-radius:14px;padding:9px 14px 9px 12px;font-size:17px;position:relative;padding-inline-start:38px;animation:slideIn .4s both}
.slide .txt li::before{content:'';position:absolute;inset-inline-start:12px;top:17px;width:14px;height:14px;border-radius:50%;background:var(--u);box-shadow:0 0 0 4px var(--ul)}
.slide .txt li:nth-child(2){animation-delay:.08s}.slide .txt li:nth-child(3){animation-delay:.16s}.slide .txt li:nth-child(4){animation-delay:.24s}.slide .txt li:nth-child(5){animation-delay:.32s}.slide .txt li:nth-child(6){animation-delay:.4s}
.slide .txt li b{color:var(--u)}
.slide .note{margin-top:10px;background:var(--yl);border-radius:14px;padding:8px 12px;font-size:15px;border-inline-start:5px solid var(--y)}
.slide .note::before{content:'💡 '}
.vis{background:linear-gradient(160deg,#fbfffe,#eef8f5);border:2px solid var(--line);border-radius:20px;min-height:300px;display:flex;align-items:center;justify-content:center;padding:12px;position:relative;overflow:hidden}
.vis svg{width:100%;height:auto;max-height:420px;direction:ltr}
.vis .cap{position:absolute;bottom:8px;inset-inline-start:12px;font-size:13px;color:var(--muted);font-weight:700;background:rgba(255,255,255,.8);padding:2px 10px;border-radius:8px}
.snav{display:flex;align-items:center;gap:10px;margin-top:16px;flex-wrap:wrap}
.snav .dots{display:flex;gap:6px;flex:1;justify-content:center;flex-wrap:wrap}
.snav .dots i{width:10px;height:10px;border-radius:50%;background:var(--line);cursor:pointer;transition:.2s}
.snav .dots i.on{background:var(--u);transform:scale(1.35)}
.snav .dots i.seen{background:#9fd8cc}
.speak{background:#fff;border:2px solid var(--line);border-radius:12px;padding:6px 12px;font-weight:800;color:var(--p2);display:inline-flex;gap:6px;align-items:center}
.speak.on{background:var(--pl);border-color:var(--p)}
/* generic visuals */
.gv{width:100%;direction:rtl}
.flow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:center}
.flow .fn{background:#fff;border:2px solid var(--u);border-radius:16px;padding:10px 14px;font-weight:800;text-align:center;min-width:100px;box-shadow:var(--sh2);animation:pop .4s both;font-size:15px}
.flow .fn .fi{font-size:28px;display:block}
.flow .fa{font-size:22px;color:var(--u);font-weight:900}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}
.cmp .c{background:#fff;border-radius:16px;padding:12px;border-top:6px solid var(--u);box-shadow:var(--sh2)}
.cmp .c:last-child{border-color:var(--a)}
.cmp .c h4{font-size:17px;margin-bottom:6px;text-align:center}
.cmp .c ul{margin:0;padding-inline-start:18px;font-size:14px}
.cmp .c .ci{font-size:34px;text-align:center}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;width:100%}
.cards .cd{background:#fff;border-radius:16px;padding:12px 10px;text-align:center;box-shadow:var(--sh2);border:1.5px solid var(--line);animation:pop .4s both}
.cards .cd .ci{font-size:36px}
.cards .cd h5{margin:4px 0 2px;font-size:15px;color:var(--u)}
.cards .cd p{margin:0;font-size:13px;color:var(--muted)}
table.tbl{width:100%;border-collapse:separate;border-spacing:0;background:#fff;border-radius:14px;overflow:hidden;font-size:14px;box-shadow:var(--sh2)}
table.tbl th{background:var(--u);color:#fff;padding:8px;font-weight:800}
table.tbl td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:center}
table.tbl tr:last-child td{border-bottom:0}
table.tbl td:first-child{font-weight:800;background:var(--ul)}
.cycle{position:relative;width:min(100%,360px);aspect-ratio:1;margin:auto}
.cycle .cn{position:absolute;width:104px;padding:6px 6px;background:#fff;border:2px solid var(--u);border-radius:14px;text-align:center;font-weight:800;font-size:12.5px;transform:translate(-50%,-50%);box-shadow:var(--sh2);line-height:1.3}
.cycle .cn .ci{font-size:22px;display:block}
.cycle .ctr{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:44px;animation:spin 12s linear infinite}
.stepsv{display:grid;gap:8px;width:100%}
.stepsv .sv{display:flex;gap:10px;align-items:center;background:#fff;border-radius:14px;padding:8px 12px;box-shadow:var(--sh2);animation:slideIn .4s both}
.stepsv .sv .n{width:32px;height:32px;border-radius:50%;background:var(--u);color:#fff;display:grid;place-items:center;font-weight:900;flex-shrink:0}
.stepsv .sv .si{font-size:26px}
.stepsv .sv p{margin:0;font-size:15px}
.bars{display:flex;align-items:flex-end;gap:12px;height:220px;width:100%;padding:10px 6px 0;justify-content:center}
.bars .b{flex:1;max-width:80px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
.bars .b i{display:block;width:100%;background:linear-gradient(180deg,var(--u),#5ee0c7);border-radius:10px 10px 4px 4px;animation:grow 1s ease both;transform-origin:bottom}
.bars .b span{font-size:12px;font-weight:800;text-align:center;margin-top:4px}
.bars .b b{font-size:13px;color:var(--u)}
/* games */
.ghub{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.gc{background:#fff;border:2px solid var(--line);border-radius:18px;padding:14px;text-align:center;cursor:pointer;transition:.18s;position:relative}
.gc:hover{border-color:var(--u);transform:translateY(-3px);box-shadow:var(--sh2)}
.gc .gi{font-size:40px}
.gc h4{font-size:16px;margin-top:4px}
.gc small{color:var(--muted);font-weight:700;font-size:12px}
.gc .best{position:absolute;top:8px;left:10px;background:var(--yl);color:#9a6a00;border-radius:8px;padding:1px 8px;font-size:12px;font-weight:900}
.ghead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.ghead h3{font-size:22px;flex:1}
.score{background:var(--yl);color:#9a6a00;border-radius:12px;padding:4px 14px;font-weight:900;font-size:16px}
.timer{background:var(--bl);color:#1e40af;border-radius:12px;padding:4px 14px;font-weight:900;font-size:16px;font-variant-numeric:tabular-nums}
.timer.low{background:var(--rl);color:#b91c1c;animation:pulse .6s infinite}
.tbar{height:10px;background:var(--line);border-radius:6px;overflow:hidden;margin-bottom:12px}
.tbar i{display:block;height:100%;background:linear-gradient(90deg,var(--b),#60a5fa);transition:width 1s linear}
.instr{background:var(--pl);border-radius:14px;padding:8px 14px;font-weight:700;margin-bottom:12px;font-size:15px;color:var(--p2)}
.instr::before{content:'🎯 '}
.mcols{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mcol{display:grid;gap:8px;align-content:start}
.mc{background:#fff;border:2px solid var(--line);border-radius:14px;padding:10px 12px;font-weight:700;cursor:pointer;transition:.15s;min-height:52px;display:flex;align-items:center;gap:8px;font-size:15px}
.mc:hover{border-color:var(--u)}
.mc.sel{border-color:var(--b);background:var(--bl);transform:scale(1.03)}
.mc.ok{border-color:var(--g);background:var(--gl);pointer-events:none;opacity:.85}
.mc.bad{animation:shake .4s;border-color:var(--r)}
.mc .ci{font-size:24px}
.bins{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:12px}
.bin{border:3px dashed var(--u);border-radius:18px;padding:10px;min-height:120px;background:#fbfffe;transition:.15s}
.bin h5{margin:0 0 6px;text-align:center;font-size:16px;color:var(--u)}
.bin.over{background:var(--ul);transform:scale(1.02)}
.bin .bi{background:var(--gl);border-radius:10px;padding:4px 10px;font-size:14px;font-weight:700;margin:4px 0;animation:pop .3s}
.pool{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;min-height:60px;padding:8px;background:var(--bg);border-radius:16px}
.chip{background:#fff;border:2px solid var(--line);border-radius:30px;padding:8px 16px;font-weight:800;cursor:grab;transition:.15s;user-select:none;touch-action:none;font-size:15px}
.chip:hover{border-color:var(--u)}
.chip.sel{border-color:var(--b);background:var(--bl);transform:scale(1.06)}
.chip.bad{animation:shake .4s;border-color:var(--r);background:var(--rl)}
.chip.drag{position:fixed;z-index:999;pointer-events:none;opacity:.9;transform:scale(1.08)}
.seq{display:grid;gap:8px;margin-bottom:12px}
.seq .sq{display:flex;gap:10px;align-items:center;background:var(--gl);border-radius:14px;padding:8px 12px;font-weight:700;animation:pop .3s}
.seq .sq .n{width:30px;height:30px;border-radius:50%;background:var(--g);color:#fff;display:grid;place-items:center;font-weight:900;flex-shrink:0}
.seq .ph{border:2px dashed var(--line);border-radius:14px;padding:10px;text-align:center;color:var(--muted);font-weight:700}
.race{background:linear-gradient(180deg,#e8f6f2,#fff);border-radius:16px;padding:14px 12px 6px;margin-bottom:14px;position:relative;border:2px solid var(--line)}
.race .trk{height:14px;background:repeating-linear-gradient(90deg,#c9e6de 0 20px,#e3f2ee 20px 40px);border-radius:8px;position:relative}
.race .rn{position:absolute;top:-30px;font-size:34px;transition:right .6s cubic-bezier(.5,1.6,.4,1);transform:scaleX(-1)}
.race .fl{position:absolute;left:0;top:-32px;font-size:26px}
.qq{font-size:20px;font-weight:800;margin-bottom:12px;background:#fff;border-radius:16px;padding:14px;border:2px solid var(--line)}
.blank{display:inline-block;min-width:90px;border-bottom:3px dashed var(--u);text-align:center;color:var(--u);font-weight:900;padding:0 6px;margin:0 4px;border-radius:6px}
.blank.ok{background:var(--gl);border-color:var(--g);color:#166534;border-bottom-style:solid}
.blank.cur{background:var(--ul);animation:pulse 1s infinite}
.memg{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.mem{aspect-ratio:1;perspective:800px;cursor:pointer}
.mem .inner{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.mem.flip .inner{transform:rotateY(180deg)}
.mem .f,.mem .bk{position:absolute;inset:0;border-radius:16px;display:grid;place-items:center;padding:8px;text-align:center;font-weight:800;backface-visibility:hidden;font-size:14px}
.mem .f{background:linear-gradient(135deg,var(--u),#5ee0c7);color:#fff;font-size:34px}
.mem .bk{background:#fff;border:2px solid var(--u);transform:rotateY(180deg)}
.mem.done .bk{background:var(--gl);border-color:var(--g)}
.mem.done{pointer-events:none}
.lblwrap{display:grid;grid-template-columns:1.4fr .6fr;gap:12px}
@media(max-width:760px){.lblwrap{grid-template-columns:1fr}.mcols{grid-template-columns:1fr}}
.lblvis{position:relative;background:#fff;border-radius:16px;border:2px solid var(--line);padding:6px}
.lblvis svg{width:100%;height:auto;direction:ltr}
.hot{position:absolute;width:30px;height:30px;border-radius:50%;background:#fff;border:3px solid var(--a);transform:translate(-50%,-50%);display:grid;place-items:center;font-weight:900;font-size:13px;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.2);animation:pulse 1.4s infinite;z-index:3}
.hot.ok{background:var(--g);border-color:var(--g);color:#fff;animation:none}
.hot.bad{animation:shake .4s;border-color:var(--r)}
.hot.cur{background:var(--bl);border-color:var(--b)}
.lbls{display:grid;gap:8px;align-content:start}
.lbl{background:#fff;border:2px solid var(--line);border-radius:12px;padding:8px 12px;font-weight:800;cursor:pointer;font-size:15px}
.lbl.sel{border-color:var(--b);background:var(--bl)}
.lbl.ok{border-color:var(--g);background:var(--gl);opacity:.7;pointer-events:none}
.tfcard{background:#fff;border-radius:22px;border:2px solid var(--line);padding:30px 20px;text-align:center;font-size:22px;font-weight:800;min-height:150px;display:grid;place-items:center;animation:pop .35s;margin-bottom:14px}
.bigtf{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.bigtf button{border-radius:18px;padding:16px;font-size:22px;font-weight:900;color:#fff;box-shadow:var(--sh2)}
.bigtf .t{background:var(--g)}.bigtf .f{background:var(--r)}
.letters{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.lt{width:44px;height:48px;border-radius:12px;background:#fff;border:2px solid var(--u);display:grid;place-items:center;font-size:22px;font-weight:900;cursor:pointer;transition:.15s}
.lt:hover{background:var(--ul)}
.lt.used{opacity:.25;pointer-events:none}
.lt.ok{background:var(--gl);border-color:var(--g)}
.lt.bad{background:var(--rl);border-color:var(--r)}
.build{display:flex;gap:6px;justify-content:center;min-height:56px;margin:10px 0;flex-wrap:wrap}
.build .lt{border-style:dashed;cursor:pointer}
.build .lt.filled{border-style:solid;background:var(--ul)}
.hunt{position:relative;height:380px;background:linear-gradient(180deg,#dff5ff,#f2fcff);border-radius:20px;overflow:hidden;border:2px solid var(--line)}
.bal{position:absolute;bottom:-160px;width:150px;padding:12px 10px 20px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;text-align:center;font-weight:800;font-size:13px;cursor:pointer;animation:rise linear forwards;box-shadow:inset -8px -8px 20px rgba(0,0,0,.08);line-height:1.35;display:flex;align-items:center;justify-content:center;min-height:110px}
.bal::after{content:'';position:absolute;bottom:-26px;left:50%;width:2px;height:26px;background:#999}
.bal.pop{animation:popout .3s forwards}
.wheelwrap{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:center}
@media(max-width:760px){.wheelwrap{grid-template-columns:1fr}}
.wheel{position:relative;width:min(100%,320px);aspect-ratio:1;margin:auto}
.wheel svg{width:100%;height:100%;transition:transform 4s cubic-bezier(.17,.67,.12,1)}
.wheel .ptr{position:absolute;top:-6px;left:50%;transform:translateX(-50%);font-size:34px;z-index:2}
.secretw{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:14px 0}
.secretw .lt{border-style:dashed}
.secretw .lt.show{border-style:solid;background:var(--gl)}
.plant{display:grid;place-items:center;height:130px}
.kbd{display:flex;flex-wrap:wrap;gap:5px;justify-content:center}
.kbd .lt{width:38px;height:42px;font-size:18px}
.result{text-align:center;padding:26px 16px;animation:pop .5s}
.result .big{font-size:70px}
.result h3{font-size:28px;color:var(--u);margin:6px 0}
.result p{color:var(--muted);font-weight:700}
.stars{font-size:34px;letter-spacing:4px}
.badge{display:inline-flex;align-items:center;gap:8px;background:linear-gradient(135deg,var(--y),#ffdf8a);color:#7a4d00;border-radius:16px;padding:8px 16px;font-weight:900;margin-top:10px;box-shadow:var(--sh2)}
/* team board */
.teams{position:fixed;bottom:14px;inset-inline-start:14px;z-index:60;display:flex;gap:8px;align-items:center}
.team{background:#fff;border-radius:16px;box-shadow:var(--sh);padding:6px 10px;display:flex;align-items:center;gap:6px;font-weight:900;border:2px solid var(--line)}
.team .nm{font-size:13px;color:var(--muted)}
.team .sc{font-size:20px;min-width:28px;text-align:center}
.team button{width:28px;height:28px;border-radius:8px;background:var(--pl);font-weight:900;color:var(--p2)}
.team.a{border-color:var(--b)}.team.b{border-color:var(--a)}
.teams .tog{width:40px;height:40px;border-radius:50%;background:var(--ink);color:#fff;font-size:18px;box-shadow:var(--sh)}
/* toast, confetti */
.toast{position:fixed;top:70px;left:50%;transform:translateX(-50%) translateY(-20px);background:var(--ink);color:#fff;padding:10px 20px;border-radius:14px;font-weight:800;z-index:100;opacity:0;transition:.3s;pointer-events:none;box-shadow:var(--sh)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.conf{position:fixed;inset:0;pointer-events:none;z-index:200;overflow:hidden}
.conf i{position:absolute;top:-20px;width:10px;height:16px;border-radius:3px;animation:fall 2.4s ease-in forwards}
.fx{position:fixed;font-size:30px;pointer-events:none;z-index:150;animation:fly 1s ease-out forwards;font-weight:900}
/* keyframes */
@keyframes pop{from{transform:scale(.92);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes slideIn{from{transform:translateX(20px);opacity:0}to{transform:none;opacity:1}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(15,157,138,.35)}50%{box-shadow:0 0 0 8px rgba(15,157,138,0)}}
@keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg)}}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg);opacity:.6}}
@keyframes fly{to{transform:translateY(-80px) scale(1.4);opacity:0}}
@keyframes rise{to{bottom:110%}}
@keyframes popout{to{transform:scale(1.6);opacity:0}}
@keyframes flowdash{to{stroke-dashoffset:-40}}
@keyframes blink{50%{opacity:.25}}
@keyframes beat{0%,100%{transform:scale(1)}30%{transform:scale(1.08)}}
@keyframes drift{0%{offset-distance:0}100%{offset-distance:100%}}
@keyframes wob{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
/* svg helpers used by presets */
.sv-flow{stroke-dasharray:8 6;animation:flowdash 1s linear infinite}
.sv-flow.slow{animation-duration:2s}
.sv-blink{animation:blink 1.2s ease-in-out infinite}
.sv-beat{animation:beat 1s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.sv-wob{animation:wob 2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.sv-fade{animation:fadeUp .8s ease both}
.sv-spin{animation:spin 8s linear infinite;transform-box:fill-box;transform-origin:center}
svg text{font-family:'Cairo',sans-serif;font-weight:700}
.print-hide{}
</style>
</head>
<body>
<div class="top"><div class="in">
  <div class="brand"><div class="logo">🧬</div><div><h1 id="appTitle">مختبر الأحياء التفاعلي — الصف الحادي عشر</h1><small id="appSub">الفصل الدراسي الأول · كتاب الطالب</small></div></div>
  <div class="tools">
    <div class="prog"><span id="progTxt">0%</span><div class="bar"><i id="progBar"></i></div></div>
    <button class="tb" id="btnTeams" title="لوحة الفرق">🏆</button>
    <button class="tb" id="btnTTS" title="القراءة الصوتية">🗣️</button>
    <button class="tb" id="btnSound" title="المؤثرات الصوتية">🔊</button>
    <button class="tb" id="btnFull" title="ملء الشاشة">⛶</button>
    <button class="tb" id="btnHome" title="الرئيسية">🏠</button>
  </div>
</div></div>
<div class="wrap" id="app"></div>
<div class="teams hidden" id="teams">
  <div class="team a"><span class="nm">فريق أ</span><button data-t="a" data-d="-1">−</button><span class="sc" id="scA">0</span><button data-t="a" data-d="1">+</button></div>
  <div class="team b"><span class="nm">فريق ب</span><button data-t="b" data-d="-1">−</button><span class="sc" id="scB">0</span><button data-t="b" data-d="1">+</button></div>
  <button class="tog" id="teamsReset" title="تصفير">↺</button>
</div>
<div class="toast" id="toast"></div>
<div class="conf" id="conf"></div>
<script>
/* presets_g11_a.js — رسوم الصف الحادي عشر (أحياء) — الجزء الأول: الخلية والمجهر (14 رسمًا) */
(function(){
const H='#12342e', SUB='#5f7a75';
const txt=(x,y,t,s=13,a='middle',c=H,extra='')=>`<text x="${x}" y="${y}" font-size="${s}" font-weight="700" text-anchor="${a}" fill="${c}" ${extra}>${t}</text>`;
// نص لاتيني/أرقام باتجاه يسار-يمين ثابت (حتى لا تنعكس الصيغ داخل صفحة rtl)
const ltr=(x,y,t,s=13,c=H,extra='')=>txt(x,y,t,s,'middle',c,`direction="ltr" unicode-bidi="bidi-override" ${extra}`);
const mk=(opts)=>{const L=!opts.nolabels; const r=L?6:8; return {L,
  lab:(x,y,t,s=13,c=H,extra='')=>L?txt(x,y,t,s,'middle',c,extra):'',
  hot:(id,x,y)=>`<circle data-hot="${id}" cx="${x}" cy="${y}" r="${r}" fill="#fff" stroke="#ff7a59" stroke-width="3"/>`,
  lead:(x1,y1,x2,y2)=>L?`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#6f8c86" stroke-width="1.3" stroke-dasharray="3 3"/>`:''};};
const mover=(path,fill,dur,r=5,begin=0,extra='',inner='')=>`<circle r="${r}" fill="${fill}" stroke="rgba(0,0,0,.25)" stroke-width="1" ${extra}><animateMotion dur="${dur}s" begin="${begin}s" repeatCount="indefinite" path="${path}"/>${inner}</circle>`;
const svg=(inner,h=380)=>`<svg viewBox="0 0 600 ${h}" xmlns="http://www.w3.org/2000/svg">${inner}</svg>`;
const flow=(d,c='#fff',w=3,slow=false)=>`<path d="${d}" fill="none" stroke="${c}" stroke-width="${w}" stroke-linecap="round" stroke-dasharray="8 6" class="sv-flow${slow?' slow':''}" opacity=".85"/>`;
const arrow=(x,y,angle,c=H,s=1)=>`<polygon points="${-8*s},${-6*s} ${8*s},0 ${-8*s},${6*s}" fill="${c}" transform="translate(${x} ${y}) rotate(${angle})"/>`;
const dots=(pts,r=2.6,c='#5b3a8a')=>pts.map(([x,y])=>`<circle cx="${x}" cy="${y}" r="${r}" fill="${c}"/>`).join('');
// ميتوكوندريون صغير (للاستخدام داخل الخلايا)
const miniMito=(x,y,rot,rx=30,ry=14)=>`<g transform="translate(${x} ${y}) rotate(${rot})"><ellipse rx="${rx}" ry="${ry}" fill="#f9c784" stroke="#d35400" stroke-width="3"/><path d="M${-rx+8} ${-ry+4} v${ry*2-8} M${-rx/2} ${-ry+3} v${ry*2-6} M0 ${-ry+3} v${ry*2-6} M${rx/2} ${-ry+3} v${ry*2-6} M${rx-8} ${-ry+4} v${ry*2-8}" stroke="#d35400" stroke-width="2" fill="none" stroke-linecap="round" opacity=".8"/></g>`;
// بلاستيدة خضراء صغيرة
const miniChloro=(x,y,rot,rx=26,ry=13,starch=false)=>`<g transform="translate(${x} ${y}) rotate(${rot})"><ellipse rx="${rx}" ry="${ry}" fill="#7ccb62" stroke="#2f7d3a" stroke-width="3"/>${[-rx*0.55,-rx*0.15,rx*0.25,rx*0.6].map(dx=>`<rect x="${dx-5}" y="${-ry*0.55}" width="10" height="${ry*1.1}" rx="2" fill="#2f7d3a" opacity=".85"/>`).join('')}${starch?`<ellipse cx="${rx*0.45}" cy="0" rx="7" ry="5" fill="#fff" stroke="#9aa" stroke-width="1.5"/>`:''}</g>`;
const P={};

/* ---------- 1. الخلية الحيوانية ---------- */
P.animal_cell=(opts={})=>{const {lab,hot,lead}=mk(opts);
const NX=320,NY=200,NR=58;
const rerArcs=[70,82,94,106].map(r=>{const a1=-52*Math.PI/180,a2=52*Math.PI/180;const x1=NX+r*Math.cos(a1),y1=NY+r*Math.sin(a1),x2=NX+r*Math.cos(a2),y2=NY+r*Math.sin(a2);
 return `<path d="M${x1.toFixed(1)} ${y1.toFixed(1)} A${r} ${r} 0 0 1 ${x2.toFixed(1)} ${y2.toFixed(1)}" fill="none" stroke="#7a9bd9" stroke-width="5" stroke-linecap="round"/>`+
 [-40,-25,-10,5,20,35].map(deg=>{const a=deg*Math.PI/180;return `<circle cx="${(NX+(r+4.5)*Math.cos(a)).toFixed(1)}" cy="${(NY+(r+4.5)*Math.sin(a)).toFixed(1)}" r="2.6" fill="#5b3a8a"/>`;}).join('');}).join('');
const pores=[0,45,90,135,180,225,270,315].map(deg=>{const a=deg*Math.PI/180;return `<circle cx="${(NX+(NR-3)*Math.cos(a)).toFixed(1)}" cy="${(NY+(NR-3)*Math.sin(a)).toFixed(1)}" r="3.2" fill="#fbe9ea"/>`;}).join('');
const golgi=[0,1,2,3].map(i=>`<path d="M${296-i*2} ${305+i*9} Q${330} ${296+i*9} ${364+i*2} ${305+i*9}" fill="none" stroke="#e7a33b" stroke-width="7" stroke-linecap="round"/>`).join('');
return svg(`
<defs>
 <radialGradient id="animal_cell_cy" cx=".5" cy=".5" r=".7"><stop offset="0" stop-color="#fff9ea"/><stop offset="1" stop-color="#fbe6c1"/></radialGradient>
 <radialGradient id="animal_cell_nu" cx=".4" cy=".4" r=".7"><stop offset="0" stop-color="#f8cfd3"/><stop offset="1" stop-color="#e59aa3"/></radialGradient>
 <style>@keyframes animal_cell_bud{0%{transform:translate(0,0);opacity:0}20%{opacity:1}100%{transform:translate(28px,26px);opacity:0}} .animal_cell_v{animation:animal_cell_bud 3s ease-in-out infinite}</style>
</defs>
${txt(300,20,'الخلية الحيوانية — كما تُرى بالمجهر الإلكتروني',15)}
<!-- الغشاء والسيتوبلازم -->
<path d="M300 70 C400 62 470 110 478 190 C486 280 430 360 320 370 C210 380 120 330 118 230 C116 140 200 78 300 70 Z" fill="url(#animal_cell_cy)" stroke="#c2703f" stroke-width="5"/>
<!-- الشبكة الإندوبلازمية الملساء -->
<g fill="none" stroke="#7ccbc0" stroke-width="5" stroke-linecap="round">
 <path d="M150 232 q20 -14 40 0 t40 0"/><path d="M150 252 q20 14 40 0 t40 0"/><path d="M158 272 q18 -12 36 0 t36 0"/><path d="M226 232 q14 10 0 20 q-14 10 0 20"/>
</g>
<!-- الشبكة الإندوبلازمية الخشنة -->
${rerArcs}
<!-- رايبوسومات حرة -->
${dots([[205,312],[218,322],[232,316],[212,335],[228,340],[244,330],[150,315],[262,120],[282,300],[430,232],[455,250],[440,262]])}
<!-- ميتوكوندريا -->
${miniMito(175,135,-25)}${miniMito(412,340,20,26,12)}
<!-- الليسوسومات -->
<g class="sv-beat"><circle cx="440" cy="290" r="12" fill="#c98fdc" stroke="#7d3c98" stroke-width="3"/>${dots([[436,287],[444,292],[438,295]],1.8,'#5b2c6f')}</g>
<circle cx="250" cy="355" r="8" fill="#c98fdc" stroke="#7d3c98" stroke-width="2.5"/>
<!-- المريكزان -->
<g transform="translate(420 120)"><rect x="-14" y="-5" width="28" height="10" rx="2" fill="#5dade2" stroke="#1f618d" stroke-width="2.5"/><rect x="-5" y="-20" width="10" height="28" rx="2" fill="#5dade2" stroke="#1f618d" stroke-width="2.5" transform="translate(16 10)"/></g>
<!-- جهاز جولجي وحويصلاته -->
${golgi}
<circle cx="372" cy="298" r="5" fill="#f5cd79" stroke="#e7a33b" stroke-width="2" class="animal_cell_v"/>
<circle cx="292" cy="300" r="4.5" fill="#f5cd79" stroke="#e7a33b" stroke-width="2"/>
<!-- النواة -->
<circle cx="${NX}" cy="${NY}" r="${NR}" fill="url(#animal_cell_nu)" stroke="#a93248" stroke-width="4"/>
<circle cx="${NX}" cy="${NY}" r="${NR-6}" fill="none" stroke="#a93248" stroke-width="2.5"/>
${pores}
<path d="M300 180 q10 8 18 -2 t14 8 M290 222 q12 -6 22 4 t16 -6 M335 232 q8 6 16 0" fill="none" stroke="#8e2a3f" stroke-width="2" stroke-linecap="round" opacity=".7"/>
<circle cx="308" cy="190" r="14" fill="#8e2a3f" stroke="#5e1a2a" stroke-width="2"/>
<!-- التسميات -->
${hot('membrane',122,205)}${lead(122,205,106,196)}${lab(58,190,'غشاء سطح الخلية',12)}
${hot('nucleus',338,222)}${lab(340,246,'النواة',12)}
${hot('nucleolus',308,190)}${lead(308,190,262,112)}${lab(262,104,'النوية',12)}
${hot('envelope',320,142)}${lead(320,142,320,60)}${lab(320,52,'الغلاف النووي',12)}
${hot('mito',175,135)}${lead(175,135,125,95)}${lab(80,88,'ميتوكوندريون',12)}
${hot('rer',405,200)}${lead(405,200,492,200)}${lab(545,204,'ش.إ. خشنة',12)}
${hot('ser',190,252)}${lead(190,252,102,262)}${lab(58,266,'ش.إ. ملساء',12)}
${hot('ribo',220,325)}${lead(220,325,112,340)}${lab(60,346,'رايبوسومات حرة',12)}
${hot('golgi',330,320)}${lead(330,334,330,388)}${lab(330,402,'جهاز جولجي',12)}
${hot('lyso',440,290)}${lead(440,290,506,300)}${lab(545,304,'ليسوسوم',12)}
${hot('centriole',420,120)}${lead(420,120,490,80)}${lab(520,74,'المريكز',12)}
${hot('cyto',255,275)}${lab(250,300,'السيتوبلازم',12)}
${txt(520,395,'نواة حقيقية + عضيات غشائية',11,'middle',SUB)}
`,420);};

/* ---------- 2. الخلية النباتية ---------- */
P.plant_cell=(opts={})=>{const {lab,hot,lead}=mk(opts);
const streamPath="M300 128 C395 128 420 170 420 208 C420 258 380 290 300 290 C220 290 180 258 180 208 C180 170 205 128 300 128 Z";
return svg(`
<defs>
 <linearGradient id="plant_cell_vac" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e3f3ff"/><stop offset="1" stop-color="#bcdcf7"/></linearGradient>
 <style>@keyframes plant_cell_sw{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}} .plant_cell_c{animation:plant_cell_sw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}</style>
</defs>
${txt(300,18,'الخلية النباتية',15)}
<!-- خلية مجاورة -->
<rect x="38" y="72" width="76" height="300" rx="12" fill="#eef7e6" stroke="#b7a35a" stroke-width="10"/>
<rect x="46" y="80" width="60" height="284" rx="8" fill="none" stroke="#2e7d5b" stroke-width="2.5"/>
${txt(76,392,'خلية مجاورة',11,'middle',SUB)}
<!-- الجدار والغشاء -->
<rect x="122" y="72" width="348" height="300" rx="18" fill="#eef7e6" stroke="#b7a35a" stroke-width="12"/>
<rect x="132" y="82" width="328" height="280" rx="12" fill="none" stroke="#2e7d5b" stroke-width="3"/>
<!-- بلازموديزماتا: قنوات عبر الجدار -->
${[160,240].map(y=>`<rect x="100" y="${y-5}" width="38" height="10" fill="#eef7e6"/><line x1="100" y1="${y-5}" x2="138" y2="${y-5}" stroke="#2e7d5b" stroke-width="2.5"/><line x1="100" y1="${y+5}" x2="138" y2="${y+5}" stroke="#2e7d5b" stroke-width="2.5"/><line x1="102" y1="${y}" x2="136" y2="${y}" stroke="#7fb3d5" stroke-width="2" stroke-dasharray="4 3" class="sv-flow slow"/>`).join('')}
<!-- الفجوة والتونوبلاست -->
<path d="M300 110 C410 110 440 160 440 205 C440 262 392 300 300 300 C208 300 160 262 160 205 C160 160 190 110 300 110 Z" fill="url(#plant_cell_vac)" stroke="#3f86c9" stroke-width="3.5"/>
<!-- تيار سيتوبلازمي -->
${[0,-1.6,-3.2,-4.8].map(b=>mover(streamPath,'#79b8f0',7,3,b))}
<!-- النواة -->
<circle cx="192" cy="312" r="32" fill="#f3b8bf" stroke="#a93248" stroke-width="3.5"/>
<circle cx="192" cy="312" r="26" fill="none" stroke="#a93248" stroke-width="1.8"/>
<circle cx="186" cy="306" r="9" fill="#8e2a3f"/>

 for(let i=0;i<=50;i+=5){const h=i%25===0?14:7; s+=`<line x1="${(x0+i*U).toFixed(1)}" y1="${y}" x2="${(x0+i*U).toFixed(1)}" y2="${y+h}" stroke="#1b4f72" stroke-width="${i%25===0?2.5:1.3}"/>`;}
 s+=ltr(x0,y+30,'0',10,'#1b4f72')+ltr(x0+25*U,y+30,'0.1 mm',10,'#1b4f72')+ltr(x0+50*U,y+30,'0.2 mm',10,'#1b4f72'); return s;};

P.cell_cycle=(opts={})=>{const {lab,hot,lead}=mk(opts);

const pol=(r,a)=>[CX+r*Math.cos((a-90)*Math.PI/180),CY+r*Math.sin((a-90)*Math.PI/180)];
const sector=(a0,a1,fill,stroke)=>{const [x0,y0]=pol(R1,a0),[x1,y1]=pol(R1,a1),[x2,y2]=pol(R0,a1),[x3,y3]=pol(R0,a0);const big=(a1-a0)>180?1:0;
 return `<path d="M${x0} ${y0} A${R1} ${R1} 0 ${big} 1 ${x1} ${y1} L${x2} ${y2} A${R0} ${R0} 0 ${big} 0 ${x3} ${y3} Z" fill="${fill}" stroke="${stroke}" stroke-width="3" stroke-linejoin="round"/>`;};

const g1=mid(0,150), sm=mid(150,255), g2=mid(255,310), mm=mid(310,348), ck=mid(348,360,R1+22);
const [ax,ay]=pol(R1+18,0),[bx,by]=pol(R1+18,310);
const circ=`M${pol(98,0)[0]} ${pol(98,0)[1]} A98 98 0 1 1 ${pol(98,180)[0]} ${pol(98,180)[1]} A98 98 0 1 1 ${pol(98,0)[0]} ${pol(98,0)[1]}`;

/* ---------- 10. الانقسام المتساوي ---------- */
P.mitosis=(opts={})=>{const {lab,hot,lead}=mk(opts);
const BLUE='#2980b9',RED='#e74c3c',SPI='#7d9c96',CEN='#17a589';
const chromo=(x,y,c,a=0,l=13)=>`<g transform="translate(${x} ${y}) rotate(${a})"><line x1="${-l}" y1="${-l}" x2="${l}" y2="${l}" stroke="${c}" stroke-width="5" stroke-linecap="round"/><line x1="${l}" y1="${-l}" x2="${-l}" y2="${l}" stroke="${c}" stroke-width="5" stroke-linecap="round"/><circle r="3" fill="#12342e"/></g>`;
const chromatid=(x,y,c,dir)=>`<path d="M${x-dir*3} ${y-11} Q${x+dir*9} ${y} ${x-dir*3} ${y+11}" fill="none" stroke="${c}" stroke-width="5" stroke-linecap="round"/><circle cx="${x+dir*4}" cy="${y}" r="2.5" fill="#12342e"/>`;
const centriole=(x,y)=>`<g transform="translate(${x} ${y})"><rect x="-7" y="-3" width="14" height="6" rx="2" fill="${CEN}"/><rect x="-3" y="-11" width="6" height="14" rx="2" fill="${CEN}" transform="translate(0 4) rotate(90)"/></g>`;
const membrane=(d)=>`<path d="${d}" fill="#fff7e6" stroke="#c9a54b" stroke-width="3.5"/>`;
const ell=`M-100 0 A100 62 0 1 1 100 0 A100 62 0 1 1 -100 0 Z`;
const stage=(n,sc)=>{let g='';
 if(n===1){ g+=membrane(ell);
  g+=`<circle r="44" fill="#f3ebff" stroke="#b39ddb" stroke-width="2.5" stroke-dasharray="6 4"><animate attributeName="opacity" values="1;1;.2;.2;1" keyTimes="0;.4;.7;.9;1" dur="5s" repeatCount="indefinite"/></circle>`;
  g+=chromo(-16,-14,BLUE,20)+chromo(14,-8,RED,-30)+chromo(-8,16,RED,70)+chromo(18,18,BLUE,10);
  g+=[[-85,0,1],[85,0,-1]].map(([px,py,d])=>`${[-28,-14,0,14,28].map(a=>`<line x1="${px}" y1="${py}" x2="${px+d*38*Math.cos(a*Math.PI/180)}" y2="${py+38*Math.sin(a*Math.PI/180)}" stroke="${SPI}" stroke-width="1.5" opacity=".8"/>`).join('')}${centriole(px,py)}`).join('');
 }
 if(n===2){ g+=membrane(ell);
  g+=`<line x1="0" y1="-58" x2="0" y2="58" stroke="#b39ddb" stroke-width="1.5" stroke-dasharray="4 4"/>`;
  g+=[-33,-11,11,33].map(y=>`<line x1="-85" y1="0" x2="-4" y2="${y}" stroke="${SPI}" stroke-width="1.6"/><line x1="85" y1="0" x2="4" y2="${y}" stroke="${SPI}" stroke-width="1.6"/>`).join('');
  g+=chromo(0,-33,BLUE,0,10)+chromo(0,-11,RED,0,10)+chromo(0,11,BLUE,0,10)+chromo(0,33,RED,0,10);
  g+=centriole(-85,0)+centriole(85,0);
 }
 if(n===3){ g+=membrane(`M-108 0 A108 58 0 1 1 108 0 A108 58 0 1 1 -108 0 Z`);
  g+=[-33,-11,11,33].map((y,i)=>{const c=i%2?RED:BLUE;return `<line x1="-92" y1="0" y2="${y}" stroke="${SPI}" stroke-width="1.5"><animate attributeName="x2" values="-24;-58;-58;-24" keyTimes="0;.5;.85;1" dur="4s" repeatCount="indefinite"/></line><line x1="92" y1="0" y2="${y}" stroke="${SPI}" stroke-width="1.5"><animate attributeName="x2" values="24;58;58;24" keyTimes="0;.5;.85;1" dur="4s" repeatCount="indefinite"/></line><g><animateTransform attributeName="transform" type="translate" values="-18 0;-52 0;-52 0;-18 0" keyTimes="0;.5;.85;1" dur="4s" repeatCount="indefinite"/>${chromatid(0,y,c,-1)}</g><g><animateTransform attributeName="transform" type="translate" values="18 0;52 0;52 0;18 0" keyTimes="0;.5;.85;1" dur="4s" repeatCount="indefinite"/>${chromatid(0,y,c,1)}</g>`;}).join('');
  g+=centriole(-92,0)+centriole(92,0);
 }
 if(n===4){ g+=`<path fill="#fff7e6" stroke="#c9a54b" stroke-width="3.5"><animate attributeName="d" values="M-110 0 A110 56 0 0 1 0 -56 Q0 -30 0 -30 Q0 -56 0 -56 A110 56 0 0 1 110 0 A110 56 0 0 1 0 56 Q0 30 0 30 Q0 56 0 56 A110 56 0 0 1 -110 0 Z;M-110 0 A110 56 0 0 1 -30 -52 Q0 -12 30 -52 A110 56 0 0 1 110 0 A110 56 0 0 1 30 52 Q0 12 -30 52 A110 56 0 0 1 -110 0 Z;M-110 0 A110 56 0 0 1 -30 -52 Q0 -12 30 -52 A110 56 0 0 1 110 0 A110 56 0 0 1 30 52 Q0 12 -30 52 A110 56 0 0 1 -110 0 Z;M-110 0 A110 56 0 0 1 0 -56 Q0 -30 0 -30 Q0 -56 0 -56 A110 56 0 0 1 110 0 A110 56 0 0 1 0 56 Q0 30 0 30 Q0 56 0 56 A110 56 0 0 1 -110 0 Z" keyTimes="0;.45;.85;1" dur="5s" repeatCount="indefinite"/></path>`;
  g+=[-58,58].map(px=>`<circle cx="${px}" cy="0" r="34" fill="#f3ebff" stroke="#b39ddb" stroke-width="2.5" stroke-dasharray="6 4"/>${[[-14,-12,BLUE],[10,-14,RED],[-10,12,BLUE],[12,10,RED]].map(([dx,dy,c])=>`<path d="M${px+dx-9} ${dy-6} q6 -6 9 0 t9 0 q3 6 -3 10 t-9 2" fill="none" stroke="${c}" stroke-width="3.5" stroke-linecap="round"/>`).join('')}`).join('');
  g+=centriole(-100,0)+centriole(100,0);
  g+=`<g class="sv-blink">${arrow(0,-70,90,'#c0392b',.8)}${arrow(0,70,-90,'#c0392b',.8)}</g>`;
 }
 return g;};
const names=['الطور التمهيدي','الطور الاستوائي','الطور الانفصالي','الطور النهائي'];
const en=['Prophase','Metaphase','Anaphase','Telophase'];
const desc=[

const st=+opts.stage;
if(st>=1&&st<=4){
 const hotsAll=['prophase','metaphase','anaphase','telophase'];

    { id:'l1_1', num:'١-١', title:'الخلايا هي الوحدات الأساسية للحياة', en:'Cells are the basic units of life', ws:false,
      preIntro:'قبل أن نغوص في عالم الخلية، لنستدعِ ما نعرفه عنها من الصفوف السابقة ونطرح توقّعاتنا.',
      pre:[
        {t:'tf', q:'جميع الكائنات الحية، من البكتيريا إلى النخلة والإنسان، تتكوّن من خلايا.', a:true, why:'هذا هو المبدأ الأول في نظرية الخلية: الكائنات الحية كلّها مكوّنة من خلية واحدة أو أكثر.'},
        {t:'mcq', q:'ما أول من شاهد الخلايا ووصفها ووضع لها اسم «cells» عام 1665؟', opts:['روبرت هوك','أنطوني فان ليفنهوك','لويس باستور','تشارلز داروين'], a:0, why:'روبرت هوك فحص شرائح من الفلّين بمجهر بسيط ورأى حجيرات صغيرة سمّاها «cells» أي حجرات.'},
        {t:'cloud', q:'اختر التراكيب التي توجد في كل خلية حية تقريبًا:', words:[{w:'الغشاء الخلوي',ok:true},{w:'السيتوبلازم',ok:true},{w:'DNA',ok:true},{w:'الرايبوسومات',ok:true},{w:'البلاستيدة الخضراء',ok:false},{w:'الجدار الخلوي',ok:false},{w:'الأهداب',ok:false},{w:'الفجوة الكبيرة',ok:false},{w:'الميتوكوندريا',ok:false}], why:'الغشاء والسيتوبلازم وDNA والرايبوسومات مشتركة بين كل الخلايا، أمّا البقية فتوجد في أنواع معيّنة فقط (الميتوكوندريا في حقيقية النواة وحدها).'},
        {t:'visual', vis:{kind:'flow', steps:[{icon:'🔬',t:'خلية'},{icon:'🧩',t:'نسيج'},{icon:'🫀',t:'عضو'},{icon:'🏃',t:'كائن حي'}]}, q:'ما المستوى الذي يتكوّن من مجموعة خلايا متشابهة تؤدّي وظيفة واحدة؟', opts:['العضو','النسيج','الجهاز','الكائن الحي'], a:1, why:'النسيج مجموعة خلايا متخصّصة متشابهة تعمل معًا، والعضو يتكوّن من أنسجة مختلفة.'},
        {t:'open', q:'لماذا تعتقد أن علماء الأحياء لم يعرفوا الخلايا قبل القرن السابع عشر؟ وما الذي تغيّر بعده؟'}
      ],
      slides:[
        {title:'لماذا نبدأ بالخلية؟', tag:'تمهيد', text:['هل تعلم أن جسمك يحوي **نحو عشرات التريليونات** من الخلايا، وأن نخلة عُمانية تنمو من خلية واحدة مخصّبة؟','الخلية هي **أصغر وحدة قادرة على الحياة** بمفردها: تتغذّى وتتنفّس وتنمو وتتكاثر.','في هذا الدرس: نظرية الخلية، ولماذا نحتاج المجهر لدراستها، وما المشترك بين الخلايا كلّها.'], note:'💡 كلمة «خلية» بالعربية توحي بالحجرة الصغيرة، تمامًا كما قصد هوك بكلمة cell.', vis:{kind:'cards', items:[{icon:'🎯',title:'الهدف 1',text:'أن أذكر بنود نظرية الخلية.'},{icon:'🎯',title:'الهدف 2',text:'أن أفسّر حاجتنا إلى المجهر لدراسة الخلايا.'},{icon:'🎯',title:'الهدف 3',text:'أن أحدّد التراكيب المشتركة بين كل الخلايا.'},{icon:'🎯',title:'الهدف 4',text:'أن أميّز بين الخلايا بدائية النواة وحقيقية النواة تمهيدًا.'}]}},
        {title:'من الفلّين إلى نظرية الخلية', tag:'تاريخ', text:['عام **1665** فحص **روبرت هوك** شريحة فلّين بمجهر بسيط فرأى حجيرات صغيرة سمّاها **cells**.','بعده بقرنَين تراكمت المشاهدات على النبات والحيوان فظهرت **نظرية الخلية** في القرن التاسع عشر.','تطوّر المجاهر كان هو المفتاح: كل تحسّن في المجهر كشف تفاصيل جديدة.'], vis:{kind:'steps', steps:[{icon:'🔍',t:'1665: هوك يشاهد خلايا الفلّين ويسمّيها cells'},{icon:'🦠',t:'أواخر القرن 17: ليفنهوك يرصد كائنات مجهرية حية'},{icon:'⚫',t:'1831: روبرت براون يصف النواة في خلايا النبات'},{icon:'📜',t:'القرن 19: صياغة نظرية الخلية للنبات والحيوان'},{icon:'⚡',t:'القرن 20: المجهر الإلكتروني يكشف العضيات الدقيقة'}]}, cap:'كل قفزة في علم الخلية سبقتها قفزة في أدوات الرؤية.', q:{t:'mcq', q:'ما الذي جعل اكتشاف الخلايا ممكنًا في القرن السابع عشر؟', opts:['اختراع المجهر','اكتشاف DNA','اختراع الكهرباء','تطوّر الكيمياء'], a:0, why:'الخلايا أصغر من أن تراها العين المجرّدة، فلم يكن اكتشافها ممكنًا قبل المجهر.'}},
        {title:'نظرية الخلية', tag:'المفهوم الأساسي', text:['**كل الكائنات الحية** تتكوّن من خلية واحدة أو أكثر.','**الخلية** هي الوحدة الأساسية للبناء والوظيفة في الكائن الحي.','**الخلايا الجديدة** تنشأ فقط من انقسام خلايا موجودة سابقًا.','وكل خلية تحمل المادة الوراثية **DNA** التي تنتقل إلى الخلايا البنات.'], vis:{kind:'cards', items:[{icon:'🌿',title:'كل الأحياء من خلايا',text:'من البكتيريا وحيدة الخلية إلى الحوت الأزرق.'},{icon:'🧱',title:'الخلية وحدة الحياة',text:'أصغر جزء يُظهر خصائص الحياة كلّها.'},{icon:'➗',title:'الخلايا من خلايا',text:'لا تنشأ خلية من العدم، بل بانقسام خلية سابقة.'},{icon:'🧬',title:'الوراثة في DNA',text:'المعلومات الوراثية تنتقل عند الانقسام.'}]}},
        {title:'لماذا لا نرى الخلايا بأعيننا؟', tag:'الحجم', text:['معظم الخلايا قطرها بين **10 و 100 ميكرومتر (µm)**، والميكرومتر جزء من ألف من الملّيمتر.','العين البشرية لا تميّز تفاصيل أصغر من نحو **0.1 mm** (100 µm)، لذا تبدو معظم الخلايا نقاطًا غير مميّزة أو لا تُرى.','لذلك ارتبط علم الخلية دائمًا بتطوّر **المجاهر** وقوّتها على التكبير والتمييز.'], note:'💡 1 mm = 1000 µm، و 1 µm = 1000 nm. سنتعمّق في الوحدات في الدرس القادم.', vis:'units_scale', q:{t:'mcq', q:'خلية نباتية نموذجية عرضها 40 µm؛ كم ملّيمترًا يعادل ذلك؟', opts:['0.4 mm','0.04 mm','4 mm','0.004 mm'], a:1, why:'40 µm ÷ 1000 = 0.04 mm، وهو أصغر من حدّ تمييز العين تقريبًا.'}},
        {title:'ما المشترك بين كل الخلايا؟', tag:'تراكيب مشتركة', text:['**غشاء سطح الخلية** (الغشاء الخلوي): يحيط بالخلية ويتحكّم في ما يدخلها ويخرج منها.','**السيتوبلازم**: وسط مائي تحدث فيه التفاعلات الكيميائية.','**DNA**: المادة الوراثية التي تحمل التعليمات.','**الرايبوسومات**: مواقع بناء البروتين.'], vis:{kind:'cycle', center:'🔬', steps:[{icon:'🫧',t:'غشاء سطح الخلية'},{icon:'💧',t:'السيتوبلازم'},{icon:'🧬',t:'DNA'},{icon:'⚙️',t:'الرايبوسومات'}]}, cap:'أربعة تراكيب لا تخلو منها خلية حية.'},
        {title:'نوعان كبيران من الخلايا', tag:'تصنيف', text:['**الخلايا حقيقية النواة** (Eukaryotic): لها نواة محاطة بغلاف نووي وعضيات غشائية؛ مثل خلايا النبات والحيوان والفطريات.','**الخلايا بدائية النواة** (Prokaryotic): لا نواة حقيقية، DNA حرّ في السيتوبلازم، ولا عضيات غشائية؛ مثل البكتيريا.','بدائية النواة أصغر بكثير (1–5 µm) وأقدم ظهورًا على الأرض.'], vis:'pro_vs_eu', q:{t:'mcq', q:'أيّ ممّا يأتي خلية بدائية النواة؟', opts:['خلية كبد','خلية بكتيرية','خلية ورقة نبات','خلية خميرة'], a:1, why:'البكتيريا بدائية النواة؛ أمّا الكبد والورقة والخميرة (فطر) فكلّها حقيقية النواة.'}},
        {title:'التركيب يخدم الوظيفة', tag:'مبدأ حاكم', text:['الخلايا في الكائن العديد الخلايا **متخصّصة**: شكل كل خلية وعضياتها تناسب عملها.','خلية عضلية مليئة بالميتوكوندريا لإنتاج الطاقة، وخلية ورقة مليئة بالبلاستيدات الخضراء للبناء الضوئي.','الخلايا المتشابهة تكوّن **أنسجة**، والأنسجة تكوّن **أعضاء**، والأعضاء تكوّن **أجهزة**.'], vis:{kind:'compare', cols:[{icon:'💪',title:'خلية عضلية', items:['كثير من الميتوكوندريا','طويلة قابلة للانقباض','تحتاج طاقة كبيرة']},{icon:'🍃',title:'خلية نسيج الورقة',items:['كثير من البلاستيدات الخضراء','جدار خلوي وفجوة','تصنع الغذاء بالضوء']}]}},
        {title:'الخلية في حياتنا اليومية', tag:'ربط بعُمان', text:['اللبن الرائب والجبن في المزارع العُمانية تصنعه **بكتيريا** وحيدة الخلية.','فحص عيّنة الدم في المستشفى هو **عدّ خلايا** تحت المجهر.','تحسين أصناف النخيل والزراعة النسيجية تبدأ من **خلايا نباتية** مفردة تُزرع في المختبر.'], vis:{kind:'cards', items:[{icon:'🥛',title:'صناعة الألبان',text:'بكتيريا حمض اللاكتيك وحيدة الخلية.'},{icon:'🩸',title:'المختبر الطبي',text:'خلايا الدم تُعدّ وتُفحص مجهريًا.'},{icon:'🌴',title:'زراعة الأنسجة',text:'نخلة كاملة من خلايا قليلة.'},{icon:'🔬',title:'البحث العلمي',text:'فهم المرض يبدأ من الخلية.'}]}},
        {title:'خلاصة الدرس', tag:'خلاصة', text:['**نظرية الخلية**: كل الأحياء من خلايا، والخلية وحدة الحياة، والخلايا تنشأ من خلايا.','الخلايا صغيرة جدًا (ميكرومترات) فلا تُدرَس إلا **بالمجهر**.','كل خلية لها **غشاء وسيتوبلازم وDNA ورايبوسومات**.','نوعان رئيسان: **حقيقية النواة** و**بدائية النواة**.'], vis:{kind:'steps', steps:[{icon:'1️⃣',t:'كل الأحياء من خلايا'},{icon:'2️⃣',t:'الخلية أصغر وحدة حياة'},{icon:'3️⃣',t:'الخلايا تنشأ بانقسام خلايا سابقة'},{icon:'4️⃣',t:'نحتاج المجهر لرؤيتها'}]}}
      ],

      slides:[
        {title:'كم صغير هو الصغير؟', tag:'تمهيد', text:['حبة رمل من شاطئ القرم قطرها نحو **1 mm** — فيها تسعُ ألف بكتيريا صفًّا واحدًا!','لدراسة الخلايا نحتاج أداة **تكبّر** وأخرى تجعلنا **نميّز** التفاصيل. هل هما الشيء نفسه؟','في هذا الدرس: وحدات القياس، والمجهر الضوئي، والفرق بين قوة التكبير وقوة التمييز.'], vis:{kind:'cards', items:[{icon:'📏',title:'الوحدات',text:'mm، µm، nm والتحويل بينها.'},{icon:'🔬',title:'المجهر الضوئي',text:'أجزاؤه وكيف يكبّر.'},{icon:'🔍',title:'التكبير',text:'كم مرة تكبر الصورة.'},{icon:'👁️',title:'التمييز',text:'أصغر تفصيل يمكن رؤيته منفصلًا.'}]}},
        {title:'وحدات قياس العالم المجهري', tag:'الوحدات', text:['**الملّيمتر (mm)** = 1/1000 من المتر.','**الميكرومتر (µm)** = 1/1000 من الملّيمتر = 10⁻⁶ m.','**النانومتر (nm)** = 1/1000 من الميكرومتر = 10⁻⁹ m.','خلية نباتية ≈ 40 µm، بكتيريا ≈ 1 µm، فيروس ≈ 100 nm، رايبوسوم ≈ 25 nm.'], note:'💡 للتحويل من الوحدة الأكبر إلى الأصغر اضرب في 1000، وللعكس اقسم على 1000.', vis:'units_scale', q:{t:'mcq', q:'غشاء الخلية سمكه نحو 7 nm؛ كم يعادل بالميكرومتر؟', opts:['0.7 µm','0.07 µm','0.007 µm','7000 µm'], a:2, why:'7 ÷ 1000 = 0.007 µm.'}},
        {title:'المجهر الضوئي وأجزاؤه', tag:'الأداة', text:['يمرّ الضوء من **المصدر الضوئي** عبر العيّنة على **المنصة**، ثم عبر **العدسة الشيئية** فـ**العدسة العينية** إلى العين.','**التكبير الكلّي** = تكبير العينية × تكبير الشيئية (مثال: 10 × 40 = ×400).','**ضابط البؤرة** (الخشن والدقيق) يغيّر المسافة بين العدسة الشيئية والعيّنة حتى تتضح الصورة.','يُحمَل المجهر من **الذراع** والقاعدة.'], vis:'light_microscope', cap:'مسار الضوء من المصدر إلى العين عبر عدستَين مكبّرتَين.'},
        {title:'تحضير شريحة مؤقّتة', tag:'مهارة عملية', text:['كثير من التراكيب الخلوية **شفّافة**، فنلوّنها بـ**صبغات**: اليود لخلايا النبات (ويلوّن النشا أزرق-أسود)، والميثيلين الأزرق للأنوية في خلايا الحيوان.','توضع العيّنة رقيقة جدًا كي ينفذ الضوء منها.','يُنزَل **الساتر (غطاء الشريحة)** بزاوية لتجنّب فقاعات الهواء.'], vis:{kind:'steps', steps:[{icon:'🔪',t:'خذ طبقة رقيقة من العيّنة (بشرة البصل مثلًا)'},{icon:'💧',t:'ضعها في قطرة ماء أو صبغة على الشريحة'},{icon:'🎨',t:'أضف صبغة مناسبة (يود / ميثيلين أزرق)'},{icon:'🪟',t:'أنزل الساتر بزاوية 45° ببطء'},{icon:'🔬',t:'ابدأ بأصغر عدسة شيئية ثم زد التكبير'}]}, q:{t:'mcq', q:'لماذا نبدأ الفحص دائمًا بالعدسة الشيئية الأصغر تكبيرًا؟', opts:['لأنها أوضح صورة','لأن مجال رؤيتها أوسع فنجد العيّنة بسهولة','لأنها لا تحتاج ضوءًا','لأن التكبير الكبير يتلف العيّنة'], a:1, why:'العدسة الصغيرة تُظهر مساحة أكبر من الشريحة، فنحدّد موقع العيّنة ثم ننتقل إلى تكبير أعلى.'}},
        {title:'قوة التكبير', tag:'مفهوم 1', text:['**قوة التكبير** (Magnification): عدد المرات التي يكون فيها حجم الصورة أكبر من الحجم الفعلي للجسم.','التكبير = حجم الصورة ÷ الحجم الفعلي.','أقصى تكبير **مفيد** للمجهر الضوئي نحو **×1500**؛ بعده تكبر الصورة لكن لا تظهر تفاصيل جديدة.'], vis:'magnification', cap:'مثلث الصيغة: غطِّ ما تريد حسابه، تجد العملية.'},
        {title:'قوة التمييز', tag:'مفهوم 2', text:['**قوة التمييز** (Resolution): القدرة على رؤية نقطتَين متجاورتَين **كجسمَين منفصلَين**.','تُحدَّد بـ**الطول الموجي**: لا يمكن تمييز تفصيل أصغر من نصف الطول الموجي المستخدم.','الضوء المرئي طوله الموجي 400–700 nm، فحدّ تمييز المجهر الضوئي نحو **200 nm** (0.2 µm).','لذلك لا تُرى الرايبوسومات (25 nm) ولا غشاء الخلية (7 nm) بالمجهر الضوئي.'], note:'💡 التكبير يجعل الصورة أكبر؛ التمييز يجعلها أوضح. تكبير بلا تمييز = ضبابية مكبّرة.', vis:{kind:'compare', cols:[{icon:'🔍',title:'قوة التكبير',items:['كم مرة تكبر الصورة','I ÷ A','يمكن زيادتها بعدسات أقوى','وحدها لا تكشف تفاصيل جديدة']},{icon:'👁️',title:'قوة التمييز',items:['أصغر مسافة بين نقطتَين تُريان منفصلتَين','تعتمد على الطول الموجي','المجهر الضوئي ≈ 200 nm','المجهر الإلكتروني ≈ 0.5 nm']}]}, q:{t:'mcq', q:'تركيبان في الخلية تفصل بينهما 100 nm؛ ماذا يحدث عند فحصهما بالمجهر الضوئي؟', opts:['يظهران منفصلَين بوضوح','يظهران كجسم واحد مهما كبّرنا','يختفيان تمامًا','يظهران بألوان مختلفة'], a:1, why:'100 nm أقل من حدّ التمييز (200 nm)، فلا يمكن للمجهر الضوئي فصلهما بصريًا.'}},
        {title:'لماذا الإلكترونات؟', tag:'تمهيد للدرس ١-٥', text:['حزمة **الإلكترونات** طولها الموجي أقصر بكثير من الضوء، فقوة تمييز المجهر الإلكتروني تصل إلى **0.5 nm**.','لذا يكشف المجهر الإلكتروني الرايبوسومات والأغشية والتفاصيل الداخلية للعضيات.','لكن للمجهر الضوئي مزاياه: **عيّنات حية**، ألوان حقيقية، تكلفة أقل وسهولة.'], vis:'em_vs_lm'},
        {title:'المجهر في حياة العُماني', tag:'ربط بالحياة', text:['مختبرات وزارة الصحة تفحص **الملاريا** بتلوين شريحة دم ورؤية الطفيلي داخل خلايا الدم الحمراء.','مراقبة **جودة مياه** الأفلاج والتحلية تعتمد على عدّ الكائنات المجهرية.','بحوث تربة **الزراعة** ترصد البكتيريا والفطريات النافعة تحت المجهر.'], vis:{kind:'cards', items:[{icon:'🩸',title:'الطب',text:'تشخيص الطفيليات والالتهابات.'},{icon:'💧',title:'المياه',text:'كشف الطحالب والبكتيريا.'},{icon:'🌾',title:'الزراعة',text:'صحة التربة والنبات.'},{icon:'🏭',title:'الصناعة',text:'جودة الأغذية والألبان.'}]}},

        {t:'mcq', q:'ما اللون الذي تراه في خلايا ورقة نبات تحت المجهر الضوئي، وما سببه؟', opts:['أحمر بسبب الهيموجلوبين','أخضر بسبب البلاستيدات الخضراء','أزرق بسبب النواة','شفّاف دائمًا'], a:1, why:'البلاستيدات الخضراء تحوي الكلوروفيل الأخضر وتُرى بوضوح بالمجهر الضوئي.'},
        {t:'cloud', q:'اختر التراكيب التي تُرى عادةً بالمجهر الضوئي في خلية بشرة البصل الملوّنة باليود:', words:[{w:'الجدار الخلوي',ok:true},{w:'النواة',ok:true},{w:'السيتوبلازم',ok:true},{w:'الفجوة',ok:true},{w:'الرايبوسومات',ok:false},{w:'الشبكة الإندوبلازمية',ok:false},{w:'الميتوكوندريا (بوضوح)',ok:false},{w:'الليسوسومات',ok:false}], why:'الجدار والنواة والسيتوبلازم والفجوة كبيرة بما يكفي؛ أمّا الرايبوسومات والشبكة الإندوبلازمية والليسوسومات فتحتاج المجهر الإلكتروني.'},

      slides:[
        {title:'ماذا يُظهر المجهر الضوئي فعلًا؟', tag:'تمهيد', text:['هل تساءلت لماذا تبدو الخلية في كتابك أغنى بكثير مما رأيته في المختبر؟','المجهر الضوئي (تمييز ≈ 200 nm) يُظهر **التراكيب الكبيرة فقط**: الجدار، النواة، الفجوة، البلاستيدات.','في هذا الدرس نصف الخلية النباتية والحيوانية **كما تُرى فعلًا** بالمجهر الضوئي ونقارنهما.'], vis:{kind:'compare', cols:[{icon:'🌿',title:'خلية نباتية',items:['جدار خلوي','فجوة كبيرة مركزية','بلاستيدات خضراء','نواة غالبًا جانبية']},{icon:'🐾',title:'خلية حيوانية',items:['لا جدار','لا فجوة كبيرة','لا بلاستيدات','نواة غالبًا مركزية']}]}},
        {title:'الخلية الحيوانية تحت المجهر الضوئي', tag:'خلية حيوانية', text:['**غشاء سطح الخلية**: حدّ خارجي رفيع جدًا (7 nm) لا يُرى بذاته، بل يُستدَل عليه من حافة السيتوبلازم.','**السيتوبلازم**: مادة حبيبية شفّافة تملأ الخلية.','**النواة**: أكبر تركيب، تحوي **الكروماتين** (DNA + بروتين) و**النوية** الداكنة، ويحيط بها **الغلاف النووي**.','بصبغات خاصة تُرى **الميتوكوندريا** كنقاط أو خيوط صغيرة.'], note:'💡 السيتوبلازم + النواة = **البروتوبلازم**، أي المحتوى الحي كلّه.', vis:'animal_cell', cap:'ملاحظة: الرسم يُظهر التفاصيل الإلكترونية؛ بالمجهر الضوئي تُرى النواة والسيتوبلازم والحدّ الخارجي أساسًا.', q:{t:'mcq', q:'ما أكبر تركيب يُرى بوضوح في خلية الخد الملوّنة بالميثيلين الأزرق؟', opts:['الميتوكوندريون','النواة','الرايبوسوم','الجدار الخلوي'], a:1, why:'النواة كبيرة (نحو 10 µm) وتتلوّن بشدّة بالصبغات القاعدية.'}},
        {title:'الخلية النباتية تحت المجهر الضوئي', tag:'خلية نباتية', text:['**الجدار الخلوي**: طبقة سميكة نسبيًا من **السليلوز** خارج الغشاء، تعطي الخلية شكلًا ثابتًا.','تلتصق جدر الخلايا المتجاورة بطبقة تُسمّى **الصفيحة الوسطى**.','**الفجوة** المركزية الكبيرة مملوءة بـ**العصير الخلوي** ومحاطة بغشاء يُسمّى **التونوبلاست**.','**البلاستيدات الخضراء** بيضوية خضراء تحوي الكلوروفيل؛ وقد تُرى **حبيبات النشا** فيها.'], vis:'plant_cell', cap:'الفجوة تدفع السيتوبلازم والنواة إلى جوار الجدار.'},
        {title:'الغشاء والجدار: لا تخلط بينهما', tag:'تمييز مفهومي', text:['**غشاء سطح الخلية**: في كل الخلايا، رقيق جدًا (7 nm)، حيّ، **يتحكّم** في دخول المواد وخروجها.','**الجدار الخلوي**: في النبات (والفطريات والبكتيريا بمواد مختلفة)، سميك، غير حي، **منفذ تمامًا**، يدعم الخلية ويحميها.','في النبات يقع الغشاء **داخل** الجدار ملتصقًا به.'], vis:{kind:'table', head:['','غشاء سطح الخلية','الجدار الخلوي'], rows:[['أين؟','كل الخلايا','النبات والفطريات والبكتيريا'],['السمك','≈ 7 nm','عدّة ميكرومترات'],['المادة','فوسفوليبيدات وبروتينات','سليلوز (في النبات)'],['النفاذية','اختيارية','منفذ تمامًا'],['الوظيفة','تنظيم الدخول والخروج','دعم وحماية وشكل ثابت']]}, q:{t:'mcq', q:'أيّ العبارات صحيحة عن الجدار الخلوي النباتي؟', opts:['اختياري النفاذية','يقع داخل الغشاء','مصنوع من السليلوز ومنفذ تمامًا','يوجد في الخلايا الحيوانية أيضًا'], a:2, why:'الجدار السليلوزي خارج الغشاء، منفذ تمامًا، ويختصّ بالنبات دون الحيوان.'}},
        {title:'الفجوة والبلاستيدات: مميّزات نباتية', tag:'تراكيب نباتية', text:['**الفجوة** المركزية تشغل معظم حجم الخلية النباتية الناضجة، تخزّن الماء والأملاح والسكريات والصبغات، وتحفظ **امتلاء** الخلية.','**التونوبلاست** غشاء الفجوة، اختياري النفاذية مثل الغشاء الخلوي.','**البلاستيدات الخضراء** موقع **البناء الضوئي**؛ توجد في الخلايا المعرّضة للضوء (الأوراق والسيقان الخضراء) لا في الجذور ولا بشرة البصل.','الخلايا الحيوانية قد تحوي فجوات **صغيرة مؤقّتة** فقط (مثل الفجوات الغذائية).'], vis:'chloroplast', cap:'بلاستيدة خضراء: بالمجهر الضوئي تُرى قرصًا أخضر، وبالإلكتروني تظهر الجرانا والستروما.'},
        {title:'مقارنة شاملة', tag:'مقارنة', text:['**متشابهات**: غشاء سطح الخلية، سيتوبلازم، نواة بنوية وكروماتين، ميتوكوندريا، رايبوسومات.','**في النبات فقط**: جدار خلوي سليلوزي، فجوة مركزية كبيرة بتونوبلاست، بلاستيدات خضراء، بلازموديزماتا.','**في الحيوان فقط**: المريكزات (تُرى بالإلكتروني)، وفجوات صغيرة مؤقّتة إن وُجدت.'], vis:{kind:'compare', cols:[{icon:'🌿',title:'الخلية النباتية',items:['جدار سليلوزي','فجوة كبيرة + تونوبلاست','بلاستيدات خضراء','شكل منتظم ثابت','نواة جانبية غالبًا']},{icon:'🐾',title:'الخلية الحيوانية',items:['لا جدار','لا فجوة دائمة كبيرة','لا بلاستيدات','شكل أقل انتظامًا','مريكزات (إلكتروني)']}]}, q:{t:'mcq', q:'أيّ تركيب مشترك بين الخلية النباتية والحيوانية؟', opts:['الجدار الخلوي','البلاستيدة الخضراء','الميتوكوندريون','التونوبلاست'], a:2, why:'الميتوكوندريا موقع التنفّس الهوائي في الخليتَين معًا.'}},
        {title:'الرسم العلمي للخلية', tag:'مهارة', text:['استخدم قلم رصاص حادًّا وخطوطًا **واضحة متصلة** بلا تظليل.','ارسم **ما تراه فعلًا** لا ما في الكتاب؛ لا تضف عضيات لا يُظهرها المجهر الضوئي.','ضع **تسميات** بخطوط مستقيمة تنتهي عند التركيب، واكتب **التكبير** الذي رسمت به.','حافظ على **النسب** بين أجزاء الخلية.'], vis:{kind:'steps', steps:[{icon:'✏️',t:'قلم رصاص حادّ، خطوط متصلة'},{icon:'👁️',t:'ارسم المشاهَد فقط'},{icon:'🏷️',t:'تسميات بخطوط مستقيمة لا تتقاطع'},{icon:'🔢',t:'اكتب التكبير أو مقياس الرسم'},{icon:'📐',t:'احترم النسب الحقيقية'}]}},
        {title:'خلايا من بيئتنا', tag:'ربط بعُمان', text:['ورقة **شجرة اللبان** في ظفار: خلايا بلاستيداتها خضراء وجدرها سميكة تقاوم الجفاف.','بشرة **البصل** المزروع في مزارع الباطنة: مثال كلاسيكي لخلايا بجدار ونواة وفجوة دون بلاستيدات.','خلايا **الخد** من فمك: مثال حيواني بلا جدار ونواة مركزية.'], vis:{kind:'cards', items:[{icon:'🌳',title:'ورقة اللبان',text:'بلاستيدات خضراء كثيرة.'},{icon:'🧅',title:'بشرة البصل',text:'جدار ونواة وفجوة، بلا بلاستيدات.'},{icon:'😊',title:'خلية الخد',text:'غشاء ونواة وسيتوبلازم فقط.'},{icon:'🥔',title:'درنة البطاطس',text:'حبيبات نشا تتلوّن باليود.'}]}},
        {title:'خلاصة الدرس', tag:'خلاصة', text:['بالمجهر الضوئي نرى: **الجدار (نبات)، الغشاء (كحدّ)، السيتوبلازم، النواة بنويتها، الفجوة، البلاستيدات الخضراء**.','الخلية النباتية تنفرد بـ**الجدار السليلوزي والفجوة الكبيرة والبلاستيدات**.','**البروتوبلازم** = السيتوبلازم + النواة؛ **العصير الخلوي** يملأ الفجوة داخل **التونوبلاست**.'], vis:'plant_cell'}

        {t:'cloud', q:'اختر ما تحتاجه لقياس خلية بالمجهر الضوئي قياسًا فعليًا:', words:[{w:'مقياس العدسة العينية',ok:true},{w:'مقياس المنصة',ok:true},{w:'المعايرة',ok:true},{w:'المسطرة العادية',ok:false},{w:'الميزان',ok:false},{w:'صبغة بندكت',ok:false},{w:'التكبير الكلّي',ok:true},{w:'الساعة',ok:false}], why:'نستخدم مقياس العينية بعد معايرته بمقياس المنصة عند التكبير نفسه؛ المسطرة والميزان لا يقيسان ميكرومترات.'},

      slides:[
        {title:'كيف نقيس ما لا نراه؟', tag:'تمهيد', text:['تخيّل أنك تريد قياس طول نملة من صورة مكبّرة في مجلة؛ يجب أن تعرف **كم كبّرت الصورة**.','في الخلية الأمر نفسه: بين **حجم الصورة** و**الحجم الفعلي** و**التكبير** علاقة واحدة بسيطة.','في هذا الدرس: صيغة التكبير، القياس بمقياس العينية والمنصة، وخطوط المقياس.'], vis:'magnification'},
        {title:'صيغة التكبير', tag:'الصيغة', text:['**التكبير (M)** = حجم الصورة (I) ÷ الحجم الفعلي (A).','ويمكن ترتيبها: **I = A × M** أو **A = I ÷ M**.','التكبير **عدد بلا وحدة** لأنه نسبة بين طولَين.','القاعدة الذهبية: **وحّد الوحدات** قبل الحساب (حوّل كل شيء إلى µm غالبًا).'], note:'💡 تذكّر: I = Image (الصورة)، A = Actual (الفعلي)، M = Magnification (التكبير). «I AM».', vis:{kind:'cards', items:[{icon:'🔍',title:'M = I ÷ A',text:'لحساب التكبير.'},{icon:'📏',title:'A = I ÷ M',text:'لحساب الحجم الفعلي.'},{icon:'🖼️',title:'I = A × M',text:'لحساب حجم الصورة.'},{icon:'⚖️',title:'وحّد الوحدات',text:'mm ↔ µm ↔ nm قبل الحساب.'}]}, q:{t:'mcq', q:'صورة خلية طولها 50 mm عند تكبير ×1000. ما الطول الفعلي؟', opts:['50 µm','5 µm','500 µm','0.5 µm'], a:0, why:'50 mm = 50 000 µm؛ 50 000 ÷ 1000 = 50 µm.'}},
        {title:'مثال محلول 1: حساب التكبير', tag:'تطبيق', text:['قِس طول الصورة بالمسطرة: **30 mm**.','الطول الفعلي للخلية معلوم: **15 µm**.','وحّد الوحدات: 30 mm = **30 000 µm**.','M = 30 000 ÷ 15 = **×2000**.'], vis:{kind:'steps', steps:[{icon:'📏',t:'قياس الصورة: 30 mm'},{icon:'🔁',t:'التحويل: 30 × 1000 = 30 000 µm'},{icon:'➗',t:'M = I ÷ A = 30 000 ÷ 15'},{icon:'✅',t:'M = ×2000'}]}},
        {title:'مثال محلول 2: من الصورة إلى الفعلي', tag:'تطبيق', text:['صورة ميتوكوندريون طولها **8 mm** بتكبير **×8000**.','8 mm = 8000 µm.','A = 8000 ÷ 8000 = **1 µm**، وهو الطول النموذجي للميتوكوندريون.','مثال آخر: خلية فعليّة 20 µm بتكبير ×500 → I = 20 × 500 = 10 000 µm = **10 mm**.'], vis:'mitochondrion', cap:'الميتوكوندريون نحو 1 µm عرضًا؛ لتُرى تفاصيله يلزم تكبير بالآلاف.', q:{t:'mcq', q:'خلية دم حمراء قطرها 7 µm تُرسَم بتكبير ×2000. ما قطر الرسم؟', opts:['1.4 mm','14 mm','140 mm','3.5 mm'], a:1, why:'I = 7 × 2000 = 14 000 µm = 14 mm.'}},
        {title:'خط المقياس (Scale bar)', tag:'أداة', text:['كثير من الصور المجهرية تحمل **خط مقياس** بطول معلوم (مثل 10 µm) بدلًا من كتابة التكبير.','قِس طول الخط بالمسطرة (مثلًا **20 mm**)، فالتكبير = 20 000 µm ÷ 10 µm = **×2000**.','ثم قِس أيّ تركيب في الصورة واقسم على التكبير: تركيب طوله 35 mm → 35 000 ÷ 2000 = **17.5 µm**.'], vis:{kind:'flow', steps:[{icon:'📏',t:'قِس خط المقياس (mm)'},{icon:'➗',t:'اقسم على قيمته (µm) = التكبير'},{icon:'🔎',t:'قِس التركيب المطلوب'},{icon:'✅',t:'اقسم على التكبير = الحجم الفعلي'}]}},
        {title:'مقياس العدسة العينية ومقياس المنصة', tag:'القياس المباشر', text:['**مقياس العينية** (graticule): مسطرة شفّافة داخل العدسة العينية، وحداتها **بلا قيمة معلومة** لأنها تتغيّر مع العدسة الشيئية.','**مقياس المنصة** (stage micrometer): شريحة عليها مسطرة دقيقة معلومة القيمة (مثلًا: تدريجات كل منها **0.1 mm = 100 µm**؛ أو 100 تدريج في 1 mm فكل تدريج **10 µm**).','**المعايرة**: نضع مقياس المنصة، ونعدّ كم وحدة من مقياس العينية تقابل طولًا معلومًا.','مثال: 40 وحدة عينية = 100 µm → الوحدة = **2.5 µm** (عند هذا التكبير فقط).'], vis:'graticule', cap:'يجب إعادة المعايرة كلّما غيّرنا العدسة الشيئية.', q:{t:'mcq', q:'بعد المعايرة كانت الوحدة الواحدة = 2.5 µm. خلية تغطّي 16 وحدة؛ ما عرضها؟', opts:['6.4 µm','40 µm','16 µm','400 µm'], a:1, why:'16 × 2.5 = 40 µm.'}},
        {title:'خطوات المعايرة والقياس', tag:'مهارة عملية', text:['1. ضع **مقياس المنصة** على المنصة وركّز عليه بالتكبير المطلوب.','2. طابق صفر المقياسَين وعدّ كم وحدة عينية تقابل عددًا من تدريجات المنصة.','3. احسب **قيمة الوحدة العينية** بالميكرومتر.','4. استبدل مقياس المنصة بالشريحة، وعدّ الوحدات التي تغطّيها الخلية، واضرب في قيمة الوحدة.'], vis:{kind:'steps', steps:[{icon:'1️⃣',t:'ركّز على مقياس المنصة'},{icon:'2️⃣',t:'طابق الصفرَين وعدّ الوحدات المتقابلة'},{icon:'3️⃣',t:'احسب قيمة وحدة العينية (µm)'},{icon:'4️⃣',t:'ضع شريحة العيّنة'},{icon:'5️⃣',t:'عدّ وحدات الخلية × قيمة الوحدة'}]}},

    { id:'l1_5', num:'١-٥', title:'الفحص بالمجهر الإلكتروني', en:'Electron microscopy', ws:false,
      preIntro:'تعلّمنا أن الطول الموجي يحدّ قوة التمييز. ماذا لو استبدلنا الضوء بشيء طوله الموجي أقصر بآلاف المرات؟',
      pre:[
        {t:'tf', q:'قوة تمييز المجهر الإلكتروني أفضل من المجهر الضوئي لأن الإلكترونات طولها الموجي أقصر بكثير من الضوء.', a:true, why:'حدّ التمييز يساوي تقريبًا نصف الطول الموجي، والإلكترونات طولها الموجي أقصر بكثير فتميّز نحو 0.5 nm.'},
        {t:'mcq', q:'أيّ التراكيب يمكن رؤيته بالمجهر الإلكتروني فقط؟', opts:['النواة','البلاستيدة الخضراء','الرايبوسوم','الجدار الخلوي'], a:2, why:'الرايبوسوم (25 nm) أصغر من حدّ تمييز المجهر الضوئي (200 nm).'},
        {t:'visual', vis:'em_vs_lm', q:'ما الذي يقوم بدور العدسات في المجهر الإلكتروني؟', opts:['عدسات زجاجية أدقّ','مغانط كهربائية','مرايا مقعّرة','ألياف ضوئية'], a:1, why:'الإلكترونات جسيمات مشحونة تنحرف في المجال المغناطيسي، فتُركَّز بمغانط كهربائية لا بزجاج.'},
        {t:'cloud', q:'اختر ما ينطبق على المجهر الإلكتروني:', words:[{w:'تفريغ هوائي',ok:true},{w:'عيّنة ميتة',ok:true},{w:'صورة أبيض وأسود',ok:true},{w:'أملاح معادن ثقيلة',ok:true},{w:'عيّنة حية تتحرّك',ok:false},{w:'ألوان طبيعية',ok:false},{w:'صبغة اليود',ok:false},{w:'تمييز 0.5 nm',ok:true},{w:'رخيص ومحمول',ok:false}], why:'المجهر الإلكتروني يعمل في تفريغ على عيّنات ميتة مصبوغة بمعادن ثقيلة ويعطي صورًا بلا ألوان؛ الألوان تُضاف حاسوبيًا لاحقًا.'},
        {t:'open', q:'الهواء يشتّت الإلكترونات ويمتصّها. ما الذي يترتّب على ذلك في تصميم المجهر الإلكتروني وفي نوع العيّنات التي يمكن فحصها؟'}

      slides:[
        {title:'ما بعد حدود الضوء', tag:'تمهيد', text:['حتى منتصف القرن العشرين ظنّ العلماء أن الخلية «كيس من الهلام» فيه نواة. لماذا؟','لأن **المجهر الضوئي** لا يميّز أقل من 200 nm، ومعظم العضيات والأغشية أصغر من ذلك.','**المجهر الإلكتروني** (منذ ثلاثينيات القرن العشرين) كشف **البنية الدقيقة** (ultrastructure) للخلية.'], vis:'em_vs_lm', cap:'القفزة من 200 nm إلى 0.5 nm فتحت عالمًا جديدًا داخل الخلية.'},
        {title:'لماذا الإلكترونات؟', tag:'المبدأ', text:['حزمة الإلكترونات لها **طول موجي** أقصر من الضوء المرئي بآلاف المرات.','بما أن حدّ التمييز ≈ نصف الطول الموجي، تصل قوة تمييز المجهر الإلكتروني إلى نحو **0.5 nm**، أي **أفضل 400 مرة** من الضوئي.','التكبير المفيد يتجاوز **×250 000**، فتظهر الرايبوسومات والأغشية بوضوح.','الإلكترونات **مشحونة**، فتُركَّز بـ**مغانط كهربائية** بدل العدسات الزجاجية.'], vis:{kind:'compare', cols:[{icon:'💡',title:'ضوء مرئي',items:['طول موجي 400–700 nm','تمييز ≈ 200 nm','عدسات زجاجية','×1500 أقصى تكبير مفيد']},{icon:'⚡',title:'حزمة إلكترونات',items:['طول موجي أقصر بآلاف المرات','تمييز ≈ 0.5 nm','مغانط كهربائية','تكبير > ×250 000']}]}, q:{t:'mcq', q:'كم مرة تقريبًا تفوق قوة تمييز المجهر الإلكتروني (0.5 nm) قوة تمييز الضوئي (200 nm)؟', opts:['4 مرات','40 مرة','400 مرة','4000 مرة'], a:2, why:'200 ÷ 0.5 = 400.'}},
        {title:'المجهر الإلكتروني النافذ (TEM)', tag:'النوع الأول', text:['تمرّ حزمة الإلكترونات **عبر** مقطع رقيق جدًا من العيّنة.','تُصبغ العيّنة بـ**أملاح معادن ثقيلة** (كالرصاص واليورانيوم)؛ الأجزاء التي تمتصّ الإلكترونات تظهر **داكنة**، والتي تنفذ منها فاتحة.','يعطي صورة **ثنائية الأبعاد** للتركيب الداخلي بأعلى قوة تمييز (0.5 nm).','معظم صور العضيات في كتابك (الميتوكوندريا، الشبكة الإندوبلازمية) مأخوذة بـ TEM.'], vis:{kind:'flow', steps:[{icon:'🔫',t:'مدفع إلكترونات'},{icon:'🧲',t:'مغانط مكثّفة'},{icon:'🧫',t:'مقطع رقيق مصبوغ'},{icon:'🧲',t:'مغانط مكبّرة'},{icon:'🖥️',t:'شاشة / كاشف'}]}, cap:'الإلكترونات تنفذ عبر العيّنة إلى الكاشف.'},
        {title:'المجهر الإلكتروني الماسح (SEM)', tag:'النوع الثاني', text:['تمسح حزمة الإلكترونات **سطح** العيّنة المغلّف بطبقة معدنية رقيقة (كالذهب).','الإلكترونات **المرتدّة** من السطح تُجمَع لبناء صورة **ثلاثية الأبعاد** واقعية للسطح.','قوة تمييزه **أقل** من TEM (نحو 3–20 nm)، لكنه ممتاز لإظهار الشكل الخارجي: أسطح الخلايا، الأهداب، حبوب اللقاح، الحشرات.'], vis:{kind:'compare', cols:[{icon:'🔦',title:'TEM النافذ',items:['الإلكترونات تنفذ عبر مقطع رقيق','صورة داخلية 2D','تمييز ≈ 0.5 nm','صبغ بمعادن ثقيلة']},{icon:'🗿',title:'SEM الماسح',items:['الإلكترونات ترتدّ عن السطح','صورة سطحية 3D','تمييز ≈ 3–20 nm','تغليف بطبقة معدنية']}]}, q:{t:'mcq', q:'تريد صورة تُظهر شكل سطح حبة لقاح بأبعادها الثلاثة. أيّ مجهر تختار؟', opts:['المجهر الضوئي','TEM','SEM','مقياس المنصة'], a:2, why:'SEM يجمع الإلكترونات المرتدّة من السطح فيُعطي صورة ثلاثية الأبعاد.'}},
        {title:'تحضير العيّنة: الثمن الذي ندفعه', tag:'قيود', text:['الإلكترونات يشتّتها الهواء، فيعمل المجهر في **تفريغ هوائي**؛ وبذلك **لا يمكن فحص عيّنات حية**.','تُجفَّف العيّنة وتُثبَّت كيميائيًا وتُقطَّع مقاطع فائقة الرقّة (TEM) أو تُغلَّف بمعدن (SEM).','قد يسبّب التحضير **تشوّهات (artefacts)** ليست موجودة في الخلية الحية.','الصور **بالأبيض والأسود** أصلًا؛ **الألوان الزائفة** تُضاف حاسوبيًا للتوضيح.'], note:'💡 عندما ترى ميتوكوندريون «برتقاليًا» في صورة إلكترونية فذلك تلوين حاسوبي، لا لونه الحقيقي.', vis:{kind:'steps', steps:[{icon:'🧪',t:'التثبيت الكيميائي (قتل الخلايا وحفظ بنيتها)'},{icon:'💨',t:'التجفيف (إزالة الماء)'},{icon:'🔪',t:'التقطيع الفائق الرقّة (TEM) أو التغليف بالمعدن (SEM)'},{icon:'⚫',t:'الصبغ بأملاح معادن ثقيلة'},{icon:'🌀',t:'الفحص في تفريغ هوائي'}]}},
        {title:'ماذا كشف المجهر الإلكتروني؟', tag:'الاكتشافات', text:['**الرايبوسومات** (25 nm) كحبيبات داكنة، حرّة أو على الشبكة الإندوبلازمية.','**غشاء سطح الخلية** (7 nm) كخطّين داكنَين بينهما فاتح.','التركيب الداخلي لـ**الميتوكوندريا** (الأعراف) و**البلاستيدات** (الجرانا).','**الشبكة الإندوبلازمية** و**جهاز جولجي** و**الليسوسومات** و**المريكزات** و**الأنيبيبات الدقيقة**.'], vis:'animal_cell', cap:'خلية حيوانية كما تكشفها الصورة الإلكترونية النافذة.', q:{t:'mcq', q:'يظهر غشاء سطح الخلية في صور TEM كـ:', opts:['خط واحد أخضر','خطّين داكنَين بينهما فاتح','دائرة ملوّنة','حبيبات متناثرة'], a:1, why:'المعادن الثقيلة تلتصق بالرؤوس القطبية للفوسفوليبيدات في طبقتَي الغشاء فتظهر داكنة، وتبقى الذيول الدهنية فاتحة.'}},
        {title:'أيّ مجهر أختار؟', tag:'اتخاذ قرار', text:['**لرؤية خلايا حية تتحرّك** أو الانقسام مباشرة: المجهر الضوئي.','**لرؤية التركيب الداخلي الدقيق** للعضيات: TEM.','**لرؤية شكل السطح ثلاثيًا**: SEM.','التكلفة والحجم والتدريب أيضًا عوامل: المجهر الإلكتروني ضخم ومكلف ويحتاج مختصّين.'], vis:{kind:'table', head:['المعيار','ضوئي','TEM','SEM'], rows:[['قوة التمييز','≈ 200 nm','≈ 0.5 nm','≈ 3–20 nm'],['نوع الصورة','ملوّنة 2D','أبيض وأسود 2D داخلية','أبيض وأسود 3D سطحية'],['العيّنة','حية أو ميتة','ميتة، مقطع رقيق جدًا','ميتة، مغلّفة بمعدن'],['الوسط','هواء','تفريغ','تفريغ'],['التكلفة','منخفضة','عالية جدًا','عالية']]}},
        {title:'المجهر الإلكتروني في خدمة عُمان', tag:'ربط بالحياة', text:['في جامعة السلطان قابوس ومراكز البحث تُستخدم مجاهر إلكترونية لدراسة **الفيروسات** والبكتيريا المسبّبة للأمراض.','دراسة **حبوب اللقاح** والنباتات المحلية وتصنيفها.','تحليل **المواد** والمعادن وسطوح المنتجات في الصناعة والنفط.'], vis:{kind:'cards', items:[{icon:'🦠',title:'الصحة',text:'تحديد الفيروسات بشكلها.'},{icon:'🌸',title:'النبات',text:'أسطح حبوب اللقاح بـ SEM.'},{icon:'⚙️',title:'الصناعة',text:'سطوح المعادن والمواد.'},{icon:'🎓',title:'البحث',text:'البنية الدقيقة للخلايا.'}]}},
        {title:'خلاصة الدرس', tag:'خلاصة', text:['الإلكترونات طولها الموجي قصير → قوة تمييز **0.5 nm** وتكبير يفوق **×250 000**.','**TEM**: الإلكترونات تنفذ عبر مقطع رقيق → تركيب داخلي 2D بأعلى تمييز.','**SEM**: الإلكترونات ترتدّ عن السطح → صورة سطحية 3D.','قيود: **تفريغ، عيّنة ميتة، صبغ بمعادن ثقيلة، أبيض وأسود، تشوّهات محتملة**.'], vis:'em_vs_lm'}
