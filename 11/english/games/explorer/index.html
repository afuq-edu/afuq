<!DOCTYPE html>
<html lang="en" dir="ltr">
<head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My English Passport – Grade 11 Semester A</title>
<style>
:root{
  --bg:#EEF2F7; --paper:#FFFFFF; --ink:#16213A; --muted:#5B6782; --line:#D5DCE8;
  --t1:#0E8C8C; --t2:#C2367A; --t3:#D98A0B; --t4:#3B5BDB;
  --ok:#1F9D55; --bad:#D64545; --stamp:#B8322F; --chip:#F3F6FB;
  --c:var(--t1);
  --fd:"Trebuchet MS","Segoe UI","Helvetica Neue",Arial,sans-serif;
  --fb:system-ui,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans Arabic",Tahoma,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0F1626; --paper:#18223A; --ink:#E8EDF7; --muted:#9AA6C2; --line:#2B3756;
    --t1:#2EC4C4; --t2:#F062A4; --t3:#F2B035; --t4:#7B95FF; --chip:#202C48;
    --ok:#3DD47F; --bad:#FF6B6B; --stamp:#FF6B5E;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1626; --paper:#18223A; --ink:#E8EDF7; --muted:#9AA6C2; --line:#2B3756;
  --t1:#2EC4C4; --t2:#F062A4; --t3:#F2B035; --t4:#7B95FF; --chip:#202C48;
  --ok:#3DD47F; --bad:#FF6B6B; --stamp:#FF6B5E;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--fb);font-size:16px;line-height:1.65;-webkit-font-smoothing:antialiased}
h1,h2,h3,.disp{font-family:var(--fd);font-weight:700;line-height:1.2;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid var(--c);outline-offset:2px}
a{color:inherit}
.en{direction:ltr;unicode-bidi:isolate}
.ar{direction:rtl;unicode-bidi:isolate;font-family:var(--fb);opacity:.85;font-size:.95em}
.wrap{max-width:1040px;margin:0 auto;padding:0 18px 80px}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar-in{max-width:1040px;margin:0 auto;padding:10px 18px;display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font-family:var(--fd);font-weight:700;font-size:20px}
.brand .logo{width:34px;height:34px;border-radius:9px;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-size:15px;letter-spacing:-.5px}
.bar nav{margin-inline-start:auto;display:flex;gap:6px;flex-wrap:wrap}
.navb{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:6px 14px;font-size:14px;text-decoration:none}
.navb.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.xp{font-weight:700;font-size:14px;color:var(--muted);white-space:nowrap}
.xp b{color:var(--ink)}

/* passport hero */
.passport{margin:26px 0 30px;display:grid;grid-template-columns:1fr 1.35fr;background:#1B2B57;border-radius:20px;padding:10px;gap:10px;box-shadow:0 18px 40px -22px rgba(20,30,70,.55)}
.pp-page{background:#FBF8EE;color:#1B2440;border-radius:12px;padding:22px;position:relative;overflow:hidden}
.pp-page::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(135deg,rgba(27,43,87,.035) 0 2px,transparent 2px 9px);pointer-events:none}
.pp-left h1{font-size:34px;margin-bottom:4px}
.pp-left .sub{color:#56607a;font-size:15px;margin-bottom:16px}
.pp-field{border-bottom:1.5px dashed #9aa3bb;padding:4px 0;margin-bottom:12px}
.pp-field label{display:block;font-size:12px;color:#6c7590}
.pp-field input{border:0;background:transparent;font:inherit;font-size:20px;font-family:var(--fd);width:100%;color:#1B2440;padding:0}
.pp-stats{display:flex;gap:18px;margin-top:14px}
.pp-stats div{font-size:13px;color:#56607a}
.pp-stats b{display:block;font-size:28px;font-family:var(--fd);color:#1B2440;line-height:1.1}
.pp-right h2{font-size:18px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:baseline}
.pp-right h2 small{font-family:var(--fb);font-weight:400;font-size:13px;color:#56607a}
.stamps{display:grid;grid-template-columns:auto repeat(5,1fr);gap:6px 8px;align-items:center}
.stamps .row-l{font-size:12px;color:#56607a;white-space:nowrap;padding-inline-end:4px}
.slot{aspect-ratio:1;display:grid;place-items:center;border-radius:50%;border:1.5px dashed #b8bfd1;color:#a3abc0;font-size:13px;text-decoration:none;position:relative}
.slot.got{border:0}
.slot svg{width:100%;height:100%;overflow:visible}
.slot.new svg{animation:thump .7s cubic-bezier(.2,1.6,.4,1) both}
@keyframes thump{0%{transform:scale(2.2) rotate(-25deg);opacity:0}100%{transform:scale(1) rotate(0);opacity:1}}

/* theme rows */
.sec-h{display:flex;align-items:baseline;justify-content:space-between;margin:8px 0 14px}
.sec-h h2{font-size:24px}
.themes{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.tcard{display:block;text-decoration:none;background:var(--paper);border-radius:16px;padding:20px;border:1px solid var(--line);position:relative;overflow:hidden}
.tcard .num{font-family:var(--fd);font-size:64px;line-height:.8;color:var(--c);opacity:.18;position:absolute;inset-inline-end:16px;top:14px}
.tcard h3{font-size:24px;color:var(--c)}
.tcard .en-t{font-size:15px;color:var(--muted);margin-bottom:12px}
.tcard .units{display:flex;flex-wrap:wrap;gap:6px}
.tcard .units span{font-size:12.5px;background:var(--chip);border-radius:6px;padding:2px 8px}
.meter{height:8px;border-radius:9px;background:var(--chip);margin-top:14px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--c);border-radius:9px;transition:width .6s}
.tcard:hover{border-color:var(--c)}

.quick{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}
.qcard{display:flex;gap:14px;align-items:center;text-decoration:none;background:var(--ink);color:var(--bg);border-radius:16px;padding:18px 20px}
.qcard .ic{font-size:32px}
.qcard h3{font-size:20px}
.qcard p{margin:0;font-size:13.5px;opacity:.8}
.qcard.alt{background:var(--paper);color:var(--ink);border:1px solid var(--line)}

/* theme page */
.crumbs{margin:18px 0 6px;font-size:14px;color:var(--muted)}
.crumbs a{text-decoration:none;color:var(--muted)}
.tbanner{border-radius:20px;padding:26px 24px;background:var(--c);color:#fff;position:relative;overflow:hidden;margin-bottom:22px}
.tbanner h1{font-size:38px}
.tbanner .en{font-size:18px;opacity:.9}
.tbanner p{max-width:62ch;margin:10px 0 0;opacity:.95}
.tbanner .big{position:absolute;inset-inline-end:18px;bottom:-18px;font-size:120px;opacity:.18;font-family:var(--fd)}
.route{position:relative;margin:0 0 26px;padding:0;list-style:none}
.route::before{content:"";position:absolute;inset-inline-start:27px;top:20px;bottom:20px;border-inline-start:3px dotted var(--c);opacity:.5}
.stop{display:flex;align-items:center;gap:16px;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:10px;text-decoration:none;position:relative}
.stop:hover{border-color:var(--c)}
.stop .n{flex:none;width:24px;height:24px;margin-inline:3px;border-radius:50%;background:var(--paper);border:3px solid var(--c);display:grid;place-items:center;font-size:12px;font-weight:700;position:relative;z-index:1}
.stop.done .n{background:var(--c);color:#fff}
.stop .em{font-size:30px;flex:none}
.stop .tx{flex:1;min-width:0}
.stop .tx b{display:block;font-size:17px}
.stop .tx small{color:var(--muted);font-size:13px}
.stop .pct{font-weight:700;color:var(--c);font-size:14px;white-space:nowrap}
.tag{display:inline-block;font-size:12px;border-radius:6px;padding:1px 8px;background:color-mix(in srgb,var(--c) 14%,transparent);color:var(--c);font-weight:600}
.extras{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.xcard{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:16px;text-decoration:none;display:block}
.xcard:hover{border-color:var(--c)}
.xcard .em{font-size:28px}
.xcard b{display:block;margin-top:6px}
.xcard small{color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 20px}
.wchip{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:5px 12px;font-size:14px;display:inline-flex;gap:6px;align-items:center}
.wchip .ar{color:var(--muted);font-size:13px}

/* unit page */
.uhead{display:flex;gap:16px;align-items:center;margin:8px 0 16px}
.uhead .em{font-size:52px;line-height:1}
.uhead h1{font-size:32px}
.uhead .en{font-size:17px;color:var(--muted)}
.tabs{display:flex;gap:6px;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:5px;margin-bottom:18px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 58px);z-index:10}
.tabs button{flex:1;border:0;background:transparent;border-radius:10px;padding:9px 6px;font-weight:600;font-size:15px}
.tabs button.on{background:var(--c);color:#fff}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:22px;margin-bottom:16px}
.panel h2{font-size:22px;margin-bottom:10px;color:var(--c)}
.panel h3{font-size:18px;margin:16px 0 6px}
.learn .en p,.learn .en li{max-width:72ch}
.learn ul{padding-inline-start:20px;margin:6px 0}
.learn li{margin-bottom:4px}
.note{background:color-mix(in srgb,var(--c) 9%,transparent);border-inline-start:4px solid var(--c);border-radius:10px;padding:12px 14px;margin:12px 0}
.note.en{border-inline-start:0;border-left:4px solid var(--c)}
.gtable{width:100%;border-collapse:collapse;margin:10px 0;font-size:15px}
.gtable th,.gtable td{border:1px solid var(--line);padding:8px 10px;vertical-align:top;text-align:left}
.gtable th{background:var(--chip);font-weight:600}
.tw{overflow-x:auto}
mark.k{background:color-mix(in srgb,var(--c) 22%,transparent);color:inherit;border-radius:4px;padding:0 3px}

/* flashcards */
.fc-wrap{display:flex;flex-direction:column;align-items:center;gap:14px}
.fc{width:min(440px,100%);aspect-ratio:1.6;perspective:1000px;border:0;background:transparent;padding:0}
.fc-in{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.fc.flip .fc-in{transform:rotateY(180deg)}
.fc-f,.fc-b{position:absolute;inset:0;backface-visibility:hidden;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px;text-align:center}
.fc-f{background:var(--c);color:#fff}
.fc-f .w{font-family:var(--fd);font-size:clamp(28px,7vw,42px);direction:ltr}
.fc-f small{opacity:.8}
.fc-b{background:var(--paper);border:2px solid var(--c);transform:rotateY(180deg)}
.fc-b .ar{font-family:var(--fd);font-size:30px;color:var(--c)}
.fc-b .def{direction:ltr;color:var(--muted);font-size:15px;margin-top:6px}
.fc-ctrl{display:flex;gap:10px;align-items:center}
.btn{border:0;border-radius:12px;padding:10px 18px;font-weight:700;background:var(--c);color:#fff}
.btn.ghost{background:var(--chip);color:var(--ink)}
.btn.sm{padding:6px 12px;font-size:14px}
.btn:disabled{opacity:.45;cursor:default}
.vlist{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:18px}
.vrow{display:flex;align-items:center;gap:10px;background:var(--chip);border-radius:10px;padding:8px 12px}
.vrow .e{direction:ltr;font-weight:600;flex:1}
.vrow .a{color:var(--muted);font-size:14px}
.say{border:0;background:transparent;font-size:18px;padding:2px 4px;line-height:1}

/* activities */
.act{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:16px}
.act-h{display:flex;align-items:flex-start;gap:12px;margin-bottom:12px}
.act-h .badge{flex:none;width:30px;height:30px;border-radius:9px;background:var(--c);color:#fff;display:grid;place-items:center;font-weight:700}
.act-h h3{font-size:18px;margin:0}
.act-h .ins{font-size:14px;color:var(--muted);margin:2px 0 0}
.act-h .best{margin-inline-start:auto;font-size:13px;font-weight:700;color:var(--ok);white-space:nowrap}
.q{padding:12px 0;border-top:1px dashed var(--line)}
.q:first-child{border-top:0}
.q .qt{margin-bottom:8px;font-weight:500}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{border:1.5px solid var(--line);background:var(--paper);border-radius:10px;padding:7px 14px;font-size:15px;text-align:start}
.opt.sel{border-color:var(--c);background:color-mix(in srgb,var(--c) 12%,transparent)}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 15%,transparent)}
.opt.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 13%,transparent)}
.why{font-size:14px;color:var(--muted);margin-top:6px}
.act-f{display:flex;align-items:center;gap:12px;margin-top:14px;flex-wrap:wrap}
.res{font-weight:700}
.res.ok{color:var(--ok)} .res.bad{color:var(--bad)}

.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mcol{display:flex;flex-direction:column;gap:8px}
.mi{border:1.5px solid var(--line);background:var(--paper);border-radius:10px;padding:8px 12px;text-align:start;font-size:15px;position:relative;min-height:44px}
.mi .tagn{position:absolute;inset-inline-end:8px;top:50%;transform:translateY(-50%);width:22px;height:22px;border-radius:50%;color:#fff;font-size:12px;display:grid;place-items:center;font-weight:700}
.mi.sel{border-color:var(--c);box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 25%,transparent)}
.mi.ok{border-color:var(--ok)} .mi.bad{border-color:var(--bad)}
.mi .fix{display:block;font-size:12.5px;color:var(--ok);margin-top:2px}

.pool{display:flex;flex-wrap:wrap;gap:8px;min-height:48px;padding:10px;border:1.5px dashed var(--line);border-radius:12px;margin-bottom:12px}
.chip{border:1.5px solid var(--line);background:var(--chip);border-radius:10px;padding:6px 12px;font-size:15px}
.chip.sel{border-color:var(--c);background:color-mix(in srgb,var(--c) 18%,transparent)}
.chip.ok{border-color:var(--ok)} .chip.bad{border-color:var(--bad);text-decoration:line-through}
.buckets{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.bucket{border:1.5px solid var(--line);border-radius:12px;padding:8px;min-height:90px;text-align:start;background:var(--paper)}
.bucket .bh{font-weight:700;font-size:14px;color:var(--c);display:block;margin-bottom:6px}
.bucket .bi{display:flex;flex-wrap:wrap;gap:6px}
.bucket.armed{border-color:var(--c);background:color-mix(in srgb,var(--c) 6%,transparent)}
.answer{display:flex;flex-wrap:wrap;gap:8px;min-height:52px;padding:10px;border-radius:12px;background:var(--chip);margin-bottom:10px}
.answer.block,.pool.block{flex-direction:column}
.answer.block .chip,.pool.block .chip{text-align:start;line-height:1.5}
.fill-text{line-height:2.4}
.blank{border:0;border-bottom:2px solid var(--c);background:color-mix(in srgb,var(--c) 8%,transparent);border-radius:6px 6px 0 0;min-width:90px;padding:0 10px;font-size:15px;margin:0 2px}
.blank.foc{background:color-mix(in srgb,var(--c) 25%,transparent)}
.blank.ok{border-color:var(--ok)} .blank.bad{border-color:var(--bad);color:var(--bad)}
.tin{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:9px 12px;font:inherit;background:var(--paper);color:var(--ink)}
.tin.ok{border-color:var(--ok)} .tin.bad{border-color:var(--bad)}
textarea.tin{min-height:170px;resize:vertical;line-height:1.6}
.check{display:flex;gap:8px;align-items:flex-start;margin:6px 0;font-size:15px}
.check input{margin-top:5px;accent-color:var(--c);width:18px;height:18px}
.model{white-space:pre-wrap;background:var(--chip);border-radius:12px;padding:14px;margin-top:10px;font-size:15px}

/* phone mock for SMS */
.phone{width:min(300px,100%);margin:6px auto;background:#222a3d;border-radius:28px;padding:14px 12px 20px}
.screen{background:#E6F4EA;border-radius:16px;padding:12px;min-height:150px;font-family:var(--fb);direction:ltr;color:#1b2b1b}
.bub{background:#fff;border-radius:14px 14px 14px 4px;padding:8px 12px;margin:6px 0;font-weight:600;display:inline-block;max-width:100%}
.bub.me{background:#2E7D5B;color:#fff;border-radius:14px 14px 4px 14px;float:right;clear:both}
.screen::after{content:"";display:block;clear:both}

/* challenge */
.timer{height:10px;background:var(--chip);border-radius:9px;overflow:hidden;margin:10px 0 18px}
.timer i{display:block;height:100%;background:var(--c);transition:width 1s linear}
.bigq{font-size:20px;font-weight:600;margin-bottom:14px}
.bigopts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bigopts .opt{padding:14px;font-size:16px}
.score-big{font-family:var(--fd);font-size:70px;color:var(--c);line-height:1}

.search{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;font:inherit;background:var(--paper);color:var(--ink);margin-bottom:12px}
.toast{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);left:50%;transform:translateX(-50%) translateY(calc(100% + 60px));visibility:hidden;background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:14px;font-weight:600;z-index:50;transition:transform .35s cubic-bezier(.2,1.4,.4,1);max-width:90vw;text-align:center}
.toast.show{transform:translateX(-50%) translateY(0);visibility:visible}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:60}
.tool{border:1.5px dashed var(--c);border-radius:14px;padding:16px;margin-top:14px}
.tool .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tool .out{direction:ltr;background:var(--chip);border-radius:10px;padding:10px 12px;margin-top:10px;min-height:44px;font-weight:600}
.plan-pick{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}

@media (max-width:760px){
  .passport{grid-template-columns:1fr}
  .themes,.quick{grid-template-columns:1fr}
  .extras{grid-template-columns:1fr 1fr}
  .vlist{grid-template-columns:1fr}
  .bigopts{grid-template-columns:1fr}
  .tbanner h1{font-size:30px}
  .uhead h1{font-size:26px}
  .bar{position:static}
  .bar-in{flex-wrap:wrap;row-gap:8px}
  .xp{margin-inline-start:auto}
  .bar nav{width:100%;margin:0}
  .bar nav .navb{flex:1;text-align:center;white-space:nowrap;padding:6px 8px}
  .tabs{top:env(safe-area-inset-top,0px)}
  .uhead .em{font-size:40px}
}
@media (max-width:460px){.match{grid-template-columns:1fr 1fr;gap:6px}.mi{font-size:13.5px;padding:7px 9px}.extras{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

</style>
</head>
<body>
<header class="bar"><div class="bar-in"><a class="brand" href="#/"><span class="logo">11A</span><span>English Journey</span></a><span class="xp" id="xp"></span><nav id="nav"></nav></div></header>
<main class="wrap" id="app"></main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<canvas id="confetti"></canvas>
<script>
const THEMES = [];

/* ================= THEME 1 ================= */
THEMES.push({
  id:1, en:"Communication", ar:"التواصل", color:"--t1", icon:"💬",
  blurb:"Body language, the Internet, mobile phones, conversation skills and writing e-mails.",
  intro:[["body language","لغة الجسد"],["speech","الكلام"],["printing","الطباعة"],["wireless systems","الأنظمة اللاسلكية"],["laptop","حاسوب محمول"],["e-mail","بريد إلكتروني"],["blog","مدوّنة"],["text messaging","الرسائل النصية"],["social networking sites","مواقع التواصل الاجتماعي"],["video diary","مذكرات بالفيديو"]],

  { id:1, en:"Body Language", ar:"لغة الجسد", skill:"Reading", em:"🙆",
    learn:`
<h2>What is body language?</h2>
<p>We use our bodies, gestures and faces to send messages – often without realising it. <span class="ar">لغة الجسد: رسائل نرسلها بأجسادنا دون أن ننتبه.</span></p>
<div class="en note"><b>Body language</b> = the way we move our bodies, make <mark class="k">gestures</mark> or use <mark class="k">facial expressions</mark> to get our message across.</div>
<h3>Who needs to read body language?</h3>
<div class="en"><ul>
<li><b>Police officers</b> – spot the signs that someone feels <mark class="k">guilty</mark>.</li>
<li><b>Teachers</b> – notice if students are interested or bored, <mark class="k">attentive</mark> or <mark class="k">confused</mark>.</li>
<li><b>Politicians</b> – use positive signals to look truthful and <mark class="k">trustworthy</mark>.</li></ul></div>
<h3>In a job interview</h3>
<div class="tw"><table class="gtable en"><tr><th>✅ Positive message</th><th>❌ Negative message</th></tr>
<tr><td>walking purposefully into the room</td><td>walking nervously</td></tr>
<tr><td>smiling, sitting comfortably</td><td>not making eye contact</td></tr>
<tr><td>using your hands to support your words</td><td>crossing your arms, no gestures</td></tr></table></div>
<div class="note"><b>The secret:</b> <span class="en" style="display:inline">A liar looks <b>down to the left</b>. An interested listener puts the <b>head on one side</b>.</span></div>
<h3>💡 Skill: words with similar meanings</h3>
<p>When you look for a word with a similar meaning, first check its <b>part of speech</b>. If the word is an adverb, look for an adverb. <span class="ar">حدّد نوع الكلمة أولًا.</span></p>
<div class="en note">anxiously (adv) = nervously &nbsp;•&nbsp; uninterested (adj) = bored</div>`,

  { id:2, en:"The Internet", ar:"الإنترنت", skill:"Grammar", em:"🌐",
    learn:`
<h2>The reading text in brief</h2>
<div class="en"><ul>
<li>In <b>1991</b>, computer scientist <b>Tim Berners-Lee</b> created the World Wide Web – a new computer 'language' that let computers link together.</li>
<li>Twenty years later the Internet is the <b>fastest-growing technology</b> in history.</li>
<li>Airports, coffee shops and hotels offer free connections for laptops and pocket PCs.</li>
<li>People shop online (e-shopping), join social networking sites, book holidays, send money and write <b>blogs</b>.</li></ul></div>
<h2 style="margin-top:20px">Grammar: present simple and present continuous</h2>
<div class="note en"><b>What do you think about technology?</b> (opinion – always true) &nbsp;vs&nbsp; <b>What are you thinking about?</b> (right now)</div>
<div class="tw"><table class="gtable en">
<tr><th>Present Simple – <span class="ar">المضارع البسيط</span></th><th>Present Continuous – <span class="ar">المضارع المستمر</span></th></tr>
<tr><td><b>habits / routines</b><br>He <u>e-mails</u> his friends every day.</td><td><b>actions happening right now</b><br>She <u>is texting</u> her friend.</td></tr>
<tr><td><b>a situation that is true</b><br>There <u>are</u> many blogs on the Internet.</td><td><b>situations around now (not exactly this moment)</b><br>He <u>is taking</u> a course in computer science.</td></tr>
<tr><td><b>a permanent state</b><br>They <u>live</u> in Sohar.</td><td><b>future plans / arrangements</b><br>I<u>'m getting</u> a new phone tomorrow.</td></tr>
<tr><td>Form: I/you/we/they <b>work</b> – he/she/it <b>works</b></td><td>Form: <b>am / is / are + verb-ing</b></td></tr></table></div>
<div class="note">🔑 Signal words: <span class="en" style="display:inline"><b>every day, usually, always, often</b> → Simple &nbsp;|&nbsp; <b>now, at the moment, today, this week, tomorrow (plans)</b> → Continuous</span></div>
<div class="note">⚠️ State verbs (<span class="en" style="display:inline">know, like, want, believe, need</span>) are not usually used in the continuous: <span class="en" style="display:inline">I <b>know</b> the answer. (not <s>I am knowing</s>)</span></div>`,

<h2 style="margin-top:18px">Abbreviations <span class="ar">الاختصارات</span></h2>
<p>An abbreviation is a short form of a word or expression. We leave out letters, or use only the first letter of each word.</p>
<div class="note en">Dr = doctor &nbsp;•&nbsp; info = information &nbsp;•&nbsp; IT = information technology &nbsp;•&nbsp; SMS = short message service</div>

<p>SMS uses numbers and letters that sound like words: <span class="en" style="display:inline"><b>2</b> = to, <b>4</b> = for, <b>8</b> = -ate (GR8 = great, L8R = later), <b>C</b> = see, <b>U</b> = you, <b>R</b> = are, <b>@</b> = at</span></p>

  { id:4, en:"Communication Skills", ar:"مهارات التواصل", skill:"Listening & Speaking", em:"🗣️",
    learn:`
<h2>Why is communication important?</h2>
<div class="en"><ul>
<li>Communication involves <b>both talking and listening</b>. A relationship is two-sided.</li>
<li>If you are always talking or always listening, the relationship is <b>not balanced</b>.</li>
<li>If you don't express negative feelings, they can make you unhappy or angry. <mark class="k">Pent-up</mark> feelings = feelings kept inside.</li>
<li>Sharing a problem will make you feel better.</li></ul></div>
<h3>🗨️ Making conversation</h3>
<div class="en"><ul>
<li>Show interest. Nod your head, and say 'mm' or 'really?'</li><li>Make eye contact.</li><li>Take turns talking and listening.</li><li>Don't just answer 'yes' or 'no'.</li><li>Ask questions related to what the other person has just said.</li></ul></div>
<h3>🎧 Sound Bites – everyday phrases</h3>
<div class="en chips" style="margin:6px 0">${["Hello, how are you?","Nice to see you!","Really?","That's interesting.","How exciting.","I'm sorry to hear that.","What do you think?","How about you?","See you later!","Goodbye!"].map(x=>`<span class="wchip">${x} <button class="say" data-say="${x}">🔊</button></span>`).join("")}</div>`,

  { id:5, en:"E-Mail", ar:"البريد الإلكتروني", skill:"Writing", em:"📧",
    learn:`
<h2>Ten rules for writing e-mails</h2>
<div class="en"><ol>
<li>Think carefully about what you write – is it better to speak to someone?</li>
<li>Keep your e-mail <b>short</b> – one or two paragraphs.</li>
<li>Don't send it to people who don't need to read it.</li>
<li>Be <b>polite</b> – think about who you are writing to.</li>
<li>Pay attention to spelling, grammar and punctuation.</li>
<li>Don't write in CAPITALS – it looks like <b>shouting</b>.</li>
<li>Don't use 'smileys' except in very informal e-mails.</li>
<li>Include a <b>subject line</b> – the most important part.</li>
<li>Don't send confidential information – e-mails are not private.</li>
<li>Don't mark e-mails urgent. If it's really urgent, phone.</li></ol></div>
<h3>📐 The structure of an informal e-mail</h3>
<div class="tw"><table class="gtable en"><tr><th>Part</th><th>Example</th></tr>
<tr><td>Subject</td><td>Great news from Salalah!</td></tr><tr><td>Greeting</td><td>Hi Ahmed, / Dear Aunt Maryam,</td></tr>
<tr><td>Opening</td><td>How are you? I hope you're well.</td></tr><tr><td>Body</td><td>1–2 short paragraphs with your news</td></tr>
<tr><td>Closing</td><td>Write back soon. / Take care.</td></tr><tr><td>Sign-off + name</td><td>Love, / Best wishes, Salim</td></tr></table></div>`,

  { id:2, en:"Getting There", ar:"الوصول إلى الوجهة", skill:"Grammar", em:"✈️",
    learn:`
<h2>From Dubai to Salalah</h2>
<p>Two companies: a <b>bus trip</b> (Dubai → Buraimi → Nizwa → Hayma → Thumrait → Salalah) and a <b>flight</b> (hotel → Sheikh Rashid Airport → two-hour flight → Salalah → luxury resort).</p>
<h2 style="margin-top:18px">Grammar: expressing the future</h2>
<div class="tw"><table class="gtable en">
<tr><th>Form</th><th>Use</th><th>Example</th></tr>
<tr><td><b>will / won't</b></td><td>prediction</td><td>Perhaps people <u>won't send</u> letters in the future.</td></tr>
<tr><td><b>will / won't</b></td><td>offers & promises</td><td><u>I'll help</u> you do your homework.</td></tr>
<tr><td><b>will / won't</b></td><td>decisions made at the moment of speaking</td><td>Which pen? – <u>I'll have</u> the blue one.</td></tr>
<tr><td><b>going to</b></td><td>future plans & intentions (and predictions from evidence)</td><td>I'm <u>going to watch</u> TV then go to bed.</td></tr>
<tr><td><b>present continuous</b></td><td>fixed arrangements</td><td>I'm <u>meeting</u> my brother for lunch tomorrow.</td></tr></table></div>
<div class="note">🔎 Evidence now: <span class="en" style="display:inline">That man is driving too fast. He<b>'s going to have</b> an accident!</span> (we can see the evidence now → going to)</div>`,
    vocab:[["brochure","كتيّب سياحي","a small book with information and pictures"],["board","يصعد (إلى وسيلة نقل)","get on a bus, plane or ship"],["border","حدود","the line between two countries"],["travel permit","تصريح سفر","a document that lets you travel"],["formalities","إجراءات رسمية","official things you must do"],["refreshment stop","استراحة","a short stop for food and drink"],["destination","وجهة","place you are going to"],["chauffeur-driven","بسائق خاص","driven by a professional driver"],["escort","يرافق","go with someone"],["depart","يغادر","leave"]],

    learn:`
<h2>Tourist sites in Dhofar</h2>
<div class="tw"><table class="gtable en"><tr><th>Site</th><th>Famous for</th></tr>
<tr><td>Al Balid</td><td>10th-century city; remains of a large mosque; Persian pottery and Chinese coins & porcelain</td></tr>
<tr><td>Tawi Attair</td><td>'Well of Birds' – a sinkhole 220 m deep, full of birds in the Khareef</td></tr>
<tr><td>Khor Rori / Sumharam</td><td>lost port at the end of the Incense Trail; birdlife</td></tr>
<tr><td>Wadi Darbat</td><td>natural park; 100 m waterfall in the Khareef, lakes, caves</td></tr>
<tr><td>Mughsayl</td><td>4 km of beaches; <b>blowholes</b> shooting water 30 m high</td></tr>
<tr><td>Sadah</td><td>beaches for camping, sailing, diving; impressive fort</td></tr>
<tr><td>Taqah</td><td>pottery and silverwork; fort with wooden doors and screens</td></tr>
<tr><td>Jarzeez Springs</td><td>springs 14 km from Salalah; caves and shady picnic areas</td></tr>
<tr><td>Mirbat</td><td>port known for horse breeding (9th century); fort survived an attack in 1970</td></tr>
<tr><td>Salalah Museum</td><td>artefacts from archaeological sites; traditional arts and crafts</td></tr></table></div>

<div class="note">⚠️ <span class="en" style="display:inline">How about + <b>verb-ing</b> &nbsp;•&nbsp; Why don't you + <b>verb</b> &nbsp;•&nbsp; I'd rather + <b>verb</b> &nbsp;•&nbsp; I'd prefer + <b>to verb</b></span></div>`,

<h2>Walking Tour of Sultanahmet – Istanbul</h2>

<h2>What can a smart home do?</h2>

<div class="note en"><b>Form:</b> was / were + past participle (+ by …)<br>Edison <u>invented</u> the light bulb. → The light bulb <u>was invented</u> by Edison.</div>

<tr><td>when the action/object is more important than who did it</td><td><i>Julius Caesar</i> <u>was written</u> by William Shakespeare.</td></tr>

const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a;};

let AC;function tone(freqs,dur=.12,type="sine",gap=.09){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();let t=AC.currentTime;freqs.forEach(f=>{const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.18,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+dur+.02);t+=gap;});}catch(e){}}
const sfx={tap:()=>tone([660],.06,"triangle"),ok:()=>tone([523,659,784],.16),bad:()=>tone([300,220],.18,"sawtooth",.12),stamp:()=>{tone([180],.25,"square");setTimeout(()=>tone([523,659,784,1047],.18),220)}};

/* ===== speech ===== */
let BEST_VOICE=null;
function pickVoice(){try{const vs=speechSynthesis.getVoices().filter(v=>/^en/i.test(v.lang));if(!vs.length)return null;const off=navigator.onLine===false;
  const score=v=>{let s=0;const n=v.name;
    if(/natural|neural|premium|enhanced/i.test(n))s+=50;
    if(/google/i.test(n))s+=30;
    if(/siri|samantha|daniel|serena|kate|karen|moira|tessa|libby|sonia|ryan|aria|jenny|guy/i.test(n))s+=20;
    if(/compact|espeak|novelty|whisper|bad news|bells|zarvox|trinoids|albert|jester|organ|bubbles|boing|cellos|hysterical|superstar|wobble|grandma|grandpa|rocko|shelley|sandy|flo|eddy|reed/i.test(n))s-=80;
    if(/en[-_]GB/i.test(v.lang))s+=8;else if(/en[-_]US/i.test(v.lang))s+=5;
    if(v.localService)s+=off?100:2;else if(off)s-=200;
    return s;};
  return vs.sort((a,b)=>score(b)-score(a))[0];}catch(e){return null;}}
function say(txt){try{if(!BEST_VOICE)BEST_VOICE=pickVoice();const u=new SpeechSynthesisUtterance(txt);u.lang=BEST_VOICE?BEST_VOICE.lang:"en-GB";u.rate=.92;u.pitch=1;if(BEST_VOICE)u.voice=BEST_VOICE;
  u.onerror=()=>{if(BEST_VOICE&&!BEST_VOICE.localService){const vs=speechSynthesis.getVoices().filter(v=>/^en/i.test(v.lang)&&v.localService);BEST_VOICE=vs.find(v=>/en[-_]GB/i.test(v.lang))||vs[0]||null;}};
  speechSynthesis.cancel();speechSynthesis.speak(u);}catch(e){}}
addEventListener("online",()=>BEST_VOICE=null);addEventListener("offline",()=>BEST_VOICE=null);
document.addEventListener("click",e=>{const b=e.target.closest("[data-say]");if(b){e.preventDefault();say(b.dataset.say);}});

/* ===== toast & confetti ===== */
function toast(msg){const t=$("#toast");t.textContent=msg;t.classList.add("show");clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove("show"),2600);}
function confetti(color){if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;const c=$("#confetti"),x=c.getContext("2d");c.width=innerWidth;c.height=innerHeight;const cols=[color,"#F2B035","#2EC4C4","#F062A4","#7B95FF"];const P=Array.from({length:140},()=>({x:innerWidth/2,y:innerHeight/2.4,vx:(Math.random()-.5)*14,vy:Math.random()*-14-4,s:Math.random()*7+4,r:Math.random()*6,c:cols[Math.floor(Math.random()*cols.length)]}));let n=0;(function f(){x.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.45;p.r+=.2;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);x.restore();});if(++n<120)requestAnimationFrame(f);else x.clearRect(0,0,c.width,c.height);})();}

/* ===== progress ===== */
const actKey=(t,u,i)=>`${t}-${u}-${i}`;
function unitProg(t,u){const n=u.acts.length;let done=0,sum=0;u.acts.forEach((a,i)=>{const b=S.best[actKey(t.id,"u"+u.id,i)];if(b!=null){done++;sum+=b;}});return {n,done,avg:done?Math.round(sum/done):0,pct:Math.round(done/n*100)};}
function points(){return Object.values(S.best).reduce((s,v)=>s+Math.round(v/10),0)+Object.keys(S.stamps).length*20;}
function stampCount(){return Object.keys(S.stamps).length;}
function themeColor(t){return getComputedStyle(document.documentElement).getPropertyValue(t.color).trim()||"#0E8C8C";}
function record(key,pct,ctx){const prev=S.best[key];if(prev==null||pct>prev)S.best[key]=pct;save();updateXP();
  if(ctx&&ctx.unit){const p=unitProg(ctx.theme,ctx.unit);const sk=`${ctx.theme.id}-${ctx.unit.id}`;if(p.done===p.n&&p.avg>=70&&!S.stamps[sk]){S.stamps[sk]=Date.now();S.fresh=sk;save();updateXP();setTimeout(()=>{sfx.stamp();confetti(themeColor(ctx.theme));toast(`🛂 New stamp in your passport: ${ctx.unit.en}!`);},500);}}}
function updateXP(){const x=$("#xp");if(x)x.innerHTML=`<span>⭐ <b>${points()}</b> points</span> &nbsp; <span>🛂 <b>${stampCount()}</b>/20 stamps</span>`;}

/* ===== stamp svg ===== */
function stampSVG(t,u){const c=themeColor(t);const rot=((t.id*7+u.id*13)%30)-15;return `<svg viewBox="0 0 100 100" style="transform:rotate(${rot}deg)" aria-label="Stamp: ${u.en}"><circle cx="50" cy="50" r="46" fill="none" stroke="${c}" stroke-width="4"/><circle cx="50" cy="50" r="38" fill="none" stroke="${c}" stroke-width="1.5" stroke-dasharray="3 3"/><text x="50" y="58" text-anchor="middle" font-size="30">${u.em}</text><text x="50" y="84" text-anchor="middle" font-size="10" font-weight="700" fill="${c}" font-family="sans-serif">T${t.id}·U${u.id}</text><text x="50" y="26" text-anchor="middle" font-size="9" font-weight="700" fill="${c}" font-family="sans-serif" letter-spacing="1">PASSED</text></svg>`;}

/* ===== router ===== */
function go(hash){location.hash=hash;}
addEventListener("hashchange",render);
function setColor(varName){document.documentElement.style.setProperty("--c",`var(${varName})`);}
function navHTML(active){return `<a class="navb ${active==="home"?"on":""}" href="#/">Home</a><a class="navb ${active==="words"?"on":""}" href="#/words">Word Bank</a><a class="navb ${active==="challenge"?"on":""}" href="#/challenge">Big Challenge</a>`;}
function render(){
  const parts=location.hash.replace(/^#\/?/,"").split("/").filter(Boolean);
  const app=$("#app");app.innerHTML="";scrollTo(0,0);
  let active="home";
  if(parts[0]==="t"){const t=THEMES.find(x=>x.id==parts[1]);if(!t)return go("/");setColor(t.color);
    if(parts[2]==="u"){const u=t.units.find(x=>x.id==parts[3]);renderUnit(app,t,u,parts[4]||"learn");}
    else if(parts[2]==="x"){const x=t.extras.find(e=>e.k===parts[3]);renderExtra(app,t,x);}
    else renderTheme(app,t);active="";}
  else if(parts[0]==="words"){setColor("--t4");renderWords(app);active="words";}
  else if(parts[0]==="challenge"){setColor("--t2");renderChallenge(app);active="challenge";}

}

/* ===== flashcards ===== */
function flashcards(list){
  const w=h("div",{class:"panel"});let i=0;const order=list.slice();
  const card=h("button",{class:"fc","aria-label":"Flip the card"});
  const ctr=h("span",{style:"font-weight:700;min-width:60px;text-align:center"});
  function draw(){const v=order[i];card.classList.remove("flip");card.innerHTML=`<div class="fc-in"><div class="fc-f"><div class="w">${v[0]}</div><small>Tap to flip</small></div><div class="fc-b"><div class="ar">${v[1]}</div><div class="def">${v[2]||""}</div></div></div>`;ctr.textContent=`${i+1} / ${order.length}`;}
  card.onclick=()=>{card.classList.toggle("flip");sfx.tap();};
  const prev=h("button",{class:"btn ghost sm",onclick:()=>{i=(i-1+order.length)%order.length;draw();}},"← Previous");
  const next=h("button",{class:"btn ghost sm",onclick:()=>{i=(i+1)%order.length;draw();}},"Next →");
  const sp=h("button",{class:"btn sm",onclick:()=>say(order[i][0])},"🔊 Listen");
  const sh=h("button",{class:"btn ghost sm",onclick:()=>{const s=shuffle(order);order.splice(0,order.length,...s);i=0;draw();}},"🔀 Shuffle");
  w.append(h("div",{class:"fc-wrap"},card,h("div",{class:"fc-ctrl"},prev,ctr,next),h("div",{class:"fc-ctrl"},sp,sh)));
  const vl=h("div",{class:"vlist"});list.forEach(v=>vl.append(h("div",{class:"vrow",html:`<button class="say" data-say="${v[0]}" aria-label="Listen">🔊</button><span class="e">${v[0]}</span><span class="a">${v[1]}</span>`})));
  w.append(vl);draw();return w;
}

/* ===== activities ===== */
function activity(a,i,key,ctx){
  const box=h("div",{class:"act"});const best=S.best[key];
  box.append(h("div",{class:"act-h",html:`<span class="badge">${i+1}</span><div><h3>${a.t||a.ins}</h3>${a.t&&a.ins?`<p class="ins">${a.ins}</p>`:""}</div>${best!=null?`<span class="best">Best: ${best}%</span>`:""}`}));
  const body=h("div",{});box.append(body);
  const foot=h("div",{class:"act-f"});const res=h("span",{class:"res"});
  const builders={mcq:bMcq,match:bMatch,sort:bSort,order:bOrder,fill:bFill,type:bType,write:bWrite};
  let api=builders[a.type](body,a);
  const checkB=h("button",{class:"btn",onclick:()=>{const pct=api.check();if(pct==null)return;res.textContent=(pct>=70?"🎉 ":pct>=40?"👍 ":"💪 ")+`Your score: ${pct}%`;res.className="res "+(pct>=70?"ok":"bad");pct>=70?sfx.ok():sfx.bad();checkB.disabled=true;record(key,pct,ctx);const bb=$(".best",box);if(bb)bb.textContent=`Best: ${S.best[key]}%`;else $(".act-h",box).append(h("span",{class:"best"},`Best: ${S.best[key]}%`));}},a.type==="write"?"✔️ I've finished":"✔️ Check");
  const retry=h("button",{class:"btn ghost",onclick:()=>{body.innerHTML="";api=builders[a.type](body,a);res.textContent="";checkB.disabled=false;}},"↺ Try again");
  foot.append(checkB,retry,res);box.append(foot);return box;
}

function bMcq(body,a){
  const sel=a.q.map(()=>null);const rows=[];
  const items=a.q.map((q,qi)=>({q,qi}));
  items.forEach(({q,qi})=>{const row=h("div",{class:"q"});row.append(h("div",{class:"qt en"},`${qi+1}. ${q.q}`));
    const opts=h("div",{class:"opts en"});const bs=q.o.map((o,oi)=>h("button",{class:"opt",onclick:()=>{if(row.dataset.locked)return;sel[qi]=oi;bs.forEach(b=>b.classList.remove("sel"));bs[oi].classList.add("sel");sfx.tap();}},o));
    opts.append(...bs);row.append(opts);rows.push({row,bs,q});body.append(row);});
  return {check(){if(sel.some(s=>s==null)){toast("Answer all the questions first");return null;}let c=0;rows.forEach((r,qi)=>{r.row.dataset.locked=1;const ok=sel[qi]===r.q.a;if(ok)c++;r.bs[r.q.a].classList.add("ok");if(!ok)r.bs[sel[qi]].classList.add("bad");if(r.q.why&&!ok)r.row.append(h("div",{class:"why en"},"💡 "+r.q.why));});return Math.round(c/rows.length*100);}};
}

const PCOL=["#0E8C8C","#C2367A","#D98A0B","#3B5BDB","#7A4FD0","#1F9D55","#D64545","#00838F","#8D6E63","#5C6BC0","#AD1457"];
function bMatch(body,a){
  const L=a.pairs.map((p,i)=>({t:p[0],i})),R=shuffle(a.pairs.map((p,i)=>({t:p[1],i})));
  const link={};let selL=null;let locked=false;const lb=[],rb=[];
  const lc=h("div",{class:"mcol en"}),rc=h("div",{class:"mcol en"});
  function paint(){lb.forEach((b,li)=>{b.classList.toggle("sel",selL===li);const tg=b.querySelector(".tagn");if(tg)tg.remove();if(link[li]!=null){const col=PCOL[li%PCOL.length];b.append(h("span",{class:"tagn",style:`background:${col}`},String(li+1)));b.style.borderColor=col;}else b.style.borderColor="";});
    rb.forEach((b,ri)=>{const tg=b.querySelector(".tagn");if(tg)tg.remove();const li=Object.keys(link).find(k=>link[k]===ri);if(li!=null){const col=PCOL[li%PCOL.length];b.append(h("span",{class:"tagn",style:`background:${col}`},String(+li+1)));b.style.borderColor=col;}else b.style.borderColor="";});}
  L.forEach((x,li)=>{const b=h("button",{class:"mi",onclick:()=>{if(locked)return;selL=li;if(link[li]!=null)delete link[li];sfx.tap();paint();}},x.t);lb.push(b);lc.append(b);});
  R.forEach((x,ri)=>{const b=h("button",{class:"mi",onclick:()=>{if(locked)return;const owner=Object.keys(link).find(k=>link[k]===ri);if(selL==null){if(owner!=null){delete link[owner];paint();}return;}if(owner!=null)delete link[owner];link[selL]=ri;selL=null;sfx.tap();paint();}},x.t);rb.push(b);rc.append(b);});
  body.append(h("p",{class:"why",style:"margin:0 0 8px"},"Tap an item on the left, then its match on the right."));
  body.append(h("div",{class:"match"},lc,rc));
  return {check(){if(Object.keys(link).length<L.length){toast("Match all the items first");return null;}locked=true;let c=0;L.forEach((x,li)=>{const ok=R[link[li]].i===x.i;if(ok)c++;lb[li].classList.add(ok?"ok":"bad");if(!ok)lb[li].append(h("span",{class:"fix"},"✓ "+a.pairs[x.i][1]));});return Math.round(c/L.length*100);}};
}

function bSort(body,a){
  const items=shuffle(a.items.map((x,i)=>({t:x[0],b:x[1],i})));const where={};let sel=null;let locked=false;
  const pool=h("div",{class:"pool en"});const bks=a.buckets.map((name,bi)=>{const bi_=h("div",{class:"bi en"});const el=h("button",{class:"bucket",onclick:()=>{if(locked||sel==null)return;where[sel]=bi;sel=null;sfx.tap();draw();}},h("span",{class:"bh"},name),bi_);el._in=bi_;return el;});
  const chips={};items.forEach(x=>{chips[x.i]=h("span",{class:"chip",role:"button",tabindex:"0",onclick:e=>{e.stopPropagation();if(locked)return;if(where[x.i]!=null&&sel!==x.i){delete where[x.i];sel=null;}else sel=sel===x.i?null:x.i;sfx.tap();draw();}},x.t);chips[x.i].onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();chips[x.i].click();}};});
  function draw(){pool.innerHTML="";bks.forEach(b=>{b._in.innerHTML="";b.classList.toggle("armed",sel!=null);});items.forEach(x=>{const c=chips[x.i];c.classList.toggle("sel",sel===x.i);(where[x.i]!=null?bks[where[x.i]]._in:pool).append(c);});if(!pool.children.length)pool.append(h("span",{class:"why"},"✓ All cards sorted"));}
  body.append(h("p",{class:"why",style:"margin:0 0 8px"},"Tap a card, then tap the right box. Tap a card in a box to send it back."));
  body.append(pool,h("div",{class:"buckets"},...bks));draw();
  return {check(){if(Object.keys(where).length<items.length){toast("Sort all the cards first");return null;}locked=true;let c=0;items.forEach(x=>{const ok=where[x.i]===x.b;if(ok)c++;chips[x.i].classList.add(ok?"ok":"bad");if(!ok)chips[x.i].title="✓ "+a.buckets[x.b];});if(c<items.length)body.append(h("div",{class:"why"},"Crossed-out cards are in the wrong box – hover over them for the answer, or try again."));return Math.round(c/items.length*100);}};
}

function bOrder(body,a){
  let pool=shuffle(a.items.map((t,i)=>({t,i})));if(pool.every((x,k)=>x.i===k)&&pool.length>1)pool.reverse();
  const ans=[];let locked=false;const cls=a.block?" block":"";
  const ansEl=h("div",{class:"answer en"+cls}),poolEl=h("div",{class:"pool en"+cls});
  function draw(){ansEl.innerHTML="";poolEl.innerHTML="";if(!ans.length)ansEl.append(h("span",{class:"why"},"Tap the items in the correct order…"));
    ans.forEach((x,k)=>ansEl.append(h("button",{class:"chip",onclick:()=>{if(locked)return;ans.splice(k,1);pool.push(x);sfx.tap();draw();}},x.t)));
    pool.forEach((x,k)=>poolEl.append(h("button",{class:"chip",onclick:()=>{if(locked)return;pool.splice(k,1);ans.push(x);sfx.tap();draw();}},x.t)));}
  body.append(ansEl,poolEl);draw();
  return {check(){if(pool.length){toast("Use all the items first");return null;}locked=true;let c=0;[...ansEl.children].forEach((el,k)=>{const ok=ans[k].i===k;if(ok)c++;el.classList.add(ok?"ok":"bad");});if(c<ans.length)body.append(h("div",{class:"model en"},"✓ "+a.items.join(a.block?"\n":" ")));return Math.round(c/ans.length*100);}};
}

function bFill(body,a){
  const answers=[];const html=a.text.replace(/\{([^}]+)\}/g,(_,w)=>{answers.push(w);return `<button class="blank" data-b="${answers.length-1}">&nbsp;</button>`;});
  const vals=answers.map(()=>null);let focus=0;let locked=false;
  const bank=h("div",{class:"pool en"});const txt=h("div",{class:"fill-text en",html:html});const blanks=[...txt.querySelectorAll(".blank")];
  function draw(){blanks.forEach((b,k)=>{b.textContent=vals[k]||"\u00a0\u00a0\u00a0\u00a0";b.classList.toggle("foc",k===focus&&!locked);});bank.innerHTML="";a.bank.forEach(w=>{if(vals.includes(w))return;bank.append(h("button",{class:"chip",onclick:()=>{if(locked)return;vals[focus]=w;const nx=vals.findIndex(v=>v==null);focus=nx<0?focus:nx;sfx.tap();draw();}},w));});}
  blanks.forEach((b,k)=>b.onclick=()=>{if(locked)return;if(vals[k]){vals[k]=null;}focus=k;draw();});
  body.append(h("p",{class:"why",style:"margin:0 0 8px"},"Choose a gap, then a word from the box. Tap a filled gap to empty it."),bank,txt);draw();
  return {check(){if(vals.some(v=>v==null)){toast("Fill in all the gaps first");return null;}locked=true;let c=0;blanks.forEach((b,k)=>{const ok=vals[k]===answers[k];if(ok)c++;b.classList.remove("foc");b.classList.add(ok?"ok":"bad");if(!ok)b.textContent=`${vals[k]} → ${answers[k]}`;});return Math.round(c/answers.length*100);}};
}

function bType(body,a){

  return {check(){if(ins.some(x=>!x.inp.value.trim())){toast("Write all the answers first");return null;}let c=0;ins.forEach(x=>{const v=norm(x.inp.value);const ok=x.q.a.some(ans=>norm(ans)===v||norm(ans.replace(/ \.\.\. /," "))===v);if(ok)c++;x.inp.classList.add(ok?"ok":"bad");x.inp.readOnly=true;if(!ok)x.row.append(h("div",{class:"why en"},"✓ "+x.q.a[0]));});return Math.round(c/ins.length*100);}};

function bWrite(body,a){
  const ta=h("textarea",{class:"tin en",placeholder:"Write here…",spellcheck:"true"});const wc=h("span",{class:"why"},"0 words");
  ta.oninput=()=>{const n=(ta.value.trim().match(/\S+/g)||[]).length;wc.textContent=`${n} words (minimum ${a.min})`;};
  const checks=a.checks.map(c=>{const cb=h("input",{type:"checkbox"});return {cb,el:h("label",{class:"check en"},cb,h("span",{},c))};});
  const model=h("div",{class:"model en",style:"display:none"},a.model);
  const mb=h("button",{class:"btn ghost sm",onclick:()=>{model.style.display=model.style.display==="none"?"block":"none";}},"👁️ Show / hide model answer");
  body.append(ta,wc,h("h3",{style:"margin:12px 0 4px;font-size:16px"},"✅ Self-check list"),...checks.map(c=>c.el),h("div",{style:"margin-top:10px"},mb),model);
  return {check(){const n=(ta.value.trim().match(/\S+/g)||[]).length;if(n<a.min){toast(`Write at least ${a.min} words (you have ${n})`);return null;}const t=checks.filter(c=>c.cb.checked).length;ta.readOnly=true;return Math.round(t/checks.length*100);}};
}

/* ===== SMS tool ===== */
function smsTool(el){
  const D={"tomorrow":"2moro","later":"l8r","please":"pls","night":"nyt","great":"gr8","good":"gud","hello":"lo","to":"2","too":"2","new":"nu","about":"abt","see":"c","you":"u","are":"r","thanks":"thx","what":"wot","someone":"som1","anyone":"ne1","forget":"4get","for":"4","at":"@","can't":"cnt","tonight":"2nyt","before":"b4","be":"b","why":"y","and":"&","the":"d","your":"ur","love":"luv","mate":"m8","wait":"w8","because":"coz","free":"fre"};
  const inv={};Object.entries(D).forEach(([k,v])=>{if(!inv[v])inv[v]=k;});Object.assign(inv,{"cu":"see you","b4n":"bye for now","sabt":"sorry about that","rufre":"are you free","d/dun":"don't","dun":"don't","2":"to"});
  el.innerHTML=`<h3 style="margin-top:0">📲 SMS translator</h3><p class="why" style="margin-top:0">Type a sentence to change it into SMS language – or back into Standard English.</p>`;
  const inp=h("input",{class:"tin en",value:"See you tomorrow, thanks for the great night!"});
  const out=h("div",{class:"out"});const phone=h("div",{class:"phone"},h("div",{class:"screen"}));
  const toS=h("button",{class:"btn sm",onclick:()=>conv(true)},"English → SMS");const toE=h("button",{class:"btn ghost sm",onclick:()=>conv(false)},"SMS → English");
  function conv(dir){let r;if(dir){r=inp.value.replace(/see you/gi,"CU").replace(/bye for now/gi,"B4N").replace(/sorry about that/gi,"SABT").replace(/[A-Za-z']+/g,w=>D[w.toLowerCase()]?D[w.toLowerCase()].toUpperCase():w);}else{r=inp.value.replace(/[A-Za-z0-9@\/']+/g,w=>inv[w.toLowerCase()]||w);}out.textContent=r;const sc=phone.firstChild;sc.innerHTML="";sc.append(h("div",{class:"bub me"},inp.value),h("div",{class:"bub"},r));sfx.tap();}
  el.append(inp,h("div",{class:"row",style:"margin-top:8px"},toS,toE),out,phone);conv(true);
}

/* ===== words ===== */
function renderWords(app){
  app.append(h("div",{class:"uhead",html:`<span class="em">📖</span><div><h1>Word Bank</h1><div class="en">All Semester A vocabulary</div></div>`}));
  const all=[];THEMES.forEach(t=>{t.intro.forEach(v=>all.push([v[0],v[1],"",t]));t.units.forEach(u=>u.vocab.forEach(v=>all.push([v[0],v[1],v[2],t,u])));t.glossary.forEach(v=>all.push([v[0],v[1],v[2],t]));});

/* ===== grand challenge ===== */
function renderChallenge(app){
  app.append(h("div",{class:"uhead",html:`<span class="em">🏆</span><div><h1>Big Challenge</h1><div class="en">15 questions · 20 seconds each · all four themes</div></div>`}));
  const p=h("div",{class:"panel"});app.append(p);
  const bestC=S.best["challenge"];
  p.innerHTML=`<p>Random questions from every unit of Semester A. You have 20 seconds for each question. Fast correct answers earn bonus points!</p>${bestC!=null?`<p><b>Your best score: ${bestC}%</b></p>`:""}`;
  p.append(h("button",{class:"btn",onclick:start},"🚀 Start the challenge"));
  function start(){
    const pool=[];THEMES.forEach(t=>{t.units.forEach(u=>u.acts.filter(a=>a.type==="mcq").forEach(a=>a.q.forEach(q=>pool.push({...q,t,u}))));t.extras.forEach(x=>(x.acts||[]).filter(a=>a.type==="mcq").forEach(a=>a.q.forEach(q=>pool.push({...q,t,u:{en:x.en}})))) ;});
    const qs=shuffle(pool).slice(0,15);let n=0,score=0,bonus=0,timer,left;
    function show(){clearInterval(timer);const q=qs[n];setColor(q.t.color);p.innerHTML="";
      p.append(h("div",{style:"display:flex;justify-content:space-between;font-weight:700"},h("span",{},`Question ${n+1} / ${qs.length}`),h("span",{},`✅ ${score} · ⚡ ${bonus}`)));
      const bar=h("i",{style:"width:100%"});p.append(h("div",{class:"timer"},bar));
      p.append(h("div",{class:"tag",style:"margin-bottom:8px"},`${q.t.icon} ${q.t.en} · ${q.u.en}`));
      p.append(h("div",{class:"bigq en"},q.q));
      const o=h("div",{class:"bigopts en"});const order=shuffle(q.o.map((t,i)=>({t,i})));
      const bs=order.map(x=>h("button",{class:"opt",onclick:()=>pick(x.i)},x.t));o.append(...bs);p.append(o);
      left=20;timer=setInterval(()=>{left--;bar.style.width=(left/20*100)+"%";if(left<=0)pick(-1);},1000);
      function pick(i){clearInterval(timer);bs.forEach((b,k)=>{b.disabled=true;if(order[k].i===q.a)b.classList.add("ok");else if(order[k].i===i)b.classList.add("bad");});if(i===q.a){score++;if(left>=12)bonus++;sfx.ok();}else sfx.bad();
        setTimeout(()=>{n++;n<qs.length?show():end();},1100);}
    }
    function end(){setColor("--t2");const pct=Math.round(score/qs.length*100);record("challenge",pct,null);if(pct>=80){confetti(themeColor(THEMES[1]));sfx.stamp();}
      p.innerHTML=`<div style="text-align:center"><div class="score-big">${pct}%</div><p>You got ${score} out of ${qs.length} correct, with ${bonus} fast answers ⚡</p><p>${pct>=80?"🌟 Excellent! You're ready for the exam.":pct>=50?"👍 Good! Review the units where you made mistakes.":"💪 Keep going! Review the lessons and try again."}</p></div>`;
      p.append(h("div",{style:"display:flex;gap:10px;justify-content:center"},h("button",{class:"btn",onclick:start},"↺ New challenge"),h("button",{class:"btn ghost",onclick:()=>go("/")},"Home")));}
    show();
  }
}

<script>window.__NAV={"pre": [], "levels": ["a.tcard", "a.stop", "div.tabs button"]}</script><script>(function(){var N=window.__NAV,q=new URLSearchParams(location.search).get("go");if(!N||!q)return;
var P=q.split(".").map(Number);if(P.some(isNaN))return;
var steps=(N.pre||[]).map(function(p){return{sel:p.sel,idx:p.idx||0}}).concat(P.map(function(v,i){return{sel:N.levels[i],idx:v}}));
function vis(e){var r=e.getBoundingClientRect(),c=getComputedStyle(e);return r.width>4&&r.height>4&&c.visibility!=="hidden"&&c.display!=="none"}
function run(i){if(i>=steps.length)return;var s=steps[i],t=0;(function w(){var l=[].filter.call(document.querySelectorAll(s.sel),vis);
if(l.length>s.idx){l[s.idx].scrollIntoView({block:"center"});l[s.idx].click();setTimeout(function(){run(i+1)},700)}else if(t++<48)setTimeout(w,250)})()}
