ys to get more information."], "rule": "Question phrase + question word + listen!", "icon": "❓"}, {"type": "flip", "title": "Sound Bites: asking questions ❓ – examples", "cards": [{"front": "[[Do you think]] teenagers are forgetting their culture?", "icon": "💡", "back": "yes/no + opinion"}, {"front": "[[Why do you think]] fast food is popular?", "icon": "✨", "back": "reasons"}, {"front": "[[Can you give me some examples?]]", "icon": "🔎", "back": "examples"}, {"front": "[[What kind of]] changes? / [[What are the main areas?]]", "icon": "📌", "back": "details"}, {"front": "[[Is there anything that]] worries you? · [[How do you mean?]] · [[Can you tell me]] …?", "icon": "⭐", "back": "more information"}]}, {"type": "build", "title": "Build the question", "mode": "words", "items": [{"a": "Why do you like American movies?", "hint": "American movies? / Why / do you like", "emo": "🎬"}, {"a": "What kind of fast food do you like?", "hint": "do you like? / What kind of / fast food", "emo": "🍕"}, {"a": "Where do you buy your clothes?", "hint": "your clothes? / Where / do you buy", "emo": "👕"}, {"a": "Can you give me some examples?", "hint": "some examples? / Can you / give me", "emo": "📝"}], "icon": "🧱"}, {"type": "wheel", "title": "Interview your partner", "items": [{"q": "📱 your mobile phone", "a": "Why is your phone important to you? – Because I can talk to my friends and family."}, {"q": "👕 clothes", "a": "Where do you buy your clothes? – I buy them in the mall in Muscat."}, {"q": "🎧 music / nasheeds", "a": "What kind of music do you like? – I like Omani songs and nasheeds."}, {"q": "⚽ sport", "a": "Can you tell me about your favourite team? – It's Dhofar Club."}, {"q": "🎮 games", "a": "How many hours a day do you play? – About one hour after homework."}, {"q": "👨‍👩‍👦 family", "a": "Why is your family important to you? – They support me and give me advice."}], "icon": "🎤"}, {"type": "ask", "title": "Teenage opinions", "qs": [{"q": "“I'm in love with fast food.” Do you agree?", "a": "I like it, but I know it is not healthy every day."}, {"q": "“I can't live without the Internet.”", "a": "I agree – I use it for school and to talk to friends."}, {"q": "“My best friend is my mobile phone.”", "a": "I disagree. A phone can't be a real friend."}, {"q": "“My life is …” – write your own statement and explain it.", "a": "My life is football. I play every day and I want to play for Oman."}], "img": "L13_c4", "icon": "💬"}, {"type": "sort", "title": "Teenagers in Oman … agree or disagree?", "bins": [{"label": "Agree", "icon": "👍"}, {"label": "Disagree", "icon": "👎"}], "cards": [{"text": "too much Western media", "icon": "", "bin": 0}, {"text": "forgetting their culture", "icon": "", "bin": 1}, {"text": "too much hanging out", "icon": "", "bin": 0}, {"text": "too much money on fashion", "icon": "", "bin": 0}, {"text": "too much fast food", "icon": "", "bin": 0}, {"text": "drive too fast", "icon": "", "bin": 0}, {"text": "don't think about the future", "icon": "", "bin": 1}], "icon": "📏"}, {"type": "quiz", "title": "Fact file: fast food", "qs": [{"q": "Examples of Western fast food are …", "o": ["pizzas, burgers, fries", "shawarma, meeshkak", "rice and fish"], "a": 0}, {"q": "Examples of Arab fast food are …", "o": ["shawarma, meeshkak, salad, grilled chicken", "hot dogs", "pizzas"], "a": 0}, {"q": "Fast food is healthy or unhealthy depending on …", "o": ["how much fat and how the food is cooked", "the price", "the colour"], "a": 0}, {"q": "Where are Omani fast food outlets?", "o": ["on the street", "only in malls", "only at airports"], "a": 0}], "icon": "🍔"}, {"type": "race", "title": "Team race", "qs": [{"q": "Henna is part of …", "options": ["traditional Omani culture", "Western culture"], "a": 0}, {"q": "Ask for examples: …", "options": ["Can you give me some examples?", "Goodbye!", "I'm sorry."], "a": 0}, {"q": "‘How do you mean?’ asks for …", "options": ["more explanation", "the time", "a price"], "a": 0}, {"q": "‘Stylish jeans’ goes with …", "options": ["eating", "shopping"], "a": 1}, {"q": "Strongly agree = …", "options": ["1", "5"], "a": 0}, {"q": "Shawarma is … fast food.", "options": ["Arab", "Western"], "a": 0}], "icon": "🏎️"}, {"type": "steps", "title": "Let's remember!", "icon": "🧠", "steps": ["Omani culture: henna, dishdasha, souq, traditional dance, Omani food.", "Western influence: fast food, jeans, trainers, shopping malls.", "Ask: Do you think …? Why do you think …? Can you give me some examples?", "Give opinions: I agree / I strongly disagree because …"]}, {"type": "exit", "title": "Exit ticket", "items": [{"k": "3", "text": "Write two questions using Sound Bites phrases."}, {"k": "2", "text": "Is Western influence good or bad? One reason."}, {"k": "1", "text": "Name two things from traditional Omani culture."}], "icon": "🎟️"}, {"type": "homework", "title": "Homework", "head": "My homework", "items": ["WB p. 23 Act. 3: circle your opinions and write two sentences explaining them.", "Prepare a one-minute talk from a fact file (WB p. 23 Act. 4).", "Write five things that are important to you and why."], "icon": "🏠"}]}, {"id": "L14", "unit": "U2", "unitName": "Theme 2 · Those Teenage Things", "title": "Unit 5 · Teenage Angst (Writing)", "code": "", "theme": "city", "emo": "✉️", "slides": [{"type": "cover", "say": "Theme 2 · Unit 5 · Writing"}, {"type": "goals", "title": "Today's goals", "items": ["I can understand teenagers' letters to a problem page.", "I can match advice to problems."], "icon": "🎯"}, {"type": "goals", "title": "Today's goals", "items": ["I can proofread and edit with a simple correction code.", "I can write an informal letter to a problem page."], "icon": "🎯"}, {"type": "ask", "title": "Problem pages", "qs": [{"q": "What is a problem page?", "a": "A page in a magazine or newspaper where people write about their problems and an expert gives advice."}, {"q": "Why do teenagers write to problem pages?", "a": "Because they can ask for advice without giving their real name."}, {"q": "Look at the photos. What do you think each teenager is worried about?", "a": "Football, studying, and a career in fashion."}], "img": "L14_c1", "icon": "📰"}, {"type": "read", "title": "Letter A – Nabil", "paras": ["Dear Auntie,", "I'm a 16 year old boy and generally I enjoy my life. I'm good at my schoolwork and I get on well with most of my classmates."], "img": "L14_c1", "icon": "⚽"}, {"type": "read", "title": "Letter A – Nabil", "paras": ["However, things change when I play football with my friends. They are crazy about football. But I don't enjoy it at all. I make lots of mistakes. I'm also a bit [[overweight]] so I can't run as fast as my friends. Most of the time, my friends laugh and [[forgive]] my mistakes. But sometimes they get really angry with me."], "img": "L14_c1", "icon": "⚽"}, {"type": "read", "title": "Letter A – Nabil", "paras": ["I know this problem will happen many times. What can I do? Yours, Nabil"], "img": "L14_c1", "icon": "⚽"}, {"type": "read", "title": "Letters B and C – Taha and Munira", "paras": ["B: I used to be an excellent student. But now my marks have dropped in almost every subject. I know that I don't spend enough time on my homework. I find it very difficult to [[concentrate]] for more than a short time. I get [[distracted]] very easily. And when I sit in front of my computer, I get a headache. I'm under a lot of [[pressure]] from my parents to do well. – Taha"], "img": "L14_c1", "icon": "📚🎨"}, {"type": "read", "title": "Letters B and C – Taha and Munira", "paras": ["C: My parents keep telling me to decide what career I want. I'm only 15 and I think it's too early. My father is a doctor and he wants me to be a doctor too. But I'm more interested in art. Now I want to go to Italy and train to be a fashion designer. How can I make my father understand my career interests? – Munira"], "img": "L14_c1", "icon": "📚🎨"}, {"type": "match", "title": "What is each teenager worried about?", "pairs": [["Nabil (A) ⚽", "He doesn't enjoy football and his friends sometimes get angry with him."], ["Taha (B) 📚", "His marks have dropped; he can't concentrate on his homework."], ["Munira (C) 🎨", "Her father wants her to be a doctor, but she wants to be a fashion designer."]], "icon": "😟"}, {"type": "sort", "title": "The Counsellor's answers", "bins": [{"label": "A Nabil", "icon": ""}, {"label": "B Taha", "icon": ""}, {"label": "C Munira", "icon": ""}], "cards": [{"text": "2 Just watch your friends play.", "icon": "", "bin": 0}, {"text": "4 Go on a diet?", "icon": "", "bin": 0}, {"text": "7 Try another sport.", "icon": "", "bin": 0}, {"text": "1 Study place changed?", "icon": "", "bin": 1}, {"text": "6 Need glasses?", "icon": "", "bin": 1}, {"text": "8 Time limits for homework.", "icon": "", "bin": 1}, {"text": "3 More time to decide.", "icon": "", "bin": 2}, {"text": "5 Research fashion design.", "icon": "", "bin": 2}, {"text": "9 Talk to your father.", "icon": "", "bin": 2}], "icon": "💡"}, {"type": "explain", "title": "Checking for errors", "lines": ["Proofreading means looking for errors. Editing means correcting the errors.", "Use a simple correction code above each mistake."], "rule": "Proofread ➜ code ➜ edit", "icon": "✅"}, {"type": "flip", "title": "Checking for errors ✅ – examples", "cards": [{"front": "[[GR]] = grammar error: they doesn't ➜ they don't", "icon": "💡", "back": "Grammar"}, {"front": "[[Sp]] = spelling error: brithday ➜ birthday", "icon": "✨", "back": "Spelling"}, {"front": "[[Voc]] = wrong word: I support badly from acne ➜ I suffer badly", "icon": "🔎", "back": "Vocabulary"}, {"front": "[[WO]] = wrong word order: What I can do? ➜ What can I do?", "icon": "📌", "back": "Word order"}]}, {"type": "quiz", "title": "Find the error type", "qs": [{"q": "‘My parents tell me I worry too much. But they doesn't understand how I feel.’", "o": ["GR", "Sp", "WO"], "a": 0, "why": "they don't understand"}, {"q": "‘I want to have a party for my fiends.’", "o": ["Sp", "WO", "GR"], "a": 0, "why": "friends"}, {"q": "‘I want to good look for my party.’", "o": ["Voc", "WO", "Sp"], "a": 1, "why": "I want to look good"}, {"q": "‘I'm emailing you because I support badly from acne.’", "o": ["Voc", "Sp", "WO"], "a": 0, "why": "suffer"}], "icon": "🔍"}, {"type": "sort", "title": "Beginning or end?", "bins": [{"label": "Beginning", "icon": "👋"}, {"label": "End", "icon": "🔚"}, {"label": "Either", "icon": "↔️"}], "cards": [{"text": "Hi there!", "icon": "", "bin": 0}, {"text": "How are you?", "icon": "", "bin": 0}, {"text": "How are things with you?", "icon": "", "bin": 0}, {"text": "Sorry I haven't replied before, but …", "icon": "", "bin": 0}, {"text": "Take care, speak soon.", "icon": "", "bin": 1}, {"text": "Look after yourself.", "icon": "", "bin": 1}, {"text": "I can't wait to see you again.", "icon": "", "bin": 1}, {"text": "PS I'm attaching some photos.", "icon": "", "bin": 1}, {"text": "I really miss you!", "icon": "", "bin": 2}], "icon": "✉️"}, {"type": "quiz", "title": "Auntie's reply", "icon": "✏️", "qs": [{"q": "The ugly duckling grew up into a beautiful ___ .", "o": ["swan", "horse", "dragon"], "a": 0}, {"q": "Your acne will not last forever. One day it will ___ .", "o": ["disappear", "melt", "come back"], "a": 0}, {"q": "It's hard to be ___ , I know.", "o": ["patient", "cool", "angry"], "a": 0}, {"q": "You can't cure acne, but you can ___ it.", "o": ["treat", "mend", "fix"], "a": 0}, {"q": "Drink lots of water and eat a healthy ___ .", "o": ["diet", "meal", "food"], "a": 0}, {"q": "Above all, get plenty of ___ because your body needs rest.", "o": ["sleep", "food", "drink"], "a": 0}]}, {"type": "explain", "title": "A letter to a problem page: layout", "lines": ["Greeting ➜ Paragraph 1 ➜ Paragraph 2 ➜ Paragraph 3 ➜ Ending.", "Then check grammar, spelling and punctuation."], "rule": "Background ➜ problem ➜ ask for help", "icon": "📐"}, {"type": "flip", "title": "A letter to a problem page: layout 📐 – examples", "cards": [{"front": "[[Dear Auntie,]]", "icon": "💡", "back": "greeting"}, {"front": "[[I'm a 16 year old boy …]]", "icon": "✨", "back": "paragraph 1: background about yourself"}, {"front": "[[My problem is …]]", "icon": "🔎", "back": "paragraph 2: the problem and why it makes you unhappy"}, {"front": "[[I'm worried because … Can you help me?]]", "icon": "📌", "back": "paragraph 3: more details + ask for help"}, {"front": "[[Yours, Salim]]", "icon": "⭐", "back": "ending"}]}, {"type": "write", "title": "Write to Auntie", "task": "Write an informal letter to a problem page Auntie (100–120 words). Choose: you are worried about your schoolwork / you are not allowed to go out with your friends / you have lent a friend money but he hasn't paid it back – or another problem (real or imaginary).", "steps": ["Dear Auntie,", "Paragraph 1: who you are (age, school, family)", "Paragraph 2: My problem is … and why it makes you unhappy", "Paragraph 3: more details + Can you help me?", "Yours, + a name", "Proofread with the code GR / Sp / Voc / WO, then edit"], "words": ["I'm a … year old …", "generally", "However, …", "My problem is …", "I'm worried because …", "I don't know what to do.", "Can you help me?", "Yours,"], "model": "Dear Auntie,\nI'm a 16 year old boy from Ibri. I'm good at school and I have a lot of friends.\nHowever, I have a problem. Two months ago I lent my friend 20 riyals. He promised to pay me back after a week, but he hasn't paid it back yet. When I ask him, he changes the subject.\nI'm worried because I need the money, and I don't want to lose my friend. I don't know what to do. Can you help me?\nYours,\nWorried", "icon": "✍️"}, {"type": "race", "title": "Team race", "qs": [{"q": "Proofreading means …", "options": ["looking for errors", "correcting errors", "writing a title"], "a": 0}, {"q": "Editing means …", "options": ["correcting errors", "looking for errors", "reading quickly"], "a": 0}, {"q": "‘Sp’ means …", "options": ["spelling error", "speaking", "special"], "a": 0}, {"q": "‘Set yourself time limits’ is advice for …", "options": ["Nabil", "Taha", "Munira"], "a": 1}, {"q": "‘Hi there!’ goes at the …", "options": ["beginning", "end"], "a": 0}, {"q": "A problem-page letter ends with …", "options": ["Yours,", "Dear Auntie,", "PS"], "a": 0}], "icon": "🏎️"}, {"type": "steps", "title": "Let's remember!", "icon": "🧠", "steps": ["Problem-page letter: Dear Auntie ➜ background ➜ problem ➜ ask for help ➜ Yours,", "Advice: Why don't you …? Try and … Have you thought about …?", "Proofread (find) and edit (correct): GR, Sp, Voc, WO.", "Beginnings: Hi there! How are you? Endings: Take care, speak soon."]}, {"type": "exit", "title": "Exit ticket", "items": [{"k": "3", "text": "What is the difference between proofreading and editing?"}, {"k": "2", "text": "Write one piece of advice for Munira."}, {"k": "1", "text": "Correct: ‘What I can do? Please help me!’"}], "icon": "🎟️"}, {"type": "homework", "title": "Homework", "head": "My homework", "items": ["WB p. 24: rewrite Louise's e-mail correctly.", "WB p. 25 Act. 4: write the final draft of your letter.", "Swap letters with a partner and proofread with the code."], "icon": "🏠"}]}, {"id": "L15", "unit": "U2", "unitName": "Theme 2 · Those Teenage Things", "title": "Across Cultures: The USA & Joan of Arc", "code": "", "theme": "city", "emo": "🇺🇸", "slides": [{"type": "cover", "say": "Theme 2 · Across Cultures + Reading for Pleasure"}, {"type": "goals", "title": "Today's goals", "items": ["I can give key facts about the history and geography of the USA.", "I can put important American events in order."], "icon": "🎯"}, {"type": "goals", "title": "Today's goals", "items": ["I can compare transport in the USA and Oman.", "I can tell the story of a teenager who changed things."], "icon": "🎯"}, {"type": "mystery", "title": "Mystery country", "img": "L15_c1", "answer": "The United States of America 🇺🇸", "qs": [{"q": "Its capital is …", "o": ["Washington, D.C.", "New York"], "a": 0}, {"q": "It has … states.", "o": ["fifty", "thirteen"], "a": 0}, {"q": "Its national holiday is …", "o": ["4 July", "23 April"], "a": 0}, {"q": "Its currency is the …", "o": ["US dollar", "pound"], "a": 0}], "icon": "🕵️"}, {"type": "ask", "title": "USA fact file", "qs": [{"q": "Where is it?", "a": "North America, between the Pacific and Atlantic Oceans."}, {"q": "How big is it?", "a": "The third or fourth largest country by area, and the third largest by population (after China and India)."}, {"q": "What kind of country is it?", "a": "A democratic republic with an elected president and parliament (the United States Congress)."}, {"q": "What did immigrants believe about ‘the American Dream’?", "a": "That they could find gold and new opportunities, and everyone had a chance of becoming rich and successful."}], "img": "L15_c6", "icon": "📋"}, {"type": "order", "title": "American history in order", "items": ["The founding of New York – 1624", "Declaration of Independence – 1776", "Invention of the telephone – 1876", "First man on the moon – 1969", "The movie Titanic – 1997", "Hurricane Katrina – 2005"], "icon": "⏳"}, {"type": "match", "title": "Match the sentence halves", "pairs": [["The United States", "is part of the North American continent."], ["The city of New York", "was founded by the Dutch."], ["Mount McKinley", "is over six thousand metres high."]], "icon": "🧩"}, {"type": "match", "title": "Match the sentence halves", "pairs": [["Hurricane Katrina", "caused a lot of damage."], ["Thomas Edison", "developed the first movie camera."], ["The Empire State Building", "is in New York."]], "icon": "🧩"}, {"type": "match", "title": "Find the word", "pairs": [["a country governed by a president and elected representatives", "republic"], ["people who enter another country to live there permanently", "immigrants"], ["very fast strong winds that move over water", "hurricanes"]], "icon": "🔍"}, {"type": "match", "title": "Find the word", "pairs": [["big jump", "leap"], ["place where something starts", "source"], ["very tall modern city buildings", "skyscrapers"]], "icon": "🔍"}, {"type": "ask", "title": "Cultural Comparisons: transport in Oman", "qs": [{"q": "How many ways can a visitor arrive in Oman?", "a": "By plane (Muscat and Salalah airports), by road from the UAE, or by sea (cruise ships at Muscat port)."}, {"q": "How can people get around in cities in Oman?", "a": "By car, taxi or bus (for example Mwasalat buses in Muscat)."}, {"q": "What is the best way to travel between cities?", "a": "By car or by intercity bus; between Muscat and Salalah many people fly."}, {"q": "What kinds of transport may be planned for the future?", "a": "Maybe a railway (for example the Hafeet Rail link to the UAE), more buses and electric cars."}], "icon": "🚌✈️"}, {"type": "read", "title": "Joan of Arc (1412–1431)", "paras": ["Joan of Arc was a French [[peasant]] girl. She could not read or write, but she was strong, active and very brave. At the age of seventeen, she saved her country from the English."], "img": "L15_c4", "icon": "🛡️"}, {"type": "read", "title": "Joan of Arc (1412–1431)", "paras": ["At that time the English were stronger than the French and had captured many French towns. The city of Orléans was under [[siege]]: there was very little food and water."], "img": "L15_c4", "icon": "🛡️"}, {"type": "read", "title": "Joan of Arc (1412–1431)", "paras": ["Joan went to Orléans on 29 April 1429. ‘You must have [[courage]],’ she told the leaders of the French army. They attacked the English army and won a great victory. She became known as ‘the Maid of Orléans’."], "img": "L15_c4", "icon": "🛡️"}, {"type": "read", "title": "Joan of Arc (1412–1431)", "paras": ["In 1430 she was captured and sold to the English. After an unfair [[trial]], she died in 1431, at nineteen. In 1455 she was declared [[innocent]]. Today she is a national heroine in France."], "img": "L15_c4", "icon": "🛡️"}, {"type": "order", "title": "Joan's timeline", "items": ["1412 – born in a small village in France", "age 12 – decided to help France", "29 April ertisement", "qs": [{"q": "5 accommodation that disappears", "o": ["d", "b"], "a": 1, "why": "the hotel melts in early May!"}, {"q": "6 a variety of physical activities", "o": ["a", "c"], "a": 0, "why": "rafting, skydiving, hiking, snowboarding, canoeing"}, {"q": "7 visiting local markets", "o": ["e", "d"], "a": 0, "why": "take you to local markets"}], "icon": "🎯"}, {"type": "ask", "title": "Time to Talk", "qs": [{"q": "1 What are the benefits of foreign tourism to local people?", "a": "Jobs, money for the economy and awareness of other cultures."}, {"q": "What are the disadvantages?", "a": "It can change traditions and ways of thinking, and cause crowds and pollution."}, {"q": "2 Are the advantages greater? Give your reasons.", "a": "I think so, if tourism respects our traditions and environment."}], "icon": "🗣️"}, {"type": "sort", "title": "Traveller or tourist?", "bins": [{"label": "Traveller", "icon": "🧭"}, {"label": "Tourist", "icon": "📸"}], "cards": [{"text": "won't stay in five star hotels", "icon": "", "bin": 0}, {"text": "wants to discover new things", "icon": "", "bin": 0}, {"text": "makes his own travel arrangements", "icon": "", "bin": 0}, {"text": "wants a deeper understanding", "icon": "", "bin": 0}, {"text": "prefers to travel independently", "icon": "", "bin": 0}, {"text": "visits places already discovered", "icon": "", "bin": 1}, {"text": "takes photos of everything", "icon": "", "bin": 1}, {"text": "travels in groups with a guide", "icon": "", "bin": 1}, {"text": "likes to be comfortable", "icon": "", "bin": 1}, {"text": "no deep understanding needed", "icon": "", "bin": 1}], "icon": "🧭"}, {"type": "tf", "title": "Betty's postcard", "items": [{"text": "Betty is staying in a hotel by the beach.", "a": true, "fix": "Here is a picture showing our hotel by the beach."}, {"text": "Betty loves the local food.", "a": false, "fix": "So we don't like the food very much."}, {"text": "She found a restaurant with food just like back home.", "a": true, "fix": " tions, offers, promises and quick decisions."], "icon": "🎯"}, {"type": "goals", "title": "Today's goals", "items": ["I can use going to for plans and the present continuous for arrangements.", "I can talk about my holiday plans."], "icon": "🎯"}, {"type": "ask", "title": "Dubai ➜ Salalah", "qs": [{"q": "How can you travel from Dubai to Salalah?", "a": "By bus, by car or by plane."}, {"q": "Which is faster? Which is cheaper?", "a": "The plane is faster; the bus is usually cheaper."}, {"q": "Which would you choose? Why?", "a": "I would fly because the flight is only two hours."}], "img": "L19_c1", "icon": "🗺️"}, {"type": "sort", "title": "Bus or plane?", "bins": [{"label": "Bus brochure", "icon": "🚌"}, {"label": "Plane brochure", "icon": "✈️"}], "cards": [{"text": "c board your luxury bus at Dubai bus station", "icon": "", "bin": 0}, {"text": "e border control post – travel permit", "icon": "", "bin": 0}, {"text": "g refreshment stop in Nizwa", "icon": "", "bin": 0}, {"text": "b lunch in Hayma, arriving in Salalah 6.45pm", "icon": "", "bin": 0}, {"text": "f a chauffeur-driven car at 7:10 am", "icon": "", "bin": 1}, {"text": "h Flight SF698 at 9:30 am", "icon": "", "bin": 1}, {"text": "a the two-hour flight – the Empty Quarter", "icon": "", "bin": 1}, {"text": "d met by a representative of Dhofar Heights", "icon": "", "bin": 1}], "icon": "🗂️"}, {"type": "order", "title": "Put the bus trip in order", "items": ["c Board the bus in Deira at 7.30am.", "e Pass through the border control post.", "g Refreshment stop in Nizwa.", "b Lunch in Hayma, Thumrait 6pm, Salalah 6.45pm."], "icon": "🚌"}, {"type": "order", "title": "Put the flight in order", "items": ["f A car picks you up at your hotel at 7:10 am.", "h Depart on Speedy Flight SF698 at 9:30 am.", "a The two-hour flight: Dubai, the Hajar mountains, the Rub al Khali.", "d Met at Salalah Airport and driven to the five-star resort."], "icon": "✈️"}, {"type": "ask", "title": "The answering-machine message", "qs": [{"q": "Look at pictures 1–5. What will the traveller do on his drive to Salalah?", "a": "Predict from the pictures: car, border, fort, petrol, hotel … 🎧 (recording not available)"}, {"q": "a The traveller's name is Steve. b He has a small car. c He will set out in the late morning.", "a": "Predict T / F / NG and give a reason."}, {"q": "d He will cross the border at Al Ain. e He will get a visa at the border. f He will visit the fort in Bahla.", "a": "Predict T / F / NG. Which future form is in each sentence?"}, {"q": "Find three sentences that show different ways of expressing the future.", "a": "e.g. He is going to set out … / He will visit … / He is planning to see …"}], "img": "L19_c2", "icon": "📞"}, {"type": "explain", "title": "Grammar Recall: the future", "icon": "🔮", "lines": ["will / won't: prediction, offers and promises, quick decisions.", "going to: plans and intentions.", "present continuous: arrangements in the future."], "rule": "will = predict / offer / decide now · going to = plan · present continuous = arrangement"}, {"type": "flip", "title": "Grammar Recall: the future 🔮 – examples", "cards": [{"front": "Perhaps people [[won't send]] letters in the future.", "icon": "💡", "back": "prediction 🔮"}, {"front": "[[I'll help]] you do your homework.", "icon": "✨", "back": "offer / promise 🤝"}, {"front": "[[I'm going to watch]] TV then go to bed.", "icon": "🔎", "back": "plan 📝"}, {"front": "[[I'm meeting]] my brother for lunch tomorrow.", "icon": "📌", "back": "arrangement 📅"}]}, {"type": "match", "title": "Sentence ➜ usage", "pairs": [["I'm meeting my brother for lunch tomorrow.", "arrangement (present continuous)"], ["Do you think England will win the World Cup?", "prediction (will)"], ["I'm going to watch TV then go to bed.", "plan / intention (going to)"], ["Which pen do you want? I'll have the blue one.", "decision made now (will)"], ["I'll help you do your homework.", "offer / promise (will)"]], "icon": "🧩"}, {"type": "quiz", "title": "Choose the best form", "icon": "✏️", "qs": [{"q": "We ___ to Dubai at the weekend. Do you want to come?", "o": ["will go", "’re going to go"], "a": 1}, {"q": "What do you think ___ in the next ten years?", "o": ["is happening", "will happen"], "a": 1}, {"q": "I can't come tomorrow because I ___ my parents.", "o": ["will visit", "’m visiting"], "a": 1}, {"q": "I promise I ___ harder next year.", "o": ["’ll work", "am working"], "a": 0}]}, {"type": "quiz", "title": "Choose the best form", "icon": "✏️", "qs": [{"q": "That man is driving too fast. He ___ an accident.", "o": ["is having", "’s going to have"], "a": 1}, {"q": "Machines ___ people.", "o": ["won't replace", "are not replacing"], "a": 0}, {"q": "She ___ her friend later today.", "o": ["will meet", "’s meeting"], "a": 1}]}, {"type": "build", "title": "Activate: preparing for a holiday", "mode": "words", "items": [{"a": "We need to buy the plane tickets.", "hint": "the plane tickets. / We need / to buy", "emo": "🎫"}, {"a": "I'm going into town on Wednesday, I'll get them then.", "hint": "I'll get them then. / I'm going into town / on Wednesday,", "emo": "🏙️"}, {"a": "I'm going to the bank on Thursday. I'll change it then.", "hint": "I'll change it then. / on Thursday. / I'm going to the bank", "emo": "🏦"}], "icon": "🧳"}, {"type": "ask", "title": "Tour to Nizwa, Sinaw, the Wahiba Sands and Sur", "qs": [{"q": "a Where will the tour start?", "a": "In Muscat (at 8.30 on Thursday morning)."}, {"q": "b What will the tourists see on Thursday afternoon?", "a": "Nizwa Fort."}, {"q": "c Where will they stay on Thursday night?", "a": "In a hotel in Nizwa."}], "img": "L19_c4", "icon": "🏜️"}, {"type": "ask", "title": "Tour to Nizwa, Sinaw, the Wahiba Sands and Sur", "qs": [{"q": "d When will they arrive at the Wahiba Sands?", "a": "On Friday afternoon."}, {"q": "e What town will they visit on the third day?", "a": "Sur."}, {"q": "f When will they return to Muscat?", "a": "On Saturday afternoon, along the coast."}], "icon": "🏜️"}, {"type": "wheel", "title": "Tour of Oman", "items": [{"q": "1 The Souk at Nizwa (see/buy)", "a": "In the souk you will see and buy local pottery."}, {"q": "2 The fort at Nizwa (go inside/learn about)", "a": "We will go inside the fort and learn about its history. It was built in 1660."}, {"q": "3 The Souk at Sinaw (see/meet/buy)", "a": "You can see and meet local people and buy things."}, {"q": "4 The Wahiba Sands (walk/ride)", "a": "We will walk on the dunes and ride camels."}, {"q": "5 A boatyard at Sur (see)", "a": "You will see how wooden dhows are made."}, {"q": "6 A beach on the coast road (stop/swim)", "a": "We will stop at a beach and swim."}], "icon": "🎡"}, {"type": "balloons", "title": "Pop the right future!", "rounds": [{"q": "Look at those clouds. I think …", "o": ["it's going to rain", "it's raining tomorrow"], "a": 0}, {"q": "___ anything on Tuesday? There's a good film.", "o": ["Are you doing", "Will you do"], "a": 0}, {"q": "No, I've changed my mind. ___ the beef instead.", "o": ["I'll have", "I am having"], "a": 0}], "icon": "🎈"}, {"type": "balloons", "title": "Pop the right future!", "rounds": [{"q": "___ to buy a new car next month.", "o": ["They are planning", "They will plan"], "a": 0}, {"q": "I'm sure ___ the holiday competition.", "o": ["you'll win", "you are winning"], "a": 0}, {"q": "If you turn on the TV, ___ your homework.", "o": ["you are not finishing", "you won't finish"], "a": 1}], "icon": "🎈"}, {"type": "summary", "title": "Let's remember!", "center": "Unit 2 · Getting There (Grammar)", "branches": ["will / won't: prediction, offer, promise, quick decision.", "going to: plans and intentions.", "present continuous: future arrangements (time + place fixed)."], "icon": "🧠"}, {"type": "exit", "title": "Exit ticket", "items": [{"k": "3", "text": "Write a prediction about Oman in 2040 (will)."}, {"k": "2", "text": "Write one plan for the weekend (going to)."}, {"k": "1", "text": "Write one arrangement for tomorrow (present continuous)."}], "icon": "🎟️"}, {"type": "homework", "title": "Homework", "head": "My homework", "items": ["WB p. 33 Act. 3–4: Planning a Summer Holiday + write about your partner's holiday.", "WB p. 66 Grammar Practice Act. 1 and 3.", "WB p. 32 Act. 2: describe the Tour of Oman (use the pictures on WB p. 61)."], "icon": "🏠"}]}, {"id": "L20", "unit": "U3", "unitName": "Theme 3 · Travellers and Tourists", "title": "Unit 3 · Destinations (Vocabulary)", "code": "", "theme": "library", "emo": "🏝️", "slides": [{"type": "cover", "say": "Theme 3 · Unit 3 · Vocabulary"}, {"type": "goals", "title": "Today's goals", "items": ["I can match brochures to holidaymakers.", "I can use brochure adjectives: five-star, lively, unspoilt, vibrant …"], "icon": "🎯"}, {"type": "goals", "title": "Today's goals", "items": ["I can learn new words as phrases.", "I can choose a hotel in a role play."], "icon": "🎯"}, {"type": "riddle", "title": "Guess the destination", "items": [{"clues": ["I am a city in the south of Oman.", "I am green in the Khareef.", "Many tourists come in summer."], "a": "Salalah", "emo": "🌧️"}, {"clues": ["I am made of sand.", "Bedouin live here.", "You can ride camels on my dunes."], "a": "the Wahiba Sands", "emo": "🐪"}, {"clues": ["I am a town by the sea.", "I am famous for building dhows.", "Turtles visit Ras Al Jinz near me."], "a": "Sur", "emo": "⛵"}, {"clues": ["I have an old fort and a famous souk.", "My fort has a big round tower.", "I am inland, near Jebel Akhdar."], "a": "Nizwa", "emo": "🏰"}], "icon": "🕵️"}, {"type": "ask", "title": "Four brochures", "qs": [{"q": "What can you see on the four brochures?", "a": "A luxury hotel, an island resort, a rainforest and a city at night."}, {"q": "Which brochure would you pick up? Why?", "a": "The rainforest one, because I love nature."}], "img": "L20_c1", "icon": "📕"}, {"type": "match", "title": "Brochure ➜ holidaymakers", "pairs": [["a ‘Where only the best is good enough’", "3 middle-aged couple: top quality, luxury"], ["b ‘Come away with us to paradise’", er."], "rule": "adjective + noun = a phrase to learn"}, {"type": "flip", "title": "Top tip: learn phrases 🔑 – examples", "cards": [{"front": "[[rolling]] sand dunes", "icon": "💡", "back": "🏜️ Wahiba Sands"}, {"front": "[[busy]] souks", "icon": "✨", "back": "🛍️ Muttrah Souk"}, {"front": "[[wooden]] dhows", "icon": "🔎", "back": "⛵ Sur"}, {"front": "[[expert]] craftsmen", "icon": "📌", "back": "🏺 Bahla pottery"}]}, {"type": "match", "title": "Phrases for places in Oman", "pairs": [["rolling sand dunes", "the Wahiba Sands 🐪"], ["busy souks", "Muttrah 🛍️"], ["old forts", "Nizwa and Bahla 🏰"]], "icon": "🇴🇲"}, {"type": "match", "title": "Phrases for places in Oman", "pairs": [["wooden dhows", "Sur ⛵"], ["high mountains", "Jebel Shams ⛰️"], ["variety of wildlife", "Ras Al Jinz turtles 🐢"]], "icon": "🇴🇲"}, {"type": "quiz", "title": "Postcard A: a great holiday", "icon": "✏️", "qs": [{"q": "We are having a ___ time in New Zealand.", "o": ["fantastic", "dreadful"], "a": 0}, {"q": "What an ___ place!", "o": ["amazing", "awful"], "a": 0}, {"q": "The scenery is absolutely ___ .", "o": ["stunning", "boring"], "a": 0}, {"q": "Bungee jumping was very ___ .", "o": ["dull", "thrilling"], "a": 1}, {"q": "The food is ___ .", "o": ["horrible", "delicious"], "a": 1}]}, {"type": "quiz", "title": "Postcard B: a miserable holiday", "icon": "✏️", "qs": [{"q": "We are having a ___ time in Vietnam.", "o": ["terrible", "marvellous"], "a": 0}, {"q": "Our hotel is very ___ .", "o": ["noisy", "relaxing"], "a": 0}, {"q": "The food is absolutely ___ .", "o": ["tasty", "disgusting"], "a": 1}, {"q": "The streets are always ___ .", "o": ["crowded", "quiet"], "a": 0}, {"q": "Our guide's English was ___ to understand.", "o": ["impossible", "easy"], "a": 0}]}, {"type": "memory", "title": "Verb memory", "pairs": [["encounter", "meet, come across"], ["stroll", "walk in a slow relaxed way"], ["reveal", "show, make known"], ["discover", "find someone or something"], ["wander", "walk around without clear direction"], ["sample", "try something"]], "icon": "🧠"}, {"type": "ask", "title": "Role play: choosing a hotel", "qs": [{"q": "Student A: describe your hotel (location, beach, sports, restaurants).", "a": "Welcome to Sea Breeze Hotel! We are on a secluded beach with a five-star restaurant and a pool."}, {"q": "Students B and C: ask about the facilities.", "a": "Is the hotel near the beach? Is there easy local transport? Do you have a swimming pool?"}, {"q": "Decide: is it a good place for you?", "a": "Yes, it is perfect for us because it is quiet and has a pool for the children."}], "img": "L20_c2", "icon": "🏨"}, {"type": "race", "title": "Team race", "qs": [{"q": "A honeymoon couple wants a … holiday.", "options": ["lively", "romantic"], "a": 1}, {"q": "Friends in a big city want somewhere …", "options": ["secluded", "lively"], "a": 1}, {"q": "‘stroll’ means …", "options": ["run fast", "walk slowly"], "a": 1}, {"q": "‘sample’ the food means …", "options": ["cook it", "try it"], "a": 1}, {"q": "Best way to learn new words:", "options": ["in phrases", "one letter at a time"], "a": 0}, {"q": "‘rolling sand dunes’ – where?", "options": ["Muttrah Corniche", "the Wahiba Sands"], "a": 1}], "icon": "🏎️"}, {"type": "steps", "title": "Let's remember!", "icon": "🧠", "steps": ["Brochure adjectives persuade: five-star, luxurious, secluded, unspoilt, lively, vibrant …", "Learn phrases: rolling sand dunes, busy souks, wooden dhows.", "Verbs: encounter, stroll, reveal, discover, wander, sample."]}, {"type": "exit", "title": "Exit ticket", "items": [{"k": "3", "text": "Write two adjectives for a luxury hotel."}, {"k": "2", "text": "Write a phrase for a place in Oman."}, {"k": "1", "text": "What does ‘wander’ mean?"}], "icon": "🎟️"}, {"type": "homework", "title": "Homework", "head": "My homework", "items": ["WB p. 35 Act. 3: complete the crossword.", "WB p. 35 Act. 4: describe a place you know well in Oman (first draft).", "Write your own postcard about a place you enjoyed (WB p. 34 Act. 2)."], "icon": "🏠"}]}, {"id": "L21", "unit": "U3", "unitName": "Theme 3 · Travellers and Tourists", "title": "Unit 4 · Tourist Information (Listening and Speaking)", "code": "", "theme": "library", "emo": "ℹ️", "slides": [{"type": "cover", "say": "Theme 3 · Unit 4 · Listening and Speaking"}, {"type": "goals", "title": "Today's goals", "items": ["I can read about ten tourist sites in Dhofar.", "I can make suggestions: Why don't you …? How about …?"], "icon": "🎯"}, {"type": "goals", "title": "Today's goals", "items": ["I can respond: Good idea. / I'd rather …", "I can give a short presentation for or against a tourist resort."], "icon": "🎯"}, {"type": "enter", "title": "Catch only the places in Dhofar.", "gate": "✓", "items": [{"text": "Al Balid", "in": true}, {"text": "Barka", "in": false}, {"text": "Ibra", "in": false}, {"text": "Sadah", "in": true}, {"text": "Taqah", "in": true}, {"text": "Sohar", "in": false}]}, {"type": "ask", "title": "Have you visited Dhofar?", "qs": [{"q": "What is the Khareef?", "a": "The monsoon season in Dhofar in summer: rain, mist and green mountains."}, {"q": "Which place in Dhofar would you like to visit? Why?", "a": "Wadi Darbat, because of its waterfalls and lakes."}], "img": "L21_c3", "icon": "🌧️"}, {"type": "ask", "title": "Sites 1–2: history and birds", "qs": [{"q": "Al Balid: what have archaeological digs revealed?", "a": "Remains of a large mosque and several other buildings; pottery from Persia, coins and porcelain from China."}, {"q": "Tawi Attair: how big is the sinkhole?", "a": "Over 100 metres wide and 220 metres deep."}, {"q": "Why is it called ‘the Well of Birds’?", "a": "Many species of birds fly in and out of it during the Khareef."}], "img": "L21_c1", "icon": "🏛️🐦"}, {"type": "ask", "title": "Sites 3–4: Khor Rori and Wadi Darbat", "qs": [{"q": "What is Sumharam?", "a": "A lost walled town – the port at the southern end of the famous ‘Incense Trail’."}, {"q": "What else is Khor Rori good for?", "a": "It is one of the best places in Dhofar to study birdlife."}, {"q": "What can you see at Wadi Darbat in the Khareef?", "a": "A 100 metre waterfall and many caves."}], "img": "L21_c2", "icon": "💧"}, {"type": "ask", "title": "Sites 5–10: beaches, forts and a museum", "qs": [{"q": "Mughsayl: what do the blowholes do?", "a": "They shoot fountains of water 30 metres high."}, {"q": "Taqah: what is the town famous for?", "a": "Its pottery and silverwork; the fort is famous for its wooden doors and screens."}, {"q": "Mirbat: what was it known for in the 9th century CE?", "a": "The breeding of horses."}, {"q": "Salalah Museum: what can you see there?", "a": "Artefacts from archaeological sites and traditional arts and crafts."}], "img": "L21_c4", "icon": "🏖️"}, {"type": "quiz", "title": "Which tourists?", "qs": [{"q": "a Tourists interested in archaeology:", "o": ["1 Al Balid · 3 Khor Rori · 10 Salalah Museum", "5 Mughsayl · 6 Sadah · 7 Taqah"], "a": 0}, {"q": "b Tourists who like birdwatching:", "o": ["4 · 8 · 9", "2 Tawi Attair · 3 Khor Rori · 5 Mughsayl"], "a": 1}, {"q": "c Tourists who love nature:", "o": ["2 Tawi Attair · 4 Wadi Darbat · 8 Jarzeez Springs", "1 · 9 · 10"], "a": 0}, {"q": "d Tourists who enjoy historical buildings:", "o": ["2 · 4 · 8", "6 Sadah · 7 Taqah · 9 Mirbat (forts)"], "a": 1}, {"q": "e Beach lovers:", "o": ["5 Mughsayl · 6 Sadah · 7 Taqah", "1 · 3 · 10"], "a": 0}], "icon": "🎯"}, {"type": "explain", "title": "Sound Bites: suggestions", "icon": "💬", "lines": ["Also: You might like to … / If I were you, I'd …", "Respond: Good idea. / I'd prefer to … / I'd rather … / Let's … instead."], "rule": "How about + -ing · Why don't you + verb · I'd rather + verb"}, {"type": "flip", "title": "Sound Bites: suggestions 💡 – examples", "cards": [{"front": "[[May I suggest that]] first you take them to visit Salalah Museum.", "icon": "💡", "back": "💡"}, {"front": "[[Why don't you]] visit Khor Rori with them?", "icon": "✨", "back": "💡"}, {"front": "[[How about]] taking them to Taqah to visit the fort?", "icon": "🔎", "back": "💡 + -ing"}, {"front": "[[I'd rather]] go on Thursday. / [[Let's]] go diving [[instead]].", "icon": "📌", "back": "🔄"}]}, {"type": "build", "title": "Build the suggestion", "mode": "words", "items": [{"a": "Why don't you visit Wadi Darbat?", "hint": "visit / Why don't you / Wadi Darbat?", "emo": "💧"}, {"a": "How about taking them to Mirbat?", "hint": "taking them / How about / to Mirbat?", "emo": "🏰"}, {"a": "If I were you, I'd go to Mughsayl.", "hint": "I'd go / If I were you, / to Mughsayl.", "emo": "🌊"}, {"a": "I'd rather go on Thursday.", "hint": "go / I'd rather / on Thursday.", "emo": "📅"}], "icon": "🧱"}, {"type": "ask", "title": "Role play: the Tourist Information Centre", "qs": [{"q": "A/B: We have two days in Dhofar. What do you suggest?", "a": "C: May I suggest that first you visit Salalah Museum? Then how about going to Taqah to see the fort?"}, {"q": "A/B: We love nature.", "a": "C: Why don't you visit Wadi Darbat or Jarzeez Springs? You can picnic there."}, {"q": "A/B: respond and decide.", "a": "Good idea! But I'd rather go to the wadi on Thursday. Let's go diving at Sadah instead today."}], "img": "L21_c5", "icon": "🎭"}, {"type": "ask", "title": "The tour guide 🎧 (predict)", "qs": [{"q": "fort, bird sanctuary, museum, beach or mountain? Describe one and let your partner guess.", "a": "e.g. ‘It has tall walls and wooden doors.’ ➜ a fort."}, {"q": "A woman asks for activities for her family. Who might be in the family?", "a": "Predict: husband, son, parents … (check with the recording if your teacher has it)."}, {"q": "Which place would you suggest for a child? for a grandfather?", "a": "For a child: Mughsayl blowholes. For a grandfather: Salalah Museum."}]}, {"type": "ask", "title": "Mustaqbal Island project", "qs": [{"q": "Group A: Where? Who for?", "a": "A quiet fishing village in the west – a watersports/adventure centre for groups of young people."}, {"q": "Group B: Where? Who for?", "a": "Near the beaches in the south-west (no roads) – a luxury resort for older tourists."}, {"q": "Group C: Where? Who for?", "a": "Near the mouth of the river in the east – eco-friendly tourism, birds and hiking trails."}, {"q": "Group D: Who are you?", "a": "Islanders: village elder, fisherman, bird expert, historian, conservationist, local poet, shopkeeper …"}], "img": "L21_c6", "icon": "🏝️"}, {"type": "explain", "title": "Giving a presentation", "icon": "🎤", "lines": ["Introduce yourself and your topic.", "Give advantages and disadvantages; justify your choices.", "Conclude, invite questions, thank your audience."], "rule": "Intro ➜ points ➜ pros & cons ➜ conclusion ➜ questions ➜ thanks"}, {"type": "flip", "title": "Giving a presentation 🎤 – examples", "cards": [{"front": "[[Today, I'm going to]] talk about our eco-resort.", "icon": "💡", "back": "1"}, {"front": "[[First of all I'd like to]] … [[Then I'll talk about]] …", "icon": "✨", "back": "2"}, {"front": "[[The main advantage]] … [[A disadvantage is]] … [[However]] …", "icon": "🔎", "back": "3"}, {"front": "[[To sum up]] … / [[In conclusion]] …", "icon": "📌", "back": "4"}]}, {"type": "sort", "title": "For or against?", "bins": [{"label": "Support", "icon": "👍"}, {"label": "Object", "icon": "👎"}], "cards": [{"text": "new jobs for teenagers", "icon": "", "bin": 0}, {"text": "more customers for local businesses", "icon": "", "bin": 0}, {"text": "better standard of living", "icon": "", "bin": 0}, {"text": "pollution", "icon": "", "bin": 1}, {"text": "visual impact", "icon": "", "bin": 1}, {"text": "strangers on the island", "icon": "", "bin": 1}, {"text": "change of character of the island", "icon": "", "bin": 1}, {"text": "impact on the environment", "icon": "", "bin": 1}], "icon": "⚖️"}, {"type": "race", "title": "Team race", "qs": [{"q": "How about ___ to Taqah?", "options": ["go", "going"], "a": 1}, {"q": "Why don't you ___ Khor Rori?", "options": ["visiting", "visit"], "a": 1}, {"q": "Blowholes shoot water 30 m high at …", "options": ["Mirbat", "Mughsayl"], "a": 1}, {"q": "‘The Well of Birds’ is …", "options": ["Tawi Attair", "Al Balid"], "a": 0}, {"q": "Sumharam was a port on the …", "options": ["Incense Trail", "Silk Road"], "a": 0}, {"q": "End a presentation with …", "options": ["First of all …", "To sum up …"], "a": 1}], "icon": "🏎️"}, {"type": "steps", "title": "Let's remember!", "icon": "🧠", "steps": ["Dhofar: Al Balid, Tawi Attair, Khor Rori, Wadi Darbat, Mughsayl, Sadah, Taqah, Jarzeez, Mirbat, Salalah Museum.", "Suggest: Why don't you …? How about + -ing? If I were you, I'd …", "Respond: Good idea. / I'd rather … / Let's … instead."]}, {"type": "exit", "title": "Exit ticket", "items": [{"k": "3", "text": "Suggest a place in Dhofar to a friend (two ways)."}, {"k": "2", "text": "Respond to: ‘How about going to the museum?’"}, {"k": "1", "text": "Name one advantage and one disadvantage of a new resort."}], "icon": "🎟️"}, {"type": "homework", "title": "Homework", "head": "My homework", "items": ["WB p. 37 Act. 6: write notes for your role (Mustaqbal Island).", "Prepare your group presentation using the phrases on CB p. 66."], "icon": "🏠"}]}, {"id": "L22", "unit": "U3", "unitName": "Theme 3 · Travellers and Tourists", "title": "Unit 5 · Designing a Tour (Writing)", "code": "", "theme": "library", "emo": "🕌", "slides": [{"type": "cover", "say": "Theme 3 · Unit 5 · Writing"}, {"type": "goals", "title": "Today's goals", "items": ["I can discuss why people travel.", "I can complete a tour description with the right words."], "icon": "🎯"}, {"type": "goals", "title": "Today's goals", "items": ["I can plan an itinerary for visitors to Oman.", "I can write a description of a desert tour."], "icon": "🎯"}, {"type": "ask", "title": "Why do people travel?", "qs": [{"q": "a Why do people travel to other countries?", "a": "To relax, to learn about other cultures, to see famous places, for work or to visit family."}, {"q": "b Which countries would you like to visit? Why?", "a": "I'd like to visit Turkey because of its history and food."}, {"q": "c What would you like to see and do there?", "a": "I'd like to see the old mosques and take a boat trip."}], "img": "L22_c1", "icon": "🌍"}, {"type": "quiz", "title": "Tours in and around Istanbul", "qs": [{"q": "Which tour includes lunch at a famous fish restaurant?", "o": ["Boat trip up the Bosphorus", "Bazaar tour"], "a": 0}, {"q": "Which tour includes over 4000 shops?", "o": ["Istanbul by night", "Bazaar tour"], "a": 1}, {"q": "Which tour visits Topkapi Palace?", "o": ["Walking tour of Sultanahmet", "Boat trip"], "a": 0}, {"q": "Which tour has traditional music and dancing?", "o": ["Bazaar tour", "Istanbul by night"], "a": 1}], "icon": "🇹🇷"}, {"type": "quiz", "title": "Walking Tour of Sultanahmet (1–4)", "icon": "✏️", "qs": [{"q": "The best way of seeing it is on (1) ___ .", "o": ["tiles", "desserts", "foot"], "a": 2}, {"q": "… all within (2) ___ walking distance.", "o": ["easy", "historical", "emerald"], "a": 0}, {"q": "This museum (3) ___ many ornaments and jewels …", "o": ["wander", "foot", "contains"], "a": 2}, {"q": "… including the biggest (4) ___ in the world.", "o": ["tiles", "easy", "emerald"], "a": 2}]}, {"type": "quiz", "title": "Walking Tour of Sultanahmet (5–8)", "icon": "✏️", "qs": [{"q": "Aya Sofia, one of the most famous (5) ___ buildings in Istanbul.", "o": ["easy", "historical"], "a": 1}, {"q": "… the thousands of blue (6) ___ on the inside of its walls.", "o": ["tiles", "desserts"], "a": 0}, {"q": "You will have the chance to (7) ___ around and do some shopping.", "o": ["contains", "wander"], "a": 1}, {"q": "… meat, fish, salad and wonderful (8) ___ .", "o": ["emerald", "desserts"], "a": 1}]}, {"type": "order", "title": "Follow the tour", "items": ["9 a.m. Topkapi Palace and Topkapi Museum", "Aya Sofia", "The Blue Mosque", "The Arasta Bazaar", "Lunch in a Turkish restaurant"], "icon": "🗺️"}, {"type": "explain", "title": "How a tour description works", "icon": "📝", "lines": ["Start: the place and the best way to see it.", "Then: stops in order with times and what you will see.", "End: the final stop (lunch, shopping …)."], "rule": "place ➜ stops in order (will) ➜ final stop"}, {"type": "flip", "title": "How a tour description works 🧩 – examples", "cards": [{"front": "Our tour [[starts at]] 9 a.m. at Topkapi Palace.", "icon": "💡", "back": "time ⏰"}, {"front": "[[From]] Topkapi, [[it is a short walk to]] Aya Sofia.", "icon": "✨", "back": "linking 🔗"}, {"front": "Here [[you will have the chance to]] wander around.", "icon": "🔎", "back": "future 🔮"}, {"front": "Our [[final stop]] will be lunch.", "icon": "📌", "back": "end 🏁"}]}, {"type": "read", "title": "Desert Adventure", "paras": ["Our company, Desert Adventure, arranges tours for people who want to experience an [[overnight stay]] in the Omani desert.", "We have a [[permanent campsite]] in the Wahiba Sands, approximately two and a half hours from Muscat.", "Visitors stay in small [[huts]] with modern bathrooms. Dinner and breakfast are included in the price. In addition, the company offers a range of fun desert activities."], "icon": "🏜️"}, {"type": "sort", "title": "Four headings", "bins": [{"label": "Wahiba Sands", "icon": "🏜️"}, {"label": "the Bedouin", "icon": "👥"}, {"label": "the camp", "icon": "⛺"}, {"label": "desert activities", "icon": "🐪"}], "cards": [{"text": "modern bathrooms", "icon": "", "bin": 2}, {"text": "home of the Bedouin", "icon": "", "bin": 0}, {"text": "sand skiing", "icon": "", "bin": 3}, {"text": "traditional crafts", "icon": "", "bin": 1}, {"text": "comfortable huts", "icon": "", "bin": 2}, {"text": "rolling sand dunes", "icon": "", "bin": 0}, {"text": "peaceful beauty", "icon": "", "bin": 0}, {"text": "desert people", "icon": "", "bin": 1}, {"text": "dune driving", "icon": "", "bin": 3}, {"text": "simple lifestyle", "icon": "", "bin": 1}], "icon": "🗂️"}, {"type": "match", "title": "Adjective + noun", "pairs": [["wooden / furnished", "huts 🛖"], ["friendly / experienced", "guides 🧑‍🦱"], ["thrilling / fun", "activities 🏄"], ["spectacular / dramatic", "views 🌄"]], "icon": "🧩"}, {"type": "write", "title": "Write: a tour for Mr and Mrs Smith", "task": "Mr and Mrs Smith are visiting Oman for the first time. Describe a Desert Adventure tour of the Wahiba Sands.", "steps": ["Paragraph 1: Desert Adventure is a company which arranges …", "Paragraph 2: The Wahiba Sands Desert is an area of peaceful beauty. You can see …", "Paragraph 3: The camp consists of huts made of wood. There is …", "Paragraph 4: There are many activities for visitors. You can …", "Use adjectives and examples: such as, including, for example."], "words": ["friendly Bedouin", "dramatic scenery", "thrilling activities", "spacious huts", "such as", "including", "for example", "rolling sand dunes"], "model": "Desert Adventure is a company which arranges overnight stays in the Omani desert. The Wahiba Sands Desert is an area of peaceful beauty. You can see rolling sand dunes and meet friendly Bedouin with their simple lifestyle. The camp consists of comfortable huts made of wood, with modern bathrooms. Dinner and breakfast are included. There are many thrilling activities for visitors, including dune driving and camel riding. You can also do quiet activities; for example, henna painting.", "icon": "✍️"}, {"type": "ask", "title": "Design a tour of Oman", "qs": [{"q": "Where will your tour go? How long is it?", "a": "A three-day tour: Muscat – Nizwa – Jebel Shams."}, {"q": "Write the itinerary (plan).", "a": "Day 1 morning: Muttrah Souk. Afternoon: drive to Nizwa. Day 2: Nizwa Fort and souk. Day 3: Jebel Shams."}, {"q": "Why will visitors enjoy it?", "a": "They will see old forts, busy souks and stunning mountains."}], "icon": "🇴🇲"}, {"type": "race", "title": "Team race", "qs": [{"q": "An ‘itinerary’ is a …", "options": ["plan of places to visit", "type of hotel"], "a": 0}, {"q": "The Blue Mosque takes its name from blue …", "options": ["desserts", "tiles"], "a": 1}, {"q": "‘wander’ means …", "options": ["eat quickly", "walk without clear direction"], "a": 1}, {"q": "‘spectacular’ goes best with …", "options": ["bathrooms", "views"], "a": 1}, {"q": "Giving examples: ‘activities ___ dune driving’", "options": ["because", "including"], "a": 1}, {"q": "The Desert Adventure camp is in …", "options": ["Salalah", "the Wahiba Sands"], "a": 1}], "icon": "🏎️"}, {"type": "steps", "title": "Let's remember!", "icon": "🧠", "steps": ["A tour description: place ➜ stops in order ➜ final stop.", "Use the future: Our tour will start … You will see …", "Make it interesting: adjectives + examples (such as, including, for example)."]}, {"type": "exit", "title": "Exit ticket", "items": [{"k": "3", "text": "Write one sentence to start a tour description."}, {"k": "2", "text": "Give two adjectives for huts or views."}, {"k": "1", "text": "What is an itinerary?"}], "icon": "🎟️"}, {"type": "homework", "title": "Homework", "head": "My homework", "items": ["WB p. 39 Act. 5: write your description of a Wahiba Sands tour (two drafts).", "Finish your group's itinerary for a tour of Oman (CB p. 43 Act. 4)."], "icon": "🏠"}]}, {"id": "L23", "unit": "U3", "unitName": "Theme 3 · Travellers and Tourists", "title": "Across Cultures: New Zealand & Sailing Heroes", "code": "", "theme": "library", "emo": "⛵", "slides": [{"type": "cover", "say": "Theme 3 · Across Cultures + Reading for Pleasure"}, {"type": "goals", "title": "Today's goals", "items": ["I can give facts about New Zealand.", "I can explain Maori words.", "I can tell the story of two famous voyages.", "I can compare sports in Oman with New Zealand."], "icon": "🎯"}, {"type": "ask", "title": "Fact file: New Zealand", "qs": [{"q": "Capital?", "a": "Wellington"}, {"q": "Location?", "a": "South-western Pacific Ocean"}, {"q": "Languages?", "a": "English, Maori, NZ sign language"}, {"q": "Currency?", "a": "New Zealand dollar"}, {"q": "What does ‘Aotearoa’ mean?", "a": "The land of the long white cloud"}], "img": "L23_c1", "icon": "🇳🇿"}, {"type": ernational events does Oman take part in?", "a": "The Gulf Cup, the Asian Games, sailing races, the Tour of Oman cycling race."}], "icon": "🇴🇲"}, {"type": "read", "title": "Sohar's voyage", "paras": ["In 1980, Tim Severin, a British explorer and author, built a [[replica]] of a ninth century Omani dhow and sailed it from Sur to Guangzhou in China.", "He called his boat Sohar, after the place where Sindbad was born. Sohar had no engines, just two cotton sails.", "The sailors' only guide were the stars and the [[kamal]]. Sohar successfully reached Guangzhou on June 6th, 1981."], "icon": "⛵"}, {"type": "read", "title": "Musandam's voyage", "paras": ["In early 2009, Mohsin Al Busaidi became the first Arab to sail [[non-stop]] around the world.", "Musandam is a 75 foot long [[trimaran]] (sailboat with three hulls). It took 76 days to sail 44,979 kilometres.", "She left Muttrah on January 8th 2009 and returned on March 25th 2009 to crowds of people on Muttrah Corniche."], "img": "L23_c3", "icon": "🌏"}, {"type": "quiz", "title": "Two voyages: check", "qs": [{"q": "Why did Tim Severin build Sohar?", "o": ["to show Sindbad's voyage was possible", "to win a race"], "a": 0}, {"q": "Musandam's crew: how many people?", "o": ["five", "twenty-five"], "a": 0, "why": "Mohsin and four others: two British, two French."}, {"q": "Musandam was stuck in the Doldrums for …", "o": ["nine days", "a month"], "a": 0, "why": "Sohar's crew were stuck for a month."}, {"q": "How long could the crew sleep at a time?", "o": ["eight hours", "three hours"], "a": 1}, {"q": "The most exciting part of the journey was …", "o": ["going round Cape Horn", "the Doldrums"], "a": 0}], "img": "L23_c5", "icon": "✅"}, {"type": "ask", "title": "Interview with Mohsin Al Busaidi", "qs": [{"q": "Why did he decide to sail around the world?", "a": "To inspire young Omanis to start sailing again and to promote Oman internationally."}, {"q": "What was the greatest danger?", "a": "Whales – they can rise up suddenly and can't be seen at night."}, {"q": "Who are his role models?", "a": "Ahmed Bin Majid from the past, and His Majesty Sultan Qaboos from the present."}, {"q": "His advice to young people?", "a": "Everyone should have an ambition and stick to it, no matter what problems you face."}], "img": "L23_c6", "icon": "🎤"}, {"type": "race", "title": "Team race", "qs": [{"q": "Capital of New Zealand:", "options": ["Wellington", "Auckland"], "a": 0}, {"q": "The national bird of New Zealand:", "options": ["kiwi", "eagle"], "a": 0}, {"q": "Sohar sailed from Sur to …", "options": ["Muttrah", "Guangzhou"], "a": 1}, {"q": "A boat with three hulls:", "options": ["dhow", "trimaran"], "a": 1}, {"q": "Musandam's voyage took …", "options": ["76 weeks", "76 days"], "a": 1}, {"q": "‘haka’ is a …", "options": ["funeral", "dance"], "a": 1}], "icon": "🏎️"}, {"type": "steps", "title": "Let's remember!", "icon": "🧠", "steps": ["New Zealand = Aotearoa: Maori culture, the kiwi, extreme sports.", "Sohar (1980–81): Tim Severin, Sur ➜ Guangzhou, stars and the kamal.", "Musandam (2009): Mohsin Al Busaidi, first Arab to sail non-stop around the world."]}, {"type": "exit", "title": "Exit ticket", "items": [{"k": "3", "text": "Give two facts about New Zealand."}, {"k": "2", "text": "Who was Mohsin Al Busaidi?"}, {"k": "1", "text": "What was the kamal?"}], "icon": "🎟️"}, {"type": "homework", "title": "Homework", "head": "My homework", "items": ["WB p. 40 Act. 1: correct the five sentences.", "Write notes for visitors: sports in Oman (Cultural Comparison) – put them in your portfolio.", "Read the interview with Mohsin Al Busaidi (WB p. 41) at home."], "icon": "🏠"}]}, {"id": "L24", "unit": "U3", "unitName": "Theme 3 · Travellers and Tourists", "title": "Review 3 · Travellers and Tourists", "code": "", "theme": "library", "emo": "🔁", "slides": [{"type": "cover", "say": "Theme 3 · Review and Reference"}, {"type": "goals", "title": "Today's goals", "items": ["I can check what I learned in Theme 3.", "I can choose the
