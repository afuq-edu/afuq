oves more quickly", "paras": ["Life moves more quickly today than just a few years ago. New [[electronic devices]] and new ideas and [[discoveries]] seem to appear every day.", "Some of these [[innovations]] and [[inventions]] such as new kitchen [[appliances]] are convenient, but not very important. Innovations in air travel and mobile phones have increased the speed at which we can move and communicate."], "icon": "📖"}, {"type": "read", "title": "Life moves more quickly", "paras": ["Some new [[technology]] such as [[improved]] hearing aids has been very helpful and other innovations such as [[nuclear weapons]] have been very harmful.", "Some innovations such as [[CAD (Computer Assisted Design)]] and other [[virtual reality]] software actually make change happen faster. In the future, it seems certain that life will continue to change quickly."], "icon": "📖"}, {"type": "explain", "title": "Invention or discovery?", "icon": "🔍", "lines": ["You [[invent]] something new that did not exist before.", "You [[discover]] something that already existed.", "An [[innovation]] is a new idea or a new way of doing something."], "img": "L25_c2", "rule": "invent = make new · discover = find"}, {"type": "flip", "title": "Invention or discovery? 🔍 – examples", "cards": [{"front": "Edison [[invented]] the light bulb.", "icon": "💡", "back": "invention 💡"}, {"front": "Marie Curie [[discovered]] radium.", "icon": "✨", "back": "discovery 🔬"}, {"front": "Smart homes are an [[innovation]].", "icon": "🔎", "back": "innovation 🏠"}]}, {"type": "match", "title": "Match the words", "pairs": [["appliances", "machines used in the home 🧺"], ["electronic devices", "phones, tablets, laptops 📱"], ["improved", "made better ⬆️"], ["CAD", "Computer Assisted Design 📐"], ["virtual reality", "a world made by a computer 🥽"]], "icon": "🧩"}, {"type": "sort", "title": "Helpful or harmful?", "bins": [{"label": "Helpful", "icon": "👍"}, {"label": "Harmful", "icon": "👎"}], "cards": [{"text": "improved hearing aids 🦻", "icon": "", "bin": 0}, {"text": "mobile phones 📱", "icon": "", "bin": 0}, {"text": "air travel ✈️", "icon": "", "bin": 0}, {"text": "nuclear weapons ☢️", "icon": "", "bin": 1}, {"text": "CAD software 📐", "icon": "", "bin": 0}, {"text": "pollution from cars 🚗💨", "icon": "", "bin": 1}], "icon": "⚖️"}, {"type": "quiz", "title": "Complete the sentences", "icon": "✏️", "qs": [{"q": "Washing machines and fridges are kitchen ___ .", "o": ["discoveries", "appliances"], "a": 1}, {"q": "Mobile phones are electronic ___ .", "o": ["devices", "weapons"], "a": 0}, {"q": "New hearing aids have ___ many lives.", "o": ["invented", "improved"], "a": 1}, {"q": "Architects use ___ to design buildings.", "o": ["nuclear weapons", "CAD"], "a": 1}, {"q": "Life will continue to ___ quickly.", "o": ["invent", "change"], "a": 1}]}, {"type": "wheel", "title": "Innovation wheel", "items": [{"q": "Which invention do you use every day?", "a": "I use my phone every day."}, {"q": "Name a helpful innovation in medicine.", "a": "Improved hearing aids."}, {"q": "Which appliance is convenient but not important?", "a": "An electric fruit juicer."}, {"q": "How has air travel changed life?", "a": "We can move faster and visit far countries."}, {"q": "What will change in the future?", "a": "Cars will drive themselves."}, {"q": "Name an Omani innovation you know.", "a": "The falaj system for water."}], "icon": "🎡"}, {"type": "race", "title": "Team race", "qs": [{"q": "‘appliances’ are …", "options": ["home machines", "new ideas"], "a": 0}, {"q": "CAD = Computer Assisted …", "options": ["Design", "Drawing"], "a": 0}, {"q": "You ___ something that already existed.", "options": ["invent", "discover"], "a": 1}, {"q": "Very harmful innovation in the text:", "options": ["hearing aids", "nuclear weapons"], "a": 1}, {"q": "‘improved’ means …", "options": ["made better", "made worse"], "a": 0}, {"q": "A new idea or way of doing things:", "options": ["innovation", "appliance"], "a": 0}], "icon": "🏎️"}, {"type": "steps", "title": "Let's remember!", "icon": "🧠", "steps": ["innovation · invention · discovery · technology · appliances · electronic devices.", "Some innovations help (hearing aids), some harm (nuclear weapons).", "CAD and virtual reality make change happen faster."]}, {"type": "exit", "title": "Exit ticket", "items": [{"k": "3", "text": "What three things would you miss without technology?"}, {"k": "2", "text": "What is the difference between invent and discover?"}, {"k": "1", "text": "Give one helpful innovation."}], "icon": "🎟️"}, {"type": "homework", "title": "Homework", "head": "My homework", "items": ["Write the bold words on CB p. 49 with their meanings.", "Write 5 sentences: A week without technology."], "icon": "🏠"}]}, {"id": "L26", "unit": "U4", "unitName": "Theme 4 · Innovation", "title": "Unit 1 · Smart Homes (Reading)", "code": "", "theme": "park", "emo": "🏠", "slides": [{"type": "cover", "say": "Theme 4 · Unit 1 · Reading"}, {"type": "goals", "title": "Today's goals", "items": ["I can read a text about smart homes and answer questions.", "I can talk about smart features at home and at school."], "icon": "🎯"}, {"type": "goals", "title": "Today's goals", "items": ["I can compare life in Oman then and now.", "I can use used to / didn't use to."], "icon": "🎯"}, {"type": "ask", "title": "Technology I would miss 🎧 (predict)", "qs": [{"q": "Four people talk about technology they would miss. Guess: what will they mention?", "a": "Predict: phone, car, computer, air conditioner, TV … 🎧"}, {"q": "Your turn: two types of technology you would miss and why.", "a": "I'd miss my laptop because I study with it, and the air conditioner because summer is very hot."}]}, {"type": "ask", "title": "What can a smart home do?", "qs": [{"q": "a What do you think a smart home can do?", "a": "Turn lights on and off, control the temperature, play music …"}, {"q": "b What kind of smart equipment would you like to have?", "a": "A smart fridge that orders food."}, {"q": "c Would you like to live in a smart home? Why / Why not?", "a": "Yes, because it is convenient and saves money."}], "img": "L26_c2", "icon": "🤔"}, {"type": "read", "title": "Smart Homes (1)", "paras": ["When you walk into a room, the lights come on, the temperature [[increases]] or [[decreases]], your favourite song begins to play, and your favourite pictures appear on the video screens that hang on the walls."], "img": "L26_c1", "icon": "📖"}, {"type": "read", "title": "Smart Homes (1)", "paras": ["Smart homes have special [[appliances]] such as refrigerators and washing machines. Inside the appliances are computers. The computers [[control]] the appliances. They are all connected through the electrical wires in the homes."], "img": "L26_c1", "icon": "📖"}, {"type": "read", "title": "Smart Homes (2)", "paras": ["Electronic cupboards and fridges can tell you what food you need to buy or they can talk to the shops over the Internet to have food sent to your home.", "At home, you can use your voice to turn things on and off. When you are away, you can use a mobile phone or send a message over the Internet."], "img": "L26_c3", "icon": "📖"}, {"type": "read", "title": "Smart Homes (2)", "paras": ["Smart homes are not just [[convenient]]. They can also save money by turning off lights and air conditioners when they are not needed."], "img": "L26_c3", "icon": "📖"}, {"type": "ask", "title": "Find the answers", "qs": [{"q": "1 What kind of special equipment can a smart home have?", "a": "Special appliances such as refrigerators and washing machines with computers inside."}, {"q": "2 How are the appliances connected to each other?", "a": "Through the electrical wires in the home."}, {"q": "3 What appliances can talk to shops?", "a": "Electronic cupboards and fridges (over the Internet)."}, {"q": "4 Can you turn things on and off when you are away? How?", "a": "Yes – with a mobile phone or a message over the Internet from a computer."}, {"q": "5 What is another big advantage?", "a": "It saves money by turning off lights and air conditioners when they are not needed."}], "icon": "🔍"}, {"type": "tf", "title": "True or false?", "items": [{"text": "In a smart home, a computer controls the appliances.", "a": true, "fix": "The computers control the appliances."}, {"text": "You can only control a smart home when you are inside it.", "a": false, "fix": "You can use a mobile phone when you are away."}, {"text": "A smart home can tell you how much money you are saving.", "a": true, "fix": "… can also tell you how much money you are saving."}, {"text": "Smart homes will always be only for the rich.", "a": false, "fix": "Future homes and even cars will all have some of these features."}], "icon": "✔✘"}, {"type": "explain", "title": "Top tip: extensive reading", "icon": "🏃", "lines": ["Learning to read is like learning to play a sport.", "The only way to become a good reader is extensive practice: reading a lot.", "Read every day for 15 or 20 minutes. Read simple things you find interesting."], "rule": "Read a lot, every day, for a few months ➜ better reading skills"}, {"type": "flip", "title": "Top tip: extensive reading 📚 – examples", "cards": [{"front": "15–20 minutes [[every day]] ⏱️", "icon": "💡", "back": "📅"}, {"front": "simple and [[interesting]] texts 😊", "icon": "✨", "back": "📖"}]}, {"type": "match", "title": "Smart words", "pairs": [["available (adj)", "ready to use; able to be used or found"], ["features (n)", "things that something has or can do"], ["convenient (adj)", "easy to get or use"]], "icon": "🧩"}, {"type": "match", "title": "Smart words", "pairs": [["electronic (adj)", "using electricity"], ["increases (v)", "becomes larger"], ["decreases (v)", "becomes smaller"]], "icon": "🧩"}, {"type": "ask", "title": "Oman then and now", "qs": [{"q": "What did they use before electricity?", "a": "Oil lamps to light their home."}, {"q": "How did they keep cool?", "a": "Lighter clothes, houses with many trees, sleeping on the roof."}, {"q": "How did Mrs Aysha cook and wash clothes?", "a": "On an open fire; she washed clothes by hand in the falaj."}, {"q": "Are they happier now?", "a": "No – Mr Ahmed thinks they were healthier before; families were closer."}], "img": "L26_c4", "icon": "👴👵"}, {"type": "explain", "title": "used to / didn't use to", "icon": "🕰️", "lines": ["used to + verb = a habit or state in the past that is not true now.", "Negative: didn't use to + verb."], "img": "L26_c5", "rule": "used to / didn't use to + base verb"}, {"type": "flip", "title": "used to / didn't use to 🕰️ – examples", "cards": [{"front": "They [[used to go]] to bed very early.", "icon": "💡", "back": "✅"}, {"front": "She [[didn't use to have]] a cooker.", "icon": "✨", "back": "❌"}, {"front": "She [[used to wash]] clothes by hand in the falaj.", "icon": "🔎", "back": "✅"}]}, {"type": "build", "title": "Then and now sentences", "mode": "words", "items": [{"a": "She used to cook on an open fire.", "hint": "on an open fire. / She / used to cook", "emo": "🔥"}, {"a": "They used to store water in clay pots.", "hint": "in clay pots. / used to store water / They", "emo": "🏺"}, {"a": "She didn't use to have a washing machine.", "hint": "a washing machine. / She / didn't use to have", "emo": "🧺"}, {"a": "Their family used to be much closer.", "hint": "much closer. / used to be / Their family", "emo": "👨‍👩‍👧"}], "icon": "🧱"}, {"type": "ask", "title": "Time to Talk", "qs": [{"q": "1 How is your home different today than it was 10 years ago?", "a": "We have fast Internet, a smart TV and more air conditioners."}, {"q": "2 Does your home or school have any smart features?", "a": "Yes, our school has smart boards and automatic lights."}, {"q": "4 What problems might smart homes have?", "a": "They can be expensive, they need electricity and someone could hack them."}], "icon": "🗣️"}, {"type": "race", "title": "Team race", "qs": [{"q": "Smart appliances are connected through …", "options": ["water pipes", "electrical wires"], "a": 1}, {"q": "Which can talk to shops?", "options": ["electronic fridges", "lamps"], "a": 0}, {"q": "Another advantage of smart homes:", "options": ["saving money", "more noise"], "a": 0}, {"q": "‘convenient’ means …", "options": ["easy to use", "expensive"], "a": 0}, {"q": "She ___ to cook on an open fire.", "options": ["use", "used"], "a": 1}, {"q": "Good readers read …", "options": ["a lot, every day", "only in exams"], "a": 0}], "icon": "🏎️"}, {"type": "steps", "title": "Let's remember!", "icon": "🧠", "steps": ["Smart homes: appliances with computers, connected by wires, controlled by voice or phone.", "They are convenient and save money.", "used to / didn't use to: life in Oman in the past."]}, {"type": "exit", "title": "Exit ticket", "items": [{"k": "3", "text": "Name two things a smart home can do."}, {"k": "2", "text": "Write a sentence with ‘used to’ about your grandparents."}, {"k": "1", "text": "Give one problem with smart homes."}], "icon": "🎟️"}, {"type": "homework", "title": "Homework", "head": "My homework", "items": ["WB p. 45 Act. 3–5: complete the sentences and the used to / didn't use to sentences.", "Read something interesting in English for 15 minutes every day this week."], "icon": "🏠"}]}, {"id": "L27", "unit": "U4", "unitName": "Theme 4 · Innovation", "title": "Unit 2 · Questions and Answers (Grammar)", "code": "", "theme": "park", "emo": "❓", "slides": [{"type": "cover", "say": "Theme 4 · Unit 2 · Grammar"}, {"type": "goals", "title": "Today's goals", "items": ["I can ask and answer trivia quiz questions.", "I can use the past passive: was / were + past participle."], "icon": "🎯"}, {"type": "goals", "title": "Today's goals", "items": ["I can rewrite active sentences in the passive.", "I can match questions and answers about history."], "icon": "🎯"}, {"type": "ask", "title": "Trivia Quiz 🧠 (decide as a group)", "qs": [{"q": "1 Where were bananas first grown?", "a": "a South America · b Africa · c Southeast Asia"}, {"q": "2 The English word ‘giraffe’ was taken from which language?", "a": "a Arabic · b Greek · c Latin"}, {"q": "3 The first Gulf Cup was won by which team?", "a": "a Bahrain · b Kuwait · c the UAE"}], "img": "L27_c1"}, {"type": "ask", "title": "Trivia Quiz 🧠 (decide as a group)", "qs": [{"q": "4 How was Pompeii in Italy destroyed?", "a": "a by a volcano · b by an earthquake · c by a cyclone"}, {"q": "5 By what name was Oman first known?", "a": "a Al Sahil · b Mazoon · c Majan"}, {"q": "6 Where were the first modern Olympic Games held?", "a": "a Athens · b Paris · c Berlin"}]}, {"type": "ask", "title": "Quiz A and Quiz B", "qs": [{"q": "A: Where was rice first grown?", "a": "B: I think it was first grown in Asia."}, {"q": "B: The Mona Lisa was painted by which artist?", "a": "A: It was painted by Leonardo da Vinci."}, {"q": "A: In which country was chess first played?", "a": "B: I'm not sure. I think it was first played in India."}, {"q": "B: In which city was the Eiffel Tower built?", "a": "A: It was built in Paris."}], "icon": "👥"}, {"type": "explain", "title": "Grammar Recall: the past passive", "icon": "🏛️", "lines": ["Form: was / were + past participle (+ by …).", "Use it: when we want to emphasise the subject; when we don't know who did something; for date or place of birth."], "rule": "was / were + past participle"}, {"type": "flip", "title": "Grammar Recall: the past passive 🏛️ – examples", "cards": [{"front": "Three paintings [[were stolen]] from the museum yesterday.", "icon": "💡", "back": "we don't know who 🕵️"}, {"front": "My brother [[was born]] in Muscat.", "icon": "✨", "back": "place of birth 👶"}, {"front": "Julius Caesar [[was written]] by William Shakespeare.", "icon": "🔎", "back": "emphasise the subject 📜"}]}, {"type": "match", "title": "Sentence ➜ usage", "pairs": [["Three paintings were stolen from the museum.", "we don't know who did it"], ["My brother was born in Muscat.", "date or place of birth"], ["Julius Caesar was written by William Shakespeare.", "emphasise the subject"]], "icon": "🧩"}, {"type": "build", "title": "Rewrite in the past passive", "mode": "words", "items": [{"a": "The world wide web was invented by Tim Berners-Lee.", "hint": "was invented / The world wide web / by Tim Berners-Lee.", "emo": "🌐"}, {"a": "The first satellite was sent into space by the Russians.", "hint": "by the Russians. / The first satellite / was sent into space", "emo": "🛰️"}, {"a": "The Titanic was sunk by an iceberg.", "hint": "was sunk / The Titanic / by an iceberg.", "emo": "🧊"}, {"a": "Radium was discovered by Marie Curie.", "hint": "by Marie Curie. / Radium / was discovered", "emo": "🔬"}, {"a": "The Taj Mahal was designed by Ustad Ahmad Lahauri.", "hint": "was designed / by Ustad Ahmad Lahauri. / The Taj Mahal", "emo": "🕌"}], "icon": "🔁"}, {"type": "quiz", "title": "Past participles", "icon": "✏️", "qs": [{"q": "break – broke – ___", "o": ["broken", "breaked"], "a": 0}, {"q": "bring – brought – ___", "o": ["bringed", "brought"], "a": 1}, {"q": "choose – chose – ___", "o": ["chosen", "chose"], "a": 0}, {"q": "eat – ate – ___", "o": ["eaten", "ate"], "a": 0}, {"q": "steal – stole – ___", "o": ["stealed", "stolen"], "a": 1}, {"q": "write – wrote – ___", "o": ["wrote", "written"], "a": 1}]}, {"type": "quiz", "title": "Past passive gap-fill", "icon": "✏️", "qs": [{"q": "The English word ‘discover’ ___ from French. (take)", "o": ["took", "was taken"], "a": 1}, {"q": "The Eiffel Tower in Paris ___ in 1889. (build)", "o": ["were built", "was built"], "a": 1}, {"q": "The city of Ubar ___ more than 2,000 years ago. (destroy)", "o": ["was destroyed", "destroyed"], "a": 0}, {"q": "That novel ___ by Charles Dickens. (write)", "o": ["wrote", "was written"], "a": 1}, {"q": "The 2009 Gulf Cup ___ by Oman's national team. (win)", "o": ["won", "was won"], "a": 1}]}, {"type": "tf", "title": "Spot the mistake", "items": [{"text": "Those shoes was made in Italy.", "a": false, "fix": "Those shoes were made in Italy."}, {"text": "The thief was caught the police.", "a": false, "fix": "The thief was caught by the police."}, {"text": "The potato was first growed in South America.", "a": false, "fix": "The potato was first grown in South America."}, {"text": "The Taj Mahal was built in Agra, India.", "a": true, "fix": "WB p. 47: The Taj Mahal was built in Agra, India."}], "icon": "🕵️"}, {"type": "quiz", "title": "The Taj Mahal", "icon": "✏️", "qs": [{"q": "The Taj Mahal (1) ___ in Agra, India between 1631 and 1648 CE.", "o": ["built", "was built"], "a": 1}, {"q": "It (2) ___ by the architect Ustad Ahmad Lahauri.", "o": ["was designed", "designed"], "a": 0}, {"q": "More than 20,000 workers and 1000 elephants (4) ___ to build it.", "o": ["was used", "were used"], "a": 1}, {"q": "The workers (5) ___ from all over India.", "o": ["were brought", "brought"], "a": 0}, {"q": "In 2003, it (9) ___ by more than 3,000,000 people.", "o": ["was visited", "visited"], "a": 0}]}, {"type": "match", "title": "Activate your English", "pairs": [["Can you tell me when the computer was invented?", "I think it was invented in about 1860."], ["Do you know who the first human in space was?", "It was Yuri Gagarin … in 1961."], ["Where was Ibn Battuta born?", "He was born in Morocco."]], "icon": "🧩"}, {"type": "match", "title": "Activate your English", "pairs": [["When was the first university opened in Oman?", "Sultan Qaboos University was established in 1986."], ["Where was cotton first grown?", "It was first grown in India."], ["Which country is the world's largest coffee producer?", "It's Brazil."]], "icon": "🧩"}, {"type": "quiz", "title": "The Leaning Tower of Pisa", "qs": [{"q": "Which is a past passive verb from the text?", "o": ["started", "was built", "said"], "a": 1}, {"q": "‘work on the Tower ___ for almost a century’", "o": ["stopped", "was stopped"], "a": 1}, {"q": "‘In 1990, the Tower ___ to the public’", "o": ["was closed", "closed"], "a": 0}, {"q": "When was it opened again?", "o": ["2008", "2001"], "a": 1}], "img": "L27_c3", "icon": "🗼"}, {"type": "balloons", "title": "Pop the passive!", "rounds": [{"q": "Bill Gates ___ on 28 October 1955.", "o": ["was born", "born"], "a": 0}, {"q": "The parts of the Great Wall ___ into one single Wall.", "o": ["made", "were made"], "a": 1}, {"q": "Somebody ate all the cakes. ➜ All the cakes …", "o": ["was ate", "were eaten"], "a": 1}], "icon": "🎈"}, {"type": "balloons", "title": "Pop the passive!", "rounds": [{"q": "Nobody saw the thief. ➜ The thief …", "o": ["wasn't seen", "didn't see"], "a": 0}, {"q": "Thousands of workmen ___ during the building.", "o": ["died", "were died"], "a": 0}, {"q": "BASIC ___ first by John Kemeny and Thomas Kurtz.", "o": ["was developed", "developed"], "a": 0}], "icon": "🎈"}, {"type": "steps", "title": "Let's remember!", "icon": "🧠", "steps": ["Past passive = was / were + past participle (+ by …).", "Use it when the action matters more than who did it, or we don't know who.", "Questions: When was … invented? Where was … born?"]}, {"type": "exit", "title": "Exit ticket", "items": [{"k": "3", "text": "Rewrite: Edison invented the light bulb."}, {"k": "2", "text": "Ask a quiz question with ‘was … built?’"}, {"k": "1", "text": "Where were you born? (answer in a full sentence)"}], "icon": "🎟️"}, {"type": "homework", "title": "Homework", "head": "My homework", "items": ["CB p. 53 Act. 3: rewrite all seven sentences.", "WB p. 67 Grammar Practice Act. 1–3.", "Write 3 trivia questions in the past passive for the class."], "icon": "🏠"}]}, {"id": "L28", "unit": "U4", "unitName": "Theme 4 · Innovation", "title": "Unit 3 · The Best and the Worst (Vocabulary)", "code": "", "theme": "park", "emo": "⚖️", "slides": [{"type": "cover", "say": "Theme 4 · Unit 3 · Vocabulary"}, {"type": "goals", "title": "Today's goals", "items": ["I can list helpful and harmful inventions.", "I can read an essay and find the writer's lists."], "icon": "🎯"}, {"type": "goals", "title": "Today's goals", "items": ["I can use word forms: invent – invention – inventive – inventively.", "I can find English words that came from Arabic."], "icon": "🎯"}, {"type": "ask", "title": "Your lists", "qs": [{"q": "Five inventions that have helped people the most?", "a": "The wheel, electricity, medicine, the Internet, paper."}, {"q": "Five inventions that have caused the most harm?", "a": "Guns, bombs, cigarettes, cars (pollution), plastic bags."}, {"q": "Which invention do you agree on in your group?", "a": "We all agree that medicine is very helpful."}], "icon": "📝"}, {"type": "read", "title": "The Best and Worst Inventions (1)", "paras": ["Some inventions, the [[falaj]] and computers for example, have been very helpful, while others, such as cigarettes, have been quite harmful. This [[essay]] lists the five best and five worst inventions in the writer's opinion."], "img": "L28_c1", "icon": "📖"}, {"type": "read", "title": "The Best and Worst Inventions (1)", "paras": ["Two inventions on the ‘helpful’ list, writing [[systems]] and paper, are closely [[related]]. These inventions have [[allowed]] us to keep and share information.", "The third important invention is money. Next on the list is medicine. The final item on the list is the wheel, because it is necessary for most types of transportation."], "img": "L28_c1", "icon": "📖"}, {"type": "read", "title": "The Best and Worst Inventions (2)", "paras": ["[[According to]] the World Health Organization (WHO), cigarette smoking causes almost 5.5 million deaths a year around the world.", "Cars are second on the ‘harmful’ list because they cause [[global warming]] and kill huge numbers of people in traffic accidents. Guns are next."], "img": "L28_c2", "icon": "📖"}, {"type": "read", "title": "The Best and Worst Inventions (2)", "paras": ["Number four on the list is fast food. Finally, [[nuclear weapons]] are on the list."], "img": "L28_c2", "icon": "📖"}, {"type": "sort", "title": "The writer's lists", "bins": [{"label": "Most helpful", "icon": "👍"}, {"label": "Most harmful", "icon": "👎"}], "cards": [{"text": "writing systems ✍️", "icon": "", "bin": 0}, {"text": "paper 📄", "icon": "", "bin": 0}, {"text": "money 💰", "icon": "", "bin": 0}, {"text": "medicine 💊", "icon": "", "bin": 0}, {"text": "the wheel ⚙️", "icon": "", "bin": 0}, {"text": "cigarettes 🚬", "icon": "", "bin": 1}, {"text": "cars 🚗", "icon": "", "bin": 1}, {"text": "guns", "icon": "", "bin": 1}, {"text": "fast food 🍔", "icon": "", "bin": 1}, {"text": "nuclear weapons", "icon": "", "bin": 1}], "icon": "⚖️"}, {"type": "ask", "title": "Questions about the text", "qs": [{"q": "1 What invention is not so important, but nice to have?", "a": "The tea bag."}, {"q": "2 Why are writing systems and paper important?", "a": "They have allowed us to keep and share information; modern technology would not exist without them."}, {"q": "3 What is the WHO?", "a": "The World Health Organization."}, {"q": "4 What is surprising about deaths from cigarette smoking?", "a": "More people die from smoking cigarettes than die in wars."}, {"q": "5 Which two harmful inventions were designed to kill people?", "a": "Guns and nuclear weapons."}], "icon": "🔍"}, {"type": "memory", "title": "Word meanings", "pairs": [["essay", "short piece of writing about one subject"], ["improved", "made better"], ["related", "connected or linked"], ["technology", "advanced scientific knowledge or equipment"], ["reported", "gave information about something"], ["allowed", "made something possible"]], "icon": "🧠"}, {"type": "explain", "title": "Word families", "icon": "🌳", "lines": ["noun · verb · adjective · adverb"], "rule": "-tion / -ment = noun · -ful / -ive / -ent = adjective · -ly = adverb"}, {"type": "flip", "title": "Word families 🌳 – examples", "cards": [{"front": "[[invention]] · [[invent]] · [[inventive]] · [[inventively]]", "icon": "💡", "back": "1"}, {"front": "[[innovation]] · [[innovate]] · [[innovative]] · [[innovatively]]", "icon": "✨", "back": "2"}, {"front": "[[help]] · [[help]] · [[helpful]] · [[helpfully]]", "icon": "🔎", "back": "4"}, {"front": "[[convenience]] · ": "The final helpful invention on the list:", "options": ["the wheel", "paper"], "a": 0}, {"q": "Cars cause …", "options": ["global warming", "medicine"], "a": 0}, {"q": "Adjective of ‘harm’:", "options": ["harmful", "harmfully"], "a": 0}, {"q": "Noun of ‘invent’:", "options": ["invention", "inventive"], "a": 0}, {"q": "‘sugar’ comes from …", "options": ["Italian", "Arabic"], "a": 1}, {"q": "‘according to’ means …", "options": ["this was said by", "after that"], "a": 0}], "icon": "🏎️"}, {"type": "summary", "title": "Let's remember!", "center": "Unit 3 · The Best and the Worst (Vocabulary)", "branches": ["Helpful: writing systems, paper, money, medicine, the wheel.", "Harmful: cigarettes, cars, guns, fast food, nuclear weapons.", "Word families: invent ➜ invention ➜ inventive ➜ inventively.", "Many English words come from Arabic: algebra, sugar, cotton."], "icon": "🧠"}, {"type": "exit", "title": "Exit ticket", "items": [{"k": "3", "text": "Which invention do you think is the best? Why?"}, {"k": "2", "text": "Write the adjective and adverb of ‘help’."}, {"k": "1", "text": "Name two English words from Arabic."}], "icon": "🎟️"}, {"type": "homework", "title": "Homework", "head": "My homework", "items": ["WB p. 49 Act. 4: complete the crossword.", "Write a paragraph: the best invention in my opinion (60–80 words)."], "icon": "🏠"}]}, {"id": "L29", "unit": "U4", "unitName": "Theme 4 · Innovation", "title": "Unit 4 · Virtual Reality (Listening and Speaking)", "code": "", "theme": "park", "emo": "🥽", "slides": [{"type": "cover", "say": "Theme 4 · Unit 4 · Listening and Speaking"}, {"type": "goals", "title": "Today's goals", "items": ["I can explain what virtual reality is and what it is used for.", "I can ask indirect questions politely."], "icon": "🎯"}, {"type": "goals", "title": "Today's goals", "items": ["I can use adverbs of frequency: never → always.", "I can make a listening text easier."], "icon": "🎯"}, {"type": "ask", "title": "You and computers", "qs": [{"q": "1 How much time do you spend using a computer every week?", "a": "About ten hours a week."}, {"q": "2 What do you use computers for?", "a": "For homework, research and talking to friends."}, {"q": "3 If you play computer games, what games do you play?", "a": "I play football games and puzzle games."}], "icon": "💻"}, {"type": "read", "title": "Virtual Reality (1)", "paras": ["Virtual reality is an [[interactive]] environment which is made using a computer. Virtual reality can try to copy the real world or it can create [[fictional]] worlds."], "img": "L29_c1", "icon": "📖"}, {"type": "read", "title": "Virtual Reality (1)", "paras": ["Virtual reality environments are mainly audio and visual (sound and sight) experiences. Users can work with them using a keyboard and mouse, or through devices such as gaming equipment."], "img": "L29_c1", "icon": "📖"}, {"type": "read", "title": "Virtual Reality (1)", "paras": ["Virtual reality software is used for training pilots and doctors. Another example is [[CAD]] software, used by people who design buildings, cars and other objects."], "img": "L29_c1", "icon": "📖"}, {"type": "read", "title": "Virtual Reality (2)", "paras": ["Many computer games do not try to copy real life. PacMan and Super Mario Brothers are examples of early fictional virtual reality games.", "[[Limitations]]: it is difficult to create a virtual reality experience that seems real, because computers and the Internet are not powerful enough.", "In addition to sights and sounds, virtual reality of the future may have smell and touch."], "icon": "📖"}, {"type": "ask", "title": "Answer a, b and c", "qs": [{"q": "a What is virtual reality?", "a": "An interactive environment made using a computer; it copies the real world or creates fictional worlds."}, {"q": "b What is it used for?", "a": "Education and training (pilots, doctors), virtual museum tours and pets, CAD design, and computer games."}, {"q": "c What limitations does it have?", "a": "It is difficult to make it seem real; computers and the Internet are not powerful enough yet."}], "icon": "🔍"}, {"type": "sort", "title": "Real world or fictional?", "bins": [{"label": "Copying the real world", "icon": "🌍"}, {"label": "Fictional worlds", "icon": "🧚"}], "cards": [{"text": "training pilots ✈️", "icon": "", "bin": 0}, {"text": "training doctors 🩺", "icon": "", "bin": 0}, {"text": "virtual museum tours 🏛️", "icon": "", "bin": 0}, {"text": "CAD software 📐", "icon": "", "bin": 0}, {"text": "virtual pets 🐟", "icon": "", "bin": 0}, {"text": "PacMan 👾", "icon": "", "bin": 1}, {"text": "Super Mario Brothers 🍄", "icon": "", "bin": 1}], "icon": "🗂️"}, {"type": "explain", "title": "Sound Bites: indirect questions", "icon": "🎤", "lines": ["Indirect questions are more polite.", "After the opening phrase, use statement word order: subject + verb."], "rule": "Can you tell me / Do you know + wh-word + subject + verb"}, {"type": "flip", "title": "Sound Bites: indirect questions 🎤 – examples", "cards": [{"front": "What is virtual reality? ➜ [[Can you tell us]] what virtual reality [[is]]?", "icon": "💡", "back": "🙂"}, {"front": "When did it begin? ➜ [[Do you know]] when virtual reality [[began]]?", "icon": "✨", "back": "🙂"}, {"front": "[[Could you give some examples of]] how virtual reality is used?", "icon": "🔎", "back": "🙂"}, {"front": "[[Do you have any idea]] what virtual reality will be like in the future?", "icon": "📌", "back": "🙂"}]}, {"type": "build", "title": "Make it polite", "mode": "words", "items": [{"a": "Can you tell me what time it is?", "hint": "what time / Can you tell me / it is?", "emo": "⏰"}, {"a": "Do you know where the museum is?", "hint": "the museum is? / where / Do you know", "emo": "🏛️"}, {"a": "Could you explain how the game works?", "hint": "how / Could you explain / the game works?", "emo": "🎮"}], "icon": "🧱"}, {"type": "ask", "title": "Radio interview with Cindy Jones", "qs": [{"q": "1 Can you tell us what virtual reality is?", "a": "From CB p. 56: an interactive environment made using a computer."}, {"q": "4 Could you give some examples of how virtual reality is used?", "a": "Training pilots and doctors, museum tours, CAD, games."}, {"q": "5 Would you explain some of the limitations?", "a": "It is hard to make it seem real; computers are not powerful enough."}, {"q": "6 Do you have any idea what VR will be like in the future?", "a": "It may have smell and touch, and seem more real."}], "img": "L29_c3", "icon": "🎧"}, {"type": "explain", "title": "Top tip: easier listening", "icon": "👂", "lines": ["Before: think what you know about the topic.", "Think of something more you would like to know.", "While listening: look for that information. Don't expect to understand everything – relax!"], "rule": "Know ➜ want to know ➜ listen for it"}, {"type": "flip", "title": "Top tip: easier listening 👂 – examples", "cards": [{"front": "[[Predict]] ➜ [[listen for]] what you want ➜ [[relax]]", "icon": "💡", "back": "🎧"}]}, {"type": "order", "title": "Adverbs of frequency", "items": ["never", "rarely", "sometimes", "often", "always"], "icon": "📊"}, {"type": "quiz", "title": "Addictive Computer Use", "icon": "✏️", "qs": [{"q": "… too much time playing computer (1) ___", "o": ["games", "school"], "a": 0}, {"q": "Some people find themselves (2) ___ to quit.", "o": ["unable", "often"], "a": 0}, {"q": "Too much use can (3) ___ the time people spend with their families.", "o": ["reduce", "advice"], "a": 0}, {"q": "It can also cause problems at work and (4) ___ .", "o": ["school", "games"], "a": 0}]}, {"type": "quiz", "title": "Addictive Computer Use", "icon": "✏️", "qs": [{"q": "… health problems due to poor eating and sleeping (5) ___ .", "o": ["unable", "habits"], "a": 1}, {"q": "Because computers are (6) ___ used for work, school and entertainment …", "o": ["reduce", "often"], "a": 1}, {"q": "… what is normal and what is (7) ___ computer use.", "o": ["addictive", "advice"], "a": 0}]}, {"type": "wheel", "title": "Internet Addiction Questionnaire", "items": [{"q": "How often do you check your e-mail before doing other things?", "a": "I sometimes check my e-mail first. (2 points)"}, {"q": "How often do you spend more than 20 hours a week on a computer?", "a": "I rarely spend that much time. (1 point)"}, {"q": "How often do your parents complain about your computer time?", "a": "They often complain! (3 points)"}, {"q": "How often do you lose sleep because of the computer?", "a": "I never lose sleep. (0 points)"}, {"q": "How often do you choose a computer rather than family or friends?", "a": "I rarely do that."}, {"q": "What does 0–19 points mean?", "a": "You are an average computer user; not a serious problem."}], "icon": "🎡"}, {"type": "race", "title": "Team race", "qs": [{"q": "Virtual reality is made using a …", "options": ["camera", "computer"], "a": 1}, {"q": "PacMan is an example of a … world.", "options": ["real", "fictional"], "a": 1}, {"q": "Polite: ‘Do you know where ___?’", "options": ["is the bank", "the bank is"], "a": 1}, {"q": "Least frequent:", "options": ["never", "rarely"], "a": 0}, {"q": "Between ‘rarely’ and ‘often’:", "options": ["sometimes", "always"], "a": 0}, {"q": "Future VR may add …", "options": ["smell and touch", "paper and ink"], "a": 0}], "icon": "🏎️"}, {"type": "steps", "title": "Let's remember!", "icon": "🧠", "steps": ["VR: interactive computer environments – copying the real world or fictional worlds.", "Indirect questions: Can you tell me what … is?", "never ➜ rarely ➜ sometimes ➜ often ➜ always."]}, {"type": "exit", "title": "Exit ticket", "items": [{"k": "3", "text": "Make this polite: ‘Where is the library?’"}, {"k": "2", "text": "Give one use of virtual reality."}, {"k": "1", "text": "Write a sentence with ‘rarely’."}], "icon": "🎟️"}, {"type": "homework", "title": "Homework", "head": "My homework", "items": ["Do the Internet Addiction Questionnaire (WB p. 51) with a family member and calculate the score.", "Write 5 indirect questions to ask a VR expert."], "icon": "🏠"}]}, {"id": "L30", "unit": "U4", "unitName": "Theme 4 · Innovation", "title": "Unit 5 · E-Shopping (Writing)", "code": "", "theme": "park", "emo": "🛒", "slides": [{"type": "cover", "say": "Theme 4 · Unit 5 · Writing"}, {"type": "goals", "title": "Today's goals", "items": ["I can discuss buying online and its dangers.", "I can understand terms and conditions."], "icon": "🎯"}, {"type": "goals", "title": "Today's goals", "items": ["I can use complaint words: faulty, refund, dissatisfied …", "I can write a formal e-mail of complaint."], "icon": "🎯"}, {"type": "ask", "title": "Buying online", "qs": [{"q": "1 Have you or anyone you know bought anything online? What?", "a": "Yes, my brother bought a phone cover and some books."}, {"q": "2 What are the dangers of buying online?", "a": "The product may be fake or faulty, it may not arrive, or someone may steal your card details."}, {"q": "3 Which things in the box would you buy online?", "a": "Books, air tickets and computers – but not food, medicine or houses."}], "img": "L30_c1", "icon": "🛍️"}, {"type": "sort", "title": "Would you buy it online?", "bins": [{"label": "Yes, online", "icon": "✅"}, {"label": "No, in a shop", "icon": "🏬"}], "cards": [{"text": "books 📚", "icon": "", "bin": 0}, {"text": "air tickets ✈️", "icon": "", "bin": 0}, {"text": "music 🎵", "icon": "", "bin": 0}, {"text": "DVDs 📀", "icon": "", "bin": 0}, {"text": "medicine 💊", "icon": "", "bin": 1}, {"text": "houses 🏠", "icon": "", "bin": 1}, {"text": "food 🍲", "icon": "", "bin": 1}, {"text": "perfume 🌸", "icon": "", "bin": 1}], "icon": "🗂️"}, {"type": "tf", "title": "Online DVD Club: terms", "items": [{"text": "a You can buy DVDs if you are 19.", "a": true, "fix": "1 You must be 18 or over."}, {"text": "b You can buy more than 15 DVDs a year.", "a": true, "fix": "6 There is no maximum limit."}, {"text": "c You can send a DVD back after you have watched it.", "a": false, "fix": "8 You cannot return DVDs unless they are faulty."}, {"text": "d You have to buy the recommended DVDs.", "a": false, "fix": "4 You do not have to buy the recommended DVDs."}], "icon": "✔✘"}, {"type": "tf", "title": "Online DVD Club: terms", "items": [{"text": "e Your friends can buy DVDs using your membership.", "a": false, "fix": "2 You should not let anyone else use your password."}, {"text": "g If you wait two months to pay, you pay an extra charge.", "a": false, "fix": "7 You must pay within three months; only then 10% is added."}, {"text": "h You can return a DVD if it does not work properly.", "a": true, "fix": "8 … unless they are faulty."}], "icon": "✔✘"}, {"type": "read", "title": "Helen Brown's e-mail", "paras": ["I am writing to inform you that I am [[dissatisfied]] with the service I received on my July DVD order.", "I did not want the recommended DVD but I had to order it because of the membership conditions.", "I waited three months to pay. Then I received a bill for an additional 10 percent."], "img": "L30_c2", "icon": "📧"}, {"type": "read", "title": "Helen Brown's e-mail", "paras": ["I also did not like two of the DVDs … I have watched all the DVDs and asked to return them."], "img": "L30_c2", "icon": "📧"}, {"type": "ask", "title": "Four complaints – who is wrong?", "qs": [{"q": "1 She had to order the recommended DVD.", "a": "Wrong: rule 4 – you do not have to buy the recommended DVDs."}, {"q": "2 She paid an extra 10 percent.", "a": "Rule 7: pay within three months – she waited three months, so the charge was added."}, {"q": "3 She did not like two of the DVDs.", "a": "Not a fair complaint: the club cannot sell only DVDs everyone likes."}, {"q": "4 She wanted to return watched DVDs.", "a": "Wrong: rule 8 – no returns unless faulty."}, {"q": "So, who is wrong?", "a": "The customer, Helen Brown."}], "icon": "⚖️"}, {"type": "match", "title": "Complaint words", "pairs": [["repair (v)", "fix something that is broken"], ["replacement (n)", "something that takes the place of something else"], ["compensation (n)", "money paid because something is lost or broken"], ["faulty (adj)", "not working correctly"]], "icon": "🧩"}, {"type": "match", "title": "Complaint words", "pairs": [["refund (n)", "money that is given back to you"], ["guarantee (n)", "written promise to repair or exchange a faulty product"], ["reject (v)", "refuse to accept something"]], "icon": "🧩"}, {"type": "quiz", "title": "Making a written complaint", "icon": "✏️", "qs": [{"q": "Make your (1) ___ as soon as possible.", "o": ["copies", "complaint"], "a": 1}, {"q": "Say where and when you bought the product, and how much it (2) ___ .", "o": ["brought", "cost"], "a": 1}, {"q": "Describe the (3) ___ or service you bought.", "o": ["reply", "product"], "a": 1}, {"q": "Keep your letter or (4) ___ short.", "o": ["e-mail", "action"], "a": 0}]}, {"type": "quiz", "title": "Making a written complaint", "icon": "✏️", "qs": [{"q": "Describe what (5) ___ you have already taken.", "o": ["action", "cost"], "a": 0}, {"q": "Tell the company you expect a (6) ___ within a certain time.", "o": ["product", "reply"], "a": 1}, {"q": "Do not send original (7) ___ .", "o": ["e-mail", "documents"], "a": 1}, {"q": "Keep (8) ___ of any letters or e-mails you send.", "o": ["complaint", "copies"], "a": 1}]}, {"type": "quiz", "title": "The sofa e-mail", "icon": "✏️", "qs": [{"q": "The sofa is (1) ___ .", "o": ["old", "bad", "faulty"], "a": 2}, {"q": "I haven't received the two-year (2) ___ .", "o": ["replacement", "promise", "guarantee"], "a": 2}, {"q": "I am extremely (3) ___ with the quality of the sofa.", "o": ["sad", "happy", "dissatisfied"], "a": 2}, {"q": "I wish to (4) ___ the sofa and (5) ___ either a refund or a replacement sofa.", "o": ["refund … repair", "reject … claim"], "a": 1}, {"q": "Please reply to my (8) ___ within seven days.", "o": ["fault", "complaint", "anger"], "a": 1}]}, {"type": "explain", "title": "Writing Guide: e-mail of complaint", "icon": "📧", "lines": ["Subject line · Greeting · Line 1 purpose · Line 2 problem · Line 3 action you expect · Line 4 documents · Line 5 deadline · Closing · Signature.", "Formal style: full forms (I am, not I'm), ‘Thank you’, not ‘Thanks’."], "rule": "Yours faithfully (name unknown) · Yours sincerely (name known)"}, {"type": "flip", "title": "Writing Guide: e-mail of complaint 📧 – examples", "cards": [{"front": "[[Dear Sir or Madam]]: (name unknown)", "icon": "💡", "back": "greeting"}, {"front": "[[I am writing to inform you that I am dissatisfied with]] …", "icon": "✨", "back": "line 1"}, {"front": "[[I would like to]] receive a refund. / [[I am attaching]] a copy of my receipt.", "icon": "🔎", "back": "lines 3–4"}, {"front": "Please contact me within two weeks. [[Yours faithfully]],", "icon": "📌", "back": "closing"}]}, {"type": "write", "title": "Write your e-mail of complaint", "task": "Choose ONE situation: a song with noise · wrong-size shoes · the wrong book · a ticket for the wrong date · a DVD that has not arrived. Write a formal e-mail of complaint.", "steps": ["Subject: your order number.", "Dear Sir or Madam,", "Purpose: I am writing to inform you that …", "Problem: what is wrong?", "Action: what do you want? By when?", "Yours faithfully, + your full name"], "words": ["dissatisfied", "faulty", "refund", "replacement", "order number", "I would like to", "within seven days", "Yours faithfully"], "model": "Subject: Shoe order #SH20431\nDear Sir or Madam,\nI am writing to inform you that I am dissatisfied with my order (#SH20431). I ordered a pair of black shoes in size 42 on 3 March, but I received size 38. I would like to return the shoes and receive a replacement pair in the correct size. I am attaching a copy of my order form. Please reply to my complaint within seven days.\nYours faithfully,\nSalim Al Harthy", "icon": "✍️"}, {"type": "race", "title": "Team race", "qs": [{"q": "‘faulty’ means …", "options": ["very expensive", "not working correctly"], "a": 1}, {"q": "Money given back to you:", "options": ["refund", "guarantee"], "a": 0}, {"q": "Name unknown: Dear Sir o   const finish=()=>{order.splice(0).forEach(t=>t.classList.add('gone'));if(s.answer)fin.style.display='block';SND.win();confetti()};
  const show=()=>{const it=qs[k];done=false;qa.innerHTML=`<div class="qbub" style="position:relative;font-size:${fzOf(it.q,30,34,38,42)}px">${NUM(k,qs.length)}${fmt(it.q)}</div>`;const og=el('div','');og.style.cssText='display:flex;flex-direction:column;gap:14px;margin-top:18px';
    shuffle((it.o||[]).map((t,i)=>({t,ok:i===(it.a||0)}))).forEach((o,i)=>{const c=el('button','card '+COL[i%4],`<span class="mid" style="font-weight:800">${fmt(o.t)}</span>`);c.style.cssText='text-align:center;padding:10px 20px';c._ok=o.ok;c.onclick=()=>pick(c);og.append(c)});qa.append(og)};
  const pick=c=>{if(done||!c)return;if(c._ok){done=true;c.classList.add('okc');SND.ok();for(let i=0;i<per;i++){const t=order.shift();if(t)t.classList.add('gone')}if(k===qs.length-1)setTimeout(finish,700)}else{c.classList.add('noc','shake');SND.no();setTimeout(()=>c.classList.remove('shake'),500)}};
  if(qs.length)show();w._step=()=>{if(qs.length&&!done){pick([...qa.querySelectorAll('button')].find(x=>x._ok));return true}if(k<qs.length-1){k++;show();return true}if(order.length){finish();return true}return false}};
R.poem=(s,L,w)=>{const b=banner({title:s.title,icon:s.icon||'🎵'});w.append(b);const ls=s.lines||[];const hasImg=!!s.img;
  if(hasImg){const p=el('div','pic');p.style.cssText='left:60px;top:190px;width:440px;height:600px';p.innerHTML=img(s.img);w.append(p)}

R.trace=(s,L,w)=>{const b=banner({title:s.title||'Write neatly',icon:'✍️'});w.append(b);const its=s.items||[];
  const pad=el('div','paper');pad.style.cssText='left:120px;right:120px;top:200px';const rows=its.map(t=>{const r=el('div','tline hid',fmt(t));if(String(t).length>40)r.style.fontSize='44px';pad.append(r);return r});w.append(pad);

R.write=(s,L,w)=>{const st=(s.steps&&s.steps.length?s.steps:[]).slice(0,s.task?3:4);if(s.task)st.unshift(s.task);if(s.words&&s.words.length)st.push('🧩 '+s.words.join(' · '));R.try({...s,title:s.title||'Let’s write',icon:s.icon||'✍️',steps:st,minutes:s.minutes||10},L,w);

  box.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{m.classList.remove('on');go(+b.dataset.i)});box.querySelector('#tFs').onclick=fs;box.querySelector('#tClose').onclick=()=>m.classList.remove('on');box.querySelector('#tNote').onclick=()=>{$('#note').classList.toggle('on');m.classList.remove('on')};box.querySelector('#tMute').onclick=e=>{muted=!muted;try{localStorage.setItem('ictdeck-mute',muted?'1':'0')}catch(x){}e.target.textContent=muted?'🔇 الصوت مغلق':'🔊 الصوت يعمل'};m.classList.add('on')}
