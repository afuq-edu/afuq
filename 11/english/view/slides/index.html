:root{--ink:#14284b;--ink2:#3b4f72;--cream:#fdf6e9;--gold:#e3b45a;--pink:#fde3e6;--pinkb:#e8798a;--blue:#dcecff;--blueb:#6aa2e8;--yel:#fff1c9;--yelb:#e2b13c;--grn:#dff3e0;--grnb:#5fb873;--pur:#ece4ff;--purb:#9b84e6;--org:#ffe6d5;--orgb:#f0965f;--ok:#2fa35a;--no:#e05561}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#0e1830;overflow:hidden;font-family:'Baloo Bhaijaan 2','Noto Naskh Arabic',system-ui,sans-serif;color:var(--ink)}
button{font:inherit;cursor:pointer}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#stage{position:relative;width:1600px;height:900px;transform-origin:center center;overflow:hidden;border-radius:6px;background:#fff}
.scene{position:absolute;inset:0;width:100%;height:100%}
.slide{position:absolute;inset:0}
.slide.in{animation:sIn .5s ease}
@keyframes sIn{from{opacity:0;transform:scale(1.015)}to{opacity:1;transform:none}}
bdi.en{font-family:'Baloo Bhaijaan 2',system-ui,sans-serif;unicode-bidi:isolate}
mark{background:linear-gradient(transparent 45%,#ffe27a 45%,#ffe27a 92%,transparent 92%);color:inherit;padding:0 .1em}
/* banner (top title card) */
.banner{position:absolute;top:26px;left:50%;transform:translateX(-50%);min-width:760px;max-width:1300px;padding:14px 92px 16px;background:var(--cream);border:5px solid var(--gold);border-radius:34px;box-shadow:0 8px 0 rgba(0,0,0,.12),inset 0 0 0 4px #fff;text-align:center;z-index:5}
.banner:before{content:"";position:absolute;inset:8px;border:2.5px dashed #e9cf98;border-radius:26px;pointer-events:none}
.banner h1{margin:0;font-weight:800;font-size:54px;line-height:1.25;color:var(--ink)}
.banner h1 .k{color:#d6344f}
.banner .ico{position:absolute;top:50%;transform:translateY(-50%);font-size:52px}
.banner .ico.r{right:18px}.banner .ico.l{left:18px}
.banner.pink{background:#fff0f2;border-color:var(--pinkb)}.banner.pink:before{border-color:#f3b5bf}
.pill{position:absolute;left:50%;transform:translateX(-50%);background:#fffaf0;border:3px solid #d7b878;border-radius:22px;padding:4px 30px 6px;font-size:32px;font-weight:600;color:var(--ink2);white-space:nowrap;z-index:5;box-shadow:0 4px 0 rgba(0,0,0,.08)}
/* generic cards */
.card{position:relative;background:var(--cream);border:5px solid var(--gold);border-radius:30px;box-shadow:0 8px 0 rgba(0,0,0,.13);padding:18px 26px}
.card:before{content:"";position:absolute;inset:8px;border:2.5px dashed rgba(0,0,0,.14);border-radius:22px;pointer-events:none}
.c0{background:var(--pink);border-color:var(--pinkb)}.c1{background:var(--blue);border-color:var(--blueb)}.c2{background:var(--yel);border-color:var(--yelb)}.c3{background:var(--grn);border-color:var(--grnb)}.c4{background:var(--pur);border-color:var(--purb)}.c5{background:var(--org);border-color:var(--orgb)}
.big{font-size:44px;font-weight:700;line-height:1.45}
.mid{font-size:38px;font-weight:600;line-height:1.5}
.emo{font-size:72px;line-height:1;filter:drop-shadow(0 4px 0 rgba(0,0,0,.12))}
.hide{visibility:hidden}
.tap{cursor:pointer}
.panel{position:absolute;left:50%;transform:translateX(-50%);background:rgba(255,253,247,.94);border:5px solid #d9c08e;border-radius:34px;box-shadow:0 10px 0 rgba(0,0,0,.12);padding:26px 34px}
/* nav */
.nav{position:fixed;bottom:16px;width:64px;height:64px;border-radius:50%;border:0;background:rgba(255,255,255,.88);color:#14284b;font-size:30px;font-weight:800;box-shadow:0 4px 14px rgba(0,0,0,.25);z-index:50;display:flex;align-items:center;justify-content:center;transition:transform .15s,opacity .3s;opacity:.55}
.nav:hover{opacity:1;transform:scale(1.08)}
#next{left:16px}#prev{right:16px}
#menuBtn{position:fixed;top:14px;right:14px;width:50px;height:50px;border-radius:14px;border:0;background:rgba(255,255,255,.6);font-size:26px;z-index:50;opacity:.45;transition:opacity .3s}
#menuBtn:hover{opacity:1}
#count{position:fixed;bottom:30px;left:92px;color:#fff;font-size:15px;opacity:.55;z-index:50;font-family:system-ui;direction:ltr;text-shadow:0 1px 3px #000}
/* menu */
#menu{position:fixed;inset:0;background:rgba(10,20,42,.82);backdrop-filter:blur(6px);z-index:100;display:none;overflow:auto;padding:30px}
#menu.on{display:block}
#menu .mbox{max-width:1180px;margin:0 auto;background:#fffaf0;border-radius:28px;padding:22px 30px 30px;border:5px solid var(--gold)}
#menu h2{margin:0 0 4px;font-size:34px}
#menu .msub{color:#5b6782;font-size:18px;margin-bottom:12px}
#menu .unit{margin:16px 0 8px;font-size:22px;font-weight:800;color:#2f7d5b}
#menu .lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
#menu .les{border:3px solid #e5d6b5;border-radius:18px;background:#fff;padding:10px 14px}
#menu .les b{display:block;font-size:21px;line-height:1.35;cursor:pointer}
#menu .les b:hover{color:#d6344f}
#menu .les .ps{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
#menu .les .ps button{border:2px solid #9cc9d3;background:#eef8fa;color:#226b7a;border-radius:12px;padding:2px 12px;font-size:16px;font-weight:700}
#menu .les.cur{border-color:#e8798a;background:#fff5f6}
#menu .tools{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
#menu .tools button{border:2px solid #d7b878;background:#fff;border-radius:14px;padding:6px 16px;font-size:18px;font-weight:700}
#note{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);max-width:900px;background:#fffbe6;border:2px solid #e3b45a;border-radius:14px;padding:10px 18px;font-size:18px;z-index:60;display:none;box-shadow:0 6px 20px rgba(0,0,0,.3)}
#note.on{display:block}
/* fx */
.shake{animation:shake .45s}
@keyframes shake{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
.pop{animation:pop .45s}
@keyframes pop{50%{transform:scale(1.08)}}
.okc{outline:6px solid var(--ok)!important;outline-offset:3px;background:#e4f7e9!important}
.noc{outline:6px solid var(--no)!important;outline-offset:3px;background:#fde8ea!important}
.fade{opacity:.35}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:90}
/* ---------- gate (cover / lock / enter) ---------- */
.gate{position:absolute;width:560px;height:560px;overflow:hidden;border-radius:40px 40px 0 0}
.gate .frame{position:absolute;inset:0;border-radius:40px 40px 0 0;background:linear-gradient(#d9dfea,#b9c3d6);border:6px solid #2b3a55}
.gate .sign{position:absolute;top:16px;left:16px;right:16px;height:96px;background:#1f2d4d;border-radius:18px;display:flex;align-items:center;justify-content:center;gap:16px;color:#fff;font-size:40px;font-weight:800}
.gate .sign .tag{background:#ffcb3d;color:#1f2d4d;border-radius:12px;padding:0 16px;font-size:44px}
.gate .door{position:absolute;top:128px;bottom:0;width:calc(50% - 22px);background:linear-gradient(135deg,#d6e8ff,#a5c4eb);border:5px solid #2b3a55;transition:transform 1.1s cubic-bezier(.6,.05,.3,1)}
.gate .door.l{left:22px;border-radius:8px 0 0 0}.gate .door.r{right:22px;border-radius:0 8px 0 0}
.gate.open .door.l{transform:translateX(-96%)}.gate.open .door.r{transform:translateX(96%)}
.gate .inside{position:absolute;top:128px;bottom:0;left:22px;right:22px;background:radial-gradient(circle at 50% 40%,#fff9d6,#ffe08a 60%,#ffc94a);display:flex;align-items:center;justify-content:center;text-align:center;font-size:44px;font-weight:800;padding:20px;overflow:hidden}
.gate .lock{position:absolute;top:50%;left:50%;width:150px;height:150px;margin:-40px 0 0 -75px;border-radius:50%;background:rgba(255,255,255,.4);border:6px solid #fff;display:flex;align-items:center;justify-content:center;font-size:80px;transition:transform .6s,opacity .6s;z-index:3}
.gate.open .lock{transform:translateY(-200px) rotate(-30deg);opacity:0}
.gate .tape{position:absolute;left:-20px;right:-20px;top:62%;height:40px;background:repeating-linear-gradient(-45deg,#e8414f 0 30px,#fff 30px 60px);border:4px solid #2b3a55;border-radius:6px;z-index:4;transition:transform .8s,opacity .8s}
.gate.open .tape{transform:translateY(300px) rotate(8deg);opacity:0}
.gate .chev{position:absolute;bottom:40px;font-size:60px;color:#ffcb3d;font-weight:900;z-index:2}
.carpet{position:absolute;bottom:0;height:140px;background:linear-gradient(#e94a5a,#c92f42);clip-path:polygon(18% 0,82% 0,100% 100%,0 100%)}
/* cover card */
.ttlcard{position:absolute;left:50%;top:400px;transform:translateX(-50%) scale(.6);opacity:0;transition:all .9s .5s cubic-bezier(.3,1.4,.5,1);width:820px;padding:40px 50px;text-align:center;background:#fff2f4;border:7px solid #e8798a;border-radius:46px;box-shadow:0 14px 0 rgba(0,0,0,.15);z-index:6}
.ttlcard.on{transform:translateX(-50%) scale(1);opacity:1}
.ttlcard .lbl{display:inline-block;background:#ffd8df;border-radius:18px;padding:2px 26px;font-size:36px;font-weight:700}
.ttlcard .t{font-size:84px;font-weight:800;line-height:1.25;margin-top:14px}
.ttlcard .u{font-size:28px;color:#5b6782;margin-top:6px}
.ttlcard .h{position:absolute;top:-58px;left:50%;transform:translateX(-50%);width:210px;height:60px;border:12px solid #2b3a55;border-bottom:0;border-radius:30px 30px 0 0}
/* goals tickets */
.ticket{position:absolute;left:50%;transform:translateX(-50%);width:1080px;min-height:150px;display:flex;align-items:stretch;border-radius:30px;border:5px solid;box-shadow:0 8px 0 rgba(0,0,0,.12);overflow:hidden;transition:opacity .5s,transform .5s}
.ticket .st{width:120px;flex:none;display:flex;align-items:center;justify-content:center;font-size:56px;color:#fff;border-left:4px dashed rgba(255,255,255,.7)}
.ticket .n{width:110px;flex:none;display:flex;align-items:center;justify-content:center;font-size:66px;font-weight:800;border-left:3px dashed rgba(0,0,0,.18)}
.ticket .tx{flex:1;display:flex;align-items:center;padding:12px 30px;font-size:42px;font-weight:700;line-height:1.4}
.ticket .ic{width:130px;flex:none;display:flex;align-items:center;justify-content:center;font-size:72px}
.ticket.hid{opacity:0;transform:translateX(-50%) translateY(30px)}
/* list rows (tf / enter) */
.row{display:flex;align-items:center;gap:18px;background:#fff6f7;border:5px solid #f0a9b4;border-radius:30px;padding:10px 20px;box-shadow:0 6px 0 rgba(0,0,0,.1);font-size:40px;font-weight:700;transition:transform .7s,opacity .7s}
.row .num{width:64px;height:64px;border-radius:50%;background:#e8414f;color:#fff;display:flex;align-items:center;justify-content:center;font-size:36px;flex:none;border:4px solid #fff;box-shadow:0 0 0 3px #e8414f}
.row .txt{flex:1;line-height:1.35}
.row .ico{font-size:52px}
.yn{display:flex;gap:10px}
.yn button{border:4px solid #2b3a55;border-radius:18px;font-size:30px;font-weight:800;padding:4px 16px;background:#fff}
.yn .y{background:#e3f6e8;border-color:#2fa35a;color:#1d7a40}.yn .n2{background:#fde6e8;border-color:#e05561;color:#b8283a}
.row.gone{transform:translateX(-640px) scale(.3);opacity:0}
/* sort */
.bin{position:absolute;border-radius:30px;border:5px solid;box-shadow:0 8px 0 rgba(0,0,0,.12);padding:12px}
.bin .bh{display:flex;align-items:center;justify-content:center;gap:12px;background:rgba(255,255,255,.75);border:3px dashed rgba(0,0,0,.2);border-radius:20px;font-size:40px;font-weight:800;padding:4px 10px}
.bin .bb{margin-top:10px;min-height:110px;border:3px dashed rgba(0,0,0,.25);border-radius:20px;display:flex;flex-wrap:wrap;gap:8px;padding:8px;align-content:flex-start}
.bin.hot{transform:scale(1.03)}
.dcard{background:#fff8ea;border:5px solid #e2b13c;border-radius:26px;padding:10px 18px;font-size:36px;font-weight:800;text-align:center;box-shadow:0 6px 0 rgba(0,0,0,.12);cursor:grab;touch-action:none;user-select:none;display:inline-flex;align-items:center;gap:10px}
.dcard .e{font-size:44px}
.dcard.sel{outline:6px solid #5fa8ff;outline-offset:3px}
.dcard.drag{position:fixed;z-index:200;pointer-events:none;transform:rotate(-3deg) scale(1.05)}
.bin .dcard{font-size:28px;padding:4px 12px;cursor:default;box-shadow:none}
.bin .dcard .e{font-size:32px}
/* concept cards */
.ccard{position:absolute;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:6px;padding:22px 26px;cursor:pointer;transition:transform .3s}
.ccard:hover{transform:translateY(-4px)}
.ccard .hd{font-size:46px;font-weight:800;line-height:1.3}
.ccard .bd{font-size:36px;font-weight:600;line-height:1.45;transition:opacity .4s,max-height .5s;overflow:hidden}
.ccard.closed .bd{opacity:0;max-height:0}
.ccard .q{font-size:24px;opacity:.6}
.ccard:not(.closed) .q{display:none}
/* picture */
.pic{position:absolute;background:#fff;border:6px solid #2b3a55;border-radius:22px;box-shadow:0 10px 0 rgba(0,0,0,.18);overflow:hidden;display:flex;align-items:center;justify-content:center}
.pic img{max-width:100%;max-height:100%;display:block}
.pin{position:absolute;width:62px;height:62px;margin:-31px 0 0 -31px;border-radius:50%;background:#e8414f;color:#fff;font-size:32px;font-weight:800;border:5px solid #fff;box-shadow:0 0 0 4px #e8414f,0 6px 12px rgba(0,0,0,.3);display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:3;animation:pulse 1.8s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 10px rgba(232,65,79,.35),0 6px 12px rgba(0,0,0,.3)}}
.pin.done{background:#2fa35a;box-shadow:0 0 0 4px #2fa35a;animation:none}
.plabel{position:absolute;background:#fffaf0;border:4px solid #e3b45a;border-radius:16px;padding:2px 14px;font-size:28px;font-weight:800;white-space:nowrap;z-index:4;transform:translate(-50%,40px);box-shadow:0 4px 0 rgba(0,0,0,.12)}
.qbub{position:absolute;background:#fff;border:5px solid #5fa8ff;border-radius:30px;padding:16px 26px;font-size:38px;font-weight:700;line-height:1.4;box-shadow:0 8px 0 rgba(0,0,0,.12)}
.qbub .ans{margin-top:10px;padding-top:10px;border-top:3px dashed #9cc4f5;color:#1d7a40;display:none}
.qbub.on .ans{display:block;animation:pop .4s}
.qbub .rv{display:inline-block;margin-top:8px;font-size:26px;border:3px solid #5fa8ff;background:#eaf3ff;color:#2a5ea8;border-radius:14px;padding:0 16px}
.qbub.on .rv{display:none}
/* steps */
.steps{position:absolute;display:flex;flex-direction:column;gap:14px}
.step{display:flex;align-items:center;gap:16px;background:#fff;border:5px solid #9cc4f5;border-radius:26px;padding:10px 20px;font-size:36px;font-weight:700;line-height:1.35;box-shadow:0 6px 0 rgba(0,0,0,.1);transition:opacity .4s,transform .4s}
.step .sn{width:58px;height:58px;flex:none;border-radius:50%;background:#5fa8ff;color:#fff;display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:800}
.step.hid{opacity:0;transform:translateY(16px)}
/* mcq */
.opts{position:absolute;display:grid;grid-template-columns:1fr 1fr;gap:22px}
.opt{display:flex;align-items:center;gap:16px;border:5px solid #2b3a55;border-radius:28px;padding:16px 22px;font-size:40px;font-weight:800;color:#fff;text-align:start;box-shadow:0 8px 0 rgba(0,0,0,.2);min-height:120px;line-height:1.3}
.opt .sh{font-size:40px;width:60px;flex:none;text-align:center;opacity:.9}
.opt.o0{background:#e8586a}.opt.o1{background:#4f8fdf}.opt.o2{background:#e7a92d}.opt.o3{background:#3fa66a}
.opt.okc{background:#2fa35a!important;color:#fff;outline-color:#fff}
.opt.noc{background:#9aa3b5!important;color:#fff}
.opt.dim{opacity:.35}
.qcard{position:absolute;left:50%;transform:translateX(-50%);background:#fff;border:6px solid #2b3a55;border-radius:34px;padding:22px 34px;text-align:center;font-size:48px;font-weight:800;line-height:1.4;box-shadow:0 10px 0 rgba(0,0,0,.15)}
.why{position:absolute;left:50%;transform:translateX(-50%);background:#e8f8ee;border:4px solid #2fa35a;border-radius:22px;padding:8px 24px;font-size:30px;font-weight:700;color:#1d6b3a;display:none;max-width:1300px;text-align:center}
.why.on{display:block;animation:pop .4s}
/* tf */
.tfbtn{width:96px;height:80px;border-radius:22px;border:5px solid #2b3a55;font-size:46px;font-weight:900;background:#fff}
.tfbtn.t{color:#1d7a40}.tfbtn.f{color:#c22d40}
/* match */
.mcol{position:absolute;display:flex;flex-direction:column;gap:16px}
.mitem{background:#fff;border:5px solid #9cc4f5;border-radius:24px;padding:10px 18px;font-size:34px;font-weight:800;text-align:center;box-shadow:0 6px 0 rgba(0,0,0,.1);min-height:84px;display:flex;align-items:center;justify-content:center;line-height:1.3}
.mitem.sel{outline:6px solid #ffb703;outline-offset:3px}
.mitem.m0{background:#ffe1e5;border-color:#e8798a}.mitem.m1{background:#dcecff;border-color:#6aa2e8}.mitem.m2{background:#fff1c9;border-color:#e2b13c}.mitem.m3{background:#dff3e0;border-color:#5fb873}.mitem.m4{background:#ece4ff;border-color:#9b84e6}.mitem.m5{background:#ffe6d5;border-color:#f0965f}
svg.lines{position:absolute;inset:0;pointer-events:none;z-index:1}
/* order */
.olist{position:absolute;display:flex;flex-direction:column;gap:14px}
.oitem{display:flex;align-items:center;gap:16px;background:#fff;border:5px solid #c9b6f2;border-radius:24px;padding:8px 18px;font-size:36px;font-weight:700;box-shadow:0 6px 0 rgba(0,0,0,.1);cursor:pointer;line-height:1.3}
.oitem .on{width:56px;height:56px;flex:none;border-radius:16px;background:#9b84e6;color:#fff;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:800}
.oitem.sel{outline:6px solid #ffb703;outline-offset:3px}
.chk{position:absolute;left:50%;transform:translateX(-50%);border:5px solid #2b3a55;background:#ffcb3d;border-radius:22px;padding:6px 40px;font-size:36px;font-weight:800;box-shadow:0 6px 0 rgba(0,0,0,.2)}
/* fill */
.ftext{position:absolute;left:50%;transform:translateX(-50%);background:#fff;border:6px solid #2b3a55;border-radius:30px;padding:26px 36px;font-size:46px;font-weight:700;line-height:2;text-align:center;box-shadow:0 10px 0 rgba(0,0,0,.15)}
.blank{display:inline-block;min-width:200px;border-bottom:5px dashed #5fa8ff;color:#2a5ea8;text-align:center;padding:0 10px;cursor:pointer;line-height:1.4}
.blank.okc{border-bottom-color:#2fa35a;outline:0!important;background:none!important;color:#1d7a40}
.bank{position:absolute;left:50%;transform:translateX(-50%);display:flex;flex-wrap:wrap;gap:16px;justify-content:center}
.chip{background:#fff1c9;border:5px solid #e2b13c;border-radius:22px;padding:6px 22px;font-size:36px;font-weight:800;box-shadow:0 6px 0 rgba(0,0,0,.12)}
.chip.sel{outline:6px solid #5fa8ff;outline-offset:3px}
.chip.used{opacity:.3;pointer-events:none}
/* memory */
.mem{position:absolute;display:grid;gap:18px}
.mcard{perspective:900px;cursor:pointer}
.mcard .in{position:relative;width:100%;height:100%;transition:transform .6s;transform-style:preserve-3d}
.mcard.f .in,.mcard.done .in{transform:rotateY(180deg)}
.mcard .fr,.mcard .bk{position:absolute;inset:0;backface-visibility:hidden;border-radius:24px;border:5px solid #2b3a55;display:flex;align-items:center;justify-content:center;text-align:center;padding:8px;box-shadow:0 6px 0 rgba(0,0,0,.15)}
.mcard .fr{background:repeating-linear-gradient(45deg,#5fa8ff 0 18px,#79b8ff 18px 36px);font-size:60px;color:#fff}
.mcard .bk{background:#fff;transform:rotateY(180deg);font-size:30px;font-weight:800;line-height:1.3}
.mcard.done .bk{background:#e3f6e8;border-color:#2fa35a}
/* wheel */
.wheelw{position:absolute;width:600px;height:600px}
.wheel{width:100%;height:100%;border-radius:50%;border:10px solid #2b3a55;transition:transform 4s cubic-bezier(.15,.85,.25,1);box-shadow:0 12px 0 rgba(0,0,0,.18)}
.wptr{position:absolute;top:-24px;left:50%;margin-left:-28px;width:0;height:0;border-left:28px solid transparent;border-right:28px solid transparent;border-top:60px solid #e8414f;z-index:3;filter:drop-shadow(0 4px 0 rgba(0,0,0,.25))}
.whub{position:absolute;top:50%;left:50%;width:120px;height:120px;margin:-60px;border-radius:50%;background:#ffcb3d;border:8px solid #2b3a55;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:900;cursor:pointer;z-index:2}
/* race */
.track{position:absolute;left:60px;right:60px;display:flex;flex-direction:column;gap:12px}
.lane{position:relative;height:78px;border-radius:40px;background:#fff;border:5px solid #2b3a55;overflow:hidden;cursor:pointer}
.lane .fill{position:absolute;top:0;bottom:0;right:0;transition:width .8s}
.lane .car{position:absolute;top:50%;transform:translate(50%,-50%) scaleX(-1);font-size:56px;transition:right .8s}
.lane .nm{position:absolute;top:50%;right:20px;transform:translateY(-50%);font-size:28px;font-weight:800;z-index:2;mix-blend-mode:multiply}
.lane .fin{position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:46px}
.lane.turn{outline:6px solid #ffb703;outline-offset:3px}
/* boxes */
.boxes{position:absolute;display:grid;gap:22px}
.gbox{position:relative;border-radius:26px;border:5px solid #2b3a55;box-shadow:0 8px 0 rgba(0,0,0,.18);cursor:pointer;display:flex;align-items:center;justify-content:center;text-align:center;padding:12px;font-size:32px;font-weight:800;line-height:1.35;transition:transform .3s}
.gbox .lid{position:absolute;inset:0;border-radius:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:64px;transition:transform .6s,opacity .6s;z-index:2}
.gbox .lid small{font-size:34px;color:#fff;font-weight:800}
.gbox.open .lid{transform:translateY(-60px) rotate(-12deg);opacity:0;pointer-events:none}
.gbox .a{display:none;color:#1d7a40;margin-top:6px}
.gbox.ans .a{display:block}
/* mind map */
.mm{position:absolute;inset:0}
.mm .center{position:absolute;left:50%;top:520px;transform:translate(-50%,-50%);width:360px;min-height:150px;border-radius:50%;background:#ffcb3d;border:7px solid #2b3a55;display:flex;align-items:center;justify-content:center;text-align:center;font-size:44px;font-weight:900;padding:20px;box-shadow:0 10px 0 rgba(0,0,0,.18);z-index:2}
.mm .br{position:absolute;transform:translate(-50%,-50%);width:400px;padding:14px 18px;font-size:32px;font-weight:700;text-align:center;line-height:1.35;cursor:pointer;z-index:2}
.mm .br.closed{color:transparent}
.mm .br.closed:after{content:"؟";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#2b3a55;font-size:54px}
/* compare */
.cmp{position:absolute;display:flex;gap:30px}
.cmp .side{flex:1;padding:20px 26px}
.cmp .side h3{margin:0 0 10px;font-size:44px;text-align:center}
.cmp .side li{font-size:34px;font-weight:700;line-height:1.5;margin:6px 0;list-style:none;transition:opacity .4s}
.cmp .side li.hid{opacity:0}
.cmp .side li:before{content:"◆ ";color:rgba(0,0,0,.35)}
/* flip */
.flips{position:absolute;display:grid;gap:26px}
.flip{perspective:1000px;cursor:pointer}
.flip .in{position:relative;width:100%;height:100%;transition:transform .7s;transform-style:preserve-3d}
.flip.f .in{transform:rotateY(180deg)}
.flip .fr,.flip .bk{position:absolute;inset:0;backface-visibility:hidden;border-radius:30px;border:6px solid;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:16px;box-shadow:0 8px 0 rgba(0,0,0,.14)}
.flip .fr .e{font-size:84px}.flip .fr .t{font-size:44px;font-weight:900;line-height:1.25}.flip .fr .en2{font-size:30px;color:#3b4f72;font-weight:700;direction:ltr}
.flip .bk{transform:rotateY(180deg);background:#fff;font-size:34px;font-weight:700;line-height:1.45}
/* timer (try) */
.timer{position:absolute;width:250px;height:250px}
.timer svg{width:100%;height:100%;transform:rotate(-90deg)}
.timer .tv{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:62px;font-weight:900}
.timer .tv small{font-size:22px}
.timer button{position:absolute;bottom:-62px;left:50%;transform:translateX(-50%);border:4px solid #2b3a55;border-radius:16px;background:#ffcb3d;font-size:26px;font-weight:800;padding:2px 22px;white-space:nowrap}
/* exit ticket */
.exit{position:absolute;display:flex;gap:26px}
.exit .xc{flex:1;padding:22px;text-align:center;cursor:pointer}
.exit .xc .k{font-size:90px;font-weight:900;line-height:1}
.exit .xc .p{font-size:34px;font-weight:800;line-height:1.4;margin-top:8px}
/* homework */
.hwc{position:absolute;left:50%;transform:translateX(-50%) rotate(-1deg);width:1080px;background:#fffef6;border:6px solid #2b3a55;border-radius:20px;padding:30px 50px 34px;box-shadow:0 12px 0 rgba(0,0,0,.18);background-image:repeating-linear-gradient(transparent 0 62px,#cfe3f3 62px 64px)}
.hwc h3{margin:0 0 6px;font-size:50px;color:#d6344f}
.hwc li{font-size:38px;font-weight:700;line-height:64px}
.hwc .pin2{position:absolute;top:-28px;left:50%;font-size:56px;transform:translateX(-50%)}
.mascot{position:absolute;width:300px;height:300px;pointer-events:none}
.mascot svg{width:100%;height:100%;overflow:visible}
.say{position:absolute;background:#fff;border:5px solid #2b3a55;border-radius:28px;padding:10px 22px;font-size:32px;font-weight:800;line-height:1.35;box-shadow:0 6px 0 rgba(0,0,0,.14)}
.periodcard{position:absolute;left:50%;top:210px;transform:translateX(-50%);width:1000px;text-align:center;padding:36px}
.periodcard .pn{font-size:100px;font-weight:900;color:#d6344f;line-height:1.1}
.periodcard .ax{font-size:44px;font-weight:800;margin-top:12px;line-height:1.35}

/* live web editor (R.web, G10) */
.webed,.webpv{position:absolute;border-radius:22px;overflow:hidden;box-shadow:0 10px 0 rgba(0,0,0,.14);display:flex;flex-direction:column;z-index:4}
.webed{background:#1f2433;border:5px solid #3b4566}
.webpv{background:#fff;border:5px solid var(--gold);transition:all .35s}
.webpv.big{left:50px!important;width:1500px!important;z-index:9}
.webed .bar,.webpv .bar{display:flex;align-items:center;gap:14px;padding:8px 16px;font-size:24px;font-weight:700}
.webed .bar{background:#2c3349;color:#c9d3f0}.webpv .bar{background:#f2ece0;color:#5b6782}
.webed .dots i{display:inline-block;width:14px;height:14px;border-radius:50%;margin-left:6px;background:#ff6b6b}.webed .dots i:nth-child(2){background:#ffd166}.webed .dots i:nth-child(3){background:#6ccf8e}
.webed .fn{direction:ltr;font-family:Consolas,'Courier New',monospace;color:#ffd166}.webed .lb,.webpv .lb{margin-inline-start:auto;white-space:nowrap}
.webpv .url{flex:1;direction:ltr;text-align:left;background:#fff;border-radius:14px;padding:2px 14px;font-size:20px;font-family:Consolas,'Courier New',monospace;color:#3b4566;overflow:hidden;white-space:nowrap}
.webed textarea{flex:1;width:100%;border:0;outline:0;resize:none;background:transparent;color:#e8edff;caret-color:#ffd166;font:600 25px/1.45 Consolas,'Courier New',monospace;padding:14px 18px;direction:ltr;text-align:left;white-space:pre;tab-size:2}
.webpv iframe{flex:1;width:100%;border:0;background:#fff}
.webbt{position:absolute;display:flex;gap:14px;z-index:5}
.webbt button{font:700 24px 'Baloo Bhaijaan 2',sans-serif;padding:4px 22px;border-radius:18px;border:4px solid #3b4566;background:#fffaf0;color:#2c3349;cursor:pointer;box-shadow:0 5px 0 rgba(0,0,0,.12)}
.webbt button.sol{border-color:#e2b13c;background:#fff4d6}
/* ===== deck2 additions ===== */
.dots{position:absolute;bottom:22px;left:50%;transform:translateX(-50%);display:flex;gap:12px;z-index:6}
.dots i{width:22px;height:22px;border-radius:50%;background:#fff;border:4px solid #2b3a55;transition:.3s}
.dots i.c{background:#ffcb3d;transform:scale(1.35)}
.dots i.d{background:#6ccf8e}
.qn{font-size:24px;color:#5b6782;font-weight:700;margin-bottom:4px}
.askb{min-height:260px;line-height:1.45;padding:26px 40px;display:flex;flex-direction:column;justify-content:center}
.askb .ans{font-size:.9em}
.blank.qb{display:inline-block;min-width:150px;border-bottom:6px solid #e2b13c;color:#c0902c;padding:0 14px;margin:0 6px}
.blank.qb.okc{color:#1d7a40;border-color:#2fa35a;background:#e9fbef;border-radius:12px}
.readc{position:absolute;background:#fffdf6;border:5px solid #e2b13c;border-radius:30px;padding:24px 40px 24px;box-shadow:0 8px 0 rgba(0,0,0,.12);line-height:1.7;font-weight:600;max-height:690px;overflow:hidden}
.readc p{margin:0 0 12px;transition:opacity .4s,background .4s;border-radius:14px;padding:2px 10px}
.readc p.dim2{opacity:.28}
.readc p.cur{background:#fff3c4}
.readc.listen p.dim2{opacity:1;filter:blur(9px)}
.readc.quran{font-family:'Amiri','Noto Naskh Arabic',serif;line-height:2}

", "nothing", "no-one"], "a": 0}, {"q": "Bob: There's ___ wrong with the engine.", "o": ["something", "anyone", "anywhere"], "a": 0}, {"q": "Customer: The sign in the window says ‘___ must go.’", "o": ["Everything", "Anyone", "Somewhere"], "a": 0}]}, {"type": "ask", "title": "Voicemail messages", "qs": [{"q": "What information do people usually leave in a voicemail?", "a": "Their name, their number, why they called, where and when to meet."}, {"q": "Tony's message is about ‘pick up father’. Predict: what does Tony want?", "a": "Maybe he wants someone to pick up his father from the airport."}, {"q": "Leave a voicemail for your friend: say name, number, why, where, when.", "a": "Hi Salim, it's Faisal. My number is … Can we study together at the library at 4 o'clock? Thanks!"}], "icon": "📞"}, {"type": "race", "title": "Team race", "qs": [{"q": "GR8 = …", "options": ["great", "grade", "green"], "a": 0}, {"q": "‘can't stand’ = …", "options": ["love", "dislike strongly", "sit down"], "a": 1}, {"q": "‘info’ is short for …", "options": ["information", "informal", "inform"], "a": 0}, {"q": "Loud, unpleasant sound in a place is noise …", "options": ["pollution", "privacy", "opinion"], "a": 0}, {"q": "CU L8R = …", "options": ["see you later", "call you later", "cool letter"], "a": 0}, {"q": "There isn't ___ in the fridge.", "options": ["anything", "something", "nothing"], "a": 0}], "icon": "🏎️"}, {"type": "steps", "title": "Let's remember!", "icon": "🧠", "steps": ["Opinions: I can't stand … / It's marvellous in an emergency.", "Abbreviations: exam, info, IT, dept, SMS, uni, tv, USA.", "SMS: 2MORO, L8R, GR8, B4N, CU, THX, RU, @ …", "some- in positive sentences, any- in questions and negatives, no- = not any."]}, {"type": "exit", "title": "Exit ticket", "items": [{"k": "3", "text": "Write one advantage and one disadvantage of mobile phones."}, {"k": "2", "text": "Write in Standard English: THX 4 d GR8 nyt. CU 2MORO."}, {"k": "1", "text": "What does ‘privacy’ mean?"}], "icon": "🎟️"}, {"type": "homework", "title": "Homework", "head": "My homework", "items": ["WB pp. 6–7: Acts. 1, 2 and 4.", "Write a short SMS conversation (4 messages) and its Standard English version.", "Learn the nine words from CB p. 6 Act. 2."], "icon": "🏠"}]}, {"id": "L05", "unit": "U1", "unitName": "Theme 1 · Communication", "title": "Unit 4 · Communication Skills (Listening and Speaking)", "code": "", "theme": "park", "emo": "🗣️", "slides": [{"type": "cover", "say": "Theme 1 · Unit 4 · Listening and Speaking"}, {"type": "goals", "title": "Today's goals", "items": ["I can explain why talking AND listening are both important.", "I can use phrases from everyday conversation."], "icon": "🎯"}, {"type": "goals", "title": "Today's goals", "items": ["I can analyse what makes a conversation successful.", "I can keep a conversation going with a partner."], "icon": "🎯"}, {"type": "enter", "title": "Catch only what a GOOD listener does.", "gate": "✓", "items": [{"text": "waits for his turn", "in": true}, {"text": "smiles", "in": true}, {"text": "says ‘Really?’", "in": true}, {"text": "answers only ‘yes’", "in": false}, {"text": "yawns", "in": false}, {"text": "talks all the time", "in": false}]}, {"type": "read", "title": "Communication", "paras": ["Communication is very important in our lives. We need to communicate to know what other people want and how they feel. Communication involves both [[talking]] and [[listening]].", "Relationships are [[two-sided]]; each person needs to make themselves heard, and to hear other people. If you are always talking or always listening, the relationship is not [[balanced]]."], "icon": "📖"}, {"type": "read", "title": "Communication", "paras": ["Communication is the way you can [[express]] your needs, wants and feelings. If feelings are negative and you don't express them, they can make you unhappy or angry. If you have [[pent-up]] feelings, talk to someone about them. Sharing a problem will make you feel better."], "icon": "📖"}, {"type": "quiz", "title": "Answer the questions", "qs": [{"q": "a What two things does communication involve?", "o": ["talking and listening", "reading and writing", "texting and calling"], "a": 0}, {"q": "b Why is it important to express our feelings?", "o": ["Negative feelings kept inside can make us unhappy or angry.", "Because it is polite.", "So we can sleep less."], "a": 0}, {"q": "c ‘pent-up’ (line 10) probably means …", "o": ["kept inside", "very happy", "written down"], "a": 0, "why": "‘feelings can get trapped inside your head and never get out’"}, {"q": "Choose an appropriate title:", "o": ["Why Communication Matters", "How to Use a Phone", "My Favourite Hobby"], "a": 0}], "icon": "✅"}, {"type": "ask", "title": "Two interviews", "qs": [{"q": "A teacher at a language school is interviewing two students. What questions do you think he asks?", "a": "Where are you from? Why do you want to learn English? What are your hobbies?"}, {"q": "Student 1 answers ‘Yes.’ ‘No.’ ‘I don't know.’ What does the teacher think?", "a": "He thinks the student is shy or not interested. The conversation stops."}, {"q": "Student 2 answers with full sentences and asks ‘How about you?’ Who has better communication skills? Why?", "a": "Student 2, because she gives details, shows interest and asks questions."}], "img": "L05_c1", "icon": "🎧"}, {"type": "match", "title": "Sound Bites", "pairs": [["Your friend: ‘I won the race!’", "How exciting!"], ["Your friend: ‘My grandmother is ill.’", "I'm sorry to hear that."], ["You meet a friend after a long time.", "Nice to see you!"]], "icon": "🔊"}, {"type": "match", "title": "Sound Bites", "pairs": [["You want your friend's opinion.", "What do you think?"], ["You answered; now you ask your friend the same.", "How about you?"], ["You are leaving and will meet again soon.", "See you later!"]], "icon": "🔊"}, {"type": "ask", "title": "Is this conversation successful?", "qs": [{"q": "a–b How does the conversation start?", "a": "‘Hello there.’ ‘Hi!’ ‘Good to see you! How are you?’ – a friendly start."}, {"q": "c–e What problems does one girl share?", "a": "She is a bit down: she has too much homework and she has lost her mobile phone."}, {"q": "d What does the listener say?", "a": "Only ‘mm.. oh..’ – she does not ask any questions about the problem."}, {"q": "g–h How does it end?", "a": "‘Let's get together soon. What about Thursday?’ ‘Great … I'll see you then.’ ‘OK, bye.’"}, {"q": "So, is it successful?", "a": "Only partly: it starts and ends well, but the listener shows little interest and asks no related questions."}], "img": "L05_c3", "icon": "🤔"}, {"type": "explain", "title": "Making conversation", "lines": ["Show interest. Nod your head, and say ‘mm’ or ‘really?’", "Make eye contact. Take turns talking and listening.", "Don't just answer ‘yes’ or ‘no’.", "Ask questions related to something the other person has just said."], "rule": "Listen ➜ show interest ➜ ask", "icon": "💡"}, {"type": "flip", "title": "Making conversation 💡 – examples", "cards": [{"front": "A: I've lost my phone. B: [[Oh no! Where did you lose it?]]", "icon": "💡", "back": "a related question ✅"}, {"front": "A: Do you like football? B: [[Yes, I love it! I play every Friday. How about you?]]", "icon": "✨", "back": "more than ‘yes’ ✅"}]}, {"type": "build", "title": "Make it better", "mode": "words", "items": [{"a": "Oh no! I'm sorry to hear that. Why are you down?", "hint": "Why are you down? / I'm sorry to hear that. / Oh no!", "emo": "😟"}, {"a": "Really? Which subject is the homework for?", "hint": "is the homework for? / Really? / Which subject", "emo": "📚"}, {"a": "Poor you! Where did you lose your phone?", "hint": "lose your phone? / Poor you! / Where did you", "emo": "📱"}], "icon": "✨"}, {"type": "quiz", "title": "Fact files", "qs": [{"q": "The Internet began in the …", "o": ["1960s in the USA military", "1990s in Britain", "1970s in Japan"], "a": 0}, {"q": "Another name for the Internet is …", "o": ["the web page", "the net", "the cell"], "a": 1}, {"q": "Mobile phones were first used in …", "o": ["1953", "1973", "1993"], "a": 1}, {"q": "Mobiles are banned at some golf and tennis competitions because of …", "o": ["noise and distracting players", "the price", "the weather"], "a": 0}, {"q": "Other names for mobile phones are …", "o": ["‘mobiles’ or ‘cells’", "‘laptops’ or ‘tablets’", "‘radios’"], "a": 0}], "img": "L05_c4", "icon": "📊"}, {"type": "ask", "title": "Give a short talk", "qs": [{"q": "Student A: Talk about the Internet for one minute.", "a": "The Internet is a global system of computer networks. It is also called ‘the net’. It began in the 1960s in the USA military. People use it for online shopping, booking holidays and sending e-mails."}, {"q": "Student B: Talk about mobile phones for one minute.", "a": "Mobile phones were first used in 1973. They are also called ‘mobiles’ or ‘cells’. We use them for calling, texting, filming and playing music."}, {"q": "Partner: ask one related question.", "a": "Really? Why are phones banned in hospitals?"}], "img": "L05_c4", "icon": "🎤"}, {"type": "ask", "title": "Shyness", "qs": [{"q": "Why do some teenagers find it difficult to make conversation?", "a": "Because they are shy, or they are afraid of making mistakes."}, {"q": "Which ideas can help a shy person? Choose two and explain.", "a": "Smile and make eye contact. Ask questions and listen to the answers."}, {"q": "Do you think many famous people are shy? Why / why not?", "a": "Maybe some are, but they learn to look confident."}], "icon": "😳"}, {"type": "wheel", "title": "Keep the conversation going", "items": [{"q": "family 👨‍👩‍👧", "a": "A: How many brothers and sisters do you have? B: Three. A: Really? Are they older or younger?"}, {"q": "free time activities ⚽", "a": "A: What do you do at weekends? B: I love going shopping. A: Really? What kind of shops do you like?"}, {"q": "your last holiday 🏖️", "a": "A: Where did you go last holiday? B: To Salalah. A: How exciting! What did you see there?"}, {"q": "plans for the weekend 📅", "a": "A: What are you doing this weekend? B: I'm visiting my grandparents. A: Nice! Where do they live?"}], "icon": "🎡"}, {"type": "race", "title": "Team race", "qs": [{"q": "Communication involves talking and …", "options": ["listening", "texting", "sleeping"], "a": 0}, {"q": "Your friend is ill. You say: …", "options": ["How exciting!", "I'm sorry to hear that.", "See you later!"], "a": 1}, {"q": "A good listener …", "options": ["answers only ‘yes’", "asks related questions", "looks at the floor"], "a": 1}, {"q": "‘pent-up feelings’ are …", "options": ["kept inside", "shared", "funny"], "a": 0}, {"q": "After you answer, you ask: …", "options": ["How about you?", "Goodbye!", "Really?"], "a": 0}, {"q": "If one person always talks, the relationship is not …", "options": ["balanced", "online", "busy"], "a": 0}], "icon": "🏎️"}, {"type": "steps", "title": "Let's remember!", "icon": "🧠", "steps": ["Communication = talking + listening. Share your feelings.", "Everyday phrases: Really? That's interesting. I'm sorry to hear that. How about you?", "Show interest, make eye contact, take turns.", "Don't just say yes/no – ask related questions."]}, {"type": "exit", "title": "Exit ticket", "items": [{"k": "3", "text": "Write two tips for a successful conversation."}, {"k": "2", "text": "Your friend says ‘I've got a new bike.’ Write a related question."}, {"k": "1", "text": "Which Sound Bite do you say when you leave?"}], "icon": "🎟️"}, {"type": "homework", "title": "Homework", "head": "My homework", "items": ["WB p. 9 Act. 4: write a question for each subject and a follow-up question.", "WB p. 9 Act. 5: write two short conversations with Sound Bites phrases.", "Prepare your one-minute fact-file talk (WB p. 8)."], "icon": "🏠"}]}, {"id": "L06", "unit": "U1", "unitName": "Theme 1 · Communication", "title": "Unit 5 · E-Mail (Writing)", "code": "", "theme": "park", "emo": "📧", "slides": [{"type": "cover", "say": "Theme 1 · Unit 5 · Writing"}, {"type": "goals", "title": "Today's goals", "items": ["I can talk about how I use e-mail.", "I can explain the ten rules for writing e-mails.", "I can find the rules that an e-mail breaks."], "icon": "🎯"}, {"type": "goals", "title": "Today's goals", "items": ["I can label the parts of an e-mail.", "I can write an informal e-mail."], "icon": "🎯"}, {"type": "ask", "title": "You and e-mail", "qs": [{"q": "Do you send e-mails? Who do you e-mail?", "a": "Yes, I send e-mails to my teachers and sometimes to my cousin."}, {"q": "Is it better to reply immediately, or wait and think?", "a": "It is better to wait and think, especially if the e-mail is important."}, {"q": "Is it a good idea to send jokes or pictures by e-mail?", "a": "Only to friends, and only polite jokes."}, {"q": "Is it right for anyone to monitor private e-mails? Is this ever appropriate?", "a": "Usually no, but maybe a company can check work e-mails."}], "img": "L06_c1", "icon": "💬"}, {"type": "tf", "title": "When you write an e-mail, you should …", "items": [{"text": "a make sure that you send it to everyone.", "a": false, "fix": "Rule 3: Don't send it to people who do not need to read it."}, {"text": "b check your spelling and punctuation.", "a": true, "fix": "Rule 5."}, {"text": "c always use ‘smileys’ to help the reader.", "a": false, "fix": "Rule 7: only in the most informal e-mails."}, {"text": "d not write horrible things about someone and send it around.", "a": true, "fix": "Rules 1 and 4: think carefully and be polite."}], "icon": "✔✘"}, {"type": "tf", "title": "When you write an e-mail, you should …", "items": [{"text": "e not write a subject line – it is not necessary.", "a": false, "fix": "Rule 8: the subject line is the most important part."}, {"text": "f write out long sentences in capital letters.", "a": false, "fix": "Rule 6: the reader will think you are shouting."}, {"text": "g not worry about correct grammar.", "a": false, "fix": "Rule 5."}, {"text": "h think about who you are writing to and use appropriate language.", "a": true, "fix": "Rule 4."}], "icon": "✔✘"}, {"type": "read", "title": "Ten Rules for Writing E-Mails", "paras": ["1 Think carefully about what you write. 2 Keep your e-mail [[short]]. 3 Don't send it to people who do not need to read it.", "4 Be [[polite]]: think about who you are writing to – friend, family or colleague? 5 Pay attention to your [[spelling, grammar and punctuation]]."], "img": "L06_c2", "icon": "📜"}, {"type": "read", "title": "Ten Rules for Writing E-Mails", "paras": ["6 Don't write in [[CAPITALS]] – the reader will think you are shouting. 7 Don't use ‘smileys’ except in the most informal e-mails.", "8 Include a [[subject line]]. 9 Don't send [[confidential]] information – e-mails are not private. 10 Don't mark e-mails high priority or [[urgent]] – if it is urgent, use a telephone."], "img": "L06_c2", "icon": "📜"}, {"type": "memory", "title": "Rule memory", "pairs": [["Don't write in CAPITALS", "📢 = shouting"], ["Keep it short", "✂️ 1–2 paragraphs"], ["Include a subject line", "🏷️ most important part"], ["No confidential information", "🔒 e-mails are not private"], ["Smileys", "🙂 only very informal"], ["Urgent?", "☎️ use a telephone"]], "icon": "🧠"}, {"type": "quiz", "title": "Which rules are broken?", "qs": [{"q": "E-mail a (Musallam to his mum, sent to five people): which rule is broken?", "o": ["Rule 3 – it goes to people who don't need to read it", "Rule 6 – capitals", "Rule 10 – urgent"], "a": 0, "why": "Also rule 1: he writes something unkind about Auntie Muna's cooking."}, {"q": "E-mail b (DWC Motors: ‘PLEASE send me the MONEY’):", "o": ["Rules 6 and 7 – capitals and a smiley in a formal e-mail", "Rule 2 – too long", "No rules are broken"], "a": 0, "why": "There is also no subject line (rule 8)."}, {"q": "E-mail c (Khadija: ‘my passwurd is JJC/345’):", "o": ["Rule 9 – confidential information; rule 5 – spelling", "Rule 4 only", "Rule 10 only"], "a": 0, "why": "Also smileys (rule 7) and no capital letters."}, {"q": "E-mail d (a  "🎯"}, {"type": "goals", "title": "Today's goals", "items": ["I can talk about the good and difficult sides of being a teenager.", "I know what we will study in Theme 2."], "icon": "🎯"}, {"type": "ask", "title": "He's just a teenager …", "qs": [{"q": "Who are the people in the photo? How does each one feel?", "a": "A father and a mother are talking about their son. They look worried. The boy looks unhappy or bored."}, {"q": "‘What's the matter with him these days? Is he ill?’ – ‘No. He's just a teenager …’ What does the mother mean?", "a": "She means his behaviour is normal for his age."}, {"q": "Do adults sometimes say this about you?", "a": "Yes! My parents say I sleep too much."}], "img": "L09_c1", "icon": "😄"}, {"type": "quiz", "title": "What does ‘adolescence’ mean?", "qs": [{"q": "Adolescence is …", "o": ["a time when everything changes", "the time before someone gets married", "the period between childhood and adulthood", "the training period for a new job"], "a": 2, "why": "CB p. 18: ‘the stage of human development after childhood’ … ‘from a dependent child to an independent adult’."}, {"q": "Adolescence is during the teenage years, from about …", "o": ["5 to 10", "13 to 19", "20 to 30"], "a": 1}], "icon": "🤔"}, {"type": "read", "title": "Adolescence", "paras": ["Adolescence is a time of excitement, but also of [[angst]]. It brings many changes; the new-found joys of [[hanging out]] with friends, but also unwelcome physical changes like [[acne]]."], "img": "L09_c2", "icon": "📖"}, {"type": "read", "title": "Adolescence", "paras": ["Relationships with adults change too. Teens complain that parents are [[suspicious]] and [[critical]]; parents complain about teenage [[mood swings]].", "More than ever, a teen needs a good [[circle of friends]], but sometimes [[peer pressure]] leads teenagers into bad habits."], "img": "L09_c2", "icon": "📖"}, {"type": "read", "title": "Adolescence", "paras": ["And with the growing [[influence]] of the [[Western media]] and the Internet, are young Omanis in danger of forgetting their own culture?"], "img": "L09_c2", "icon": "📖"}, {"type": "match", "title": "Match the bold words", "pairs": [["angst", "😟 strong worry"], ["hanging out", "👫 spending time with friends"], ["suspicious", "🤨 not trusting"]], "icon": "🧩"}, {"type": "match", "title": "Match the bold words", "pairs": [["critical", "👎 finding faults"], ["mood swings", "😊➡️😠 quick changes of feeling"], ["peer pressure", "👥 pressure from friends your age"]], "icon": "🧩"}, {"type": "sort", "title": "The best and the worst", "bins": [{"label": "Exciting side", "icon": "😀"}, {"label": "Difficult side", "icon": "😟"}], "cards": [{"text": "excitement", "icon": "", "bin": 0}, {"text": "hanging out with friends", "icon": "", "bin": 0}, {"text": "a good circle of friends", "icon": "", "bin": 0}, {"text": "new-found joys", "icon": "", "bin": 0}, {"text": "angst", "icon": "", "bin": 1}, {"text": "acne", "icon": "", "bin": 1}, {"text": "mood swings", "icon": "", "bin": 1}, {"text": "peer pressure", "icon": "", "bin": 1}, {"text": "critical parents", "icon": "", "bin": 1}], "icon": "🌗"}, {"type": "quiz", "title": "Complete the text", "icon": "✏️", "qs": [{"q": "Adolescence is a time of excitement, but also of ___ .", "o": ["angst", "acne", "media"], "a": 0}, {"q": "Teens complain that parents are suspicious and ___ .", "o": ["critical", "cool", "online"], "a": 0}, {"q": "Parents complain about teenage mood ___ .", "o": ["swings", "spurts", "friends"], "a": 0}, {"q": "Sometimes peer ___ leads teenagers into bad habits.", "o": ["pressure", "media", "circle"], "a": 0}]}, {"type": "ask", "title": "Theme 2 map", "qs": [{"q": "Unit 1 – Goodbye to Childhood 📖", "a": "Reading: the changes of adolescence."}, {"q": "Unit 2 – Teens and Adults 👨‍👦", "a": "Grammar: past simple and past continuous."}, {"q": "Unit 3 – Teenage Friendships 👫", "a": "Vocabulary: friends, qualities and giving advice."}], "icon": "🗺️"}, {"type": "ask", "title": "Theme 2 map", "qs": [{"q": "Unit 4 – Western Influence – Good or Bad? 🍔", "a": "Listening and speaking: asking questions and opinions."}, {"q": "Unit 5 – Teenage Angst ✉️", "a": "Writing: an informal letter to a problem page."}, {"q": "Across Cultures + Reading for Pleasure 🇺🇸", "a": "The USA and Joan of Arc (a teenager who changed things)."}], "icon": "🗺️"}, {"type": "wheel", "title": "Spin and talk", "items": [{"q": "What is the best thing about being a teenager?", "a": "Hanging out with my friends and having more freedom."}, {"q": "What is the most difficult thing?", "a": "Exams and deciding about the future."}, {"q": "Are your parents ever suspicious? When?", "a": "Sometimes, when I come home late."}, {"q": "Is a good circle of friends important? Why?", "a": "Yes, because friends help us when we have problems."}, {"q": "Are young Omanis forgetting their culture? Why / why not?", "a": "I don't think so. We still love our traditions, like the majlis and Omani food."}, {"q": "How do the Western media influence teenagers?", "a": "They influence clothes, music and food."}], "icon": "🎡"}, {"type": "tf", "title": "True or false?", "items": [{"text": "The text says adolescence is only a time of excitement.", "a": false, "fix": "It is a time of excitement, but also of angst."}, {"text": "Relationships with adults change during adolescence.", "a": true, "fix": "Relationships with adults change too."}, {"text": "Parents complain about teenage mood swings.", "a": true, "fix": "…parents complain about teenage mood swings."}, {"text": "Peer pressure always leads teenagers into good habits.", "a": false, "fix": "Sometimes peer pressure leads teenagers into bad habits."}], "icon": "✔✘"}, {"type": "enter", "title": "Catch only the words from the Theme 2 text.", "gate": "✓", "items": [{"text": "acne", "in": true}, {"text": "gesture", "in": false}, {"text": "peer pressure", "in": true}, {"text": "blog", "in": false}, {"text": "laptop", "in": false}, {"text": "hanging out", "in": true}]}, {"type": "race", "title": "Team race", "qs": [{"q": "Adolescence is the period between childhood and …", "options": ["adulthood", "school", "marriage"], "a": 0}, {"q": "Quick changes of feeling = mood …", "options": ["swings", "spots", "media"], "a": 0}, {"q": "Your group of friends = your … of friends.", "options": ["circle", "pressure", "angst"], "a": 0}, {"q": "Red spots on the face = …", "options": ["acne", "angst", "influence"], "a": 0}, {"q": "‘Hanging out’ means …", "options": ["spending time with friends", "washing clothes", "going to bed"], "a": 0}, {"q": "Parents who don't trust you are …", "options": ["suspicious", "cool", "excited"], "a": 0}], "icon": "🏎️"}, {"type": "steps", "title": "Let's remember!", "icon": "🧠", "steps": ["Adolescence = the period between childhood and adulthood.", "Exciting: hanging out, a good circle of friends.", "Difficult: angst, acne, mood swings, peer pressure, critical parents.", "Big question: Western media – good or bad?"]}, {"type": "exit", "title": "Exit ticket", "items": [{"k": "3", "text": "What does ‘adolescence’ mean?"}, {"k": "2", "text": "Write one good thing and one difficult thing about being a teenager."}, {"k": "1", "text": "What is ‘peer pressure’?"}], "icon": "🎟️"}, {"type": "homework", "title": "Homework", "head": "My homework", "items": ["Write the ten bold words from CB p. 17 with their meanings.", "Write 4 sentences: The best thing about being a teenager is … The worst thing is …", "Write one question you ask yourself as a teenager (e.g. Who am I?)."], "icon": "🏠"}]}, {"id": "L10", "unit": "U2", "unitName": "Theme 2 · Those Teenage Things", "title": "Unit 1 · Goodbye to Childhood (Reading)", "code": "", "theme": "city", "emo": "🧒➡️🧑", "slides": [{"type": "cover", "say": "Theme 2 · Unit 1 · Reading"}, {"type": "goals", "title": "Today's goals", "items": ["I can skim a text and find the topic of each paragraph.", "I can identify the main ideas in a reading text."], "icon": "🎯"}, {"type": "goals", "title": "Today's goals", "items": ["I can find words with similar meanings.", "I can discuss teenage stereotypes in Oman."], "icon": "🎯"}, {"type": "ask", "title": "Big questions", "qs": [{"q": "Who am I?", "a": "I am Omani, a son, a brother, a student and a footballer."}, {"q": "What am I good at?", "a": "I'm good at maths and drawing."}, {"q": "What am I going to do with my life?", "a": "I'm going to study engineering and work in Oman."}, {"q": "What are my values?", "a": "Honesty, respect for my parents and helping others."}], "img": "L10_c1", "icon": "❓"}, {"type": "match", "title": "Skim: which paragraph?", "pairs": [["b the nature of adolescence", "Paragraph 1"], ["c physical changes", "Paragraph 2"], ["d mental changes", "Paragraph 3"], ["a relationship with family", "Paragraph 4"]], "icon": "⚡"}, {"type": "explain", "title": "Looking for the main ideas", "lines": ["Don't read every word when you are skimming a text.", "You just need to understand how the text is organised.", "Read it as quickly as possible and identify the main ideas."], "rule": "Skim ➜ main ideas · Read again ➜ details", "icon": "💡"}, {"type": "flip", "title": "Looking for the main ideas 💡 – examples", "cards": [{"front": "Paragraph 2: [[The start of adolescence is marked by physical changes.]]", "icon": "💡", "back": "the first sentence often gives the main idea"}, {"front": "Paragraph 3: [[The hormonal changes … cause mental changes too.]]", "icon": "✨", "back": "topic sentence"}]}, {"type": "read", "title": "Adolescence (1)", "paras": ["1 Adolescence is the stage of human development after childhood. It is a time of [[transition]] – when a young person changes from being a [[dependent]] child to an [[independent]] adult. It occurs from approximately thirteen to nineteen. It is an exciting time of discovery, but it can also be [[stressful]] and confusing."], "img": "L10_c2", "icon": "📖"}, {"type": "read", "title": "Adolescence (1)", "paras": ["2 The start of adolescence is marked by [[physical]] changes. These are caused by changes in [[hormones]], the chemical substances produced by your body. There is a noticeable increase in weight and height. This is known as a [[growth spurt]]. Girls begin their growth spurt earlier than boys; boys' growth spurt occurs between 12 and 17. Boys' voices ‘break’ and become lower and deeper."], "img": "L10_c2", "icon": "📖"}, {"type": "read", "title": "Adolescence (2)", "paras": ["3 The hormonal changes cause [[mental]] changes too. Adolescents tend to think they are very important. They believe – often mistakenly – that everyone is looking at them. They become [[self-conscious]] and are easily embarrassed, for example by acne, ugly red [[spots]] on the face or neck."], "img": "L10_c2", "icon": "📖"}, {"type": "read", "title": "Adolescence (2)", "paras": ["4 On the one hand, teenagers want to be independent and make their own decisions. On the other hand, they still need the [[security]] offered by their families. Friends are extremely important to teenagers. But if a teenager regards his friends as more important than his family, this will cause family [[conflict]]."], "img": "L10_c2", "icon": "📖"}, {"type": "match", "title": "Words with similar meanings", "pairs": [["a change (para 1)", "transition"], ["b worrying (para 1)", "stressful"], ["c related to the body (para 2)", "physical"], ["d sudden increase (para 2)", "spurt"]], "icon": "🔍"}, {"type": "match", "title": "Words with similar meanings", "pairs": [["e related to the mind (para 3)", "mental"], ["f small round marks on the skin (para 3)", "spots"], ["g feeling of safety (para 4)", "security"], ["h disagreement (para 4)", "conflict"]], "icon": "🔍"}, {"type": "quiz", "title": "Answer the questions", "qs": [{"q": "a How is adolescence described?", "o": ["an exciting time of discovery, but also stressful and confusing", "a boring time", "a time with no changes"], "a": 0}, {"q": "b How is the growth spurt different in girls and boys?", "o": ["Girls begin much earlier (even at 10); boys between 12 and 17.", "Boys begin earlier than girls.", "There is no difference."], "a": 0}, {"q": "c What is acne?", "o": ["ugly red spots on the face or neck in the teenage years", "a kind of hormone", "a mood swing"], "a": 0}, {"q": "d How may friends become the cause of family conflict?", "o": ["If a teenager regards his friends as more important than his family.", "If friends visit the family.", "If friends help with homework."], "a": 0}], "icon": "✅"}, {"type": "ask", "title": "Time to Talk: teenage stereotypes", "qs": [{"q": "The typical teenager ‘is selfish and lazy’ and ‘thinks they know everything’. Is this true of teenagers in Oman?", "a": "Not really. Many Omani teenagers help their families and work hard at school."}, {"q": "‘Has mood swings’, ‘does not communicate well with parents’ – do you agree?", "a": "Sometimes it is true, but most teenagers talk to their parents."}, {"q": "‘Spends too much time in bed’, ‘is very untidy’ – true or false for you?", "a": "I sleep late at the weekend, but my room is tidy!"}, {"q": "Can you think of other stereotypes?", "a": "Teenagers are always on their phones."}], "img": "L10_c3", "icon": "🗣️"}, {"type": "quiz", "title": "Summary gap-fill", "icon": "✏️", "qs": [{"q": "The period between childhood and adulthood is called ___ .", "o": ["adolescence", "puberty", "security"], "a": 0}, {"q": "The teenage years can be ___ and confusing.", "o": ["stressful", "physical", "mental"], "a": 0}, {"q": "Changes in chemical substances called ___ cause changes to the body.", "o": ["hormones", "spots", "spurts"], "a": 0}, {"q": "One change is a growth ___ , which usually occurs later in boys.", "o": ["spurt", "conflict", "swing"], "a": 0}, {"q": "They become very ___ about their appearance.", "o": ["self-conscious", "independent", "dependent"], "a": 0}, {"q": "Many teenagers want to be ___ , but they still need their families.", "o": ["independent", "stressful", "embarrassed"], "a": 0}]}, {"type": "quiz", "title": "A Time to Experiment: meanings", "qs": [{"q": "cool (adj)", "o": ["cold", "calm", "attractive"], "a": 2}, {"q": "peer pressure (n) – wanting approval from …", "o": ["teachers", "family", "friends the same age"], "a": 2}, {"q": "chill (v)", "o": ["something cold", "relax", "become less hot"], "a": 1}, {"q": "hang out (v)", "o": ["spend time with", "study", "go shopping"], "a": 0}], "icon": "🧪"}, {"type": "ask", "title": "The best of times, the worst of times", "qs": [{"q": "Charles Dickens wrote: ‘It was the best of times, it was the worst of times …’ How is this true of adolescence?", "a": "It is the best time because we have friends and fun, and the worst because of exams and worries."}, {"q": "Look at the girl in the mirror. How is she feeling? Why?", "a": "She looks worried and self-conscious. Maybe she doesn't like how she looks."}, {"q": "Teenagers are ‘searching for their identity’. What does this mean?", "a": "They are trying to understand who they are."}], "img": "L10_c4", "icon": "📚"}, {"type": "write", "title": "Write a paragraph", "task": "Choose ONE topic: a) Why it is easier (or more difficult) to be a teenager than a child. b) Bad health habits of teenagers. c) What I miss most about my childhood. Write one paragraph (60–80 words).", "steps": ["Topic sentence: the main idea", "Reason 1 + example", "Reason 2 + example", "Concluding sentence"], "words": ["In my opinion, …", "Firstly, …", "Secondly, …", "For example, …", "On the one hand … on the other hand …", "To sum up, …"], "model": "In my opinion, it is more difficult to be a teenager than a child. Firstly, teenagers have more responsibilities. For example, we have important exams and we must think about our future careers. Secondly, our bodies and feelings change, and sometimes we feel self-conscious. On the one hand, we want to be independent; on the other hand, we still need our families. To sum up, adolescence is an exciting but stressful time.", "icon": "✍️"}, {"type": "memory", "title": "Word memory", "pairs": [["transition", "🧒➡️🧑"], ["growth spurt", "📏⬆️"], ["self-conscious", "😳👀"], ["security", "🏠🛡️"], ["conflict", "⚔️"], ["independent", "🕊️"]], "icon": "🧠"}, {"type": "race", "title": "Team race", "qs": [{"q": "Paragraph 2 is about …", "options": ["physical changes", "family", "mental changes"], "a": 0}, {"q": "‘disagreement’ = …", "options": ["conflict", "security", "spurt"], "a": 0}, {"q": "Girls begin their growth spurt …", "options": ["earlier than boys", "later than boys", "at 20"], "a": 0}, {"q": "Skimming = reading for …", "options": ["main ideas", "every word", "spelling"], "a": 0}, {"q": "‘mental’ means related to the …", "options": ["body", "mind", "family"], "a": 1}, {"q": "Teenagers still need the ___ offered by their families.", "options": ["security", "acne", "pressure"], "a": 0}], "icon": "🏎️"}, {"type": "steps", "title": "Let's remember!", "icon": "🧠", "steps": ["Adolescence: a transition from a dependent child to an independent adult (13–19).", "Physical changes (hormones, growth spurt) and mental changes (self-conscious).", "Teenagers want independence but still need family security.", "Skim for the main ideas: the first sentence of a paragraph helps."]}, {"type": "exit", "title": "Exit ticket", "items": [{"k": "3", "text": "Write the main idea of paragraph 4 in your own words."}, {"k": "2", "text": "Find a word that means ‘feeling of safety’."}, {"k": "1", "text": "Is the teenage stereotype true in Oman? One sentence."}], "icon": "🎟️"}, {"type": "homework", "title": "Homework", "head": "My homework", "items": ["WB pp. 16–17: Acts. 2 and 4.", "WB p. 17 Act. 5: write your paragraph.", "Write the eight words from CB p. 19 Act. 3 with their meanings."], "icon": "🏠"}]}, {"id": "L11", "unit": "U2", "unitName": "Theme 2 · Those Teenage Things", "title": "Unit 2 · Teens and Adults (Grammar)", "code": "", "theme": "city", "emo": "👨‍👦", "slides": [{"type": "cover", "say": "Theme 2 · Unit 2 · Grammar"}, {"type": "goals", "title": "Today's goals", "items": ["I can discuss relationships between parents and teens.", "I can find the past simple and past continuous in a dialogue."], "icon": "🎯"}, {"type": "goals", "title": "Today's goals", "items": ["I can use the past simple and past continuous correctly (when / while).", "I can act out a role play between a parent and a teenager."], "icon": "🎯"}, {"type": "ask", "title": "Parents and teens", "qs": [{"q": "a How has your relationship with your parents changed since you became a teenager?", "a": "My parents give me more freedom, but they also expect more from me."}, {"q": "b Why do parents and teenagers sometimes find it difficult to communicate?", "a": "Because they have different ideas and they don't always listen to each other."}, {"q": "c Is it easier if a teen has older brothers and sisters?", "a": "Yes, because parents already have experience. / No, because they compare us."}], "icon": "💬"}, {"type": "quiz", "title": "Teenagers and parents talking", "icon": "✏️", "qs": [{"q": "“They are always ___ of me, as if I'm up to no good. They don't trust me at all.”", "o": ["suspicious", "glued", "untidy"], "a": 0}, {"q": "“When I want to go out, they ___ me. Where are you going? Who with?”", "o": ["interrogate", "treat", "compare"], "a": 0}, {"q": "“They're always ___ me to my older sister. She's perfect; I'm not!”", "o": ["comparing", "interrogating", "treating"], "a": 0}, {"q": "“She used to be so sweet. But now she's always bad-tempered and ___ .”", "o": ["moody", "critical", "glued"], "a": 0}, {"q": "“He's ___ to his computer. He even eats in front of it.”", "o": ["glued", "moody", "suspicious"], "a": 0}, {"q": "“He's so ___ . He leaves his clothes lying all over the floor.”", "o": ["untidy", "critical", "suspicious"], "a": 0}]}, {"type": "read", "title": "Mr Hamed and Nasser", "paras": ["Mr Hamed: What [[was]] wrong with you in class today? You [[were falling]] asleep in my lesson. You [[weren't paying]] attention to my questions. When I [[looked]] at you, I [[saw]] that your eyes [[were closing]]."], "img": "L11_c1", "icon": "😴"}, {"type": "read", "title": "Mr Hamed and Nasser", "paras": ["Mr Hamed: What time [[did]] you [[go]] to bed last night?\nNasser: Er … ten o'clock. I [[did]] my homework, then I [[watched]] a bit of television, then I [[went]] to bed.", "Mr Hamed: Did you go to sleep straightaway?\nNasser: Well … no, not exactly. I [[was working]] online, then I [[chatted]] to one or two friends."], "img": "L11_c1", "icon": "😴"}, {"type": "read", "title": "Mr Hamed and Nasser", "paras": ["Mr Hamed: In other words, you [[were chatting]] on the Internet all night. You need to get more sleep. You've got exams soon!"], "img": "L11_c1", "icon": "😴"}, {"type": "quiz", "title": "Check your understanding", "qs": [{"q": "What was Nasser doing in class?", "o": ["He was falling asleep.", "He was chatting.", "He was writing."], "a": 0}, {"q": "What time did Nasser really go to sleep?", "o": ["ten o'clock", "half past two or three", "midnight"], "a": 1}, {"q": "Why was he so tired?", "o": ["He was chatting on the Internet all night.", "He was ill.", "He played football."], "a": 0}, {"q": "Mr Hamed's advice is …", "o": ["You need to get more sleep.", "Buy a new computer.", "Don't do homework."], "a": 0}], "icon": "✅"}, {"type": "explain", "title": "Past simple & past continuous", "lines": ["Past simple: a completed action in the past.", "Past continuous (was/were + -ing): an ongoing activity in the past, or something that was happening when another action happened."], "img": "L11_c2", "rule": "long action (was/were + -ing) + when + short action (past simple)", "icon": "⏪"}, {"type": "flip", "title": "Past simple & past continuous ⏪ – examples", "cards": [{"front": "In 2009, Oman [[won]] the Gulf Cup.", "icon": "💡", "back": "a: completed action"}, {"front": "She [[was wearing]] a lovely pink dress and silver shoes.", "icon": "✨", "back": "b: ongoing activity"}, {"front": "I [[was doing]] my homework when my friend [[knocked]] on the door.", "icon": "🔎", "back": "c: interrupted by another action"}]}, {"type": "match", "title": "Match the sentence to the usage", "pairs": [["1 I was doing my homework when my friend knocked on the door.", "c something happening when another action happened"], ["2 In 2009, Oman won the Gulf Cup.", "a a completed action in the past"], ["3 She was wearing a lovely pink dress and silver shoes.", "b an ongoing activity in the past"]], "icon": "🔗"}, {"type": "sort", "title": "Find them in the dialogue", "bins": [{"label": "Past simple", "icon": ""}, {"label": "Past continuous", "icon": ""}], "cards": [{"text": "looked", "icon": "", "bin": 0}, {"text": "saw", "icon": "", "bin": 0}, {"text": "watched", "icon": "", "bin": 0}, {"text": "went", "icon": "", "bin": 0}, {"text": "chatted", "icon": "", "bin": 0}, {"text": "were falling", "icon": "", "bin": 1}, {"text": "weren't paying", "icon": "", "bin": 1}, {"text": "were closing", "icon": "", "bin": 1}, {"text": "was working", "icon": "", "bin": 1}, {"text": "were chatting", "icon": "", "bin": 1}], "icon": "🔎"}, {"type": "quiz", "title": "Choose the best form", "icon": "✏️", "qs": [{"q": "We ___ dinner when there was a power cut.", "o": ["were having", "had"], "a": 0}, {"q": "J.K. Rowling taught English before she ___ the Harry Potter books.", "o": ["wrote", "was writing"], "a": 0}, {"q": "When I first lived abroad, I ___ many problems.", "o": ["experienced", "was experiencing"], "a": 0}, {"q": "What ___ at four o'clock yesterday afternoon?", "o": ["were you doing", "did you do"], "a": 0}, {"q": "I ___ coffee with my friends.", "o": ["was drinking", "drank"], "a": 0}, {"q": "The film was so boring that I almost ___ asleep.", "o": ["fell", "was falling"], "a": 0}]}, {"type": "build", "title": "when or while?", "mode": "words", "items": [{"a": "He was watching television when the phone rang.", "hint": "when the phone rang. / He was watching television", "emo": "📺"}, {"a": "She was driving to work when the police stopped her car.", "hint": "when the police stopped her car. / She was driving to work", "emo": "🚓"}, {"a": "While Mary was walking on the beach, she found 100 riyals.", "hint": "she found 100 riyals. / While Mary was walking on the beach,", "emo": "🏖️"}, {"a": "My cousin hurt his leg while he was playing football.", "hint": "while he was playing football. / My cousin hurt his leg", "emo": "⚽"}], "icon": "🧱"}, {"type": "quiz", "title": "Salim's prize", "icon": "✏️", "qs": [{"q": "Guess what ___ to me this morning! (happen)", "o": ["happened", "was happening"], "a": 0}, {"q": "I ___ a prize on the radio! (win)", "o": ["won", "was winning"], "a": 0}, {"q": "While I ___ to work, … (drive)", "o": ["was driving", "drove"], "a": 0}, {"q": "… I ___ to the radio. (listen)", "o": ["was listening", "listened"], "a": 0}, {"q": "Then he ___ a quiz question. (ask)", "o": ["asked", "was asking"], "a": 0}, {"q": "I ___ the answer straightaway. (know)", "o": ["knew", "was knowing"], "a": 0}]}, {"type": "quiz", "title": "Jane's story", "icon": "✏️", "qs": [{"q": "Hi, Jo! Last night a terrible thing ___ . (happen)", "o": ["happened", "was happening"], "a": 0}, {"q": "I ___ on my bed, reading a book … (sit)", "o": ["was sitting", "sat"], "a": 0}, {"q": "… when the door opened and my mum ___ in. (come)", "o": ["came", "was coming"], "a": 0}, {"q": "“What's that awful smell, Jane?” she ___ . (ask)", "o": ["asked", "was asking"], "a": 0}]}, {"type": "wheel", "title": "Role play: parents and teens", "items": [{"q": "📱 their mobile phone", "a": "Parent: You were using your phone at 2 a.m.! Teen: I'm sorry. I was talking to my friend about the test. Can I use it until 10 p.m.?"}, {"q": "🌐 the Internet", "a": "Parent: You were online all night again. Teen: I was doing research. OK, I'll stop at 11."}, {"q": "🚗 a car", "a": "Parent: You drove too fast yesterday. Teen: I was late for school. I'll leave earlier next time."}, {"q": "👫 a new friend", "a": "Parent: Who were you talking to after school? Teen: He's a new friend ": "👫", "slides": [{"type": "cover", "say": "Theme 2 · Unit 3 · Vocabulary"}, {"type": "goals", "title": "Today's goals", "items": ["I can discuss common teenage questions about friendship.", "I can describe people with positive and negative adjectives."], "icon": "🎯"}, {"type": "goals", "title": "Today's goals", "items": ["I can give advice: You should … / A good idea would be to …", "I can use phrases with ‘friend’ (close friend, fair-weather friend …)."], "icon": "🎯"}, {"type": "ask", "title": "Questions about friendship", "qs": [{"q": "‘I like my friends but I don't always like what they do. What shall I do?’", "a": "Tell them politely, and don't do things you think are wrong."}, {"q": "‘Why do all my friendships seem to be changing?’", "a": "Because we are growing up and our interests are changing."}, {"q": "‘How can I begin a new friendship with someone I like?’", "a": "Say hello, ask questions about his interests and invite him to join your group."}, {"q": "‘My parents don't like my friends. What can I do?’", "a": "Invite your friends home so your parents can meet them, and listen to your parents' reasons."}], "img": "L12_c1", "icon": "💭"}, {"type": "sort", "title": "Positive or negative?", "bins": [{"label": "Positive attribute", "icon": "😊"}, {"label": "Negative attribute", "icon": "😒"}], "cards": [{"text": "moody", "icon": "", "bin": 1}, {"text": "dependable", "icon": "", "bin": 0}, {"text": "impatient", "icon": "", "bin": 1}, {"text": "loyal", "icon": "", "bin": 0}, {"text": "cowardly", "icon": "", "bin": 1}, {"text": "cheerful", "icon": "", "bin": 0}, {"text": "grumpy", "icon": "", "bin": 1}, {"text": "lazy", "icon": "", "bin": 1}, {"text": "thoughtful", "icon": "", "bin": 0}, {"text": "smart", "icon": "", "bin": 0}], "icon": "⭐"}, {"type": "memory", "title": "Adjective memory", "pairs": [["loyal", "🤝 always supports his friends"], ["dependable", "🧱 you can trust him"], ["grumpy", "😠 often in a bad mood"], ["selfish", "🙋 thinks only of himself"], ["thoughtful", "🎁 thinks of others' feelings"], ["cowardly", "🙈 not brave"]], "icon": "🧠"}, {"type": "ask", "title": "Emily, 17, in Muscat", "qs": [{"q": "Emily studies at an international school in Muscat. Predict: how important are her friends to her?", "a": "I think they are very important because she is far from her home country."}, {"q": "What qualities might be important to her in a friend?", "a": "Maybe loyalty, honesty and being a good listener."}, {"q": "What are the benefits of having friends from other cultures?", "a": "You learn new languages, foods and ideas, and you become more open-minded."}, {"q": "Can there be difficulties? Which?", "a": "Sometimes misunderstandings because of different customs."}], "img": "L12_c2", "icon": "🎧"}, {"type": "read", "title": "Dear Counsellor …", "paras": ["Dear Counsellor,", "I'm writing to you about a very worrying problem. I can't seem to [[maintain]] friendships. When I become friendly with another boy, it's OK at first. But then after a time, the other boy [[loses interest]] in me and doesn't talk to me any more."], "img": "L12_c5", "icon": "✉️"}, {"type": "read", "title": "Dear Counsellor …", "paras": ["Everyone in my class has a good [[circle of friends]]. But not me. I feel so [[lonely]] because, when I have a problem, I don't have anyone to share it with. What can I do?", "Yours, Lonely"], "img": "L12_c5", "icon": "✉️"}, {"type": "explain", "title": "Giving advice", "lines": ["Use these phrases to give advice:", "You should … · Our advice is that … · A good idea would be to … · We think the best thing for you to do is …"], "rule": "Advice = phrase + verb", "icon": "💡"}, {"type": "flip", "title": "Giving advice 💡 – examples", "cards": [{"front": "[[You should]] join a club at school.", "icon": "💡", "back": "should + verb"}, {"front": "[[A good idea would be to]] ask your classmates about their hobbies.", "icon": "✨", "back": "to + verb"}, {"front": "[[Our advice is that]] you listen more and talk less.", "icon": "🔎", "
