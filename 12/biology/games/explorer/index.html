<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>مختبر الأحياء التفاعلي — الصف الثاني عشر</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Baloo+Bhaijaan+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4faf8;--card:#ffffff;--ink:#12342e;--muted:#5c7a74;--line:#dcebe6;
  --p:#0f9d8a;--p2:#0b7d6e;--pl:#d7f3ee;--a:#ff7a59;--al:#ffe6de;--y:#ffc43d;--yl:#fff4d6;
  --g:#22c55e;--gl:#dcfce7;--r:#ef4444;--rl:#fee2e2;--b:#3b82f6;--bl:#dbeafe;--v:#8b5cf6;--vl:#ede9fe;
  --sh:0 10px 30px rgba(15,60,50,.10);--sh2:0 4px 14px rgba(15,60,50,.08);--rad:22px;
  --u:#0f9d8a;--ul:#d7f3ee;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:'Cairo',system-ui,sans-serif;font-size:17px;line-height:1.6;min-height:100%;}
body{background:
  radial-gradient(1200px 500px at 90% -10%, #d9f4ee 0%, transparent 60%),
  radial-gradient(900px 500px at -10% 110%, #ffe9e2 0%, transparent 55%),var(--bg);}
h1,h2,h3,h4{font-family:'Baloo Bhaijaan 2','Cairo',sans-serif;margin:0;line-height:1.3}
button{font-family:inherit;font-size:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,textarea{font-family:inherit;font-size:inherit}
.hidden{display:none!important}
.wrap{max-width:1180px;margin:0 auto;padding:14px 16px 60px}
/* header */
.top{position:sticky;top:0;z-index:50;backdrop-filter:blur(10px);background:rgba(244,250,248,.85);border-bottom:1px solid var(--line)}
.top .in{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:8px 16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;flex:1;min-width:200px}
.brand .logo{width:46px;height:46px;border-radius:14px;background:linear-gradient(135deg,var(--p),#5ee0c7);display:grid;place-items:center;font-size:26px;box-shadow:var(--sh2)}
.brand h1{font-size:20px}
.brand small{display:block;color:var(--muted);font-size:13px;font-weight:600}
.tools{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.tb{width:42px;height:42px;border-radius:13px;background:#fff;border:1px solid var(--line);display:grid;place-items:center;font-size:19px;box-shadow:var(--sh2);transition:.15s}
.tb:hover{transform:translateY(-2px)}
.tb.off{opacity:.45;filter:grayscale(1)}
.prog{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:4px 12px;font-weight:700;color:var(--p2);font-size:14px}
.prog .bar{width:90px;height:8px;background:var(--pl);border-radius:6px;overflow:hidden}
.prog .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--p),#5ee0c7);width:0;transition:.6s}
/* hero */
.hero{display:grid;grid-template-columns:1.2fr .8fr;gap:18px;align-items:center;background:var(--card);border-radius:28px;box-shadow:var(--sh);padding:26px 30px;margin:16px 0 22px;overflow:hidden;position:relative}
.hero h2{font-size:34px;color:var(--p2)}
.hero p{color:var(--muted);margin:8px 0 14px;font-size:16px}
.hero .stats{display:flex;gap:10px;flex-wrap:wrap}
.stat{background:var(--pl);border-radius:14px;padding:8px 14px;font-weight:700;color:var(--p2);font-size:14px;display:flex;align-items:center;gap:6px}
.hero .art{height:220px;display:grid;place-items:center}
.hero .art svg{width:100%;height:100%}
@media(max-width:800px){.hero{grid-template-columns:1fr}.hero .art{height:150px}.hero h2{font-size:26px}}
/* units */
.units{display:grid;gap:18px}
.unit{background:var(--card);border-radius:var(--rad);box-shadow:var(--sh);overflow:hidden;border-top:8px solid var(--u)}
.unit .uh{display:flex;align-items:center;gap:14px;padding:16px 20px;cursor:pointer}
.unit .uh .ic{width:58px;height:58px;border-radius:18px;background:var(--ul);display:grid;place-items:center;font-size:30px;flex-shrink:0}
.unit .uh h3{font-size:22px;color:var(--ink)}
.unit .uh small{color:var(--muted);font-weight:600;display:block;font-size:13px}
.unit .uh .n{margin-inline-start:auto;background:var(--ul);color:var(--u);border-radius:12px;padding:4px 12px;font-weight:800;font-size:14px;white-space:nowrap}
.unit .uh .chev{font-size:22px;color:var(--muted);transition:.3s}
.unit.open .uh .chev{transform:rotate(180deg)}
.lessons{display:none;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;padding:0 20px 20px}
.unit.open .lessons{display:grid}
.les{background:#fff;border:2px solid var(--line);border-radius:18px;padding:14px;cursor:pointer;transition:.18s;position:relative;display:flex;flex-direction:column;gap:6px}
.les:hover{border-color:var(--u);transform:translateY(-3px);box-shadow:var(--sh2)}
.les .num{width:34px;height:34px;border-radius:11px;background:var(--u);color:#fff;display:grid;place-items:center;font-weight:900;font-size:14px}
.les h4{font-size:17px;line-height:1.35}
.les .en{color:var(--muted);font-size:12px;font-weight:600;font-family:'Cairo'}
.les .dots{display:flex;gap:5px;margin-top:4px}
.les .dots i{width:22px;height:8px;border-radius:5px;background:var(--line)}
.les .dots i.on{background:var(--g)}
.les.ws{background:linear-gradient(135deg,#fff,var(--yl))}
.les .tag{position:absolute;top:10px;left:10px;font-size:11px;background:var(--yl);color:#9a6a00;padding:2px 8px;border-radius:8px;font-weight:800}
/* lesson view */
.lhead{display:flex;align-items:center;gap:12px;margin:12px 0 14px;flex-wrap:wrap}
.back{background:#fff;border:1px solid var(--line);border-radius:14px;padding:8px 14px;font-weight:800;color:var(--p2);display:flex;gap:6px;align-items:center;box-shadow:var(--sh2)}
.lhead h2{font-size:24px;flex:1;min-width:200px}
.lhead h2 span{display:block;font-size:13px;color:var(--muted);font-family:'Cairo';font-weight:700}
.stepper{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px}
.step{background:#fff;border:2px solid var(--line);border-radius:16px;padding:10px 8px;text-align:center;cursor:pointer;transition:.18s;font-weight:800;font-size:14px;display:flex;flex-direction:column;align-items:center;gap:2px;position:relative}
.step .ic{font-size:24px}
.step.on{border-color:var(--u);background:var(--ul);color:var(--u)}
.step.done::after{content:'✓';position:absolute;top:6px;left:8px;width:20px;height:20px;border-radius:50%;background:var(--g);color:#fff;font-size:12px;display:grid;place-items:center}
@media(max-width:600px){.step{font-size:12px}.step .ic{font-size:20px}}
.panel{background:var(--card);border-radius:var(--rad);box-shadow:var(--sh);padding:20px;min-height:400px;position:relative;overflow:hidden}
.panel .ph{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.panel .ph h3{font-size:22px;color:var(--u)}
.panel .ph .sub{color:var(--muted);font-weight:600;font-size:14px;flex:1}
.pill{background:var(--ul);color:var(--u);border-radius:12px;padding:4px 12px;font-weight:800;font-size:13px}
.btn{background:var(--u);color:#fff;border-radius:14px;padding:10px 20px;font-weight:800;font-size:16px;box-shadow:0 6px 16px rgba(0,0,0,.12);transition:.15s;display:inline-flex;align-items:center;gap:8px}
.btn:hover{transform:translateY(-2px);filter:brightness(1.05)}
.btn:active{transform:scale(.97)}
.btn.sec{background:#fff;color:var(--u);border:2px solid var(--u);box-shadow:none}
.btn.ghost{background:var(--pl);color:var(--p2);box-shadow:none}
.btn.warm{background:var(--a)}
.btn.sm{padding:6px 14px;font-size:14px;border-radius:11px}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spacer{flex:1}
/* activity items */
.item{background:#fff;border:2px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px;animation:pop .35s ease}
.item .q{font-weight:800;font-size:18px;margin-bottom:10px;display:flex;gap:10px;align-items:flex-start}
.item .q .n{width:30px;height:30px;border-radius:10px;background:var(--ul);color:var(--u);display:grid;place-items:center;font-size:14px;flex-shrink:0}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px}
.opt{background:#fbfefd;border:2px solid var(--line);border-radius:14px;padding:10px 14px;text-align:start;font-weight:700;transition:.15s;position:relative;display:flex;gap:8px;align-items:center}
.opt:hover{border-color:var(--u);background:var(--ul)}
.opt .l{width:26px;height:26px;border-radius:8px;background:var(--line);display:grid;place-items:center;font-size:13px;flex-shrink:0}
.opt.ok{border-color:var(--g);background:var(--gl)}
.opt.ok .l{background:var(--g);color:#fff}
.opt.bad{border-color:var(--r);background:var(--rl);animation:shake .4s}
.opt.bad .l{background:var(--r);color:#fff}
.opt.dis{pointer-events:none}
.why{margin-top:10px;background:var(--yl);border-inline-start:5px solid var(--y);border-radius:10px;padding:8px 12px;font-size:15px;animation:pop .3s}
.why.ok{background:var(--gl);border-color:var(--g)}
.why.bad{background:var(--rl);border-color:var(--r)}
.tfb{display:flex;gap:10px}
.tfb .opt{justify-content:center;font-size:17px}
.cloud{display:flex;flex-wrap:wrap;gap:8px}
.cw{background:#fff;border:2px solid var(--line);border-radius:30px;padding:6px 16px;font-weight:800;transition:.15s;cursor:pointer}
.cw.sel{border-color:var(--b);background:var(--bl)}
.cw.ok{border-color:var(--g);background:var(--gl)}
.cw.bad{border-color:var(--r);background:var(--rl)}
.cw.miss{border-color:var(--y);background:var(--yl)}
textarea.open{width:100%;min-height:90px;border:2px solid var(--line);border-radius:14px;padding:10px 12px;resize:vertical;background:#fbfefd}
.saved{font-size:13px;color:var(--g);font-weight:800}
/* slides */
.slide{display:grid;grid-template-columns:1fr 1.1fr;gap:18px;align-items:stretch;min-height:380px}
@media(max-width:820px){.slide{grid-template-columns:1fr}}
.slide .txt h3{font-size:26px;color:var(--ink);margin-bottom:10px}
.slide .txt ul{margin:0;padding:0;list-style:none;display:grid;gap:8px}
.slide .txt li{background:#fbfefd;border:1.5px solid var(--line);border-radius:14px;padding:9px 14px 9px 12px;font-size:17px;position:relative;padding-inline-start:38px;animation:slideIn .4s both}
.slide .txt li::before{content:'';position:absolute;inset-inline-start:12px;top:17px;width:14px;height:14px;border-radius:50%;background:var(--u);box-shadow:0 0 0 4px var(--ul)}
.slide .txt li:nth-child(2){animation-delay:.08s}.slide .txt li:nth-child(3){animation-delay:.16s}.slide .txt li:nth-child(4){animation-delay:.24s}.slide .txt li:nth-child(5){animation-delay:.32s}.slide .txt li:nth-child(6){animation-delay:.4s}
.slide .txt li b{color:var(--u)}
.slide .note{margin-top:10px;background:var(--yl);border-radius:14px;padding:8px 12px;font-size:15px;border-inline-start:5px solid var(--y)}
.slide .note::before{content:'💡 '}
.vis{background:linear-gradient(160deg,#fbfffe,#eef8f5);border:2px solid var(--line);border-radius:20px;min-height:300px;display:flex;align-items:center;justify-content:center;padding:12px;position:relative;overflow:hidden}
.vis svg{width:100%;height:auto;max-height:420px;direction:ltr}
.vis .cap{position:absolute;bottom:8px;inset-inline-start:12px;font-size:13px;color:var(--muted);font-weight:700;background:rgba(255,255,255,.8);padding:2px 10px;border-radius:8px}
.snav{display:flex;align-items:center;gap:10px;margin-top:16px;flex-wrap:wrap}
.snav .dots{display:flex;gap:6px;flex:1;justify-content:center;flex-wrap:wrap}
.snav .dots i{width:10px;height:10px;border-radius:50%;background:var(--line);cursor:pointer;transition:.2s}
.snav .dots i.on{background:var(--u);transform:scale(1.35)}
.snav .dots i.seen{background:#9fd8cc}
.speak{background:#fff;border:2px solid var(--line);border-radius:12px;padding:6px 12px;font-weight:800;color:var(--p2);display:inline-flex;gap:6px;align-items:center}
.speak.on{background:var(--pl);border-color:var(--p)}
/* generic visuals */
.gv{width:100%;direction:rtl}
.flow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:center}
.flow .fn{background:#fff;border:2px solid var(--u);border-radius:16px;padding:10px 14px;font-weight:800;text-align:center;min-width:100px;box-shadow:var(--sh2);animation:pop .4s both;font-size:15px}
.flow .fn .fi{font-size:28px;display:block}
.flow .fa{font-size:22px;color:var(--u);font-weight:900}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}
.cmp .c{background:#fff;border-radius:16px;padding:12px;border-top:6px solid var(--u);box-shadow:var(--sh2)}
.cmp .c:last-child{border-color:var(--a)}
.cmp .c h4{font-size:17px;margin-bottom:6px;text-align:center}
.cmp .c ul{margin:0;padding-inline-start:18px;font-size:14px}
.cmp .c .ci{font-size:34px;text-align:center}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;width:100%}
.cards .cd{background:#fff;border-radius:16px;padding:12px 10px;text-align:center;box-shadow:var(--sh2);border:1.5px solid var(--line);animation:pop .4s both}
.cards .cd .ci{font-size:36px}
.cards .cd h5{margin:4px 0 2px;font-size:15px;color:var(--u)}
.cards .cd p{margin:0;font-size:13px;color:var(--muted)}
table.tbl{width:100%;border-collapse:separate;border-spacing:0;background:#fff;border-radius:14px;overflow:hidden;font-size:14px;box-shadow:var(--sh2)}
table.tbl th{background:var(--u);color:#fff;padding:8px;font-weight:800}
table.tbl td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:center}
table.tbl tr:last-child td{border-bottom:0}
table.tbl td:first-child{font-weight:800;background:var(--ul)}
.cycle{position:relative;width:min(100%,360px);aspect-ratio:1;margin:auto}
.cycle .cn{position:absolute;width:104px;padding:6px 6px;background:#fff;border:2px solid var(--u);border-radius:14px;text-align:center;font-weight:800;font-size:12.5px;transform:translate(-50%,-50%);box-shadow:var(--sh2);line-height:1.3}
.cycle .cn .ci{font-size:22px;display:block}
.cycle .ctr{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:44px;animation:spin 12s linear infinite}
.stepsv{display:grid;gap:8px;width:100%}
.stepsv .sv{display:flex;gap:10px;align-items:center;background:#fff;border-radius:14px;padding:8px 12px;box-shadow:var(--sh2);animation:slideIn .4s both}
.stepsv .sv .n{width:32px;height:32px;border-radius:50%;background:var(--u);color:#fff;display:grid;place-items:center;font-weight:900;flex-shrink:0}
.stepsv .sv .si{font-size:26px}
.stepsv .sv p{margin:0;font-size:15px}
.bars{display:flex;align-items:flex-end;gap:12px;height:220px;width:100%;padding:10px 6px 0;justify-content:center}
.bars .b{flex:1;max-width:80px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
.bars .b i{display:block;width:100%;background:linear-gradient(180deg,var(--u),#5ee0c7);border-radius:10px 10px 4px 4px;animation:grow 1s ease both;transform-origin:bottom}
.bars .b span{font-size:12px;font-weight:800;text-align:center;margin-top:4px}
.bars .b b{font-size:13px;color:var(--u)}
/* games */
.ghub{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.gc{background:#fff;border:2px solid var(--line);border-radius:18px;padding:14px;text-align:center;cursor:pointer;transition:.18s;position:relative}
.gc:hover{border-color:var(--u);transform:translateY(-3px);box-shadow:var(--sh2)}
.gc .gi{font-size:40px}
.gc h4{font-size:16px;margin-top:4px}
.gc small{color:var(--muted);font-weight:700;font-size:12px}
.gc .best{position:absolute;top:8px;left:10px;background:var(--yl);color:#9a6a00;border-radius:8px;padding:1px 8px;font-size:12px;font-weight:900}
.ghead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.ghead h3{font-size:22px;flex:1}
.score{background:var(--yl);color:#9a6a00;border-radius:12px;padding:4px 14px;font-weight:900;font-size:16px}
.timer{background:var(--bl);color:#1e40af;border-radius:12px;padding:4px 14px;font-weight:900;font-size:16px;font-variant-numeric:tabular-nums}
.timer.low{background:var(--rl);color:#b91c1c;animation:pulse .6s infinite}
.tbar{height:10px;background:var(--line);border-radius:6px;overflow:hidden;margin-bottom:12px}
.tbar i{display:block;height:100%;background:linear-gradient(90deg,var(--b),#60a5fa);transition:width 1s linear}
.instr{background:var(--pl);border-radius:14px;padding:8px 14px;font-weight:700;margin-bottom:12px;font-size:15px;color:var(--p2)}
.instr::before{content:'🎯 '}
.mcols{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mcol{display:grid;gap:8px;align-content:start}
.mc{background:#fff;border:2px solid var(--line);border-radius:14px;padding:10px 12px;font-weight:700;cursor:pointer;transition:.15s;min-height:52px;display:flex;align-items:center;gap:8px;font-size:15px}
.mc:hover{border-color:var(--u)}
.mc.sel{border-color:var(--b);background:var(--bl);transform:scale(1.03)}
.mc.ok{border-color:var(--g);background:var(--gl);pointer-events:none;opacity:.85}
.mc.bad{animation:shake .4s;border-color:var(--r)}
.mc .ci{font-size:24px}
.bins{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:12px}
.bin{border:3px dashed var(--u);border-radius:18px;padding:10px;min-height:120px;background:#fbfffe;transition:.15s}
.bin h5{margin:0 0 6px;text-align:center;font-size:16px;color:var(--u)}
.bin.over{background:var(--ul);transform:scale(1.02)}
.bin .bi{background:var(--gl);border-radius:10px;padding:4px 10px;font-size:14px;font-weight:700;margin:4px 0;animation:pop .3s}
.pool{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;min-height:60px;padding:8px;background:var(--bg);border-radius:16px}
.chip{background:#fff;border:2px solid var(--line);border-radius:30px;padding:8px 16px;font-weight:800;cursor:grab;transition:.15s;user-select:none;touch-action:none;font-size:15px}
.chip:hover{border-color:var(--u)}
.chip.sel{border-color:var(--b);background:var(--bl);transform:scale(1.06)}
.chip.bad{animation:shake .4s;border-color:var(--r);background:var(--rl)}
.chip.drag{position:fixed;z-index:999;pointer-events:none;opacity:.9;transform:scale(1.08)}
.seq{display:grid;gap:8px;margin-bottom:12px}
.seq .sq{display:flex;gap:10px;align-items:center;background:var(--gl);border-radius:14px;padding:8px 12px;font-weight:700;animation:pop .3s}
.seq .sq .n{width:30px;height:30px;border-radius:50%;background:var(--g);color:#fff;display:grid;place-items:center;font-weight:900;flex-shrink:0}
.seq .ph{border:2px dashed var(--line);border-radius:14px;padding:10px;text-align:center;color:var(--muted);font-weight:700}
.race{background:linear-gradient(180deg,#e8f6f2,#fff);border-radius:16px;padding:14px 12px 6px;margin-bottom:14px;position:relative;border:2px solid var(--line)}
.race .trk{height:14px;background:repeating-linear-gradient(90deg,#c9e6de 0 20px,#e3f2ee 20px 40px);border-radius:8px;position:relative}
.race .rn{position:absolute;top:-30px;font-size:34px;transition:right .6s cubic-bezier(.5,1.6,.4,1);transform:scaleX(-1)}
.race .fl{position:absolute;left:0;top:-32px;font-size:26px}
.qq{font-size:20px;font-weight:800;margin-bottom:12px;background:#fff;border-radius:16px;padding:14px;border:2px solid var(--line)}
.blank{display:inline-block;min-width:90px;border-bottom:3px dashed var(--u);text-align:center;color:var(--u);font-weight:900;padding:0 6px;margin:0 4px;border-radius:6px}
.blank.ok{background:var(--gl);border-color:var(--g);color:#166534;border-bottom-style:solid}
.blank.cur{background:var(--ul);animation:pulse 1s infinite}
.memg{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.mem{aspect-ratio:1;perspective:800px;cursor:pointer}
.mem .inner{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.mem.flip .inner{transform:rotateY(180deg)}
.mem .f,.mem .bk{position:absolute;inset:0;border-radius:16px;display:grid;place-items:center;padding:8px;text-align:center;font-weight:800;backface-visibility:hidden;font-size:14px}
.mem .f{background:linear-gradient(135deg,var(--u),#5ee0c7);color:#fff;font-size:34px}
.mem .bk{background:#fff;border:2px solid var(--u);transform:rotateY(180deg)}
.mem.done .bk{background:var(--gl);border-color:var(--g)}
.mem.done{pointer-events:none}
.lblwrap{display:grid;grid-template-columns:1.4fr .6fr;gap:12px}
@media(max-width:760px){.lblwrap{grid-template-columns:1fr}.mcols{grid-template-columns:1fr}}
.lblvis{position:relative;background:#fff;border-radius:16px;border:2px solid var(--line);padding:6px}
.lblvis svg{width:100%;height:auto;direction:ltr}
.hot{position:absolute;width:30px;height:30px;border-radius:50%;background:#fff;border:3px solid var(--a);transform:translate(-50%,-50%);display:grid;place-items:center;font-weight:900;font-size:13px;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.2);animation:pulse 1.4s infinite;z-index:3}
.hot.ok{background:var(--g);border-color:var(--g);color:#fff;animation:none}
.hot.bad{animation:shake .4s;border-color:var(--r)}
.hot.cur{background:var(--bl);border-color:var(--b)}
.lbls{display:grid;gap:8px;align-content:start}
.lbl{background:#fff;border:2px solid var(--line);border-radius:12px;padding:8px 12px;font-weight:800;cursor:pointer;font-size:15px}
.lbl.sel{border-color:var(--b);background:var(--bl)}
.lbl.ok{border-color:var(--g);background:var(--gl);opacity:.7;pointer-events:none}
.tfcard{background:#fff;border-radius:22px;border:2px solid var(--line);padding:30px 20px;text-align:center;font-size:22px;font-weight:800;min-height:150px;display:grid;place-items:center;animation:pop .35s;margin-bottom:14px}
.bigtf{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.bigtf button{border-radius:18px;padding:16px;font-size:22px;font-weight:900;color:#fff;box-shadow:var(--sh2)}
.bigtf .t{background:var(--g)}.bigtf .f{background:var(--r)}
.letters{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.lt{width:44px;height:48px;border-radius:12px;background:#fff;border:2px solid var(--u);display:grid;place-items:center;font-size:22px;font-weight:900;cursor:pointer;transition:.15s}
.lt:hover{background:var(--ul)}
.lt.used{opacity:.25;pointer-events:none}
.lt.ok{background:var(--gl);border-color:var(--g)}
.lt.bad{background:var(--rl);border-color:var(--r)}
.build{display:flex;gap:6px;justify-content:center;min-height:56px;margin:10px 0;flex-wrap:wrap}
.build .lt{border-style:dashed;cursor:pointer}
.build .lt.filled{border-style:solid;background:var(--ul)}
.hunt{position:relative;height:380px;background:linear-gradient(180deg,#dff5ff,#f2fcff);border-radius:20px;overflow:hidden;border:2px solid var(--line)}
.bal{position:absolute;bottom:-160px;width:150px;padding:12px 10px 20px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;text-align:center;font-weight:800;font-size:13px;cursor:pointer;animation:rise linear forwards;box-shadow:inset -8px -8px 20px rgba(0,0,0,.08);line-height:1.35;display:flex;align-items:center;justify-content:center;min-height:110px}
.bal::after{content:'';position:absolute;bottom:-26px;left:50%;width:2px;height:26px;background:#999}
.bal.pop{animation:popout .3s forwards}
.wheelwrap{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:center}
@media(max-width:760px){.wheelwrap{grid-template-columns:1fr}}
.wheel{position:relative;width:min(100%,320px);aspect-ratio:1;margin:auto}
.wheel svg{width:100%;height:100%;transition:transform 4s cubic-bezier(.17,.67,.12,1)}
.wheel .ptr{position:absolute;top:-6px;left:50%;transform:translateX(-50%);font-size:34px;z-index:2}
.secretw{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:14px 0}
.secretw .lt{border-style:dashed}
.secretw .lt.show{border-style:solid;background:var(--gl)}
.plant{display:grid;place-items:center;height:130px}
.kbd{display:flex;flex-wrap:wrap;gap:5px;justify-content:center}
.kbd .lt{width:38px;height:42px;font-size:18px}
.result{text-align:center;padding:26px 16px;animation:pop .5s}
.result .big{font-size:70px}
.result h3{font-size:28px;color:var(--u);margin:6px 0}
.result p{color:var(--muted);font-weight:700}
.stars{font-size:34px;letter-spacing:4px}
.badge{display:inline-flex;align-items:center;gap:8px;background:linear-gradient(135deg,var(--y),#ffdf8a);color:#7a4d00;border-radius:16px;padding:8px 16px;font-weight:900;margin-top:10px;box-shadow:var(--sh2)}
/* team board */
.teams{position:fixed;bottom:14px;inset-inline-start:14px;z-index:60;display:flex;gap:8px;align-items:center}
.team{background:#fff;border-radius:16px;box-shadow:var(--sh);padding:6px 10px;display:flex;align-items:center;gap:6px;font-weight:900;border:2px solid var(--line)}
.team .nm{font-size:13px;color:var(--muted)}
.team .sc{font-size:20px;min-width:28px;text-align:center}
.team button{width:28px;height:28px;border-radius:8px;background:var(--pl);font-weight:900;color:var(--p2)}
.team.a{border-color:var(--b)}.team.b{border-color:var(--a)}
.teams .tog{width:40px;height:40px;border-radius:50%;background:var(--ink);color:#fff;font-size:18px;box-shadow:var(--sh)}
/* toast, confetti */
.toast{position:fixed;top:70px;left:50%;transform:translateX(-50%) translateY(-20px);background:var(--ink);color:#fff;padding:10px 20px;border-radius:14px;font-weight:800;z-index:100;opacity:0;transition:.3s;pointer-events:none;box-shadow:var(--sh)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.conf{position:fixed;inset:0;pointer-events:none;z-index:200;overflow:hidden}
.conf i{position:absolute;top:-20px;width:10px;height:16px;border-radius:3px;animation:fall 2.4s ease-in forwards}
.fx{position:fixed;font-size:30px;pointer-events:none;z-index:150;animation:fly 1s ease-out forwards;font-weight:900}
/* keyframes */
@keyframes pop{from{transform:scale(.92);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes slideIn{from{transform:translateX(20px);opacity:0}to{transform:none;opacity:1}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(15,157,138,.35)}50%{box-shadow:0 0 0 8px rgba(15,157,138,0)}}
@keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg)}}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg);opacity:.6}}
@keyframes fly{to{transform:translateY(-80px) scale(1.4);opacity:0}}
@keyframes rise{to{bottom:110%}}
@keyframes popout{to{transform:scale(1.6);opacity:0}}
@keyframes flowdash{to{stroke-dashoffset:-40}}
@keyframes blink{50%{opacity:.25}}
@keyframes beat{0%,100%{transform:scale(1)}30%{transform:scale(1.08)}}
@keyframes drift{0%{offset-distance:0}100%{offset-distance:100%}}
@keyframes wob{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
/* svg helpers used by presets */
.sv-flow{stroke-dasharray:8 6;animation:flowdash 1s linear infinite}
.sv-flow.slow{animation-duration:2s}
.sv-blink{animation:blink 1.2s ease-in-out infinite}
.sv-beat{animation:beat 1s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.sv-wob{animation:wob 2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.sv-fade{animation:fadeUp .8s ease both}
.sv-spin{animation:spin 8s linear infinite;transform-box:fill-box;transform-origin:center}
svg text{font-family:'Cairo',sans-serif;font-weight:700}
.print-hide{}
</style>
</head>
<body>
<div class="top"><div class="in">
  <div class="brand"><div class="logo">🧬</div><div><h1 id="appTitle">مختبر الأحياء التفاعلي — الصف الثاني عشر</h1><small id="appSub">الفصل الدراسي الأول · كتاب الطالب</small></div></div>
  <div class="tools">
    <div class="prog"><span id="progTxt">0%</span><div class="bar"><i id="progBar"></i></div></div>
    <button class="tb" id="btnTeams" title="لوحة الفرق">🏆</button>
    <button class="tb" id="btnTTS" title="القراءة الصوتية">🗣️</button>
    <button class="tb" id="btnSound" title="المؤثرات الصوتية">🔊</button>
    <button class="tb" id="btnFull" title="ملء الشاشة">⛶</button>
    <button class="tb" id="btnHome" title="الرئيسية">🏠</button>
  </div>
</div></div>
<div class="wrap" id="app"></div>
<div class="teams hidden" id="teams">
  <div class="team a"><span class="nm">فريق أ</span><button data-t="a" data-d="-1">−</button><span class="sc" id="scA">0</span><button data-t="a" data-d="1">+</button></div>
  <div class="team b"><span class="nm">فريق ب</span><button data-t="b" data-d="-1">−</button><span class="sc" id="scB">0</span><button data-t="b" data-d="1">+</button></div>
  <button class="tog" id="teamsReset" title="تصفير">↺</button>
</div>
<div class="toast" id="toast"></div>
<div class="conf" id="conf"></div>
<script>
/* presets_g12_a.js — رسوم الصف الثاني عشر (أحياء) — الجزء الأول: الحمض النووي، تخليق البروتين، الطفرات، الانقسام الاختزالي (11 رسمًا) */
(function(){
const H='#12342e', SUB='#5f7a75';
const txt=(x,y,t,s=13,a='middle',c=H,extra='')=>`<text x="${x}" y="${y}" font-size="${s}" font-weight="700" text-anchor="${a}" fill="${c}" ${extra}>${t}</text>`;
const mk=(opts)=>{const L=!opts.nolabels; const r=L?6:8; return {L,
  lab:(x,y,t,s=13,c=H,extra='')=>L?txt(x,y,t,s,'middle',c,extra):'',
  hot:(id,x,y)=>`<circle data-hot="${id}" cx="${x}" cy="${y}" r="${r}" fill="#fff" stroke="#ff7a59" stroke-width="3"/>`,
  lead:(x1,y1,x2,y2)=>L?`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#6f8c86" stroke-width="1.3" stroke-dasharray="3 3"/>`:''};};
const LR=(t)=>`\u202A${t}\u202C`; // تضمين LTR للرموز اللاتينية داخل نص عربي
const svg=(inner,h=380)=>`<svg viewBox="0 0 600 ${h}" xmlns="http://www.w3.org/2000/svg">${inner}</svg>`;
const flow=(d,c='#fff',w=3,slow=false)=>`<path d="${d}" fill="none" stroke="${c}" stroke-width="${w}" stroke-linecap="round" stroke-dasharray="8 6" class="sv-flow${slow?' slow':''}" opacity=".85"/>`;
const arrow=(x,y,angle,c=H,s=1)=>`<polygon points="${-8*s},${-6*s} ${8*s},0 ${-8*s},${6*s}" fill="${c}" transform="translate(${x} ${y}) rotate(${angle})"/>`;
const legend=(x,y,items,s=12)=>items.map((it,i)=>`<circle cx="${x}" cy="${y+i*20}" r="6" fill="${it[0]}" stroke="rgba(0,0,0,.3)"/>${txt(x+14+it[1].length*3.4,y+4+i*20,it[1],s)}`).join('');
const box=(x,y,w,h,fill,stroke,rx=10,sw=2)=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${rx}" fill="${fill}" stroke="${stroke}" stroke-width="${sw}"/>`;
// ألوان القواعد والوحدات
const BASE={A:'#5cb85c',T:'#f0a33a',C:'#4f8fe0',G:'#a66bd6',U:'#ef5a4c'};
const BASED={A:'#2f7d32',T:'#b46a10',C:'#1f5fb3',G:'#6f3aa3',U:'#b8322a'};
const PH='#f6c343', PHD='#c98a12', SU='#8fd3f4', SUD='#2a7fb8', OLD='#4f7fe3', OLDD='#2a56b8', NEW='#ff9f43', NEWD='#c86a12';
const COMP={A:'T',T:'A',C:'G',G:'C'};
const P={};

/* نيوكليوتيد مفرد: مجموعة تُترجم إلى (x,y) — مركز السكر عند الأصل */
const nucleo=(x,y,{base='A',ribo=false,sc=1,pre='n',showC=true,hi2=false}={})=>{
  const bc=BASE[base]||'#ccc', bd=BASED[base]||'#666';
  return `<g transform="translate(${x} ${y}) scale(${sc})">
  <line x1="-83" y1="-40" x2="-62" y2="-40" stroke="${H}" stroke-width="3"/>
  <line x1="-62" y1="-40" x2="-40" y2="-13" stroke="${H}" stroke-width="3"/>
  <line x1="40" y1="-13" x2="62" y2="-13" stroke="${H}" stroke-width="3"/>
  <line x1="25" y1="34" x2="33" y2="56" stroke="${H}" stroke-width="2.5"/>
  <line x1="-25" y1="34" x2="-33" y2="56" stroke="${H}" stroke-width="2.5"/>
  <circle cx="-105" cy="-40" r="22" fill="${PH}" stroke="${PHD}" stroke-width="3"/>
  ${txt(-105,-34,'P',17,'middle','#5a3d00')}
  <polygon points="0,-42 40,-13 25,34 -25,34 -40,-13" fill="${SU}" stroke="${SUD}" stroke-width="3" stroke-linejoin="round"/>
  ${txt(0,-28,'O',12,'middle',SUD)}
  ${showC?`${txt(46,-4,"1'",10,'middle',SUD)}${txt(31,44,"2'",10,'middle',SUD)}${txt(-31,44,"3'",10,'middle',SUD)}${txt(-46,-4,"4'",10,'middle',SUD)}${txt(-62,-48,"5'",10,'middle',SUD)}`:''}
  <circle cx="-62" cy="-40" r="5" fill="#fff" stroke="${SUD}" stroke-width="2.5"/>
  <rect x="62" y="-38" width="78" height="50" rx="10" fill="${bc}" stroke="${bd}" stroke-width="3"/>
  ${txt(101,-4,base,22,'middle','#fff')}
  ${txt(-33,72,'OH',12,'middle',H)}
  ${hi2?`<rect x="14" y="60" width="40" height="18" rx="6" fill="#ffe9e6" stroke="#ef5a4c" stroke-width="2" class="sv-blink"/>`:''}
  ${txt(34,73,ribo?'OH':'H',12,'middle',ribo?'#b8322a':H)}
  </g>`;};

/* ---------- 1. النيوكليوتيد ---------- */
P.nucleotide=(opts={})=>{const {lab,hot,lead}=mk(opts);
return svg(`
<defs><style>@keyframes nucleotide_in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}} .nucleotide_p{animation:nucleotide_in .9s ease both}</style></defs>
${txt(300,20,'تركيب النيوكليوتيد — وحدة بناء الأحماض النووية',15)}
<line x1="300" y1="36" x2="300" y2="292" stroke="#b9c8c4" stroke-width="2" stroke-dasharray="6 6"/>
${txt(170,46,'نيوكليوتيد DNA',14,'middle','#1f5fb3')}${txt(455,46,'نيوكليوتيد RNA',14,'middle','#b8322a')}
<g class="nucleotide_p">${nucleo(160,160,{base:'A',ribo:false,pre:'nucleotide_d'})}</g>
<g class="nucleotide_p" style="animation-delay:.4s">${nucleo(445,160,{base:'U',ribo:true,hi2:true,pre:'nucleotide_r'})}</g>
<!-- تسميات DNA -->
${lab(50,72,'مجموعة الفوسفات',12)}${lead(50,78,55,98)}${hot('phosphate',55,120)}
${lab(160,262,'سكر خماسي: رايبوز منقوص الأكسجين',12)}${hot('sugar',160,160)}
${lab(255,96,'قاعدة نيتروجينية',12)}${lead(255,102,285,156)}${hot('base',285,164)}
${lab(250,236,`H عند ${LR("C2'")}`,11,'#1f5fb3')}
<!-- تسميات RNA -->
${lab(445,262,'سكر خماسي: رايبوز',12)}
${lab(548,236,`OH عند ${LR("C2'")}`,11,'#b8322a')}
${lab(345,90,'فوسفات',12)}${lab(548,96,'قاعدة U',12)}
<!-- روابط -->
${lab(118,104,'رابطة إستر',10,SUB)}${lab(240,200,'رابطة',10,SUB)}${lab(240,212,'جلايكوسيدية',10,SUB)}
<!-- القواعد -->
${box(30,300,540,72,'#f7fbfa','#b9c8c4',12,1.5)}
${txt(300,320,'القواعد النيتروجينية',13)}
${['A','G'].map((b,i)=>`<rect x="${70+i*40}" y="330" width="32" height="32" rx="7" fill="${BASE[b]}" stroke="${BASED[b]}" stroke-width="2"/>${txt(86+i*40,352,b,16,'middle','#fff')}`).join('')}
${txt(212,345,'بيورينات (حلقتان)',11.5)}${txt(212,360,'A أدنين، G جوانين',10.5,'middle',SUB)}
${['C','T','U'].map((b,i)=>`<rect x="${300+i*40}" y="330" width="32" height="32" rx="7" fill="${BASE[b]}" stroke="${BASED[b]}" stroke-width="2"/>${txt(316+i*40,352,b,16,'middle','#fff')}`).join('')}
${txt(490,345,'بيريميدينات (حلقة واحدة)',11.5)}${txt(490,360,'C سايتوسين، T ثايمين، U يوراسيل',10,'middle',SUB)}
${txt(300,286,'T في DNA فقط — U في RNA فقط',11,'middle',SUB)}
`);};

/* ---------- 2. اللولب المزدوج ---------- */
P.dna_helix=(opts={})=>{const {lab,hot,lead}=mk(opts);
const cx=115,amp=52,y0=44,y1=356,per=150,N=16;
const ph=[...Array(N+1)].map((_,i)=>i*2*Math.PI/N);
const strand=(sign)=>ph.map(f=>{let d='';for(let y=y0;y<=y1;y+=6){const x=cx+sign*amp*Math.sin(2*Math.PI*y/per+f);d+=(y===y0?'M':'L')+x.toFixed(1)+' '+y;}return d;}).join(';');
const dur='14s';
const seq='ATCGGATCAGTCCGATAGCT'.split('');
const rungs=[];let k=0;for(let y=y0+8;y<y1;y+=15.6){const b=seq[k%seq.length],c=COMP[b];const xs=ph.map(f=>(cx+amp*Math.sin(2*Math.PI*y/per+f)).toFixed(1)).join(';');const xs2=ph.map(f=>(cx-amp*Math.sin(2*Math.PI*y/per+f)).toFixed(1)).join(';');
 rungs.push(`<line y1="${y.toFixed(1)}" y2="${y.toFixed(1)}" x2="${cx}" stroke="${BASE[b]}" stroke-width="5" stroke-linecap="round"><animate attributeName="x1" values="${xs}" dur="${dur}" repeatCount="indefinite"/></line><line y1="${y.toFixed(1)}" y2="${y.toFixed(1)}" x1="${cx}" stroke="${BASE[c]}" stroke-width="5" stroke-linecap="round"><animate attributeName="x2" values="${xs2}" dur="${dur}" repeatCount="indefinite"/></line>`);k++;}
// السلّم المسطّح (تكبير)
const LX=330,RX=530,mid=(LX+RX)/2;
const pairs=[['A','T',95],['C','G',155],['T','A',215],['G','C',275]];
const ladder=pairs.map(([a,b,y],i)=>{const hb=a==='A'||a==='T'?2:3;const dots=[...Array(hb)].map((_,j)=>{const yy=y-(hb-1)*6+j*12;return `<line x1="${mid-12}" y1="${yy}" x2="${mid+12}" y2="${yy}" stroke="#e74c3c" stroke-width="2.5" stroke-dasharray="3 3" class="sv-blink" style="animation-delay:${(j*.2).toFixed(1)}s"/>`;}).join('');
 return `<g class="sv-fade" style="animation-delay:${(i*.25).toFixed(2)}s"><rect x="${LX+10}" y="${y-14}" width="${mid-14-LX-10}" height="28" rx="8" fill="${BASE[a]}" stroke="${BASED[a]}" stroke-width="2.5"/>${txt((LX+10+mid-14)/2,y+6,a,17,'middle','#fff')}<rect x="${mid+14}" y="${y-14}" width="${RX-10-mid-14}" height="28" rx="8" fill="${BASE[b]}" stroke="${BASED[b]}" stroke-width="2.5"/>${txt((mid+14+RX-10)/2,y+6,b,17,'middle','#fff')}${dots}</g>`;}).join('');
const backbone=(x)=>[65,125,185,245,305].map((y,i)=>`<circle cx="${x}" cy="${y}" r="9" fill="${PH}" stroke="${PHD}" stroke-width="2.5"/>${i<4?`<polygon points="${x},${y+14} ${x+11},${y+22} ${x+7},${y+36} ${x-7},${y+36} ${x-11},${y+22}" fill="${SU}" stroke="${SUD}" stroke-width="2.5" stroke-linejoin="round"/>`:''}`).join('');
return svg(`
<defs><style>@keyframes dna_helix_dash{to{stroke-dashoffset:-28}} .dna_helix_dir{stroke-dasharray:10 4;animation:dna_helix_dash 1.2s linear infinite}</style></defs>
${txt(115,22,'اللولب المزدوج',15)}${txt(430,22,'تكبير: أزواج القواعد المتكاملة',15)}
<!-- الحلزون الدوّار -->
${rungs.join('')}
<path fill="none" stroke="${OLDD}" stroke-width="7" stroke-linecap="round"><animate attributeName="d" values="${strand(1)}" dur="${dur}" repeatCount="indefinite"/></path>
<path fill="none" stroke="${NEWD}" stroke-width="7" stroke-linecap="round"><animate attributeName="d" values="${strand(-1)}" dur="${dur}" repeatCount="indefinite"/></path>
${txt(115,372,'يدور ببطء — 10 أزواج قواعد لكل لفّة',10.5,'middle',SUB)}
<!-- السلّم -->
<line x1="${LX}" y1="50" x2="${LX}" y2="330" stroke="${OLDD}" stroke-width="5" stroke-linecap="round"/>
<line x1="${RX}" y1="50" x2="${RX}" y2="330" stroke="${NEWD}" stroke-width="5" stroke-linecap="round"/>
<line x1="${LX}" y1="50" x2="${LX}" y2="330" stroke="#fff" stroke-width="2" class="dna_helix_dir" opacity=".9"/>
<line x1="${RX}" y1="330" x2="${RX}" y2="50" stroke="#fff" stroke-width="2" class="dna_helix_dir" opacity=".9"/>
${ladder}
${backbone(LX)}${backbone(RX)}

const bivalent=(x,y,len,rot=0,w=5,swap=true)=>`<g transform="translate(${x} ${y}) rotate(${rot})">${chrom(-6,0,len,MAT,0,w)}${chrom(6,0,len,PAT,0,w)}${swap?`<path d="M-1 ${len*0.22} L-1 ${len/2}" stroke="${PAT}" stroke-width="${w}" stroke-linecap="round"/><path d="M1 ${len*0.22} L1 ${len/2}" stroke="${MAT}" stroke-width="${w}" stroke-linecap="round"/>`:''}</g>`;

(function(){
const H='#12342e', G='#5f7a75';
const txt=(x,y,t,s=13,a='middle',c=H,extra='')=>`<text x="${x}" y="${y}" font-size="${s}" font-weight="700" text-anchor="${a}" fill="${c}" ${extra}>${t}</text>`;
const mk=(opts)=>{const L=!opts.nolabels; const r=L?6:8; return {L,
  lab:(x,y,t,s=13,c=H,extra='')=>L?txt(x,y,t,s,'middle',c,extra):'',
  hot:(id,x,y)=>`<circle data-hot="${id}" cx="${x}" cy="${y}" r="${r}" fill="#fff" stroke="#ff7a59" stroke-width="3"/>`,
  lead:(x1,y1,x2,y2)=>L?`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#6f8c86" stroke-width="1.3" stroke-dasharray="3 3"/>`:''};};
const svg=(inner,h=380)=>`<svg viewBox="0 0 600 ${h}" xmlns="http://www.w3.org/2000/svg">${inner}</svg>`;
const flow=(d,c='#7f8c8d',w=3,slow=false)=>`<path d="${d}" fill="none" stroke="${c}" stroke-width="${w}" stroke-linecap="round" stroke-dasharray="8 6" class="sv-flow${slow?' slow':''}" opacity=".9"/>`;
const arrow=(x,y,angle,c=H,s=1)=>`<polygon points="${-8*s},${-6*s} ${8*s},0 ${-8*s},${6*s}" fill="${c}" transform="translate(${x} ${y}) rotate(${angle})"/>`;
const mover=(path,fill,dur,r=5,begin=0,extra='',inner='')=>`<circle r="${r}" fill="${fill}" stroke="rgba(0,0,0,.25)" stroke-width="1" ${extra}><animateMotion dur="${dur}s" begin="${begin}s" repeatCount="indefinite" path="${path}"/>${inner}</circle>`;
const box=(x,y,w,h,fill,stroke,rx=12,sw=2)=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${rx}" fill="${fill}" stroke="${stroke}" stroke-width="${sw}"/>`;
// سلسلة DNA مزدوجة أفقية
const rungs=(a,b,y,gap,c)=>{let s='';for(let i=a;i<=b;i+=8)s+=`<line x1="${i}" y1="${y-gap/2+2}" x2="${i}" y2="${y+gap/2-2}" stroke="${c}" stroke-width="2.5"/>`;return s;};
const ds=(x,y,w,col='#5b7fd6',gap=12,rc='#a9bfe9',sw=4)=>`<line x1="${x}" y1="${y-gap/2}" x2="${x+w}" y2="${y-gap/2}" stroke="${col}" stroke-width="${sw}" stroke-linecap="round"/><line x1="${x}" y1="${y+gap/2}" x2="${x+w}" y2="${y+gap/2}" stroke="${col}" stroke-width="${sw}" stroke-linecap="round"/>${rungs(x+5,x+w-5,y,gap,rc)}`;
// قطعة بنهايات لاصقة: السلسلة العليا من x إلى x+w، والسفلى مزاحة بمقدار ov
const sticky=(x,y,w,col='#f39c12',ov=22,gap=12)=>`<line x1="${x}" y1="${y-gap/2}" x2="${x+w}" y2="${y-gap/2}" stroke="${col}" stroke-width="4" stroke-linecap="round"/><line x1="${x+ov}" y1="${y+gap/2}" x2="${x+w+ov}" y2="${y+gap/2}" stroke="${col}" stroke-width="4" stroke-linecap="round"/>${rungs(x+ov+4,x+w-4,y,gap,'#f7cf8a')}${['T','T','A','A'].map((b,i)=>txt(x+3+i*5.5,y-gap/2-4,b,7,'middle','#b9770e')).join('')}${['A','A','T','T'].map((b,i)=>txt(x+w+4+i*5.5,y+gap/2+9,b,7,'middle','#b9770e')).join('')}`;
const arcPath=(cx,cy,r,a0,a1)=>{const p=(a)=>[cx+r*Math.cos(a*Math.PI/180),cy+r*Math.sin(a*Math.PI/180)];const [x0,y0]=p(a0),[x1,y1]=p(a1);const big=(a1-a0)%360>180?1:0;return `M${x0.toFixed(1)} ${y0.toFixed(1)} A${r} ${r} 0 ${big} 1 ${x1.toFixed(1)} ${y1.toFixed(1)}`;};
// بلازميد: حلقة مزدوجة مع أقواس ملوّنة [a0,a1,color]
const plasmid=(cx,cy,r,segs=[],col='#5b7fd6',cut=null)=>{let s=`<circle cx="${cx}" cy="${cy}" r="${r+3}" fill="none" stroke="${col}" stroke-width="3"/><circle cx="${cx}" cy="${cy}" r="${r-3}" fill="none" stroke="${col}" stroke-width="3"/>`;
 for(let a=0;a<360;a+=15){const c=Math.cos(a*Math.PI/180),sn=Math.sin(a*Math.PI/180);s+=`<line x1="${(cx+(r-2)*c).toFixed(1)}" y1="${(cy+(r-2)*sn).toFixed(1)}" x2="${(cx+(r+2)*c).toFixed(1)}" y2="${(cy+(r+2)*sn).toFixed(1)}" stroke="#a9bfe9" stroke-width="2"/>`;}
 segs.forEach(([a0,a1,c])=>{s+=`<path d="${arcPath(cx,cy,r,a0,a1)}" fill="none" stroke="${c}" stroke-width="9" stroke-linecap="round"/>`;});
 if(cut!==null){const c=Math.cos(cut*Math.PI/180),sn=Math.sin(cut*Math.PI/180);s+=`<line x1="${(cx+(r-7)*c).toFixed(1)}" y1="${(cy+(r-7)*sn).toFixed(1)}" x2="${(cx+(r+7)*c).toFixed(1)}" y2="${(cy+(r+7)*sn).toFixed(1)}" stroke="#fff" stroke-width="7"/>`;}
 return s;};

      { title:'من ثنائي النيوكليوتيد إلى عديد النيوكليوتيد', tag:'الروابط',
        text:['يرتبط نيوكليوتيدان معًا بتفاعل **تكثيف** (كما يرتبط حمضان أمينيان أو سكران).','الناتج **ثنائي النيوكليوتيد**، والرابطة **رابطة فوسفات ثنائية الإستر**: مجموعة الفوسفات تحوي **رابطتَي إستر**، واحدة لكل سكر من السكرَين.','بتكرار الارتباط ملايين المرات يتكوّن **عديد النيوكليوتيد**: شريط طويل **غير متفرّع**.','السكر والفوسفات يكوّنان **العمود الفقري**، وتبرز **القواعد** جانبيًا بزوايا قائمة.'],
        vis:{kind:'flow', steps:[{icon:'🧩',t:'نيوكليوتيد'},{icon:'💧',t:'تكثيف (خروج ماء)'},{icon:'🧩🧩',t:'ثنائي النيوكليوتيد'},{icon:'🔁',t:'تكرار ملايين المرات'},{icon:'🧵',t:'عديد النيوكليوتيد'}]},
        cap:'الشكل ٣-١: رابطة فوسفات ثنائية الإستر تربط سكر نيوكليوتيد بفوسفات النيوكليوتيد التالي.' },
      { title:'اللولب المزدوج: واتسون وكريك 1953م', tag:'تركيب DNA',
        text:['في عام **1953م** كوّن **جيمس واتسون** و**فرانسيس كريك** في جامعة كامبريدج نموذجًا ثلاثي الأبعاد لجزيء DNA.','اعتمدا على صور **حيود الأشعة السينية** التي التقطتها **روزاليند فرانكلين** (الكلية الملكية في لندن) وعلى بيانات **تشارجاف**.','شريطان من عديد النيوكليوتيد **متوازيان متعاكسا الاتجاه**: أحدهما 5′←3′ والآخر 3′←5′، يلتفّان لولبًا **يمينيًا** (باتجاه عقارب الساعة).','**الطرف 5′** ينتهي بالفوسفات، و**الطرف 3′** ينتهي بالسكر (ذرتا الكربون 5 و 3 من السكر).'],
        vis:'dna_helix', cap:'الشكل ٤-١: لولب مزدوج؛ الدورة الكاملة الواحدة = عشرة أزواج من القواعد.' },
      { title:'ازدواج القواعد المكملة', tag:'تركيب DNA',
        text:['ترتبط **A** دائمًا مع **T** برابطتَين هيدروجينيتَين، وترتبط **G** دائمًا مع **C** بثلاث روابط هيدروجينية: **ازدواج القواعد المكملة**.','يرتبط **بيورين** (حلقتان) دائمًا مع **بيريميدين** (حلقة)، فتبقى المسافة بين العمودَين ثابتة بعرض **ثلاث حلقات**.','الروابط الهيدروجينية **ضعيفة** → يمكن «انفكاك» الشريطَين بسهولة نسبية عند التضاعف.','المعلومات = **تتابع القواعد** الأربع بأي ترتيب؛ وأي تتابع في شريط يحدّد تتابع الشريط الآخر المكمّل له، فالتتابع رسالة مشفّرة.'],
        vis:{kind:'table', head:['الخاصية','التفصيل'], rows:[['A مع T','رابطتان هيدروجينيتان'],['G مع C','ثلاث روابط هيدروجينية'],['بيورين مع بيريميدين','عرض ثابت = ثلاث حلقات'],['الدورة الكاملة للولب','كل 10 أزواج من القواعد'],['اتجاه الشريطَين','متوازيان متعاكسا الاتجاه'],['اتجاه الالتفاف','لولب يميني']]},
        q:{t:'mcq', q:'إذا كانت نسبة الأدنين في DNA كائن ما 30%، فما نسبة الجوانين تقريبًا؟', opts:['30%','20%','40%','70%'], a:1, why:'A = T = 30% فمجموعهما 60%؛ يبقى 40% يتقاسمها G و C بالتساوي، أي 20% لكل منهما.'} },
      { title:'بيانات تشارجاف تؤكّد النموذج', tag:'أدلة',
        text:['حلّل الكيميائي الأمريكي **إروين تشارجاف** نسب القواعد في DNA كائنات حية مختلفة (الجدول ١-١).','في كل كائن: **A ≈ T** و **G ≈ C**، ومجموع النسب في كل صف ≈ 100%.','تختلف نسبة (A+T) إلى (G+C) من نوع إلى آخر (الإنسان: A≈31%، الإشريكية القولونية: A≈24.7%).','يفسّر النموذج هذا النمط: A تزدوج دائمًا مع T و G مع C. أما الفيروس X174 ذو **الشريط المفرد** (A 24.6%، T 32.7%) فلا ينطبق عليه لعدم وجود شريط مكمّل.'],
        vis:{kind:'bars', items:[{t:'أدنين A',v:30.9,label:'30.9%'},{t:'ثايمين T',v:29.4,label:'29.4%'},{t:'جوانين G',v:19.9,label:'19.9%'},{t:'سايتوسين C',v:19.8,label:'19.8%'}], cap:'نسب القواعد في DNA الإنسان (الجدول ١-١)'},
        cap:'A ≈ T و G ≈ C — لماذا؟ لأن كل قاعدة تزدوج مع مكمّلتها في الشريط الآخر.' },
      { title:'تركيب RNA وأنواعه', tag:'RNA',
        text:['جزيء RNA **شريط مفرد** من عديد النيوكليوتيد على العكس من DNA، سكره **الرايبوز**، وقواعده **A, G, C, U**.','ثلاثة أنواع تشترك في بناء البروتين: **RNA المرسال (mRNA)**، **RNA الناقل (tRNA)**، **RNA الرايبوسومي (rRNA)**.','ينثني **tRNA** و **rRNA** على شكل تراكيب معقّدة، بينما يبقى **mRNA** شريطًا **غير ملتف**.'],
        vis:'dna_vs_rna', cap:'DNA: شريطان، ديوكسي رايبوز، T — RNA: شريط واحد، رايبوز، U.',
        q:{t:'mcq', q:'أي نوع من RNA يبقى شريطًا غير ملتف؟', opts:['tRNA','rRNA','mRNA','جميعها تنثني'], a:2, why:'mRNA يبقى شريطًا غير ملتف، بينما ينثني tRNA و rRNA إلى تراكيب معقّدة.'} },
      { title:'خلاصة الدرس', tag:'خلاصة',
        text:['**النيوكليوتيد** = قاعدة نيتروجينية + سكر خماسي + فوسفات؛ و**ATP** نيوكليوتيد (أدينوسين + 3 فوسفات).','**البيورينات** A و G حلقتان، **البيريميدينات** T و C و U حلقة واحدة.','**DNA** لولب مزدوج من شريطَين متوازيَين متعاكسَي الاتجاه مرتبطَين بروابط هيدروجينية (A=T، G≡C) وعمود سكر-فوسفات بروابط **فوسفات ثنائية الإستر**.','**RNA** شريط مفرد بالرايبوز و U؛ أنواعه mRNA و tRNA و rRNA.'],
        vis:{kind:'cards', items:[{icon:'🧩',title:'النيوكليوتيد',text:'قاعدة + سكر خماسي + فوسفات'},{icon:'⚡',title:'ATP',text:'أدنين + رايبوز + 3 فوسفات'},{icon:'🧬',title:'DNA',text:'شريطان متعاكسان، A=T و G≡C'},{icon:'📜',title:'RNA',text:'شريط مفرد، رايبوز، يوراسيل'},{icon:'🔗',title:'الروابط',text:'فوسفات ثنائية الإستر (قوية) وهيدروجينية (ضعيفة)'},{icon:'🔬',title:'1953م',text:'واتسون وكريك + صور فرانكلين + بيانات تشارجاف'}]} }

    slides:[
      { title:'لماذا يتضاعف DNA؟', tag:'تمهيد',
        text:['حين تنقسم الخلية يجب أن تحصل كل خلية ناتجة على **نسخة طبق الأصل** من DNA من دون فقدان معلومات.','تفسّر **الطبيعة اللولبية** المزدوجة كيفية تضاعف DNA: كل شريط يحمل المعلومة اللازمة لبناء الشريط الآخر.','يحدث التضاعف أثناء **الطور S** من دورة الخلية، وتتحكّم فيه **الإنزيمات**.','سؤال الدرس: كيف تُنسخ ثلاثة مليارات زوج من القواعد في خلية بشرية بدقة عالية؟'],

      { title:'الخطوة الأولى: الانفكاك', tag:'الآلية',
        text:['تبدأ الإنزيمات بـ**فك التفاف** اللولب المزدوج وفصل الشريطَين.','يتم ذلك بـ**كسر الروابط الهيدروجينية** التي تربط القواعد المكملة — وهذا هو «**الانفكاك** Unzipping».','ينتج شريطان مفردان، كل منهما يعمل **قالبًا** لبناء شريط جديد مكمّل.','تتقدّم منطقة الانفكاك على طول الجزيء مكوّنة **شوكة التضاعف**.'],
        vis:{kind:'flow', steps:[{icon:'🧬',t:'لولب مزدوج'},{icon:'🔓',t:'كسر الروابط الهيدروجينية'},{icon:'🪢',t:'شريطان مفردان (قالبان)'},{icon:'🏗️',t:'بناء شريطَين جديدَين'}]},
        cap:'الروابط الهيدروجينية الضعيفة تجعل الانفكاك سهلًا نسبيًا.' },
      { title:'DNA بوليميريز: البنّاء', tag:'الإنزيمات',
        text:['يلتصق جزيء من **DNA بوليميريز** بكل شريط مفرد.','يضيف في كل مرة **نيوكليوتيدًا واحدًا** مكمّلًا يرتبط بالشريط الجاري نسخه **برابطة هيدروجينية** (A مقابل T، G مقابل C).','يستطيع DNA بوليميريز النسخ **فقط في الاتجاه 5′←3′** على طول كل شريط — وهذا يسبّب مشكلة!','تذكّر أن الشريطَين متعاكسا الاتجاه، فأحدهما 3′←5′ والآخر 5′←3′ بالنسبة إلى اتجاه الانفكاك.'],
        vis:'replication', cap:'الشكل ٧-١: DNA بوليميريز يضيف نيوكليوتيدات مكمّلة على كل شريط قالب.',
        q:{t:'mcq', q:'في أي اتجاه يضيف DNA بوليميريز النيوكليوتيدات؟', opts:['3′←5′ فقط','5′←3′ فقط','في الاتجاهَين','عشوائيًا'], a:1, why:'يعمل DNA بوليميريز في الاتجاه 5′←3′ فقط، وهذا سبب الفرق بين الشريط المتقدم والمتأخر.'} },
      { title:'الشريط المتقدم والشريط المتأخر', tag:'الآلية',
        text:['**الشريط المتقدم Leading strand**: يُنسخ من الشريط الأصلي **3′←5′** باتجاه الانفكاك نفسه، فيتبع البوليميريز الانفكاك ناسخًا بشكل **متصل**.','**الشريط المتأخر Lagging strand**: يُنسخ من الشريط الأصلي **5′←3′** بعكس اتجاه الانفكاك.','هنا ينسخ البوليميريز جزءًا منفكًّا، ثم يعود لينسخ الجزء التالي، فتنتج **قطع قصيرة** تسمى **قطع أوكازاكي** (على اسم عالِم الكيمياء الحيوية الذي اكتشفها).'],
        vis:{kind:'compare', cols:[{icon:'➡️',title:'الشريط المتقدم',items:['القالب: الشريط الأصلي 3′←5′','النسخ باتجاه الانفكاك','شريط متصل واحد','يتبع البوليميريز الشوكة مباشرة']},{icon:'↩️',title:'الشريط المتأخر',items:['القالب: الشريط الأصلي 5′←3′','النسخ بعكس اتجاه الانفكاك','قطع قصيرة = قطع أوكازاكي','تُربط القطع لاحقًا باللايجيز']}]},
        cap:'الشكل ٧-١: الشريط المتأخر يتكوّن على شكل قطع قصيرة فقط عند انفكاك DNA.' },
      { title:'DNA لايجيز: اللحّام', tag:'الإنزيمات',
        text:['النيوكليوتيدات الجديدة تكون في البداية مرتبطة بالشريط الأصلي **بروابط هيدروجينية** فقط بين القواعد المكملة.','يُنهي العملية إنزيم **DNA لايجيز**: يربط النيوكليوتيدات المتجاورة **بروابط تساهمية فوسفات ثنائية الإستر**.','بذلك يتكوّن **العمود الفقري سكر-فوسفات** لجزيء DNA الجديد.','تُربط **قطع أوكازاكي** بالطريقة نفسها لتكوين شريط متأخر متصل.'],
        vis:{kind:'steps', steps:[{icon:'🔓',t:'انفكاك اللولب بكسر الروابط الهيدروجينية'},{icon:'🧲',t:'DNA بوليميريز يضيف نيوكليوتيدات مكمّلة (5′←3′)'},{icon:'🧩',t:'تتكوّن قطع أوكازاكي على الشريط المتأخر'},{icon:'🔗',t:'DNA لايجيز يربط النيوكليوتيدات بروابط فوسفات ثنائية الإستر'},{icon:'🧬🧬',t:'جزيئان متماثلان من DNA'}]},
        q:{t:'mcq', q:'ما وظيفة DNA لايجيز؟', opts:['كسر الروابط الهيدروجينية','إضافة نيوكليوتيدات مكمّلة','ربط النيوكليوتيدات المتجاورة بروابط فوسفات ثنائية الإستر','فك التفاف اللولب'], a:2, why:'اللايجيز يكوّن الروابط التساهمية في العمود الفقري ويربط قطع أوكازاكي.'} },
      { title:'ازدواج القواعد أثناء التضاعف', tag:'الدقة',
        text:['يضمن **ازدواج القواعد المكملة** دقة النسخ: أمام كل **A** في القالب يوضع **T**، وأمام كل **G** يوضع **C**.','لذلك يكون تتابع الشريط الجديد **مكمّلًا** تمامًا للشريط القالب، و**مطابقًا** للشريط الأصلي المقابل.','النتيجة: جزيئان من DNA **متماثلان** تمامًا مع الجزيء الأصلي.'],
        vis:{kind:'table', head:['الشريط القالب','الشريط الجديد المكمّل'], rows:[['A','T'],['T','A'],['G','C'],['C','G'],['5′ … TCACT … 3′','3′ … AGTGA … 5′']]},
        cap:'الشكل ٨-١: كل قاعدة في القالب تحدّد القاعدة المقابلة لها في الشريط الجديد.' },
      { title:'التضاعف شبه المحافظ', tag:'المفهوم',
        text:['تسمّى هذه الطريقة **التضاعف شبه المحافظ**: في كل مرة يُحتفظ بـ**نصف الجزيء الأصلي** في كل من الجزيئَين الجديدَين.','كل جزيء ناتج = **شريط أصلي (قديم)** + **شريط متكوّن حديثًا**.','لو كان التضاعف **محافظًا** لبقي الجزيء الأصلي كما هو، وتكوّن جزيء جديد من **شريطَين جديدَين** بالكامل — لكن هذا لا يحدث.'],
        vis:{kind:'compare', cols:[{icon:'✅',title:'شبه محافظ (الواقع)',items:['كل جزيء ناتج: شريط قديم + شريط جديد','النصف الأصلي محفوظ في كل نسخة','كل شريط قالب لبناء مكمّله']},{icon:'❌',title:'محافظ (فرضية مرفوضة)',items:['الجزيء الأصلي يبقى بشريطَيه القديمَين','جزيء جديد من شريطَين جديدَين','لا يتفق مع الأدلة التجريبية']}]},
        q:{t:'mcq', q:'بعد تضاعف جزيء DNA مرة واحدة، كم جزيئًا يحوي شريطًا أصليًا واحدًا على الأقل؟', opts:['لا شيء','جزيء واحد','جزيئان','أربعة'], a:2, why:'في التضاعف شبه المحافظ يحوي كل من الجزيئَين الناتجَين شريطًا أصليًا وشريطًا جديدًا.'} },
      { title:'الجزيئات اللازمة للتضاعف', tag:'تلخيص',
        text:['يحتاج التضاعف إلى **قالب** من DNA الأصلي، و**نيوكليوتيدات حرة** (بالقواعد الأربع)، و**إنزيمات**.','**DNA بوليميريز**: يضيف النيوكليوتيدات المكمّلة (5′←3′).','**DNA لايجيز**: يكوّن روابط فوسفات ثنائية الإستر ويربط قطع أوكازاكي.','يحدث التضاعف في **النواة** في الخلية حقيقية النواة.'],
        vis:{kind:'table', head:['الجزيء','الوظيفة في التضاعف'], rows:[['DNA الأصلي (شريطان)','قالبان لبناء الشريطَين الجديدَين'],['نيوكليوتيدات حرة','وحدات البناء (A, T, G, C)'],['DNA بوليميريز','إضافة نيوكليوتيد مكمّل واحد في كل مرة بالاتجاه 5′←3′'],['DNA لايجيز','ربط النيوكليوتيدات بروابط تساهمية فوسفات ثنائية الإستر'],['طاقة (ATP)','تزويد التفاعلات بالطاقة']]},
        note:'💡 يحدث التضاعف في النواة، حيث يوجد DNA في الخلية حقيقية النواة.' },
      { title:'خلاصة الدرس', tag:'خلاصة',
        text:['يتضاعف DNA في **الطور S** بطريقة **شبه محافظة**: كل جزيء جديد يحوي شريطًا أصليًا وشريطًا جديدًا.','**الانفكاك**: كسر الروابط الهيدروجينية → **DNA بوليميريز** يضيف نيوكليوتيدات مكمّلة **5′←3′ فقط** → **DNA لايجيز** يربطها بروابط فوسفات ثنائية الإستر.','**الشريط المتقدم** يُبنى متصلًا باتجاه الانفكاك؛ **الشريط المتأخر** يُبنى قطعًا (**أوكازاكي**) بعكس اتجاه الانفكاك.'],

      { title:'تعديل mRNA: إنترونات وإكسونات', tag:'المعالجة',
        text:['في **حقيقيات النواة** يُعدَّل mRNA قبل أن يغادر النواة؛ الجزيء الأصلي يسمّى **نسخة RNA الأولية**، والعملية **معالجة RNA**.','إحدى خطواتها **الربط Splicing**: إزالة التتابعات **غير المشفّرة** (**الإنترونات**) ثم ربط التتابعات **المشفّرة** (**الإكسونات**) معًا.','قد تُربط النسخة الأولية بطرائق مختلفة (**الربط البديل**) فينتج جزيئات mRNA مختلفة → **بروتينات مختلفة** من **جين واحد**.','يمكن للإنترونات أن تساعد في **تنظيم نشاط الجينات**، ولا يزال الجدل دائرًا حول وظيفتها.'],
        vis:{kind:'steps', steps:[{icon:'📝',t:'النسخ → نسخة RNA أولية (إكسونات + إنترونات)'},{icon:'✂️',t:'إزالة الإنترونات (غير مشفّرة)'},{icon:'🔗',t:'ربط الإكسونات (مشفّرة) معًا = الربط'},{icon:'📜',t:'mRNA ناضج يغادر النواة عبر الثقب النووي'},{icon:'🔀',t:'الربط البديل: جين واحد ← عدة بروتينات'}]},
        q:{t:'mcq', q:'الإنترونات هي:', opts:['تتابعات مشفّرة تبقى في mRNA','تتابعات غير مشفّرة تُزال من النسخة الأولية','إنزيمات النسخ','أنواع من tRNA'], a:1, why:'الإنترونات تتابعات غير مشفّرة تُزال بالربط، وتبقى الإكسونات المشفّرة.'} },
      { title:'الترجمة: الكودون و tRNA', tag:'الترجمة',
        text:['**الترجمة**: تحويل تتابع القواعد في mRNA إلى تتابع أحماض أمينية في **عديد ببتيد**، وتحدث في **الرايبوسومات**.','تُقرأ شيفرة mRNA في مجموعات من ثلاث قواعد: **الكودون**.','**tRNA** ينقل الأحماض الأمينية إلى الرايبوسوم؛ شريط مفرد ينثني على شكل **ورقة برسيم**.','لكل tRNA **موقع ارتباط حمض أميني** في طرف (قواعده الثلاث دائمًا **CCA**)، و**كودون مضاد** من ثلاث قواعد غير مزدوجة في الطرف الآخر يكمّل كودون الحمض الأميني المحمول.'],
        note:'🔎 الإنزيمات مسؤولة عن التأكد من أن كل tRNA ينقل الحمض الأميني الصحيح، فيُعبَّر عنه بـ «حمض أميني-tRNA».',
        vis:{kind:'cards', items:[{icon:'📜',title:'mRNA',text:'نسخة مكملة للجين؛ تُقرأ كودونًا كودونًا'},{icon:'🔤',title:'الكودون',text:'ثلاث قواعد على mRNA لحمض أميني أو بدء/إيقاف'},{icon:'🚚',title:'tRNA',text:'ورقة برسيم؛ يحمل حمضًا أمينيًا في طرف CCA'},{icon:'🔁',title:'الكودون المضاد',text:'ثلاث قواعد غير مزدوجة على tRNA تكمّل الكودون'},{icon:'🏭',title:'الرايبوسوم',text:'وحدتان (صغيرة + كبيرة) من rRNA وبروتين'},{icon:'🔗',title:'الرابطة الببتيدية',text:'تربط الأحماض الأمينية المتجاورة'}]} },
      { title:'الترجمة خطوة بخطوة', tag:'الترجمة',
        text:['يرتبط **الرايبوسوم** بـ mRNA الذي يستقر في أخدود بين وحدتَيه؛ أول كودون دائمًا **AUG** (كودون البدء) فأول حمض أميني هو **المثيونين**.','يدخل **tRNA الأول** بكودون مضاد **UAC** مكمّل لـ AUG ويرتبط به بروابط هيدروجينية؛ يستقبل الرايبوسوم **جزيئَي tRNA** في الوقت نفسه فيدخل الثاني (مثلًا AAA ← لايسين).','يتموضع الحمضان الأمينيان متجاورَين فتتكوّن **رابطة ببتيدية** بينهما، ثم يغادر tRNA الأول ويتقدّم الرايبوسوم **كودونًا واحدًا** إلى الأمام.','تتكرّر العملية حتى **كودون الإيقاف** (**UAA** أو **UAG** أو **UGA**)، فيغادر عديد الببتيد المكتمل.'],
        vis:'translation', cap:'الشكل ١٣-١: الرايبوسوم يقرأ mRNA كودونًا كودونًا بينما ينقل tRNA الأحماض الأمينية.',
        q:{t:'mcq', q:'الكودون المضاد المكمّل لكودون البدء AUG هو:', opts:['UAC','TAC','AUG','GUA'], a:0, why:'A↔U، U↔A، G↔C؛ فالكودون المضاد UAC.'} },
      { title:'ماذا بعد الترجمة؟', tag:'ما بعد',
        text:['يغادر **عديد الببتيد** المكتمل الرايبوسوم و**ينطوي** ليكوّن التركيب **الثانوي** و**الثالثي** (الصف الحادي عشر).','تساعد **بروتينات خاصة** في عملية الطي وتتحكّم فيها.','قد يدخل عديد الببتيد **الشبكة الإندوبلازمية الخشنة** لينقل إلى جزء آخر من الخلية.','تتوافر رسوم متحركة للترجمة على الإنترنت تُظهر الطبيعة **الديناميكية** للعملية.'],
        vis:{kind:'flow', steps:[{icon:'🧵',t:'عديد ببتيد (تركيب أولي)'},{icon:'🌀',t:'طيّ → ثانوي وثالثي'},{icon:'🧰',t:'بروتينات مساعدة للطي'},{icon:'🏗️',t:'الشبكة الإندوبلازمية الخشنة'},{icon:'📦',t:'نقل إلى وجهته في الخلية'}]},
        cap:'تتابع الأحماض الأمينية يحدّد طريقة الطي، ومن ثَمّ وظيفة البروتين.' },
      { title:'DNA مقابل mRNA', tag:'مقارنة',
        text:['**السكر**: رايبوز منقوص الأكسجين في DNA، رايبوز في mRNA.','**القواعد**: A, T, G, C في DNA؛ A, U, G, C في mRNA.','**عدد الأشرطة**: شريطان (لولب مزدوج) مقابل شريط واحد غير ملتف.','**الموقع**: DNA في النواة؛ mRNA يُصنع في النواة وينتقل إلى الرايبوسومات في السيتوبلازم.','**الوظيفة**: تخزين المعلومات الجينية مقابل حمل نسخة الجين إلى الرايبوسوم.'],
        vis:'dna_vs_rna', cap:'الجدول ٢-١: الاختلافات بين DNA و mRNA.' },
      { title:'الرحلة كاملة: من الجين إلى البروتين', tag:'تلخيص',
        text:['**النواة**: RNA بوليميريز ينسخ شريط القالب → نسخة أولية → إزالة الإنترونات وربط الإكسونات → **mRNA**.','**الثقب النووي**: يغادر mRNA النواة إلى السيتوبلازم.','**الرايبوسوم**: يقرأ الكودونات؛ **tRNA** يجلب الأحماض الأمينية بكوداته المضادة؛ تتكوّن روابط ببتيدية.','**كودون إيقاف** → يتحرّر **عديد الببتيد** ويطوى.'],
        vis:{kind:'steps', steps:[{icon:'1️⃣',t:'النسخ في النواة (RNA بوليميريز، شريط القالب)'},{icon:'2️⃣',t:'معالجة RNA: إزالة الإنترونات وربط الإكسونات'},{icon:'3️⃣',t:'خروج mRNA عبر الثقب النووي'},{icon:'4️⃣',t:'ارتباط الرايبوسوم بـ mRNA عند AUG'},{icon:'5️⃣',t:'tRNA يجلب الأحماض الأمينية؛ روابط ببتيدية'},{icon:'6️⃣',t:'كودون إيقاف → تحرّر عديد الببتيد'}]},
        q:{t:'mcq', q:'أي حدث يحدث في النواة؟', opts:['تكوين الروابط الببتيدية','ارتباط tRNA بالكودون','إزالة الإنترونات من النسخة الأولية','تحرّك الرايبوسوم على mRNA'], a:2, why:'النسخ ومعالجة RNA (الربط) يحدثان في النواة؛ الترجمة في الرايبوسوم بالسيتوبلازم.'} },
      { title:'خلاصة الدرس', tag:'خلاصة',
        text:['بناء البروتين مرحلتان: **النسخ** في النواة بإنزيم **RNA بوليميريز** من **شريط القالب** → **mRNA** (U مقابل A).','في حقيقيات النواة تُعالَج النسخة الأولية: إزالة **الإنترونات** وربط **الإكسونات**.','**الترجمة** في الرايبوسوم: **الكودون** على mRNA يقابله **كودون مضاد** على **tRNA** الحامل للحمض الأميني؛ يبدأ بـ **AUG** (مثيونين) وينتهي بكودون إيقاف؛ تتكوّن **روابط ببتيدية** ويتقدّم الرايبوسوم كودونًا كودونًا.'],
        vis:{kind:'cards', items:[{icon:'📝',title:'النسخ',text:'النواة · RNA بوليميريز · شريط القالب'},{icon:'✂️',title:'المعالجة',text:'إزالة الإنترونات، ربط الإكسونات'},{icon:'🚪',title:'الثقب النووي',text:'خروج mRNA إلى السيتوبلازم'},{icon:'🏭',title:'الترجمة',text:'الرايبوسوم يقرأ الكودونات'},{icon:'🚚',title:'tRNA',text:'كودون مضاد + حمض أميني'},{icon:'⏹️',title:'الإيقاف',text:'UAA / UAG / UGA'}]} }

      summary:'بناء البروتين مرحلتان. **النسخ** في النواة: يرتبط **RNA بوليميريز** ببداية الجين ويبني **mRNA** مكملًا لـ**شريط القالب** (U مقابل A)؛ ثم تُزال **الإنترونات** وتُربط **الإكسونات**. **الترجمة** في الرايبوسوم: يُقرأ mRNA **كودونًا كودونًا** بدءًا من **AUG** (مثيونين)؛ يجلب **tRNA** بكودونه المضاد الحمض الأميني المناسب، وتتكوّن **روابط ببتيدية** حتى **كودون الإيقاف**، فيتحرّر عديد الببتيد ويُطوى.' }

      { title:'من القاعدة إلى الوظيفة', tag:'الأثر',
        text:['الطفرات الجينية أحداث **عشوائية** ومن المحتمل أن تكون **ضارة**.','التغيير في تتابع القواعد → تغيير في تتابع **الأحماض الأمينية** (التركيب **الأولي**).','يؤثر ذلك في طريقة **انطواء** عديد الببتيد → تغيّر التركيب **الثالثي** → تغيّر **وظيفة** البروتين.','مثال: طفرات في جينات معيّنة تسبّب **السرطان** (الصف الحادي عشر).'],

      { title:'أنواع الطفرات الجينية الثلاثة', tag:'الأنواع',
        text:['**الاستبدال Substitution**: تحلّ قاعدة محل قاعدة أخرى في DNA.','**الحذف Deletion**: فقدان قاعدة من تتابع DNA من دون استبدالها.','**الإدخال Insertion**: إضافة قاعدة إلى تتابع DNA.','الحذف والإدخال يسبّبان **انزياح إطار القراءة**؛ أما الاستبدال فيؤثر عادةً في **ثلاثية واحدة** فقط.'],
        vis:'mutation', cap:'استبدال، إدخال، حذف — وأثر كل منها في إطار القراءة.',
        q:{t:'mcq', q:'أي نوع من الطفرات يغيّر ثلاثية واحدة فقط عادةً؟', opts:['الحذف','الإدخال','الاستبدال','كلها تغيّر كل الثلاثيات'], a:2, why:'الاستبدال يبدّل قاعدة بأخرى فيتأثر كودون واحد، بينما الحذف والإدخال يزيحان الإطار.'} },
      { title:'الاستبدال: مثال الكتاب', tag:'الاستبدال',
        text:['تتابع شريط القالب من الشكل ١٠-١: **CAA | TTT | GAA | CCC** → فالين - لايسين - ليوسين - جلايسين.','بعد استبدال القاعدة **T** الوسطى في الثلاثية الثانية بـ **A**: **CAA | TAT | GAA | CCC**.','النتيجة: فالين - **أيزوليوسين** - ليوسين - جلايسين؛ تغيّر **حمض أميني واحد** فقط، وبقيت الثلاثيات الأخرى كما هي.','بعض الاستبدالات لا تغيّر الحمض الأميني أصلًا لأن الشيفرة **مكرّرة**، وبعضها قد يحوّل الثلاثية إلى **شيفرة إيقاف**.'],
        vis:{kind:'table', head:['','الثلاثية 1','الثلاثية 2','الثلاثية 3','الثلاثية 4'], rows:[['القالب الأصلي','CAA','TTT','GAA','CCC'],['الأحماض الأمينية','فالين','لايسين','ليوسين','جلايسين'],['بعد الاستبدال','CAA','TAT','GAA','CCC'],['الأحماض الأمينية','فالين','أيزوليوسين','ليوسين','جلايسين']]},
        cap:'استبدال قاعدة واحدة غيّر حمضًا أمينيًا واحدًا فقط.' },
      { title:'أنيميا الخلايا المنجلية', tag:'تطبيق',
        text:['مثال شهير على **الاستبدال**: طفرة في جين **الهيموجلوبين** (سلسلة بيتا).','تُستبدل قاعدة واحدة (**A → T**) في ثلاثية الحمض الأميني السادس من شريط اللانسخ: **GAG → GTG** (وفي شريط القالب CTC → CAC)، فيتغيّر كودون mRNA من **GAG** إلى **GUG**.','النتيجة: حمض **الجلوتاميك** يُستبدل بـ **الفالين**؛ يتغيّر انطواء الهيموجلوبين فيلتصق ويشكّل أليافًا عند نقص الأكسجين.','تتشوّه خلايا الدم الحمراء إلى شكل **منجلي**، فتسدّ الشعيرات الدموية وتُدمَّر بسرعة → أنيميا.'],
        note:'🇴🇲 أنيميا الخلايا المنجلية من أمراض الدم الوراثية المعروفة في سلطنة عُمان، ويساعد فحص ما قبل الزواج في الحدّ من انتشارها.',
        vis:{kind:'compare', cols:[{icon:'🔴',title:'هيموجلوبين طبيعي',items:['ثلاثية GAG (شريط اللانسخ) → كودون GAG','حمض جلوتاميك في الموقع 6','خلية قرصية مرنة','تمرّ بسهولة في الشعيرات']},{icon:'🌙',title:'هيموجلوبين منجلي',items:['ثلاثية GTG (شريط اللانسخ) → كودون GUG','فالين في الموقع 6','خلية منجلية صلبة','تسدّ الشعيرات وتُدمَّر سريعًا']}]},
        q:{t:'mcq', q:'في أنيميا الخلايا المنجلية يُستبدل حمض الجلوتاميك بـ:', opts:['لايسين','فالين','مثيونين','جلايسين'], a:1, why:'GAG (جلوتاميك) → GUG (فالين) في mRNA بسبب استبدال قاعدة واحدة في DNA.'} },
      { title:'الحذف والإدخال: انزياح الإطار', tag:'الحذف والإدخال',
        text:['مثال الكتاب: تتابع **TAG TAG TAG TAG TAG TAG …** يُقرأ ثلاثية ثلاثية.','بحذف القاعدة **T** الأولى من الثلاثية الخامسة: **TAG TAG TAG TAG AGT AGT AGT …**','**انزاح إطار القراءة** بمقدار قاعدة واحدة → **طفرة انزياح الإطار Frame-shift**؛ تتأثر **جميع الثلاثيات** من موضع الطفرة وما بعده.','الإدخال يفعل الشيء نفسه بالاتجاه المعاكس. من المحتمل أن تكون جميع الأحماض الأمينية اللاحقة **غير صحيحة** فيصبح البروتين **غير فعّال**.'],
        vis:{kind:'table', head:['الحالة','قراءة الثلاثيات'], rows:[['التتابع الأصلي','TAG | TAG | TAG | TAG | TAG | TAG | TAG'],['بعد حذف T من الثلاثية الخامسة','TAG | TAG | TAG | TAG | AGT | AGT | AGT'],['بعد إدخال قاعدة (مثلًا C) قبل الثلاثية الخامسة','TAG | TAG | TAG | TAG | CTA | GTA | GTA']]},
        cap:'من موضع الحذف/الإدخال فصاعدًا تُقرأ كل الثلاثيات بشكل خاطئ.',
        q:{t:'mcq', q:'لماذا يكون الحذف عادةً أخطر من الاستبدال؟', opts:['لأنه يغيّر قاعدة واحدة فقط','لأنه يزيح إطار القراءة فتتأثر كل الثلاثيات اللاحقة','لأنه يحدث في الرايبوسوم','لأنه يضيف قاعدة'], a:1, why:'انزياح الإطار يجعل معظم الأحماض الأمينية بعد موضع الطفرة غير صحيحة.'} },
      { title:'مقارنة أنواع الطفرات', tag:'مقارنة',
        text:['**الاستبدال**: كودون واحد يتغيّر؛ الأثر يتراوح بين لا شيء (صامتة) وحمض أميني مختلف أو شيفرة إيقاف مبكرة.','**الحذف** و**الإدخال**: انزياح الإطار؛ الأثر واسع على كل ما بعد الطفرة.','كلها **عشوائية**، وقد تكون ضارة أو نادرًا نافعة أو بلا أثر.'],

        cap:'تلخيص الأنواع الثلاثة الأكثر شيوعًا للطفرات الجينية.' },

        {title:'الكروموسومات المتماثلة والمخطط الكروموسومي', text:['في المخطط الكروموسومي (**الكاريوجرام**) تُرتَّب الكروموسومات في أزواج ولكل زوج رقم.','الكروموسومان اللذان يحملان الرقم نفسه يحملان **الجينات نفسها في المواقع نفسها**: **كروموسومان متماثلان**.','يأتي أحد كروموسومَي كل زوج من الحيوان المنوي (الأب) والآخر من البويضة (الأم).','الكروموسومان الأخيران في ذكر الإنسان (X و Y) غير متماثلَين: **الكروموسومات الجنسية**.'], note:'💡 تُلتقط صور الكروموسومات في الطور الاستوائي من الانقسام لأنها تكون في أقصى تكثّفها.', vis:{kind:'preset', name:'meiosis', opts:{stage:1}}, cap:'زوج من الكروموسومات المتماثلة يقترن في بداية الانقسام الاختزالي'},
        {title:'الانقسام الاختزالي: انقسامان لا واحد', tag:'Meiosis', text:['**الانقسام الاختزالي** ينتج خلايا أحادية من خلية ثنائية، ويُستخدم لإنتاج الأمشاج في الإنسان والحيوان والنبات.','يشمل **انقسامَين خلويَّين**: الانقسام الاختزالي الأول والانقسام الاختزالي الثاني.','كل انقسام يتضمن الأطوار نفسها: تمهيدي، استوائي، انفصالي، نهائي.','الناتج النهائي: **أربع خلايا أحادية** غير متطابقة جينيًا.'], vis:'meiosis', cap:'الانقسام الأول يفصل الكروموسومات المتماثلة، والثاني يفصل الكروماتيدات'},
        {title:'الانقسام الاختزالي الأول: الطور التمهيدي والاستوائي', text:['**الطور التمهيدي الأول**: تتكثف الكروموسومات (كل منها كروماتيدان شقيقان نُسخا في الطور S) وتصطف في أزواج متماثلة تسمى **الثنائيات المتكافئة**.','تتقاطع الكروماتيدات غير الشقيقة في نقطة تسمى **الكيازما** (جمعها كيازماتا)، وقد يحدث **العبور**.','يتفكك الغلاف النووي وتختفي النوية ويتكوّن المغزل. الخلايا النباتية بلا أجسام مركزية لكن المغزل يتكوّن.','**الطور الاستوائي الأول**: تصطف الثنائيات المتكافئة على خط الاستواء مرتبطة بخيوط المغزل عبر سنتروميراتها.'], vis:{kind:'preset', name:'meiosis', opts:{stage:1}}, q:{t:'mcq', q:'ما الثنائية المتكافئة؟', opts:['كروماتيدان شقيقان','كروموسومان متماثلان مقترنان','خليتان ناتجتان','زوج من الجسمين المركزيين'], a:1, why:'الثنائية المتكافئة (Bivalent) زوج من الكروموسومات المتماثلة يصطفان جنبًا إلى جنب في الطور التمهيدي الأول.'}},
        {title:'الانفصالي والنهائي الأول: الانقسام المنصف', text:['**الطور الانفصالي الأول**: تنفصل الكروموسومات المتماثلة ويُسحب كل كروموسوم **كاملًا** بكروماتيدَيه؛ **لا تنقسم السنتروميرات** (على عكس الانقسام المتساوي).','**الطور النهائي الأول**: تصل الكروموسومات إلى القطبَين؛ في معظم الخلايا الحيوانية يتكوّن غلاف نووي ونوية، وقد لا يحدث ذلك في الخلايا النباتية.','ينقسم السيتوبلازم مكوّنًا خليتَين كل منهما بعدد **أحادي** من الكروموسومات.','لذلك يسمّى الانقسام الأول **الانقسام المنصف**.'], vis:{kind:'compare', cols:[{icon:'🔀', title:'الانفصالي في الاختزالي الأول', items:['تنفصل الكروموسومات المتماثلة','السنترومير لا ينقسم','يُسحب الكروموسوم كاملًا (كروماتيدان)']},{icon:'✂️', title:'الانفصالي في المتساوي', items:['تنفصل الكروماتيدات الشقيقة','السنترومير ينقسم','يُسحب كروماتيد واحد لكل قطب']}]}},
        {title:'الانقسام الاختزالي الثاني', text:['تمر كل خلية أحادية بانقسام يماثل تقريبًا **الانقسام المتساوي**.','**التمهيدي الثاني**: يتفكك الغلاف النووي وتتضاعف الأجسام المركزية وتنتقل إلى القطبين.','**الاستوائي الثاني**: تصطف الكروموسومات منفردة على خط الاستواء.','**الانفصالي الثاني**: **تنقسم السنتروميرات** وتُسحب الكروماتيدات إلى القطبين.','**النهائي الثاني**: تتكوّن **أربع خلايا أحادية** ليست متطابقة جينيًا.'], vis:{kind:'preset', name:'meiosis', opts:{stage:2}}, cap:'الانقسام الثاني يفصل الكروماتيدات: 2 خلايا → 4 خلايا أحادية', q:{t:'mcq', q:'في أي طور تنقسم السنتروميرات في الانقسام الاختزالي؟', opts:['الانفصالي الأول','الاستوائي الأول','الانفصالي الثاني','التمهيدي الأول'], a:2, why:'في الانفصالي الأول تنفصل المتماثلات دون انقسام السنترومير، وفي الانفصالي الثاني ينقسم السنترومير وتنفصل الكروماتيدات.'}},
        {title:'مقارنة رقمية: ذبابة الفاكهة (2n = 8)', tag:'تطبيق', text:['أكمل الجدول لخلية ذبابة الفاكهة ثنائية المجموعة الكروموسومية.','الانقسام المتساوي: انقسام واحد → خليتان → 8 كروموسومات في كل نواة.','الانقسام الاختزالي: انقسامان → 4 خلايا → 4 كروموسومات في كل نواة.','خلية 3n لا تستطيع الانقسام الاختزالي لأن الكروموسومات لا تقترن أزواجًا، بينما خلية 4n تستطيع.'], vis:{kind:'table', head:['', 'الانقسام المتساوي', 'الانقسام الاختزالي'], rows:[['عدد مرات الانقسام','1','2'],['عدد الخلايا الناتجة','2','4'],['عدد كروموسومات كل نواة ناتجة','8 (2n)','4 (n)'],['التطابق الجيني','متطابقة','غير متطابقة'],['الاستخدام','النمو والتعويض','تكوين الأمشاج']]}},
        {title:'خلاصة الدرس', tag:'خلاصة', text:['التكاثر الجنسي: مشيجان **أحاديان (n)** → إخصاب → زيجوت **ثنائي (2n)** → انقسام متساوي.','**الكروموسومات المتماثلة** تحمل الجينات نفسها في المواقع نفسها.','الانقسام الاختزالي **انقسامان**: الأول **منصف** يفصل المتماثلات، والثاني يفصل الكروماتيدات.','الناتج **4 خلايا أحادية** غير متطابقة جينيًا، وهذا مصدر التباين الذي سندرسه في الدرس التالي.'], vis:{kind:'steps', steps:[{icon:'🟦🟦',t:'خلية ثنائية 2n (تضاعف DNA في الطور S)'},{icon:'🤝',t:'الاقتران: ثنائيات متكافئة + كيازماتا'},{icon:'↔️',t:'الانقسام الأول: انفصال المتماثلات (منصف)'},{icon:'✂️',t:'الانقسام الثاني: انفصال الكروماتيدات'},{icon:'🟦',t:'4 خلايا أحادية n مختلفة جينيًا'}]}}

      slides:[
        {title:'لماذا نختلف؟', tag:'تمهيد', text:['كل خلية من الخلايا الأربع الناتجة من الانقسام الاختزالي تحمل الجينات نفسها، لكن **أليلاتها** ليست بالضرورة هي نفسها.','في هذا الدرس: كيف يُنتج الانقسام الاختزالي والإخصاب **تباينًا جينيًا** بين الأمشاج وبين الأفراد؟','ثلاثة مصادر: **العبور**، **التوزيع الحر**، **الإخصاب العشوائي**.'], note:'💡 في عُمان تجد بين أفراد الأسرة الواحدة تباينًا في لون البشرة والطول والصفات، وكلها تعود إلى تراكيب مختلفة من الأليلات.', vis:'crossing_over', cap:'العبور والتوزيع الحر والإخصاب العشوائي: ثلاثة مصادر للتباين'},
        {title:'الموقع الكروموسومي والأليلات', text:['**الموقع الكروموسومي (Locus)**: موقع الجين على الكروموسوم، وجمعه مواقع كروموسومية (Loci).','في ذبابة الفاكهة توجد على الكروموسوم 2 جينات تحدد **طول قرون الاستشعار** و**لون الجسم** و**لون العيون** و**طول الجناح**.','لكل جين **أليلان** أو أكثر: مثلًا أليل العيون الحمراء وأليل العيون البنية، أليل الجسم الرمادي وأليل الجسم الأسود، أليل الأجنحة الطبيعية وأليل الأجنحة الضامرة.','لذا قد يحمل الكروموسومان المتماثلان أليلَين مختلفَين للجين نفسه، فليسا متطابقَين جينيًا.'], vis:{kind:'table', head:['الجين (على الكروموسوم 2)','أليل','أليل آخر'], rows:[['طول قرون الاستشعار','طويلة (A)','قصيرة (a)'],['لون الجسم','رمادي','أسود'],['لون العيون','حمراء (E)','بنية (e)'],['طول الجناح','أجنحة طبيعية','أجنحة ضامرة']]}, q:{t:'mcq', q:'ما الموقع الكروموسومي؟', opts:['شكل من أشكال الجين','موقع الجين على الكروموسوم','نقطة العبور','مركز الكروموسوم'], a:1, why:'Locus هو موقع الجين على الكروموسوم؛ الأليل هو الشكل المختلف للجين.'}},
        {title:'المصدر الأول: العبور', tag:'التمهيدي الأول', text:['في الانقسام الاختزالي الأول تتبادل أجزاء من **كروماتيد** على كروموسوم في الثنائية المتكافئة أماكنها مع أجزاء مكافئة من كروماتيد الكروموسوم الآخر.','ينكسر جزء من الكروماتيد وينفصل ليرتبط مع الكروماتيد **غير الشقيق** من الكروموسوم المتماثل الآخر عند **الكيازما**.','النتيجة: **تراكيب جديدة من الأليلات** على الكروموسومَين.','مثال الكتاب: جين قرون الاستشعار (A/a) وجين لون العيون (E/e) على الكروموسوم نفسه.'], vis:'crossing_over', cap:'الكيازما موضع تبادل الأليلات بين كروماتيدَين غير شقيقَين'},
        {title:'مثال العبور: A E و a e', text:['الخلية الأصلية تحمل الأليلات الأربعة: **A و E** على أحد الكروموسومَين المتماثلَين، و**a و e** على الآخر.','**بدون عبور**: الأمشاج تحمل تركيبَي الأبوين فقط: (A E) و (a e).','**مع عبور** بين الموقعَين: تظهر تراكيب جديدة (A e) و (a E) إضافة إلى (A E) و (a e).','العبور يزيد عدد أنواع الأمشاج من 2 إلى 4.'], vis:{kind:'compare', cols:[{icon:'🚫', title:'إذا لم يحدث عبور', items:['كروماتيدات الكروموسوم الأول: A E ، A E','كروماتيدات الثاني: a e ، a e','أمشاج: (A E) أو (a e) فقط','نوعان من الأمشاج']},{icon:'✖️', title:'إذا حدث عبور', items:['تبادل بين كروماتيدَين غير شقيقَين','كروماتيدات: A E ، A e ، a E ، a e','أمشاج: (A E) (A e) (a E) (a e)','أربعة أنواع من الأمشاج']}]}, q:{t:'mcq', q:'أيّ الأمشاج لا يظهر إلا إذا حدث عبور بين الموقعَين؟', opts:['A E','a e','A e','كلها تظهر دائمًا'], a:2, why:'A e و a E تراكيب جديدة تنتج من تبادل الأليلات؛ A E و a e تركيبا الأبوين.'}},
        {title:'المصدر الثاني: التوزيع الحر', tag:'الاستوائي الأول', text:['تصطف الثنائيات المتكافئة على خط استواء الخلية **عشوائيًا**؛ فاتجاه كل زوج مستقل عن اتجاه الأزواج الأخرى.','**التوزيع الحر**: قدرة أي أليل على أن يوجد في الخلية نفسها مع أي أليل آخر من جين على كروموسوم مختلف.','عدد تراكيب الكروموسومات المحتملة في الأمشاج = **2ⁿ** حيث n العدد الأحادي.','في الإنسان: 2²³ = **8,388,608** تركيبًا محتملًا للكروموسومات وحدها!'], note:'💡 وبحساب اختلاف الأليلات على هذه الكروموسومات تصبح التباينات المحتملة هائلة.', vis:{kind:'bars', items:[{t:'زوجان (2ⁿ)', v:4, label:'4'},{t:'3 أزواج', v:8, label:'8'},{t:'4 أزواج (ذبابة الفاكهة)', v:16, label:'16'},{t:'5 أزواج', v:32, label:'32'}], cap:'عدد تراكيب الكروموسومات في الأمشاج يتضاعف مع كل زوج إضافي؛ في الإنسان 2²³'}},
        {title:'كيف يعمل التوزيع الحر؟', text:['تخيّل زوجَين من الكروموسومات المتماثلة: (1 من الأب، 1 من الأم) و(2 من الأب، 2 من الأم).','في الاستوائي الأول قد يتجه كروموسوما الأب معًا إلى قطب واحد، أو يتجه أحدهما مع كروموسوم الأم للزوج الآخر.','لذلك يحمل المشيج **أي تركيب** من كروموسومات الأب والأم: 2² = 4 تراكيب.','يحدث ذلك في **الطور الاستوائي الأول** عند اصطفاف الثنائيات المتكافئة.'], vis:{kind:'flow', steps:[{icon:'🤝',t:'ثنائيات متكافئة'},{icon:'🎲',t:'اصطفاف عشوائي على خط الاستواء'},{icon:'↔️',t:'انفصال المتماثلات'},{icon:'🧮',t:'2ⁿ تركيبًا في الأمشاج'}]}, q:{t:'mcq', q:'في ذبابة الفاكهة (n = 4) كم تركيبًا كروموسوميًا محتملًا في الأمشاج بالتوزيع الحر وحده؟', opts:['4','8','16','32'], a:2, why:'2⁴ = 16.'}},
        {title:'المصدر الثالث: الإخصاب العشوائي', text:['العبور والتوزيع الحر ينتجان تراكيب مختلفة من الأليلات **في الأمشاج**.','في الإخصاب يمكن أن يندمج **أي مشيج ذكري مع أي مشيج أنثوي**.','لذا من غير المحتمل أن يكون الأفراد الناتجون من التكاثر الجنسي متطابقين جينيًا.','النتيجة: **تباين جيني بين أفراد** الكائنات الحية الناتجة.'], vis:{kind:'cards', items:[{icon:'✖️', title:'العبور', text:'الطور التمهيدي الأول: تراكيب أليلات جديدة على الكروموسوم → تباين بين أمشاج الفرد'},{icon:'🎲', title:'التوزيع الحر', text:'الطور الاستوائي الأول: اصطفاف عشوائي للثنائيات → تراكيب كروموسومات مختلفة → تباين بين أمشاج الفرد'},{icon:'💫', title:'الإخصاب العشوائي', text:'أي مشيج ذكري يندمج مع أي مشيج أنثوي → تباين بين الأفراد الناتجة'}]}},
        {title:'جدول ٢-٢: أسباب وتأثيرات مصادر التباين', tag:'ملخص الكتاب', text:['**العبور**: يغيّر تركيب أليلات جين أو أكثر على الكروموسوم.','**التوزيع الحر**: الاصطفاف العشوائي للثنائيات المتكافئة يُنتج تراكيب كروموسومات مختلفة.','**الإخصاب العشوائي**: أي مشيج ذكري مع أي مشيج أنثوي.'], vis:{kind:'table', head:['مصدر التباين','متى؟','كيف يسبب التباين؟','التأثير'], rows:[['العبور','التمهيدي الأول','تغيّر تركيب الأليلات على الكروموسوم','تباين بين أمشاج الفرد'],['التوزيع الحر','الاستوائي الأول','تراكيب مختلفة من الكروموسومات والأليلات','تباين بين أمشاج الفرد'],['الإخصاب العشوائي','الإخصاب','أي مشيج ذكري يندمج مع أي مشيج أنثوي','تباين بين الأفراد الناتجة']]}},
        {title:'خلاصة الدرس', tag:'خلاصة', text:['الكروموسومان المتماثلان يحملان الجينات نفسها في **المواقع الكروموسومية** نفسها لكن قد تختلف **أليلاتهما**.','**العبور** (التمهيدي الأول) و**التوزيع الحر** (الاستوائي الأول) يُنتجان أمشاجًا مختلفة جينيًا.','**الإخصاب العشوائي** يُنتج أفرادًا مختلفين جينيًا.','في الإنسان 2²³ تركيبًا كروموسوميًا محتملًا في الأمشاج من التوزيع الحر وحده.'], vis:{kind:'cycle', center:'🧬', steps:[{icon:'🤝',t:'اقتران المتماثلات'},{icon:'✖️',t:'عبور عند الكيازما'},{icon:'🎲',t:'توزيع حر'},{icon:'🥚',t:'أمشاج مختلفة'},{icon:'💫',t:'إخصاب عشوائي'},{icon:'👥',t:'أفراد مختلفون'}]}}
