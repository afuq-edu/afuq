      slides:[
        {title:'من الجين إلى الصفة', tag:'تمهيد', text:['**الوراثة**: دراسة كيفية انتقال الصفات التي تحددها الجينات من الآباء إلى الأبناء.','الجين تتابع من DNA يشفّر لعديد ببتيد؛ الشيفرة ثلاثية القواعد لكل حمض أميني، ويُبنى عديد الببتيد على الرايبوسومات.','جين الصفة الواحدة (مثل لون فراء الأرنب) يوجد في **الموقع الكروموسومي نفسه** عند كل أفراد النوع.','أليلات الجين تختلف في **تتابع النيوكليوتيدات**، فقد ينتج أحدها إنزيمًا فعّالًا والآخر إنزيمًا غير فعّال.'], note:'💡 أليل يشفّر لإنزيم ينتج صبغة بنية → فراء بني؛ أليل آخر ينتج إنزيمًا غير فعّال → لا صبغة → فراء أبيض.', vis:{kind:'flow', steps:[{icon:'🧬',t:'أليل (تتابع نيوكليوتيدات)'},{icon:'🧵',t:'عديد ببتيد / إنزيم'},{icon:'⚗️',t:'إنتاج صبغة (أو لا)'},{icon:'🐇',t:'الطراز المظهري: بني أو أبيض'}]}},
        {title:'الطراز الجيني والطراز المظهري', text:['**الطراز الجيني (Genotype)**: الأليلات التي توجد في الكائن الحي.','**الطراز المظهري (Phenotype)**: الصفات الملحوظة في الكائن الحي، وتتأثر بالجينات وبالبيئة.','يرث كل أرنب **أليلًا واحدًا** للون الفراء من كل من الأبوين: B للفراء البني و b للفراء الأبيض.','الطرز الجينية المحتملة: **BB** أو **Bb** أو **bb**.'], vis:{kind:'compare', cols:[{icon:'🔤', title:'الطراز الجيني', items:['الأليلات الموجودة في الكائن','BB ، Bb ، bb','يُكتب بالرموز','يُحدد بالتزاوجات أو بالتحليل']},{icon:'👁️', title:'الطراز المظهري', items:['الصفات الملحوظة','فراء بني أو فراء أبيض','يتأثر بالجينات والبيئة','يُلاحظ مباشرة']}]}, q:{t:'mcq', q:'أرنب طرازه الجيني Bb. ما طرازه المظهري؟', opts:['فراء أبيض','فراء بني','فراء رمادي','لا يمكن تحديده'], a:1, why:'نسخة واحدة من B تكفي لإنتاج الإنزيم الفعّال والصبغة البنية.'}},
        {title:'متماثل وغير متماثل الأليلات', text:['**متماثل الأليلات (Homozygous)**: وجود أليلَين متطابقَين من الجين: BB أو bb.','**غير متماثل الأليلات (Heterozygous)**: وجود أليلَين مختلفَين لجين معيّن: Bb.','عند وجود نسخة واحدة من B تتكوّن إنزيمات فعّالة تنتج الصبغة البنية.','في غياب B (أي bb) لا تنتج صبغة، فيكون الفراء أبيض.'], vis:{kind:'table', head:['الطراز الجيني','الوصف','الطراز المظهري'], rows:[['BB','متماثل الأليلات (سائد)','فراء بني'],['Bb','غير متماثل الأليلات','فراء بني'],['bb','متماثل الأليلات (متنحٍّ)','فراء أبيض']]}},
        {title:'السائد والمتنحي', tag:'B و b', text:['**الأليل السائد (Dominant)**: له التأثير نفسه على الطراز المظهري سواء وُجد أليل آخر أو لم يوجد؛ يُرمز له بحرف كبير (B).','**الأليل المتنحي (Recessive)**: يؤثر في الطراز المظهري فقط في غياب الأليل السائد؛ يُرمز له بحرف صغير (b).','لون فراء الأرنب BB هو نفسه لون الأرنب Bb.','الأرنب الأبيض طرازه الجيني **bb دائمًا**، أما البني فقد يكون BB أو Bb.'], vis:'punnett', cap:'مربع بانيت: أليل سائد ومتنحٍّ، وطرز جينية ومظهرية', q:{t:'mcq', q:'الأليل المتنحي يؤثر في الطراز المظهري:', opts:['دائمًا','فقط في غياب الأليل السائد','فقط مع الأليل السائد','في الذكور فقط'], a:1, why:'التعريف: يؤثر فقط في غياب الأليل السائد (bb).'}},
        {title:'الأليلات المتعددة: فصائل الدم', text:['ليس كل جين له أليلان فقط. **الأليلات المتعددة (Multiple alleles)**: وجود ثلاثة أليلات أو أكثر لجين معيّن.','جين فصيلة الدم في الإنسان له **ثلاثة أليلات**: IA و IB و IO.','يُرمز للجين بالحرف الأساسي I، وللأليلات بالحروف العلوية A و B و O.','IA يعطي فصيلة A، و IB يعطي فصيلة B، و IO متنحٍّ لكل من A و B.'], vis:'codominance_blood', cap:'ثلاثة أليلات لجين واحد: IA و IB و IO'},
        {title:'السيادة المشتركة', tag:'IA و IB', text:['إذا كان لدى شخص نسخة من IA ونسخة من IB تكون فصيلة دمه **AB**.','**السيادة المشتركة (Codominant)**: يؤثر كل من الأليلَين في الطراز المظهري عند وجودهما معًا.','كلا الأليلَين يُعبَّر عنه في الشخص غير متماثل الأليلات؛ لا يحجب أحدهما الآخر.','أما IO فهو **متنحٍّ** لكل من IA و IB: فصيلة O تعني IOIO.'], vis:{kind:'cards', items:[{icon:'🅰️', title:'فصيلة A', text:'IAIA أو IAIO'},{icon:'🅱️', title:'فصيلة B', text:'IBIB أو IBIO'},{icon:'🆎', title:'فصيلة AB', text:'IAIB (سيادة مشتركة)'},{icon:'🅾️', title:'فصيلة O', text:'IOIO (متنحٍّ)'}]}, q:{t:'mcq', q:'شخص فصيلة دمه A. ما طرازاه الجينيان المحتملان؟', opts:['IAIA فقط','IAIA أو IAIO','IAIB أو IAIO','IOIO أو IAIA'], a:1, why:'IO متنحٍّ لذا IAIO يعطي فصيلة A أيضًا.'}},

      slides:[
        {title:'من الأبوين إلى الأبناء: المخطط الجيني', tag:'تمهيد', text:['**التزاوج أحادي الهجين**: نمط تزاوج لوراثة **جين واحد**. **التزاوج ثنائي الهجين**: لوراثة **جينَين مختلفَين**.','**المخطط الجيني**: طريقة معيارية للتنبؤ بنتائج التزاوج وتفسيره.','الخطوة الأولى: الانقسام الاختزالي ينتج أمشاجًا يحمل كل منها **أليلًا واحدًا** فقط من كل جين.','النتائج **احتمالية**: لا يمكن التأكد أيّ حيوان منوي سيخصب أيّ بويضة؛ فقد يولد أرنبان كلاهما أبيض من Bb × Bb.'], note:'💡 مربّو قطط الأوسي اليوم يتنبؤون باحتمالات ألوان النسل بالمخططات الجينية، لكن في الوراثة «لا شيء مؤكد».', vis:{kind:'steps', steps:[{icon:'1️⃣',t:'الطراز المظهري للأبوين'},{icon:'2️⃣',t:'الطراز الجيني للأبوين'},{icon:'3️⃣',t:'أمشاج الأبوين (أليل واحد من كل جين)'},{icon:'4️⃣',t:'مربع بانيت: الطرز الجينية للأبناء'},{icon:'5️⃣',t:'الطرز المظهرية تحت كل طراز جيني'},{icon:'6️⃣',t:'النسبة المتوقعة'}]}},
        {title:'التزاوج أحادي الهجين: Bb × Bb', text:['الأبوان أرنبان بنيان غير متماثلَي الأليلات: **Bb × Bb**.','أمشاج كل منهما: B أو b.','الأبناء: BB، Bb، Bb، bb → نسبة الطرز الجينية **1:2:1**.','الطرز المظهرية: **3 بني : 1 أبيض**. اكتب الطراز المظهري تحت الطراز الجيني مباشرة في المربع.'], vis:'punnett', cap:'مربع بانيت لتزاوج أحادي الهجين بين فردَين غير متماثلَي الأليلات', q:{t:'mcq', q:'ما نسبة الطرز الجينية (لا المظهرية) في أبناء Bb × Bb؟', opts:['3:1','1:1','1:2:1','2:2'], a:2, why:'1 BB : 2 Bb : 1 bb.'}},
        {title:'مسائل السيادة المشتركة: فصائل الدم', text:['تُكوَّن المخططات الجينية للأليلات ذات السيادة المشتركة بالطريقة نفسها مع الرموز الصحيحة.','سؤال ٧: أبوان فصيلتهما AB (IAIB × IAIB) → أمشاج IA أو IB → أبناء: IAIA (A)، IAIB (AB)، IAIB (AB)، IBIB (B) → **1 A : 2 AB : 1 B**؛ احتمال طفل فصيلته B = **¼**.','سؤال ٨: امرأة A ورجل B أنجبا طفلة O → يجب أن يكون كل منهما حاملًا IO: **IAIO × IBIO**.','أبناء IAIO × IBIO: IAIB (AB)، IAIO (A)، IBIO (B)، IOIO (O) → 1:1:1:1.'], vis:'codominance_blood', cap:'أليلات فصائل الدم في مسائل السيادة المشتركة', q:{t:'mcq', q:'امرأة فصيلتها A ورجل فصيلته B أنجبا طفلة فصيلتها O. ما طرازاهما الجينيان؟', opts:['IAIA × IBIB','IAIO × IBIO','IAIB × IOIO','IAIA × IBIO'], a:1, why:'الطفلة IOIO ورثت IO من كل من الأبوين، فكلاهما غير متماثل الأليلات.'}},
        {title:'الجيل الأول والثاني والتزاوج الاختباري', tag:'F1 · F2 · Test cross', text:['**الجيل الأول F1**: أبناء تزاوج متماثل متنحٍّ × متماثل سائد؛ مثال BB × bb → كل الأبناء **Bb** بنية.','**الجيل الثاني F2**: أبناء تزاوج فردَين من F1؛ Bb × Bb → 3 بني : 1 أبيض.','الأرنب الأبيض **bb دائمًا**، أما البني فقد يكون BB أو Bb؛ لمعرفته نُجري **تزاوجًا اختباريًا** مع فرد متنحٍّ متماثل (bb).','إن ظهر ابن أبيض واحد فالأب البني **Bb** قطعًا؛ وإن كانت كل الأبناء بنية فقد يكون BB لكن لا يمكن التأكد (خاصة مع عدد صغير).'], vis:'test_cross', cap:'التزاوج الاختباري: فرد بصفة سائدة × فرد متنحٍّ متماثل الأليلات'},
        {title:'الارتباط بالجنس: الهيموفيليا', tag:'X و Y', text:['**الكروموسومات الجنسية**: الذكر XY والأنثى XX. الكروموسوم Y قصير وقليل الجينات، وX أطول ويحمل جينات كثيرة لا توجد على Y.','**الجين المرتبط بالجنس**: يوجد على كروموسوم جنسي (غالبًا X)، فتتأثر وراثته بجنس الفرد.','جين **العامل الثامن F8** على X: الأليل السائد XF (تخثر طبيعي) والمتنحي Xf (غياب العامل الثامن → **الهيموفيليا**).','الأنثى: XFXF، XFXf (**حاملة**: تحمل الأليل دون إظهار أعراضه)، XfXf (مصابة). الذكر: XFY (طبيعي)، XfY (مصاب) — طرازان فقط.','**XFXf × XFY** → XFXF، XFXf، XFY، XfY → **2 أنثى طبيعية : 1 ذكر طبيعي : 1 ذكر مصاب**؛ احتمال طفل ذكر مصاب = ¼، ومصدر الأليل الأم الحاملة.'], note:'💡 قطط صدفة السلحفاة: أليلا CO (برتقالي) و CB (أسود) على X بسيادة مشتركة؛ الأنثى XCOXCB مرقطة، أما الذكر فله X واحد فلا يكون صدفة سلحفاة.', vis:'sex_linkage', cap:'أم حاملة XFXf × أب سليم XFY: ربع الأبناء ذكر مصاب', q:{t:'mcq', q:'لماذا لا يرث الابن الذكر الهيموفيليا من أبيه؟', opts:['لأن الأب لا يحمل الجين','لأن الابن يرث من أبيه الكروموسوم Y فقط وليس X','لأن الأليل سائد','لأن الهيموفيليا تصيب الإناث فقط'], a:1, why:'الذكر يأخذ X من أمه و Y من أبيه؛ وجين F8 على X.'}},
        {title:'التزاوج ثنائي الهجين: 9:3:3:1 و 1:1:1:1', tag:'جينان مستقلان', text:['الطماطم: لون الساق A (أرجوانية) / a (خضراء)، وشكل الورقة D (مسننة) / d (ملساء) على كروموسومَين مختلفَين.','**AaDd × AaDd**: أمشاج كل منهما AD، Ad، aD، ad → مربع 4×4 → **9 أرجوانية مسننة : 3 أرجوانية ملساء : 3 خضراء مسننة : 1 خضراء ملساء**.','**AaDd × aadd** (تزاوج اختباري ثنائي الهجين): **1:1:1:1**.','الأرانب **BbEe × Bbee**: الأب Bbee ينتج نوعَين فقط من الأمشاج (Be، be) → **3:3:1:1**. اكتب أليلَي الجين الأول ثم الثاني دائمًا.'], vis:{kind:'preset', name:'punnett', opts:{type:'dihybrid'}}, cap:'مربع بانيت 4×4 لتزاوج ثنائي الهجين بين فردَين غير متماثلَي الأليلات في الموقعَين', q:{t:'mcq', q:'نسبة 9:3:3:1 تظهر عند:', opts:['AaDd × aadd','AaDd × AaDd','AADD × aadd','Aadd × aaDd'], a:1, why:'كلا الأبوين غير متماثل الأليلات في الموقعَين.'}},
        {title:'التفوق الجيني (إبيستاسيس)', text:['**التفوق الجيني (Epistasis)**: تفاعل بين جينَين في موقعَين كروموسوميَّين مختلفَين، يؤثر أحدهما في تعبير الجين الآخر.','لون ريش الدجاج: G يشفّر لصبغة تنتج ريشًا ملونًا، و g لا صبغة (أبيض). لكن الأليل السائد **F يمنع** إنتاج الريش الملون حتى مع وجود G.','ملون فقط عند **ff مع G** (ffGG أو ffGg)؛ والباقي (أيّ F أو gg) أبيض.','ليجهورن الأبيض FFGG × وايندوت الأبيض ffgg → F1 كله FfGg **أبيض**؛ وتزاوج F1 × F1 → **13 أبيض : 3 ملون**. وفي السالفيا (A ضروري للون، B أرجواني/b وردي): F2 بنسبة **9 أرجواني : 3 وردي : 4 أبيض**.'], vis:{kind:'table', head:['الطراز الجيني','الطراز المظهري','السبب'], rows:[['FF GG ، FF Gg ، FF gg','ريش أبيض','F يمنع اللون'],['Ff GG ، Ff Gg ، Ff gg','ريش أبيض','F يمنع اللون'],['ff GG ، ff Gg','ريش ملون','لا F، ويوجد G'],['ff gg','ريش أبيض','لا صبغة (gg)']]}},
        {title:'الارتباط بالكروموسوم الجسدي والعبور', tag:'جينان على كروموسوم واحد', text:['**الارتباط بالكروموسوم الجسدي**: جينان على الكروموسوم الجسدي نفسه يميلان إلى أن يورثا معًا ولا يتوزعان بشكل مستقل (**جينات مرتبطة**)؛ تُكتب بين قوسَين: (EA)(ea).','ذبابة الفاكهة: E رمادي / e أبنوسي، A قرن طبيعي / a أريستوبيديا، والجينان متقاربان على الكروموسوم نفسه.','(EA)(EA) × (ea)(ea) → F1 كله (EA)(ea) رمادي طبيعي. تزاوج اختباري لذكر F1 (لا عبور في الذكر): **1:1 أنماط أبوية** فقط = ارتباط تام.','تزاوج اختباري لأنثى F1: العبور يكسر الارتباط → **أنماط أبوية** كثيرة (44% + 44%) و**تراكيب عبورية** قليلة (6% + 6%). كلما زادت التراكيب العبورية كانت المسافة بين الجينَين أكبر.'], vis:'dihybrid_linkage', cap:'جينان مرتبطان مقابل مستقلَّين، مع الأبناء ذوي التراكيب العبورية', q:{t:'mcq', q:'في التزاوج الاختباري لأنثى (EA)(ea)، ظهر 6% رمادي أريستوبيديا و6% أبنوسي طبيعي. هذه الأفراد:', opts:['أنماط أبوية','تراكيب عبورية نتجت من العبور','دليل على ارتباط تام','نتيجة توزيع حر'], a:1, why:'تراكيب مختلفة عن الأبوين تنتج من العبور بين الموقعَين المرتبطَين.'}},
        {title:'اختبار مربع كاي: هل النتائج توافق التوقع؟', tag:'χ²', text:['نتائج التزاوج الفعلية تختلف قليلًا عن المتوقع بسبب الصدفة. **مربع كاي χ² = Σ (O − E)² / E** يقيس هل الفرق ضمن الصدفة أم معنوي.','مثال: Bb × Bb أنتج 120 أرنبًا: **93 بني و27 أبيض**. المتوقع 3:1 = **90 و30**.','(93−90)²/90 = 0.10 ؛ (27−30)²/30 = 0.30 ؛ **χ² = 0.40**. درجات الحرية = عدد الفئات − 1 = **1**؛ القيمة الحرجة عند p = 0.05 هي **3.841**.','0.40 < 3.841 → الفرق غير معنوي، نقبل نسبة 3:1. أما نتائج سؤال ٢٢ (113، 30، 29، 115 مقابل 1:1:1:1) فتعطي χ² ≈ 99.5 > 7.815 (df = 3) → فرق معنوي يدل على **الارتباط**.'], vis:'chi_square', cap:'جدول مربع كاي: المشاهد، المتوقع، (O−E)²/E، المجموع، ومقارنته بالقيمة الحرجة'},
        {title:'خلاصة الدرس', tag:'خلاصة', text:['أحادي الهجين Bb × Bb → **3:1** (جينيًا 1:2:1)؛ التزاوج الاختباري يكشف الطراز الجيني (1:1 إن كان غير متماثل).','**الارتباط بالجنس**: جين على X؛ الأم الحاملة XFXf × XFY → 2:1:1 وربع الأبناء ذكر مصاب.','ثنائي الهجين مستقل: **9:3:3:1** أو اختباري **1:1:1:1**؛ **التفوق الجيني** يعدّل النسب (13:3، 9:3:4).','**الارتباط الجسدي**: أنماط أبوية كثيرة وتراكيب عبورية قليلة؛ **مربع كاي** يقارن المشاهد بالمتوقع.'], vis:{kind:'table', head:['التزاوج','النسبة المتوقعة'], rows:[['Bb × Bb (أحادي الهجين)','3 : 1 مظهريًا (1 : 2 : 1 جينيًا)'],['Bb × bb (اختباري)','1 : 1'],['IAIB × IAIB','1 A : 2 AB : 1 B'],['XFXf × XFY','2 أنثى طبيعية : 1 ذكر طبيعي : 1 ذكر مصاب'],['AaDd × AaDd (مستقلان)','9 : 3 : 3 : 1'],['AaDd × aadd (اختباري ثنائي)','1 : 1 : 1 : 1'],['BbEe × Bbee','3 : 3 : 1 : 1'],['(EA)(ea) × (ea)(ea) ارتباط تام','1 : 1 أنماط أبوية فقط']]}}

          {q:'أرنب بني آخر × أبيض أنجبا 4 كلها بنية. الأرنب البني:', opts:['BB بالتأكيد','Bb بالتأكيد','قد يكون BB لكن لا يمكن التأكد','bb'], a:2, why:'عدد صغير؛ Bb قد ينجب بالصدفة 4 بنية.'},
          {q:'رجل XFY وامرأة XFXf. نسبة الأبناء المتوقعة:', opts:['كلهم طبيعيون','2 أنثى طبيعية : 1 ذكر طبيعي : 1 ذكر مصاب','1 أنثى مصابة : 1 ذكر مصاب','3 طبيعي : 1 أنثى مصابة'], a:1, why:'المخطط الجيني في الكتاب.'},
          {q:'قط برتقالي XCOY × قطة صدفة السلحفاة XCOXCB. الأبناء الإناث:', opts:['كلهن برتقاليات','برتقالية أو صدفة سلحفاة بنسبة 1:1','كلهن سوداوات','سوداء أو صدفة سلحفاة'], a:1, why:'الإناث يأخذن XCO من الأب و XCO أو XCB من الأم.'},

          {q:'في السالفيا (A ضروري للون، B أرجواني/b وردي) تزاوج AaBb × AaBb يعطي:', opts:['9:3:3:1','9 أرجواني : 3 وردي : 4 أبيض','13:3','3:1'], a:1, why:'aa (4/16) أبيض بغض النظر عن B: تفوق جيني.'},
          {q:'RrYy × rryy وجينا البازلاء على كروموسومَين مختلفَين. النسبة المتوقعة:', opts:['1:1:1:1','9:3:3:1','3:1','1:1'], a:0, why:'تزاوج اختباري ثنائي الهجين لجينَين مستقلَّين.'},

          {q:'تزاوج اختباري لذبابة F1 أنتج 113، 30، 29، 115. أفضل تفسير للانحراف عن 1:1:1:1:', opts:['الصدفة فقط','الجينان مرتبطان وحدث عبور محدود','التفوق الجيني','الأليلات مشتركة السيادة'], a:1, why:'فئتان كبيرتان (أبويتان) وفئتان صغيرتان (عبوريتان) وχ² كبير جدًا.'}

        reflect:['لماذا لا يستطيع التزاوج الاختباري أن «يثبت» أن الفرد السائد متماثل الأليلات، بينما يستطيع أن يثبت أنه غير متماثل؟','كيف تستفيد فكرة «كلما زادت التراكيب العبورية زادت المسافة» في رسم خريطة لمواقع الجينات على الكروموسوم؟'],
        summary:'**المخطط الجيني** يتنبأ احتماليًا بالأبناء: أحادي الهجين **3:1**، اختباري **1:1**، ثنائي الهجين **9:3:3:1** أو **1:1:1:1**. **الارتباط بالجنس** (F8 على X) يجعل الذكور أكثر تأثرًا والأم قد تكون **حاملة**. **التفوق الجيني** و**الارتباط الجسدي** يعدّلان النسب، ويكسر **العبور** الارتباط منتجًا **تراكيب عبورية**. **مربع كاي** يقرر إن كان الفرق بين المشاهد والمتوقع معنويًا.'

    // ════════════════════════════ ٢-٥ الجينات والبروتينات والطراز المظهري ════════════════════════════
    { id:'l2_5', num:'٢-٥', title:'الجينات والبروتينات والطراز المظهري', en:'Genes, proteins and phenotype', ws:false,
      preIntro:'درسنا كيف تنتقل الصفات، لكن كيف يصنع الجين الصفة فعلًا؟ أربعة جينات بشرية تجيب: TYR و HBB و F8 و HTT.',
      pre:[
        {t:'tf', q:'الجين تتابع من DNA يشفّر لعديد ببتيد، وعديد الببتيد قد يكون إنزيمًا.', a:true, why:'الجين → mRNA → عديد ببتيد (الوحدة الأولى)؛ كثير من عديدات الببتيد إنزيمات مثل التايروسينيز.'},
        {t:'mcq', q:'في الوحدة الأولى درست أن طفرة استبدال في جين الهيموجلوبين تغيّر حمضًا أمينيًا واحدًا. أي مرض ينتج عنها؟', opts:['الهيموفيليا','فقر الدم المنجلي','المهق','مرض هنتنغتون'], a:1, why:'استبدال في جين HBB يحوّل الجلوتاميك إلى فالين في بيتا-جلوبين.'},
        {t:'cloud', q:'اختر ما يرتبط بالمهق (Albinism):', words:[{w:'التايروسينيز',ok:true},{w:'الميلانين',ok:true},{w:'الجين TYR',ok:true},{w:'أليل متنحٍّ',ok:true},{w:'العامل الثامن',ok:false},{w:'الكروموسوم 11',ok:true},{w:'تكرارات CAG',ok:false},{w:'الهيموجلوبين',ok:false},{w:'شعر وجلد فاتحان جدًا',ok:true}], why:'المهق: أليل متنحٍّ من TYR على الكروموسوم 11 → لا تايروسينيز فعّال → لا ميلانين.'},
        {t:'visual', vis:'gene_protein_phenotype', q:'أيّ الجينات الأربعة يوجد على الكروموسوم X ويسبب أليله المتنحي الهيموفيليا؟', opts:['TYR','HBB','F8','HTT'], a:2, why:'F8 يشفّر للعامل الثامن الضروري لتخثر الدم.'},
        {t:'open', q:'شريحة بطاطس تُركت في الهواء فاسودّت. ما علاقة ذلك بالإنزيم المفقود عند المصابين بالمهق؟'},
        {t:'mcq', q:'مرض وراثي يسببه أليل سائد لا تظهر أعراضه إلا بعد سن الثلاثين. ما احتمال أن يرثه ابن لأب يحمل الأليل (والأم سليمة)؟', opts:['¼','½','¾','1'], a:1, why:'أليل سائد بنسخة واحدة: Hh × hh → ½ من الأبناء يحمل H.'}
      ],
      slides:[
        {title:'كيف يصنع الجين صفة؟', tag:'تمهيد', text:['درست تأثير الجينات على الطراز المظهري دون معرفة **الآليات**. الآن نتتبع أربعة جينات بشرية: **TYR**، **HBB**، **F8**، **HTT**.','لمعظم جينات الإنسان رمز من **ثلاثة أحرف بخط مائل** (TYR)، ويُكتب البروتين الذي يشفّره بالأحرف نفسها **بخط غير مائل** (TYR).','عند الكتابة بخط اليد يوضع **خط تحت** رمز الجين للإشارة إلى الخط المائل.','المبدأ: أليل مختلف → تتابع نيوكليوتيدات مختلف → بروتين مفقود أو غير نشط أو غير طبيعي → طراز مظهري مختلف.'], vis:'gene_protein_phenotype', cap:'أربعة جينات بشرية وأربع صفات: من الجين إلى البروتين إلى الطراز المظهري'},
        {title:'الجين TYR والتايروسينيز', text:['يشفّر الجين **TYR** لإنزيم **التايروسينيز (Tyrosinase)**.','موقعه على **الذراع الطويلة للكروموسوم 11**.','مسار إنتاج **الميلانين**: تايروسين → دوبا (DOPA) → دوباكينون → ميلانين؛ التايروسينيز يحفّز أول خطوتَين.','يوجد التايروسينيز في النباتات والحيوانات أيضًا: اسوداد شريحة البطاطس المعرّضة للهواء أثر هذا الإنزيم.'], vis:{kind:'flow', steps:[{icon:'🧬',t:'الجين TYR (كروموسوم 11)'},{icon:'⚗️',t:'إنزيم التايروسينيز'},{icon:'🔸',t:'تايروسين → دوبا → دوباكينون'},{icon:'⚫',t:'الميلانين'}]}, q:{t:'mcq', q:'الحمض الأميني الذي يبدأ منه مسار الميلانين:', opts:['الفالين','التايروسين','الجلوتاميك','الجلايسين'], a:1, why:'تايروسين → دوبا → دوباكينون → ميلانين.'}},
        {title:'المهق (Albinism)', tag:'TYR', text:['أليل **متنحٍّ** غير طبيعي من TYR → غياب التايروسينيز أو وجوده **غير نشط** → لا يمكن تحويل التايروسين إلى دوبا ودوباكينون → **لا ميلانين**.','الميلانين الداكن مفقود كليًا أو جزئيًا من العيون والجلد والشعر: قزحية زرقاء فاتحة أو وردية، جلد وشعر فاتحان جدًا، بؤبؤ يبدو أحمر.','يصحب الحالة ضعف الرؤية وحركات سريعة للعين وتجنّب الضوء الساطع.','يولد سنويًا في العالم **1 من كل 17000** طفل متماثلًا للأليل المتنحي؛ والحالة أكثر شيوعًا في جماعات مثل الهوبي في أريزونا وهنود كونا سان بلاس في بنما.'], note:'💡 التايروسينيز مثال جيد على الصلة بين الجين والإنزيم والطراز المظهري.', vis:{kind:'compare', cols:[{icon:'⚫', title:'أليل TYR طبيعي', items:['تايروسينيز فعّال','يُنتج الميلانين','عيون وجلد وشعر بلون طبيعي']},{icon:'⚪', title:'أليلان متنحيان (المهق)', items:['تايروسينيز مفقود أو غير نشط','تتعطل أول خطوتَين','لا ميلانين → ملامح فاتحة جدًا','ضعف رؤية وحساسية للضوء']}]}},
        {title:'الجين HBB والهيموجلوبين وفقر الدم المنجلي', text:['يشفّر الجين **HBB** (على الكروموسوم 11 أيضًا) لعديد الببتيد **بيتا-جلوبين** في الهيموجلوبين.','أليل مختلف في **تتابع القواعد** (استبدال قاعدة واحدة، الوحدة الأولى: GAG → GTG) يجعل الحمض الأميني السادس **فالين** بدل **الجلوتاميك**.','الهيموجلوبين غير الطبيعي يترسب في نقص الأكسجين فتتشوّه خلايا الدم الحمراء إلى **شكل منجلي** ← **فقر الدم المنجلي**.','المتماثل للأليل غير الطبيعي مصاب؛ وغير المتماثل يحمل النوعَين من الهيموجلوبين (سيادة مشتركة على مستوى البروتين) وعادةً لا تظهر عليه أعراض، لكنه حامل للأليل.'], vis:'mutation', cap:'استبدال قاعدة في HBB: جلوتاميك → فالين، وخلايا منجلية مقابل سليمة', q:{t:'mcq', q:'ما البروتين الذي يشفّر له الجين HBB؟', opts:['التايروسينيز','بيتا-جلوبين (جزء من الهيموجلوبين)','العامل الثامن','هنتنغتن'], a:1, why:'عديد ببتيد بيتا-جلوبين في الهيموجلوبين.'}},
        {title:'الجين F8 والعامل الثامن والهيموفيليا', tag:'مرتبط بالجنس', text:['يشفّر الجين **F8** على الكروموسوم **X** لبروتين **العامل الثامن (VIII)** الضروري في **تخثر الدم**.','الأليل السائد → عامل ثامن طبيعي؛ الأليل المتنحي → **غياب العامل الثامن** → لا يتخثر الدم بشكل طبيعي → **الهيموفيليا** (نزف الدم الوراثي).','الجين **مرتبط بالجنس**: الذكر XfY مصاب بنسخة واحدة، والأنثى XFXf **حاملة** سليمة.','المهق والهيموفيليا يُظهران تأثير **عديدات الببتيد المفقودة أو غير النشطة** على الطراز المظهري.'], vis:'sex_linkage', cap:'F8 على X: مخطط أم حاملة × أب سليم'},
        {title:'الجين HTT والبروتين هنتنغتن', text:['موقع الجين **HTT** على **الكروموسوم 4**، ويشفّر لبروتين **هنتنغتن (Huntingtin)** المهم في تطور الخلايا العصبية خاصة في الدماغ؛ وعمله بالضبط ما زال مجهولًا.','في بعض الناس يحوي الجين عددًا كبيرًا من **الثلاثية CAG المتكررة** («التأتأة»).','أكثر من **40** تكرارًا → تطور غير طبيعي للخلايا العصبية → **مرض هنتنغتون**؛ بين 36 و39 قد يتطور المرض وأحيانًا لا.','تظهر الأعراض غالبًا بين **30 و40** سنة: فقدان التحكم في الحركة والمشي والكلام والتفكير بوضوح؛ الحالة مميتة خلال **15–20** سنة من ظهورها.'], vis:{kind:'bars', items:[{t:'أقل من 36 تكرارًا', v:30, label:'طبيعي'},{t:'36–39', v:38, label:'قد يتطور'},{t:'أكثر من 40', v:45, label:'مرض هنتنغتون'}], cap:'عدد تكرارات CAG في الجين HTT وعلاقته بالمرض'}, q:{t:'mcq', q:'ما الذي يميّز أليل مرض هنتنغتون عن أليلَي المهق والهيموفيليا؟', opts:['أنه متنحٍّ','أنه على الكروموسوم X','أنه سائد','أنه لا يشفّر لبروتين'], a:2, why:'أليل هنتنغتون سائد؛ نسخة واحدة تكفي للإصابة.'}},
        {title:'لماذا ينتشر أليل سائد مميت؟', text:['أليل هنتنغتون **سائد**: احتمال **1 من 2** أن يرثه الطفل إذا حمله أحد الأبوين.','الحالة قد تكون **غير ظاهرة** حتى يصبح الشخص بالغًا، فقد ينجب أطفالًا قبل أن يعرف باحتمال نقلها لهم.','قارن: المهق والهيموفيليا **متنحيان** (غياب بروتين)، أما هنتنغتون فسائد (بروتين **غير طبيعي** بتكرارات زائدة).'], vis:{kind:'table', head:['أمشاج الأم (hh)', 'H (من الأب المصاب Hh)', 'h (من الأب المصاب Hh)'], rows:[['h','Hh مصاب','hh سليم'],['h','Hh مصاب','hh سليم']]}, cap:'أب مصاب Hh × أم سليمة hh: ½ الأبناء يرثون الأليل السائد'},
        {title:'مقارنة الجينات الأربعة', tag:'جدول جامع', text:['الجين → البروتين → الطراز المظهري: أربعة أمثلة.','ثلاثة أليلات متنحية (TYR، HBB، F8) وواحد سائد (HTT).','اثنان على الكروموسوم 11، وواحد على X، وواحد على 4.'], vis:{kind:'table', head:['الجين','الكروموسوم','البروتين','الحالة','نمط الوراثة'], rows:[['TYR','11 (الذراع الطويلة)','التايروسينيز (إنزيم)','المهق: لا ميلانين','متنحٍّ'],['HBB','11','بيتا-جلوبين (الهيموجلوبين)','فقر الدم المنجلي','متنحٍّ (مشترك على مستوى البروتين)'],['F8','X','العامل الثامن للتخثر','الهيموفيليا','متنحٍّ مرتبط بالجنس'],['HTT','4','هنتنغتن (تكرارات CAG)','مرض هنتنغتون','سائد']]}},
        {title:'خلاصة الدرس', tag:'خلاصة', text:['**TYR** → التايروسينيز → الميلانين؛ أليل متنحٍّ → **المهق**.','**HBB** → بيتا-جلوبين؛ تتابع مختلف → **فقر الدم المنجلي**.','**F8** على X → العامل الثامن؛ غيابه → **الهيموفيليا**.','**HTT** على 4 → هنتنغتن؛ أكثر من 40 تكرار CAG → **مرض هنتنغتون** (سائد).'], vis:{kind:'cards', items:[{icon:'⚪', title:'TYR', text:'تايروسينيز → ميلانين؛ المهق (متنحٍّ)'},{icon:'🩸', title:'HBB', text:'بيتا-جلوبين؛ فقر الدم المنجلي'},{icon:'🩹', title:'F8', text:'العامل الثامن؛ الهيموفيليا (X)'},{icon:'🧠', title:'HTT', text:'هنتنغتن؛ تكرارات CAG؛ سائد'}]}}
      ],
      games:[
        {id:'g1', type:'match', title:'طابق الجين بما يخصّه', pairs:[{a:'TYR', b:'إنزيم التايروسينيز', icon:'⚗️'},{a:'HBB', b:'بيتا-جلوبين في الهيموجلوبين', icon:'🩸'},{a:'F8', b:'العامل الثامن لتخثر الدم', icon:'🩹'},{a:'HTT', b:'بروتين هنتنغتن', icon:'🧠'},{a:'المهق', b:'غياب الميلانين من العيون والجلد والشعر', icon:'⚪'},{a:'فقر الدم المنجلي', b:'خلايا دم حمراء مشوهة الشكل', icon:'🌙'},{a:'الهيموفيليا', b:'نزف الدم الوراثي، مرتبط بالجنس', icon:'🧬'},{a:'مرض هنتنغتون', b:'أكثر من 40 تكرارًا للثلاثية CAG', icon:'🔁'}]},
        {id:'g2', type:'memory', title:'ذاكرة الجينات', back:'🧬', pairs:[{a:'TYR', b:'كروموسوم 11', icon:'📍'},{a:'HTT', b:'كروموسوم 4', icon:'📍'},{a:'F8', b:'كروموسوم X', icon:'📍'},{a:'CAG', b:'تأتأة', icon:'🔁'},{a:'تايروسين', b:'دوبا', icon:'➡️'},{a:'الميلانين', b:'صبغة داكنة', icon:'⚫'},{a:'هنتنغتون', b:'أليل سائد', icon:'👑'},{a:'1/17000', b:'المهق', icon:'👶'}]},
        {id:'g3', type:'quiz', title:'سباق الجينات', time:20, runner:'🧬', qs:[
          {q:'يُكتب رمز الجين البشري:', opts:['بحرف واحد كبير','بثلاثة أحرف بخط مائل','بثلاثة أحرف بخط غير مائل','بالأرقام'], a:1, why:'TYR مائل للجين، وTYR غير مائل للبروتين.'},
          {q:'الخطوة التي يحفّزها التايروسينيز:', opts:['ميلانين → تايروسين','تايروسين → دوبا','دوباكينون → جلوكوز','دوبا → هيموجلوبين'], a:1, why:'أول خطوتَين: تايروسين → دوبا → دوباكينون.'},
          {q:'المصاب بالمهق طرازه الجيني لجين TYR:', opts:['غير متماثل الأليلات','متماثل للأليل المتنحي','متماثل للأليل السائد','لا يحمل الجين'], a:1, why:'الأليل غير الطبيعي متنحٍّ.'},

    // ════════════════════════════ ٢-٦ التحكم في التعبير الجيني ════════════════════════════
    { id:'l2_6', num:'٢-٦', title:'التحكم في التعبير الجيني', en:'Control of gene expression', ws:false,
      preIntro:'خلايا عضلة قلبك تحمل جين الميلانين لكنها لا تصنعه أبدًا. من يقرر أي جين «يُشغَّل» وأيّها «يُوقَف»؟',
      pre:[
        {t:'tf', q:'يُقال عن الجين إنه «معبَّر عنه» عندما يُنسخ إلى mRNA ثم يُترجم إلى بروتين.', a:true, why:'التعبير الجيني = نسخ + ترجمة (الوحدة الأولى).'},
        {t:'mcq', q:'نسبة الجينات التي يُعبَّر عنها فعليًا في خلية واحدة في وقت معيّن:', opts:['جميعها','نصفها تقريبًا','نسبة ضئيلة فقط','لا شيء منها'], a:2, why:'كل خلية تعبّر عن الجينات التي تحتاج إليها فقط؛ جين الميلانين لا يُعبَّر عنه في عضلة القلب.'},
        {t:'cloud', q:'اختر ما يرتبط بأوبرون اللاكتوز في E. coli:', words:[{w:'بيتا-جالاكتوسيديز',ok:true},{w:'البروتين المثبط',ok:true},{w:'المشغّل',ok:true},{w:'المحفّز',ok:true},{w:'lacZ',ok:true},{w:'الرايبوسوم',ok:false},{w:'الجبريلين',ok:false},{w:'اللاكتوز',ok:true},{w:'الإنسولين',ok:false},{w:'الميتوكوندريا',ok:false}], why:'أوبرون Lac: جين منظم ينتج المثبط، ومحفّز ومشغّل، وجينات تركيبية lacZ وlacY وlacA، ينظمها وجود اللاكتوز.'},
        {t:'visual', vis:'lac_operon', q:'في غياب اللاكتوز، أين يرتبط البروتين المثبط فيمنع النسخ؟', opts:['بالرايبوسوم','بمنطقة المشغّل','باللاكتوز','بالجين المنظم'], a:1, why:'ارتباط المثبط بالمشغّل يمنع RNA بوليميريز من الارتباط بالمحفّز.'},
        {t:'open', q:'لماذا يكون من المفيد للبكتيريا أن تصنع إنزيم هضم اللاكتوز فقط عندما يوجد اللاكتوز في بيئتها؟'},
        {t:'mcq', q:'الإنزيم الذي ينسخ DNA إلى mRNA:', opts:['DNA بوليميريز','RNA بوليميريز','هيليكيز','لايجيز'], a:1, why:'RNA بوليميريز يرتبط بالمحفّز ليبدأ النسخ.'}
      ],
      slides:[
        {title:'تشغيل وإيقاف الجينات', tag:'تمهيد', text:['الجين **«معبَّر عنه»** عندما يُنسخ إلى mRNA ثم يُترجم mRNA لإنتاج البروتين.','**نسبة ضئيلة** فقط من جينات النواة يُعبَّر عنها فعليًا في أي وقت؛ جين إنتاج الميلانين لا يُعبَّر عنه مطلقًا في خلايا عضلة القلب.','سنتعرّف على التحكم في التعبير الجيني في **بدائيات النواة** (بكتيريوم الإشريكية القولونية E. coli) ثم في **حقيقيات النواة**.','فهم العلماء «تشغيل On» و«إيقاف Off» الجينات أولًا من دراسات على البكتيريا.'], note:'💡 كل خلية في جسمك تحمل الجينوم كاملًا؛ ما يميّز خلية الكبد عن الخلية العصبية هو أيّ الجينات معبَّر عنها.', vis:{kind:'flow', steps:[{icon:'🧬',t:'الجين (DNA)'},{icon:'📝',t:'النسخ → mRNA'},{icon:'🏭',t:'الترجمة → بروتين'},{icon:'✅',t:'جين معبَّر عنه'}]}},
        {title:'بيتا-جالاكتوسيديز والجينات التركيبية', text:['**بيتا (β)-جالاكتوسيديز** (يُعرف أيضًا باسم **اللاكتيز**): إنزيم يحفّز التحلل المائي لـ **اللاكتوز → جلوكوز + جالاكتوز**، فتمتصهما البكتيريا مصدرًا للطاقة.','**الجين التركيبي (Structural gene)**: يشفّر لبروتين له وظيفة في الخلية (جزء من تركيبها أو إنزيم). جين بيتا-جالاكتوسيديز مثال عليه.','**الجين المنظم (Regulatory gene)**: يشفّر لبروتين يساعد في التحكم في تعبير جينات أخرى.','يتغيّر عدد جزيئات بيتا-جالاكتوسيديز في E. coli مع تركيز اللاكتوز في الوسط، عن طريق تشغيل أو إيقاف **نسخ** الجين.'], vis:{kind:'compare', cols:[{icon:'🏗️', title:'الجين التركيبي', items:['يشفّر لبروتين تستخدمه الخلية','إنزيمات أو بروتينات تركيبية','مثال: lacZ (بيتا-جالاكتوسيديز)، lacY، lacA']},{icon:'🎛️', title:'الجين المنظم', items:['يشفّر لبروتين يتحكم في تعبير جينات أخرى','مثال: جين المثبط في أوبرون Lac','يوجد قرب الجينات التركيبية على DNA الحلقي']}]}, q:{t:'mcq', q:'ماذا ينتج من التحلل المائي للاكتوز؟', opts:['جلوكوز + فركتوز','جلوكوز + جالاكتوز','جالاكتوز + فركتوز','جلوكوزان'], a:1, why:'بيتا-جالاكتوسيديز يحلل اللاكتوز إلى جلوكوز وجالاكتوز.'}},
        {title:'تركيب أوبرون Lac', tag:'Operon', text:['**الأوبرون**: وحدة وظيفية في النسخ؛ مجموعة من الجينات يتحكم بها **المحفّز نفسه** وتُنسخ معًا.','**أوبرون Lac** (Lac اختصار Lactose) يتحكم في إنتاج بيتا-جالاكتوسيديز وبروتينَين تركيبيَّين آخرَين.','مكوناته: **الجين المنظم** (يشفّر للبروتين المثبط Lac)، **المحفّز (Promoter)** حيث يرتبط RNA بوليميريز، **المشغّل (Operator)**، و**الجينات التركيبية الثلاثة**: lacZ (بيتا-جالاكتوسيديز)، lacY، lacA.','تُنسخ الجينات التركيبية الثلاثة جميعًا في الوقت نفسه من المحفّز نفسه.'], vis:'lac_operon', cap:'أوبرون Lac: الجين المنظم، المحفّز، المشغّل، lacZ وlacY وlacA'},
        {title:'عدم وجود اللاكتوز: الأوبرون مُوقَف', text:['يشفّر الجين المنظم لبروتين يسمّى **المثبط (Repressor)**.','يرتبط المثبط بمنطقة **المشغّل** قريبًا من جين بيتا-جالاكتوسيديز.','لأن المثبط مرتبط بالمشغّل، **يُمنع RNA بوليميريز** من الارتباط بمنطقة المحفّز.','النتيجة: **لا تُنسخ** الجينات التركيبية الثلاثة، فلا يُهدر إنزيم لا حاجة إليه.'], vis:{kind:'steps', steps:[{icon:'🧬',t:'الجين المنظم يُنسخ ويُترجم → بروتين مثبط'},{icon:'🔒',t:'المثبط يرتبط بالمشغّل'},{icon:'⛔',t:'RNA بوليميريز لا يستطيع الارتباط بالمحفّز'},{icon:'🚫',t:'لا نسخ لـ lacZ وlacY وlacA'}]}, q:{t:'mcq', q:'في غياب اللاكتوز، ما الذي يمنع النسخ مباشرة؟', opts:['غياب RNA بوليميريز من الخلية','ارتباط المثبط بالمشغّل','ارتباط اللاكتوز بالمحفّز','انقسام الخلية'], a:1, why:'المثبط على المشغّل يحجب ارتباط RNA بوليميريز بالمحفّز.'}},
        {title:'وجود اللاكتوز: الأوبرون مُشغَّل', text:['للمثبط **موقعا ارتباط**: أحدهما مع DNA (المشغّل) والآخر مع اللاكتوز.','تمتص البكتيريا اللاكتوز؛ يرتبط اللاكتوز بالمثبط فيتغيّر **شكله** ويُغلق موقع ربط DNA، فينفصل عن المشغّل.','لم يعد النسخ مثبَّطًا: يرتبط RNA بوليميريز بالمحفّز وينسخ **mRNA** من الجينات التركيبية الثلاثة معًا.','تُنتج البكتيريا بيتا-جالاكتوسيديز والإنزيمَين الآخرَين (من lacY وlacA) **بكميات متساوية**، فقط عند وجود اللاكتوز، فتتجنّب **إهدار الطاقة والمواد**.'], vis:'lac_operon', cap:'اللاكتوز يرتبط بالمثبط فينفصل عن المشغّل ويبدأ النسخ'},
        {title:'إنزيم قابل للتحفيز مقابل قابل للتثبيط', text:['**إنزيم قابل للتحفيز (Inducible)**: يُبنى فقط عند وجود **مادته المتفاعلة**؛ بيتا-جالاكتوسيديز مثال: يرتبط المستجيب (اللاكتوز) بالمثبط فيمنعه من الارتباط بالمشغّل ويبدأ النسخ.','**إنزيم قابل للتثبيط (Repressible)**: يُبنى **عادة**، ويُمنع بناؤه عند وجود **مستجيب**؛ هنا يساعد ارتباط المستجيب بالمثبط على ارتباطه بالمشغّل فيوقف النسخ.','في الحالتَين، الجزيء المستجيب يغيّر شكل المثبط لكن بنتيجة معاكسة.'], vis:{kind:'compare', cols:[{icon:'🔛', title:'قابل للتحفيز', items:['الوضع الافتراضي: مُوقَف','المستجيب (اللاكتوز) يفصل المثبط عن المشغّل','يُبنى فقط عند وجود المادة المتفاعلة','مثال: بيتا-جالاكتوسيديز']},{icon:'🔚', title:'قابل للتثبيط', items:['الوضع الافتراضي: مُشغَّل','المستجيب يساعد المثبط على الارتباط بالمشغّل','يُوقَف بناؤه عند وجود المستجيب','مثال: إنزيمات تُبنى عادة']}]}, q:{t:'mcq', q:'بيتا-جالاكتوسيديز إنزيم:', opts:['قابل للتثبيط','قابل للتحفيز','يُبنى دائمًا','لا يخضع لتنظيم'], a:1, why:'يُبنى فقط عند وجود مادته المتفاعلة (اللاكتوز).'}},
        {title:'عوامل النسخ في حقيقيات النواة', tag:'Transcription factors', text:['لا تحتوي حقيقيات النواة على أوبرونات؛ تتحكم **عوامل النسخ** في تعبير جيناتها.','**عامل النسخ**: بروتين يرتبط مع DNA ويؤثر إما بتنشيط نسخ الجين أو تثبيطه؛ يضمن التعبير عن الجين في **الخلية الصحيحة والوقت الصحيح والمقدار الصحيح**.','في الإنسان يُعتقد أن نحو **10%** من الجينات تشفّر لبروتينات تعمل كعوامل نسخ.','**عامل نسخ منشّط** يرتبط بموقعه على DNA فيحفّز ارتباط RNA بوليميريز بالمحفّز؛ **عامل نسخ مثبّط** يمنع ارتباطه.'], vis:'transcription_factors', cap:'عامل النسخ يرتبط بالمحفّز أو قربه ويساعد RNA بوليميريز على البدء (أو يمنعه)'},
        {title:'أدوار عوامل النسخ وهرمونات النبات', text:['تنظّم عوامل النسخ **تسلسل** تنشيط الجينات في التطور (من زيجوت إلى جنين)، والاستجابة للمنبهات البيئية، والاستجابة **للهرمونات** مثل التستوستيرون وهرمونات الغدة الدرقية، وتنظّم نمو الخلايا وموتها.','مثال هرموني في النبات: **الجبريلين** يرتبط بمستقبله فيؤدي إلى **تحلّل بروتين DELLA** (الذي يثبط النسخ).','تحلّل DELLA يحرّر **عامل النسخ PIF** ليرتبط بالمحفّز ويبدأ نسخ جينات نمو الساق والإنبات.','هكذا يترجم الهرمون إشارته إلى تغيير في **معدل النسخ**.'], vis:'gibberellin_della', cap:'الجبريلين → تحلّل DELLA → تحرير عامل النسخ PIF → نسخ الجينات', q:{t:'mcq', q:'ما دور بروتين DELLA قبل وصول الجبريلين؟', opts:['ينسخ الجينات','يثبط عامل النسخ PIF فيمنع النسخ','يحلل الجبريلين','ينقل mRNA'], a:1, why:'DELLA يمنع PIF؛ الجبريلين يسبب تحلل DELLA فيتحرر PIF.'}},
        {title:'مقارنة التنظيم في بدائيات وحقيقيات النواة', text:['بدائيات النواة: **أوبرونات** بمحفّز مشترك ومثبط يرتبط بالمشغّل؛ استجابة سريعة للغذاء المتاح.','حقيقيات النواة: **عوامل نسخ** منشّطة ومثبّطة ترتبط بالمحفّز أو مناطق أخرى في DNA.','في الحالتَين يبقى **RNA بوليميريز** والمحفّز في قلب التحكم.'], vis:{kind:'table', head:['', 'بدائيات النواة (E. coli)', 'حقيقيات النواة'], rows:[['الوحدة','أوبرون (جينات بمحفّز واحد)','جين منفرد بمحفّزه'],['البروتين المنظم','المثبط (من الجين المنظم)','عوامل نسخ منشّطة أو مثبّطة'],['موقع الارتباط','المشغّل','المحفّز أو مناطق أخرى في DNA'],['المستجيب','اللاكتوز (يرتبط بالمثبط)','هرمونات، منبهات بيئية، إشارات تطور'],['مثال','أوبرون Lac','الجبريلين/DELLA، مستقبل هرمون الدرقية']]}},
        {title:'خلاصة الدرس', tag:'خلاصة', text:['**الجينات التركيبية** تشفّر لبروتينات وظيفية، و**الجينات المنظمة** تتحكم في تعبير غيرها.','**أوبرون Lac**: بدون لاكتوز يرتبط **المثبط** بالمشغّل ويمنع النسخ؛ مع اللاكتوز يرتبط اللاكتوز بالمثبط فينفصل ويبدأ RNA بوليميريز النسخ.','بيتا-جالاكتوسيديز **قابل للتحفيز**؛ الإنزيمات **القابلة للتثبيط** تُبنى عادة وتُوقَف بالمستجيب.','في حقيقيات النواة تتحكم **عوامل النسخ** (منشّطة/مثبّطة) بزيادة أو تقليل معدل النسخ.'], vis:{kind:'cycle', center:'🎛️', steps:[{icon:'🥛',t:'لاكتوز في الوسط'},{icon:'🔓',t:'يرتبط بالمثبط فينفصل عن المشغّل'},{icon:'▶️',t:'RNA بوليميريز ينسخ lacZYA'},{icon:'⚗️',t:'بيتا-جالاكتوسيديز يحلل اللاكتوز'},{icon:'📉',t:'ينفد اللاكتوز'},{icon:'🔒',t:'المثبط يعود إلى المشغّل'}]}}

        {t:'cloud', q:'اختر الكلمات التي تتوقّع أنها ترتبط بالهندسة الجينية:', words:[{w:'جين',ok:true},{w:'بلازميد',ok:true},{w:'إنزيم قطع',ok:true},{w:'كائن معدّل جينيًا',ok:true},{w:'ناقل',ok:true},{w:'التركيب الضوئي',ok:false},{w:'الانتشار البسيط',ok:false},{w:'النسخ العكسي',ok:true},{w:'المفصل الزلالي',ok:false},{w:'النخاع العظمي',ok:false}], why:'الهندسة الجينية تتعامل مع الجينات ونقلها بالنواقل (كالبلازميدات) باستخدام إنزيمات القطع والنسخ العكسي.'},

        {t:'mcq', q:'من دراستك السابقة للخلية البكتيرية: البلازميد هو...', opts:['حلقة صغيرة من DNA مزدوج منفصلة عن الكروموسوم البكتيري','غشاء يحيط بالمادة الوراثية','بروتين يشكّل السوط','نوع من الرايبوسومات'], a:0, why:'البلازميدات قطع حلقية صغيرة من DNA مزدوج توجد طبيعيًا في البكتيريا، وغالبًا تحمل جينات مقاومة للمضادات الحيوية.'}

      slides:[
        {title:'لماذا ندرس التقنية الجينية؟', tag:'تمهيد', text:['كيف يحصل مريض السكري على **إنسولين إنسان** تصنعه بكتيريا؟','كيف تكشف الشرطة هوية شخص من **قطرة دم** تُركت في مسرح الجريمة؟','**التقنية الجينية**: مجموعة من التقنيات لاستقصاء تتابع النيوكليوتيدات في DNA وتغيير DNA الكائن الحي.','أهداف الدرس: شرح معنى **الهندسة الجينية** و**DNA معاد التركيب**، ومصادر الجينات المنقولة، والخطوات العامة لنقل الجين.'], note:'💡 تعتمد هذه الوحدة على معرفتك بتركيب DNA واختلافه عن RNA والبروتين (الوحدة الأولى).', vis:{kind:'cards', items:[{icon:'💉',title:'الطب',text:'إنسولين وعامل تخثر وإنزيمات معادة التركيب'},{icon:'🔍',title:'الطب الشرعي',text:'البصمة الوراثية من عينات صغيرة'},{icon:'🌽',title:'الزراعة',text:'محاصيل مقاومة للآفات ومبيدات الأعشاب'},{icon:'🧬',title:'الفحص الجيني',text:'الكشف عن أليلات المرض'}]}},
        {title:'العلوم ضمن سياقها: مكافحة الجرائم عبر DNA', tag:'ربط بالحياة', text:['يُستخلص DNA من **خلايا الدم البيضاء** في عينة الدم المأخوذة عن السكين.','تُفكَّك الخلايا بمادة خاصة، ويُلتقط DNA الخام على **كُرات مغناطيسية**، ثم يُهضم البروتين المتبقي بإنزيم **بروتييز** ويُغسل DNA النقي.','كمية DNA صغيرة جدًا → تُضخَّم **المناطق الرئيسية** منه باستخدام **DNA بوليميريز** لتكوين نسخ متعددة.','تُقارَن **البصمة الوراثية** الناتجة مع البصمات المحفوظة في قاعدة بيانات الشرطة.'], vis:{kind:'flow', steps:[{icon:'🩸',t:'عينة دم'},{icon:'🧫',t:'تفكيك الخلايا'},{icon:'🧲',t:'التقاط DNA على كُرات مغناطيسية'},{icon:'✂️',t:'هضم البروتين ببروتييز'},{icon:'📈',t:'تضخيم DNA'},{icon:'🆔',t:'بصمة وراثية'}]}, cap:'خطوات الحصول على DNA نقي من عينة دم في مسرح الجريمة', q:{t:'mcq', q:'لماذا يُستخلص DNA من خلايا الدم البيضاء وليس من خلايا الدم الحمراء؟', opts:['لأن خلايا الدم الحمراء الناضجة في الإنسان لا تحتوي على نواة','لأن خلايا الدم الحمراء أصغر حجمًا','لأن خلايا الدم البيضاء أكثر عددًا في الدم','لأن خلايا الدم الحمراء تحتوي على RNA فقط'], a:0, why:'خلايا الدم الحمراء الناضجة في الثدييات تفقد نواتها، فلا تحتوي على DNA نووي.'}},
        {title:'ما الهندسة الجينية؟', tag:'مفهوم', text:['**الهندسة الجينية**: إزالة جين (أو جينات) من كائن حي ونقله إلى كائن حي آخر ليتم **التعبير** عنه.','DNA الذي عُدِّل بهذه العملية ويحوي نيوكليوتيدات من كائنين حيين يسمّى **DNA معاد التركيب (rDNA)**.','الكائن الذي عُبِّر فيه عن الجين الجديد يسمّى **كائنًا معدّلًا جينيًا (GMO)** أو **محوّرًا جينيًا (Transgenic)**.','قد يكون DNA المنقول من **نوع آخر** أو من كائن حي آخر من **النوع نفسه**.'], vis:'recombinant_dna', cap:'قطع الجين والبلازميد، ثم لصقهما لتكوين DNA معاد التركيب وإدخاله في بكتيريا'},
        {title:'تجاوز حدود الأنواع', tag:'مقارنة', text:['الهندسة الجينية وسيلة للتغلب على **معوّقات نقل الجينات بين الأنواع**: جين بكتيري في نبات، أو جين إنسان في بكتيريوم.','هذا ممكن لأن **الشيفرة الجينية عالمية**.','**التكاثر الانتقائي** ينقل مجموعات كاملة من الجينات عبر أجيال عديدة، أما الهندسة الجينية فتنقل **جينًا واحدًا** في أغلب الأحيان.','لذلك يجب مراعاة **القضايا الأخلاقية والاجتماعية** التي سنناقشها في نهاية الوحدة.'], vis:{kind:'compare', cols:[{icon:'🐄',title:'التكاثر الانتقائي',items:['اختيار أفراد وتزاوجها','ينقل مجموعات كاملة من الجينات','داخل النوع نفسه غالبًا','يستغرق أجيالًا عديدة']},{icon:'🧪',title:'الهندسة الجينية',items:['نقل مباشر لـ DNA','ينقل جينًا واحدًا غالبًا','بين أنواع أو ممالك مختلفة','سريع ودقيق']}]}, q:{t:'mcq', q:'ما الذي يسمح بالتعبير عن جين إنسان داخل بكتيريوم؟', opts:['أن الشيفرة الجينية عالمية','أن البكتيريا تحوي نواة','أن جينات الإنسان لا تحوي إنترونات','أن DNA البكتيريا شريط مفرد'], a:0, why:'الكودونات نفسها تشفّر للأحماض الأمينية نفسها في جميع الكائنات تقريبًا، فتترجم البكتيريا الجين البشري إلى البروتين نفسه.'}},
        {title:'نظرة عامة على نقل الجين', tag:'خطوات', text:['١. **تحديد الجين المطلوب**: يُقتطع من كروموسوم، أو يُكوَّن من mRNA بالنسخ العكسي، أو يُبنى من النيوكليوتيدات.','٢. تكوين **عدة نسخ** من الجين بتقنية **تفاعل البوليميريز المتسلسل (PCR)**.','٣. إدخال الجين في **ناقل** يوصله إلى داخل خلايا الكائن الحي.','٤. **تحديد الخلايا** التي تحوي الجين الجديد باستخدام **العلامات الجينية**، ثم **استنساخها**.'], vis:{kind:'steps', steps:[{icon:'1️⃣',t:'تحديد الجين المطلوب وعزله'},{icon:'2️⃣',t:'تكوين نسخ كثيرة منه بـ PCR'},{icon:'3️⃣',t:'إدخاله في ناقل (بلازميد/فيروس/ليبوسوم)'},{icon:'4️⃣',t:'تحديد الخلايا المعدّلة بالعلامات الجينية واستنساخها'}]}},
        {title:'من أين يأتي الجين؟ ثلاثة مصادر', tag:'مصادر', text:['**مستخلص من DNA كائن حي مانح**: يُقتطع من الكروموسوم بإنزيمات القطع.','**مصنّع من mRNA كائن حي مانح**: بالنسخ العكسي باستخدام إنزيم **ترانسكريبتيز العكسي**، فيخلو من الإنترونات.','**مصنّع كيميائيًا من النيوكليوتيدات**: بأجهزة بناء DNA اعتمادًا على معرفة الشيفرة الجينية.'], vis:{kind:'cards', items:[{icon:'✂️',title:'من الكروموسوم',text:'اقتطاع الجين بإنزيم قطع إندونيوكلييز'},{icon:'🔄',title:'من mRNA',text:'نسخ عكسي بإنزيم ترانسكريبتيز العكسي → cDNA'},{icon:'🖥️',title:'بناء اصطناعي',text:'تجميع نيوكليوتيدات وفق تتابع محفوظ في الحاسوب'}]}, q:{t:'mcq', q:'أي مصدر للجين يعطي نسخة خالية من الإنترونات مباشرة؟', opts:['اقتطاعه من الكروموسوم','تكوينه من mRNA بالنسخ العكسي','استخلاصه من البلازميد','أخذه من DNA الميتوكندريا'], a:1, why:'mRNA الناضج يحوي الإكسونات فقط بعد إزالة الإنترونات، فنسخه العكسي يعطي DNA خاليًا من الإنترونات.'}},
        {title:'النواقل وحقيبة أدوات مهندس الجينات', tag:'أدوات', text:['**الناقل (Vector)**: وسيلة لإيصال الجين إلى الخلية؛ أمثلة: **البلازميدات**، **الفيروسات**، **الليبوسومات**.','**إنزيمات**: إنزيمات القطع إندونيوكلييز، **DNA لايجيز**، **ترانسكريبتيز العكسي**.','**جينات علامة**: تشفّر لمواد يسهل تحديدها (مثل البروتينات المتوهجة).'], note:'💡 سنتعرّف إلى عمل كل أداة بالتفصيل في الدرس التالي.', vis:{kind:'table', head:['الأداة','دورها في نقل الجين'], rows:[['إنزيم القطع إندونيوكلييز','يقطع DNA في مواقع محددة'],['DNA لايجيز','يربط قطع DNA معًا'],['ترانسكريبتيز العكسي','يكوّن DNA من mRNA'],['البلازميد / الفيروس','ناقل يوصل الجين إلى الخلية'],['جين علامة','يحدّد الخلايا المعدّلة بنجاح']]}},
        {title:'سؤال للمناقشة: لماذا يختلف DNA كل شخص؟', tag:'تفكير', text:['هناك احتمال كبير أن يكون DNA الخاص بك مختلفًا عن أي شخص آخر في العالم.','أسباب من الوحدة الثانية: **العبور** و**التوزيع الحر** للكروموسومات في الانقسام الاختزالي، و**الإخصاب العشوائي**، و**الطفرات**.','هذا التفرّد هو أساس **البصمة الوراثية** المستخدمة في الطب الشرعي.'], vis:{kind:'cycle', center:'🧬', steps:[{icon:'🔀',t:'العبور'},{icon:'🎲',t:'التوزيع الحر'},{icon:'🥚',t:'الإخصاب العشوائي'},{icon:'⚡',t:'الطفرات'}]}, cap:'مصادر التباين الجيني التي تجعل بصمتك الوراثية فريدة'},
        {title:'خلاصة الدرس', tag:'خلاصة', text:['**الهندسة الجينية** = نقل جين من كائن حي إلى آخر ليُعبَّر عنه.','**rDNA** = DNA من كائنين مرتبطان اصطناعيًا؛ **GMO** = كائن غُيِّر DNA فيه بطريقة لا تحدث طبيعيًا.','مصادر الجين: **كروموسوم**، **mRNA** (نسخ عكسي)، **بناء اصطناعي**.','خطوات: تحديد الجين → **PCR** → **ناقل** → **علامة جينية** واستنساخ.'], vis:{kind:'flow', steps:[{icon:'🎯',t:'الجين'},{icon:'📈',t:'PCR'},{icon:'🔵',t:'الناقل'},{icon:'🦠',t:'الخلية المضيفة'},{icon:'💡',t:'العلامة'}]}}

          {q:'يسمّى الكائن الذي عُبِّر فيه عن جين جديد منقول...', opts:['كائنًا طافرًا','كائنًا معدّلًا جينيًا (GMO)','كائنًا مستنسخًا','كائنًا هجينًا'], a:1, why:'GMO كائن تغيّر DNA فيه بطريقة لا تحدث طبيعيًا أو بالتكاثر الانتقائي.'},

          {q:'الخطوة التي تلي تحديد الجين المطلوب مباشرة في نقل الجين هي...', opts:['تكوين نسخ متعددة منه بـ PCR','إدخاله في ناقل','تحديد الخلايا المعدّلة','استنساخ الخلايا'], a:0, why:'يُضخَّم الجين أولًا بـ PCR للحصول على نسخ كافية قبل إدخاله في الناقل.'},

          {q:'الفرق الأساسي بين الهندسة الجينية والتكاثر الانتقائي أن الهندسة الجينية...', opts:['تستغرق أجيالًا عديدة','تنقل جينًا واحدًا غالبًا وقد يكون من نوع آخر','تعتمد على اختيار أفراد للتزاوج','لا تغيّر DNA الكائن الحي'], a:1, why:'التكاثر الانتقائي ينقل مجموعات كاملة من الجينات داخل النوع عبر أجيال، بينما الهندسة الجينية تنقل جينًا محددًا حتى بين ممالك مختلفة.'},
          {q:'في الطب الشرعي، تُلتقط عينة DNA الخام على...', opts:['كُرات مغناطيسية','ورق ترشيح','شريط أجاروس','صفيحة آجار'], a:0, why:'تُلتقط عينة DNA الخام على كُرات مغناطيسية ويُترك معظم بقايا الخلية والبروتين في المحلول.'},

          {q:'أي عبارة صحيحة عن مصادر الجين المنقول؟', opts:['يجب أن يُقتطع دائمًا من الكروموسوم','يمكن بناؤه كيميائيًا من النيوكليوتيدات','لا يمكن تكوينه من mRNA','يُؤخذ فقط من البلازميدات'], a:1, why:'يمكن اقتطاع الجين من كروموسوم، أو تكوينه من mRNA بالنسخ العكسي، أو بناؤه من النيوكليوتيدات مباشرة.'}

          {q:'استُخدم جين من بكتيريا ليُعبَّر عنه في نبات. أي عبارة تفسّر إمكانية ذلك؟', opts:['النباتات والبكتيريا من النوع نفسه','الشيفرة الجينية عالمية بين الكائنات الحية','النباتات لا تحوي DNA خاصًا بها','البكتيريا تحوي نواة كالنبات'], a:1, why:'لأن الكودونات تشفّر للأحماض الأمينية نفسها في جميع الكائنات تقريبًا، تترجم الخلية النباتية الجين البكتيري إلى البروتين نفسه.'},

          {q:'أي ترتيب صحيح لخطوات تكوين كائن معدّل جينيًا؟', opts:['ناقل → PCR → تحديد الجين → علامات','تحديد الجين → PCR → ناقل → علامات جينية واستنساخ','علامات → ناقل → PCR → تحديد الجين','PCR → علامات → ناقل → تحديد الجين'], a:1, why:'يُحدَّد الجين أولًا، ثم يُضخَّم، ثم يُدخَل في ناقل، ثم تُحدَّد الخلايا المعدّلة وتُستنسخ.'}

    { id:'l3_2', num:'٣-٢', title:'أدوات تقني الجينات', en:'Tools for the gene technologist', ws:false,

      pre:[
        {t:'tf', q:'يربط إنزيم DNA لايجيز النيوكليوتيدات معًا بروابط فوسفات ثنائية الإستر أثناء تضاعف DNA.', a:true, why:'DNA لايجيز يحفّز تكوين روابط فوسفات ثنائية الإستر في العمود الفقري سكر-فوسفات (الوحدة الأولى)، والأداة نفسها تُستخدم في الهندسة الجينية.'},
        {t:'mcq', q:'في أوبرون اللاكتوز (الوحدة الثانية)، المنطقة من DNA التي يرتبط بها RNA بوليميريز لبدء النسخ تسمّى...', opts:['المشغّل','المحفّز','الجين المنظّم','الجين التركيبي'], a:1, why:'المحفّز (Promoter) هو موقع ارتباط RNA بوليميريز حيث يبدأ نسخ الجينات.'},
        {t:'visual', vis:'dna_helix', q:'ما نوع الروابط التي تربط القواعد المتكاملة بين شريطَي DNA؟', opts:['روابط تساهمية','روابط هيدروجينية','روابط أيونية','روابط ببتيدية'], a:1, why:'القواعد المتكاملة ترتبط بروابط هيدروجينية ضعيفة؛ وهذه الروابط نفسها تربط النهايات اللاصقة المتكاملة.'},
        {t:'mcq', q:'في جينات حقيقيات النواة، الأجزاء المشفّرة التي تبقى في mRNA الناضج تسمّى...', opts:['إنترونات','إكسونات','كودونات توقف','محفّزات'], a:1, why:'الإكسونات مشفّرة وتبقى بعد الربط، أما الإنترونات فتُزال من RNA قبل مغادرة النواة.'},
        {t:'cloud', q:'اختر أدوات مهندس الجينات من الكلمات الآتية:', words:[{w:'إنزيم قطع إندونيوكلييز',ok:true},{w:'DNA لايجيز',ok:true},{w:'بلازميد',ok:true},{w:'ترانسكريبتيز العكسي',ok:true},{w:'البروتين المتوهج الأخضر',ok:true},{w:'الهيموجلوبين',ok:false},{w:'الميوسين',ok:false},{w:'الأميليز',ok:false},{w:'المحفّز',ok:true},{w:'الكلوروفيل',ok:false}], why:'الأدوات: إنزيمات القطع، DNA لايجيز، ترانسكريبتيز العكسي، النواقل كالبلازميدات، العلامات الجينية كـ GFP، والمحفّزات.'},
        {t:'open', q:'تُهاجَم البكتيريا بفيروسات تحقن DNA فيها. توقّع: كيف يمكن للبكتيريا أن تدافع عن نفسها ضد DNA الفيروسي؟ وكيف يستفيد مهندس الجينات من ذلك؟'}
      ],
      slides:[
        {title:'حقيبة أدوات مهندس الجينات', tag:'تمهيد', text:['هل تساءلت كيف «يُقطع» جين من كروموسوم ثم «يُلصق» في بلازميد؟','الأدوات: **إنزيمات القطع إندونيوكلييز**، **DNA لايجيز**، **ترانسكريبتيز العكسي**، **DNA بوليميريز**، **النواقل** (بلازميدات وفيروسات)، **العلامات الجينية**، و**المحفّز**.','أهداف الدرس: شرح دور كل أداة، وسبب نقل المحفّز مع الجين، وكيفية تأكيد التعبير الجيني بالعلامات المتوهجة.'], vis:{kind:'cards', items:[{icon:'✂️',title:'إنزيمات القطع',text:'مقص جزيئي يقطع DNA في مواقع محددة'},{icon:'🧷',title:'DNA لايجيز',text:'غراء جزيئي يربط قطع DNA'},{icon:'🔄',title:'ترانسكريبتيز العكسي',text:'يكوّن DNA من mRNA'},{icon:'⭕',title:'البلازميد',text:'ناقل حلقي يدخل البكتيريا'},{icon:'💡',title:'العلامات الجينية',text:'GFP و GUS لتحديد الخلايا المعدّلة'},{icon:'🔛',title:'المحفّز',text:'مفتاح تشغيل الجين'}]}},
        {title:'إنزيمات القطع إندونيوكلييز: مقص البكتيريا', tag:'أداة ١', text:['تُنتجها **البكتيريا** دفاعًا عن نفسها ضد **الفيروسات آكلة البكتيريا (الفاجات)**، فتقطّع DNA الفيروسي إلى أجزاء أصغر.','تقطع **العمود الفقري سكر-فوسفات** في أماكن محددة **داخل** جزيء DNA لا في نهايته؛ لذا تسمّى **إندونيوكلييز**.','يستهدف كل إنزيم **موقع قطع** محددًا: تتابع من **4 إلى 6 قواعد**، غالبًا **متناظر** (يُقرأ التتابع نفسه من كلا الاتجاهين).','مثال: **BamHI** يقطع عند التتابع **GGATCC** (والمكمل CCTAGG).','تحمي البكتيريا DNA الخاص بها بتغيير كيميائي لقواعده أو بعدم وجود مواقع قطع فيه.'], vis:{kind:'table', head:['الإنزيم','موقع القطع (5′→3′)','مصدره البكتيري'], rows:[['EcoRI','G▼AATTC','الأشريكية القولونية Escherichia coli'],['BamHI','G▼GATCC','باسيلوس أميلوليكوفاسينز'],['HindIII','A▼AGCTT','هيموفيلوس إنفلونزا'],['HaeIII','GG▼CC','هيموفيلوس إيجيبتيوس']]}, cap:'الجدول ١-٣: أربعة إنزيمات قطع ومواقعها؛ ▼ موضع القطع. HaeIII ينتج نهايات مستقيمة', q:{t:'mcq', q:'قُطعت قطعة DNA تحوي 5 مواقع قطع لإنزيم EcoRI. كم قطعة تنتج؟', opts:['4','5','6','10'], a:2, why:'قطعة خطية بها n موقع قطع تنتج n+1 قطعة: 5 مواقع → 6 قطع.'}},
        {title:'النهايات اللاصقة والنهايات المستقيمة', tag:'أداة ١', text:['قد يقطع الإنزيم بطريقة **مستقيمة** عبر الشريطين فتنتج **نهايات مستقيمة**.','أو بطريقة **متعرّجة** فتنتج **نهايات لاصقة**: أجزاء قصيرة من قواعد **غير مزدوجة** (مثل ‎-GATC في BamHI).','تكوّن النهايات اللاصقة **روابط هيدروجينية** مع تتابع القواعد **المكملة** على أي قطعة DNA أخرى قُطعت بالإنزيم **نفسه**.','قطع شريط طويل يعطي مزيجًا من أجزاء مختلفة الطول تُفصل بـ **الفصل الكهربائي الهلامي**، ثم تُنسخ القطعة المستهدفة بـ **PCR**.','سُمّيت الإنزيمات باختصارات مصدرها: **EcoRI** من Escherichia coli (سلالة RY13)، والرقم الروماني يميّز الإنزيمات من المصدر نفسه.'], vis:'recombinant_dna', cap:'القطع المتعرّج يترك نهايات لاصقة متكاملة على الجين والبلازميد'},
        {title:'ترانسكريبتيز العكسي: من mRNA إلى cDNA', tag:'أداة ٢', text:['DNA الكروموسومي في حقيقيات النواة يحوي **إكسونات** مشفّرة و**إنترونات** غير مشفّرة؛ mRNA الناضج يحوي **الإكسونات فقط**.','لتجنّب الإنترونات يستخدم التقنيون **mRNA من السيتوبلازم** كقالب لصنع DNA.','**ترانسكريبتيز العكسي** (من فيروسات RNA) يستخدم mRNA المفرد ونيوكليوتيدات DNA الحرة (**dNTPs**) وبادئة DNA لبناء **شريط DNA مفرد**.','يُزال قالب mRNA بالهضم الإنزيمي، ثم يبني **DNA بوليميريز** الشريط المكمل → **cDNA مزدوج**، وتُضاف **نهايات لاصقة** لإدخاله في ناقل.'], vis:{kind:'steps', steps:[{icon:'1️⃣',t:'إضافة بادئة DNA و dNTPs إلى mRNA وحضنها مع ترانسكريبتيز العكسي'},{icon:'2️⃣',t:'بناء شريط cDNA مفرد بواسطة ترانسكريبتيز العكسي'},{icon:'3️⃣',t:'إزالة قالب mRNA بهضمه إنزيميًا'},{icon:'4️⃣',t:'إضافة DNA بوليميريز و dNTPs لبناء الشريط الثاني'},{icon:'5️⃣',t:'إضافة نهايات لاصقة لإدخال cDNA في ناقل'}]}, cap:'الشكل ٢-٣: النسخ العكسي؛ dNTPs هي dATP و dTTP و dGTP و dCTP', q:{t:'mcq', q:'ما الفرق بين rDNA و cDNA؟', opts:['rDNA يُصنع من mRNA، أما cDNA فيربط DNA من كائنين','rDNA يربط DNA من كائنين حيين، أما cDNA فيُصنع من mRNA بالنسخ العكسي','كلاهما الشيء نفسه','cDNA شريط مفرد دائمًا، أما rDNA فحلقي دائمًا'], a:1, why:'rDNA = DNA معاد التركيب من مصدرين؛ cDNA = DNA مكمل مُصنَّع من mRNA بترانسكريبتيز العكسي ثم DNA بوليميريز.'}},
        {title:'بناء DNA اصطناعيًا', tag:'أداة ٣', text:['يمكن بناء الجينات وحتى **الجينومات** الكاملة مباشرة من نيوكليوتيدات DNA باستخدام معرفة **الشيفرة الجينية**.','تصنع أجهزة بناء DNA أجزاء قصيرة اعتمادًا على تتابع محفوظ في **الحاسوب**، مشتق من تتابع **الأحماض الأمينية** المطلوب.','تُربط القطع القصيرة لتكوين تتابع طويل يُدخل في **البلازميدات**.','استُخدمت لتكوين جينات جديدة في **اللقاحات**، ولتكوين جينوم بكتيريا صناعية بنحو **مليون زوج من القواعد**.','**الجينوم**: المجموعة الكاملة من الجينات في الخلية (في حقيقيات النواة: النواة والميتوكندريا، وفي النباتات البلاستيدات الخضراء أيضًا).'], vis:{kind:'flow', steps:[{icon:'🧫',t:'تتابع الأحماض الأمينية للبروتين'},{icon:'🖥️',t:'تتابع نيوكليوتيدات في الحاسوب'},{icon:'🏭',t:'جهاز بناء DNA يصنع قطعًا قصيرة'},{icon:'🔗',t:'ربط القطع في تتابع طويل'},{icon:'⭕',t:'إدخاله في بلازميد'}]}},
        {title:'البلازميدات: نواقل من البكتيريا', tag:'أداة ٤', text:['**البلازميد**: قطعة **حلقية صغيرة** من DNA مزدوج توجد طبيعيًا في البكتيريا، وتحمل غالبًا **جينات مقاومة للمضادات الحيوية**، ويمكن تبادلها بين البكتيريا.','مثال: **pBR322** المستخدم في إنتاج الإنسولين يحمل جين مقاومة **الأمبيسيلين** وجين مقاومة **التتراسيكلين** و**منشأ التضاعف**.','تُستخلص البلازميدات بمعالجة البكتيريا بإنزيمات تفكّك جدرها، ثم **الطرد المركزي** لفصلها.','يُفتح البلازميد الحلقي بإنزيم القطع **نفسه** الذي قُطع به الجين، لتكون النهايات اللاصقة **متكاملة**.'], vis:{kind:'cards', items:[{icon:'⭕',title:'حلقي صغير',text:'DNA مزدوج منفصل عن الكروموسوم'},{icon:'💊',title:'جينات مقاومة',text:'أمبيسيلين وتتراسيكلين في pBR322'},{icon:'🔁',title:'منشأ التضاعف',text:'يسمح بنسخ البلازميد داخل البكتيريا'},{icon:'✂️',title:'مواقع قطع',text:'لـ EcoRI و BamHI و HindIII'}]}, note:'💡 يمكن تعديل البلازميدات البكتيرية لإنتاج نواقل أفضل، ويمكن أيضًا إنتاج بلازميدات اصطناعيًا.'},
        {title:'اللصق: DNA لايجيز والبلازميد معاد التركيب', tag:'أداة ٥', text:['تُمزج البلازميدات المفتوحة وقطع DNA الحاملة للجين؛ فترتبط بعض النهايات اللاصقة **بروابط هيدروجينية** (ازدواج القواعد المكملة).','**DNA لايجيز** يربط العمود الفقري سكر-فوسفات بتحفيز تكوين **روابط فوسفات ثنائية الإستر** → **بلازميد معاد التركيب**.','كثير من البلازميدات يعود إلى وضعه الحلقي **دون** دمج الجين، وقد تنتج بلازميدات مختلفة حسب مواقع القطع.','إذا استُخدم إنزيم يعطي نهايات **مستقيمة**، تُضاف نهايات لاصقة إلى الجين والبلازميد.'], vis:{kind:'flow', steps:[{icon:'✂️',t:'قطع الجين والبلازميد بـ BamHI'},{icon:'🧲',t:'ازدواج النهايات اللاصقة المكملة'},{icon:'🧷',t:'DNA لايجيز يكوّن روابط فوسفات ثنائية الإستر'},{icon:'⭕',t:'بلازميد معاد التركيب'}]}, cap:'الشكل ٤-٣: إدخال جين إنسان في البلازميد البكتيري pBR322', q:{t:'mcq', q:'أي نوع من الروابط يكوّنها DNA لايجيز؟', opts:['روابط هيدروجينية بين القواعد','روابط فوسفات ثنائية الإستر في العمود الفقري','روابط ببتيدية','روابط جلايكوسيدية'], a:1, why:'اللايجيز يُغلق العمود الفقري سكر-فوسفات بروابط تساهمية فوسفات ثنائية الإستر؛ أما النهايات اللاصقة فترتبط أولًا بروابط هيدروجينية.'}},
        {title:'إدخال البلازميدات في البكتيريا (التعديل)', tag:'خطوة', text:['توضع البكتيريا والبلازميدات في محلول عالي التركيز من **أيونات الكالسيوم**، ثم يُبرَّد المزيج ويُعرَّض لـ **صدمة حرارية**؛ فيزيد احتمال عبور البلازميدات غشاء البكتيريا.','نسبة قليلة (**نحو 1%**) تمتص البلازميدات معادة التركيب، فيقال إنها **عُدِّلت (Transformed)**.','ينسخ **DNA بوليميريز** البكتيري البلازميدات، وتنقسم البكتيريا بالانشطار الثنائي → **الاستنساخ الجيني**: نسخ كثيرة من البلازميد معاد التركيب.','تنسخ البكتيريا الجين الجديد إلى mRNA وتترجمه إلى **بروتين معاد التركيب**.'], vis:{kind:'steps', steps:[{icon:'🧪',t:'محلول غني بأيونات الكالسيوم'},{icon:'🧊',t:'تبريد المزيج'},{icon:'🔥',t:'صدمة حرارية'},{icon:'🦠',t:'نحو 1% من البكتيريا تمتص البلازميد → عُدِّلت'},{icon:'➗',t:'انشطار ثنائي → استنساخ جيني'}]}},
        {title:'العلامات الجينية: كيف نعرف البكتيريا المعدّلة؟', tag:'أداة ٦', text:['كانت البكتيريا تُنشر على **صفائح آجار** تحوي مضادًا حيويًا؛ فتنمو فقط التي تحمل **جين المقاومة** على البلازميد.','تراجع هذا الأسلوب لتقليل خطر **البكتيريا المقاومة للمضادات الحيوية**، واستُبدل بجينات تشفّر لمواد **متوهجة**.','**GFP** (البروتين المتوهج الأخضر) من **قنديل البحر**: يتوهج أخضر تحت **الضوء فوق البنفسجي**؛ البكتيريا المتوهجة هي المعدّلة.','**GUS** (بيتا جلوكورونيديز) من الأشريكية القولونية: يحوّل مادة عديمة اللون إلى ناتج **ملوّن** (أزرق داكن)؛ مفيد في النباتات مثل **نبات الندية**.'], vis:{kind:'compare', cols:[{icon:'🟢',title:'GFP',items:['بروتين متوهج أخضر','مصدره قنديل البحر','يُكشف بالضوء فوق البنفسجي','يُستخدم في بكتيريا وفئران وغيرها']},{icon:'🔵',title:'GUS',items:['إنزيم بيتا جلوكورونيديز','مصدره الأشريكية القولونية','يحوّل مادة عديمة اللون إلى ملوّنة','يكشف نشاط الجينات في النباتات']}]}, q:{t:'mcq', q:'هل كل البكتيريا المتوهجة بـ GFP قد امتصت الجين المطلوب حتمًا؟', opts:['نعم، لأن التوهج يثبت وجود الجين المطلوب','لا، فقد تمتص بلازميدًا أُغلق دون دمج الجين المطلوب لكنه يحمل جين GFP','نعم، لأن GFP لا يُعبَّر إلا مع الجين المطلوب','لا، لأن GFP لا يدخل البكتيريا'], a:1, why:'التوهج يثبت امتصاص البلازميد الحامل لجين GFP، لكن بعض البلازميدات تعود حلقية مغلقة دون الجين المطلوب.'}},
        {title:'المحفّز: مفتاح تشغيل الجين', tag:'أداة ٧', text:['**المحفّز (Promoter)**: منطقة في DNA يرتبط بها **RNA بوليميريز** عند بداية النسخ، وفيها **نقطة بدء النسخ**.','البكتيريا لا تشغّل كل جيناتها معًا؛ فلكي يُعبَّر عن الجين المنقول يجب إدخال **محفّز مناسب** معه.','عند أول إنتاج للإنسولين أُدخل جين الإنسولين بجوار جين **بيتا جالكتوسيديز** فتشاركا محفّز **أوبرون اللاكتوز**؛ فتصنع البكتيريا الإنسولين عندما تنمو في وسط به **لاكتوز** دون جلوكوز.','المحفّز يسمح لـ RNA بوليميريز بالارتباط ويحدّد **الشريط القالب**، ويضمن مستوى **عاليًا** من التعبير.','في حقيقيات النواة تحوي المحفّزات مواقع ارتباط **عوامل النسخ**.'], vis:'lac_operon', cap:'أوبرون اللاكتوز: المحفّز موقع ارتباط RNA بوليميريز؛ تشغيل الجين يعتمد على وجود اللاكتوز', note:'💡 لماذا لا يكفي نقل الجين وحده؟ لأن الكائن لن ينسخ الجين ويعبّر عنه إلا إذا وُجد موقع ارتباط لـ RNA بوليميريز.'},
        {title:'خلاصة الدرس', tag:'خلاصة', text:['**إنزيمات القطع**: تقطع DNA في مواقع محددة → نهايات لاصقة أو مستقيمة.','**ترانسكريبتيز العكسي**: mRNA → cDNA (خالٍ من الإنترونات)؛ **DNA بوليميريز** يبني الشريط الثاني.','**البلازميد** ناقل حلقي؛ **DNA لايجيز** يربطه بالجين → بلازميد معاد التركيب → تعديل البكتيريا (Ca²⁺ وصدمة حرارية).','**العلامات الجينية** (GFP، GUS) تحدّد الخلايا المعدّلة؛ **المحفّز** ضروري للتعبير عن الجين.'], vis:{kind:'table', head:['الأداة','الدور'], rows:[['إنزيم القطع إندونيوكلييز','قطع DNA في موقع قطع محدد'],['DNA لايجيز','ربط العمود الفقري سكر-فوسفات (روابط فوسفات ثنائية الإستر)'],['ترانسكريبتيز العكسي','بناء DNA مفرد من قالب mRNA'],['DNA بوليميريز','بناء الشريط المكمل ونسخ البلازميدات'],['البلازميد','ناقل يدخل الجين إلى البكتيريا'],['المحفّز','موقع ارتباط RNA بوليميريز لبدء النسخ'],['GFP / GUS','علامات لتحديد الخلايا المعدّلة']]}}

          {q:'الدور الرئيسي لإنزيم DNA بوليميريز في تكوين cDNA هو...', opts:['قطع mRNA','بناء الشريط الثاني المكمل لشريط DNA المفرد','ربط cDNA بالبلازميد','إزالة الإنترونات'], a:1, why:'بعد أن يبني ترانسكريبتيز العكسي شريط DNA مفردًا، يبني DNA بوليميريز الشريط المكمل ليصبح cDNA مزدوجًا.'},
          {q:'ما ميزة استخدام البلازميدات كنواقل؟', opts:['كبيرة جدًا فتحمل كروموسومات كاملة','صغيرة حلقية، تُقطع بإنزيمات القطع، تحمل محفّزات وعلامات جينية، وتتضاعف داخل البكتيريا','لا تحوي أي جينات','تدخل الخلايا الحيوانية فقط'], a:1, why:'البلازميدات سهلة الاستخلاص والقطع، ولها منشأ تضاعف وعلامات مثل جينات المقاومة.'},
          {q:'رُبطت النهايات اللاصقة للجين والبلازميد بروابط هيدروجينية. ما الخطوة اللازمة بعد ذلك لتكوين بلازميد معاد التركيب مستقر؟', opts:['إضافة ترانسكريبتيز العكسي','معالجة بـ DNA لايجيز لربط العمود الفقري','تسخين المزيج إلى 95°C','إضافة إنزيم قطع آخر'], a:1, why:'الروابط الهيدروجينية وحدها ضعيفة؛ اللايجيز يُغلق العمود الفقري بروابط فوسفات ثنائية الإستر.'},
          {q:'نُشرت بكتيريا على آجار يحوي تتراسيكلين بعد خلطها ببلازميدات pBR322. ماذا يعني نمو مستعمرة؟', opts:['البكتيريا لم تمتص أي بلازميد','البكتيريا امتصت بلازميدًا يحمل جين مقاومة التتراسيكلين','البكتيريا ماتت','التتراسيكلين تحوّل إلى لون أزرق'], a:1, why:'فقط البكتيريا الحاملة لجين المقاومة على البلازميد تنمو في وجود المضاد الحيوي.'},
          {q:'لماذا تراجع استخدام جينات مقاومة المضادات الحيوية كعلامات؟', opts:['لأنها لا تعمل في البكتيريا','لتقليل خطر انتشار البكتيريا المقاومة للمضادات الحيوية','لأنها تتوهج بشدة','لأنها تقتل البلازميد'], a:1, why:'استُبدلت بجينات المواد المتوهجة مثل GFP لتقليل خطر البكتيريا المقاومة.'},
          {q:'أُدخل جين إنسولين بجوار جين بيتا جالكتوسيديز في بكتيريا. متى تصنع البكتيريا الإنسولين؟', opts:['عند وجود جلوكوز فقط','عند وجود لاكتوز وعدم توافر جلوكوز','في كل الظروف','عند تعرّضها للضوء فوق البنفسجي'], a:1, why:'الجينان يتشاركان محفّز أوبرون اللاكتوز الذي يعمل عندما تحتاج البكتيريا إلى أيض اللاكتوز.'},
          {q:'ورقة من نبات الندية المعدّل جينيًا تحوّلت إلى اللون الأزرق الداكن عند وضعها في محلول مادة عديمة اللون. ما الذي يشير إليه ذلك؟', opts:['النبات مصاب بفيروس','جين GUS أُدخل وعُبِّر عنه بنجاح','النبات يفتقر إلى الكلوروفيل','الجين المنقول لم يعمل'], a:1, why:'إنزيم GUS المنتج من الجين المنقول حوّل المادة إلى ناتج أزرق، ما يؤكد نجاح التعديل الجيني.'}

        reflect:['لماذا تُعدّ الإنزيمات «الأدوات» الحقيقية في الهندسة الجينية؟ اربط ذلك بخصوصية الإنزيم لركيزته.','لو أُعطيت بلازميدًا وجينًا قُطعا بإنزيمين مختلفين، ما المشكلة التي ستواجهها؟ وكيف تحلّها؟'],
        summary:'**إنزيمات القطع إندونيوكلييز** تقطع DNA في **مواقع قطع** محددة مكوّنة **نهايات لاصقة**، و**DNA لايجيز** يربط القطع بروابط **فوسفات ثنائية الإستر** لتكوين **بلازميد معاد التركيب**. **ترانسكريبتيز العكسي** يصنع **cDNA** من mRNA. تُدخَل البلازميدات في البكتيريا (Ca²⁺ وصدمة حرارية)، وتُحدَّد الخلايا المعدّلة بـ **العلامات الجينية** (GFP، GUS)، ويجب نقل **المحفّز** مع الجين ليُعبَّر عنه.'
      }

    { id:'l3_3', num:'٣-٣', title:'فصل وتضخيم DNA', en:'Separating and amplifying DNA', ws:false,
      preIntro:'من جزيء DNA واحد إلى مليارات النسخ في ساعات! استرجع ما تعرفه عن تضاعف DNA وشحنة جزيئه، لتفهم تفاعل البوليميريز المتسلسل والفصل الكهربائي الهلامي.',
      pre:[
        {t:'tf', q:'في تضاعف DNA، يفكّ إنزيم هيليكيز اللولب المزدوج بكسر الروابط الهيدروجينية بين القواعد.', a:true, why:'الهيليكيز يكسر الروابط الهيدروجينية ليفصل الشريطين؛ في PCR تُكسر هذه الروابط بالحرارة بدلًا من الإنزيم.'},
        {t:'mcq', q:'أي مجموعة في النيوكليوتيد تجعل جزيء DNA سالب الشحنة؟', opts:['القاعدة النيتروجينية','سكر الديوكسي رايبوز','مجموعة الفوسفات','الرابطة الهيدروجينية'], a:2, why:'مجموعات الفوسفات في العمود الفقري سالبة الشحنة، لذا يتحرك DNA نحو القطب الموجب في المجال الكهربائي.'},
        {t:'visual', vis:'replication', q:'ماذا يحتاج DNA بوليميريز ليبدأ بناء شريط جديد؟', opts:['قالب DNA مفرد وبادئة ونيوكليوتيدات حرة','شريط RNA مزدوج فقط','رايبوسومًا وأحماضًا أمينية','إنزيم القطع واللايجيز'], a:0, why:'DNA بوليميريز لا يبدأ من الصفر؛ يحتاج بادئة مرتبطة بقالب مفرد ونيوكليوتيدات حرة (dNTPs).'},
        {t:'mcq', q:'إذا تضاعف جزيء DNA واحد 3 مرات متتالية، كم جزيئًا ينتج؟', opts:['3','6','8','9'], a:2, why:'كل دورة تضاعف العدد: 1 → 2 → 4 → 8، أي 2³ = 8.'},
        {t:'cloud', q:'اختر ما تتوقّع أنه يؤثر في حركة قطع DNA عبر الهلام في مجال كهربائي:', words:[{w:'طول القطعة',ok:true},{w:'الشحنة السالبة',ok:true},{w:'فرق الجهد',ok:true},{w:'لون الصبغة',ok:false},{w:'تركيز الهلام',ok:true},{w:'عدد الرايبوسومات',ok:false},{w:'نوع الأحماض الأمينية',ok:false},{w:'الزمن',ok:true}], why:'تعتمد المسافة على طول القطعة وشحنتها وفرق الجهد وتركيز الهلام وزمن التشغيل.'},
        {t:'open', q:'تُرك في مسرح جريمة أثر دم مجهري يحوي بضع خلايا فقط. توقّع كيف يمكن للمحقّقين الحصول على DNA كافٍ منه للمقارنة مع المشتبه بهم.'}
      ],
      slides:[
        {title:'من جزيء واحد إلى مليارات النسخ', tag:'تمهيد', text:['هل يمكن تحليل DNA من قطرة دم مجهرية أو من عينة شعاب مرجانية؟ نعم، بفضل **تفاعل البوليميريز المتسلسل (PCR)**.','ثم كيف نرى قطع DNA ونقارن أطوالها؟ بـ **الفصل الكهربائي الهلامي**.','أهداف الدرس: وصف مراحل PCR ودور **Taq بوليميريز**، وشرح كيفية فصل قطع DNA مختلفة الطول.'], note:'💡 الصورة ٥-٣ في الكتاب: باحثة عُمانية من المديرية العامة للبحوث الزراعية والحيوانية تُحمّل جهاز PCR (مدوّر حراري) لتضخيم عينات DNA.', vis:{kind:'cards', items:[{icon:'📈',title:'PCR',text:'تضخيم قطعة DNA محددة إلى مليارات النسخ'},{icon:'🧫',title:'الفصل الكهربائي',text:'فصل قطع DNA حسب طولها في هلام'},{icon:'🔍',title:'الطب الشرعي',text:'بصمة وراثية من عينات مجهرية'},{icon:'🇴🇲',title:'في عُمان',text:'أبحاث زراعية وحيوانية تعتمد PCR'}]}},
        {title:'ماذا نضع في أنبوبة PCR؟', tag:'PCR', text:['**عينة DNA**: الجزء المراد تضخيمه (ولو كان جزيئًا واحدًا).','**بادئتان** (Primers): جزآن قصيران مختلفان من DNA مفرد (نحو **20 زوجًا من القواعد**) يرتبط أحدهما بالشريط «صعودًا» والآخر «نزولًا».','**dNTPs**: ديوكسي نيوكليوتيدات ثلاثية الفوسفات (dATP، dTTP، dGTP، dCTP) وحدات بناء الأشرطة الجديدة.','**محلول منظّم** عند pH 7–8، و**DNA بوليميريز مستقر حراريًا**.','الأنابيب صغيرة (نحو **0.05 mL**) رقيقة الجدر، فتتغيّر حرارتها بسرعة في **المدوّر الحراري**.'], vis:{kind:'cards', items:[{icon:'🧬',title:'عينة DNA',text:'القطعة المستهدفة بين البادئتين'},{icon:'🔖',title:'بادئتان',text:'DNA مفرد ~20 قاعدة، تتابعان مختلفان'},{icon:'🧱',title:'dNTPs',text:'dATP، dTTP، dGTP، dCTP'},{icon:'⚖️',title:'محلول منظّم',text:'pH ثابت 7–8'},{icon:'🔥',title:'Taq بوليميريز',text:'DNA بوليميريز مستقر حراريًا'}]}, q:{t:'mcq', q:'لماذا يحتاج PCR إلى بادئتَين مختلفتَين لا بادئة واحدة؟', opts:['لأن الشريطَين مختلفان في التتابع ويجب أن ترتبط بادئة بكل شريط على جانبَي القطعة المستهدفة','لزيادة سرعة التفاعل فقط','لأن البادئة الواحدة تتحطم بالحرارة','لكي ترتبط البادئتان معًا'], a:0, why:'كل بادئة مكملة لتتابع على أحد الشريطَين عند أحد طرفَي القطعة؛ ولا يجب أن تكون البادئتان مكملتَين لبعضهما كي لا تلتصقا معًا.'}},
        {title:'المرحلة الأولى: التمسخ (Denaturation)', tag:'PCR', text:['يُسخَّن DNA إلى نحو **95°C**.','تُكسر **الروابط الهيدروجينية** بين أزواج القواعد فينفصل الشريطان.','تبقى القواعد **مكشوفة** (غير مزدوجة) جاهزة لارتباط البادئات.','في تضاعف الخلية يقوم الهيليكيز بهذا الدور؛ في PCR تقوم **الحرارة** به.'], vis:'pcr', cap:'الشكل ٦-٣: المراحل الثلاث في دورة واحدة من PCR؛ المنطقة الوحيدة المضخَّمة هي التي بين البادئتَين'},
        {title:'المرحلتان الثانية والثالثة: الالتصاق والإطالة', tag:'PCR', text:['**الالتصاق (Annealing)** عند نحو **60°C**: ترتبط البادئتان بروابط هيدروجينية مع التتابع المكمل على جانبَي القطعة المستهدفة.','لا يمكن لـ DNA بوليميريز أن يبدأ **دون بادئة** مرتبطة بقالب.','**الإطالة (Extension)** عند نحو **72°C**: يستخدم **Taq بوليميريز** الـ dNTPs لبناء أشرطة مكملة مقابل الأشرطة المكشوفة.','نهاية الدورة الأولى: **جزيئان** من DNA؛ يُسخَّن المزيج مجددًا لتبدأ الدورة الثانية → **أربعة** جزيئات.'], vis:{kind:'steps', steps:[{icon:'🔥',t:'95°C — التمسخ: كسر الروابط الهيدروجينية وفصل الشريطين'},{icon:'❄️',t:'~60°C — الالتصاق: ارتباط البادئتَين بالتتابع المكمل'},{icon:'🔧',t:'72°C — الإطالة: Taq بوليميريز يبني الشريط المكمل من dNTPs'},{icon:'🔁',t:'إعادة التسخين → دورة جديدة'}]}, q:{t:'mcq', q:'ما دور البادئة في PCR؟', opts:['تقطع DNA في موقع محدد','توفّر نقطة بداية بطرف 3′ حر يبدأ منه DNA بوليميريز البناء','تفصل شريطي DNA','تلوّن DNA لرؤيته'], a:1, why:'DNA بوليميريز لا يبدأ إلا بوجود بادئة مرتبطة؛ كما تحدّد البادئتان القطعة التي ستُضخَّم.'}},
        {title:'Taq بوليميريز: إنزيم من الينابيع الحارة', tag:'إنزيم', text:['**Taq بوليميريز** أول DNA بوليميريز **مستقر حراريًا** استُخدم في PCR؛ استُخلص من البكتيريا المحبة للحرارة **Thermus aquaticus** في ينابيع **منتزه يلوستون** الحارة.','السبب الأول: **لا يتحطم** عند 95°C في مرحلة التمسخ، فلا نحتاج إلى إضافة إنزيم جديد في كل دورة.','السبب الثاني: درجة حرارته **المثلى عالية** (72°C)، فلا تنخفض حرارة الإطالة إلى ما دون حرارة الالتصاق، ما يزيد **الكفاءة** والدقة.','تتوافر الآن إنزيمات DNA بوليميريز مستقرة حراريًا أخرى.'], vis:{kind:'compare', cols:[{icon:'🧑‍🔬',title:'DNA بوليميريز عادي',items:['يتمسّخ عند 95°C','يجب إضافته في كل دورة','حرارته المثلى منخفضة','كفاءة أقل']},{icon:'♨️',title:'Taq بوليميريز',items:['مستقر حراريًا','يُضاف مرة واحدة','حرارة مثلى ~72°C','دورات آلية متتابعة']}]}},
        {title:'تضاعف أسّي: 2ⁿ', tag:'حساب', text:['كل دورة **تضاعف** عدد الجزيئات: 1 → 2 → 4 → 8 ...','بعد **n** دورة يكون العدد **2ⁿ**: بعد 8 دورات = 256 جزيئًا، وبعد 30 دورة ≈ **مليار** نسخة (2³⁰).','من جزيء DNA واحد نحصل على مليارات النسخ المتماثلة في **ساعات قليلة**.','تطبيق: تضخيم DNA من عينات نسيجية مجهرية في **الطب الشرعي**، وتحليل التنوع الجيني في **الشعاب المرجانية**.'], vis:{kind:'bars', items:[{t:'0',v:1,label:'1'},{t:'1',v:2,label:'2'},{t:'2',v:4,label:'4'},{t:'3',v:8,label:'8'},{t:'4',v:16,label:'16'},{t:'5',v:32,label:'32'},{t:'6',v:64,label:'64'}], cap:'عدد جزيئات DNA بعد كل دورة PCR (2ⁿ) — بعد 30 دورة ≈ مليار'}, q:{t:'mcq', q:'ما عدد جزيئات DNA المزدوج بعد 8 دورات من PCR بدءًا من جزيء واحد؟', opts:['16','64','128','256'], a:3, why:'2⁸ = 256.'}},
        {title:'لماذا لا يُضخَّم RNA بـ PCR مباشرة؟', tag:'تفكير', text:['DNA بوليميريز يبني DNA على **قالب DNA** فقط ولا يقرأ RNA.','لتضخيم جزيئات RNA يجب أولًا تحويلها إلى **cDNA** بإنزيم **ترانسكريبتيز العكسي**، ثم تضخيم cDNA بـ PCR.','كما أن RNA شريط مفرد، ولا يُفصل بالتسخين كما يحدث لـ DNA المزدوج.'], vis:{kind:'flow', steps:[{icon:'🧵',t:'RNA'},{icon:'🔄',t:'ترانسكريبتيز العكسي'},{icon:'🧬',t:'cDNA'},{icon:'📈',t:'PCR'},{icon:'💯',t:'ملايين النسخ'}]}},
        {title:'الفصل الكهربائي الهلامي: المبدأ', tag:'فصل', text:['تقنية لفصل الجزيئات **المشحونة** (مثل DNA) بحركتها المتفاوتة عبر **هلام** في **مجال كهربائي**.','**الشحنة**: مجموعة الفوسفات **سالبة**، فتتحرك قطع DNA نحو **القطب الموجب (+)**.','**الحجم**: القطع **الأصغر/الأقصر** تتحرك عبر مسام الهلام **أسرع**؛ المسافة تتناسب **عكسيًا** مع طول القطعة.','تُقارَن القطع مع **سُلّم DNA** (عينة مرجعية بأطوال معروفة) لتحديد أطوالها.'], vis:'gel_electrophoresis', cap:'الشكل ٧-٣: خزان الفصل الكهربائي؛ الآبار عند القطب السالب، والقطع تتحرك نحو الموجب', q:{t:'mcq', q:'أي قطعة DNA تقطع أطول مسافة في الهلام؟', opts:['قطعة 1200 زوج قاعدة','قطعة 800 زوج قاعدة','قطعة 400 زوج قاعدة','كلها تقطع المسافة نفسها'], a:2, why:'الأقصر أسرع؛ المسافة تتناسب عكسيًا مع الطول.'}},
        {title:'خطوات الفصل الكهربائي', tag:'خطوات', text:['١. تحضير هلام (**أجاروس**) وصبّ **محلول منظّم** يغطيه لثبات pH.','٢. نقل عينات DNA بـ **ماصة دقيقة** إلى **الآبار**، مع **صبغة تتبُّع**.','٣. وضع **سُلّم DNA** في بئر على جانب الهلام.','٤. توصيل الأقطاب: **القطب السالب** عند طرف الآبار.','٥. صبغة التتبّع تُظهر مسافة الحركة؛ ٦. صبغ الهلام لكشف **الحزم** ومقارنتها بالسُلّم.'], vis:{kind:'steps', steps:[{icon:'🧊',t:'هلام أجاروس + محلول منظّم'},{icon:'💧',t:'تحميل العينات مع صبغة تتبُّع بماصة دقيقة'},{icon:'📏',t:'سُلّم DNA في بئر جانبي'},{icon:'🔋',t:'توصيل الأقطاب: السالب عند الآبار'},{icon:'👀',t:'متابعة صبغة التتبّع'},{icon:'🎨',t:'صبغ الهلام وقراءة الحزم مقابل السُلّم'}]}},
        {title:'قراءة الهلام: مثال هنتنغتون', tag:'تطبيق', text:['الشكل ٨-٣: نواتج PCR لخمسة أشخاص بقطع بين **400 و 800** زوج قاعدة؛ العمود 4 **أغمق** لأن الشخص **متماثل الأليلات** فكمية DNA في الحزمة **مضاعفة**.','اكتشفت **نانسي ويكسلر** موقع جين **هنتنغتون** بدراسة نسل ماري سوتو حول بحيرة **ماراكايبو** في فنزويلا.','يُضخَّم جين **HTT** بـ PCR ثم يُفصل كهربائيًا لتحديد أطوال **الأليلَين**: الفرد D له **حزمة واحدة** (أليلان متماثلان في الطول) وبقية الأفراد **حزمتان**.','الأليل المسبب للمرض **أطول** (تكرارات CAG أكثر) فيتحرك مسافة أقصر؛ تُستخدم النتائج في **الاستشارة الوراثية**.'], vis:{kind:'table', head:['الملاحظة في الهلام','التفسير'], rows:[['حزمة واحدة','أليلان متماثلان في الطول (متماثل الأليلات)'],['حزمتان','أليلان مختلفان في الطول (غير متماثل الأليلات)'],['حزمة أغمق','كمية DNA مضاعفة (أليلان بالطول نفسه)'],['حزمة قريبة من البئر','قطعة أطول تحركت مسافة أقصر'],['حزمة بعيدة عن البئر','قطعة أقصر تحركت مسافة أطول']]}, note:'💡 هنتنغتون مرض سائد يظهر متأخرًا (الأعمار بين قوسين في الشكل ٩-٣ هي سن ظهور الأعراض).'},
        {title:'خلاصة الدرس', tag:'خلاصة', text:['**PCR**: تمسخ (95°C) → التصاق البادئات (~60°C) → إطالة بـ **Taq بوليميريز** (72°C)؛ تضاعف **2ⁿ**.','Taq من **Thermus aquaticus**: مستقر حراريًا وحرارته المثلى عالية.','**الفصل الكهربائي الهلامي**: DNA سالب → نحو القطب الموجب؛ **الأقصر أسرع**؛ مقارنة مع **سُلّم DNA**.','PCR + الفصل الكهربائي = أدوات **الطب الشرعي** و**الفحص الجيني**.'], vis:{kind:'cycle', center:'🔁', steps:[{icon:'🔥',t:'تمسخ 95°C'},{icon:'❄️',t:'التصاق ~60°C'},{icon:'🔧',t:'إطالة 72°C'}]}}

      post:{ intro:'اختبر فهمك لتفاعل البوليميريز المتسلسل والفصل الكهربائي الهلامي.',

          {q:'الترتيب الصحيح لمراحل دورة PCR هو...', opts:['الالتصاق → التمسخ → الإطالة','التمسخ → الالتصاق → الإطالة','الإطالة → الالتصاق → التمسخ','التمسخ → الإطالة → الالتصاق'], a:1, why:'فصل الشريطين أولًا، ثم ارتباط البادئات، ثم البناء.'},
          {q:'الإنزيم الذي يبني DNA أثناء PCR هو...', opts:['DNA لايجيز','ترانسكريبتيز العكسي','Taq بوليميريز','إنزيم القطع'], a:2, why:'Taq بوليميريز هو DNA بوليميريز مستقر حراريًا.'},
          {q:'لماذا يجب أن تكون درجة حرارة المرحلة الأولى مرتفعة؟', opts:['لتنشيط البادئات','لكسر الروابط الهيدروجينية وفصل الشريطين','لتحطيم الإنزيم','لتثبيت pH'], a:1, why:'الروابط الهيدروجينية الكثيرة تحتاج إلى حرارة عالية (95°C) لتنكسر.'},
          {q:'اقترح سبب كون المرحلة الأولى من الدورة الأولى أطول من المراحل الأولى اللاحقة.', opts:['لأن Taq يحتاج وقتًا للتنشيط','لأن DNA الأصلي طويل ومزدوج بالكامل ويحتاج وقتًا أطول لفصل شريطيه، أما نواتج الدورات فقصيرة','لأن البادئات لم تُضف بعد','لأن الأنبوبة باردة'], a:1, why:'جزيء DNA الجينومي الأصلي طويل وروابطه الهيدروجينية كثيرة، بينما النواتج قطع قصيرة تُفصل بسرعة.'},
          {q:'لماذا لا يلائم زوج واحد من البادئات تضخيم جميع عينات DNA؟', opts:['لأن البادئات تتحطم بسرعة','لأن كل بادئة مكملة لتتابع محدد يحيط بالقطعة المستهدفة، وتختلف التتابعات بين الجينات','لأن البادئات غالية','لأن كل عينة تحتاج إنزيمًا مختلفًا'], a:1, why:'تصمَّم البادئات خصيصًا لتتابع القواعد على جانبَي القطعة المطلوبة.'},
          {q:'بأي طريقة يختلف PCR عن تضاعف DNA في دورة الخلية؟', opts:['PCR يحتاج إلى بادئات أما التضاعف فلا','في PCR يُفصل الشريطان بالحرارة بدلًا من الهيليكيز، وتُضخَّم قطعة محددة فقط','التضاعف يحدث خارج الخلية','PCR ينتج RNA'], a:1, why:'في الخلية يفصل الهيليكيز الشريطين ويُنسخ الجينوم كاملًا؛ في PCR الحرارة تفصلهما وتُنسخ فقط المنطقة بين البادئتين.'},
          {q:'في الفصل الكهربائي، قطعتان بطول 200 و 1000 زوج قاعدة. أيهما أقرب إلى الآبار بعد التشغيل؟', opts:['قطعة 200','قطعة 1000','كلتاهما بالمسافة نفسها','تعتمد على اللون'], a:1, why:'الأطول أبطأ فتبقى أقرب إلى البئر.'},

          {q:'أظهر مخطط الفصل الكهربائي لأحد أفراد العائلة حزمتَين إحداهما أطول من الطبيعي (تتحرك مسافة أقصر). ما الاستنتاج الأرجح؟', opts:['الفرد لا يحمل أي أليل','الفرد يحمل أليلًا طافرًا أطول (تكرارات CAG أكثر) وأليلًا طبيعيًا','العينة تالفة','الفرد متماثل الأليلات للأليل الطبيعي'], a:1, why:'أليل هنتنغتون يحوي تكرارات CAG زائدة فيكون أطول ويتحرك أقل؛ وجود حزمتَين يعني غير متماثل الأليلات.'}

        summary:'**PCR** يضخّم قطعة DNA محددة عبر دورات متكررة: **تمسخ** عند 95°C، **التصاق** البادئات عند نحو 60°C، و**إطالة** بـ **Taq بوليميريز** عند 72°C، فيتضاعف العدد **2ⁿ**. **الفصل الكهربائي الهلامي** يفصل قطع DNA السالبة الشحنة نحو **القطب الموجب**، والأقصر يتحرك **أسرع**، وتُقدَّر الأطوال بمقارنتها بـ **سُلّم DNA**.'

        {t:'mcq', q:'ينتج أحد أنواع مرض السكري من...', opts:['زيادة إفراز الجلوكاجون','عدم قدرة البنكرياس على إنتاج الإنسولين','نقص فيتامين C','زيادة الهيموجلوبين'], a:1, why:'في هذا النوع لا تنتج خلايا بيتا الإنسولين، فيحتاج المريض إلى حقن الإنسولين.'},
        {t:'visual', vis:'translation', q:'لكي تنتج خلية بكتيرية بروتينًا بشريًا مثل الإنسولين، ما الذي يجب أن يحدث للجين المنقول داخلها؟', opts:['أن يُنسخ إلى mRNA ثم يُترجم على الرايبوسومات','أن يُقطع بإنزيمات القطع فقط','أن يتحوّل إلى دهون','أن يُخزَّن في النواة'], a:0, why:'التعبير الجيني = نسخ الجين إلى mRNA ثم ترجمته إلى عديد ببتيد.'},
        {t:'mcq', q:'التليف الكيسي مرض وراثي...', opts:['سائد مرتبط بالجنس','متنحٍ ينتج عن أليلَين طافرَين من جين CFTR','ينتج عن كروموسوم إضافي','معدٍ ينتقل بالعدوى'], a:1, why:'يظهر المرض فقط عند تماثل الأليلات لأليل CFTR الطافر المتنحي.'},
        {t:'cloud', q:'اختر ما يرتبط بمجال «التقنية الجينية والطب»:', words:[{w:'إنسولين معاد التركيب',ok:true},{w:'العامل الثامن',ok:true},{w:'الفحص الجيني',ok:true},{w:'الاستشارة الوراثية',ok:true},{w:'أدينوسين دي أمينيز',ok:true},{w:'مبيدات الأعشاب',ok:false},{w:'الأرز الذهبي',ok:false},{w:'ذرة Bt',ok:false},{w:'فحص السائل الأمنيوسي',ok:true},{w:'التركيب الضوئي',ok:false}], why:'التطبيقات الطبية تشمل البروتينات معادة التركيب والفحص الجيني والاستشارة الوراثية؛ أما المحاصيل المعدّلة فمن تطبيقات الزراعة.'},
