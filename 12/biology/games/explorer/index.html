      slides:[
        {title:'من اللمسة إلى الحركة في أجزاء من الثانية', tag:'تمهيد وأهداف', text:['لماذا تسحب يدك من الجمر **قبل** أن تشعر بالألم؟ لأن الرسالة تمر عبر **قوس انعكاس** لا يحتاج إلى تدخل الدماغ.','سنتعرف اليوم على: أنواع **الخلايا العصبية** وتركيبها، **جهد الراحة** و**جهد الفعل**، **فترة الجموح**، **النقل الوثبي**، **المستقبلات**، و**التشابك الكوليني**.','الفكرة الكبرى: الرسالة العصبية **كهربائية** على طول الخلية و**كيميائية** بين الخلايا.'], note:'💡 قصة «السيدة المفصولة عن الجسد»: عندما توقفت الخلايا الحسية في عضلاتها ومفاصلها عن نقل النبضات فقدت الإحساس بجسدها، وهو ما يُسمى استقبال الحس العميق.', vis:'reflex_arc', cap:'قوس الانعكاس: ثلاث خلايا عصبية في سلسلة تنسق استجابة سريعة.'},
        {title:'ثلاثة أنواع من الخلايا العصبية', tag:'الشكل ٢-٥', text:['**الخلايا العصبية الحسية**: تنقل النبضات من **المستقبلات** إلى الجهاز العصبي المركزي؛ جسم الخلية قرب مصدر المنبه أو في **العقدة العصبية** (انتفاخ في العصب الشوكي)، والمحور يمتد طوليًا وجسم الخلية على جانبه.','**الخلايا العصبية الموصلة**: توجد **بالكامل داخل CNS**، وتربط الحسية بالحركية.','**الخلايا العصبية الحركية**: تنقل النبضات من CNS إلى **المستجيبات** (العضلات والغدد)؛ جسم الخلية في الدماغ أو الحبل الشوكي.'], vis:{kind:'compare', cols:[{icon:'👉',title:'حسية',items:['من المستقبل إلى CNS','جسم الخلية قرب المنبه أو في العقدة العصبية','محور طويل على جانبيه جسم الخلية']},{icon:'🔗',title:'موصلة',items:['داخل CNS بالكامل','تربط الحسية بالحركية','تسمح بتكامل المعلومات']},{icon:'💪',title:'حركية',items:['من CNS إلى المستجيب','جسم الخلية في الدماغ أو الحبل الشوكي','شجيرات كثيرة ومحور طويل جدًا']}]}, q:{t:'mcq', q:'أين يقع جسم الخلية العصبية الموصلة؟', opts:['في العقدة العصبية','قرب المستقبل','داخل الجهاز العصبي المركزي','في العضلة'], a:2, why:'الخلايا الموصلة توجد بالكامل داخل الدماغ أو الحبل الشوكي.'}},
        {title:'تركيب الخلية العصبية الحركية', tag:'الشكل ٣-٥', text:['**جسم الخلية**: فيه **النواة** دائمًا، وسيتوبلازم غني بالميتوكوندريا و**شبكة إندوبلازمية خشنة** واسعة (تظهر بقعًا داكنة تحت المجهر الضوئي).','**الشجيرات العصبية**: امتدادات قصيرة كثيرة التفرع توفر **مساحة سطح كبيرة** لتتصل بها نهايات خلايا عصبية أخرى.','**المحور الأسطواني**: امتداد طويل جدًا (قد يزيد على **متر** من الحبل الشوكي إلى إصبع القدم) ينقل النبضات لمسافات طويلة.','**النهايات العصبية**: تحتوي على ميتوكوندريا و**حويصلات** مملوءة بـ**النواقل** لتمرير النبضة إلى خلية مستجيب.'], vis:'neuron', cap:'خلية عصبية حركية مايلينية: من الشجيرات إلى النهايات العصبية.', q:{t:'mcq', q:'ما وظيفة التفرع الكثيف للشجيرات العصبية؟', opts:['تسريع النبضة','زيادة مساحة السطح لتشابكات كثيرة مع خلايا أخرى','تخزين النواقل العصبية','تصنيع المايلين'], a:1, why:'الشجيرات كثيرة التفرع تستقبل نهايات محاور خلايا عصبية عديدة، وهذا أساس التكامل.'}},
        {title:'المايلين وخلايا شوان وعقد رانفييه', tag:'الشكل ٥-٥', text:['**خلية شوان** تلتف **لولبيًا** حول المحور مكوّنة طبقات عديدة من غشاء سطحها: هذا هو **غمد المايلين** (دهون مع بعض البروتينات).','المايلين **عازل**: غني بالدهون المفسفرة، **غير منفذ للماء والأيونات** في السائل النسيجي.','**عقد رانفييه**: فجوات قصيرة جدًا بين خلايا شوان (طولها **2–3 µm**) يكون فيها المحور مكشوفًا، وتتكرر كل **1–3 mm**.','ليست كل المحاور مايلينية: نحو **ثلثَي** الخلايا الحسية والحركية في جسمك **غير مايلينية**.'], vis:{kind:'cards', items:[{icon:'🌀',title:'خلية شوان',text:'تلتف لولبيًا حول المحور فتصنع المايلين'},{icon:'🧈',title:'غمد المايلين',text:'دهون + بروتينات؛ عازل لا تمر عبره الأيونات'},{icon:'⭕',title:'عقدة رانفييه',text:'فجوة 2–3 µm كل 1–3 mm؛ المحور مكشوف هنا'},{icon:'📏',title:'غير مايليني',text:'نحو ثلثَي الخلايا الحسية والحركية بلا مايلين'}]}, note:'💡 في المقطع العرضي للعصب تصطبغ أغلفة المايلين بلون داكن حول المحاور، وتحيط كل مجموعة محاور بغلاف الحزمة العصبية من نسيج ضام بألياف كولاجين.'},
        {title:'قوس الانعكاس: خلايا في سلسلة', tag:'الشكل ٦-٥', text:['**قوس الانعكاس**: المسار الذي تنتقل فيه النبضات من **المستقبل** إلى **المستجيب** من دون تدخل الدماغ.','مستقبلات حسية ← خلية **حسية** ← تشابك ← خلية **موصلة** في الحبل الشوكي ← تشابك ← خلية **حركية** ← **ألياف عضلة هيكلية**.','بعض الأقواس **بلا خلية موصلة**؛ مثال: **نفضة الركبة** التي يستخدمها أخصائيو الصحة لاختبار الجهاز العصبي.','داخل CNS تتفرع امتدادات الخلايا الحسية والموصلة لتتصل بخلايا أخرى، فيحدث **تكامل** للمعلومات وسلوك معقد.'], vis:'reflex_arc', q:{t:'mcq', q:'ما ميزة ترتيب الخلايا العصبية في سلسلة كما في قوس الانعكاس؟', opts:['تصبح النبضة أقوى في كل خلية','التشابكات تسمح بالتكامل وتوجيه الرسالة إلى خلايا أخرى في CNS','تنتقل النبضة في الاتجاهين','لا حاجة إلى نواقل عصبية'], a:1, why:'عند التشابكات يمكن جمع الرسائل من خلايا عديدة وتوزيعها إلى خلايا أخرى، فتُنسَّق أشكال معقدة من السلوك.'}},
        {title:'جهد الراحة: −70 mV', tag:'الشكل ٨-٥', text:['المحور في حالة الراحة يكون **داخله سالبًا** مقارنة بالخارج بمقدار **−60 إلى −70 mV**: هذا **فرق الجهد** المسمى **جهد الراحة**.','**مضخة الصوديوم-البوتاسيوم**: بروتين غشائي يستخدم **ATP** ليخرج **3 Na+** ويدخل **2 K+** عكس منحدر التركيز لكل جزيء ATP.','**بروتينات ومواد عضوية سالبة الشحنة** داخل الخلية، و**قنوات غير مبوبة مفتوحة طوال الوقت** للبوتاسيوم أكثر من الصوديوم فيخرج K+ أكثر.','الغشاء **غير منفذ نسبيًا للأيونات** عبر الطبقة المزدوجة، والقنوات **المبوبة بالفولتية** مغلقة في حالة الراحة.'], vis:'resting_potential', cap:'Na+ مرتفع خارجًا، K+ مرتفع داخلًا، والداخل سالب.', note:'💡 قِيس جهد الراحة أولًا في المحاور العملاقة غير المايلينية للحبار وديدان الأرض لأنها واسعة بما يكفي لغرز قطب كهربائي دقيق داخلها.'},
        {title:'جهد الفعل: من −70 إلى +30 mV', tag:'الشكل ١٠-٥', text:['**إزالة الاستقطاب**: يفتح المنبه قنوات **Na+ المبوبة بالفولتية** فيدخل Na+ مع منحدره الكهروكيميائي؛ يفتح ذلك المزيد من القنوات (**تغذية راجعة إيجابية**).','عند **جهد العتبة** (نحو **−50 mV**، بين −60 و−50) تفتح القنوات بكثرة حتى يصل الداخل إلى **+30 mV**. تحت العتبة **لا يحدث** جهد فعل.','**إعادة الاستقطاب**: بعد نحو **1 ms** تغلق قنوات Na+ وتفتح قنوات **K+ المبوبة بالفولتية** فيخرج K+ ويعود الجهد إلى −70 mV، ثم يصبح **أكثر سالبية** لفترة وجيزة.','تستغرق العملية كلها نحو **3 ms**؛ ثم تعود قنوات Na+ قادرة على الاستجابة، وتستمر المضخة في عملها طوال الوقت.'], vis:'action_potential', q:{t:'mcq', q:'ما الذي يسبب مرحلة إعادة الاستقطاب؟', opts:['دخول Na+ عبر قنواته','خروج K+ عبر قنوات البوتاسيوم المبوبة بالفولتية','توقف مضخة الصوديوم-البوتاسيوم','دخول Ca2+'], a:1, why:'تفتح قنوات K+ المبوبة بالفولتية فينتشر K+ إلى الخارج حاملًا الشحنة الموجبة، فيعود الداخل سالبًا.'}},
        {title:'فترة الجموح وقانون الكل أو العدم', tag:'كيف تُشفَّر المعلومات؟', text:['**فترة الجموح**: فترة تعافٍ بعد جهد الفعل تكون فيها قنوات Na+ **مغلقة بإحكام** فلا يمكن حدوث جهد فعل آخر.','نتائجها: جهود الفعل **أحداث منفصلة**، تنتقل في **اتجاه واحد** فقط، ولها **حد أقصى للتكرار** (نحو **200–300** نبضة/ثانية في كثير من الخلايا).','**قانون الكل أو العدم**: إما جهد فعل كامل بـ**السعة نفسها** (+30 mV) أو لا شيء؛ السعة والسرعة **لا تتغيران** مع قوة المنبه.','**قوة المنبه** تُشفَّر بـ**تكرار** جهود الفعل و**عدد** الخلايا العصبية المنبهة؛ و**طبيعة** المنبه تُحدَّد من موقع الخلية الحسية (شبكية العين ← «ضوء»).'], vis:{kind:'compare', cols:[{icon:'🔆',title:'منبه قوي',items:['تكرار عالٍ لجهود الفعل','خلايا عصبية أكثر تُنبَّه','السعة +30 mV نفسها']},{icon:'🕯️',title:'منبه ضعيف',items:['تكرار أقل لجهود الفعل','خلية أو خليتان فقط','السعة +30 mV نفسها']}]}, note:'💡 فرك العينين المغمضتين يسبب «رؤية» أنماط ضوئية: منبه الضغط ينبّه خلايا الشبكية، فيفسر الدماغ النبضات على أنها ضوء.'},
        {title:'انتقال النبضة وسرعتها', tag:'الشكل ١٢-٥ و١٤-٥', text:['جهد الفعل في نقطة يولّد **دوائر موضعية** (تيارات) تزيل استقطاب الغشاء المجاور حتى العتبة، فيتولد جهد فعل جديد **إلى الأمام** فقط (الخلف في فترة الجموح).','في المحاور **المايلينية** لا تحدث جهود الفعل إلا عند **عقد رانفييه** حيث تتركز القنوات ومضخات Na+/K+، فتقفز النبضة من عقدة إلى أخرى (**1–3 mm**): **النقل الوثبي**.','النقل الوثبي أسرع بما يصل إلى **50 ضعفًا** من محور غير مايليني له القطر نفسه: غير مايليني قد يبلغ **0.5 m/s**، ومايليني حتى **100 m/s**.','**القطر** الأكبر أسرع: مساحة سطح أكبر لانتشار الأيونات؛ اللافقاريات (الحبار، ديدان الأرض) تمتلك محاور **عملاقة** غير مايلينية.'], vis:'impulse_transmission', q:{t:'mcq', q:'لماذا تحدث جهود الفعل عند عقد رانفييه فقط في المحور المايليني؟', opts:['لأن العقد تحتوي على حويصلات النواقل','لأن المايلين عازل لا يسمح بمرور Na+ وK+، والقنوات تتركز في العقد المكشوفة','لأن العقد أوسع قطرًا','لأن المضخات تتوقف في العقد'], a:1, why:'المايلين يمنع حركة الأيونات عبر الغشاء المغطى، فلا إزالة استقطاب إلا في العقد المكشوفة.'}},
        {title:'سرعة الانتقال في محاور مختلفة', tag:'الجدول ٢-٥', text:['محاور **الحبار العملاقة**: قطر 500 µm، غير مايلينية، 25 m/s.','محاور **حركية كبيرة لعضلات رِجل الإنسان**: 20 µm، مايلينية، **120 m/s**.','محاور **مستقبلات الضغط** بالجلد: 10 µm، مايلينية، 50 m/s؛ **مستقبلات الحرارة**: 5 µm، مايلينية، 20 m/s.','محاور **حركية للأعضاء الداخلية**: 1 µm، غير مايلينية، 2 m/s؛ ليست كل الرسائل تحتاج سرعة عالية.'], vis:{kind:'bars', items:[{t:'الحبار (500 µm، بلا مايلين)',v:25,label:'25'},{t:'رِجل الإنسان (20 µm، مايلين)',v:120,label:'120'},{t:'مستقبلات الضغط (10 µm، مايلين)',v:50,label:'50'},{t:'مستقبلات الحرارة (5 µm، مايلين)',v:20,label:'20'},{t:'أعضاء داخلية (1 µm، بلا مايلين)',v:2,label:'2'}], cap:'سرعة الانتقال m/s'}, note:'💡 محور الحبار بقطر 500 µm أبطأ من محور إنسان مايليني بقطر 20 µm: المايلين أهم من القطر!'},
        {title:'المستقبلات: محولات للطاقة', tag:'برعم التذوق', text:['**الخلية المستقبلة** تحوّل طاقة المنبه (ضوء، ضغط، صوت، حرارة، مواد كيميائية) إلى نبضات عصبية: إنها **محول طاقة**. قد تكون خلية متخصصة أو مجرد **نهاية خلية حسية** (بعض مستقبلات اللمس).','برعم التذوق يحتوي **50–100** خلية مستقبلة كيميائية؛ خمسة مذاقات: حلو، حامض، مالح، مر، **أومامي**.','**تذوق الملح**: تنتشر أيونات **Na+** عبر قنوات انتقائية في الخملات الدقيقة ← إزالة استقطاب = **جهد المستقبل** ← إذا بلغ العتبة تفتح قنوات **Ca2+ المبوبة بالفولتية** ← دخول Ca2+ ← **إخراج خلوي** لحويصلات الناقل العصبي من الغشاء القاعدي.','الناقل يحفز **جهد فعل** في الخلية الحسية التي تنقل النبضات إلى **مركز التذوق في القشرة المخية**. الأقوى منبهًا ← جهد مستقبل أكبر ← تكرار أعلى.'], vis:{kind:'steps', steps:[{icon:'🧂',t:'Na+ من الطعام يدخل عبر قنوات انتقائية في الخملات الدقيقة'},{icon:'⚡',t:'إزالة استقطاب الغشاء: جهد المستقبل'},{icon:'🚪',t:'فوق العتبة: تفتح قنوات Ca2+ المبوبة بالفولتية'},{icon:'🫧',t:'Ca2+ يحفز إخراج خلوي لحويصلات الناقل العصبي'},{icon:'🧠',t:'جهد فعل في الخلية الحسية ← مركز التذوق في القشرة المخية'}]}, note:'💡 أمثلة أخرى: العصي والمخاريط في الشبكية (ضوء)، جسيمات باتشيني (ضغط)، الخلايا الشعرية في القوقعة (صوت)، مستقبلات التمدد في العضلات (منبه داخلي).'},
        {title:'التشابك العصبي الكوليني', tag:'الشكل ١٩-٥ و٢٠-٥', text:['**التشابك** = نهاية الخلية **قبل التشابكية** + **الشق التشابكي** (نحو **20 nm**) + غشاء الخلية **بعد التشابكية**. لا تقفز النبضة؛ تُنقل بـ**ناقل عصبي** هو **الأستيل كولين (ACh)** في التشابكات الكولينية.','وصول جهد الفعل ← فتح **قنوات Ca2+ المبوبة بالفولتية** ← دخول Ca2+ ← اندماج حويصلات ACh (حتى **10 000** جزيء في كل حويصلة) بالغشاء قبل التشابكي و**إخراج خلوي**.','ينتشر ACh عبر الشق في أقل من **0.5 ms** ويرتبط بـ**بروتينات مستقبلة** هي **قنوات Na+ مبوبة بالربيطة** فتفتح ← دخول Na+ ← إزالة استقطاب ← إذا بلغت العتبة: جهد فعل.','**الأستيل كولين إستريز** في الشق يحلل ACh مائيًا إلى **أسيتات وكولين**؛ يُعاد الكولين ويتفاعل مع **أستيل مرافق الإنزيم A** لتكوين ACh من جديد. الدورة كلها **5–10 ms**.'], vis:'synapse', q:{t:'mcq', q:'ما دور إنزيم الأستيل كولين إستريز؟', opts:['تصنيع ACh في الحويصلات','فتح قنوات Ca2+','تحليل ACh إلى أسيتات وكولين لمنع إزالة الاستقطاب الدائمة وإعادة التدوير','نقل ACh عبر الشق'], a:2, why:'لو بقي ACh مرتبطًا بالمستقبلات لظلت قنوات Na+ مفتوحة والخلية في إزالة استقطاب دائمة.'}},
        {title:'أدوار التشابكات والوصلة العصبية العضلية', tag:'لماذا التشابكات؟', text:['**اتجاه واحد**: الحويصلات في الخلية قبل التشابكية فقط، والمستقبلات على الغشاء بعد التشابكي فقط.','**التكامل (الجمع)**: تستجيب الخلية بعد التشابكية لجميع النبضات الواصلة؛ إذا كان مجموع إزالة الاستقطاب فوق العتبة تُرسل نبضة. تزيد الفرصة إذا أطلقت خلايا قبل تشابكية عديدة ACh معًا؛ لكل خلية في CNS مئات التشابكات.','**الإجهاد**: التنبيه المتكرر السريع قد يستنفد حويصلات الناقل فيتوقف التشابك مؤقتًا.','**الوصلة العصبية العضلية**: تشابك بين خلية حركية وليف عضلي عند **الصفيحة النهائية الحركية**؛ تعمل بالطريقة نفسها ويتولد جهد فعل في الليف فينقبض. هناك أكثر من **40** ناقلًا (نورأدرينالين، دوبامين، GABA، حمض الجلوتاميك).'], vis:{kind:'cards', items:[{icon:'➡️',title:'اتجاه واحد',text:'حويصلات قبل التشابك، مستقبلات بعده'},{icon:'➕',title:'التكامل',text:'جمع إزالة الاستقطاب من خلايا عديدة حتى العتبة'},{icon:'🪫',title:'الإجهاد',text:'نفاد الحويصلات مع التنبيه المتكرر'},{icon:'💪',title:'الوصلة العصبية العضلية',text:'الصفيحة النهائية الحركية على الليف العضلي'}]}, note:'💡 سموم وأدوية تعمل على التشابك: الكورار ينافس ACh على المستقبل، والإزيرين ينافس ACh على الموقع النشط للإستريز، والنيكوتين ينشط قنوات Na+ المبوبة بالربيطة.'},
        {title:'خلاصة الدرس', tag:'خلاصة', text:['ثلاثة أنواع من الخلايا العصبية (**حسية، موصلة، حركية**) تعمل في **قوس انعكاس**؛ المحور قد يغلفه **المايلين** بعقد **رانفييه**.','**جهد الراحة −70 mV** بمضخة Na+/K+ (3 خارج : 2 داخل) والقنوات غير المبوبة؛ **جهد الفعل**: Na+ يدخل حتى +30 mV ثم K+ يخرج؛ **فترة الجموح** تجعله منفصلًا أحادي الاتجاه محدود التكرار.','**النقل الوثبي** والقطر الأكبر يزيدان السرعة؛ **المستقبلات** محولات طاقة تعمل بقانون **الكل أو العدم**.','**التشابك الكوليني**: Ca2+ ← إخراج ACh ← قنوات مبوبة بالربيطة ← إزالة استقطاب ← **الإستريز** يحلل ACh.'], vis:{kind:'flow', steps:[{icon:'👉',t:'مستقبل: جهد المستقبل'},{icon:'⚡',t:'جهد فعل −70 ← +30 mV'},{icon:'🏃',t:'نقل وثبي عبر عقد رانفييه'},{icon:'🫧',t:'تشابك: Ca2+ و ACh'},{icon:'💪',t:'مستجيب'}]}}
      ],

          {q:'المادة العازلة التي تصنعها خلايا شوان هي:', opts:['الكولاجين','الأستيل كولين','المايلين','الأكتين'], a:2, why:'خلية شوان تلتف حول المحور مكوّنة غمد المايلين.'},
          {q:'ماذا يسمى قفز جهد الفعل من عقدة رانفييه إلى التالية؟', opts:['التغذية الراجعة','النقل الوثبي','إعادة الاستقطاب','الإخراج الخلوي'], a:1, why:'النقل الوثبي يزيد السرعة حتى 50 ضعفًا.'},
          {q:'الأيون الذي يدخل الخلية قبل التشابكية ويحفز إطلاق ACh هو:', opts:['Na+','K+','Ca2+','Mg2+'], a:2, why:'جهد الفعل يفتح قنوات Ca2+ المبوبة بالفولتية فيدخل Ca2+ ويحفز اندماج الحويصلات.'},
          {q:'عرض الشق التشابكي نحو:', opts:['20 nm','20 µm','2 mm','200 µm'], a:0, why:'فجوة صغيرة جدًا عرضها نحو 20 نانومتر.'},

        {id:'g3', type:'order', title:'رتّب أحداث الانتقال عبر التشابك الكوليني', steps:['يصل جهد الفعل إلى غشاء الخلية قبل التشابكية','تفتح قنوات Ca2+ المبوبة بالفولتية ويدخل Ca2+','تندمج حويصلات ACh بالغشاء قبل التشابكي (إخراج خلوي)','ينتشر ACh عبر الشق التشابكي','يرتبط ACh بالمستقبلات فتفتح قنوات Na+ المبوبة بالربيطة','يدخل Na+ فيزيل استقطاب الغشاء بعد التشابكي حتى العتبة','يتولد جهد فعل في الخلية بعد التشابكية','يحلل الأستيل كولين إستريز ACh إلى أسيتات وكولين']},

        {title:'العضلة المخططة: عضو كامل', tag:'الشكل ٢٢-٥', text:['العضلة **عضو**: تتكون من عدة أنسجة (نسيج عضلي مخطط، دم، أعصاب، نسيج ضام) ويربطها **وتر** بالعظم.','الألياف **مخططة** بخطوط عرضية منتظمة تُرى بالمجهر الضوئي.','كل ليف **عديد النوى** (مدمج خلوي)، **أسطواني طويل غير متفرع**.','البروتينات المنقبضة مرتبة في **حزم متوازية من اللييفات العضلية**.'], vis:{kind:'cards', items:[{icon:'🦴',title:'وتر وعظمة',text:'الوتر يربط العضلة بالعظمة'},{icon:'🧵',title:'ألياف عضلية',text:'آلاف الخلايا الطويلة عديدة النوى'},{icon:'📏',title:'خطوط عرضية',text:'تخطيط منتظم يُرى بالمجهر الضوئي'},{icon:'🧬',title:'لييفات عضلية',text:'حزم متوازية من البروتينات المنقبضة'}]}, q:{t:'mcq', q:'لماذا تُعدّ العضلة عضوًا وليس نسيجًا؟', opts:['لأنها كبيرة الحجم','لأنها تتكون من عدة أنسجة تعمل معًا','لأنها تنقبض','لأن خلاياها متعددة النوى'], a:1, why:'العضو تركيب من أنسجة متعددة (عضلي، دم، أعصاب، ضام) تعمل معًا لوظيفة محددة.'}},

        {title:'القطعة العضلية وحزمها', tag:'الشكل ٢٣-٥ و٢٤-٥', text:['**القرص Z** (الخط Z): موضع ارتباط خيوط **الأكتين** الرفيعة؛ **القطعة العضلية** هي جزء اللييف بين قرصَي Z (متوسط طولها في العضلة المنبسطة **2.25 µm**).','**الحزمة I** (فاتحة): خيوط أكتين رفيعة فقط، لا ميوسين.','**الحزمة A** (داكنة): تداخل الخيوط السميكة والرفيعة؛ في وسطها **الحزمة H** الأفتح حيث خيوط **الميوسين** السميكة فقط.','**الخط M**: موضع ارتباط خيوط الميوسين في منتصف القطعة العضلية.'], vis:{kind:'table', head:['المنطقة','ما تحويه','مظهرها'], rows:[['القرص Z','مرفق خيوط الأكتين؛ حد القطعة العضلية','خط داكن رفيع'],['الحزمة I','أكتين فقط','فاتحة'],['الحزمة A','تداخل أكتين وميوسين','داكنة'],['الحزمة H','ميوسين فقط (وسط A)','أفتح من بقية A'],['الخط M','مرفق خيوط الميوسين','خط في وسط H']]}, q:{t:'mcq', q:'أي منطقة تحتوي على خيوط الميوسين السميكة فقط؟', opts:['الحزمة I','الحزمة H','القرص Z','الحزمة A كلها'], a:1, why:'الحزمة H في وسط الحزمة A تحوي الخيوط السميكة دون تداخل مع الرفيعة.'}},
        {title:'الخيوط السميكة والرفيعة', tag:'الشكل ٢٤-٥', text:['**الميوسين**: بروتين ليفي برأس **كروي**؛ الجزء الليفي يثبّته في الخيط السميك، والرؤوس تتجه **بعيدًا عن الخط M**. كل رأس يحوي إنزيم **ATPase** يحلل ATP.','**الأكتين**: بروتين كروي، ترتبط جزيئاته في سلسلة، وتلتف **سلسلتان** معًا لتكوين الخيط الرفيع.','**التروبوميوسين**: بروتين ليفي يلتف حول سلاسل الأكتين ويسد **مواقع ارتباط** رؤوس الميوسين.','**التروبونين**: بروتين يرتبط بـ**الكالسيوم**، متصل بسلسلة الأكتين على مسافات منتظمة.'], vis:{kind:'compare', cols:[{icon:'🔩',title:'الخيط السميك',items:['جزيئات ميوسين كثيرة في حزمة','رأس كروي به ATPase','الرؤوس بعيدًا عن الخط M','يرتبط بالخط M']},{icon:'🧶',title:'الخيط الرفيع',items:['سلسلتا أكتين ملتفتان','تروبوميوسين يسد مواقع الارتباط','تروبونين يرتبط بـ Ca2+','يرتبط بالقرص Z']}]}},
        {title:'الوصلة العصبية العضلية: إشارة البدء', tag:'من العصب إلى Ca2+', text:['تصل النبضة إلى النهاية المحورية للخلية الحركية عند **الصفيحة النهائية الحركية** فتُطلق **الأستيل كولين** عبر الشق التشابكي.','يرتبط ACh بمستقبلاته على **الساركوليما** ← دخول Na+ ← **جهد فعل في الليف العضلي**.','ينتقل جهد الفعل عبر **أنيبيبات T** إلى عمق الليف.','تستجيب **الشبكة الساركوبلازمية** بإطلاق **أيونات الكالسيوم** إلى السيتوبلازم حول اللييفات.'], vis:'neuromuscular', q:{t:'mcq', q:'ما وظيفة أنيبيبات T؟', opts:['تخزين الكالسيوم','نقل إزالة الاستقطاب من الساركوليما إلى عمق الليف','تصنيع ATP','ربط الأكتين بالقرص Z'], a:1, why:'أنيبيبات T انثناءات من الساركوليما تمتد إلى الداخل فتصل النبضة إلى الشبكة الساركوبلازمية في كل أجزاء الليف.'}},
        {title:'نموذج الخيط المنزلق: كشف مواقع الارتباط', tag:'الشكل ٢٥-٥ (١ و٢)', text:['في العضلة **المنبسطة** يستقر التروبونين والتروبوميوسين في موضع يمنع الميوسين من الارتباط بالأكتين.','عند الانقباض تُطلَق **أيونات الكالسيوم** من SR وترتبط بـ**التروبونين** فيغير شكله.','ينتقل **التروبونين والتروبوميوسين** إلى موضع مختلف، فتنكشف **مواقع ربط الميوسين** على الأكتين.','ترتبط رؤوس الميوسين بهذه المواقع مكوّنة **جسورًا متقاطعة** (عرضية) بين نوعَي الخيوط.'], vis:'sliding_filament', cap:'Ca2+ ← التروبونين ← إزاحة التروبوميوسين ← جسور متقاطعة.'},
        {title:'دورة الجسر المتقاطع: ضربة القوة و ATP', tag:'الشكل ٢٥-٥ (٣ و٤)', text:['تتحرك رؤوس الميوسين (تميل) فتسحب خيوط الأكتين نحو **مركز القطعة العضلية** بمقدار نحو **10 nm** في كل ضربة.','يحلل **ATPase** في الرأس **ATP** مائيًا إلى ADP و Pi موفرًا الطاقة لـ**انفكاك** الرأس عن الأكتين.','يعود الرأس إلى موضعه السابق (يرتد) ويرتبط بموقع **أبعد قليلًا** على الخيط الرفيع، أقرب إلى القرص Z.','تتكرر الدورة ما دام في العضلة **ATP** كافٍ، فتقترب أقراص Z من بعضها وتقصر كل قطعة عضلية.'], vis:{kind:'cycle', center:'🔁', steps:[{icon:'🔗',t:'ارتباط الرأس بالأكتين (جسر متقاطع)'},{icon:'➡️',t:'ضربة القوة: سحب الأكتين نحو المركز نحو 10 nm'},{icon:'⚡',t:'تحلل ATP مائيًا بـ ATPase'},{icon:'🔓',t:'انفكاك الرأس عن الأكتين'},{icon:'↩️',t:'ارتداد الرأس إلى موضعه'},{icon:'📍',t:'ارتباط بموقع أبعد نحو القرص Z'}]}, q:{t:'mcq', q:'ما الدور المباشر للتحلل المائي لـ ATP في الرأس؟', opts:['كشف مواقع الارتباط على الأكتين','إطلاق الكالسيوم من SR','تمكين رأس الميوسين من الانفكاك عن الأكتين والارتداد','تصنيع التروبونين'], a:2, why:'الكتاب يذكر أن التحلل المائي لـ ATP يوفر الطاقة لانفكاك الرؤوس عن الأكتين وارتدادها لتكرار الارتباط والحركة.'}},
        {title:'ماذا يتغير عند الانقباض؟', tag:'تحليل الصور المجهرية', text:['**تقصر القطعة العضلية** لأن الخيوط **تنزلق** فوق بعضها؛ الخيوط نفسها **لا تقصر**.','**الحزمة I** و**الحزمة H** تصبحان أضيق، بينما **الحزمة A** يبقى طولها ثابتًا (طول خيط الميوسين).','في الانقباض الأقصى قد تتلاقى خيوط الأكتين في المركز فلا يمكن للقطعة أن تنقبض أكثر.','العضلة تسحب ولا تدفع: تعود إلى طولها الأصلي بانقباض عضلة **مضادة** تسحب في الاتجاه المعاكس.'], vis:{kind:'compare', cols:[{icon:'😌',title:'عضلة منبسطة',items:['قطعة عضلية طويلة (نحو 2.25 µm)','حزمة I واسعة','حزمة H واضحة','لا جسور متقاطعة (التروبوميوسين يسد المواقع)']},{icon:'💪',title:'عضلة منقبضة',items:['قطعة عضلية أقصر','حزمة I ضيقة','حزمة H تضيق أو تختفي','جسور متقاطعة كثيرة؛ الحزمة A ثابتة']}]}, note:'💡 حساب: صورة مجهرية إلكترونية بتكبير 16 000 تُظهر قطعة عضلية طولها 36 mm؛ الطول الحقيقي = 36 000 µm ÷ 16 000 = 2.25 µm.'},
        {title:'خلاصة الدرس', tag:'خلاصة', text:['العضلة المخططة **عصبية المنشأ**؛ أليافها عديدة النوى تحوي **لييفات** مقسمة إلى **قطع عضلية** بين أقراص Z، فيها حزم **A** و**I** و**H** وخط **M**.','الخيط السميك **ميوسين** (رأس كروي ATPase)؛ الخيط الرفيع **أكتين + تروبونين + تروبوميوسين**.','**الوصلة العصبية العضلية** ← جهد فعل ← أنيبيبات T ← **Ca2+** من SR ← يرتبط بالتروبونين ← ينكشف الأكتين ← **جسور متقاطعة** ← ضربة قوة ← **ATP** للانفكاك.','القطعة تقصر بـ**انزلاق** الخيوط لا بتقصيرها.'], vis:'sliding_filament'}

          {q:'ما الذي يحدث مباشرة بعد ارتباط Ca2+ بالتروبونين؟', opts:['يتحلل ATP','ينتقل التروبونين والتروبوميوسين فتنكشف مواقع ارتباط الميوسين على الأكتين','تُطلق SR المزيد من الكالسيوم','ينفك رأس الميوسين'], a:1, why:'تغير شكل التروبونين يزيح التروبوميوسين عن مواقع الارتباط.'},
          {q:'صورة مجهرية إلكترونية لعضلة تُظهر حبيبات جاليكوجين وميتوكوندريا كثيرة بين اللييفات. السبب:', opts:['لتخزين الكالسيوم','لتوفير ATP باستمرار للانقباض من تنفس الجلوكوز','لتصنيع الأكتين','لتكوين الخطوط العرضية'], a:1, why:'الانقباض يستهلك ATP بكثرة؛ الجاليكوجين مصدر الجلوكوز والميتوكوندريا موقع إنتاج ATP.'},

        reflect:['لماذا تكون القطعة العضلية بهذا الانتظام الهندسي الدقيق؟ ما الذي يحدث لو كانت الخيوط مرتبة عشوائيًا؟','قارن دور الكالسيوم في التشابك الكوليني بدوره في الانقباض العضلي: ما المشترك؟'],
        summary:'العضلة المخططة **عصبية المنشأ**، أليافها عديدة النوى تحوي **لييفات** من **قطع عضلية** بين أقراص Z (حزم A وI وH وخط M). الخيط السميك **ميوسين** برأس ATPase؛ الخيط الرفيع **أكتين** مع **تروبونين وتروبوميوسين**. في **نموذج الخيط المنزلق**: Ca2+ من SR يرتبط بالتروبونين فينكشف الأكتين، تتكون **جسور متقاطعة**، تسحب الرؤوس الأكتين نحو المركز، ويحلل **ATP** لانفكاكها وارتدادها، فتقصر القطعة بانزلاق الخيوط لا بتقصيرها.'
      }

      pre:[

        {t:'visual', vis:'stomata', q:'درست في الوحدة الرابعة فتح الثغور. ما الذي يجعل الخليتَين الحارستَين تنتفخان فينفتح الثغر؟', opts:['خروج الماء منهما','ضخ H+ إلى الخارج ثم دخول K+ ودخول الماء بالأسموزية','تحلل النشا في الجدار','انقباض بروتينات منقبضة'], a:1, why:'تُخرج مضخات البروتون H+ بالنقل النشط فيدخل K+ مع المنحدر الكهروكيميائي إلى الخلايا الحارسة، فينخفض جهد الماء ويدخل الماء ويزداد ضغط الامتلاء. ستقابل الفكرة نفسها في استطالة الخلايا بالأكسين.'},
        {t:'mcq', q:'تنمو ساق نبات في نافذة الصف نحو الضوء. ما التغير الذي يحدث في الخلايا على الجانب البعيد عن الضوء؟', opts:['تنقسم أسرع فقط','تستطيل أكثر','تموت','تفقد الماء'], a:1, why:'انحناء الساق ينتج من استطالة أكبر للخلايا في الجانب المظلل؛ سنتعرف على الهرمون المسؤول: الأكسين.'},
        {t:'cloud', q:'اختر ما يرتبط بجدار الخلية النباتية (الصف الحادي عشر):', words:[{w:'السليلوز',ok:true},{w:'ألياف دقيقة',ok:true},{w:'روابط هيدروجينية',ok:true},{w:'الهيميسليلوز',ok:true},{w:'الفوسفوليبيد',ok:false},{w:'الميوسين',ok:false},{w:'الكولاجين',ok:false},{w:'ضغط الامتلاء',ok:true},{w:'المايلين',ok:false},{w:'الجاليكوجين',ok:false}], why:'جدار الخلية من ألياف سليلوز دقيقة مرتبطة بروابط هيدروجينية مع الهيميسليلوز ويقاوم ضغط الامتلاء؛ الفوسفوليبيد للغشاء، والباقي بروتينات أو مخازن حيوانية.'},
        {t:'mcq', q:'ما الإنزيم الذي يحلل النشا إلى مالتوز؟', opts:['الأميليز','الليبيز','البروتييز','الكاتاليز'], a:0, why:'الأميليز يحلل النشا مائيًا إلى مالتوز ثم يتحول إلى جلوكوز؛ سنراه في إنبات البذور.'},
        {t:'open', q:'يُغلق نبات خنّاق الذباب فصّيه على حشرة في أقل من ثانية. كيف يمكن لنبات بلا أعصاب أن يستجيب بهذه السرعة؟ توقّع.'}
      ],
      slides:[
        {title:'النباتات تتواصل أيضًا', tag:'تمهيد وأهداف', text:['تمتلك النباتات، كالإنسان والحيوان، **أنظمة تواصل** تنسق بين أجزائها وتستجيب للتغيرات في بيئتها الخارجية والداخلية.','معظم استجابات النبات **تغيرات في النمو** (نحو الضوء، مع الجاذبية)، وبعضها **سريع** ينتج من تغيرات في **ضغط الامتلاء** كما في الثغور.','أهدافنا: التواصل الكيميائي بـ**منظمات النمو**، **جهود الفعل** في خنّاق الذباب، دور **الأكسين** في الاستطالة بضخ البروتونات، ودور **الجبريلين** في الإنبات.'], vis:{kind:'cards', items:[{icon:'🧪',title:'تواصل كيميائي',text:'منظمات النمو النباتية (الهرمونات النباتية)'},{icon:'⚡',title:'تواصل كهربائي',text:'جهود فعل في نبات خنّاق الذباب'},{icon:'🌱',title:'الأكسين',text:'استطالة الخلايا بتحميض الجدار'},{icon:'🌾',title:'الجبريلين',text:'إنبات البذرة وتحلل النشا'}]}, note:'💡 نخيل عُمان ينمو نحو الضوء ويثبّت جذوره في الأرض ويُنبت بذوره في الوقت المناسب: كلها استجابات تنسقها مواد كيميائية.'},
        {title:'منظمات النمو النباتية', tag:'التواصل الكيميائي', text:['**منظم نمو النبات** (الهرمون النباتي): أي مادة كيميائية ينتجها النبات وتؤثر على نموه وتطوره، مثل **الأكسينات** و**السيتوكينين** و**حمض الأبسيسيك ABA** و**الجبريلين**.','لا تُنتج من **غدد** متخصصة بل من **أنسجة متنوعة**.','تنتقل **من خلية إلى خلية** (انتشار أو نقل نشط) أو تُحمل في **عصارة اللحاء أو الخشب**؛ وبعضها يعمل **موضعيًا** على الخلايا المجاورة.','تتحكم في النمو والاستجابة للتغيرات البيئية.'], vis:{kind:'compare', cols:[{icon:'🐘',title:'هرمونات الحيوان',items:['تُنتج في غدد صماء','تنتقل في الدم','أعضاء مستهدفة بعيدة']},{icon:'🌿',title:'منظمات النمو النباتية',items:['تُنتج في أنسجة متنوعة','خلية إلى خلية أو في عصارة اللحاء/الخشب','بعضها يعمل موضعيًا']}]}, q:{t:'mcq', q:'ما الفرق الأساسي بين إنتاج الهرمونات في النبات والحيوان؟', opts:['النبات لا ينتج هرمونات','هرمونات النبات تُنتج من أنسجة متنوعة لا من غدد','هرمونات الحيوان لا تنتقل','هرمونات النبات بروتينات فقط'], a:1, why:'لا توجد غدد في النبات؛ تنتج منظمات النمو من أنسجة مختلفة كالقمم النامية.'}},
        {title:'استجابات سريعة بضغط الامتلاء: الثغور', tag:'ربط بالوحدة الرابعة', text:['بعض استجابات النبات **سريعة** ولا تتطلب نموًا: تنتج من **تغير ضغط الامتلاء** في خلايا معينة.','مثال: **الثغور** تفتح وتغلق استجابة للرطوبة وتركيز CO2 وتوافر الماء.','عند الجفاف يُفرز **حمض الأبسيسيك ABA** فتُغلق الثغور بخروج الأيونات والماء من الخلايا الحارسة.','الفكرة نفسها (حركة أيونات ← حركة ماء ← تغير ضغط الامتلاء) ستظهر في خنّاق الذباب والأكسين.'], vis:'stomata', cap:'الثغر: نموذج للاستجابة السريعة في النبات.'},
        {title:'خنّاق الذباب: جهود فعل في نبات', tag:'Venus flytrap · إضافة من منهج كامبردج', text:['نبات لاحم يعيش في تربة فقيرة بالنيتروجين؛ ورقته **فصّان** مفصليان على سطحهما **شعيرات حسية**.','لمس حشرة للشعيرة يثني قاعدتها فيسبب **جهد مستقبل**؛ إذا لُمست الشعيرات **مرتين خلال فترة قصيرة** تتولد **جهود فعل** تنتشر عبر الفصين (وهذا يمنع الإغلاق الخاطئ بسبب قطرة مطر).','يُغلق الفصّان في **أقل من ثانية**: تتغير الأشكال من محدبة إلى مقعرة بتغير سريع في **ضغط الامتلاء** ونمو الخلايا (ضخ H+ إلى الجدران يرخيها).','حركة الحشرة المحاصرة تولد جهود فعل أخرى فتُفرز الغدد **إنزيمات هضم** وتُمتص النواتج على مدى أيام.'], vis:'venus_flytrap', q:{t:'mcq', q:'لماذا يحتاج خنّاق الذباب إلى لمستين للشعيرات قبل الإغلاق؟', opts:['لأن اللمسة الأولى تصنع الإنزيمات','لتجنب الإغلاق الخاطئ استجابة لقطرة مطر أو شيء غير حي','لأن جهد الفعل الأول يفتح الفصين','لأن الشعيرات تنمو بعد اللمسة الأولى'], a:1, why:'الإغلاق مكلف من حيث الطاقة، فيتطلب النبات تأكيدًا (منبهَين متتابعَين) قبل الاستجابة.'}},
        {title:'الأكسين: IAA', tag:'الشكل ٢٧-٥', text:['أهم الأكسينات **الإندول-3-حمض الأسيتيك (IAA)**، ويُعرف ببساطة باسم **الأكسين**.','يُصنع في **القمم النامية** (الأنسجة المولدة) في **المجموع الخضري والجذور** حيث تنقسم الخلايا بنشاط.','يؤثر على جوانب عديدة من النمو منها **النمو بالاستطالة** وتحديد **الطول الإجمالي** للجذور والفروع.','ينتقل من القمة إلى الأسفل ويرتبط بـ**بروتين مستقبل** على غشاء سطح الخلية.'], vis:'auxin', cap:'الأكسين ينتقل من القمة إلى منطقة الاستطالة.'},
        {title:'آلية الأكسين: تحميض الجدار', tag:'الشكل ٢٨-٥', text:['ارتباط الأكسين بمستقبله يحفز **مضخات البروتونات (H+)** التي تحلل ATP فتضخ H+ من السيتوبلازم إلى **جدار الخلية** ← ينخفض **pH** الجدار.','انخفاض pH ينشط **بروتينات الاستطالة (Expansins)** التي تفك **الروابط الهيدروجينية** بين **ألياف السليلوز الدقيقة** وعديدات التسكر المرتبطة بها مثل **الهيميسليلوز**.','تتحرك الألياف الدقيقة بمحاذاة بعضها لفترة وجيزة فيتمدد الجدار **دون فقد قوته**.','يحفز الأكسين أيضًا فتح قنوات **K+** فيدخل البوتاسيوم ← ينخفض **جهد الماء** ← يدخل الماء عبر **الأكوابورينات** ← يزداد **ضغط الامتلاء** ← **استطالة** الخلية.'], vis:{kind:'steps', steps:[{icon:'🔗',t:'الأكسين يرتبط بمستقبل على غشاء سطح الخلية'},{icon:'⚡',t:'تنشيط مضخات H+ (تحلل ATP): ضخ البروتونات إلى الجدار'},{icon:'🧪',t:'انخفاض pH الجدار ينشط بروتينات الاستطالة'},{icon:'✂️',t:'فك الروابط الهيدروجينية بين ألياف السليلوز والهيميسليلوز'},{icon:'💧',t:'K+ يدخل ← جهد الماء ينخفض ← ماء عبر الأكوابورينات'},{icon:'📏',t:'ضغط الامتلاء يمدد الجدار المرتخي: استطالة الخلية'}]}, q:{t:'mcq', q:'ما الذي ينشط بروتينات الاستطالة في الجدار؟', opts:['ارتفاع pH الجدار','انخفاض pH الجدار بضخ H+','دخول الماء','ارتباط الأكسين بها مباشرة'], a:1, why:'ضخ البروتونات إلى الجدار يخفض pH فتنشط بروتينات الاستطالة وتفك الروابط بين الألياف.'}},
        {title:'تجربة: الأكسين وبروتينات الاستطالة في رشاد الصخر', tag:'مهارات علمية', text:['قُطّع المجموع الخضري لبادرات **رشاد الصخر (Arabidopsis thaliana)** إلى قطع في **ست مجموعات** (عشر قطع لكل مجموعة).','(أ) ضابطة؛ (ب–د) تراكيز متزايدة من **IAA** (0.01، 0.1، 1.0 µmol/L)؛ (هـ) **بروتينات استطالة** معزولة؛ (و) بروتينات استطالة + أعلى تركيز من IAA.','قيست الأطوال بعد **4 ساعات** و**18 ساعة** وعُرضت **النسبة المئوية للزيادة** لتصحيح اختلاف الأطوال الابتدائية.','تفكير: إذا تساوت (هـ) و(و)، فالتفسير أن **بروتينات الاستطالة** هي المنفّذ النهائي المشترك، والأكسين يعمل **من خلالها**.'], vis:{kind:'table', head:['المجموعة','المعالجة','ما تختبره'], rows:[['أ','ماء/محلول بلا IAA (ضابطة)','خط الأساس'],['ب','IAA 0.01 µmol/L','تركيز منخفض'],['ج','IAA 0.1 µmol/L','تركيز متوسط'],['د','IAA 1.0 µmol/L','تركيز عالٍ'],['هـ','بروتينات الاستطالة','أثرها وحدها'],['و','بروتينات الاستطالة + IAA 1.0','هل يتراكم الأثر؟']]}, note:'💡 لماذا النسبة المئوية؟ لأن القطع ليست متساوية الطول في البداية، فالمقارنة بالزيادة النسبية أعدل.'},
        {title:'الجبريلين والإنبات', tag:'تحلل النشا · إضافة من منهج كامبردج', text:['**الجبريلين** منظم نمو نباتي يحفز **الإنبات** واستطالة الساق.','تمتص البذرة الماء ← يُفرز **الجنين** الجبريلين ← ينتقل إلى **طبقة الأليورون** المحيطة بالإندوسبرم.','تستجيب خلايا الأليورون بتصنيع إنزيم **الأميليز** (نسخ جينه وترجمته).','يحلل الأميليز **النشا** المخزن في **الإندوسبرم** إلى **مالتوز** ثم **جلوكوز** يستخدمه الجنين في **التنفس** (ATP) و**النمو** (بناء السليلوز).'], vis:'gibberellin_germination', q:{t:'mcq', q:'ما دور طبقة الأليورون في الإنبات؟', opts:['تخزين النشا','إفراز الجبريلين','تصنيع الأميليز استجابة للجبريلين','امتصاص الماء فقط'], a:2, why:'الجنين يفرز الجبريلين، والأليورون ينتج الأميليز الذي يحلل نشا الإندوسبرم.'}},
        {title:'الجبريلين والتعبير الجيني', tag:'ربط بالوحدة الثانية · إضافة من منهج كامبردج', text:['كيف يجعل الجبريلين الخلية تصنع الأميليز؟ عبر **التحكم في التعبير الجيني**.','يرتبط الجبريلين بـ**مستقبل** ← يؤدي إلى **تحلل بروتين DELLA** الكابح.','يتحرر **عامل النسخ** (مثل PIF) فيرتبط بمحفز الجينات ← **نسخ** الجينات المسؤولة عن النمو أو عن إنزيم الأميليز.','النتيجة: استطالة الساق أو إنتاج الأميليز في الأليورون.'], vis:'gibberellin_della', cap:'جبريلين ← تحلل DELLA ← تحرير عامل النسخ ← تعبير جيني.', note:'💡 في صناعة الشعير المنبَّت (المالت) يُستفاد من تحلل النشا بالأميليز الناتج عن الإنبات.'},
        {title:'مقارنة: التنسيق في النبات والحيوان', tag:'تركيب المفاهيم', text:['**المشترك**: مستقبلات تتحسس المنبه، رسائل كيميائية أو كهربائية، استجابة منسقة؛ حتى **جهود الفعل** موجودة في بعض النباتات.','**المختلف**: لا أعصاب ولا غدد ولا عضلات في النبات؛ الرسائل الكيميائية تُنتج من أنسجة متنوعة، والاستجابات في معظمها **نمو** بطيء.','في كلٍّ منهما تُستخدم **حركة الأيونات والماء** لتوليد الحركة السريعة (الخلايا الحارسة وفصّا خنّاق الذباب مقابل الخلايا العصبية والعضلية).'], vis:{kind:'compare', cols:[{icon:'🐘',title:'الحيوان',items:['جهاز عصبي وغدد صماء','نبضات عصبية سريعة وهرمونات في الدم','استجابات حركية بالعضلات']},{icon:'🌿',title:'النبات',items:['منظمات نمو من أنسجة متنوعة','انتقال في عصارة اللحاء والخشب أو خلية إلى خلية','استجابات نمو، وبعضها سريع بضغط الامتلاء أو جهود فعل']}]}, q:{t:'mcq', q:'أي استجابة نباتية تحدث بجهود فعل وليس بتغير النمو؟', opts:['انحناء الساق نحو الضوء','إغلاق فصّي خنّاق الذباب','إنبات البذرة','استطالة الجذر'], a:1, why:'خنّاق الذباب يستخدم جهود فعل تنتشر في الفصين لإغلاق سريع؛ الباقي استجابات نمو أبطأ.'}},
        {title:'خلاصة الدرس', tag:'خلاصة', text:['**منظمات النمو النباتية** تُنتج من أنسجة متنوعة (لا غدد) وتنتقل خلية إلى خلية أو في عصارة اللحاء/الخشب.','**خنّاق الذباب**: شعيرات حسية ← لمستان ← **جهود فعل** ← إغلاق الفصين في أقل من ثانية ← إنزيمات هضم.','**الأكسين (IAA)** من القمم النامية يحفز **مضخات H+** ← تحميض الجدار ← **بروتينات الاستطالة** تفك الروابط ← دخول K+ والماء ← **استطالة**.','**الجبريلين**: الجنين ← الأليورون ← **أميليز** ← تحلل نشا الإندوسبرم ← جلوكوز للجنين.'], vis:'auxin'}
      ],
      games:[
        {id:'g1', type:'quiz', time:20, runner:'🌱', qs:[
          {q:'الاسم الكيميائي لأهم الأكسينات:', opts:['حمض الأبسيسيك','الإندول-3-حمض الأسيتيك (IAA)','السيتوكينين','الجبريلين'], a:1, why:'IAA هو الأكسين الرئيسي في النباتات.'},

<script>

(function(){
'use strict';
const D = window.BIO_DATA;

const $$ = (s,el=document)=>[...el.querySelectorAll(s)];

const KEY = 'bio_'+D.grade+'_v1';

let S = load();

function save(){ try{ localStorage.setItem(KEY,JSON.stringify(S)); }catch(e){} }
function LS(id){ return S.lessons[id] || (S.lessons[id]={pre:false,slide:0,slidesDone:false,games:{},post:null}); }
const allLessons = ()=>D.units.flatMap(u=>u.lessons.map(l=>({...l,unit:u})));
function lessonPct(l){ const s=LS(l.id); let n=0; if(s.pre)n++; if(s.slidesDone)n++; if(Object.keys(s.games).length)n++; if(s.post!=null)n++; return n; }
function totalPct(){ const ls=allLessons(); const n=ls.reduce((a,l)=>a+lessonPct(l),0); return Math.round(100*n/(ls.length*4)); }
function updateProg(){ const p=totalPct(); $('#progTxt').textContent=ARN(p)+'%'; $('#progBar').style.width=p+'%'; }

/* ---------- audio ---------- */
let AC=null;
function ac(){ if(!AC){ try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){} } if(AC&&AC.state==='suspended')AC.resume(); return AC; }
function tone(f,t,dur,type='sine',vol=.18,slide=0){ const c=ac(); if(!c||!S.settings.sound)return; const o=c.createOscillator(),g=c.createGain(); o.type=type; o.frequency.setValueAtTime(f,c.currentTime+t); if(slide)o.frequency.exponentialRampToValueAtTime(slide,c.currentTime+t+dur); g.gain.setValueAtTime(0,c.currentTime+t); g.gain.linearRampToValueAtTime(vol,c.currentTime+t+.01); g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+t+dur); o.connect(g).connect(c.destination); o.start(c.currentTime+t); o.stop(c.currentTime+t+dur+.02); }
const SFX={
  click:()=>tone(600,0,.06,'triangle',.08),
  ok:()=>{tone(523,0,.12,'triangle');tone(659,.1,.12,'triangle');tone(784,.2,.2,'triangle');},
  bad:()=>{tone(220,0,.18,'sawtooth',.12,160);},
  win:()=>{[523,659,784,1047].forEach((f,i)=>tone(f,i*.12,.25,'triangle',.16));tone(1319,.5,.5,'triangle',.14);},
  flip:()=>tone(880,0,.05,'sine',.06),
  pop:()=>tone(900,0,.08,'square',.06,300),
  tick:()=>tone(1200,0,.03,'square',.03),
  whoosh:()=>tone(300,0,.25,'sine',.08,900),
  star:()=>{tone(1047,0,.1,'sine',.1);tone(1568,.08,.2,'sine',.1);}
};
/* TTS */
let voices=[]; function loadVoices(){ try{voices=speechSynthesis.getVoices();}catch(e){} }
if('speechSynthesis' in window){ loadVoices(); speechSynthesis.onvoiceschanged=loadVoices; }
function speak(text){ if(!S.settings.tts||!('speechSynthesis' in window))return; try{ speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(String(text).replace(/[*_#]/g,'')); u.lang='ar-SA'; const v=voices.find(v=>/^ar/i.test(v.lang)); if(v)u.voice=v; u.rate=.95; speechSynthesis.speak(u);}catch(e){} }
function stopSpeak(){ try{speechSynthesis.cancel();}catch(e){} }

/* ---------- fx ---------- */
function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('show'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),1800); }
function confetti(n=80){ const c=$('#conf'); const cols=['#0f9d8a','#ff7a59','#ffc43d','#3b82f6','#8b5cf6','#22c55e']; for(let i=0;i<n;i++){ const e=document.createElement('i'); e.style.left=Math.random()*100+'vw'; e.style.background=cols[i%cols.length]; e.style.animationDelay=(Math.random()*.6)+'s'; e.style.transform=`rotate(${Math.random()*360}deg)`; c.appendChild(e); setTimeout(()=>e.remove(),3200);} }
function fx(x,y,txt,color){ const e=document.createElement('div'); e.className='fx'; e.textContent=txt; e.style.left=x+'px'; e.style.top=y+'px'; e.style.color=color||'#22c55e'; document.body.appendChild(e); setTimeout(()=>e.remove(),1000); }
function goodAt(ev){ SFX.ok(); const p=ev&&ev.clientX?ev:{clientX:innerWidth/2,clientY:innerHeight/2}; fx(p.clientX,p.clientY,'+1 ✓','#22c55e'); }
function badAt(ev){ SFX.bad(); const p=ev&&ev.clientX?ev:{clientX:innerWidth/2,clientY:innerHeight/2}; fx(p.clientX,p.clientY,'✗','#ef4444'); }
function stars(p){ const n=p>=.9?3:p>=.6?2:p>0?1:0; return '<div class="stars">'+'⭐'.repeat(n)+'<span style="opacity:.25">'+'⭐'.repeat(3-n)+'</span></div>'; }
function praise(p){ return p>=.9?'ممتاز! أداء رائع 🌟':p>=.7?'أحسنت! عمل جيد جدًا 👏':p>=.5?'جيد، يمكنك التحسّن 💪':'حاول مرة أخرى، ستنجح 🌱'; }

/* ---------- unit theming ---------- */
function theme(u){ document.documentElement.style.setProperty('--u',u?u.color:'#0f9d8a'); document.documentElement.style.setProperty('--ul',u?(u.light||hexA(u.color,.16)):'#d7f3ee'); }
function hexA(h,a){ const n=parseInt(h.slice(1),16); return `rgba(${n>>16},${(n>>8)&255},${n&255},${a})`; }

/* ===================== LESSON ===================== */
let CUR=null, STEP=0, TIMERS=[];
function clearTimers(){ TIMERS.forEach(t=>{clearInterval(t);clearTimeout(t);}); TIMERS=[]; stopSpeak(); }
function openLesson(id, step){
  clearTimers();
  const l=allLessons().find(x=>x.id===id); if(!l)return; CUR=l; theme(l.unit); window.scrollTo(0,0);
  const s=LS(id);
  STEP = step!=null?step: (!s.pre?0 : !s.slidesDone?1 : !Object.keys(s.games).length?2 : 3);
  app.innerHTML=`
  <div class="lhead">
    <button class="back" id="backBtn">🏠 الرئيسية</button>
    <h2>${esc(l.title)}<span>${esc(l.unit.title)}${l.en?' · '+esc(l.en):''}</span></h2>
    <div class="row"><button class="back" id="prevL">◀ السابق</button><button class="back" id="nextL">التالي ▶</button></div>
  </div>
  <div class="stepper">
    ${[['🎯','نشاط قبلي'],['📽️','العرض التفاعلي'],['🎮','الألعاب'],['🏁','نشاط ختامي']].map((x,i)=>`<div class="step ${i===STEP?'on':''} ${stepDone(l,i)?'done':''}" data-s="${i}"><span class="ic">${x[0]}</span>${x[1]}</div>`).join('')}
  </div>
  <div class="panel" id="panel"></div>`;
  $('#backBtn').onclick=()=>{clearTimers();renderHome();};
  const ls=allLessons(); const idx=ls.findIndex(x=>x.id===id);
  $('#prevL').disabled=idx===0; $('#nextL').disabled=idx===ls.length-1;
  $('#prevL').onclick=()=>openLesson(ls[idx-1].id,0); $('#nextL').onclick=()=>openLesson(ls[idx+1].id,0);
  $$('.step').forEach(e=>e.onclick=()=>{STEP=+e.dataset.s;renderStep();});
  renderStep();
}
function stepDone(l,i){ const s=LS(l.id); return [s.pre,s.slidesDone,Object.keys(s.games).length>0,s.post!=null][i]; }
function refreshStepper(){ $$('.step').forEach((e,i)=>{e.classList.toggle('on',i===STEP);e.classList.toggle('done',stepDone(CUR,i));}); updateProg(); }
function renderStep(){ clearTimers(); refreshStepper(); const p=$('#panel'); p.style.animation='none'; p.offsetHeight; p.style.animation='pop .35s'; [renderPre,renderSlides,renderGames,renderPost][STEP](); }
function nextStepBtn(label){ return `<div class="row" style="margin-top:16px;justify-content:flex-end"><button class="btn" id="nextStep">${label||'التالي'} ▶</button></div>`; }
function bindNext(){ const b=$('#nextStep'); if(b)b.onclick=()=>{ if(STEP<3){STEP++;renderStep();} else { const ls=allLessons(); const i=ls.findIndex(x=>x.id===CUR.id); if(i<ls.length-1)openLesson(ls[i+1].id,0); else renderHome(); } }; }

/* ---------- activity items (pre/post) ---------- */
function renderItems(items, container, onAllDone){
  let done=0, correct=0, total=items.filter(i=>i.t!=='open').length;
  container.innerHTML=items.map((it,i)=>itemHTML(it,i)).join('');
  items.forEach((it,i)=>{
    const el=container.children[i];
    const finish=(ok)=>{ done++; if(ok)correct++; if(done===items.length&&onAllDone)onAllDone(correct,total); };
    if(it.t==='tf'){ $$('.opt',el).forEach(o=>o.onclick=(ev)=>{ const v=o.dataset.v==='1'; const ok=v===!!it.a; $$('.opt',el).forEach(x=>x.classList.add('dis')); o.classList.add(ok?'ok':'bad'); if(!ok)$$('.opt',el).find(x=>(x.dataset.v==='1')===!!it.a).classList.add('ok'); ok?goodAt(ev):badAt(ev); el.insertAdjacentHTML('beforeend',`<div class="why ${ok?'ok':'bad'}">${ok?'✅ صحيح! ':'❌ '}${esc(it.why||'')}</div>`); finish(ok); }); }
    else if(it.t==='mcq'||it.t==='visual'){ $$('.opt',el).forEach(o=>o.onclick=(ev)=>{ const k=+o.dataset.k; const ok=k===it.a; $$('.opt',el).forEach(x=>x.classList.add('dis')); o.classList.add(ok?'ok':'bad'); if(!ok)$$('.opt',el)[it.a].classList.add('ok'); ok?goodAt(ev):badAt(ev); el.insertAdjacentHTML('beforeend',`<div class="why ${ok?'ok':'bad'}">${ok?'✅ أحسنت! ':'❌ الإجابة الصحيحة: <b>'+esc(it.opts[it.a])+'</b>. '}${esc(it.why||'')}</div>`); finish(ok); }); }
    else if(it.t==='cloud'){ const words=$$('.cw',el); const chk=$('.chk',el); words.forEach(w=>w.onclick=()=>{w.classList.toggle('sel');SFX.click();}); chk.onclick=()=>{ let ok=true; words.forEach(w=>{ const good=w.dataset.ok==='1', sel=w.classList.contains('sel'); w.classList.remove('sel'); if(good&&sel)w.classList.add('ok'); else if(!good&&sel){w.classList.add('bad');ok=false;} else if(good&&!sel){w.classList.add('miss');ok=false;} w.style.pointerEvents='none'; }); chk.disabled=true; ok?SFX.ok():SFX.bad(); el.insertAdjacentHTML('beforeend',`<div class="why ${ok?'ok':'bad'}">${ok?'✅ اختيار موفق! ':'الكلمات الخضراء صحيحة، الصفراء فاتتك، والحمراء لا علاقة لها. '}${esc(it.why||'')}</div>`); finish(ok); }; }
    else if(it.t==='open'){ const ta=$('textarea',el); const k=CUR.id+'_open_'+STEP+'_'+i; ta.value=(S.open||{})[k]||''; ta.oninput=()=>{ S.open=S.open||{}; S.open[k]=ta.value; save(); $('.saved',el).textContent=ta.value?'✓ محفوظ':''; }; if(ta.value)$('.saved',el).textContent='✓ محفوظ'; done++; }
  });
}
function itemHTML(it,i){
  const n=`<span class="n">${ARN(i+1)}</span>`;
  const vis=it.vis?`<div class="vis" style="min-height:200px;margin-bottom:10px">${renderVis(it.vis)}</div>`:'';
  if(it.t==='tf') return `<div class="item">${vis}<div class="q">${n}<span>${esc(it.q)}</span></div><div class="tfb"><button class="opt" data-v="1"><span class="l">✔</span> صحيح</button><button class="opt" data-v="0"><span class="l">✘</span> خطأ</button></div></div>`;
  if(it.t==='mcq'||it.t==='visual') return `<div class="item">${vis}<div class="q">${n}<span>${esc(it.q)}</span></div><div class="opts">${it.opts.map((o,k)=>`<button class="opt" data-k="${k}"><span class="l">${AR[k]}</span>${esc(o)}</button>`).join('')}</div></div>`;
  if(it.t==='cloud') return `<div class="item">${vis}<div class="q">${n}<span>${esc(it.q)}</span></div><div class="cloud">${shuffle(it.words).map(w=>`<span class="cw" data-ok="${w.ok?1:0}">${esc(w.w)}</span>`).join('')}</div><div class="row" style="margin-top:10px"><button class="btn sm chk">تحقّق ✓</button></div></div>`;
  if(it.t==='open') return `<div class="item">${vis}<div class="q">${n}<span>${esc(it.q)}</span></div><textarea class="open" placeholder="اكتب إجابتك هنا..."></textarea><div class="saved"></div></div>`;
  return '';
}

/* ---------- SLIDES ---------- */
function renderSlides(){
  const l=CUR, p=$('#panel'), slides=l.slides||[]; let i=Math.min(LS(l.id).slide||0, slides.length-1); if(i<0)i=0;
  const seen=new Set(LS(l.id).seen||[]);
  function draw(){
    const s=slides[i]; seen.add(i); LS(l.id).slide=i; LS(l.id).seen=[...seen]; if(seen.size>=slides.length){LS(l.id).slidesDone=true;} save(); refreshStepper();
    p.innerHTML=`<div class="ph"><h3>📽️ العرض التفاعلي</h3><span class="sub">شريحة ${ARN(i+1)} من ${ARN(slides.length)}</span><span class="pill">${esc(s.tag||l.unit.title)}</span></div>
    <div class="slide">
      <div class="txt"><h3>${esc(s.title)}</h3><ul>${(s.text||[]).map(t=>`<li>${md(t)}</li>`).join('')}</ul>${s.note?`<div class="note">${md(s.note)}</div>`:''}
        <div class="row" style="margin-top:12px"><button class="speak" id="spk">🔊 اقرأ الشريحة</button>${s.q?`<button class="speak" id="askBtn">❓ سؤال سريع</button>`:''}</div>
        <div id="ask"></div>
      </div>
      <div class="vis">${renderVis(s.vis)}${s.cap?`<span class="cap">${esc(s.cap)}</span>`:''}</div>
    </div>
    <div class="snav">
      <button class="btn sec" id="prv" ${i===0?'disabled':''}>◀ السابقة</button>
      <div class="dots">${slides.map((_,k)=>`<i class="${k===i?'on':seen.has(k)?'seen':''}" data-k="${k}"></i>`).join('')}</div>
      ${i<slides.length-1?`<button class="btn" id="nxt">التالية ▶</button>`:`<button class="btn warm" id="nextStep">إلى الألعاب 🎮</button>`}
    </div>`;
    $('#spk').onclick=()=>speak(s.title+'. '+(s.text||[]).join('. ')+(s.note?'. '+s.note:''));
    if(s.q){ $('#askBtn').onclick=()=>{ $('#ask').innerHTML=itemHTML(s.q,0); renderItems([s.q],$('#ask')); $('#askBtn').disabled=true; }; }
    if($('#prv'))$('#prv').onclick=()=>{i--;SFX.whoosh();draw();};
    if($('#nxt'))$('#nxt').onclick=()=>{i++;SFX.whoosh();draw();};
    $$('.snav .dots i').forEach(d=>d.onclick=()=>{i=+d.dataset.k;draw();});
    bindNext();
    if(S.settings.tts&&S.settings.autoRead)speak(s.title);
  }
  if(!slides.length){ p.innerHTML='<div class="result"><p>لا توجد شرائح لهذا الدرس.</p>'+nextStepBtn()+'</div>'; LS(l.id).slidesDone=true; save(); bindNext(); return; }
  draw();
}
function md(t){ return esc(t).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>'); }

/* ---------- VISUALS ---------- */
function renderVis(v){
  if(!v) return '<div style="font-size:80px;opacity:.4">🧬</div>';
  if(typeof v==='string'){ return PRESETS[v]?wrapSVG(PRESETS[v]({})): `<div style="font-size:90px">${v}</div>`; }
  try{
    switch(v.kind){
      case 'preset': return PRESETS[v.name]?wrapSVG(PRESETS[v.name](v.opts||{})):`<div style="font-size:60px">🧪<br><small style="font-size:14px">${esc(v.name)}</small></div>`;
      case 'svg': return v.code;
      case 'emoji': return `<div style="text-align:center"><div style="font-size:${v.size||110}px;line-height:1.1;animation:pop .5s">${v.icon}</div>${v.label?`<div style="font-weight:800;font-size:18px;color:var(--u)">${esc(v.label)}</div>`:''}</div>`;
      case 'flow': return `<div class="gv flow">${v.steps.map((s,i)=>`${i?'<span class="fa">←</span>':''}<div class="fn" style="animation-delay:${i*.12}s">${s.icon?`<span class="fi">${s.icon}</span>`:''}${esc(s.t||s)}</div>`).join('')}</div>`;
      case 'compare': return `<div class="gv cmp">${v.cols.map(c=>`<div class="c">${c.icon?`<div class="ci">${c.icon}</div>`:''}<h4>${esc(c.title)}</h4><ul>${c.items.map(x=>`<li>${md(x)}</li>`).join('')}</ul></div>`).join('')}</div>`;
      case 'cards': return `<div class="gv cards">${v.items.map((c,i)=>`<div class="cd" style="animation-delay:${i*.08}s"><div class="ci">${c.icon||'•'}</div><h5>${esc(c.title)}</h5>${c.text?`<p>${esc(c.text)}</p>`:''}</div>`).join('')}</div>`;
      case 'table': return `<div class="gv"><table class="tbl"><thead><tr>${v.head.map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${v.rows.map(r=>`<tr>${r.map(c=>`<td>${md(String(c))}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
      case 'cycle': { const n=v.steps.length; return `<div class="gv cycle">${v.center?`<div class="ctr">${v.center}</div>`:''}${v.steps.map((s,i)=>{const a=-Math.PI/2+i*2*Math.PI/n; const x=50+40*Math.cos(a), y=50+40*Math.sin(a); return `<div class="cn" style="left:${x}%;top:${y}%">${s.icon?`<span class="ci">${s.icon}</span>`:''}${esc(s.t||s)}</div>`;}).join('')}</div>`; }
      case 'steps': return `<div class="gv stepsv">${v.steps.map((s,i)=>`<div class="sv" style="animation-delay:${i*.1}s"><span class="n">${ARN(i+1)}</span>${s.icon?`<span class="si">${s.icon}</span>`:''}<p>${md(s.t||s)}</p></div>`).join('')}</div>`;
      case 'bars': { const mx=Math.max(...v.items.map(b=>b.v)); return `<div class="gv"><div class="bars">${v.items.map(b=>`<div class="b"><b>${esc(b.label||b.v)}</b><i style="height:${Math.max(4,100*b.v/mx)}%;${b.color?'background:'+b.color:''}"></i><span>${esc(b.t)}</span></div>`).join('')}</div>${v.cap?`<div style="text-align:center;font-size:13px;color:var(--muted);font-weight:700">${esc(v.cap)}</div>`:''}</div>`; }
      case 'labels': { const svg=PRESETS[v.name]?PRESETS[v.name](v.opts||{}):''; return wrapSVG(svg)+`<div class="cards" style="margin-top:8px">${(v.items||[]).map(x=>`<div class="cd" style="padding:6px"><h5>${esc(x)}</h5></div>`).join('')}</div>`; }
    }
  }catch(e){ console.error(e); }
  return '<div style="font-size:80px;opacity:.4">🧬</div>';
}
function wrapSVG(s){ return `<div style="width:100%">${s}</div>`; }

/* ===================== GAMES ===================== */
const GAME_META={
  match:['🔗','لعبة التوصيل','صِل كل مصطلح بما يناسبه'],

  const all=shuffle([...g.good.map(t=>({t,ok:true})),...g.bad.map(t=>({t,ok:false}))]);
  area.innerHTML=`<div class="tbar"><i id="tbarI"></i></div><div class="hunt" id="sky"></div><p style="text-align:center;font-weight:800;color:var(--muted);font-size:14px;margin:8px 0 0">افقع البالونات ذات العبارات <b style="color:var(--g)">الصحيحة</b> فقط! 🎯 ${ARN(total)} بالونات صحيحة</p>`;
  const sky=$('#sky'); const cols=['#ffd6e0','#fff1b8','#d6f5e3','#dbeafe','#ede9fe','#ffe4cc'];
  const dur=(g.time||60);
  function spawn(){ if(spawned>=all.length){spawned=0;} const it=all[spawned++]; const b=document.createElement('div'); b.className='bal'; b.textContent=it.t; b.style.left=(5+Math.random()*(sky.clientWidth-170))+'px'; b.style.background=cols[Math.floor(Math.random()*cols.length)]; b.style.animationDuration=(9+Math.random()*4)+'s'; b.onclick=(ev)=>{ if(b.classList.contains('pop'))return; b.classList.add('pop'); SFX.pop(); if(it.ok){score++;setScore(score);fx(ev.clientX,ev.clientY,'+1 ✓','#22c55e'); if(!it.done){it.done=true;}} else {penalties++; fx(ev.clientX,ev.clientY,'✗ خاطئة','#ef4444'); SFX.bad();} setTimeout(()=>b.remove(),300); const goodLeft=all.filter(x=>x.ok&&!x.done).length; if(goodLeft===0){ end(); } }; sky.appendChild(b); setTimeout(()=>b.remove(),14000); }
  const sp=setInterval(spawn,1600); TIMERS.push(sp); spawn();
  const stop=startTimer(dur,null,()=>end());
  function end(){ clearInterval(sp); stop(); const got=all.filter(x=>x.ok&&x.done).length; finishGame(g,i,Math.max(0,got-penalties),total,`<p>بالونات صحيحة: ${ARN(got)} · أخطاء: ${ARN(penalties)}</p>`); }
}
/* wheel */
function gWheel(g,i){
  const area=gameShell(g,i); const qs=g.qs; let used=new Set(), rot=0, asked=0;
  const n=qs.length; const cols=['#0f9d8a','#ff7a59','#ffc43d','#3b82f6','#8b5cf6','#22c55e','#ec4899','#14b8a6'];
  const segs=qs.map((q,k)=>{ const a0=k*2*Math.PI/n-Math.PI/2, a1=(k+1)*2*Math.PI/n-Math.PI/2; const x0=150+140*Math.cos(a0), y0=150+140*Math.sin(a0), x1=150+140*Math.cos(a1), y1=150+140*Math.sin(a1); const am=(a0+a1)/2; return `<path d="M150 150 L${x0} ${y0} A140 140 0 0 1 ${x1} ${y1} Z" fill="${cols[k%cols.length]}" stroke="#fff" stroke-width="3"/><text x="${150+95*Math.cos(am)}" y="${150+95*Math.sin(am)}" fill="#fff" font-size="22" text-anchor="middle" dominant-baseline="middle" font-weight="900">${ARN(k+1)}</text>`; }).join('');
  area.innerHTML=`<div class="wheelwrap"><div><div class="wheel"><span class="ptr">🔻</span><svg viewBox="0 0 300 300" id="wsvg">${segs}<circle cx="150" cy="150" r="28" fill="#fff" stroke="#12342e" stroke-width="4"/><text x="150" y="150" font-size="22" text-anchor="middle" dominant-baseline="middle">🎡</text></svg></div><div class="row" style="justify-content:center;margin-top:10px"><button class="btn" id="spin">أدر العجلة 🎡</button></div></div><div id="wq"><div class="qq" style="text-align:center;color:var(--muted)">أدر العجلة لاختيار سؤال، ثم وجّهه لأحد الفريقين. سجّل النقاط في لوحة الفرق 🏆</div></div></div>`;
  $('#spin').onclick=()=>{ if(used.size===n){finishGame(g,i,n,n);return;} let k; do{k=Math.floor(Math.random()*n);}while(used.has(k)); used.add(k); const seg=360/n; const target=360*4 + (360 - (k*seg+seg/2)); rot+=target - (rot%360); $('#wsvg').style.transform=`rotate(${rot}deg)`; SFX.whoosh(); $('#spin').disabled=true; const t=setTimeout(()=>{ asked++; setScore(asked); SFX.star(); const q=qs[k]; $('#wq').innerHTML=`<div class="qq"><span class="pill">سؤال ${ARN(k+1)}</span><div style="margin-top:8px">${esc(q.q)}</div></div><div class="row" style="justify-content:center"><button class="btn sec" id="rev">👁️ أظهر الإجابة</button><button class="speak" id="spk">🔊</button></div><div id="wa"></div>`; $('#rev').onclick=()=>{$('#wa').innerHTML=`<div class="why ok">✅ ${esc(q.a)}</div>`;SFX.ok();}; $('#spk').onclick=()=>speak(q.q); $('#spin').disabled=false; $('#spin').textContent=used.size===n?'إنهاء ✓':'أدر العجلة 🎡'; },4100); TIMERS.push(t); };
}
/* secret word (plant) */
function gSecret(g,i){
  const area=gameShell(g,i); const items=shuffle(g.items).slice(0,g.limit||5); let k=0, score=0; const AL=[...'ابتثجحخدذرزسشصضطظعغفقكلمنهويةءأإآىؤئ'];
  function plantSVG(life){ const leaves=[[60,90,-40],[100,80,40],[62,60,-40],[98,50,40],[65,30,-40],[95,22,40]]; return `<svg viewBox="0 0 160 130" width="150"><rect x="50" y="105" width="60" height="22" rx="6" fill="#c4763a"/><rect x="45" y="100" width="70" height="10" rx="4" fill="#a45f2a"/><path d="M80 105 V ${life===0?90:15}" stroke="#2f9e44" stroke-width="6" stroke-linecap="round"/>${leaves.slice(0,life).map(l=>`<ellipse cx="${l[0]}" cy="${l[1]}" rx="18" ry="8" fill="#4ade80" transform="rotate(${l[2]} ${l[0]} ${l[1]})"/>`).join('')}${life===6?'<circle cx="80" cy="12" r="10" fill="#ffc43d" class="sv-beat"/>':''}${life===0?'<text x="80" y="80" text-anchor="middle" font-size="30">🥀</text>':''}</svg>`; }
  function draw(){ if(k>=items.length){finishGame(g,i,score,items.length);return;} const it=items[k]; const word=it.w; const chars=[...word]; let life=6; const found=new Set([' ']);
    area.innerHTML=`<div style="text-align:center;font-size:13px;font-weight:800;color:var(--muted)">${ARN(k+1)} / ${ARN(items.length)}</div><div class="qq" style="text-align:center">💡 ${esc(it.hint)}</div><div class="plant" id="plant">${plantSVG(life)}</div><div class="secretw" id="sw"></div><div class="kbd" id="kbd">${AL.map(c=>`<div class="lt" data-c="${c}">${c}</div>`).join('')}</div>`;
    const norm=c=>c.replace(/[أإآ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي');
    function drawWord(){ $('#sw').innerHTML=chars.map(c=>c===' '?`<div style="width:14px"></div>`:`<div class="lt ${found.has(norm(c))?'show':''}">${found.has(norm(c))?c:''}</div>`).join(''); }
    drawWord();
    $$('#kbd .lt',area).forEach(b=>b.onclick=(ev)=>{ const c=norm(b.dataset.c); b.classList.add('used'); if(chars.some(x=>norm(x)===c)){ found.add(c); b.classList.add('ok'); SFX.ok(); drawWord(); if(chars.every(x=>found.has(norm(x)))){ score++; setScore(score); confetti(30); $('#plant').innerHTML=plantSVG(6); const t=setTimeout(()=>{k++;draw();},1400); TIMERS.push(t);} } else { life--; b.classList.add('bad'); SFX.bad(); $('#plant').innerHTML=plantSVG(life); if(life===0){ $('#sw').innerHTML=chars.map(c=>`<div class="lt show" style="background:var(--rl)">${c}</div>`).join(''); toast('ذبلت النبتة! الكلمة: '+word); const t=setTimeout(()=>{k++;draw();},2200); TIMERS.push(t);} } });
  }
  draw();
}

/* ===================== POST ===================== */
function renderPost(){
  const l=CUR, p=$('#panel'); const post=l.post||{}; const qs=post.quiz||[];
  p.innerHTML=`<div class="ph"><h3>🏁 النشاط الختامي</h3><span class="sub">${esc(post.intro||'اختبر ما تعلّمته، ثم لخّص أهم فكرة في بطاقة الخروج.')}</span><button class="speak" id="spk">🔊 اقرأ</button></div><div id="items"></div><div id="reflect"></div><div id="postDone"></div>`;
  $('#spk').onclick=()=>speak('النشاط الختامي. '+qs.map(q=>q.q).join('. '));
  const items=qs.map(q=>({t:'mcq',...q}));
  const finishPost=(c,t)=>{ LS(l.id).post=t?Math.round(100*c/t):100; save(); refreshStepper(); const pct=t?c/t:1; if(pct>=.6){SFX.win();confetti(pct>=.9?120:60);}
    const ref=(post.reflect||['ما أهم فكرة تعلّمتها في هذا الدرس؟','ما السؤال الذي ما زال يدور في ذهنك؟']).map(q=>({t:'open',q}));
    $('#reflect').innerHTML=`<h4 style="margin:14px 0 8px;font-size:18px">🎟️ بطاقة الخروج</h4><div id="refItems"></div>`; renderItems(ref,$('#refItems'));
    $('#postDone').innerHTML=`<div class="result"><div class="big">${pct>=.9?'🏆':pct>=.6?'🎉':'🌱'}</div><h3>${praise(pct)}</h3>${stars(pct)}<p>${t?`أجبت بشكل صحيح عن ${ARN(c)} من ${ARN(t)}`:''}</p>${pct>=.6?`<div class="badge">🏅 وسام إتمام: ${esc(l.title)}</div>`:''}${post.summary?`<div class="why ok" style="text-align:start;margin-top:14px"><b>خلاصة الدرس:</b> ${md(post.summary)}</div>`:''}${nextStepBtn('الدرس التالي')}</div>`; bindNext(); $('#postDone').scrollIntoView({behavior:'smooth',block:'end'}); };
  if(items.length) renderItems(items,$('#items'),finishPost); else finishPost(0,0);
}

var P=q.split(".").map(Number);if(P.some(isNaN))return;
var steps=(N.pre||[]).map(function(p){return{sel:p.sel,idx:p.idx||0}}).concat(P.map(function(v,i){return{sel:N.levels[i],idx:v}}));
function vis(e){var r=e.getBoundingClientRect(),c=getComputedStyle(e);return r.width>4&&r.height>4&&c.visibility!=="hidden"&&c.display!=="none"}
function run(i){if(i>=steps.length)return;var s=steps[i],t=0;(function w(){var l=[].filter.call(document.querySelectorAll(s.sel),vis);
if(l.length>s.idx){l[s.idx].scrollIntoView({block:"center"});l[s.idx].click();setTimeout(function(){run(i+1)},700)}else if(t++<48)setTimeout(w,250)})()}
function go(){setTimeout(function(){run(0)},900)}if(document.readyState==="complete")go();else addEventListener("load",go)})();</script>
