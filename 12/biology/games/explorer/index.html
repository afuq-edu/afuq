      slides:[
        {title:'أدوية من الجينات', tag:'تمهيد', text:['قبل عام 1983 كان مرضى السكري يُعالجون بإنسولين من بنكرياس **الخنازير أو الماشية**؛ اليوم يحصلون على **إنسولين إنسان** من بكتيريا أو خميرة معدّلة جينيًا.','**التقنية الجينية** تصنع منتجات خاصة للإنسان بتقنيات **DNA معاد التركيب**، وتكشف عن **أليلات المرض** قبل ظهور الأعراض.','أهداف الدرس: مزايا البروتينات البشرية معادة التركيب (الإنسولين، العامل الثامن، ADA)، ومزايا **الفحص الجيني** (BRCA1/BRCA2، هنتنغتون، التليف الكيسي)، والاعتبارات **الاجتماعية والأخلاقية**.'], vis:{kind:'cards', items:[{icon:'💉',title:'الإنسولين',text:'لمرضى السكري'},{icon:'🩸',title:'العامل الثامن',text:'لمرضى الهيموفيليا'},{icon:'🛡️',title:'ADA',text:'لمرضى نقص المناعة SCID'},{icon:'🔬',title:'الفحص الجيني',text:'كشف أليلات المرض'}]}},
        {title:'لماذا بروتينات معادة التركيب؟', tag:'مزايا', text:['تُنتَج في **البكتيريا** و**الخمائر** و**زراعة خلايا الثدييات** ذات المتطلبات الغذائية **البسيطة**.','يمكن تكوين **كميات كبيرة**، ولا تتطلب المنشآت **مساحة كبيرة**، ويمكن الإنتاج في **أي مكان** في العالم.','لا تُستخلص من **مصادر حيوانية** ولا من **دم متبرعين** كثيرين → مشكلات عملية وأخلاقية **أقل**، وخلوّ من مخاطر **العدوى** المنقولة بالدم (مثل HIV).','البروتين **بشري مطابق** وليس من نوع آخر.'], vis:{kind:'cards', items:[{icon:'🍽️',title:'متطلبات بسيطة',text:'وسط غذائي بسيط للخلايا'},{icon:'🏭',title:'كميات كبيرة',text:'مخمّرات صناعية واسعة'},{icon:'📦',title:'مساحة صغيرة',text:'منشآت إنتاج مضغوطة'},{icon:'🌍',title:'في أي مكان',text:'لا يعتمد على مزارع حيوانية'},{icon:'✅',title:'أمان',text:'بلا عدوى منقولة بالدم'},{icon:'🧬',title:'مطابق للإنسان',text:'تتابع الأحماض الأمينية البشري نفسه'}]}},
        {title:'إنسولين الإنسان معاد التركيب', tag:'مثال ١', text:['صعب تحديد جين الإنسولين وعزله من كروموسومات الإنسان؛ فاستُخلص **mRNA الإنسولين** من **خلايا بيتا** البنكرياسية (الوحيدة التي تعبّر عن الجين بكثرة).','**ترانسكريبتيز العكسي** → DNA مفرد → **DNA بوليميريز** → **cDNA مزدوج** → قطع بإنزيم القطع نفسه → **بلازميد** → **الأشريكية القولونية**.','تُنمَّى البكتيريا المعدّلة في **أجهزة تخمير** ضخمة، ويُستخلص الإنسولين ويُنقّى.','متوافر منذ عام **1983**؛ ميزته الرئيسية **التوافر** لتلبية الطلب المتزايد دون الاعتماد على البنكرياس الحيواني.'], vis:'insulin_production', cap:'الشكل ٥-٣: إنتاج الإنسولين من البكتيريا المعدّلة جينيًا', q:{t:'mcq', q:'لماذا استُخلص mRNA من خلايا بيتا تحديدًا؟', opts:['لأنها الخلايا الوحيدة التي تحوي DNA','لأنها الخلايا الوحيدة التي تعبّر عن جين الإنسولين وتحوي كمية كبيرة من mRNA الإنسولين','لأنها لا تحوي إنترونات','لأنها خلايا بكتيرية'], a:1, why:'الجين موجود في كل الخلايا، لكن mRNA الإنسولين يوجد بكثرة فقط في الخلايا التي تعبّر عنه.'}},
        {title:'من البكتيريا إلى الخميرة: إنسولين أفضل', tag:'مثال ١', text:['يُصنَّع إنسولين الإنسان حاليًا في **خلايا خميرة** معدّلة أو **خلايا حيوانية**؛ لأن حقيقيات النواة تحوي **جهاز جولجي** يجمّع ويثني **سلسلتَي عديد الببتيد** بشكل صحيح.','غيّر المهندسون تتابع نيوكليوتيدات الجين لإنتاج **جزيئات مماثلة** للإنسولين بخصائص مختلفة.','**سريع المفعول** (مثل إنسولين **أسبارت**): يُؤخذ قبل الوجبة مباشرة، تأثيره الأقصى بعد ساعتَين ويستمر نحو 4 ساعات.','**بطيء المفعول**: يعمل خلال 8–24 ساعة للحفاظ على تركيز إنسولين الدم قريبًا من الثبات. كثير من المرضى يستخدمون النوعَين معًا.'], vis:{kind:'compare', cols:[{icon:'⚡',title:'إنسولين سريع المفعول',items:['مثال: أسبارت','يُؤخذ قبل الوجبة مباشرة','ذروة بعد ~ساعتَين','يستمر ~4 ساعات']},{icon:'🐢',title:'إنسولين بطيء المفعول',items:['يعمل 8–24 ساعة','يحافظ على مستوى ثابت','يمنع النقص الشديد','يُستخدم مع السريع']}]}},
        {title:'العامل الثامن و ADA', tag:'مثالان', text:['**العامل الثامن (VIII)**: بروتين تخثر الدم يشفّره جين **F8** على الكروموسوم **X**؛ طفرته تسبب **الهيموفيليا**. يُنتَج من خلايا **كلية ومبيض الهامستر** المعدّلة في مخمّرات، بدل الدم المتبرَّع به الذي يحمل خطر عدوى **HIV**.','**أدينوسين دي أمينيز (ADA)**: جين **ADA** على الكروموسوم **20**؛ يحفّز نزع الأمين من الأدينوسين منقوص الأكسجين **السام للخلايا اللمفاوية التائية**.','نقصه أحد أسباب **نقص المناعة المشترك الحاد (SCID)**؛ يُعالج الأطفال بحقن منتظمة من ADA المستخلص من الماشية أو المُنتَج من **الأشريكية القولونية** المعدّلة.','كُشفت حديثًا حالات SCID في بعض محافظات **سلطنة عُمان**.'], vis:{kind:'table', head:['البروتين','الجين وموقعه','المرض عند نقصه','خلايا الإنتاج'], rows:[['الإنسولين','جين الإنسولين (mRNA من خلايا بيتا)','السكري (نوع لا يُنتَج فيه إنسولين)','بكتيريا، خميرة، خلايا حيوانية'],['العامل الثامن VIII','F8 على الكروموسوم X','الهيموفيليا','خلايا كلية ومبيض الهامستر'],['أدينوسين دي أمينيز ADA','ADA على الكروموسوم 20','SCID (نقص المناعة المشترك الحاد)','الأشريكية القولونية (أو من الماشية)']]}, q:{t:'mcq', q:'لماذا يُعدّ العامل الثامن معاد التركيب أكثر أمانًا من المستخلص من الدم المتبرَّع به؟', opts:['لأنه أرخص دائمًا','لأنه يخلو من مخاطر العدوى المنقولة بالدم مثل HIV','لأنه يُحقن مرة واحدة فقط','لأنه مصنوع من دم الهامستر'], a:1, why:'الدم المتبرَّع به من متبرعين كثيرين قد يحمل فيروسات؛ البروتين معاد التركيب لا يحملها.'}},
        {title:'العلاج الجيني: إصلاح الجين نفسه', tag:'امتداد', text:['**العلاج الجيني**: إدخال **أليل سليم** من الجين إلى خلايا المريض بواسطة **ناقل** (فيروس معدّل أو ليبوسوم) ليُعبَّر عنه.','مثال **SCID**: تؤخذ خلايا لمفاوية تائية أو خلايا جذعية من المريض، يُدخل فيها جين **ADA** السليم بناقل فيروسي، وتُعاد إلى الجسم.','مثال **أمراض الشبكية الوراثية (IRDs)**: يُحقن أليل سليم بناقل فيروسي في خلايا الشبكية لتحسين البصر.','**العلاج الجيني الجسدي** (خلايا الجسم، لا يُورَّث) مقابل **علاج الخلايا الجنسية (الخط الجرثومي)** (الأمشاج أو الجنين المبكر، يُورَّث) — الأخير مرفوض أخلاقيًا على نطاق واسع.'], note:'💡 يختلف العلاج الجيني عن حقن البروتين معاد التركيب: هنا يحصل المريض على الجين نفسه ليصنع البروتين بنفسه.', vis:'gene_therapy', cap:'العلاج الجيني: أليل سليم يحمله ناقل إلى الخلية الهدف'},
        {title:'ما الفحص الجيني؟', tag:'فحص', text:['**الفحص الجيني**: تحليل DNA الشخص للتحقق من وجود **أليل** أو أكثر من الأليلات المرتبطة بمرض؛ يُجرى على **الأجنة** وحديثي الولادة والأطفال والبالغين.','الاختبار نفسه للمصاب ذي الأعراض (تشخيص) وللأقارب بلا أعراض (**فحص**)؛ في **هنتنغتون** يُضخَّم جين **HTT** بـ PCR ويُفصل كهربائيًا لتحديد أطوال الأليلَين.','**التليف الكيسي (CF)**: من أكثر الأمراض الوراثية الخطيرة شيوعًا لدى ذوي الأصل الشمال أوروبي (نحو 1 من كل 2000 ولادة)؛ ينتج من أليل **متنحٍ** لجين **CFTR** (منظّم النقل عبر الغشاء).','**سرطان الثدي**: طفرات **BRCA1** و**BRCA2** (بروتينان يشاركان في التحكم في دورة الخلية وإصلاح DNA) تُورَّث كاختلال **سائد** وتزيد خطر الإصابة؛ الفحص يتيح **علاجات وقائية** وتغيير نمط الحياة.','تُستخدم **مسابير DNA** موسومة و**الميكروأري** لفحص أليلات كثيرة معًا، مع **الاستشارة الوراثية** لشرح النتائج وخيارات الأسرة.'], vis:'genetic_screening', cap:'الفحص الجيني: مسبار DNA، ميكروأري، واستشارة وراثية', q:{t:'mcq', q:'أي مما يأتي يُصنَّف «فحصًا جينيًا» لا «تشخيصًا»؟', opts:['اختبار شخص ظهرت عليه أعراض هنتنغتون لتأكيد التشخيص','اختبار شقيق سليم لا تظهر عليه أعراض لمعرفة إن كان يحمل أليل HTT الطافر','قياس جلوكوز الدم لمريض سكري','تصوير الرئة لمريض التليف الكيسي'], a:1, why:'الفحص الجيني يُجرى لمن لا تظهر عليهم أعراض؛ الاختبار نفسه لكن الغرض مختلف.'}},
        {title:'التشخيص قبل الولادة', tag:'فحص', text:['**فحص السائل الأمنيوسي** (Amniocentesis) في الأسبوع **15–16**: تُوجَّه الإبرة بـ **الموجات فوق الصوتية** بعيدًا عن الجنين والمشيمة؛ يبحث غالبًا عن **الطفرات الكروموسومية**.','**فحص الخملات المشيمية (CVS)** في الأسبوع **10–13**: خزعة صغيرة من **الكوريون** بإبرة أقل من **0.8 mm**؛ تحذير **أبكر**، لكن كلا الفحصَين يزيد خطر الإجهاض نحو **1–2%**.','**الفحص غير الجراحي قبل الولادة**: أجزاء DNA من **خلايا المشيمة** (طرازها الجيني كالجنين) تنتقل إلى **دم الأم** وتُعزل وتُفحص.','**تتابع DNA الجنين** يكشف: عدد الكروموسومات (متلازمة **داون**: كروموسوم 21 إضافي)، تركيبها (متلازمة **إيمانويل**: قطعة من 11 على 22)، واختلالات الجين المفرد (**CFTR**).'], vis:{kind:'table', head:['الطريقة','التوقيت','العينة','الخطر'], rows:[['فحص السائل الأمنيوسي','الأسبوع 15–16','سائل أمنيوسي بإبرة موجَّهة بالموجات فوق الصوتية','زيادة خطر الإجهاض ~1–2%'],['فحص الخملات المشيمية CVS','الأسبوع 10–13','خزعة من الكوريون (إبرة < 0.8 mm)','زيادة خطر الإجهاض ~1–2%، لكن أبكر'],['الفحص غير الجراحي','مبكر','DNA الجنين من دم الأم','لا خطر على الجنين']]}, q:{t:'mcq', q:'علم زوجان أنهما غير متماثلَي الأليلات لأليل CFTR الطافر، وسيُختار جنين للغرس بعد فحص خزعة. ما الطراز الجيني للجنين المرجَّح غرسه؟', opts:['متماثل الأليلات للأليل الطافر','غير متماثل الأليلات أو متماثل للأليل السليم','متماثل الأليلات للأليل الطافر فقط','أي جنين لأن المرض سائد'], a:1, why:'المرض متنحٍ؛ الجنين السليم مظهريًا إما متماثل للأليل السليم أو حامل (غير متماثل الأليلات).'}},
        {title:'الاعتبارات الاجتماعية والأخلاقية للفحص الجيني', tag:'أخلاقيات', text:['تؤكد **اللجنة الوطنية لأخلاقيات البيولوجيا** في سلطنة عُمان أهمية نشر الوعي بأخلاقيات البيولوجيا.','**مؤيدة**: علاجات وقائية ونصائح نمط حياة (سرطان الثدي)، فوائد اقتصادية (الفحص أقل كلفة من العلاج الطويل)، قرارات مدروسة، معرفة فرص التوريث قبل الإنجاب، اختيار أجنة سليمة في الإخصاب خارج الرحم.','**معارضة**: قلق وعلاجات وقائية غير ضرورية، لا علاج لبعض الأمراض (هنتنغتون)، سوء استخدام (اختيار جنس الجنين)، السؤال الأخلاقي حول إنهاء الحمل، إنفاق الأموال على الرعاية الأساسية بدلًا منه، «إنجاب» أشقاء لتوفير أنسجة مطابقة (المملكة المتحدة 2004).'], vis:{kind:'compare', cols:[{icon:'👍',title:'اعتبارات مؤيدة',items:['علاج وقائي قبل الأعراض (سرطان الثدي)','تغيير نمط الحياة لتقليل الخطر','الفحص والوقاية أقل كلفة من العلاج','حق اتخاذ قرارات مدروسة','معرفة فرص التوريث قبل الإنجاب','اختيار أجنة سليمة للغرس']},{icon:'👎',title:'اعتبارات معارضة',items:['قلق وقرارات مبنية على «ما قد يحدث»','لا علاج لهنتنغتون؛ ما فائدة المعرفة؟','سوء استخدام: رفض أجنة حسب الجنس','معضلة إنهاء الحمل','الأموال أولى بالرعاية الأساسية للفقراء','أشقاء «منقذون» لتوفير أنسجة']}]}, cap:'الجدول ٢-٣: بعض الاعتبارات الاجتماعية والأخلاقية المؤيدة والمعارضة للفحص الجيني'},
        {title:'خلاصة الدرس', tag:'خلاصة', text:['**البروتينات معادة التركيب** (الإنسولين، العامل الثامن، ADA): متوافرة، آمنة، بشرية، تُنتَج في بكتيريا أو خميرة أو خلايا ثدييات.','**العلاج الجيني**: إدخال أليل سليم بناقل (SCID، أمراض الشبكية).','**الفحص الجيني**: كشف أليلات المرض (BRCA1/2، هنتنغتون، CF) قبل الأعراض، وقبل الولادة (السائل الأمنيوسي، CVS، غير الجراحي).','لكل فحص **اعتبارات اجتماعية وأخلاقية** مؤيدة ومعارضة، وتساعد **الاستشارة الوراثية** الأسر على القرار.'], vis:{kind:'flow', steps:[{icon:'🧬',t:'الجين'},{icon:'🦠',t:'كائن معدّل'},{icon:'💊',t:'بروتين معاد التركيب'},{icon:'🔬',t:'فحص جيني'},{icon:'🤝',t:'استشارة وراثية'}]}}
      ],

      slides:[
        {title:'هل تُطعم الجينات العالم؟', tag:'تمهيد', text:['يزداد سكان العالم، وتُفقد أراضٍ زراعية منخفضة بسبب **ارتفاع مستوى سطح البحر**؛ فهل تساعد الهندسة الجينية في **زيادة الإنتاج**؟','معظم النباتات المعدّلة جينيًا محاصيل عُدِّلت لتكون **مقاومة لمبيدات الأعشاب** أو **للآفات الحشرية**.','أهداف الدرس: شرح أمثلة (فول الصويا المقاوم لمبيدات الأعشاب، القطن المقاوم للحشرات، السلمون المعدّل)، ومناقشة **الآثار الأخلاقية والاجتماعية** لاستخدام الكائنات المعدّلة في إنتاج الغذاء.'], vis:{kind:'cards', items:[{icon:'🌱',title:'مقاومة مبيدات الأعشاب',text:'فول الصويا والذرة'},{icon:'🐛',title:'مقاومة الحشرات',text:'قطن وذرة Bt'},{icon:'🍚',title:'تحسين الجودة',text:'الأرز الذهبي'},{icon:'🐟',title:'حيوانات معدّلة',text:'سلمون المحيط الأطلسي'}]}},
        {title:'المحاصيل المقاومة لمبيدات الأعشاب', tag:'مثال ١', text:['تسمح للمزارع برشّ **مبيد الأعشاب** لقتل الأعشاب الضارة بينما يبقى المحصول (مثل **الذرة**) دون أن يتأثر.','**غليفوسات** يثبّط إنزيمًا له صلة بتركيب **فينيل ألانين** و**تيروسين** و**تربتوفان**؛ يُمتص عبر الأوراق وينتقل إلى **القمم النامية** فيموت النبات لعجزه عن بناء البروتينات.','بعض الكائنات الدقيقة تحوي نسخة من الإنزيم **لا تتأثر** بالغليفوسات؛ نُقل الجين من سلالة من بكتيريوم **الأجرعية المورمة (Agrobacterium)** إلى **فول الصويا**.','النتيجة: استفادة كاملة من الموارد، تكاليف أقل، وإنتاجية أعلى.'], vis:{kind:'flow', steps:[{icon:'🦠',t:'جين إنزيم مقاوم من Agrobacterium'},{icon:'🌱',t:'نقله إلى فول الصويا'},{icon:'🚿',t:'رش الحقل بغليفوسات'},{icon:'🥀',t:'الأعشاب تموت'},{icon:'🌾',t:'المحصول ينمو بلا منافسة'}]}, q:{t:'mcq', q:'كيف يقتل غليفوسات النبات غير المعدّل؟', opts:['يذيب الجدار الخلوي','يثبّط إنزيمًا لازمًا لبناء ثلاثة أحماض أمينية فتتوقف البروتينات في مناطق النمو','يمنع امتصاص الماء','يحرق الأوراق بالحرارة'], a:1, why:'دون فينيل ألانين وتيروسين وتربتوفان لا تُبنى البروتينات الضرورية في القمم النامية.'}},
        {title:'مخاوف بيئية من مقاومة مبيدات الأعشاب', tag:'مخاوف', text:['قد تصبح النباتات المعدّلة **أعشابًا زراعية** عندما تنمو في حقول محاصيل أخرى.','قد تنقل **حبوب اللقاح** الجين المقاوم إلى **الأقارب البرية** للمحصول → نسل هجين = **أعشاب غازية**.','قد تسود **الأعشاب المقاومة** بسبب الاستخدام الكثيف للمبيد نفسه؛ وُجدت نباتات طافرة مقاومة قرب حقول استُخدم فيها غليفوسات بكثافة.','لكن مبيدات الأعشاب تُستخدم على نطاق واسع أصلًا؛ فالتقنية الجينية **ليست بالضرورة** المسؤولة عن ازدياد المقاومة التي قد تنشأ حيث لا تُزرع محاصيل معدّلة.','في عُمان: مرسوم سلطاني عام **2006** بإصدار **قانون المبيدات** لتنظيم إنتاجها واستيرادها وتداولها.'], vis:{kind:'cards', items:[{icon:'🌿',title:'أعشاب زراعية',text:'المحصول المعدّل ينمو حيث لا نريده'},{icon:'🐝',title:'انتقال الجين',text:'حبوب اللقاح تنقل المقاومة للأقارب البرية'},{icon:'💪',title:'أعشاب مقاومة',text:'الاستخدام الكثيف للمبيد يختار الطافرات المقاومة'},{icon:'📜',title:'قانون المبيدات 2006',text:'تنظيم المبيدات في سلطنة عُمان'}]}},
        {title:'المحاصيل المقاومة للحشرات: سمّ Bt', tag:'مثال ٢', text:['**سمّ Bt**: سمّ مبيد للحشرات تنتجه بكتيريوم **العصوية التورنجية (Bacillus thuringiensis)**.','يُنقل جين السمّ (**cry**) إلى نباتات المحاصيل باستخدام بكتيريوم **الأجرعية المورمة** كناقل، مع **محفّز** نباتي ليُعبَّر عنه في خلايا النبات.','تزرع أصناف Bt من **القطن** و**الذرة** وفول الصويا وبذور اللفت الزيتية والتبغ في الولايات المتحدة والصين والبرازيل.','تقلّل الخسائر من آفات مثل **دودة لوزة القطن** و**خنفساء القطن**، وتقلّل رش المبيدات الحشرية، فتزيد الإنتاجية وتخفّف التكاليف.'], vis:'gm_crops', cap:'المحاصيل المعدّلة: ذرة Bt، مقاومة مبيد الأعشاب، والأرز الذهبي', q:{t:'mcq', q:'لماذا يُربط محفّز بجين سمّ Bt عند إدخاله في النبات؟', opts:['ليقتل الحشرات مباشرة','لكي يرتبط RNA بوليميريز وينسخ الجين فيُعبَّر عنه في خلايا النبات','لتكوين نهايات لاصقة','لمنع انتقال الجين بحبوب اللقاح'], a:1, why:'بدون محفّز لا يُنسخ الجين البكتيري في الخلية النباتية.'}},
        {title:'تحسين الجودة: الأرز الذهبي', tag:'مثال ٣', text:['لا تقتصر الهندسة الجينية على المقاومة؛ يمكن تحسين **القيمة الغذائية**.','**الأرز الذهبي**: أُدخلت فيه جينات لإنتاج **بيتا كاروتين** (طليعة فيتامين A) في حبوب الأرز، فيكتسب لونًا ذهبيًا.','الهدف: مواجهة **نقص فيتامين A** الذي يسبب العمى وضعف المناعة لدى أطفال في مناطق يعتمد غذاؤها على الأرز.','مثال على استخدام الهندسة الجينية لتحسين **جودة** المحاصيل، وليس **إنتاجيتها** فقط.'], vis:{kind:'compare', cols:[{icon:'🍚',title:'أرز عادي',items:['لا بيتا كاروتين في الحبوب','نقص فيتامين A حيث يُعتمد عليه','حبوب بيضاء']},{icon:'🌾',title:'الأرز الذهبي',items:['جينات لإنتاج بيتا كاروتين','مصدر لفيتامين A','حبوب ذهبية اللون']}]}, note:'💡 مثال إضافي للإثراء؛ أمثلة الكتاب الأساسية هي مقاومة مبيدات الأعشاب في فول الصويا، ومقاومة الحشرات في القطن، والسلمون المعدّل جينيًا.'},
        {title:'الحيوانات المعدّلة جينيًا: سلمون المحيط الأطلسي', tag:'مثال ٤', text:['الحيوانات المعدّلة لإنتاج الغذاء **أندر** من المحاصيل. مثال: سلمون المحيط الأطلسي المعدّل (**أكوا أدفانتج**) المطوَّر في الولايات المتحدة وكندا.','أُدخل في **بويضة مخصبة** جين **هرمون النمو** من سلمون **شينوك** مع **محفّز** من سمك **بوت المحيطات**.','ينتج هرمون النمو **طوال العام** لا في الربيع والصيف فقط → حجم السوق في **18 شهرًا** بدل **3 أعوام**.','تُربّى **إناث عقيمة** فقط (ثلاثية المجموعة الكروموسومية 3n) في **خزانات أرضية**، فتقلّ قدرتها على منافسة السمك البري؛ أعلنت **FDA** أنه من غير المرجح أن يؤثر في البيئة وأنه آمن كغذاء.'], vis:{kind:'steps', steps:[{icon:'🐟',t:'جين هرمون النمو من سلمون شينوك'},{icon:'🔛',t:'محفّز من سمك بوت المحيطات'},{icon:'🥚',t:'إدخالهما في بويضة مخصبة من سلمون الأطلسي'},{icon:'📈',t:'نمو طوال العام → حجم السوق في 18 شهرًا'},{icon:'🔒',t:'إناث عقيمة 3n في خزانات أرضية'}]}, q:{t:'mcq', q:'لماذا يُقترح تربية إناث عقيمة فقط من السلمون المعدّل في خزانات أرضية؟', opts:['لأنها تنمو أسرع من الذكور','لتقليل احتمال هروبها وتكاثرها ومنافستها للسمك البري في البيئة الطبيعية','لأن الذكور لا تنتج هرمون النمو','لأن الخزانات أرخص من البحر'], a:1, why:'العقم والعزل الأرضي يقلّلان الخطر البيئي، وهو ما ساعد FDA على الموافقة.'}},
        {title:'لماذا تستثمر الشركات في المحاصيل المعدّلة؟', tag:'تبرير', text:['التبرير: الزراعة تحتاج إلى **زيادة إنتاج المحاصيل** لتوفير الغذاء لسكان العالم.','يجب أن تكون الأراضي الزراعية **أكثر إنتاجية** بعد فقدان أراضٍ منخفضة بسبب **ارتفاع مستوى سطح البحر**.','الاستثمار في مقاومة الحشرات يقلّل **الخسائر الفادحة** قبل الحصاد وبعده.','لكن كثيرين **يشككون** في هذه الادعاءات ويقلقون من التأثيرات البيئية.'], vis:{kind:'bars', items:[{t:'سلمون عادي',v:36,label:'36 شهرًا'},{t:'سلمون معدّل',v:18,label:'18 شهرًا'}], cap:'الزمن للوصول إلى حجم السوق: مثال على زيادة الإنتاجية بالتعديل الجيني'}},
        {title:'المخاوف تجاه المحاصيل المعدّلة جينيًا', tag:'مخاوف', text:['**بيئية**: قد تصبح أعشابًا ضارة أو تغزو المواطن الطبيعية؛ انتقال الجينات بحبوب اللقاح إلى **المحاصيل العضوية**.','**صحية**: قد تكون سامة أو تسبب **ردود فعل تحسسية**؛ **بقايا سامة** من مبيدات الأعشاب في المحصول.','**اقتصادية**: البذور المعدّلة **مرتفعة الثمن**، وشراؤها **كل موسم** بدل حفظ بذور الأصناف التقليدية.','**التنوع الحيوي**: خطر **فقدان الأصناف التقليدية** ذات الجينات المرغوبة لأماكن معيّنة ولمناخ متغيّر → برامج حفظ و**بنوك بذور** (بنك البذور في عُمان يحوي أكثر من 50% من بذور النباتات المحلية).'], vis:{kind:'compare', cols:[{icon:'👍',title:'حجج مؤيدة',items:['غذاء لسكان العالم المتزايدين','إنتاجية أعلى من أراضٍ أقل','خسائر أقل من الآفات','رش أقل للمبيدات الحشرية','تحسين القيمة الغذائية']},{icon:'👎',title:'مخاوف',items:['أعشاب غازية وانتقال الجينات','سمّية أو حساسية','بقايا مبيدات سامة','بذور غالية تُشترى كل موسم','فقدان الأصناف التقليدية والتنوع الحيوي']}]}, q:{t:'mcq', q:'لماذا يُعدّ حفظ الأصناف التقليدية في بنوك البذور مهمًا؟', opts:['لأنها أغلى ثمنًا','لأنها تحوي جينات مرغوبة لأماكن معيّنة قد تفيد في عالم يتغيّر مناخه','لأنها لا تُزرع أبدًا','لأنها معدّلة جينيًا'], a:1, why:'التنوع الجيني في الأصناف المحلية مورد للمستقبل قد يُفقد مع انتشار المحاصيل المعدّلة.'}},
        {title:'ماذا تقول الأدلة؟ والأخلاق', tag:'تقييم', text:['أدلة **قليلة** على انتقال جينات إلى الحياة البرية، ولم يظهر «**عشب خارق**» مقاوم لمبيدات الأعشاب يقلّل نمو المحاصيل.','أمثلة **قليلة جدًا** على أغذية معدّلة مسببة للحساسية؛ فالتأثير على المجتمعات البشرية **قليل** حتى الآن، مع تأثيرات محتملة لا تُقاس بعد مثل عواقب **خسارة التنوع الحيوي**.','**الآثار الاجتماعية**: الآثار المفيدة للتقنية على المجتمعات؛ **الأخلاق**: معايير توافق عليها مجموعة لتنظيم سلوكها وتمييز المقبول من غير المقبول.','يجب أن تقرّر كل مجموعة أولًا هل **البحث** في التقنية الجينية مقبول، ثم تتبنّى التقنيات الناجحة.'], vis:{kind:'table', head:['المخاوف','ما تقوله الأدلة حتى الآن'], rows:[['انتقال الجينات إلى البرية','أدلة قليلة'],['ظهور عشب خارق مقاوم','لم يظهر'],['أغذية معدّلة مسببة للحساسية','أمثلة قليلة جدًا'],['خسارة التنوع الحيوي','تأثير محتمل لا يُقاس بعد']]}},
        {title:'خلاصة الدرس', tag:'خلاصة', text:['**مقاومة مبيدات الأعشاب** (فول الصويا، غليفوسات، جين من Agrobacterium) و**مقاومة الحشرات** (سمّ Bt من العصوية التورنجية في القطن والذرة).','**الأرز الذهبي** (بيتا كاروتين) و**السلمون المعدّل** (هرمون نمو شينوك + محفّز بوت المحيطات؛ 18 شهرًا بدل 3 أعوام؛ إناث عقيمة 3n).','**فوائد**: إنتاجية وجودة أعلى وخسائر أقل؛ **مخاوف**: انتقال الجينات، أعشاب مقاومة، حساسية، كلفة البذور، فقدان الأصناف التقليدية.','القرار الأخلاقي والاجتماعي مسؤولية **المجتمع**؛ وفي عُمان **قانون المبيدات** و**بنك البذور** أمثلة على الحوكمة والحفظ.'], vis:{kind:'cycle', center:'🌍', steps:[{icon:'🌱',t:'محصول معدّل'},{icon:'📈',t:'إنتاج أعلى'},{icon:'⚠️',t:'مخاوف بيئية'},{icon:'⚖️',t:'تقييم أخلاقي'},{icon:'📜',t:'تنظيم وحفظ'}]}}
      ],

        {title:'ما الاتزان الداخلي؟', tag:'مفهوم', text:['**الاتزان الداخلي (Homeostasis)**: الحفاظ على بيئة داخلية **ثابتة نسبيًا** للخلايا داخل الجسم.','يتطلب **مراقبة** المتغيرات داخل الجسم وخارجه.','يشمل ضبط: درجة حرارة الجسم، فضلات الأيض (CO₂ واليوريا)، **pH الدم**، **تركيز الجلوكوز**، **جهد الماء** للدم، وتركيز غازَي التنفس.','سنركّز في هذه الوحدة على **جهد الماء** و**تركيز الجلوكوز** في الدم.'], vis:{kind:'cards', items:[{icon:'🌡️',title:'درجة الحرارة',text:'36–38°C'},{icon:'💨',title:'CO₂ واليوريا',text:'فضلات الأيض'},{icon:'🧪',title:'pH الدم',text:'ثابت تقريبًا'},{icon:'🍬',title:'الجلوكوز',text:'تركيزه في الدم'},{icon:'💧',title:'جهد الماء',text:'للدم والسائل النسيجي'},{icon:'🫧',title:'O₂ و CO₂',text:'غازا التنفس'}]}, q:{t:'mcq', q:'أي مما يأتي ليس من العوامل التي يضبطها الاتزان الداخلي؟', opts:['جهد الماء للدم','تركيز الجلوكوز في الدم','لون الجلد الوراثي','الرقم الهيدروجيني للدم'], a:2, why:'لون الجلد صفة وراثية ثابتة لا تُضبط بحلقات تغذية راجعة، بخلاف العوامل الفسيولوجية المتغيرة.'}},
        {title:'أين تعيش الخلية؟ السائل النسيجي', tag:'البيئة المباشرة', text:['البيئة المباشرة للخلايا الحية هي **السائل النسيجي**.','تحافظ الثدييات على متغيرات السائل النسيجي بالتحكم في قيم العوامل الفسيولوجية في **الدم**.','فإذا ضُبط الدم، ضُبط السائل النسيجي، وضُبطت بيئة الخلية.'], vis:{kind:'flow', steps:[{icon:'🩸',t:'الدم (يُضبط)'},{icon:'💧',t:'السائل النسيجي'},{icon:'🔬',t:'الخلايا'}]}, cap:'ضبط الدم يضبط بيئة الخلية المباشرة.'},
        {title:'حلقة التغذية الراجعة السلبية', tag:'الآلية', text:['**المنبّه (Stimulus)**: تغيّر في البيئة الداخلية أو الخارجية.','**المستقبل (Receptor)**: خلية أو نسيج يتحسس المنبّه ويرسل المعلومات إلى **مركز التحكم** (الجهاز العصبي المركزي أو غدة صماء).','**المستجيب (Effector)**: عضلات وغدد تنفّذ **الإجراء التصحيحي (Corrective action)** الذي **يعكس** التغيّر.','**التغذية الراجعة السلبية**: التغيّر في العامل يؤدي إلى عمليات تعيده إلى وضعه الطبيعي.'], vis:'homeostasis_loop', cap:'الشكل ١-٤: مستقبل ← منسّق ← مستجيب ← إجراء تصحيحي يعيد القيمة إلى النقطة المرجعية.', q:{t:'mcq', q:'لماذا تُسمّى التغذية الراجعة «سلبية»؟', opts:['لأنها ضارة بالجسم','لأن الاستجابة تعكس اتجاه التغيّر الأصلي','لأنها تعمل في الظلام فقط','لأنها تزيد التغيّر الأولي'], a:1, why:'الاستجابة تعمل في الاتجاه المعاكس للتغيّر: إذا ارتفع العامل خُفض، وإذا انخفض رُفع.'}},
        {title:'النقطة المرجعية والتأرجح', tag:'Reference point', text:['**النقطة المرجعية**: القيمة **المثالية** للعامل الفسيولوجي التي يتحكم فيها الجسم.','المراقبة المستمرة والتغذية الراجعة السلبية تجعل العامل **يتأرجح** حول النقطة المرجعية (لا يثبت تمامًا).','مثال: درجة حرارة جسم الإنسان تتأرجح بين **36°C و38°C**، ويتأثر النطاق بالعمر والجنس والوقت من اليوم.'], note:'💡 يوجد دائمًا تأخير زمني بين التغيّر وبدء التصحيح، ولذلك يحدث التذبذب.', vis:{kind:'cycle', center:'🎯', steps:[{icon:'📉',t:'ينخفض العامل دون النقطة المرجعية'},{icon:'👁️',t:'مستقبلات تتحسس التغيّر'},{icon:'💪',t:'مستجيبات تعمل لرفع العامل'},{icon:'📈',t:'يرتفع العامل فوق النقطة المرجعية'},{icon:'👁️',t:'مستقبلات تتحسس التغيّر'},{icon:'🧊',t:'مستجيبات تعمل لخفض العامل'}]}},
        {title:'جهازا التنسيق في الثدييات', tag:'نقل المعلومات', text:['تتطلب آليات الاتزان الداخلي **نقل المعلومات** بين أجزاء الجسم.','**الجهاز العصبي**: معلومات على شكل **نبضات كهربائية** على طول الخلايا العصبية.','**جهاز الغدد الصماء**: مراسيل كيميائية تُسمّى **هرمونات** تنتقل في الدم كإشارات خلوية **بعيدة المدى**.','**الهرمون**: مادة تفرزها غدة صماء وتنتقل في بلازما الدم إلى جزء آخر من الجسم حيث يكون لها تأثير.'], vis:{kind:'compare', cols:[{icon:'⚡',title:'الجهاز العصبي',items:['نبضات كهربائية','عبر الخلايا العصبية','سريع']},{icon:'🧪',title:'جهاز الغدد الصماء',items:['هرمونات (مراسيل كيميائية)','عبر بلازما الدم','إشارات بعيدة المدى']}]}, q:{t:'mcq', q:'الهرمون هو:', opts:['نبضة كهربائية على طول عصب','مادة تفرزها غدة صماء وتنتقل في بلازما الدم','إنزيم يحلل الفضلات في الكبد','خلية تتحسس المنبّهات'], a:1, why:'الهرمونات مراسيل كيميائية من الغدد الصماء تنتقل في الدم إلى أعضاء مستهدفة.'}},
        {title:'عندما تفشل الحلقة: التغذية الراجعة الإيجابية', tag:'حالة خاصة', text:['**التغذية الراجعة الإيجابية**: تغيّر في العامل يؤدي إلى عمليات **تعزّز** التغيّر الأولي.','مثال: استنشاق هواء غني جدًا بـ CO₂ ← ارتفاع CO₂ في الدم ← المستقبلات تزيد معدل التنفس ← يأخذ الشخص **المزيد** من CO₂ ← تنبيه أكبر ← تنفس أسرع…','لا تؤدي دورًا في الحفاظ على **ثبات** البيئة الداخلية.'], vis:{kind:'flow', steps:[{icon:'😮‍💨',t:'هواء غني بـ CO₂'},{icon:'📈',t:'CO₂ الدم يرتفع'},{icon:'👁️',t:'مستقبلات CO₂ تُنبَّه'},{icon:'🫁',t:'تنفس أسرع'},{icon:'⬆️',t:'دخول CO₂ أكثر'},{icon:'🔁',t:'تنبيه أكبر…'}]}, cap:'التغيّر يعزّز نفسه بدل أن يُعكس.'},
        {title:'الإفراز: التخلص من فضلات الأيض', tag:'Excretion', text:['**الإفراز (Excretion)**: إزالة المنتجات السامة أو فضلات الأيض من الجسم.','أكثر فضلتَين كميةً: **ثاني أكسيد الكربون** (من التنفس الهوائي، يُفرز عبر الرئتين) و**اليوريا**.','**نزع الأمين (Deamination)** في الكبد: تُزال مجموعة الأمين (–NH₂) مع ذرة هيدروجين إضافية من الحمض الأميني الفائض ← **أمونيا (NH₃)** + **حمض كيتو**.','حمض الكيتو يدخل دورة كريبس أو يتحوّل إلى جلوكوز أو جاليكوجين أو دهن.','**دورة اليوريا** تربط الأمونيا بـ CO₂ لتكوين **اليوريا**؛ ينتج البالغ نحو **25–30 g** يوميًا.'], vis:'excretion', cap:'الشكل ٢-٤: نزع الأمين في الكبد ← أمونيا ← يوريا ← الدم ← الكليتان.', q:{t:'mcq', q:'أين تتكوّن اليوريا؟', opts:['في الكليتين','في الكبد','في الرئتين','في الأمعاء'], a:1, why:'تتكوّن اليوريا في خلايا الكبد من نزع الأمين، ثم تنتقل ذائبة في البلازما إلى الكليتين لتُفرز.'}},
        {title:'لماذا أمونيا ← يوريا؟', tag:'مقارنة', text:['**الأمونيا**: شديدة الذوبان و**شديدة السمّية**؛ ترفع pH السيتوبلازم وتتداخل مع التنفس والتأشير الخلوي في الدماغ.','الأسماك في المياه العذبة تنشر الأمونيا مباشرة إلى الماء المحيط.','**اليوريا**: أقل ذوبانًا وسمّية، فهي الناتج الإفرازي النيتروجيني **الرئيسي** في الإنسان.','فضلات نيتروجينية أخرى بكميات صغيرة: **الكرياتينين** و**حمض اليوريك** (من تفكك **البيورينات**، لا الأحماض الأمينية).'], vis:{kind:'table', head:['الفضلة','المصدر','ملاحظة'], rows:[['الأمونيا NH₃','نزع الأمين','سامة جدًا، تُحوَّل فورًا'],['اليوريا','دورة اليوريا (أمونيا + CO₂)','الناتج النيتروجيني الرئيسي'],['حمض اليوريك','تفكك البيورينات','كميات صغيرة'],['الكرياتينين','أيض العضلات','كميات صغيرة']]}},
        {title:'خلاصة الدرس', tag:'ملخص', text:['**الاتزان الداخلي** = بيئة داخلية ثابتة نسبيًا تضبطها **التغذية الراجعة السلبية**: منبّه ← مستقبل ← مركز تحكم ← مستجيب ← إجراء تصحيحي.','العامل **يتأرجح** حول **النقطة المرجعية**.','جهازا التنسيق: **العصبي** (نبضات كهربائية) و**الغدد الصماء** (هرمونات).','**الإفراز**: CO₂ عبر الرئتين، و**اليوريا** من نزع الأمين في الكبد عبر الكليتين.'], vis:{kind:'steps', steps:[{icon:'1️⃣',t:'منبّه يغيّر العامل'},{icon:'2️⃣',t:'مستقبل يتحسس'},{icon:'3️⃣',t:'مركز تحكم يقرّر'},{icon:'4️⃣',t:'مستجيب ينفّذ الإجراء التصحيحي'},{icon:'5️⃣',t:'العامل يعود إلى النقطة المرجعية'}]}}

          {q:'ما ناتجا نزع الأمين المباشران في خلايا الكبد؟', opts:['اليوريا والماء','الأمونيا وحمض الكيتو','الجلوكوز والأكسجين','حمض اليوريك والكرياتينين'], a:1, why:'تُزال مجموعة الأمين مع ذرة هيدروجين لتكوين الأمونيا، ويبقى حمض الكيتو.'},
          {q:'لماذا يحوّل الكبد الأمونيا إلى يوريا فورًا؟', opts:['لأن اليوريا أكثر سمّية','لأن الأمونيا شديدة الذوبان والسمّية وترفع pH السيتوبلازم','لأن اليوريا تُستخدم في التنفس','لأن الأمونيا لا تذوب في الماء'], a:1, why:'الأمونيا سامة جدًا وتتداخل مع الأيض والتأشير الخلوي، فتُحوَّل إلى يوريا الأقل سمّية.'},
          {q:'ما الذي تربطه دورة اليوريا معًا لتكوين اليوريا؟', opts:['الأمونيا وثاني أكسيد الكربون','الجلوكوز والأكسجين','حمض الكيتو والماء','البيورينات والفوسفات'], a:0, why:'تعمل تفاعلات دورة اليوريا على ربط الأمونيا وثاني أكسيد الكربون لتكوين اليوريا.'},
          {q:'لماذا لا يخزّن الجسم البروتين الزائد لكنه لا يهدر أحماضه الأمينية بالكامل؟', opts:['لأن الأحماض الأمينية توفر طاقة مفيدة عبر حمض الكيتو بعد نزع الأمين','لأن البروتين لا يُهضم','لأن الأحماض الأمينية تتحول إلى أمونيا مفيدة','لأن الكليتين تخزّنان البروتين'], a:0, why:'يستفيد الكبد من طاقة الأحماض الأمينية بنزع الأمين؛ حمض الكيتو يدخل التنفس أو يُخزَّن كجلوكوز/جاليكوجين/دهن.'}

        reflect:['كيف يساعدك مفهوم النقطة المرجعية على تفسير ارتفاع حرارتك قليلًا بعد الجري في يوم حار ثم عودتها إلى وضعها الطبيعي؟','لماذا تُعدّ رحلة إلى المريخ لسبعة أشهر تحديًا لآليات الاتزان الداخلي لدى رواد الفضاء؟'],
        summary:'**الاتزان الداخلي** هو الحفاظ على بيئة داخلية ثابتة نسبيًا بواسطة **التغذية الراجعة السلبية**: منبّه ← مستقبل ← مركز تحكم ← مستجيب ← إجراء تصحيحي يعيد العامل إلى **النقطة المرجعية**. يتعاون **الجهاز العصبي** و**جهاز الغدد الصماء** في نقل المعلومات. أما **الإفراز** فيزيل فضلات الأيض، وأهمها CO₂ و**اليوريا** التي تتكوّن في الكبد بـ**نزع الأمين** وتُفرز عبر الكليتين.'

      pre:[
        {t:'tf', q:'يحتوي بول الشخص السليم عادةً على كمية كبيرة من الجلوكوز.', a:false, why:'يُعاد امتصاص كل الجلوكوز من الراشح في الأنيبيب الملتوي القريب، فلا يوجد جلوكوز في بول الشخص السليم.'},
        {t:'mcq', q:'يدخل الدم إلى الكلية عبر:', opts:['الحالب','الشريان الكلوي','الوريد الكلوي','الإحليل'], a:1, why:'تتلقى كل كلية الدم من شريان كلوي وتعيده عبر وريد كلوي؛ الحالب ينقل البول إلى المثانة.'},
        {t:'visual', vis:'kidney', q:'في المقطع الطولي للكلية، ما اسم المنطقة الخارجية الواقعة تحت المحفظة الليفية مباشرة؟', opts:['النخاع','حوض الكلية','القشرة','الحالب'], a:2, why:'القشرة هي المنطقة الخارجية، والنخاع في المركز، وحوض الكلية حيث يرتبط الحالب.'},
        {t:'cloud', q:'اختر التراكيب التي تنتمي إلى الكلية أو الجهاز البولي:', words:[{w:'الحالب',ok:true},{w:'النفرون',ok:true},{w:'الحويصلات الهوائية',ok:false},{w:'محفظة بومان',ok:true},{w:'الكُبيبة',ok:true},{w:'الشعبة الهوائية',ok:false},{w:'القناة الجامعة',ok:true},{w:'الصمام ثلاثي الشرف',ok:false},{w:'التواء هنلي',ok:true},{w:'المرارة',ok:false}], why:'الكلية تتكوّن من آلاف النفرونات (محفظة بومان، الكُبيبة، الأنيبيبات، التواء هنلي) وتصب في القناة الجامعة ثم الحالب.'},
        {t:'open', q:'يخضع مرضى الفشل الكلوي لغسيل الكلى عدة مرات أسبوعيًا. توقّع: ما المواد التي تتراكم في دمهم لو لم يفعلوا؟ ولماذا لا يستطيع الكبد أو الرئتان القيام بعمل الكليتين؟'}

      slides:[
        {title:'مصفاة لا تتوقف', tag:'تمهيد', text:['يدخل نحو **125 mL** من الراشح كل دقيقة إلى الأنيبيبات الملتوية القريبة في كليتَي الإنسان البالغ، أي ما يقارب **180 L** في اليوم!','لكن حجم البول اليومي يبلغ **1.2–2 L** فقط… فأين يذهب الباقي؟','أهداف الدرس: وصف **تركيب الكلية** و**النفرون**، وشرح تكوّن البول بـ **الترشيح الفائق** و**إعادة الامتصاص الانتقائي**.'], note:'💡 كل كلية تحتوي على آلاف الأنيبيبات الدقيقة تُسمّى النفرونات، وكل نفرون مصفاة وماصّة في الوقت نفسه.', vis:'kidney', cap:'الشكل ٣-٤: موضع الكليتين والتراكيب المرتبطة بهما.'},
        {title:'الجهاز البولي ومناطق الكلية', tag:'التركيب العام', text:['تتلقى كل كلية الدم من **الشريان الكلوي** وتعيده عبر **الوريد الكلوي**.','ينقل **الحالب** البول من كل كلية إلى **المثانة**، وينقل **الإحليل** البول من المثانة إلى خارج الجسم.','في المقطع الطولي: **محفظة ليفية** قاسية تحيط بالكلية، تحتها **القشرة (Cortex)**، ثم **النخاع (Medulla)** في المركز، و**حوض الكلية (Renal pelvis)** حيث يرتبط الحالب.'], vis:{kind:'flow', steps:[{icon:'🩸',t:'الشريان الكلوي'},{icon:'🫘',t:'الكلية (قشرة ← نخاع ← حوض)'},{icon:'🧵',t:'الحالب'},{icon:'🫙',t:'المثانة'},{icon:'🚪',t:'الإحليل'}]}, cap:'مسار البول من الكلية إلى خارج الجسم.', q:{t:'mcq', q:'أي تركيب ينقل البول من الكلية إلى المثانة؟', opts:['الإحليل','الحالب','الوريد الكلوي','القناة الجامعة'], a:1, why:'الحالب أنبوبة ضيقة من كل كلية إلى المثانة؛ الإحليل أنبوبة مفردة من المثانة إلى الخارج.'}},
        {title:'النفرون: الوحدة التركيبية والوظيفية', tag:'Nephron', text:['**محفظة بومان**: تركيب على شكل كأس يحيط بشبكة شعيرات دموية تُسمّى **الكُبيبة (Glomerulus)**؛ كلاهما في **القشرة**.','**الأنيبيب الملتوي القريب** ← **التواء هنلي** (على شكل U في **النخاع**: طرف نازل وطرف صاعد) ← **الأنيبيب الملتوي البعيد** في القشرة.','تتصل الأنيبيبات البعيدة لعدة نفرونات بـ **قناة جامعة** تمتد عبر النخاع إلى **حوض الكلية**.','السائل في النفرون هو **الراشح**؛ وعندما يصل القناة الجامعة يُسمّى **البول**.'], vis:'nephron', cap:'الشكل ٦-٤: النفرون وأجزاؤه من محفظة بومان إلى القناة الجامعة.', q:{t:'mcq', q:'أي جزء من النفرون يقع في نخاع الكلية؟', opts:['محفظة بومان','الكُبيبة','التواء هنلي','الأنيبيب الملتوي القريب'], a:2, why:'الكُبيبات ومحافظ بومان والأنيبيبات الملتوية في القشرة، بينما يمتد التواء هنلي والقناة الجامعة في النخاع.'}},
        {title:'تزويد النفرون بالدم', tag:'الأوعية الدموية', text:['يصل الدم إلى كل كُبيبة من فرع من الشريان الكلوي عبر **الشُرَيّن الوارد (Afferent arteriole)**.','تنضم شعيرات الكُبيبة معًا مكوّنة **الشُرَيّن الصادر (Efferent arteriole)**.','يتدفق الدم من الشُرَيّن الصادر إلى شبكة شعيرات تمتد **بجوار بقية النفرون**، ثم إلى وُرَيدات تصب في فرع من **الوريد الكلوي**.'], note:'💡 الدم الذي يغادر الكُبيبة فقد كثيرًا من مائه ومواده المذابة الصغيرة، فبلازماه أقل وبروتيناته أكثر تركيزًا؛ وهذا سيساعد لاحقًا في إعادة امتصاص الماء.', vis:{kind:'flow', steps:[{icon:'🩸',t:'فرع الشريان الكلوي'},{icon:'➡️',t:'الشُرَيّن الوارد'},{icon:'🧶',t:'شعيرات الكُبيبة'},{icon:'⬅️',t:'الشُرَيّن الصادر'},{icon:'🕸️',t:'شعيرات حول الأنيبيب'},{icon:'💙',t:'وُرَيدات ← الوريد الكلوي'}]}},
        {title:'المرحلة الأولى: الترشيح الفائق', tag:'Ultrafiltration', text:['**الترشيح الفائق**: ترشيح على النطاق الجزيئي يفصل الجزيئات الصغيرة عن الأكبر (البروتينات).','يفصل دم الكُبيبة عن تجويف محفظة بومان **ثلاث طبقات**: **بطانة الشعيرة** (ثقوب قطرها 60–80 nm)، **الغشاء القاعدي** (شبكة ألياف كولاجين وبروتينات سكرية)، و**الخلايا الرجلاء (Podocytes)** ذات الامتدادات الشبيهة بالأقدام وبينها فجوات.','القوة الدافعة: **الضغط المرتفع** في شعيرات الكُبيبة و**انخفاض تركيز المواد المذابة** في محفظة بومان يدفعان السائل من البلازما إلى المحفظة.'], vis:'ultrafiltration', cap:'الشكل ٨-٤: الغشاء القاعدي يعمل كمرشّح جزيئي.', q:{t:'mcq', q:'أي طبقة تعمل كالمرشّح الجزيئي الذي يمنع مرور بروتينات البلازما؟', opts:['بطانة الشعيرة الدموية','الغشاء القاعدي','الخلايا الرجلاء','الشُرَيّن الوارد'], a:1, why:'ثقوب البطانة وفجوات الخلايا الرجلاء تسمح بمرور المواد المذابة، لكن الغشاء القاعدي يمنع البروتينات الكبيرة.'}},
        {title:'ماذا يمرّ وماذا يبقى؟', tag:'الجدول ١-٤', text:['أي بروتين كتلته الجزيئية أعلى من **69 000 g/mol** تقريبًا لا يستطيع المرور عبر الغشاء القاعدي.','**خلايا الدم الحمراء والبيضاء والصفائح** أكبر من ثقوب البطانة فتبقى في الدم.','راشح الكُبيبة **يطابق بلازما الدم** تقريبًا… ما عدا أنه يخلو تقريبًا من **بروتينات البلازما**.'], vis:{kind:'table', head:['المادة','في البلازما (g/L)','في الراشح (g/L)'], rows:[['الماء','900','900'],['بروتينات البلازما','80.0','0.05'],['الأحماض الأمينية','0.5','0.5'],['الجلوكوز','1.0','1.0'],['اليوريا','0.3','0.3'],['حمض اليوريك','0.04','0.04'],['الكرياتينين','0.01','0.01'],['أيونات غير عضوية (Na⁺، K⁺، Cl⁻)','7.2','7.2']]}, cap:'الجدول ١-٤: تراكيز المواد في الدم وفي راشح الكُبيبة.'},
        {title:'المرحلة الثانية: إعادة الامتصاص الانتقائي', tag:'الأنيبيب الملتوي القريب', text:['**إعادة الامتصاص الانتقائي**: حركة مواد معيّنة من الراشح لتعود إلى الدم؛ يحدث **معظمها** في الأنيبيب الملتوي القريب.','تكيّفات خلاياه الطلائية المكعبة: **خملات دقيقة** (مساحة سطح كبيرة ملامسة للراشح)، **العديد من الميتوكندريا** (ATP للنقل النشط)، و**غشاء قاعدي منثنٍ (مطوي)** يحمل مضخات **Na⁺–K⁺** كثيرة.','١- مضخات Na⁺–K⁺ في الغشاء القاعدي تدفع Na⁺ خارج الخلية إلى الدم ← ينخفض تركيزه في السيتوبلازم.','٢- ينتشر Na⁺ من الراشح إلى الخلية عبر **بروتينات ناقلة مشتركة (Co-transporter)** تحمل معه **الجلوكوز** أو حمضًا أمينيًا.'], vis:'reabsorption', cap:'الشكل ٩-٤: إعادة الامتصاص في الأنيبيب الملتوي القريب.', q:{t:'mcq', q:'لماذا تحتوي خلايا الأنيبيب الملتوي القريب على العديد من الميتوكندريا؟', opts:['لتخزين الجلوكوز','لإنتاج ATP اللازم لمضخات Na⁺–K⁺','لترشيح البروتينات','لإنتاج اليوريا'], a:1, why:'النقل النشط للصوديوم عبر الغشاء القاعدي يحتاج إلى ATP تنتجه الميتوكندريا.'}},
        {title:'النقل النشط الثانوي وعودة الماء', tag:'الآلية', text:['يدخل الجلوكوز الخلية **بعكس** منحدر تركيزه مقترنًا بدخول Na⁺ **مع** منحدره: هذا **نقل نشط ثانوي** (ATP يُستخدم لضخ Na⁺ لا الجلوكوز).','ثم ينتشر الجلوكوز عبر بروتين ناقل في الغشاء القاعدي إلى الدم؛ يُعاد امتصاص **كل** الجلوكوز فلا يوجد جلوكوز في البول، وكذلك الأحماض الأمينية والفيتامينات وكثير من Na⁺ و Cl⁻.','إزالة المواد المذابة ترفع **جهد الماء** للراشح وتخفضه في الدم ← ينتقل الماء إلى الدم **بالأسموزية**.','من 125 mL/min من الراشح ينتقل نحو **64%** فقط إلى التواء هنلي.'], note:'💡 هذه طريقة النقل نفسها التي تنقل السكروز إلى الخلايا المرافقة في اللحاء (الصف الحادي عشر).', vis:{kind:'steps', steps:[{icon:'1️⃣',t:'مضخة Na⁺–K⁺ تُخرج Na⁺ إلى الدم (نقل نشط بـ ATP)'},{icon:'2️⃣',t:'Na⁺ يدخل من الراشح مع الجلوكوز عبر ناقل مشترك'},{icon:'3️⃣',t:'الجلوكوز ينتشر عبر الغشاء القاعدي إلى الدم'},{icon:'4️⃣',t:'جهد ماء الراشح يرتفع وجهد ماء الدم ينخفض'},{icon:'5️⃣',t:'الماء يعود إلى الدم بالأسموزية'}]}},
        {title:'التواء هنلي والأنيبيب البعيد والقناة الجامعة', tag:'ضبط تركيز البول', text:['وظيفة **التواء هنلي**: تكوين تركيز عالٍ جدًا من **Na⁺ و Cl⁻** في السائل النسيجي للنخاع، جزئيًا بـ **النقل النشط** من خلايا المنطقة السميكة في **الطرف الصاعد**.','قد يبلغ تركيز المذاب في النخاع **أربعة أضعاف** تركيزه في البلازما ← جهد ماء منخفض جدًا يسحب الماء من **القناة الجامعة** بالأسموزية، فيحتفظ الجسم بالماء ويُمنع **الجفاف**.','في **الأنيبيب الملتوي البعيد** والقناة الجامعة: يُضخ Na⁺ إلى السائل النسيجي بالنقل النشط، ويُنقل K⁺ بالنقل النشط إلى الأنيبيب؛ ويتغيّر معدلهما لتنظيم تركيزهما في الدم.','يتحكم هرمون **ADH** في مقدار خروج الماء من القناة الجامعة (الدرس القادم).'], note:'💡 الجربوع والجرذ الكنغري في الصحراء يكوّنان بولًا يزيد تركيزه 20 مرة عن البلازما بفضل نخاع سميك نسبيًا؛ أما الإنسان فأقصى تركيز 4 أضعاف.', vis:'loop_henle', cap:'الشكل: التواء هنلي يبني تدرّج تركيز في النخاع، والقناة الجامعة تفقد الماء.'},
        {title:'خلاصة الدرس', tag:'ملخص', text:['الكلية: **محفظة ليفية** ← **قشرة** ← **نخاع** ← **حوض الكلية** ← **الحالب**.','النفرون: **محفظة بومان والكُبيبة** ← **الأنيبيب الملتوي القريب** ← **التواء هنلي** ← **الأنيبيب الملتوي البعيد** ← **القناة الجامعة**.','**الترشيح الفائق**: ضغط مرتفع + غشاء قاعدي كمرشّح ← راشح كالبلازما بلا بروتينات.','**إعادة الامتصاص الانتقائي**: خملات دقيقة، ميتوكندريا كثيرة، مضخات Na⁺–K⁺، نقل مشترك للجلوكوز، وماء بالأسموزية.'], vis:{kind:'flow', steps:[{icon:'🩸',t:'دم في الكُبيبة'},{icon:'🫗',t:'ترشيح فائق'},{icon:'🔁',t:'إعادة امتصاص انتقائي'},{icon:'🧂',t:'تدرّج تركيز في النخاع'},{icon:'💧',t:'بول'}]}}
      ],

        {title:'التنظيم الأسموزي', tag:'Osmoregulation', text:['**التنظيم الأسموزي**: التحكم في **جهد الماء** للدم والسائل النسيجي عن طريق التحكم في المحتوى المائي و/أو تركيز الأيونات (بخاصة Na⁺).','جزء مهم من الاتزان الداخلي، ويشمل **تحت المهاد (Hypothalamus)** و**الغدة النخامية الخلفية** و**الكليتين**.'], vis:{kind:'flow', steps:[{icon:'🩸',t:'تغيّر جهد الماء للدم'},{icon:'🧠',t:'تحت المهاد (مستقبلات أسموزية)'},{icon:'🔮',t:'الغدة النخامية الخلفية'},{icon:'💧',t:'ADH في الدم'},{icon:'🫘',t:'القناة الجامعة في الكلية'}]}},
        {title:'المستقبلات الأسموزية وإفراز ADH', tag:'المستقبل والمنسّق', text:['**المستقبلات الأسموزية (Osmoreceptors)**: خلايا عصبية حسية متخصصة في **تحت المهاد** تراقب جهد الماء للدم باستمرار.','عند انخفاض جهد الماء دون النقطة المرجعية ← نبضات عصبية على طول الخلايا العصبية إلى نهاياتها في **الغدة النخامية الخلفية**.','تحفّز النبضات إطلاق **ADH**: هرمون **ببتيدي** من **تسعة أحماض أمينية**، يدخل الدم في الشعيرات وينتقل إلى جميع أنحاء الجسم.'], vis:'adh', cap:'الشكل ١٣-٤: خلايا عصبية في تحت المهاد تنتج ADH وتطلقه في الغدة النخامية الخلفية.', q:{t:'mcq', q:'ما طبيعة هرمون ADH؟', opts:['ستيرويد دهني','ببتيد من تسعة أحماض أمينية','سكر متعدد','حمض نووي'], a:1, why:'ADH هرمون ببتيدي صغير يتكوّن من تسعة أحماض أمينية.'}},
        {title:'الخلايا المستهدفة: القناة الجامعة', tag:'المستجيب', text:['الخلايا المستهدفة من ADH هي **خلايا القناة الجامعة**.','يجعل ADH أغشية خلايا تجويف القناة الجامعة **أكثر نفاذية للماء** من المعتاد.','**ADH مرتفع** ← الخلايا منفذة للماء ← يُعاد امتصاص الماء بالأسموزية إلى السائل النسيجي **المركّز** في النخاع ← **كمية صغيرة من البول المركّز**.','**ADH منخفض** ← الخلايا غير منفذة ← **كمية كبيرة من البول المخفف**.'], vis:{kind:'compare', cols:[{icon:'🏜️',title:'ADH مرتفع (نقص الماء)',items:['خلايا القناة الجامعة منفذة للماء','الماء يخرج بالأسموزية إلى النخاع المركّز','بول قليل ومركّز']},{icon:'🚰',title:'ADH منخفض (فائض الماء)',items:['خلايا القناة الجامعة غير منفذة للماء','السائل يمرّ دون فقد ماء','بول كثير ومخفف']}]}, cap:'الشكل ١٤-٤: تأثير ADH على إعادة امتصاص الماء من القنوات الجامعة.'},
        {title:'الأكوابورينات: كيف يعمل ADH؟', tag:'Aquaporins', text:['**الأكوابورينات**: قنوات بروتينية ممتدة عبر غشاء سطح الخلية تسمح بحركة الماء عبرها.','١- يرتبط ADH بمستقبلات في غشاء سطح خلايا القناة الجامعة.','٢- ينشّط ذلك سلسلة تفاعلات إنزيمية تنتهي بإنتاج **إنزيم فوسفوريليز نشط**.','٣- يسبب الفوسفوريليز انتقال **حويصلات** تحوي أكوابورينات إلى غشاء سطح الخلية، ٤- **تندمج** معه.','٥- ينتقل الماء عبر الأكوابورينات من التجويف إلى السائل النسيجي المركّز في النخاع **مع منحدر جهد الماء**.'], vis:{kind:'steps', steps:[{icon:'1️⃣',t:'ADH يرتبط بمستقبل غشائي'},{icon:'2️⃣',t:'تفاعلات إنزيمية ← فوسفوريليز نشط'},{icon:'3️⃣',t:'حويصلات الأكوابورينات تتحرك إلى الغشاء'},{icon:'4️⃣',t:'اندماج الحويصلات بالغشاء'},{icon:'5️⃣',t:'الماء يخرج بالأسموزية ← بول مركّز'}]}, cap:'الشكل ١٥-٤: كيف يزيد ADH إعادة امتصاص الماء في القناة الجامعة.', q:{t:'mcq', q:'ما الذي يزيد نفاذية خلايا القناة الجامعة للماء عند وجود ADH؟', opts:['زيادة عدد الأكوابورينات في غشاء سطح الخلية','زيادة الميتوكندريا','ضخ الماء بالنقل النشط','انفتاح ثقوب في الغشاء القاعدي'], a:0, why:'تندمج حويصلات تحمل أكوابورينات مع الغشاء فيزداد عدد قنوات الماء.'}},
        {title:'تركيز السائل على طول النفرون', tag:'الشكل ١٧-٤', text:['يدخل السائل الأنيبيب الملتوي القريب بتركيز نحو **300 mmol/kg** (كالبلازما).','يرتفع التركيز في قاع **التواء هنلي** إلى نحو **1200 mmol/kg** ثم ينخفض في الطرف الصاعد.','بوجود ADH يخرج الماء من **القناة الجامعة** حتى يساوي جهد ماء البول جهد ماء النخاع ← بول مركّز؛ وبغيابه يبقى البول مخففًا.','في الشكل ١١-٤: يختفي **الجلوكوز والأحماض الأمينية** من الراشح في الأنيبيب القريب، بينما يرتفع **تركيز اليوريا** النسبي كلما أُزيل الماء.'], vis:{kind:'bars', items:[{t:'الأنيبيب القريب',v:300,label:'300'},{t:'قاع التواء هنلي',v:1200,label:'1200'},{t:'الأنيبيب البعيد',v:150,label:'منخفض'},{t:'القناة الجامعة + ADH',v:1200,label:'1200'},{t:'القناة الجامعة بلا ADH',v:100,label:'منخفض'}], cap:'تركيز السوائل mmol/kg (تقريبي حسب الشكل ١٧-٤)'}},
        {title:'ماذا لو شربت كثيرًا؟', tag:'فائض الماء', text:['يرتفع جهد الماء للدم ← المستقبلات الأسموزية **غير قابلة للتنبيه** ← تتوقف الخلايا العصبية في النخامية الخلفية عن إفراز ADH.','تنتقل الأكوابورينات **بعيدًا** عن غشاء سطح الخلية وتعود إلى السيتوبلازم في حويصلات ← الخلايا **غير منفذة** للماء.','يتدفق السائل عبر القناة الجامعة دون فقد ماء ← **كمية كبيرة من البول المخفف** تتجمع في حوض الكلية ← الحالب ← المثانة.','**تأخير زمني**: نصف كمية ADH في الدم تتفكك كل **15–20 دقيقة**، وتحتاج الأكوابورينات **10–15 دقيقة** لتنتقل من الغشاء إلى السيتوبلازم.'], vis:{kind:'flow', steps:[{icon:'🚰',t:'شرب ماء كثير'},{icon:'📈',t:'يرتفع جهد الماء للدم'},{icon:'😴',t:'المستقبلات الأسموزية لا تُنبَّه'},{icon:'⛔',t:'يتوقف إفراز ADH'},{icon:'📦',t:'الأكوابورينات تعود إلى الحويصلات'},{icon:'💦',t:'بول كثير مخفف'}]}, q:{t:'mcq', q:'لماذا لا تستجيب خلايا القناة الجامعة فورًا لتوقف إفراز ADH؟', opts:['لأن الكلية تتوقف عن العمل','لأن تفكك ADH الموجود في الدم يستغرق وقتًا (نصفه كل 15–20 دقيقة)','لأن الأكوابورينات تُصنَّع من جديد','لأن المثانة ممتلئة'], a:1, why:'يبقى ADH في الدم حتى يتفكك تدريجيًا، ثم تحتاج الأكوابورينات 10–15 دقيقة للانتقال إلى السيتوبلازم.'}},
        {title:'حلقة التغذية الراجعة السلبية لجهد الماء', tag:'التكامل', text:['**المنبّه**: انخفاض جهد الماء للدم (تعرّق، قلة شرب).','**المستقبل**: المستقبلات الأسموزية في تحت المهاد.','**المنسّق**: تحت المهاد ← الغدة النخامية الخلفية تفرز **ADH**.','**المستجيب**: خلايا القناة الجامعة (أكوابورينات) ← **الإجراء التصحيحي**: إعادة امتصاص الماء ← يرتفع جهد الماء نحو النقطة المرجعية ← يقل إفراز ADH.'], note:'💡 في الأنيبيب البعيد والقناة الجامعة يُضخ Na⁺ إلى السائل النسيجي وK⁺ إلى الأنيبيب بالنقل النشط، بمعدلات متغيّرة لتنظيم تركيزهما في الدم؛ وهما مهمان لتوصيل النبضات العصبية.', vis:'homeostasis_loop', cap:'الماء مثال كامل على التغذية الراجعة السلبية.'},
        {title:'خلاصة الدرس', tag:'ملخص', text:['**التنظيم الأسموزي** = التحكم في جهد الماء للدم.','**المستقبلات الأسموزية** في **تحت المهاد** ← **الغدة النخامية الخلفية** تطلق **ADH** (ببتيد من 9 أحماض أمينية).','ADH ← خلايا **القناة الجامعة** ← إدخال **أكوابورينات** في الغشاء ← إعادة امتصاص الماء بالأسموزية إلى نخاع مركّز ← **بول قليل مركّز**.','فائض الماء ← لا ADH ← سحب الأكوابورينات ← **بول كثير مخفف**.'], vis:{kind:'cycle', center:'💧', steps:[{icon:'📉',t:'ينخفض جهد الماء للدم'},{icon:'🧠',t:'مستقبلات أسموزية تُنبَّه'},{icon:'💉',t:'إفراز ADH'},{icon:'🚪',t:'أكوابورينات في القناة الجامعة'},{icon:'🔁',t:'إعادة امتصاص الماء'},{icon:'📈',t:'يعود جهد الماء إلى المرجع'}]}}

          {q:'لماذا يكون تركيز البول في القناة الجامعة بوجود ADH قريبًا من 1200 mmol/kg؟', opts:['لأن الماء يخرج حتى يتساوى جهد ماء البول مع جهد ماء النخاع المركّز','لأن اليوريا تُضخ إلى البول','لأن الجلوكوز يُضاف إلى البول','لأن الأكوابورينات تُغلق'], a:0, why:'يخرج الماء بالأسموزية إلى أن يساوي جهد ماء البول جهد ماء السائل النسيجي في النخاع.'},
          {q:'شرب الكحول يقلل إفراز ADH. ما الخطر المتوقع؟', opts:['احتباس الماء وتورّم الجسم','فقد كثير من الماء في بول مخفف والجفاف','ظهور الجلوكوز في البول','ارتفاع ضغط الكُبيبة'], a:1, why:'نقص ADH يعني قناة جامعة غير منفذة للماء ← بول كثير مخفف ← خطر الجفاف.'},
          {q:'لماذا الأكوابورينات شائعة جدًا في أغشية الخلايا النباتية والحيوانية؟', opts:['لأن الماء لا يمرّ بسهولة عبر الطبقة الدهنية ويلزم قنوات لحركته السريعة','لأنها تنقل الجلوكوز','لأنها تنتج ATP','لأنها تحلل اليوريا'], a:0, why:'الأكوابورينات تسمح بانتشار الماء عبر الأغشية بمعدل عالٍ في خلايا كثيرة.'},
          {q:'في حلقة التحكم بجهد الماء، ما المستجيب؟', opts:['المستقبلات الأسموزية','خلايا القناة الجامعة','الغدة النخامية الخلفية','الشُرَيّن الوارد'], a:1, why:'المستجيب ينفّذ الإجراء التصحيحي: خلايا القناة الجامعة تعيد امتصاص الماء.'},
          {q:'أي عبارة تفسّر لماذا تُعدّ هذه الآلية تغذية راجعة سلبية؟', opts:['لأن إعادة امتصاص الماء ترفع جهد الماء فيقل إفراز ADH ويعود العامل إلى المرجع','لأن ADH يزيد باستمرار كلما ازداد الماء','لأن الجسم يفقد ماءً أكثر كلما تعرّق','لأن الأكوابورينات لا تتغيّر'], a:0, why:'الاستجابة تعكس التغيّر الأصلي وتوقف نفسها عند عودة العامل إلى قيمته المرجعية.'}
        ],
        reflect:['لماذا يُنصح الصائم في الأيام الحارة بشرب الماء تدريجيًا بعد الإفطار بدلًا من كمية كبيرة مرة واحدة؟','لو تعطّلت مستقبلات ADH في خلايا القناة الجامعة، فما الأعراض التي تتوقعها؟ ولماذا لن يفيد إعطاء ADH إضافي؟'],
        summary:'يُضبط **جهد الماء** للدم بـ **التنظيم الأسموزي**: تتحسس **المستقبلات الأسموزية** في **تحت المهاد** انخفاضه فتطلق **الغدة النخامية الخلفية** هرمون **ADH** الببتيدي، الذي يرتبط بمستقبلات خلايا **القناة الجامعة** فتندمج حويصلات **الأكوابورينات** بالغشاء ويُعاد امتصاص الماء بالأسموزية إلى النخاع المركّز ← **بول قليل مركّز**. وعند فائض الماء يتوقف ADH وتُسحب الأكوابورينات ← **بول كثير مخفف**.'
      }
    },
    { id:'l4_4', num:'٤-٤', title:'التحكم في تركيز جلوكوز الدم', en:'Control of blood glucose concentration', ws:false,
      preIntro:'بعد وجبة العيد الغنية بالحلوى يرتفع سكر دمك، وبعد ساعات من الصيام ينخفض… ومع ذلك يبقى ضمن نطاق ضيق. كيف؟',
      pre:[
        {t:'tf', q:'تعتمد خلايا الدماغ على الجلوكوز فقط في تنفسها، لذا يُعدّ انخفاض جلوكوز الدم خطيرًا عليها.', a:true, why:'خلايا الدماغ تعتمد على الجلوكوز وحده في التنفس، فانخفاضه الشديد يعطّل وظائفها.'},
        {t:'mcq', q:'العضو الذي يفرز هرمونَي الإنسولين والجلوكاجون هو:', opts:['الكبد','البنكرياس','الغدة النخامية','الكلية'], a:1, why:'يفرزهما نسيج الغدة الصماء في البنكرياس (جُزيرات لانجرهانس).'},
        {t:'visual', vis:'glucose_control', q:'من الرسم: أي خلايا في جُزيرات لانجرهانس تفرز الجلوكاجون؟', opts:['خلايا بيتا','خلايا ألفا','خلايا الكبد','خلايا العضلات'], a:1, why:'خلايا ألفا تفرز الجلوكاجون، وخلايا بيتا تفرز الإنسولين.'},
        {t:'cloud', q:'اختر ما يرتبط بتنظيم جلوكوز الدم:', words:[{w:'الإنسولين',ok:true},{w:'الجلوكاجون',ok:true},{w:'الجاليكوجين',ok:true},{w:'الأكوابورينات',ok:false},{w:'جُزيرات لانجرهانس',ok:true},{w:'الكبد',ok:true},{w:'الثغور',ok:false},{w:'cAMP',ok:true},{w:'اليوريا',ok:false},{w:'الأدرينالين',ok:true}], why:'الإنسولين والجلوكاجون (من جُزيرات لانجرهانس) والأدرينالين يعملون على الكبد عبر مراسيل ثانية مثل cAMP لتخزين الجاليكوجين أو تفكيكه.'},
        {t:'open', q:'يحقن مرضى السكري أنفسهم بالإنسولين ولا يبتلعونه. توقّع السبب. وكيف يمكنهم متابعة فاعلية الحقن؟'}
      ],
      slides:[
        {title:'لماذا نضبط السكر؟', tag:'تمهيد', text:['تُنقل الكربوهيدرات في الدم على شكل **جلوكوز** ذائب في البلازما.','يحوي كل **100 mL** من دم الإنسان الطبيعي عادة **80–120 mg** جلوكوز (**4.4–6.7 mmol/L**).','انخفاضه ← قد لا يكفي للتنفس، خصوصًا في **خلايا الدماغ** التي تعتمد على الجلوكوز فقط.','ارتفاعه الشديد ← مشكلات رئيسية تؤثر سلبًا في سلوك الخلايا الطبيعي.'], note:'💡 هدف الدرس: شرح كيف يعمل الإنسولين والجلوكاجون، ومبادئ التأشير الخلوي، وكيف نقيس الجلوكوز.', vis:{kind:'cards', items:[{icon:'🩸',title:'النطاق الطبيعي',text:'80–120 mg/100 mL'},{icon:'🧠',title:'الدماغ',text:'يعتمد على الجلوكوز فقط'},{icon:'📉',title:'انخفاض',text:'نقص طاقة للخلايا'},{icon:'📈',title:'ارتفاع',text:'اضطراب سلوك الخلايا'}]}},
        {title:'جُزيرات لانجرهانس: المستقبل ومركز التحكم', tag:'البنكرياس', text:['يحوي نسيج الغدة الصماء في البنكرياس مجموعات من الخلايا تُسمّى **جُزيرات لانجرهانس**.','**خلايا ألفا (α)** تفرز **الجلوكاجون** ← يزيد تركيز الجلوكوز.','**خلايا بيتا (β)** تفرز **الإنسولين** ← يخفض تركيز الجلوكوز.','تعمل خلايا α و β **كمستقبلات ومركز تحكم** معًا، وينظّم الهرمونان عمل **المستجيبات** (الكبد، العضلات، الأنسجة الدهنية).','يتغيّر التركيز ضمن حدود حول **النقطة المرجعية** (الشكل ١٩-٤).'], vis:'glucose_control', cap:'الشكل: خلايا بيتا وألفا في جُزيرات لانجرهانس تضبط الجلوكوز حول النقطة المرجعية.', q:{t:'mcq', q:'ما دور خلايا ألفا وبيتا في حلقة الاتزان الداخلي للجلوكوز؟', opts:['مستجيبات فقط','مستقبلات ومركز تحكم','ناقلات للجلوكوز','مخازن للجاليكوجين'], a:1, why:'تتحسس خلايا الجُزيرات تركيز الجلوكوز وتقرر إفراز الهرمون المناسب.'}},
        {title:'ارتفاع الجلوكوز: الإنسولين يعمل', tag:'خفض الجلوكوز', text:['يرتبط الإنسولين بمستقبلات في **غشاء سطح الخلية** لخلايا الكبد والعضلات والأنسجة الدهنية.','في **العضلات**: يشير المستقبل للخلية فتنتقل حويصلات تحمل ناقل الجلوكوز **GLUT4** إلى غشاء سطح الخلية وتندمج معه ← يزداد دخول الجلوكوز بالانتشار المسهّل.','في **الكبد**: ناقلات **GLUT2** (وGLUT1) تبقى دائمًا في الغشاء ولا يغيّر الإنسولين توزيعها.','يحفز الإنسولين إنزيم **جلوكوكاينيز** (يفسفر الجلوكوز فيُحتجز داخل الخلية) وإنزيمَي **فوسفوفركتوكاينيز** و**جاليكوجين سينثيز** ← **تكوّن الجاليكوجين (Glycogenesis)**.','الجاليكوجين: مخزن طاقة **قصير الأمد** في الكبد والعضلات، بروابط جاليكوسيدية **1,4** وتفرّعات **1,6**؛ أما الأنسجة الدهنية فتحوّل الجلوكوز إلى **دهون** (طويل الأمد).'], vis:{kind:'steps', steps:[{icon:'1️⃣',t:'الإنسولين يرتبط بمستقبل في غشاء سطح الخلية'},{icon:'2️⃣',t:'حويصلات GLUT4 تتحرك إلى الغشاء وتندمج (العضلات)'},{icon:'3️⃣',t:'الجلوكوز ينتشر إلى الخلية مع منحدر تركيزه'},{icon:'4️⃣',t:'جلوكوكاينيز يفسفر الجلوكوز فيُحتجز'},{icon:'5️⃣',t:'جاليكوجين سينثيز يبني الجاليكوجين'}]}, cap:'الشكل ٢٠-٤: يزيد الإنسولين نفاذية خلايا العضلات للجلوكوز بتحريك GLUT4 إلى الغشاء.', q:{t:'mcq', q:'لماذا يُحتجز الجلوكوز داخل الخلية بعد فسفرته؟', opts:['لأنه يتحول إلى دهن فورًا','لأن الجلوكوز المفسفر لا يمرّ عبر بروتينات نقل الجلوكوز','لأن الغشاء يتصلّب','لأن الإنسولين يغلق كل القنوات'], a:1, why:'جلوكوكاينيز يضيف فوسفات للجلوكوز، والجلوكوز المفسفر لا تنقله ناقلات الجلوكوز فيبقى داخل الخلية.'}},
        {title:'كيف تفرز خلية بيتا الإنسولين؟', tag:'آلية الإفراز', text:['يدخل الجلوكوز خلية بيتا عبر **ناقل جلوكوز** ويُؤكسد في التنفس ← يرتفع **ATP**.','ارتفاع ATP يغلق **قنوات K⁺ الحساسة لـ ATP** ← يتوقف خروج K⁺ فيصبح داخل الخلية أقل سالبية ← **إزالة استقطاب** الغشاء.','إزالة الاستقطاب تفتح **قنوات Ca²⁺ المبوبة بالفولتية** ← يدخل Ca²⁺.','Ca²⁺ يحفز **حويصلات الإنسولين** على الاندماج بالغشاء وإخراج الإنسولين إلى الدم (إفراز خلوي).'], note:'💡 كلما ارتفع الجلوكوز، زاد ATP، وزاد إفراز الإنسولين — رابط مباشر بين المنبّه والاستجابة.', vis:'insulin_secretion', cap:'خلية بيتا: جلوكوز ← ATP ← إغلاق K⁺ ← إزالة استقطاب ← Ca²⁺ ← إفراز الإنسولين.'},
        {title:'انخفاض الجلوكوز: الجلوكاجون يعمل', tag:'رفع الجلوكوز', text:['عند انخفاض الجلوكوز: خلايا **α** تفرز **الجلوكاجون**، وخلايا **β** **توقف** إفراز الإنسولين ← يقل معدل امتصاص الكبد والعضلات للجلوكوز.','يرتبط الجلوكاجون بمستقبلات محددة على **خلايا الكبد فقط**؛ **لا توجد** مستقبلات للجلوكاجون على خلايا العضلات.','**تحلل الجاليكوجين (Glycogenolysis)**: جاليكوجين فوسفوريليز يزيل مونمرات الجلوكوز من «النهايات» العديدة ← ينتشر الجلوكوز إلى الدم.','**استحداث الجلوكوز (Gluconeogenesis)**: تكوّن جلوكوز «جديد» من الأحماض الأمينية والأحماض الدهنية والجليسرول والبيروفات واللاكتات.'], vis:{kind:'compare', cols:[{icon:'🔽',title:'الإنسولين (خلايا β)',items:['يُفرز عند ارتفاع الجلوكوز','مستقبلات على الكبد والعضلات والدهن','دخول الجلوكوز + تكوّن الجاليكوجين','النتيجة: خفض الجلوكوز']},{icon:'🔼',title:'الجلوكاجون (خلايا α)',items:['يُفرز عند انخفاض الجلوكوز','مستقبلات على خلايا الكبد فقط','تحلل الجاليكوجين + استحداث الجلوكوز','النتيجة: رفع الجلوكوز']}]}},
        {title:'التأشير الخلوي: المرسال الثاني cAMP', tag:'الشكل ٢١-٤', text:['الجلوكاجون بروتين لا يعبر الغشاء؛ ١- يرتبط بمستقبل غشائي فيتغيّر شكله وينشّط **بروتين G**.','٢- بروتين G ينشّط إنزيم **أدينيليل سيكليز** الغشائي، ٣- الذي يحوّل **ATP** إلى **AMP الحلقي (cAMP)**: **المرسال الثاني**.','٤- cAMP ينشّط **بروتين كاينيز A** ← يفسفر وينشّط **كاينيز فوسفوريليز** ← يفسفر وينشّط **جاليكوجين فوسفوريليز**.','٥- **تتالي إنزيمات** يؤدي إلى **تضخيم الإشارة**: جزيء جلوكاجون واحد ← آلاف جزيئات الجلوكوز، فالاستجابة سريعة.'], vis:'camp_cascade', cap:'الشكل ٢١-٤: تتالي الإنزيمات يضخّم الإشارة الأصلية التي تصل إلى سطح الخلية.', q:{t:'mcq', q:'ما الإنزيم الذي يحوّل ATP إلى cAMP؟', opts:['بروتين كاينيز A','أدينيليل سيكليز','جاليكوجين فوسفوريليز','كاينيز فوسفوريليز'], a:1, why:'أدينيليل سيكليز إنزيم غشائي ينشّطه بروتين G ويحفز تكوين المرسال الثاني cAMP.'}},
        {title:'الأدرينالين والتذبذب الحتمي', tag:'إضافات', text:['**الأدرينالين** يزيد جلوكوز الدم أيضًا: يرتبط بمستقبلات **مختلفة** على خلايا الكبد لكنه ينشّط **التتالي نفسه** ← تفكك الجاليكوجين.','يحفز الأدرينالين تفكك جاليكوجين **العضلات** أثناء التمارين، ويبقى الجلوكوز الناتج **داخل** خلايا العضلات للتنفس.','لا يبقى جلوكوز الدم ثابتًا مطلقًا حتى لدى الأصحاء: **التأخير الزمني** بين التغيّر وبدء التصحيح يسبب **التذبذب** حول النقطة المرجعية.'], vis:{kind:'flow', steps:[{icon:'🏃',t:'تمرين/توتر'},{icon:'⚡',t:'أدرينالين'},{icon:'🔗',t:'مستقبلات خاصة على الكبد والعضلات'},{icon:'🔁',t:'التتالي نفسه (cAMP)'},{icon:'🍬',t:'تفكك الجاليكوجين'}]}},
        {title:'السكري (Diabetes mellitus)', tag:'مرض شائع', text:['المصابون بالسكري **غير قادرين** على التحكم في تركيز جلوكوز الدم.','**النوع الأول**: يظهر مبكرًا في الحياة؛ تتوقف خلايا **β** عن إنتاج الإنسولين ← علاج بـ **حقن الإنسولين** (لا يُؤخذ بالفم لأنه بروتين يُهضم).','**النوع الثاني**: الأكثر شيوعًا، يظهر متأخرًا؛ **تفشل الخلايا في الاستجابة** للإنسولين؛ يرتبط بالبدانة والأطعمة الغنية بالسكروز.','**العتبة الكلوية**: إذا زاد الجلوكوز عنها لا يُعاد امتصاص كل الجلوكوز في الأنيبيب القريب ← **جلوكوز في البول**.','الشكل ٢٤-٤: بعد تناول الجلوكوز يرتفع سكر المصاب إلى نحو **220 mg/100 mL** ويبقى مرتفعًا، ويكاد إنسولينه لا يرتفع؛ أما السليم فيرتفع إنسولينه سريعًا ويعود سكره إلى وضعه خلال ساعتين.'], vis:'diabetes', cap:'مقارنة النوع الأول (لا إنسولين) والنوع الثاني (مقاومة الإنسولين).', q:{t:'mcq', q:'لماذا لا يمكن تناول الإنسولين بالفم؟', opts:['لأنه سكر يمتصه الفم','لأنه بروتين تحلّله إنزيمات الهضم قبل امتصاصه','لأنه غاز','لأنه لا يذوب في الماء'], a:1, why:'الإنسولين هرمون ببتيدي؛ تهضمه البروتييزات في القناة الهضمية فيفقد فعاليته.'}},
        {title:'قياس الجلوكوز: الشرائط والمستشعر الحيوي', tag:'التطبيق', text:['**شرائط الاختبار**: إنزيما **جلوكوز أكسيديز** و**بيروكسيديز** مثبَّتان على لوحة صغيرة مغطاة بغشاء سليلوزي يسمح بمرور الجزيئات الصغيرة فقط.','جلوكوز + أكسجين ←(جلوكوز أكسيديز)← **حمض جلوكونيك** + **بيروكسيد الهيدروجين**.','بيروكسيد الهيدروجين + **كروموجين** عديم اللون ←(بيروكسيديز)← **كروموجين مؤكسد** (بنّي) + ماء؛ كلما زاد الجلوكوز كان اللون أدكن (لوحة ألوان 0 إلى 20 mg/mL أو أكثر).','**المستشعر الحيوي (Biosensor)**: جلوكوز أكسيديز مثبَّت على **قطب**؛ يُنتج التفاعل **تيارًا كهربائيًا** صغيرًا يتناسب مع تركيز الجلوكوز ← **قراءة رقمية** مباشرة من عيّنة دم صغيرة.','ميزة الشرائط على محلول بندكت: نوعية للجلوكوز، سريعة، لا تحتاج إلى تسخين.'], vis:'glucose_test', cap:'الشريط يعطي لونًا يُقارن بلوحة، والمستشعر يعطي رقمًا.'},
        {title:'خلاصة الدرس', tag:'ملخص', text:['**ارتفاع الجلوكوز** ← خلايا **β** تفرز **الإنسولين** ← GLUT4 إلى غشاء العضلات، وتكوّن **الجاليكوجين** في الكبد والعضلات، ودهون في الأنسجة الدهنية ← **يخفض** الجلوكوز.','**انخفاض الجلوكوز** ← خلايا **α** تفرز **الجلوكاجون** ← مستقبل على الكبد ← بروتين G ← أدينيليل سيكليز ← **cAMP** ← بروتين كاينيز A ← كاينيز فوسفوريليز ← جاليكوجين فوسفوريليز ← **تحلل الجاليكوجين** + **استحداث الجلوكوز** ← **يرفع** الجلوكوز.','**السكري**: نوع أول (لا إنسولين) ونوع ثانٍ (لا استجابة)؛ يُكشف بـ **شرائط الاختبار** (جلوكوز أكسيديز + بيروكسيديز) و**المستشعرات الحيوية**.'], vis:{kind:'cycle', center:'🍬', steps:[{icon:'📈',t:'يرتفع الجلوكوز'},{icon:'🅱️',t:'خلايا β: إنسولين'},{icon:'🏦',t:'تخزين جاليكوجين'},{icon:'📉',t:'ينخفض الجلوكوز'},{icon:'🅰️',t:'خلايا α: جلوكاجون'},{icon:'💸',t:'تحلل الجاليكوجين'}]}}
      ],

          {q:'أي ناقل جلوكوز تحرّكه حويصلات إلى غشاء خلايا العضلات استجابة للإنسولين؟', opts:['GLUT1','GLUT2','GLUT4','الأكوابورين'], a:2, why:'GLUT4 في العضلات يُنقل إلى الغشاء بتحفيز الإنسولين؛ GLUT1 و GLUT2 يبقيان دائمًا في الغشاء.'},

          {q:'تكوّن الجلوكوز من الأحماض الأمينية والجليسرول واللاكتات يُسمّى:', opts:['تكوّن الجاليكوجين','تحلل الجاليكوجين','استحداث الجلوكوز','الترشيح الفائق'], a:2, why:'استحداث الجلوكوز (Gluconeogenesis) = تكوين جلوكوز «جديد» من مصادر غير كربوهيدراتية.'},

          {q:'من الشكل ٢٤-٤: بعد تناول الجلوكوز، ما الذي يميّز استجابة الشخص المصاب بالسكري؟', opts:['يرتفع إنسولينه سريعًا ويعود سكره طبيعيًا','يبقى سكره مرتفعًا ويكاد إنسولينه لا يرتفع','ينخفض سكره دون المعتاد','يرتفع جلوكاجونه فقط'], a:1, why:'المصاب لا يفرز إنسولينًا كافيًا (أو لا يستجيب له) فيبقى الجلوكوز مرتفعًا لساعات.'},
          {q:'ما ميزة شرائط الاختبار على محلول بندكت في الكشف عن الجلوكوز؟', opts:['تحتاج إلى تسخين أطول','نوعية للجلوكوز وسريعة ولا تحتاج إلى تسخين','تكشف كل السكريات المختزلة','تعطي تيارًا كهربائيًا'], a:1, why:'جلوكوز أكسيديز نوعي للجلوكوز، والنتيجة فورية دون تسخين، مع لوحة ألوان تقديرية.'},
          {q:'ما ميزة المستشعر الحيوي على شرائط اختبار البول؟', opts:['يقيس الجلوكوز في الدم مباشرة ويعطي قراءة رقمية دقيقة وسريعة','يعتمد على مقارنة الألوان','لا يحتاج إلى إنزيم','يكشف اليوريا أيضًا'], a:0, why:'المستشعر يستخدم جلوكوز أكسيديز على قطب وينتج تيارًا يتناسب مع التركيز ← قراءة رقمية مباشرة من الدم.'}
        ],
        reflect:['لماذا يكون تركيز الجلوكاجون في الدم مرتفعًا بعد صيام 12 ساعة وينخفض بعد شرب محلول الجلوكوز؟','الأطعمة الغنية بالسكروز عامل خطر للسكري من النوع الثاني. كيف تربط ذلك بما تعرفه عن الإنسولين ومستقبلاته؟'],
        summary:'تضبط **جُزيرات لانجرهانس** جلوكوز الدم (80–120 mg/100 mL): **خلايا بيتا** تفرز **الإنسولين** الذي يزيد دخول الجلوكوز (GLUT4) ويحفز **تكوّن الجاليكوجين**، و**خلايا ألفا** تفرز **الجلوكاجون** الذي يعمل على الكبد عبر بروتين G وأدينيليل سيكليز و**cAMP** وتتالي إنزيمات مضخِّم ينتهي بـ **جاليكوجين فوسفوريليز** ← **تحلل الجاليكوجين** و**استحداث الجلوكوز**. **السكري** فشل في هذا الضبط، ويُكشف بـ **شرائط الاختبار** (جلوكوز أكسيديز + بيروكسيديز) و**المستشعرات الحيوية**.'

    { id:'l4_5', num:'٤-٥', title:'الاتزان الداخلي في النباتات', en:'Homeostasis in plants', ws:false,
      preIntro:'نخلة في ظهيرة صيف عُماني: تحتاج إلى ثاني أكسيد الكربون لتصنع غذاءها، لكن كل فتحة تفتحها تفقد منها الماء. كيف توازن؟',
      pre:[
        {t:'tf', q:'تفتح الثغور وتغلق فقط عندما يتغيّر الضوء، فإذا وُضع النبات في ظلام دائم توقّف إيقاعها تمامًا.', a:false, why:'تفتح الثغور وتغلق بإيقاع يومي مستمر حتى في ضوء مستمر أو ظلام دائم (تجربة تراديسكانتيا).'},
        {t:'mcq', q:'الغاز الذي يدخل الورقة عبر الثغور ليُستخدم في التمثيل الضوئي هو:', opts:['الأكسجين','النيتروجين','ثاني أكسيد الكربون','بخار الماء'], a:2, why:'يدخل CO₂ بالانتشار عبر الثغور، ويخرج O₂ وبخار الماء (النتح).'},
        {t:'visual', vis:'stomata', q:'من الرسم: ما اسم الخليتَين اللتين تحيطان بفتحة الثغر وتنظّمان فتحه وإغلاقه؟', opts:['خلايا البشرة','الخلايا الحارسة','خلايا النسيج الوسطي','الخلايا المرافقة'], a:1, why:'الخلية الحارسة خلية بشرة على شكل كُلية توجد في زوج يحيط بالثغر.'},
        {t:'cloud', q:'اختر ما يرتبط بفتح الثغور وإغلاقها:', words:[{w:'الخلايا الحارسة',ok:true},{w:'أيونات البوتاسيوم',ok:true},{w:'مضخات البروتون',ok:true},{w:'الإنسولين',ok:false},{w:'ضغط الامتلاء',ok:true},{w:'الأكوابورينات',ok:true},{w:'اليوريا',ok:false},{w:'النتح',ok:true},{w:'الكُبيبة',ok:false},{w:'ألياف السليلوز الدقيقة',ok:true}], why:'مضخات البروتون وK⁺ وضغط الامتلاء والأكوابورينات وألياف السليلوز كلها جزء من آلية فتح الثغر الذي يضبط النتح.'},
        {t:'open', q:'لماذا تُعدّ أوراق النباتات الصحراوية في عُمان صغيرة أو مغطاة بطبقة شمعية؟ وما علاقة ذلك بتوازن الماء وثاني أكسيد الكربون؟'}
      ],
      slides:[
        {title:'معضلة الورقة', tag:'تمهيد', text:['أشجار اللبان في ظفار والنخيل في الباطنة تواجه المعضلة نفسها: فتح الثغور يُدخل **CO₂** لكنه يفقد **الماء** بالنتح.','من المهم للنباتات، كما للحيوانات، الحفاظ على **بيئة داخلية ثابتة**.','أهداف الدرس: وصف تركيب ووظيفة **الخلايا الحارسة**، وشرح كيف تنظّم اتساع **فتحة الثغر**، و**الإيقاع اليومي** واستجابة الثغور للبيئة.'], vis:{kind:'cards', items:[{icon:'🌬️',title:'CO₂ يدخل',text:'للتمثيل الضوئي'},{icon:'💨',title:'O₂ يخرج',text:'ناتج التمثيل الضوئي'},{icon:'💧',title:'بخار الماء يخرج',text:'النتح'},{icon:'⚖️',title:'الموازنة',text:'الثغور تفتح وتغلق'}]}},
        {title:'لماذا تحتاج النباتات إلى اتزان داخلي؟', tag:'الحاجة', text:['تتطلب خلايا **النسيج الوسطي** في الأوراق إمدادًا **ثابتًا** من CO₂ لتستخدم الطاقة الضوئية على النحو الأمثل.','التراكيز المنخفضة من CO₂ **تحدّ** من معدل التمثيل الضوئي (درسته في الصف التاسع).','**الثغور** تتحكم في انتشار الغازات إلى الأوراق ومنها، وبالتالي في دخول CO₂.'], vis:{kind:'flow', steps:[{icon:'☀️',t:'ضوء'},{icon:'🕳️',t:'الثغر يفتح'},{icon:'🌬️',t:'CO₂ ينتشر إلى الفراغات الهوائية'},{icon:'🍃',t:'خلايا النسيج الوسطي'},{icon:'🍬',t:'تمثيل ضوئي'}]}, cap:'الفراغ الهوائي تحت الثغر متصل بجميع الفراغات بين خلايا النسيج الوسطي.'},
        {title:'الثغر والخلايا الحارسة', tag:'التركيب', text:['**الثغر**: الفتحة بين **الخليتَين الحارستَين**؛ ويُستخدم المصطلح عادة للخليتَين والفتحة معًا.','**الخلية الحارسة (Guard cell)**: خلية بشرة على شكل **كُلية** توجد مع خلية أخرى في زوج يحيط بالثغر وينظّم فتحه أو إغلاقه.','الثغور موزّعة على الأوراق والسيقان الخضراء والأزهار، وتحوي **البشرة السفلى** للأوراق عادة أكبر عدد منها.','الخلايا الحارسة **عالية التخصص** ونشطة جدًا أيضيًا، وتستجيب لمنبّهات بيئية متنوعة.'], vis:'stomata', cap:'الثغر: خليتان حارستان وفتحة بينهما؛ الجدار الداخلي السميك يواجه الفتحة.', q:{t:'mcq', q:'أين توجد أكبر أعداد الثغور عادة؟', opts:['البشرة العليا للورقة','البشرة السفلى للورقة','الجذور','داخل النسيج الوسطي'], a:1, why:'تحوي البشرة السفلى للأوراق عادة أكبر عدد من الثغور.'}},
        {title:'تكيّفات الخلية الحارسة', tag:'رشاد الصخر Thale cress', text:['**جدران سميكة** تواجه الهواء وفتحة الثغر، مع **كيوتيكل شمعي سميك** وحواف بارزة؛ والجدران المواجهة لخلايا البشرة **أرق بكثير**.','**ألياف السليلوز الدقيقة** مرتبة في **حزم** تقيّد التمدد إلى الأطراف.','**غشاء سطح الخلية منثنٍ** ويحوي كثيرًا من **القنوات والبروتينات الناقلة**.','سيتوبلازم غني بـ **البلاستيدات الخضراء والميتوكندريا**؛ حبيبات النشا تكبر ليلًا وتصغر نهارًا.','**فجوات صغيرة عديدة** بدل فجوة واحدة كبيرة.'], vis:{kind:'cards', items:[{icon:'🧱',title:'جدار داخلي سميك',text:'يواجه الفتحة + كيوتيكل'},{icon:'🪢',title:'حزم سليلوز',text:'تقيّد التمدد الجانبي'},{icon:'🚪',title:'غشاء منثنٍ',text:'قنوات وناقلات كثيرة'},{icon:'🟢',title:'بلاستيدات خضراء',text:'نشا يكبر ليلًا'},{icon:'⚡',title:'ميتوكندريا كثيرة',text:'ATP لمضخات البروتون'},{icon:'🫧',title:'فجوات صغيرة',text:'عديدة بدل واحدة'}]}},
        {title:'الإيقاع اليومي والمنبّهات البيئية', tag:'متى تفتح؟', text:['تفتح الثغور وتغلق بـ **إيقاع يومي** مستمر حتى في **ضوء مستمر** أو **ظلام دائم** (تراديسكانتيا، الشكل ٢٥-٤).','الفتح نهارًا: دخول CO₂ وخروج O₂ وبخار الماء (**النتح**)؛ الإغلاق ليلًا: لا تمثيل ضوئي ← تقليل النتح والحفاظ على الماء.','**تفتح** استجابةً لـ: زيادة شدة الضوء، وانخفاض CO₂ في الفراغات الهوائية.','**تغلق** استجابةً لـ: الظلام، وارتفاع CO₂، وانخفاض الرطوبة، وارتفاع الحرارة، و**الإجهاد المائي**.','مشكلة الإغلاق نهارًا: قلة CO₂ ← قلة التمثيل الضوئي؛ ميزته: احتجاز الماء وقت الإجهاد المائي.'], vis:{kind:'compare', cols:[{icon:'🔓',title:'تفتح عند',items:['زيادة شدة الضوء','انخفاض CO₂ داخل الورقة']},{icon:'🔒',title:'تغلق عند',items:['الظلام','ارتفاع CO₂ داخل الورقة','انخفاض الرطوبة','ارتفاع الحرارة','الإجهاد المائي']}]}, q:{t:'mcq', q:'ماذا يثبت استمرار إيقاع فتح الثغور في ظلام دائم؟', opts:['أن الثغور لا تستجيب للضوء أبدًا','أن للنبات إيقاعًا يوميًا داخليًا لا يعتمد على الضوء وحده','أن الثغور تُغلق في الظلام دائمًا','أن CO₂ لا يؤثر في الثغور'], a:1, why:'استمرار الإيقاع في ظلام أو ضوء مستمر يدل على ساعة داخلية، وإن كانت الثغور تستجيب أيضًا للمنبّهات البيئية.'}},
        {title:'آلية فتح الثغر', tag:'الشكل ٢٦-٤', text:['١- **مضخات البروتون** في غشاء سطح الخلية (بطاقة ATP) تنقل **H⁺** بالنقل النشط إلى **خارج** الخلية الحارسة استجابة للضوء.','٢- انخفاض H⁺ داخلًا وشحنة الداخل **السالبة** تفتح **قنوات K⁺** ← يدخل K⁺ مع **المنحدر الكهروكيميائي** (منحدر التركيز + فرق الجهد)؛ وتدخل أيضًا Cl⁻ والنترات لحفظ التوازن الكهربائي.','٣- يتفكك **النشا** في البلاستيدات إلى **أيونات المالات** السالبة التي تدخل الفجوات.','٤- ارتفاع المواد المذابة **يخفض جهد الماء** ← يدخل الماء **بالأسموزية** عبر **الأكوابورينات** إلى الفجوات.','٥- يزداد **ضغط الامتلاء** ← تنتفخ الخلايا الحارسة ← **يفتح الثغر**.'], vis:{kind:'steps', steps:[{icon:'1️⃣',t:'مضخات البروتون تُخرج H⁺ (ATP)'},{icon:'2️⃣',t:'قنوات K⁺ تفتح ويدخل K⁺ مع المنحدر الكهروكيميائي'},{icon:'3️⃣',t:'النشا ← مالات في الفجوات'},{icon:'4️⃣',t:'ينخفض جهد الماء فيدخل الماء بالأسموزية'},{icon:'5️⃣',t:'يزداد ضغط الامتلاء ← الثغر يفتح'}]}, q:{t:'mcq', q:'ما الذي يخفض جهد الماء داخل الخلية الحارسة عند الفتح؟', opts:['خروج أيونات البوتاسيوم','دخول أيونات البوتاسيوم والمالات','خروج الماء','تكوين النشا'], a:1, why:'تراكم K⁺ والمالات يرفع تركيز المواد المذابة فيخفض جهد الماء ويجذب الماء بالأسموزية.'}},
        {title:'لماذا تنحني الخلايا كالموز؟', tag:'التركيب يخدم الوظيفة', text:['**السماكة غير المتساوية** للجدران و**حزم ألياف السليلوز** تمنع التمدد في كل الاتجاهات: تزداد الخلايا في **الطول** لا في القطر.','ترتبط نهايتا الخليتَين، وتنحني **الجدران الخارجية الرقيقة** بسهولة أكبر من **الداخلية السميكة**.','فتصبح الخلايا **مقوّسة**، وتنتفخ باتجاه الخلايا المجاورة، وتبدو كزوج من **ثمار الموز** ← يفتح الثغر بينهما.'], vis:{kind:'compare', cols:[{icon:'🫘',title:'خلية حارسة رخوة',items:['قليل من K⁺ والماء','ضغط امتلاء منخفض','الجداران متلاصقان ← الثغر مغلق']},{icon:'🍌',title:'خلية حارسة ممتلئة',items:['K⁺ ومالات وماء كثير','ضغط امتلاء مرتفع','تنحني للخارج ← الثغر مفتوح']}]}, cap:'الشكل ٢٦-٤(ب): حزم السليلوز تقيّد التوسع فتدفع الخلايا عكس بعضها.'},
        {title:'الإغلاق… وإشارة الخطر', tag:'الإغلاق', text:['تغلق الثغور عندما **تتوقف مضخات H⁺**، وتغادر أيونات **K⁺** الخلايا الحارسة إلى الخلايا المجاورة، وتعود **المالات** إلى البلاستيدات لتتحوّل إلى **نشا**.','يتكوّن منحدر جهد ماء معاكس ← **يغادر الماء** ← تصبح الخلايا **رخوة** ← يغلق الثغر.','الإغلاق يقلل CO₂ والنتح؛ وحيث إن النتح يبرّد النبات ويسحب الماء والأيونات إلى الأعلى، يحدث الإغلاق فقط عندما يكون **الحفاظ على الماء** هو الأهم.','معلومة إضافية (خارج نص الكتاب): عند الإجهاد المائي ينتج النبات منظّم النمو **حمض الأبسيسيك (ABA)** الذي يرتبط بمستقبلات الخلايا الحارسة فيحفّز خروج K⁺ والماء ← إغلاق سريع للثغور.'], vis:{kind:'flow', steps:[{icon:'🏜️',t:'إجهاد مائي / ظلام'},{icon:'🧪',t:'ABA يرتبط بمستقبل'},{icon:'⛔',t:'تتوقف مضخات H⁺'},{icon:'⬆️',t:'K⁺ يخرج والمالات ← نشا'},{icon:'💧',t:'الماء يخرج بالأسموزية'},{icon:'🔒',t:'خلايا رخوة ← الثغر يغلق'}]}},
        {title:'خلاصة الدرس', tag:'ملخص', text:['**الثغور** تتحكم في دخول **CO₂** بالانتشار وتنظّم **فقد بخار الماء** بالنتح، موازنةً بين التمثيل الضوئي والحفاظ على الماء.','**الخلية الحارسة**: جدار داخلي سميك، حزم سليلوز، غشاء غني بالناقلات، بلاستيدات وميتوكندريا كثيرة.','**الفتح**: مضخات H⁺ ← دخول K⁺ (منحدر كهروكيميائي) + مالات ← ينخفض جهد الماء ← ماء بالأسموزية ← امتلاء ← انحناء ← فتح.','**الإغلاق**: توقف المضخات ← خروج K⁺ ← خروج الماء ← رخاوة. إيقاع يومي + استجابة للضوء وCO₂ والرطوبة والحرارة والإجهاد المائي.'], vis:{kind:'cycle', center:'🍃', steps:[{icon:'☀️',t:'ضوء'},{icon:'⚡',t:'H⁺ خارجًا'},{icon:'🧲',t:'K⁺ داخلًا'},{icon:'💧',t:'ماء داخلًا'},{icon:'🔓',t:'الثغر يفتح'},{icon:'🌙',t:'ظلام/جفاف ← يغلق'}]}}
      ],
      games:[
        {id:'g1', type:'quiz', time:20, runner:'🍃', qs:[
          {q:'الخلية الحارسة خلية:', opts:['من النسيج الوسطي','بشرة على شكل كُلية تحيط بالثغر','جذرية تمتص الماء','من اللحاء تنقل السكروز'], a:1, why:'الخلية الحارسة خلية بشرة على شكل كُلية توجد في زوج يحيط بالثغر.'},
          {q:'ما الذي يدخل الورقة عبر الثغور للتمثيل الضوئي؟', opts:['الأكسجين','ثاني أكسيد الكربون','بخار الماء','النيتروجين'], a:1, why:'CO₂ ينتشر إلى الداخل، ويخرج O₂ وبخار الماء.'},
          {q:'الجدار الأسمك في الخلية الحارسة هو الذي يواجه:', opts:['خلايا البشرة المجاورة','فتحة الثغر والهواء الخارجي','النسيج الوسطي','الجذر'], a:1, why:'الجدران المواجهة للفتحة والهواء سميكة مع كيوتيكل، والمواجهة للبشرة أرق.'},
          {q:'أي عامل يسبب إغلاق الثغور؟', opts:['زيادة شدة الضوء','انخفاض CO₂ في الورقة','الإجهاد المائي','انخفاض درجة الحرارة'], a:2, why:'الإغلاق يحدث عند الظلام وارتفاع CO₂ وانخفاض الرطوبة وارتفاع الحرارة والإجهاد المائي.'},

        {title:'الغدد الصماء والهرمونات', tag:'٥-١', text:['**الهرمونات** جزيئات تأشير خلوي تنتجها **الغدد الصماء** التي تفرزها **مباشرة في الدم** (غدد لاقنوية).','ينتقل الهرمون لمسافات طويلة من موقع الإفراز إلى **الأعضاء المستهدفة**.','الهرمونات مثالية للتحكم في وظائف الجسم التي **لا تحتاج إلى استجابات فورية**.','**جهاز الغدد الصماء** = جميع الغدد الصماء في الجسم + الهرمونات التي تفرزها.'], vis:'endocrine_nervous', cap:'خريطة مبسطة لبعض الغدد الصماء مقابل الجهاز العصبي.', q:{t:'mcq', q:'لماذا تسمى الغدد الصماء بالغدد اللاقنوية؟', opts:['لأنها لا تفرز شيئًا','لأنها تفرز الهرمونات مباشرة في الدم دون قنوات','لأن هرموناتها تنتقل عبر الأعصاب','لأنها توجد فقط في الدماغ'], a:1, why:'لا تملك الغدد الصماء قنوات؛ تمر هرموناتها مباشرة إلى الدم الذي يحملها إلى الأعضاء المستهدفة.'}},
        {title:'أمثلة على الغدد الصماء', tag:'ربط بالوحدة الرابعة', text:['**الغدة النخامية**: تفرز الهرمون **ADH** الذي ينظم المحتوى المائي للجسم.','**جُزيرات لانجرهانس** في البنكرياس: **الإنسولين** و**الجلوكاجون** لتنظيم جلوكوز الدم.','**الغدد الكظرية**: **الأدرينالين** في استجابة «الكر أو الفر».','**الخصيتان والمبيضان**: هرمونات **ستيرويدية** (التستوستيرون، الإستروجين، البروجسترون).'], vis:{kind:'cards', items:[{icon:'🧠',title:'الغدة النخامية',text:'ADH ← الكلية: إعادة امتصاص الماء'},{icon:'🍬',title:'جُزيرات لانجرهانس',text:'إنسولين (خلايا بيتا) وجلوكاجون (خلايا ألفا)'},{icon:'⚡',title:'الغدة الكظرية',text:'الأدرينالين عند إدراك الخطر'},{icon:'🧬',title:'الخصيتان والمبيضان',text:'ستيرويدات ذائبة في الدهون'}]}, note:'💡 الغدة الدرقية مثال آخر ورد في جدول المقارنة في الكتاب.'},
        {title:'كيف يدخل الهرمون الخلية المستهدفة؟', tag:'نوعان من الهرمونات', text:['الهرمونات **الببتيدية/البروتينية** (ADH، الإنسولين) **قابلة للذوبان في الماء**؛ لا تعبر الطبقة المزدوجة من الدهون المفسفرة.','ترتبط بـ**مستقبلات على سطح الخلية**، فتحفز جزيئات تعمل كـ**مرسال ثانٍ** لنقل الإشارة في السيتوبلازم.','الهرمونات **الستيرويدية** (التستوستيرون، الإستروجين، البروجسترون) **قابلة للذوبان في الدهون**؛ تعبر غشاء سطح الخلية.','ترتبط بمستقبلات في **السيتوبلازم أو النواة** وتنشّط عمليات مثل **النسخ**.'], vis:{kind:'compare', cols:[{icon:'💧',title:'هرمون ببتيدي (ADH، إنسولين)',items:['ذائب في الماء','لا يعبر الغشاء','مستقبل على سطح الخلية','مرسال ثانٍ في السيتوبلازم']},{icon:'🫧',title:'هرمون ستيرويدي (إستروجين، تستوستيرون)',items:['ذائب في الدهون','يعبر الطبقة المزدوجة','مستقبل داخل السيتوبلازم أو النواة','ينشّط النسخ']}]}, q:{t:'mcq', q:'لماذا يستطيع البروجسترون المرور بسهولة عبر غشاء سطح الخلية بينما لا يستطيع ADH ذلك؟', opts:['لأن البروجسترون أصغر حجمًا فقط','لأن البروجسترون ستيرويد ذائب في الدهون، وADH ببتيد ذائب في الماء','لأن ADH يُحلَّل قبل وصوله إلى الخلية','لأن البروجسترون ينتقل عبر الأعصاب'], a:1, why:'الطبقة المزدوجة من الدهون المفسفرة تسمح بمرور الجزيئات الذائبة في الدهون (الستيرويدات) وتمنع الببتيدات الذائبة في الماء.'}},
        {title:'المرسال الثاني: لماذا لا يحلّل ADH الجاليكوجين؟', tag:'ربط بالوحدة الرابعة', text:['يرتبط **الجلوكاجون** بمستقبله على خلية الكبد ← بروتين G ← أدينيليل سيكليز ← **cAMP** ← كينازات ← تحلل الجاليكوجين.','**ADH** يستخدم تسلسل تأشير مشابهًا، لكن في **خلايا القناة الجامعة** في الكلية.','السبب: لكل هرمون **مستقبل خاص** ذو شكل مكمّل؛ خلايا الكبد لا تحمل مستقبلات ADH، فلا يبدأ التسلسل فيها.','**تضخيم الإشارة**: جزيء هرمون واحد ينشّط جزيئات cAMP عديدة، فينشّط إنزيمات كثيرة.'], vis:'camp_cascade', cap:'الهرمون لا يدخل الخلية؛ المرسال الثاني ينقل الرسالة إلى الداخل.'},
        {title:'الجهاز العصبي: تنظيمه', tag:'CNS و PNS', text:['**الجهاز العصبي المركزي (CNS)**: **الدماغ** و**الحبل الشوكي**.','**الجهاز العصبي الطرفي (PNS)**: **الأعصاب القحفية** المرتبطة بالدماغ و**الأعصاب الشوكية** المرتبطة بالحبل الشوكي.','كل **عصب** يحتوي على عدد كبير من **الخلايا العصبية** (حسية وحركية).','تُنقل المعلومات على شكل **نبضات عصبية** بسرعات عالية جدًا ومباشرة إلى الخلايا المستهدفة.'], vis:{kind:'compare', cols:[{icon:'🧠',title:'الجهاز العصبي المركزي',items:['الدماغ','الحبل الشوكي','مراكز اتخاذ القرار','يحوي الخلايا العصبية الموصلة']},{icon:'🕸️',title:'الجهاز العصبي الطرفي',items:['الأعصاب القحفية (من الدماغ)','الأعصاب الشوكية (من الحبل الشوكي)','تحمل خلايا حسية وحركية','تصل المستقبلات بالمستجيبات']}]}, q:{t:'mcq', q:'ما مكونات الجهاز العصبي المركزي؟', opts:['الدماغ والأعصاب القحفية','الحبل الشوكي والأعصاب الشوكية','الدماغ والحبل الشوكي','الأعصاب القحفية والشوكية'], a:2, why:'الدماغ والحبل الشوكي يشكلان الجهاز العصبي المركزي، والأعصاب القحفية والشوكية تشكل الجهاز العصبي الطرفي.'}},
        {title:'النبضة العصبية: ما هي؟', tag:'مصطلح علمي', text:['**الخلية العصبية**: خلية متخصصة لتوصيل النبضات العصبية.','**النبضة العصبية**: موجة من **إزالة الاستقطاب الكهربائي** على جانبَي غشاء سطح الخلية العصبية تنتقل عبرها.','تنسّق الخلايا العصبية أنشطة **المستقبلات الحسية** (كالعين) ومراكز القرار في CNS و**المستجيبات** (العضلات والغدد).','عند **التشابكات العصبية** تنتقل الرسالة كيميائيًا بواسطة **النواقل العصبية**.'], vis:{kind:'flow', steps:[{icon:'👁️',t:'مستقبل حسي'},{icon:'⚡',t:'خلية عصبية حسية'},{icon:'🧠',t:'الجهاز العصبي المركزي'},{icon:'⚡',t:'خلية عصبية حركية'},{icon:'💪',t:'مستجيب: عضلة أو غدة'}]}, note:'💡 النبضة العصبية ليست تدفق إلكترونات كالتيار الكهربائي، بل تغيرات سريعة في توزيع الشحنات على جانبَي الغشاء.'},
        {title:'جدول المقارنة', tag:'الجدول ١-٥', text:['**طريقة الانتقال**: هرمونات عبر الدم مقابل نبضات كهربائية ونواقل عصبية عبر التشابكات.','**السرعة**: بطيئة عادة وطويلة الأمد مقابل سريعة وقصيرة الأمد.','**مستوى التحكم**: لا إرادي ومنتشر في الجسم مقابل إرادي ولا إرادي ومحصور في المستجيبات.'], vis:{kind:'table', head:['وجه المقارنة','جهاز الغدد الصماء','الجهاز العصبي'], rows:[['طريقة الانتقال','الهرمونات عبر الدم','نبضات كهربائية في الخلايا العصبية ونواقل عصبية عبر التشابكات'],['سرعة الانتقال','بطيئة عادة، لكنها طويلة الأمد','سريعة، لكنها قصيرة الأمد'],['الدخول في الخلايا المستهدفة','تنتشر عبر الغشاء أو ترتبط بمستقبلات على سطح الخلية','النواقل العصبية تنشّط قنوات الصوديوم والبوتاسيوم في الغشاء'],['الأنسجة والأعضاء الرئيسية','غدد: الدرقية، النخامية، الخصيتان والمبيضان','الدماغ والحبل الشوكي'],['مستوى التحكم','استجابات لا إرادية للحفاظ على بيئة داخلية ثابتة؛ تنتشر عادة في الجسم كله','استجابات إرادية ولا إرادية؛ محصورة عادة في المستجيبات']]}, q:{t:'mcq', q:'أي العبارات تصف الجهاز العصبي وليس جهاز الغدد الصماء؟', opts:['استجاباته طويلة الأمد','رسائله تنتقل في بلازما الدم','استجاباته سريعة وقصيرة الأمد','استجاباته لا إرادية فقط'], a:2, why:'النبضات العصبية سريعة جدًا لكن تأثيرها قصير الأمد، بخلاف الهرمونات البطيئة الطويلة الأمد.'}},
        {title:'الكر أو الفر: الجهازان يعملان معًا', tag:'ربط بالحياة', text:['سائق على طريق صحراوي ليلًا يرى جملًا يقطع الطريق: **الجهاز العصبي** يجعله يضغط المكابح في أجزاء من الثانية.','في الوقت نفسه تفرز **الغدد الكظرية** **الأدرينالين** في الدم، فيبقى القلب سريعًا والتنفس عميقًا لدقائق بعد زوال الخطر.','الهرمون هنا مثال على استخدام جهاز الغدد الصماء للاستجابة إلى **منبه خارجي**، لا فقط للاتزان الداخلي.','لذلك يحتاج الجسم إلى الجهازين: **سرعة** العصبي و**استمرار** الهرموني.'], vis:{kind:'steps', steps:[{icon:'👁️',t:'إدراك الخطر بالمستقبلات الحسية'},{icon:'⚡',t:'استجابة عصبية فورية: حركة العضلات'},{icon:'🩸',t:'إفراز الأدرينالين من الغدة الكظرية في الدم'},{icon:'❤️',t:'استمرار تسارع القلب والتنفس لدقائق'}]}},
        {title:'خلاصة الدرس', tag:'خلاصة', text:['**الغدد الصماء** لاقنوية تفرز **الهرمونات** في الدم؛ الهرمونات الببتيدية تعمل عبر مستقبلات سطحية و**مرسال ثانٍ**، والستيرويدية تعبر الغشاء.','**الجهاز العصبي** = CNS (الدماغ والحبل الشوكي) + PNS (الأعصاب القحفية والشوكية)؛ ينقل **نبضات عصبية** سريعة.','الهرموني: **بطيء، طويل الأمد، منتشر**؛ العصبي: **سريع، قصير الأمد، محصور** في المستجيبات.','كلاهما يبدأ بـ**مستقبلات** وينتهي بـ**مستجيبات**.'], vis:'endocrine_nervous', cap:'جهازان متكاملان لتنسيق أنشطة الجسم.'}
      ],
