<style>
:root{
  --bg1:#0b1026;--bg2:#141b3d;--card:rgba(255,255,255,.07);--card2:rgba(255,255,255,.12);--line:rgba(255,255,255,.14);
  --txt:#f4f6ff;--muted:#aab3d6;--acc:#22d3ee;--acc2:#a78bfa;--ok:#22c55e;--bad:#ef4444;--warn:#f59e0b;--gold:#fbbf24;
  --r:22px;--sh:0 10px 40px rgba(0,0,0,.35);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;min-height:100%}
body{font-family:'Cairo','Tajawal',system-ui,sans-serif;background:radial-gradient(1200px 800px at 80% -10%,#2a2f6b 0%,transparent 60%),radial-gradient(900px 700px at -10% 110%,#0f4c5c 0%,transparent 55%),linear-gradient(160deg,var(--bg1),var(--bg2));color:var(--txt);overflow-x:hidden;direction:rtl}
#bgc{position:fixed;inset:0;z-index:0;opacity:.55;pointer-events:none}
#app{position:relative;z-index:1;max-width:1180px;margin:0 auto;padding:12px 14px 60px}
button{font-family:inherit;cursor:pointer;border:none;color:inherit}
.hdr{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--card);border:1px solid var(--line);border-radius:18px;backdrop-filter:blur(12px);position:sticky;top:8px;z-index:50;box-shadow:var(--sh)}
.hdr .logo{display:flex;align-items:center;gap:10px;font-weight:900;font-size:1.15rem;flex:1;min-width:0}
.hdr .logo .ic{font-size:1.6rem;filter:drop-shadow(0 0 10px var(--acc))}
.hdr .logo small{display:block;font-size:.75rem;color:var(--muted);font-weight:600}
.ib{width:42px;height:42px;border-radius:12px;background:var(--card2);font-size:1.2rem;display:grid;place-items:center;transition:.2s;border:1px solid var(--line)}
.ib:hover{transform:translateY(-2px);background:rgba(255,255,255,.2)}
.ib.off{opacity:.45;text-decoration:line-through}
.crumbs{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:14px 4px 6px;color:var(--muted);font-size:.9rem}
.crumbs span{cursor:pointer}.crumbs span:hover{color:var(--acc)}
.hero{position:relative;padding:36px 26px;border-radius:var(--r);background:linear-gradient(135deg,rgba(34,211,238,.18),rgba(167,139,250,.18));border:1px solid var(--line);margin:16px 0 22px;overflow:hidden}
.hero h1{margin:0 0 6px;font-size:clamp(1.5rem,4vw,2.4rem);font-weight:900}
.hero p{margin:0;color:var(--muted);font-size:1.05rem}
.hero .flask{position:absolute;left:24px;top:50%;transform:translateY(-50%);font-size:5rem;animation:float 4s ease-in-out infinite;filter:drop-shadow(0 0 22px rgba(34,211,238,.6))}
@keyframes float{0%,100%{transform:translateY(-50%) rotate(-6deg)}50%{transform:translateY(-62%) rotate(6deg)}}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.chip{background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-weight:700;font-size:.9rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.ucard{position:relative;padding:22px 20px;border-radius:var(--r);background:var(--card);border:1px solid var(--line);cursor:pointer;transition:.25s;overflow:hidden;min-height:170px;display:flex;flex-direction:column;gap:8px}
.ucard:hover{transform:translateY(-6px) scale(1.01);background:var(--card2);box-shadow:var(--sh)}
.ucard::before{content:"";position:absolute;inset:0;background:radial-gradient(300px 160px at 90% 0%,var(--uc) 0%,transparent 70%);opacity:.35}
.ucard .ic{font-size:2.6rem;filter:drop-shadow(0 0 12px var(--uc))}
.ucard .num{font-size:.8rem;color:var(--muted);font-weight:700}
.ucard h3{margin:0;font-size:1.25rem;font-weight:900}
.ucard .meta{margin-top:auto;display:flex;justify-content:space-between;align-items:center;font-size:.85rem;color:var(--muted)}
.ring{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;font-size:.75rem;font-weight:800;background:conic-gradient(var(--uc) calc(var(--p)*1%),rgba(255,255,255,.12) 0);position:relative}
.ring::after{content:"";position:absolute;inset:6px;border-radius:50%;background:#171d44}
.ring b{position:relative;z-index:1}
.lcard{display:flex;align-items:center;gap:14px;padding:16px 18px;border-radius:18px;background:var(--card);border:1px solid var(--line);cursor:pointer;transition:.2s;margin-bottom:12px}
.lcard:hover{background:var(--card2);transform:translateX(-4px)}
.lcard .ic{font-size:2rem;width:56px;height:56px;border-radius:16px;display:grid;place-items:center;background:rgba(0,0,0,.25);border:1px solid var(--line)}
.lcard .t{flex:1;min-width:0}.lcard .t b{font-size:1.1rem;display:block}.lcard .t small{color:var(--muted)}
.dots{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}
.dot{width:12px;height:12px;border-radius:50%;background:rgba(255,255,255,.15);border:1px solid var(--line)}
.dot.on{background:var(--ok);box-shadow:0 0 8px var(--ok)}
.stars{color:var(--gold);letter-spacing:2px;font-size:1rem}
.sec-title{display:flex;align-items:center;gap:10px;margin:22px 4px 12px;font-size:1.3rem;font-weight:900}
.sec-title .ln{flex:1;height:1px;background:var(--line)}
.btn{display:inline-flex;align-items:center;gap:8px;padding:12px 22px;border-radius:14px;font-weight:800;font-size:1rem;background:linear-gradient(135deg,var(--acc),#0ea5e9);color:#06202a;transition:.2s;box-shadow:0 6px 20px rgba(34,211,238,.3)}
.btn:hover{transform:translateY(-2px);filter:brightness(1.08)}
.btn.sec{background:var(--card2);color:var(--txt);box-shadow:none;border:1px solid var(--line)}
.btn.pur{background:linear-gradient(135deg,#a78bfa,#7c3aed);color:#fff;box-shadow:0 6px 20px rgba(124,58,237,.35)}
.btn.grn{background:linear-gradient(135deg,#34d399,#16a34a);color:#03230f;box-shadow:0 6px 20px rgba(22,163,74,.35)}
.btn.org{background:linear-gradient(135deg,#fbbf24,#f97316);color:#2a1200;box-shadow:0 6px 20px rgba(249,115,22,.35)}
.btn.sm{padding:8px 14px;font-size:.9rem;border-radius:11px}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
.tab{padding:10px 16px;border-radius:14px;background:var(--card);border:1px solid var(--line);font-weight:800;transition:.2s;display:flex;align-items:center;gap:6px}
.tab.on{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#0b1026}
.tab .ok{font-size:.8rem}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px;animation:pop .35s ease}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}
.lhead{display:flex;align-items:center;gap:16px;padding:18px 22px;border-radius:var(--r);background:linear-gradient(135deg,var(--uc),transparent 70%),var(--card);border:1px solid var(--line);margin-top:10px}
.lhead .ic{font-size:3rem}.lhead h2{margin:0;font-size:1.5rem;font-weight:900}.lhead small{color:var(--muted);display:block;margin-top:4px}
.obj{display:grid;gap:10px}
.obj li{list-style:none;background:rgba(0,0,0,.2);padding:12px 16px;border-radius:14px;border-right:4px solid var(--acc);animation:slideIn .4s ease both}
.obj li:nth-child(2){animation-delay:.08s}.obj li:nth-child(3){animation-delay:.16s}.obj li:nth-child(4){animation-delay:.24s}
@keyframes slideIn{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:none}}
.terms{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.term{background:rgba(0,0,0,.22);border:1px solid var(--line);border-radius:16px;padding:14px;cursor:pointer;transition:.2s;position:relative;min-height:90px}

(function bg(){ const c = $('#bgc'), x = c.getContext('2d'); let w, h, pts = []; const rs = () => { w = c.width = innerWidth; h = c.height = innerHeight; }; addEventListener('resize', rs); rs(); for (let i=0;i<45;i++) pts.push({x:Math.random()*w, y:Math.random()*h, vx:(Math.random()-.5)*.35, vy:(Math.random()-.5)*.35, r:2+Math.random()*3}); (function loop(){ x.clearRect(0,0,w,h); for (const p of pts){ p.x+=p.vx; p.y+=p.vy; if(p.x<0||p.x>w)p.vx*=-1; if(p.y<0||p.y>h)p.vy*=-1; } x.strokeStyle='rgba(34,211,238,.12)'; for (let i=0;i<pts.length;i++) for (let j=i+1;j<pts.length;j++){ const a=pts[i],b=pts[j],d=Math.hypot(a.x-b.x,a.y-b.y); if(d<140){ x.globalAlpha=1-d/140; x.beginPath(); x.moveTo(a.x,a.y); x.lineTo(b.x,b.y); x.stroke(); } } x.globalAlpha=1; for (const p of pts){ x.fillStyle='rgba(167,139,250,.5)'; x.beginPath(); x.arc(p.x,p.y,p.r,0,7); x.fill(); } requestAnimationFrame(loop); })(); })();

function lessonView(l, tab, idx){
  const u = l._u; const p = lp(l._id);
  app.appendChild(crumbs([['الرئيسية','#home'],['الوحدة '+toAr(u.num)+': '+u.title,'#u'+u.num],[l.num+' '+l.title]]));
  const hd = el('div','lhead'); hd.style.setProperty('--uc',(u.color||'#22d3ee')+'66'); hd.innerHTML = `<span class="ic">${l.icon||'📘'}</span><div><h2>${TX(l.num)} ${TX(l.title)}</h2><small>الوحدة ${toAr(u.num)}: ${TX(u.title)}${l.pages?' · صفحات الكتاب '+TX(l.pages):''} · ${stars(lessonScore(l))}</small></div>`; app.appendChild(hd);
  const tabs = el('div','tabs');
  const T = [['goals','🎯 الأهداف والمصطلحات'],['pre','🔥 نشاط قبلي',p.pre!=null],['slides','📽️ العرض',p.slides>=l.slides.length],['games','🎮 الألعاب',l.games.every((g,i)=>p.games[i]!=null)],['post','🏁 نشاط ختامي',p.post!=null],['summary','📝 الخلاصة']];
  T.forEach(t=>{ const b = el('button','tab'+(tab===t[0]?' on':''),`${t[1]}${t[2]?' <span class="ok">✔</span>':''}`); b.onclick=()=>{SFX.click();go('#l'+l.num+'/'+t[0]);}; tabs.appendChild(b); });
  app.appendChild(tabs);
  const panel = el('div','panel'); app.appendChild(panel);
  const next = (t)=>{ const i = T.findIndex(x=>x[0]===t); return T[i+1] ? T[i+1][0] : null; };
  if (tab==='goals') goalsTab(panel,l);
  else if (tab==='pre') { panel.appendChild(el('div','', '<span class="badge pre">نشاط قبلي – تهيئة</span>')); runGame(panel, l.pre, sc=>{ p.pre = Math.max(p.pre||0, sc); save(); }, ()=>go('#l'+l.num+'/slides')); }
  else if (tab==='slides') slidesTab(panel,l,idx);
  else if (tab==='games') { if (idx!=null && l.games[+idx]) { const g = l.games[+idx]; const back = el('button','btn sec sm','← كل الألعاب'); back.onclick=()=>go('#l'+l.num+'/games'); panel.appendChild(back); panel.appendChild(el('div','help',`<span class="badge">${GAME_ICON[g.type]} ${GAME_NAME[g.type]}</span>`)); runGame(panel, g, sc=>{ p.games[+idx] = Math.max(p.games[+idx]||0, sc); save(); }, ()=>{ const n=+idx+1; go(l.games[n]?'#l'+l.num+'/games/'+n:'#l'+l.num+'/post'); }); } else gamesTab(panel,l); }
  else if (tab==='post') { panel.appendChild(el('div','', '<span class="badge post">نشاط ختامي – تقويم</span>')); runGame(panel, l.post, sc=>{ p.post = Math.max(p.post||0, sc); save(); }, ()=>go('#l'+l.num+'/summary')); }
  else if (tab==='summary') summaryTab(panel,l);
  window.scrollTo(0,0);
}
function goalsTab(panel,l){
  panel.appendChild(el('div','sec-title','<span>🎯 أهداف الدرس</span><span class="ln"></span>'));
  const ul = el('ul','obj'); (l.objectives||[]).forEach(o=>ul.appendChild(el('li','',TX(o)))); panel.appendChild(ul);
  panel.appendChild(el('div','sec-title','<span>📚 المصطلحات العلمية</span><span class="ln"></span><small style="font-weight:400;color:var(--muted)">اضغط على المصطلح للاستماع</small>'));
  const tg = el('div','terms'); (l.terms||[]).forEach(t=>{ const c = el('div','term',`<span class="sp">🔊</span><b>${TX(t.term)}</b>${t.en?`<i>${TX(t.en)}</i>`:''}<p>${TX(t.def)}</p>`); c.onclick=()=>{SFX.select(); speak(t.term+'. '+t.def);}; tg.appendChild(c); }); panel.appendChild(tg);
  const f = el('div','gfoot'); f.appendChild(el('span','')); const b = el('button','btn pulse','🔥 ابدأ بالنشاط القبلي ←'); b.onclick=()=>go('#l'+l.num+'/pre'); f.appendChild(b); panel.appendChild(f);
}
function summaryTab(panel,l){
  const sc = lessonScore(l);
  panel.appendChild(el('div','result',`<div class="big">${sc>=90?'🏆':sc>=60?'🎉':'💪'}</div><h3>إنجازك في الدرس: ${sc}%</h3><div class="stars">${stars(sc)}</div>`));
  panel.appendChild(el('div','sec-title','<span>📝 خلاصة الدرس</span><span class="ln"></span>'));
  const ul = el('ul','summary'); (l.summary||[]).forEach(s=>ul.appendChild(el('li','',TX(s)))); panel.appendChild(ul);
  const f = el('div','gfoot'); const s = spkBtn((l.summary||[]).join('. '),'btn sec'); s.innerHTML='🔊 استمع للخلاصة'; f.appendChild(s);
  const nl = allLessons[allLessons.indexOf(l)+1]; const b = el('button','btn', nl?`الدرس التالي: ${TX(nl.num)} ←`:'العودة للوحدة'); b.onclick=()=>go(nl?'#l'+nl.num:'#u'+l._u.num); f.appendChild(b); panel.appendChild(f);
}
function gamesTab(panel,l){
  const p = lp(l._id);
  panel.appendChild(el('p','intro','اختر لعبة. كل لعبة تُسجّل أفضل نتيجة لك ⭐'));
  const g = el('div','grid'); l.games.forEach((gm,i)=>{ const c = el('div','gcard',`<span class="ic">${GAME_ICON[gm.type]}</span><div><b>${TX(gm.title)}</b><small>${GAME_NAME[gm.type]} · ${(gm.items||gm.pairs||[]).length} عناصر</small></div><span class="best">${p.games[i]!=null?'🏅 '+p.games[i]+'%':''}</span>`); c.onclick=()=>{SFX.click();go('#l'+l.num+'/games/'+i);}; g.appendChild(c); }); panel.appendChild(g);
}

/* ---------- slides ---------- */
function slidesTab(panel,l,startAt){
  const p = lp(l._id); let i = Math.min(l.slides.length-1, Math.max(0, +startAt||0)); let seen = new Set();
  const box = el('div','slidebox'); const pb = el('div','pbar','<i></i>'); const dots = el('div','slidesdots');
  panel.appendChild(pb); panel.appendChild(box); panel.appendChild(dots);
  const fsb = el('button','btn sec sm','⛶ عرض ملء الشاشة'); fsb.onclick=()=>{ document.body.classList.toggle('fs'); if(document.body.classList.contains('fs')) document.documentElement.requestFullscreen?.(); };
  const f = el('div','gfoot'); f.appendChild(fsb); const nx = el('button','btn pur','🎮 إلى الألعاب'); nx.onclick=()=>go('#l'+l.num+'/games'); f.appendChild(nx); panel.appendChild(f);
  function render(){
    const s = l.slides[i]; seen.add(i); p.slides = Math.max(p.slides||0, seen.size); save();
    box.innerHTML = ''; const t = el('div','txt'); t.innerHTML = `<h3>${TX(s.title)}</h3><p>${TX(s.body)}</p>${s.note?`<div class="note">💭 ${TX(s.note)}</div>`:''}`;
    const sp = spkBtn(s.title+'. '+s.body+(s.note?'. '+s.note:''),'btn sec sm'); sp.innerHTML='🔊 استمع'; sp.style.alignSelf='flex-start'; t.appendChild(sp);
    const v = el('div','vis'); v.appendChild(visual(s.visual||{type:'text',big:'⚗️'}));
    box.appendChild(t); box.appendChild(v);
    const nav = el('div','slidenav'); const prev = el('button','btn sec sm','→ السابق'); prev.disabled = i===0; prev.onclick=()=>{SFX.flip(); i--; render();}; const next = el('button','btn sm', i<l.slides.length-1?'التالي ←':'🎮 انتقل للألعاب'); next.onclick=()=>{ SFX.flip(); if(i<l.slides.length-1){ i++; render(); } else go('#l'+l.num+'/games'); };
    nav.appendChild(prev); nav.appendChild(el('span','cnt',`${i+1} / ${l.slides.length}`)); nav.appendChild(next); box.appendChild(nav);
    pb.firstChild.style.width = ((i+1)/l.slides.length*100)+'%';
    dots.innerHTML=''; l.slides.forEach((_,k)=>{ const d = el('span', k===i?'on':(seen.has(k)?'seen':'')); d.onclick=()=>{i=k;render();}; dots.appendChild(d); });
  }
  render();
  const kh = e => { if (!document.body.contains(box)) { removeEventListener('keydown',kh); return; } if (e.key==='ArrowLeft'||e.key===' '){ if(i<l.slides.length-1){i++;render();} } if (e.key==='ArrowRight'){ if(i>0){i--;render();} } if (e.key==='Escape') document.body.classList.remove('fs'); };
  addEventListener('keydown', kh);
}

      <text x="200" y="270" font-size="13" fill="#aab3d6">← تسخين (اكتساب طاقة) · تبريد (فقد طاقة) →</text></g><defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8z" fill="#fff"/></marker></defs>`); cap(v.label); break; }
    case 'atom': case 'ion': { const shells = v.shells||[2]; const n = shells.length; let c = `<circle cx="200" cy="150" r="26" fill="url(#nuc)"/><text x="200" y="146" text-anchor="middle" font-size="11" font-weight="800" fill="#fff">${v.p!=null?v.p+'p⁺':''}</text><text x="200" y="160" text-anchor="middle" font-size="11" font-weight="800" fill="#fff">${v.n!=null?v.n+'n':''}</text><defs><radialGradient id="nuc"><stop offset="0" stop-color="#fca5a5"/><stop offset="1" stop-color="#b91c1c"/></radialGradient></defs>`; shells.forEach((e,i)=>{ const r = 48+i*(100/n); c += `<circle cx="200" cy="150" r="${r}" fill="none" stroke="rgba(255,255,255,.35)" stroke-dasharray="3 3"/>`; let g = `<g style="transform-origin:200px 150px;animation:spin ${6+i*4}s linear infinite ${i%2?'reverse':''}">`; for(let k=0;k<e;k++){ const a = k/e*6.283; g += `<circle cx="${200+r*Math.cos(a)}" cy="${150+r*Math.sin(a)}" r="6" fill="#22d3ee" stroke="#fff" stroke-width="1"/>`; } c += g+'</g>'; }); c += `<text x="200" y="290" text-anchor="middle" font-size="16" font-weight="900" fill="#fbbf24">${esc(v.symbol||'')}${v.type==='ion'?(v.charge||''):''}  ${shells.join(',')}</text>`; if (v.type==='ion' && v.charge) c += `<circle cx="340" cy="60" r="26" fill="${/-/.test(v.charge)?'#3b82f6':'#ef4444'}"/><text x="340" y="68" text-anchor="middle" font-size="22" font-weight="900" fill="#fff">${esc(v.charge)}</text>`; S(c); cap(v.caption||v.label); break; }

    case 'bar': { const items = v.items||[]; const vals = items.map(i=>+i.value||0); const mx = Math.max(1,...vals.map(Math.abs)); const hasNeg = vals.some(x=>x<0); const base = hasNeg?150:260; const scale = hasNeg?110:220; const bw = Math.min(50, 340/items.length-8); let c = `<line x1="30" y1="${base}" x2="390" y2="${base}" stroke="#fff" stroke-width="1.5"/>`; items.forEach((it,i)=>{ const x = 40+i*(340/items.length); const h = Math.abs(it.value)/mx*scale; const y = it.value>=0?base-h:base; c += `<rect x="${x}" y="${it.value>=0?base:base}" width="${bw}" height="0" rx="5" fill="${it.color||'#22d3ee'}"><animate attributeName="height" from="0" to="${h}" dur=".8s" begin="${i*.1}s" fill="freeze"/><animate attributeName="y" from="${base}" to="${y}" dur=".8s" begin="${i*.1}s" fill="freeze"/></rect><text x="${x+bw/2}" y="${it.value>=0?y-6:y+h+14}" text-anchor="middle" font-size="11" fill="#fde68a" font-weight="800">${esc(it.value)}</text><text x="${x+bw/2}" y="${base+ (it.value>=0?16:-6)}" text-anchor="middle" font-size="11" fill="#fff" font-weight="800">${esc(it.label)}</text>`; }); S(c); cap((v.caption||v.label||'')+(v.unit?' ('+v.unit+')':'')); break; }

}

  body.appendChild(el('div','help','أدر العجلة لاختيار سؤال، ناقشه مع زملائك، ثم اكشف الإجابة.'));
  const wrap = el('div','wheelwrap'); const wh = el('div','wheel'); const cv = el('canvas'); cv.width=cv.height=400; wh.appendChild(cv); wh.appendChild(el('div','ptr','🔻')); wrap.appendChild(wh);
  const side = el('div',''); wrap.appendChild(side); body.appendChild(wrap);
  const cols = ['#22d3ee','#a78bfa','#fbbf24','#22c55e','#f472b6','#f97316','#60a5fa','#34d399','#e879f9','#fb7185'];
  const draw = () => { const x = cv.getContext('2d'); const n = items.length, r = 195; x.clearRect(0,0,400,400); items.forEach((it,i)=>{ const a0 = i/n*6.283-1.5708, a1 = (i+1)/n*6.283-1.5708; x.beginPath(); x.moveTo(200,200); x.arc(200,200,r,a0,a1); x.closePath(); x.fillStyle = used.has(i)?'#334155':cols[i%cols.length]; x.fill(); x.strokeStyle='#0b1026'; x.lineWidth=3; x.stroke(); x.save(); x.translate(200,200); x.rotate((a0+a1)/2); x.fillStyle='#0b1026'; x.font='bold 26px Cairo'; x.textAlign='center'; x.fillText(String(i+1), r*.65, 10); x.restore(); }); x.beginPath(); x.arc(200,200,28,0,7); x.fillStyle='#fff'; x.fill(); };
  draw();
  const spinB = el('button','btn org','🎡 أدر العجلة'); side.appendChild(spinB); const qa = el('div',''); side.appendChild(qa);
  spinB.onclick = () => { if (used.size===items.length) return finish(items.length, items.length); const avail = items.map((_,i)=>i).filter(i=>!used.has(i)); const pick = avail[Math.floor(Math.random()*avail.length)]; const n = items.length; const target = 360*5 + (360 - ((pick+.5)/n*360)); rot += target - (rot % 360); cv.style.transform = `rotate(${rot}deg)`; spinB.disabled=true; SFX.spin(); qa.innerHTML=''; setTimeout(()=>{ used.add(pick); draw(); const it = items[pick]; qa.innerHTML=''; const q = el('div','q',`سؤال ${pick+1}: ${TX(it.q)}`); q.appendChild(spkBtn(it.q)); qa.appendChild(q); const rv = el('button','btn grn','👁️ اكشف الإجابة'); rv.onclick=()=>{ rv.remove(); qa.appendChild(el('div','reveal','✅ '+TX(it.a))); speak(it.a); SFX.ok(); setScore(used.size, items.length); spinB.disabled=false; spinB.textContent = used.size===items.length?'🏁 إنهاء':'🎡 أدر مجددًا'; }; qa.appendChild(rv); }, 4100); };
};

GAMES.wordguess = ({body,setScore,finish,g}) => {
  const items = shuffle(g.items); let i = 0, s = 0; setScore(0, items.length);
  const norm = ch => ch.replace(/[ً-ْـ]/g,'').replace(/[أإآ]/g,'ا');

    const fw = el('div','flaskwrap'); const flask = el('div',''); fw.appendChild(flask); body.appendChild(fw); const slots = el('div','slots'); body.appendChild(slots); const kb = el('div','kb'); body.appendChild(kb);
    const drawFlask = () => { const lvl = wrong/MAX; flask.innerHTML = `<svg viewBox="0 0 120 140" width="110"><path d="M45 10 L45 55 L15 120 Q12 130 22 130 L98 130 Q108 130 105 120 L75 55 L75 10 Z" fill="rgba(255,255,255,.08)" stroke="#e5e7eb" stroke-width="3"/><clipPath id="cp"><path d="M45 10 L45 55 L15 120 Q12 130 22 130 L98 130 Q108 130 105 120 L75 55 L75 10 Z"/></clipPath><rect x="0" y="${130-lvl*100}" width="120" height="${lvl*100}" fill="${lvl>=1?'#ef4444':lvl>.6?'#f97316':'#22c55e'}" clip-path="url(#cp)" opacity=".85"/><text x="60" y="80" text-anchor="middle" font-size="14" fill="#fff" font-weight="900">${MAX-wrong} ❤</text></svg>`; };
    const render = () => { drawFlask(); slots.innerHTML=''; letters.forEach(ch=>{ const ok = ch===' ' || guessed.has(norm(ch)); const d = el('div','slot'+(ok?' on':''), ch===' '?'':(ok?TX(ch):'')); if (ch===' ') d.style.background='transparent'; slots.appendChild(d); }); };
    render();
    LET.forEach(L=>{ const b = el('button','',L); b.onclick=()=>{ b.disabled=true; const hit = letters.some(ch=>norm(ch)===L); guessed.add(L); if (hit){ b.classList.add('ok'); SFX.select(); } else { wrong++; b.classList.add('bad'); SFX.bad(); } render(); const won = letters.every(ch=>ch===' '||guessed.has(norm(ch))); if (won || wrong>=MAX){ kb.querySelectorAll('button').forEach(x=>x.disabled=true); if (won){ s++; SFX.ok(); } else { slots.innerHTML=''; letters.forEach(ch=>slots.appendChild(el('div','slot on',TX(ch)))); } setScore(s,items.length); body.appendChild(el('div','fb '+(won?'ok':'bad'), (won?'✅ رائع! المصطلح: ':'❌ المصطلح الصحيح: ')+TX(it.word))); speak(it.word); nextBtn(body, i<items.length-1?'التالي ←':'النتيجة 🏁', ()=>{ i++; if(i<items.length) show(); else finish(s,items.length); }); } }; kb.appendChild(b); });
  };
  show();
};

const SUB = {'₀':0,'₁':1,'₂':2,'₃':3,'₄':4,'₅':5,'₆':6,'₇':7,'₈':8,'₉':9};
function countAtoms(f){ f = String(f).replace(/\((s|l|g|aq)\)/g,'').replace(/[⁺⁻⁰¹²³⁴⁵⁶⁷⁸⁹]+$/,'').trim(); let i=0; const parse = (stop) => { const m = {}; while (i<f.length){ const ch = f[i]; if (ch===')'||ch===']'){ i++; return m; } if (ch==='('||ch==='['){ i++; const inner = parse(); let n = num(); for (const k in inner) m[k]=(m[k]||0)+inner[k]*n; } else if (/[A-Z]/.test(ch)){ let sym = ch; i++; if (i<f.length && /[a-z]/.test(f[i])){ sym+=f[i]; i++; } const n = num(); m[sym]=(m[sym]||0)+n; } else if (ch==='·'||ch==='.'||ch==='•'){ i++; const pre = numPre(); const inner = parse(); for (const k in inner) m[k]=(m[k]||0)+inner[k]*pre; } else i++; } return m; };
  const num = () => { let d=''; while (i<f.length && (SUB[f[i]]!==undefined || /[0-9]/.test(f[i]))){ d += SUB[f[i]]!==undefined?SUB[f[i]]:f[i]; i++; } return d?+d:1; };
  const numPre = () => { let d=''; while (i<f.length && /[0-9]/.test(f[i])){ d+=f[i]; i++; } return d?+d:1; };
  return parse(); }
GAMES.balance = ({body,setScore,finish,g}) => {
  const items = shuffle(g.items); let i = 0, s = 0; setScore(0, items.length);
  const show = () => { body.innerHTML=''; const it = items[i]; qHeader(body,i,items.length); body.appendChild(el('div','help','اكتب المعاملات المناسبة أمام كل صيغة لتصبح المعادلة موزونة، ثم اضغط "تحقق".')); const eq = el('div','eqn'); const inputs = []; it.parts.forEach((p,k)=>{ if (k>0) eq.appendChild(el('span','arrow', k===it.arrow+1?'→':'+')); const part = el('span','part'); const inp = el('input','co'); inp.type='number'; inp.min=1; inp.max=20; inp.value=''; inp.placeholder='?'; inputs.push(inp); part.appendChild(inp); part.appendChild(el('span','',TX(p))); eq.appendChild(part); }); body.appendChild(eq); const ac = el('div','atomcount'); body.appendChild(ac);
    const tally = () => { const L={}, R={}; it.parts.forEach((p,k)=>{ const c = +inputs[k].value||1; const m = countAtoms(p); const T = k<=it.arrow?L:R; for (const e in m) T[e]=(T[e]||0)+m[e]*c; }); const els = [...new Set([...Object.keys(L),...Object.keys(R)])]; ac.innerHTML = els.map(e=>`<span class="${(L[e]||0)===(R[e]||0)?'eq':'ne'}">${e}: ${L[e]||0} | ${R[e]||0}</span>`).join(''); };
    inputs.forEach(x=>x.oninput=tally); tally();
    const f = el('div','gfoot'); const chk = el('button','btn grn','✔ تحقق'); const hintB = el('button','btn sec','💡 تلميح'); hintB.onclick=()=>{ const k = inputs.findIndex((x,k)=>+x.value!==it.coeffs[k]); if(k>=0){ inputs[k].value = it.coeffs[k]; tally(); SFX.select(); it._hinted = true; } };
    chk.onclick=()=>{ const vals = inputs.map(x=>+x.value||0); const ratio = vals[0]/it.coeffs[0]; const ok = vals.every((v,k)=>v>0 && Math.abs(v - it.coeffs[k]*ratio)<1e-9) && Number.isInteger(ratio) && ratio>=1; inputs.forEach((x,k)=>{ x.disabled=true; x.classList.add(ok?'ok':'bad'); if(!ok) x.value = it.coeffs[k]; }); tally(); if (ok && !it._hinted){ s++; SFX.ok(); } else if (ok) { s += .5; SFX.ok(); } else SFX.bad(); setScore(Math.round(s),items.length); body.appendChild(el('div','fb '+(ok?'ok':'bad'), ok?'✅ المعادلة موزونة!'+(it._hinted?' (مع تلميح)':''):'❌ المعاملات الصحيحة: '+it.coeffs.join(' ، '))); chk.remove(); hintB.remove(); nextBtn(body, i<items.length-1?'التالي ←':'النتيجة 🏁', ()=>{ i++; if(i<items.length) show(); else finish(Math.round(s),items.length); }); };
    f.appendChild(chk); f.appendChild(hintB); body.appendChild(f); };
  show();
};

GAMES.calc = ({body,setScore,finish,g}) => {
  const items = shuffle(g.items); let i = 0, s = 0; setScore(0, items.length);
  const show = () => { body.innerHTML=''; const it = items[i]; qHeader(body,i,items.length); const q = el('div','q',TX(it.q)); q.appendChild(spkBtn(it.q)); body.appendChild(q); if (it.hint) body.appendChild(el('div','hint','💡 '+TX(it.hint))); const ni = el('div','numin'); const inp = el('input'); inp.type='number'; inp.step='any'; inp.placeholder='الإجابة'; ni.appendChild(inp); if (it.unit) ni.appendChild(el('b','',TX(it.unit))); const chk = el('button','btn grn','✔ تحقق'); ni.appendChild(chk); body.appendChild(ni); inp.focus();
    const done = () => { const v = parseFloat(inp.value); const tol = it.tol ?? Math.abs(it.answer)*.02; const ok = !isNaN(v) && Math.abs(v-it.answer) <= tol + 1e-9; inp.disabled=true; chk.disabled=true; inp.style.borderColor = ok?'var(--ok)':'var(--bad)'; if(ok){ s++; SFX.ok(); } else SFX.bad(); setScore(s,items.length); body.appendChild(el('div','fb '+(ok?'ok':'bad'), (ok?'✅ إجابة صحيحة! ':'❌ الإجابة الصحيحة: '+TX(it.answer)+' '+TX(it.unit||'')+'. ')+(it.steps?'<br>📝 الحل: '+TX(it.steps):''))); nextBtn(body, i<items.length-1?'التالي ←':'النتيجة 🏁', ()=>{ i++; if(i<items.length) show(); else finish(s,items.length); }); };
