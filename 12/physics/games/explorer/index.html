<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>مختبر الفيزياء التفاعلي — الصف الثاني عشر</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --p:#0284c7;--p2:#38bdf8;--p3:#e0f2fe;--pd:#075985;
  --bg1:#f0f9ff;--bg2:#fef9f3;
  --ink:#0f172a;--ink2:#334155;--ink3:#64748b;
  --ok:#16a34a;--ok2:#dcfce7;--bad:#dc2626;--bad2:#fee2e2;--warn:#d97706;--warn2:#fef3c7;
  --card:#ffffff;--line:#e2e8f0;--r:20px;--sh:0 10px 30px -12px rgba(2,8,23,.18);
}
[data-theme="mint"]{--p:#0d9488;--p2:#2dd4bf;--p3:#ccfbf1;--pd:#115e59;--bg1:#f0fdfa;--bg2:#fefce8}
[data-theme="violet"]{--p:#7c3aed;--p2:#a78bfa;--p3:#ede9fe;--pd:#5b21b6;--bg1:#f5f3ff;--bg2:#fff7ed}
[data-theme="amber"]{--p:#d97706;--p2:#fbbf24;--p3:#fef3c7;--pd:#92400e;--bg1:#fffbeb;--bg2:#f0f9ff}
[data-theme="rose"]{--p:#e11d48;--p2:#fb7185;--p3:#ffe4e6;--pd:#9f1239;--bg1:#fff1f2;--bg2:#f0fdfa}
html{scroll-behavior:smooth}
body{margin:0;font-family:"Tajawal","Cairo",system-ui,sans-serif;color:var(--ink);background:
  radial-gradient(1200px 600px at 100% -10%,var(--p3),transparent 60%),
  radial-gradient(900px 500px at -10% 110%,var(--bg2),transparent 55%),
  linear-gradient(180deg,var(--bg1),#ffffff 60%);min-height:100vh;direction:rtl;line-height:1.75;font-size:17px}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;background:
  radial-gradient(circle at 15% 20%,rgba(255,255,255,.8) 0 2px,transparent 3px),
  radial-gradient(circle at 70% 60%,rgba(255,255,255,.7) 0 2px,transparent 3px);opacity:.5}
h1,h2,h3,h4{font-family:"Cairo","Tajawal",sans-serif;margin:0;line-height:1.4}
button{font-family:inherit;font-size:inherit;cursor:pointer}
input,select{font-family:inherit;font-size:inherit}
.app{position:relative;z-index:1;max-width:1180px;margin:0 auto;padding:12px 16px 60px}
/* top bar */
.top{display:flex;align-items:center;gap:12px;padding:10px 16px;background:rgba(255,255,255,.75);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.9);border-radius:18px;box-shadow:var(--sh);position:sticky;top:8px;z-index:50}
.top .logo{width:46px;height:46px;border-radius:14px;background:linear-gradient(135deg,var(--p),var(--p2));display:grid;place-items:center;font-size:24px;color:#fff;box-shadow:0 6px 16px -6px var(--p)}
.top .ttl{flex:1;min-width:0}
.top .ttl h1{font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .ttl small{color:var(--ink3);font-size:13px;display:block}
.ibtn{border:1px solid var(--line);background:#fff;border-radius:12px;width:42px;height:42px;display:grid;place-items:center;font-size:20px;transition:.2s;color:var(--ink2)}
.ibtn:hover{transform:translateY(-2px);box-shadow:var(--sh);border-color:var(--p2)}
.ibtn.off{opacity:.45}
.crumbs{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:14px;color:var(--ink3);margin:16px 4px 8px}
.crumbs a{color:var(--p);text-decoration:none;font-weight:700;cursor:pointer}
.crumbs span.sep{opacity:.5}
/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:20px}
.hero{display:grid;grid-template-columns:1.4fr 1fr;gap:20px;margin:16px 0;align-items:stretch}
.hero .card{position:relative;overflow:hidden}
.hero h2{font-size:28px;color:var(--pd)}
.hero p{color:var(--ink2);margin:8px 0 0}
.hero .bigemoji{position:absolute;left:-10px;bottom:-20px;font-size:120px;opacity:.12;transform:rotate(-10deg)}
.ring{display:grid;place-items:center;position:relative}
.ring svg{width:150px;height:150px}
.ring .val{position:absolute;text-align:center}
.ring .val b{font-size:30px;color:var(--pd)}
.ring .val small{display:block;color:var(--ink3);font-size:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px;margin:12px 0}
.ucard{cursor:pointer;transition:.25s;position:relative;overflow:hidden;display:flex;flex-direction:column;gap:10px;min-height:170px}
.ucard:hover{transform:translateY(-4px);box-shadow:0 20px 40px -18px rgba(2,8,23,.3)}
.ucard .ic{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;font-size:28px;background:var(--p3)}
.ucard .n{font-size:12px;color:var(--ink3);font-weight:700}
.ucard h3{font-size:19px;color:var(--ink)}
.ucard .meta{display:flex;justify-content:space-between;font-size:13px;color:var(--ink3);margin-top:auto}
.bar{height:8px;border-radius:99px;background:#eef2f7;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--p),var(--p2));border-radius:99px;transition:width .6s}
.ucard .stripe{position:absolute;top:0;right:0;left:0;height:6px}
/* unit view */
.goals{display:grid;gap:8px;margin:10px 0 0;padding:0;list-style:none}
.goals li{display:flex;gap:10px;align-items:flex-start;background:var(--bg1);border-radius:12px;padding:8px 12px;font-size:15px}
.goals li::before{content:"🎯";font-size:16px}
.lesson-list{display:grid;gap:12px;margin:12px 0}
.lcard{display:flex;align-items:center;gap:14px;cursor:pointer;transition:.2s;padding:14px 18px}
.lcard:hover{transform:translateX(-4px);box-shadow:0 18px 36px -18px rgba(2,8,23,.3)}
.lcard .num{min-width:58px;height:58px;border-radius:16px;display:grid;place-items:center;font-weight:800;font-size:18px;color:#fff;background:linear-gradient(135deg,var(--p),var(--p2))}
.lcard .num small{font-size:10px;font-weight:600;display:block;line-height:1}
.lcard .body{flex:1;min-width:0}
.lcard h3{font-size:18px}
.lcard .en{color:var(--ink3);font-size:13px}
.steps-chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chip{font-size:12px;padding:3px 10px;border-radius:99px;background:#f1f5f9;color:var(--ink3);border:1px solid var(--line)}
.chip.done{background:var(--ok2);color:#166534;border-color:#bbf7d0}
.chip.score{background:var(--warn2);color:#92400e;border-color:#fde68a}
.lcard .arrow{font-size:22px;color:var(--p)}
.sec-title{display:flex;align-items:center;gap:10px;margin:28px 4px 8px;font-size:21px;color:var(--pd)}
.sec-title span{font-size:26px}
.gloss{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.gcard{perspective:900px;height:150px;cursor:pointer}
.gcard .in{position:relative;width:100%;height:100%;transition:transform .6s;transform-style:preserve-3d}
.gcard.f .in{transform:rotateY(180deg)}
.gcard .face{position:absolute;inset:0;backface-visibility:hidden;border-radius:16px;padding:14px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;border:1px solid var(--line);background:#fff;box-shadow:var(--sh)}
.gcard .face.b{transform:rotateY(180deg);background:linear-gradient(135deg,var(--p),var(--pd));color:#fff;font-size:14px;line-height:1.5}
.gcard .face b{font-size:18px;color:var(--pd)}
.gcard .face small{color:var(--ink3);font-size:12px}
/* lesson view */
.lhead{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.lhead h2{font-size:24px;color:var(--pd);flex:1}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0;background:rgba(255,255,255,.7);padding:6px;border-radius:16px;border:1px solid var(--line)}
.tab{flex:1;min-width:120px;border:none;background:transparent;border-radius:12px;padding:10px 12px;font-weight:700;color:var(--ink3);display:flex;align-items:center;justify-content:center;gap:6px;transition:.2s;position:relative}
.tab:hover{background:var(--p3);color:var(--pd)}
.tab.on{background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;box-shadow:0 8px 18px -8px var(--p)}
.tab .dot{width:9px;height:9px;border-radius:50%;background:#cbd5e1}
.tab .dot.d{background:#22c55e;box-shadow:0 0 0 3px rgba(34,197,94,.25)}
.objectives{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px;margin-top:10px}
.objectives div{background:var(--bg1);border-radius:14px;padding:10px 14px;font-size:15px;display:flex;gap:8px}
/* slides */
.slider{position:relative;scroll-margin-top:90px}
.slide{animation:pop .35s ease}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.99)}to{opacity:1;transform:none}}
.slide h3{font-size:24px;color:var(--pd);display:flex;gap:10px;align-items:center;margin-bottom:10px}
.slide h3 .k{font-size:13px;background:var(--p3);color:var(--pd);border-radius:99px;padding:2px 10px;font-weight:700}
.slide .cols{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start}
.slide .cols.single{grid-template-columns:1fr}
.slide p{margin:0 0 10px;color:var(--ink2);font-size:17px}
.slide ul.bul{margin:6px 0 10px;padding:0 20px 0 0}
.slide ul.bul li{margin:4px 0;color:var(--ink2)}
.eq{font-family:"Cairo",monospace;direction:ltr;text-align:center;font-size:22px;font-weight:800;background:linear-gradient(135deg,var(--p3),#fff);border:1px dashed var(--p2);border-radius:14px;padding:12px;margin:10px 0;color:var(--pd);letter-spacing:.5px}
.note{background:var(--warn2);border-right:5px solid var(--warn);border-radius:12px;padding:10px 14px;margin:10px 0;font-size:15px;color:#78350f}
.example{background:#f8fafc;border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:10px 0}
.example .q{font-weight:700;color:var(--ink)}
.example .st{display:none;margin:6px 0;padding:8px 12px;background:#fff;border-radius:10px;border-right:4px solid var(--p2);direction:rtl}
.example .st.show{display:block;animation:pop .3s}
.example .ans{display:none;margin-top:8px;font-weight:800;color:var(--ok);background:var(--ok2);border-radius:10px;padding:8px 12px}
.example .ans.show{display:block}
.slidenav{display:flex;align-items:center;justify-content:space-between;margin-top:18px;gap:10px;flex-wrap:wrap}
.dots{display:flex;gap:5px;flex-wrap:wrap;justify-content:center;flex:1}
.dots i{width:10px;height:10px;border-radius:50%;background:#dbe3ee;cursor:pointer;transition:.2s}
.dots i.on{background:var(--p);transform:scale(1.3)}
.dots i.seen{background:var(--p2)}
.btn{border:none;border-radius:14px;padding:11px 20px;font-weight:800;color:#fff;background:linear-gradient(135deg,var(--p),var(--p2));box-shadow:0 10px 20px -10px var(--p);transition:.2s;display:inline-flex;align-items:center;gap:8px}
.btn:hover{transform:translateY(-2px);filter:brightness(1.05)}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.btn.ghost{background:#fff;color:var(--pd);border:1px solid var(--line);box-shadow:none}
.btn.ok{background:linear-gradient(135deg,#16a34a,#4ade80);box-shadow:0 10px 20px -10px #16a34a}
.btn.bad{background:linear-gradient(135deg,#dc2626,#f87171)}
.btn.warn{background:linear-gradient(135deg,#d97706,#fbbf24)}
.btn.sm{padding:7px 14px;font-size:14px;border-radius:10px}
/* vis */
.vis{background:#fff;border:1px solid var(--line);border-radius:16px;padding:10px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.6);overflow:hidden}
.vis svg{width:100%;height:auto;display:block;direction:ltr}
.vis .foot{font-size:13px;color:var(--ink2);text-align:center;margin-top:6px;background:var(--bg1);border-radius:10px;padding:6px 10px;line-height:1.6}
.vis .cap{font-size:14px;color:var(--ink3);margin-top:8px;text-align:center;border-top:1px dashed var(--line);padding-top:8px}
.vis .ctrls{display:flex;flex-wrap:wrap;gap:8px 16px;margin-top:8px;direction:rtl}
.vis .ctrl{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink2);flex:1;min-width:240px}
.vis .ctrl label{white-space:nowrap;min-width:max-content}
.vis .ctrl input[type=range]{flex:1;accent-color:var(--p);min-width:80px}
.vis .ctrl output{font-weight:800;color:var(--pd);min-width:60px;text-align:left;direction:ltr;font-family:Cairo;white-space:nowrap}
.vis .btns{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;justify-content:center}
.vis .readout{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:8px}
.vis .readout span{background:var(--p3);color:var(--pd);border-radius:10px;padding:4px 12px;font-weight:800;font-family:Cairo;direction:rtl}
.vis .readout bdi[dir=ltr]{font-family:Cairo}
.vis table{width:100%;border-collapse:collapse;font-size:15px}
.vis table th{background:var(--p3);color:var(--pd);padding:8px;border:1px solid var(--line)}
.vis table td{padding:8px;border:1px solid var(--line);text-align:center}
.vis table tr:nth-child(even) td{background:#f8fafc}
.cmp{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.cmp div{background:var(--bg1);border-radius:14px;padding:12px;text-align:center;border:1px solid var(--line)}
.cmp div .e{font-size:40px}
.cmp div b{display:block;color:var(--pd);margin:4px 0}
.cmp div small{display:block;color:var(--ink2);font-size:13px;line-height:1.5}
.stepsv{display:grid;gap:8px}
.stepsv .s{display:flex;gap:10px;align-items:center;background:#f8fafc;border:1px solid var(--line);border-radius:12px;padding:8px 12px;opacity:.35;transition:.3s;transform:translateX(10px)}
.stepsv .s.on{opacity:1;transform:none;background:var(--bg1);border-color:var(--p2)}
.stepsv .s .e{font-size:24px}
.scene{position:relative;width:100%;aspect-ratio:16/10;border-radius:14px;overflow:hidden}
.scene .it{position:absolute;transform:translate(-50%,-50%);text-align:center;line-height:1;transition:.3s}
.scene .it small{display:block;font-size:12px;background:rgba(255,255,255,.85);border-radius:8px;padding:2px 6px;margin-top:4px;color:var(--ink2);white-space:nowrap;line-height:1.4}
.scene svg.arr{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
/* activities */
.act{animation:pop .35s}
.act .ahead{display:flex;gap:12px;align-items:center;margin-bottom:12px}
.act .ahead .ic{width:48px;height:48px;border-radius:14px;background:var(--p3);display:grid;place-items:center;font-size:24px}
.act .ahead h3{font-size:20px;color:var(--pd)}
.act .ahead p{margin:0;color:var(--ink3);font-size:14px}
.qbox{background:#f8fafc;border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin:10px 0}
.qbox .qt{font-weight:700;margin-bottom:8px;display:flex;gap:8px}
.qbox .qt .n{background:var(--p);color:#fff;border-radius:8px;min-width:28px;height:28px;display:grid;place-items:center;font-size:14px}
.opts{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.opt{border:2px solid var(--line);background:#fff;border-radius:12px;padding:10px 14px;text-align:right;transition:.2s;font-weight:600;color:var(--ink2)}
.opt:hover{border-color:var(--p2);background:var(--p3)}
.opt.ok{border-color:var(--ok);background:var(--ok2);color:#166534}
.opt.bad{border-color:var(--bad);background:var(--bad2);color:#991b1b;animation:shake .4s}
.opt:disabled{cursor:default;opacity:.85}
@keyframes shake{25%{transform:translateX(5px)}75%{transform:translateX(-5px)}}
.why{display:none;margin-top:8px;padding:8px 12px;border-radius:10px;background:#fff;border-right:4px solid var(--p2);font-size:14px;color:var(--ink2)}
.why.show{display:block;animation:pop .3s}
.result{margin-top:14px;padding:16px;border-radius:16px;text-align:center;background:linear-gradient(135deg,var(--p3),#fff);border:1px solid var(--p2)}
.result b{font-size:24px;color:var(--pd)}
.result .stars{font-size:28px;letter-spacing:4px}
.tfrow{display:flex;align-items:center;gap:10px;background:#f8fafc;border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin:8px 0;flex-wrap:wrap}
.tfrow .s{flex:1;font-weight:600;min-width:200px}
.tfrow .b{display:flex;gap:6px}
.tfbtn{border:2px solid var(--line);background:#fff;border-radius:10px;padding:6px 14px;font-weight:700}
.tfbtn.t{color:var(--ok)}.tfbtn.f{color:var(--bad)}
.tfbtn.ok{background:var(--ok2);border-color:var(--ok)}.tfbtn.bad{background:var(--bad2);border-color:var(--bad)}
.matchwrap{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mcol{display:grid;gap:8px;align-content:start}
.mitem{border:2px solid var(--line);background:#fff;border-radius:12px;padding:10px 12px;cursor:pointer;transition:.2s;font-weight:600;min-height:48px;display:flex;align-items:center}
.mitem.sel{border-color:var(--p);background:var(--p3)}
.mitem.done{border-color:var(--ok);background:var(--ok2);color:#166534;cursor:default}
.mitem.bad{animation:shake .4s;border-color:var(--bad)}
.orderlist{display:grid;gap:8px}
.oitem{display:flex;align-items:center;gap:10px;border:2px solid var(--line);background:#fff;border-radius:12px;padding:10px 12px;font-weight:600}
.oitem .mv{display:flex;flex-direction:column;gap:2px}
.oitem .mv button{border:1px solid var(--line);background:#f8fafc;border-radius:6px;width:30px;height:22px;font-size:12px;line-height:1}
.oitem .n{background:var(--p3);color:var(--pd);border-radius:8px;width:28px;height:28px;display:grid;place-items:center;font-weight:800}
.oitem.ok{border-color:var(--ok);background:var(--ok2)}.oitem.bad{border-color:var(--bad);background:var(--bad2)}
.filltext{font-size:18px;line-height:2.3;background:#f8fafc;border:1px solid var(--line);border-radius:14px;padding:14px}
.blank{display:inline-block;min-width:110px;border-bottom:3px solid var(--p2);text-align:center;margin:0 4px;padding:0 6px;cursor:pointer;background:#fff;border-radius:8px 8px 0 0;color:var(--pd);font-weight:800;transition:.2s}
.blank.cur{background:var(--p3);box-shadow:0 0 0 3px var(--p3)}
.blank.ok{border-color:var(--ok);background:var(--ok2)}.blank.bad{border-color:var(--bad);background:var(--bad2)}
.bank{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.bank button{border:2px solid var(--line);background:#fff;border-radius:99px;padding:6px 16px;font-weight:700;transition:.2s}
.bank button:hover{border-color:var(--p);background:var(--p3)}
.bank button.used{opacity:.35;text-decoration:line-through}
.bins{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-top:10px}
.bin{border:2px dashed var(--p2);border-radius:14px;min-height:120px;padding:10px;background:var(--bg1)}
.bin h4{text-align:center;color:var(--pd);margin-bottom:6px}
.bin .items{display:flex;flex-wrap:wrap;gap:6px}
.pool{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0;min-height:48px;padding:10px;background:#f8fafc;border-radius:14px;border:1px solid var(--line)}
.tag{border:2px solid var(--line);background:#fff;border-radius:99px;padding:5px 14px;font-weight:700;cursor:pointer;transition:.2s;font-size:15px}
.tag.sel{border-color:var(--p);background:var(--p3)}
.tag.ok{border-color:var(--ok);background:var(--ok2)}.tag.bad{border-color:var(--bad);background:var(--bad2)}
.calcrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}
.calcrow input{border:2px solid var(--line);border-radius:12px;padding:9px 12px;width:180px;direction:ltr;font-family:Cairo;font-size:17px;text-align:center}
.calcrow input.ok{border-color:var(--ok);background:var(--ok2)}.calcrow input.bad{border-color:var(--bad);background:var(--bad2)}
.calcrow .u{font-weight:800;color:var(--pd);direction:ltr;font-family:Cairo}
.sol{display:none;margin-top:8px;background:#fff;border-radius:12px;padding:10px 14px;border-right:4px solid var(--ok)}
.sol.show{display:block}
.sol div{padding:3px 0;direction:rtl}
.labelwrap{position:relative}
.labelwrap svg .hp{cursor:pointer}
.labelwrap svg .hp circle{fill:#fff;stroke:var(--p);stroke-width:3;transition:.2s}
.labelwrap svg .hp text{font-weight:800;fill:var(--pd);font-size:14px;pointer-events:none}
.labelwrap svg .hp.cur circle{fill:var(--p3);stroke-width:5}
.labelwrap svg .hp.ok circle{fill:#bbf7d0;stroke:#16a34a}
.labelwrap svg .hp.bad circle{fill:#fecaca;stroke:#dc2626}

.flashwrap{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}

.think .rev{display:none;background:var(--ok2);border-radius:12px;padding:12px;margin-top:10px;border-right:4px solid var(--ok)}

.tasks{margin:8px 0;padding:0 18px 0 0}

.gover{text-align:center;padding:20px}
.gover .big{font-size:60px}
.gover h3{font-size:26px;color:var(--pd);margin:8px 0}
.track{position:relative;height:70px;background:repeating-linear-gradient(90deg,#64748b 0 20px,#94a3b8 20px 40px);border-radius:12px;margin:8px 0;overflow:hidden}

.track .fin{position:absolute;left:8px;top:0;bottom:0;width:14px;background:repeating-conic-gradient(#fff 0 25%,#000 0 50%) 0 0/14px 14px}

.mem{aspect-ratio:5/4;perspective:800px;cursor:pointer}

.mem.f .in,.mem.m .in{transform:rotateY(180deg)}
.mem .face{position:absolute;inset:0;backface-visibility:hidden;border-radius:14px;display:grid;place-items:center;text-align:center;padding:6px;font-size:14px;font-weight:700;line-height:1.3}
.mem .face.a{background:linear-gradient(135deg,var(--p),var(--pd));color:#fff;font-size:28px}
.mem .face.b{transform:rotateY(180deg);background:#fff;border:2px solid var(--p2);color:var(--ink)}
.mem.m .face.b{background:var(--ok2);border-color:var(--ok)}
canvas.gc{width:100%;border-radius:14px;background:linear-gradient(180deg,#e0f2fe,#f0f9ff);display:block;touch-action:none}

.lifelines{display:flex;gap:6px;justify-content:center;margin:8px 0}
.boardwrap{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin:8px 0}

.cell .pawns{position:absolute;bottom:2px;left:2px;right:2px;display:flex;justify-content:space-around;font-size:18px}

.team{border:2px solid var(--line);border-radius:12px;padding:6px 14px;font-weight:800}
.team.on{border-color:var(--p);background:var(--p3)}
.letters{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin:10px 0;direction:rtl}
.letter{width:48px;height:52px;border-radius:12px;background:#fff;border:2px solid var(--p2);display:grid;place-items:center;font-size:24px;font-weight:800;cursor:pointer;transition:.2s;color:var(--pd)}

.letter.used{opacity:.3;pointer-events:none}
.answer-slots{display:flex;gap:6px;justify-content:center;min-height:56px;margin:10px 0;direction:rtl;flex-wrap:wrap}
.answer-slots .letter{background:var(--p3);cursor:pointer}
.speedcard{font-size:22px;font-weight:700;text-align:center;padding:30px 16px;background:#fff;border:2px solid var(--p2);border-radius:18px;margin:10px 0;min-height:140px;display:grid;place-items:center}

.tgt.miss{background:var(--bad2);animation:shake .4s}
.tgt span{background:rgba(255,255,255,.9);border-radius:8px;padding:4px 6px}

.toast.show{transform:translateX(-50%);opacity:1}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:998}

.cert .name{font-size:32px;font-weight:900;color:var(--ink);margin:10px 0}

.cert .stats div{background:var(--p3);border-radius:14px;padding:10px 18px;min-width:120px}
.cert .stats b{font-size:26px;color:var(--pd);display:block}

.modal .box{background:#fff;border-radius:20px;padding:22px;max-width:520px;width:100%;box-shadow:0 30px 60px -20px rgba(0,0,0,.5);animation:pop .3s}

.modal input{width:100%;border:2px solid var(--line);border-radius:12px;padding:10px;margin:8px 0}
.unitquiz .qbox{background:#fff}
.timerbar{height:8px;background:#e2e8f0;border-radius:99px;overflow:hidden;margin:6px 0}
.timerbar i{display:block;height:100%;background:linear-gradient(90deg,#f59e0b,#ef4444);transition:width 1s linear}
.badge{display:inline-flex;align-items:center;gap:4px;background:var(--warn2);color:#92400e;border-radius:99px;padding:2px 10px;font-size:13px;font-weight:700}
.kbd{font-size:12px;color:var(--ink3);text-align:center;margin-top:6px}

<script>window.__NAV={"pre": [], "levels": ["div.card.ucard", "div.card.lcard", "button.tab"]}</script><script>(function(){var N=window.__NAV,q=new URLSearchParams(location.search).get("go");if(!N||!q)return;

function run(i){if(i>=steps.length)return;var s=steps[i],t=0;(function w(){var l=[].filter.call(document.querySelectorAll(s.sel),vis);
