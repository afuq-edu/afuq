<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>رياض لغتي — أحب لغتي للصف الثاني (الجزء الأول)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@400;500;600;700;800&family=Noto+Naskh+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFF8EC; --bg2:#FFEFD2; --ink:#2E2A3A; --muted:#6F6A7E;
  --card:#FFFFFF; --line:#F1E3CC;
  --p:#FF7A59; --p2:#FFB347; --g:#4CC38A; --b:#4EA5FF; --v:#9B7BFF; --y:#FFD23F; --r:#FF5D5D; --t:#2ED3C4; --pk:#FF7FB2;
  --sh:0 10px 30px rgba(80,50,20,.10);
  --r1:18px; --r2:26px;
  --ui:'Baloo Bhaijaan 2', 'Segoe UI', Tahoma, sans-serif;
  --txt:'Noto Naskh Arabic', 'Amiri', serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{font-family:var(--ui);background:var(--bg);color:var(--ink);overflow-x:hidden;min-height:100vh;
  background-image:radial-gradient(circle at 10% 10%, #FFE9C7 0, transparent 35%), radial-gradient(circle at 90% 30%, #DFF4FF 0, transparent 35%), radial-gradient(circle at 50% 100%, #E6FFE9 0, transparent 40%);}
button{font-family:var(--ui);cursor:pointer;border:none}
input,textarea{font-family:var(--ui)}
.hidden{display:none!important}

/* ===== floating decor ===== */
.decor{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.decor span{position:absolute;font-size:34px;opacity:.16;animation:floaty 12s ease-in-out infinite}
@keyframes floaty{0%,100%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-28px) rotate(8deg)}}

/* ===== top bar ===== */
#top{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:10px;padding:10px 14px;
  background:rgba(255,248,236,.85);backdrop-filter:blur(10px);border-bottom:2px solid var(--line)}
#top .title{flex:1;font-weight:800;font-size:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#top .title small{display:block;font-size:12px;color:var(--muted);font-weight:600}
.ib{width:44px;height:44px;border-radius:14px;background:#fff;box-shadow:var(--sh);font-size:20px;display:grid;place-items:center;transition:.15s}
.ib:active{transform:scale(.92)}
.ib.off{opacity:.45;filter:grayscale(1)}

/* ===== layout ===== */
#app{position:relative;z-index:1;max-width:1100px;margin:0 auto;padding:16px 14px 90px}
.card{background:var(--card);border-radius:var(--r2);box-shadow:var(--sh);padding:20px;border:2px solid var(--line)}
.center{text-align:center}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grow{flex:1}
h1,h2,h3{margin:0 0 10px;font-weight:800;line-height:1.35}
h2{font-size:26px}
h3{font-size:20px;color:var(--p)}
.muted{color:var(--muted)}
.txt{font-family:var(--txt);font-size:24px;line-height:2.1}
.big{font-size:30px}

/* ===== buttons ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 22px;border-radius:16px;font-weight:800;font-size:18px;
  background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;box-shadow:0 6px 0 rgba(0,0,0,.12),var(--sh);transition:.12s;position:relative;top:0}
.btn:active{top:4px;box-shadow:0 2px 0 rgba(0,0,0,.12)}
.btn.g{background:linear-gradient(135deg,#3DBF7A,#7ED957)}
.btn.b{background:linear-gradient(135deg,#3B8BFF,#6ED0FF)}
.btn.v{background:linear-gradient(135deg,#8E6BFF,#C79BFF)}
.btn.y{background:linear-gradient(135deg,#FFB800,#FFE066);color:#4a3600}
.btn.w{background:#fff;color:var(--ink);border:2px solid var(--line)}
.btn.sm{padding:8px 14px;font-size:15px;border-radius:12px}
.btn:disabled{opacity:.5;filter:grayscale(.4);cursor:not-allowed}
.btn .e{font-size:22px}

/* ===== home map ===== */
.hero{display:flex;align-items:center;gap:20px;padding:24px;border-radius:30px;background:linear-gradient(135deg,#FFE7C2,#FFD1E3 60%,#D7EEFF);border:3px solid #fff;box-shadow:var(--sh);position:relative;overflow:hidden}
.hero h1{font-size:34px;margin:0}
.hero .sub{font-size:16px;color:#5a4a3a;font-weight:600}
.hero .mascot{font-size:84px;filter:drop-shadow(0 8px 10px rgba(0,0,0,.15));animation:bob 3s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.stations{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px;margin-top:20px}
.station{position:relative;border-radius:24px;padding:18px;background:#fff;border:3px solid transparent;box-shadow:var(--sh);cursor:pointer;transition:.2s;overflow:hidden;min-height:150px;display:flex;flex-direction:column;gap:6px}
.station:hover{transform:translateY(-4px)}
.station .num{position:absolute;top:12px;left:12px;width:34px;height:34px;border-radius:50%;background:var(--y);display:grid;place-items:center;font-weight:800}
.station .ico{font-size:46px;line-height:1}
.station .nm{font-weight:800;font-size:19px}
.station .kd{font-size:13px;color:var(--muted);font-weight:600}
.station .prog{height:10px;border-radius:8px;background:#F2EAD9;overflow:hidden;margin-top:auto}
.station .prog i{display:block;height:100%;background:linear-gradient(90deg,var(--g),#B5F5C9);width:0;transition:.5s}
.station .stars{font-size:14px;letter-spacing:2px}

/* ===== lesson view ===== */
.steps{display:flex;gap:8px;overflow-x:auto;padding:8px 4px 12px;scrollbar-width:thin}
.steps::-webkit-scrollbar{height:6px}
.steps::-webkit-scrollbar-thumb{background:#e6d7bd;border-radius:6px}
.step{flex:0 0 auto;padding:10px 14px;border-radius:14px;background:#fff;border:2px solid var(--line);font-weight:800;font-size:15px;cursor:pointer;display:flex;align-items:center;gap:6px;white-space:nowrap;transition:.15s}
.step.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.step.done::after{content:'✓';background:var(--g);color:#fff;border-radius:50%;width:20px;height:20px;display:grid;place-items:center;font-size:12px}
.step.pre{border-color:#FFB347;background:#FFF3DF}
.step.post{border-color:#4CC38A;background:#E8FBEF}
.step.pre.on,.step.post.on{background:var(--ink);color:#fff}
.tag{display:inline-block;padding:4px 12px;border-radius:99px;font-size:13px;font-weight:800;background:#FFF1DC;color:#B45A2B}
.tag.pre{background:#FFE9C4;color:#9a5a00}.tag.post{background:#DDF7E7;color:#177a44}.tag.game{background:#EAE2FF;color:#5a37c8}.tag.read{background:#DCEFFF;color:#1b5ea8}

.acthead{display:flex;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.acthead .ttl{font-size:24px;font-weight:800;flex:1}
.navbtns{display:flex;justify-content:space-between;gap:10px;margin-top:18px;flex-wrap:wrap}

/* ===== scene ===== */
.scene{display:flex;flex-wrap:wrap;justify-content:center;gap:14px;padding:20px;border-radius:24px;background:linear-gradient(180deg,#E9F7FF,#FFF7E4);border:2px dashed #FFD9A8;min-height:120px}
.scene .it{font-size:56px;line-height:1;animation:pop .6s both;cursor:pointer;transition:.15s;text-align:center}
.scene .it small{display:block;font-size:14px;font-weight:800;color:var(--muted);margin-top:4px}
.scene .it:hover{transform:scale(1.15) rotate(-4deg)}
@keyframes pop{0%{transform:scale(0);opacity:0}70%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}
.prompts{display:grid;gap:10px;margin-top:14px}
.prompt{display:flex;gap:12px;align-items:center;padding:14px 16px;border-radius:18px;background:#FFF9F0;border:2px solid #FFE6C2;font-size:20px;font-weight:700;cursor:pointer}
.prompt .n{width:36px;height:36px;border-radius:12px;background:var(--p);color:#fff;display:grid;place-items:center;font-weight:800;flex:none}
.prompt:hover{background:#FFF1DC}

/* ===== options ===== */
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-top:12px}
.opt{padding:16px;border-radius:20px;background:#fff;border:3px solid var(--line);font-size:22px;font-weight:800;cursor:pointer;text-align:center;transition:.15s;position:relative;font-family:var(--txt)}
.opt .e{display:block;font-size:48px;line-height:1.2;margin-bottom:6px;font-family:var(--ui)}
.opt:hover{border-color:var(--b);transform:translateY(-3px)}
.opt.sel{border-color:var(--v);background:#F3EEFF}
.opt.ok{border-color:var(--g);background:#E8FBEF;animation:wig .5s}
.opt.bad{border-color:var(--r);background:#FFEAEA;animation:shake .4s}
.opt.dim{opacity:.45}
@keyframes wig{0%,100%{transform:rotate(0)}25%{transform:rotate(-3deg) scale(1.05)}75%{transform:rotate(3deg) scale(1.05)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}

.chips{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:12px 0}
.chip{padding:10px 18px;border-radius:14px;background:linear-gradient(135deg,#FFF3DF,#FFE4C0);border:2px solid #FFCF8C;font-weight:800;font-size:22px;cursor:pointer;font-family:var(--txt);transition:.15s;user-select:none}
.chip:hover{transform:translateY(-3px) scale(1.04)}
.chip.used{opacity:.3;pointer-events:none}
.chip.sel{background:var(--v);color:#fff;border-color:var(--v)}
.blank{display:inline-block;min-width:90px;padding:2px 12px;border-bottom:3px dashed var(--p);margin:0 4px;text-align:center;color:var(--p);font-weight:800;cursor:pointer;border-radius:8px;vertical-align:middle;min-height:38px}
.blank.active{background:#FFF1DC}
.blank.ok{border-color:var(--g);color:#177a44;background:#E8FBEF}
.blank.bad{border-color:var(--r);color:#c00;background:#FFEAEA}

.fb{margin-top:14px;padding:14px 18px;border-radius:16px;font-weight:800;font-size:19px;display:none;align-items:center;gap:10px}
.fb.show{display:flex;animation:pop .4s}
.fb.ok{background:#E8FBEF;color:#177a44;border:2px solid #A7E8C4}
.fb.bad{background:#FFEAEA;color:#b00020;border:2px solid #FFB3B3}
.fb.info{background:#EAF4FF;color:#1b5ea8;border:2px solid #B9DBFF}

/* ===== reading ===== */
.readbox{font-family:var(--txt);font-size:var(--rs,27px);line-height:2.2;padding:22px;border-radius:24px;background:linear-gradient(180deg,#FFFDF8,#FFF6E6);border:2px solid #FFE3B8}
.readbox .sec{margin-bottom:18px}
.readbox .sh{font-family:var(--ui);font-weight:800;color:var(--p);font-size:22px;display:flex;align-items:center;gap:8px;margin-bottom:6px}
.sent{cursor:pointer;border-radius:10px;padding:2px 6px;transition:.2s;display:inline}
.sent:hover{background:#FFF0D2}
.sent.now{background:linear-gradient(120deg,#FFE7A3,#FFD07A);box-shadow:0 0 0 3px #FFD07A}
.sent .w{border-radius:6px;padding:0 2px}
.sent .w.hide{background:#2E2A3A;color:transparent;border-radius:8px}
.sent .w.hide.rev{background:#FFE7A3;color:inherit}
.gl{background:#E3F2FF;border-bottom:3px dotted var(--b);cursor:help;border-radius:6px}
.rtools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}

/* ===== order / sequence ===== */
.seq{display:grid;gap:10px}
.seqit{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:18px;background:#fff;border:3px solid var(--line);font-size:21px;font-weight:700;cursor:pointer;font-family:var(--txt);transition:.15s}
.seqit .n{width:40px;height:40px;border-radius:50%;background:#F2EAD9;display:grid;place-items:center;font-weight:800;font-family:var(--ui);flex:none;font-size:18px}
.seqit.picked{opacity:.35;pointer-events:none}
.seqit.ok{border-color:var(--g);background:#E8FBEF}
.seqit.bad{border-color:var(--r);background:#FFEAEA}
.slots{display:grid;gap:8px;margin-bottom:14px}
.slot{min-height:54px;border-radius:16px;border:3px dashed #E5D5B8;display:flex;align-items:center;gap:10px;padding:8px 14px;font-family:var(--txt);font-size:20px;font-weight:700;background:#FFFBF4}
.slot .n{width:34px;height:34px;border-radius:50%;background:var(--y);display:grid;place-items:center;font-family:var(--ui);font-weight:800;flex:none}
.slot.filled{border-style:solid;border-color:var(--v);background:#F7F3FF}

/* ===== match ===== */
.mcols{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.mcol{display:grid;gap:10px;align-content:start}
.mit{padding:14px;border-radius:18px;background:#fff;border:3px solid var(--line);font-size:21px;font-weight:700;text-align:center;cursor:pointer;font-family:var(--txt);transition:.15s;min-height:64px;display:flex;align-items:center;justify-content:center;gap:8px}
.mit .e{font-size:38px;font-family:var(--ui)}
.mit.sel{border-color:var(--v);background:#F3EEFF;transform:scale(1.04)}
.mit.done{pointer-events:none;color:#fff;border-color:transparent}

/* ===== buckets ===== */
.buckets{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-top:12px}
.bucket{min-height:120px;border-radius:22px;border:3px dashed #D9CBB0;padding:12px;background:#FFFBF4;text-align:center;transition:.15s;cursor:pointer}
.bucket.hot{border-color:var(--v);background:#F3EEFF;transform:scale(1.03)}
.bucket .bh{font-weight:800;font-size:19px;margin-bottom:8px}
.bucket .bh .e{font-size:34px;display:block}
.bucket .bi{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.bucket .bi span{padding:4px 10px;border-radius:10px;background:#fff;border:2px solid var(--line);font-family:var(--txt);font-size:18px;font-weight:700}
.bucket .bi span.ok{border-color:var(--g);background:#E8FBEF}
.bucket .bi span.bad{border-color:var(--r);background:#FFEAEA}
.pool{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;padding:14px;border-radius:20px;background:#fff;border:2px solid var(--line);min-height:70px}

/* ===== games ===== */
.arena{position:relative;height:440px;border-radius:26px;overflow:hidden;background:linear-gradient(180deg,#BFE7FF 0%,#E9F7FF 60%,#CDEFB8 100%);border:3px solid #fff;box-shadow:var(--sh);user-select:none}
.arena .hud{position:absolute;top:10px;right:12px;left:12px;display:flex;justify-content:space-between;gap:10px;z-index:5;font-weight:800;font-size:18px}
.arena .hud span{background:rgba(255,255,255,.9);padding:6px 14px;border-radius:12px;box-shadow:var(--sh)}
.arena .overlay{position:absolute;inset:0;display:grid;place-items:center;background:rgba(255,255,255,.7);z-index:6;text-align:center;padding:20px}
.fly{position:absolute;padding:10px 18px;border-radius:16px;font-family:var(--txt);font-size:24px;font-weight:800;background:#fff;box-shadow:var(--sh);cursor:pointer;border:3px solid #fff;transition:transform .15s;white-space:nowrap}
.fly:hover{transform:scale(1.08)}
.fly.ok{background:var(--g);color:#fff;border-color:#fff}
.fly.bad{background:var(--r);color:#fff}
.balloon{position:absolute;width:110px;text-align:center;cursor:pointer;transition:transform .15s}
.balloon .bd{width:100px;height:120px;border-radius:50% 50% 50% 50%/45% 45% 55% 55%;display:grid;place-items:center;font-family:var(--txt);font-size:22px;font-weight:800;color:#fff;box-shadow:inset -10px -10px 0 rgba(0,0,0,.08);margin:0 auto;padding:4px}
.balloon .st{width:2px;height:40px;background:#8a7a66;margin:0 auto}
.balloon.pop{animation:popb .35s forwards}
@keyframes popb{to{transform:scale(1.6);opacity:0}}
.drop{position:absolute;font-size:52px;cursor:pointer;line-height:1;text-align:center;transition:transform .1s}
.drop small{display:block;font-size:14px;font-weight:800;background:#fff;border-radius:8px;padding:2px 6px;margin-top:2px}
.drop.got{animation:popb .3s forwards}
.pickpanel{position:absolute;bottom:14px;left:14px;right:14px;display:flex;gap:10px;justify-content:center;z-index:5;flex-wrap:wrap}

/* ===== memory ===== */
.memgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media(max-width:600px){.memgrid{grid-template-columns:repeat(3,1fr)}}
.mcard{aspect-ratio:1;perspective:800px;cursor:pointer}
.mcard .in{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.mcard.flip .in{transform:rotateY(180deg)}
.mcard .f,.mcard .bk{position:absolute;inset:0;border-radius:18px;display:grid;place-items:center;backface-visibility:hidden;font-weight:800;font-family:var(--txt);font-size:20px;padding:6px;text-align:center}
.mcard .f{background:linear-gradient(135deg,var(--v),#C79BFF);color:#fff;font-size:40px;font-family:var(--ui)}
.mcard .bk{background:#fff;border:3px solid var(--line);transform:rotateY(180deg)}
.mcard.win .bk{border-color:var(--g);background:#E8FBEF}

/* ===== anasheed ===== */
.verse{display:grid;grid-template-columns:1fr 1fr;gap:8px 24px;padding:12px 18px;border-radius:18px;margin-bottom:8px;font-family:var(--txt);font-size:26px;font-weight:700;cursor:pointer;transition:.2s;border:2px solid transparent;text-align:center}
.verse:hover{background:#FFF3DF}
.verse.now{background:linear-gradient(120deg,#FFE7A3,#FFD07A);border-color:#FFC260}
.verse.hidden-l span{color:transparent;background:#3a3550;border-radius:8px}
@media(max-width:560px){.verse{grid-template-columns:1fr;font-size:22px}}

/* ===== roleplay ===== */
.bubbles{display:grid;gap:12px}
.bub{display:flex;gap:10px;align-items:flex-end;max-width:85%}
.bub.r1{margin-inline-start:auto;flex-direction:row-reverse}
.bub .av{font-size:44px;flex:none}
.bub .tx{padding:12px 18px;border-radius:20px 20px 4px 20px;background:#E3F2FF;font-family:var(--txt);font-size:22px;font-weight:700;cursor:pointer;line-height:1.9}
.bub.r1 .tx{background:#FFE9D6;border-radius:20px 20px 20px 4px}
.bub .tx.now{outline:3px solid var(--y)}

/* ===== trace ===== */
.tracewrap{position:relative;border-radius:22px;overflow:hidden;border:3px solid var(--line);background:repeating-linear-gradient(0deg,#fff 0 38px,#FFE3B8 38px 40px)}
.tracewrap canvas{display:block;width:100%;touch-action:none;cursor:crosshair}
.tracewrap .guide{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--txt);font-size:120px;font-weight:700;color:rgba(70,60,120,.16);pointer-events:none;text-align:center;line-height:1.3}

/* ===== quiz ===== */
.qhud{display:flex;gap:10px;justify-content:space-between;align-items:center;margin-bottom:12px;font-weight:800}
.pbar{height:14px;border-radius:10px;background:#F2EAD9;overflow:hidden;flex:1}
.pbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--p),var(--y));transition:.4s}
.result{text-align:center;padding:24px}
.result .big{font-size:80px;animation:pop .6s}
.starsbig{font-size:50px;letter-spacing:6px}

/* ===== map (souq) ===== */
.souq{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:14px;border-radius:24px;background:#F6EEDC;border:3px solid #E7D7B5}
.shop{min-height:74px;border-radius:14px;background:#fff;border:3px solid #E7D7B5;display:grid;place-items:center;text-align:center;font-weight:800;font-size:15px;padding:6px;cursor:pointer;position:relative;transition:.15s;font-family:var(--txt)}
.shop .e{font-size:26px;display:block;font-family:var(--ui)}
.shop.vis{border-color:var(--g);background:#E8FBEF}
.shop.vis::after{content:attr(data-n);position:absolute;top:-8px;right:-8px;width:26px;height:26px;border-radius:50%;background:var(--g);color:#fff;font-size:13px;display:grid;place-items:center;font-family:var(--ui)}
.shop.gate{background:linear-gradient(135deg,#FFD07A,#FFB347)}
.shop.blank{border-style:dashed;color:var(--muted)}
.shop.bad{animation:shake .4s;border-color:var(--r)}

/* ===== tidy room ===== */
.room{position:relative;height:380px;border-radius:26px;background:linear-gradient(180deg,#F8EAFF 0 60%,#E9D2B5 60%);border:3px solid #fff;box-shadow:var(--sh);overflow:hidden}
.room .item{position:absolute;font-size:44px;cursor:pointer;transition:all .6s cubic-bezier(.2,.8,.2,1.2);line-height:1}
.room .shelf{position:absolute;left:14px;right:14px;top:16px;height:70px;border-radius:14px;background:rgba(255,255,255,.7);border:2px dashed #c9a6ff;display:flex;gap:8px;align-items:center;justify-content:center;padding:6px}
.room .shelf span{font-size:36px;opacity:.25}

/* ===== poll ===== */
.poll{display:grid;gap:8px;margin-top:12px}
.pollrow{display:grid;grid-template-columns:120px 1fr 44px;align-items:center;gap:10px;font-weight:800}
.pollrow .bar{height:26px;border-radius:10px;background:#F2EAD9;overflow:hidden}
.pollrow .bar i{display:block;height:100%;width:0;transition:.5s;border-radius:10px}
.pollrow button{background:#fff;border:2px solid var(--line);border-radius:12px;padding:6px 8px;font-size:18px}

/* ===== letters grid ===== */
.lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:8px}
.lt{aspect-ratio:1;max-height:96px;border-radius:16px;flex-direction:column;background:#fff;border:3px solid var(--line);display:grid;place-items:center;font-family:var(--txt);font-size:30px;font-weight:800;cursor:pointer;transition:.15s}
.lt:hover{border-color:var(--v);transform:scale(1.05)}
.lt.done{background:#E8FBEF;border-color:var(--g)}
.lt.cur{background:#F3EEFF;border-color:var(--v)}

/* ===== syllable tiles ===== */
.tiles{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:10px 0}
.tile{min-width:60px;padding:10px 16px;border-radius:14px;background:linear-gradient(135deg,#FFF7E6,#FFE4B8);border:3px solid #F6C87A;font-family:var(--txt);font-size:28px;font-weight:800;cursor:pointer;transition:.15s;user-select:none}
.tile:hover{transform:translateY(-3px)}
.tile.used{opacity:.25;pointer-events:none}
.tile.v{background:linear-gradient(135deg,#EEE8FF,#D9CCFF);border-color:#B79CFF}
.tray{min-height:70px;border-radius:18px;border:3px dashed #D9CBB0;display:flex;gap:8px;align-items:center;justify-content:center;padding:10px;font-family:var(--txt);font-size:32px;font-weight:800;background:#FFFBF4;flex-wrap:wrap}
.tray.ok{border-color:var(--g);background:#E8FBEF}
.tray.bad{border-color:var(--r);background:#FFEAEA}

/* ===== teacher tools ===== */
#tt{position:fixed;bottom:16px;left:16px;z-index:60;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
#ttpanel{background:#fff;border-radius:22px;box-shadow:var(--sh);padding:14px;width:300px;border:2px solid var(--line)}
#ttpanel h4{margin:0 0 8px;font-size:16px}
.timerbig{font-size:44px;font-weight:800;text-align:center;font-variant-numeric:tabular-nums}
.teams{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.team{border-radius:16px;padding:10px;text-align:center;font-weight:800;color:#fff}
.team .sc{font-size:34px}
.team button{background:rgba(255,255,255,.3);color:#fff;border-radius:10px;padding:4px 10px;font-weight:800;font-size:18px;margin:0 2px}
.ttbtn{position:relative}
#toast{position:fixed;bottom:20px;right:50%;transform:translateX(50%);background:var(--ink);color:#fff;padding:12px 22px;border-radius:16px;font-weight:800;z-index:100;opacity:0;transition:.3s;pointer-events:none;font-size:18px}
#toast.show{opacity:1}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:90}

/* misc */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:640px){.grid2{grid-template-columns:1fr}.mcols{gap:8px}}
textarea.ta{width:100%;min-height:110px;border-radius:18px;border:3px solid var(--line);padding:14px;font-size:22px;font-family:var(--txt);line-height:1.9;resize:vertical;background:#FFFDF8}
input.inp{width:100%;border-radius:14px;border:3px solid var(--line);padding:12px;font-size:20px;font-family:var(--txt);background:#FFFDF8}
.face{font-size:64px;cursor:pointer;transition:.15s;display:inline-block}
.face:hover{transform:scale(1.2)}
.note{padding:12px 16px;border-radius:16px;background:#FFF9E6;border:2px solid #FFE58A;font-weight:700;font-size:17px}
.storycard{border-radius:26px;padding:24px;background:linear-gradient(135deg,#FFF7E6,#FFE9F4);border:3px solid #fff;box-shadow:var(--sh);font-family:var(--txt);font-size:22px;line-height:2}
.kbd{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:12px 0}
.kbd .k{width:56px;height:56px;border-radius:14px;background:#fff;border:3px solid var(--line);font-family:var(--txt);font-size:28px;font-weight:800;cursor:pointer}
.kbd .k:hover{border-color:var(--v);background:#F3EEFF}
.wordtiles{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;font-family:var(--txt);font-size:26px;font-weight:700}
.wordtiles span{padding:8px 14px;border-radius:12px;background:#fff;border:3px solid var(--line);cursor:pointer;transition:.15s}
.wordtiles span.hit{background:#E8FBEF;border-color:var(--g)}
.counter{font-size:56px;font-weight:800;text-align:center;color:var(--v)}
.outcomes li{font-size:19px;font-weight:600;margin-bottom:8px;line-height:1.7}
.speak{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:50%;background:#EAF4FF;border:2px solid #B9DBFF;font-size:18px;cursor:pointer;vertical-align:middle;margin-inline-start:6px}
.speak:hover{background:#D3E8FF}
</style>
</head>
<body>
<div class="decor" id="decor"></div>
<div id="top">
  <button class="ib" id="homeBtn" title="الرئيسية">🏠</button>
  <div class="title" id="topTitle">رياض لغتي<small>أحب لغتي — الصف الثاني — الجزء الأول</small></div>
  <button class="ib" id="ttsBtn" title="الصوت المنطوق">🗣️</button>
  <button class="ib" id="sfxBtn" title="المؤثرات الصوتية">🔊</button>
  <button class="ib" id="fsBtn" title="ملء الشاشة">⛶</button>
</div>
<div id="app"></div>
<div id="tt">
  <div id="ttpanel" class="hidden"></div>
  <button class="ib ttbtn" id="ttBtn" title="أدوات المعلم">🧰</button>
</div>
<div id="toast"></div>
<canvas id="confetti"></canvas>
<script>
/* =========================================================
   رياض لغتي — محرك التطبيق
   ========================================================= */
const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
const el = (tag, cls, html) => { const d=document.createElement(tag); if(cls) d.className=cls; if(html!=null) d.innerHTML=html; return d; };
const shuffle = a => { a=[...a]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
const rnd = (a,b) => a + Math.random()*(b-a);
const pick = a => a[Math.floor(Math.random()*a.length)];
const strip = s => (s||'').replace(/[ً-ْٰـ]/g,'');
const sleep = ms => new Promise(r=>setTimeout(r,ms));

/* ---------- store ---------- */
const KEY='riyad_lughati_g2_v1';
const store = { data: JSON.parse(localStorage.getItem(KEY)||'{}'),
  save(){ localStorage.setItem(KEY, JSON.stringify(this.data)); },
  get(k,d){ return this.data[k]===undefined? d : this.data[k]; },
  set(k,v){ this.data[k]=v; this.save(); } };

/* ---------- toast ---------- */
let toastT;
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),1800); }

/* ---------- audio (synth) ---------- */
const SFX = {
  on: store.get('sfx', true), ctx:null,
  ac(){ if(!this.ctx){ try{ this.ctx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } if(this.ctx&&this.ctx.state==='suspended') this.ctx.resume(); return this.ctx; },
  tone(f, t=0.12, type='sine', vol=0.25, when=0){ const c=this.ac(); if(!c||!this.on) return; const o=c.createOscillator(), g=c.createGain(); o.type=type; o.frequency.value=f; g.gain.setValueAtTime(0.0001,c.currentTime+when); g.gain.exponentialRampToValueAtTime(vol,c.currentTime+when+0.01); g.gain.exponentialRampToValueAtTime(0.0001,c.currentTime+when+t); o.connect(g); g.connect(c.destination); o.start(c.currentTime+when); o.stop(c.currentTime+when+t+0.02); },
  click(){ this.tone(600,0.06,'triangle',0.15); },
  pop(){ this.tone(900,0.08,'square',0.12); this.tone(1400,0.06,'sine',0.1,0.04); },
  ok(){ [523,659,784].forEach((f,i)=>this.tone(f,0.16,'triangle',0.2,i*0.09)); },
  bad(){ this.tone(220,0.22,'sawtooth',0.12); this.tone(180,0.25,'sawtooth',0.1,0.1); },
  win(){ [523,659,784,1046,784,1046].forEach((f,i)=>this.tone(f,0.2,'triangle',0.22,i*0.11)); },
  whoosh(){ const c=this.ac(); if(!c||!this.on) return; const o=c.createOscillator(),g=c.createGain(); o.type='sine'; o.frequency.setValueAtTime(300,c.currentTime); o.frequency.exponentialRampToValueAtTime(1200,c.currentTime+0.18); g.gain.setValueAtTime(0.12,c.currentTime); g.gain.exponentialRampToValueAtTime(0.0001,c.currentTime+0.2); o.connect(g); g.connect(c.destination); o.start(); o.stop(c.currentTime+0.22); },
  tick(){ this.tone(1000,0.03,'square',0.06); },
  star(){ [880,1108,1318,1760].forEach((f,i)=>this.tone(f,0.12,'sine',0.18,i*0.06)); }
};

/* ---------- speech ---------- */
const TTS = {
  on: store.get('tts', true), voice:null, rate:0.9,
  init(){ if(!('speechSynthesis' in window)) return; const load=()=>{ const vs=speechSynthesis.getVoices(); const ar=vs.filter(v=>/^ar/i.test(v.lang)); this.voice = ar.find(v=>/Google|Microsoft|Hamed|Naayf|Laila|Zariyah|Salma|Tarik/i.test(v.name)) || ar[0] || null; }; load(); speechSynthesis.onvoiceschanged=load; },
  say(text, opt={}){ return new Promise(res=>{ if(!this.on||!('speechSynthesis' in window)||!text){ res(); return; } try{ speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(text); u.lang='ar-SA'; if(this.voice) u.voice=this.voice; u.rate=opt.rate||this.rate; u.pitch=opt.pitch||1; u.onend=()=>res(); u.onerror=()=>res(); speechSynthesis.speak(u); setTimeout(res, Math.min(15000, 400+text.length*120)); }catch(e){ res(); } }); },
  stop(){ try{ speechSynthesis.cancel(); }catch(e){} }
};
TTS.init();
const say = (t,o) => TTS.say(t,o);

/* ---------- confetti ---------- */
const Confetti = { c:$('#confetti'), parts:[], run:false,
  burst(n=120){ SFX.win(); const c=this.c; c.width=innerWidth; c.height=innerHeight; const cols=['#FF7A59','#FFD23F','#4CC38A','#4EA5FF','#9B7BFF','#FF7FB2']; for(let i=0;i<n;i++) this.parts.push({x:innerWidth/2+rnd(-60,60),y:innerHeight*0.4,vx:rnd(-9,9),vy:rnd(-16,-4),g:0.35,r:rnd(5,11),c:pick(cols),a:rnd(0,6.28),s:rnd(-0.2,0.2),life:rnd(70,120)}); if(!this.run){ this.run=true; this.loop(); } },
  loop(){ const ctx=this.c.getContext('2d'); ctx.clearRect(0,0,this.c.width,this.c.height); this.parts=this.parts.filter(p=>p.life>0); for(const p of this.parts){ p.x+=p.vx; p.y+=p.vy; p.vy+=p.g; p.vx*=0.99; p.a+=p.s; p.life--; ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.a); ctx.fillStyle=p.c; ctx.globalAlpha=Math.min(1,p.life/30); ctx.fillRect(-p.r/2,-p.r/2,p.r,p.r*0.6); ctx.restore(); } if(this.parts.length) requestAnimationFrame(()=>this.loop()); else { this.run=false; ctx.clearRect(0,0,this.c.width,this.c.height); } }
};

/* ---------- decor ---------- */
(function(){ const d=$('#decor'); const em=['📚','✏️','🌸','⭐','🎈','📖','🧩','🌈','🔤','🍃']; for(let i=0;i<16;i++){ const s=el('span',null,pick(em)); s.style.left=rnd(0,95)+'%'; s.style.top=rnd(0,95)+'%'; s.style.animationDelay=rnd(-12,0)+'s'; s.style.animationDuration=rnd(9,16)+'s'; s.style.fontSize=rnd(22,44)+'px'; d.appendChild(s);} })();

/* ---------- top buttons ---------- */
function syncTop(){ $('#ttsBtn').classList.toggle('off',!TTS.on); $('#sfxBtn').classList.toggle('off',!SFX.on); }
$('#ttsBtn').onclick=()=>{ TTS.on=!TTS.on; store.set('tts',TTS.on); if(!TTS.on) TTS.stop(); syncTop(); toast(TTS.on?'تم تشغيل الصوت المنطوق 🗣️':'تم إيقاف الصوت المنطوق'); if(TTS.on) say('أهلًا بكم في رياض لغتي'); };
$('#sfxBtn').onclick=()=>{ SFX.on=!SFX.on; store.set('sfx',SFX.on); syncTop(); if(SFX.on) SFX.ok(); toast(SFX.on?'تم تشغيل المؤثرات 🔊':'تم إيقاف المؤثرات'); };
$('#fsBtn').onclick=()=>{ if(!document.fullscreenElement) document.documentElement.requestFullscreen?.(); else document.exitFullscreen?.(); };
$('#homeBtn').onclick=()=>{ TTS.stop(); Router.home(); };
syncTop();

/* ---------- progress ---------- */
const Prog = {
  key(l,s){ return `${l}:${s}`; },
  done(l,s){ const d=store.get('done',{}); d[this.key(l,s)]=1; store.set('done',d); },
  isDone(l,s){ return !!store.get('done',{})[this.key(l,s)]; },
  ratio(lesson){ const n=lesson.steps.length; let k=0; lesson.steps.forEach((_,i)=>{ if(this.isDone(lesson.id,i)) k++; }); return n? k/n : 0; },
  stars(l){ return store.get('stars',{})[l]||0; },
  setStars(l,n){ const s=store.get('stars',{}); s[l]=Math.max(s[l]||0,n); store.set('stars',s); }
};

/* ---------- router ---------- */
const Router = {
  cur:null, step:0,
  home(){ TTS.stop(); Games.stopAll(); this.cur=null; $('#topTitle').innerHTML='رياض لغتي<small>أحب لغتي — الصف الثاني — الجزء الأول</small>'; renderHome(); window.scrollTo(0,0); },
  open(id, step=0){ TTS.stop(); Games.stopAll(); const L=LESSONS.find(l=>l.id===id); if(!L) return; this.cur=L; this.step=Math.min(step, L.steps.length-1); $('#topTitle').innerHTML=`${L.icon} ${L.title}<small>${L.kind}</small>`; renderLesson(L, this.step); window.scrollTo(0,0); }
};

/* ---------- home ---------- */
function renderHome(){
  const app=$('#app'); app.innerHTML='';
  const total = LESSONS.reduce((a,l)=>a+Prog.ratio(l),0)/LESSONS.length;
  const hero=el('div','hero',`
    <div class="mascot">🧕📖</div>
    <div class="grow">
      <h1>رياض لغتي 🌿</h1>
      <div class="sub">رحلة تفاعلية في كتاب «أحبّ لغتي» — الصف الثاني — الفصل الدراسي الأول — المحور الأول: <b>حياتي</b></div>
      <div class="row" style="margin-top:12px">
        <div class="tag">📚 ٨ محطات</div><div class="tag game">🎮 ألعاب وأنشطة</div><div class="tag pre">🔑 نشاط قبلي</div><div class="tag post">🏁 نشاط ختامي</div><div class="tag read">🔊 دعم صوتي</div>
      </div>
      <div class="row" style="margin-top:12px;align-items:center"><div class="pbar" style="max-width:320px"><i style="width:${Math.round(total*100)}%"></i></div><b>${Math.round(total*100)}٪ من الرحلة</b></div>
    </div>`);
  app.appendChild(hero);
  const grid=el('div','stations');
  LESSONS.forEach((L,i)=>{
    const r=Prog.ratio(L); const st=Prog.stars(L.id);
    const s=el('div','station',`<div class="num">${i+1}</div><div class="ico">${L.icon}</div><div class="nm">${L.title}</div><div class="kd">${L.kind}</div><div class="stars">${'⭐'.repeat(st)}${'☆'.repeat(Math.max(0,3-st))}</div><div class="prog"><i style="width:${Math.round(r*100)}%"></i></div>`);
    s.style.borderColor=L.color; s.onclick=()=>{ SFX.whoosh(); Router.open(L.id); };
    grid.appendChild(s);
  });
  app.appendChild(grid);
  const foot=el('div','card',`<div class="row" style="justify-content:space-between"><div><b>🎯 مخرجات المحور الأول</b> — ما يُتوقَّع من التلميذ في نهاية المحور</div><button class="btn sm v" id="outBtn">عرض المخرجات</button></div><div id="outBox" class="hidden" style="margin-top:12px"><ol class="outcomes">${OUTCOMES.map(o=>`<li>${o}</li>`).join('')}</ol></div>`);
  foot.style.marginTop='18px';
  app.appendChild(foot);
  $('#outBtn').onclick=()=>{ $('#outBox').classList.toggle('hidden'); SFX.click(); };
  const reset=el('div','center muted',`<button class="btn sm w" id="resetBtn">🔄 إعادة ضبط التقدّم</button>`); reset.style.marginTop='14px'; app.appendChild(reset);
  $('#resetBtn').onclick=()=>{ if(confirm('هل تريد مسح كل التقدّم والنجوم؟')){ store.set('done',{}); store.set('stars',{}); renderHome(); } };
}

/* ---------- lesson ---------- */
function renderLesson(L, idx){
  const app=$('#app'); app.innerHTML='';
  const head=el('div','card',`<div class="row" style="justify-content:space-between"><div><h2 style="margin:0">${L.icon} ${L.title}</h2><div class="muted" style="font-weight:700">${L.kind} ${L.author?`— ✍️ ${L.author}`:''}</div></div><div class="row"><span class="tag">${idx+1} / ${L.steps.length}</span></div></div>`);
  head.style.borderColor=L.color; app.appendChild(head);
  const strip=el('div','steps');
  L.steps.forEach((s,i)=>{ const b=el('div','step'+(i===idx?' on':'')+(Prog.isDone(L.id,i)?' done':'')+(s.pre?' pre':'')+(s.post?' post':''), `${s.pre?'🔑 ':s.post?'🏁 ':''}${s.label}`); b.onclick=()=>{ SFX.click(); Router.open(L.id,i); }; strip.appendChild(b); });
  app.appendChild(strip);
  setTimeout(()=>{ const on=$('.step.on'); on&&on.scrollIntoView({inline:'center',block:'nearest',behavior:'smooth'}); },50);
  const step=L.steps[idx];
  const box=el('div','card'); box.style.borderColor=L.color;
  const tagCls = step.pre?'pre':step.post?'post':(step.game?'game':(step.type==='read'||step.type==='anasheed'?'read':''));
  const tagTxt = step.pre?'نشاط قبلي (تمهيد)':step.post?'نشاط ختامي':(step.game?'لعبة':(step.tag||'نشاط'));
  box.appendChild(el('div','acthead',`<span class="tag ${tagCls}">${tagTxt}</span><div class="ttl">${step.title||step.label}</div>${step.hint?`<div class="note" style="flex-basis:100%">💡 ${step.hint}</div>`:''}`));
  const body=el('div'); box.appendChild(body);
  const ctx={ lesson:L, idx, done(){ if(!Prog.isDone(L.id,idx)){ Prog.done(L.id,idx); const b=$$('.step')[idx]; b&&b.classList.add('done'); toast('أحسنت! أُنجز النشاط ✅'); } } };
  try{ (ACT[step.type]||ACT.missing)(body, step, ctx); }catch(e){ body.innerHTML=`<div class="fb bad show">حدث خطأ في عرض النشاط: ${e.message}</div>`; console.error(e); }
  const nav=el('div','navbtns');
  const prev=el('button','btn w',`◀ السابق`); prev.disabled=idx===0; prev.onclick=()=>Router.open(L.id,idx-1);
  const mark=el('button','btn g','✅ إنجاز النشاط'); mark.onclick=()=>{ ctx.done(); SFX.ok(); };
  const next=el('button','btn',idx===L.steps.length-1?'🏠 الرئيسية':'التالي ▶'); next.onclick=()=>{ idx===L.steps.length-1? Router.home() : Router.open(L.id,idx+1); };
  nav.append(prev,mark,next); box.appendChild(nav);
  app.appendChild(box);
}

/* ---------- feedback helpers ---------- */
function fbBox(parent){ const f=el('div','fb'); parent.appendChild(f); return f; }
function showFb(f, ok, msg){ f.className='fb show '+(ok===true?'ok':ok===false?'bad':'info'); f.innerHTML=(ok===true?'🎉 ':ok===false?'🤔 ':'💡 ')+msg; }
const PRAISE=['ممتاز!','أحسنت!','رائع جدًا!','بطل!','إجابة صحيحة!','عمل عظيم!','واصل التقدّم!'];
const RETRY=['حاول مرة أخرى','فكّر جيدًا…','قريب! جرّب ثانية','لا بأس، أعد المحاولة'];
function celebrate(ctx, f, msg){ SFX.win(); Confetti.burst(); if(f) showFb(f,true,msg||pick(PRAISE)); ctx&&ctx.done(); say(msg||pick(PRAISE)); }
function speakBtn(text){ const b=el('button','speak','🔊'); b.title='استمع'; b.onclick=e=>{ e.stopPropagation(); SFX.click(); say(text); }; return b; }

/* ---------- Games registry (for stopping loops) ---------- */
const Games={ timers:new Set(), raf:new Set(), stopAll(){ this.timers.forEach(t=>clearInterval(t)); this.timers.clear(); this.raf.forEach(r=>cancelAnimationFrame(r)); this.raf.clear(); }, every(fn,ms){ const t=setInterval(fn,ms); this.timers.add(t); return t; }, clear(t){ clearInterval(t); this.timers.delete(t); } };

/* ---------- Teacher tools ---------- */
const TT = {
  open:false, timer:0, tInt:null,
  render(){ const p=$('#ttpanel'); p.classList.toggle('hidden',!this.open); if(!this.open) return;
    const names=store.get('names',[]); const sc=store.get('teams',[0,0]);
    p.innerHTML=`<h4>⏱️ المؤقّت</h4><div class="timerbig" id="tmr">${this.fmt()}</div><div class="row" style="justify-content:center;margin-bottom:10px">${[1,2,3,5].map(m=>`<button class="btn sm w" data-m="${m}">${m} د</button>`).join('')}<button class="btn sm v" id="tStart">${this.tInt?'⏸ إيقاف':'▶ تشغيل'}</button><button class="btn sm w" id="tReset">↺</button></div>
    <h4>🏆 نقاط الفريقين</h4><div class="teams"><div class="team" style="background:linear-gradient(135deg,#FF7A59,#FFB347)">🦁 الأُسود<div class="sc">${sc[0]}</div><button data-t="0" data-d="1">+</button><button data-t="0" data-d="-1">−</button></div><div class="team" style="background:linear-gradient(135deg,#3B8BFF,#6ED0FF)">🐬 الدلافين<div class="sc">${sc[1]}</div><button data-t="1" data-d="1">+</button><button data-t="1" data-d="-1">−</button></div></div>
    <h4 style="margin-top:10px">🎲 اختيار تلميذ</h4><textarea class="ta" id="names" style="min-height:60px;font-size:16px;font-family:var(--ui)" placeholder="اكتب أسماء التلاميذ، كل اسم في سطر">${names.join('\n')}</textarea><div class="row" style="margin-top:6px"><button class="btn sm y" id="pickN">🎲 اختر تلميذًا</button><div id="picked" style="font-weight:800;font-size:20px;color:var(--v)"></div></div>`;
    $$('[data-m]',p).forEach(b=>b.onclick=()=>{ this.timer=+b.dataset.m*60; this.upd(); });
    $('#tStart',p).onclick=()=>{ if(this.tInt){ clearInterval(this.tInt); this.tInt=null; } else { if(this.timer<=0) this.timer=60; this.tInt=setInterval(()=>{ this.timer--; this.upd(); if(this.timer<=0){ clearInterval(this.tInt); this.tInt=null; SFX.win(); say('انتهى الوقت'); this.render(); } },1000); } this.render(); };
    $('#tReset',p).onclick=()=>{ clearInterval(this.tInt); this.tInt=null; this.timer=0; this.render(); };
    $$('[data-t]',p).forEach(b=>b.onclick=()=>{ const s=store.get('teams',[0,0]); s[+b.dataset.t]=Math.max(0,s[+b.dataset.t]+ +b.dataset.d); store.set('teams',s); SFX.pop(); this.render(); });
    $('#names',p).onchange=e=>store.set('names',e.target.value.split('\n').map(s=>s.trim()).filter(Boolean));
    $('#pickN',p).onclick=()=>{ const ns=store.get('names',[]); if(!ns.length){ toast('أضف الأسماء أولًا'); return; } let i=0; const out=$('#picked',p); const iv=setInterval(()=>{ out.textContent=pick(ns); SFX.tick(); if(++i>14){ clearInterval(iv); SFX.star(); say(out.textContent); } },90); };
  },
  fmt(){ const m=Math.floor(this.timer/60), s=this.timer%60; return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`; },
  upd(){ const t=$('#tmr'); if(t) t.textContent=this.fmt(); if(this.timer<=10&&this.timer>0) SFX.tick(); }
};
$('#ttBtn').onclick=()=>{ TT.open=!TT.open; SFX.click(); TT.render(); };
</script>
<script>
/* =========================================================
   أنواع الأنشطة والألعاب
   ========================================================= */
const ACT = {};
const optHtml = o => typeof o==='string' ? o : `${o.e?`<span class="e">${o.e}</span>`:''}${o.t||''}`;
const optText = o => typeof o==='string' ? o : (o.t||'');

ACT.missing = (box,s)=>{ box.innerHTML=`<div class="fb info show">نوع النشاط غير معروف: ${s.type}</div>`; };

/* ---------- info ---------- */
ACT.info = (box,s,ctx)=>{ box.innerHTML=s.html; ctx.done(); };

/* ---------- talk / discussion (+poll, +timer, +chips) ---------- */
ACT.talk = (box,s,ctx)=>{
  if(s.scene){ const sc=el('div','scene'); s.scene.forEach((it,i)=>{ const o=typeof it==='string'?{e:it}:it; const d=el('div','it',`${o.e}${o.t?`<small>${o.t}</small>`:''}`); d.style.animationDelay=(i*0.08)+'s'; d.onclick=()=>{ SFX.pop(); d.style.transform='scale(1.3) rotate(8deg)'; setTimeout(()=>d.style.transform='',300); if(o.t) say(o.t); }; sc.appendChild(d); }); box.appendChild(sc); }
  if(s.text){ box.appendChild(el('div','note',s.text)); }
  if(s.prompts){ const pr=el('div','prompts'); s.prompts.forEach((p,i)=>{ const d=el('div','prompt',`<span class="n">${i+1}</span><span class="grow">${p}</span><span class="speak">🔊</span>`); d.onclick=()=>{ SFX.click(); say(p); }; pr.appendChild(d); }); box.appendChild(pr); }
  if(s.chips){ box.appendChild(el('h3',null,'💬 أفكار تساعدني على التحدّث:')); const c=el('div','chips'); s.chips.forEach(t=>{ const ch=el('div','chip',t); ch.onclick=()=>{ SFX.pop(); say(t); ch.classList.toggle('sel'); }; c.appendChild(ch); }); box.appendChild(c); }
  if(s.poll){ box.appendChild(el('h3',null,'📊 '+s.poll.q)); const votes=s.poll.options.map(()=>0); const wrap=el('div','poll'); const cols=['#FF7A59','#4EA5FF','#4CC38A','#9B7BFF','#FFB347','#FF7FB2','#2ED3C4','#FFD23F'];
    const rows=s.poll.options.map((o,i)=>{ const r=el('div','pollrow',`<div>${o.e||''} ${o.t}</div><div class="bar"><i style="background:${cols[i%cols.length]}"></i></div><button>＋</button>`); r.querySelector('button').onclick=()=>{ votes[i]++; SFX.pop(); upd(); }; wrap.appendChild(r); return r; });
    const upd=()=>{ const mx=Math.max(1,...votes); rows.forEach((r,i)=>{ r.querySelector('i').style.width=(votes[i]/mx*100)+'%'; r.querySelector('i').textContent=votes[i]?` ${votes[i]}`:''; r.querySelector('i').style.color='#fff'; r.querySelector('i').style.fontSize='14px'; r.querySelector('i').style.paddingInlineStart='8px'; }); if(votes.reduce((a,b)=>a+b,0)>=3) ctx.done(); };
    box.appendChild(wrap); }
  if(s.timer){ const t=el('div','center',`<div class="counter" id="tk">${s.timer}</div><button class="btn y sm">▶ ابدأ العدّ (${s.timer} ث) لكل متحدّث</button>`); let iv=null; t.querySelector('button').onclick=()=>{ if(iv){ Games.clear(iv); iv=null; } let n=s.timer; const c=t.querySelector('.counter'); c.textContent=n; iv=Games.every(()=>{ n--; c.textContent=n; if(n<=5&&n>0) SFX.tick(); if(n<=0){ Games.clear(iv); iv=null; SFX.win(); say('انتهى الوقت، شكرًا لك'); ctx.done(); } },1000); }; box.appendChild(t); }
  if(!s.poll && !s.timer){ const b=el('button','btn g','✅ تحدّثنا وأتممنا النشاط'); b.style.marginTop='14px'; b.onclick=()=>{ celebrate(ctx,null,'أحسنتم في التحدّث!'); }; box.appendChild(el('div','center')).appendChild(b); }
};

/* ---------- predict (أتصفّح وأتوقّع) ---------- */
ACT.predict = (box,s,ctx)=>{
  if(s.fields){ const g=el('div','grid2'); s.fields.forEach(f=>{ g.appendChild(el('div','storycard',`<div class="muted" style="font-family:var(--ui);font-weight:800;font-size:15px">${f.k}</div><div style="font-size:26px;font-weight:800">${f.v}</div>`)); }); box.appendChild(g); }
  box.appendChild(el('h3',null,'🔮 '+s.q));
  const opts=el('div','opts'); let chosen=null;
  s.options.forEach((o,i)=>{ const d=el('div','opt',optHtml(o)); d.onclick=()=>{ if(revealed) return; SFX.click(); $$('.opt',opts).forEach(x=>x.classList.remove('sel')); d.classList.add('sel'); chosen=i; say(optText(o)); }; opts.appendChild(d); });
  box.appendChild(opts);
  let revealed=false; const f=fbBox(box);
  const b=el('button','btn v','📖 قرأتُ النصّ… أتحقّق من توقّعي'); b.style.marginTop='12px';
  b.onclick=()=>{ if(chosen===null){ toast('اختر توقّعك أولًا'); return; } revealed=true; $$('.opt',opts).forEach((x,i)=>{ x.classList.toggle('ok',i===s.answer); if(i===chosen&&i!==s.answer) x.classList.add('bad'); if(i!==s.answer&&i!==chosen) x.classList.add('dim'); }); if(chosen===s.answer){ celebrate(ctx,f,'توقّعك صحيح! '+(s.reveal||'')); } else { SFX.pop(); showFb(f,null,'لا بأس، التوقّع مهارة نتدرّب عليها. الإجابة: '+optText(s.options[s.answer])+' — '+(s.reveal||'')); ctx.done(); } };
  box.appendChild(el('div','center')).appendChild(b);
};

/* ---------- read (النص) ---------- */
ACT.read = (box,s,ctx)=>{
  let size=+store.get('rs',27); const tools=el('div','rtools');
  const bAll=el('button','btn b sm','▶ قراءة متتابعة'); const bStop=el('button','btn w sm','⏹ إيقاف'); const bHide=el('button','btn v sm','🙈 كلمات مخفية'); const bPlus=el('button','btn w sm','A+'); const bMinus=el('button','btn w sm','A−');
  tools.append(bAll,bStop,bHide,bPlus,bMinus, el('span','muted','انقر أيّ جملة لسماعها'));
  box.appendChild(tools);
  const rb=el('div','readbox'); rb.style.setProperty('--rs',size+'px'); box.appendChild(rb);
  const sents=[]; const gl=s.glossary||{};
  s.sections.forEach(sec=>{ const d=el('div','sec'); if(sec.head) d.appendChild(el('div','sh',`${sec.icon||''} ${sec.head}`)); const p=el('div');
    sec.text.split('|').forEach(t=>{ t=t.trim(); if(!t) return; const sp=el('span','sent'); t.split(' ').forEach((w,i)=>{ const ws=el('span','w',w); const key=Object.keys(gl).find(k=>strip(w).includes(strip(k))); if(key){ ws.classList.add('gl'); ws.title=gl[key]; ws.onclick=e=>{ e.stopPropagation(); SFX.pop(); toast(`${key}: ${gl[key]}`); say(`${key}: ${gl[key]}`); }; } sp.appendChild(ws); if(i<t.split(' ').length-1) sp.appendChild(document.createTextNode(' ')); }); sp.onclick=()=>{ playOne(sents.indexOf(sp)); }; sents.push(sp); p.appendChild(sp); p.appendChild(document.createTextNode(' ')); });
    d.appendChild(p); rb.appendChild(d); });
  let playing=false;
  async function playOne(i){ stopAll(); const sp=sents[i]; sp.classList.add('now'); sp.scrollIntoView({block:'center',behavior:'smooth'}); await say(sp.textContent); sp.classList.remove('now'); }
  async function playAll(){ stopAll(); playing=true; for(let i=0;i<sents.length;i++){ if(!playing) break; sents[i].classList.add('now'); sents[i].scrollIntoView({block:'center',behavior:'smooth'}); await say(sents[i].textContent); sents[i].classList.remove('now'); await sleep(150); } if(playing){ playing=false; ctx.done(); } }
  function stopAll(){ playing=false; TTS.stop(); sents.forEach(x=>x.classList.remove('now')); }
  bAll.onclick=playAll; bStop.onclick=stopAll;
  bPlus.onclick=()=>{ size=Math.min(40,size+2); rb.style.setProperty('--rs',size+'px'); store.set('rs',size); };
  bMinus.onclick=()=>{ size=Math.max(18,size-2); rb.style.setProperty('--rs',size+'px'); store.set('rs',size); };
  let hidden=false;
  bHide.onclick=()=>{ hidden=!hidden; SFX.click(); $$('.w',rb).forEach(w=>{ w.classList.remove('hide','rev'); if(hidden && Math.random()<0.28 && strip(w.textContent).length>2){ w.classList.add('hide'); w.onclick=e=>{ e.stopPropagation(); w.classList.add('rev'); SFX.pop(); say(w.textContent); }; } }); bHide.textContent=hidden?'👀 إظهار الكلمات':'🙈 كلمات مخفية'; if(hidden) toast('اقرأ الجملة وخمّن الكلمة المخفية ثم انقرها لتتحقّق'); };
  const done=el('button','btn g','✅ قرأنا النصّ'); done.style.marginTop='14px'; done.onclick=()=>{ celebrate(ctx,null,'قراءة رائعة!'); }; box.appendChild(el('div','center')).appendChild(done);
};

/* ---------- mcq (set) ---------- */
ACT.mcq = (box,s,ctx)=>{
  const items=s.items; let i=0, score=0; const hud=el('div','qhud',`<span id="qn"></span><div class="pbar"><i></i></div>`); box.appendChild(hud); const body=el('div'); box.appendChild(body); const f=fbBox(box);
  function show(){ body.innerHTML=''; f.className='fb'; if(i>=items.length){ body.innerHTML=`<div class="result"><div class="big">🏆</div><h2>أجبت عن ${score} من ${items.length}</h2></div>`; hud.querySelector('i').style.width='100%'; celebrate(ctx,f,'أتممت جميع الأسئلة!'); return; }
    const it=items[i]; hud.querySelector('#qn').textContent=`${i+1} / ${items.length}`; hud.querySelector('i').style.width=(i/items.length*100)+'%';
    if(it.scene){ const sc=el('div','scene'); it.scene.forEach(e=>sc.appendChild(el('div','it',e))); body.appendChild(sc); }
    const q=el('div','txt',`<b>${it.q}</b>`); q.appendChild(speakBtn(it.q)); body.appendChild(q); say(it.q);
    const opts=el('div','opts'); let lock=false;
    const order = it.keep? it.options.map((_,k)=>k) : shuffle(it.options.map((_,k)=>k));
    order.forEach(k=>{ const o=it.options[k]; const d=el('div','opt',optHtml(o)); if(it.big) d.style.fontSize='34px'; d.onclick=()=>{ if(lock) return; if(k===it.answer){ lock=true; d.classList.add('ok'); SFX.ok(); score++; showFb(f,true,pick(PRAISE)+(it.why?' — '+it.why:'')); setTimeout(()=>{ i++; show(); },1300); } else { d.classList.add('bad'); SFX.bad(); showFb(f,false,pick(RETRY)); setTimeout(()=>d.classList.remove('bad'),500); } }; opts.appendChild(d); });
    body.appendChild(opts);
  }
  show();
};

/* ---------- multi select ---------- */
ACT.multi = (box,s,ctx)=>{
  const q=el('div','txt',`<b>${s.q}</b>`); q.appendChild(speakBtn(s.q)); box.appendChild(q);
  const opts=el('div','opts'); const sel=new Set();
  shuffle(s.options.map((_,i)=>i)).forEach(i=>{ const o=s.options[i]; const d=el('div','opt'+(s.cloud?' cloud':''),optHtml(o)); if(s.cloud){ d.style.borderRadius='50%'; d.style.background='#EAF6FF'; d.style.borderColor='#BDE2FF'; } d.onclick=()=>{ SFX.click(); d.classList.toggle('sel'); sel.has(i)?sel.delete(i):sel.add(i); say(optText(o)); }; d.dataset.i=i; opts.appendChild(d); });
  box.appendChild(opts); const f=fbBox(box);
  const b=el('button','btn','✔ تحقّق'); b.style.marginTop='12px'; b.onclick=()=>{ let allOk=true; $$('.opt',opts).forEach(d=>{ const i=+d.dataset.i; const ok=s.options[i].ok; d.classList.remove('ok','bad'); if(ok&&sel.has(i)) d.classList.add('ok'); else if(!ok&&sel.has(i)){ d.classList.add('bad'); allOk=false; } else if(ok&&!sel.has(i)) allOk=false; }); if(allOk) celebrate(ctx,f,s.why||'اختيار صحيح!'); else { SFX.bad(); showFb(f,false,'هناك اختيار ناقص أو زائد… راجع النصّ وحاول ثانية'); } };
  box.appendChild(el('div','center')).appendChild(b);
};

/* ---------- true / false ---------- */
ACT.tf = (box,s,ctx)=>{
  const list=el('div','seq'); let left=s.items.length; const f=fbBox(box);
  s.items.forEach(it=>{ const row=el('div','seqit'); row.style.cursor='default'; row.innerHTML=`<span class="grow">${it.t}</span>`; const btns=el('div','row'); const y=el('button','btn g sm','✔'); const n=el('button','btn sm','✘'); n.style.background='linear-gradient(135deg,#FF5D5D,#FF8E8E)'; const sp=speakBtn(it.t);
    const pickA=(v)=>{ if(row.dataset.done) return; if(v===it.ok){ row.dataset.done=1; row.classList.add('ok'); SFX.ok(); y.disabled=n.disabled=true; if(it.why) toast(it.why); if(--left===0) celebrate(ctx,f,'صنّفت كلّ العبارات بنجاح!'); } else { row.classList.add('bad'); SFX.bad(); setTimeout(()=>row.classList.remove('bad'),500); } };
    y.onclick=()=>pickA(true); n.onclick=()=>pickA(false); btns.append(sp,y,n); row.appendChild(btns); list.appendChild(row); });
  box.appendChild(list);
};

/* ---------- order ---------- */
ACT.order = (box,s,ctx)=>{
  const slots=el('div','slots'); const items=s.items; const n=items.length; let cur=[];
  for(let i=0;i<n;i++) slots.appendChild(el('div','slot',`<span class="n">${i+1}</span><span class="tx"></span>`));
  box.appendChild(slots);
  const pool=el('div','seq'); const f=fbBox(box);
  shuffle(items.map((_,i)=>i)).forEach(i=>{ const d=el('div','seqit',`<span class="n">•</span><span class="grow">${items[i]}</span>`); d.appendChild(speakBtn(items[i])); d.onclick=()=>{ if(d.classList.contains('picked')) return; SFX.pop(); d.classList.add('picked'); cur.push(i); const sl=slots.children[cur.length-1]; sl.classList.add('filled'); sl.querySelector('.tx').textContent=items[i]; if(cur.length===n) check(); }; pool.appendChild(d); });
  box.appendChild(pool);
  const reset=el('button','btn w sm','↺ إعادة'); reset.style.marginTop='10px'; reset.onclick=()=>{ cur=[]; $$('.seqit',pool).forEach(d=>d.classList.remove('picked')); $$('.slot',slots).forEach(sl=>{ sl.classList.remove('filled'); sl.style.borderColor=''; sl.querySelector('.tx').textContent=''; }); f.className='fb'; };
  box.appendChild(reset);
  function check(){ let ok=true; cur.forEach((v,k)=>{ const sl=slots.children[k]; if(v===k){ sl.style.borderColor='var(--g)'; } else { sl.style.borderColor='var(--r)'; ok=false; } }); if(ok){ celebrate(ctx,f,'ترتيب صحيح! '+(s.reveal||'')); if(s.after){ const a=el('div','storycard',s.after); a.style.marginTop='12px'; box.appendChild(a); say(strip(a.textContent)); } } else { SFX.bad(); showFb(f,false,'الترتيب غير صحيح في بعض المواضع (بالأحمر). اضغط ↺ وحاول من جديد'); } }
};

/* ---------- match ---------- */
ACT.match = (box,s,ctx)=>{
  const cols=el('div','mcols'); const A=el('div','mcol'), B=el('div','mcol'); cols.append(A,B); box.appendChild(cols);
  const colors=['#FF7A59','#4EA5FF','#4CC38A','#9B7BFF','#FFB347','#FF7FB2','#2ED3C4','#B08968'];
  let selA=null; let left=s.pairs.length; const f=fbBox(box);
  const mk=(o,side,i)=>{ const d=el('div','mit',optHtml(o)); d.dataset.i=i; d.dataset.side=side; d.onclick=()=>{ if(d.classList.contains('done')) return; SFX.click(); say(optText(o)); if(side===0){ $$('.mit',A).forEach(x=>x.classList.remove('sel')); d.classList.add('sel'); selA=d; } else if(selA){ if(selA.dataset.i===d.dataset.i){ const c=colors[i%colors.length]; selA.classList.remove('sel'); selA.classList.add('done'); d.classList.add('done'); selA.style.background=c; d.style.background=c; SFX.ok(); selA=null; if(--left===0) celebrate(ctx,f,'وصلت كلّ الأزواج بنجاح!'); } else { d.classList.add('bad'); SFX.bad(); setTimeout(()=>d.classList.remove('bad'),400); } } }; return d; };
  s.pairs.forEach((p,i)=>A.appendChild(mk(p[0],0,i)));
  shuffle(s.pairs.map((_,i)=>i)).forEach(i=>B.appendChild(mk(s.pairs[i][1],1,i)));
};

/* ---------- sort into buckets ---------- */
ACT.sort = (box,s,ctx)=>{
  const pool=el('div','pool'); box.appendChild(pool); const bk=el('div','buckets'); box.appendChild(bk); const f=fbBox(box);
  let sel=null; let left=s.items.length;
  const buckets=s.buckets.map((b,i)=>{ const d=el('div','bucket',`<div class="bh"><span class="e">${b.e||''}</span>${b.t}</div><div class="bi"></div>`); d.onclick=()=>{ if(!sel) return; const it=s.items[+sel.dataset.i]; if(it.b===i){ SFX.ok(); const sp=el('span','ok',`${it.e||''} ${it.t}`); d.querySelector('.bi').appendChild(sp); sel.remove(); sel=null; $$('.bucket',bk).forEach(x=>x.classList.remove('hot')); if(--left===0) celebrate(ctx,f,s.why||'صنّفت كلّ العناصر!'); } else { SFX.bad(); d.classList.add('hot'); setTimeout(()=>d.classList.remove('hot'),300); sel.classList.add('bad'); setTimeout(()=>sel&&sel.classList.remove('bad'),400); } }; bk.appendChild(d); return d; });
  shuffle(s.items.map((_,i)=>i)).forEach(i=>{ const it=s.items[i]; const c=el('div','chip',`${it.e?it.e+' ':''}${it.t}`); c.dataset.i=i; c.onclick=()=>{ SFX.click(); $$('.chip',pool).forEach(x=>x.classList.remove('sel')); c.classList.add('sel'); sel=c; say(it.t); $$('.bucket',bk).forEach(x=>x.classList.add('hot')); }; pool.appendChild(c); });
};

/* ---------- fill blanks with chips ---------- */
ACT.fill = (box,s,ctx)=>{
  const list=el('div','seq'); box.appendChild(list); const f=fbBox(box);
  const answers=[]; const blanks=[];
  s.items.forEach((it,ii)=>{ const row=el('div','seqit'); row.style.cursor='default'; row.style.fontSize=(s.size||22)+'px'; const ans=Array.isArray(it.a)?it.a:[it.a]; let k=0; const parts=it.s.split('___'); const wrap=el('span','grow'); parts.forEach((p,pi)=>{ wrap.appendChild(document.createTextNode(p)); if(pi<parts.length-1){ const b=el('span','blank','…'); b.dataset.a=ans[k]||ans[0]; k++; b.onclick=()=>{ SFX.click(); $$('.blank',list).forEach(x=>x.classList.remove('active')); b.classList.add('active'); active=b; }; blanks.push(b); answers.push(b.dataset.a); wrap.appendChild(b); } }); row.appendChild(wrap); if(it.e) row.insertBefore(el('span',null,`<span style="font-size:40px">${it.e}</span>`),wrap); row.appendChild(speakBtn(it.s.replace(/___/g, ans.join(' ')))); list.appendChild(row); });
  let active=null;
  const chipsArr = s.chips || shuffle([...new Set(answers)]);
  const chips=el('div','chips'); chipsArr.forEach(c=>{ const ch=el('div','chip',c); ch.onclick=()=>{ if(!active){ toast('انقر الفراغ أولًا ثم اختر الكلمة'); return; } SFX.pop(); active.textContent=c; active.classList.remove('ok','bad'); if(strip(c)===strip(active.dataset.a)){ active.classList.add('ok'); SFX.ok(); if(s.unique!==false) ch.classList.add('used'); const nxt=blanks.find(b=>!b.classList.contains('ok')); active.classList.remove('active'); active=nxt||null; if(active) active.classList.add('active'); if(!nxt) celebrate(ctx,f,s.why||'أكملت كلّ الفراغات!'); } else { active.classList.add('bad'); SFX.bad(); setTimeout(()=>{ active&&active.classList.remove('bad'); },500); } }; chips.appendChild(ch); });
  box.insertBefore(chips,list);

  const tools=el('div','row'); tools.style.marginTop='10px'; tools.style.justifyContent='center'; let color='#5B3FD9'; ['#5B3FD9','#FF5D5D','#1E9E62','#111'].forEach(c=>{ const b=el('button','ib','●'); b.style.color=c; b.onclick=()=>{ color=c; }; tools.appendChild(b); }); const cl=el('button','btn w sm','🧽 مسح'); cl.onclick=clear; tools.appendChild(cl); const ok=el('button','btn g sm','✅ كتبت بخطّ جميل'); ok.onclick=()=>celebrate(ctx,null,'خطّ جميل!'); tools.appendChild(ok); box.appendChild(tools);
  const ctx2=cv.getContext('2d'); function resize(){ const w=wrap.clientWidth; cv.width=w*devicePixelRatio; cv.height=260*devicePixelRatio; cv.style.height='260px'; ctx2.scale(devicePixelRatio,devicePixelRatio); ctx2.lineCap='round'; ctx2.lineJoin='round'; } setTimeout(resize,30);

  const start=e=>{ drawing=true; last=pos(e); e.preventDefault(); }; const move=e=>{ if(!drawing) return; const p=pos(e); ctx2.strokeStyle=color; ctx2.lineWidth=7; ctx2.beginPath(); ctx2.moveTo(last.x,last.y); ctx2.lineTo(p.x,p.y); ctx2.stroke(); last=p; e.preventDefault(); }; const end=()=>{ drawing=false; };
  cv.addEventListener('mousedown',start); cv.addEventListener('mousemove',move); addEventListener('mouseup',end); cv.addEventListener('touchstart',start,{passive:false}); cv.addEventListener('touchmove',move,{passive:false}); cv.addEventListener('touchend',end);
  guide.style.fontSize = s.items[0].length>6 ? '56px' : '120px'; tabs.querySelectorAll('.chip').forEach((c,k)=>c.addEventListener('click',()=>{ guide.style.fontSize = s.items[k].length>6 ? '56px' : '120px'; }));

    shuffle(it.options.map((_,k)=>k)).forEach(k=>{ const o=it.options[k]; const d=el('div','opt',optHtml(o)); d.onclick=()=>{ if(lock) return; lock=true; if(k===it.answer){ d.classList.add('ok'); SFX.ok(); score++; hud.querySelector('#sc').textContent='⭐ '+score; showFb(f,true,pick(PRAISE)); } else { d.classList.add('bad'); SFX.bad(); $$('.opt',opts)[it.options.indexOf(it.options[it.answer])]; $$('.opt',opts).forEach(x=>{ if(x.innerHTML===optHtml(it.options[it.answer])) x.classList.add('ok'); }); showFb(f,false,'الإجابة الصحيحة: '+optText(it.options[it.answer])); } setTimeout(()=>{ i++; show(); },1500); }; opts.appendChild(d); });

/* ========== ARCADE GAMES ========== */
function arena(box, title, secs){ const a=el('div','arena'); a.innerHTML=`<div class="hud"><span id="sc">⭐ 0</span><span>${title}</span><span id="tm">⏱ ${secs}</span></div>`; box.appendChild(a); const ov=el('div','overlay'); ov.innerHTML=`<div><div style="font-size:60px">🎮</div><h2>${title}</h2><button class="btn y" id="go">▶ ابدأ اللعب</button></div>`; a.appendChild(ov); return {a,ov}; }

/* hunt: tap words containing target letters */
ACT.hunt = (box,s,ctx)=>{
  box.appendChild(el('div','note',`🎯 انقر الكلمات التي تحتوي على أحد الحروف: <b style="font-size:26px;color:var(--v)">${s.letters.join(' ، ')}</b> — وتجنّب الكلمات الأخرى!`));

  const has=w=>s.letters.some(L=>strip(w).includes(L));

    const spawn=()=>{ const w=pick(s.words); const d=el('div','fly',w); d.style.left=rnd(4,72)+'%'; d.style.top='100%'; d.style.background=pick(['#FFF3DF','#E3F2FF','#F3EEFF','#E8FBEF','#FFE9F4']); a.appendChild(d); const dur=rnd(5,8); d.style.transition=`top ${dur}s linear`; requestAnimationFrame(()=>d.style.top='-15%'); d.onclick=()=>{ if(d.dataset.hit) return; d.dataset.hit=1; if(has(w)){ score+=2; d.classList.add('ok'); SFX.ok(); say(w); } else { score=Math.max(0,score-1); d.classList.add('bad'); SFX.bad(); } sc.textContent='⭐ '+score; setTimeout(()=>d.remove(),350); }; setTimeout(()=>d.remove(),dur*1000); };

/* balloon: float up, tap → choose bucket */
ACT.balloon = (box,s,ctx)=>{
  box.appendChild(el('div','note',`🎈 انقر البالون ثم اختر تصنيفه: ${s.buckets.map(b=>(b.e||'')+' '+b.t).join(' | ')}`));

    const spawn=()=>{ if(idx>=items.length){ return; } const it=items[idx++]; const d=el('div','balloon',`<div class="bd" style="background:${pick(cols)}">${it.t}</div><div class="st"></div>`); d.style.left=rnd(2,78)+'%'; d.style.top='100%'; a.appendChild(d); const dur=rnd(7,10); d.style.transition=`top ${dur}s linear`; requestAnimationFrame(()=>d.style.top='-40%'); d.onclick=()=>{ if(cur&&cur.d!==d){ cur.d.style.outline=''; } cur={d,it}; d.style.outline='4px solid #fff'; const r=d.getBoundingClientRect(),ar=a.getBoundingClientRect(); d.style.transition='none'; d.style.top=(r.top-ar.top)+'px'; SFX.click(); say(it.t); }; setTimeout(()=>{ if(d.parentNode && !(cur&&cur.d===d)) d.remove(); },dur*1000+200); };

  };

ACT.rain = (box,s,ctx)=>{
