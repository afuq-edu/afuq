<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#bfe8ff">
<title>English Island 2A</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@400;500;600;700;800&family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --sky1:#bfe8ff; --sky2:#e9f8ff; --sand:#fff8e1;
  --ink:#23324d; --ink2:#5a6b8c; --card:#ffffff; --line:#e3ecf7;
  --sun:#FFC93C; --coral:#FF6B6B; --mint:#2EC4B6; --blue:#4D96FF; --grape:#9B5DE5;
  --orange:#FF9F1C; --green:#4CBF5F; --pink:#FF7EB6; --teal:#14B8A6; --gold:#F4B400;
  --good:#38c172; --bad:#ff5a5f;
  --r:22px; --sh:0 6px 0 rgba(35,50,77,.10), 0 12px 28px rgba(35,50,77,.10);
  --fa:"Baloo Bhaijaan 2", "Segoe UI", Tahoma, sans-serif;
  --fe:"Fredoka", "Baloo Bhaijaan 2", "Segoe UI", sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;}
body{font-family:var(--fa);color:var(--ink);background:linear-gradient(180deg,var(--sky1) 0%,var(--sky2) 55%,var(--sand) 100%);background-attachment:fixed;overflow-x:hidden;user-select:none;-webkit-user-select:none;min-height:100vh}
button{font-family:inherit;color:inherit;cursor:pointer;border:none;background:none}
.en{font-family:var(--fe);direction:ltr;unicode-bidi:isolate}
.hide{display:none!important}

/* sky decor */
#sky{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.sun{position:absolute;top:-40px;left:-40px;width:170px;height:170px;border-radius:50%;background:radial-gradient(circle,#fff3b0 0%,#ffd84d 55%,#ffc93c 70%,rgba(255,201,60,0) 72%);animation:sunspin 30s linear infinite}
.sun::after{content:"";position:absolute;inset:-30px;border-radius:50%;background:repeating-conic-gradient(rgba(255,210,70,.35) 0 8deg,transparent 8deg 22deg);z-index:-1}
@keyframes sunspin{to{transform:rotate(360deg)}}
.cloud{position:absolute;background:#fff;border-radius:60px;opacity:.9;filter:drop-shadow(0 6px 8px rgba(80,140,200,.15))}
.cloud::before,.cloud::after{content:"";position:absolute;background:#fff;border-radius:50%}
.cloud::before{width:55%;height:140%;left:12%;top:-60%}
.cloud::after{width:40%;height:120%;right:12%;top:-45%}
@keyframes drift{from{transform:translateX(-30vw)}to{transform:translateX(130vw)}}
.hills{position:absolute;bottom:-40px;left:-5%;width:110%;height:140px;background:radial-gradient(ellipse at 20% 100%,#a8e6a3 0 45%,transparent 46%),radial-gradient(ellipse at 75% 100%,#8fdc8a 0 50%,transparent 51%);opacity:.7}

#app{position:relative;z-index:1;min-height:100vh}
.screen{max-width:1180px;margin:0 auto;padding:12px 16px 90px;animation:fadein .35s ease}
@keyframes fadein{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* top bar */
.topbar{display:flex;align-items:center;gap:10px;margin:6px 0 14px}
.topbar .ttl{flex:1;min-width:0}
.topbar h1,.topbar h2{margin:0;line-height:1.2}
.topbar h2{font-size:clamp(18px,3.4vw,26px)}
.topbar .sub{font-size:14px;color:var(--ink2)}
.ibtn{width:48px;height:48px;border-radius:16px;background:#fff;box-shadow:var(--sh);font-size:24px;display:grid;place-items:center;flex:none;transition:transform .12s}
.ibtn:active{transform:translateY(3px) scale(.96)}
.pill{display:inline-flex;align-items:center;gap:6px;background:#fff;border-radius:999px;padding:6px 14px;box-shadow:var(--sh);font-weight:700;white-space:nowrap}

/* hero */
.hero{background:linear-gradient(135deg,#fff 0%,#fffbea 100%);border-radius:30px;box-shadow:var(--sh);padding:18px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;position:relative;overflow:hidden}
.hero h1{font-size:clamp(26px,5vw,44px);margin:0;line-height:1.1}
.hero h1 .en{color:var(--blue)}
.hero p{margin:6px 0 0;color:var(--ink2);font-size:clamp(14px,2.2vw,18px)}
.cast{display:flex;gap:4px;align-items:flex-end;margin-inline-start:auto}
.cast .av{width:clamp(46px,8vw,72px);animation:bob 2.4s ease-in-out infinite}
.cast .av:nth-child(2){animation-delay:.3s}.cast .av:nth-child(3){animation-delay:.6s}.cast .av:nth-child(4){animation-delay:.9s}.cast .av:nth-child(5){animation-delay:1.2s}.cast .av:nth-child(6){animation-delay:1.5s}
.cast .emo{font-size:clamp(36px,6.5vw,58px);line-height:1}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}

/* grids & cards */
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));margin-top:18px}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:16px;position:relative;overflow:hidden;transition:transform .15s}
.card.tap{cursor:pointer}
.card.tap:hover{transform:translateY(-4px)}
.card.tap:active{transform:translateY(2px) scale(.98)}
.ucard{display:flex;gap:14px;align-items:center;border-top:8px solid var(--c,var(--blue))}
.ucard .big{font-size:52px;width:78px;height:78px;border-radius:22px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 18%,#fff);flex:none}
.ucard .num{font-size:13px;font-weight:800;color:var(--c);letter-spacing:.5px}
.ucard h3{margin:0;font-size:21px;line-height:1.2}
.ucard .ar{color:var(--ink2);font-size:15px}
.bar{height:10px;border-radius:9px;background:#eef3fa;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--c,var(--green)),color-mix(in srgb,var(--c,var(--green)) 60%,#fff));border-radius:9px;transition:width .6s}

.lcard{display:flex;gap:12px;align-items:center}
.lcard .n{width:54px;height:54px;border-radius:50%;background:var(--c);color:#fff;font-size:24px;font-weight:800;display:grid;place-items:center;flex:none;box-shadow:inset 0 -5px 0 rgba(0,0,0,.15)}
.lcard .ic{font-size:34px;margin-inline-start:auto}
.lcard h3{margin:0;font-size:18px}
.lcard .ar{font-size:14px;color:var(--ink2)}
.stars{color:var(--gold);font-size:15px;letter-spacing:1px}
.stars .off{color:#d9e1ec}

.tiles{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));margin-top:14px}
.tile{background:#fff;border-radius:24px;box-shadow:var(--sh);padding:16px 12px;text-align:center;cursor:pointer;border-bottom:6px solid var(--c);transition:transform .15s}
.tile:hover{transform:translateY(-4px) rotate(-.5deg)}
.tile:active{transform:scale(.97)}
.tile .ti{font-size:48px;line-height:1.1}
.tile .tk{display:inline-block;font-size:12px;font-weight:800;color:#fff;background:var(--c);padding:2px 10px;border-radius:99px;margin:6px 0 2px}
.tile h4{margin:4px 0 2px;font-size:18px}
.tile p{margin:0;font-size:13px;color:var(--ink2)}
.sect{margin:22px 4px 0;font-size:20px;display:flex;align-items:center;gap:8px}

/* player */
#player{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;background:linear-gradient(180deg,#d4f0ff 0%,#f3fbff 60%,#fffaf0 100%)}
.pbar{display:flex;align-items:center;gap:8px;padding:10px 12px;flex:none}
.pbar .ptitle{flex:1;min-width:0;font-weight:800;font-size:clamp(15px,2.6vw,20px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pdots{display:flex;gap:4px;flex-wrap:wrap;justify-content:center;max-width:40vw}
.pdots i{width:10px;height:10px;border-radius:50%;background:#cfdcec;transition:.3s}
.pdots i.on{background:var(--blue);transform:scale(1.25)}
.pdots i.ok{background:var(--good)}
.pdots i.no{background:var(--bad)}
.instr{margin:0 12px;background:#fff;border-radius:18px;box-shadow:var(--sh);padding:8px 12px;display:flex;align-items:center;gap:10px;flex:none}
.instr .ia{font-size:clamp(15px,2.5vw,19px);font-weight:700;line-height:1.25}
.instr .ie{font-size:clamp(14px,2.3vw,18px);color:var(--blue);font-weight:600}
.instr .ibtn{width:44px;height:44px;font-size:22px;background:var(--sun);margin-inline-start:auto}
.stage{flex:1;position:relative;overflow:hidden;margin:10px 12px 12px;border-radius:26px;background:rgba(255,255,255,.55);box-shadow:inset 0 0 0 3px rgba(255,255,255,.9);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px;min-height:0}
.stage.scroll{overflow-y:auto;justify-content:flex-start}
.stage.scroll>*{flex-shrink:0}
.score{font-weight:800}

/* common game UI */
.bigpic{font-size:clamp(90px,22vmin,190px);line-height:1;filter:drop-shadow(0 8px 10px rgba(0,0,0,.12))}
.bigpic svg{width:clamp(110px,26vmin,220px);height:auto}
.pic svg{width:1em;height:1em;vertical-align:middle}
.opts{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:14px;width:100%}
.opt{background:#fff;border-radius:20px;box-shadow:var(--sh);padding:12px 18px;min-width:120px;font-size:clamp(18px,3.2vw,26px);font-weight:700;border:3px solid transparent;transition:transform .12s,background .2s}
.opt:hover{transform:translateY(-3px)}
.opt:active{transform:scale(.96)}
.opt.pico{font-size:clamp(46px,10vmin,80px);padding:10px 16px;min-width:0;line-height:1}
.opt.pico svg{width:1em;height:1em}
.opt.good{background:#d8f8e3;border-color:var(--good);animation:pop .4s}
.opt.bad{background:#ffe0e0;border-color:var(--bad);animation:shake .4s}
.opt[disabled]{opacity:.55}
@keyframes pop{50%{transform:scale(1.12)}}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.btn{background:var(--c,var(--blue));color:#fff;border-radius:18px;padding:12px 22px;font-size:19px;font-weight:800;box-shadow:inset 0 -5px 0 rgba(0,0,0,.18),0 6px 14px rgba(0,0,0,.12);transition:transform .12s}
.btn:active{transform:translateY(3px)}
.btn.sec{background:#fff;color:var(--ink);box-shadow:var(--sh)}
.row{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap}
.col{display:flex;flex-direction:column;align-items:center;gap:10px}
.say{font-size:clamp(20px,4vw,32px);font-weight:700;text-align:center;margin:8px 0}
.hint{color:var(--ink2);font-size:15px;text-align:center}
.shake{animation:shake .4s}
.popin{animation:popin .45s cubic-bezier(.2,1.6,.4,1)}
@keyframes popin{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
.wobble{animation:wob 1.6s ease-in-out infinite}
@keyframes wob{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}

/* end overlay */
.overlay{position:fixed;inset:0;z-index:50;background:rgba(35,50,77,.45);display:grid;place-items:center;padding:16px;animation:fadein .25s}
.endbox{background:#fff;border-radius:30px;padding:24px 22px;text-align:center;max-width:420px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.endbox .bigstars{font-size:58px;letter-spacing:4px}
.endbox .bigstars span{display:inline-block;animation:popin .5s both}
.endbox .bigstars span:nth-child(2){animation-delay:.2s}.endbox .bigstars span:nth-child(3){animation-delay:.4s}
.endbox h2{margin:8px 0 4px;font-size:30px}
.endbox p{margin:0 0 16px;color:var(--ink2)}
.confetti{position:fixed;top:-20px;width:12px;height:18px;z-index:60;pointer-events:none;animation:fall linear forwards;border-radius:3px}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}

/* presentation */
.slide{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:8px;animation:slidein .45s ease;padding:6px;overflow-y:auto}
@keyframes slidein{from{opacity:0;transform:translateX(-40px)}to{opacity:1;transform:none}}
.pnav{display:flex;gap:10px;justify-content:center;align-items:center;padding:0 12px 12px;flex:none;flex-wrap:wrap}
.vword{font-size:clamp(40px,9vw,84px);font-weight:700;color:var(--blue);line-height:1.05;margin-top:6px}
.vword .ch{display:inline-block;animation:popin .4s both}
.var{font-size:clamp(20px,3.6vw,30px);color:var(--ink2);font-weight:700}
.vex{font-size:clamp(18px,3.4vw,28px);background:#fff;padding:8px 18px;border-radius:18px;box-shadow:var(--sh);margin-top:8px}
.hl{background:linear-gradient(transparent 55%,#ffe27a 55%);padding:0 3px;border-radius:4px;color:#b3261e}
.wgrid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));width:100%;max-width:900px}
.wcell{background:#fff;border-radius:18px;box-shadow:var(--sh);padding:10px 6px;cursor:pointer;transition:transform .12s}
.wcell:active{transform:scale(.95)}
.wcell .p{font-size:48px;line-height:1.1}
.wcell .p svg{width:52px;height:52px}
.wcell b{display:block;font-size:18px}
.wcell small{color:var(--ink2);font-size:13px}
.wcell.lit{outline:4px solid var(--sun);transform:scale(1.05)}
.gram{display:flex;flex-direction:column;gap:12px;width:100%;max-width:760px}
.bub{background:#fff;border-radius:22px;padding:10px 16px;box-shadow:var(--sh);font-size:clamp(18px,3.4vw,28px);font-weight:600;position:relative;max-width:85%;animation:popin .45s both;cursor:pointer}
.bub small{display:block;font-size:14px;color:var(--ink2);font-family:var(--fa);direction:rtl;font-weight:500}
.bub.l{align-self:flex-start;border-bottom-left-radius:6px;background:#e8f3ff}
.bub.r{align-self:flex-end;border-bottom-right-radius:6px;background:#fff4d6}
.bub.speaking{outline:4px solid var(--sun)}
.song{background:#fff;border-radius:26px;box-shadow:var(--sh);padding:14px 18px;max-width:760px;width:100%}
.song .ln{font-size:clamp(17px,3.1vw,25px);padding:3px 8px;border-radius:12px;transition:.25s;color:#8193ad}
.song .ln.on{background:#fff2b8;color:var(--ink);transform:scale(1.04);font-weight:700}
.song .ln.done{color:var(--ink)}
.notes{font-size:30px}
.notes span{display:inline-block;animation:bob 1s ease-in-out infinite}
.panel{background:linear-gradient(180deg,var(--bg1,#dff3ff),var(--bg2,#fff8e8));border-radius:24px;box-shadow:var(--sh);width:100%;max-width:880px;min-height:min(62vh,520px);padding:12px;position:relative;display:flex;flex-direction:column;gap:8px;overflow:hidden}
.panel .scene{position:absolute;inset:auto 0 0 0;font-size:40px;opacity:.35;letter-spacing:14px;white-space:nowrap;pointer-events:none}
.panel .actors{display:flex;justify-content:space-around;align-items:flex-end;gap:6px;margin-top:auto;position:relative;z-index:1}
.actor{display:flex;flex-direction:column;align-items:center;transition:transform .3s}
.actor .face{width:clamp(64px,13vw,130px);height:clamp(64px,13vw,130px);display:grid;place-items:center;font-size:clamp(54px,11vw,110px);line-height:1}
.actor .face svg{width:100%;height:100%}
.actor .nm{font-size:13px;font-weight:800;background:#fff;border-radius:99px;padding:0 10px;box-shadow:0 2px 4px rgba(0,0,0,.1)}
.actor.talk{transform:translateY(-8px) scale(1.08)}
.actor.talk .face{animation:talk .3s ease-in-out infinite}
@keyframes talk{50%{transform:scaleY(.94)}}
.lines{display:flex;flex-direction:column;gap:6px;position:relative;z-index:1}
.lines .bub{max-width:95%;font-size:clamp(16px,3vw,24px)}
.pnum{position:absolute;top:10px;left:12px;background:var(--coral);color:#fff;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:800;z-index:2}
.reading{background:#fff;border-radius:24px;box-shadow:var(--sh);padding:14px 18px;max-width:820px;width:100%;text-align:left;direction:ltr}
.reading .sn{font-size:clamp(17px,3vw,24px);font-family:var(--fe);line-height:1.6;border-radius:8px;padding:0 3px;cursor:pointer}
.reading .sn.on{background:#fff2b8}
.kw{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:10px}
.kw .wcell{min-width:100px}
.valueb{font-size:clamp(28px,6vw,52px);font-weight:800;color:#fff;background:linear-gradient(135deg,var(--grape),var(--pink));padding:16px 30px;border-radius:30px;box-shadow:var(--sh)}
.steps{display:flex;flex-direction:column;gap:8px;max-width:640px;width:100%}
.steps div{background:#fff;border-radius:16px;padding:8px 14px;box-shadow:var(--sh);text-align:left;direction:ltr;font-size:clamp(16px,2.8vw,21px);animation:popin .4s both}
.steps div b{color:var(--coral);margin-right:8px}
.steps div small{display:block;direction:rtl;text-align:right;color:var(--ink2);font-family:var(--fa);font-size:14px}

/* specific */
.balloon{position:absolute;width:clamp(78px,13vmin,110px);height:clamp(96px,16vmin,135px);border-radius:50% 50% 48% 48%/55% 55% 45% 45%;display:grid;place-items:center;font-size:clamp(34px,7vmin,54px);cursor:pointer;box-shadow:inset -10px -12px 0 rgba(0,0,0,.08),inset 8px 8px 0 rgba(255,255,255,.35);animation:rise linear forwards}
.balloon::after{content:"";position:absolute;bottom:-40px;left:50%;width:2px;height:40px;background:#9aa9bd}
.balloon .t{font-size:clamp(18px,3.4vmin,26px);font-weight:800;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.25)}
.balloon svg{width:1em;height:1em}
@keyframes rise{from{transform:translateY(0)}to{transform:translateY(calc(-100vh - 200px))}}
.boom{position:absolute;font-size:50px;pointer-events:none;animation:boom .5s forwards}
@keyframes boom{to{transform:scale(2);opacity:0}}

.mem{display:grid;gap:10px;width:100%;max-width:760px}
.mc{aspect-ratio:1/1;perspective:600px;cursor:pointer}
.mc .in{position:relative;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d}
.mc.f .in{transform:rotateY(180deg)}
.mc .fa,.mc .ba{position:absolute;inset:0;border-radius:16px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:grid;place-items:center;box-shadow:var(--sh)}
.mc .fa{background:linear-gradient(135deg,var(--blue),var(--grape));font-size:34px;color:#fff}
.mc .ba{background:#fff;transform:rotateY(180deg);font-size:clamp(28px,7vmin,54px);font-weight:700;text-align:center;padding:4px}
.mc .ba .en{font-size:clamp(14px,3vmin,22px)}
.mc .ba svg{width:1em;height:1em}
.mc.m .ba{background:#d8f8e3}

.linebox{position:relative;display:flex;justify-content:space-between;width:100%;max-width:720px;gap:20px}
.linebox .colm{display:flex;flex-direction:column;gap:10px;z-index:1}
.linebox svg.ov{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
.lnode{background:#fff;border-radius:16px;box-shadow:var(--sh);padding:6px 14px;min-height:56px;display:flex;align-items:center;justify-content:center;font-size:clamp(17px,3vw,23px);font-weight:700;cursor:pointer;border:3px solid transparent;min-width:120px}
.lnode.pic{font-size:clamp(34px,7vmin,50px);min-width:80px}
.lnode.pic svg{width:1em;height:1em}
.lnode.sel{border-color:var(--sun);transform:scale(1.05)}
.lnode.done{border-color:var(--good);background:#eafbf0}

.slots{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;direction:ltr;margin:10px 0}
.slot{width:clamp(38px,8vw,56px);height:clamp(46px,9vw,64px);border-radius:12px;background:#fff;border:3px dashed #b9c8dc;display:grid;place-items:center;font-size:clamp(24px,5vw,36px);font-weight:800;font-family:var(--fe)}
.slot.f{border-style:solid;border-color:var(--blue);color:var(--blue);animation:popin .3s}
.slot.fix{border:none;background:none;width:18px}
.letters{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;direction:ltr}
.letter{width:clamp(44px,9vw,62px);height:clamp(44px,9vw,62px);border-radius:14px;background:var(--sun);font-size:clamp(24px,5vw,34px);font-weight:800;font-family:var(--fe);box-shadow:inset 0 -5px 0 rgba(0,0,0,.15)}
.letter.used{visibility:hidden}

.field{position:relative;width:100%;height:100%;overflow:hidden;border-radius:22px}
.basket{position:absolute;bottom:8px;width:120px;height:70px;font-size:64px;display:grid;place-items:center;transition:left .05s linear;touch-action:none}
.fallit{position:absolute;font-size:clamp(40px,8vmin,60px);line-height:1}
.fallit svg{width:1em;height:1em}
.touchpad{position:absolute;inset:0;touch-action:none}

.holes{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(8px,2vw,20px);width:min(92vw,560px)}
.hole{aspect-ratio:1.3/1;border-radius:50%/40%;background:radial-gradient(ellipse at 50% 70%,#6b4f2a 0 45%,#8a6a3c 46% 60%,#9ccc65 61%);position:relative;overflow:hidden}
.mole{position:absolute;left:50%;bottom:-100%;transform:translateX(-50%);width:72%;height:88%;background:#c89f6d;border-radius:50% 50% 20% 20%;display:grid;place-items:center;font-size:clamp(28px,7vmin,50px);cursor:pointer;transition:bottom .22s;box-shadow:inset 0 -8px 0 rgba(0,0,0,.12)}
.mole svg{width:1em;height:1em}
.mole.up{bottom:12%}
.mole.hit{background:#8fd694}

.tf{display:flex;gap:18px;justify-content:center;margin-top:14px}
.tf button{width:clamp(90px,20vw,130px);height:clamp(90px,20vw,130px);border-radius:50%;font-size:clamp(46px,10vw,70px);color:#fff;box-shadow:inset 0 -8px 0 rgba(0,0,0,.2),var(--sh)}
.tf .y{background:var(--good)} .tf .n{background:var(--bad)}
.swcard{background:#fff;border-radius:28px;box-shadow:var(--sh);padding:18px 24px;text-align:center;transition:transform .45s,opacity .45s;touch-action:none;min-width:240px}
.swcard.gl{transform:translateX(-120vw) rotate(-25deg)}
.swcard.gr{transform:translateX(120vw) rotate(25deg)}

.wblocks{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;direction:ltr;min-height:64px;padding:8px;border-radius:18px;width:100%;max-width:760px}
.wblocks.ans{background:#fff;border:3px dashed #b9c8dc}
.wb{background:var(--c,var(--mint));color:#fff;border-radius:14px;padding:8px 14px;font-size:clamp(18px,3.4vw,26px);font-weight:700;font-family:var(--fe);box-shadow:inset 0 -4px 0 rgba(0,0,0,.18);animation:popin .3s}

.palette{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.sw{width:clamp(40px,8vw,54px);height:clamp(40px,8vw,54px);border-radius:50%;border:4px solid #fff;box-shadow:var(--sh);cursor:pointer}
.sw.sel{outline:4px solid var(--ink);transform:scale(1.12)}
.colsvg{width:min(92vw,560px);height:auto;max-height:52vh}
.colsvg .part{cursor:pointer;stroke:#23324d;stroke-width:2.5;transition:fill .3s}

.tilesgrid{position:relative;display:grid;border-radius:22px;overflow:hidden;box-shadow:var(--sh);background:#fff}
.cov{background:linear-gradient(135deg,var(--grape),var(--blue));border:2px solid rgba(255,255,255,.5);transition:opacity .5s,transform .5s;display:grid;place-items:center;color:#fff;font-size:24px}
.cov.gone{opacity:0;transform:scale(.2)}

.scene2{position:relative;width:min(94vw,640px);aspect-ratio:16/10;background:linear-gradient(180deg,#fff6e0 0 70%,#e9d2ab 70%);border-radius:24px;box-shadow:var(--sh);overflow:hidden}
.dropz{position:absolute;border:3px dashed rgba(77,150,255,.35);border-radius:16px;transition:.2s}
.dropz.over{border-color:var(--sun);background:rgba(255,201,60,.2)}
.drag{touch-action:none;cursor:grab}
.dragging{position:fixed!important;z-index:100;pointer-events:none;transform:scale(1.15);filter:drop-shadow(0 10px 10px rgba(0,0,0,.25))}
.tray{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:12px;min-height:70px}
.chip{background:#fff;border-radius:16px;box-shadow:var(--sh);padding:6px 12px;font-size:clamp(30px,6vmin,46px);line-height:1.1;text-align:center}
.chip small{display:block;font-size:14px;font-weight:700}
.chip svg{width:1em;height:1em}

.bins{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;width:100%}
.bin{flex:1;min-width:140px;max-width:260px;min-height:170px;border-radius:24px;background:#fff;box-shadow:var(--sh);border:4px dashed var(--c);padding:8px;display:flex;flex-direction:column;align-items:center}
.bin h4{margin:0 0 6px;font-size:clamp(17px,3vw,22px);color:var(--c)}
.bin .in{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;font-size:30px}
.bin.over{background:color-mix(in srgb,var(--c) 15%,#fff)}

.wheel{width:min(70vmin,380px);aspect-ratio:1/1;border-radius:50%;position:relative;transition:transform 3.2s cubic-bezier(.15,.8,.2,1);box-shadow:0 0 0 8px #fff,var(--sh)}
.wheel span{position:absolute;left:50%;top:50%;font-size:clamp(24px,5vmin,36px);transform-origin:0 0}
.pointer{font-size:44px;margin-bottom:-18px;z-index:2;position:relative}

.track{width:min(94vw,820px);display:flex;flex-direction:column;gap:12px;background:#7c8a9c;border-radius:18px;padding:12px 8px;position:relative}
.lane{height:54px;border-bottom:3px dashed #fff;position:relative}
.lane:last-child{border:none}
.racer{position:absolute;top:2px;font-size:46px;transition:left .6s;transform:scaleX(-1)}
.finish{position:absolute;right:8px;top:0;bottom:0;width:18px;background:repeating-conic-gradient(#000 0 25%,#fff 0 50%) 0 0/12px 12px}

.board{display:grid;gap:5px;direction:ltr;user-select:none;touch-action:none}
.board b{display:grid;place-items:center;background:#fff;border-radius:8px;font-family:var(--fe);font-size:clamp(16px,3.6vmin,26px);cursor:pointer;aspect-ratio:1/1;box-shadow:0 2px 0 rgba(0,0,0,.08)}
.board b.sel{background:#fff2b8}
.board b.fd{background:var(--c,#b9f0c9)}

.sea{position:relative;width:100%;height:100%;background:linear-gradient(180deg,#bfe9ff 0 18%,#4fb0e8 18%,#2a7fc1 100%);border-radius:22px;overflow:hidden}
.fish{position:absolute;display:flex;align-items:center;gap:4px;cursor:pointer;font-size:clamp(40px,8vmin,56px);animation:swim linear infinite}
.fish .lbl{font-size:clamp(15px,3vmin,20px);background:#fff;border-radius:12px;padding:2px 10px;font-weight:800;font-family:var(--fe)}
@keyframes swim{from{left:-40%}to{left:110%}}
.fish.rev{animation-name:swimr}
@keyframes swimr{from{left:110%}to{left:-40%}}

.xo{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:min(80vmin,420px)}
.xo button{aspect-ratio:1/1;border-radius:20px;background:#fff;box-shadow:var(--sh);font-size:clamp(40px,11vmin,80px);font-weight:900}
.xo .X{color:var(--coral)} .xo .O{color:var(--blue)}
.teamsc{display:flex;gap:10px}
.teamsc .pill.on{outline:4px solid var(--sun)}

.river{position:relative;width:min(94vw,640px);height:100%;background:linear-gradient(180deg,#8fd694 0 12%,#4fb0e8 12% 88%,#8fd694 88%);border-radius:24px;overflow:hidden}
.stone{position:absolute;width:30%;height:13%;border-radius:50%;background:#b6a58f;display:grid;place-items:center;font-size:clamp(20px,4.5vmin,34px);cursor:pointer;box-shadow:inset 0 -6px 0 rgba(0,0,0,.2);font-weight:800;font-family:var(--fe)}
.stone svg{width:1em;height:1em}
.hopper{position:absolute;font-size:44px;transition:left .5s,top .5s;z-index:2}

.cakebox{position:relative;width:min(80vw,360px);height:260px}
.cake{position:absolute;bottom:0;left:0;right:0;height:130px;background:linear-gradient(180deg,#ff9ec7 0 30%,#fff 30% 38%,#ffcf87 38%);border-radius:24px 24px 14px 14px;box-shadow:var(--sh)}
.candles{position:absolute;bottom:130px;left:0;right:0;display:flex;justify-content:center;gap:6px;flex-wrap:wrap}
.candle{width:14px;height:50px;background:repeating-linear-gradient(45deg,#6ec6ff 0 6px,#fff 6px 12px);border-radius:4px;position:relative;animation:popin .3s}
.candle::before{content:"";position:absolute;top:-22px;left:-2px;width:18px;height:22px;background:radial-gradient(circle at 50% 70%,#fff59d,#ffb300 60%,transparent 62%);border-radius:50% 50% 40% 40%;animation:flick .3s infinite alternate}
.candle.out::before{display:none}
@keyframes flick{to{transform:scaleY(1.15) rotate(3deg)}}

.map{position:relative;width:min(94vw,720px);aspect-ratio:16/10;background:radial-gradient(circle at 30% 40%,#bde6a4 0 30%,transparent 31%),#a8dc8f;border-radius:24px;box-shadow:var(--sh);overflow:hidden}
.road{position:absolute;background:#8a95a5}
.place{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;cursor:pointer;transition:transform .2s}
.place .pi{font-size:clamp(34px,7vmin,56px);line-height:1;filter:drop-shadow(0 4px 3px rgba(0,0,0,.2))}
.place .pn{background:#fff;border-radius:10px;padding:0 8px;font-weight:800;font-size:14px}
.place.good{transform:translate(-50%,-50%) scale(1.25)}

.jig{display:grid;gap:3px;background:#e6eef8;padding:3px;border-radius:14px}
.jig .js,.jp{width:var(--s);height:var(--s);border-radius:8px}
.jig .js{background:#fff;border:2px dashed #b9c8dc}
.jp{background-repeat:no-repeat;box-shadow:0 3px 6px rgba(0,0,0,.2)}

.lockrow{display:flex;gap:10px;font-size:40px}
.lockrow span{transition:.4s}
.chest{font-size:110px;transition:transform .5s}

.canvaswrap{position:relative;background:#fff;border-radius:20px;box-shadow:var(--sh);overflow:hidden;touch-action:none}
.tools{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;align-items:center;margin:6px 0}
.tools .sw{width:36px;height:36px}
.tools .ibtn{width:42px;height:42px;font-size:20px}
.tools .ibtn.sel{outline:3px solid var(--blue)}

.robotsvg{width:min(80vw,320px);max-width:100%;height:auto;max-height:46vh}
.cnt{display:flex;align-items:center;gap:6px;background:#fff;border-radius:16px;box-shadow:var(--sh);padding:4px 8px}
.cnt b{min-width:30px;text-align:center;font-size:24px}
.cnt button{width:38px;height:38px;border-radius:12px;background:var(--sun);font-size:24px;font-weight:900}
.cnt span{font-size:15px;font-weight:700}

.chat{display:flex;flex-direction:column;gap:8px;width:100%;max-width:700px;max-height:50vh;overflow-y:auto;padding:6px}
.chat .row2{display:flex;align-items:flex-end;gap:8px;direction:ltr}
.chat .row2.me{flex-direction:row-reverse}
.chat .av{width:46px;height:46px;font-size:38px;line-height:1;flex:none}
.chat .av svg{width:100%;height:100%}

.faces{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:10px;width:100%;max-width:720px}
.facec{background:#fff;border-radius:18px;box-shadow:var(--sh);padding:6px;cursor:pointer;text-align:center}
.facec svg{width:100%;height:auto}
.facec b{font-size:15px}
.facec.good{background:#d8f8e3}.facec.bad{background:#ffe0e0;animation:shake .4s}

.dice{font-size:56px;cursor:pointer;display:inline-block}
.dice.roll{animation:spin .6s}
@keyframes spin{to{transform:rotate(720deg)}}
.path{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;width:min(94vw,640px);direction:ltr}
.path div{aspect-ratio:1/1;border-radius:14px;background:#fff;box-shadow:var(--sh);display:grid;place-items:center;font-size:clamp(16px,3.6vmin,26px);position:relative;font-weight:800}
.path div .tok{position:absolute;font-size:clamp(26px,6vmin,40px);animation:bob 1s infinite}

.cert{background:#fffdf5;border:10px double var(--gold);border-radius:24px;padding:24px;max-width:760px;width:100%;text-align:center;box-shadow:var(--sh)}
.cert h1{font-size:clamp(28px,6vw,48px);margin:6px 0;color:var(--orange)}
.cert .nm{font-size:clamp(28px,6vw,46px);color:var(--blue);border-bottom:3px dashed var(--sun);display:inline-block;padding:0 20px;margin:8px 0}
input.txt{font-family:inherit;font-size:20px;padding:10px 14px;border-radius:14px;border:3px solid var(--line);outline:none;width:min(320px,80vw);text-align:center}
input.txt:focus{border-color:var(--blue)}

.set{display:flex;flex-direction:column;gap:14px;max-width:560px}
.set label{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#fff;border-radius:16px;padding:10px 14px;box-shadow:var(--sh);font-weight:700}
.set select,.set input[type=range]{font-family:inherit;font-size:16px;max-width:55%}

.bodyfig .hot{cursor:pointer;fill:transparent;stroke:transparent;stroke-width:3}
.bodyfig .hot.good{fill:rgba(56,193,114,.35);stroke:var(--good)}
.bodyfig .hot.bad{fill:rgba(255,90,95,.3)}

.gbot .arm,.gbot .leg,.gbot .top,.gbot .all{transition:transform .4s}
@media (max-width:600px){
  .screen{padding:8px 12px 80px}
  .grid{grid-template-columns:1fr}
  .tiles{grid-template-columns:repeat(2,1fr);gap:10px}
  .tile{padding:12px 8px}.tile .ti{font-size:38px}.tile h4{font-size:15px}
  .ibtn{width:42px;height:42px;font-size:20px}
  .instr{padding:6px 10px}
  .stage{margin:8px;padding:6px}
  .pdots{display:none}
}
@media print{#sky,.topbar,.noprint{display:none!important}body{background:#fff}}

</style>

 // ears

 // eyes
 [[47,62],[73,62]].forEach(([x,y])=>{g+=`<ellipse cx="${x}" cy="${y}" rx="${6.8*es}" ry="${7.6*es}" fill="#fff" stroke="#23324d" stroke-width="1.2"/><circle cx="${x}" cy="${y+1}" r="${4.3*es}" fill="${ec}"/><circle cx="${x}" cy="${y+1}" r="${2*es}" fill="#111"/><circle cx="${x+1.6*es}" cy="${y-1.2*es}" r="${1.3*es}" fill="#fff"/>`;});
 if(p.glasses) g+=`<g fill="none" stroke="#23324d" stroke-width="2.5"><circle cx="47" cy="62" r="11"/><circle cx="73" cy="62" r="11"/><path d="M58 62 H62"/></g>`;
 // nose
 g+= p.nose==='b'?`<ellipse cx="60" cy="75" rx="7" ry="6" fill="${shade(sk)}"/>`:`<path d="M59 70 Q56 76 61 77" stroke="${shade(sk)}" stroke-width="2.5" fill="none" stroke-linecap="round"/>`;
 // cheeks
 g+=`<circle cx="38" cy="76" r="5" fill="#ff9fb5" opacity=".55"/><circle cx="82" cy="76" r="5" fill="#ff9fb5" opacity=".55"/>`;
 // mouth

 return S('0 0 120 120',g);

const rnd=n=>Math.floor(Math.random()*n);

function pic(k){const code=picOf(k);if(typeof code!=='string')return '';
 if(code.startsWith('svg:'))return OBJ[code.slice(4)]||'❓';
 if(code.startsWith('col:'))return colBlob(code.slice(4));
 if(code.startsWith('num:'))return numBub(+code.slice(4));
 if(code.startsWith('hairc:'))return face({hair:code.slice(6),style:'short',skin:'l',eyes:'brown'});
 if(code.startsWith('chr:'))return avatar(code.slice(4));
 return `<span>${code}</span>`;}
function bidi(s){return String(s).replace(/(<[^>]*>)|([A-Za-z][A-Za-z0-9'’ ,.?!…\/()-]*[A-Za-z0-9'’?!.…)])/g,(m,tag,en)=>tag?tag:`<bdi class="en">${en}</bdi>`);}
function pp(x){return typeof x==='string'&&x.includes('<')?x:pic(x);}
const arOf=k=>(V[k]&&V[k][1])||'';
const art=w=>/^[aeiou]/i.test(w)?'an':'a';

/* ---------- sound ---------- */
const Snd={ctx:null,
 init(){if(!this.ctx){try{this.ctx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(this.ctx&&this.ctx.state==='suspended')this.ctx.resume();},
 tone(f,d=.15,type='sine',v=.18,t0=0,slide=0){if(!this.ctx||!ST.set.sfx)return;const c=this.ctx,t=c.currentTime+t0;const o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(40,f+slide),t+d);g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.015);g.gain.exponentialRampToValueAtTime(0.0001,t+d);o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+d+.05);},
 noise(d=.2,v=.2,t0=0,hp=800){if(!this.ctx||!ST.set.sfx)return;const c=this.ctx,t=c.currentTime+t0;const b=c.createBuffer(1,c.sampleRate*d,c.sampleRate),a=b.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=(Math.random()*2-1)*(1-i/a.length);const s=c.createBufferSource();s.buffer=b;const f=c.createBiquadFilter();f.type='highpass';f.frequency.value=hp;const g=c.createGain();g.gain.value=v;s.connect(f);f.connect(g);g.connect(c.destination);s.start(t);},
 sfx(n){this.init();const T=this.tone.bind(this);switch(n){
  case'click':T(660,.06,'triangle',.12);break;
  case'good':T(660,.1,'sine',.2);T(880,.12,'sine',.2,.09);T(1320,.18,'sine',.16,.18);break;
  case'bad':T(220,.18,'square',.08);T(165,.25,'square',.08,.12);break;
  case'pop':T(900,.08,'sine',.25,0,-600);this.noise(.08,.15,0,2000);break;
  case'win':[523,659,784,1047,784,1047].forEach((f,i)=>T(f,.16,'triangle',.2,i*.12));break;
  case'whoosh':this.noise(.35,.12,0,500);T(300,.3,'sine',.05,0,600);break;
  case'tick':T(1200,.03,'square',.05);break;
  case'flip':T(500,.06,'triangle',.12,0,300);break;
  case'star':[1047,1319,1568].forEach((f,i)=>T(f,.14,'sine',.16,i*.08));break;
  case'splash':this.noise(.45,.2,0,300);break;
  case'jump':T(300,.18,'sine',.2,0,500);break;
  case'drum':T(110,.18,'sine',.35,0,-60);break;
  case'snare':this.noise(.12,.18,0,1500);break;
  case'coin':T(988,.07,'square',.1);T(1319,.2,'square',.1,.07);break;
  case'spin':for(let i=0;i<14;i++)T(900,.02,'square',.05,i*.18*(1+i*.08));break;
  case'boing':T(200,.3,'sine',.25,0,400);break;
  case'clap':this.noise(.07,.3,0,1200);this.noise(.07,.25,.03,1500);break;
  case'stamp':T(80,.2,'sine',.4,0,-30);this.noise(.1,.12,0,200);break;
  case'bell':T(1568,.6,'sine',.15);T(2093,.5,'sine',.08,.02);break;
  case'magic':[784,988,1175,1568,1976].forEach((f,i)=>T(f,.12,'sine',.12,i*.06));break;
  case'lose':[392,330,262].forEach((f,i)=>T(f,.2,'triangle',.15,i*.15));break;
  case'blow':this.noise(.6,.2,0,600);break;
  case'scratch':this.noise(.05,.05,0,3000);break;
 }},
 musicTimer:null,
 music(on){clearInterval(this.musicTimer);this.musicTimer=null;if(!on)return;this.init();const sc=[523,587,659,784,880,1047,880,784];let i=0;const bass=[131,175,196,165];this.musicTimer=setInterval(()=>{if(!ST.set.sfx)return;const f=sc[(i*3+Math.floor(i/4))%sc.length];this.tone(f,.28,'triangle',.035);if(i%4===0)this.tone(bass[(i/4)%4|0],.6,'sine',.05);i++;},330);}
};

/* ---------- speech ---------- */
const TTS={voices:[],v:null,ok:'speechSynthesis' in window,audio:null,fails:0,last:'',
 init(){try{this.audio=new Audio();this.audio.preload='auto';}catch(e){}
  if(!this.ok)return;const load=()=>{try{this.voices=speechSynthesis.getVoices().filter(v=>/^en/i.test(v.lang));}catch(e){this.voices=[];}this.pick();};load();try{speechSynthesis.onvoiceschanged=load;}catch(e){}let n=0;const t=setInterval(()=>{load();if(this.voices.length||++n>20)clearInterval(t);},250);},
 pick(){const vs=this.voices;if(!vs.length){this.v=null;return;}this.v=vs.find(v=>v.name===ST.set.voice)||vs.find(v=>/en.GB/i.test(v.lang)&&/female|libby|sonia|serena|kate|hazel|susan|google uk english female/i.test(v.name))||vs.find(v=>/google uk english female/i.test(v.name))||vs.find(v=>/en.GB/i.test(v.lang))||vs.find(v=>/en.US/i.test(v.lang))||vs[0];},
 unlock(){try{if(this.audio){this.audio.src='data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA=';const p=this.audio.play();p&&p.catch(()=>{});}}catch(e){}try{if(this.ok){const u=new SpeechSynthesisUtterance(' ');u.volume=0;speechSynthesis.speak(u);}}catch(e){}},
 engine(){if(window.AndroidTTS&&typeof AndroidTTS.speak==='function')return 'android';const m=ST.set.tts||'auto';if(m==='device')return this.ok?'device':'online';if(m==='online')return 'online';return (this.ok&&this.voices.length&&this.fails<2)?'device':'online';},
 stop(){try{if(this.ok)speechSynthesis.cancel();}catch(e){}try{if(this.audio){this.audio.pause();}}catch(e){}try{if(window.AndroidTTS&&AndroidTTS.stop)AndroidTTS.stop();}catch(e){}},
 say(text,o={}){text=String(text||'').replace(/_+/g,' blank ').replace(/[\u{1F300}-\u{1FAFF}☀-➿]/gu,'').trim();if(!text)return new Promise(r=>setTimeout(r,200));this.stop();this.last=text;const e=this.engine();
  if(e==='android')return this.sayAndroid(text,o);if(e==='online')return this.sayOnline(text,o);return this.sayDevice(text,o);},
 sayAndroid(text,o){return new Promise(res=>{try{AndroidTTS.speak(text,String((o.rate||1)*ST.set.rate),String(o.pitch||1));}catch(e){}setTimeout(res,600+text.length*75/ST.set.rate);});},
 sayDevice(text,o){return new Promise(res=>{let done=false,started=false;const fin=()=>{if(!done){done=true;clearTimeout(tm);clearTimeout(st);res();}};
  const go=()=>{try{const u=new SpeechSynthesisUtterance(text);if(this.v)u.voice=this.v;u.lang=(this.v&&this.v.lang)||'en-GB';u.rate=Math.min(2,(o.rate||1)*ST.set.rate);u.pitch=o.pitch||1;u.volume=1;
    u.onstart=()=>{started=true;this.fails=0;};u.onend=fin;u.onerror=ev=>{if(!started&&ev&&ev.error!=='interrupted'&&ev.error!=='canceled'){this.fails++;clearTimeout(tm);clearTimeout(st);if(!done){done=true;this.sayOnline(text,o).then(res);}}else fin();};
    speechSynthesis.speak(u);try{speechSynthesis.resume();}catch(e){}}catch(e){this.fails++;done=true;this.sayOnline(text,o).then(res);}};
  const tm=setTimeout(fin,2500+text.length*110/ST.set.rate);
  // if the device never starts speaking, switch to the online voice
  const st=setTimeout(()=>{if(!started&&!done){this.fails++;try{speechSynthesis.cancel();}catch(e){}done=true;clearTimeout(tm);this.sayOnline(text,o).then(res);}},2600);
  setTimeout(go,60);});},
 sayOnline(text,o){return new Promise(res=>{const a=this.audio;if(!a){setTimeout(res,300);return;}let done=false;const fin=()=>{if(!done){done=true;clearTimeout(tm);a.onended=a.onerror=null;res();}};
  const q=encodeURIComponent(text.slice(0,195));const sp=Math.min(1,.55+ST.set.rate*.45);
  const srcs=[`https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=en-GB&ttsspeed=${sp}&q=${q}`,`https://translate.googleapis.com/translate_tts?ie=UTF-8&client=gtx&tl=en&q=${q}`,`https://dict.youdao.com/dictvoice?type=1&audio=${q}`];
  let k=0;const next=()=>{if(done)return;if(k>=srcs.length){fin();return;}const s=srcs[k++];try{a.src=s;const p=Math.max(.8,Math.min(1.25,1+((o.pitch||1)-1)*.35));a.preservesPitch=false;a.mozPreservesPitch=false;a.webkitPreservesPitch=false;a.playbackRate=p*Math.max(.7,Math.min(1.15,ST.set.rate/.85*(o.rate||1)));const pr=a.play();if(pr&&pr.catch)pr.catch(err=>{if(err&&err.name==='NotAllowedError'){fin();}else next();});}catch(e){next();}};
  a.onended=fin;a.onerror=next;const tm=setTimeout(fin,9000+text.length*60);next();});},
 char(name,text){const c=CHAR[name]||{};return this.say(text,{pitch:c.p||1,rate:c.r||1});}
};

/* ---------- confetti ---------- */
function confetti(n=60){const cs=['#ef3b3b','#ffd21f','#34b54a','#2f7de1','#9b4dde','#ff7eb6','#ff8c1a'];for(let i=0;i<n;i++){const c=h('div',{class:'confetti'});c.style.left=Math.random()*100+'vw';c.style.background=pick(cs);c.style.animationDuration=(1.8+Math.random()*1.8)+'s';c.style.animationDelay=(Math.random()*.6)+'s';document.body.appendChild(c);setTimeout(()=>c.remove(),4200);}}

/* ---------- drag & drop (drag or tap-tap) ---------- */
const DR={sel:null};
function dragify(el,o){el.classList.add('drag');let sx,sy,ghost=null,moved=false,over=null;
 const tgts=()=>typeof o.targets==='function'?o.targets():o.targets;
 const findT=(x,y)=>{const e=document.elementFromPoint(x,y);if(!e)return null;return tgts().find(t=>t===e||t.contains(e))||null;};
 el.addEventListener('pointerdown',ev=>{if(el.dataset.locked)return;ev.preventDefault();sx=ev.clientX;sy=ev.clientY;moved=false;
  const r=el.getBoundingClientRect();const ox=ev.clientX-r.left,oy=ev.clientY-r.top;
  const mv=e=>{if(!moved&&Math.hypot(e.clientX-sx,e.clientY-sy)<8)return;if(!moved){moved=true;ghost=el.cloneNode(true);ghost.classList.add('dragging');ghost.style.width=r.width+'px';ghost.style.height=r.height+'px';document.body.appendChild(ghost);el.style.opacity=.3;Snd.sfx('click');}
   ghost.style.left=(e.clientX-ox)+'px';ghost.style.top=(e.clientY-oy)+'px';const t=findT(e.clientX,e.clientY);if(t!==over){over&&over.classList.remove('over');over=t;over&&over.classList.add('over');}};
  const up=e=>{window.removeEventListener('pointermove',mv);window.removeEventListener('pointerup',up);window.removeEventListener('pointercancel',up);
   if(moved){ghost&&ghost.remove();el.style.opacity='';over&&over.classList.remove('over');const t=findT(e.clientX,e.clientY);over=null;if(t)o.drop(t,el);}
   else{ // tap select
    if(DR.sel&&DR.sel.el===el){el.style.outline='';DR.sel=null;return;}
    if(DR.sel)DR.sel.el.style.outline='';DR.sel={el,o};el.style.outline='4px solid #FFC93C';Snd.sfx('click');
    tgts().forEach(t=>{if(!t._drt){t._drt=1;t.addEventListener('click',()=>{if(DR.sel&&tgts2(DR.sel).includes(t)){const s=DR.sel;DR.sel=null;s.el.style.outline='';s.o.drop(t,s.el);}});}});
   }};
  window.addEventListener('pointermove',mv);window.addEventListener('pointerup',up);window.addEventListener('pointercancel',up);});
}
function tgts2(s){return typeof s.o.targets==='function'?s.o.targets():s.o.targets;}

function starsOf(lid,i){return ST.stars[lid+':'+i]||0;}
function lessonItems(L){const it=[{k:'pres',eng:'pres',cfg:{}}];(L.acts||[]).forEach(a=>it.push(Object.assign({k:'act'},a)));(L.games||[]).forEach(a=>it.push(Object.assign({k:'game'},a)));(L.art||[]).forEach(a=>it.push(Object.assign({k:'art'},a)));return it;}
function lessonStars(L){const it=lessonItems(L);let s=0;it.forEach((x,i)=>s+=starsOf(L.id,i));return [s,it.length*3];}
function unitStars(U){let s=0,m=0;U.lessons.forEach(L=>{const [a,b]=lessonStars(L);s+=a;m+=b;});return [s,m];}
function totalStars(){let s=0,m=0;UNITS.forEach(U=>{const [a,b]=unitStars(U);s+=a;m+=b;});return [s,m];}
const starStr=(n,m=3)=>'<span class="stars">'+'★'.repeat(n)+'<span class="off">'+'★'.repeat(Math.max(0,m-n))+'</span></span>';

 if(back)t.querySelector('[data-b]').onclick=()=>{Snd.sfx('click');history.back();};

function openPlayer(u,l,i,push=true){closePlayer(false);const U=UNITS[u],L=U.lessons[l],items=lessonItems(L),it=items[i],E=ENG[it.eng];
 if(push)history.pushState({s:CUR.screen,p:{u,l},player:1},'');

 P.innerHTML=`<div class="pbar"><button class="ibtn" data-x title="خروج">✖</button><div class="ptitle">${it.k==='pres'?'🎬 '+L.en:(E.icon+' '+(it.ar||E.ar))} <span style="font-weight:500;color:var(--ink2);font-size:.8em" class="en">· ${L.en}</span></div><div class="pdots"></div><span class="pill score hide">⭐ 0</span></div>
 <div class="instr"><div><div class="ia"></div><div class="ie en"></div></div><button class="ibtn" data-rep title="استمع مرة أخرى">🔊</button></div><div class="stage"></div>`;
 document.body.appendChild(P);document.body.style.overflow='hidden';
 const stage=P.querySelector('.stage');
 const timers=[],cleanups=[];let repText=null,finished=false;
 const api={U,L,it,stage,P,words:(it.words||L.words||[]),
  instr(ar,en,speak){P.querySelector('.ia').innerHTML=bidi(ar||'');P.querySelector('.ie').innerHTML=en||'';repText=speak===undefined?(en||null):speak;if(repText)this.say(repText);},
  setRep(t){repText=t;},
  say:(t,o)=>TTS.say(t,o),sfx:n=>Snd.sfx(n),
  later(fn,ms){const t=setTimeout(()=>{if(PLAY===ctx)fn();},ms);timers.push(t);return t;},
  every(fn,ms){const t=setInterval(()=>{if(PLAY===ctx)fn();else clearInterval(t);},ms);timers.push(t);return t;},
  onClean(fn){cleanups.push(fn);},
  dots(n){const d=P.querySelector('.pdots');d.innerHTML='';for(let k=0;k<n;k++)d.appendChild(h('i'));if(n)d.firstChild.classList.add('on');},
  dot(k,ok){const d=$$('.pdots i',P);if(d[k]){d[k].classList.remove('on');d[k].classList.add(ok?'ok':'no');}if(d[k+1])d[k+1].classList.add('on');},
  score(n){const s=P.querySelector('.score');s.classList.remove('hide');s.textContent='⭐ '+n;},
  good(el){Snd.sfx('good');if(el){el.classList.remove('bad');el.classList.add('good');}},
  bad(el){Snd.sfx('bad');if(el){el.classList.remove('bad');void el.offsetWidth;el.classList.add('bad');setTimeout(()=>el.classList.remove('bad'),500);}},
  done(ratio,noStars){if(finished)return;finished=true;TTS.stop();const st=noStars?3:ratio>=.9?3:ratio>=.6?2:1;const key=L.id+':'+i;if(st>(ST.stars[key]||0)){ST.stars[key]=st;save();}endScreen(u,l,i,st,ratio,noStars);},
  confetti};
 const ctx={api,timers,cleanups};PLAY=ctx;
 P.querySelector('[data-x]').onclick=()=>{Snd.sfx('click');history.back();};
 P.querySelector('[data-rep]').onclick=()=>{Snd.sfx('click');if(repText)TTS.say(repText);};
 try{E.run(api,it.cfg||{},it);}catch(e){console.error(e);stage.innerHTML='<div class="say">⚠️ '+esc(e.message)+'</div>';}

/* ---------- shared game helpers ---------- */
// rounds runner
function rounds(api,n,renderFn){let i=0,sc=0;api.dots(n);api.score(0);const next=ok=>{api.dot(i,ok);if(ok){sc++;api.score(sc);}i++;if(i>=n)api.later(()=>api.done(sc/n),900);else api.later(()=>renderFn(i,next),900);};renderFn(0,next);}
// options: [{html,ok,cls,speak}] -> cb(firstTry)
function options(box,opts,cb,api,o={}){let miss=false,ok=false;const w=h('div',{class:'opts'});opts.forEach(op=>{const b=h('button',{class:'opt '+(op.cls||'')},op.html);if(op.ok)b.dataset.ok=1;b.onclick=()=>{if(ok)return;if(op.speak)TTS.say(op.speak);if(op.ok){ok=true;api.good(b);$$('button',w).forEach(x=>x.disabled=x!==b);cb(!miss,b);}else{miss=true;api.bad(b);if(o.oneTry){ok=true;$$('button',w).forEach(x=>{x.disabled=true;});const g=[...w.children][opts.findIndex(z=>z.ok)];g&&g.classList.add('good');cb(false,b);}}};w.appendChild(b);});box.appendChild(w);return w;}
function wordOpts(target,pool,n=3,mode='word'){const ds=sample(pool,n-1,[target]);return shuffle([target,...ds]).map(w=>({html:mode==='pic'?pic(w):`<span class="en">${w}</span>`,ok:w===target,cls:mode==='pic'?'pico':'',speak:mode==='word'?null:null}));}
function allWords(){const s=new Set();UNITS.forEach(U=>U.lessons.forEach(L=>(L.words||[]).forEach(w=>s.add(w))));return [...s];}
