<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>ديني حياتي – الصف الثاني</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Baloo+Bhaijaan+2:wght@400;500;600;700;800&display=swap">
<style>
:root{
  --sky:#E3F3FA; --sky2:#BDE3F2; --cloud:#FFFFFF;
  --mint:#9BDDBF; --mint2:#D9F3E6; --teal:#0E7C6B; --teal-d:#0A5A4E;
  --rose:#DD3F77; --rose2:#FBE0EA; --sun:#FFC83D; --sun2:#FFF1C7;
  --sand:#FFF7E6; --sand2:#F4E3BD; --orange:#EF8A1F; --orange2:#FDE6CC;
  --violet:#7B5CD6; --violet2:#E9E2FB;
  --ink:#1C3340; --muted:#587080; --line:#D5E6EC;
  --good:#1F9D55; --good2:#D8F5E3; --bad:#DE4A4F; --bad2:#FCE1E2;
  --card:#FFFFFF; --shadow:0 6px 0 rgba(28,51,64,.10), 0 10px 24px rgba(28,51,64,.08);
  --r:22px;
  --font:"Baloo Bhaijaan 2","Tajawal","Segoe UI",Tahoma,sans-serif;
  --quran:"Amiri Quran","Amiri","Traditional Arabic","Scheherazade New",serif;
  color-scheme:light;
}
html,body{height:100%}
body{margin:0;background:var(--sky);color:var(--ink);font-family:var(--font);-webkit-tap-highlight-color:transparent;overflow:hidden}
*{box-sizing:border-box}
button{font-family:inherit;color:inherit}
#app{position:fixed;inset:0;direction:rtl;overflow:hidden;
  background:
    radial-gradient(circle at 12% 8%, #fff8 0 60px, transparent 61px),
    radial-gradient(circle at 86% 14%, #fff9 0 40px, transparent 41px),
    linear-gradient(180deg,var(--sky) 0%, #EEF8F4 70%, var(--mint2) 100%);
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;animation:scrIn .35s ease both}
@keyframes scrIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding:0 16px 28px}
.wrap{max-width:1060px;margin:0 auto;width:100%}
:focus-visible{outline:3px solid var(--rose);outline-offset:3px}

/* ---------- top bar ---------- */
.bar{display:flex;align-items:center;gap:10px;padding:10px 16px;min-height:62px;flex-shrink:0}
.bar .ttl{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.15}
.bar .ttl b{font-size:clamp(17px,2.6vw,24px);font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .ttl small{font-size:13px;color:var(--muted);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ibtn{width:46px;height:46px;border-radius:16px;border:0;background:var(--card);box-shadow:0 4px 0 rgba(28,51,64,.12);font-size:22px;display:grid;place-items:center;cursor:pointer;flex-shrink:0;transition:transform .12s}
.ibtn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(28,51,64,.12)}
.starpill{display:flex;align-items:center;gap:4px;background:var(--sun2);border-radius:99px;padding:6px 12px;font-weight:800;font-size:16px;box-shadow:inset 0 0 0 2px #F6D77A}

/* ---------- home ---------- */
.hero{position:relative;margin:6px auto 18px;max-width:1060px;border-radius:32px;padding:26px 24px 92px;overflow:hidden;
  background:linear-gradient(180deg,#8FD6F0 0%, #C8ECF7 60%, #E9F7EF 100%);box-shadow:var(--shadow)}
.hero h1{margin:0;font-size:clamp(40px,8vw,78px);line-height:1;font-weight:800;color:var(--rose);text-shadow:0 4px 0 #fff, 0 7px 0 rgba(221,63,119,.18);letter-spacing:0}
.hero p{margin:10px 0 0;font-size:clamp(15px,2.2vw,20px);font-weight:700;color:var(--teal-d)}
.hero .kicker{display:inline-block;background:#fff;color:var(--teal);border-radius:99px;padding:3px 14px;font-weight:800;font-size:14px;margin-bottom:10px}
.hero svg.sky{position:absolute;inset:auto 0 0 0;width:100%;height:120px}
.hero .sunb{position:absolute;left:28px;top:22px;width:70px;height:70px;border-radius:50%;background:var(--sun);box-shadow:0 0 0 12px #FFE58A66,0 0 0 26px #FFE58A33;animation:sunp 5s ease-in-out infinite}
@keyframes sunp{50%{transform:scale(1.07)}}
.unit-h{display:flex;align-items:center;gap:12px;margin:22px 4px 12px}
.unit-h b{font-size:clamp(20px,3vw,26px);font-weight:800}
.unit-h span{height:4px;flex:1;border-radius:4px;background:repeating-linear-gradient(90deg,var(--u) 0 14px,transparent 14px 22px);opacity:.5}
.unit-h i{font-style:normal;background:var(--u);color:#fff;border-radius:12px;padding:2px 12px;font-weight:800;font-size:15px}
.lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:16px}
.arch{position:relative;border:0;cursor:pointer;text-align:center;padding:18px 12px 14px;background:var(--card);
  border-radius:90px 90px 22px 22px;box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;gap:6px;transition:transform .15s;min-height:200px;
  border-top:8px solid var(--c)}
.arch:hover{transform:translateY(-4px)}
.arch:active{transform:translateY(2px)}
.arch .em{width:74px;height:74px;border-radius:50%;display:grid;place-items:center;font-size:40px;background:var(--cl)}
.arch .no{font-size:13px;font-weight:700;color:var(--muted)}
.arch .nm{font-size:18px;font-weight:800;line-height:1.25;color:var(--ink);text-wrap:balance}
.dots4{display:flex;gap:5px;margin-top:auto}
.dots4 i{width:12px;height:12px;border-radius:50%;background:var(--line)}
.dots4 i.on{background:var(--c)}
.tilawa-card{display:flex;align-items:center;gap:16px;width:100%;border:0;cursor:pointer;background:linear-gradient(90deg,#FFF1C7,#fff);border-radius:22px;padding:14px 18px;box-shadow:var(--shadow);text-align:right;margin-top:6px}
.tilawa-card .em{font-size:40px}
.tilawa-card b{font-size:20px;display:block}
.tilawa-card small{color:var(--muted);font-weight:600;font-size:14px}

/* ---------- lesson hub ---------- */
.hub-head{display:flex;align-items:center;gap:16px;background:var(--card);border-radius:28px;padding:18px 20px;box-shadow:var(--shadow);margin:4px 0 20px;border-inline-start:10px solid var(--c)}
.hub-head .em{font-size:52px;width:84px;height:84px;border-radius:50%;background:var(--cl);display:grid;place-items:center;flex-shrink:0}
.hub-head h2{margin:0;font-size:clamp(24px,4vw,36px);line-height:1.15}
.hub-head p{margin:4px 0 0;color:var(--muted);font-weight:600}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px}
.step{position:relative;border:0;cursor:pointer;background:var(--card);border-radius:26px;padding:18px 16px 16px;box-shadow:var(--shadow);text-align:right;display:flex;flex-direction:column;gap:8px;transition:transform .15s;overflow:hidden}
.step:hover{transform:translateY(-4px)}
.step .n{position:absolute;left:14px;top:12px;width:34px;height:34px;border-radius:50%;background:var(--sc2);color:var(--sc);font-weight:800;display:grid;place-items:center;font-size:18px}
.step .ic{font-size:44px;line-height:1}
.step .k{font-size:14px;font-weight:800;color:var(--sc)}
.step .t{font-size:21px;font-weight:800;line-height:1.2}
.step .d{font-size:14px;color:var(--muted);font-weight:600;line-height:1.5}
.step .st{font-size:18px;letter-spacing:2px;color:#E7B416;min-height:24px}
.step::after{content:"";position:absolute;inset:auto 0 0 0;height:7px;background:var(--sc)}

/* ---------- stage ---------- */
.instr{margin:0 16px 8px;background:#fff;border-radius:18px;padding:10px 16px;font-size:clamp(16px,2.3vw,21px);font-weight:700;box-shadow:0 3px 0 rgba(28,51,64,.08);display:flex;align-items:center;gap:10px;flex-shrink:0}
.instr::before{content:"💡";font-size:22px}
.stage-body{flex:1;position:relative;overflow:hidden;display:flex;flex-direction:column}
.pad{flex:1;overflow-y:auto;overflow-x:hidden;padding:6px 16px 24px}
.pad>*{flex-shrink:0}
.center{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:16px}
.center>:first-child{margin-top:auto}.center>:last-child{margin-bottom:auto}
[hidden]{display:none!important}
.hud{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;padding:0 16px 6px;flex-shrink:0}
.chip{background:#fff;border-radius:99px;padding:5px 14px;font-weight:800;font-size:16px;box-shadow:0 3px 0 rgba(28,51,64,.08);display:inline-flex;align-items:center;gap:6px}

.btn{border:0;cursor:pointer;border-radius:18px;padding:12px 22px;font-size:19px;font-weight:800;background:var(--teal);color:#fff;box-shadow:0 5px 0 var(--teal-d);transition:transform .1s;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--teal-d)}
.btn.alt{background:#fff;color:var(--ink);box-shadow:0 5px 0 #C9DCE3}
.btn.rose{background:var(--rose);box-shadow:0 5px 0 #A92A58}
.btn.sun{background:var(--sun);color:var(--ink);box-shadow:0 5px 0 #D59E0B}
.btn[disabled]{opacity:.45;pointer-events:none}
.opt{border:0;cursor:pointer;background:#fff;border-radius:18px;padding:14px 18px;font-size:clamp(17px,2.4vw,21px);font-weight:700;box-shadow:0 5px 0 #CFE0E6;transition:transform .1s;line-height:1.4}
.opt:active{transform:translateY(3px)}
.opt.ok{background:var(--good2);box-shadow:0 5px 0 var(--good);color:#0E5F32}
.opt.no{background:var(--bad2);box-shadow:0 5px 0 var(--bad)}
.opts{display:grid;gap:12px;width:min(640px,100%)}
.card{background:#fff;border-radius:var(--r);box-shadow:var(--shadow);padding:18px}
.shake{animation:shake .45s}
@keyframes shake{20%,60%{transform:translateX(-9px)}40%,80%{transform:translateX(9px)}}
.pop{animation:pop .45s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{0%{transform:scale(.6)}100%{transform:scale(1)}}
.bounce{animation:bnc 1.2s ease-in-out infinite}
@keyframes bnc{50%{transform:translateY(-8px)}}
.toast{position:absolute;left:50%;top:10px;transform:translate(-50%,-30px);opacity:0;z-index:40;background:#fff;border-radius:99px;padding:8px 20px;font-weight:800;font-size:19px;box-shadow:var(--shadow);transition:.3s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.good{background:var(--good2);color:#0E5F32}
.toast.bad{background:var(--bad2);color:#9B1C22}
.qtext{font-family:var(--quran);font-size:clamp(22px,3.4vw,32px);line-height:2}
.big{font-size:clamp(22px,3.6vw,34px);font-weight:800;text-align:center;line-height:1.35;text-wrap:balance}
.muted{color:var(--muted)}
.ghost{position:fixed;z-index:100;pointer-events:none;transform:translate(-50%,-50%) rotate(-3deg) scale(1.06);opacity:.95;filter:drop-shadow(0 10px 12px rgba(0,0,0,.2))}
.dragging{opacity:.3}
.dz-hover{outline:4px dashed var(--sun);outline-offset:3px}

/* ---------- slides ---------- */
.slides{flex:1;display:flex;flex-direction:column;min-height:0}
.slide-area{flex:1;min-height:0;position:relative;padding:4px 16px 8px}
.slide{position:absolute;inset:4px 16px 8px;overflow-y:auto;overflow-x:hidden;background:#fff;border-radius:30px;box-shadow:var(--shadow);padding:clamp(18px,3vw,34px);display:flex;flex-direction:column;gap:16px;animation:sIn .4s ease both}
.slide.back{animation-name:sInB}
@keyframes sIn{from{opacity:0;transform:translateX(-40px)}to{opacity:1;transform:none}}
@keyframes sInB{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:none}}
.slide h3{margin:0;font-size:clamp(22px,3.4vw,32px);color:var(--c);display:flex;align-items:center;gap:10px}
.slide h3 .tag{font-size:14px;background:var(--cl);color:var(--c);border-radius:99px;padding:3px 12px}
.slide p{margin:0;font-size:clamp(18px,2.6vw,24px);line-height:1.8;font-weight:600}
.snav{display:flex;align-items:center;justify-content:center;gap:12px;padding:8px 16px 12px;flex-shrink:0}
.sdots{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;max-width:60%}
.sdots i{width:11px;height:11px;border-radius:50%;background:#C9DCE3;cursor:pointer}
.sdots i.on{background:var(--c);transform:scale(1.35)}
.s-title{align-items:center;justify-content:center;text-align:center;background:linear-gradient(180deg,var(--cl) 0%,#fff 70%)}
.s-title .em{font-size:clamp(70px,14vw,130px);line-height:1}
.s-title .no{font-weight:800;color:var(--c);font-size:20px;background:#fff;border-radius:99px;padding:2px 16px;box-shadow:0 3px 0 rgba(0,0,0,.06)}
.s-title h2{margin:0;font-size:clamp(34px,7vw,64px);line-height:1.1;color:var(--ink)}
.s-title p{color:var(--muted)}
.chat{display:flex;flex-direction:column;gap:12px}
.bub{display:flex;gap:10px;align-items:flex-end;max-width:88%;opacity:0;animation:bubIn .45s ease forwards}
.bub .av{font-size:34px;width:52px;height:52px;border-radius:50%;background:var(--sky);display:grid;place-items:center;flex-shrink:0}
.bub .tx{background:var(--sky);border-radius:20px 20px 20px 6px;padding:10px 16px;font-size:clamp(17px,2.4vw,22px);font-weight:600;line-height:1.7}
.bub .tx b{display:block;font-size:14px;color:var(--c);font-weight:800}
.bub.l{align-self:flex-end;flex-direction:row-reverse}
.bub.l .tx{background:var(--sun2);border-radius:20px 20px 6px 20px}
.bub.l .av{background:var(--sun2)}
.bub.n .tx{background:#F3F6F8;font-style:normal}
@keyframes bubIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.mushaf{border-radius:22px;padding:18px clamp(12px,3vw,28px);background:#FFFDF5;border:3px double #D9B45A;box-shadow:inset 0 0 0 6px #FFF6DB}
.mushaf .sh{text-align:center;background:linear-gradient(90deg,#E9F6EE,#FFF3D2,#E9F6EE);border-radius:12px;padding:6px;font-family:var(--quran);font-size:26px;color:var(--teal-d);margin-bottom:6px}
.mushaf .bas{text-align:center;font-family:var(--quran);font-size:clamp(22px,3vw,28px);color:var(--teal-d)}
.mushaf .vs{font-family:var(--quran);font-size:clamp(24px,3.6vw,34px);line-height:2.2;text-align:justify;text-align-last:center}
.mushaf .v{cursor:pointer;border-radius:10px;padding:0 4px;transition:background .2s}
.mushaf .v.hl{background:#FFE58A}
.mushaf .vn{font-family:var(--quran);color:#B08A2E}
.grid-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px}
.fcard{border:0;cursor:pointer;background:var(--cl);border-radius:22px;padding:16px 10px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;box-shadow:0 5px 0 rgba(0,0,0,.07);transition:transform .15s}
.fcard:hover{transform:translateY(-3px)}
.fcard .e{font-size:48px;line-height:1}
.fcard b{font-size:19px;line-height:1.3}
.fcard small{font-size:16px;font-weight:600;color:var(--ink);display:none;line-height:1.5}
.fcard.open small{display:block;animation:bubIn .3s}
.fcard.open{background:#fff;box-shadow:inset 0 0 0 3px var(--c)}
.qa{display:flex;flex-direction:column;gap:10px}
.qa button{border:0;text-align:right;cursor:pointer;background:var(--sky);border-radius:18px;padding:12px 16px;font-size:clamp(17px,2.4vw,21px);font-weight:700;line-height:1.6}
.qa button .a{display:none;margin-top:6px;background:#fff;border-radius:12px;padding:6px 12px;color:var(--teal-d)}
.qa button.open .a{display:block;animation:bubIn .3s}
.qa button::before{content:"❓ "}
.hadith{border-radius:24px;background:linear-gradient(180deg,#FFF6DB,#fff);border:3px solid #F2D27A;padding:20px;text-align:center}
.hadith .q{font-size:clamp(22px,3.4vw,32px);font-weight:800;line-height:1.7;color:var(--teal-d)}
.hadith .src{font-size:14px;color:var(--muted);margin-top:8px;font-weight:600}
.ayah{border-radius:24px;background:linear-gradient(180deg,#E9F7EF,#fff);border:3px solid var(--mint);padding:20px;text-align:center}
.ayah .qtext{color:var(--teal-d)}
.poem{display:grid;grid-template-columns:1fr 1fr;gap:10px 26px;font-size:clamp(19px,2.8vw,27px);font-weight:700;text-align:center}
.poem div{background:var(--sky);border-radius:14px;padding:8px}
.value{align-items:center;justify-content:center;text-align:center;background:radial-gradient(circle at 50% 20%,var(--sun2),#fff 60%)}
.value .em{font-size:84px;line-height:1}
.value .big{color:var(--teal-d)}
.plist{display:flex;flex-direction:column;gap:10px;padding:0;margin:0;list-style:none}
.plist li{background:var(--mint2);border-radius:16px;padding:10px 16px;font-size:clamp(17px,2.5vw,22px);font-weight:700;display:flex;gap:10px;align-items:flex-start;line-height:1.6}
.plist li::before{content:"✔";color:var(--teal);font-weight:800}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.cmp>div{border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:8px}
.cmp h4{margin:0;font-size:22px;text-align:center}
.cmp p{font-size:18px!important;line-height:1.6!important}
@media (max-width:560px){.cmp{grid-template-columns:1fr}.poem{grid-template-columns:1fr;gap:6px}.poem div:nth-child(even){margin-bottom:8px}}

/* ---------- win ---------- */
.win{position:absolute;inset:0;z-index:60;background:rgba(227,243,250,.86);backdrop-filter:blur(4px);display:grid;place-items:center;padding:16px;animation:scrIn .3s}
.win .box{background:#fff;border-radius:34px;box-shadow:var(--shadow);padding:26px 22px;text-align:center;max-width:480px;width:100%;display:flex;flex-direction:column;gap:12px;align-items:center}
.win .stars{font-size:54px;letter-spacing:6px}
.win .stars span{display:inline-block;filter:grayscale(1) opacity(.3)}
.win .stars span.on{filter:none;animation:pop .5s cubic-bezier(.3,1.6,.5,1) both}
.win h2{margin:0;font-size:36px;color:var(--rose)}
.win p{margin:0;font-size:19px;font-weight:700;line-height:1.6}
.win .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:61}
.confetti i{position:absolute;top:-20px;width:10px;height:16px;border-radius:3px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition-duration:.01s!important}}
</style>

<script>
/* ================= CORE ================= */
const AR = n => String(n).replace(/\d/g, d => '٠١٢٣٤٥٦٧٨٩'[d]);
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const rand = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const wait = ms => new Promise(r => setTimeout(r, ms));
function el(html) { const t = document.createElement('template'); t.innerHTML = html.trim(); return t.content.firstElementChild; }
function els(html) { const t = document.createElement('template'); t.innerHTML = html.trim(); return [...t.content.children]; }
function flash(node, cls) { node.classList.remove(cls); void node.offsetWidth; node.classList.add(cls); }

/* ---------- sound (Web Audio, no files) ---------- */
const SND = {
  ctx: null, on: true, noiseBuf: null,
  init() {
    if (!this.ctx) { try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return; } }
    if (this.ctx.state === 'suspended') this.ctx.resume();
  },
  tone(f, d, type = 'sine', v = .18, at = 0, f2 = null) {
    const c = this.ctx, t = c.currentTime + at, o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t);
    if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(v, t + .015); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    o.connect(g).connect(c.destination); o.start(t); o.stop(t + d + .05);
  },
  noise(d, v = .2, at = 0, lp = 800) {
    const c = this.ctx;

      case 'ok': T(660, .12, 'triangle', .18); T(880, .12, 'triangle', .18, .09); T(1175, .2, 'triangle', .16, .18); break;
      case 'bad': T(220, .28, 'sawtooth', .09, 0, 140); T(180, .3, 'square', .05, .05, 110); break;
      case 'win': [523, 659, 784, 1047, 784, 1047, 1319].forEach((f, i) => T(f, .22, 'triangle', .17, i * .12)); T(262, .9, 'sine', .12, 0); break;

      case 'coin': T(988, .08, 'square', .09); T(1319, .25, 'square', .09, .08); break;
      case 'jump': T(300, .22, 'square', .08, 0, 720); break;
      case 'whoosh': this.noise(.35, .18, 0, 1800); break;
      case 'rumble': this.noise(.7, .35, 0, 160); T(55, .7, 'sawtooth', .08, 0, 40); break;
      case 'step': T(520 + Math.random() * 200, .08, 'triangle', .13); break;
      case 'drop': T(600, .18, 'sine', .15, 0, 180); break;
      case 'star': T(1200, .12, 'sine', .14); T(1600, .18, 'sine', .12, .08); break;
      case 'open': T(392, .1, 'triangle', .14); T(523, .1, 'triangle', .14, .07); T(784, .25, 'sine', .16, .14); this.noise(.2, .08, 0, 4000); break;
      case 'choo': T(330, .25, 'square', .08); T(262, .35, 'square', .08, .22); break;
      case 'tick': T(1400, .03, 'square', .05); break;
      case 'baa': T(420, .35, 'sawtooth', .06, 0, 360); T(430, .25, 'sawtooth', .05, .12, 380); break;

/* ---------- STAGE ---------- */
function goStage(id, kind) {
  const L = LESSONS.find(l => l.id === id);
  const M = STEP_META[kind];
  const s = el(`<div class="screen" style="${lessonVars(L)}"></div>`);
  const bar = el(`<div class="bar"></div>`);
  const back = el(`<button class="ibtn" aria-label="رجوع">➜</button>`); back.onclick = () => { SND.play('tap'); goLesson(id); };
  const title = kind === 'show' ? 'العرض التقديمي' : L[kind].name;
  bar.append(back, el(`<div class="ttl"><b>${title}</b><small>${M.k} · ${L.title}</small></div>`), sndBtn());
  s.appendChild(bar);
  const instr = el(`<div class="instr"></div>`); instr.hidden = true;
  s.appendChild(instr);
  const body = el(`<div class="stage-body"></div>`);
  s.appendChild(body);
  const toast = el(`<div class="toast"></div>`); s.appendChild(toast);
  mount(s);
  let misses = 0, finished = false, tt;
  const api = {
    L, root: body, screen: s,
    say(t) { instr.hidden = !t; instr.textContent = t || ''; },
    miss(msg) { misses++; SND.play('bad'); if (msg) api.toast(msg, 'bad'); },
    good(msg) { SND.play('ok'); if (msg) api.toast(msg, 'good'); },
    toast(t, cls = '') { toast.textContent = t; toast.className = 'toast show ' + cls; clearTimeout(tt); tt = setTimeout(() => toast.className = 'toast', 1500); },
    get misses() { return misses; },
    onCleanup(f) { CLEAN.push(f); },
    later(f, ms) { const t = setTimeout(f, ms); CLEAN.push(() => clearTimeout(t)); return t; },
    every(f, ms) { const t = setInterval(f, ms); CLEAN.push(() => clearInterval(t)); return t; },
    loop(f) { let on = true, last = performance.now(); const tick = now => { if (!on) return; const dt = Math.min(50, now - last) / 1000; last = now; f(dt, now); if (on) requestAnimationFrame(tick); }; requestAnimationFrame(tick); const stop = () => on = false; CLEAN.push(stop); return stop; },
    done(msg, stars) {
      if (finished) return; finished = true;
      if (stars == null) stars = misses <= 1 ? 3 : misses <= 3 ? 2 : 1;
      setDone(L.id, kind, stars);
      showWin(s, stars, msg, L, kind);
    },
    reset() { misses = 0; finished = false; }
  };
  if (kind === 'show') runSlides(api, L);
  else { const A = L[kind]; api.say(A.say || ''); ACT[A.type](api, A); }
}

/* ---------- drag helper ---------- */
/* makeDrag(node, {target:'.sel', onDrop(targetEl)->bool, onStart}) */
function makeDrag(node, o) {
  node.style.touchAction = 'none'; node.style.cursor = 'grab';
  node.addEventListener('pointerdown', e => {
    if (node.dataset.locked) return;
    e.preventDefault();
    SND.play('tap');
    const r = node.getBoundingClientRect();
    const g = node.cloneNode(true); g.classList.add('ghost'); g.style.width = r.width + 'px'; g.style.height = r.height + 'px';
    g.style.left = e.clientX + 'px'; g.style.top = e.clientY + 'px'; g.style.margin = 0;
    document.body.appendChild(g); node.classList.add('dragging');
    o.onStart && o.onStart();
    let over = null;
    const find = (x, y) => { g.style.display = 'none'; const t = document.elementFromPoint(x, y); g.style.display = ''; return t && t.closest(o.target); };
    const mv = ev => {
      g.style.left = ev.clientX + 'px'; g.style.top = ev.clientY + 'px';
      const t = find(ev.clientX, ev.clientY);
      if (t !== over) { over && over.classList.remove('dz-hover'); over = t; over && over.classList.add('dz-hover'); }
    };
    const up = ev => {
      window.removeEventListener('pointermove', mv); window.removeEventListener('pointerup', up); window.removeEventListener('pointercancel', up);
      over && over.classList.remove('dz-hover');
      const t = ev.type === 'pointercancel' ? null : find(ev.clientX, ev.clientY);
      g.remove(); node.classList.remove('dragging');
      if (t) o.onDrop(t, node); else o.onMiss && o.onMiss();
    };
    window.addEventListener('pointermove', mv); window.addEventListener('pointerup', up); window.addEventListener('pointercancel', up);
  });
}

function runSlides(api, L) {
  const S = L.slides; let i = 0, maxSeen = 0;
  const wrap = el(`<div class="slides"><div class="slide-area"></div><div class="snav"></div></div>`);
  const area = wrap.firstElementChild, nav = wrap.lastElementChild;
  const prev = el(`<button class="btn alt" aria-label="السابق">▶ السابق</button>`);
  const next = el(`<button class="btn" aria-label="التالي">التالي ◀</button>`);
  const dots = el(`<div class="sdots"></div>`);
  S.forEach((_, k) => { const dd = el(`<i></i>`); dd.onclick = () => go(k); dots.appendChild(dd); });
  nav.append(prev, dots, next);
  api.root.appendChild(wrap);
  function go(k, dir) {
    if (k < 0 || k >= S.length) return;
    const back = k < i; i = k; maxSeen = Math.max(maxSeen, i);
    area.innerHTML = '';
    const sl = renderSlide(S[i], L); if (back) sl.classList.add('back');
    area.appendChild(sl);
    SND.play('whoosh');
    [...dots.children].forEach((dd, j) => dd.classList.toggle('on', j === i));
    prev.disabled = i === 0;
    next.innerHTML = i === S.length - 1 ? 'أنهيتُ العرض ✔' : 'التالي ◀';
    next.className = i === S.length - 1 ? 'btn rose' : 'btn';
  }
  prev.onclick = () => go(i - 1);
  next.onclick = () => { if (i === S.length - 1) api.done('أنهيتَ العرض التقديمي للدرس. هيا إلى اللعبة!', 3); else go(i + 1); };
  const key = e => { if (e.key === 'ArrowLeft') next.click(); if (e.key === 'ArrowRight') prev.click(); };
  window.addEventListener('keydown', key); api.onCleanup(() => window.removeEventListener('keydown', key));
  let sx = null;
  area.addEventListener('pointerdown', e => { sx = e.clientX; });
  area.addEventListener('pointerup', e => { if (sx == null) return; const dx = e.clientX - sx; sx = null; if (Math.abs(dx) > 70) { if (dx > 0) next.click(); else prev.click(); } });
  go(0);
}

ACT.catcher = (api, A) => {
  const hud = el(`<div class="hud"><span class="chip">🤲 الأذكار: <b class="sc">٠</b> / ${AR(A.goal)}</span><span class="chip lv">❤️❤️❤️</span></div>`);

  api.root.append(hud, f);
  const bask = f.querySelector('.basket');
  let bx = 0, W = 0, H = 0, items = [], score = 0, lives = 3, spawnT = 0, running = false, speedK = 1;
  const measure = () => { W = f.clientWidth; H = f.clientHeight; };
  measure(); bx = W / 2;
  const ro = new ResizeObserver(measure); ro.observe(f); api.onCleanup(() => ro.disconnect());
  const setB = x => { bx = Math.max(34, Math.min(W - 34, x)); bask.style.transform = `translateX(${bx - 34}px)`; };
  setB(W / 2);
  f.addEventListener('pointermove', e => { const r = f.getBoundingClientRect(); setB(e.clientX - r.left); });
  f.addEventListener('pointerdown', e => { const r = f.getBoundingClientRect(); setB(e.clientX - r.left); });
  const key = e => { if (e.key === 'ArrowLeft') setB(bx - 40); if (e.key === 'ArrowRight') setB(bx + 40); };
  window.addEventListener('keydown', key); api.onCleanup(() => window.removeEventListener('keydown', key));
  const start = el(`<div class="overlay-start"><div class="center"><div style="font-size:70px">🧺</div><div class="big">اِلْتَقِطِ الأَذْكارَ الذَّهَبِيَّةَ<br>وَابْتَعِدْ عَنِ الغُيومِ الرَّمادِيَّةِ</div><button class="btn rose">ابدأ اللعب ▶</button></div></div>`);
  f.appendChild(start);
  start.querySelector('button').onclick = () => { SND.play('pop'); start.remove(); running = true; };
  function spawn() {
    const good = Math.random() < .68;
    const t = good ? pick(A.good) : pick(A.bad);
    const d = el(`<div class="it ${good ? 'g' : 'b'}">${good ? '⭐ ' : '☁️ '}${t}</div>`);
    f.appendChild(d);
    const w = d.offsetWidth;
    items.push({ d, good, x: rand(4, Math.max(8, W - w - 4)), y: -50, w, v: rand(90, 140) * speedK });
  }
  api.loop(dt => {
    if (!running) return;
    spawnT -= dt; if (spawnT <= 0) { spawn(); spawnT = rand(.8, 1.3) / speedK; }
    const by = H - 70;
    items = items.filter(it => {
      it.y += it.v * dt;
      it.d.style.transform = `translate(${it.x}px,${it.y}px)`;
      const cx = it.x + it.w / 2;
      if (it.y > by - 20 && it.y < by + 30 && Math.abs(cx - bx) < it.w / 2 + 26) {
        it.d.remove();
        if (it.good) { score++; SND.play('coin'); hud.querySelector('.sc').textContent = AR(score); speedK = 1 + score * .04; if (score >= A.goal) { running = false; api.done('ما أجملَ ذِكْرَ الله! مَنْ يُحِبُّ اللهَ يُكْثِرُ مِنْ ذِكْرِه.', lives === 3 ? 3 : lives === 2 ? 2 : 1); } }
        else { lives--; api.miss('ابتعد عن الغيوم!'); hud.querySelector('.lv').textContent = '❤️'.repeat(Math.max(0, lives)) + '🤍'.repeat(3 - Math.max(0, lives)); flash(f, 'shake'); if (lives <= 0) { lives = 3; score = 0; hud.querySelector('.sc').textContent = AR(0); hud.querySelector('.lv').textContent = '❤️❤️❤️'; api.toast('نبدأ من جديد 💪'); } }
        return false;
      }
      if (it.y > H + 10) { it.d.remove(); return false; }
      return true;
    });
  });
};

  const p = el(`<div class="pad center"></div>`); api.root.appendChild(p);
  const box = el(`<div class="scratch"><div class="under">${A.under}</div><canvas></canvas></div>`);
  const meter = el(`<div class="meter"><i></i></div>`);
  p.append(box, meter);
  const cv = box.querySelector('canvas'), ctx = cv.getContext('2d');
  let done = false;
  function paint() {
    const r = box.getBoundingClientRect(); cv.width = r.width; cv.height = r.height;
    const g = ctx.createLinearGradient(0, 0, cv.width, cv.height); g.addColorStop(0, '#E8C766'); g.addColorStop(.5, '#FFE58A'); g.addColorStop(1, '#D9A93A');
    ctx.fillStyle = g; ctx.fillRect(0, 0, cv.width, cv.height);
    ctx.fillStyle = '#B98A1E55';
    for (let i = 0; i < 60; i++) { ctx.beginPath(); ctx.arc(rand(0, cv.width), rand(0, cv.height), rand(2, 7), 0, 7); ctx.fill(); }
    ctx.fillStyle = '#7A5A10'; ctx.textAlign = 'center'; ctx.font = '800 30px "Baloo Bhaijaan 2", sans-serif';
    ctx.fillText('اِكْشِطْ هُنا بإصبعك 👆', cv.width / 2, cv.height / 2);

    ctx.globalCompositeOperation = 'destination-out'; ctx.beginPath(); ctx.arc(x, y, 30, 0, 7); ctx.fill(); ctx.globalCompositeOperation = 'source-over';

    const d = ctx.getImageData(0, 0, cv.width, cv.height).data; let clear = 0, tot = 0;
    for (let i = 3; i < d.length; i += 4 * 40) { tot++; if (d[i] === 0) clear++; }
    const pc = clear / tot; meter.firstChild.style.width = Math.min(100, pc / .55 * 100) + '%';
    if (pc > .55) { done = true; cv.style.opacity = 0; SND.play('magic'); api.later(ask, 1400); }
  }
  cv.addEventListener('pointerdown', e => { down = true; scr(e); });
  cv.addEventListener('pointermove', scr);
  window.addEventListener('pointerup', () => down = false);
  function ask() {
    meter.remove();
    const q = el(`<div class="center" style="width:100%"></div>`); p.appendChild(q);
    mcq(q, A.q, A.options, A.answer, () => api.done(A.end), api);
    q.scrollIntoView({ behavior: 'smooth', block: 'end' });
  }
};

/* ---------- L5 POST: spinning wheel ---------- */
ACT.wheel = (api, A) => {
  const p = el(`<div class="pad center" style="justify-content:flex-start"></div>`); api.root.appendChild(p);
  const ww = el(`<div class="wheel-wrap"><div class="ptr">🔻</div><canvas width="600" height="600"></canvas><div class="hubb">🐑</div></div>`);
  const spin = el(`<button class="btn rose">أَدِرِ العَجَلَةَ 🎡</button>`);
  const qa = el(`<div class="wq center"></div>`);
  p.append(ww, spin, qa);
  const cv = ww.querySelector('canvas'), ctx = cv.getContext('2d');
  const N = A.qs.length, seg = 360 / N, done = new Set();
  const cols = ['#0E7C6B', '#DD3F77', '#7B5CD6', '#EF8A1F', '#3BB0E0', '#23A55A', '#E3B23C', '#E0457B'];
  function draw() {
    ctx.clearRect(0, 0, 600, 600);
    for (let i = 0; i < N; i++) {
      const a0 = i * seg * Math.PI / 180, a1 = (i + 1) * seg * Math.PI / 180;
      ctx.beginPath(); ctx.moveTo(300, 300); ctx.arc(300, 300, 290, a0, a1); ctx.closePath();
      ctx.fillStyle = done.has(i) ? '#D5E6EC' : cols[i % cols.length]; ctx.fill();
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 6; ctx.stroke();
      const m = (a0 + a1) / 2; ctx.save(); ctx.translate(300 + Math.cos(m) * 200, 300 + Math.sin(m) * 200); ctx.rotate(m + Math.PI / 2);
      ctx.fillStyle = '#fff'; ctx.font = '800 56px "Baloo Bhaijaan 2", sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(done.has(i) ? '✔' : AR(i + 1), 0, 0); ctx.restore();
    }
  }
  draw();
  let rot = 0, spinning = false;
  spin.onclick = () => {
    if (spinning) return;
    const avail = [...Array(N).keys()].filter(i => !done.has(i)); if (!avail.length) return;
    const t = pick(avail); spinning = true; spin.disabled = true; qa.innerHTML = '';
    const c = t * seg + seg / 2;
    rot = rot + ((270 - c - rot) % 360 + 360) % 360 + 360 * 4;
    cv.style.transform = `rotate(${rot}deg)`;
    let n = 0; const tk = api.every(() => { if (n++ < 22) SND.play('tick'); }, 130);
    api.later(() => {
      clearInterval(tk); spinning = false; SND.play('pop');
      const [q, a, ...o] = A.qs[t];
      mcq(qa, `<span style="color:var(--rose)">سؤال ${AR(t + 1)}:</span> ${q}`, [a, ...o], a, () => {
        done.add(t); draw(); qa.innerHTML = '';
        if (done.size === N) api.done(A.end); else { spin.disabled = false; api.toast(`بقي ${AR(N - done.size)} أسئلة`); }
      }, api);
      qa.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }, 3300);
  };
};

/* ---------- L5 GAME: faithful shepherd (herding) ---------- */
ACT.herd = (api, A) => {
  const hud = el(`<div class="hud"><span class="chip">🐑 في الحظيرة: <b class="sc">٠</b> / ${AR(A.good.length)}</span><span class="chip">⏱ <b class="tm">٠</b></span></div>`);
  const f = el(`<div class="field"><div class="pen">🏠 الحَظيرة</div></div>`);
  api.root.append(hud, f);
  const pen = f.querySelector('.pen');
  let W = f.clientWidth, H = f.clientHeight, inPen = 0, t0 = performance.now(), running = false;
  const ro = new ResizeObserver(() => { W = f.clientWidth; H = f.clientHeight; }); ro.observe(f); api.onCleanup(() => ro.disconnect());
  const sprites = [];
  const mk = (word, good) => {
    const d = el(`<div class="sprite ${good ? '' : 'wolf'}"><span class="e">${good ? '🐑' : '🐺'}</span><span class="w">${word}</span></div>`);
    f.appendChild(d);
    const s = { d, good, x: rand(W * .35, W - 110), y: rand(10, H - 80), vx: rand(-40, 40), vy: rand(-30, 30), drag: false, inside: false };
    sprites.push(s);
    d.addEventListener('pointerdown', e => {
      if (s.inside || !running) return; e.preventDefault(); s.drag = true; d.setPointerCapture(e.pointerId); SND.play(good ? 'baa' : 'tap'); d.style.zIndex = 5;
      const r = f.getBoundingClientRect();
      const mv = ev => { s.x = ev.clientX - r.left - d.offsetWidth / 2; s.y = ev.clientY - r.top - 28; };
      const up = ev => {
        d.removeEventListener('pointermove', mv); d.removeEventListener('pointerup', up); d.removeEventListener('pointercancel', up); s.drag = false; d.style.zIndex = '';
        const pr = pen.getBoundingClientRect(), cx = ev.clientX, cy = ev.clientY;
        if (cx > pr.left && cx < pr.right && cy > pr.top && cy < pr.bottom) {
          if (good) {
            s.inside = true; d.classList.add('in'); inPen++; SND.play('ok'); hud.querySelector('.sc').textContent = AR(inPen);
            s.x = pen.offsetLeft + 8 + ((inPen - 1) % 2) * (pen.offsetWidth / 2 - 4); s.y = 34 + Math.floor((inPen - 1) / 2) * 70;
            if (inPen === A.good.length) { running = false; api.later(() => api.done(A.end), 700); }
          } else { api.miss('الذئب لا يدخل الحظيرة! 🐺'); s.x = W - 120; s.vx = 60; }
        }
      };
      d.addEventListener('pointermove', mv); d.addEventListener('pointerup', up); d.addEventListener('pointercancel', up);
    });
  };
  A.good.forEach(w => mk(w, true)); A.bad.forEach(w => mk(w, false));
  const start = el(`<div class="overlay-start"><div class="center"><div style="font-size:70px">🐑🧑‍🌾</div><div class="big">أنتَ الرّاعي الأمين!<br>اسحب الخِراف ذات الصفات التي تعلّمها النبي ﷺ من الرعي إلى الحظيرة، واحذر الذئاب 🐺</div><button class="btn rose">ابدأ ▶</button></div></div>`);
  f.appendChild(start); start.querySelector('button').onclick = () => { start.remove(); running = true; t0 = performance.now(); SND.play('baa'); };
  api.loop(dt => {
    if (running) { const n = hud.querySelector('.tm'); n.textContent = AR(Math.floor((performance.now() - t0) / 1000)); }
    const penR = pen.offsetLeft + pen.offsetWidth;
    sprites.forEach(s => {
      if (!s.inside && !s.drag && running) {
        if (Math.random() < .01) { s.vx = rand(-50, 50); s.vy = rand(-40, 40); }
        s.x += s.vx * dt; s.y += s.vy * dt;
        if (s.x < penR + 6) { s.x = penR + 6; s.vx = Math.abs(s.vx); }
        if (s.x > W - s.d.offsetWidth - 4) { s.x = W - s.d.offsetWidth - 4; s.vx = -Math.abs(s.vx); }
        if (s.y < 4) { s.y = 4; s.vy = Math.abs(s.vy); }
        if (s.y > H - 76) { s.y = H - 76; s.vy = -Math.abs(s.vy); }
      }
      s.d.style.transform = `translate(${s.x}px,${s.y}px)`;
    });
  });
};

/* ---------- L6 POST: maze ---------- */
ACT.maze = (api, A) => {
  const p = el(`<div class="pad center"></div>`); api.root.appendChild(p);
  const G = A.grid, R = G.length, C = G[0].length;
  const mz = el(`<div class="maze" style="grid-template-columns:repeat(${C},minmax(0,1fr))"></div>`);
  let sr, sc; const cells = [];
  G.forEach((row, r) => [...row].forEach((ch, c) => {
    const d = el(`<div class="c ${ch === '#' ? 'w' : 'p'}"></div>`);
    if (ch === 'S') { sr = r; sc = c; }
    if (A.icons[ch]) d.textContent = A.icons[ch];
    d.dataset.r = r; d.dataset.c = c; mz.appendChild(d); cells.push(d);
  }));
  const cell = (r, c) => cells[r * C + c];
  let pr = sr, pc = sc;
  const legend = el(`<div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center">${Object.entries(A.legend).map(([k, v]) => `<span class="chip">${A.icons[k]} ${v}</span>`).join('')}</div>`);
  const pad = el(`<div class="pad4"><span></span><button class="btn alt" data-d="u">⬆️</button><span></span><button class="btn alt" data-d="l">⬅️</button><span class="chip" style="justify-content:center">🧒</span><button class="btn alt" data-d="r">➡️</button><span></span><button class="btn alt" data-d="d">⬇️</button><span></span></div>`);
  p.append(legend, mz, pad);
  const player = el(`<span class="pl">🧒<i>💵</i></span>`);
  function place() { cell(pr, pc).appendChild(player); cell(pr, pc).classList.add('trail'); }
  place();
  let busy = false;
  function move(dr, dc) {
    if (busy) return;
    const nr = pr + dr, nc = pc + dc;
    if (nr < 0 || nc < 0 || nr >= R || nc >= C) return;
    const ch = G[nr][nc];
    if (ch === '#') { SND.play('tap'); flash(mz, 'shake'); return; }
    pr = nr; pc = nc; SND.play('step'); place();
    if (ch === 'O') { busy = true; api.good('أعدتَ المال إلى صاحبته! 🤲'); api.later(() => api.done(A.end), 1000); }
    else if (A.traps[ch]) {
      busy = true; api.miss(A.traps[ch]);
      api.later(() => { cells.forEach(x => x.classList.remove('trail')); pr = sr; pc = sc; place(); busy = false; }, 1400);
    }
  }
  const D = { u: [-1, 0], d: [1, 0], l: [0, -1], r: [0, 1] };
  pad.querySelectorAll('[data-d]').forEach(b => b.onclick = () => move(...D[b.dataset.d]));
  const key = e => { const m = { ArrowUp: 'u', ArrowDown: 'd', ArrowLeft: 'l', ArrowRight: 'r' }[e.key]; if (m) { e.preventDefault(); move(...D[m]); } };
  window.addEventListener('keydown', key); api.onCleanup(() => window.removeEventListener('keydown', key));
  mz.addEventListener('click', e => { const c = e.target.closest('.c'); if (!c) return; const r = +c.dataset.r, cc = +c.dataset.c; if (Math.abs(r - pr) + Math.abs(cc - pc) === 1) move(r - pr, cc - pc); });
  let sx, sy; mz.addEventListener('pointerdown', e => { sx = e.clientX; sy = e.clientY; });
  mz.addEventListener('pointerup', e => { if (sx == null) return; const dx = e.clientX - sx, dy = e.clientY - sy; sx = null; if (Math.max(Math.abs(dx), Math.abs(dy)) < 30) return; if (Math.abs(dx) > Math.abs(dy)) move(0, dx > 0 ? 1 : -1); else move(dy > 0 ? 1 : -1, 0); });
};

  sc.querySelectorAll('.pan').forEach(pn => pn.onclick = () => put(pn));

/* ---------- L7 PRE: hold to shake ---------- */
ACT.quake = (api, A) => {
  const p = el(`<div class="pad center"></div>`); api.root.appendChild(p);
  const q = el(`<div class="quake"><div class="msg">اضغط مطوّلًا على الصورة ✋</div><div class="town"><span>🏠</span><span>🌴</span><span>🏢</span><span>🏡</span></div><div class="ground"><div class="crack"></div></div></div>`);
  const m = el(`<div class="meter"><i></i></div>`);
  p.append(q, m);
  let hold = 0, holding = false, done = false, rt = 0;
  const start = e => { if (done) return; e.preventDefault(); holding = true; q.classList.add('shk'); };
  const stop = () => { holding = false; q.classList.remove('shk'); };
  q.addEventListener('pointerdown', start); window.addEventListener('pointerup', stop); q.addEventListener('pointerleave', stop);
  api.onCleanup(() => window.removeEventListener('pointerup', stop));
  api.loop(dt => {
    if (done) return;
    if (holding) { hold += dt; rt -= dt; if (rt <= 0) { SND.play('rumble'); rt = .6; } }
    m.firstChild.style.width = Math.min(100, hold / 2.2 * 100) + '%';
    if (hold >= 2.2) {
      done = true; stop(); q.querySelector('.crack').style.height = '62px';
      q.querySelector('.msg').innerHTML = '<span style="font-family:var(--quran);font-size:30px;color:var(--rose)">﴿إِذَا زُلْزِلَتِ الْأَرْضُ زِلْزَالَهَا﴾</span>';
      q.querySelectorAll('.town span').forEach((s, i) => s.style.transform = `rotate(${[-12, 8, -6, 10][i]}deg) translateY(${[6, 2, 8, 4][i]}px)`);
      api.later(ask, 1300);
    }
  });
  function ask() {
    m.remove();
    const c = el(`<div class="center" style="width:100%"></div>`); p.appendChild(c);
    let step = 0;
    const qs = A.qs;
    const nx = () => { if (step >= qs.length) return api.done(A.end); const [qq, a, ...o] = qs[step++]; mcq(c, qq, [a, ...o], a, nx, api); c.scrollIntoView({ behavior: 'smooth', block: 'end' }); };
    nx();
  }
};

/* ---------- L7 POST: paint with same color ---------- */
ACT.paint = (api, A) => {
  const p = el(`<div class="pad center"></div>`); api.root.appendChild(p);
  const cols = ['#23A55A', '#EF8A1F', '#9B5DE5', '#3BB0E0'];
  const light = ['#D8F5E3', '#FDE6CC', '#EBDDFB', '#D7F0FB'];
  let r = 0;
  function round() {
    const R = A.rounds[r]; api.say(R.say); p.innerHTML = '';
    p.appendChild(el(`<div class="chip">${R.title}</div>`));
    const w = el(`<div class="paint-wrap"><div class="pcol a"></div><div class="pcol b"></div></div>`);
    let brush = null, left = R.pairs.length;
    R.pairs.forEach(([a], i) => {
      const b = el(`<button class="pword" style="background:${cols[i]}">🖌️ ${a}</button>`);
      b.onclick = () => { if (b.classList.contains('used')) return; SND.play('tap'); w.querySelectorAll('.pword').forEach(x => x.classList.remove('sel')); b.classList.add('sel'); brush = i; };
      w.querySelector('.a').appendChild(b);
    });
    shuffle(R.pairs.map(([, m], i) => [m, i])).forEach(([m, i]) => {
      const b = el(`<button class="pmean">${m}</button>`);
      b.onclick = () => {
        if (b.dataset.done) return;
        if (brush == null) { api.toast('اختر لونًا من العمود الأول أولًا 🖌️'); return; }
        if (brush === i) {
          b.dataset.done = 1; b.style.background = light[i]; b.style.boxShadow = `inset 0 0 0 4px ${cols[i]}`; SND.play('magic');
          const src = w.querySelectorAll('.pword')[i]; src.classList.add('used'); src.classList.remove('sel'); brush = null;
          if (--left === 0) api.later(() => { r++; r < A.rounds.length ? round() : api.done(A.end); }, 1000);
        } else { b.style.background = light[brush]; api.miss('ليس هذا معناها'); flash(b, 'shake'); api.later(() => { if (!b.dataset.done) b.style.background = '#fff'; }, 500); }
      };
      w.querySelector('.b').appendChild(b);
    });
    p.appendChild(w);
  }
  round();
};

/* ---------- L7 GAME: whack the right word ---------- */
ACT.whack = (api, A) => {
  const p = el(`<div class="pad center" style="justify-content:flex-start"></div>`); api.root.appendChild(p);
  const cnt = el(`<div class="chip"></div>`);
  const vb = el(`<div class="vbox"><div class="qtext"></div></div>`);
  const holes = el(`<div class="moles"></div>`);
  p.append(cnt, vb, holes, el(`<div class="muted" style="font-weight:700">اضغط على الكلمة التي تُكمل الآية عندما تخرج من الحفرة 🔨</div>`));
  const H = []; for (let i = 0; i < 6; i++) { const h = el(`<div class="hole"><button class="mole"></button></div>`); holes.appendChild(h); H.push(h.firstChild); }
  let k = 0, busy = false;
  const pool = [...new Set(A.verses.map(v => v[1]))];
  function show() { const [pre, ans, post] = A.verses[k]; cnt.textContent = `الآية ${AR(k + 1)} من ${AR(A.verses.length)}`; vb.firstChild.innerHTML = `${pre} <span class="blank">؟</span> ${post || ''}`; }
  show();
  let timer = 0;
  api.loop(dt => {
    timer -= dt;
    if (timer > 0 || busy || k >= A.verses.length) return;
    timer = .75;
    const free = H.filter(m => !m.classList.contains('up'));
    if (!free.length) return;
    const m = pick(free), ans = A.verses[k][1];
    const showing = H.filter(x => x.classList.contains('up')).map(x => x.dataset.w);
    const word = !showing.includes(ans) && Math.random() < .45 ? ans : pick(pool.filter(w => w !== ans && !showing.includes(w)));
    if (!word) return;
    m.dataset.w = word; m.textContent = word; m.className = 'mole up'; SND.play('pop');
    const id = Math.random(); m.dataset.id = id;
    api.later(() => { if (m.dataset.id == id) m.classList.remove('up'); }, 1700);
  });
  H.forEach(m => m.onclick = () => {
    if (!m.classList.contains('up') || busy) return;
    if (m.dataset.w === A.verses[k][1]) {
      busy = true; m.classList.add('hit'); SND.play('ok');
      const [pre, ans, post] = A.verses[k]; vb.firstChild.innerHTML = `${pre} <span style="color:var(--teal)">${ans}</span> ${post || ''}`;
      api.later(() => { H.forEach(x => x.className = 'mole'); k++; busy = false; if (k < A.verses.length) show(); else api.done(A.end); }, 1300);
    } else { m.classList.add('wrong'); api.miss(); api.later(() => m.classList.remove('up'), 250); }
  });
};

ACT.abpick = (api, A) => {
  const p = el(`<div class="pad center"></div>`); api.root.appendChild(p);
  let k = 0; const deck = shuffle(A.pairs);
  function show() {
    const [q, good, bad] = deck[k]; p.innerHTML = '';

    const ab = el(`<div class="ab"></div>`);
    shuffle([[good, true], [bad, false]]).forEach(([[e, t], ok]) => {
      const c = el(`<button class="abc"><span class="e">${e}</span><b>${t}</b></button>`);

        else { c.classList.add('no'); flash(c, 'shake'); api.miss('هذه ليست صورة التعاون'); }
      };
      ab.appendChild(c);
    });

/* ---------- L8 GAME: brick stacker (the building) ---------- */
ACT.stacker = (api, A) => {
  const hud = el(`<div class="hud"><span class="chip">🧱 <b class="sc">٠</b> / ${AR(A.words.length)}</span></div>`);
  const f = el(`<div class="stk"></div>`);
  const tip = el(`<div class="muted" style="text-align:center;font-weight:700;padding:0 16px 8px">اضغط في أي مكان لإسقاط الطوبة فوق الجدار تمامًا</div>`);
  api.root.append(hud, f, tip);
  let W = f.clientWidth, H = f.clientHeight;
  const ro = new ResizeObserver(() => { W = f.clientWidth; H = f.clientHeight; }); ro.observe(f); api.onCleanup(() => ro.disconnect());
  const BH = 46; let placed = 0, cur = null, dir = 1, speed = 160, x = 0, state = 'move';
  const bw = () => Math.min(260, W * .5);
  function spawn() {
    if (placed >= A.words.length) return;
    cur = el(`<div class="brick">${A.words[placed]}</div>`); cur.style.width = bw() + 'px'; f.appendChild(cur);
    x = dir > 0 ? 0 : W - bw(); state = 'move';
    cur.style.transform = `translate(${x}px,14px)`;
  }
  const topY = () => H - 10 - (placed + 1) * BH;
  spawn();
  api.loop(dt => {
    if (!cur || state !== 'move') return;
    x += dir * speed * dt;
    if (x < 0) { x = 0; dir = 1; } if (x > W - bw()) { x = W - bw(); dir = -1; }
    cur.style.transform = `translate(${x}px,14px)`;
  });
  f.addEventListener('pointerdown', () => {
    if (!cur || state !== 'move') return;
    state = 'drop'; const target = (W - bw()) / 2, off = Math.abs(x - target), ty = topY();
    cur.style.transition = 'transform .35s ease-in'; cur.style.transform = `translate(${x}px,${ty}px)`;
    const b = cur;
    api.later(() => {
      if (off < bw() * .3) {
        b.style.transition = 'transform .15s'; b.style.transform = `translate(${target}px,${ty}px)`; SND.play('drop');
        placed++; hud.querySelector('.sc').textContent = AR(placed); speed += 22;
        if (placed === A.words.length) { api.later(() => { f.appendChild(el(`<div class="big pop" style="position:absolute;top:10px;left:0;right:0;color:var(--teal-d)">﴿كالبُنيان يشدُّ بعضُه بعضًا﴾ 🧱</div>`)); SND.play('win'); }, 300); api.later(() => api.done(A.end), 2000); }
        else api.later(spawn, 300);
      } else {
        api.miss('سقطت! حاول أن تجعلها فوق الجدار تمامًا');
        b.classList.add('fall'); b.style.transform = `translate(${x + (x > target ? 120 : -120)}px,${H + 60}px) rotate(${x > target ? 50 : -50}deg)`;
        api.later(() => { b.remove(); spawn(); }, 900);
      }
    }, 380);
  });
};

ACT.cipher = (api, A) => {
  const p = el(`<div class="pad center"></div>`); api.root.appendChild(p);
  let r = 0;
  function round() {
    const R = A.rounds[r]; p.innerHTML = '';
    p.appendChild(el(`<div class="chip">الرسالة ${AR(r + 1)} من ${AR(A.rounds.length)}</div>`));
    p.appendChild(el(`<div class="card" style="display:flex;flex-direction:column;gap:8px;align-items:center"><b>🔑 مفتاح الشيفرة</b><div class="keyrow">${Object.entries(R.key).map(([l, s]) => `<span>${s} = ${l}</span>`).join('')}</div></div>`));
    const code = el(`<div class="code"></div>`); const slots = [];
    R.words.forEach(w => { const cw = el(`<div class="cword"></div>`); [...w].forEach(ch => { const s = el(`<div class="cslot"><span class="sym">${R.key[ch]}</span><span class="ans"></span></div>`); s.dataset.ch = ch; slots.push(s); cw.appendChild(s); }); code.appendChild(cw); });
    p.appendChild(code);
    const pad = el(`<div class="kpad"></div>`);
    shuffle(Object.keys(R.key)).forEach(l => { const b = el(`<button class="btn alt">${l}</button>`); b.onclick = () => type(l, b); pad.appendChild(b); });
    p.appendChild(pad);
    let i = 0; slots[0].classList.add('cur');
    function type(l, b) {
      if (i >= slots.length) return;
      if (slots[i].dataset.ch === l) {
        slots[i].classList.remove('cur'); slots[i].classList.add('ok'); slots[i].querySelector('.ans').textContent = l; SND.play('pop'); i++;
        if (i < slots.length) slots[i].classList.add('cur');
        else { SND.play('ok'); pad.remove(); p.appendChild(el(`<div class="big pop" style="color:var(--rose);font-size:clamp(30px,6vw,46px)">${R.reveal}</div>`)); const n = el(`<button class="btn">${r < A.rounds.length - 1 ? 'الرسالة التالية ◀' : 'أنهيتُ ✔'}</button>`); n.onclick = () => { SND.play('tap'); r++; r < A.rounds.length ? round() : api.done(A.end); }; p.appendChild(n); }
      } else { api.miss(); flash(b, 'shake'); }
    }
  }
  round();
};

/* ---------- L9 POST: memory cards ---------- */
ACT.memory = (api, A) => {
  const p = el(`<div class="pad center"></div>`); api.root.appendChild(p);
  const said = el(`<div class="big" style="font-size:clamp(20px,3vw,26px)">أُحِبُّ رَسولي مُحَمَّدًا ﷺ لِأَنَّهُ عَلَّمَني… <span class="got" style="color:var(--rose)"></span></div>`);
  const g = el(`<div class="mem"></div>`);
  p.append(said, g);
  const cards = shuffle(A.pairs.flatMap(([w, e], i) => [[w, i, false], [e, i, true]]));
  let open = [], matched = 0, lock = false;
  cards.forEach(([t, i, isE]) => {
    const c = el(`<button class="mc"><span class="in"><span class="bk">🌟</span><span class="fr ${isE ? 'e' : ''}">${t}</span></span></button>`);
    c.dataset.i = i;
    c.onclick = () => {
      if (lock || c.classList.contains('f')) return;
      c.classList.add('f'); SND.play('flip'); open.push(c);
      if (open.length === 2) {
        lock = true;
        const [a, b] = open;
        if (a.dataset.i === b.dataset.i) {
          api.later(() => { a.classList.add('m'); b.classList.add('m'); SND.play('ok'); said.querySelector('.got').textContent = A.pairs[+a.dataset.i][0]; open = []; lock = false; if (++matched === A.pairs.length) api.later(() => api.done(A.end), 900); }, 400);

          api.later(() => { a.classList.remove('f'); b.classList.remove('f'); open = []; lock = false; }, 900);

        }
      }
    };
    g.appendChild(c);
  });
  let this_miss = 0;
};

ACT.board = (api, A) => {
  const p = el(`<div class="pad center" style="justify-content:flex-start"></div>`); api.root.appendChild(p);
  const N = 25;
  const bd = el(`<div class="board"></div>`);

  const cellOf = n => { const i = n - 1, row = Math.floor(i / 5), col = row % 2 === 0 ? i % 5 : 4 - i % 5; return { row, col }; };
  const sqs = {};
  for (let r = 4; r >= 0; r--) for (let c = 0; c < 5; c++) {
    const n = (r % 2 === 0) ? r * 5 + c + 1 : r * 5 + (4 - c) + 1;
    const L = A.ladders[n], S = A.snakes[n], Q = A.qsq.includes(n);
    const bg = n === N ? 'var(--sun)' : L ? 'var(--good2)' : S ? 'var(--bad2)' : Q ? 'var(--violet2)' : (r + c) % 2 ? '#fff' : 'var(--sky)';
    const d = el(`<div class="sq" style="background:${bg}"><span class="nn">${AR(n)}</span><span class="ic">${n === N ? '🏆' : n === 1 ? '🚩' : L ? '🪜' : S ? '🐍' : Q ? '❓' : ''}</span>${L ? `<span>←${AR(L[0])}</span>` : S ? `<span>←${AR(S[0])}</span>` : ''}</div>`);
    sqs[n] = d; bd.appendChild(d);
  }
  const ctrl = el(`<div style="display:flex;gap:14px;align-items:center;justify-content:center;flex-wrap:wrap"><div class="die">🎲</div><button class="btn rose">ارمِ النرد 🎲</button></div>`);
  const evt = el(`<div class="evt card">وصِّلِ الطفلَ إلى الكأس 🏆 — السلالم 🪜 تصرّفاتُ صفحٍ ترفعك، والثعابين 🐍 تصرّفاتٌ خاطئة تُنزلك</div>`);
  const qbox = el(`<div class="center" style="width:100%"></div>`);
  p.append(bd, ctrl, evt, qbox);
  const tok = el(`<span class="tok">🧒</span>`);
  let pos = 1, busy = false, rq = 0, qs = shuffle(A.questions);
  const put = () => { sqs[pos].appendChild(tok); flash(tok, 'pop'); };
  put();
  const die = ctrl.querySelector('.die'), rb = ctrl.querySelector('button');
  rb.onclick = async () => {
    if (busy) return; busy = true; rb.disabled = true; qbox.innerHTML = '';
    SND.play('dice'); die.classList.remove('roll'); void die.offsetWidth; die.classList.add('roll');
    const v = 1 + Math.floor(Math.random() * 6);
    await wait(600); die.textContent = AR(v);
    for (let s = 0; s < v && pos < N; s++) { pos++; put(); SND.play('step'); await wait(260); }
    await land();
  };
  async function land() {
    if (pos >= N) { evt.innerHTML = '🏆 وصلتَ! الصفحُ الجميلُ يرفعُ صاحبَه'; return api.later(() => api.done(A.end), 800); }

    else if (A.snakes[pos]) { const [to, t] = A.snakes[pos]; evt.style.background = 'var(--bad2)'; evt.innerHTML = `🐍 ${t} — انزل إلى ${AR(to)}`; SND.play('bad'); await wait(1400); pos = to; put(); }
    else if (A.qsq.includes(pos)) {
      evt.style.background = 'var(--violet2)'; evt.innerHTML = '❓ سؤال! أجب صحيحًا لتتقدّم خطوتين';
      const [q, a, ...o] = qs[rq++ % qs.length];
      qbox.innerHTML = ''; const opts = el(`<div class="opts"></div>`); qbox.append(el(`<div class="big" style="font-size:22px">${q}</div>`), opts);
      await new Promise(res => shuffle([a, ...o]).forEach(t => { const b = el(`<button class="opt">${t}</button>`); b.onclick = () => { if (opts.dataset.d) return; opts.dataset.d = 1; if (t === a) { b.classList.add('ok'); api.good('صحيح! تقدّم خطوتين'); setTimeout(async () => { pos = Math.min(N, pos + 2); put(); res(); }, 900); } else { b.classList.add('no'); api.miss('الإجابة: ' + a); setTimeout(res, 1500); } }; opts.appendChild(b); }));
      qbox.innerHTML = '';
      if (pos >= N) return land();
    } else { evt.style.background = '#fff'; evt.textContent = 'ارمِ النرد مرة أخرى 🎲'; }
    busy = false; rb.disabled = false;
  }
};

if(l.length>s.idx){l[s.idx].scrollIntoView({block:"center"});l[s.idx].click();setTimeout(function(){run(i+1)},700)}else if(t++<48)setTimeout(w,250)})()}
function go(){setTimeout(function(){run(0)},900)}if(document.readyState==="complete")go();else addEventListener("load",go)})();</script>
