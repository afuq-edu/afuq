<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#bfe7ff">
<title>عالم الأرقام — رياضيات الصف الثاني</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#243447;--mut:#687a92;--line:#e3ecf6;--ok:#1fb45a;--bad:#ef4444;--gold:#ffb703;--u:#1e88e5;--ul:#e3f2fd;--ud:#1565c0}
.u1a{--u:#1e88e5;--ul:#e3f2fd;--ud:#1565c0}
.u1b{--u:#e8a200;--ul:#fff3d6;--ud:#b77f00}
.u1c{--u:#2e9e4f;--ul:#e3f6e8;--ud:#207a3b}
.u2a{--u:#e8590c;--ul:#ffe9dc;--ud:#bf4508}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font-family:'Baloo Bhaijaan 2',Tahoma,'Segoe UI',sans-serif;color:var(--ink);background:linear-gradient(180deg,#bfe7ff 0%,#e2f5ff 42%,#fffaf0 100%);background-attachment:fixed;min-height:100vh;overflow-x:hidden;-webkit-user-select:none;user-select:none;touch-action:manipulation}
button{font-family:inherit;cursor:pointer;color:inherit}
svg text{font-family:'Baloo Bhaijaan 2',Tahoma,sans-serif}
#sky{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.sun{position:absolute;top:-70px;left:-70px;width:230px;height:230px;border-radius:50%;background:radial-gradient(circle,#fff7b8 0,#ffd54a 50%,rgba(255,213,74,0) 70%);animation:sunp 6s ease-in-out infinite}
@keyframes sunp{50%{transform:scale(1.06)}}
.cloud{position:absolute;background:#fff;border-radius:60px;opacity:.9;height:38px;width:120px;animation:drift linear infinite}
.cloud::before,.cloud::after{content:'';position:absolute;background:#fff;border-radius:50%}
.cloud::before{width:60px;height:60px;top:-28px;right:18px}.cloud::after{width:44px;height:44px;top:-18px;left:16px}
.c1{top:14%;animation-duration:80s;animation-delay:-10s}.c2{top:34%;animation-duration:110s;animation-delay:-60s;transform:scale(.7)}.c3{top:7%;animation-duration:130s;animation-delay:-95s;transform:scale(.85)}
@keyframes drift{from{right:-170px}to{right:112%}}
.hills{position:absolute;bottom:-40px;left:-5%;width:110%;height:120px;background:radial-gradient(ellipse at 20% 100%,#b7e4a6 0 45%,transparent 46%),radial-gradient(ellipse at 75% 100%,#c9eeb6 0 50%,transparent 51%);opacity:.7}
#app{position:relative;z-index:1;max-width:1180px;margin:0 auto;padding:12px 12px 40px}
/* ---------- home ---------- */
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:space-between;background:rgba(255,255,255,.9);border-radius:26px;padding:10px 14px;box-shadow:0 6px 20px rgba(30,80,140,.12)}
.logo{display:flex;align-items:center;gap:10px}
.logo .mark{width:58px;height:58px;border-radius:18px;background:linear-gradient(135deg,#ffcf3f,#ff8a3d);display:grid;place-items:center;font-size:22px;box-shadow:0 4px 0 #e0692a;color:#fff;font-weight:800;line-height:1}
.logo h1{margin:0;font-size:clamp(24px,4vw,36px);line-height:1.1;background:linear-gradient(90deg,#e8590c,#f59f00,#1e88e5);-webkit-background-clip:text;background-clip:text;color:transparent}
.logo small{color:var(--mut);font-size:14px;font-weight:600}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ibtn{width:48px;height:48px;border-radius:15px;border:0;background:#fff;box-shadow:0 3px 0 #d3e1ef;font-size:22px;display:grid;place-items:center;flex:none}
.ibtn:active{transform:translateY(2px);box-shadow:0 1px 0 #d3e1ef}
.starpill{display:flex;align-items:center;gap:6px;background:#fff6d6;border-radius:15px;padding:6px 14px;font-weight:800;font-size:20px;box-shadow:0 3px 0 #f3dd8c}
.hero{margin-top:14px;display:flex;align-items:center;gap:14px;background:linear-gradient(135deg,#fff,#fff9e8);border-radius:26px;padding:12px 16px;box-shadow:0 6px 18px rgba(30,80,140,.1)}
.owl{font-size:clamp(46px,8vw,70px);animation:bob 3s ease-in-out infinite;line-height:1}
@keyframes bob{50%{transform:translateY(-6px) rotate(-4deg)}}
.hero .bub{flex:1;font-size:clamp(16px,2.4vw,21px);font-weight:600}
.prog{height:14px;background:#eef3f9;border-radius:10px;overflow:hidden;margin-top:6px}
.prog i{display:block;height:100%;background:linear-gradient(90deg,#ffd43b,#fab005,#40c057);border-radius:10px;transition:width .6s}
.unit{margin-top:22px}
.unit-h{display:flex;align-items:center;gap:10px;background:var(--u);color:#fff;border-radius:20px;padding:8px 16px;font-weight:800;font-size:clamp(17px,2.6vw,24px);box-shadow:0 4px 0 var(--ud);flex-wrap:wrap}
.unit-h .ui{font-size:28px}.unit-h small{opacity:.9;font-weight:600;font-size:.8em;margin-inline-start:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:12px;margin-top:12px}
.lcard{position:relative;background:#fff;border-radius:22px;padding:12px 10px 10px;border:0;box-shadow:0 5px 0 var(--ul),0 8px 18px rgba(20,60,110,.08);text-align:center;transition:transform .15s;font:inherit;color:var(--ink)}
.lcard:hover{transform:translateY(-3px)}.lcard:active{transform:scale(.97)}
.lcard .num{position:absolute;top:8px;right:10px;background:var(--u);color:#fff;border-radius:11px;min-width:32px;height:32px;display:grid;place-items:center;font-weight:800;font-size:17px}
.lcard .pg{position:absolute;top:10px;left:10px;color:var(--mut);font-size:13px;font-weight:600}
.lcard .ic{font-size:44px;line-height:1.25;margin-top:12px}
.lcard h3{margin:4px 0 2px;font-size:clamp(16px,2vw,18px);min-height:2.4em;display:flex;align-items:center;justify-content:center;line-height:1.2}
.lcard .st{display:flex;justify-content:center;gap:4px;margin-top:4px;font-size:13px}
.lcard .st span{padding:1px 7px;border-radius:10px;background:#f1f5fa;color:#9aa8b8;font-weight:700}
.lcard .st span.done{background:var(--ul);color:var(--ud)}
.lcard .stars{font-size:13px;letter-spacing:1px;margin-top:4px;min-height:18px}
.foot{margin-top:24px;text-align:center;color:var(--mut);font-size:14px}
.foot button{border:0;background:none;color:var(--mut);text-decoration:underline;font-size:14px}
/* ---------- lesson ---------- */
.lhead{display:flex;align-items:center;gap:10px;background:#fff;border-radius:22px;padding:8px 10px;box-shadow:0 5px 16px rgba(20,60,110,.1)}
.back{border:0;background:var(--ul);color:var(--ud);border-radius:15px;height:48px;padding:0 14px;font-weight:800;font-size:18px;display:flex;align-items:center;gap:6px;flex:none}
.lic{font-size:34px;line-height:1}
.ltitle{flex:1;min-width:0}.ltitle h2{margin:0;font-size:clamp(19px,3vw,28px);color:var(--u);line-height:1.2}
.ltitle small{color:var(--mut);font-weight:600;font-size:13px}
.stages{display:flex;gap:8px;margin:12px 0}
.stg{flex:1;border:0;border-radius:18px;padding:10px 4px;font-weight:800;font-size:clamp(15px,2.3vw,20px);background:#fff;color:var(--mut);box-shadow:0 4px 0 #dde7f2;display:flex;align-items:center;justify-content:center;gap:6px;position:relative}
.stg.on{background:var(--u);color:#fff;box-shadow:0 4px 0 var(--ud)}
.stg .ck{font-size:12px;background:#fff6d6;color:#b78900;border-radius:10px;padding:0 6px}
.stg.on .ck{background:rgba(255,255,255,.25);color:#fff}
.panel{background:#fff;border-radius:26px;box-shadow:0 8px 24px rgba(20,60,110,.1);padding:14px;position:relative;overflow:hidden}
/* ---------- slides ---------- */
.sl{display:flex;flex-direction:column;min-height:calc(100vh - 230px);min-height:calc(100dvh - 230px)}
.sl-body{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:12px;padding:4px}
.sl-t{font-size:clamp(23px,3.8vw,36px);font-weight:800;color:var(--u);margin:0;line-height:1.25}
.sl-p{font-size:clamp(18px,2.7vw,25px);max-width:860px;margin:0;line-height:1.6;font-weight:600}
.sl-p b,.hl{color:var(--u)}
.sl-nav{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-top:10px;border-top:2px dashed var(--line);margin-top:8px}
.dotsn{display:flex;gap:5px;flex-wrap:wrap;justify-content:center}
.dotsn i{width:11px;height:11px;border-radius:6px;background:#d6e2ef;transition:all .3s}
.dotsn i.on{background:var(--u);width:28px}
.pop{animation:popin .55s cubic-bezier(.2,1.4,.4,1) both}
@keyframes popin{from{opacity:0;transform:scale(.6) translateY(24px)}to{opacity:1;transform:none}}
.vocab{background:#fff2f6;border:3px dashed #f48fb1;border-radius:20px;padding:10px 18px;max-width:780px;font-size:clamp(17px,2.5vw,22px);font-weight:600;text-align:right;line-height:1.6}
.vocab .vt{display:inline-block;background:#d6336c;color:#fff;border-radius:12px;padding:0 12px;margin-bottom:6px;font-weight:800}
.vocab b{color:#c2255c}
.tip{display:flex;align-items:center;gap:10px;background:#fffbe6;border:3px solid #ffe066;border-radius:22px;padding:8px 14px;font-size:clamp(16px,2.3vw,21px);font-weight:700;max-width:780px;text-align:right}
.tip .sn{font-size:34px;flex:none}
.row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center}
.col{display:flex;flex-direction:column;gap:8px;align-items:center}
.card{background:#fff;border-radius:18px;padding:10px 14px;box-shadow:0 4px 0 #e2eaf3,0 6px 14px rgba(20,60,110,.08);border:2px solid var(--line)}
.eq{font-size:clamp(24px,4vw,40px);font-weight:800;letter-spacing:.5px;line-height:1.5}
.eq.sm{font-size:clamp(20px,3vw,30px)}
.big-emo{font-size:clamp(40px,7vw,64px);line-height:1.1}
.tag{display:inline-block;background:var(--ul);color:var(--ud);border-radius:12px;padding:2px 12px;font-weight:800}
.nbox{display:inline-grid;place-items:center;min-width:2.2em;padding:4px 12px;border-radius:16px;background:var(--ul);color:var(--ud);font-weight:800}
.rv{display:inline-grid;place-items:center;min-width:1.8em;height:1.45em;border:3px dashed var(--u);border-radius:12px;color:var(--u);background:#fff;padding:0 8px;font:inherit;font-weight:800;vertical-align:middle;animation:pulse 1.6s infinite}
.rv.shown{border-style:solid;border-color:var(--ok);color:#fff;background:var(--ok);animation:jelly .5s}
.red{color:#e03131}.blue{color:#1c7ed6}.green{color:#2f9e44}.orange{color:#e8590c}.purple{color:#9c36b5}
/* ---------- common widgets ---------- */
.btn{border:0;border-radius:16px;padding:10px 22px;font-weight:800;font-size:clamp(17px,2.4vw,22px);background:var(--u);color:#fff;box-shadow:0 4px 0 var(--ud);line-height:1.3}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ud)}
.btn:disabled{opacity:.45}
.btn.alt{background:#fff;color:var(--ud);box-shadow:0 4px 0 #d5e2f0;border:2px solid var(--ul)}
.btn.go{background:var(--ok);box-shadow:0 4px 0 #168a45}
.btn.gold{background:#ffb703;box-shadow:0 4px 0 #d18e00;color:#3b2a00}
.opts{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.ob{min-width:84px;min-height:62px;padding:6px 18px;border:0;border-radius:20px;font-size:clamp(22px,3.4vw,32px);font-weight:800;color:#fff;background:var(--c,#4dabf7);box-shadow:0 5px 0 rgba(0,0,0,.2);transition:transform .1s;line-height:1.2}
.ob.sm{font-size:clamp(17px,2.4vw,22px);min-height:54px}
.ob:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.2)}
.ob.right{background:var(--ok)!important;animation:jelly .5s}
.ob.wrong{background:#b7c2cf!important;box-shadow:0 5px 0 #97a3b1}
.shake{animation:shake .45s}
@keyframes shake{0%,100%{translate:0}20%{translate:-9px}40%{translate:9px}60%{translate:-6px}80%{translate:5px}}
@keyframes jelly{0%{scale:1}30%{scale:1.2 .85}55%{scale:.9 1.1}75%{scale:1.05 .96}100%{scale:1}}
@keyframes pulse{50%{box-shadow:0 0 0 6px rgba(30,136,229,.18)}}
.spk{position:fixed;z-index:999;pointer-events:none;font-size:24px;animation:spk .9s ease-out forwards}
@keyframes spk{from{transform:translate(-50%,-50%) scale(.4);opacity:1}to{transform:translate(calc(-50% + var(--x)),calc(-50% + var(--y))) scale(1.15);opacity:0}}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#243447;color:#fff;border-radius:16px;padding:10px 18px;z-index:1000;font-weight:700;animation:popin .4s both;max-width:90vw;text-align:center}
.dragging{z-index:60;position:relative;filter:drop-shadow(0 8px 10px rgba(0,0,0,.2))}
/* hundred square */
.hs{display:grid;grid-template-columns:repeat(10,1fr);gap:3px;width:min(560px,94vw);direction:rtl}
.hs.sm{width:min(430px,88vw)}
.sl-body .hs.sm{width:max(250px,min(430px,88vw,calc(100vh - 400px)))}
.sl-body .hs:not(.sm){width:max(260px,min(560px,94vw,calc(100vh - 380px)))}
.hs-c{aspect-ratio:1;display:grid;place-items:center;background:#fffbea;border:2px solid #f1e3a6;border-radius:8px;font-weight:800;font-size:clamp(11px,2.1vw,19px);transition:background .25s,transform .2s;padding:0;font-family:inherit;color:var(--ink)}
button.hs-c:active{transform:scale(.9)}
.hs-c.c1{background:#ff8787;border-color:#f03e3e;color:#fff}.hs-c.c2{background:#74c0fc;border-color:#339af0;color:#fff}.hs-c.c3{background:#8ce99a;border-color:#40c057}.hs-c.c4{background:#ffd43b;border-color:#fab005}.hs-c.c5{background:#da77f2;border-color:#be4bdb;color:#fff}.hs-c.c6{background:#ffa94d;border-color:#fd7e14;color:#fff}
.hs-c.hid{color:transparent;background:#f1f3f5;border-color:#dee2e6}
.hs-c.start{background:#1e88e5;border-color:#1565c0;color:#fff;animation:pulse 1.2s infinite}
/* number line */
svg.nl{width:min(900px,96%);height:auto;direction:ltr;overflow:visible;touch-action:none}
/* ten frame */
.tfw{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.tf{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;background:#fff;border:4px solid #243447;border-radius:10px;padding:4px;width:min(290px,84vw)}
.tf>*{aspect-ratio:1;border:2px solid #cfd8e3;border-radius:6px;display:grid;place-items:center;background:#fff;padding:0}
.ctr{width:78%;height:78%;border-radius:50%;box-shadow:inset -3px -4px 0 rgba(0,0,0,.18);transition:background .2s,transform .2s;display:block}
.ctr.r{background:#fa5252}.ctr.b{background:#339af0}.ctr.y{background:#fcc419}.ctr.g{background:#51cf66}.ctr.e{background:transparent;box-shadow:none}
/* base ten */
.b10{display:flex;gap:8px;align-items:flex-end;justify-content:center;flex-wrap:wrap;direction:ltr}
.rod{display:grid;grid-template-rows:repeat(10,1fr);gap:1px;background:#1864ab;padding:2px;border-radius:4px}
.rod i,.one{display:block;width:clamp(13px,2.2vw,20px);height:clamp(13px,2.2vw,20px);background:#74c0fc;border-radius:2px}
.one{background:#ffd43b;border:2px solid #f08c00;border-radius:4px}
.ones{display:grid;grid-template-columns:repeat(2,auto);gap:3px;align-content:end}
/* objects */
.objs{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;font-size:clamp(24px,4vw,36px);line-height:1;max-width:780px}
.grp{display:inline-flex;gap:3px;padding:6px 8px;border:3px dashed #adb5bd;border-radius:16px;background:#fff;align-items:center;flex-wrap:wrap;justify-content:center}
.arr{display:inline-grid;gap:4px;padding:8px;background:#fff;border-radius:16px;border:3px solid var(--line);font-size:clamp(22px,3.6vw,34px);line-height:1}
.chip{border:3px solid var(--line);background:#fff;border-radius:16px;padding:8px 16px;font-size:clamp(18px,2.8vw,26px);font-weight:800;box-shadow:0 4px 0 #e2eaf3;font-family:inherit}
.chip.sel{border-color:var(--u);background:var(--ul);color:var(--ud)}
.chip.done{border-color:var(--ok);background:#e6f8ec;color:#137a3d}
.chip:disabled{opacity:.5}
.drop{transition:background .2s,transform .2s}
/* keypad */
.kpad{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:min(330px,90vw);direction:ltr}
.kpad button{height:56px;border:0;border-radius:16px;background:#fff;box-shadow:0 4px 0 #d3e1ef;font-size:28px;font-weight:800;border:2px solid var(--line)}
.kpad button:active{transform:translateY(3px);box-shadow:0 1px 0 #d3e1ef}
.kpad button.k-ok{background:var(--ok);color:#fff;box-shadow:0 4px 0 #168a45;border:0}
.kpad button.k-del{background:#ffe3e3}
.kdisp{min-width:130px;height:62px;border-radius:18px;border:3px solid var(--u);display:grid;place-items:center;font-size:36px;font-weight:800;background:#fff;color:var(--ud);padding:0 14px}
/* activity */
.act{display:flex;flex-direction:column;gap:10px;min-height:calc(100vh - 240px);min-height:calc(100dvh - 240px)}
.act-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.act-title{font-weight:800;font-size:clamp(18px,2.7vw,25px);color:var(--u)}
.act-dots{display:flex;gap:6px}
.act-dots i{display:block;width:16px;height:16px;border-radius:50%;background:#e2eaf3;transition:all .3s}
.act-dots i.on{background:var(--ok)}.act-dots i.cur{background:var(--gold);transform:scale(1.25)}
.act-q{background:var(--ul);border-radius:18px;padding:10px 16px;font-size:clamp(18px,2.8vw,26px);font-weight:700;text-align:center;line-height:1.5;display:flex;align-items:center;justify-content:center;gap:10px}
.act-q .ibtn{width:40px;height:40px;font-size:18px}
.act-area{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;position:relative;min-height:280px}
.act-foot{display:flex;flex-direction:column;align-items:center;gap:8px;min-height:40px}
.act-btns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.act-msg{font-size:clamp(18px,2.5vw,23px);font-weight:800;min-height:1.5em;text-align:center}
.act-msg.good{color:var(--ok)}.act-msg.bad{color:#e8590c}.act-msg.info{color:var(--ud)}
/* game shell */
.game{display:flex;flex-direction:column;gap:10px}
.g-top{display:flex;align-items:center;gap:10px}
.g-q{flex:1;background:var(--ul);border-radius:18px;padding:8px 14px;font-size:clamp(18px,2.9vw,27px);font-weight:800;text-align:center;min-height:58px;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:6px;line-height:1.4}
.g-sc{background:#fff6d6;border-radius:16px;padding:8px 12px;font-weight:800;font-size:20px;white-space:nowrap;box-shadow:0 3px 0 #f3dd8c}
.g-stage{position:relative;height:clamp(360px,calc(100vh - 330px),640px);height:clamp(360px,calc(100dvh - 330px),640px);border-radius:24px;overflow:hidden;background:linear-gradient(#bfe7ff,#eaf8ff);touch-action:none;-webkit-user-select:none;user-select:none}
.g-bar{height:12px;background:#eef3f9;border-radius:8px;overflow:hidden}
.g-bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#40c057,#94d82d);transition:width .5s;border-radius:8px}
.g-name{font-weight:800;color:var(--u);font-size:clamp(16px,2.3vw,20px);text-align:center}
.g-start{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:rgba(255,255,255,.72);z-index:30;text-align:center;padding:16px}
.g-start .big-emo{animation:bob 2.4s infinite}
.g-start p{margin:0;font-size:clamp(17px,2.5vw,22px);font-weight:700;max-width:600px}
.g-bot{position:absolute;left:0;right:0;bottom:10px;z-index:8;padding:0 8px}
.gq-img{display:inline-flex;align-items:center;justify-content:center}
/* overlay */
#overlay{position:fixed;inset:0;z-index:900;display:none;place-items:center;background:rgba(20,40,70,.45);padding:16px}
#overlay.show{display:grid}
.ov-card{background:#fff;border-radius:30px;padding:22px 20px;text-align:center;max-width:460px;width:100%;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.ov-emoji{font-size:74px;line-height:1;animation:bob 2s infinite}
.ov-card h2{margin:6px 0 2px;font-size:30px;color:#e8590c}

const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const AD='٠١٢٣٤٥٦٧٨٩', A=x=>String(x).replace(/[0-9]/g,d=>AD[d]);
function arD(root){if(!root)return;const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);const ns=[];let n;while((n=w.nextNode()))ns.push(n);ns.forEach(n=>{if(/[0-9]/.test(n.nodeValue))n.nodeValue=A(n.nodeValue)})}

/* ---------- scopes (timers that die with the screen) ---------- */
class Scope{
  constructor(p){this.t=new Set();this.r=new Set();this.f=[];this.k=new Set();this.p=p;this.dead=false;if(p)p.k.add(this)}
  after(ms,fn){const id=setTimeout(()=>{this.t.delete(id);if(!this.dead)fn()},ms);this.t.add(id);return id}
  every(ms,fn){const id=setInterval(()=>{if(!this.dead)fn()},ms);this.t.add(id);return id}
  raf(fn){const o={};let last=performance.now();const loop=now=>{if(this.dead)return;const dt=Math.min(60,now-last);last=now;if(fn(dt,now)===false){this.r.delete(o);return}o.id=requestAnimationFrame(loop)};o.id=requestAnimationFrame(loop);this.r.add(o);return o}
  onEnd(fn){this.f.push(fn)}
  listen(t,ev,fn,opt){t.addEventListener(ev,fn,opt);this.f.push(()=>t.removeEventListener(ev,fn,opt))}
  child(){return new Scope(this)}
  clear(){this.dead=true;this.k.forEach(c=>c.clear());this.k.clear();this.t.forEach(i=>{clearTimeout(i);clearInterval(i)});this.t.clear();this.r.forEach(o=>cancelAnimationFrame(o.id));this.r.clear();this.f.forEach(f=>{try{f()}catch(e){}});this.f=[];if(this.p)this.p.k.delete(this)}
}

/* ---------- sound ---------- */
const SND={on:true,ctx:null};
try{SND.on=localStorage.getItem('alam2-snd')!=='0'}catch(e){}
function ac(){if(!SND.ctx){try{SND.ctx=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(SND.ctx&&SND.ctx.state==='suspended')SND.ctx.resume();return SND.ctx}
function tone(f,d,type='sine',v=.18,when=0,slide=0){if(!SND.on)return;const c=ac();if(!c)return;const t=c.currentTime+when;const o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,slide),t+d);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.015);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(c.destination);o.start(t);o.stop(t+d+.05)}
function noise(d,v=.15,when=0,freq=1200,q=1){if(!SND.on)return;const c=ac();if(!c)return;const t=c.currentTime+when;const len=Math.max(1,Math.floor(c.sampleRate*d));const b=c.createBuffer(1,len,c.sampleRate);const data=b.getChannelData(0);for(let i=0;i<len;i++)data[i]=(Math.random()*2-1)*(1-i/len);const s=c.createBufferSource();s.buffer=b;const f=c.createBiquadFilter();f.type='bandpass';f.frequency.value=freq;f.Q.value=q;const g=c.createGain();g.gain.value=v;s.connect(f).connect(g).connect(c.destination);s.start(t)}
const sfx={
  click:()=>tone(660,.07,'triangle',.12),
  pop:()=>{tone(900,.09,'sine',.22,0,260);noise(.05,.08,0,2200)},
  ok:()=>{[523,659,784,1047].forEach((f,i)=>tone(f,.17,'triangle',.15,i*.07))},
  bad:()=>{tone(240,.2,'sawtooth',.07,0,150);tone(190,.26,'square',.045,.09,120)},
  win:()=>{[523,659,784,1047,784,1047,1319].forEach((f,i)=>tone(f,.24,'triangle',.15,i*.11))},
  whoosh:()=>noise(.35,.14,0,700,.7),
  jump:()=>tone(300,.2,'square',.07,0,900),
  coin:()=>{tone(988,.08,'square',.07);tone(1319,.28,'square',.07,.08)},
  tick:()=>tone(1500,.03,'square',.05),
  splash:()=>{noise(.45,.2,0,450,.6);tone(500,.2,'sine',.08,0,120)},

  flip:()=>noise(.09,.12,0,3200),
  star:()=>{tone(1200,.1,'sine',.12);tone(1600,.22,'sine',.12,.08)},
  thud:()=>tone(120,.22,'sine',.32,0,45),
  drum:()=>{tone(150,.15,'sine',.3,0,60);noise(.1,.1,0,1500)},
  slide:()=>tone(420,.22,'sine',.07,0,820),
  munch:()=>{noise(.08,.18,0,900);noise(.08,.18,.12,700);noise(.08,.18,.24,900)},
  swish:()=>noise(.3,.12,0,2600,.8),
  bell:()=>{tone(1320,.6,'sine',.12);tone(1980,.5,'sine',.06,.02)},

let arVoice=null;
function loadVoices(){try{const vs=speechSynthesis.getVoices();arVoice=vs.find(v=>/^ar/i.test(v.lang))||null}catch(e){}}

function speakable(html){const d=document.createElement('div');d.innerHTML=html;d.querySelectorAll('.nosay,svg,button.ibtn').forEach(x=>x.remove());d.querySelectorAll('.rv:not(.shown)').forEach(x=>x.textContent=' كم؟ ');let t=d.textContent;t=t.replace(/\+/g,' زائد ').replace(/[−–]/g,' ناقص ').replace(/ - /g,' ناقص ').replace(/=/g,' يساوي ').replace(/×/g,' ضرب ').replace(/÷/g,' قسمة ');return t.replace(/\s+/g,' ').trim()}
function say(t){if(!SND.on||!('speechSynthesis' in window))return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='ar-SA';if(arVoice)u.voice=arVoice;u.rate=.88;speechSynthesis.speak(u)}catch(e){}}

const PRAISE=['أحسنت! 🌟','رائع! 👏','ممتاز! 🎉','بطل! 💪','إجابة صحيحة! ✅','عمل جميل! 🌈','مذهل! 🚀','أنت نجم! ⭐'];

function burst(x,y,n=10){if(x==null)return;for(let i=0;i<n;i++){const s=document.createElement('div');s.className='spk';s.textContent=pick(['⭐','✨','🌟','💫']);const a=Math.random()*Math.PI*2,d=40+Math.random()*70;s.style.left=x+'px';s.style.top=y+'px';s.style.setProperty('--x',Math.cos(a)*d+'px');s.style.setProperty('--y',Math.sin(a)*d+'px');document.body.appendChild(s);setTimeout(()=>s.remove(),950)}}

/* ---------- drag & tap ---------- */
function dragify(node,{onTap,onDrop,onStart}={}){
  let sx=0,sy=0,drag=false,id=null;
  node.style.touchAction='none';
  node.addEventListener('pointerdown',e=>{if(node.classList.contains('locked'))return;id=e.pointerId;sx=e.clientX;sy=e.clientY;drag=false;try{node.setPointerCapture(id)}catch(_){}});
  node.addEventListener('pointermove',e=>{if(e.pointerId!==id)return;const mx=e.clientX-sx,my=e.clientY-sy;if(!drag&&Math.hypot(mx,my)>8){drag=true;node.classList.add('dragging');onStart&&onStart()}if(drag){node.style.transform=`translate(${mx}px,${my}px) scale(1.08)`}});
  const up=e=>{if(e.pointerId!==id)return;id=null;if(!drag){onTap&&onTap(e);return}node.classList.remove('dragging');const pe=node.style.pointerEvents;node.style.pointerEvents='none';const t=document.elementFromPoint(e.clientX,e.clientY);node.style.pointerEvents=pe;const ok=onDrop?onDrop(t,e):false;if(!ok){node.style.transition='transform .3s';node.style.transform='';setTimeout(()=>{node.style.transition=''},320)}};
  node.addEventListener('pointerup',up);
  node.addEventListener('pointercancel',e=>{if(e.pointerId!==id)return;id=null;drag=false;node.classList.remove('dragging');node.style.transform=''});
}

/* ---------- widgets ---------- */
const COLS=['#4dabf7','#ff922b','#cc5de8','#20c997','#f06595','#fab005'];
function choices(opts,correct,{onRight,onWrong,label=x=>x,sm=false,eq=(a,b)=>String(a)===String(b)}={}){
  const box=el('<div class="opts"></div>');let done=false;
  opts.forEach((o,i)=>{const b=el(`<button class="ob ${sm?'sm':''}" style="--c:${COLS[i%6]}">${label(o)}</button>`);
    b.onclick=()=>{if(done||b.classList.contains('wrong'))return;if(eq(o,correct)){done=true;b.classList.add('right');onRight&&onRight(b)}else{b.classList.add('wrong');shake(b);onWrong&&onWrong(b)}};box.appendChild(b)});
  arD(box);return box;
}
function keypad({onOk,max=3}){
  const w=el(`<div class="col"><div class="kdisp">&nbsp;</div><div class="kpad"></div></div>`);let v='';const d=$('.kdisp',w);const upd=()=>{d.textContent=v?A(v):' '};
  ['7','8','9','del','4','5','6','0','1','2','3','ok'].forEach(k=>{const b=el(`<button class="${k==='ok'?'k-ok':k==='del'?'k-del':''}">${k==='ok'?'✔':k==='del'?'⌫':A(k)}</button>`);
    b.onclick=()=>{sfx.tick();if(k==='del')v=v.slice(0,-1);else if(k==='ok'){if(v!=='')onOk(Number(v),api)}else if(v.length<max)v=(v==='0'?'':v)+k;upd()};$('.kpad',w).appendChild(b)});
  const api={el:w,clear(){v='';upd()},get:()=>v,disp:d};return api;
}

function hsq({hl={},hide=[],sm=false,btn=false,cls=''}={}){let s=`<div class="hs ${sm?'sm':''} ${cls}">`;const tg=btn?'button':'div';for(let n=1;n<=100;n++){s+=`<${tg} class="hs-c ${hl[n]||''} ${hide.includes(n)?'hid':''}" data-n="${n}">${n}</${tg}>`}return s+'</div>'}
function b10(t,o){return `<div class="b10">${Array(t).fill('<span class="rod">'+'<i></i>'.repeat(10)+'</span>').join('')}<span class="ones">${'<i class="one"></i>'.repeat(o)}</span></div>`}

/* number line svg */
function nl({min=0,max=100,major=10,minor=0,W=900,marks=[],labels=true,every=null,h=150,axisY=70,col='#e03131'}={}){
  const pad=40,X=v=>pad+(v-min)/(max-min)*(W-2*pad);
  let s=`<svg class="nl" viewBox="0 0 ${W} ${h}" data-min="${min}" data-max="${max}" data-pad="${pad}" data-w="${W}">`;
  s+=`<line x1="${X(min)-6}" y1="${axisY}" x2="${X(max)+6}" y2="${axisY}" stroke="${col}" stroke-width="6" stroke-linecap="round"/>`;
  if(minor)for(let v=min;v<=max;v+=minor)s+=`<line x1="${X(v)}" y1="${axisY-9}" x2="${X(v)}" y2="${axisY+9}" stroke="${col}" stroke-opacity=".5" stroke-width="3"/>`;
  for(let v=min;v<=max;v+=major){s+=`<line x1="${X(v)}" y1="${axisY-16}" x2="${X(v)}" y2="${axisY+16}" stroke="${col}" stroke-width="5"/>`;if(labels&&(every==null||v%every===0))s+=`<text x="${X(v)}" y="${axisY+50}" font-size="${W>700?30:26}" font-weight="800" text-anchor="middle" fill="#243447">${A(v)}</text>`}
  marks.forEach(m=>{s+=`<g><line x1="${X(m.v)}" y1="${axisY-10}" x2="${X(m.v)}" y2="${axisY-36}" stroke="${m.c||'#1e88e5'}" stroke-width="4"/><circle cx="${X(m.v)}" cy="${axisY}" r="11" fill="${m.c||'#1e88e5'}" stroke="#fff" stroke-width="3"/>${m.t!=null?`<text x="${X(m.v)}" y="${axisY-44}" font-size="30" font-weight="800" text-anchor="middle" fill="${m.c||'#1565c0'}">${A(m.t)}</text>`:''}</g>`});
  return s+'</svg>';
}
function nlValue(svg,clientX){const r=svg.getBoundingClientRect();const W=+svg.dataset.w,pad=+svg.dataset.pad,min=+svg.dataset.min,max=+svg.dataset.max;const x=(clientX-r.left)/r.width*W;return min+(x-pad)/(W-2*pad)*(max-min)}
function nlX(svg,v){const W=+svg.dataset.w,pad=+svg.dataset.pad,min=+svg.dataset.min,max=+svg.dataset.max;return pad+(v-min)/(max-min)*(W-2*pad)}
/* shapes as svg */

/* 3D solids */
const SOLIDS={
  cube:{n:'المكعب',f:6,svg:`<svg viewBox="0 0 100 100" width="90" height="90"><polygon points="20,35 60,35 60,85 20,85" fill="#ffd43b" stroke="#8a6d00" stroke-width="2"/><polygon points="20,35 40,18 80,18 60,35" fill="#ffe066" stroke="#8a6d00" stroke-width="2"/><polygon points="60,35 80,18 80,68 60,85" fill="#fab005" stroke="#8a6d00" stroke-width="2"/></svg>`},
  cuboid:{n:'متوازي المستطيلات',f:6,svg:`<svg viewBox="0 0 100 100" width="90" height="90"><polygon points="8,42 68,42 68,82 8,82" fill="#74c0fc" stroke="#1864ab" stroke-width="2"/><polygon points="8,42 26,26 86,26 68,42" fill="#a5d8ff" stroke="#1864ab" stroke-width="2"/><polygon points="68,42 86,26 86,66 68,82" fill="#4dabf7" stroke="#1864ab" stroke-width="2"/></svg>`},

  prism:{n:'المنشور الثلاثي',f:5,svg:`<svg viewBox="0 0 100 100" width="90" height="90"><polygon points="10,80 30,40 50,80" fill="#ffa8a8" stroke="#c92a2a" stroke-width="2"/><polygon points="30,40 70,24 90,64 50,80" fill="#ff8787" stroke="#c92a2a" stroke-width="2"/></svg>`},

/* ---------- activity framework ---------- */
function runAct({L,sc,panel,go,upd}){
  const AC=L.act;let i=0,miss=0,rsc=null,solved=false;
  panel.innerHTML=`<div class="act"><div class="act-head"><div class="act-title">🧩 ${AC.t}</div><div class="act-dots">${'<i></i>'.repeat(AC.n)}</div></div><div class="act-q"></div><div class="act-area"></div><div class="act-foot"><div class="act-msg"></div><div class="act-btns"></div></div></div>`;
  const qEl=$('.act-q',panel),area=$('.act-area',panel),msg=$('.act-msg',panel),btns=$('.act-btns',panel);
  const api={
    area,get sc(){return rsc},round:0,
    q(h){qEl.innerHTML=`<span>${h}</span><button class="ibtn" title="استمع">🔊</button>`;arD(qEl);$('.ibtn',qEl).onclick=()=>sayHtml(h)},
    msg(t,c='info'){msg.className='act-msg '+c;msg.innerHTML=t;arD(msg)},
    ok(t,node){if(solved)return;solved=true;sfx.ok();if(node)burstEl(node,12);api.msg(t||pick(PRAISE),'good');$$('.act-dots i',panel)[i].classList.add('on');btns.innerHTML='';
      const b=el(`<button class="btn go">${i===AC.n-1?'إنهاء النشاط 🏁':'التالي ←'}</button>`);b.onclick=()=>{sfx.click();nextRound()};btns.appendChild(b)},
    miss(t,node){miss++;sfx.bad();if(node)shake(node);api.msg(t||pick(TRY),'bad')},
    info(t){api.msg(t,'info')},
    btn(label,fn,cls=''){const b=el(`<button class="btn ${cls}">${label}</button>`);b.onclick=()=>{sfx.click();fn(b)};arD(b);btns.appendChild(b);return b},
    clearBtns(){btns.innerHTML=''},
    add(h){const e=typeof h==='string'?el(h):h;area.appendChild(e);arD(e);return e},
    choices(opts,correct,o={}){const b=choices(opts,correct,{...o,onRight:x=>{api.ok(o.okText,x);o.onRight&&o.onRight(x)},onWrong:x=>{api.miss(o.badText,x);o.onWrong&&o.onWrong(x)}});area.appendChild(b);return b},
    pick(opts,correct,onRight,o={}){const b=choices(opts,correct,{...o,onRight:x=>{sfx.ok();burstEl(x,8);onRight&&onRight(x)},onWrong:x=>api.miss(o.badText,x)});area.appendChild(b);return b},
    get solved(){return solved}
  };
  function start(){if(rsc)rsc.clear();rsc=sc.child();solved=false;area.innerHTML='';btns.innerHTML='';msg.textContent='';msg.className='act-msg';api.round=i;
    $$('.act-dots i',panel).forEach((d,k)=>{d.classList.toggle('cur',k===i)});
    try{AC.r(i,api)}catch(e){console.error(e)}}
  function nextRound(){i++;if(i>=AC.n)return finish();start()}
  window.__act={next:()=>nextRound(),api,get i(){return i}};
  function finish(){const stars=miss<=1?3:miss<=4?2:1;rec(L.id,'a',stars);upd&&upd();
    overlay({emoji:'🏅',title:'أحسنت!',text:`أنهيت نشاط «${AC.t}»`,stars,buttons:[{t:'🎮 إلى اللعبة',cls:'go',fn:()=>go('game')},{t:'🔁 أعد النشاط',cls:'alt',fn:()=>go('act')}]})}
  start();
}

/* ---------- game framework ---------- */
const ENG={};
function mc(q,a,ds,k=3,extra={}){const set=new Set([String(a)]);const o=[a];for(const d of shuf(ds)){if(o.length>=k)break;if(d==null||(typeof d==='number'&&(d<0||!isFinite(d))))continue;if(set.has(String(d)))continue;set.add(String(d));o.push(d)}return {q,a,o:shuf(o),...extra}}
const near=(a,s=[1,2,10])=>s.flatMap(k=>[a+k,a-k]);
function runGame({L,sc,panel,go,upd,next,home}){
  const G=L.game;const N=G.n||10;
  panel.innerHTML=`<div class="game"><div class="g-name">🎮 ${G.t}</div><div class="g-top"><div class="g-q">اضغط «ابدأ» للعب</div><div class="g-sc">⭐ <b>٠</b>/${A(N)}</div></div><div class="g-bar"><i></i></div><div class="g-stage"></div></div>`;
  const stage=$('.g-stage',panel),qEl=$('.g-q',panel),scEl=$('.g-sc b',panel),bar=$('.g-bar i',panel);
  let gsc=null,last='';
  const ctx={stage,N,score:0,miss:0,over:false,cur:null,G,
    get sc(){return gsc},
    setQ(h){qEl.innerHTML=h;arD(qEl)},
    next(){let q,t=0;do{q=G.gen(ctx);t++}while(t<8&&q.q+'|'+q.a===last);last=q.q+'|'+q.a;ctx.cur=q;if(q.q!=null)ctx.setQ(q.q);return q},
    label(o){return G.label?G.label(o):A(o)},
    check(v){return ctx.cur&&String(v)===String(ctx.cur.a)},
    answer(v,node){if(ctx.over)return false;const ok=ctx.check(v);if(ok)ctx.good(node);else ctx.bad(node);return ok},
    good(node){ctx.score++;sfx.ok();if(node)burstEl(node,12);scEl.textContent=A(ctx.score);bar.style.width=(ctx.score/N*100)+'%';if(ctx.score>=N&&G.autoEnd!==false){ctx.over=true;gsc.after(900,ctx.finish)}},
    bad(node){ctx.miss++;sfx.bad();shake(qEl);if(node)shake(node)},
    add(h){const e=typeof h==='string'?el(h):h;stage.appendChild(e);arD(e);return e},
    W:()=>stage.clientWidth,H:()=>stage.clientHeight,
    finish(){ctx.over=true;const lim=G.lenient?[3,8]:[1,4];const stars=ctx.miss<=lim[0]?3:ctx.miss<=lim[1]?2:1;rec(L.id,'g',stars);upd&&upd();
      const last=LESSONS.indexOf(L)===LESSONS.length-1;
      overlay({emoji:G.emoji||'🏆',title:'فزت! 🎉',text:`أنهيت لعبة «${G.t}»`,stars,buttons:[last?{t:'🏠 كل الدروس',cls:'go',fn:home}:{t:'الدرس التالي ←',cls:'go',fn:next},{t:'🔁 العب مرة أخرى',cls:'alt',fn:()=>go('game')},{t:'🏠 قائمة الدروس',cls:'alt',fn:home}]})}
  };
  window.__game=ctx;
  stage.innerHTML=`<div class="g-start"><div class="big-emo">${G.emoji||'🎮'}</div><p>${G.how||''}</p><button class="btn gold">ابدأ اللعب ▶</button></div>`;
  arD(stage);
  $('.g-start .btn',stage).onclick=()=>{sfx.click();ac();stage.innerHTML='';gsc=sc.child();try{ENG[G.e](ctx,G)}catch(e){console.error(e)}};
}

addCSS(`

/* --- sprite system --- */
function sprites(ctx){
  const list=[];
  ctx.sc.raf(dt=>{for(const s of [...list]){s.t=(s.t||0)+dt;s.x+=(s.vx||0)*dt/1000;s.y+=(s.vy||0)*dt/1000;if(s.upd)s.upd(s,dt);s.el.style.transform=`translate(${s.x}px,${s.y}px)`+(s.tf||'');if(s.out&&s.out(s))rm(s)}});
  function add(s){list.push(s);s.el.classList.add('spr');ctx.stage.appendChild(s.el);arD(s.el);return s}
  function rm(s){const i=list.indexOf(s);if(i>=0)list.splice(i,1);s.el.remove()}
  return {list,add,rm};
}
function fadeOut(s,sp){s.el.style.transition='opacity .35s';s.el.style.opacity='0';setTimeout(()=>sp.rm(s),380)}
function defHit(s,sp,ok){s.el.classList.add(ok?'f-ok':'f-bad');sfx.pop();setTimeout(()=>sp.rm(s),ok?520:460)}
/* tap-the-moving-target engine core */
function floaters(ctx,o){
  const sp=sprites(ctx);let bag=[],qn=0,lock=false;
  const newQ=()=>{ctx.next();bag=[];qn++;lock=false;o.onQ&&o.onQ(ctx.cur)};
  const nextV=()=>{if(!bag.length)bag=shuf(ctx.cur.o);return bag.pop()};
  const spawn=()=>{if(ctx.over||lock)return;if(sp.list.filter(s=>!s.dead).length>=(o.max||5))return;const v=nextV();const s=o.make(v,ctx.label(v),sp);s.v=v;sp.add(s);
    s.el.addEventListener('pointerdown',e=>{e.preventDefault();if(s.dead||lock||ctx.over)return;const ok=ctx.answer(v,s.el);s.dead=true;
      if(ok){lock=true;(o.hit||defHit)(s,sp,true);sp.list.forEach(x=>{if(x!==s&&!x.dead){x.dead=true;fadeOut(x,sp)}});ctx.sc.after(o.gap||800,()=>{if(!ctx.over){newQ();spawn()}})}
      else (o.hit||defHit)(s,sp,false)})};
  o.init&&o.init(sp);newQ();spawn();ctx.sc.every(o.every||1100,spawn);return sp;
}
/* multiple-choice bar at the bottom of the stage */
function mcBar(ctx,cb,{sm=false,cls=''}={}){
  let bar=$('.g-bot',ctx.stage);if(!bar)bar=ctx.add('<div class="g-bot"></div>');bar.innerHTML='';
  const box=el('<div class="opts"></div>');let lock=false;
  ctx.cur.o.forEach((o,i)=>{const b=el(`<button class="ob ${sm?'sm':''} ${cls}" style="--c:${COLS[i%6]}">${ctx.label(o)}</button>`);
    b.onclick=()=>{if(lock||ctx.over||b.classList.contains('wrong'))return;const ok=ctx.answer(o,b);if(ok){lock=true;b.classList.add('right')}else b.classList.add('wrong');cb&&cb(ok,o,b)};box.appendChild(b)});
  bar.appendChild(box);arD(box);return bar;
}
function mcLoop(ctx,{render,onAns,delay=950,sm,cls}){
  const loop=()=>{if(ctx.over)return;ctx.next();render&&render(ctx.cur);mcBar(ctx,(ok,o,b)=>{onAns&&onAns(ok,o,b);if(ok)ctx.sc.after(delay,loop)},{sm,cls})};loop();
}

const dialSmall=(sum,max=200)=>{const a=-120+Math.min(sum,max)/max*240;let t='';for(let v=0;v<=max;v+=20){const r=(-120+v/max*240-90)*Math.PI/180;t+=`<line x1="${80+56*Math.cos(r)}" y1="${80+56*Math.sin(r)}" x2="${80+(v%100===0?44:50)*Math.cos(r)}" y2="${80+(v%100===0?44:50)*Math.sin(r)}" stroke="#343a40" stroke-width="${v%100===0?4:2}"/>`;if(v%100===0)t+=`<text x="${80+32*Math.cos(r)}" y="${80+32*Math.sin(r)+6}" font-size="15" font-weight="800" text-anchor="middle">${A(v)}</text>`}
  return `<svg viewBox="0 0 160 150" width="170"><rect x="4" y="4" width="152" height="142" rx="24" fill="#fa5252"/><circle cx="80" cy="80" r="62" fill="#fff9db" stroke="#343a40" stroke-width="3"/>${t}<line class="nd" x1="80" y1="80" x2="80" y2="30" stroke="#e03131" stroke-width="5" stroke-linecap="round" style="transform-origin:80px 80px;transition:transform .8s cubic-bezier(.3,1.4,.5,1);transform:rotate(${a}deg)"/><circle cx="80" cy="80" r="6" fill="#343a40"/><text x="80" y="128" font-size="13" text-anchor="middle" font-weight="800">غرام</text></svg>`};

  api.st=api.st||{used:new Set()};const used=api.st.used;api.q(i===0?'اختر كتلتين مجموعهما ١٠٠ غرام بالضبط':'رائع! اعثر على زوج آخر من الكتل مجموعه ١٠٠ غرام');
  const sc=api.add(`<div class="kscale"><div class="pan"></div><div class="dl">${dialSmall(0)}</div><div class="sumt" style="font-weight:800;font-size:22px">المجموع: ٠ غم</div></div>`);
  const pan=$('.pan',sc);const bank=api.add(`<div class="row">${range(10,100,10).map(v=>`<button class="wt" data-v="${v}" ${used.has(v)?'disabled':''}>${v} غم</button>`).join('')}</div>`);
  let inPan=[];const upd=()=>{const s=inPan.reduce((a,b)=>a+ +b.dataset.v,0);$('.dl',sc).innerHTML=dialSmall(0);requestAnimationFrame(()=>{$('.nd',sc).style.transform=`rotate(${-120+Math.min(s,200)/200*240}deg)`});$('.sumt',sc).textContent='المجموع: '+A(s)+' غم';return s};
  $$('.wt',bank).forEach(b=>b.onclick=()=>{if(api.solved||inPan.length>=2||b.disabled)return;inPan.push(b);pan.appendChild(b);b.classList.add('in');sfx.thud();const s=upd();

/* ---------- 6 مثلث عائلة الحقائق ---------- */
function familyStep(api,t,a,b,done){
  const F=[`${a} + ${b} = ${t}`,`${b} + ${a} = ${t}`,`${t} − ${a} = ${b}`,`${t} − ${b} = ${a}`];const bad=pick([`${a} + ${t} = ${a+t}`,`${t} + ${b} = ${t+b}`,`${a} − ${b} = ${Math.abs(a-b)}`]);
  api.q('أيُّ جملة ليست من عائلة هذا المثلث؟');api.pick(shuf([...shuf(F).slice(0,3),bad]),bad,x=>{done&&done(x)},{sm:true});
}

/* ---------- 8 تقريب العدد ---------- */
function hillSVG(lo,d,{roll=null}={}){const X=k=>40+k*32,Y=k=>170-130*Math.sin(Math.PI*k/10);let path='M40 170';for(let k=0;k<=10;k+=.25)path+=` L${X(k).toFixed(1)} ${Y(k).toFixed(1)}`;
  let s=`<svg class="hill" viewBox="0 0 400 230"><path d="${path} L360 200 L40 200Z" fill="#b2f2bb" stroke="#2f9e44" stroke-width="4"/><line x1="200" y1="36" x2="200" y2="200" stroke="#e03131" stroke-dasharray="6 6" stroke-width="3"/>`;
  for(let k=0;k<=10;k++)s+=`<text x="${X(k)}" y="222" text-anchor="middle" font-size="${k%10?15:22}" font-weight="800" fill="${k%10?'#495057':'#1c7ed6'}">${A(lo+k)}</text>`;
  if(d!=null)s+=`<g class="ball" style="transform:translate(${X(d)}px,${Y(d)-24}px)"><circle r="24" fill="#ff922b" stroke="#fff" stroke-width="3"/><text y="9" text-anchor="middle" font-size="24" font-weight="800" fill="#fff">${A(lo+d)}</text></g>`;
  return s+'</svg>'}

function paperSVG(f,cut,open){const R=110,c=150;let s=`<svg class="paper" viewBox="0 0 300 300">`;const wAng=360/Math.pow(2,f);
  const notch=(ang)=>{const a=(ang-90)*Math.PI/180;const x=c+R*Math.cos(a),y=c+R*Math.sin(a);const rot=ang;if(cut==='tri')return `<polygon points="-16,-2 16,-2 0,30" transform="translate(${x},${y}) rotate(${rot})" fill="#fff"/>`;if(cut==='semi')return `<circle cx="${x}" cy="${y}" r="17" fill="#fff"/>`;return `<rect x="-13" y="-4" width="26" height="26" transform="translate(${x},${y}) rotate(${rot})" fill="#fff"/>`};
  if(open){s+=`<circle cx="${c}" cy="${c}" r="${R}" fill="#f783ac"/>`;const n=Math.pow(2,f);if(cut)for(let k=0;k<n;k++)s+=notch(wAng/2+k*wAng);
    for(let k=0;k<Math.pow(2,f-1);k++){const a=(k*wAng-90)*Math.PI/180;s+=`<line x1="${c-R*Math.cos(a)}" y1="${c-R*Math.sin(a)}" x2="${c+R*Math.cos(a)}" y2="${c+R*Math.sin(a)}" stroke="#c2255c" stroke-width="3" stroke-dasharray="8 6"/>`}}
  else if(f===0)s+=`<circle cx="${c}" cy="${c}" r="${R}" fill="#f783ac"/>`;
  else{const a0=-90*Math.PI/180,a1=(wAng-90)*Math.PI/180;s+=`<path d="M${c} ${c} L${c+R*Math.cos(a0)} ${c+R*Math.sin(a0)} A${R} ${R} 0 ${wAng>180?1:0} 1 ${c+R*Math.cos(a1)} ${c+R*Math.sin(a1)}Z" fill="#f783ac" stroke="#c2255c" stroke-width="3"/>`;if(cut)s+=notch(wAng/2)}
  return s+'</svg>'}

game:{e:'mirrorPick',t:'المرآة السحرية',emoji:'🪞',how:'انظر إلى نصف الصورة، واختر النصف الآخر الذي يجعلها متماثلة حول الخط الأحمر.',label:o=>mgHTML(window.__game.cur.pats[o],16),
 gen:()=>{const C=shuf(['#fa5252','#4dabf7','#51cf66','#fcc419','#cc5de8']).slice(0,2);let left;do{left=range(0,17).map(()=>Math.random()<.45?pick(C):'')}while(left.filter(Boolean).length<5);
  const rows=k=>[left.slice(k*3,k*3+3)];const mirror=[],copy=[],vflip=[];for(let r=0;r<6;r++){const row=left.slice(r*3,r*3+3);mirror.push(...[...row].reverse());copy.push(...row);}
  for(let r=5;r>=0;r--)vflip.push(...[...left.slice(r*3,r*3+3)].reverse());
  const one=[...mirror];const j=mirror.findIndex(Boolean);one[j]='';one[(j+4)%18]=one[(j+4)%18]?'':C[0];
  let alts=[copy,vflip,one].filter(p=>p.join()!==mirror.join());const pats={A:mirror};alts.slice(0,2).forEach((p,k)=>pats['BC'[k]]=p);
  return{q:'اختر النصف الذي يكمل الصورة المتماثلة',left,pats,a:'A',o:shuf(Object.keys(pats))}}}
});

act:{t:'وزّع البسكويت',n:3,r:(i,api)=>{

    $$('button',jar).forEach(b=>b.onclick=()=>{b.remove();cur.insertAdjacentText('beforeend','🍪');sfx.pop();left--;if(cur.textContent.length/2>=g&&left>0)newPlate();
