<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#d9f1ff">
<title>العلوم مع روبو – الصف الثاني</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --sky1:#d9f1ff; --sky2:#fff7e0; --ink:#1f3350; --ink2:#51627d; --card:#ffffff;
  --line:#e3ecf6; --good:#22b573; --bad:#ef4d5a; --gold:#ffb400;
  --u1:#1faa6b; --u1l:#e3f8ee; --u2:#ee8a1d; --u2l:#fff1df; --u3:#8a5cf0; --u3l:#f1eaff; --u0:#0ea5e9; --u0l:#e2f5fe;
  --uc:#0ea5e9; --ucl:#e2f5fe;
  --r:22px; --sh:0 6px 0 rgba(31,51,80,.08), 0 10px 26px rgba(31,51,80,.10);
  --fs:clamp(15px, 1.2vw + 10px, 22px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden}
body{font-family:'Baloo Bhaijaan 2','Tajawal','Segoe UI',Tahoma,sans-serif;color:var(--ink);font-size:var(--fs);
  background:linear-gradient(180deg,var(--sky1) 0%,#eef9ff 45%,var(--sky2) 100%);direction:rtl;user-select:none;-webkit-user-select:none;touch-action:manipulation}
button{font-family:inherit;color:inherit;cursor:pointer;border:0;background:none;font-size:inherit}
.hidden{display:none!important}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;overflow:hidden}
.scroll{overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;flex:1}

/* ---------- decor ---------- */
.sky-decor{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.sky-decor .sun{position:absolute;top:-40px;left:-40px;width:170px;height:170px;border-radius:50%;
  background:radial-gradient(circle,#fff6b0 0%,#ffd84a 55%,#ffc21a 100%);box-shadow:0 0 0 18px rgba(255,216,74,.25),0 0 0 40px rgba(255,216,74,.12);animation:sunPulse 5s ease-in-out infinite}
.cloud{position:absolute;background:#fff;border-radius:60px;opacity:.9;filter:drop-shadow(0 6px 8px rgba(80,140,200,.12))}
.cloud::before,.cloud::after{content:"";position:absolute;background:#fff;border-radius:50%}
.cloud::before{width:55%;height:140%;top:-60%;left:15%}
.cloud::after{width:40%;height:110%;top:-40%;right:12%}
.cloud.c1{width:140px;height:44px;top:70px;animation:drift 60s linear infinite}
.cloud.c2{width:100px;height:32px;top:160px;animation:drift 85s linear infinite;animation-delay:-30s;opacity:.75}
.cloud.c3{width:170px;height:50px;top:30px;animation:drift 110s linear infinite;animation-delay:-70s;opacity:.8}
@keyframes drift{from{transform:translateX(-120vw)}to{transform:translateX(120vw)}}
@keyframes sunPulse{50%{transform:scale(1.06)}}
.grass{position:absolute;bottom:0;left:0;right:0;height:60px;background:linear-gradient(180deg,#9be27b,#6cc756);border-radius:50% 50% 0 0/40px 40px 0 0}

/* ---------- top bar ---------- */
.topbar{position:relative;z-index:5;display:flex;align-items:center;gap:10px;padding:10px 14px;padding-top:max(10px,env(safe-area-inset-top));
  background:rgba(255,255,255,.85);backdrop-filter:blur(8px);border-bottom:3px solid var(--line)}
.topbar .ttl{flex:1;min-width:0;font-weight:800;font-size:1.05em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.2}
.topbar .ttl small{display:block;font-weight:600;color:var(--ink2);font-size:.72em}
.ibtn{width:46px;height:46px;min-width:46px;border-radius:14px;background:#fff;box-shadow:0 3px 0 #d6e2ef;display:grid;place-items:center;font-size:22px;transition:transform .12s}
.ibtn:active{transform:translateY(2px);box-shadow:0 1px 0 #d6e2ef}
.hud{display:flex;gap:6px;align-items:center}
.chip{background:#fff;border-radius:999px;padding:4px 12px;font-weight:800;box-shadow:0 3px 0 #d6e2ef;white-space:nowrap;font-size:.9em}

/* ---------- home ---------- */
.home-head{position:relative;z-index:2;text-align:center;padding:18px 16px 6px}
.home-head .logo{display:inline-flex;align-items:center;gap:12px;background:#fff;border-radius:28px;padding:10px 22px;box-shadow:var(--sh)}
.home-head .logo .big{font-size:48px;animation:bob 3s ease-in-out infinite}
.home-head h1{margin:0;font-size:clamp(24px,4vw,40px);line-height:1.1}
.home-head h1 span{color:var(--u2)}
.home-head p{margin:2px 0 0;color:var(--ink2);font-weight:600;font-size:.9em}
@keyframes bob{50%{transform:translateY(-6px) rotate(-4deg)}}
.home-body{position:relative;z-index:2;padding:10px 16px 90px;max-width:1150px;margin:0 auto;width:100%}
.overall{display:flex;align-items:center;gap:12px;background:#fff;border-radius:var(--r);padding:10px 16px;box-shadow:var(--sh);margin:8px 0 14px}
.overall .bar{flex:1;height:16px;border-radius:99px;background:#eef3f8;overflow:hidden}
.overall .bar i{display:block;height:100%;background:linear-gradient(90deg,#ffd23f,#ffb400);border-radius:99px;transition:width .6s}
.unit{margin:0 0 20px}
.unit-h{display:flex;align-items:center;gap:10px;margin:0 4px 10px}
.unit-h .num{width:48px;height:48px;border-radius:16px;display:grid;place-items:center;color:#fff;font-weight:900;font-size:26px;background:var(--uc);box-shadow:0 4px 0 rgba(0,0,0,.12)}
.unit-h h2{margin:0;font-size:1.25em}
.unit-h .ico{font-size:30px}
.lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.lcard{position:relative;text-align:right;background:#fff;border-radius:var(--r);padding:14px 14px 12px;box-shadow:var(--sh);border:3px solid transparent;transition:transform .15s;display:flex;flex-direction:column;gap:6px;min-height:128px;overflow:hidden}
.lcard:hover{transform:translateY(-3px);border-color:var(--ucl)}
.lcard:active{transform:scale(.98)}
.lcard .em{font-size:40px;line-height:1}
.lcard .no{position:absolute;top:10px;left:12px;background:var(--ucl);color:var(--uc);font-weight:900;border-radius:10px;padding:0 8px;font-size:.85em;direction:ltr}
.lcard b{font-size:1.02em;line-height:1.25}
.lcard .prog{height:8px;border-radius:9px;background:#eef3f8;overflow:hidden;margin-top:auto}
.lcard .prog i{display:block;height:100%;background:var(--uc);border-radius:9px}
.lcard .st{font-size:.8em;color:var(--ink2);font-weight:700}
.lcard.review{background:linear-gradient(135deg,#fff,var(--ucl))}
.lcard::after{content:"";position:absolute;width:90px;height:90px;border-radius:50%;background:var(--ucl);bottom:-40px;left:-30px;z-index:0;opacity:.7}
.lcard>*{position:relative;z-index:1}

/* ---------- lesson page ---------- */
.lesson-hero{position:relative;z-index:2;margin:14px auto 6px;max-width:1000px;width:calc(100% - 28px);background:#fff;border-radius:28px;box-shadow:var(--sh);padding:16px 18px;display:flex;gap:14px;align-items:center;border-bottom:6px solid var(--uc)}
.lesson-hero .em{font-size:64px;animation:bob 3s ease-in-out infinite}
.lesson-hero h2{margin:0;font-size:clamp(22px,3.2vw,34px);line-height:1.15}
.lesson-hero .tag{display:inline-block;background:var(--ucl);color:var(--uc);border-radius:10px;padding:0 10px;font-weight:800;font-size:.8em}
.lesson-hero p{margin:4px 0 0;color:var(--ink2);font-weight:600;font-size:.88em}
.comp-grid{position:relative;z-index:2;max-width:1000px;margin:10px auto 90px;width:calc(100% - 28px);display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.comp{background:#fff;border-radius:var(--r);box-shadow:var(--sh);padding:14px;display:flex;align-items:center;gap:12px;text-align:right;transition:transform .15s;border:3px solid transparent;position:relative}
.comp:hover{transform:translateY(-3px);border-color:var(--ucl)}
.comp .ci{width:62px;height:62px;min-width:62px;border-radius:18px;display:grid;place-items:center;font-size:34px;background:var(--ucl)}
.comp .ct{flex:1;min-width:0}
.comp .ct small{display:block;color:var(--uc);font-weight:800;font-size:.72em}
.comp .ct b{display:block;line-height:1.2}
.comp .stars{font-size:.85em;letter-spacing:1px}
.comp .step{position:absolute;top:-8px;right:-6px;background:var(--uc);color:#fff;font-weight:900;border-radius:50%;width:28px;height:28px;display:grid;place-items:center;font-size:15px;box-shadow:0 3px 0 rgba(0,0,0,.15)}
.stars .on{filter:none}.stars .off{filter:grayscale(1);opacity:.35}

/* ---------- player ---------- */
#stage{position:relative;flex:1;overflow:hidden;z-index:1}
.stage-inner{position:absolute;inset:0;display:flex;flex-direction:column}
.overlay{position:absolute;inset:0;z-index:50;display:grid;place-items:center;background:rgba(223,242,255,.72);backdrop-filter:blur(4px);padding:16px;animation:fadeIn .25s}
.ocard{background:#fff;border-radius:30px;box-shadow:var(--sh);padding:22px 22px 18px;max-width:560px;width:100%;text-align:center;animation:popIn .35s cubic-bezier(.2,1.6,.4,1);max-height:100%;overflow:auto}
.ocard .big{font-size:78px;line-height:1.1;animation:bob 2.5s ease-in-out infinite}
.ocard h3{margin:6px 0;font-size:1.45em;line-height:1.2}
.ocard p{margin:6px 0 12px;color:var(--ink2);font-weight:600;line-height:1.6}
.need{background:#f5fbff;border:2px dashed #bfe3fb;border-radius:18px;padding:8px 12px;margin:6px 0 12px;text-align:right;font-size:.88em}
.need b{color:var(--u0)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:800;padding:12px 24px;border-radius:18px;background:var(--uc);color:#fff;box-shadow:0 5px 0 rgba(0,0,0,.18);font-size:1.05em;transition:transform .1s;min-height:52px}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.18)}
.btn.ghost{background:#fff;color:var(--ink);box-shadow:0 5px 0 #d6e2ef}
.btn.gold{background:linear-gradient(180deg,#ffcf33,#ffae00);color:#5a3a00}
.btn.green{background:var(--good)}
.btn.red{background:var(--bad)}
.btn.sm{padding:8px 14px;min-height:42px;font-size:.92em;border-radius:14px}
.btn[disabled]{opacity:.45;pointer-events:none}
.brow{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.endstars{font-size:62px;letter-spacing:6px;margin:4px 0}
.endstars span{display:inline-block;animation:starIn .5s cubic-bezier(.2,1.8,.4,1) both}
.endstars span:nth-child(2){animation-delay:.25s}.endstars span:nth-child(3){animation-delay:.5s}
@keyframes starIn{from{transform:scale(0) rotate(-120deg);opacity:0}}
@keyframes popIn{from{transform:scale(.7);opacity:0}}
@keyframes fadeIn{from{opacity:0}}
.fb{position:absolute;top:14px;left:50%;transform:translateX(-50%);z-index:60;padding:10px 22px;border-radius:999px;font-weight:900;color:#fff;box-shadow:0 6px 18px rgba(0,0,0,.18);pointer-events:none;animation:fbIn 1.4s ease forwards;white-space:nowrap;font-size:1.05em;max-width:92%;overflow:hidden;text-overflow:ellipsis}
.fb.good{background:var(--good)}.fb.bad{background:var(--bad)}.fb.info{background:var(--u0)}
@keyframes fbIn{0%{opacity:0;transform:translate(-50%,-20px) scale(.8)}12%{opacity:1;transform:translate(-50%,0) scale(1.05)}20%{transform:translate(-50%,0) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-10px)}}
.confetti{position:absolute;top:-20px;width:10px;height:14px;z-index:70;pointer-events:none;border-radius:3px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.pulse{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.08)}}
.wiggle{animation:wiggle 1.6s ease-in-out infinite}
@keyframes wiggle{25%{transform:rotate(-6deg)}75%{transform:rotate(6deg)}}
.float{animation:floaty 3s ease-in-out infinite}
@keyframes floaty{50%{transform:translateY(-8px)}}
.swim{animation:swim 6s ease-in-out infinite}
@keyframes swim{0%,100%{transform:translateX(0) scaleX(1)}45%{transform:translateX(30px) scaleX(1)}50%{transform:translateX(30px) scaleX(-1)}95%{transform:translateX(0) scaleX(-1)}}
.sway{animation:sway 1.2s ease-in-out infinite;transform-origin:bottom center}
@keyframes sway{50%{transform:rotate(-14deg)}}
.spin{animation:spinr 4s linear infinite}
@keyframes spinr{to{transform:rotate(360deg)}}

/* robot / mascot bubble */
.mascot{display:flex;align-items:flex-end;gap:8px}
.mascot .bot{font-size:44px;animation:bob 2.6s ease-in-out infinite}
.bubble{background:#fff;border-radius:20px 20px 20px 4px;padding:10px 14px;box-shadow:var(--sh);font-weight:700;line-height:1.5;position:relative}

/* ---------- scenes ---------- */
.scene{position:relative;overflow:hidden;border-radius:24px;box-shadow:inset 0 0 0 4px rgba(255,255,255,.6)}
.scene .it{position:absolute;transform:translate(50%,-50%);font-size:calc(var(--s,1) * clamp(30px,6vmin,64px));line-height:1;cursor:pointer;transition:filter .2s;z-index:2;display:flex;flex-direction:column;align-items:center}
.scene .it>.e{display:block;filter:drop-shadow(0 4px 3px rgba(0,0,0,.18))}
.scene .it.found>.e{filter:drop-shadow(0 0 10px #fff) drop-shadow(0 0 4px #ffd84a)}
.tag-lbl{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);background:#fff;border-radius:12px;padding:2px 10px;font-size:max(14px,.3em);font-weight:800;white-space:nowrap;box-shadow:0 3px 8px rgba(0,0,0,.15);color:var(--ink);animation:popIn .3s;pointer-events:none;margin-bottom:4px}
.bg-sea{background:linear-gradient(180deg,#bfe8ff 0 38%,#4fb3e8 38%,#1d7fc4 100%)}
.bg-river{background:linear-gradient(180deg,#c9ecff 0 30%,#8fd26b 30% 45%,#58b5e6 45% 80%,#8fd26b 80%)}
.bg-dry{background:linear-gradient(180deg,#ffe7b8 0 40%,#e8c47a 40%,#d6a95a 100%)}
.bg-desert{background:radial-gradient(ellipse 60% 25% at 30% 70%,#f2b86a,transparent),radial-gradient(ellipse 70% 30% at 80% 85%,#e9a352,transparent),linear-gradient(180deg,#ffe2a8 0 42%,#f6c77c 42%,#eab162 100%)}
.bg-wadi{background:linear-gradient(180deg,#cdeeff 0 28%,#9aa36a 28% 40%,#6fbf6a 40% 55%,#3fa5d8 55% 75%,#7cc96a 75%)}
.bg-beach{background:linear-gradient(180deg,#cfeeff 0 30%,#5bb9e8 30% 52%,#f3dca3 52%,#e9cd86 100%)}
.bg-park{background:linear-gradient(180deg,#cdefff 0 35%,#8fd96f 35%,#6cc756 100%)}
.bg-sky{background:linear-gradient(180deg,#8fd3ff,#dff4ff)}
.bg-rainy{background:linear-gradient(180deg,#8d9bb0,#c7d2df 60%,#7fae6a 60%)}
.bg-snowy{background:linear-gradient(180deg,#c9dcf0,#eef6ff 55%,#ffffff 55%)}
.bg-storm{background:linear-gradient(180deg,#46536b,#7d8aa0 55%,#5a6f5a 55%)}
.bg-space{background:radial-gradient(circle at 20% 30%,#fff 1px,transparent 2px),radial-gradient(circle at 70% 20%,#fff 1px,transparent 2px),radial-gradient(circle at 45% 75%,#fff 1px,transparent 2px),radial-gradient(circle at 85% 65%,#fff 1.5px,transparent 2.5px),linear-gradient(180deg,#0b1b3f,#1e3470)}
.bg-studio{background:linear-gradient(180deg,#e8f0ff,#c7d8f5)}
.bg-quarry{background:linear-gradient(180deg,#d6efff 0 30%,#d8b88a 30% 55%,#c29a66 55%,#a8814f 100%)}
.bg-mountain{background:linear-gradient(160deg,transparent 45%,#b88a5a 45.3% ,#a37649 70%,transparent 70.3%),linear-gradient(200deg,transparent 50%,#c99a66 50.3%),linear-gradient(180deg,#cdeeff 0 60%,#d9b98a 60%)}
.bg-garden{background:linear-gradient(180deg,#d4f0ff 0 40%,#7fcf5e 40% 50%,#8a5a36 50%,#6e4527 100%)}
.bg-soil{background:radial-gradient(circle at 20% 30%,#7a4d2c 4px,transparent 5px),radial-gradient(circle at 60% 60%,#5d3a20 3px,transparent 4px),radial-gradient(circle at 80% 20%,#7a4d2c 3px,transparent 4px),linear-gradient(180deg,#9b6a42,#6b4426)}
.bg-farm{background:linear-gradient(180deg,#d6f1ff 0 32%,#9fdc75 32%,#78c95a 100%)}
.bg-school{background:linear-gradient(180deg,#d6f1ff 0 20%,#f6e7c9 20% 55%,#8fd96f 55%)}
.bg-kitchen{background:linear-gradient(180deg,#fff6ea 0 55%,#e7d3b6 55% 58%,#f4efe6 58%)}
.bg-workshop{background:linear-gradient(180deg,#f0e6da 0 60%,#c4a888 60%)}
.bg-lab{background:linear-gradient(180deg,#eef8ff 0 62%,#d9e7f2 62%)}
.bg-town{background:linear-gradient(180deg,#d6f1ff 0 50%,#b8c3cf 50% 70%,#8a95a3 70%)}
.bg-underground{background:linear-gradient(180deg,#d6f1ff 0 22%,#7cc95a 22% 27%,#9b6a42 27% 55%,#8b7d6e 55% 80%,#6f655b 80%)}
.bg-factory{background:linear-gradient(180deg,#e8eef5 0 60%,#b6c2cf 60%)}
.bg-hot{background:linear-gradient(180deg,#ffd0a0,#ffe9c4)}
.bg-cold{background:linear-gradient(180deg,#cfe9ff,#f0f8ff)}

/* ---------- rocks (css) ---------- */
.rock{display:inline-block;width:var(--w,90px);height:calc(var(--w,90px)*.72);border-radius:46% 54% 42% 58%/58% 50% 50% 42%;box-shadow:inset -8px -10px 0 rgba(0,0,0,.14),inset 6px 6px 0 rgba(255,255,255,.25),0 6px 8px rgba(0,0,0,.18);position:relative}
.rock.granite{background:radial-gradient(circle at 20% 30%,#222 2px,transparent 3px),radial-gradient(circle at 65% 55%,#fff 2px,transparent 3px),radial-gradient(circle at 40% 70%,#b23a3a 3px,transparent 4px),radial-gradient(circle at 75% 25%,#333 2px,transparent 3px),radial-gradient(circle at 30% 50%,#f3c2c2 3px,transparent 4px),radial-gradient(circle at 55% 30%,#111 1.5px,transparent 2.5px),#d9a3a0;background-size:22px 22px,18px 18px,26px 26px,16px 16px,20px 20px,14px 14px,auto}
.rock.marble{background:linear-gradient(120deg,transparent 40%,rgba(160,170,190,.55) 42%,transparent 45%),linear-gradient(60deg,transparent 60%,rgba(170,180,200,.5) 61.5%,transparent 63%),#f7f7fa}
.rock.limestone{background:radial-gradient(circle at 30% 40%,#b9b6ad 3px,transparent 4px),radial-gradient(circle at 70% 60%,#a9a69d 2px,transparent 3px),#cfcbc0;background-size:18px 18px,14px 14px,auto}
.rock.sandstone{background:repeating-linear-gradient(170deg,#d9733b 0 7px,#e8914f 7px 13px,#c9622e 13px 17px)}
.rock.slate{background:repeating-linear-gradient(175deg,#4a5563 0 5px,#5b6778 5px 9px,#3d4653 9px 11px);border-radius:12px 18px 10px 16px}
.rock.quartz{background:linear-gradient(135deg,#ffffff,#e9e4ff 40%,#cfd8ff 60%,#ffffff);border-radius:20% 20% 40% 40%/50% 50% 30% 30%;clip-path:polygon(50% 0,80% 25%,100% 70%,70% 100%,30% 100%,0 70%,20% 25%)}
.rock.diamond{background:linear-gradient(135deg,#e8fbff,#9fe7ff 40%,#ffffff 55%,#7fd3ff);clip-path:polygon(25% 0,75% 0,100% 35%,50% 100%,0 35%)}
.rock.plain{background:#9a9186}
.rock.pebble{--w:34px;background:#a79d90}

/* ---------- slides ---------- */
.slides{position:absolute;inset:0;display:flex;flex-direction:column;padding:10px 12px 8px;gap:8px}
.sl-top{display:flex;align-items:center;gap:10px}
.sl-title{flex:1;font-weight:900;font-size:1.25em;line-height:1.2;background:#fff;border-radius:18px;padding:8px 14px;box-shadow:var(--sh);border-right:8px solid var(--uc)}
.sl-body{flex:1;min-height:0;display:flex;gap:12px}
.sl-visual{flex:1.25;min-height:0;position:relative;display:flex;flex-direction:column}
.sl-text{flex:1;min-height:0;overflow:auto;background:#fff;border-radius:24px;box-shadow:var(--sh);padding:14px 16px;font-size:1.12em;line-height:1.9;font-weight:600}
.sl-text p{margin:0 0 8px}
.kw{color:var(--uc);background:var(--ucl);border-radius:8px;padding:0 6px;font-weight:900}
.sl-nav{display:flex;align-items:center;gap:10px;justify-content:space-between}
.dots{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;flex:1}
.dots i{width:12px;height:12px;border-radius:50%;background:#cfdbe8;transition:.3s}
.dots i.on{background:var(--uc);width:30px;border-radius:9px}
.anim-in{animation:slideIn .45s cubic-bezier(.2,1.2,.4,1)}
@keyframes slideIn{from{opacity:0;transform:translateX(-40px)}}
.vis-fill{flex:1;min-height:180px;position:relative}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;align-content:center;height:100%;overflow:auto;padding:4px}
.fcard{perspective:800px;min-height:130px;cursor:pointer}
.fcard .in{position:relative;width:100%;height:100%;min-height:130px;transition:transform .55s;transform-style:preserve-3d}
.fcard.open .in{transform:rotateY(180deg)}
.fcard .f,.fcard .b{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px;text-align:center;box-shadow:var(--sh)}

<body>
<div id="app"></div>
<script>
/* ================= CORE ENGINE ================= */
'use strict';
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
/* h('div', {class:'x', style:{...}|'css', onclick:fn, html:'..', text:'..', data:{k:v}}, ...children) */
function h(tag, props, ...kids) {
  const el = document.createElement(tag);
  if (props) for (const k in props) {
    const v = props[k];
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k === 'style') { if (typeof v === 'string') el.style.cssText = v; else Object.assign(el.style, v); }
    else if (k === 'html') el.innerHTML = v;
    else if (k === 'text') el.textContent = v;
    else if (k === 'data') for (const d in v) el.dataset[d] = v[d];
    else if (k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v);
  }
  for (const c of kids.flat()) if (c != null && c !== false) el.append(c.nodeType ? c : document.createTextNode(c));
  return el;
}
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const rand = (a, b) => a + Math.random() * (b - a);
const randi = (a, b) => Math.floor(rand(a, b + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const sleep = ms => new Promise(r => setTimeout(r, ms));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
/* [[word]] -> highlighted keyword */
const md = t => String(t).replace(/\[\[(.+?)\]\]/g, '<span class="kw">$1</span>');
const plain = t => String(t).replace(/\[\[(.+?)\]\]/g, '$1').replace(/<[^>]+>/g, '');

/* ---------- storage ---------- */
const Store = {
  key: 'sci2_t1_progress_v1', data: {},
  load() { try { this.data = JSON.parse(localStorage.getItem(this.key)) || {}; } catch (e) { this.data = {}; } },
  save() { try { localStorage.setItem(this.key, JSON.stringify(this.data)); } catch (e) { } },
  get(id) { return this.data[id] || 0; },
  set(id, s) { if (s > this.get(id)) { this.data[id] = s; this.save(); } },
  opt(k, v) { if (v === undefined) return this.data['_' + k]; this.data['_' + k] = v; this.save(); }
};
Store.load();

/* ---------- sound (WebAudio, no files) ---------- */
const SFX = (() => {
  let ctx = null, master = null;
  const muted = () => !!Store.opt('muted');
  function ac() {
    if (!ctx) { try { ctx = new (window.AudioContext || window.webkitAudioContext)(); master = ctx.createGain(); master.gain.value = .9; master.connect(ctx.destination); } catch (e) { return null; } }
    if (ctx.state === 'suspended') ctx.resume();
    return ctx;
  }
  function tone(f, d = .15, type = 'sine', vol = .2, when = 0, f2 = null) {
    if (muted()) return; const c = ac(); if (!c) return;
    const t = c.currentTime + when, o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t);
    if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + .012); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    o.connect(g); g.connect(master); o.start(t); o.stop(t + d + .05);
  }
  function noise(d = .3, vol = .2, freq = 1000, when = 0, type = 'bandpass', f2 = null) {
    if (muted()) return; const c = ac(); if (!c) return;
    const t = c.currentTime + when, len = Math.floor(c.sampleRate * d), buf = c.createBuffer(1, len, c.sampleRate), data = buf.getChannelData(0);
    for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
    const s = c.createBufferSource(); s.buffer = buf;
    const fl = c.createBiquadFilter(); fl.type = type; fl.frequency.setValueAtTime(freq, t); if (f2) fl.frequency.exponentialRampToValueAtTime(f2, t + d);
    const g = c.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    s.connect(fl); fl.connect(g); g.connect(master); s.start(t); s.stop(t + d + .05);
  }
  const S = {
    unlock() { ac(); },
    click() { tone(700, .06, 'triangle', .14); },
    tap() { tone(520, .05, 'sine', .15, 0, 780); },
    pop() { tone(420, .09, 'sine', .28, 0, 1100); },
    flip() { tone(900, .07, 'triangle', .1, 0, 1400); noise(.08, .05, 3000); },
    correct() { [523, 659, 784, 1046].forEach((f, i) => tone(f, .16, 'triangle', .18, i * .075)); },
    wrong() { tone(260, .18, 'square', .09, 0, 180); tone(200, .25, 'square', .08, .12, 140); },
    win() { [523, 659, 784, 659, 784, 1046].forEach((f, i) => tone(f, .22, 'triangle', .2, i * .12)); [262, 330, 392].forEach(f => tone(f, .9, 'sine', .08, .6)); },
    star() { tone(1200, .12, 'sine', .15, 0, 1800); tone(1600, .18, 'sine', .1, .08, 2400); },
    whoosh() { noise(.35, .22, 400, 0, 'bandpass', 3000); },
    drop() { tone(320, .12, 'sine', .28, 0, 110); },
    pick() { tone(600, .06, 'sine', .15, 0, 900); },
    tick() { tone(1400, .03, 'square', .05); },
    splash() { noise(.45, .3, 1200, 0, 'bandpass', 300); tone(300, .2, 'sine', .08, 0, 90); },
    boing() { tone(160, .35, 'sine', .3, 0, 620); },
    magic() { [880, 1175, 1397, 1760, 2093].forEach((f, i) => tone(f, .18, 'sine', .08, i * .06)); },
    dig() { noise(.14, .35, 350, 0, 'lowpass'); },
    bubble() { tone(300 + Math.random() * 300, .12, 'sine', .18, 0, 900 + Math.random() * 400); },
    snap() { noise(.09, .5, 2500, 0, 'highpass'); tone(90, .15, 'square', .15); },
    sizzle() { noise(.6, .09, 6000, 0, 'highpass'); },
    hammer() { tone(180, .07, 'square', .25, 0, 90); noise(.06, .3, 2500, 0, 'highpass'); },
    rain() { noise(1.2, .12, 3000, 0, 'highpass'); },
    wind() { noise(1.4, .18, 300, 0, 'bandpass', 900); },
    thunder() { noise(1.5, .5, 180, 0, 'lowpass', 60); },
    camera() { noise(.05, .5, 5000, 0, 'highpass'); tone(1800, .05, 'square', .06, .06); },
    engine() { tone(70, .5, 'sawtooth', .12, 0, 110); },
    stretch() { tone(200, .25, 'sawtooth', .05, 0, 500); },
    melt() { tone(500, .5, 'sine', .08, 0, 180); },
    freeze() { [2000, 2400, 2800].forEach((f, i) => tone(f, .08, 'sine', .07, i * .05)); },
    level() { [392, 523, 659, 784].forEach((f, i) => tone(f, .12, 'square', .07, i * .07)); },
    dice() { for (let i = 0; i < 6; i++) noise(.04, .25, 2000 + i * 300, i * .07, 'bandpass'); },
    step() { tone(300, .05, 'triangle', .12, 0, 380); },
    tone, noise
  };
  return S;
})();

/* ---------- speech (Arabic TTS if available) ---------- */
const Voice = {
  ok: 'speechSynthesis' in window, v: null,
  init() {
    if (!this.ok) return;
    const pickV = () => { const vs = speechSynthesis.getVoices(); this.v = vs.find(x => /^ar/i.test(x.lang)) || null; };
    pickV(); try { speechSynthesis.onvoiceschanged = pickV; } catch (e) { }
  },
  speak(t) {
    if (!this.ok || Store.opt('muted')) return;
    try {
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(plain(t)); u.lang = this.v ? this.v.lang : 'ar-SA'; if (this.v) u.voice = this.v; u.rate = .88; u.pitch = 1.1;
      speechSynthesis.speak(u);
    } catch (e) { }
  },
  stop() { try { this.ok && speechSynthesis.cancel(); } catch (e) { } }
};
Voice.init();

/* ---------- helpers for visuals ---------- */
function rockEl(type, w) { const r = h('div', { class: 'rock ' + type }); if (w) r.style.setProperty('--w', typeof w === 'number' ? w + 'px' : w); return r; }
const ROCK_NAMES = { granite: 'الجرانيت', marble: 'الرخام', limestone: 'الحجر الجيري', sandstone: 'الحجر الرملي', slate: 'الأردواز', quartz: 'الكوارتز', diamond: 'الألماس' };
function starsHTML(n, max = 3) { let s = ''; for (let i = 0; i < max; i++) s += `<span class="${i < n ? 'on' : 'off'}">⭐</span>`; return `<span class="stars">${s}</span>`; }

/* scene builder: items [{e:'🐢', x:%, y:%, s:scale, n:'name', info:'...', cls:'swim', rock:'granite', w:px}]
   x is measured from the RIGHT (rtl-friendly) — 0 = right edge, 100 = left edge. */
function buildScene(bg, items, opts = {}) {
  const sc = h('div', { class: 'scene bg-' + bg, style: opts.style || '' });
  sc.style.width = '100%'; sc.style.height = '100%';
  (items || []).forEach(it => {
    const node = h('div', { class: 'it ' + (it.cls || ''), style: `right:${it.x}%;top:${it.y}%;--s:${it.s || 1}` });
    const inner = it.rock ? rockEl(it.rock, it.w || 70) : h('span', { class: 'e', text: it.e });
    if (it.rock) inner.classList.add('e');
    if (it.flip) inner.style.transform = 'scaleX(-1)';
    node.append(inner);
    node._it = it;
    sc.append(node);
  });
  return sc;
}

/* ---------- app state ---------- */
const App = {
  cur: null, // {lesson, compIndex}
  cleanup: [],
  unitColor(u) { return { 1: ['var(--u1)', 'var(--u1l)'], 2: ['var(--u2)', 'var(--u2l)'], 3: ['var(--u3)', 'var(--u3l)'], 0: ['var(--u0)', 'var(--u0l)'] }[u] || ['var(--u0)', 'var(--u0l)']; },
  setUnit(el, u) { const [c, l] = this.unitColor(u); el.style.setProperty('--uc', c); el.style.setProperty('--ucl', l); },
};

function allLessons() { const out = []; UNITS.forEach(u => u.lessons.forEach(l => out.push(l))); return out; }
function lessonById(id) { return allLessons().find(l => l.id === id); }
function compId(lesson, comp) { return lesson.id + ':' + comp.key; }
function lessonProgress(l) { const tot = l.comps.length * 3; let got = 0; l.comps.forEach(c => got += Store.get(compId(l, c))); return { got, tot, pct: tot ? got / tot : 0 }; }

/* ---------- top-level UI ---------- */
function topbar({ title, sub, back, hud }) {
  const bar = h('div', { class: 'topbar' });
  if (back) bar.append(h('button', { class: 'ibtn', title: 'رجوع', onclick: () => { SFX.click(); back(); } }, '➡️'));
  else bar.append(h('div', { class: 'ibtn', style: 'font-size:28px' }, '🔬'));
  bar.append(h('div', { class: 'ttl', html: `${title}${sub ? `<small>${sub}</small>` : ''}` }));
  const hd = h('div', { class: 'hud' }); bar.append(hd); if (hud) hd.append(hud);
  const snd = h('button', { class: 'ibtn', title: 'الصوت' }, Store.opt('muted') ? '🔇' : '🔊');
  snd.onclick = () => { Store.opt('muted', !Store.opt('muted')); snd.textContent = Store.opt('muted') ? '🔇' : '🔊'; if (Store.opt('muted')) Voice.stop(); else SFX.click(); };
  bar.append(snd);
  const fs = h('button', { class: 'ibtn', title: 'ملء الشاشة' }, '⛶');
  fs.onclick = () => { SFX.click(); try { if (!document.fullscreenElement) (document.documentElement.requestFullscreen || document.documentElement.webkitRequestFullscreen).call(document.documentElement); else document.exitFullscreen(); } catch (e) { } };
  if (document.documentElement.requestFullscreen || document.documentElement.webkitRequestFullscreen) bar.append(fs);
  bar._hud = hd;
  return bar;
}
function skyDecor() { return h('div', { class: 'sky-decor' }, h('div', { class: 'sun' }), h('div', { class: 'cloud c1' }), h('div', { class: 'cloud c2' }), h('div', { class: 'cloud c3' })); }

function runCleanup() { App.cleanup.forEach(f => { try { f(); } catch (e) { } }); App.cleanup = []; Voice.stop(); }
function mount(screen) { runCleanup(); const app = $('#app'); app.innerHTML = ''; app.append(screen); }

/* ---------- HOME ---------- */
function showHome() {
  App.cur = null;
  const scr = h('div', { class: 'screen' });
  scr.append(skyDecor());
  const sc = h('div', { class: 'scroll', style: 'position:relative;z-index:2' });
  sc.append(h('div', { class: 'home-head' },
    h('div', { class: 'logo' }, h('span', { class: 'big' }, '🤖'),
      h('div', {}, h('h1', { html: 'العلوم <span>مع روبو</span>' }), h('p', { text: 'الصف الثاني • الفصل الدراسي الأول' }))),
  ));
  const body = h('div', { class: 'home-body' });
  // overall progress
  let got = 0, tot = 0; allLessons().forEach(l => { const p = lessonProgress(l); got += p.got; tot += p.tot; });
  body.append(h('div', { class: 'overall' }, h('span', { style: 'font-size:30px' }, '🏆'),
    h('b', { text: 'نجومي:' }), h('div', { class: 'bar' }, h('i', { style: `width:${tot ? got / tot * 100 : 0}%` })), h('b', { text: `${got} ⭐` })));
  UNITS.forEach(u => {
    const sec = h('div', { class: 'unit' }); App.setUnit(sec, u.color);
    sec.append(h('div', { class: 'unit-h' }, u.num ? h('div', { class: 'num', text: u.num }) : h('div', { class: 'num', text: u.icon }), h('h2', { text: u.title }), u.num ? h('span', { class: 'ico', text: u.icon }) : null));
    const g = h('div', { class: 'lgrid' });
    u.lessons.forEach(l => {
      const p = lessonProgress(l);
      const card = h('button', { class: 'lcard' + (l.review ? ' review' : ''), onclick: () => { SFX.pop(); showLesson(l.id); } },
        l.no ? h('span', { class: 'no', text: l.no }) : null,
        h('span', { class: 'em', text: l.icon }), h('b', { text: l.title }),
        h('span', { class: 'st', text: `${p.got} / ${p.tot} ⭐` }),
        h('div', { class: 'prog' }, h('i', { style: `width:${p.pct * 100}%` })));
      g.append(card);
    });
    sec.append(g); body.append(sec);
  });
  sc.append(body);
  scr.prepend(topbar({ title: 'العلوم • الصف الثاني', sub: 'برنامج تفاعلي لكل دروس الكتاب' }));
  scr.append(sc);
  mount(scr);
}

/* ---------- LESSON PAGE ---------- */
const COMP_META = {
  slides: { icon: '🎬', label: 'العرض التقديمي', sub: 'شاهد واكتشف' },
  vocab: { icon: '📚', label: 'مفردات للتعلم', sub: 'اقلب البطاقات' },
  act: { icon: '🔬', label: 'النشاط', sub: 'نشاط تفاعلي' },
  g1: { icon: '🎮', label: 'لعبة', sub: 'اللعبة الأولى' },
  g2: { icon: '🕹️', label: 'لعبة', sub: 'اللعبة الثانية' },
  learn: { icon: '💡', label: 'ماذا تعلمت؟', sub: 'الخلاصة' },
  review: { icon: '🏁', label: 'تحقق من تقدمك', sub: 'أسئلة الكتاب' },
  dict: { icon: '📖', label: 'القاموس', sub: 'كل المصطلحات' },
};
function compTitle(c) { return c.title || COMP_META[c.key].label; }
function showLesson(id) {
  const l = lessonById(id); if (!l) return showHome();
  const scr = h('div', { class: 'screen' }); App.setUnit(scr, l.unit);
  scr.append(skyDecor());
  scr.append(topbar({ title: l.title, sub: l.unitTitle, back: showHome }));
  const sc = h('div', { class: 'scroll', style: 'position:relative;z-index:2' });
  sc.append(h('div', { class: 'lesson-hero' }, h('div', { class: 'em', text: l.icon }),
    h('div', {}, l.no ? h('span', { class: 'tag', text: 'الدرس ' + l.no }) : null, h('h2', { text: l.title }), h('p', { text: l.intro || '' }))));
  const g = h('div', { class: 'comp-grid' });
  l.comps.forEach((c, i) => {
    const m = COMP_META[c.key]; const st = Store.get(compId(l, c));
    g.append(h('button', { class: 'comp', onclick: () => { SFX.pop(); openComp(l.id, i); } },
      h('span', { class: 'step', text: i + 1 }),
      h('div', { class: 'ci', text: c.icon || m.icon }),
      h('div', { class: 'ct' }, h('small', { text: c.key === 'g1' || c.key === 'g2' ? '🎮 لعبة' : c.key === 'act' ? '🔬 نشاط' : m.sub }), h('b', { text: compTitle(c) }), h('span', { html: starsHTML(st) }))));
  });
  sc.append(g);
  scr.append(sc);
  mount(scr);
}

/* ---------- PLAYER + API ---------- */
function openComp(lessonId, idx) {
  const l = lessonById(lessonId); const c = l.comps[idx];
  App.cur = { l, idx };
  const scr = h('div', { class: 'screen' }); App.setUnit(scr, l.unit);
  const hud = h('div', { class: 'hud' });
  const bar = topbar({ title: compTitle(c), sub: `${l.no ? l.no + ' • ' : ''}${l.title}`, back: () => showLesson(l.id), hud });
  const stage = h('div', { id: 'stage' });
  scr.append(bar, stage);
  mount(scr);
  const api = makeApi(stage, hud, l, c, idx);
  let fn;
  if (c.key === 'slides') fn = runSlides;
  else if (c.key === 'vocab') fn = runVocab;
  else if (c.key === 'learn') fn = runLearned;
  else if (c.key === 'dict') fn = runDict;
  else fn = GAMES[c.id];
  if (!fn) { stage.append(h('div', { class: 'overlay' }, h('div', { class: 'ocard' }, h('div', { class: 'big', text: '🚧' }), h('h3', { text: 'قريبًا' })))); return; }
  try { const r = fn(api, l, c); if (r && r.catch) r.catch(e => console.error(e)); } catch (e) { console.error(e); }
}

function makeApi(stage, hud, lesson, comp, idx) {
  let alive = true;
  const timers = new Set(), intervals = new Set(), rafs = new Set(), listeners = [];
  App.cleanup.push(() => {
    alive = false; timers.forEach(clearTimeout); intervals.forEach(clearInterval); rafs.forEach(cancelAnimationFrame);
    listeners.forEach(([t, e, f, o]) => t.removeEventListener(e, f, o));
  });
  const api = {
    stage, lesson, comp, h, $, $$, shuffle, rand, randi, pick, sleep: ms => new Promise(r => api.timeout(r, ms)), clamp, md, plain,
    sfx: SFX, speak: t => Voice.speak(t), rockEl, ROCK_NAMES, buildScene,
    get alive() { return alive; },
    timeout(fn, ms) { const t = setTimeout(() => { timers.delete(t); if (alive) fn(); }, ms); timers.add(t); return t; },
    interval(fn, ms) { const t = setInterval(() => { if (alive) fn(); }, ms); intervals.add(t); return t; },
    clearTimer(t) { clearTimeout(t); clearInterval(t); timers.delete(t); intervals.delete(t); },
    /* loop(fn(dt, t)) returns stop() ; fn returning false stops */
    loop(fn) {
      let last = performance.now(), id, stopped = false;
      const step = now => { if (!alive || stopped) return; const dt = Math.min(.05, (now - last) / 1000); last = now; const r = fn(dt, now); rafs.delete(id); if (r === false) return; id = requestAnimationFrame(step); rafs.add(id); };
      id = requestAnimationFrame(step); rafs.add(id);
      return () => { stopped = true; cancelAnimationFrame(id); };
    },
    on(target, ev, fn, opt) { target.addEventListener(ev, fn, opt); listeners.push([target, ev, fn, opt]); },
    onCleanup(fn) { App.cleanup.push(fn); },
    clear() { stage.innerHTML = ''; },
    /* the main content container for a game */
    root(cls = '', style = '') { const r = h('div', { class: 'stage-inner ' + cls, style }); stage.append(r); return r; },
    hud(html) { hud.innerHTML = ''; if (html == null) return; if (typeof html === 'string') hud.append(h('span', { class: 'chip', html })); else hud.append(html); },
    setScore(n, total) { api.hud(`⭐ ${n}${total != null ? ' / ' + total : ''}`); },
    feedback(ok, msg) {
      const f = h('div', { class: 'fb ' + (ok === true ? 'good' : ok === false ? 'bad' : 'info'), text: msg || (ok ? pick(['أحسنت! 👏', 'رائع! 🌟', 'ممتاز! 🎉', 'صحيح! ✅', 'بطل! 💪']) : pick(['حاول مرة أخرى 🙂', 'ليس تمامًا 🤔', 'فكّر مجددًا 💭'])) });
      stage.append(f); api.timeout(() => f.remove(), 1450);
      if (ok === true) SFX.correct(); else if (ok === false) SFX.wrong();
    },
    good(msg) { api.feedback(true, msg); },
    bad(msg) { api.feedback(false, msg); },
    info(msg) { api.feedback(null, msg); },
    confetti(n = 70) {
      const cols = ['#ffd23f', '#ff6b6b', '#4dabf7', '#51cf66', '#cc5de8', '#ff922b'];
      for (let i = 0; i < n; i++) {
        const c = h('div', { class: 'confetti', style: `left:${Math.random() * 100}%;background:${pick(cols)};animation-duration:${rand(1.6, 3.2)}s;animation-delay:${rand(0, .5)}s;transform:rotate(${rand(0, 360)}deg)` });
        stage.append(c); api.timeout(() => c.remove(), 4000);
      }
    },
    /* intro card -> Promise */
    intro({ icon, title, text, need, btn }) {
      return new Promise(res => {
        const ov = h('div', { class: 'overlay' });
        const card = h('div', { class: 'ocard' }, h('div', { class: 'big', text: icon || comp.icon || '🎮' }), h('h3', { text: title || compTitle(comp) }),
          h('p', { html: md(text || '') }));
        if (need && need.length) card.append(h('div', { class: 'need', html: `<b>🧰 ستحتاج إلى:</b> ${need.join('، ')}` }));
        const row = h('div', { class: 'brow' });
        row.append(h('button', { class: 'btn ghost', onclick: () => { SFX.click(); Voice.speak((title || '') + '. ' + (text || '')); } }, '🔊 استمع'));
        row.append(h('button', { class: 'btn', onclick: () => { SFX.unlock(); SFX.whoosh(); Voice.stop(); ov.remove(); res(); } }, btn || 'ابدأ ▶'));
        card.append(row); ov.append(card); stage.append(ov);
      });
    },
    /* generic modal: returns Promise with index of button clicked */
    modal({ icon, title, text, html, buttons = ['حسنًا'] }) {
      return new Promise(res => {
        const ov = h('div', { class: 'overlay' });
        const card = h('div', { class: 'ocard' }, icon ? h('div', { class: 'big', text: icon }) : null, title ? h('h3', { text: title }) : null, text ? h('p', { html: md(text) }) : null);
        if (html) card.append(typeof html === 'string' ? h('div', { html }) : html);
        const row = h('div', { class: 'brow' });
        buttons.forEach((b, i) => row.append(h('button', { class: 'btn' + (i > 0 ? ' ghost' : ''), onclick: () => { SFX.click(); ov.remove(); res(i); } }, b)));
        card.append(row); ov.append(card); stage.append(ov);
      });
    },
    /* finish: stars 1..3 */
    finish(stars = 3, msg) {
      stars = clamp(Math.round(stars), 1, 3);
      Store.set(compId(lesson, comp), stars);
      SFX.win(); api.confetti();
      const ov = h('div', { class: 'overlay' });
      const next = lesson.comps[idx + 1];
      const card = h('div', { class: 'ocard' },
        h('div', { class: 'endstars', html: [1, 2, 3].map(i => `<span style="${i > stars ? 'filter:grayscale(1);opacity:.3' : ''}">⭐</span>`).join('') }),
        h('h3', { text: stars === 3 ? 'ممتاز! أنت بطل العلوم 🏆' : stars === 2 ? 'أحسنت! عمل رائع 👏' : 'جيد! يمكنك أن تتحسن 💪' }),
        msg ? h('p', { html: md(msg) }) : null);
      const row = h('div', { class: 'brow' });
      row.append(h('button', { class: 'btn ghost', onclick: () => { SFX.click(); openComp(lesson.id, idx); } }, '🔁 مرة أخرى'));
      row.append(h('button', { class: 'btn ghost', onclick: () => { SFX.click(); showLesson(lesson.id); } }, '📚 الدرس'));
      if (next) row.append(h('button', { class: 'btn gold', onclick: () => { SFX.click(); openComp(lesson.id, idx + 1); } }, 'التالي ⬅️'));
      else row.append(h('button', { class: 'btn gold', onclick: () => { SFX.click(); showHome(); } }, '🏠 الرئيسية'));
      card.append(row); ov.append(card); stage.append(ov);
      api.timeout(() => [1, 2, 3].slice(0, stars).forEach((_, i) => api.timeout(() => SFX.star(), i * 250)), 200);
    },
    /* drag helper. opts: {onStart(el,pt), onMove(el,pt), onDrop(el,pt) -> true keeps (callback should reposition), false returns} */
    draggable(el, opts = {}) {
      el.style.touchAction = 'none'; el.style.cursor = 'grab';
      let sx, sy, dragging = false, pid = null;
      const down = e => {
        if (el.dataset.locked) return; if (e.button !== undefined && e.button > 0) return;
        e.preventDefault(); dragging = true; pid = e.pointerId; sx = e.clientX; sy = e.clientY;
        try { el.setPointerCapture(pid); } catch (_) { }
        el.style.transition = 'none'; el.style.zIndex = 40; el.classList.add('dragging');
        SFX.pick(); opts.onStart && opts.onStart(el, { x: e.clientX, y: e.clientY });
      };
      const move = e => { if (!dragging || e.pointerId !== pid) return; const dx = e.clientX - sx, dy = e.clientY - sy; el.style.translate = `${dx}px ${dy}px`; opts.onMove && opts.onMove(el, { x: e.clientX, y: e.clientY }); };
      const up = e => {
        if (!dragging || e.pointerId !== pid) return; dragging = false; el.classList.remove('dragging');
        const pt = { x: e.clientX, y: e.clientY };
        const ok = opts.onDrop ? opts.onDrop(el, pt) : false;
        if (ok) { el.style.translate = ''; el.style.zIndex = ''; }
        else { el.style.transition = 'translate .3s cubic-bezier(.3,1.5,.5,1)'; el.style.translate = '0px 0px'; api.timeout(() => { el.style.zIndex = ''; el.style.transition = ''; el.style.translate = ''; }, 320); }
      };
      el.addEventListener('pointerdown', down); el.addEventListener('pointermove', move); el.addEventListener('pointerup', up); el.addEventListener('pointercancel', up);
    },
    /* returns first element in list whose rect contains the point (pad px) */
    hit(pt, els, pad = 6) { for (const t of els) { const r = t.getBoundingClientRect(); if (pt.x >= r.left - pad && pt.x <= r.right + pad && pt.y >= r.top - pad && pt.y <= r.bottom + pad) return t; } return null; },
    /* relative coords inside an element */
    rel(pt, el) { const r = el.getBoundingClientRect(); return { x: pt.x - r.left, y: pt.y - r.top, w: r.width, h: r.height }; },
  };
  return api;
}

/* ================= SLIDES ENGINE ================= */
const SLIDE_SPECIAL = {}; // name -> function(container, api, slide)
function renderVisual(v, api) {
  const box = h('div', { class: 'vis-fill' });
  if (!v) return box;
  if (v.type === 'scene') {
    const sc = buildScene(v.bg, v.items); box.append(sc);
    const tappable = v.items.filter(i => i.n);
    let found = 0; const counter = tappable.length ? h('div', { class: 'counter', text: `🔍 0 / ${tappable.length}` }) : null;
    if (counter) sc.append(counter);
    if (v.hint !== false && tappable.length) sc.append(h('div', { class: 'hint', text: v.hint || '👆 اضغط على الأشياء لتتعرف عليها' }));
    $$('.it', sc).forEach(node => {
      const it = node._it; if (!it.n) return;
      node.onclick = () => {
        if (it.collect) { SFX.pop(); node.style.transition = 'transform .4s, opacity .4s'; node.style.transform = 'translate(50%,-50%) scale(0)'; node.style.opacity = 0; }
        else SFX.pop();
        if (!node.classList.contains('found')) {
          node.classList.add('found'); found++; if (counter) counter.textContent = `🔍 ${found} / ${tappable.length}`;
          if (found === tappable.length) { api.timeout(() => { SFX.magic(); }, 300); }
        }
        $$('.tag-lbl', sc).forEach(t => t.remove());
        if (!it.collect) node.append(h('div', { class: 'tag-lbl', text: it.n }));
        api.speak(it.info || it.n);
      };
    });
  } else if (v.type === 'reveal') {
    const g = h('div', { class: 'cards' });
    v.items.forEach(it => {
      const c = h('div', { class: 'fcard' }, h('div', { class: 'in' }, h('div', { class: 'f', text: it.q || '؟' }), h('div', { class: 'b' }, h('div', { class: 'e', text: it.e }), h('b', { html: md(it.t) }), it.d ? h('small', { text: it.d }) : null)));
      c.onclick = () => { c.classList.toggle('open'); SFX.flip(); if (c.classList.contains('open')) api.speak(it.t + (it.d ? '. ' + it.d : '')); };
      g.append(c);
    });
    box.append(g);
  } else if (v.type === 'gallery') {
    const g = h('div', { class: 'gal' });
    v.items.forEach(it => {
      const vis = it.rock ? rockEl(it.rock, 70) : h('div', { class: 'e', text: it.e });
      const c = h('div', { class: 'gitem' }, vis, h('b', { text: it.t }), h('div', { class: 'inf', html: md(it.info || '') }));
      c.onclick = () => { const o = c.classList.toggle('open'); SFX.pop(); if (o) api.speak(it.t + '. ' + (it.info || '')); };
      g.append(c);
    });
    box.append(g);
  } else if (v.type === 'quiz') {
    const q = h('div', { class: 'qbox' }, h('div', { class: 'q', html: md(v.q) }));
    const opts = h('div', { class: 'qopts' }); const fb = h('div', { class: 'qfb' });
    const multi = Array.isArray(v.a);
    let chosen = new Set(), done = false;
    v.opts.forEach((o, i) => {
      const b = h('button', { class: 'qopt', html: md(o) });
      b.onclick = () => {
        if (done) return;
        if (multi) {
          if (v.a.includes(i)) { b.classList.add('ok'); chosen.add(i); SFX.correct(); if (v.a.every(x => chosen.has(x))) { done = true; fb.innerHTML = md(v.fb || 'أحسنت! 🎉'); api.speak(v.fb || 'أحسنت'); } }
          else { b.classList.add('no'); SFX.wrong(); b.classList.add('shake'); }
        } else {
          if (i === v.a) { done = true; b.classList.add('ok'); SFX.correct(); fb.innerHTML = md(v.fb || 'أحسنت! 🎉'); api.speak(v.fb || 'أحسنت'); }
          else { b.classList.add('no', 'shake'); SFX.wrong(); api.timeout(() => b.classList.remove('shake'), 400); }
        }
      };
      opts.append(b);
    });
    q.append(opts, fb); box.append(q);
  } else if (v.type === 'compare') {
    const wrap = h('div', { style: 'display:flex;gap:10px;height:100%;flex-wrap:wrap' });
    [v.a, v.b].forEach(side => {
      const col = h('div', { style: 'flex:1 1 220px;min-height:150px;display:flex;flex-direction:column;gap:6px' },
        h('div', { style: 'text-align:center;font-weight:900;background:#fff;border-radius:14px;padding:2px 8px;box-shadow:var(--sh)', text: side.title }));
      const inner = renderVisual({ type: 'scene', bg: side.bg, items: side.items, hint: false }, api);
      inner.style.flex = '1'; col.append(inner); wrap.append(col);
    });
    box.append(wrap);
  } else if (v.type === 'special') {
    const fn = SLIDE_SPECIAL[v.name]; if (fn) fn(box, api, v);
  } else if (v.type === 'big') {
    box.append(h('div', { style: 'height:100%;display:grid;place-items:center;text-align:center' }, h('div', {}, h('div', { class: 'float', style: 'font-size:clamp(70px,16vmin,150px);line-height:1.1', text: v.e }), v.t ? h('div', { style: 'font-weight:900;font-size:1.3em', text: v.t }) : null)));
  }
  return box;
}

function runSlides(api, l) {
  const S = l.slides; let i = 0; const seen = new Set();
  const root = api.root(); const wrap = h('div', { class: 'slides' }); root.append(wrap);
  const title = h('div', { class: 'sl-title' });
  const sp = h('button', { class: 'spbtn', title: 'استمع' }, '🔊');
  const top = h('div', { class: 'sl-top' }, title, sp);
  const body = h('div', { class: 'sl-body' });
  const prev = h('button', { class: 'btn ghost sm' }, '➡️ السابق');
  const next = h('button', { class: 'btn sm' }, 'التالي ⬅️');
  const dots = h('div', { class: 'dots' }, S.map(() => h('i')));
  wrap.append(top, body, h('div', { class: 'sl-nav' }, prev, dots, next));
  function show(k, dir) {
    i = k; seen.add(i); const s = S[i]; Voice.stop();
    title.innerHTML = md(s.t);
    body.innerHTML = '';
    const vis = h('div', { class: 'sl-visual anim-in' }); vis.append(renderVisual(s.v, api));
    body.append(vis);
    if (s.p && s.p.length) body.append(h('div', { class: 'sl-text anim-in' }, ...s.p.map(p => h('p', { html: md(p) }))));
    else vis.style.flex = '1';
    $$('i', dots).forEach((d, j) => d.classList.toggle('on', j === i));
    prev.disabled = i === 0; prev.style.visibility = i === 0 ? 'hidden' : 'visible';
    next.innerHTML = i === S.length - 1 ? 'إنهاء ✅' : 'التالي ⬅️';
    api.hud(`🎬 ${i + 1} / ${S.length}`);
  }
  sp.onclick = () => { SFX.click(); const s = S[i]; api.speak([s.t, ...(s.p || [])].join('. ')); };
  prev.onclick = () => { if (i > 0) { SFX.whoosh(); show(i - 1); } };
  next.onclick = () => { if (i < S.length - 1) { SFX.whoosh(); show(i + 1); } else { api.finish(3, 'أنهيت العرض التقديمي للدرس. هيا إلى الخطوة التالية!'); } };
  // swipe support
  let sx = null; api.on(body, 'pointerdown', e => { sx = e.clientX; }); api.on(body, 'pointerup', e => { if (sx == null) return; const dx = e.clientX - sx; sx = null; if (Math.abs(dx) > 90 && !e.target.closest('.it,.fcard,.gitem,.qopt,button,input,.nosw')) { if (dx > 0 && i < S.length - 1) next.onclick(); else if (dx < 0 && i > 0) prev.onclick(); } });
  show(0);
}

  GAMES['act-1-1'] = async function (api, lesson, comp) {
    await api.intro({ icon: '🔎', title: comp.title, text: 'هيا نخرج إلى ساحة المدرسة! اخترنا [[مكانين مختلفين]]: مكانًا جافًا مشمسًا ومكانًا رطبًا ظليلًا. سنقيس المساحة، ثم نبحث بالعدسة المكبرة عن [[الحشرات]] و[[النباتات]] و[[نسجّلها]]، ثم نقارن.', need: comp.need });
