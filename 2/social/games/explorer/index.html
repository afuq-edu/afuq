<!doctype html>
<html lang="ar" dir="rtl">
<head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="theme-color" content="#BFE6FF">
<title>الهوية والمواطنة ٢ — تفاعلي</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;600;700;800&family=Noto+Naskh+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --u1:#EF5B2B;--u1d:#C8431A;--u1b:#FFE9DF;
  --u2:#6B4FA3;--u2d:#523A85;--u2b:#F0EAFF;
  --u3:#0FA3A3;--u3d:#0B7F80;--u3b:#DDF6F4;
  --u0:#D62839;--u0d:#A81C2B;--u0b:#FFE7EA;
  --sun:#FFC93C;--ink:#22324A;--muted:#667691;--card:#FFFFFF;--line:#E6ECF4;
  --ok:#1FB373;--okb:#E3F8EE;--bad:#F0525B;--badb:#FFE9EA;--sky1:#BFE6FF;--sky2:#EAF7FF;--sand:#FFF6E3;
  --r:22px;--sh:0 10px 30px rgba(34,50,74,.10),0 2px 6px rgba(34,50,74,.06);
  --uc:var(--u1);--ucd:var(--u1d);--ucb:var(--u1b);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;min-height:100%;}
body{font-family:'Baloo Bhaijaan 2','Noto Naskh Arabic',system-ui,sans-serif;color:var(--ink);background:linear-gradient(180deg,var(--sky1) 0%,var(--sky2) 42%,var(--sand) 100%);background-attachment:fixed;overflow-x:hidden;user-select:none;-webkit-user-select:none}
.nx{font-family:'Noto Naskh Arabic','Baloo Bhaijaan 2',serif}
button{font-family:inherit;cursor:pointer;border:0;color:inherit}
input,textarea{font-family:'Noto Naskh Arabic',serif;font-size:1.1rem;user-select:text;-webkit-user-select:text}
/* sky decoration */
.sky{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.sky .sunw{position:absolute;top:-40px;left:-40px;width:210px;height:210px}
.sky .sunw svg{width:100%;height:100%;animation:spin 60s linear infinite}
.cloud{position:absolute;opacity:.9;animation:drift linear infinite}
.cloud svg{display:block}
@keyframes drift{from{transform:translateX(110vw)}to{transform:translateX(-40vw)}}
@keyframes spin{to{transform:rotate(360deg)}}
.hills{position:fixed;bottom:0;left:0;right:0;height:120px;pointer-events:none;z-index:0;opacity:.55}
#app{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column}
/* top bar */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:10px 14px;background:rgba(255,255,255,.82);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid rgba(255,255,255,.9);box-shadow:0 4px 18px rgba(34,50,74,.06)}
.top .ttl{flex:1;min-width:0;font-weight:800;font-size:1.15rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .ttl small{display:block;font-size:.78rem;color:var(--muted);font-weight:600}
.ib{width:44px;height:44px;border-radius:14px;background:#fff;box-shadow:var(--sh);display:grid;place-items:center;font-size:1.3rem;flex:none;transition:transform .15s}
.ib:active{transform:scale(.92)}
.starpill{display:flex;align-items:center;gap:6px;background:#FFF4CC;border-radius:99px;padding:6px 14px;font-weight:800;box-shadow:inset 0 0 0 2px #FFE08A}
.wrap{width:100%;max-width:1180px;margin:0 auto;padding:18px 16px 60px;flex:1}
/* home */
.hero{display:grid;grid-template-columns:1.2fr 1fr;gap:18px;align-items:center;background:rgba(255,255,255,.75);border-radius:32px;padding:22px 26px;box-shadow:var(--sh);position:relative;overflow:hidden}
.hero h1{margin:0;font-size:clamp(2rem,5vw,3.2rem);line-height:1.15;color:var(--u0)}
.hero h1 span{color:#18954A}
.hero p{margin:.4rem 0 0;color:var(--muted);font-size:1.1rem}
.hero .fam{display:flex;justify-content:center;align-items:flex-end;gap:0}
.namebox{margin-top:14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.namebox input{border:2px solid var(--line);border-radius:14px;padding:10px 14px;min-width:0;flex:1;max-width:280px;background:#fff}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:6px 14px;background:#fff;box-shadow:inset 0 0 0 2px var(--line);font-weight:700;font-size:.95rem}
.sec-t{font-size:1.5rem;font-weight:800;margin:28px 4px 12px;display:flex;align-items:center;gap:10px}
.units{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}
.ucard{position:relative;border-radius:28px;padding:18px;background:#fff;box-shadow:var(--sh);text-align:right;overflow:hidden;transition:transform .2s,box-shadow .2s;display:flex;flex-direction:column;gap:10px;min-height:250px}
.ucard:hover{transform:translateY(-4px)}
.ucard .band{position:absolute;inset:0 0 auto 0;height:110px;background:var(--c)}
.ucard .band:after{content:"";position:absolute;left:-10%;right:-10%;bottom:-38px;height:70px;background:#fff;border-radius:50%}
.ucard .uh{position:relative;color:#fff;font-weight:800;font-size:1rem;opacity:.95}
.ucard .un{position:relative;color:#fff;font-weight:800;font-size:1.7rem;line-height:1.1}
.ucard .uart{position:absolute;left:10px;top:8px;width:110px;height:110px}
.ucard .ls{position:relative;display:flex;flex-direction:column;gap:6px;margin-top:22px}
.ucard .ls div{display:flex;align-items:center;gap:8px;font-weight:700;color:var(--ink)}
.dot{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--cb);color:var(--c);font-size:.85rem;font-weight:800;flex:none}
.prog{height:10px;border-radius:9px;background:#EEF2F7;overflow:hidden;margin-top:auto}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--c),var(--sun));border-radius:9px;transition:width .6s}
.introcard{display:flex;gap:16px;align-items:center;border-radius:28px;padding:16px 20px;background:#fff;box-shadow:var(--sh);text-align:right;width:100%}
.introcard .flagmini{width:110px;flex:none}
/* unit page */
.uhead{border-radius:30px;padding:20px 24px;color:#fff;background:linear-gradient(135deg,var(--uc),var(--ucd));box-shadow:var(--sh);display:grid;grid-template-columns:1fr auto;gap:16px;align-items:center;position:relative;overflow:hidden}
.uhead h2{margin:0;font-size:2rem}
.uhead ul{margin:.5rem 0 0;padding:0 18px 0 0;line-height:1.9}
.circles{width:170px}
.lgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px;margin-top:18px}
.lcard{background:#fff;border-radius:26px;padding:18px;box-shadow:var(--sh);text-align:right;display:flex;flex-direction:column;gap:10px;transition:transform .2s;position:relative;overflow:hidden}
.lcard:hover{transform:translateY(-3px)}
.lcard .ln{display:inline-block;background:var(--ucb);color:var(--ucd);font-weight:800;border-radius:99px;padding:3px 12px;font-size:.9rem}
.lcard h3{margin:0;font-size:1.5rem}
.lcard .lart{height:130px;border-radius:18px;background:var(--ucb);overflow:hidden;display:grid;place-items:center}
.lcard .lart svg{height:100%;width:100%}
.steps5{display:flex;gap:6px}
.steps5 span{flex:1;height:8px;border-radius:6px;background:#EEF2F7}
.steps5 span.on{background:var(--uc)}
/* lesson hub */
.lhub{display:grid;grid-template-columns:320px 1fr;gap:18px;align-items:start}
.lside{background:#fff;border-radius:28px;padding:18px;box-shadow:var(--sh);position:sticky;top:80px}
.lside h2{margin:.2rem 0 .4rem;font-size:1.7rem;color:var(--ucd)}
.lside .box{border-radius:18px;background:var(--ucb);padding:10px 14px;margin-top:10px}
.lside .box b{display:block;color:var(--ucd);margin-bottom:4px}
.lside .box span{display:inline-block;background:#fff;border-radius:99px;padding:2px 10px;margin:3px 0 3px 4px;font-size:.92rem}
.trail{display:flex;flex-direction:column;gap:14px}
.station{display:grid;grid-template-columns:84px 1fr auto;gap:14px;align-items:center;background:#fff;border-radius:24px;padding:14px 16px;box-shadow:var(--sh);text-align:right;transition:transform .15s;position:relative}
.station:hover{transform:translateX(-4px)}
.station .si{width:84px;height:84px;border-radius:22px;display:grid;place-items:center;font-size:2.6rem;background:var(--ucb)}
.station h4{margin:0;font-size:1.3rem}
.station p{margin:.1rem 0 0;color:var(--muted);font-size:.98rem}
.station .st{font-size:1.5rem}
.station.done .si{background:var(--okb)}
.station .num{position:absolute;top:-8px;right:-8px;width:30px;height:30px;border-radius:50%;background:var(--uc);color:#fff;display:grid;place-items:center;font-weight:800;box-shadow:0 3px 8px rgba(0,0,0,.15)}
/* generic panel */
.panel{background:#fff;border-radius:28px;box-shadow:var(--sh);padding:20px;position:relative}
.ptitle{display:flex;align-items:center;gap:10px;margin:0 0 12px;font-size:1.5rem}
.ptitle .pi{width:48px;height:48px;border-radius:14px;background:var(--ucb);display:grid;place-items:center;font-size:1.6rem}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:16px;padding:12px 22px;font-size:1.1rem;font-weight:800;background:var(--uc);color:#fff;box-shadow:0 5px 0 var(--ucd);transition:transform .1s,box-shadow .1s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ucd)}
.btn.ghost{background:#fff;color:var(--ucd);box-shadow:0 5px 0 #D6DEE9,inset 0 0 0 2px #E6ECF4}
.btn.ok{background:var(--ok);box-shadow:0 5px 0 #138a57}
.btn.sun{background:var(--sun);color:#5a3d00;box-shadow:0 5px 0 #d9a31f}
.btn[disabled]{opacity:.45;pointer-events:none}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.center{text-align:center}
.mt{margin-top:14px}
.muted{color:var(--muted)}
/* levels */
.levels{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-top:10px}
.lvl{border-radius:24px;padding:18px;background:#fff;box-shadow:inset 0 0 0 3px var(--line);text-align:center;transition:transform .15s,box-shadow .15s;position:relative}
.lvl:hover{transform:translateY(-3px)}
.lvl .le{font-size:3rem}
.lvl h4{margin:.3rem 0;font-size:1.35rem}
.lvl p{margin:0;color:var(--muted)}
.lvl.rec{box-shadow:inset 0 0 0 3px var(--sun),0 8px 20px rgba(255,201,60,.35)}
.lvl.rec:after{content:"مُقتَرَح لك ⭐";position:absolute;top:-12px;left:50%;transform:translateX(-50%);background:var(--sun);color:#5a3d00;border-radius:99px;padding:2px 12px;font-size:.85rem;font-weight:800;white-space:nowrap}
/* exercise */
.exhead{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.exbar{flex:1;height:14px;border-radius:9px;background:#EEF2F7;overflow:hidden}
.exbar i{display:block;height:100%;background:linear-gradient(90deg,var(--uc),var(--sun));transition:width .4s}
.qbox{background:var(--ucb);border-radius:22px;padding:16px 18px;display:flex;gap:12px;align-items:flex-start;margin-bottom:14px}
.qbox .qt{flex:1;font-size:1.45rem;font-weight:700;line-height:1.7}
.qart{display:flex;justify-content:center;margin:6px 0 12px}
.qart .em{font-size:4.2rem;line-height:1.1}
.say{width:46px;height:46px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:1.3rem;flex:none;box-shadow:0 3px 8px rgba(0,0,0,.08)}
.say.on{animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.12);box-shadow:0 0 0 8px rgba(255,201,60,.35)}}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.opt{background:#fff;border-radius:18px;padding:14px 16px;font-size:1.3rem;font-weight:700;box-shadow:inset 0 0 0 3px var(--line),0 4px 0 #E1E8F1;text-align:center;transition:transform .12s,background .2s;line-height:1.5;display:flex;align-items:center;justify-content:center;gap:10px;min-height:70px}
.opt .oe{font-size:2rem}
.opt:active{transform:scale(.97)}
.opt.big{flex-direction:column;min-height:150px}
.opt.big .oe{font-size:3.6rem}
.opt.good{background:var(--okb);box-shadow:inset 0 0 0 3px var(--ok),0 4px 0 #9fdcbf}
.opt.badd{background:var(--badb);box-shadow:inset 0 0 0 3px var(--bad),0 4px 0 #f3b3b6;animation:shake .4s}
.opt.hint{box-shadow:inset 0 0 0 3px var(--sun),0 0 0 6px rgba(255,201,60,.3)}
.opt.dim{opacity:.4}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.tfrow{display:flex;gap:18px;justify-content:center}
.tfb{width:150px;height:130px;border-radius:26px;font-size:3.6rem;background:#fff;box-shadow:inset 0 0 0 3px var(--line),0 5px 0 #E1E8F1;display:flex;flex-direction:column;align-items:center;justify-content:center}
.tfb small{font-size:1.1rem;font-weight:800}
.fb{min-height:48px;margin-top:12px;text-align:center;font-size:1.3rem;font-weight:800}
.fb.ok{color:var(--ok)}.fb.no{color:var(--bad)}
/* sort / order / match */
.pool{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;min-height:64px;padding:10px;border-radius:18px;background:#F6F8FB;margin-bottom:12px}
.card{background:#fff;border-radius:14px;padding:10px 16px;font-size:1.2rem;font-weight:700;box-shadow:inset 0 0 0 2px var(--line),0 4px 0 #E1E8F1;touch-action:none;transition:transform .12s,box-shadow .12s;display:inline-flex;align-items:center;gap:8px}
.card.sel{box-shadow:inset 0 0 0 3px var(--sun),0 0 0 6px rgba(255,201,60,.35);transform:translateY(-3px)}
.card.drag{position:fixed;z-index:999;pointer-events:none;transform:scale(1.08) rotate(-2deg);box-shadow:0 12px 30px rgba(0,0,0,.2)}
.card.okc{box-shadow:inset 0 0 0 3px var(--ok);background:var(--okb)}
.card.noc{box-shadow:inset 0 0 0 3px var(--bad);background:var(--badb);animation:shake .4s}
.bins{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.bin{border-radius:22px;padding:12px;min-height:170px;background:var(--ucb);border:3px dashed rgba(0,0,0,.08);transition:transform .15s,background .2s;display:flex;flex-direction:column;gap:8px;align-items:center}
.bin.over{transform:scale(1.02);background:#FFF4CC}
.bin h5{margin:0;font-size:1.3rem;display:flex;align-items:center;gap:8px}
.bin .bi{font-size:2.4rem}
.bin .cards{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.slots{display:flex;flex-direction:column;gap:10px}
.slot{display:flex;align-items:center;gap:10px;min-height:60px;border-radius:16px;background:#F6F8FB;border:3px dashed #D9E1EC;padding:6px 10px}
.slot b{width:38px;height:38px;border-radius:50%;background:var(--uc);color:#fff;display:grid;place-items:center;flex:none;font-size:1.1rem}
.mcols{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.mcol{display:flex;flex-direction:column;gap:10px}
.mcard{background:#fff;border-radius:16px;padding:12px;font-size:1.2rem;font-weight:700;box-shadow:inset 0 0 0 3px var(--line),0 4px 0 #E1E8F1;min-height:62px;display:flex;align-items:center;justify-content:center;gap:8px;text-align:center}
.mcard .oe{font-size:2rem}
.mcard.sel{box-shadow:inset 0 0 0 3px var(--sun),0 0 0 6px rgba(255,201,60,.35)}
.mcard.done{opacity:.9}
.fillq{font-size:1.5rem;line-height:2.2;text-align:center;font-weight:700}
.blank{display:inline-block;min-width:120px;border-bottom:4px dashed var(--uc);margin:0 6px;color:var(--ucd);padding:0 8px}
/* results */
.res{text-align:center;padding:10px}
.res .big{font-size:4rem}
.res h3{font-size:2rem;margin:.2rem 0}
.stars3{font-size:3rem;letter-spacing:6px}
.stars3 .off{filter:grayscale(1);opacity:.3}
.cmp{display:flex;gap:26px;justify-content:center;align-items:flex-end;height:210px;margin:16px auto;max-width:420px}
.cmp .col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:6px}
.cmp .bar{width:80px;border-radius:14px 14px 6px 6px;transition:height 1s;display:flex;align-items:flex-start;justify-content:center;color:#fff;font-weight:800;padding-top:6px;min-height:34px}
/* slides */
.stage{background:#fff;border-radius:30px;box-shadow:var(--sh);overflow:hidden;position:relative}
.stage.fs{position:fixed;inset:0;z-index:60;border-radius:0}
.sl{display:grid;grid-template-columns:1.05fr 1fr;min-height:520px}
.sl .sart{background:var(--ucb);position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden}
.sl .sart svg{width:100%;height:100%;max-height:560px}
.sl .stxt{padding:26px 28px 90px;display:flex;flex-direction:column;gap:12px}
.sl h3{margin:0;font-size:2rem;color:var(--ucd)}
.sl .kick{display:inline-block;background:var(--ucb);color:var(--ucd);border-radius:99px;padding:3px 14px;font-weight:800;font-size:.95rem;align-self:flex-start}
.line{font-family:'Noto Naskh Arabic',serif;font-size:1.55rem;line-height:2;padding:6px 12px;border-radius:14px;opacity:0;transform:translateY(12px);transition:all .45s;display:flex;gap:10px;align-items:flex-start}
.line.show{opacity:1;transform:none}
.line.cur{background:#FFF7D6;box-shadow:inset 4px 0 0 var(--sun)}
.line .ls{width:36px;height:36px;border-radius:50%;background:var(--ucb);display:grid;place-items:center;font-size:1rem;flex:none;margin-top:6px}
.line em{font-style:normal;color:var(--u0);font-weight:700}
.snav{position:absolute;bottom:0;left:0;right:0;display:flex;align-items:center;gap:10px;padding:12px 16px;background:linear-gradient(0deg,#fff 70%,rgba(255,255,255,0))}
.sdots{flex:1;display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.sdots i{width:10px;height:10px;border-radius:50%;background:#DCE3ED;transition:all .3s}
.sdots i.on{background:var(--uc);width:26px;border-radius:6px}
.flip{perspective:900px;height:170px}
.flip .in{position:relative;width:100%;height:100%;transition:transform .6s;transform-style:preserve-3d}
.flip.on .in{transform:rotateY(180deg)}
.flip .f,.flip .b{position:absolute;inset:0;border-radius:20px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px;text-align:center}
.flip .f{background:linear-gradient(135deg,var(--uc),var(--ucd));color:#fff;font-size:1.4rem;font-weight:800}
.flip .f .fe{font-size:2.6rem}
.flip .b{background:var(--ucb);transform:rotateY(180deg);font-size:1.15rem;font-weight:700;line-height:1.6}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.hot{position:absolute;width:44px;height:44px;border-radius:50%;background:var(--sun);color:#5a3d00;font-weight:800;display:grid;place-items:center;box-shadow:0 0 0 6px rgba(255,201,60,.35);animation:pulse 1.6s infinite;transform:translate(50%,-50%)}
.hot.seen{animation:none;background:var(--ok);color:#fff;box-shadow:none}
.bubble{background:#fff;border-radius:20px;padding:12px 16px;box-shadow:var(--sh);font-size:1.25rem;font-weight:700;position:relative}
.goalli{display:flex;gap:12px;align-items:center;background:var(--ucb);border-radius:16px;padding:10px 14px;font-size:1.25rem;font-weight:700;opacity:0;transform:translateX(-20px);transition:all .5s}
.goalli.show{opacity:1;transform:none}
.goalli .ge{font-size:1.8rem}
/* toast & confetti */
.toast{position:fixed;left:50%;top:84px;width:max-content;max-width:calc(100vw - 32px);transform:translate(-50%,-30px);background:#fff;border-radius:18px;padding:12px 22px;font-weight:800;font-size:1.25rem;box-shadow:var(--sh);z-index:200;opacity:0;transition:all .35s;pointer-events:none;display:flex;align-items:center;gap:10px}
.toast.on{opacity:1;transform:translate(-50%,0)}
#fx{position:fixed;inset:0;pointer-events:none;z-index:150}
.modal{position:fixed;inset:0;background:rgba(20,30,50,.45);z-index:120;display:grid;place-items:center;padding:16px;animation:fade .2s}
.modal .mbox{background:#fff;border-radius:28px;padding:22px;max-width:560px;width:100%;box-shadow:0 20px 50px rgba(0,0,0,.25);animation:pop .35s cubic-bezier(.2,1.6,.4,1);max-height:90vh;overflow:auto}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{transform:scale(.7);opacity:0}}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes wobble{0%,100%{transform:rotate(0)}25%{transform:rotate(-6deg)}75%{transform:rotate(6deg)}}
.bnc{animation:bounce .6s}
.flt{animation:float 3s ease-in-out infinite}
/* activities menu */
.acts{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.acard{background:#fff;border-radius:24px;padding:18px;box-shadow:var(--sh);text-align:right;display:flex;gap:14px;align-items:center;transition:transform .15s}
.acard:hover{transform:translateY(-3px)}
.acard .ae{width:70px;height:70px;border-radius:20px;background:var(--ucb);display:grid;place-items:center;font-size:2.3rem;flex:none}
.acard h4{margin:0;font-size:1.25rem}
.acard p{margin:.2rem 0 0;color:var(--muted);font-size:.95rem}
.badge{display:inline-block;border-radius:99px;padding:2px 10px;font-size:.8rem;font-weight:800;background:var(--okb);color:#138a57}
.gamebox{position:relative;border-radius:24px;overflow:hidden;background:var(--ucb);touch-action:manipulation}
.hud{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.hud .chip{font-size:1.05rem}
.diffs{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:10px 0}
.diff{border-radius:18px;padding:12px 18px;background:#fff;box-shadow:inset 0 0 0 3px var(--line);font-weight:800;font-size:1.1rem;display:flex;flex-direction:column;align-items:center;min-width:120px}
.diff span{font-size:2rem}
.diff.on{box-shadow:inset 0 0 0 3px var(--uc);background:var(--ucb)}
.printable{background:#fff}
@media (max-width:860px){
  .hero{grid-template-columns:1fr}
  .lhub{grid-template-columns:1fr}
  .lside{position:static}
  .sl{grid-template-columns:1fr}
  .sl .sart{min-height:260px;max-height:320px}
  .sl .stxt{padding:18px 16px 90px}
  .uhead{grid-template-columns:1fr}
  .circles{display:none}
  .line{font-size:1.3rem}
  .qbox .qt{font-size:1.2rem}
  .station{grid-template-columns:64px 1fr auto}
  .station .si{width:64px;height:64px;font-size:2rem}
  .mcols{gap:8px}
  .mcard{font-size:1rem;padding:8px}
}
@media print{
  body *{visibility:hidden}
  .printable,.printable *{visibility:visible}
  .printable{position:absolute;inset:0;margin:auto;box-shadow:none!important}
}

<script>
'use strict';
/* ================= STATE ================= */
const KEY='hawiya2_v1';
let S={name:'',sound:true,read:true,L:{},intro:{}};
try{const s=JSON.parse(localStorage.getItem(KEY)||'null');if(s)S=Object.assign(S,s);}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
function LS(id){return S.L[id]||(S.L[id]={});}
function totalStars(){let t=0;for(const k in S.L){const l=S.L[k];['pre','post'].forEach(x=>{if(l[x])t+=l[x].stars||0});if(l.slides)t+=1;if(l.acts)t+=Object.keys(l.acts).length;if(l.game)t+=l.game.stars||0;}return t;}
function lessonSteps(id){const l=S.L[id]||{};return [!!l.pre,!!l.slides,!!(l.acts&&Object.keys(l.acts).length),!!l.game,!!l.post];}

/* ================= HELPERS ================= */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}return a;};
const pick=a=>a[Math.random()*a.length|0];
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const emph=s=>String(s).replace(/\*(.+?)\*/g,'<em>$1</em>');
const plain=s=>String(s).replace(/\*/g,'').replace(/<[^>]+>/g,'');
const AR=n=>String(n).replace(/\d/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]);
function toast(msg,ic='✨',ms=1600){let t=$('#toast');t.innerHTML=`<span style="font-size:1.6rem">${ic}</span>${msg}`;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),ms);}
function modal(html,{close=true}={}){const m=document.createElement('div');m.className='modal';m.innerHTML=`<div class="mbox">${html}</div>`;document.body.appendChild(m);if(close)m.addEventListener('click',e=>{if(e.target===m)m.remove();});return m;}
const PRAISE=['أحسنت! 🌟','رائع جدًّا! 👏','ممتاز! 💯','بطل! 🏆','إجابة ذكية! 💡','أنت مبدع! 🎨','عمل جميل! 🌈'];
const RETRY=['حاول مرة أخرى 💪','فكّر قليلًا 🤔','اقتربت! 🙂','لا بأس، جرّب ثانية 🌱'];

/* ================= SOUND (WebAudio) ================= */
let AC=null;
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC;}
function tone(f,d=.12,type='sine',v=.18,when=0,slide=0){const c=ac();if(!c||!S.sound)return;const t=c.currentTime+when;const o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(40,f+slide),t+d);g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.015);g.gain.exponentialRampToValueAtTime(0.0001,t+d);o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+d+.05);}
function noise(d=.3,v=.15,f=1200,when=0,q=1,sweep=0){const c=ac();if(!c||!S.sound)return;const t=c.currentTime+when;const b=c.createBuffer(1,c.sampleRate*d,c.sampleRate);const x=b.getChannelData(0);for(let i=0;i<x.length;i++)x[i]=Math.random()*2-1;const s=c.createBufferSource();s.buffer=b;const fl=c.createBiquadFilter();fl.type='bandpass';fl.frequency.setValueAtTime(f,t);if(sweep)fl.frequency.exponentialRampToValueAtTime(f+sweep,t+d);fl.Q.value=q;const g=c.createGain();g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(0.0001,t+d);s.connect(fl);fl.connect(g);g.connect(c.destination);s.start(t);}
const SFX={
  click(){tone(660,.06,'triangle',.12);},
  pop(){tone(520,.08,'sine',.2,0,500);},
  ok(){tone(660,.12,'triangle',.2);tone(880,.12,'triangle',.2,.1);tone(1320,.2,'sine',.14,.2);},
  no(){tone(220,.18,'square',.07);tone(180,.22,'square',.06,.12);},
  win(){[523,659,784,1047,784,1047].forEach((f,i)=>tone(f,.18,'triangle',.18,i*.11));noise(.6,.05,3000,.5,.7);},
  flip(){noise(.12,.12,2500,0,.8,-1500);},
  whoosh(){noise(.35,.16,400,0,.8,2400);},
  hop(){tone(300,.14,'sine',.2,0,420);},
  splash(){noise(.5,.2,900,0,.6,-600);tone(180,.2,'sine',.1);},
  coin(){tone(988,.08,'square',.1);tone(1319,.25,'square',.1,.08);},
  reel(){for(let i=0;i<6;i++)tone(900+i*60,.04,'square',.05,i*.05);},
  pour(){noise(.9,.1,1800,0,2,-900);},
  hit(){noise(.08,.35,1600,0,1);tone(140,.1,'sine',.25);},
  spin(){for(let i=0;i<14;i++)tone(700,.03,'square',.05,i*.07+i*i*.004);},
  star(){tone(1200,.1,'sine',.15);tone(1600,.18,'sine',.12,.08);},
  tick(){tone(1000,.03,'square',.05);},
  step(){tone(400+Math.random()*80,.07,'triangle',.12);},
  magic(){[784,988,1175,1568].forEach((f,i)=>tone(f,.2,'sine',.1,i*.06));}
};

/* ================= TTS ================= */
let arVoice=null,ttsWarned=false;
function loadVoices(){if(!('speechSynthesis' in window))return;const v=speechSynthesis.getVoices();arVoice=v.find(x=>/^ar[-_]SA/i.test(x.lang))||v.find(x=>/^ar/i.test(x.lang))||null;}
if('speechSynthesis' in window){loadVoices();speechSynthesis.onvoiceschanged=loadVoices;}
function speak(text,btn,onend){
  if(!('speechSynthesis' in window)){if(!ttsWarned){toast('القراءة الصوتية غير متاحة هنا','🔇');ttsWarned=true;}return;}
  speechSynthesis.cancel();$$('.say.on').forEach(b=>b.classList.remove('on'));
  const u=new SpeechSynthesisUtterance(plain(text));u.lang='ar-SA';if(arVoice)u.voice=arVoice;u.rate=.85;u.pitch=1.05;
  if(!arVoice&&!ttsWarned){ttsWarned=true;toast('لا يوجد صوت عربي في الجهاز؛ قد تكون القراءة غير واضحة','🔈',2600);}
  if(btn)btn.classList.add('on');
  u.onend=u.onerror=()=>{if(btn)btn.classList.remove('on');onend&&onend();};
  speechSynthesis.speak(u);
}
function stopSpeak(){if('speechSynthesis' in window)speechSynthesis.cancel();}
function sayBtn(text){return `<button class="say" data-say="${esc(plain(text))}" title="استمع">🔊</button>`;}
document.addEventListener('click',e=>{const b=e.target.closest('[data-say]');if(b){e.stopPropagation();speak(b.dataset.say,b);}},true);

/* ================= CONFETTI ================= */
function confetti(n=120){const cv=$('#fx');const cx=cv.getContext('2d');cv.width=innerWidth;cv.height=innerHeight;const cols=['#EF5B2B','#6B4FA3','#0FA3A3','#FFC93C','#1FB373','#D62839','#4AA3FF'];let P=[];for(let i=0;i<n;i++)P.push({x:innerWidth/2+(Math.random()-.5)*200,y:innerHeight*.35,vx:(Math.random()-.5)*14,vy:-Math.random()*14-4,s:Math.random()*8+5,c:pick(cols),r:Math.random()*6,vr:(Math.random()-.5)*.3});let f=0;(function loop(){cx.clearRect(0,0,cv.width,cv.height);P.forEach(p=>{p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;cx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);cx.restore();});if(++f<140)requestAnimationFrame(loop);else cx.clearRect(0,0,cv.width,cv.height);})();}
function burstAt(el,emo='⭐'){const r=el.getBoundingClientRect();for(let i=0;i<6;i++){const s=document.createElement('div');s.textContent=emo;s.style.cssText=`position:fixed;left:${r.left+r.width/2}px;top:${r.top+r.height/2}px;font-size:1.6rem;pointer-events:none;z-index:300;transition:all .8s cubic-bezier(.2,.8,.3,1);`;document.body.appendChild(s);const a=Math.random()*Math.PI*2,d=50+Math.random()*50;requestAnimationFrame(()=>{s.style.transform=`translate(${Math.cos(a)*d}px,${Math.sin(a)*d}px) scale(.4)`;s.style.opacity='0';});setTimeout(()=>s.remove(),900);}}

/* ================= DRAG & DROP (pointer + tap) ================= */
function dnd(root,{cards,targets,onPlace}){
  let sel=null;
  const clear=()=>{if(sel)sel.classList.remove('sel');sel=null;};
  root.addEventListener('pointerdown',e=>{
    const c=e.target.closest(cards);if(!c||!root.contains(c)||c.dataset.locked)return;
    e.preventDefault();const sx=e.clientX,sy=e.clientY;let ghost=null,moved=false,over=null;
    const mv=ev=>{const dx=ev.clientX-sx,dy=ev.clientY-sy;if(!moved&&Math.hypot(dx,dy)>8){moved=true;ghost=c.cloneNode(true);ghost.classList.add('drag');ghost.style.width=c.offsetWidth+'px';document.body.appendChild(ghost);c.style.opacity='.35';}
      if(moved){ghost.style.left=(ev.clientX-c.offsetWidth/2)+'px';ghost.style.top=(ev.clientY-c.offsetHeight/2)+'px';const el=document.elementFromPoint(ev.clientX,ev.clientY);const t=el&&el.closest(targets);if(over&&over!==t)over.classList.remove('over');over=t&&root.contains(t)?t:null;if(over)over.classList.add('over');}};
    const up=ev=>{removeEventListener('pointermove',mv);removeEventListener('pointerup',up);removeEventListener('pointercancel',up);
      if(moved){ghost.remove();c.style.opacity='';if(over){over.classList.remove('over');clear();onPlace(c,over);} }
      else{ if(sel===c){clear();}else{clear();sel=c;c.classList.add('sel');SFX.click();} }};
    addEventListener('pointermove',mv);addEventListener('pointerup',up);addEventListener('pointercancel',up);
  });
  root.addEventListener('click',e=>{const t=e.target.closest(targets);if(t&&sel&&root.contains(t)&&!e.target.closest(cards)){const c=sel;clear();onPlace(c,t);}});
}

/* ================= ART ================= */
const SK='#F3C9A2',SK2='#E7B389',SK3='#D9A077';
function person(o={}){

  if(p.hat==='none'&&p.male)g+=`<path d="M26 40 Q28 18 50 18 Q72 18 74 40 Q64 28 50 30 Q36 28 26 40Z" fill="#2E2018"/>`;

  // face
  const ey=p.mouth==='sad'?48:47;
  g+=`<ellipse cx="41" cy="${ey}" rx="3.6" ry="4.4" fill="#3B2412"/><ellipse cx="59" cy="${ey}" rx="3.6" ry="4.4" fill="#3B2412"/><circle cx="42.3" cy="${ey-1.6}" r="1.3" fill="#fff"/><circle cx="60.3" cy="${ey-1.6}" r="1.3" fill="#fff"/>`;

function winBox(stars,title,btns){SFX.win();confetti();const mm=modal(`<div class="res"><div class="big bnc">🏆</div><h3>${title}</h3><div class="stars3">${[1,2,3].map(i=>`<span class="${i<=stars?'':'off'}">⭐</span>`).join('')}</div><p class="muted">${S.name?esc(S.name)+'، ':''}${pick(PRAISE)}</p><div class="row" style="justify-content:center">${btns.map((b,i)=>`<button class="btn ${i?'':'ghost'}" data-b="${i}">${b[0]}</button>`).join('')}</div></div>`,{close:false});$$('[data-b]',mm).forEach(b=>b.onclick=()=>{mm.remove();btns[+b.dataset.b][1]();});}

/* ================= EXERCISE ENGINE ================= */
const LVL={e:['🌱','داعِمٌ','خُطُواتٌ بَسيطَةٌ مَعَ صُوَرٍ وَصَوْتٍ وَمُساعَدَةٍ'],m:['⭐','أَساسِيٌّ','أَسْئِلَةٌ مُتَنَوِّعَةٌ في مُسْتَوى الدَّرْسِ'],h:['🚀','مُتَقَدِّمٌ','تَحَدِّياتٌ أَكْثَرُ لِلْمُتَمَيِّزينَ']};
function levelPick(el,l,k){
  const d=S.L[l.id]||{};let rec=null;
  if(k==='post'&&d.pre){const p=d.pre.score/d.pre.max;rec=p<.5?'e':p<.85?'m':'h';}
  el.innerHTML=`<h2 class="ptitle"><span class="pi">${k==='pre'?'🧭':'🏁'}</span>${k==='pre'?'تَمْرينٌ قَبْلِيٌّ: ماذا أَعْرِفُ؟':'تَمْرينٌ بَعْدِيٌّ: ماذا تَعَلَّمْتُ؟'}</h2>
  <p class="muted" style="font-size:1.1rem">اِخْتَرِ المُسْتَوى المُناسِبَ لَكَ ${rec?'(اقْتَرَحْنا لَكَ مُسْتَوًى حَسَبَ نَتيجَتِكَ في التَّمْرينِ القَبْلِيِّ)':''}:</p>
  <div class="levels">${['e','m','h'].map(x=>`<button class="lvl ${x===rec?'rec':''}" data-l="${x}"><div class="le">${LVL[x][0]}</div><h4>${LVL[x][1]}</h4><p>${LVL[x][2]}</p><p style="margin-top:6px"><b>${AR(l[k][x].length)}</b> أَسْئِلَة</p></button>`).join('')}</div>`;
  $$('.lvl',el).forEach(b=>b.onclick=()=>{SFX.click();runExercise(el,l,k,b.dataset.l);});
}
function runExercise(el,l,k,lv){
  const items=l[k][lv];let i=0,score=0;
  const next=()=>{if(i>=items.length)return finish();const it=items[i];let first=true;
    el.innerHTML=`<div class="exhead"><span class="chip">${LVL[lv][0]} ${LVL[lv][1]}</span><div class="exbar"><i style="width:${i/items.length*100}%"></i></div><span class="chip">${AR(i+1)} / ${AR(items.length)}</span></div><div id="q"></div><div class="fb" id="fb"></div>`;
    const q=$('#q',el);const fb=$('#fb',el);
    const resolve=(ok,soft)=>{ if(ok){if(first)score++;SFX.ok();fb.className='fb ok';fb.textContent=pick(PRAISE);burstAt(fb);i++;setTimeout(next,soft?1300:1100);}
      else{first=false;SFX.no();fb.className='fb no';fb.textContent=pick(RETRY);} };
    const miss=()=>{first=false;};
    window.__cur=it;ITEM[it.k](q,it,resolve,lv,miss);
    if(lv==='e'&&S.read){const b=$('.say',q);if(b)setTimeout(()=>speak(b.dataset.say,b),300);}
  };
  const finish=()=>{const max=items.length;const pct=score/max;const stars=pct>=.9?3:pct>=.6?2:1;const d=LS(l.id);d[k]={score,max,level:lv,stars};save();refreshStars();SFX.win();if(pct>=.6)confetti();
    let extra='';if(k==='pre'){const rec=pct<.5?'e':pct<.85?'m':'h';extra=`<p class="nx" style="font-size:1.2rem">هذا ما تَعْرِفُهُ الآنَ. سَنَتَعَلَّمُ مَعًا الكَثيرَ في العَرْضِ وَالأَنْشِطَةِ 🌱<br>المُسْتَوى المُقْتَرَحُ لَكَ في التَّمْرينِ البَعْدِيِّ: <b>${LVL[rec][0]} ${LVL[rec][1]}</b></p>`;}
    el.innerHTML=`<div class="res"><div class="big bnc">${pct>=.9?'🏆':pct>=.6?'🎉':'🌱'}</div><h3>${AR(score)} مِنْ ${AR(max)}</h3><div class="stars3">${[1,2,3].map(x=>`<span class="${x<=stars?'':'off'}">⭐</span>`).join('')}</div>${extra}<div id="cmpz"></div>
    <div class="row" style="justify-content:center;margin-top:10px"><button class="btn ghost" id="again">🔁 أُعيدُ</button>${k==='pre'?'<button class="btn" id="nx">🎬 إلى العَرْضِ</button>':'<button class="btn" id="nx">↩️ إلى الدَّرْسِ</button>'}</div></div>`;
    if(k==='post'){const d2=S.L[l.id];$('#cmpz',el).innerHTML=compareHTML(d2.pre,d2.post);animBars(el);}
    $('#again',el).onclick=()=>levelPick(el,l,k);
    $('#nx',el).onclick=()=>{if(k==='pre'){HIST.pop();go({v:'slides',id:l.id});}else back();};
  };
  next();
}
function compareHTML(pre,post){if(!pre)return `<p class="muted">لَمْ تَحُلَّ التَّمْرينَ القَبْلِيَّ بَعْدُ؛ حُلَّهُ لِتَرى تَقَدُّمَكَ 📈</p>`;
  const a=Math.round(pre.score/pre.max*100),b=Math.round(post.score/post.max*100);const msg=b>a?`رائِعٌ! تَقَدَّمْتَ ${AR(b-a)}٪ 🚀`:b===a?(b===100?'مُمْتازٌ! حافَظْتَ عَلى الدَّرَجَةِ الكامِلَةِ 🏆':'ثابِتٌ، واصِلِ التَّدَرُّبَ 💪'):'راجِعِ العَرْضَ وَالأَنْشِطَةَ ثُمَّ حاوِلْ مَرَّةً أُخْرى 🌱';
  return `<div class="cmp"><div class="col"><b>${AR(a)}٪</b><div class="bar" data-h="${a}" style="height:0;background:#9AA7B8">قَبْلُ</div><span>${LVL[pre.level][0]} القَبْلِيُّ</span></div><div class="col"><b>${AR(b)}٪</b><div class="bar" data-h="${b}" style="height:0;background:linear-gradient(0deg,var(--uc),var(--sun))">بَعْدُ</div><span>${LVL[post.level][0]} البَعْدِيُّ</span></div></div><h3 style="margin:0">${msg}</h3>`;}
function animBars(el){setTimeout(()=>$$('.bar',el).forEach(b=>b.style.height=Math.max(12,+b.dataset.h)*1.6+'px'),120);}
function showCompare(l){const d=S.L[l.id];const mm=modal(`<h2 class="center" style="margin-top:0">📊 تَقَدُّمي في دَرْسِ ${l.title}</h2>${compareHTML(d.pre,d.post)}<div class="center mt"><button class="btn" id="cl">حَسَنًا</button></div>`);animBars(mm);$('#cl',mm).onclick=()=>mm.remove();}

const qhead=(it)=>`<div class="qbox">${sayBtn(it.q)}<div class="qt nx">${emph(it.q)}</div></div>${it.e?`<div class="qart">${it.e.startsWith('<')?`<div style="width:min(420px,100%)">${it.e}</div>`:`<span class="em flt">${it.e}</span>`}</div>`:''}`;
const splitO=o=>{const s=String(o).split('|');return s.length>1?{e:s[0],t:s[1]}:{e:'',t:s[0]};};
const ITEM={

function runSlides(root,slides,onDone){
  let si=0,li=0,autoRead=S.read;
  root.innerHTML=`<div class="stage" id="stg"><div id="sb"></div><div class="snav"><button class="ib" id="pv" title="السّابِق">➡️</button><button class="ib" id="rd" title="القِراءَةُ التِّلْقائِيَّةُ">${autoRead?'🗣️':'🤐'}</button><div class="sdots">${slides.map(()=>'<i></i>').join('')}</div><button class="ib" id="fs" title="مِلْءُ الشّاشَةِ">⛶</button><button class="btn" id="nx">التّالي ⬅️</button></div></div>`;
  const sb=$('#sb',root);
  const draw=()=>{const s=slides[si];li=0;stopSpeak();$$('.sdots i',root).forEach((d,i)=>d.classList.toggle('on',i===si));
    sb.innerHTML=SLIDE[s.t](s);SFX.whoosh();

    if(s.t==='goals'){$$('.goalli',sb).forEach((g,i)=>setTimeout(()=>{g.classList.add('show');SFX.pop();},300+i*350));if(autoRead)setTimeout(()=>speak(s.title+'. '+s.items.map(x=>x[1]).join('، ')),400);}
    if(s.t==='cover'&&autoRead)setTimeout(()=>speak(s.title+'. '+(s.sub||'')),400);
    if(s.t==='flip')$$('.flip',sb).forEach(f=>f.onclick=()=>{f.classList.toggle('on');SFX.flip();if(f.classList.contains('on'))speak(f.dataset.say);});
    if(s.t==='hot'){$$('.hot',sb).forEach(h=>h.onclick=()=>{h.classList.add('seen');SFX.pop();const b=$('#hb',sb);b.innerHTML=emph(h.dataset.t);b.style.opacity=1;speak(h.dataset.t);});}
    if(s.t==='check'){$$('.opt',sb).forEach(b=>b.onclick=()=>{if(+b.dataset.i===s.a){b.classList.add('good');SFX.ok();burstAt(b);toast(pick(PRAISE),'🌟');}else{b.classList.add('badd');SFX.no();}});}
    if(s.t==='think'){$('#ans',sb).onclick=()=>{$('#ansx',sb).style.display='block';SFX.magic();speak(s.a);};}
    if(s.t==='end'&&autoRead)setTimeout(()=>speak(plain(s.title+'. '+s.text)),400);
    $('#pv',root).disabled=si===0;
  };
  const revealLine=()=>{const ls=$$('.line',sb);ls.forEach(x=>x.classList.remove('cur'));const l=ls[li];if(!l)return;l.classList.add('show','cur');if(autoRead)speak(l.dataset.say,$('.say',l));};
  const nxt=()=>{SFX.click();const s=slides[si];if(s.t==='story'&&li<s.lines.length-1){li++;revealLine();return;}if(si<slides.length-1){si++;draw();}else{onDone();stopSpeak();winBox(3,'أَنْهَيْتَ العَرْضَ!',[['↩️ الدَّرْسُ',()=>back()],['🧩 إلى الأَنْشِطَةِ',()=>{const id=CUR.id;HIST.pop();go({v:'acts',id});}]]);}};
  $('#nx',root).onclick=nxt;$('#pv',root).onclick=()=>{SFX.click();if(si>0){si--;draw();}};
  $('#rd',root).onclick=()=>{autoRead=!autoRead;S.read=autoRead;save();$('#rd',root).textContent=autoRead?'🗣️':'🤐';if(!autoRead)stopSpeak();};
  $('#fs',root).onclick=()=>{const st=$('#stg',root);st.classList.toggle('fs');if(st.classList.contains('fs')){(st.requestFullscreen?st.requestFullscreen():Promise.resolve()).catch(()=>{});}else if(document.fullscreenElement)document.exitFullscreen().catch(()=>{});};
  root.tabIndex=0;const kh=e=>{if(!document.body.contains(root)){removeEventListener('keydown',kh);return;}if(e.key==='ArrowLeft'||e.key===' ')nxt();if(e.key==='ArrowRight')$('#pv',root).click();};addEventListener('keydown',kh);
  draw();
}
