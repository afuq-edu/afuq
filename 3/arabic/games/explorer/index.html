<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>واحة لغتي</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lalezar&family=Baloo+Bhaijaan+2:wght@400;600;700;800&family=Noto+Naskh+Arabic:wght@400;600;700&family=Amiri:wght@400;700&display=swap">
<style>
:root{
  color-scheme: light;
  --ground:#F2F8F4;
  --ground2:#E4F1EA;
  --paper:#FFFFFF;
  --ink:#1D2946;
  --ink2:#4B587A;
  --line:#D5E3DC;
  --red:#E4485A;
  --green:#18966A;
  --sun:#FFBE2E;
  --sky:#3BA7EE;
  --plum:#8466E6;
  --orange:#F27A2E;
  --teal:#11A3A8;
  --pink:#E75C9A;
  --ok:#1FAE66;
  --bad:#E4485A;
  --shadow:0 6px 0 rgba(29,41,70,.12);
  --r:22px;
  --f-display:"Lalezar","Baloo Bhaijaan 2","Segoe UI",Tahoma,sans-serif;
  --f-ui:"Baloo Bhaijaan 2","Segoe UI",Tahoma,sans-serif;
  --f-text:"Noto Naskh Arabic","Amiri","Traditional Arabic","Segoe UI",serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--f-ui);font-size:18px;direction:rtl;overflow-x:hidden}
button{font-family:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--sky);outline-offset:3px}
.hide{display:none!important}

/* ---------- HOME ---------- */
#home{min-height:100%;padding:18px 16px 60px;max-width:1100px;margin:0 auto}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.brand-mark{width:58px;height:58px;border-radius:18px;background:var(--green);display:grid;place-items:center;box-shadow:var(--shadow);position:relative;overflow:hidden}
.brand-mark span{font-family:var(--f-display);color:#fff;font-size:34px;line-height:1;margin-top:6px}
.brand-mark:after{content:"";position:absolute;width:26px;height:26px;border-radius:50%;background:var(--sun);top:-8px;left:-8px}
.brand h1{font-family:var(--f-display);font-weight:400;font-size:clamp(30px,6vw,46px);margin:0;line-height:1.1}
.brand p{margin:0;color:var(--ink2);font-size:15px}
.axis-tabs{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
.axis-tabs .ax{font-size:15px}
.axis-tabs .ax.on{background:var(--ink);color:#fff;border-color:var(--ink);box-shadow:0 3px 0 #0b1226}
.pill-btn{display:inline-flex;align-items:center;gap:8px;background:var(--paper);border:2px solid var(--line);padding:8px 16px;border-radius:999px;font-weight:700;font-size:16px;box-shadow:0 3px 0 var(--line)}
.pill-btn:active{transform:translateY(2px);box-shadow:none}

.hero{margin:22px 0 10px;background:linear-gradient(180deg,#BFE6FF 0%,#DFF3FF 55%,#F7E7C6 56%,#F1D9A8 100%);border-radius:30px;padding:22px 20px 26px;position:relative;overflow:hidden;min-height:180px}
.hero h2{font-family:var(--f-display);font-weight:400;font-size:clamp(24px,4.6vw,38px);margin:0 0 6px;max-width:30ch;text-wrap:balance;position:relative;z-index:2}
.hero p{margin:0;max-width:46ch;color:#34405F;position:relative;z-index:2;font-size:17px}
.hero .sunball{position:absolute;left:28px;top:18px;width:74px;height:74px;border-radius:50%;background:var(--sun);box-shadow:0 0 0 14px rgba(255,190,46,.25)}
.hero .fort{position:absolute;left:0;right:0;bottom:0;height:70px;z-index:1;opacity:.9}
.hero-inner{position:relative;z-index:2;padding-bottom:40px}
.legend{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px;position:relative;z-index:2}
.legend span{background:rgba(255,255,255,.8);border-radius:999px;padding:4px 12px;font-size:14px;font-weight:700}

.lessons{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px;margin-top:22px}
.lcard{background:var(--paper);border-radius:var(--r);box-shadow:var(--shadow);border:2px solid var(--line);padding:16px;display:flex;flex-direction:column;gap:10px;text-align:right;position:relative;transition:transform .15s}
.lcard:hover{transform:translateY(-3px)}
.lcard .num{position:absolute;top:-12px;left:16px;background:var(--c);color:#fff;font-family:var(--f-display);font-size:20px;border-radius:12px;padding:2px 12px 0}
.lcard .emo{font-size:44px;line-height:1;width:72px;height:72px;border-radius:20px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 16%,white)}
.lcard .kind{font-size:14px;font-weight:800;color:var(--c)}
.lcard h3{font-family:var(--f-display);font-weight:400;font-size:28px;margin:0;line-height:1.2}
.lcard .desc{font-size:15px;color:var(--ink2);margin:0}
.lcard .prog{display:flex;gap:6px;margin-top:auto}
.lcard .prog i{flex:1;height:8px;border-radius:9px;background:var(--ground2)}
.lcard .prog i.on{background:var(--c)}

/* ---------- LESSON HUB ---------- */
#hub{min-height:100%;padding:18px 16px 60px;max-width:1000px;margin:0 auto}
.hub-head{border-radius:30px;padding:22px;background:color-mix(in srgb,var(--c) 14%,white);border:2px solid color-mix(in srgb,var(--c) 30%,white);display:flex;gap:18px;align-items:center;flex-wrap:wrap;margin-top:14px}
.hub-head .emo{font-size:64px;width:100px;height:100px;border-radius:28px;background:#fff;display:grid;place-items:center;box-shadow:var(--shadow)}
.hub-head h2{font-family:var(--f-display);font-weight:400;font-size:clamp(30px,6vw,46px);margin:0;line-height:1.15}
.hub-head .kind{color:var(--c);font-weight:800}
.hub-head p{margin:4px 0 0;color:var(--ink2)}
.parts{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px;margin-top:20px}
.part{background:var(--paper);border-radius:var(--r);border:2px solid var(--line);box-shadow:var(--shadow);padding:18px;text-align:right;display:flex;flex-direction:column;gap:8px;min-height:170px;position:relative}
.part:active{transform:translateY(3px);box-shadow:none}
.part .step{font-size:13px;font-weight:800;color:#fff;background:var(--pc);border-radius:999px;padding:2px 12px;align-self:flex-start}
.part .ico{font-size:40px;line-height:1}
.part b{font-family:var(--f-display);font-weight:400;font-size:26px;line-height:1.2}
.part small{color:var(--ink2);font-size:15px;line-height:1.5}
.part .done{position:absolute;left:14px;top:14px;font-size:20px;letter-spacing:2px}

/* ---------- STAGE ---------- */
#stage{position:fixed;inset:0;background:var(--ground);display:flex;flex-direction:column;z-index:20;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.stage-bar{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--paper);border-bottom:2px solid var(--line)}
.stage-bar .t{flex:1;min-width:0}
.stage-bar .t b{display:block;font-family:var(--f-display);font-weight:400;font-size:22px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stage-bar .t small{color:var(--ink2);font-size:13px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{width:46px;height:46px;border-radius:14px;background:var(--ground2);display:grid;place-items:center;font-size:22px;flex:none}
.icon-btn:active{transform:scale(.94)}
#stageBody{flex:1;overflow:auto;position:relative;padding:16px;display:flex;flex-direction:column}
.act-wrap{max-width:980px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:14px;flex:1}
.brief{background:var(--paper);border-radius:18px;border:2px solid var(--line);padding:12px 16px;display:flex;gap:12px;align-items:center}
.brief .bi{font-size:32px}
.brief p{margin:0;font-size:17px;line-height:1.6}
.scorebar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.chip{background:var(--paper);border:2px solid var(--line);border-radius:999px;padding:4px 14px;font-weight:800;font-size:16px;display:inline-flex;gap:6px;align-items:center}
.big-btn{background:var(--c,var(--green));color:#fff;font-weight:800;font-size:20px;border-radius:18px;padding:12px 26px;box-shadow:0 5px 0 color-mix(in srgb,var(--c,var(--green)) 70%,black)}
.big-btn:active{transform:translateY(4px);box-shadow:none}
.big-btn.ghost{background:var(--paper);color:var(--ink);border:2px solid var(--line);box-shadow:0 5px 0 var(--line)}
.opt{background:var(--paper);border:3px solid var(--line);border-radius:18px;padding:12px 16px;font-size:20px;font-weight:700;box-shadow:0 4px 0 var(--line);font-family:var(--f-text);line-height:1.6;text-align:center}
.opt:active{transform:translateY(3px);box-shadow:none}
.opt.right{border-color:var(--ok);background:#E3F7EC;box-shadow:0 4px 0 var(--ok)}
.opt.wrong{border-color:var(--bad);background:#FDE7EA;box-shadow:0 4px 0 var(--bad);animation:shake .4s}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.q-text{font-family:var(--f-text);font-size:clamp(20px,3.6vw,28px);line-height:1.8;text-align:center;margin:6px 0;font-weight:600}
.ar{font-family:var(--f-text)}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@keyframes popin{0%{transform:scale(.4);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.pop{animation:popin .35s ease-out}

/* celebration */
#celebrate{position:fixed;inset:0;background:rgba(29,41,70,.55);display:grid;place-items:center;z-index:60;padding:16px}
.cel-card{background:var(--paper);border-radius:30px;padding:26px 22px;max-width:420px;width:100%;text-align:center;animation:popin .4s}
.cel-card .stars{font-size:52px;letter-spacing:6px}
.cel-card h3{font-family:var(--f-display);font-weight:400;font-size:36px;margin:6px 0}
.cel-card p{margin:0 0 16px;color:var(--ink2)}
.cel-card .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:70}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 20px;border-radius:999px;font-weight:700;z-index:80;animation:popin .3s;max-width:90vw;text-align:center}

/* ---------- SLIDES ---------- */
.slides{flex:1;display:flex;flex-direction:column;gap:12px;max-width:1000px;width:100%;margin:0 auto}
.slide{flex:1;background:var(--paper);border-radius:28px;border:2px solid var(--line);box-shadow:var(--shadow);padding:clamp(16px,3vw,34px);overflow:auto;animation:popin .3s}
.slide h2{font-family:var(--f-display);font-weight:400;font-size:clamp(28px,5vw,44px);margin:0 0 10px;color:var(--c);line-height:1.25;text-wrap:balance}
.slide h3{font-family:var(--f-display);font-weight:400;font-size:clamp(22px,3.6vw,30px);margin:14px 0 8px;line-height:1.3}
.slide p,.slide li{font-size:clamp(18px,2.4vw,22px);line-height:1.9}
.slide .txt{font-family:var(--f-text);font-size:clamp(21px,3vw,28px);line-height:2.15;text-align:justify}
.slide .txt p{font-size:inherit;line-height:inherit;margin:0 0 10px}
.slide .eyebrow{display:inline-block;background:color-mix(in srgb,var(--c) 15%,white);color:var(--c);font-weight:800;border-radius:999px;padding:3px 14px;font-size:15px;margin-bottom:8px}
.cover{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;min-height:100%;gap:10px}
.cover .big-emo{font-size:clamp(70px,14vw,120px);line-height:1;animation:floaty 3s ease-in-out infinite}
.cover h2{font-size:clamp(40px,8vw,72px)!important}
.slide-nav{display:flex;align-items:center;gap:10px;justify-content:space-between}
.dots{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;flex:1}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--c);width:26px;border-radius:9px}
.w{background:color-mix(in srgb,var(--sun) 35%,white);border-bottom:3px dotted var(--orange);cursor:pointer;border-radius:6px;padding:0 3px}
.w.seen{background:color-mix(in srgb,var(--green) 18%,white);border-bottom-color:var(--green)}
.bubble{position:fixed;z-index:50;background:var(--ink);color:#fff;border-radius:16px;padding:10px 16px;font-size:18px;max-width:min(320px,86vw);box-shadow:0 8px 20px rgba(0,0,0,.2);animation:popin .2s;font-family:var(--f-ui);line-height:1.6}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin:10px 0}
.card{background:color-mix(in srgb,var(--c) 8%,white);border:2px solid color-mix(in srgb,var(--c) 25%,white);border-radius:20px;padding:14px;text-align:center}
.card .e{font-size:44px;line-height:1.2}
.card b{display:block;font-size:21px;font-family:var(--f-text)}
.card span{font-size:16px;color:var(--ink2);line-height:1.6;display:block}
.rev{cursor:pointer;background:var(--ground2);border:2px dashed var(--line);border-radius:14px;padding:6px 12px;display:inline-block;font-family:var(--f-text);min-width:120px;text-align:center}
.rev .a{display:none}
.rev.open{background:#E3F7EC;border-style:solid;border-color:var(--ok)}
.rev.open .a{display:inline}
.rev.open .h{display:none}
.qz{background:var(--ground);border-radius:20px;padding:14px;margin:12px 0}
.qz .qq{font-weight:700;font-size:clamp(18px,2.6vw,22px);margin-bottom:10px;font-family:var(--f-text);line-height:1.8}
.qz .opts{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.qz .opt{font-size:18px;padding:8px 10px}
.rule{background:color-mix(in srgb,var(--sun) 22%,white);border:2px solid color-mix(in srgb,var(--sun) 60%,white);border-radius:20px;padding:12px 18px;margin:10px 0}
.rule b{color:var(--orange)}
.verse{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;font-family:var(--f-text);font-size:clamp(20px,3vw,27px);padding:8px 0;border-bottom:1px dashed var(--line)}
.verse span:first-child{text-align:left}
.verse span:last-child{text-align:right}
.verse i{color:var(--c);font-style:normal;font-size:16px}
.tbl{width:100%;border-collapse:separate;border-spacing:0 6px;font-size:clamp(17px,2.4vw,21px)}
.tbl th{background:var(--c);color:#fff;padding:8px;border-radius:10px;font-weight:700}
.tbl td{background:var(--ground);padding:8px 10px;border-radius:10px;text-align:center;font-family:var(--f-text)}
.tbl-wrap{overflow-x:auto}
.author{display:flex;gap:14px;align-items:center;background:var(--ground);border-radius:20px;padding:14px;margin:10px 0}
.author .av{font-size:46px;width:74px;height:74px;border-radius:50%;background:#fff;display:grid;place-items:center;flex:none}
.author p{margin:0;font-size:17px;line-height:1.7}

/* tracing */
.trace-box{background:#FFFDF6;border:2px solid var(--line);border-radius:20px;position:relative;touch-action:none;overflow:hidden}
.trace-box canvas{display:block;width:100%;height:100%;touch-action:none}
.trace-tools{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.trace-tools button{background:var(--ground2);border-radius:12px;padding:6px 14px;font-weight:700;font-family:var(--f-text);font-size:20px}
.trace-tools button.on{background:var(--c);color:#fff}

/* generic drag tiles */
.tile{background:var(--paper);border:3px solid var(--line);border-radius:16px;padding:8px 14px;font-family:var(--f-text);font-size:clamp(18px,2.8vw,24px);font-weight:700;box-shadow:0 4px 0 var(--line);user-select:none;touch-action:none}
.tile.sel{border-color:var(--sky);box-shadow:0 4px 0 var(--sky);background:#E6F4FE}
.tile.used{opacity:.35;pointer-events:none}

@media (max-width:560px){
  .bees .big-btn{padding:8px 10px;flex:1;justify-content:center}
  .bees small{display:none}
  body{font-size:17px}
  .stage-bar .t b{font-size:19px}
  .verse{grid-template-columns:1fr;gap:0;text-align:center}
  .verse span:first-child,.verse span:last-child{text-align:center}
  .verse i{display:none}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}
</style>

<div id="home"></div>
<div id="hub" class="hide"></div>
<div id="stage" class="hide">
  <div class="stage-bar">
    <button class="icon-btn" id="stBack" aria-label="رجوع">➜</button>
    <div class="t"><b id="stTitle"></b><small id="stSub"></small></div>
    <button class="icon-btn" id="stRestart" aria-label="إعادة">↻</button>
    <button class="icon-btn" id="stSound" aria-label="الصوت">🔊</button>
  </div>
  <div id="stageBody"></div>
</div>
<canvas id="confetti"></canvas>

<script>
/* ================= CORE ================= */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
function el(html){const t=document.createElement('template');t.innerHTML=html.trim();return t.content.firstElementChild;}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
const AR=n=>String(n).replace(/\d/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));

/* ---- sound engine (WebAudio, no files) ---- */
const SND={on:true,ctx:null};
function ac(){
  if(!SND.ctx){try{SND.ctx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){return null;}}
  if(SND.ctx.state==='suspended')SND.ctx.resume();
  return SND.ctx;
}
function tone(f,d,type='sine',v=.2,when=0,slide){
  if(!SND.on)return;const c=ac();if(!c)return;
  const t=c.currentTime+when,o=c.createOscillator(),g=c.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+d);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.012);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+d+.05);
}
function noise(d,v=.15,freq=1000,when=0){
  if(!SND.on)return;const c=ac();if(!c)return;
  const len=Math.floor(c.sampleRate*d),b=c.createBuffer(1,len,c.sampleRate),data=b.getChannelData(0);
  for(let i=0;i<len;i++)data[i]=(Math.random()*2-1)*(1-i/len);
  const s=c.createBufferSource(),fl=c.createBiquadFilter(),g=c.createGain();
  fl.type='bandpass';fl.frequency.value=freq;g.gain.value=v;s.buffer=b;s.connect(fl);fl.connect(g);g.connect(c.destination);s.start(c.currentTime+when);
}
const sfx={
  click(){tone(660,.06,'triangle',.14)},
  ok(){tone(523,.1,'triangle',.24);tone(784,.18,'triangle',.24,.09);tone(1046,.2,'sine',.12,.18)},
  bad(){tone(240,.16,'sawtooth',.11);tone(180,.24,'sawtooth',.09,.12)},
  pop(){tone(880,.08,'sine',.26,0,260)},
  win(){[523,659,784,1047].forEach((f,i)=>tone(f,.22,'triangle',.22,i*.12));tone(1319,.6,'triangle',.2,.5);tone(1568,.6,'sine',.1,.62)},
  whoosh(){noise(.4,.18,900)},
  tick(){tone(1500,.025,'square',.05)},
  splash(){noise(.35,.25,600);tone(300,.2,'sine',.12,0,120)},
  dice(){for(let i=0;i<7;i++)tone(250+Math.random()*350,.04,'square',.06,i*.06)},
  flip(){tone(420,.06,'triangle',.14,0,900)},
  step(){tone(520,.06,'sine',.16)},
  note(i){tone([392,494,587,698,784,880][i%6],.35,'triangle',.26)},
  stir(){noise(.14,.1,420)},
  start(){[392,523,659,784].forEach((f,i)=>tone(f,.14,'square',.07,i*.09))},
  scratch(){noise(.05,.05,2500)},
  hit(){tone(180,.08,'square',.16,0,90);noise(.08,.15,300)},
  pull(){tone(200,.12,'sawtooth',.1,0,400)}
};

/* ---- storage ---- */
const KEY='wahat-lughati-3-v1';
let PROG={};
try{PROG=JSON.parse(localStorage.getItem(KEY)||'{}')||{};}catch(e){PROG={};}

/* ---- confetti ---- */
function confetti(){
  const cv=$('#confetti'),cx=cv.getContext('2d');cv.width=innerWidth;cv.height=innerHeight;
  const cols=['#E4485A','#18966A','#FFBE2E','#3BA7EE','#8466E6','#F27A2E'];
  const ps=Array.from({length:140},()=>({x:Math.random()*cv.width,y:-20-Math.random()*cv.height*.5,vx:(Math.random()-.5)*3,vy:2+Math.random()*4,s:6+Math.random()*8,r:Math.random()*6,c:cols[Math.floor(Math.random()*cols.length)]}));
  let t=0;(function f(){t++;cx.clearRect(0,0,cv.width,cv.height);
    ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.r+=.1;cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;cx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);cx.restore();});
    if(t<200)requestAnimationFrame(f);else cx.clearRect(0,0,cv.width,cv.height);})();
}
function toast(msg,ms=1800){const t=el(`<div class="toast">${msg}</div>`);document.body.appendChild(t);setTimeout(()=>t.remove(),ms);}

      <span class="num">★</span><div class="emo">🪞</div><span class="kind">خِتامُ الْمِحْوَرِ</span>
      <h3>أُقَيِّمُ أَدائي</h3><p class="desc">أُلَوِّنُ الْوَجْهَ الَّذي يُناسِبُني في كُلِّ مَهارَةٍ.</p>
    </button>

  $$('.lcard',H).forEach(b=>b.onclick=()=>{sfx.click();b.dataset.l==='self'?openSelf():openHub(b.dataset.l);});

function toggleSound(){SND.on=!SND.on;try{localStorage.setItem(KEY+'-snd',SND.on?'1':'0');}catch(e){}$('#stSound').textContent=SND.on?'🔊':'🔇';if(SND.on)sfx.click();}

function openHub(id){

  $('#home').classList.add('hide');const H=$('#hub');H.classList.remove('hide');

  <div class="parts">${PARTS.map((p,i)=>`<button class="part" data-p="${p.id}" style="--pc:${p.c}">
     <span class="step">${AR(i+1)} · ${p.name}</span><span class="ico">${p.ico}</span>
     <b>${L.parts[p.id].name}</b><small>${L.parts[p.id].hint}</small>
     ${PROG[L.id+'-'+p.id]?`<span class="done">${stars(PROG[L.id+'-'+p.id])}</span>`:''}</button>`).join('')}</div>`;
  $('#hubBack').onclick=()=>{sfx.click();H.classList.add('hide');$('#home').classList.remove('hide');renderHome();scrollTo(0,0);};

function openPart(pid){
  const L=CUR.lesson,P=PARTS.find(p=>p.id===pid);CUR.part=pid;
  $('#stage').classList.remove('hide');document.body.style.overflow='hidden';
  $('#stage').style.setProperty('--c',L.color);
  $('#stTitle').textContent=L.parts[pid].name;
  $('#stSub').textContent=P.name+' · '+L.title;
  $('#stSound').textContent=SND.on?'🔊':'🔇';
  runPart();
}
function runPart(){
  if(CUR.lesson&&CUR.lesson.id==='self'){openSelf();return;}
  if(CUR.cleanup){try{CUR.cleanup();}catch(e){}CUR.cleanup=null;}
  const B=$('#stageBody');B.innerHTML='';B.scrollTop=0;
  const L=CUR.lesson,pid=CUR.part;
  const wrap=el('<div class="act-wrap"></div>');B.appendChild(wrap);
  if(pid==='pres'){runSlides(wrap,L.slides);}
  else{const fn=L.parts[pid].run;CUR.cleanup=fn(wrap,(n,msg)=>finish(n,msg))||null;}
}
function closeStage(){
  if(CUR.cleanup){try{CUR.cleanup();}catch(e){}CUR.cleanup=null;}
  $('#stage').classList.add('hide');document.body.style.overflow='';$('#stageBody').innerHTML='';
  $('#celebrate')&&$('#celebrate').remove();
  if(CUR.lesson&&CUR.lesson.id!=='self')openHub(CUR.lesson.id);else{$('#hub').classList.add('hide');$('#home').classList.remove('hide');renderHome();}
}
$('#stBack').onclick=()=>{sfx.click();closeStage();};
$('#stRestart').onclick=()=>{sfx.click();$('#celebrate')&&$('#celebrate').remove();runPart();};
$('#stSound').onclick=toggleSound;

function finish(n=3,msg){
  n=Math.max(1,Math.min(3,n));
  const k=CUR.lesson.id+'-'+CUR.part;PROG[k]=Math.max(PROG[k]||0,n);saveProg();
  sfx.win();confetti();
  const idx=PARTS.findIndex(p=>p.id===CUR.part),next=PARTS[idx+1];
  const titles=['','أَحْسَنْتَ!','رائِعٌ جِدًّا!','مُمْتازٌ يا بَطَلُ!'];
  const c=el(`<div id="celebrate"><div class="cel-card"><div class="stars">${stars(n)}</div><h3>${titles[n]}</h3><p>${msg||'أنهيتَ هذه المحطة بنجاح.'}</p>
   <div class="row"><button class="big-btn ghost" id="celAgain">↻ مرة أخرى</button>
   ${next?`<button class="big-btn" id="celNext" style="--c:${next.c}">${next.ico} ${next.name}</button>`:`<button class="big-btn" id="celHub">🏁 إلى المحطة</button>`}</div></div></div>`);
  document.body.appendChild(c);
  $('#celAgain').onclick=()=>{c.remove();runPart();};
  if(next)$('#celNext').onclick=()=>{c.remove();openPart(next.id);};
  else $('#celHub').onclick=()=>{c.remove();closeStage();};
}

/* ---- small UI helpers ---- */
function brief(parent,ico,html){const b=el(`<div class="brief"><span class="bi">${ico}</span><p>${html}</p></div>`);parent.appendChild(b);return b;}
function bubble(target,html){
  $$('.bubble').forEach(b=>b.remove());
  const b=el(`<div class="bubble">${html}</div>`);document.body.appendChild(b);
  const r=target.getBoundingClientRect();let top=r.bottom+8,left=r.left+r.width/2-b.offsetWidth/2;
  left=Math.max(10,Math.min(innerWidth-b.offsetWidth-10,left));if(top+b.offsetHeight>innerHeight-10)top=r.top-b.offsetHeight-8;
  b.style.top=top+'px';b.style.left=left+'px';
  const off=e=>{if(e.target!==target){b.remove();document.removeEventListener('pointerdown',off,true);}};
  setTimeout(()=>document.addEventListener('pointerdown',off,true),10);setTimeout(()=>b.remove(),6000);
}
/* multiple choice block: returns promise(firstTryCorrect) */
function askMCQ(parent,q,options,correct,{cols}={}){
  return new Promise(res=>{
    const box=el(`<div class="pop"><div class="q-text">${q}</div><div class="opts"></div></div>`);
    const o=$('.opts',box);if(cols)o.style.gridTemplateColumns=`repeat(${cols},1fr)`;
    let first=true;
    shuffle(options.map((t,i)=>({t,i}))).forEach(({t,i})=>{
      const b=el(`<button class="opt">${t}</button>`);o.appendChild(b);
      b.onclick=()=>{if(box.dataset.done)return;
        if(i===correct){b.classList.add('right');sfx.ok();box.dataset.done=1;setTimeout(()=>res(first),650);}
        else{b.classList.add('wrong');sfx.bad();first=false;setTimeout(()=>b.classList.remove('wrong'),600);}};
    });
    parent.appendChild(box);
  });
}

<script>
/* ================= PRESENTATION ENGINE ================= */
function runSlides(wrap,slides){
  let i=0;
  const box=el(`<div class="slides"><div class="slide"></div>
    <div class="slide-nav"><button class="big-btn ghost" id="sPrev">→ السابق</button><div class="dots"></div><button class="big-btn" id="sNext">التالي ←</button></div></div>`);
  wrap.appendChild(box);
  const dots=$('.dots',box);dots.innerHTML=slides.map(()=>'<i></i>').join('');
  function show(dir){
    const old=$('.slide',box),s=el('<div class="slide"></div>');old.replaceWith(s);
    s.innerHTML=slides[i];wire(s);
    $$('i',dots).forEach((d,k)=>d.classList.toggle('on',k===i));
    $('#sPrev').style.visibility=i?'visible':'hidden';
    $('#sNext').textContent=i===slides.length-1?'إنهاء العرض ✓':'التالي ←';
    if(dir)sfx.whoosh();
  }
  const next=()=>{if(i<slides.length-1){i++;show(1);}else finish(3,'شاهدتَ العرض التقديمي كاملًا. أحسنتَ الانتباه!');};
  const prev=()=>{if(i>0){i--;show(1);}};
  $('#sNext').onclick=next;$('#sPrev').onclick=prev;
  const key=e=>{if($('#celebrate'))return;if(e.key==='ArrowLeft')next();if(e.key==='ArrowRight')prev();};
  document.addEventListener('keydown',key);
  CUR.cleanup=()=>document.removeEventListener('keydown',key);
  show();
}
function wire(s){
  $$('.w',s).forEach(w=>w.onclick=()=>{sfx.pop();w.classList.add('seen');bubble(w,`<b>${w.textContent}</b>: ${w.dataset.m}`);});
  $$('.rev',s).forEach(r=>r.onclick=()=>{sfx.flip();r.classList.toggle('open');});
  $$('.qz',s).forEach(q=>{
    const opts=$$('.opt',q);
    opts.forEach(o=>o.onclick=()=>{
      if(q.dataset.done)return;
      if(o.hasAttribute('data-ok')){o.classList.add('right');sfx.ok();q.dataset.done=1;}
      else{o.classList.add('wrong');sfx.bad();setTimeout(()=>o.classList.remove('wrong'),600);}
    });
  });
  $$('[data-fn]',s).forEach(n=>SLIDEFN[n.dataset.fn]&&SLIDEFN[n.dataset.fn](n));
}
const SLIDEFN={
  /* handwriting tracing canvas */
  trace(n){
    const items=n.dataset.g.split('|');
    n.innerHTML=`<div class="trace-tools">${items.map((t,k)=>`<button data-k="${k}" class="${k?'':'on'}">${t}</button>`).join('')}<button data-clear="1">🧽 امسح</button></div>
      <div class="trace-box" style="height:${n.dataset.h||230}px"><canvas></canvas></div>`;
    const cv=$('canvas',n),box=$('.trace-box',n),cx=cv.getContext('2d');let guide=items[0],drawing=false,last=null;
    const ink=getComputedStyle($('#stage')).getPropertyValue('--c')||'#8466E6';
    function size(){const r=box.getBoundingClientRect(),d=devicePixelRatio||1;cv.width=r.width*d;cv.height=r.height*d;cx.setTransform(d,0,0,d,0,0);paint();}
    function paint(){const r=box.getBoundingClientRect();cx.clearRect(0,0,r.width,r.height);
      cx.strokeStyle='#E7DDC6';cx.lineWidth=2;cx.setLineDash([6,6]);cx.beginPath();cx.moveTo(10,r.height*.68);cx.lineTo(r.width-10,r.height*.68);cx.stroke();cx.setLineDash([]);
      let fs=Math.min(r.height*.62,(r.width*.9)/Math.max(1,guide.length*.55));
      cx.font=`700 ${fs}px Amiri, "Noto Naskh Arabic", serif`;cx.fillStyle='rgba(29,41,70,.14)';cx.textAlign='center';cx.textBaseline='alphabetic';cx.direction='rtl';
      cx.fillText(guide,r.width/2,r.height*.68);
      cx.strokeStyle='rgba(29,41,70,.28)';cx.lineWidth=1.2;cx.setLineDash([3,4]);cx.strokeText(guide,r.width/2,r.height*.68);cx.setLineDash([]);}
    const pos=e=>{const r=cv.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top};};
    cv.onpointerdown=e=>{drawing=true;last=pos(e);cv.setPointerCapture(e.pointerId);};
    cv.onpointermove=e=>{if(!drawing)return;const p=pos(e);cx.strokeStyle=ink.trim();cx.lineWidth=9;cx.lineCap='round';cx.lineJoin='round';cx.beginPath();cx.moveTo(last.x,last.y);cx.lineTo(p.x,p.y);cx.stroke();last=p;};
    cv.onpointerup=cv.onpointercancel=()=>{drawing=false;};
    $$('.trace-tools button',n).forEach(b=>b.onclick=()=>{sfx.click();if(b.dataset.clear){paint();return;}
      $$('.trace-tools button',n).forEach(x=>x.classList.remove('on'));b.classList.add('on');guide=items[+b.dataset.k];paint();});
    requestAnimationFrame(size);document.fonts&&document.fonts.ready.then(()=>size());
  },
  /* teacher loads the listening audio */
  audio(n){
    n.innerHTML=`<div class="rule" style="display:flex;flex-wrap:wrap;gap:10px;align-items:center">
      <span style="font-size:34px">🎧</span><div style="flex:1;min-width:200px"><b>للمعلم/ة:</b> اختر ملف التسجيل الصوتي للتمثيلية من جهازك ليُشغَّل هنا.</div>
      <label class="big-btn" style="cursor:pointer">📂 اختيار ملف صوتي<input type="file" accept="audio/*" hidden id="audFile"></label></div>
      <audio controls style="width:100%;margin-top:8px" hidden></audio>`;
    const a=$('audio',n);$('#audFile',n).onchange=e=>{const f=e.target.files[0];if(!f)return;a.src=URL.createObjectURL(f);a.hidden=false;a.play().catch(()=>{});};
  },
  /* poem memorization: hide words gradually */
  memo(n){
    const lines=$$('.ml',n);
    lines.forEach(l=>{l.innerHTML=l.textContent.trim().split(/\s+/).map(w=>w==='⁂'?'<i>⁂</i>':`<span class="mw">${w}</span>`).join(' ');});
    const words=$$('.mw',n);
    const bar=el(`<div class="trace-tools" style="justify-content:center"><button id="mHide">🙈 أخفِ كلمات</button><button id="mShow">👀 أظهر الكل</button></div>`);
    n.prepend(bar);
    words.forEach(w=>{w.style.cssText='display:inline-block;border-radius:8px;padding:0 4px;transition:.2s';w.onclick=()=>{if(w.dataset.h){w.dataset.h='';w.style.color='';w.style.background='';sfx.pop();}};});
    $('#mHide',n).onclick=()=>{sfx.flip();const vis=words.filter(w=>!w.dataset.h);shuffle(vis).slice(0,Math.max(1,Math.ceil(words.length*.2))).forEach(w=>{w.dataset.h=1;w.style.color='transparent';w.style.background='#E4F1EA';});};
    $('#mShow',n).onclick=()=>{sfx.click();words.forEach(w=>{w.dataset.h='';w.style.color='';w.style.background='';});};
  },
  /* Said's route in Muttrah */
  route(n){
    const stops=[
      {t:'سوقُ مَطْرَحَ',e:'🛍️',x:86,y:20},{t:'حارَةُ الْعَرينِ',e:'🏘️',x:62,y:12},{t:'الدَّرْبُ وَراءَ الْمُسْتَشْفى',e:'🏥',x:40,y:30},
      {t:'طاحونَةُ الْهَواءِ',e:'🌬️',x:16,y:22},{t:'حارَةُ اللُّولُوَةِ',e:'🏠',x:22,y:62},{t:'الشِّجَيْجِيَّةُ: الْعَمُّ شَعْبانُ',e:'🍮',x:52,y:78},{t:'الْبَيْتُ',e:'🚪',x:84,y:66}];
    n.innerHTML=`<div style="position:relative;aspect-ratio:16/10;max-width:100%;background:linear-gradient(160deg,#FCEFD2,#F4DDAE);border-radius:22px;border:2px solid #E6CB92;overflow:hidden">
      <div style="position:absolute;inset:auto 0 0 0;height:14%;background:linear-gradient(#7CC6F0,#3BA7EE);opacity:.8"></div>
      <span style="position:absolute;bottom:2%;left:3%;font-size:14px;color:#fff;font-weight:800">🌊 بَحْرُ مَطْرَحَ</span>
      <svg viewBox="0 0 100 100" preserveAspectRatio="none" style="position:absolute;inset:0;width:100%;height:100%"><polyline fill="none" stroke="#E4485A" stroke-width="1.2" stroke-dasharray="3 2" stroke-linecap="round" points=""/></svg>
      ${stops.map((s,k)=>`<button data-k="${k}" style="position:absolute;left:${s.x}%;top:${s.y}%;transform:translate(-50%,-50%);background:#fff;border:3px solid #D9B77A;border-radius:16px;padding:4px 8px;font-size:clamp(11px,1.6vw,15px);font-weight:800;display:flex;flex-direction:column;align-items:center;line-height:1.2;max-width:28%"><span style="font-size:clamp(20px,3.4vw,32px)">${s.e}</span>${s.t}</button>`).join('')}
      </div><p style="text-align:center;margin:8px 0 0" id="rMsg">اضغط الأماكن بالترتيب الذي سار فيه سعيد، وابدأ من سوق مطرح.</p>`;
    let k=0;const pl=$('polyline',n),pts=[];
    $$('button',n).forEach(b=>b.onclick=()=>{const j=+b.dataset.k;
      if(j===k){sfx.step();b.style.borderColor='#18966A';b.style.background='#E3F7EC';pts.push(`${stops[j].x},${stops[j].y}`);pl.setAttribute('points',pts.join(' '));k++;
        if(k===stops.length){sfx.win();$('#rMsg',n).textContent='أحسنت! هذا هو طريق سعيد حتى وصل إلى بيته 🎉';}}
      else if(j>k){sfx.bad();b.animate([{transform:'translate(-50%,-50%) rotate(-6deg)'},{transform:'translate(-50%,-50%) rotate(6deg)'},{transform:'translate(-50%,-50%)'}],{duration:300});}});
  },

 ],
 parts:{
  pres:{name:'حِكايَةُ الْحَمامَةِ',hint:'نَقْرَأُ الْحِكايَةَ وَنَكْتَشِفُ مَعانِيَ الْكَلِماتِ وَالْأَساليبَ'},
  pre:{name:'مَنْ أَنا؟',hint:'أَلْغازٌ بِالتَّلْميحاتِ لِنَتَعَرَّفَ شَخْصِيّاتِ الْحِكايَةِ',run(W,done){
    brief(W,'🕵️','اقرأ التلميح، ثم اختر الشخصية. كلما عرفتها بتلميحات أقل ربحت نقاطًا أكثر!');
    const C=[
      {e:'🕊️',n:'الْحَمامَةُ',c:['أَنا طائِرٌ وَديعٌ، لَوْني أَبْيَضُ أَوْ رَمادِيٌّ.','صَوْتي يُسَمّى الْهَديلَ.','بَعْضُنا في عُنُقِهِ طَوْقٌ مُلَوَّنٌ.']},
      {e:CROW,n:'الْغُرابُ',c:['لَوْني أَسْوَدُ لامِعٌ.','صَوْتي نَعيقٌ: غاق... غاق!','أَبْني عُشّي فَوْقَ الشَّجَرِ الْعالي.']},
      {e:'🐀',n:'الْجُرَذُ',c:['أَنا حَيَوانٌ صَغيرٌ لي ذَيْلٌ طَويلٌ.','أَسْناني حادَّةٌ أَقْرِضُ بِها.','أَسْكُنُ في جُحْرٍ تَحْتَ الْأَرْضِ.']},
      {e:'🧑‍🌾',n:'الصَّيّادُ',c:['أَخْرُجُ كُلَّ صَباحٍ إِلى الْبَرِّ.','أَحْمِلُ شَبَكَةً عَلى كَتِفي.','أَنْثُرُ الْحَبَّ لِأَجْذِبَ الطُّيورَ.']}];
    const D=[{e:'🦊',n:'الثَّعْلَبُ'},{e:'🐢',n:'السُّلَحْفاةُ'}];
    const order=shuffle(C);let idx=0,score=0;
    const sb=el('<div class="scorebar"><span class="chip" id="rq"></span><span class="chip" id="rs"></span></div>');W.appendChild(sb);
    const A=el('<div style="display:flex;flex-direction:column;gap:14px"></div>');W.appendChild(A);
    function round(){
      const ch=order[idx];let shown=1,locked=false;
      $('#rq',W).textContent=`اللغز ${AR(idx+1)} من ${AR(order.length)}`;$('#rs',W).textContent=`⭐ النقاط: ${AR(score)}`;
      A.innerHTML=`<div class="brief pop" style="flex-direction:column;align-items:stretch;background:#FFFBEF;border-color:#F3DFA8"><div style="font-size:46px;text-align:center">❔</div><div id="clues" class="ar" style="font-size:clamp(20px,3.4vw,27px);line-height:2"></div>
        <button class="big-btn ghost" id="more" style="align-self:center">💡 تلميح آخر</button></div><div class="opts" id="ropts"></div>`;
      const paint=()=>{$('#clues',A).innerHTML=ch.c.slice(0,shown).map((c,i)=>`<div class="pop">${AR(i+1)}. ${c}</div>`).join('');$('#more',A).style.visibility=shown<3?'visible':'hidden';};paint();
      $('#more',A).onclick=()=>{sfx.flip();shown++;paint();};
      shuffle(C.concat(D)).forEach(o=>{const b=el(`<button class="opt" style="font-family:var(--f-ui)"><div style="font-size:44px">${o.e}</div>${o.n}</button>`);
        b.onclick=()=>{if(locked)return;
          if(o.n===ch.n){locked=true;b.classList.add('right');sfx.ok();score+=4-shown;$('#rs',W).textContent=`⭐ النقاط: ${AR(score)}`;
            setTimeout(()=>{idx++;idx<order.length?round():done(score>=10?3:score>=7?2:1,`جمعتَ ${AR(score)} نقطة من ${AR(12)}. عرفتَ شخصيات الحكاية!`);},900);}
          else{b.classList.add('wrong');sfx.bad();setTimeout(()=>b.classList.remove('wrong'),500);if(shown<3){shown++;paint();}}};
        $('#ropts',A).appendChild(b);});
    }
    round();
  }},
  post:{name:'أُرَتِّبُ الْأَحْداثَ',hint:'نَضَعُ أَحْداثَ الْحِكايَةِ في تَرْتيبِها الصَّحيحِ',run(W,done){
    brief(W,'🔢','اضغط الأحداث بترتيب وقوعها في الحكاية، ثم اضغط «تحقّق». لإرجاع حدثٍ اضغطه في مكانه.');
    const E=[['🧑‍🌾','الصَّيّادُ يَنْصِبُ شَبَكَتَهُ وَيَنْثُرُ عَلَيْها الْحَبَّ.'],['🕊️','الْحَماماتُ يَلْتَقِطْنَ الْحَبَّ فَيَعْلَقْنَ في الشَّبَكَةِ.'],['🗣️','الْمُطَوَّقَةُ تَدْعو صاحِباتِها إِلى التَّعاوُنِ.'],['🪽','الْحَماماتُ يَطِرْنَ دَفْعَةً واحِدَةً وَيَقْلَعْنَ الشَّبَكَةَ.'],['📣','الْمُطَوَّقَةُ تُنادي صَديقَها الْجُرَذَ بِاسْمِهِ.'],['🐀','الْجُرَذُ يَقْطَعُ الشَّبَكَةَ فَتَنْطَلِقُ الْحَماماتُ.']];
    const slots=Array(E.length).fill(null);let tries=0;
    const S=el('<div style="display:grid;gap:8px"></div>'),P=el('<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px"></div>');
    const chk=el('<button class="big-btn" style="align-self:center">✔ تحقّق</button>');
    W.append(S,el('<div style="text-align:center;font-weight:800;color:var(--ink2)">⬇️ بطاقات الأحداث ⬇️</div>'),P,chk);
    let pool=shuffle(E.map((e,i)=>i));
    function paint(){
      S.innerHTML='';slots.forEach((v,i)=>{const b=el(`<button class="tile" style="display:flex;gap:10px;align-items:center;min-height:58px;text-align:right;${v==null?'border-style:dashed;background:#F7FBF9;color:var(--ink2)':''}"><b style="background:var(--c);color:#fff;border-radius:10px;min-width:34px;text-align:center;font-family:var(--f-ui)">${AR(i+1)}</b>${v==null?'…':`<span>${E[v][0]}</span><span>${E[v][1]}</span>`}</button>`);
        b.onclick=()=>{if(v==null)return;sfx.pop();slots[i]=null;pool.push(v);paint();};S.appendChild(b);});
      P.innerHTML='';pool.forEach(v=>{const b=el(`<button class="tile" style="display:flex;gap:10px;align-items:center;text-align:right"><span style="font-size:28px">${E[v][0]}</span><span>${E[v][1]}</span></button>`);
        b.onclick=()=>{const k=slots.indexOf(null);if(k<0)return;sfx.step();slots[k]=v;pool=pool.filter(x=>x!==v);paint();};P.appendChild(b);});
    }
    chk.onclick=()=>{if(slots.includes(null)){toast('رتّب كل الأحداث أولًا 🙂');sfx.bad();return;}

    const A=el('<div style="display:flex;flex-direction:column;gap:14px"></div>');W.appendChild(A);
    let myW=0,max=0,mist=0,inBag=new Set();
    A.innerHTML=`<div class="q-text">كَمْ وَزْنُكَ تَقْريبًا؟</div><div class="opts" id="wts">${[20,25,30].map(v=>`<button class="opt" data-v="${v}">⚖️ ${AR(v)} كغ</button>`).join('')}</div>`;
    $$('[data-v]',A).forEach(b=>b.onclick=async()=>{sfx.click();myW=+b.dataset.v;max=myW/5;A.innerHTML='';
      const others=[myW/2,myW/10,myW-5];const first=await askMCQ(A,`وَزْنُكَ ${AR(myW)} كغ. ما أَقْصى وَزْنٍ لِحَقيبَتِكَ (خُمْسُ وَزْنِكَ)؟`,[`${AR(max)} كغ`,...others.map(o=>`${AR(o)} كغ`)],0);if(!first)mist++;pack();});
    function pack(){
      A.innerHTML=`<div style="display:flex;gap:16px;flex-wrap:wrap;align-items:flex-end;justify-content:center">
        <div style="text-align:center"><div id="bag" style="font-size:clamp(90px,18vw,130px);line-height:1;transition:transform .2s">🎒</div><div id="bagIn" style="font-size:26px;min-height:36px;max-width:260px"></div></div>
        <div style="flex:1;min-width:230px;max-width:420px"><b>وَزْنُ الْحَقيبَةِ</b> <span id="kg" class="chip" style="font-variant-numeric:tabular-nums"></span>
          <div style="position:relative;height:30px;border-radius:99px;background:#EDF3F0;border:2px solid var(--line);overflow:hidden;margin-top:6px"><div id="bar" style="height:100%;width:0;background:var(--sky);transition:width .3s,background .3s"></div></div>
          <small style="color:var(--ink2)">الحد الأقصى: ${AR(max)} كغ</small></div></div>
        <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px" id="its"></div>
        <button class="big-btn" id="ready" style="align-self:center">🎒 حقيبتي جاهزة</button>`;
      I.forEach((it,i)=>{const b=el(`<button class="opt" style="font-family:var(--f-ui);font-size:15px;padding:8px"><div style="font-size:36px">${it[0]}</div>${it[1]}<div style="color:var(--ink2);font-size:13px">${AR(it[2].toString())} كغ</div></button>`);
        b.onclick=()=>{if(inBag.has(i)){inBag.delete(i);b.style.borderColor='';b.style.background='';sfx.flip();}else{inBag.add(i);b.style.borderColor='var(--sky)';b.style.background='#E6F4FE';sfx.pop();$('#bag',A).animate([{transform:'scale(1.12)'},{transform:'scale(1)'}],{duration:220});}paint();};$('#its',A).appendChild(b);});
      const total=()=>[...inBag].reduce((s,i)=>s+I[i][2],0);
      function paint(){const t=total();$('#kg',A).textContent=AR(t.toFixed(1))+' كغ';const p=Math.min(100,t/max*100);$('#bar',A).style.width=p+'%';$('#bar',A).style.background=t>max?'var(--bad)':p>85?'var(--sun)':'var(--sky)';$('#bagIn',A).textContent=[...inBag].map(i=>I[i][0]).join('');}
      paint();
      $('#ready',A).onclick=()=>{const t=total(),miss=I.filter((it,i)=>it[3]&&!inBag.has(i)),extra=[...inBag].filter(i=>!I[i][3]);
        if(t>max){mist++;sfx.bad();toast(`⚠️ الحقيبة أثقل من ${AR(max)} كغ! أخرِج ما لا تحتاجه اليوم.`,2400);return;}
        if(miss.length){mist++;sfx.bad();toast(`🤔 نسيتَ شيئًا تحتاجه اليوم: ${miss[0][0]} ${miss[0][1]}`,2400);return;}
        if(extra.length){mist++;sfx.bad();toast(`💡 ${I[extra[0]][0]} ${I[extra[0]][1]} لا تحتاجه اليوم، أخرِجه لتخفّ حقيبتك.`,2400);return;}
        done(mist===0?3:mist<=2?2:1,`حقيبتك ${AR(t.toFixed(1))} كغ فقط، أقل من خُمس وزنك (${AR(max)} كغ). ظهرك سيشكرك!`);};
    }
  }},
  game:{name:'ذاكِرَةُ الْإِرْشاداتِ',hint:'أَقْلِبُ الْبِطاقاتِ وَأُطابِقُ الرَّمْزَ مَعَ الْإِرْشادِ',run(W,done){
    brief(W,'🃏','اقلب بطاقتين في كل مرة، وطابق كل رمز مع الإرشاد الذي يدلّ عليه. تذكّر أماكن البطاقات!');
    const P=POSTER;let cards=shuffle(P.flatMap((p,i)=>[{i,t:'e',v:p[0]},{i,t:'x',v:p[1]}]));
    let open=[],moves=0,pairs=0,lock=false;
    const sb=el('<div class="scorebar"><span class="chip" id="mm">🔄 المحاولات: ٠</span><span class="chip" id="mp">✅ ٠ / ٦</span></div>');
    const G=el('<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(min(150px,28vw),1fr));gap:10px"></div>');W.append(sb,G);
    cards.forEach((c,k)=>{const b=el(`<button style="perspective:600px;height:clamp(110px,20vw,140px);padding:0"><div class="in" style="position:relative;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d">
      <div style="position:absolute;inset:0;backface-visibility:hidden;border-radius:18px;background:repeating-linear-gradient(45deg,#3BA7EE 0 12px,#57B6F2 12px 24px);display:grid;place-items:center;font-size:40px;border:3px solid #fff;box-shadow:0 4px 0 #9ccff5">🎒</div>
      <div style="position:absolute;inset:0;backface-visibility:hidden;transform:rotateY(180deg);border-radius:18px;background:#fff;border:3px solid var(--line);display:grid;place-items:center;padding:6px;${c.t==='e'?'font-size:52px':'font-family:var(--f-text);font-size:clamp(13px,2vw,16px);font-weight:700;line-height:1.6'}">${c.v}</div></div></button>`);
      b.onclick=()=>{if(lock||b.dataset.o)return;b.dataset.o=1;$('.in',b).style.transform='rotateY(180deg)';sfx.flip();open.push([b,c]);
        if(open.length===2){moves++;$('#mm',W).textContent='🔄 المحاولات: '+AR(moves);const [a,d]=open;
          if(a[1].i===d[1].i&&a[1].t!==d[1].t){pairs++;sfx.ok();[a[0],d[0]].forEach(x=>$('.in div:last-child',x).style.borderColor='var(--ok)');open=[];$('#mp',W).textContent=`✅ ${AR(pairs)} / ٦`;
            if(pairs===6)setTimeout(()=>done(moves<=10?3:moves<=16?2:1,`طابقتَ كل الإرشادات في ${AR(moves)} محاولة.`),500);}
          else{lock=true;setTimeout(()=>{sfx.bad();open.forEach(([x])=>{x.dataset.o='';$('.in',x).style.transform='';});open=[];lock=false;},900);}}};
      G.appendChild(b);});
  }}
 }
});
</script>

  `<span class="eyebrow">الْكاتِبَةُ</span><h2>د. جوخَةُ الْحارِثِيَّةُ</h2>

 parts:{
  pres:{name:'حِكايَةُ نورَةَ',hint:'النَّصُّ وَمَعانيهِ، وَالِاسْمُ وَالْفِعْلُ وَالْحَرْفُ، وَالتّاءاتُ، وَالْخَطُّ'},

        <div style="font-size:clamp(34px,7vw,58px);line-height:1.2">👦📖<br>👦📖</div>

      cx.fillStyle='rgba(255,255,255,.35)';for(let i=0;i<60;i++){cx.beginPath();cx.arc(Math.random()*r.width,Math.random()*r.height,2+Math.random()*4,0,7);cx.fill();}

  post:{name:'أَرْبِطُ رُكْنَيِ الْجُمْلَةِ',hint:'أَصِلُ الرُّكْنَ الْأَوَّلَ بِالرُّكْنِ الثّاني بِخَطٍّ لِتَتَكَوَّنَ جُمْلَةٌ اسْمِيَّةٌ',run(W,done){

    const P=[['الْأَبُ','مُسافِرٌ'],['الْقُرْآنُ الْكَريمُ','عَظيمٌ'],['شَجَرَةُ اللَّيْمونِ','أَمامَ الْبَيْتِ'],['الْمَدْرَسَةُ','ساحَتُها نَظيفَةٌ'],['الْعامِلونَ','يُخْلِصونَ في أَعْمالِهِمْ'],['الْحَلْوى اللَّذيذَةُ','عَلى الطّاوِلَةِ']];
    const L=shuffle(P.map((p,i)=>i)),Rr=shuffle(P.map((p,i)=>i));let a=null,mist=0,got=0;

    const svg=$('svg',box),lines=[];
    L.forEach(i=>$('#c1',box).appendChild(el(`<button class="tile" data-a="${i}">${P[i][0]} <span style="color:var(--c)">●</span></button>`)));
    Rr.forEach(i=>$('#c2',box).appendChild(el(`<button class="tile" data-b="${i}"><span style="color:var(--c)">●</span> ${P[i][1]}</button>`)));
    const pt=(e,side)=>{const r=e.getBoundingClientRect(),b=box.getBoundingClientRect();return{x:(side?r.right:r.left)-b.left,y:r.top+r.height/2-b.top};};
    function drawAll(){svg.innerHTML=lines.map(l=>{const p1=pt(l.a,0),p2=pt(l.b,1);return `<line x1="${p1.x}" y1="${p1.y}" x2="${p2.x}" y2="${p2.y}" stroke="${l.c}" stroke-width="5" stroke-linecap="round"/><circle cx="${p1.x}" cy="${p1.y}" r="7" fill="${l.c}"/><circle cx="${p2.x}" cy="${p2.y}" r="7" fill="${l.c}"/>`;}).join('');}
    const ro=new ResizeObserver(drawAll);ro.observe(box);
    $$('[data-a]',box).forEach(b=>b.onclick=()=>{if(b.dataset.done)return;sfx.click();$$('[data-a]',box).forEach(x=>x.classList.remove('sel'));b.classList.add('sel');a=b;});
    $$('[data-b]',box).forEach(b=>b.onclick=()=>{if(!a||b.dataset.done){if(!a){toast('ابدأ بالركن الأول من اليمين 👉');}return;}
      if(a.dataset.a===b.dataset.b){sfx.ok();const l={a,b,c:'#1FAE66'};lines.push(l);a.dataset.done=b.dataset.done=1;a.classList.remove('sel');[a,b].forEach(x=>{x.style.borderColor='var(--ok)';x.style.background='#E3F7EC';});
        $('#sent',W).innerHTML+=`<div class="pop">✔ ${P[+a.dataset.a][0]} ${P[+a.dataset.a][1]}.</div>`;a=null;got++;drawAll();
        if(got===P.length)setTimeout(()=>done(mist<=1?3:mist<=3?2:1,'كوّنتَ ست جمل اسمية، لكلّ منها ركنان.'),600);}
      else{mist++;sfx.bad();const l={a,b,c:'#E4485A'};lines.push(l);drawAll();b.classList.add('wrong');setTimeout(()=>{lines.splice(lines.indexOf(l),1);drawAll();b.classList.remove('wrong');},650);}});

  game:{name:'صَيّادُ التَّنْوينِ',hint:'أَصْطادُ الْأَسْماكَ الَّتي تَحْمِلُ نَوْعَ التَّنْوينِ الْمَطْلوبِ',run(W,done){
    const RD=[{t:'تَنْوينَ الضَّمِّ ـٌ',g:['سَعيدٌ','رَجُلٌ','طَيِّبٌ','شَقٌّ','صَغيرٌ','تَمْرٌ','بَيْتٌ','سوقٌ'],b:['عائِدًا','قَريبًا','طَريقٍ','عامٍ','هَدِيَّةً','صَوابٍ']},
      {t:'تَنْوينَ الْفَتْحِ ـً',g:['عائِدًا','قَريبًا','هَدِيَّةً','كَثيرًا','جَوابًا','دائِمًا','مَساءً','تَمْرًا'],b:['سَعيدٌ','رَجُلٌ','طَريقٍ','ضَيِّقٍ','شَقٌّ','عامٍ']},
      {t:'تَنْوينَ الْكَسْرِ ـٍ',g:['طَريقٍ','ضَيِّقٍ','عامٍ','صَوابٍ','تَمْرٍ','بَيْتٍ','هَواءٍ','سوقٍ'],b:['طَيِّبٌ','صَغيرٌ','كَثيرًا','جَوابًا','دائِمًا','بَيْتٌ']},
      {t:'الْكِتابَةَ الصَّحيحَةَ لِلتَّنْوينِ',g:['شَجَرَةٌ','جُزْءًا','مَساءً','لُعْبَةٌ','بِبُطْءٍ','هَدِيَّةً'],b:['شَجَرَتُنْ','جُزْءَنْ','مَساءَنْ','لُعْبَتُنْ','بِبُطْئِنْ','هَدِيَّتَنْ']}];

    const sb=el('<div class="scorebar"><span class="chip" id="ft"></span><span class="chip" id="fs">🐟 ٠</span><span class="chip" id="fc"></span></div>');
    const A=el(`<div style="position:relative;height:min(60vh,500px);border-radius:26px;overflow:hidden;background:linear-gradient(#BDE7FF 0 16%,#5CC0EE 16%,#2E8FD0 70%,#1F6FA8);border:3px solid #2E8FD0;user-select:none">
      <div style="position:absolute;top:1%;right:3%;font-size:44px">🚣</div>

      <div id="hook" style="position:absolute;font-size:26px;display:none;transform:translate(-50%,-50%)">🪝</div>
      <div id="ov" style="position:absolute;inset:0;display:grid;place-items:center;background:rgba(255,255,255,.7);text-align:center"></div></div>`);
    W.append(sb,A);
    let r=0,score=0,fish=[],run=false,raf,last,t=0,clock,mist=0;const FE=['🐟','🐠','🐡'];
    function intro(){const R_=RD[r];$('#ov',A).style.display='grid';$('#ov',A).innerHTML=`<div><div style="font-weight:800;font-size:22px">الجولة ${AR(r+1)} من ${AR(RD.length)}</div><div style="font-family:var(--f-display);font-size:clamp(28px,5vw,40px);color:#1F6FA8">اصْطَدْ ${R_.t}</div><button class="big-btn" style="--c:#2E8FD0">🎣 ابدأ الصيد</button></div>`;
      $('#ft',W).innerHTML=`🎯 اصْطَدْ <b>${R_.t}</b>`;$('#ov button',A).onclick=start;}
    function addFish(){const R_=RD[r],good=Math.random()<.5,word=(good?R_.g:R_.b)[Math.floor(Math.random()*(good?R_.g:R_.b).length)];
      const dir=Math.random()<.5?1:-1,f=el(`<button style="position:absolute;display:flex;align-items:center;gap:2px;${dir>0?'flex-direction:row-reverse;':''}background:none"><span style="font-size:clamp(34px,6vw,46px);display:inline-block;transform:scaleX(${dir>0?-1:1})">${FE[Math.floor(Math.random()*3)]}</span><span class="ar" style="background:#fff;border-radius:14px;padding:2px 10px;font-weight:700;font-size:clamp(17px,3vw,22px);box-shadow:0 3px 0 rgba(0,0,0,.15)">${word}</span></button>`);
      const lane=fish.length%5;const o={f,good,x:dir>0?-.25:1.05,y:.24+lane*.14+Math.random()*.03,v:(.07+Math.random()*.06)*dir};f.style.top=(o.y*100)+'%';A.appendChild(f);fish.push(o);
      f.onclick=()=>catchF(o);}
    function catchF(o){if(!run||o.caught)return;o.caught=1;const ar=A.getBoundingClientRect(),fr=o.f.getBoundingClientRect(),x=fr.left-ar.left+fr.width/2,y=fr.top-ar.top+fr.height/2;
      const ln=$('#ln',A),hk=$('#hook',A);ln.setAttribute('x1',ar.width*.9);ln.setAttribute('y1',ar.height*.1);ln.setAttribute('x2',x);ln.setAttribute('y2',y);hk.style.display='block';hk.style.left=x+'px';hk.style.top=y+'px';
      if(o.good){score++;sfx.splash();setTimeout(()=>sfx.ok(),150);o.f.style.transition='transform .5s, opacity .5s';o.f.style.transform=`translate(${ar.width*.9-x}px,${-y}px) scale(.4)`;o.f.style.opacity=0;}
      else{mist++;score=Math.max(0,score-1);sfx.bad();o.f.animate([{transform:'translateX(-8px)'},{transform:'translateX(8px)'},{transform:'none'}],{duration:300});setTimeout(()=>{o.caught=0;},400);}
      $('#fs',W).textContent='🐟 '+AR(score);setTimeout(()=>{hk.style.display='none';ln.setAttribute('x2',0);ln.setAttribute('y2',0);ln.setAttribute('x1',0);ln.setAttribute('y1',0);},350);
      if(o.good)setTimeout(()=>{o.f.remove();fish=fish.filter(x=>x!==o);},500);}
    function loop(ts){if(!run)return;const dt=Math.min(.05,(ts-(last||ts))/1000);last=ts;
      fish.forEach(o=>{if(o.caught&&o.good)return;o.x+=o.v*dt;o.f.style.left=(o.x*100)+'%';});
      fish=fish.filter(o=>{if(o.x>1.2||o.x<-.4){o.f.remove();return false;}return true;});
      while(fish.length<6)addFish();raf=requestAnimationFrame(loop);}
    function start(){$('#ov',A).style.display='none';sfx.start();run=true;t=22;last=null;$('#fc',W).textContent='⏱️ '+AR(t);raf=requestAnimationFrame(loop);
      clock=setInterval(()=>{t--;$('#fc',W).textContent='⏱️ '+AR(t);if(t<=3)sfx.tick();if(t<=0)stop();},1000);}
    function stop(){run=false;cancelAnimationFrame(raf);clearInterval(clock);fish.forEach(o=>o.f.remove());fish=[];r++;
      if(r<RD.length)setTimeout(intro,400);else setTimeout(()=>done(score>=26?3:score>=15?2:1,`اصطدتَ ${AR(score)} سمكة! أصبحتَ خبيرًا في التنوين.`),400);}
    intro();
    return ()=>{run=false;cancelAnimationFrame(raf);clearInterval(clock);};
  }}
 }

    const SP={3:['g','أَلْقَيْتُ السَّلامَ عَلى جاري 👋'],9:['g','ساعَدْتُ جاري في حَمْلِ أَغْراضِهِ 🛍️'],14:['g','أَهْدَيْتُ جاري طَبَقَ حَلْوى 🍮'],7:['b','رَمَيْتُ الْكُرَةَ عَلى نافِذَةِ جاري ⚽'],12:['b','أَزْعَجْتُ جاري بِالصَّوْتِ الْعالي 📢'],17:['b','رَمَيْتُ النُّفاياتِ أَمامَ بابِ جاري 🗑️'],5:['q'],10:['q'],15:['q'],18:['q']};
    const QS=shuffle([['بِماذا أَوْصانا اللهُ في الْجارِ؟',['أَنْ نُحِبَّهُ وَنُحْسِنَ إِلَيْهِ','أَنْ نَبْتَعِدَ عَنْهُ','أَلّا نُكَلِّمَهُ']],['«أَصْغَيْتُ» تَعْني:',['اسْتَمَعْتُ بِانْتِباهٍ','تَكَلَّمْتُ كَثيرًا','نِمْتُ مُبَكِّرًا']],['«لِنَسْلِهِ» تَعْني:',['لِأَوْلادِهِ','لِبَيْتِهِ','لِطَعامِهِ']],['أُكْمِلُ: فَأَهْلُهُ كَأَهْلي ...',['وَدارُهُ كَداري','وَبابُهُ مَفْتوحٌ','وَبَيْتُهُ بَعيدٌ']],['مَتى أُهْدي جاري سَلامي؟',['إِنْ مَرَّ مِنْ جِواري','إِذا غَضِبْتُ','في الْعيدِ فَقَطْ']],['«مِقْداري» تَعْني:',['ما أَقْدِرُ عَلَيْهِ','كُلَّ مالي','لا شَيْءَ']],['شاعِرُ النَّشيدِ هُوَ:',['عَلِيُّ بْنُ شُنَيْنٍ الْكَحّالي','أُسامَةُ الزّيني','مُحَمَّدٌ الرَّحْبِيُّ']],['«فَطاعَتي لِجاري مَنْهَجِيَ ...»',['الْحَضاري','الصِّغارِ','الْأَحْجارِ']]]);
    let qi=0;const PL=[{n:'اللّاعِبُ الْأَوَّلُ',e:'🧒',p:0,c:'#3BA7EE'},{n:'اللّاعِبُ الثّاني',e:'👧',p:0,c:'#E75C9A'}];let turn=0,busy=false;
    const cellPos=n=>{const rb=Math.floor((n-1)/5),idx=(n-1)%5;return{row:4-rb,col:rb%2===0?idx:4-idx};};
    const sb=el('<div class="scorebar" style="justify-content:center"></div>');
    const B=el('<div style="display:grid;grid-template-columns:repeat(5,1fr);grid-template-rows:repeat(4,1fr);gap:6px;max-width:620px;width:100%;margin:0 auto"></div>');
    for(let n=1;n<=20;n++){const {row,col}=cellPos(n),s=SP[n];const bg=n===20?'#FFE39A':s?s[0]==='g'?'#D9F5E4':s[0]==='b'?'#FDE3E6':'#E6EEFF':'#fff';
      B.appendChild(el(`<div data-n="${n}" style="grid-row:${row};grid-column:${col+1};aspect-ratio:1.1;background:${bg};border:2px solid var(--line);border-radius:14px;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800"><small style="position:absolute;top:2px;right:6px;color:var(--ink2)">${AR(n)}</small><span style="font-size:clamp(20px,4vw,28px)">${n===20?'🏡':s?s[0]==='g'?'🌟':s[0]==='b'?'⚠️':'❓':''}</span><span class="tk" style="font-size:clamp(20px,4vw,30px);line-height:1"></span></div>`));}
    const ctr=el(`<div style="display:flex;flex-direction:column;align-items:center;gap:10px"><div id="dice" style="font-size:64px;width:96px;height:96px;background:#fff;border-radius:22px;display:grid;place-items:center;box-shadow:var(--shadow);border:3px solid var(--line)">🎲</div><button class="big-btn" id="roll"></button><div id="msg" class="ar" style="text-align:center;font-size:20px;min-height:1.6em"></div><div id="bq" style="width:100%"></div></div>`);
    W.append(sb,B,ctr);
    function paint(){$$('.tk',B).forEach(x=>x.textContent='');PL.forEach(p=>{if(p.p>0)$(`[data-n="${p.p}"] .tk`,B).textContent+=p.e;});
      sb.innerHTML=PL.map((p,i)=>`<span class="chip" style="${i===turn?`border-color:${p.c};background:color-mix(in srgb,${p.c} 15%,white)`:''}">${p.e} ${p.n}: ${AR(p.p)}</span>`).join('');
      $('#roll',ctr).textContent=`🎲 ارمِ النرد يا ${PL[turn].n} ${PL[turn].e}`;$('#roll',ctr).style.setProperty('--c',PL[turn].c);if(PL[0].p===0&&PL[1].p===0)$(`[data-n="1"] .tk`,B).textContent='';}
    const walk=async(p,to)=>{const st=Math.sign(to-p.p);while(p.p!==to){p.p+=st;sfx.step();paint();await sleep(260);}};
    const msg=t=>$('#msg',ctr).innerHTML=t;
    $('#roll',ctr).onclick=async()=>{if(busy)return;busy=true;const p=PL[turn];sfx.dice();const faces=['⚀','⚁','⚂','⚃','⚄','⚅'];let d=1;
      for(let i=0;i<8;i++){d=1+Math.floor(Math.random()*6);$('#dice',ctr).textContent=faces[d-1];await sleep(70);}
      msg(`${p.e} حصلتَ على ${AR(d)}`);await walk(p,Math.min(20,p.p+d));
      let s=SP[p.p];
      if(s&&s[0]==='g'){await sleep(300);msg(`🌟 ${s[1]} ← تقدّم خطوتين!`);sfx.ok();await sleep(700);await walk(p,Math.min(20,p.p+2));}
      else if(s&&s[0]==='b'){await sleep(300);msg(`⚠️ ${s[1]} ← ارجع خطوتين!`);sfx.bad();await sleep(700);await walk(p,Math.max(1,p.p-2));}
      else if(s&&s[0]==='q'){const q=QS[qi++%QS.length];$('#bq',ctr).innerHTML='';const ok=await askMCQ($('#bq',ctr),q[0],q[1],0);$('#bq',ctr).innerHTML='';if(ok){msg('✅ إجابة صحيحة! تقدّم خطوة');await walk(p,Math.min(20,p.p+1));}else msg('حاول في المرة القادمة 🙂');}
      if(p.p>=20){sfx.win();setTimeout(()=>done(3,`🏡 وصل ${p.n} ${p.e} إلى بيت جاره أولًا! «أَنا أُحِبُّ جاري».`),600);return;}
      turn=1-turn;busy=false;paint();};
    paint();
  }}
 }
});
</script>
<script>
/* =====================================================================
   المحور الثاني: علوم واكتشافات
   ===================================================================== */

/* ---- reusable activity builders ---- */
const STARS=m=>m<=1?3:m<=3?2:1;
/* questions one after another; q=[question, options, correctIndex, cols?] */
function seqQuiz(W,done,Q,o={}){
  if(o.intro)brief(W,o.ico||'❓',o.intro);
  const sb=el('<div class="scorebar"><span class="chip" data-n></span><span class="chip" data-s></span></div>');W.appendChild(sb);
  const box=el('<div></div>');W.appendChild(box);
  let i=0,miss=0,ok=0;
  const step=async()=>{
    $('[data-n]',sb).textContent=`السؤال ${AR(i+1)} من ${AR(Q.length)}`;$('[data-s]',sb).textContent=`✅ صحيحة من أول مرة: ${AR(ok)}`;
    box.innerHTML='';const q=Q[i];
    if(q[4])box.appendChild(el(`<div style="text-align:center;font-size:clamp(44px,9vw,74px);line-height:1.2;margin-bottom:6px">${q[4]}</div>`));
    const first=await askMCQ(box,q[0],q[1],q[2],{cols:q[3]});
    first?ok++:miss++;i++;
    if(i<Q.length)setTimeout(step,250);else done(STARS(miss),o.msg);
  };step();
}
/* tap a card, then tap its basket; items=[[html,binIndex],...], bins=[[emoji,label],...] */
function sortGame(W,done,bins,items,o={}){
  brief(W,o.ico||'🧺',o.intro||'اضغط بطاقة، ثم اضغط السلة المناسبة لها.');
  const sb=el('<div class="scorebar"><span class="chip" data-p></span></div>');
  const pool=el('<div style="display:flex;flex-wrap:wrap;gap:10px;justify-content:center"></div>');
  const B=el(`<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(${bins.length>3?140:190}px,1fr));gap:10px"></div>`);
  W.append(sb,pool,B);
  let sel=null,left=items.length,miss=0;
  const upd=()=>$('[data-p]',sb).textContent=`بقي ${AR(left)} من ${AR(items.length)}`;upd();
  bins.forEach((b,k)=>{
    const d=el(`<button style="background:var(--paper);border:3px dashed var(--line);border-radius:20px;padding:10px;min-height:120px;display:flex;flex-direction:column;align-items:center;gap:4px"><div style="font-size:34px">${b[0]}</div><b style="font-size:18px">${b[1]}</b><div class="sin" style="display:flex;flex-wrap:wrap;gap:4px;justify-content:center;margin-top:6px"></div></button>`);
    B.appendChild(d);
    d.onclick=()=>{
      if(sel==null){toast('اختر بطاقة أولًا 🙂');return;}
      const it=items[sel];
      if(it[1]===k){sfx.ok();$('.sin',d).appendChild(el(`<span class="chip" style="font-size:14px;font-family:var(--f-text)">${it[0]}</span>`));d.style.borderColor='var(--ok)';
        $(`[data-i="${sel}"]`,pool).remove();sel=null;left--;upd();
        if(!left)setTimeout(()=>done(STARS(miss),o.msg),400);}
      else{sfx.bad();miss++;d.animate([{transform:'translateX(-6px)'},{transform:'translateX(6px)'},{transform:'none'}],{duration:300});}
    };
  });
  shuffle(items.map((x,i)=>i)).forEach(i=>{
    const t=el(`<button class="tile" data-i="${i}">${items[i][0]}</button>`);
    t.onclick=()=>{sfx.click();$$('.tile',pool).forEach(x=>x.style.outline='');t.style.outline='4px solid var(--sun)';sel=i;};
    pool.appendChild(t);
  });
}
/* put events in order; E=[[emoji,text],...] in the right order */
function orderGame(W,done,E,o={}){
  brief(W,'🔢',o.intro||'اضغط البطاقات بالترتيب الصحيح، ثم اضغط «تحقّق». لإرجاع بطاقة اضغطها في مكانها.');
  const slots=Array(E.length).fill(null);let tries=0;
  const S=el('<div style="display:grid;gap:8px"></div>'),P=el('<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px"></div>');
  const chk=el('<button class="big-btn" style="align-self:center">✔ تحقّق</button>');
  W.append(S,el('<div style="text-align:center;font-weight:800;color:var(--ink2)">⬇️ البطاقات ⬇️</div>'),P,chk);
  let pool=shuffle(E.map((e,i)=>i));
  function paint(){
    S.innerHTML='';slots.forEach((v,i)=>{
      const b=el(`<button class="tile" style="display:flex;gap:10px;align-items:center;min-height:56px;text-align:right;${v==null?'border-style:dashed;background:#F7FBF9;color:var(--ink2)':''}"><b style="background:var(--c);color:#fff;border-radius:10px;min-width:34px;text-align:center;font-family:var(--f-ui)">${AR(i+1)}</b>${v==null?'<span>…</span>':`<span style="font-size:26px">${E[v][0]}</span><span>${E[v][1]}</span>`}</button>`);
      b.onclick=()=>{if(v==null)return;sfx.pop();slots[i]=null;pool.push(v);paint();};S.appendChild(b);});
    P.innerHTML='';pool.forEach(v=>{
      const b=el(`<button class="tile" style="display:flex;gap:10px;align-items:center;text-align:right"><span style="font-size:26px">${E[v][0]}</span><span>${E[v][1]}</span></button>`);
      b.onclick=()=>{const k=slots.indexOf(null);if(k<0)return;sfx.step();slots[k]=v;pool=pool.filter(x=>x!==v);paint();};P.appendChild(b);});
  }
  chk.onclick=()=>{
    if(slots.includes(null)){toast('رتّب كل البطاقات أولًا 🙂');sfx.bad();return;}
    tries++;let bad=0;slots.forEach((v,i)=>{if(v!==i){bad++;pool.push(v);slots[i]=null;}});
    if(!bad){paint();$$('.tile',S).forEach(t=>{t.style.borderColor='var(--ok)';t.style.background='#E3F7EC';});done(tries===1?3:tries===2?2:1,o.msg);}
    else{sfx.bad();toast(`${AR(E.length-bad)} في مكانها الصحيح ✔ · أعد ترتيب الباقي`);paint();}
  };
  paint();
}
/* match each item on the right with its partner on the left; pairs=[[a,b],...] */
function matchGame(W,done,pairs,o={}){
  brief(W,o.ico||'🔗',o.intro||'اضغط بطاقة من العمود الأيمن، ثم اضغط ما يناسبها في العمود الأيسر.');
  const G=el('<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px"></div>');
  const A=el('<div style="display:grid;gap:10px;align-content:start"></div>'),Bc=el('<div style="display:grid;gap:10px;align-content:start"></div>');
  G.append(A,Bc);W.appendChild(G);
  let sel=null,left=pairs.length,miss=0;
  shuffle(pairs.map((p,i)=>i)).forEach(i=>{const b=el(`<button class="tile" data-a="${i}" style="min-height:62px">${pairs[i][0]}</button>`);
    b.onclick=()=>{if(b.dataset.done)return;sfx.click();$$('[data-a]',A).forEach(x=>x.style.outline='');b.style.outline='4px solid var(--sun)';sel=i;};A.appendChild(b);});
  shuffle(pairs.map((p,i)=>i)).forEach(i=>{const b=el(`<button class="tile" data-b="${i}" style="min-height:62px">${pairs[i][1]}</button>`);
    b.onclick=()=>{if(b.dataset.done||sel==null)return;
      if(sel===i){sfx.ok();const a=$(`[data-a="${i}"]`,A);[a,b].forEach(x=>{x.dataset.done=1;x.style.outline='';x.style.borderColor='var(--ok)';x.style.background='#E3F7EC';});sel=null;left--;
        if(!left)setTimeout(()=>done(STARS(miss),o.msg),400);}
      else{sfx.bad();miss++;b.animate([{transform:'translateX(-6px)'},{transform:'translateX(6px)'},{transform:'none'}],{duration:300});}};
    Bc.appendChild(b);});
}
/* journey game: every answered question moves the hero one step. scene(N) returns {node,update(k,wrong)} */
function journey(W,done,Q,o){
  brief(W,o.ico,o.intro);
  const N=Q.length,sc=o.scene(N);W.appendChild(sc.node);
  const sb=el('<div class="scorebar"><span class="chip" data-n></span></div>');W.appendChild(sb);
  const box=el('<div></div>');W.appendChild(box);
  let i=0,miss=0;
  const step=async()=>{
    $('[data-n]',sb).textContent=`${o.unit||'الخطوة'} ${AR(i+1)} من ${AR(N)}`;
    box.innerHTML='';const q=Q[i];
    if(q[4])box.appendChild(el(`<div style="text-align:center;font-size:clamp(40px,8vw,64px);line-height:1.2">${q[4]}</div>`));
    const first=await askMCQ(box,q[0],q[1],q[2],{cols:q[3]});
    if(!first){miss++;sc.update(i,true);}
    i++;sc.update(i,false);sfx.step();
    if(i<N)setTimeout(step,first?450:1100);else setTimeout(()=>done(STARS(miss),o.msg),900);
  };step();
}
/* a horizontal track from start to goal (right to left) */
function trackScene(o){return N=>{
  const node=el(`<div style="position:relative;height:clamp(110px,18vw,150px);border-radius:24px;overflow:hidden;background:${o.bg};border:2px solid var(--line)">
    ${o.deco||''}
    <span style="position:absolute;right:2%;bottom:14%;font-size:clamp(26px,4vw,36px)">${o.start}</span>
    <span style="position:absolute;left:2%;bottom:14%;font-size:clamp(30px,5vw,44px)">${o.goal}</span>
    <span class="mv" style="position:absolute;right:9%;bottom:16%;font-size:clamp(36px,6vw,54px);transition:right .9s ease, transform .4s;transform:scaleX(${o.flip?-1:1})">${o.mover}</span>
    <span class="fx" style="position:absolute;inset:0;display:grid;place-items:center;font-size:56px;opacity:0;transition:opacity .3s;pointer-events:none">${o.fx||'🌧️'}</span>
  </div>`);
  const mv=$('.mv',node),fx=$('.fx',node);
  return{node,update(k,wrong){
    if(wrong){fx.style.opacity=1;mv.animate([{transform:`scaleX(${o.flip?-1:1}) rotate(-12deg)`},{transform:`scaleX(${o.flip?-1:1}) rotate(12deg)`},{transform:`scaleX(${o.flip?-1:1})`}],{duration:700});setTimeout(()=>fx.style.opacity=0,900);return;}
    mv.style.right=(9+78*k/N)+'%';}};
};}

/* ---- slide widgets ---- */
Object.assign(SLIDEFN,{
  /* tap a word to see its tag; data-items=[[word,tag],...] data-colors={tag:color} */
  tags(n){
    const items=JSON.parse(n.dataset.items),C=JSON.parse(n.dataset.colors||'{}');
    n.innerHTML=`<div style="display:flex;flex-wrap:wrap;gap:10px;justify-content:center">${items.map(([w,t])=>`<button style="display:flex;flex-direction:column;align-items:center;gap:4px;background:#fff;border:3px solid #D5E3DC;border-radius:16px;padding:8px 14px"><span class="ar" style="font-size:clamp(22px,3.4vw,30px);font-weight:700">${w}</span><small style="font-weight:800;visibility:hidden;color:#fff;background:${C[t]||'#8466E6'};border-radius:999px;padding:0 10px">${t}</small></button>`).join('')}</div>`;
    $$('button',n).forEach(b=>b.onclick=()=>{sfx.pop();const s=$('small',b);s.style.visibility='visible';b.style.borderColor=s.style.background;});
  },
  /* letters entering «ال» */
  alpre(n){
    const L=[['بِـ','بِ'],['فَـ','فَ'],['كَـ','كَ'],['لِـ','لِ']];
    const W=[['الْبَحْرِ','بَحْرِ','🌊'],['السَّفينَةِ','سَّفينَةِ','⛵'],['الرّيحِ','رّيحِ','🌬️'],['الْمَطَرِ','مَطَرِ','🌧️'],['الْقَلَمِ','قَلَمِ','✏️']];
    let l=0,w=0;
    n.innerHTML=`<div class="trace-tools" style="justify-content:center" data-row="l">${L.map((x,k)=>`<button data-l="${k}" class="${k?'':'on'}">${x[0]}</button>`).join('')}</div>
      <div class="trace-tools" style="justify-content:center" data-row="w">${W.map((x,k)=>`<button data-w="${k}" class="${k?'':'on'}">${x[2]} ${x[0]}</button>`).join('')}</div>
      <div style="text-align:center;font-family:var(--f-text);font-size:clamp(40px,8vw,70px);font-weight:700" id="apv"></div>
      <p style="text-align:center;margin:0" id="aps"></p>`;
    const paint=()=>{const lt=L[l],wd=W[w],word=l===3?'لِ'+wd[0].slice(1):lt[1]+wd[0];
      $('#apv',n).textContent=word;
      $('#aps',n).innerHTML=`${lt[0]} + ${wd[0]} = <b>${word}</b>${l===3?' · ⚠️ مَعَ اللّامِ تُحْذَفُ أَلِفُ «الْ»':''}`;};
    $$('[data-l]',n).forEach(b=>b.onclick=()=>{sfx.click();$$('[data-l]',n).forEach(x=>x.classList.remove('on'));b.classList.add('on');l=+b.dataset.l;paint();});
    $$('[data-w]',n).forEach(b=>b.onclick=()=>{sfx.click();$$('[data-w]',n).forEach(x=>x.classList.remove('on'));b.classList.add('on');w=+b.dataset.w;paint();});
    paint();
  },

    $('#lgDone',W).onclick=()=>{
