<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Bright Days 3A</title>
<meta name="description" content="Interactive English program for Team Together Oman 3A Activity Book">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Baloo+Bhaijaan+2:wght@500;600;700;800&display=swap">
<style>:root{
  --sky:#DDF0FF; --sky2:#F2F9FF; --cream:#FFFBF0; --paper:#FFFFFF;
  --ink:#1D3150; --ink2:#51627D; --line:#D8E4F0;
  --sun:#FFC43A; --sunD:#E5A300; --grass:#27AE6A; --grassL:#E3F7EC;
  --coral:#FF6A48; --coralL:#FFE8E1; --sea:#2493EE; --seaL:#E2F1FF;
  --lilac:#7462F0; --lilacL:#EEEBFF; --pink:#E4509A; --teal:#11AFA0;
  --ok:#23B26B; --bad:#F0493A;
  --r:22px; --shadow:0 6px 0 rgba(29,49,80,.10), 0 10px 24px rgba(29,49,80,.08);
  --fa:"Baloo Bhaijaan 2","Tajawal","Segoe UI",Tahoma,sans-serif;
  --fe:"Andika","Baloo Bhaijaan 2","Comic Sans MS","Segoe UI",sans-serif;
  color-scheme: light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;font-family:var(--fa);color:var(--ink);background:linear-gradient(180deg,var(--sky) 0%,var(--sky2) 38%,var(--cream) 100%) fixed;background-color:var(--cream);font-size:17px;line-height:1.55;overflow-x:hidden}
button{font-family:inherit;color:inherit;cursor:pointer;border:0;background:none;font-size:inherit}
button:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--sea);outline-offset:3px}
.en{font-family:var(--fe);direction:ltr;unicode-bidi:isolate}
.clouds{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.clouds i{position:absolute;background:#fff;border-radius:999px;opacity:.75;filter:blur(.5px)}
.clouds i::before,.clouds i::after{content:"";position:absolute;background:#fff;border-radius:50%}
.clouds i::before{width:55%;height:160%;left:15%;bottom:20%}
.clouds i::after{width:40%;height:120%;right:12%;bottom:25%}
#app{position:relative;z-index:1;max-width:1120px;margin:0 auto;padding-inline:16px;padding-block:0 40px;min-height:100%}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:10px;padding-block:10px;margin-bottom:6px;background:linear-gradient(180deg,rgba(221,240,255,.96) 70%,rgba(221,240,255,0));backdrop-filter:blur(4px)}
.top .ttl{flex:1;min-width:0;font-weight:800;font-size:clamp(16px,2.4vw,21px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .ttl small{display:block;font-weight:600;font-size:13px;color:var(--ink2);line-height:1.2}
.ibtn{width:46px;height:46px;border-radius:15px;background:var(--paper);box-shadow:var(--shadow);display:grid;place-items:center;font-size:22px;flex:none;transition:transform .12s}
.ibtn:active{transform:translateY(3px)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border-radius:999px;background:var(--paper);box-shadow:var(--shadow);font-weight:800;flex:none}
.pill b{color:var(--sunD)}

/* home */
.hero{display:grid;grid-template-columns:1fr auto;align-items:center;gap:12px;padding:22px 26px;border-radius:30px;background:linear-gradient(135deg,#FFE27A 0%,#FFC43A 55%,#FFB02E 100%);box-shadow:var(--shadow);position:relative;overflow:hidden;margin-top:6px}
.hero h1{margin:0;font-size:clamp(30px,6vw,54px);line-height:1.05;font-weight:800;letter-spacing:.3px}
.hero h1 .arsub{font-size:.55em;color:#8A4B00}
.hero p{margin:.4em 0 0;font-size:clamp(14px,2.2vw,18px);color:#6B3F00;font-weight:600;max-width:40ch}
.hero .bot{font-size:clamp(64px,13vw,120px);line-height:1;filter:drop-shadow(0 6px 0 rgba(0,0,0,.12));animation:bob 3s ease-in-out infinite}
.hero .sunray{position:absolute;inset:-60% -20% auto auto;width:360px;height:360px;border-radius:50%;background:repeating-conic-gradient(rgba(255,255,255,.18) 0 10deg,transparent 10deg 20deg);animation:spin 40s linear infinite;pointer-events:none}
@keyframes bob{50%{transform:translateY(-8px) rotate(-3deg)}}
@keyframes spin{to{transform:rotate(360deg)}}
.sect{margin:26px 4px 10px;font-weight:800;font-size:20px;display:flex;align-items:center;gap:8px}
.units{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.ucard{position:relative;text-align:start;padding:18px 18px 16px;border-radius:26px;background:var(--paper);box-shadow:var(--shadow);display:grid;grid-template-columns:auto 1fr;gap:4px 14px;align-items:center;transition:transform .15s;overflow:hidden}
.ucard:hover{transform:translateY(-3px)}
.ucard:active{transform:translateY(2px)}
.ucard .ico{grid-row:span 2;width:64px;height:64px;border-radius:20px;display:grid;place-items:center;font-size:36px;background:var(--c);box-shadow:inset 0 -5px 0 rgba(0,0,0,.14)}
.ucard .un{font-size:13px;font-weight:800;color:var(--c);letter-spacing:.4px}
.ucard h3{margin:0;font-size:19px;line-height:1.25}
.ucard h3 .en{font-size:20px}
.ucard .bar{grid-column:1/-1;height:10px;border-radius:9px;background:#EDF2F8;margin-top:10px;overflow:hidden}
.ucard .bar i{display:block;height:100%;background:var(--c);border-radius:9px}
.ucard .meta{grid-column:1/-1;display:flex;justify-content:space-between;font-size:13px;color:var(--ink2);font-weight:700}

/* unit page */
.uhead{display:flex;align-items:center;gap:16px;padding:18px 22px;border-radius:28px;background:var(--c);color:#fff;box-shadow:var(--shadow);margin-top:6px}
.uhead .big{font-size:56px;line-height:1}
.uhead h2{margin:0;font-size:clamp(22px,4vw,32px);line-height:1.15}
.uhead h2 .arsub{color:#fff;opacity:.92}
.lessons{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;margin-top:18px}
.lcard{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;align-items:center;padding:14px 16px;border-radius:22px;background:var(--paper);box-shadow:var(--shadow);text-align:start;transition:transform .15s;border:3px solid transparent}
.lcard:hover{transform:translateY(-2px);border-color:var(--c)}
.lcard .num{grid-row:span 3;width:54px;height:54px;border-radius:17px;display:grid;place-items:center;font-size:28px;background:color-mix(in srgb,var(--c) 16%,#fff)}
.lcard .kind{font-size:12.5px;font-weight:800;color:var(--c)}
.lcard .ltt{font-weight:800;font-size:17px;line-height:1.25}
.lcard .ltt .en{font-size:18px}
.stars{letter-spacing:1px;font-size:14px;color:#D7DEE8}
.stars b{color:var(--sunD);font-weight:400}

/* lesson */
.steps{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 10px;scrollbar-width:none}
.steps::-webkit-scrollbar{display:none}
.step{flex:1 0 auto;min-width:110px;display:flex;align-items:center;gap:8px;justify-content:center;padding:9px 14px;border-radius:16px;background:var(--paper);box-shadow:0 4px 0 rgba(29,49,80,.08);font-weight:800;font-size:15px;border:3px solid transparent;white-space:nowrap}
.step.on{border-color:var(--c);background:color-mix(in srgb,var(--c) 12%,#fff)}
.step .st{font-size:12px;color:var(--sunD)}
.panel{background:var(--paper);border-radius:28px;box-shadow:var(--shadow);padding:clamp(14px,2.6vw,26px);position:relative;min-height:360px}
.instr{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.instr .ar{font-weight:800;font-size:clamp(17px,2.4vw,21px)}
.instr .en{color:var(--ink2);font-size:15px;font-weight:700}
.instr .cnt{margin-inline-start:auto;font-weight:800;background:var(--seaL);color:var(--sea);padding:4px 12px;border-radius:999px;font-size:14px}
.big-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 26px;border-radius:18px;background:var(--grass);color:#fff;font-weight:800;font-size:18px;box-shadow:0 5px 0 #1A8550;transition:transform .1s}
.big-btn:active{transform:translateY(4px);box-shadow:0 1px 0 #1A8550}
.big-btn.alt{background:var(--sea);box-shadow:0 5px 0 #166FB8}
.big-btn.sun{background:var(--sun);color:#5A3A00;box-shadow:0 5px 0 var(--sunD)}
.big-btn.ghost{background:#EEF3F9;color:var(--ink);box-shadow:0 5px 0 #CCD8E6}
.big-btn[disabled]{opacity:.45;pointer-events:none}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:center}
.spk{width:44px;height:44px;border-radius:50%;background:var(--sun);display:inline-grid;place-items:center;font-size:21px;box-shadow:0 4px 0 var(--sunD);flex:none;vertical-align:middle}
.spk:active{transform:translateY(3px);box-shadow:0 1px 0 var(--sunD)}
.spk.sm{width:34px;height:34px;font-size:16px}

/* presentation */
.slide{min-height:clamp(330px,52vh,520px);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:12px;padding:10px 6px;animation:slideIn .35s ease}
@keyframes slideIn{from{opacity:.2;transform:translateX(-24px)}}
.slide .pic{font-size:clamp(96px,18vw,170px);line-height:1.1;cursor:pointer;filter:drop-shadow(0 8px 0 rgba(0,0,0,.07));animation:pop .45s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{transform:scale(.4)}}
.slide .word{font-size:clamp(34px,6vw,58px);font-weight:700;line-height:1.1;color:var(--ink)}
.slide .mean{font-size:clamp(20px,3vw,28px);font-weight:800;color:var(--c);background:color-mix(in srgb,var(--c) 12%,#fff);padding:2px 18px;border-radius:14px}
.slide .ex{font-size:clamp(18px,2.6vw,24px);color:var(--ink2);display:flex;align-items:center;gap:10px}
.slide .cover-t{font-size:clamp(30px,5.5vw,54px);font-weight:800;line-height:1.1}
.slide .kicker{font-weight:800;color:var(--c);font-size:15px;letter-spacing:.5px}
.nav-s{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px}
.dots{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.dots i{width:10px;height:10px;border-radius:50%;background:#DCE5EF}
.dots i.on{background:var(--c);width:24px;border-radius:6px}
.wgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px;width:100%}
.wgrid button{background:#F5F9FD;border-radius:18px;padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;border:2px solid #E6EEF6;transition:transform .12s}
.wgrid button:active{transform:scale(.95)}
.wgrid .p{font-size:46px;line-height:1.15}
.wgrid .w{font-size:16px;font-weight:700}
.wgrid .a{font-size:13px;color:var(--ink2);font-weight:700}
.gram{width:100%;max-width:760px;text-align:start}
.gram h3{margin:0 0 6px;font-size:clamp(22px,3.4vw,30px);color:var(--lilac)}
.gram .ar-ex{background:var(--lilacL);border-radius:18px;padding:12px 16px;font-weight:700;font-size:17px}
.formula{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:14px 0;direction:ltr}
.formula span{padding:8px 14px;border-radius:14px;font-family:var(--fe);font-weight:700;font-size:clamp(17px,2.4vw,22px);background:#F1F5FA}
.formula .k1{background:#FFE6A6}.formula .k2{background:#CDEBFF}.formula .k3{background:#D6F5E3}.formula .k4{background:#FFD9CF}.formula .k5{background:#E4DEFF}
.exl{display:grid;gap:8px}
.exl div{display:flex;align-items:center;gap:12px;background:#F8FAFD;border-radius:16px;padding:8px 12px;direction:ltr}
.exl .ep{font-size:34px;min-width:44px;text-align:center}
.exl .et{font-family:var(--fe);font-size:clamp(17px,2.5vw,22px);flex:1}
.exl b,.hl{color:var(--coral)}
.exl u,.hl2{text-decoration:none;color:var(--sea);font-weight:700}
.story{width:100%;max-width:760px;display:grid;gap:12px}
.story .scene{font-size:clamp(60px,11vw,110px);line-height:1.15;letter-spacing:6px;background:linear-gradient(180deg,#E7F5FF,#FFF8E1);border-radius:24px;padding:10px}
.story .txt{font-family:var(--fe);font-size:clamp(19px,2.8vw,26px);direction:ltr;line-height:1.5}
.story .tr{color:var(--ink2);font-weight:700;font-size:16px}
.passage{font-family:var(--fe);direction:ltr;text-align:left;font-size:clamp(17px,2.3vw,21px);line-height:1.7;background:#FFFBEA;border:2px dashed #F2D98A;border-radius:20px;padding:14px 18px;max-width:760px;width:100%}
.passage h4{margin:0 0 4px;font-size:1.15em}
.dlg{display:grid;gap:10px;width:100%;max-width:640px}
.bub{display:flex;gap:10px;align-items:flex-end;direction:ltr}
.bub .who{font-size:40px;line-height:1}
.bub .tx{background:#EAF5FF;border-radius:20px 20px 20px 6px;padding:10px 16px;font-family:var(--fe);font-size:clamp(17px,2.4vw,21px);text-align:left}
.bub.r{flex-direction:row-reverse}
.bub.r .tx{background:#FFF0D1;border-radius:20px 20px 6px 20px}

/* shared activity bits */
.prompt{display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap;background:#F4F9FF;border-radius:22px;padding:12px 16px;margin-bottom:14px;min-height:84px;text-align:center}
.prompt .pp{font-size:clamp(54px,9vw,84px);line-height:1}
.prompt .pt{font-family:var(--fe);font-size:clamp(20px,3vw,28px);direction:ltr;font-weight:700}
.prompt .pt.blur{filter:blur(7px);cursor:pointer;user-select:none}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.opt{background:#fff;border:3px solid var(--line);border-radius:20px;padding:12px;min-height:64px;font-family:var(--fe);font-size:clamp(18px,2.5vw,23px);font-weight:700;direction:ltr;box-shadow:0 5px 0 #E3EAF3;transition:transform .1s,border-color .15s;display:flex;align-items:center;justify-content:center;gap:8px;text-align:center}
.opt:hover{border-color:var(--sea)}
.opt:active{transform:translateY(3px);box-shadow:0 2px 0 #E3EAF3}
.opt.pic{font-size:clamp(52px,8vw,74px);min-height:110px;line-height:1}
.opt.ok{border-color:var(--ok);background:#E6F8EE;animation:okp .4s}
.opt.bad{border-color:var(--bad);background:#FFECEA;animation:shake .4s}
@keyframes okp{50%{transform:scale(1.07)}}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.shake{animation:shake .4s}
.gapline{font-family:var(--fe);direction:ltr;font-size:clamp(20px,3vw,28px);font-weight:700}
.gapline .gap{display:inline-block;min-width:90px;border-bottom:4px dashed var(--sea);color:var(--sea);padding:0 8px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(140%);background:var(--ink);color:#fff;padding:10px 22px;border-radius:999px;font-weight:800;z-index:90;transition:transform .3s;pointer-events:none;white-space:nowrap}
.toast.show{transform:translateX(-50%) translateY(0)}

/* result */
.result{position:absolute;inset:0;z-index:30;display:grid;place-items:center;background:rgba(255,251,240,.93);border-radius:28px;animation:fade .3s}
@keyframes fade{from{opacity:0}}
.result .box{text-align:center;padding:20px}
.result .rs{font-size:clamp(46px,9vw,70px);letter-spacing:6px}
.result .rs .off{filter:grayscale(1);opacity:.3}
.result h3{margin:4px 0;font-size:clamp(24px,4vw,34px)}
.result p{margin:0 0 16px;color:var(--ink2);font-weight:700}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:95}

/* match */
.match{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:12px 22%;direction:ltr}
.match .col{display:grid;gap:10px}
.mi{background:#fff;border:3px solid var(--line);border-radius:18px;padding:8px 10px;min-height:62px;display:flex;align-items:center;justify-content:center;gap:8px;font-family:var(--fe);font-weight:700;font-size:clamp(15px,2.2vw,20px);box-shadow:0 4px 0 #E3EAF3;position:relative;z-index:2;text-align:center}
.mi .p{font-size:clamp(34px,5vw,46px);line-height:1}
.mi.sel{border-color:var(--sea);background:var(--seaL)}
.mi.done{border-color:var(--ok);background:#E6F8EE}
.match svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1;overflow:visible}

/* sort */
.bins{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:14px}
.bin{border:3px dashed var(--bc,#9DB4CC);background:color-mix(in srgb,var(--bc,#9DB4CC) 9%,#fff);border-radius:22px;padding:10px;min-height:120px;display:flex;flex-direction:column;gap:6px;align-items:center;transition:transform .15s}
.bin.hot{transform:scale(1.03);border-style:solid}
.bin h4{margin:0;font-family:var(--fe);direction:ltr;font-size:clamp(16px,2.3vw,21px);color:var(--bc)}
.bin .in{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;font-size:24px}
.bin .in span{background:#fff;border-radius:10px;padding:0 6px;font-size:14px;font-family:var(--fe);display:inline-flex;align-items:center;gap:3px}
.pool{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.card{background:#fff;border:3px solid var(--line);border-radius:18px;padding:8px 12px;font-family:var(--fe);font-weight:700;font-size:clamp(16px,2.3vw,20px);direction:ltr;display:flex;align-items:center;gap:8px;box-shadow:0 4px 0 #E3EAF3;touch-action:none;user-select:none}
.card .p{font-size:32px;line-height:1}
.card.sel{border-color:var(--sea);background:var(--seaL);transform:translateY(-4px)}
.card.drag{position:fixed;z-index:80;pointer-events:none;transform:rotate(-4deg) scale(1.05)}

/* order */
.ansline{min-height:70px;border-radius:20px;background:#F4F9FF;border:3px dashed #B9D4EE;display:flex;flex-wrap:wrap;gap:8px;padding:10px;align-items:center;justify-content:center;direction:ltr;margin-bottom:14px}
.tile{padding:8px 16px;border-radius:14px;background:#fff;border:3px solid var(--line);box-shadow:0 4px 0 #E3EAF3;font-family:var(--fe);font-weight:700;font-size:clamp(18px,2.6vw,24px);direction:ltr}
.tile.used{visibility:hidden}
.ansline .tile{background:var(--sun);border-color:var(--sunD);box-shadow:0 4px 0 var(--sunD)}
.tiles{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;direction:ltr}
.seq{display:grid;gap:8px;max-width:720px;margin:0 auto}
.seq .tile{text-align:left;font-size:clamp(16px,2.3vw,20px)}
.seq .tile .n{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--sea);color:#fff;font-size:15px;margin-right:8px}

/* spell */
.slots{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;direction:ltr;margin:10px 0 14px}
.slot{width:clamp(34px,6vw,50px);height:clamp(44px,7vw,60px);border-bottom:5px solid #9DB4CC;display:grid;place-items:center;font-family:var(--fe);font-weight:700;font-size:clamp(24px,4vw,34px);background:#F7FAFD;border-radius:10px 10px 4px 4px}
.slot.sp{border:0;background:none;width:14px}
.slot.fix{color:var(--ink2)}
.slot.cur{border-color:var(--sea);background:var(--seaL)}
.letters{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;direction:ltr}
.lt{width:clamp(44px,7vw,58px);height:clamp(44px,7vw,58px);border-radius:14px;background:#fff;border:3px solid var(--line);box-shadow:0 4px 0 #E3EAF3;font-family:var(--fe);font-weight:700;font-size:clamp(22px,3.4vw,28px)}
.lt.used{opacity:.25;pointer-events:none}

/* game stage */
.stage{position:relative;width:100%;height:clamp(360px,60vh,560px);border-radius:24px;overflow:hidden;user-select:none;touch-action:manipulation}
.hud{position:absolute;top:10px;inset-inline:10px;display:flex;justify-content:space-between;gap:8px;z-index:10;pointer-events:none}
.hud span{background:rgba(255,255,255,.9);padding:4px 12px;border-radius:999px;font-weight:800;font-size:15px;box-shadow:0 3px 0 rgba(0,0,0,.08)}

function confetti(n=90){const c=el('canvas',{class:'confetti'});document.body.append(c);const x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;const cols=['#FFC43A','#FF6A48','#2493EE','#27AE6A','#7462F0','#E4509A'];
  const P=Array.from({length:n},()=>({x:Math.random()*c.width,y:-20-Math.random()*c.height*.5,vx:(Math.random()-.5)*4,vy:2+Math.random()*4,r:Math.random()*6.28,vr:(Math.random()-.5)*.3,s:6+Math.random()*7,c:pick(cols)}));let t=0;
  (function f(){t++;x.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.05;p.r+=p.vr;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);x.restore()});if(t<200)requestAnimationFrame(f);else c.remove()})()}

function quizCore(host,items,cfg,finish){let i=0,good=0;const cnt=el('span',{class:'cnt'});const area=el('div');host.append(area);
  function show(){if(i>=items.length)return finish(good/items.length);const q=items[i];let first=true,lock=false;area.innerHTML='';

    optsOf(q,cfg.n||q.n||(mode==='pic'?4:3)).forEach(v=>{const b=el('button',{class:'opt'+(mode==='pic'?' pic':'')},optNode(v,mode));
      b.onclick=()=>{if(lock)return;if(v===q.a){lock=true;b.classList.add('ok');snd.ok();if(first)good++;
          const pt=$('.pt',pb);if(pt&&q.p&&q.p.includes('___')){pt.innerHTML=gapHTML(q.p,q.a);pt.classList.remove('blur')}else if(pt)pt.classList.remove('blur');
          later(()=>say(q.after||fullSent(q)),150);later(()=>{i++;show()},1500)}
        else{first=false;b.classList.add('bad');snd.no();later(()=>b.classList.remove('bad'),450)}};g.append(b)});
    area.append(g);sayFirst(q)}
  show();return cnt}
