<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>ديني حياتي للصف الثالث</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;600;700;800&family=Amiri:wght@400;700&family=Amiri+Quran&display=swap" rel="stylesheet">
<style>
:root{
  --sky1:#e8f6ff; --sky2:#fff8e7; --ink:#2b3a55; --ink2:#5b6b86; --card:#ffffff;
  --teal:#14b8a6; --teal-d:#0f8f82; --orange:#ff9f43; --pink:#ff6b9a; --purple:#8b6cf0;
  --green:#34c759; --red:#ff5a5f; --yellow:#ffd23f; --blue:#3b9dff; --gold:#f5b700;
  --shadow:0 6px 0 rgba(43,58,85,.10), 0 10px 24px rgba(43,58,85,.10);
  --r:22px;
  --font:'Baloo Bhaijaan 2','Amiri','Tajawal','Segoe UI',Tahoma,sans-serif;
  --quran:'Amiri Quran','Amiri','Traditional Arabic',serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden}
body{font-family:var(--font);color:var(--ink);background:linear-gradient(180deg,var(--sky1) 0%,#f3fbff 45%,var(--sky2) 100%);direction:rtl;user-select:none;-webkit-user-select:none;touch-action:manipulation}
button{font-family:inherit;color:inherit;cursor:pointer;border:none;background:none}
.hidden{display:none!important}

/* ---------- background decor ---------- */
#sky{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.sun{position:absolute;top:-40px;left:-40px;width:170px;height:170px;border-radius:50%;background:radial-gradient(circle,#ffe16b 0 45%,#ffd23f 46% 60%,rgba(255,210,63,.0) 61%);animation:spin 40s linear infinite}
.sun::after{content:"";position:absolute;inset:-30px;border-radius:50%;background:repeating-conic-gradient(rgba(255,210,63,.35) 0 8deg,transparent 8deg 20deg);animation:spin 30s linear infinite reverse}
.cloud{position:absolute;background:#fff;border-radius:50px;opacity:.9;filter:drop-shadow(0 6px 8px rgba(80,120,160,.10))}
.cloud::before,.cloud::after{content:"";position:absolute;background:#fff;border-radius:50%}
.cloud.c1{width:140px;height:44px;top:70px;animation:drift 60s linear infinite}
.cloud.c1::before{width:60px;height:60px;top:-30px;left:20px}.cloud.c1::after{width:46px;height:46px;top:-20px;left:70px}
.cloud.c2{width:100px;height:34px;top:180px;animation:drift 80s linear infinite -30s;opacity:.7}
.cloud.c2::before{width:44px;height:44px;top:-22px;left:14px}.cloud.c2::after{width:34px;height:34px;top:-14px;left:50px}
.cloud.c3{width:120px;height:38px;top:40%;animation:drift 95s linear infinite -60s;opacity:.55}
.cloud.c3::before{width:50px;height:50px;top:-25px;left:18px}.cloud.c3::after{width:40px;height:40px;top:-18px;left:62px}
@keyframes drift{from{transform:translateX(110vw)}to{transform:translateX(-200px)}}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- layout ---------- */
#app{position:relative;z-index:1;height:100%;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;gap:10px;padding:10px 14px;min-height:62px}
.topbar .ttl{flex:1;font-weight:800;font-size:clamp(17px,2.6vw,24px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ibtn{width:46px;height:46px;border-radius:15px;background:#fff;box-shadow:var(--shadow);display:grid;place-items:center;font-size:22px;flex:none;transition:transform .12s}
.ibtn:active{transform:translateY(3px) scale(.96)}
.screen{flex:1;overflow-y:auto;overflow-x:hidden;padding:4px 16px 28px;-webkit-overflow-scrolling:touch}
.screen.noscroll{overflow:hidden;padding-bottom:10px}

/* ---------- home ---------- */
.hero{text-align:center;padding:8px 10px 6px}
.hero .logo{font-size:clamp(40px,7vw,64px);font-weight:900;line-height:1.05;background:linear-gradient(90deg,#ff4f8b,#ff9f43);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 0 rgba(255,79,139,.15))}
.hero .sub{font-size:clamp(15px,2.2vw,20px);color:var(--ink2);font-weight:700}
.hero .mosque{font-size:clamp(46px,8vw,70px);animation:bob 3s ease-in-out infinite;display:inline-block}
@keyframes bob{50%{transform:translateY(-8px)}}
.totals{display:inline-flex;gap:10px;margin-top:8px;background:#fff;border-radius:999px;padding:6px 16px;box-shadow:var(--shadow);font-weight:800}
.unit-h{display:flex;align-items:center;gap:10px;margin:22px 4px 12px;font-size:clamp(19px,2.8vw,26px);font-weight:900}
.unit-h .pill{background:var(--orange);color:#fff;border-radius:14px;padding:2px 14px;box-shadow:0 4px 0 #e0801f}
.unit-h.u2 .pill{background:var(--purple);box-shadow:0 4px 0 #6a4fd0}
.lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,240px),1fr));gap:14px}
.lcard{position:relative;background:#fff;border-radius:var(--r);padding:14px 14px 12px;box-shadow:var(--shadow);text-align:right;display:flex;gap:12px;align-items:center;transition:transform .15s;overflow:hidden;border:3px solid transparent;animation:popIn .5s both}
.lcard:hover{transform:translateY(-3px)}
.lcard:active{transform:translateY(2px)}
.lcard .ic{width:64px;height:64px;border-radius:18px;display:grid;place-items:center;font-size:36px;flex:none}
.lcard .num{font-size:13px;font-weight:800;opacity:.75}
.lcard .nm{font-size:clamp(17px,2.2vw,20px);font-weight:900;line-height:1.25}
.lcard .st{font-size:14px;margin-top:3px;letter-spacing:1px}
.lcard::after{content:"";position:absolute;left:-30px;bottom:-30px;width:90px;height:90px;border-radius:50%;opacity:.12;background:currentColor}
@keyframes popIn{from{opacity:0;transform:scale(.85) translateY(10px)}to{opacity:1;transform:none}}

/* ---------- lesson hub ---------- */
.lbanner{border-radius:28px;padding:18px 18px;color:#fff;display:flex;align-items:center;gap:14px;box-shadow:var(--shadow);margin:4px 0 16px;position:relative;overflow:hidden}
.lbanner .big{font-size:clamp(44px,8vw,68px);animation:bob 3s ease-in-out infinite}
.lbanner h2{margin:0;font-size:clamp(22px,4vw,34px);font-weight:900;line-height:1.2}
.lbanner p{margin:2px 0 0;font-weight:700;opacity:.92;font-size:clamp(14px,2vw,17px)}
.lbanner::before{content:"";position:absolute;left:-40px;top:-40px;width:160px;height:160px;border-radius:50%;background:rgba(255,255,255,.15)}
.hubgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:14px}
.htile{background:#fff;border-radius:24px;padding:18px 14px;box-shadow:var(--shadow);text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px;border-bottom:6px solid var(--c);animation:popIn .45s both;transition:transform .15s}
.htile:hover{transform:translateY(-3px)}
.htile .e{font-size:48px;width:84px;height:84px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 16%,#fff)}
.htile .k{font-size:14px;font-weight:800;color:var(--c)}
.htile .n{font-size:clamp(18px,2.4vw,22px);font-weight:900}
.htile .d{font-size:14px;color:var(--ink2);font-weight:600;line-height:1.5}
.htile .s{font-size:18px;letter-spacing:2px}

/* ---------- presentation ---------- */
.pres{height:100%;display:flex;flex-direction:column;gap:10px}
.slidewrap{flex:1;position:relative;min-height:0}
.slide{position:absolute;inset:0;background:#fff;border-radius:28px;box-shadow:var(--shadow);padding:clamp(14px,2.5vw,30px);overflow-y:auto;display:flex;flex-direction:column;animation:slideIn .45s cubic-bezier(.2,.9,.3,1.2) both}
.slide.back{animation-name:slideInB}
@keyframes slideIn{from{opacity:0;transform:translateX(-60px) scale(.96)}to{opacity:1;transform:none}}
@keyframes slideInB{from{opacity:0;transform:translateX(60px) scale(.96)}to{opacity:1;transform:none}}
.slide h3{margin:0 0 12px;font-size:clamp(20px,3.4vw,32px);font-weight:900;display:flex;align-items:center;gap:10px;color:var(--lc,#0f8f82)}
.slide h3 .hi{font-size:1.2em}
.pnav{display:flex;align-items:center;gap:10px;justify-content:space-between}
.pnav .dots{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;flex:1}
.pnav .dot{width:10px;height:10px;border-radius:50%;background:#cfdbe8;transition:.25s}
.pnav .dot.on{background:var(--lc,#14b8a6);width:26px;border-radius:6px}
.navbtn{height:52px;min-width:52px;padding:0 18px;border-radius:18px;background:var(--lc,#14b8a6);color:#fff;font-weight:900;font-size:18px;box-shadow:0 5px 0 rgba(0,0,0,.18);display:flex;align-items:center;gap:6px}
.navbtn.ghost{background:#fff;color:var(--ink);box-shadow:var(--shadow)}
.navbtn:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.18)}
.navbtn:disabled{opacity:.35}

/* title slide */
.s-title{align-items:center;justify-content:center;text-align:center;gap:10px;background:radial-gradient(circle at 50% 30%,color-mix(in srgb,var(--lc) 14%,#fff),#fff 70%)}
.s-title .ico{font-size:clamp(70px,14vw,130px);animation:bob 3s ease-in-out infinite}
.s-title .kicker{font-weight:800;color:var(--ink2);font-size:clamp(16px,2.4vw,22px)}
.s-title .t{font-size:clamp(32px,6vw,62px);font-weight:900;color:var(--lc);line-height:1.2}
.s-title .ss{font-size:clamp(15px,2.2vw,20px);color:var(--ink2);font-weight:700;max-width:640px}

/* points */
.points{display:flex;flex-direction:column;gap:12px}
.pt{display:flex;gap:12px;align-items:center;background:color-mix(in srgb,var(--lc) 9%,#fff);border-radius:18px;padding:12px 14px;font-size:clamp(17px,2.4vw,23px);font-weight:700;line-height:1.6;border-right:6px solid var(--lc);animation:popIn .4s both}
.pt .pe{font-size:1.6em;flex:none}
.tapnext{margin-top:auto;align-self:center;padding-top:12px;color:var(--ink2);font-weight:800;font-size:15px;animation:pulse 1.6s infinite}
@keyframes pulse{50%{opacity:.45;transform:scale(.97)}}
.revealbtn{align-self:center;margin-top:12px;background:var(--yellow);color:#6b4e00;border-radius:16px;padding:10px 22px;font-weight:900;font-size:18px;box-shadow:0 5px 0 #d8a800}
.revealbtn:active{transform:translateY(3px);box-shadow:0 2px 0 #d8a800}

/* quran */
.mushaf{background:#fffdf5;border:3px solid #e8d9a8;border-radius:22px;padding:clamp(12px,2.4vw,26px);box-shadow:inset 0 0 0 6px #fff7e0,inset 0 0 0 8px #e8d9a8;position:relative}
.mushaf .sname{text-align:center;margin:-2px auto 10px;background:linear-gradient(90deg,#0f8f82,#14b8a6);color:#fff;border-radius:999px;padding:4px 22px;width:max-content;max-width:100%;font-family:var(--quran);font-size:clamp(20px,3vw,28px)}
.mushaf .basm{text-align:center;font-family:var(--quran);font-size:clamp(22px,3.2vw,32px);margin-bottom:6px;color:#3a2e14}
.qtext{font-family:var(--quran);font-size:clamp(24px,3.6vw,38px);line-height:2.15;text-align:justify;text-align-last:center;color:#2a2210}
.an{display:inline-flex;align-items:center;justify-content:center;width:1.3em;height:1.3em;font-size:.7em;line-height:1;border-radius:50%;border:2px solid #c9a646;color:#8a6d12;margin:0 .15em;font-family:Tahoma,Arial,sans-serif;font-weight:700;vertical-align:.15em;background:#fff8da;overflow:hidden}
.mk{border-radius:10px;padding:0 .12em;cursor:pointer;transition:background .2s;position:relative}
.mk.gh{color:#d63384;text-shadow:0 0 0 #d63384}
.mk.vc{color:#c0392b}
.mk.on{background:#fff0a8}
.mk:hover{background:#fff6c7}
.legend{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:10px;font-weight:700;font-size:15px}
.legend span{display:inline-flex;align-items:center;gap:6px;background:#fff;border-radius:999px;padding:4px 12px;box-shadow:0 2px 6px rgba(0,0,0,.06)}
.legend i{width:14px;height:14px;border-radius:50%;display:inline-block}
.tip{position:fixed;z-index:60;max-width:min(88vw,380px);background:#2b3a55;color:#fff;border-radius:16px;padding:10px 14px;font-size:17px;font-weight:700;line-height:1.6;box-shadow:0 10px 30px rgba(0,0,0,.25);animation:popIn .25s both;pointer-events:none}

/* cards (flip) */
.flipgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));gap:14px}
.flip{perspective:900px;min-height:170px;cursor:pointer}
.flip .in{position:relative;width:100%;height:100%;min-height:170px;transition:transform .6s cubic-bezier(.3,1.4,.5,1);transform-style:preserve-3d}
.flip.on .in{transform:rotateY(180deg)}
.flip .f,.flip .b{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:12px;font-weight:800;box-shadow:var(--shadow)}
.flip .f{background:linear-gradient(160deg,color-mix(in srgb,var(--lc) 85%,#fff),var(--lc));color:#fff;font-size:clamp(17px,2.2vw,21px);gap:6px}
.flip .f .fe{font-size:46px}
.flip .b{background:#fff;transform:rotateY(180deg);font-size:clamp(16px,2.1vw,20px);line-height:1.55;border:3px solid var(--lc)}
.flip .b .be{font-size:34px}

/* story */
.story{display:flex;flex-direction:column;gap:12px}
.scene{border-radius:20px;padding:12px;text-align:center;font-size:clamp(40px,7vw,64px);letter-spacing:6px;background:linear-gradient(180deg,#dff3ff,#fff4d8);position:relative;min-height:90px;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:4px}
.scene.night{background:linear-gradient(180deg,#1d2b64,#3a4d8f);}
.scene .cap{position:absolute;bottom:6px;right:12px;font-size:14px;letter-spacing:0;font-weight:800;background:rgba(255,255,255,.85);border-radius:10px;padding:1px 10px;color:var(--ink)}
.line{display:flex;gap:10px;align-items:flex-start;animation:popIn .35s both}
.line .av{flex:none;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-size:30px;background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.1)}
.line .bb{background:#f1f7ff;border-radius:18px 4px 18px 18px;padding:10px 14px;font-size:clamp(16px,2.3vw,21px);font-weight:700;line-height:1.65;box-shadow:0 2px 6px rgba(0,0,0,.05)}
.line .who{font-size:14px;font-weight:900;color:var(--lc);display:block}
.line.nar .bb{background:#fff8e2;border-radius:18px;width:100%}
.line.alt{flex-direction:row-reverse}
.line.alt .bb{background:#fff0f5;border-radius:4px 18px 18px 18px}

/* hadith */
.hadith{background:linear-gradient(135deg,#fff7e6,#fffdf6);border:3px dashed #f0b44c;border-radius:24px;padding:clamp(14px,2.5vw,26px);text-align:center;position:relative}
.hadith .hq{font-size:clamp(20px,3.2vw,32px);font-weight:800;line-height:1.9;color:#6b3e00}
.hadith .intro{font-size:clamp(16px,2.2vw,20px);font-weight:700;line-height:1.8;color:var(--ink2);margin-bottom:8px}
.hadith .src{font-size:14px;color:#9a7a44;margin-top:8px;font-weight:700}
.hadith::before{content:"💬";position:absolute;top:-22px;right:18px;font-size:36px}

/* facts / q&a reveal */
.qa{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:12px}
.qa .q{background:#fff;border-radius:18px;box-shadow:var(--shadow);padding:12px 14px;cursor:pointer;border-top:6px solid var(--c,var(--lc));animation:popIn .4s both}
.qa .q .qq{font-weight:800;font-size:clamp(16px,2.2vw,20px);line-height:1.5;display:flex;gap:8px}
.qa .q .aa{margin-top:8px;font-weight:900;font-size:clamp(18px,2.6vw,24px);color:var(--c,var(--lc));min-height:1.4em}
.qa .q .aa.h{color:transparent;background:repeating-linear-gradient(45deg,#eef3f8 0 10px,#e3ebf3 10px 20px);border-radius:10px}
.qa .q .aa.h::after{content:"اضغط لتكشف الإجابة 👆";color:var(--ink2);font-size:14px;font-weight:800}

/* vocab */
.vgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:12px}
.vitem{background:#fff;border-radius:20px;box-shadow:var(--shadow);padding:14px;text-align:center;cursor:pointer;border:3px solid transparent;transition:.2s}
.vitem .vw{font-family:var(--quran);font-size:clamp(26px,3.6vw,36px);color:#c0392b}
.vitem .ve{font-size:40px}
.vitem .vm{font-size:clamp(16px,2.2vw,20px);font-weight:800;color:var(--ink2);min-height:1.5em}
.vitem.on{border-color:var(--lc)}

/* value slide */
.s-value{align-items:center;justify-content:center;text-align:center;gap:14px;background:linear-gradient(160deg,#fff,color-mix(in srgb,var(--lc) 12%,#fff))}
.s-value .ve{font-size:clamp(64px,12vw,110px);animation:bob 3s infinite}
.s-value .vt{font-size:clamp(22px,4vw,40px);font-weight:900;color:var(--lc);line-height:1.5;max-width:820px}
.s-value .vs{font-size:clamp(16px,2.3vw,21px);font-weight:700;color:var(--ink2);max-width:700px;line-height:1.7}

/* slide quiz */
.squiz .qq{font-size:clamp(19px,3vw,28px);font-weight:900;text-align:center;line-height:1.6;margin:6px 0 14px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:12px}
.opt{background:#fff;border:3px solid #dfe8f1;border-radius:18px;padding:14px;font-size:clamp(17px,2.4vw,22px);font-weight:800;box-shadow:0 5px 0 #dfe8f1;transition:.15s;line-height:1.5}
.opt:active{transform:translateY(3px);box-shadow:0 2px 0 #dfe8f1}
.opt.ok{background:#e7fbe9;border-color:var(--green);box-shadow:0 5px 0 #25a244;animation:tada .6s}
.opt.no{background:#ffecec;border-color:var(--red);box-shadow:0 5px 0 #d83c40;animation:shake .45s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
@keyframes tada{30%{transform:scale(1.08) rotate(-2deg)}60%{transform:scale(1.05) rotate(2deg)}}
.explain{margin-top:12px;background:#e9fbf3;border-radius:16px;padding:10px 14px;font-weight:800;font-size:clamp(16px,2.2vw,20px);line-height:1.6;animation:popIn .35s both;text-align:center}

/* scene tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr));gap:12px}
.tile{background:#fff;border-radius:20px;box-shadow:var(--shadow);padding:12px;text-align:center;cursor:pointer;animation:popIn .4s both}
.tile .te{font-size:clamp(40px,6vw,58px);min-height:70px;display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,#eef8ff,#fff8e8);border-radius:14px;letter-spacing:2px}
.tile .tc{font-weight:800;font-size:clamp(15px,2vw,18px);margin-top:8px;line-height:1.5}
.tile .tn{font-weight:900;font-size:clamp(15px,2vw,19px);color:var(--lc);margin-top:6px;line-height:1.55}
.tile .tn.h{color:var(--ink2);opacity:.7}

/* diagram (map) */
.dmap{display:flex;flex-direction:column;align-items:center;gap:14px}
.dmap .center{background:var(--lc);color:#fff;border-radius:22px;padding:12px 22px;font-size:clamp(18px,2.8vw,26px);font-weight:900;text-align:center;box-shadow:0 5px 0 rgba(0,0,0,.15)}
.dmap .branches{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:12px;width:100%}
.dmap .br{background:#fff;border:3px solid color-mix(in srgb,var(--lc) 40%,#fff);border-radius:18px;padding:12px;text-align:center;font-weight:800;font-size:clamp(16px,2.2vw,20px);cursor:pointer;line-height:1.5;animation:popIn .4s both}
.dmap .br .be{font-size:34px;display:block}
.dmap .br .bh{color:var(--lc)}

/* ---------- activity shell ---------- */
.act{height:100%;display:flex;flex-direction:column;gap:10px}
.ahead{background:#fff;border-radius:22px;box-shadow:var(--shadow);padding:10px 14px;display:flex;align-items:center;gap:12px}
.ahead .ae{font-size:36px}
.ahead .at{font-weight:900;font-size:clamp(17px,2.5vw,22px);line-height:1.3}
.ahead .ai{font-weight:700;color:var(--ink2);font-size:clamp(14px,2vw,17px);line-height:1.45}
.ahead .sc{margin-inline-start:auto;display:flex;flex-direction:column;align-items:center;gap:4px;flex:none}

<script>
document.documentElement.lang = 'ar'; document.documentElement.dir = 'rtl';
/* ================= utilities ================= */
const $ = (s, r = document) => r.querySelector(s);

  const e = document.createElement(tag);
  for (const k in attrs) {
    const v = attrs[k];
    if (k === 'class') e.className = v;
    else if (k === 'html') e.innerHTML = v;
    else if (k === 'style' && typeof v === 'object') { for (const sk in v) { if (sk.startsWith('--')) e.style.setProperty(sk, v[sk]); else e.style[sk] = v[sk]; } }

}

const sleep = ms => new Promise(r => setTimeout(r, ms));
const AR = n => String(n).replace(/\d/g, d => '٠١٢٣٤٥٦٧٨٩'[d]);
const rand = (a, b) => a + Math.random() * (b - a);
/* inline markup: {{word|note|cls}}  cls: gh (ghunna) / vc (vocab) ; **bold** */
function fmt(s) {
  if (s == null) return '';
  return String(s)
    .replace(/\{\{([^|}]+)\|([^|}]*)\|?([^}]*)\}\}/g, (m, w, n, c) => `<span class="mk ${c || 'vc'}" data-note="${n.replace(/"/g, '&quot;')}">${w}</span>`)
    .replace(/\(\((\d+)\)\)/g, (m, n) => `<span class="an">${AR(n)}</span>`)
    .replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
}

/* ================= storage ================= */
const Store = {
  key: 'dinyhayati3_v1', d: {},
  load() { try { this.d = JSON.parse(localStorage.getItem(this.key) || '{}') || {}; } catch (e) { this.d = {}; } },

/* ================= sound (Web Audio synth) ================= */
const SFX = {
  ctx: null, on: true,
  init() { if (!this.ctx) { try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { } } if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume(); },
  tone(f, d = .15, type = 'sine', v = .18, delay = 0, f2 = null) {

  },
  noise(d = .2, v = .12, delay = 0, hp = 800) {
    if (!this.on) return; this.init(); const c = this.ctx; if (!c) return;
    const t = c.currentTime + delay, len = Math.floor(c.sampleRate * d), b = c.createBuffer(1, len, c.sampleRate), ch = b.getChannelData(0);
    for (let i = 0; i < len; i++) ch[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const s = c.createBufferSource(), g = c.createGain(), fl = c.createBiquadFilter(); fl.type = 'highpass'; fl.frequency.value = hp;
    s.buffer = b; g.gain.value = v; s.connect(fl); fl.connect(g); g.connect(c.destination); s.start(t);
  },
  click() { this.tone(660, .06, 'triangle', .12); },
  tap() { this.tone(520, .07, 'sine', .14, 0, 780); },
  pop() { this.tone(900, .09, 'sine', .2, 0, 250); this.noise(.06, .06, 0, 2000); },
  flip() { this.noise(.12, .08, 0, 1500); this.tone(400, .1, 'triangle', .06, 0, 700); },
  whoosh() { this.noise(.3, .09, 0, 600); },
  correct() { [523, 659, 784, 1046].forEach((f, i) => this.tone(f, .16, 'triangle', .16, i * .07)); },
  wrong() { this.tone(220, .22, 'sawtooth', .07, 0, 160); this.tone(180, .26, 'square', .04, .08, 120); },
  win() { [523, 659, 784, 659, 784, 1046, 1318].forEach((f, i) => this.tone(f, .22, 'triangle', .15, i * .11)); this.noise(.5, .05, .7, 3000); },
  tick() { this.tone(1200, .03, 'square', .05); },
  step() { this.tone(300, .06, 'triangle', .12, 0, 200); },
  magic() { [880, 1108, 1318, 1760].forEach((f, i) => this.tone(f, .25, 'sine', .08, i * .05)); },
  boing() { this.tone(180, .3, 'sine', .2, 0, 520); },
  drop() { this.tone(500, .12, 'sine', .18, 0, 140); },

};

/* ================= visual feedback ================= */
function burst(ok) { const e = h('div', { class: 'feedback' }, ok ? pick(['🌟', '👏', '✨', '💚', '🎉']) : '🤔'); document.body.append(e); setTimeout(() => e.remove(), 950); }

const PRAISE = ['أحسنت! 🌟', 'رائع جدًّا! 👏', 'ممتاز! 💚', 'بارك الله فيك! ✨', 'إجابة موفّقة! 🎉', 'أنت بطل! 🏆'];

const Confetti = {
  run(ms = 2200) {

    const c = cv.getContext('2d'); cv.width = innerWidth; cv.height = innerHeight;
    const cols = ['#ff6b9a', '#ffd23f', '#14b8a6', '#3b9dff', '#8b6cf0', '#ff9f43', '#34c759'];

/* ================= drag helper (pointer events: mouse + touch) ================= */
/* makeDrag(el,{target:'.selector', onDrop:(targetEl, el)=>bool, onStart, ghostClass}) */
function makeDrag(el, o) {
  el.style.touchAction = 'none';
  el.addEventListener('pointerdown', ev => {
    if (el.classList.contains('used') || el.dataset.lock) return;
    ev.preventDefault(); SFX.init(); SFX.tap();
    const r = el.getBoundingClientRect();
    const g = el.cloneNode(true); g.classList.add('ghost'); if (o.ghostClass) g.classList.add(o.ghostClass);
    g.style.width = r.width + 'px'; g.style.height = r.height + 'px'; g.style.left = r.left + 'px'; g.style.top = r.top + 'px'; g.style.margin = 0;
    document.body.append(g); el.classList.add('dragging');
    const dx = ev.clientX - r.left, dy = ev.clientY - r.top; let hot = null;
    o.onStart && o.onStart(el);
    const find = (x, y) => { g.style.display = 'none'; const t = document.elementFromPoint(x, y); g.style.display = ''; return t && t.closest(o.target); };
    const mv = e => {
      g.style.left = (e.clientX - dx) + 'px'; g.style.top = (e.clientY - dy) + 'px';
      const t = find(e.clientX, e.clientY); if (t !== hot) { hot && hot.classList.remove('drop-hot'); hot = t; hot && hot.classList.add('drop-hot'); }

      document.removeEventListener('pointermove', mv); document.removeEventListener('pointerup', up); document.removeEventListener('pointercancel', up);

      const t = find(e.clientX, e.clientY);

    };
    document.addEventListener('pointermove', mv); document.addEventListener('pointerup', up); document.addEventListener('pointercancel', up);
  });
}
