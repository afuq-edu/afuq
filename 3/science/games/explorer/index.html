<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#9fdcff">
<title>مستكشف العلوم ٣</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;600;700;800&family=Noto+Naskh+Arabic:wght@500;600;700&display=swap">
<style>
:root{
  --sky1:#9fdcff; --sky2:#d4f0ff; --sky3:#f1fbff;
  --ink:#1f3552; --ink2:#4d6585; --ink3:#7d93ad;
  --card:#ffffff; --soft:#f3f9fe; --line:#d7e7f3;
  --sun:#ffc83a; --grass:#63c262; --grass2:#44a64c; --soil:#b98556;
  --u1:#2fa652; --u1l:#e2f6e5; --u1d:#1f7f3c;
  --u2:#ff8436; --u2l:#fff0e2; --u2d:#d8621b;
  --u3:#7a5cf5; --u3l:#eee9ff; --u3d:#5a3fd4;
  --u4:#2a95d6; --u4l:#e1f2fc; --u4d:#1a72a9;
  --u5:#e9589b; --u5l:#fde7f1; --u5d:#c23c7a;
  --good:#28b565; --goodl:#dff7e9; --bad:#f2545b; --badl:#ffe4e5; --gold:#ffb300;
  --acc:var(--u4); --accl:var(--u4l); --accd:var(--u4d);
  --r:22px;
  --sh:0 3px 0 rgba(31,53,82,.07),0 10px 26px rgba(31,53,82,.10);
  --fd:'Baloo Bhaijaan 2','Noto Naskh Arabic','Segoe UI',Tahoma,Arial,sans-serif;
  --fb:'Noto Naskh Arabic','Baloo Bhaijaan 2','Traditional Arabic','Segoe UI',Tahoma,serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--sky3);color:var(--ink);font-family:var(--fd);-webkit-tap-highlight-color:transparent;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
button{font-family:inherit;color:inherit}
:focus-visible{outline:3px solid var(--u4);outline-offset:3px}
.th-u1{--acc:var(--u1);--accl:var(--u1l);--accd:var(--u1d)}
.th-u2{--acc:var(--u2);--accl:var(--u2l);--accd:var(--u2d)}
.th-u3{--acc:var(--u3);--accl:var(--u3l);--accd:var(--u3d)}
.th-u4{--acc:var(--u4);--accl:var(--u4l);--accd:var(--u4d)}
.th-u5{--acc:var(--u5);--accl:var(--u5l);--accd:var(--u5d)}

#app{height:100%;display:flex;flex-direction:column;position:relative;isolation:isolate;overflow:hidden}
#scenery{position:absolute;inset:0;z-index:-1;overflow:hidden;background:linear-gradient(180deg,var(--sky1) 0%,var(--sky2) 42%,var(--sky3) 100%);transition:opacity .4s}
#scenery .sun{position:absolute;top:14px;left:18px;width:96px;height:96px;border-radius:50%;background:radial-gradient(circle at 40% 40%,#fff6c2,#ffd54a 55%,#ffb92e);box-shadow:0 0 0 14px rgba(255,214,74,.25),0 0 0 30px rgba(255,214,74,.12);animation:sunpulse 5s ease-in-out infinite}
#scenery .cloud{position:absolute;background:#fff;border-radius:60px;opacity:.9;animation:drift linear infinite}
#scenery .cloud::before,#scenery .cloud::after{content:"";position:absolute;background:#fff;border-radius:50%}
#scenery .cloud::before{width:55%;height:150%;top:-70%;left:14%}
#scenery .cloud::after{width:40%;height:120%;top:-45%;left:48%}
#scenery .hills{position:absolute;left:0;right:0;bottom:0;width:100%;height:24%;min-height:120px}
#app.game-mode #scenery .hills{opacity:0}
#app.game-mode #scenery .sun{transform:scale(.7);top:-20px;left:-20px}
@keyframes drift{from{transform:translateX(-30vw)}to{transform:translateX(130vw)}}
@keyframes sunpulse{50%{box-shadow:0 0 0 18px rgba(255,214,74,.22),0 0 0 38px rgba(255,214,74,.10)}}

.topbar{display:flex;align-items:center;gap:10px;padding:10px 14px;min-height:66px;position:relative;z-index:5}
.tb-btn{width:48px;height:48px;flex:none;border:0;border-radius:16px;background:#fff;box-shadow:0 3px 0 rgba(31,53,82,.12);display:grid;place-items:center;cursor:pointer;color:var(--ink);transition:transform .1s}
.tb-btn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(31,53,82,.12)}
.tb-btn svg{width:26px;height:26px}
.tb-btn.off{opacity:.55}
.tb-title{flex:1;min-width:0;font-weight:800;font-size:clamp(18px,2.6vw,26px);line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-title small{display:block;font-weight:600;font-size:13px;color:var(--ink2)}
.stars-pill{display:flex;align-items:center;gap:4px;background:#fff;border-radius:999px;padding:6px 12px 6px 14px;font-weight:800;font-size:18px;box-shadow:0 3px 0 rgba(31,53,82,.1)}
.stars-pill .s{color:var(--gold);font-size:22px}

.view{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding-inline:16px;padding-block:4px 28px;-webkit-overflow-scrolling:touch}
.view.full{overflow:hidden;padding:0;display:flex;flex-direction:column}
.wrap{max-width:1100px;margin-inline:auto}

.btn{font-family:var(--fd);font-weight:800;font-size:19px;border:0;border-radius:18px;padding:10px 20px;min-height:52px;background:var(--acc);color:#fff;box-shadow:0 5px 0 var(--accd);cursor:pointer;transition:transform .08s,box-shadow .08s,opacity .2s;display:inline-flex;align-items:center;justify-content:center;gap:8px;line-height:1.2}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--accd)}
.btn.ghost{background:#fff;color:var(--accd);box-shadow:0 5px 0 var(--line)}
.btn.good{--acc:var(--good);--accd:#1b8c4b}
.btn.gold{--acc:#ffb300;--accd:#d18a00;color:#3b2a00}
.btn.big{font-size:22px;min-height:62px;padding:12px 28px;border-radius:22px}
.btn.sm{font-size:16px;min-height:42px;padding:6px 14px;border-radius:14px;box-shadow:0 4px 0 var(--accd)}
.btn[disabled]{opacity:.45;pointer-events:none}

/* ---------- home ---------- */
.home{display:flex;flex-direction:column;gap:18px;padding-top:4px}
.hero{display:flex;align-items:center;gap:16px;flex-wrap:wrap;justify-content:center}
.hero .mascot{width:128px;height:138px;flex:none;animation:bob 3s ease-in-out infinite}
.hero-txt{flex:1;min-width:250px;max-width:640px}
.hero h1{margin:0;font-size:clamp(34px,6vw,58px);line-height:1.05;font-weight:800;color:#18406a;text-shadow:0 3px 0 #fff}
.hero h1 span{color:var(--u1)}
.hero .sub{margin:6px 0 10px;font-weight:700;color:var(--ink2);font-size:17px}
.speech{position:relative;background:#fff;border-radius:20px;padding:10px 16px;font-weight:700;font-size:18px;box-shadow:var(--sh);display:inline-block}
.speech::before{content:"";position:absolute;right:-10px;top:18px;border:10px solid transparent;border-left-color:#fff;border-right:0}
.units{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}
.ucard{position:relative;background:#fff;border-radius:28px;padding:16px;box-shadow:var(--sh);cursor:pointer;display:flex;flex-direction:column;gap:10px;border:0;text-align:right;overflow:hidden;transition:transform .15s}
.ucard:hover{transform:translateY(-3px)}
.ucard:active{transform:scale(.98)}
.ucard .art{height:130px;border-radius:20px;background:var(--accl);display:grid;place-items:center;position:relative;overflow:hidden}
.ucard .art .em{font-size:46px;letter-spacing:6px;white-space:nowrap;filter:drop-shadow(0 4px 0 rgba(0,0,0,.08));margin-top:14px}
.ucard .art .num{position:absolute;z-index:1;top:10px;right:12px;background:var(--acc);color:#fff;border-radius:14px;padding:2px 12px;font-weight:800;font-size:16px}
.ucard h3{margin:0;font-size:25px;line-height:1.25;color:var(--accd)}
.ucard p{margin:0;color:var(--ink2);font-size:15px;font-weight:600;line-height:1.5}
.pbar{height:12px;border-radius:9px;background:var(--soft);overflow:hidden}
.pbar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),#ffd24d);border-radius:9px;transition:width .6s}
.prow{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px;color:var(--ink2)}
.prow .pbar{flex:1}
.extras{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.xcard{display:flex;align-items:center;gap:14px;background:#fff;border-radius:22px;padding:12px 16px;box-shadow:var(--sh);border:0;cursor:pointer;text-align:right}
.xcard .ic{width:62px;height:62px;flex:none;border-radius:18px;background:var(--accl);display:grid;place-items:center;font-size:34px}
.xcard b{display:block;font-size:20px;color:var(--accd)}
.xcard span{color:var(--ink2);font-size:14px;font-weight:600}

/* ---------- unit ---------- */
.unit-head{display:flex;align-items:center;gap:14px;background:#fff;border-radius:26px;padding:14px 18px;box-shadow:var(--sh);margin-bottom:16px}
.unit-head .em{font-size:44px;width:76px;height:76px;border-radius:22px;background:var(--accl);display:grid;place-items:center;flex:none}
.unit-head h2{margin:0;font-size:clamp(22px,3.4vw,32px);color:var(--accd);line-height:1.2}
.unit-head p{margin:2px 0 0;color:var(--ink2);font-weight:600}
.lpath{display:flex;flex-direction:column;gap:14px;position:relative;padding-inline-start:6px}
.lcard{display:flex;align-items:center;gap:14px;background:#fff;border-radius:24px;padding:12px 14px;box-shadow:var(--sh);cursor:pointer;border:0;text-align:right;width:100%;transition:transform .12s;position:relative}
.lcard:active{transform:scale(.985)}
.lcard .no{width:64px;height:64px;flex:none;border-radius:50%;background:var(--acc);color:#fff;display:grid;place-items:center;font-weight:800;font-size:19px;box-shadow:inset 0 -5px 0 rgba(0,0,0,.14)}
.lcard.review .no{background:var(--gold);color:#3b2a00}
.lcard .ico{font-size:34px;flex:none}
.lcard .tx{flex:1;min-width:0}
.lcard b{display:block;font-size:21px;line-height:1.3}
.lcard .mini{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.chip{display:inline-flex;align-items:center;gap:4px;background:var(--soft);border-radius:999px;padding:2px 10px;font-size:13px;font-weight:700;color:var(--ink2)}
.chip.done{background:var(--goodl);color:#177a43}
.chip.st{background:#fff6d6;color:#8a6200}

/* ---------- lesson ---------- */
.lhead{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:14px}
.lhead .no{background:var(--acc);color:#fff;border-radius:18px;padding:6px 16px;font-weight:800;font-size:22px;box-shadow:0 4px 0 var(--accd)}
.lhead h2{margin:0;font-size:clamp(26px,4.6vw,40px);line-height:1.2;color:#18406a}
.tiles{display:flex;flex-wrap:wrap;gap:16px}
.tile{flex:1 1 220px;position:relative;border:0;border-radius:26px;padding:16px;background:#fff;box-shadow:var(--sh);cursor:pointer;text-align:right;display:flex;flex-direction:column;gap:8px;min-height:170px;overflow:hidden;transition:transform .12s}
.tile:hover{transform:translateY(-3px)}
.tile:active{transform:scale(.98)}
.tile .ic{width:74px;height:74px;border-radius:22px;display:grid;place-items:center;font-size:42px;background:var(--accl)}
.tile .role{font-size:14px;font-weight:800;color:var(--accd);background:var(--accl);border-radius:999px;padding:1px 12px;align-self:flex-start}
.tile b{font-size:22px;line-height:1.25}
.tile .st{position:absolute;top:14px;left:14px;font-size:20px;letter-spacing:1px}
.tile.first{flex-basis:100%;flex-direction:row;align-items:center;min-height:120px;background:linear-gradient(120deg,var(--acc),var(--accd));color:#fff}
.tile.first .ic{background:rgba(255,255,255,.22)}
.tile.first .role{background:rgba(255,255,255,.25);color:#fff}
.tile.first .txt{display:flex;flex-direction:column;gap:6px}
.tile.first b{font-size:26px}
.tile.first .go{margin-inline-start:auto;font-size:40px}
.st .on{color:var(--gold)} .st .off{color:#d7e1ea}
.vocab-box{margin-top:18px;background:#fff;border-radius:24px;padding:14px 16px;box-shadow:var(--sh)}
.vocab-box h4{margin:0 0 10px;color:var(--accd);font-size:20px}
.vchips{display:flex;flex-wrap:wrap;gap:8px}
.vchip{border:0;background:var(--accl);color:var(--accd);font-weight:800;font-size:18px;border-radius:14px;padding:6px 14px;cursor:pointer;font-family:var(--fb)}
.vchip.open{background:var(--acc);color:#fff}
.vdef{margin-top:10px;font-family:var(--fb);font-size:19px;font-weight:600;line-height:1.8;color:var(--ink);min-height:1.8em}

/* ---------- game shell ---------- */
.guide{display:flex;align-items:center;gap:10px;padding:0 14px 8px;position:relative;z-index:4}
.guide .m{width:58px;height:62px;flex:none}
.guide .bubble{flex:1;min-width:0;background:#fff;border-radius:18px;padding:8px 14px;font-weight:700;font-size:clamp(16px,2.2vw,20px);line-height:1.45;box-shadow:0 3px 0 rgba(31,53,82,.08);position:relative;font-family:var(--fb)}
.guide .bubble::before{content:"";position:absolute;right:-8px;top:18px;border:8px solid transparent;border-left-color:#fff;border-right:0}
.guide .bubble.flash{animation:flash .5s}
.guide .say{width:44px;height:44px}
.guide .pill{background:var(--acc);color:#fff;border-radius:999px;padding:4px 12px;font-weight:800;font-size:17px;white-space:nowrap}
.guide .pill:empty{display:none}
.gtools{display:flex;align-items:center;gap:10px;flex:none}
@keyframes flash{30%{transform:scale(1.03);background:#fffbe6}}
.stage{flex:1;min-height:0;position:relative;overflow:hidden;margin:0 10px 10px;border-radius:26px;background:rgba(255,255,255,.72);box-shadow:inset 0 0 0 2px rgba(255,255,255,.8),0 6px 20px rgba(31,53,82,.08)}
.stage.plain{background:transparent;box-shadow:none}
.stage .pad{position:absolute;inset:0;overflow:auto;padding:14px;display:flex;flex-direction:column}
.center{display:flex;align-items:center;justify-content:center}
.col{display:flex;flex-direction:column}
.gap{gap:12px}
.timebar{height:10px;border-radius:8px;background:#e7eff6;overflow:hidden;margin:0 14px 8px}
.timebar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#ff7a59,#ffc83a,#50c878);transform-origin:right;transition:transform .2s linear}

.overlay{position:fixed;inset:0;background:rgba(18,40,70,.42);display:grid;place-items:center;z-index:80;animation:fadein .25s;padding:16px}
.endcard{background:#fff;border-radius:30px;padding:22px 22px 20px;max-width:440px;width:100%;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.25);animation:popin .45s cubic-bezier(.2,1.4,.4,1)}
.endcard .mascot{width:110px;height:118px;margin:-70px auto 0}
.endcard h3{margin:4px 0 2px;font-size:30px;color:#18406a}
.endcard p{margin:4px 0 12px;font-size:19px;font-weight:600;color:var(--ink2);font-family:var(--fb);line-height:1.7}
.endstars{display:flex;justify-content:center;gap:8px;margin:6px 0}
.endstars span{font-size:58px;line-height:1;color:#dde6ee;transition:color .2s}
.endstars span.on{color:var(--gold);animation:starpop .55s cubic-bezier(.2,1.6,.4,1) both;text-shadow:0 4px 0 #e39b00}
.endbtns{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:8px}
.modal{background:#fff;border-radius:28px;padding:20px;max-width:560px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.25);animation:popin .35s cubic-bezier(.2,1.4,.4,1);max-height:92vh;overflow:auto}
.modal h3{margin:0 0 10px;font-size:26px;color:#18406a}
.qtext{font-family:var(--fb);font-size:clamp(20px,2.8vw,26px);font-weight:700;line-height:1.7;margin:0 0 12px}
.opts{display:grid;gap:10px}
.opt{border:0;border-radius:18px;background:var(--soft);box-shadow:0 4px 0 var(--line);padding:12px 16px;font-family:var(--fb);font-size:clamp(18px,2.4vw,22px);font-weight:700;cursor:pointer;text-align:right;display:flex;align-items:center;gap:10px;line-height:1.5;transition:transform .08s;color:var(--ink)}
.opt:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.opt .e{font-size:30px;font-family:var(--fd)}
.opt.ok{background:var(--goodl);box-shadow:0 4px 0 #9fdcb9;color:#146b3a}
.opt.no{background:var(--badl);box-shadow:0 4px 0 #f4b3b6;color:#a3272d;animation:shake .4s}
.opt[disabled]{pointer-events:none}
.why{margin-top:10px;background:#fff8dd;border-radius:16px;padding:10px 14px;font-family:var(--fb);font-weight:600;font-size:19px;line-height:1.7}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#18406a;color:#fff;border-radius:16px;padding:10px 18px;font-weight:700;font-size:17px;z-index:99;box-shadow:0 8px 24px rgba(0,0,0,.25);animation:toastin .3s;max-width:calc(100% - 32px);text-align:center}
.confetti{position:fixed;top:-20px;width:12px;height:16px;z-index:98;pointer-events:none;border-radius:3px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
@keyframes fadein{from{opacity:0}}
@keyframes popin{from{transform:scale(.6);opacity:0}}
@keyframes toastin{from{transform:translate(-50%,20px);opacity:0}}
@keyframes starpop{0%{transform:scale(0) rotate(-40deg)}100%{transform:scale(1)}}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
@keyframes bob{50%{transform:translateY(-8px)}}
@keyframes pop{0%{transform:scale(.4);opacity:0}70%{transform:scale(1.12)}100%{transform:scale(1);opacity:1}}
@keyframes wiggle{25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}
@keyframes pulse{50%{transform:scale(1.12)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes floaty{50%{transform:translateY(-10px)}}
.shake{animation:shake .4s}
.popin{animation:pop .45s cubic-bezier(.2,1.4,.4,1) both}
.wiggle{animation:wiggle .5s}

/* drag */
.draggable{touch-action:none;cursor:grab}
.drag-src{opacity:.25}
.drag-ghost{filter:drop-shadow(0 12px 16px rgba(0,0,0,.25));transition:none}
.locked{pointer-events:none}

/* token (emoji item card) */
.tok{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:#fff;border-radius:18px;box-shadow:0 4px 0 var(--line),0 6px 14px rgba(31,53,82,.08);padding:6px 10px;min-width:78px;font-weight:800;font-size:15px;line-height:1.2;text-align:center;color:var(--ink)}
.tok .e{font-size:40px;line-height:1.1}
.tok.sm{min-width:62px;padding:4px 8px;font-size:13px}
.tok.sm .e{font-size:30px}
.tok.ok{background:var(--goodl)}
.tok.no{background:var(--badl);animation:shake .4s}
.em{font-family:'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif}

/* slides */
.slides{flex:1;min-height:0;display:flex;flex-direction:column}
.sbox{flex:1;min-height:0;position:relative;margin:0 10px;overflow:hidden}
.slide{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;padding:18px 18px 22px;background:#fff;border-radius:28px;box-shadow:var(--sh);display:flex;flex-direction:column;gap:14px}
.slide.enter{animation:slidein .45s cubic-bezier(.2,1,.3,1)}
.slide.enter-back{animation:slideback .45s cubic-bezier(.2,1,.3,1)}
@keyframes slidein{from{transform:translateX(-60px);opacity:0}}
@keyframes slideback{from{transform:translateX(60px);opacity:0}}
.s-top{display:flex;align-items:flex-start;gap:10px}
.s-kicker{display:inline-block;background:var(--accl);color:var(--accd);font-weight:800;border-radius:999px;padding:2px 14px;font-size:15px;margin-bottom:4px}
.s-title{margin:0;font-size:clamp(24px,3.6vw,36px);line-height:1.3;color:#18406a;flex:1;font-family:var(--fd);text-wrap:balance}
.s-read{flex:none}
.s-body{flex:1;display:flex;gap:18px;align-items:center;flex-wrap:wrap;justify-content:center}
.s-art{flex:1 1 260px;max-width:460px;display:grid;place-items:center;min-height:180px}
.s-art .big{font-size:clamp(70px,12vw,130px);line-height:1.1;text-align:center;animation:floaty 4s ease-in-out infinite}
.s-art svg{width:100%;height:auto;max-height:52vh}
.s-text{flex:1 1 320px;max-width:640px;display:flex;flex-direction:column;gap:12px}
.s-line{font-family:var(--fb);font-size:clamp(20px,2.7vw,27px);font-weight:600;line-height:1.85;margin:0;animation:pop .5s both}
.s-line.note{font-size:clamp(17px,2.2vw,21px);color:var(--ink2);background:var(--soft);border-radius:16px;padding:8px 14px}
.hl{color:var(--accd);background:var(--accl);border-radius:8px;padding:0 6px;font-weight:700}
.snav{display:flex;align-items:center;gap:10px;padding:10px 14px 12px}

// ---------- drag & drop (pointer based, works with touch + mouse)
// o.drop(x,y,el,ghost) -> false (return home) | true (remove ghost) | Element (fly into element)
function dragify(el, o = {}) {
  el.classList.add('draggable');
  el.addEventListener('pointerdown', e => {
    if (el.classList.contains('locked') || (o.can && !o.can(el))) return;
    if (e.button > 0) return;
    e.preventDefault();
    Sound.play('pick');
    const r = el.getBoundingClientRect();
    const g = el.cloneNode(true);
    g.classList.add('drag-ghost'); g.classList.remove('drag-src');
    Object.assign(g.style, { position: 'fixed', left: r.left + 'px', top: r.top + 'px', width: r.width + 'px', height: r.height + 'px', margin: '0', zIndex: 1000, pointerEvents: 'none', transform: 'scale(1.08)' });
    document.body.appendChild(g);
    el.classList.add('drag-src');
    const ox = e.clientX - r.left, oy = e.clientY - r.top;
    o.start && o.start(el);
    const mv = ev => { g.style.left = (ev.clientX - ox) + 'px'; g.style.top = (ev.clientY - oy) + 'px'; o.move && o.move(ev.clientX, ev.clientY, el, g); };
    const up = ev => {
      window.removeEventListener('pointermove', mv); window.removeEventListener('pointerup', up); window.removeEventListener('pointercancel', up);
      let res = false;
      if (ev.type !== 'pointercancel' && o.drop) { try { res = o.drop(ev.clientX, ev.clientY, el, g); } catch (err) { console.error(err); res = false; } }
      o.end && o.end(el);
      if (res && res.getBoundingClientRect) {
        const t = res.getBoundingClientRect();
        g.style.transition = 'all .3s ease-in'; g.style.left = (t.left + t.width / 2 - r.width * .15) + 'px'; g.style.top = (t.top + t.height / 2 - r.height * .15) + 'px'; g.style.transform = 'scale(.3)'; g.style.opacity = '.2';
        setTimeout(() => { g.remove(); }, 310);
      } else if (res) { g.remove(); el.classList.remove('drag-src'); }
      else {
        g.style.transition = 'left .25s, top .25s, transform .25s'; g.style.left = r.left + 'px'; g.style.top = r.top + 'px'; g.style.transform = 'scale(1)';
        setTimeout(() => { g.remove(); el.classList.remove('drag-src'); }, 260);
      }
    };
    window.addEventListener('pointermove', mv); window.addEventListener('pointerup', up); window.addEventListener('pointercancel', up);
  });
}

function plantSVG(o = {}) {

  let s = `<svg viewBox="0 0 100 160" class="plant" aria-hidden="true">`;

// thermometer
function thermoSVG(val, o = {}) {
  const min = o.min == null ? -10 : o.min, max = o.max == null ? 50 : o.max;
  const y0 = 186, y1 = 22, yv = v => y0 - (v - min) / (max - min) * (y0 - y1);
  const lv = clamp(yv(val), y1 - 4, y0 + 6);
  let s = `<svg viewBox="0 0 76 240" class="thermo" aria-hidden="true"><rect x="22" y="8" width="18" height="190" rx="9" fill="#fff" stroke="#7d93ad" stroke-width="2.5"/>`;
  s += `<rect class="liq" x="27" y="${lv}" width="8" height="${200 - lv}" rx="4" fill="#e53935"/><circle cx="31" cy="206" r="18" fill="#e53935" stroke="#7d93ad" stroke-width="2.5"/><circle cx="25" cy="200" r="5" fill="#ff8a80"/>`;
  for (let v = min; v <= max; v += (o.step || 5)) {
    const y = yv(v), big = v % 10 === 0;
    s += `<line x1="40" x2="${big ? 50 : 46}" y1="${y}" y2="${y}" stroke="#4d6585" stroke-width="${big ? 2 : 1.3}"/>`;
    if (big) s += `<text x="53" y="${y + 5}" font-size="13" font-weight="700" fill="#1f3552" direction="ltr" font-family="Baloo Bhaijaan 2, sans-serif">${ar(v)}</text>`;
  }
  s += `<text x="31" y="238" text-anchor="middle" font-size="12" font-weight="800" fill="#4d6585" font-family="Baloo Bhaijaan 2, sans-serif">°س</text>`;
  return s + '</svg>';
}

  const w = Math.max(60, x + rest * 9 + 6);
  return `<svg viewBox="0 0 ${w} 50" style="height:50px;max-width:100%" direction="ltr">${s}</svg>`;

/* ============ الوحدة الأولى: الاعتناء بالنباتات ============ */
addCSS(`
.bp .bp-row{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;gap:18px}
.bp-scene{height:100%;max-height:600px;aspect-ratio:300/370;max-width:60%;flex:none;background:linear-gradient(#e9f7ff,#fff);border-radius:22px;position:relative}
.bp-scene svg{width:100%;height:100%;display:block}
.bp-tray{display:grid;grid-template-columns:repeat(2,auto);gap:12px;justify-content:center}
.bp-part{overflow:hidden;width:118px;height:118px;background:#fff;border-radius:22px;box-shadow:0 5px 0 var(--line),0 8px 18px rgba(31,53,82,.1);display:grid;place-items:center;padding:6px}
.bp-part .pic,.bp-part .pic svg{width:100%;height:100%;overflow:hidden}
.bp-name{background:var(--acc);color:#fff;font-weight:800;font-size:22px;border-radius:16px;padding:10px 16px;box-shadow:0 5px 0 var(--accd);text-align:center;min-width:110px}
@media (max-aspect-ratio:1/1){.bp .bp-row{flex-direction:column;gap:10px}.bp-scene{height:auto;flex:1;min-height:0;max-width:100%;width:auto}.bp-tray{grid-template-columns:repeat(4,auto)}.bp-part{width:78px;height:78px;border-radius:16px}.bp-name{font-size:18px;min-width:0;padding:8px 10px}}

.pd-grid{flex:1;min-height:0;display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:1fr;gap:10px}
.pd-card{background:#fff;border-radius:18px;box-shadow:0 4px 0 var(--line);overflow:hidden;display:flex;min-height:0}
.pd-card svg{width:100%;height:100%}
.pd-card .pt{cursor:pointer}
.pd-card.healed{animation:pulse .5s}

GAMES.buildPlant = {
  title: 'ابنِ نبتتَك', icon: '🪴', role: 'activity', desc: 'ركّبْ أجزاءَ النبتةِ في أماكنِها، ثمّ ضعْ اسمَ كلِّ جزء.',
  intro: 'اسحبْ كلَّ جزءٍ من النبتةِ إلى *مكانِه الصحيح* 🌱',
  run(api) {
    const P = api.pad(); P.classList.add('bp');
    const pre = uid('bp');
    const scene = h('div', { class: 'bp-scene', html: plantDiagram({ pre, ghost: { roots: 1, stem: 1, leaves: 1, flower: 1 } }) });
    const tray = h('div', { class: 'bp-tray' });
    P.append(h('div', { class: 'bp-row' }, scene, tray));
    const svg = $('svg', scene);
    const CROP = { roots: '85 230 130 125', stem: '118 86 64 152', leaves: '82 96 136 128', flower: '104 26 92 100' };
    const HINT = { roots: 'الجذورُ تكونُ *تحتَ التربة* 👇', stem: 'الساقُ في *الوسط*؛ تحملُ الأوراقَ والزهرة.', leaves: 'الأوراقُ على *جانبَي الساق* 🍃', flower: 'الزهرةُ في *أعلى* النبتة 🌸' };
    let mist = 0, placed = 0;
    shuffle(PARTS).forEach(p => {
      const pic = plantDiagram({ only: p }).replace('viewBox="0 0 300 370"', `viewBox="${CROP[p]}"`);
      const t = h('div', { class: 'bp-part', data: { part: p } }, h('div', { class: 'pic', html: pic }));
      dragify(t, {
        drop: (x, y) => {
          const g = $('#' + pre + '-' + p, svg);
          if (hit(x, y, [g], 26)) {
            g.classList.remove('ghost'); g.classList.add('placed'); t.classList.add('locked'); t.style.visibility = 'hidden';
            placed++; Sound.play('drop'); api.good(`أحسنت! *${PART_AR[p]}*: ${PART_FN[p]}`); Speech.say(PART_AR[p] + '. ' + PART_FN[p]);
            if (placed === 4) { later(() => { Sound.play('grow'); api.say('نبتةٌ كاملة! 🌱✨', 'wow'); }, 900); later(phase2, 2600); }
            return true;
          }
          if (hit(x, y, [scene])) { mist++; api.bad(HINT[p]); }
          return false;
        }
      });
      tray.append(t);
    });
    function phase2() {
      api.say('الآن اسحبْ كلَّ *اسمٍ* إلى المربّعِ المناسب 🏷️');
      const S = { flower: [250, 40, 172, 62], leaves: [50, 104, 106, 134], stem: [252, 216, 158, 216], roots: [252, 304, 188, 302] };
      let add = '';
      PARTS.forEach(p => {
        const [cx, cy, lx, ly] = S[p];
        add += `<g class="slot" data-part="${p}"><line x1="${cx > 150 ? cx - 46 : cx + 46}" y1="${cy}" x2="${lx}" y2="${ly}" stroke="#4d6585" stroke-width="2.5" stroke-dasharray="5 4"/><circle cx="${lx}" cy="${ly}" r="4" fill="#4d6585"/><rect x="${cx - 46}" y="${cy - 19}" width="92" height="38" rx="12" fill="#fff" stroke="#7d93ad" stroke-width="2.5" stroke-dasharray="6 4"/><text x="${cx}" y="${cy + 7}" text-anchor="middle" font-size="19" font-weight="800" fill="#7d93ad" font-family="Baloo Bhaijaan 2, sans-serif">؟</text></g>`;
      });
      svg.insertAdjacentHTML('beforeend', add);
      tray.innerHTML = '';
      let done = 0;
      shuffle(PARTS).forEach(p => {
        const t = h('div', { class: 'bp-name', data: { part: p } }, PART_AR[p]);
        dragify(t, {
          drop: (x, y) => {
            const s = hit(x, y, $$('.slot', svg), 14);
            if (!s || s.classList.contains('done')) return false;
            if (s.dataset.part !== p) { mist++; api.bad('ليسَ هذا مكانَه! تتبّعِ *الخطَّ المنقّط* 👀'); return false; }
            const r = $('rect', s); r.setAttribute('fill', '#e2f6e5'); r.setAttribute('stroke', '#2fa652'); r.removeAttribute('stroke-dasharray');
            const tx = $('text', s); tx.textContent = PART_AR[p]; tx.setAttribute('fill', '#1f7f3c');
            s.classList.add('done'); t.classList.add('locked'); t.style.visibility = 'hidden';
            done++; Sound.play('drop'); api.good(`صحيح! هذه *${PART_AR[p]}*`); Speech.say(PART_AR[p]);
            if (done === 4) later(() => api.finish(starsBy(mist, 1, 3), 'بنيتَ نبتةً كاملةً، وعرفتَ أجزاءَها الأربعة: الجذور، والساق، والأوراق، والأزهار.'), 1200);
            return true;
          }
        });
        tray.append(t);
      });
    }
  }
};

function treeSVG(p) {
  p = clamp(p, 0, 1);
  let s = '<svg viewBox="0 0 200 240" class="tree"><ellipse cx="100" cy="222" rx="92" ry="14" fill="#8fd07a"/><rect x="0" y="224" width="200" height="16" fill="#b98556"/>';
  if (p < .07) { s += '<ellipse cx="100" cy="220" rx="9" ry="6" fill="#8b5e36"/>'; if (p > 0) s += '<path d="M100 216 q-2 -10 -8 -14 M100 216 q2 -10 8 -12" stroke="#3fae4a" stroke-width="3" fill="none"/>'; return s + '</svg>'; }
  const th = 20 + 150 * p, tw = 4 + 16 * p, top = 220 - th;
  s += `<path d="M${100 - tw / 2} 222 Q${100 - tw / 3} ${220 - th / 2} ${100 - tw / 4} ${top} L${100 + tw / 4} ${top} Q${100 + tw / 3} ${220 - th / 2} ${100 + tw / 2} 222Z" fill="#8b5e36"/>`;
  if (p > .15) {
    const cr = 12 + 60 * p;
    s += [[0, 0, 1], [-.7, .25, .75], [.7, .25, .75], [-.4, -.45, .7], [.4, -.45, .7]].map(([dx, dy, k]) => `<circle cx="${100 + dx * cr}" cy="${top + dy * cr}" r="${cr * k}" fill="${k === 1 ? '#4cb050' : '#5cc45f'}"/>`).join('');
    if (p > .55) s += [[-30, -10], [25, -25], [5, 10], [-10, -40], [35, 5], [-40, 15]].map(([dx, dy]) => `<circle cx="${100 + dx * p}" cy="${top + dy * p}" r="${3 + 2 * p}" fill="#ff8fb1"/>`).join('');
    if (p > .8) s += [[-20, 5], [18, -8], [0, -30], [30, 20], [-35, -15]].map(([dx, dy]) => `<circle cx="${100 + dx * p * 1.2}" cy="${top + dy * p + 10}" r="${5 + 3 * p}" fill="#e53935" stroke="#9b1c1c" stroke-width="1"/>`).join('');
  } else s += `<path d="M100 ${top} q-8 -8 -14 -6 M100 ${top} q8 -8 14 -6" stroke="#3fae4a" stroke-width="4" fill="none"/>`;
  return s + '</svg>';
}

        api.finish(solo ? (w === 'b' ? 3 : !w ? 2 : 1) : 3, msg);
      };
      const nextQ = () => { qi++; if (qi >= qs.length || Math.abs(pos) >= 4) end(); else show(); };
      const win = side => {
        if (answered) return; answered = true; clearTimeout(botT);
        pos += side === 'b' ? 1 : -1; Sound.play('tug'); Sound.play('good'); upd();

      const lose = side => { if (side === 'b') { lockB = true; pB.classList.add('lock'); } else { lockR = true; pR.classList.add('lock'); } Sound.play('bad'); if (lockB && lockR) { answered = true; clearTimeout(botT); api.say('الإجابةُ الصحيحة: ' + qs[qi][1][0], 'think'); later(nextQ, 2000); } };
      function show() {

        qEl.innerHTML = mdx(q); upd();
        const opts = shuffle(os.map((o, k) => [o, k === 0]));
        pB.innerHTML = ''; pB.append(h('h4', {}, solo ? '🔵 أنت' : '🔵 الفريقُ الأزرق'));
        opts.forEach(([o, ok]) => pB.append(h('button', { class: 'opt', onclick: e => { if (answered || lockB) return; ok ? (e.currentTarget.classList.add('ok'), win('b')) : (e.currentTarget.classList.add('no'), lose('b')); } }, o)));
        pR.innerHTML = '';
        if (solo) {
          const bt = h('div', { class: 'tw-bot' }, '🌱 بُرعُم يفكّر… 🤔'); pR.append(h('h4', {}, '🔴 بُرعُم'), bt);
          botT = setTimeout(() => { if (answered) return; if (Math.random() < .68) { bt.textContent = '🌱 ' + opts.find(o => o[1])[0]; win('r'); } else { bt.textContent = '🌱 أخطأ بُرعُم! ❌'; lose('r'); } }, rnd(3800, 7000));
        } else {
          pR.append(h('h4', {}, '🔴 الفريقُ الأحمر'));
          shuffle(opts).forEach(([o, ok]) => pR.append(h('button', { class: 'opt', onclick: e => { if (answered || lockR) return; ok ? (e.currentTarget.classList.add('ok'), win('r')) : (e.currentTarget.classList.add('no'), lose('r')); } }, o)));
        }
      }
      Scr.add(() => clearTimeout(botT));
      show();
    }
  }
};

function fpSVG(type, seed = 1, o = {}) {
  let s = (seed * 7919 + 17) % 233280; const R = () => { s = (s * 9301 + 49297) % 233280; return s / 233280; };

  const dir = o.dir || (R() < .5 ? 1 : -1);

  } else if (type === 'whorl') {
    let d = `M${cx.toFixed(1)} ${cy.toFixed(1)}`;
    for (let a = 0; a < Math.PI * 2 * 7.5; a += .18) { const r = 1 + a * gap / (2 * Math.PI); d += ` L${(cx + dir * r * Math.cos(a)).toFixed(1)} ${(cy + r * 1.2 * Math.sin(a)).toFixed(1)}`; }
    p += d + ' ';
    const top = cy - (1 + 7.5 * gap) * 1.2;
    for (let y = top - 2, k = 0; y > -30; y -= gap, k++) p += `M-30 ${(y + 26 + k).toFixed(1)} Q ${cx.toFixed(1)} ${(y - 10).toFixed(1)} 130 ${(y + 26 + k).toFixed(1)} `;

  } else {
    for (let k = 1; k <= 8; k++) { const r = k * gap; p += `M${(cx - r - dir * (6 + k * 2.4)).toFixed(1)} 150 L${(cx - r).toFixed(1)} ${cy.toFixed(1)} A${r.toFixed(1)} ${(r * 1.15).toFixed(1)} 0 0 1 ${(cx + r).toFixed(1)} ${cy.toFixed(1)} L${(cx + r - dir * (6 + k * 2.4)).toFixed(1)} 150 `; }

    for (let y = top - 3, k = 0; y > -30; y -= gap, k++) p += `M-30 ${(y + 22 + k).toFixed(1)} Q ${cx.toFixed(1)} ${(y - 12).toFixed(1)} 130 ${(y + 22 + k).toFixed(1)} `;
  }
  return `<svg viewBox="0 0 100 130" style="width:100%;height:auto;display:block"><defs><clipPath id="${id}"><ellipse cx="50" cy="65" rx="44" ry="60"/></clipPath></defs><ellipse cx="50" cy="65" rx="44" ry="60" fill="#fdf1e4" stroke="#e2c6a6" stroke-width="2"/><g clip-path="url(#${id})"><path d="${p}" fill="none" stroke="#6b4a33" stroke-width="1.7" stroke-linecap="round" transform="rotate(${rotA.toFixed(1)} 50 65)"/></g></svg>`;
}

.fl-card{border:0;background:#fff;border-radius:22px;padding:10px;box-shadow:var(--sh);display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;width:min(28vw,170px);transition:transform .3s}
.fl-card b{font-size:20px;color:var(--accd)}
.fl-card.seen{outline:4px solid var(--good)}
.fl-lens{position:relative;width:min(40vh,230px);aspect-ratio:100/130;touch-action:none;cursor:crosshair;border-radius:24px;overflow:hidden;background:#fff;box-shadow:var(--sh)}
.fl-lens .blur{position:absolute;inset:0;filter:blur(4.5px)}
.fl-lens .sharp{position:absolute;inset:0;clip-path:circle(22% at var(--x) var(--y))}
.fl-lens .ring{position:absolute;width:44%;aspect-ratio:1;border-radius:50%;border:6px solid #1f3552;box-shadow:0 0 0 3px #fff;transform:translate(-50%,-50%);left:var(--x);top:var(--y);pointer-events:none}
.fl-lens .ring::after{content:"";position:absolute;width:12px;height:46px;background:#1f3552;border-radius:6px;right:-18px;bottom:-40px;transform:rotate(-40deg)}
.fl-sus{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;width:100%;max-width:760px}
.fl-s{border:0;background:#fff;border-radius:18px;padding:8px;box-shadow:0 4px 0 var(--line);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px}
.fl-s .av{width:64px;height:64px}
.fl-s .pr{width:74px}
.fl-s.ok{background:var(--goodl)}.fl-s.no{background:var(--badl)}
@media (max-width:600px){.fl-sus{grid-template-columns:repeat(2,1fr)}}

.tc-parade{height:130px;position:relative;overflow:hidden;background:linear-gradient(#e9f7ff,#fff);border-radius:20px;margin-bottom:10px}
.tc-kid{position:absolute;top:8px;width:110px;height:114px;transition:left .6s ease-in-out;transform:translateX(-50%)}
.tc-cols{flex:1;display:grid;gap:10px;min-height:0}
.tc-col{background:#fff;border-radius:20px;box-shadow:0 4px 0 var(--line);padding:8px;display:flex;flex-direction:column;align-items:center;gap:6px;min-height:0}
.tc-col h5{margin:0;font-size:18px;display:flex;align-items:center;gap:6px}
.tc-col h5 i{width:20px;height:20px;border-radius:50%;display:inline-block;border:2px solid #fff;box-shadow:0 0 0 1px #aaa}
.tc-marks{flex:1;width:100%;display:flex;flex-wrap:wrap;align-content:flex-start;justify-content:center;min-height:56px}
.tc-col .opts{grid-template-columns:repeat(3,1fr);width:100%}
.tc-col .opt{justify-content:center;padding:6px;font-size:20px}

.gw-clue{font-family:var(--fb);font-weight:700;font-size:clamp(19px,2.6vw,25px);text-align:center;background:#fff8dd;border-radius:18px;padding:8px 14px;margin-bottom:8px}
.gw-grid{flex:1;display:grid;grid-template-columns:repeat(6,1fr);gap:8px;min-height:0}
.gw-k{border:0;background:#fff;border-radius:16px;box-shadow:0 4px 0 var(--line);padding:4px;display:flex;flex-direction:column;align-items:center;cursor:pointer;min-height:0;transition:all .3s;font:800 14px var(--fd);color:var(--ink)}
.gw-k .av{flex:1;width:100%;min-height:0}
.gw-k.off{opacity:.25;filter:grayscale(1);transform:scale(.92)}
.gw-k.win{background:var(--goodl);box-shadow:0 0 0 4px var(--good);animation:pulse .6s 3}
@media (max-aspect-ratio:1/1){.gw-grid{grid-template-columns:repeat(4,1fr)}}

.kt-wrap{position:relative;flex:1;display:grid;grid-template-rows:auto auto auto auto;gap:46px;align-content:center;padding:6px}
.kt-row{display:flex;justify-content:space-around;gap:10px;position:relative;z-index:1}
.kt-node{background:#fff;border-radius:18px;padding:8px 12px;box-shadow:0 4px 0 var(--line);text-align:center;font-weight:800;font-size:clamp(15px,2vw,19px);min-width:120px;opacity:.55;transition:all .3s}
.kt-node.on{opacity:1;box-shadow:0 0 0 4px var(--acc),0 4px 0 var(--line)}
.kt-node .yn{display:flex;gap:6px;justify-content:center;margin-top:6px}
.kt-leaf{background:var(--accl);border-radius:18px;padding:6px;min-width:0;flex:1;min-height:92px;text-align:center;font-weight:800;font-size:clamp(12px,1.6vw,15px);display:flex;flex-direction:column;gap:4px;align-items:center}
.kt-leaf .got{font-size:26px;display:flex;flex-wrap:wrap;justify-content:center}
.kt-token{position:absolute;z-index:3;font-size:52px;transform:translate(-50%,-50%);transition:left .55s ease-in-out,top .55s ease-in-out;pointer-events:none;filter:drop-shadow(0 4px 3px rgba(0,0,0,.25))}
.kt-svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.kt-svg line{stroke:#b9a6f3;stroke-width:5;stroke-linecap:round}
.kt-svg text{font:800 14px var(--fd);fill:#5a3fd4}

.oo-grid{flex:1;display:grid;grid-template-columns:repeat(2,1fr);gap:12px;max-width:640px;width:100%;margin:0 auto;min-height:0}
.oo-c{position:relative;border:0;background:#fff;border-radius:22px;box-shadow:0 5px 0 var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;font:800 clamp(16px,2.2vw,21px) var(--fd);color:var(--ink);min-height:0}
.oo-c .em{font-size:clamp(46px,10vh,82px);line-height:1.1}
.oo-c.odd{background:#fff6d6;box-shadow:0 0 0 5px var(--gold)}
.oo-c.no{background:var(--badl);animation:shake .4s}
.oo-c .tag{position:absolute;bottom:6px;font-size:13px;background:var(--goodl);color:#146b3a;border-radius:8px;padding:0 8px}

.vn-main{flex:1;display:flex;flex-direction:column;gap:10px;align-items:center;min-height:0}
.vn-box{position:relative;width:min(100%,640px,(100vh - 330px)*1.54);aspect-ratio:400/260;touch-action:none}
.vn-box svg{width:100%;height:100%;display:block}
.vn-it{position:absolute;transform:translate(-50%,-50%);font-size:clamp(22px,3.6vw,34px);pointer-events:none;animation:pop .35s both}
.vn-pool{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}

.bg-main{flex:1;display:flex;gap:14px;align-items:center;justify-content:center;flex-wrap:wrap;min-height:0}
.bg-board{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;width:min(100%,60vh*1.25,560px);direction:ltr}
.bg-cell{position:relative;aspect-ratio:1;border-radius:14px;background:#fff;box-shadow:0 3px 0 var(--line);display:grid;place-items:center;font-size:clamp(16px,3vh,26px);font-weight:800}
.bg-cell .n{position:absolute;top:2px;left:6px;font-size:11px;color:var(--ink3)}
.bg-cell.q{background:#eee9ff}.bg-cell.star{background:#fff6d6}.bg-cell.back{background:#ffe4e5}.bg-cell.fin{background:var(--goodl)}.bg-cell.st{background:#e1f2fc}
.bg-tok{position:absolute;font-size:clamp(20px,3.6vh,32px);transition:all .2s;filter:drop-shadow(0 3px 2px rgba(0,0,0,.3))}
.bg-side{display:flex;flex-direction:column;gap:10px;align-items:center;min-width:220px}
.bg-die{width:96px;height:96px;border-radius:22px;background:#fff;box-shadow:0 6px 0 var(--line),0 8px 20px rgba(0,0,0,.1);display:grid;place-items:center}
.bg-die svg{width:78px;height:78px}
.bg-die.roll{animation:wiggle .15s infinite}
.bg-turn{font-weight:800;font-size:20px;border-radius:14px;padding:4px 14px;background:#fff;box-shadow:0 3px 0 var(--line)}
`);

    const OB = [

      { e: '🚗', n: 'السيّارة', v: [0, 0, 1, 0, 0, 0, 0], note: 'السيّارةُ تتحرّك، لكنّها لا تتنفّسُ ولا تنمو ولا تتكاثر.' },
      { e: '🌳', n: 'الشجرة', v: [1, 1, 1, 1, 1, 1, 1], note: 'الشجرةُ حيّة! تتحرّكُ *برفقٍ نحوَ الضوء*، وتُحسُّ بالضوء، وتُنتجُ البذور.' },
      { e: '🪁', n: 'الطائرةُ الورقيّة', v: [0, 0, 1, 0, 0, 0, 0], note: 'تتحرّكُ بالرياحِ فقط، ولا تقومُ بالعمليّاتِ الحيويّةِ الأخرى.' },
      { e: '🐝', n: 'النحلة', v: [1, 1, 1, 1, 1, 1, 1], note: 'النحلةُ كائنٌ حيٌّ يقومُ بجميعِ العمليّات.' },
      { e: '🪨', n: 'الصخرة', v: [0, 0, 0, 0, 0, 0, 0], note: 'الصخرةُ لا تقومُ بأيِّ عمليّةٍ حيويّة.' }];
    let oi = 0, mist = 0;
    const P = api.pad();
    function show() {
      const o = OB[oi]; P.innerHTML = ''; api.pill(`📡 ${ar(oi + 1)} / ${ar(OB.length)}`);
      const ans = PR.map(() => null);
      const verdict = h('div', { class: 'ls-verdict', hidden: true });
      const screen = h('div', { class: 'ls-screen' }, h('div', { class: 'sweep' }), h('span', { class: 'em' }, o.e), h('b', {}, o.n), verdict);
      const rows = PR.map(([e, t], k) => {

        const bN = h('button', { onclick: () => { ans[k] = 0; bN.classList.add('on'); bY.classList.remove('on'); Sound.play('tap'); } }, 'لا ✗');
        yn.append(bY, bN);
        return h('div', { class: 'ls-row' }, h('span', { class: 'em' }, e), h('span', { class: 't' }, t), yn);
      });
      const res = h('div', { class: 'col gap' });
      const scanB = btn('📡 افحص', () => {
        if (ans.includes(null)) { api.say('اخترْ *نعم* أو *لا* لكلِّ العمليّاتِ السبع أوّلًا 👆', 'think'); return; }
        scanB.remove(); screen.classList.add('scan'); Sound.play('scan');
        rows.forEach(r => $$('button', r).forEach(b => b.disabled = true));
        later(() => {
          let wrong = 0;
          rows.forEach((r, k) => { const ok = ans[k] === o.v[k]; if (!ok) wrong++; r.classList.add(ok ? 'ok' : 'no'); if (!ok) r.append(h('span', { class: 'truth' }, '👈 الصحيح: ' + (o.v[k] ? 'نعم' : 'لا'))); });
          mist += wrong;
          const alive = o.v.every(Boolean);
          verdict.hidden = false; verdict.textContent = alive ? 'كائنٌ حيّ 💚' : 'شيءٌ غيرُ حيّ 🪨';
          Sound.play(wrong ? 'bad' : 'good'); if (!wrong) api.mood('wow');
          api.say((wrong ? `أخطأتَ في ${ar(wrong)}. ` : 'فحصٌ ممتاز! ') + o.note);

GAMES.lifeFlower = {

    const COL = ['#ff9fb2', '#ffcc80', '#fff176', '#a5d6a7', '#81d4fa', '#b39ddb', '#f48fb1'];

    const flower = h('div', { class: 'lf-flower' }, h('div', { class: 'lf-center' }, 'الكائنُ', h('br'), 'الحيّ 🌱'));
    const slots = OK.map((_, i) => { const a = i / 7 * Math.PI * 2 - Math.PI / 2; const s = h('div', { class: 'lf-slot', style: { left: (50 + 36 * Math.cos(a)) + '%', top: (50 + 36 * Math.sin(a)) + '%', '--c': COL[i] } }); flower.append(s); return s; });

/* ---------- ٣-١ لعبة: إكس-أو الحياة ---------- */

  run(api) {
    const LIV = [['🐪', 'جمل'], ['🌵', 'صبّار'], ['🐝', 'نحلة'], ['🦋', 'فراشة'], ['🐞', 'دعسوقة'], ['🌻', 'دوّارُ الشمس'], ['🐬', 'دلفين'], ['🦉', 'بومة'], ['🐢', 'سلحفاة'], ['🐸', 'ضفدع'], ['🦅', 'نسر'], ['🌴', 'نخلة'], ['🌼', 'زهرةُ الهندباء'], ['🐌', 'حلزون']];
    const NON = [['🪨', 'صخرة'], ['⚽', 'كرة'], ['🚲', 'درّاجة'], ['☁️', 'غيمة'], ['🔥', 'نار'], ['🕯️', 'شمعة'], ['📱', 'هاتف'], ['⏰', 'ساعة'], ['🚗', 'سيّارة'], ['🎈', 'بالون'], ['🪁', 'طائرةٌ ورقيّة'], ['☀️', 'الشمس'], ['🚀', 'صاروخ'], ['💻', 'حاسوب']];
    const P = api.pad();
    P.append(h('div', { class: 'tw-setup' }, h('div', { class: 'em', style: { fontSize: '80px' } }, '✖️⭕'), h('h3', {}, 'اخترْ طريقةَ اللعب'),
      h('div', { class: 'endbtns' }, btn('👥 فريقانِ في الصفّ', () => start(false), 'big'), btn('🌱 ضدَّ بُرعُم', () => start(true), 'gold big'))));
    function start(solo) {
      const wins = { b: 0, r: 0 }; let round = 0;
      const LINES = [[0, 1, 2], [3, 4, 5], [6, 7, 8], [0, 3, 6], [1, 4, 7], [2, 5, 8], [0, 4, 8], [2, 4, 6]];
      function newRound() {
        P.innerHTML = ''; round++;
        const items = shuffle([...shuffle(LIV).slice(0, 5).map(x => [...x, 1]), ...shuffle(NON).slice(0, 4).map(x => [...x, 0])]);
        const own = Array(9).fill(null); let turn = round % 2 ? 'b' : 'r', busy = false, over = false;
