<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>الهوية والمواطنة — الصف الثالث — برنامج تفاعلي</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;600;700;800&family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg1:#eaf6ff; --bg2:#fff9ec; --card:#ffffff; --ink:#1f2a44; --muted:#5b6a86;
  --red:#d7263d; --green:#1fa463; --blue:#2c7be5; --yellow:#ffc53d; --orange:#ff8c42; --pink:#e84a8a; --purple:#7a5af8; --teal:#14b8a6;
  --u1:#1fa463; --u2:#e84a8a; --u3:#2c7be5;
  --accent:var(--u1);
  --radius:22px; --shadow:0 10px 30px rgba(31,42,68,.10);
  --font-head:'Baloo Bhaijaan 2',sans-serif; --font-body:'Cairo',sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{font-family:var(--font-body);color:var(--ink);background:linear-gradient(160deg,var(--bg1),var(--bg2) 60%,#f3fff4);min-height:100vh;overflow-x:hidden;font-size:18px;line-height:1.7}
body::before{content:"";position:fixed;inset:0;background:
  radial-gradient(circle at 15% 10%,rgba(255,197,61,.25),transparent 30%),
  radial-gradient(circle at 85% 20%,rgba(44,123,229,.15),transparent 35%),
  radial-gradient(circle at 60% 90%,rgba(31,164,99,.15),transparent 35%);pointer-events:none;z-index:0}
#app{position:relative;z-index:1;max-width:1100px;margin:0 auto;padding:12px 14px 90px}
h1,h2,h3,h4{font-family:var(--font-head);margin:0;line-height:1.35}
button{font-family:inherit;cursor:pointer;border:none}
.hidden{display:none!important}

/* Top bar */
.topbar{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.85);backdrop-filter:blur(10px);border-radius:18px;padding:8px 12px;box-shadow:var(--shadow);position:sticky;top:8px;z-index:50}
.topbar .brand{font-family:var(--font-head);font-weight:800;font-size:1.05rem;color:var(--accent);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{width:42px;height:42px;border-radius:14px;background:#f1f5fb;font-size:1.25rem;display:grid;place-items:center;transition:.2s;color:var(--ink)}
.iconbtn:hover{background:#e3ebf7;transform:translateY(-1px)}
.iconbtn.active{background:var(--accent);color:#fff}
.crumbs{display:flex;gap:6px;flex-wrap:wrap;font-size:.85rem;color:var(--muted);margin:10px 4px 0}
.crumbs span{cursor:pointer}
.crumbs span:hover{color:var(--accent)}
.crumbs b{color:var(--ink)}

/* Cards & layout */
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px;margin-top:16px;animation:pop .35s ease}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}
.grid{display:grid;gap:14px}
.grid.c2{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.grid.c3{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.grid.c4{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.center{text-align:center}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.center{justify-content:center}
.spacer{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:999px;background:#eef3fb;font-size:.85rem;font-weight:700;color:var(--muted)}
.pill.acc{background:color-mix(in srgb,var(--accent) 15%,#fff);color:var(--accent)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 22px;border-radius:16px;font-weight:800;font-size:1rem;background:var(--accent);color:#fff;box-shadow:0 6px 0 color-mix(in srgb,var(--accent) 70%,#000 10%);transition:.15s;font-family:var(--font-head)}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 color-mix(in srgb,var(--accent) 70%,#000 10%)}
.btn.sec{background:#fff;color:var(--accent);border:2px solid var(--accent);box-shadow:0 6px 0 color-mix(in srgb,var(--accent) 30%,#fff)}
.btn.ghost{background:#f1f5fb;color:var(--ink);box-shadow:0 6px 0 #d8e0ee}
.btn.sm{padding:8px 14px;font-size:.9rem;border-radius:12px;box-shadow:0 4px 0 color-mix(in srgb,var(--accent) 70%,#000 10%)}
.btn.red{background:var(--red);box-shadow:0 6px 0 #9f1a2b}
.btn.green{background:var(--green);box-shadow:0 6px 0 #146d41}
.btn.blue{background:var(--blue);box-shadow:0 6px 0 #1b56a8}
.btn.yellow{background:var(--yellow);color:#4a3600;box-shadow:0 6px 0 #c9951a}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* Home */
.hero{display:grid;grid-template-columns:1.2fr 1fr;gap:20px;align-items:center;padding:28px}
.hero h1{font-size:2.3rem;color:var(--ink)}
.hero h1 span{color:var(--red)}
.hero p{color:var(--muted);font-size:1.05rem}
.hero .art{font-size:6rem;text-align:center;line-height:1;filter:drop-shadow(0 10px 15px rgba(0,0,0,.15))}
@media(max-width:700px){.hero{grid-template-columns:1fr}.hero h1{font-size:1.7rem}.hero .art{font-size:4rem}}
.unitcard{position:relative;overflow:hidden;border-radius:var(--radius);padding:22px;color:#fff;cursor:pointer;min-height:170px;display:flex;flex-direction:column;justify-content:flex-end;box-shadow:var(--shadow);transition:.2s}
.unitcard:hover{transform:translateY(-4px) scale(1.01)}
.unitcard .big{position:absolute;top:10px;left:14px;font-size:4.5rem;opacity:.9;filter:drop-shadow(0 6px 8px rgba(0,0,0,.25))}
.unitcard h3{font-size:1.4rem}
.unitcard small{opacity:.9}
.unitcard .prog{margin-top:8px;height:8px;background:rgba(255,255,255,.35);border-radius:9px;overflow:hidden}
.unitcard .prog i{display:block;height:100%;background:#fff;border-radius:9px}
.introcard{background:#fff;border-radius:var(--radius);padding:18px;text-align:center;cursor:pointer;box-shadow:var(--shadow);transition:.2s}
.introcard:hover{transform:translateY(-3px)}
.introcard .ic{font-size:2.6rem;overflow:hidden}
.introcard h4{font-size:1.05rem;margin-top:6px}

/* Lesson list */
.lessonrow{display:flex;align-items:center;gap:14px;background:#fff;border-radius:18px;padding:14px 16px;cursor:pointer;box-shadow:var(--shadow);transition:.2s;margin-top:12px}
.lessonrow:hover{transform:translateX(-4px)}
.lessonrow .ic{width:58px;height:58px;border-radius:16px;display:grid;place-items:center;font-size:1.8rem;background:color-mix(in srgb,var(--accent) 15%,#fff)}
.lessonrow h4{font-size:1.15rem}
.lessonrow small{color:var(--muted)}
.stars{color:#ffb300;font-size:1rem;letter-spacing:2px}

/* Tabs */
.tabs{display:flex;gap:6px;background:rgba(255,255,255,.8);padding:6px;border-radius:18px;margin-top:14px;overflow-x:auto;box-shadow:var(--shadow)}
.tab{flex:1;min-width:95px;padding:10px 8px;border-radius:14px;font-weight:800;font-family:var(--font-head);background:transparent;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.9rem;transition:.2s}
.tab .e{font-size:1.4rem}
.tab.active{background:var(--accent);color:#fff;box-shadow:0 6px 14px color-mix(in srgb,var(--accent) 40%,transparent)}
.tab .done{font-size:.7rem}

/* Slides */
.slide{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);padding:26px;min-height:420px;display:grid;grid-template-columns:1fr 1fr;gap:22px;align-items:center;margin-top:14px;position:relative;overflow:hidden}
.slide.one{grid-template-columns:1fr}
@media(max-width:760px){.slide{grid-template-columns:1fr;padding:18px}}
.slide .txt h2{font-size:1.7rem;color:var(--accent);margin-bottom:10px}
.slide .txt p{font-size:1.25rem;margin:6px 0;line-height:1.9}
.slide .txt .lead{font-size:1.05rem;color:var(--muted)}
.slide .vis{display:grid;place-items:center;min-height:240px}
.slide .vis>*{width:100%}
.scene{margin:0 auto}
.slide .kicker{position:absolute;top:14px;left:16px;font-size:.8rem;color:var(--muted);background:#f1f5fb;padding:3px 10px;border-radius:999px}
.scene{position:relative;width:100%;max-width:420px;aspect-ratio:1/1;border-radius:28px;background:linear-gradient(180deg,#bfe4ff,#e9f7ff 60%,#c9f2cf);overflow:hidden;box-shadow:inset 0 0 0 6px #fff,var(--shadow)}
.scene .sun{position:absolute;top:14px;right:18px;width:60px;height:60px;border-radius:50%;background:radial-gradient(#fff2a8,#ffc53d);box-shadow:0 0 30px #ffd76b;animation:spin 20s linear infinite}
.scene .cloud{position:absolute;background:#fff;border-radius:40px;opacity:.9;animation:drift 12s ease-in-out infinite alternate}
.scene .cloud::before{content:"";position:absolute;width:60%;height:120%;background:#fff;border-radius:50%;top:-50%;left:20%}
.scene .ground{position:absolute;bottom:0;left:0;right:0;height:22%;background:linear-gradient(#7ed37a,#4caf50)}
.scene .big{position:absolute;font-size:6.5rem;line-height:1;filter:drop-shadow(0 8px 10px rgba(0,0,0,.2))}
.scene .med{position:absolute;font-size:3.4rem;line-height:1;filter:drop-shadow(0 4px 6px rgba(0,0,0,.2))}
.scene .sm{position:absolute;font-size:2rem;line-height:1}
.scene .label{position:absolute;bottom:8px;left:0;right:0;text-align:center;font-family:var(--font-head);font-weight:800;color:#fff;text-shadow:0 2px 6px rgba(0,0,0,.4);font-size:1.15rem}
@keyframes drift{from{transform:translateX(-10px)}to{transform:translateX(20px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes wiggle{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
@keyframes popin{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(255,197,61,.6)}50%{box-shadow:0 0 0 14px rgba(255,197,61,0)}}
.bob{animation:bob 2.5s ease-in-out infinite}
.wig{animation:wiggle 1.6s ease-in-out infinite}
.popin{animation:popin .4s cubic-bezier(.2,1.4,.5,1) both}
.shake{animation:shake .4s}
.slidenav{display:flex;align-items:center;gap:10px;margin-top:12px}
.dots{display:flex;gap:6px;flex:1;justify-content:center;flex-wrap:wrap}
.dots i{width:10px;height:10px;border-radius:50%;background:#d5deee;transition:.2s;cursor:pointer}
.dots i.on{background:var(--accent);transform:scale(1.4)}
.emoji-row{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.emoji-tile{background:#f7f9fd;border-radius:18px;padding:12px 10px;text-align:center;min-width:110px;animation:popin .4s both}
.emoji-tile .e{font-size:2.6rem;line-height:1.2}
.emoji-tile b{display:block;font-size:.95rem}
.letters{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.letter{width:86px;height:86px;border-radius:24px;display:grid;place-items:center;font-family:var(--font-head);font-size:2.6rem;font-weight:800;color:#fff;box-shadow:0 8px 0 rgba(0,0,0,.15);animation:popin .5s both}

/* Activities */
.act{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);padding:20px;margin-top:14px}
.act h3{font-size:1.3rem;color:var(--accent);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.act h3 .num{width:36px;height:36px;border-radius:12px;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:1rem}
.act .inst{background:color-mix(in srgb,var(--accent) 8%,#fff);border-right:5px solid var(--accent);padding:10px 14px;border-radius:12px;margin:10px 0;font-weight:700}
.opts{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));margin-top:10px}
.opt{background:#f7f9fd;border:3px solid transparent;border-radius:18px;padding:14px;text-align:center;cursor:pointer;font-weight:700;transition:.15s;font-size:1.05rem}
.opt .e{font-size:2.4rem;display:block;line-height:1.2;margin-bottom:4px}
.opt:hover{border-color:#cfd9ea;transform:translateY(-2px)}
.opt.sel{border-color:var(--blue);background:#eaf2ff}
.opt.ok{border-color:var(--green);background:#e7f8ef}
.opt.bad{border-color:var(--red);background:#fdeaed;animation:shake .4s}
.opt.dim{opacity:.45;pointer-events:none}
.chip{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:14px;background:#fff;border:2px solid #d8e0ee;font-weight:700;cursor:pointer;transition:.15s;user-select:none;font-size:1rem}
.chip:hover{border-color:var(--accent);transform:translateY(-2px)}
.chip.sel{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,#fff)}
.chip.used{opacity:.35;pointer-events:none}
.chip.ok{border-color:var(--green);background:#e7f8ef}
.chip.bad{border-color:var(--red);background:#fdeaed;animation:shake .4s}
.bank{display:flex;flex-wrap:wrap;gap:8px;padding:12px;background:#f7f9fd;border-radius:16px;margin:10px 0;min-height:56px;justify-content:center}
.buckets{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.bucket{border:3px dashed #cfd9ea;border-radius:18px;padding:12px;min-height:120px;transition:.2s}
.bucket.target{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 6%,#fff)}
.bucket h4{text-align:center;font-size:1.05rem;margin-bottom:8px;display:flex;align-items:center;justify-content:center;gap:6px}
.bucket .items{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.slot{border:2px dashed #cfd9ea;border-radius:12px;min-height:44px;padding:6px 10px;display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--muted);cursor:pointer;transition:.15s;min-width:100px;background:#fff}
.slot.target{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 8%,#fff)}
.slot.filled{border-style:solid;color:var(--ink);border-color:#b7c3d8}
.slot.ok{border-color:var(--green);background:#e7f8ef;color:#146d41}
.slot.bad{border-color:var(--red);background:#fdeaed;color:var(--red);animation:shake .4s}
.feedback{margin-top:12px;padding:12px 16px;border-radius:14px;font-weight:800;display:none;animation:pop .3s}
.feedback.ok{display:block;background:#e7f8ef;color:#146d41}
.feedback.bad{display:block;background:#fdeaed;color:#9f1a2b}
.feedback.info{display:block;background:#eaf2ff;color:#1b56a8}
textarea.ta,input.ti{width:100%;font-family:inherit;font-size:1.05rem;padding:10px 12px;border:2px solid #d8e0ee;border-radius:14px;background:#fbfcfe;resize:vertical;min-height:70px;transition:.2s}
input.ti{min-height:0}
textarea.ta:focus,input.ti:focus{outline:none;border-color:var(--accent);background:#fff}
.ideas{background:#fff8e1;border-radius:14px;padding:10px 14px;margin-top:8px;border-right:5px solid var(--yellow)}
.ideas li{margin:2px 0}
.progressbar{height:12px;background:#e6ecf5;border-radius:10px;overflow:hidden;margin:8px 0}
.progressbar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),color-mix(in srgb,var(--accent) 60%,#fff));border-radius:10px;transition:.4s}
.score{font-family:var(--font-head);font-weight:800;font-size:1.2rem;color:var(--accent)}
.badge{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--yellow);color:#4a3600;font-weight:900;font-size:.85rem}
.timer{font-family:var(--font-head);font-size:1.5rem;font-weight:800;color:var(--red);background:#fdeaed;padding:4px 14px;border-radius:12px;min-width:80px;text-align:center}
.tfcards{display:flex;gap:16px;justify-content:center;margin-top:12px}
.tfcard{flex:1;max-width:220px;height:110px;border-radius:22px;display:grid;place-items:center;color:#fff;font-family:var(--font-head);font-size:1.4rem;font-weight:800;cursor:pointer;box-shadow:0 8px 0 rgba(0,0,0,.18);transition:.15s}
.tfcard:active{transform:translateY(5px);box-shadow:0 3px 0 rgba(0,0,0,.18)}
.tfcard.g{background:var(--green)}.tfcard.r{background:var(--red)}
.statement{font-size:1.35rem;font-weight:800;text-align:center;padding:22px;background:#f7f9fd;border-radius:18px;min-height:110px;display:grid;place-items:center}
.seq{display:flex;flex-direction:column;gap:8px}
.seqitem{display:flex;align-items:center;gap:10px;background:#f7f9fd;border:2px solid #d8e0ee;border-radius:14px;padding:10px 12px;font-weight:700;cursor:pointer;transition:.15s}
.seqitem .n{width:32px;height:32px;border-radius:10px;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:900;flex-shrink:0}
.seqitem .e{font-size:1.8rem}
.seqitem.sel{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,#fff)}
.seqitem.ok{border-color:var(--green);background:#e7f8ef}
.seqitem.bad{border-color:var(--red);background:#fdeaed}
.seqitem .mv{margin-right:auto;display:flex;gap:4px}
.seqitem .mv button{width:32px;height:32px;border-radius:9px;background:#e6ecf5;font-size:1rem}

/* Memory */
.memgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;max-width:520px;margin:12px auto}
.memcard{aspect-ratio:1;perspective:600px;cursor:pointer}
.memcard .in{position:relative;width:100%;height:100%;transition:.5s;transform-style:preserve-3d}
.memcard.flip .in{transform:rotateY(180deg)}
.memcard .f,.memcard .b{position:absolute;inset:0;border-radius:16px;display:grid;place-items:center;backface-visibility:hidden;font-weight:800;text-align:center;padding:6px;font-size:.95rem}
.memcard .f{background:var(--accent);color:#fff;font-size:2rem}
.memcard .b{background:#fff;border:3px solid var(--accent);transform:rotateY(180deg)}
.memcard .b .e{font-size:2rem;line-height:1.1}
.memcard.done .b{background:#e7f8ef;border-color:var(--green)}

/* Path / road game */
.road{position:relative;width:100%;max-width:520px;margin:10px auto;aspect-ratio:1/1;border-radius:24px;background:linear-gradient(#dff3ff,#eafbe7);overflow:hidden;box-shadow:var(--shadow)}
.road svg{width:100%;height:100%}
.road .walker{position:absolute;font-size:2.6rem;transition:all .9s cubic-bezier(.4,0,.2,1);transform:translate(-50%,-50%);filter:drop-shadow(0 4px 6px rgba(0,0,0,.25))}
.sign{position:absolute;padding:6px 10px;border-radius:12px;color:#fff;font-weight:800;font-family:var(--font-head);font-size:.95rem;box-shadow:0 4px 8px rgba(0,0,0,.15)}
.situ{background:#fff8e1;border:3px solid var(--yellow);border-radius:18px;padding:16px;font-size:1.2rem;font-weight:800;text-align:center;min-height:90px;display:grid;place-items:center}

/* Body outline */
.bodywrap{position:relative;width:260px;margin:10px auto}
.bodywrap svg{width:100%;height:auto}
.zone{fill:transparent;stroke:transparent;cursor:pointer;transition:.2s}
.zone:hover{fill:rgba(44,123,229,.15)}
.zone.marked{fill:rgba(215,38,61,.25);stroke:var(--red);stroke-width:5;stroke-dasharray:8 6}
.zone.ok{fill:rgba(31,164,99,.3);stroke:var(--green);stroke-width:5}

/* Crossword */
.cw{display:inline-grid;gap:3px;direction:rtl;margin:10px auto;background:#dbe3ef;padding:4px;border-radius:10px}
.cw .cell{width:34px;height:34px;background:#fff;border-radius:6px;display:grid;place-items:center;font-weight:900;font-size:1.15rem;cursor:pointer;position:relative;transition:.15s}
.cw .cell.empty{background:transparent;pointer-events:none}
.cw .cell.pink{background:#ffd6e7}.cw .cell.blue{background:#cfe3ff}.cw .cell.green{background:#cdf3dc}.cw .cell.yellow{background:#fff2b3}.cw .cell.orange{background:#ffd8b8}
.cw .cell.cur{outline:3px solid var(--blue)}
.cw .cell.ok{color:#146d41}
.cw .cell .n{position:absolute;top:0;right:2px;font-size:.55rem;color:var(--muted);font-weight:700}
.kb{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;margin-top:10px;direction:rtl}
.kb button{width:38px;height:40px;border-radius:9px;background:#f1f5fb;font-size:1.1rem;font-weight:800}
.kb button:hover{background:#dbe6f7}
.kb button.wide{width:auto;padding:0 12px}

/* Snakes and ladders */
.board{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;max-width:520px;margin:10px auto;background:#dbe3ef;padding:6px;border-radius:16px;position:relative}
.sq{aspect-ratio:1;background:#fff;border-radius:8px;display:grid;place-items:center;position:relative;font-weight:800;font-size:.8rem;color:var(--muted)}
.sq.ladder{background:#e7f8ef}.sq.snake{background:#fdeaed}.sq.q{background:#fff2b3}.sq.end{background:#ffe0b3}
.sq .ico{font-size:1.3rem;position:absolute;top:2px;left:4px}
.sq .tok{position:absolute;bottom:2px;font-size:1.3rem;animation:bob 1.4s infinite}
.sq .tok.p1{right:2px}.sq .tok.p2{left:2px}
.dice{width:80px;height:80px;border-radius:18px;background:#fff;border:4px solid var(--ink);display:grid;place-items:center;font-size:2.6rem;font-weight:900;margin:0 auto;box-shadow:0 8px 0 #cfd9ea;cursor:pointer;user-select:none}
.dice.roll{animation:wiggle .12s 6}

/* Balance scale */
.scale{position:relative;height:260px;max-width:520px;margin:10px auto}
.scale .beam{position:absolute;top:60px;left:50%;width:78%;height:12px;background:#8d6e63;border-radius:8px;transform:translateX(-50%) rotate(0deg);transition:.6s;transform-origin:center}
.scale .post{position:absolute;top:66px;left:50%;width:14px;height:150px;background:#6d4c41;transform:translateX(-50%);border-radius:6px}
.scale .base{position:absolute;top:210px;left:50%;width:160px;height:18px;background:#5d4037;transform:translateX(-50%);border-radius:10px}
.scale .pan{position:absolute;top:110px;width:150px;height:70px;border-radius:0 0 60px 60px;background:#ffd8b8;border:4px solid #ff8c42;transition:.6s;display:flex;flex-wrap:wrap;gap:2px;justify-content:center;align-content:flex-start;padding:4px;font-size:1.2rem;overflow:hidden}
.scale .pan.l{left:2%}.scale .pan.r{right:2%}
.scale .pan::before{content:"";position:absolute;top:-52px;left:50%;width:3px;height:52px;background:#8d6e63;transform:translateX(-50%)}
.scale .pan b{position:absolute;bottom:-28px;left:0;right:0;text-align:center;font-family:var(--font-head);color:var(--ink)}

/* Poster designer */
.poster{width:100%;max-width:420px;aspect-ratio:3/4;margin:10px auto;border-radius:18px;box-shadow:var(--shadow);position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:20px;text-align:center}
.poster .pt{font-family:var(--font-head);font-size:1.7rem;font-weight:800;color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.3)}
.poster .pi{font-size:4.5rem;line-height:1}
.poster .ps{background:rgba(255,255,255,.9);border-radius:14px;padding:10px 14px;font-weight:800;font-size:1.05rem}
.swatches{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.sw{width:40px;height:40px;border-radius:12px;cursor:pointer;border:3px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.sw.sel{outline:3px solid var(--ink)}

/* Foldable */
.fold{display:grid;grid-template-columns:1fr 1fr 1fr;grid-template-rows:1fr 1fr 1fr;gap:6px;max-width:560px;margin:10px auto}
.fold .wing{background:#fff;border:3px solid var(--accent);border-radius:16px;padding:10px;min-height:120px}
.fold .wing h5{margin:0 0 6px;font-family:var(--font-head);text-align:center;font-size:1rem;color:var(--accent)}
.fold .wing .e{text-align:center;font-size:2rem}
.fold .wing ul{margin:4px 0 0;padding-right:16px;font-size:.85rem}
.fold .mid{background:linear-gradient(135deg,#fff2b3,#ffd8b8);border-radius:16px;display:grid;place-items:center;text-align:center;font-family:var(--font-head);font-weight:800;font-size:1.05rem}
.fold .empty{background:transparent}

/* Confetti */
.confetti{position:fixed;inset:0;pointer-events:none;z-index:999;overflow:hidden}
.confetti i{position:absolute;top:-20px;width:10px;height:16px;border-radius:3px;animation:fall 2.5s linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg);opacity:0}}

/* Modal / certificate */
.modal{position:fixed;inset:0;background:rgba(20,30,50,.55);display:grid;place-items:center;z-index:200;padding:16px;animation:pop .25s}
.modal .box{background:#fff;border-radius:26px;padding:26px;max-width:560px;width:100%;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.3);max-height:92vh;overflow:auto}
.cert{border:6px double var(--accent);border-radius:20px;padding:24px;background:linear-gradient(135deg,#fffdf5,#f3fbff)}
.cert h2{color:var(--accent);font-size:1.8rem}
.cert .name{font-family:var(--font-head);font-size:1.6rem;font-weight:800;border-bottom:3px dotted var(--accent);display:inline-block;padding:0 20px;min-width:220px;margin:8px 0}
.cert .seal{font-size:3.5rem}

/* Settings */
.setting{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid #eef2f8}
.switch{width:56px;height:30px;border-radius:30px;background:#cfd9ea;position:relative;cursor:pointer;transition:.2s}
.switch::after{content:"";position:absolute;top:3px;right:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s}
.switch.on{background:var(--green)}
.switch.on::after{right:29px}

/* Circles of citizenship */
.circles{position:relative;width:320px;height:320px;margin:10px auto}
.circles div{position:absolute;border-radius:50%;display:flex;align-items:flex-start;justify-content:center;padding-top:8px;font-family:var(--font-head);font-weight:800;cursor:pointer;transition:.25s;border:3px solid #fff}
.circles div:hover{filter:brightness(1.05)}
.circles div.on{box-shadow:0 0 0 6px var(--yellow)}

/* Map */
.mapwrap{position:relative;max-width:380px;margin:10px auto;background:linear-gradient(#dff3ff,#bfe4ff);border-radius:24px;padding:12px;box-shadow:var(--shadow)}
.mapwrap svg{width:100%;height:auto}
.mapwrap path{cursor:pointer;stroke:#7a5548;stroke-width:3;transition:fill .3s}
.mapwrap .clip path{stroke:none}

/* Speech bubble */
.bubble{position:relative;background:#fff;border:3px solid var(--accent);border-radius:20px;padding:12px 16px;font-weight:700;font-size:1.05rem;box-shadow:var(--shadow)}
.bubble::after{content:"";position:absolute;bottom:-14px;right:30px;border:8px solid transparent;border-top-color:var(--accent);border-bottom:0}
.charr{display:flex;align-items:flex-end;gap:12px;margin:10px 0}
.charr .face{font-size:3.5rem;line-height:1;animation:bob 3s infinite}

/* Snowball */
.snowfield{position:relative;height:260px;background:linear-gradient(#e8f4ff,#fff);border-radius:22px;overflow:hidden;margin:10px 0}
.snowball{position:absolute;bottom:20px;right:20px;width:70px;height:70px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff,#dbe8f5);box-shadow:inset -8px -8px 20px rgba(0,0,0,.08),0 8px 14px rgba(0,0,0,.12);transition:all .6s cubic-bezier(.3,1.3,.5,1);display:grid;place-items:center;font-weight:900;color:var(--blue);font-family:var(--font-head)}

/* Race track */
.track{position:relative;height:120px;border-radius:60px;background:repeating-linear-gradient(90deg,#f6d9b0 0 30px,#f0c894 30px 60px);border:5px solid #c98e5a;margin:12px 0;overflow:hidden}
.track .lane{position:absolute;left:0;right:0;height:50%;display:flex;align-items:center}
.track .lane:nth-child(2){top:50%;border-top:3px dashed #fff}
.track .runner{position:absolute;font-size:2.4rem;transition:right .5s ease;transform:scaleX(-1)}
.track .finish{position:absolute;left:8px;top:0;bottom:0;width:20px;background:repeating-conic-gradient(#000 0 25%,#fff 0 50%) 0 0/10px 10px}

/* Room cleanup */
.room{position:relative;height:300px;border-radius:22px;background:linear-gradient(#fff5e6 0 65%,#d7b892 65%);overflow:hidden;margin:10px 0;border:4px solid #e8d5bd}
.room .obj{position:absolute;font-size:2.2rem;cursor:pointer;transition:.4s;filter:drop-shadow(0 4px 4px rgba(0,0,0,.2))}
.room .obj:hover{transform:scale(1.15)}
.room .spot{position:absolute;font-size:2.6rem;opacity:.9}
.room .obj.placed{pointer-events:none;transform:scale(.8);opacity:.8}

/* Keys & doors */
.doors{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin:10px 0}
.door{background:linear-gradient(#a1887f,#6d4c41);border-radius:14px 14px 4px 4px;padding:14px 8px;text-align:center;color:#fff;min-height:150px;position:relative;cursor:pointer;transition:.3s;border:4px solid #4e342e}
.door .knob{width:12px;height:12px;border-radius:50%;background:#ffd54f;position:absolute;left:10px;top:50%}
.door .lock{font-size:2rem}
.door.open{background:linear-gradient(#fff9c4,#fff);color:var(--ink);border-color:var(--green)}
.door.open .lock{display:none}
.door small{display:block;font-size:.8rem;opacity:.95;line-height:1.4;margin-top:6px}
.door.target{outline:4px solid var(--yellow);animation:glow 1s infinite}

/* Reaction game */
.arena{position:relative;height:260px;border-radius:22px;background:linear-gradient(#fdf6ff,#fff);border:4px solid #e9ddf5;overflow:hidden;margin:10px 0}
.arena .sit{position:absolute;left:50%;top:40px;transform:translateX(-50%);background:#fff;border:3px solid var(--purple);border-radius:18px;padding:12px 16px;font-weight:800;font-size:1.1rem;text-align:center;width:90%;box-shadow:var(--shadow);animation:popin .3s}
.arena .hp{position:absolute;top:8px;right:12px;font-size:1.2rem}

/* Garden */
.garden{position:relative;height:280px;border-radius:24px;background:linear-gradient(#cfeeff 0 60%,#8bd17c 60%);overflow:hidden;margin:10px 0}
.garden .brain{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);font-size:5rem;filter:drop-shadow(0 6px 8px rgba(0,0,0,.2))}
.garden .fl{position:absolute;font-size:2.2rem;animation:popin .6s cubic-bezier(.2,1.5,.5,1) both;transform-origin:bottom}

/* Simon */
.simon{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:240px;margin:10px auto}
.simon div{aspect-ratio:1;border-radius:20px;cursor:pointer;opacity:.55;transition:.12s;display:grid;place-items:center;font-size:2rem}
.simon div.lit{opacity:1;transform:scale(1.05);box-shadow:0 0 25px rgba(0,0,0,.25)}

/* Print */
.printbox{background:#fff;border:2px dashed #cfd9ea;border-radius:16px;padding:16px;margin-top:10px}
@media print{body{background:#fff}#app>*:not(.printarea){display:none!important}.printarea{display:block!important}.topbar{display:none!important}.noprint{display:none!important}}
.footer{color:var(--muted);font-size:.8rem;text-align:center;margin-top:30px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 20px;border-radius:14px;font-weight:700;z-index:300;animation:pop .3s}
.bigemoji{font-size:5rem;line-height:1;text-align:center}
.help{font-size:.9rem;color:var(--muted)}
kbd{background:#eef3fb;padding:2px 8px;border-radius:6px;font-family:inherit;font-weight:700}
</style>

<body>
<div id="app"></div>
<div class="confetti" id="confetti"></div>
<script>
/* =========================================================
   المحرك العام: الصوت، النطق، الحالة، التنقل، الأدوات
   ========================================================= */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const h = (tag, attrs = {}, ...kids) => {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'class') el.className = v;
    else if (k === 'html') el.innerHTML = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k === 'style') el.style.cssText = v;
    else el.setAttribute(k, v);
  }
  for (const k of kids.flat()) if (k != null) el.append(k.nodeType ? k : document.createTextNode(k));
  return el;
};
const shuffle = a => { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1));[a[i], a[j]] = [a[j], a[i]]; } return a; };
const rnd = a => a[Math.floor(Math.random() * a.length)];
const AR = n => String(n).replace(/\d/g, d => '٠١٢٣٤٥٦٧٨٩'[d]);

/* ---------- الإعدادات والتقدم ---------- */
const SKEY = 'ic3_settings', PKEY = 'ic3_progress', WKEY = 'ic3_written';
const settings = Object.assign({ sfx: true, voice: true, autoRead: false, student: '' }, JSON.parse(localStorage.getItem(SKEY) || '{}'));
const saveSettings = () => localStorage.setItem(SKEY, JSON.stringify(settings));
const progress = JSON.parse(localStorage.getItem(PKEY) || '{}');
const saveProgress = () => localStorage.setItem(PKEY, JSON.stringify(progress));
const written = JSON.parse(localStorage.getItem(WKEY) || '{}');
const saveWritten = () => localStorage.setItem(WKEY, JSON.stringify(written));
function markDone(key, stars = 1) {
  progress[key] = Math.max(progress[key] || 0, stars); saveProgress();
}

/* ---------- المؤثرات الصوتية (Web Audio) ---------- */
let actx = null;
function audio() { if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { } } if (actx && actx.state === 'suspended') actx.resume(); return actx; }
function tone(freq, dur = .15, type = 'sine', vol = .25, when = 0, slide = null) {
  const c = audio(); if (!c || !settings.sfx) return;
  const o = c.createOscillator(), g = c.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, c.currentTime + when);
  if (slide) o.frequency.exponentialRampToValueAtTime(slide, c.currentTime + when + dur);
  g.gain.setValueAtTime(0.0001, c.currentTime + when);
  g.gain.exponentialRampToValueAtTime(vol, c.currentTime + when + .01);
  g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + when + dur);
  o.connect(g); g.connect(c.destination); o.start(c.currentTime + when); o.stop(c.currentTime + when + dur + .05);
}
function noise(dur = .2, vol = .15, when = 0) {
  const c = audio(); if (!c || !settings.sfx) return;
  const b = c.createBuffer(1, c.sampleRate * dur, c.sampleRate), d = b.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length);
  const s = c.createBufferSource(), g = c.createGain(); s.buffer = b; g.gain.value = vol; s.connect(g); g.connect(c.destination); s.start(c.currentTime + when);
}
const sfx = {
  click() { tone(600, .06, 'triangle', .12); },
  pop() { tone(400, .08, 'sine', .2, 0, 900); },
  ok() { tone(523, .12, 'triangle', .2); tone(659, .12, 'triangle', .2, .1); tone(784, .2, 'triangle', .2, .2); },
  bad() { tone(220, .25, 'sawtooth', .12, 0, 150); },
  win() {[523, 659, 784, 1046].forEach((f, i) => tone(f, .18, 'triangle', .22, i * .12)); tone(1318, .5, 'triangle', .22, .5); },
  star() { tone(1200, .1, 'sine', .15); tone(1600, .15, 'sine', .15, .08); },
  flip() { tone(300, .08, 'square', .06, 0, 500); },
  dice() { for (let i = 0; i < 6; i++) tone(200 + Math.random() * 400, .05, 'square', .06, i * .07); },
  step() { tone(350, .05, 'square', .08); },
  whoosh() { noise(.25, .12); },
  bell() { tone(880, .6, 'sine', .2); tone(1760, .4, 'sine', .08); },
  water() { for (let i = 0; i < 4; i++) tone(500 + i * 120, .08, 'sine', .1, i * .06, 900 + i * 100); },
  grow() { tone(300, .35, 'sine', .15, 0, 900); },
  tick() { tone(1000, .03, 'square', .05); },
  lose() { tone(400, .25, 'sawtooth', .12, 0, 120); tone(300, .35, 'sawtooth', .12, .2, 90); },
  hiss() { noise(.5, .2); tone(900, .4, 'sawtooth', .04, 0, 200); },
  cheer() { for (let i = 0; i < 8; i++) tone(600 + Math.random() * 800, .12, 'triangle', .1, i * .06); },
};

/* ---------- النطق (Text to speech) ---------- */
let voices = [];
function loadVoices() { voices = speechSynthesis.getVoices(); }
if ('speechSynthesis' in window) { loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }
function pickVoice(lang) {
  const list = voices.filter(v => v.lang && v.lang.toLowerCase().startsWith(lang));
  return list.find(v => /natural|premium|enhanced|google/i.test(v.name)) || list[0] || null;
}
function speak(text, lang = 'ar') {
  if (!settings.voice || !('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  const clean = String(text).replace(/<[^>]+>/g, ' ').replace(/[‏‎]/g, '');
  const u = new SpeechSynthesisUtterance(clean);
  const v = pickVoice(lang); if (v) u.voice = v;
  u.lang = lang === 'ar' ? 'ar-SA' : 'en-US'; u.rate = lang === 'ar' ? .9 : .85; u.pitch = 1.05;
  speechSynthesis.speak(u);
}
function stopSpeak() { if ('speechSynthesis' in window) speechSynthesis.cancel(); }
const speakBtn = (text, cls = 'iconbtn') => h('button', { class: cls, title: 'استمع', onclick: e => { e.stopPropagation(); sfx.click(); speak(text); } }, '🔊');

/* ---------- قصاصات الاحتفال ---------- */
function confetti(n = 80) {
  const box = $('#confetti'); const colors = ['#d7263d', '#1fa463', '#2c7be5', '#ffc53d', '#e84a8a', '#7a5af8'];
  for (let i = 0; i < n; i++) {
    const p = h('i', { style: `left:${Math.random() * 100}%;background:${rnd(colors)};animation-delay:${Math.random() * .8}s;animation-duration:${2 + Math.random() * 1.5}s` });
    box.append(p); setTimeout(() => p.remove(), 4000);
  }
}
function toast(msg, ms = 1800) { const t = h('div', { class: 'toast' }, msg); document.body.append(t); setTimeout(() => t.remove(), ms); }
function celebrate(title, msg, extra) {
  sfx.win(); confetti();
  const m = h('div', { class: 'modal', onclick: e => { if (e.target === m) m.remove(); } },
    h('div', { class: 'box' }, h('div', { class: 'bigemoji popin' }, '🏆'), h('h2', { style: 'color:var(--accent);margin-top:8px' }, title), h('p', {}, msg), extra || null,
      h('button', { class: 'btn', style: 'margin-top:10px', onclick: () => m.remove() }, 'رائع! 👏')));
  document.body.append(m);
}
function modal(content) {
  const m = h('div', { class: 'modal', onclick: e => { if (e.target === m) m.remove(); } }, h('div', { class: 'box' }, content, h('button', { class: 'btn ghost', style: 'margin-top:14px', onclick: () => m.remove() }, 'إغلاق ✖')));
  document.body.append(m); return m;
}
function feedbackEl() { return h('div', { class: 'feedback' }); }
function showFb(el, type, msg) { el.className = 'feedback ' + type; el.innerHTML = msg; }

/* ---------- عناصر بصرية جاهزة ---------- */
function scene(opts) {
  // opts: {big, med:[{e,x,y}], sm:[], label, bg}
  const s = h('div', { class: 'scene', style: opts.bg ? `background:${opts.bg}` : '' });
  if (opts.sun !== false) s.append(h('div', { class: 'sun' }));
  s.append(h('div', { class: 'cloud', style: 'top:30px;left:20px;width:80px;height:26px' }), h('div', { class: 'cloud', style: 'top:70px;left:150px;width:60px;height:20px;animation-delay:-5s' }));
  if (opts.ground !== false) s.append(h('div', { class: 'ground' }));
  if (opts.big) s.append(h('div', { class: 'big bob', style: `bottom:${opts.bigY || '18%'};left:50%;transform:translateX(-50%)` }, opts.big));
  (opts.med || []).forEach((m, i) => s.append(h('div', { class: 'med popin', style: `left:${m.x};top:${m.y};animation-delay:${i * .15}s` }, m.e)));
  (opts.sm || []).forEach((m, i) => s.append(h('div', { class: 'sm popin', style: `left:${m.x};top:${m.y};animation-delay:${i * .1 + .3}s` }, m.e)));
  if (opts.label) s.append(h('div', { class: 'label' }, opts.label));
  return s;
}
function tiles(items) { return h('div', { class: 'emoji-row' }, items.map((t, i) => h('div', { class: 'emoji-tile', style: `animation-delay:${i * .12}s` }, h('div', { class: 'e' }, t.e), h('b', {}, t.t)))); }
function letterRow(letters, colors) { return h('div', { class: 'letters' }, letters.map((l, i) => h('div', { class: 'letter', style: `background:${colors[i % colors.length]};animation-delay:${i * .2}s` }, l))); }
const charFace = { nasser: '👦🏽', shamsa: '🧕🏽', ahmad: '👶🏽', father: '👨🏽', mother: '👩🏽', grandpa: '👴🏽', grandma: '👵🏽', mazen: '🏃🏽‍♂️', teacher: '👩🏽‍🏫' };
function bubble(who, text) { return h('div', { class: 'charr' }, h('div', { class: 'face' }, charFace[who] || who), h('div', { class: 'bubble' }, text, ' ', speakBtn(text, 'btn sm ghost'))); }

/* ---------- صندوق الكتابة المحفوظ ---------- */
function writeBox(key, label, ideas, opts = {}) {
  const ta = h(opts.single ? 'input' : 'textarea', { class: opts.single ? 'ti' : 'ta', placeholder: opts.ph || 'أكتب هنا…', value: written[key] || '' });
  if (!opts.single) ta.value = written[key] || '';
  ta.addEventListener('input', () => { written[key] = ta.value; saveWritten(); });
  const wrap = h('div', { style: 'margin-top:10px' }, label ? h('div', { style: 'font-weight:800;margin-bottom:4px' }, label) : null, ta);
  if (ideas && ideas.length) {
    const box = h('div', { class: 'ideas hidden' }, h('b', {}, '💡 أفكار مقترحة:'), h('ul', {}, ideas.map(i => h('li', {}, i))));
    wrap.append(h('button', { class: 'btn sm ghost', style: 'margin-top:6px', onclick: () => { sfx.pop(); box.classList.toggle('hidden'); } }, '💡 أفكار مساعدة'), box);
  }
  return wrap;
}

/* =========================================================
   أنواع الأنشطة العامة
   ========================================================= */
const ACT = {};
/* اختيار من متعدد (سؤال واحد أو عدة أسئلة) */
ACT.quiz = (a, box, done) => {
  const qs = a.questions; let i = 0, score = 0;
  const bar = h('div', { class: 'progressbar' }, h('i', { style: 'width:0%' }));
  const body = h('div'); box.append(bar, body);
  function show() {
