<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ألعاب لغتي — الصف الرابع</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --sky:#8ED8F8; --sand:#FFE7B3; --ink:#2B2140; --card:#FFFFFF; --soft:#6B5F80; --chip:#F4F0FA;
  --red:#D6001C; --green:#0A8F3C; --gold:#FFC83D; --ok:#18A558; --bad:#E5383B;
  --sc:#27AE60;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --sky:#1C2B4F; --sand:#3A2D4E; --ink:#F4EFFF; --card:#261E38; --soft:#B9ADCF; --chip:#322848; }
}
:root[data-theme="dark"]{ --sky:#1C2B4F; --sand:#3A2D4E; --ink:#F4EFFF; --card:#261E38; --soft:#B9ADCF; --chip:#322848; }
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font-family:"Baloo Bhaijaan 2",Tahoma,sans-serif;color:var(--ink);background:linear-gradient(180deg,var(--sky) 0%,var(--sand) 75%) fixed;min-height:100vh;line-height:1.5;overflow-x:hidden}
button{font-family:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding:12px 14px 50px;position:relative;z-index:1}
.hills{position:fixed;left:0;right:0;bottom:0;height:160px;z-index:0;pointer-events:none;opacity:.55}
h1,h2,h3{margin:0;line-height:1.2;font-weight:800}

/* home hero */
.hero{position:relative;height:190px;margin:0 -14px 6px;overflow:hidden}
.hero svg{position:absolute;inset:0;width:100%;height:100%}
.eagle{animation:glide 9s ease-in-out infinite}
@keyframes glide{0%{transform:translate(-60px,40px) rotate(-4deg)}50%{transform:translate(260px,10px) rotate(3deg)}100%{transform:translate(-60px,40px) rotate(-4deg)}}
.hero .title{position:absolute;right:18px;bottom:16px}
.hero h1{font-size:clamp(44px,13vw,64px);color:#fff;text-shadow:0 3px 0 var(--red),0 6px 0 rgba(0,0,0,.25)}
.hero p{margin:0;color:#fff;font-weight:700;font-size:15px;text-shadow:0 2px 4px rgba(0,0,0,.35)}
.total{display:inline-flex;align-items:center;gap:6px;background:var(--card);border:3px solid var(--ink);border-radius:30px;padding:2px 14px;font-weight:800;box-shadow:0 4px 0 var(--ink);margin:4px 0 16px}

/* trail */
.trail{position:relative;display:grid;gap:14px;padding-right:34px}
.trail::before{content:"";position:absolute;right:15px;top:10px;bottom:10px;border-right:4px dashed var(--ink);opacity:.35}
.stop{position:relative;display:flex;align-items:center;gap:12px;width:100%;text-align:right;background:var(--card);border:3px solid var(--ink);border-radius:22px;padding:10px 12px;box-shadow:0 5px 0 var(--ink)}
.stop:active{transform:translateY(3px);box-shadow:0 2px 0 var(--ink)}
.stop::after{content:"";position:absolute;right:-30px;top:50%;width:18px;height:18px;margin-top:-9px;border-radius:50%;background:var(--sc);border:3px solid var(--ink)}
.stop .em{width:58px;height:58px;border-radius:18px;background:var(--sc);display:grid;place-items:center;font-size:32px;flex:none;border:3px solid var(--ink)}
.stop .inf{flex:1;min-width:0}
.stop small{color:var(--soft);font-weight:700;font-size:13px}
.stop h3{font-size:20px}
.stop .st{font-size:13px;font-weight:700;color:var(--soft)}

/* bar */
.bar{display:flex;align-items:center;gap:10px;margin:4px 0 12px}
.ib{width:46px;height:46px;border-radius:16px;border:3px solid var(--ink);background:var(--card);font-size:20px;display:grid;place-items:center;box-shadow:0 4px 0 var(--ink);flex:none;font-weight:800}
.ib:active{transform:translateY(2px);box-shadow:0 2px 0 var(--ink)}
.bar .t{flex:1;min-width:0}
.bar h2{font-size:22px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar small{color:var(--soft);font-weight:700;font-size:13px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.band{background:var(--sc);color:#fff;border:3px solid var(--ink);border-radius:24px;padding:14px 16px;display:flex;gap:12px;align-items:center;box-shadow:0 5px 0 var(--ink);margin-bottom:16px}
.band .em{font-size:48px}
.band h2{font-size:26px}
.band p{margin:0;font-weight:700;opacity:.9}
.games{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.gcard{background:var(--card);border:3px solid var(--ink);border-radius:20px;padding:12px 8px;text-align:center;box-shadow:0 5px 0 var(--ink);display:flex;flex-direction:column;align-items:center;gap:2px}
.gcard:active{transform:translateY(3px);box-shadow:0 2px 0 var(--ink)}
.gcard .gi{font-size:40px;line-height:1.1}
.gcard b{font-size:17px;line-height:1.25}
.gcard span{font-size:12px;color:var(--soft);font-weight:700}
.stars{letter-spacing:1px;font-size:16px}
.stars .off{opacity:.2;filter:grayscale(1)}

/* game */
.hud{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-weight:800}
.hearts{font-size:22px;letter-spacing:2px}
.hearts .lost{opacity:.18;filter:grayscale(1)}
.pbar{flex:1;height:14px;background:var(--card);border:3px solid var(--ink);border-radius:10px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--gold);width:0;transition:width .3s}
.target{background:var(--card);border:3px solid var(--ink);border-radius:18px;padding:8px 12px;margin-bottom:10px;font-weight:800;font-size:18px;text-align:center;box-shadow:0 4px 0 var(--ink);min-height:48px}
.target.flash{animation:fl .5s}
@keyframes fl{0%{transform:scale(1)}40%{transform:scale(1.05);background:var(--gold)}100%{transform:scale(1)}}
.arena{position:relative;border:3px solid var(--ink);border-radius:22px;overflow:hidden;box-shadow:0 5px 0 var(--ink);background:var(--card);touch-action:none;user-select:none;-webkit-user-select:none}
.arena canvas{display:block;width:100%;height:auto}
.help{text-align:center;color:var(--soft);font-weight:700;font-size:13px;margin-top:8px}
.shake{animation:sh .35s}
@keyframes sh{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.pop{animation:pp .3s}
@keyframes pp{50%{transform:scale(1.12)}}

/* overlay start */
.cover{position:absolute;inset:0;display:grid;place-items:center;background:rgba(43,33,64,.55);z-index:5;padding:16px}
.cover .box{background:var(--card);border:3px solid var(--ink);border-radius:22px;padding:18px;text-align:center;max-width:320px;box-shadow:0 5px 0 var(--ink)}
.cover .big{font-size:56px;line-height:1}
.cover p{margin:6px 0 12px;font-weight:700}
.go{border:3px solid var(--ink);background:var(--gold);border-radius:16px;padding:8px 26px;font-size:20px;font-weight:800;box-shadow:0 4px 0 var(--ink)}
.go:active{transform:translateY(2px);box-shadow:0 2px 0 var(--ink)}

/* belt bins */
.bins{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.binb{border:3px solid var(--ink);border-radius:18px;padding:12px 6px;font-size:19px;font-weight:800;color:#fff;box-shadow:0 5px 0 var(--ink);min-height:64px}
.binb:active{transform:translateY(3px);box-shadow:0 2px 0 var(--ink)}

/* whack */
.holes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:14px;background:linear-gradient(#9BD67A,#6DB54C)}
.hole{position:relative;height:92px;overflow:hidden;border-radius:0 0 50% 50%/0 0 30% 30%}
.hole::after{content:"";position:absolute;left:4%;right:4%;bottom:0;height:26px;background:#5A3A22;border-radius:50%;box-shadow:inset 0 5px 0 #3E2716}
.mole{position:absolute;left:6%;right:6%;bottom:8px;height:74px;transform:translateY(100%);transition:transform .22s cubic-bezier(.3,1.4,.6,1);z-index:1;border:3px solid var(--ink);border-radius:16px 16px 10px 10px;background:#FFF6DD;color:#2B2140;display:grid;place-items:center;font-weight:800;font-size:18px;padding:2px;line-height:1.15;text-align:center}
.mole.up{transform:translateY(0)}
.mole.hitok{background:var(--ok);color:#fff}
.mole.hitbad{background:var(--bad);color:#fff}

/* flip */
.fgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:10px}
.fc{perspective:600px;height:92px;border:none;background:none;padding:0}
.fc .in{position:relative;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d}
.fc.open .in{transform:rotateY(180deg)}
.fc .fa,.fc .ba{position:absolute;inset:0;border:3px solid var(--ink);border-radius:14px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:grid;place-items:center;padding:4px;font-weight:800;line-height:1.15}
.fc .fa{background:repeating-linear-gradient(45deg,var(--sc),var(--sc) 8px,color-mix(in srgb,var(--sc) 75%,#fff) 8px,color-mix(in srgb,var(--sc) 75%,#fff) 16px);color:#fff;font-size:30px}
.fc .ba{background:#FFF6DD;color:#2B2140;transform:rotateY(180deg);font-size:15px}
.fc .ba.small{font-size:12.5px}
.fc.done .ba{background:var(--ok);color:#fff}

/* train */
.track{overflow-x:auto;padding:12px 10px 18px;background:linear-gradient(transparent 78%,#8B6B4A 78%,#8B6B4A 82%,transparent 82%)}
.train{display:flex;gap:6px;align-items:flex-end;min-height:120px;width:max-content;transition:transform 2.2s ease-in}
.loco{font-size:70px;line-height:1;transform:scaleX(-1)}
.wagon{position:relative;min-width:96px;max-width:150px;min-height:78px;border:3px solid var(--ink);border-radius:12px 12px 6px 6px;background:var(--sc);color:#fff;padding:6px 8px 16px;font-weight:800;font-size:14px;line-height:1.2;display:grid;place-items:center;text-align:center;animation:join .45s cubic-bezier(.3,1.5,.6,1)}
.wagon::before,.wagon::after{content:"";position:absolute;bottom:-12px;width:20px;height:20px;border-radius:50%;background:#333;border:3px solid var(--ink)}
.wagon::before{right:12px}.wagon::after{left:12px}
@keyframes join{from{transform:translateY(-40px) scale(.7);opacity:0}}
.yard{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding:12px}
.ycard{border:3px solid var(--ink);background:#FFF6DD;color:#2B2140;border-radius:14px;padding:8px 12px;font-weight:800;font-size:15px;box-shadow:0 4px 0 var(--ink);max-width:100%;line-height:1.3}
.ycard:active{transform:translateY(2px);box-shadow:0 2px 0 var(--ink)}
.smoke{position:absolute;font-size:28px;animation:smk 1.2s ease-out forwards;pointer-events:none}
@keyframes smk{to{transform:translate(20px,-70px) scale(1.8);opacity:0}}

/* modal */
.modal{position:fixed;inset:0;background:rgba(20,12,35,.6);display:grid;place-items:center;z-index:20;padding:20px}
.res{background:var(--card);border:3px solid var(--ink);border-radius:28px;padding:22px;text-align:center;max-width:340px;width:100%;box-shadow:0 7px 0 var(--ink);animation:pp .4s}
.res .big{font-size:50px;letter-spacing:4px}
.res h2{font-size:30px;margin:4px 0}
.res p{margin:0 0 14px;color:var(--soft);font-weight:700}
.res .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.btn{border:3px solid var(--ink);background:var(--card);border-radius:16px;padding:8px 16px;font-size:17px;font-weight:800;box-shadow:0 4px 0 var(--ink)}
.btn.pri{background:var(--gold);color:#2B2140}
.combo{font-weight:800;font-size:16px;background:var(--gold);color:#2B2140;border:3px solid var(--ink);border-radius:20px;padding:0 10px;white-space:nowrap}
.cd{position:absolute;inset:0;display:grid;place-items:center;background:rgba(43,33,64,.45);z-index:6;pointer-events:none}
.cd span{font-size:110px;font-weight:800;color:#fff;text-shadow:0 5px 0 var(--sc),0 10px 0 rgba(0,0,0,.3);animation:cdp .6s cubic-bezier(.3,1.6,.5,1)}
.cd span.gow{font-size:64px;color:var(--gold)}
@keyframes cdp{from{transform:scale(2.4);opacity:0}}
.res .big .sOn{display:inline-block;animation:sIn .5s cubic-bezier(.3,1.8,.5,1) both}
@keyframes sIn{from{transform:scale(0) rotate(-90deg);opacity:0}}
.gcard.phase{grid-column:1/-1;flex-direction:row;text-align:right;gap:12px;padding:12px 14px;position:relative;border-style:dashed}
.gcard.phase .gi{font-size:44px}
.gcard.phase .pt{flex:1;display:flex;flex-direction:column;gap:0}
.gcard.phase .tag{position:absolute;top:-12px;left:14px;background:var(--ph);color:#fff;border:3px solid var(--ink);border-radius:12px;padding:0 10px;font-size:13px;font-weight:800}
.gcard.pre{--ph:#F2994A;background:color-mix(in srgb,#F2994A 14%,var(--card))}
.gcard.post{--ph:#8E44AD;background:color-mix(in srgb,#8E44AD 14%,var(--card))}
.sec-h{font-weight:800;color:var(--soft);font-size:14px;grid-column:1/-1;margin:2px 4px -4px}
#fx{position:fixed;inset:0;pointer-events:none;z-index:30}
@media (prefers-reduced-motion: reduce){.eagle,.wagon,.res{animation:none}}
</style>
</head>
<body>
<svg class="hills" viewBox="0 0 400 160" preserveAspectRatio="none" aria-hidden="true">
  <path d="M0 90 L60 40 L110 80 L170 20 L240 85 L300 45 L360 80 L400 55 V160 H0z" fill="#8C7B6B"/>
  <path d="M0 120 Q80 90 160 115 T320 110 T400 115 V160 H0z" fill="#E8C98A"/>
</svg>
<canvas id="fx"></canvas>
<div class="wrap" id="app"></div>
<script>
/* ===== utils ===== */
const $ = (s, r = document) => r.querySelector(s);
const AR = "٠١٢٣٤٥٦٧٨٩", ar = n => String(n).replace(/\d/g, d => AR[d]);
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pick = a => a[Math.random() * a.length | 0];
const h = (tag, at = {}, ...kids) => { const e = document.createElement(tag); for (const k in at) { if (k === "class") e.className = at[k]; else if (k === "html") e.innerHTML = at[k]; else if (k.startsWith("on")) e.addEventListener(k.slice(2), at[k]); else if (k === "style") e.style.cssText = at[k]; else e.setAttribute(k, at[k]); } for (const c of kids.flat()) if (c != null) e.append(c.nodeType ? c : document.createTextNode(c)); return e; };
const flash = (el, c) => { el.classList.remove(c); void el.offsetWidth; el.classList.add(c); };
const FONT = '"Baloo Bhaijaan 2", Tahoma, sans-serif';

/* ===== storage ===== */
const KEY = "arabic4-motion-v1";
let store = { stars: {}, sound: true };
try { const s = JSON.parse(localStorage.getItem(KEY)); if (s) store = Object.assign(store, s); } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(store)); } catch (e) {} };

/* ===== sound ===== */
let actx, master;
function ac() { if (!store.sound) return null; try { if (!actx) { actx = new (window.AudioContext || window.webkitAudioContext)(); master = actx.createGain(); master.gain.value = .9; const comp = actx.createDynamicsCompressor(); master.connect(comp); comp.connect(actx.destination); } if (actx.state === "suspended") actx.resume(); return actx; } catch (e) { return null; } }
function note(f, t0, d, type = "sine", v = .14, slide = 0) { const a = ac(); if (!a) return; const t = a.currentTime + t0, o = a.createOscillator(), g = a.createGain(); o.type = type; o.frequency.setValueAtTime(f, t); if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f * slide), t + d); g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(v, t + .012); g.gain.exponentialRampToValueAtTime(.0001, t + d); o.connect(g); g.connect(master); o.start(t); o.stop(t + d + .03); }
let nbuf = null;
function noise(t0, d, v = .1, freq = 1200, q = 1, type = "bandpass", sweep = 0) { const a = ac(); if (!a) return; if (!nbuf) { nbuf = a.createBuffer(1, a.sampleRate, a.sampleRate); const ch = nbuf.getChannelData(0); for (let i = 0; i < ch.length; i++) ch[i] = Math.random() * 2 - 1; } const t = a.currentTime + t0, s = a.createBufferSource(); s.buffer = nbuf; const f = a.createBiquadFilter(); f.type = type; f.frequency.setValueAtTime(freq, t); if (sweep) f.frequency.exponentialRampToValueAtTime(sweep, t + d); f.Q.value = q; const g = a.createGain(); g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.0001, t + d); s.connect(f); f.connect(g); g.connect(master); s.start(t); s.stop(t + d + .02); }
function tone(fs, d = .1, type = "sine", v = .12) { fs.forEach((f, i) => note(f, i * d * .8, d, type, v)); }
const sfx = {
  click() { note(1400, 0, .03, "square", .035); note(900, .02, .04, "triangle", .05); },
  tap() { note(700, 0, .06, "triangle", .08); },
  swish() { noise(0, .13, .09, 700, .8, "bandpass", 3200); },
  ok(n = 0) { const k = Math.pow(2, Math.min(n, 9) / 12); note(660 * k, 0, .1, "triangle", .14); note(990 * k, .07, .15, "triangle", .12); note(1320 * k, .14, .14, "sine", .06); },
  combo(n) { const k = Math.pow(2, Math.min(n, 9) / 12); [1046, 1318, 1568, 2093].forEach((f, i) => note(f * k, .18 + i * .05, .12, "sine", .05)); },
  bad() { note(190, 0, .24, "sawtooth", .09, .55); note(125, .02, .26, "square", .05, .7); noise(0, .14, .07, 280, 1, "lowpass"); },
  heart() { note(72, 0, .13, "sine", .38, .8); note(62, .17, .15, "sine", .32, .8); },
  pop() { note(950, 0, .09, "sine", .16, .3); noise(0, .05, .09, 2600, 2); },
  boing() { note(260, 0, .22, "triangle", .1, 2.4); },
  whoosh() { noise(0, .26, .11, 450, .7, "bandpass", 2600); },
  flip() { noise(0, .08, .08, 2200, 1.2, "highpass"); note(540, 0, .05, "triangle", .05); },
  match() { [784, 988, 1175, 1568].forEach((f, i) => note(f, i * .06, .2, "sine", .1)); },
  chug() { noise(0, .07, .13, 380, 1, "lowpass"); noise(.11, .07, .1, 380, 1, "lowpass"); note(110, 0, .1, "square", .04); },
  toot() { note(392, 0, .35, "sawtooth", .06); note(494, 0, .35, "sawtooth", .05); note(392, .42, .55, "sawtooth", .06); note(494, .42, .55, "sawtooth", .05); },
  count() { note(660, 0, .16, "square", .07); note(1320, 0, .08, "sine", .04); },
  go() { [523, 659, 784, 1046].forEach((f, i) => note(f, i * .07, .38, "triangle", .11)); noise(0, .35, .05, 4000, .5, "highpass"); },
  level() { [523, 784, 1046, 1568].forEach((f, i) => note(f, i * .08, .22, "square", .05)); noise(.3, .3, .04, 6000, .5, "highpass"); },
  star(i) { const f = [1046, 1318, 1568][i] || 1568; note(f, 0, .4, "triangle", .12); note(f * 2, .05, .32, "sine", .05); noise(0, .2, .03, 7000, .5, "highpass"); },
  win() { [[523, 0], [659, .12], [784, .24], [1046, .36], [784, .52], [1046, .64]].forEach(([f, t]) => { note(f, t, .22, "triangle", .13); note(f / 2, t, .22, "sine", .06); }); [523, 659, 784, 1046].forEach(f => note(f, .82, 1, "triangle", .07)); noise(.82, .7, .04, 6000, .5, "highpass"); },
  fail() { [392, 370, 349, 311].forEach((f, i) => note(f, i * .28, i === 3 ? .85 : .3, "sawtooth", .07, i === 3 ? .85 : 1)); },
  intro() { [392, 523, 659, 784].forEach((f, i) => note(f, i * .09, .22, "triangle", .1)); },
  open() { note(520, 0, .08, "sine", .08, 1.5); }
};
document.addEventListener("pointerdown", e => { if (e.target.closest(".stop,.gcard,.btn,.ib,.go")) sfx.click(); }, true);

function confetti() {
  const c = $("#fx"), x = c.getContext("2d"); c.width = innerWidth; c.height = innerHeight;
  const cols = ["#D6001C", "#0A8F3C", "#FFC83D", "#2D9CDB", "#8E44AD", "#fff"];
  const ps = Array.from({ length: 130 }, () => ({ x: innerWidth / 2, y: innerHeight * .45, vx: (Math.random() - .5) * 15, vy: -Math.random() * 15 - 4, r: Math.random() * 7 + 4, c: pick(cols), a: Math.random() * 6 }));
  let f = 0; (function L() { x.clearRect(0, 0, c.width, c.height); ps.forEach(p => { p.x += p.vx; p.y += p.vy; p.vy += .38; p.a += .2; x.save(); x.translate(p.x, p.y); x.rotate(p.a); x.fillStyle = p.c; x.fillRect(-p.r / 2, -p.r / 4, p.r, p.r / 2); x.restore(); }); if (++f < 110) requestAnimationFrame(L); else x.clearRect(0, 0, c.width, c.height); })();
}

/* ===== navigation ===== */
const app = $("#app");
let cleanup = [];
const clean = () => { cleanup.forEach(f => { try { f(); } catch (e) {} }); cleanup = []; };

/* ===== canvas helpers ===== */
function mkCanvas(arena, W, H) {
  const dpr = Math.min(2, devicePixelRatio || 1);
  const c = h("canvas", { width: W * dpr, height: H * dpr }); const x = c.getContext("2d"); x.scale(dpr, dpr);
  arena.append(c);
  const pos = e => { const r = c.getBoundingClientRect(); return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H }; };
  return [c, x, pos];
}
function loop(fn, api) { let on = true, last = performance.now(); const f = t => { if (!on) return; const dt = Math.min(3, (t - last) / 16.67); last = t; fn(dt, t); requestAnimationFrame(f); }; requestAnimationFrame(f); api.clean(() => on = false); }
function wrap(x, text, maxW) {
  const words = String(text).split(" "); const lines = []; let cur = "";
  words.forEach(w => { const t = cur ? cur + " " + w : w; if (x.measureText(t).width > maxW && cur) { lines.push(cur); cur = w; } else cur = t; });
  if (cur) lines.push(cur); return lines;
}
function rr(x, X, Y, w, hh, r) { x.beginPath(); x.moveTo(X + r, Y); x.arcTo(X + w, Y, X + w, Y + hh, r); x.arcTo(X + w, Y + hh, X, Y + hh, r); x.arcTo(X, Y + hh, X, Y, r); x.arcTo(X, Y, X + w, Y, r); x.closePath(); }
function label(x, text, cx, cy, maxW, size, fill, bg, stroke) {
  x.font = `800 ${size}px ${FONT}`; x.direction = "rtl"; x.textAlign = "center"; x.textBaseline = "middle";
  const lines = wrap(x, text, maxW - 16), lh = size * 1.2;
  const w = Math.min(maxW, Math.max(...lines.map(l => x.measureText(l).width)) + 22), hh = lines.length * lh + 14;
  if (bg) { rr(x, cx - w / 2, cy - hh / 2, w, hh, 12); x.fillStyle = bg; x.fill(); x.lineWidth = 3; x.strokeStyle = stroke || "#2B2140"; x.stroke(); }
  x.fillStyle = fill; lines.forEach((l, i) => x.fillText(l, cx, cy - hh / 2 + 7 + lh * (i + .5)));
  return { w, h: hh };
}
function burst(parts, X, Y, col, n = 12) { for (let i = 0; i < n; i++) { const a = Math.random() * 6.28, s = 2 + Math.random() * 4; parts.push({ x: X, y: Y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 1, c: col }); } }
function drawParts(x, parts, dt) { for (let i = parts.length - 1; i >= 0; i--) { const p = parts[i]; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += .15 * dt; p.life -= .03 * dt; if (p.life <= 0) { parts.splice(i, 1); continue; } x.globalAlpha = p.life; x.fillStyle = p.c; x.beginPath(); x.arc(p.x, p.y, 4, 0, 6.29); x.fill(); } x.globalAlpha = 1; }

function drawFloat(x, list, dt) { for (let i = list.length - 1; i >= 0; i--) { const f = list[i]; f.y -= 1.2 * dt; f.life -= .025 * dt; if (f.life <= 0) { list.splice(i, 1); continue; } x.globalAlpha = f.life; x.font = `800 26px ${FONT}`; x.textAlign = "center"; x.fillStyle = f.c; x.fillText(f.t, f.x, f.y); } x.globalAlpha = 1; }

/* ===== backgrounds ===== */
const SCENES = {
  mountain: { top: "#9FD8F5", bot: "#CDB590", path: "#B89C74", deco: ["🪨", "⛰️", "🌿", "🌴"] },
  sky: { top: "#5EB8F0", bot: "#BDE6FF", path: null, deco: ["☁️", "☁️", "🐦"] },
  village: { top: "#A8E07E", bot: "#7CC35A", path: "#D9C08F", deco: ["🌴", "🌴", "🏠", "🐐"] },
  desert: { top: "#FFD99A", bot: "#EDB663", path: "#D69B4E", deco: ["🌵", "🐪", "🏜️", "🌴"] },
  sea: { top: "#6CC6F0", bot: "#1F7FC4", path: null, deco: ["🐟", "⛵", "🐚"] },
  city: { top: "#B9C6D6", bot: "#8E9AAC", path: "#6D7686", deco: ["🏢", "🕌", "🌳"] }
};
function drawBg(x, W, H, sc, off, deco) {
  const g = x.createLinearGradient(0, 0, 0, H); g.addColorStop(0, sc.top); g.addColorStop(1, sc.bot); x.fillStyle = g; x.fillRect(0, 0, W, H);
  if (sc.path) { x.fillStyle = sc.path; x.fillRect(24, 0, W - 48, H); }
  x.font = `30px ${FONT}`; x.textAlign = "center"; x.textBaseline = "middle";
  deco.forEach(d => { x.globalAlpha = .9; x.fillText(d.e, d.x, d.y); });
  x.globalAlpha = 1;
}

/* ===== ENGINES ===== */
const ENG = {};

/* runner: lanes with answer gates */
ENG.runner = (arena, G, api) => {
  const W = 360, H = 520, [c, x, pos] = mkCanvas(arena, W, H);
  const sc = SCENES[G.scene || "mountain"];
  const qs = G.shuffle === false ? G.qs : shuffle(G.qs);
  let qi = -1, gate = null, lane = 1, px = W / 2, t0 = 0, parts = [], fl = [], started = false, n = 3;
  const deco = Array.from({ length: 6 }, (_, i) => ({ e: pick(sc.deco), x: i % 2 ? 12 : W - 12, y: i * 95 }));
  const PY = H - 62;
  function next() {
    qi++; api.progress(qi / qs.length);
    if (qi >= qs.length) { setTimeout(() => api.win(), 400); gate = null; return; }
    const q = qs[qi]; n = q.o.length; const opts = shuffle(q.o.map((t, k) => ({ t, k })));
    gate = { y: -110, opts, ans: opts.findIndex(o => o.k === 0), done: false, res: null };
    api.target(q.q);
    if (lane >= n) lane = n - 1;
  }
  const laneX = i => (W - 48) * (i + .5) / n + 24;
  window.__t = { get gate() { return gate; }, set lane(v) { lane = v; } };
  c.addEventListener("pointerdown", e => { if (!started) return; const p = pos(e); const nl = Math.max(0, Math.min(n - 1, Math.floor((p.x - 24) / ((W - 48) / n)))); if (nl !== lane) sfx.swish(); else sfx.tap(); lane = nl; });
  const kd = e => { if (!started) return; if (e.key === "ArrowLeft") lane = Math.max(0, lane - 1); if (e.key === "ArrowRight") lane = Math.min(n - 1, lane + 1); };
  addEventListener("keydown", kd); api.clean(() => removeEventListener("keydown", kd));
  let off = 0;
  loop((dt, t) => {
    const sp = started && gate ? (1.5 + qi * .09) : .6;
    off = (off + sp * dt) % 40;
    deco.forEach(d => { d.y += sp * dt; if (d.y > H + 30) { d.y = -30; d.e = pick(sc.deco); } });
    drawBg(x, W, H, sc, off, deco);
    // lane lines
    x.strokeStyle = "rgba(255,255,255,.7)"; x.lineWidth = 4; x.setLineDash([20, 20]); x.lineDashOffset = -off;
    for (let i = 1; i < n; i++) { const lx = 24 + (W - 48) * i / n; x.beginPath(); x.moveTo(lx, 0); x.lineTo(lx, H); x.stroke(); }
    x.setLineDash([]);
    if (gate) {
      gate.y += sp * dt * (gate.done ? 1.6 : 1);
      const bw = (W - 48) / n - 8;
      gate.opts.forEach((o, i) => {
        let bg = "#FFF6DD", fg = "#2B2140";
        if (gate.done) { if (i === gate.ans) { bg = "#18A558"; fg = "#fff"; } else if (i === lane && gate.res === false) { bg = "#E5383B"; fg = "#fff"; } }
        x.fillStyle = "#6B4A2B"; x.fillRect(laneX(i) - 4, gate.y + 20, 8, 60);
        label(x, o.t, laneX(i), gate.y, bw, n === 2 ? 18 : 16, fg, bg);
      });
      if (!gate.done && gate.y >= PY - 50) {
        gate.done = true; gate.res = lane === gate.ans;
        if (gate.res) { api.good(); burst(parts, laneX(lane), PY - 20, "#FFC83D", 16); floatTxt(fl, "+١", laneX(lane), PY - 40, "#18A558"); }
        else { floatTxt(fl, "✗", laneX(lane), PY - 40, "#E5383B"); api.hit(); }
      }
      if (gate.done && gate.y > H + 60 && !api.over) next();
    }
    px += (laneX(lane) - px) * Math.min(1, .25 * dt);
    x.font = `46px ${FONT}`; x.textAlign = "center"; x.textBaseline = "middle";
    x.fillStyle = "rgba(0,0,0,.2)"; x.beginPath(); x.ellipse(px, PY + 26, 20, 6, 0, 0, 6.29); x.fill();
    x.fillText(G.hero || "🏃", px, PY + Math.sin(t / 120) * 3);
    drawParts(x, parts, dt); drawFloat(x, fl, dt);
  }, api);
  return () => { started = true; next(); };
};

/* shared spawner for catch / bubbles / whack */
function roundMgr(G, api, onRound) {
  const need = G.need || 6; let r = 0, cnt = 0;
  const total = G.rounds.length * need;
  const R = () => G.rounds[r];
  const draw = () => { const Rr = R(); if (!Rr) return null; const good = Math.random() < .55; return { t: pick(good ? Rr.good : Rr.bad), good }; };
  return {
    R, draw, get cnt() { return cnt; },
    start() { api.target(R().target); api.progress(0); },
    got() { cnt++; api.progress((r * need + cnt) / total); if (cnt >= need) { r++; cnt = 0; if (r >= G.rounds.length) { setTimeout(() => api.win(), 350); return "end"; } api.target("⭐ " + R().target); sfx.level(); onRound && onRound(); return "round"; } }
  };
}

/* catch: basket catches falling words */
ENG.catch = (arena, G, api) => {
  const W = 360, H = 480, [c, x, pos] = mkCanvas(arena, W, H), sc = SCENES[G.scene || "desert"];
  const rm = roundMgr(G, api, () => items.forEach(i => i.dead = true));
  let items = [], parts = [], fl = [], bx = W / 2, tx = W / 2, started = false, spawnT = 0, dragging = false, lastX = W / 2;
  const deco = Array.from({ length: 4 }, (_, i) => ({ e: pick(sc.deco), x: i % 2 ? 14 : W - 14, y: 60 + i * 110 }));
  const mv = e => { tx = Math.max(40, Math.min(W - 40, pos(e).x)); };
  c.addEventListener("pointerdown", e => { dragging = true; mv(e); c.setPointerCapture && c.setPointerCapture(e.pointerId); });
  c.addEventListener("pointermove", e => { if (dragging || e.pointerType === "mouse") mv(e); });
  c.addEventListener("pointerup", () => dragging = false);
  const kd = e => { if (e.key === "ArrowLeft") tx = Math.max(40, tx - 40); if (e.key === "ArrowRight") tx = Math.min(W - 40, tx + 40); };
  addEventListener("keydown", kd); api.clean(() => removeEventListener("keydown", kd));
  const BY = H - 44;
  window.__t = { get items() { return items; }, set tx(v) { tx = v; } };
  loop((dt, t) => {
    drawBg(x, W, H, { ...sc, path: null }, 0, deco);
    if (started && !api.over) {
      spawnT -= dt * 16.67;
      if (spawnT <= 0) { const d = rm.draw() || { t: "", good: false, skip: 1 }; if (d.skip) { spawnT = 1e9; } else { x.font = `800 18px ${FONT}`; const w = Math.min(200, x.measureText(d.t).width + 26); let nx, tries = 0; do { nx = 30 + w / 2 + Math.random() * (W - 60 - w); } while (tries++ < 8 && Math.abs(nx - lastX) < 110); lastX = nx; items.push({ ...d, x: nx, y: -30, v: 1.05 + Math.random() * .25 + rm.cnt * .04, w }); spawnT = 1450 - rm.cnt * 30; } }
    }
    bx += (tx - bx) * Math.min(1, .35 * dt);
    items.forEach(it => {
      if (it.dead) return; it.y += it.v * dt;
      label(x, it.t, it.x, it.y, 210, 18, "#2B2140", "#FFFFFF");

  addEventListener("keydown", kd); api.clean(() => removeEventListener("keydown", kd));

    // belt
    roll = (roll + sp * dt) % 24;
    x.fillStyle = "#3C3F4A"; rr(x, -10, BY + 34, W + 20, 26, 13); x.fill();
    x.fillStyle = "#6E7280"; for (let k = -1; k < W / 24 + 2; k++) { x.fillRect(k * 24 + (24 - roll), BY + 40, 12, 14); }

      x.font = `800 17px ${FONT}`; x.textAlign = "center"; x.textBaseline = "middle"; x.direction = "rtl"; x.fillStyle = "#fff"; x.fillText(b.t, binX[i], binY + 3);

      x.globalAlpha = Math.max(0, Math.min(1, it.a ?? 1));
      const isF = it === front();
      label(x, it.t, it.x, it.y, 210, 18, it.res ? (it.res.ok ? "#fff" : it.res.miss ? "#2B2140" : "#fff") : "#2B2140", it.res ? (it.res.ok ? "#18A558" : it.res.miss ? "#FFF6DD" : "#E5383B") : isF ? "#FFE58A" : "#FFFFFF");
      x.globalAlpha = 1;
