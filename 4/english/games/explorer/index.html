<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Discovery Trail 4A</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Baloo+Bhaijaan+2:wght@400;600;700;800&display=swap">
<style>
:root{
  --sky:#D6EEFF;--sky2:#F1F9FF;--sand:#FFF5DF;--paper:#FFFFFF;--ink:#1D2A48;--muted:#5B6B8D;--line:#DCE7F3;
  --sun:#FFC23D;--sunD:#D99A12;--coral:#FF6B5A;--leaf:#22B573;--sea:#1E9BF0;--grape:#8B5CF6;--ok:#1FAE66;--bad:#EF4B4B;
  --uc:#1E9BF0;--ucs:#E8F5FF;
  --sh:0 5px 0 rgba(29,42,72,.07),0 12px 28px rgba(29,42,72,.08);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background-color:var(--sky2);background-image:linear-gradient(180deg,var(--sky) 0,var(--sky2) 380px,var(--sand) 1600px);color:var(--ink);
  font-family:'Baloo Bhaijaan 2','Segoe UI',Tahoma,Arial,sans-serif;font-size:17px;line-height:1.5;-webkit-tap-highlight-color:transparent}
.en{font-family:'Andika','Baloo Bhaijaan 2','Segoe UI',Arial,sans-serif;direction:ltr;unicode-bidi:isolate}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible,input:focus-visible{outline:3px solid var(--sun);outline-offset:3px}
input{font:inherit}
#app{max-width:1080px;margin:0 auto;padding-inline:16px;padding-block:0 48px}
h1,h2,h3{text-wrap:balance;margin:0;line-height:1.25}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;display:flex;align-items:center;gap:10px;margin-inline:-16px;padding:10px 16px;
  background:rgba(214,238,255,.86);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid rgba(29,42,72,.06)}
.top .ttl{flex:1;min-width:0;font-weight:800;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .ttl small{display:block;font-weight:600;font-size:13px;color:var(--muted);line-height:1.1}
.ibtn{width:44px;height:44px;border-radius:14px;background:#fff;display:grid;place-items:center;font-size:20px;box-shadow:0 3px 0 var(--line),inset 0 0 0 2px var(--line);flex:none}
.ibtn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line),inset 0 0 0 2px var(--line)}
.starpill{display:flex;align-items:center;gap:4px;background:#fff;border-radius:999px;padding:6px 12px;font-weight:800;box-shadow:inset 0 0 0 2px #FFE3A0;font-variant-numeric:tabular-nums}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 20px;border-radius:999px;background:var(--uc);color:#fff;font-weight:800;font-size:17px;
  box-shadow:0 4px 0 rgba(0,0,0,.18);transition:transform .08s;min-height:48px}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.18)}
.btn.ghost{background:#fff;color:var(--ink);box-shadow:0 4px 0 var(--line),inset 0 0 0 2px var(--line)}
.btn.go{background:var(--leaf)}
.btn.sun{background:var(--sun);color:var(--ink);box-shadow:0 4px 0 var(--sunD)}
.btn[disabled]{opacity:.45;pointer-events:none}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:center}
.mt{margin-top:14px}

/* home */
.hero{position:relative;padding:26px 0 18px;display:grid;gap:6px;overflow:hidden}
.hero h1{font-size:clamp(34px,7vw,58px);font-weight:800;letter-spacing:-.01em}
.hero h1 span{color:var(--coral)}
.hero .sub{font-size:clamp(16px,2.6vw,20px);color:var(--muted);max-width:40ch}
.hero .en-sub{font-weight:700;color:var(--sea);font-size:18px;text-align:right;padding-inline-end:0;margin-inline-end:120px}
@media (max-width:560px){.hero .en-sub{margin-inline-end:0;padding-top:70px}}
.sunball{position:absolute;inset-inline-end:10px;z-index:0;top:14px;width:92px;height:92px;border-radius:50%;background:radial-gradient(circle at 40% 40%,#FFE27A,#FFC23D 60%,#FFAA1F);
  box-shadow:0 0 0 14px rgba(255,194,61,.18),0 0 0 30px rgba(255,194,61,.09);animation:spin 40s linear infinite}
.cloud{position:absolute;height:26px;background:#fff;border-radius:99px;opacity:.9}
.cloud::before,.cloud::after{content:"";position:absolute;background:#fff;border-radius:50%}
.cloud::before{width:34px;height:34px;top:-16px;inset-inline-start:14px}.cloud::after{width:24px;height:24px;top:-10px;inset-inline-start:40px}
.c1{width:90px;top:96px;inset-inline-end:120px;animation:drift 9s ease-in-out infinite alternate}
.c2{width:70px;top:30px;inset-inline-end:190px;animation:drift 12s ease-in-out infinite alternate-reverse;opacity:.7}
@media (max-width:560px){.sunball{width:64px;height:64px}.c1,.c2{display:none}}
.hstats{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.hstat{background:#fff;border-radius:16px;padding:6px 14px;font-weight:700;box-shadow:inset 0 0 0 2px var(--line);font-variant-numeric:tabular-nums}
.sect{font-size:20px;font-weight:800;margin:22px 0 10px;display:flex;align-items:center;gap:8px}
.ugrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
.ucard{background:#fff;border-radius:26px;overflow:hidden;box-shadow:var(--sh);text-align:start;display:flex;flex-direction:column;transition:transform .15s}
.ucard:hover{transform:translateY(-3px)}
.ucard .band{background-color:var(--c);background-image:radial-gradient(rgba(255,255,255,.22) 2px,transparent 2.5px);background-size:18px 18px;height:104px;display:grid;place-items:center;font-size:56px;position:relative}
.ucard .band .num{position:absolute;inset-inline-start:14px;top:10px;background:rgba(255,255,255,.92);color:var(--c);border-radius:12px;padding:0 10px;font-weight:800;font-size:14px}
.ucard .body{padding:12px 16px 16px;display:grid;gap:4px}
.ucard .t1{font-size:21px;font-weight:800;color:var(--ink)}
.ucard .t2{font-size:17px;font-weight:700;color:var(--c)}
.ucard .meta{font-size:14px;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.pbar{height:10px;border-radius:99px;background:var(--line);overflow:hidden}
.pbar i{display:block;height:100%;background:var(--c);border-radius:99px}
.xgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
.xcard{display:flex;align-items:center;gap:14px;background:#fff;border-radius:22px;padding:14px 16px;box-shadow:var(--sh);text-align:start}
.xcard .ic{width:62px;height:62px;border-radius:18px;display:grid;place-items:center;font-size:34px;background:var(--c);flex:none}
.xcard b{font-size:19px;display:block}.xcard small{color:var(--muted);font-size:14px}

/* unit */
.uhead{border-radius:28px;background-color:var(--uc);background-image:radial-gradient(rgba(255,255,255,.2) 2px,transparent 2.5px);background-size:20px 20px;color:#fff;padding:20px;display:flex;gap:16px;align-items:center;margin:14px 0 6px}
.uhead .big{font-size:60px;line-height:1;background:rgba(255,255,255,.2);border-radius:22px;width:88px;height:88px;display:grid;place-items:center;flex:none}
.uhead h2{font-size:clamp(24px,4.5vw,34px)}
.uhead p{margin:0;opacity:.95;font-weight:600}
.lgroup{font-weight:800;color:var(--muted);font-size:15px;margin:18px 2px 8px}
.lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.lcard{background:#fff;border-radius:22px;padding:14px;box-shadow:var(--sh);display:grid;gap:4px;text-align:start;position:relative;transition:transform .15s}
.lcard:hover{transform:translateY(-2px)}
.lcard .le{font-size:38px;line-height:1.1}
.lcard .ln{font-size:13px;font-weight:800;color:var(--uc)}
.lcard .lt{font-size:18px;font-weight:800}
.lcard .la{font-size:15px;color:var(--muted);font-weight:600}
.lcard .lstars{font-size:14px;letter-spacing:1px;color:#E5E9F0}
.lcard .lstars .on{color:var(--sun)}
.tags{display:flex;gap:4px;flex-wrap:wrap}
.tag{font-size:12px;font-weight:800;border-radius:99px;padding:1px 9px;background:var(--sky2);color:var(--muted)}
.tag.v{background:#E4F7EC;color:#138A4E}.tag.g{background:#FFF0D1;color:#A86A00}
.done-badge{position:absolute;inset-inline-end:12px;top:12px;width:28px;height:28px;border-radius:50%;background:var(--leaf);color:#fff;display:grid;place-items:center;font-size:15px;font-weight:800}

/* lesson */
.lhead{display:flex;align-items:center;gap:12px;margin:14px 0 8px}
.lhead .le{font-size:44px;width:64px;height:64px;border-radius:20px;background:var(--ucs);display:grid;place-items:center;flex:none}
.lhead h2{font-size:clamp(20px,3.6vw,28px)}
.lhead p{margin:0;color:var(--muted);font-weight:600}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 12px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;padding:7px 14px;border-radius:999px;background:#fff;box-shadow:inset 0 0 0 2px var(--line);font-weight:700;font-size:15px;display:flex;gap:6px;align-items:center}
.tab.on{background:var(--uc);color:#fff;box-shadow:0 3px 0 rgba(0,0,0,.15)}
.tab .k{font-size:12px;opacity:.8}
.tab .ts{color:var(--sun);font-size:13px}
.stage{background:#fff;border-radius:28px;box-shadow:var(--sh);padding:18px;min-height:440px;position:relative;overflow:hidden}
@media (max-width:560px){.stage{padding:14px 12px;border-radius:22px}}
.eh{display:flex;flex-direction:column;gap:0;margin-bottom:12px}
.eh h3{font-size:21px;font-weight:800}
.eh p{margin:0;color:var(--muted);font-size:15px;font-weight:600}
.bar{height:12px;border-radius:99px;background:var(--line);overflow:hidden;margin:2px 0 14px}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--leaf),var(--sun));transition:width .4s}
.lnav{display:flex;justify-content:space-between;gap:10px;margin-top:14px}

/* common bits */
.pic{display:inline-block;line-height:1.1}
.np{font-family:'Andika',sans-serif;font-weight:700;background:var(--sun);color:var(--ink);border-radius:.3em;padding:0 .22em;display:inline-block;line-height:1.2;font-size:.7em}
.svgp svg{width:1.4em;height:1.4em;display:block}
.spk{width:48px;height:48px;border-radius:50%;background:var(--sun);font-size:21px;box-shadow:0 3px 0 var(--sunD);flex:none;display:inline-grid;place-items:center}
.spk.sm{width:40px;height:40px;font-size:17px}
.spk:active{transform:translateY(2px);box-shadow:0 1px 0 var(--sunD)}
mark{background:#FFE8A3;color:inherit;border-radius:6px;padding:0 3px;box-shadow:inset 0 -3px 0 #FFC23D}
mark.b{background:#D5EEFF;box-shadow:inset 0 -3px 0 #1E9BF0}
.blank{display:inline-block;min-width:2.6em;border-bottom:3px dashed var(--uc);color:var(--uc);text-align:center}
.fin-wrap{display:flex;justify-content:center;margin-top:14px}
.shake{animation:shake .4s}
.bounce{animation:bounce .5s}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
@keyframes bounce{0%{transform:scale(1)}40%{transform:scale(1.08)}70%{transform:scale(.97)}100%{transform:scale(1)}}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes drift{from{transform:translateX(0)}to{transform:translateX(-30px)}}
@keyframes slideIn{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}
.in{animation:pop .35s ease-out}

/* flashcards */
.fc-wrap{display:flex;align-items:center;gap:10px;justify-content:center}
.fc{flex:1;max-width:560px;min-height:300px;border-radius:26px;background:var(--ucs);box-shadow:inset 0 0 0 3px var(--uc);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:20px;text-align:center;cursor:pointer}
.fc-pic{font-size:clamp(70px,14vw,104px);line-height:1.1}
.fc-w{font-size:clamp(30px,6vw,46px);font-weight:700;line-height:1.15}
.fc-a{font-size:22px;color:var(--muted);font-weight:700}
.fc-s{font-size:19px;background:#fff;border-radius:14px;padding:6px 14px}
.nav{width:52px;height:52px;border-radius:50%;background:#fff;box-shadow:inset 0 0 0 2px var(--line),0 3px 0 var(--line);font-size:24px;flex:none;font-weight:800}
.fc-ctrl{display:flex;justify-content:center;align-items:center;gap:12px;margin-top:12px;flex-wrap:wrap}
.cnt{font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums}
.thumbs{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:12px}
.th{width:48px;height:48px;border-radius:14px;background:var(--sky2);font-size:24px;display:grid;place-items:center;box-shadow:inset 0 0 0 2px var(--line);overflow:hidden}
.th .np{font-size:15px}.th .svgp svg{width:30px;height:30px}
.th.seen{background:#E4F7EC}.th.on{box-shadow:inset 0 0 0 3px var(--uc)}
@media (max-width:560px){.fc-wrap .nav{display:none}.fc{min-height:260px}}

/* grammar */
.gslide{min-height:300px;display:flex;flex-direction:column;gap:14px;align-items:center;justify-content:center;text-align:center;padding:10px}
.g-title{font-size:clamp(24px,4.6vw,34px);font-weight:700;color:var(--uc)}
.g-ar{font-size:19px;max-width:48ch;font-weight:600}
.g-forms{display:grid;gap:10px;width:100%;max-width:620px}
.g-form{background:var(--ucs);border-radius:18px;padding:12px 14px;display:grid;gap:2px}
.g-form .en{font-size:clamp(18px,3.4vw,23px);font-weight:700}
.g-form small{color:var(--muted);font-size:15px;font-weight:600}
.g-ex{font-size:clamp(24px,5vw,36px);font-weight:700;line-height:1.35}
.g-exar{font-size:19px;color:var(--muted);font-weight:600}
.gtable{border-collapse:separate;border-spacing:0;border-radius:16px;overflow:hidden;box-shadow:inset 0 0 0 2px var(--line);font-size:18px;min-width:280px}
.gtable th{background:var(--uc);color:#fff;padding:8px 12px}
.gtable td{padding:8px 12px;border-top:1px solid var(--line);background:#fff}
.gtable tr:nth-child(even) td{background:var(--sky2)}
.tscroll{max-width:100%;overflow-x:auto}
.dots{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--uc);width:24px;border-radius:99px}
.tip{background:#FFF6D8;border-radius:16px;padding:8px 14px;font-weight:600;font-size:16px;max-width:620px}

/* story / book */
.panel{display:grid;gap:12px;animation:slideIn .35s}
.scene{font-size:clamp(46px,10vw,72px);text-align:center;background:linear-gradient(#DCF0FF,#FFF6E0);border-radius:22px;padding:14px 10px;letter-spacing:4px;line-height:1.2}
.narr{background:var(--sand);border-radius:16px;padding:10px 14px;font-size:19px}
.bubs{display:grid;gap:8px}
.bub{display:flex;gap:10px;align-items:flex-start;background:var(--sky2);border-radius:18px;padding:10px 12px;box-shadow:inset 0 0 0 2px var(--line);cursor:pointer;text-align:left}
.bub .av{font-size:32px;line-height:1}
.bub b{font-size:14px;color:var(--uc);display:block;line-height:1.2}
.bub p{margin:0;font-size:19px}
.speaking{box-shadow:inset 0 0 0 3px var(--sun)!important;background:#FFF6D8!important}
.pgctl{display:flex;justify-content:center;align-items:center;gap:12px;margin-top:14px;flex-wrap:wrap}
.book-page{border-radius:24px;background:#FFFDF7;box-shadow:inset 0 0 0 3px #F1E4C6;padding:16px;display:grid;gap:12px;animation:turn .45s ease-out;transform-origin:left center}
@keyframes turn{from{transform:perspective(900px) rotateY(-25deg);opacity:.2}to{transform:none;opacity:1}}
.book-art{font-size:clamp(50px,11vw,80px);text-align:center;line-height:1.2;letter-spacing:4px}
.book-tx{font-size:20px;line-height:1.6}
.cover{text-align:center;display:grid;gap:8px;padding:20px}
.cover .ct{font-size:clamp(28px,5vw,40px);font-weight:700;color:var(--uc)}
.post{border-radius:24px;background:#fff;box-shadow:inset 0 0 0 3px var(--line);overflow:hidden;animation:slideIn .35s}
.post .ph{background:linear-gradient(135deg,var(--ucs),#FFF3D6);font-size:clamp(54px,12vw,86px);text-align:center;padding:18px;line-height:1.2}
.post .pb{padding:14px 16px;display:grid;gap:8px}
.post h4{margin:0;font-size:24px;color:var(--uc)}
.post .ar{color:var(--muted);font-weight:600;font-size:16px}
.fact{background:#FFF1C9;border-radius:18px;padding:12px 16px;font-size:18px}

/* dialogue / chat */
.chatlog{display:flex;flex-direction:column;gap:10px;min-height:260px;max-height:52vh;overflow-y:auto;padding:10px;background:var(--sky2);border-radius:20px;direction:ltr}
.msg{max-width:84%;display:flex;gap:8px;align-items:flex-end;animation:slideIn .3s}
.msg.r{align-self:flex-end;flex-direction:row-reverse}
.msg .av{font-size:30px;line-height:1}
.msg .tx{padding:9px 14px;border-radius:18px 18px 18px 4px;background:#fff;font-size:19px;box-shadow:0 2px 0 var(--line)}
.msg.r .tx{background:var(--uc);color:#fff;border-radius:18px 18px 4px 18px;box-shadow:none}
.msg .nm{font-size:12px;font-weight:800;opacity:.7;display:block}
.replies{display:grid;gap:8px;margin-top:12px}
.rep{padding:12px 14px;border-radius:16px;background:#fff;box-shadow:inset 0 0 0 3px var(--line),0 3px 0 var(--line);font-size:18px;font-weight:700;text-align:left}
.rep.right{background:#DDF7EA;box-shadow:inset 0 0 0 3px var(--ok)}
.rep.wrong{background:#FFE3E1;box-shadow:inset 0 0 0 3px var(--bad);animation:shake .4s}
.keys{display:grid;gap:6px;margin-top:12px}
.key{background:#FFF6D8;border-radius:14px;padding:8px 12px;font-size:18px;font-weight:700;display:flex;justify-content:space-between;align-items:center;gap:8px;text-align:left}
.dial{display:grid;grid-template-columns:repeat(3,72px);gap:10px;justify-content:center;margin:10px 0}
.dial button{height:62px;border-radius:18px;background:#fff;box-shadow:inset 0 0 0 2px var(--line),0 3px 0 var(--line);font-size:26px;font-weight:800}
.dscreen{text-align:center;font-size:34px;font-weight:800;letter-spacing:6px;min-height:52px;font-variant-numeric:tabular-nums}

/* reading */
.rd{font-size:20px;line-height:1.7;margin:0 0 12px;text-align:left}
.rdp{display:flex;gap:10px;align-items:flex-start}
.gl{background:#E6F4FF;border-radius:8px;padding:0 4px;box-shadow:inset 0 -2px 0 var(--sea);font:inherit;color:inherit}
.gpop{position:fixed;z-index:60;background:var(--ink);color:#fff;border-radius:14px;padding:6px 12px;font-size:17px;font-weight:700;pointer-events:none;animation:pop .2s;max-width:80vw}
.ffile{background:var(--sand);border-radius:18px;padding:12px 16px;display:grid;gap:4px;margin-bottom:12px}
.ffile div{display:flex;gap:8px;font-size:18px;text-align:left}
.ffile b{color:var(--uc);min-width:9em}
.rtitle{font-size:26px;font-weight:700;text-align:left;margin-bottom:8px;color:var(--uc)}

/* phonics */
.ph-big{font-size:clamp(60px,14vw,110px);font-weight:700;color:var(--uc);line-height:1}
.ph-words{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;width:100%}
.ph-w{background:var(--sky2);border-radius:18px;padding:10px;display:grid;justify-items:center;box-shadow:inset 0 0 0 2px var(--line)}
.ph-w .pic{font-size:44px}
.ph-w .en{font-size:26px;font-weight:700}
.ph-w mark{background:none;box-shadow:none;color:var(--coral);padding:0}
.tw{font-size:clamp(22px,4.4vw,32px);font-weight:700;line-height:1.4}

/* q box */
.qhost{animation:slideIn .3s}
.qq{display:flex;align-items:center;gap:12px;justify-content:center;flex-wrap:wrap;text-align:center;margin:6px 0 16px}
.qt{font-size:clamp(20px,4vw,28px);font-weight:700;line-height:1.35}
.qe{font-size:clamp(50px,10vw,70px);line-height:1.1}
.opts{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.opts.long{grid-template-columns:1fr}
.opt{padding:12px;border-radius:18px;background:#fff;box-shadow:inset 0 0 0 3px var(--line),0 4px 0 var(--line);font-size:clamp(17px,3vw,21px);font-weight:700;min-height:60px;transition:transform .08s}
.opt:hover{box-shadow:inset 0 0 0 3px var(--uc),0 4px 0 var(--uc)}
.opt:active{transform:translateY(3px)}
.opt.right{background:#DDF7EA;box-shadow:inset 0 0 0 3px var(--ok),0 4px 0 var(--ok);animation:bounce .5s}
.opt.wrong{background:#FFE3E1;box-shadow:inset 0 0 0 3px var(--bad),0 4px 0 var(--bad);animation:shake .4s}
.panel-box{background:var(--sand);border-radius:18px;padding:12px;margin-bottom:12px;overflow-x:auto}

/* game scenes */
.gscene{position:relative;border-radius:22px;overflow:hidden;margin-bottom:14px;direction:ltr}
.track{background:#7BC96F;padding:10px 12px;display:grid;gap:8px}
.lane{position:relative;height:52px;background:#5C5F6B;border-radius:12px;background-image:repeating-linear-gradient(90deg,transparent 0 24px,rgba(255,255,255,.55) 24px 44px);background-size:44px 3px;background-repeat:repeat-x;background-position:0 50%}
.car{position:absolute;top:50%;left:0;transform:translate(0,-50%) scaleX(-1);font-size:38px;transition:left .6s cubic-bezier(.3,1.4,.6,1)}
.car.bo{transform:translate(0,-50%)}
.fl{position:absolute;right:6px;top:50%;transform:translateY(-50%);font-size:30px}
.pitch{height:210px;background:repeating-linear-gradient(90deg,#63BF5B 0 40px,#58B350 40px 80px)}
.goal{position:absolute;left:50%;top:12px;transform:translateX(-50%);width:260px;max-width:80%;height:100px;border:6px solid #fff;border-bottom:0;border-radius:6px 6px 0 0;background:repeating-linear-gradient(45deg,rgba(255,255,255,.35) 0 2px,transparent 2px 12px),repeating-linear-gradient(-45deg,rgba(255,255,255,.35) 0 2px,transparent 2px 12px)}
.keeper{position:absolute;left:50%;bottom:0;transform:translateX(-50%);font-size:52px;transition:left .35s,transform .35s}
.ball{position:absolute;left:50%;bottom:14px;font-size:36px;transform:translateX(-50%);transition:all .55s cubic-bezier(.2,.8,.3,1)}
.sb{position:absolute;right:10px;bottom:10px;background:rgba(29,42,72,.8);color:#fff;border-radius:12px;padding:2px 12px;font-weight:800;font-size:18px}
.bigmsg{position:absolute;inset:0;display:grid;place-items:center;font-size:clamp(34px,8vw,56px);font-weight:800;color:#fff;text-shadow:0 4px 0 rgba(0,0,0,.25);pointer-events:none;animation:pop .3s}
.mtn{height:260px;background:linear-gradient(#BEE6FF,#E9F7FF)}
.mtn .peak{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:0;height:0;border-left:170px solid transparent;border-right:170px solid transparent;border-bottom:240px solid #8C9BB0}
.mtn .snow{position:absolute;left:50%;bottom:180px;transform:translateX(-50%);width:0;height:0;border-left:43px solid transparent;border-right:43px solid transparent;border-bottom:60px solid #fff}
.climber{position:absolute;font-size:40px;transition:all .6s cubic-bezier(.3,1.3,.6,1)}
.flagtop{position:absolute;left:50%;bottom:232px;transform:translateX(-10%);font-size:34px}
.myst{position:relative;width:min(300px,80vw);aspect-ratio:1;margin:0 auto 14px;border-radius:22px;overflow:hidden;background:linear-gradient(135deg,#FFF3D6,#DDF0FF);display:grid;place-items:center;max-width:100%}
.myst .mp{font-size:clamp(120px,30vw,190px)}
.myst .tiles{position:absolute;inset:0;display:grid;grid-template-columns:repeat(3,1fr)}
.myst .tile{background:var(--uc);border:3px solid #fff;display:grid;place-items:center;color:#fff;font-weight:800;font-size:26px;transition:transform .5s,opacity .5s}
.myst .tile.off{transform:scale(0) rotate(40deg);opacity:0}
.wheel-wrap{position:relative;width:min(300px,78vw);aspect-ratio:1;margin:0 auto 12px;max-width:100%}
.wheel-wrap svg{width:100%;height:100%;transition:transform 3.2s cubic-bezier(.15,.85,.25,1)}
.wheel-ptr{position:absolute;left:50%;top:-6px;transform:translateX(-50%);font-size:34px;z-index:2}
.tug{background:linear-gradient(#E3F4FF,#FFF3D6);padding:12px;border-radius:22px}
.rope{position:relative;height:60px;margin:6px 0}
.rope::before{content:"";position:absolute;left:0;right:0;top:50%;height:8px;transform:translateY(-50%);background:repeating-linear-gradient(45deg,#C08A4A 0 8px,#9C6B34 8px 16px);border-radius:8px}
.knot{position:absolute;top:50%;width:26px;height:26px;border-radius:50%;background:var(--sun);border:4px solid #fff;transform:translate(-50%,-50%);transition:left .5s cubic-bezier(.3,1.4,.6,1);box-shadow:0 2px 6px rgba(0,0,0,.2)}
.tm{position:absolute;top:50%;transform:translateY(-50%);font-size:34px}
.midline{position:absolute;left:50%;top:0;bottom:0;width:3px;background:#fff;opacity:.8}
.tugq{text-align:center;font-size:clamp(20px,4vw,26px);font-weight:700;margin:6px 0 10px}
.tugsides{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tside{border-radius:18px;padding:10px;display:grid;gap:8px}
.tside.a{background:#DDEFFF}.tside.b{background:#FFE2DE}
.tside h4{margin:0;text-align:center;font-size:17px}
.tside .opt{min-height:50px;font-size:17px}
.tside.off{opacity:.45;pointer-events:none}
.teams{display:flex;gap:10px;justify-content:center;margin-bottom:12px;flex-wrap:wrap}
.team{border-radius:18px;padding:8px 16px;font-weight:800;font-size:18px;background:#fff;box-shadow:inset 0 0 0 3px var(--line);display:flex;gap:10px;align-items:center;font-variant-numeric:tabular-nums}
.team.on{box-shadow:inset 0 0 0 4px var(--c);background:var(--cs)}
.team .pts{font-size:26px}
.board{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;direction:ltr;margin-bottom:12px}
.cell{aspect-ratio:1;border-radius:12px;background:var(--sky2);box-shadow:inset 0 0 0 2px var(--line);position:relative;display:grid;place-items:center;font-weight:800;font-size:13px;color:var(--muted)}
.cell.sp{background:#FFF1C9}.cell.bk{background:#FFE2DE}.cell.st{background:#DDF7EA}.cell.fn{background:var(--sun)}
.cell .sx{position:absolute;top:2px;right:4px;font-size:12px}
.tok{position:absolute;font-size:clamp(16px,4vw,26px);transition:all .25s}
.tok.a{left:8%;bottom:6%}.tok.b{right:8%;bottom:6%}
.dice{width:70px;height:70px;border-radius:18px;background:#fff;box-shadow:inset 0 0 0 3px var(--ink),0 4px 0 var(--ink);display:grid;place-items:center;font-size:36px;font-weight:800}
.dice.roll{animation:spin .25s linear infinite}
.skyarea{position:relative;height:400px;border-radius:22px;background:linear-gradient(#A9DDFF,#EAF7FF);overflow:hidden;direction:ltr;touch-action:manipulation}
.balloon{position:absolute;bottom:-150px;width:118px;height:150px;animation:rise linear infinite;display:flex;flex-direction:column;align-items:center}
.balloon .bb{width:118px;height:124px;border-radius:50% 50% 48% 52%/58% 58% 42% 42%;background:var(--bc);display:grid;place-items:center;text-align:center;color:#fff;font-weight:800;font-size:17px;padding:10px;line-height:1.15;box-shadow:inset -10px -12px 0 rgba(0,0,0,.12),inset 8px 8px 0 rgba(255,255,255,.25);text-shadow:0 1px 2px rgba(0,0,0,.3)}
.balloon::after{content:"";width:2px;height:26px;background:#7A8499}
.balloon.popd{animation:none!important;transform:scale(1.4)!important;opacity:0;transition:all .2s}
.balloon.nope .bb{animation:shake .4s}
@keyframes rise{from{transform:translateY(0)}to{transform:translateY(-560px)}}
.catch-area{position:relative;height:420px;border-radius:22px;background:linear-gradient(#FFF6DE,#E5F5FF);overflow:hidden;direction:ltr;touch-action:none;user-select:none;-webkit-user-select:none}
.fall{position:absolute;top:0;left:0;background:#fff;border-radius:14px;padding:4px 8px;font-weight:800;font-size:15px;box-shadow:0 3px 0 var(--line),inset 0 0 0 2px var(--line);white-space:nowrap;display:flex;align-items:center;gap:4px;will-change:transform}
.fall .fe{font-size:22px}
.basket{position:absolute;bottom:6px;left:0;font-size:56px;line-height:1;will-change:transform}
.hud{display:flex;justify-content:space-between;gap:10px;align-items:center;font-weight:800;margin-bottom:8px;flex-wrap:wrap}
.rule{background:var(--ucs);border-radius:16px;padding:8px 14px;font-weight:700;text-align:center;margin-bottom:10px}
.moles{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;direction:ltr;max-width:520px;margin:0 auto}
.hole{position:relative;aspect-ratio:1.25;border-radius:50% 50% 22px 22px;background:radial-gradient(ellipse at 50% 85%,#6B4B2E 0 36%,#8FCB6C 37%);overflow:hidden}
.mole{position:absolute;left:50%;bottom:-100%;transform:translateX(-50%);width:88%;background:#fff;border-radius:16px 16px 8px 8px;padding:10px 4px;text-align:center;font-weight:800;font-size:clamp(14px,3vw,19px);box-shadow:0 3px 0 var(--line);transition:bottom .2s}
.mole.up{bottom:18%}
.mole.hit{background:#DDF7EA}.mole.miss{background:#FFE3E1}
.belt{position:relative;height:120px;border-radius:18px;background:repeating-linear-gradient(90deg,#4A5163 0 18px,#3E4556 18px 36px);overflow:hidden;direction:ltr}
.belt::after{content:"";position:absolute;left:0;right:0;bottom:0;height:16px;background:repeating-linear-gradient(90deg,#FFC23D 0 16px,#1D2A48 16px 32px)}
.bcard{position:absolute;top:16px;left:0;background:#fff;border-radius:16px;padding:10px 14px;font-size:clamp(16px,3.2vw,20px);font-weight:700;white-space:nowrap;box-shadow:0 4px 0 rgba(0,0,0,.2)}
.bcard.okc{background:#DDF7EA}.bcard.noc{background:#FFE3E1}
.bins{display:flex;gap:10px;justify-content:center;margin-top:14px;flex-wrap:wrap}
.bin{min-width:120px;padding:12px 18px;border-radius:18px;background:var(--c,#1E9BF0);color:#fff;font-size:21px;font-weight:800;box-shadow:0 5px 0 rgba(0,0,0,.2);display:grid;justify-items:center;gap:2px}
.bin:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.2)}
.bin .be{font-size:30px;line-height:1}
.bin .bc{font-size:13px;background:rgba(255,255,255,.3);border-radius:99px;padding:0 8px}
.sortcard{margin:0 auto;max-width:420px;background:#fff;border-radius:22px;padding:14px;text-align:center;box-shadow:inset 0 0 0 3px var(--line),0 5px 0 var(--line);display:grid;gap:4px}
.sortcard .pic{font-size:56px}
.sortcard .en{font-size:26px;font-weight:700}
.mem{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;max-width:640px;margin:0 auto}
@media (max-width:480px){.mem{grid-template-columns:repeat(3,1fr)}}
.mcard{aspect-ratio:1;perspective:600px}
.mcard .in2{position:relative;width:100%;height:100%;transition:transform .4s;transform-style:preserve-3d}
.mcard.up .in2{transform:rotateY(180deg)}
.mcard .fr,.mcard .bk{position:absolute;inset:0;border-radius:16px;display:grid;place-items:center;backface-visibility:hidden;-webkit-backface-visibility:hidden;padding:4px;text-align:center}
.mcard .fr{background-color:var(--uc);background-image:radial-gradient(rgba(255,255,255,.25) 2px,transparent 2.5px);background-size:14px 14px;color:#fff;font-size:30px;font-weight:800}
.mcard .bk{background:#fff;box-shadow:inset 0 0 0 3px var(--uc);transform:rotateY(180deg);font-size:clamp(14px,3vw,19px);font-weight:700}
.mcard .bk .pic{font-size:clamp(34px,8vw,50px)}
.mcard.got .bk{box-shadow:inset 0 0 0 3px var(--ok);background:#E4F7EC}
.mcols{display:grid;grid-template-columns:1fr 1fr;gap:12px 22px;max-width:700px;margin:0 auto;direction:ltr}
.mcol{display:grid;gap:10px;align-content:start}
.mi{padding:12px;border-radius:16px;background:#fff;box-shadow:inset 0 0 0 3px var(--line),0 3px 0 var(--line);font-size:clamp(16px,3vw,20px);font-weight:700;min-height:56px;text-align:center}
.mi.sel{box-shadow:inset 0 0 0 3px var(--sun),0 3px 0 var(--sun);background:#FFF6D8}
.mi.done{color:#fff;box-shadow:none;background:var(--pc)}
.mi.wrong{animation:shake .4s;background:#FFE3E1}
.slots{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:10px 0 16px;direction:ltr}
.slot{width:44px;height:54px;border-radius:12px;background:var(--sky2);box-shadow:inset 0 -4px 0 var(--line),inset 0 0 0 2px var(--line);display:grid;place-items:center;font-family:'Andika',sans-serif;font-size:28px;font-weight:700}
.slot.gap{width:18px;background:none;box-shadow:none}
.slot.f{background:#fff;box-shadow:inset 0 0 0 3px var(--uc)}
.letters{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;direction:ltr}
.lt{width:52px;height:56px;border-radius:14px;background:var(--sun);font-family:'Andika',sans-serif;font-size:28px;font-weight:700;box-shadow:0 4px 0 var(--sunD)}
.lt.used{opacity:.25;pointer-events:none}
.kb{display:grid;gap:6px;direction:ltr;max-width:640px;margin:10px auto 0}
.kbr{display:flex;gap:5px;justify-content:center}
.kbr button{flex:1;max-width:52px;height:50px;border-radius:12px;background:#fff;box-shadow:inset 0 0 0 2px var(--line),0 3px 0 var(--line);font-family:'Andika',sans-serif;font-size:22px;font-weight:700}
.kbr button.w{max-width:110px;font-size:16px;font-family:inherit}
.typed{text-align:center;font-family:'Andika',sans-serif;font-size:40px;font-weight:700;min-height:60px;letter-spacing:4px;border-bottom:4px dashed var(--line);max-width:420px;margin:0 auto;direction:ltr}
.gapword{font-size:clamp(40px,9vw,64px);font-weight:700;text-align:center;direction:ltr}
.gapword .gp{display:inline-block;min-width:1.6em;border-bottom:5px solid var(--coral);color:var(--coral);margin:0 4px}
.chips{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;direction:ltr}
.chip{padding:10px 18px;border-radius:16px;background:#fff;box-shadow:inset 0 0 0 3px var(--line),0 4px 0 var(--line);font-size:clamp(18px,3.4vw,23px);font-weight:700}
.chip.used{opacity:.25;pointer-events:none}
.chip.right{background:#DDF7EA;box-shadow:inset 0 0 0 3px var(--ok)}
.chip.wrong{background:#FFE3E1;box-shadow:inset 0 0 0 3px var(--bad);animation:shake .4s}
.ansline{min-height:66px;border-radius:18px;background:var(--sky2);box-shadow:inset 0 0 0 2px var(--line);padding:8px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;margin:10px 0 16px;direction:ltr}
.ansline.ok{background:#DDF7EA;box-shadow:inset 0 0 0 3px var(--ok)}
.ansline .chip{box-shadow:inset 0 0 0 3px var(--uc);background:#fff}
.tfcard{max-width:520px;margin:6px auto 16px;border-radius:24px;background:var(--ucs);padding:20px;text-align:center;box-shadow:inset 0 0 0 3px var(--uc);transition:transform .4s,opacity .4s;display:grid;gap:8px;justify-items:center}
.tfcard .qe{font-size:54px}
.tfcard .en{font-size:clamp(20px,4vw,27px);font-weight:700}
.tfcard.goR{transform:translateX(120%) rotate(18deg);opacity:0}.tfcard.goL{transform:translateX(-120%) rotate(-18deg);opacity:0}
.tfbtns{display:flex;gap:14px;justify-content:center;direction:ltr}
.tfb{width:150px;height:74px;border-radius:22px;font-size:22px;font-weight:800;color:#fff;box-shadow:0 5px 0 rgba(0,0,0,.2)}
.tfb.t{background:var(--ok)}.tfb.f{background:var(--bad)}
.oddg{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;max-width:700px;margin:0 auto}
@media (max-width:560px){.oddg{grid-template-columns:repeat(2,1fr)}}
.oddc{border-radius:20px;background:#fff;box-shadow:inset 0 0 0 3px var(--line),0 4px 0 var(--line);padding:12px 6px;display:grid;justify-items:center;gap:2px;font-weight:700;font-size:18px}
.oddc .pic{font-size:44px}
.oddc.right{background:#DDF7EA;box-shadow:inset 0 0 0 3px var(--ok)}.oddc.wrong{background:#FFE3E1;animation:shake .4s}
.reason{text-align:center;margin-top:12px;font-weight:700;font-size:18px;min-height:30px}
.olist{display:grid;gap:10px;max-width:640px;margin:0 auto;direction:ltr}
.oitem{display:flex;gap:10px;align-items:center;padding:12px 14px;border-radius:16px;background:#fff;box-shadow:inset 0 0 0 3px var(--line),0 3px 0 var(--line);font-size:clamp(16px,3vw,19px);font-weight:700;text-align:left}
.oitem .on{width:34px;height:34px;border-radius:50%;background:var(--line);display:grid;place-items:center;flex:none;font-weight:800}
.oitem.done{background:#E4F7EC;box-shadow:inset 0 0 0 3px var(--ok)}
.oitem.done .on{background:var(--ok);color:#fff}
.oitem.wrong{background:#FFE3E1;animation:shake .4s}
.wp{display:flex;flex-wrap:wrap;gap:4px;align-items:center;justify-content:center;font-size:clamp(22px,4.4vw,30px);font-weight:700;direction:ltr;margin:14px 0}
.wp .ins{width:34px;height:34px;border-radius:50%;background:var(--ucs);box-shadow:inset 0 0 0 2px var(--uc);color:var(--uc);font-size:20px;font-weight:800}
.wp .ins.right{background:var(--ok);color:#fff;width:auto;border-radius:10px;padding:0 8px}
.wp .ins.wrong{background:var(--bad);animation:shake .4s}
.floatw{display:inline-block;background:var(--sun);border-radius:14px;padding:4px 14px;font-size:26px;font-weight:700;box-shadow:0 4px 0 var(--sunD)}
.clock{width:min(240px,62vw);aspect-ratio:1;margin:0 auto 14px;display:block;max-width:100%}
.clock .hh,.clock .mh{transition:transform .6s cubic-bezier(.3,1.4,.6,1);transform-origin:100px 100px}
.weekstrip{display:inline-grid;grid-template-columns:repeat(7,auto);gap:4px;direction:ltr;font-size:14px}
.weekstrip span{width:36px;border-radius:10px;background:var(--sky2);box-shadow:inset 0 0 0 2px var(--line);display:grid;justify-items:center;padding:2px 0;font-weight:800}
.weekstrip span i{font-style:normal;font-size:18px;line-height:1.2}
.weekstrip span.y{background:#DDF7EA;box-shadow:inset 0 0 0 2px var(--ok)}
.weekstrip span.y i{color:var(--ok)}
.weekstrip span.n i{color:#C4CCD8}
.th .weekstrip,.fc-pic .weekstrip{font-size:12px}
.fc-pic .weekstrip span{width:clamp(30px,7vw,48px)}
.th .weekstrip{display:none}
.shopbox{display:grid;grid-template-columns:1fr 1.3fr;gap:14px}
@media (max-width:640px){.shopbox{grid-template-columns:1fr}}
.stall{background:linear-gradient(#FFE9B8,#FFF6DE);border-radius:22px;padding:12px;display:grid;gap:8px;align-content:start}
.awning{height:26px;border-radius:12px 12px 0 0;background:repeating-linear-gradient(90deg,#FF6B5A 0 26px,#fff 26px 52px);margin:-12px -12px 4px}
.goods{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;direction:ltr}
.good{background:#fff;border-radius:14px;padding:6px;text-align:center;font-weight:700;font-size:14px}
.good .pic{font-size:34px}
.slist{background:#fff;border-radius:16px;padding:10px 12px;box-shadow:inset 0 0 0 2px var(--line);direction:ltr;text-align:left}
.slist b{display:block;font-size:14px;color:var(--muted)}
.slist div{font-size:18px;font-weight:700}
.slist div.ok{text-decoration:line-through;color:var(--ok)}
.coins{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.coin{width:58px;height:58px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#FFE38A,#E9B530);box-shadow:0 4px 0 #B98A17;font-weight:800;font-size:14px;color:#6B4A00}
.tray{min-height:70px;border-radius:18px;background:var(--sky2);box-shadow:inset 0 0 0 2px var(--line);display:flex;gap:6px;align-items:center;justify-content:center;flex-wrap:wrap;padding:6px;margin:10px 0}
.tray .coin{width:44px;height:44px;font-size:12px}
.spotg{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px;margin-top:6px}
.spoti{border-radius:20px;background:var(--sky2);box-shadow:inset 0 0 0 3px var(--line),0 4px 0 var(--line);padding:10px 6px;display:grid;justify-items:center;gap:2px;min-height:110px;align-content:center}
.spoti .pic{font-size:46px}
.spoti .svgp svg{width:auto;height:auto}
.spoti small{font-weight:700;font-size:14px;color:var(--muted);min-height:20px}
.spoti.right{background:#DDF7EA;box-shadow:inset 0 0 0 3px var(--ok)}.spoti.wrong{background:#FFE3E1;animation:shake .4s}
.promptbar{display:flex;align-items:center;gap:10px;justify-content:center;flex-wrap:wrap;background:var(--ucs);border-radius:18px;padding:10px 14px;margin-bottom:10px}
.promptbar .en{font-size:clamp(19px,3.8vw,25px);font-weight:700}

 {no:'Language booster 2',t:'At the doctor\'s',ar:'عند الطبيب',e:'👩‍⚕️',k:['g'],steps:[

/* ================= app shell ================= */
const PROG=LS.get('dt4a_prog',{});
const pkey=(u,l,s)=>`${UNITS[u].id}.${l}.${s}`;
const lessonStars=(u,l)=>UNITS[u].lessons[l].steps.reduce((a,_,s)=>a+(PROG[pkey(u,l,s)]||0),0);
const lessonMax=(u,l)=>UNITS[u].lessons[l].steps.length*3;
const unitStars=u=>UNITS[u].lessons.reduce((a,_,l)=>a+lessonStars(u,l),0);
const unitMax=u=>UNITS[u].lessons.reduce((a,_,l)=>a+lessonMax(u,l),0);
const totalStars=()=>Object.values(PROG).reduce((a,b)=>a+b,0);
let CUR=null;
const KLAB={p:['🎬','عرض'],a:['✏️','نشاط'],g:['🎮','لعبة']};

function setUnitColor(u){const U=UNITS[u];const app=$('#app');app.style.setProperty('--uc',U?U.c:'#1E9BF0');app.style.setProperty('--ucs',U?U.cs:'#E8F5FF')}
function kill(){if(CUR){CUR.kill();CUR=null}$$('.ov,.gpop,.conf').forEach(o=>o.remove())}
function topbar(title,sub,back){
  $('#top').innerHTML=`${back?`<button class="ibtn back" aria-label="رجوع">→</button>`:`<button class="ibtn home" aria-label="الرئيسية">🧭</button>`}<div class="ttl">${title}${sub?`<small>${sub}</small>`:''}</div><span class="starpill">⭐ <span>${totalStars()}</span></span><button class="ibtn snd" aria-label="تشغيل أو كتم الصوت">${SND.on?'🔊':'🔇'}</button>`;
  if(back)$('#top .back').onclick=back;else $('#top .home').onclick=home;
  $('#top .snd').onclick=()=>{SND.on=!SND.on;LS.set('dt4a_snd',SND.on);$('#top .snd').textContent=SND.on?'🔊':'🔇';if(!SND.on){try{speechSynthesis.cancel()}catch(e){}}else sfx.click()};
}
const view=()=>$('#view');
function go(fn){kill();window.scrollTo(0,0);fn()}

/* ---------- home ---------- */
function home(){go(()=>{setUnitColor(-1);topbar('رحلة الاكتشاف','Discovery Trail · English 4A');
  const tl=UNITS.reduce((a,U)=>a+U.lessons.length,0);
  view().innerHTML=`<section class="hero"><span class="sunball" aria-hidden="true"></span><span class="cloud c1"></span><span class="cloud c2"></span>
    <div class="en-sub en">Team Together Oman · Grade 4A</div>
    <h1>رحلة <span>الاكتشاف</span></h1>
    <p class="sub">كل دروس كتاب الصف الرابع (الفصل الأول): عروض تفاعلية، أنشطة، وألعاب بأفكار جديدة، مع تركيز على الكلمات والقواعد.</p>
    <div class="hstats"><span class="hstat">📚 ${UNITS.length} وحدات</span><span class="hstat">🧩 ${tl} درساً</span><span class="hstat">⭐ ${totalStars()} نجمة</span></div></section>
  <div class="sect">🗺️ الوحدات</div>
  <div class="ugrid">${UNITS.map((U,u)=>{const r=unitMax(u)?unitStars(u)/unitMax(u):0;return`<button class="ucard" data-u="${u}" style="--c:${U.c}"><div class="band"><span class="num en">${esc(U.n)}</span>${U.e}</div><div class="body"><div class="t1 en">${esc(U.t)}</div><div class="t2">${esc(U.ar)}</div><div class="pbar"><i style="width:${Math.round(r*100)}%"></i></div><div class="meta"><span>${U.lessons.length} درساً</span><span>⭐ ${unitStars(u)} / ${unitMax(u)}</span></div></div></button>`}).join('')}</div>
  <div class="sect">🧰 أدوات المراجعة</div>
  <div class="xgrid"><button class="xcard gc" style="--c:#FFF0D1"><span class="ic">📐</span><span><b>ركن القواعد</b><small>كل قواعد الكتاب في مكان واحد</small></span></button>
  <button class="xcard wb" style="--c:#E4F7EC"><span class="ic">📖</span><span><b>بنك الكلمات</b><small>كل الكلمات مع الصوت والمعنى</small></span></button></div>
  <p class="foot">اضغط 🔊 في أي مكان لتسمع النطق. تقدّمك ونجومك تُحفظ على هذا الجهاز.</p>`;
  $('.ugrid').onclick=e=>{const b=e.target.closest('.ucard');if(b){sfx.click();unit(+b.dataset.u)}};
  $('.gc').onclick=()=>{sfx.click();grammarCorner()};$('.wb').onclick=()=>{sfx.click();wordBank()};
})}

/* ---------- unit ---------- */
const GROUPS={main:'📘 الدروس',extra:'🎯 المراجعة والاستعداد',reader:'📚 القصص المصوّرة (Graded readers)'};
function unit(u){go(()=>{const U=UNITS[u];setUnitColor(u);topbar(U.ar,U.n+' · '+U.t,home);
  const groups={};U.lessons.forEach((L,l)=>{(groups[L.g||'main']=groups[L.g||'main']||[]).push(l)});
  view().innerHTML=`<div class="uhead"><span class="big">${U.e}</span><div><p class="en">${esc(U.n)}</p><h2 class="en">${esc(U.t)}</h2><p>${esc(U.ar)} · ⭐ ${unitStars(u)} / ${unitMax(u)}</p></div></div>`+
  Object.keys(GROUPS).filter(g=>groups[g]).map(g=>`<div class="lgroup">${GROUPS[g]}</div><div class="lgrid">${groups[g].map(l=>{const L=U.lessons[l];const st=lessonStars(u,l),mx=lessonMax(u,l);const pct=st/mx;
    return`<button class="lcard" data-l="${l}">${st>=mx*.66?'<span class="done-badge">✓</span>':''}<span class="le">${L.e}</span><span class="ln en">${esc(L.no||'')}</span><span class="lt en">${esc(L.t)}</span><span class="la">${esc(L.ar)}</span>
    <span class="tags">${(L.k||[]).map(k=>`<span class="tag ${k}">${k==='v'?'كلمات':k==='g'?'قواعد':k}</span>`).join('')}<span class="tag">${L.steps.length} مراحل</span></span>
    <span class="lstars">${[0,1,2].map(k=>`<span class="${pct>k/3+.01||(k===0&&st>0)?'on':''}">★</span>`).join('')}</span></button>`}).join('')}</div>`).join('');
  $$('.lcard').forEach(b=>b.onclick=()=>{sfx.click();lesson(u,+b.dataset.l,0)});
})}

/* ---------- lesson ---------- */
function lesson(u,l,s){go(()=>{const U=UNITS[u],L=U.lessons[l];setUnitColor(u);topbar(L.ar,U.n+' · '+(L.no||''),()=>unit(u));
  view().innerHTML=`<div class="lhead"><span class="le">${L.e}</span><div><h2 class="en">${esc(L.t)}</h2><p>${esc(L.ar)}</p></div></div>
  <div class="tabs" role="tablist">${L.steps.map((S,k)=>{const kd=KLAB[KIND[S.x]||'a'];const st=PROG[pkey(u,l,k)]||0;return`<button class="tab ${k===s?'on':''}" data-s="${k}" role="tab"><span>${kd[0]}</span><span>${esc(S.l)}</span><span class="k">${kd[1]}</span>${st?`<span class="ts">${'★'.repeat(st)}</span>`:''}</button>`}).join('')}</div>
  <div class="stage" id="stage"></div>
  <div class="lnav"><button class="btn ghost pvs">→ المرحلة السابقة</button><button class="btn ghost nxs">المرحلة التالية ←</button></div>`;
  $$('.tab').forEach(b=>b.onclick=()=>{sfx.click();lesson(u,l,+b.dataset.s)});
  const on=$('.tab.on');on&&on.scrollIntoView({inline:'center',block:'nearest'});
  $('.pvs').disabled=s===0;$('.pvs').onclick=()=>lesson(u,l,s-1);
  $('.nxs').onclick=()=>nextFrom(u,l,s);
  const S=L.steps[s];const x=mkCtx();CUR=x;
  try{E[S.x]($('#stage'),S.c,(sc,tot)=>{if(!x.alive)return;result(u,l,s,sc,tot)},x)}catch(err){console.error(err);$('#stage').innerHTML='<p>حدث خطأ في هذه المرحلة. انتقل للمرحلة التالية.</p>'}
})}
function nextFrom(u,l,s){const U=UNITS[u];if(s<U.lessons[l].steps.length-1)return lesson(u,l,s+1);if(l<U.lessons.length-1)return lesson(u,l+1,0);unit(u)}

function result(u,l,s,sc,tot){
  const S=UNITS[u].lessons[l].steps[s];const pres=KIND[S.x]==='p';const r=tot?sc/tot:1;const stars=pres?3:r>=.85?3:r>=.55?2:1;
  const k=pkey(u,l,s);if((PROG[k]||0)<stars){PROG[k]=stars;LS.set('dt4a_prog',PROG)}
  const tab=$(`.tab[data-s="${s}"]`);if(tab&&!$('.ts',tab))tab.insertAdjacentHTML('beforeend',`<span class="ts">${'★'.repeat(PROG[k])}</span>`);
  $('#top .starpill span')&&($('#top .starpill span').textContent=totalStars());
  const last=s===UNITS[u].lessons[l].steps.length-1;
  const msg=pres?'أحسنت! أكملت العرض':stars===3?'ممتاز! أداء رائع':stars===2?'جيد جداً! استمر':'محاولة جيدة! جرّب مرة أخرى';
  const ov=document.createElement('div');ov.className='ov';
  ov.innerHTML=`<div class="modal" role="dialog" aria-modal="true"><div class="stars">${[0,1,2].map(j=>`<span class="${j<stars?'on':''}" style="animation-delay:${j*.25}s">⭐</span>`).join('')}</div><h3>${msg}</h3>${pres?'':`<p>النتيجة: ${sc} من ${tot}</p>`}
  <div class="row"><button class="btn ghost rt">🔁 أعد</button><button class="btn go nx">${last?(l<UNITS[u].lessons.length-1?'الدرس التالي ←':'العودة للوحدة'):'المرحلة التالية ←'}</button></div></div>`;
  document.body.append(ov);sfx.win();for(let j=0;j<stars;j++)setTimeout(()=>sfx.star(),300+j*250);if(stars>=2)confetti();
  $('.rt',ov).onclick=()=>{ov.remove();lesson(u,l,s)};$('.nx',ov).onclick=()=>{ov.remove();nextFrom(u,l,s)};
}
function confetti(){const cols=['#FF6B5A','#FFC23D','#22B573','#1E9BF0','#8B5CF6','#EC4899'];for(let i=0;i<34;i++){const d=document.createElement('span');d.className='conf';d.style.left=Math.random()*100+'vw';d.style.background=cols[i%cols.length];d.style.animationDelay=Math.random()*.6+'s';d.style.animationDuration=(1.6+Math.random()*1.2)+'s';document.body.append(d);setTimeout(()=>d.remove(),3400)}}

/* ---------- word bank ---------- */
function allWords(){const out=[];UNITS.forEach((U,u)=>{const seen=new Set();U.lessons.forEach((L,l)=>L.steps.forEach((S,s)=>{if(S.x==='cards')S.c.items.forEach(m=>{if(!seen.has(m.w)){seen.add(m.w);out.push({...m,u,l,s})}})}))});return out}
function wordBank(){go(()=>{setUnitColor(-1);topbar('بنك الكلمات','Word Bank',home);const W=allWords();let f=-1,q='';
  view().innerHTML=`<div class="uhead" style="background-color:#22B573"><span class="big">📖</span><div><h2>بنك الكلمات</h2><p>${W.length} كلمة · اضغط على أي كلمة لتسمعها</p></div></div>
  <input class="search" id="wsearch" placeholder="ابحث بالعربية أو الإنجليزية…" aria-label="بحث"><div class="fchips"><button class="fchip on" data-u="-1">الكل</button>${UNITS.map((U,u)=>`<button class="fchip" data-u="${u}">${U.e} ${esc(U.n)}</button>`).join('')}</div><div class="wgrid"></div>`;
  const draw=()=>{const t=q.trim().toLowerCase();$('.wgrid').innerHTML=W.filter(m=>(f<0||m.u===f)&&(!t||m.w.toLowerCase().includes(t)||(m.a||'').includes(t))).map(m=>`<button class="wcard" data-say="${esc(m.w)}">${pic(m)}<span class="en">${esc(m.w)}</span><small>${esc(m.a||'')}</small></button>`).join('')||'<p>لا توجد نتائج</p>'};
  $('.fchips').onclick=e=>{const b=e.target.closest('.fchip');if(!b)return;f=+b.dataset.u;$$('.fchip').forEach(z=>z.classList.toggle('on',z===b));draw()};
  $('#wsearch').oninput=e=>{q=e.target.value;draw()};draw();
})}

/* ---------- grammar corner ---------- */
function grammarCorner(){go(()=>{setUnitColor(-1);topbar('ركن القواعد','Grammar Corner',home);const G=[];
  UNITS.forEach((U,u)=>U.lessons.forEach((L,l)=>L.steps.forEach((S,s)=>{if(S.x==='grammar')G.push({U,u,l,s,S})})));
  view().innerHTML=`<div class="uhead" style="background-color:#FF9F1C"><span class="big">📐</span><div><h2>ركن القواعد</h2><p>${G.length} قاعدة · اضغط لتفتح الشرح والأمثلة</p></div></div>
  <div class="xgrid">${G.map((g,k)=>`<button class="gcard" data-k="${k}" style="--c:${g.U.c}"><span class="gu en">${esc(g.U.n)} · ${esc(g.U.t)}</span><b class="en">${esc(g.S.c.title)}</b><span style="font-weight:600">${esc(g.S.c.ar.split('.')[0])}.</span><span class="en">${mark(g.S.c.ex[0][0])}</span></button>`).join('')}</div>`;
  $$('.gcard').forEach(b=>b.onclick=()=>{const g=G[+b.dataset.k];sfx.click();lesson(g.u,g.l,g.s)});
})}

/* ---------- global ---------- */
document.addEventListener('click',e=>{const b=e.target.closest('[data-say]');if(b){AC();say(b.dataset.say,{rate:.8});b.classList.add('bounce');setTimeout(()=>b.classList.remove('bounce'),500)}});
document.addEventListener('pointerdown',()=>AC(),{once:true});
UNITS.forEach(U=>{U.cs=U.cs||'#F2F8FF'});
home();

</script>
<script>window.__NAV={"pre": [], "levels": ["button.ucard", "button.lcard", "button.tab"]}</script><script>(function(){var N=window.__NAV,q=new URLSearchParams(location.search).get("go");if(!N||!q)return;
var P=q.split(".").map(Number);if(P.some(isNaN))return;
var steps=(N.pre||[]).map(function(p){return{sel:p.sel,idx:p.idx||0}}).concat(P.map(function(v,i){return{sel:N.levels[i],idx:v}}));
function vis(e){var r=e.getBoundingClientRect(),c=getComputedStyle(e);return r.width>4&&r.height>4&&c.visibility!=="hidden"&&c.display!=="none"}
function run(i){if(i>=steps.length)return;var s=steps[i],t=0;(function w(){var l=[].filter.call(document.querySelectorAll(s.sel),vis);
if(l.length>s.idx){l[s.idx].scrollIntoView({block:"center"});l[s.idx].click();setTimeout(function(){run(i+1)},700)}else if(t++<48)setTimeout(w,250)})()}
function go(){setTimeout(function(){run(0)},900)}if(document.readyState==="complete")go();else addEventListener("load",go)})();</script>
