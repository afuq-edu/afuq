<style>
:root{
  color-scheme:light;
  --sky:#E3F4FF; --sky2:#B7E2F8; --paper:#FFFDF8; --ink:#1E2B47; --ink2:#51607E; --line:#D6E2EE;
  --mint:#23A97F; --mint-l:#D6F3E8; --peach:#F58A2E; --peach-l:#FFE9D4;
  --rose:#E4466F; --rose-l:#FDE1E9; --lav:#7563E8; --lav-l:#E8E4FF; --sun:#FFC933; --sun-l:#FFF3C9;
  --sea:#1E90C8; --sea-l:#D8EEFA; --bad:#E0493E; --good:#1FA971;
  --r:18px; --shadow:0 6px 0 rgba(30,43,71,.10), 0 14px 30px -12px rgba(30,43,71,.25);
  --fd:'Baloo Bhaijaan 2','Noto Naskh Arabic',Tahoma,sans-serif;
  --fb:'Noto Naskh Arabic','Baloo Bhaijaan 2',Tahoma,serif;
  --fq:'Amiri Quran','Noto Naskh Arabic',serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--sky);color:var(--ink);font-family:var(--fd);direction:rtl;
  background-image:radial-gradient(120px 60px at 12% 8%,#fff 60%,transparent 62%),radial-gradient(160px 70px at 80% 4%,#fff 60%,transparent 62%),radial-gradient(90px 40px at 55% 12%,#ffffffcc 60%,transparent 62%),linear-gradient(#CBEBFB,var(--sky) 340px);
  background-repeat:no-repeat;overflow-x:hidden;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;cursor:pointer;color:inherit}
button:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--sea);outline-offset:3px}
.wrap{max-width:1080px;margin:0 auto;padding-inline:16px;padding-block:0 40px}

/* top bar */
.bar{display:flex;align-items:center;gap:10px;padding-block:12px;position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
.bar .brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:clamp(18px,3.2vw,24px);flex:1;min-width:0}
.brand .logo{width:44px;height:44px;flex:none}
.brand small{display:block;font-weight:600;font-size:13px;color:var(--ink2);line-height:1}
.pill{display:inline-flex;align-items:center;gap:6px;background:#fff;border:2px solid var(--line);border-radius:999px;padding:6px 12px;font-weight:700;box-shadow:0 3px 0 rgba(30,43,71,.08)}
.iconbtn{width:44px;height:44px;border-radius:14px;border:2px solid var(--line);background:#fff;display:grid;place-items:center;box-shadow:0 3px 0 rgba(30,43,71,.08);font-size:20px;flex:none}
.iconbtn:active{transform:translateY(2px);box-shadow:none}

/* home */
.hero{display:grid;grid-template-columns:1.3fr 1fr;gap:18px;align-items:center;margin-block:8px 22px}
.hero h1{font-size:clamp(34px,7vw,64px);line-height:1;margin:0;color:var(--rose);letter-spacing:0;text-shadow:0 4px 0 #fff}
.hero h1 span{color:var(--peach)}
.hero p{font-family:var(--fb);font-size:17px;color:var(--ink2);margin:10px 0 0;max-width:46ch}
.hero .art{max-width:100%}
.unit{margin-block:20px}
.unit-h{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.unit-h h2{margin:0;font-size:26px}
.unit-h .n{background:var(--ink);color:#fff;border-radius:12px;padding:2px 12px;font-size:15px}
.unit-h .rule{flex:1;height:3px;background:repeating-linear-gradient(90deg,var(--sky2) 0 10px,transparent 10px 18px);border-radius:3px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.tile{position:relative;text-align:right;border:0;background:var(--paper);border-radius:22px 22px 22px 22px;padding:16px 16px 14px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:8px;min-height:150px;transition:transform .2s}
.tile:hover{transform:translateY(-4px) rotate(-.4deg)}
.tile .tag{align-self:flex-start;font-size:13px;font-weight:700;padding:3px 12px;border-radius:999px;color:#fff;background:var(--c)}
.tile h3{margin:0;font-size:21px;line-height:1.25;color:var(--ink);padding-inline-end:60px}
.tile .stages{display:flex;gap:6px;margin-top:auto}
.tile .st{flex:1;height:8px;border-radius:5px;background:var(--line)}
.tile .st.on{background:var(--c)}
.tile .stars{font-size:14px;color:var(--ink2);font-weight:700}
.tile .ico{position:absolute;left:12px;top:12px;width:52px;height:52px;border-radius:16px;background:var(--cl);display:grid;place-items:center;font-size:28px}

/* lesson screen */
.lhead{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-block:6px 12px}
.lhead h2{margin:0;font-size:clamp(22px,4vw,32px);line-height:1.15}
.lhead .tag{font-size:14px;font-weight:700;padding:4px 12px;border-radius:999px;color:#fff;background:var(--c)}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.step{border:2px solid var(--line);background:#fff;border-radius:16px;padding:8px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:700;font-size:15px;line-height:1.1;position:relative}
.step .i{font-size:22px}
.step small{font-size:12px;color:var(--ink2);font-weight:600}
.step.cur{border-color:var(--c);background:var(--cl);box-shadow:0 4px 0 var(--c)}
.step .done{position:absolute;top:-8px;left:-6px;background:var(--sun);border-radius:999px;font-size:11px;padding:1px 6px;border:2px solid #fff}
.stage{background:var(--paper);border-radius:26px;box-shadow:var(--shadow);padding:18px;min-height:460px;position:relative;overflow:hidden}
.act-h{display:flex;align-items:center;gap:10px;margin-bottom:6px;flex-wrap:wrap}
.act-h h3{margin:0;font-size:24px}
.act-h .kind{font-size:13px;font-weight:700;color:#fff;background:var(--c);border-radius:999px;padding:3px 10px}
.act-p{font-family:var(--fb);font-size:17px;color:var(--ink2);margin:0 0 12px}
.prog{height:12px;background:var(--line);border-radius:8px;overflow:hidden;margin-bottom:12px}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--c),var(--sun));border-radius:8px;transition:width .4s}

/* generic buttons */
.btn{border:0;border-radius:16px;padding:12px 20px;font-weight:800;font-size:18px;background:var(--c,var(--sea));color:#fff;box-shadow:0 5px 0 rgba(0,0,0,.18);transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.18)}
.btn.ghost{background:#fff;color:var(--ink);border:2px solid var(--line);box-shadow:0 4px 0 var(--line)}
.btn[disabled]{opacity:.45;pointer-events:none}
.choice{border:3px solid var(--line);background:#fff;border-radius:16px;padding:12px 14px;font-weight:700;font-size:18px;text-align:center;box-shadow:0 4px 0 var(--line);transition:transform .1s,background .2s}
.choice:hover{transform:translateY(-2px)}
.choice.ok{background:var(--mint-l);border-color:var(--good);box-shadow:0 4px 0 var(--good)}
.choice.no{background:var(--rose-l);border-color:var(--bad);box-shadow:0 4px 0 var(--bad);animation:shake .4s}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.center{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:center}
.q{font-family:var(--fb);font-size:clamp(19px,2.6vw,24px);font-weight:600;line-height:1.7;text-align:center;margin:6px 0 12px}
.quran{font-family:var(--fq);font-size:clamp(22px,3.4vw,32px);line-height:2.1;color:#0F4C3A}
.hint{font-size:14px;color:var(--ink2);font-weight:600}
.feedback{min-height:30px;font-weight:800;font-size:19px;text-align:center}
.feedback.good{color:var(--good)}.feedback.bad{color:var(--bad)}

@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
@keyframes pop{0%{transform:scale(.4);opacity:0}70%{transform:scale(1.08);opacity:1}100%{transform:scale(1)}}
@keyframes rise{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
@keyframes float{50%{transform:translateY(-8px)}}
@keyframes spinIn{from{transform:rotate(-12deg) scale(.6);opacity:0}to{transform:none;opacity:1}}
.pop{animation:pop .45s both}
.rise{animation:rise .5s both}

/* drag */
.drag{touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab}
.drag.dragging{cursor:grabbing;z-index:50;position:relative;transition:none!important;box-shadow:0 18px 30px -10px rgba(0,0,0,.35)}
.drag.back{transition:transform .3s}
[data-drop].over{outline:3px dashed var(--c);outline-offset:3px}

/* slides */
.deck{display:flex;flex-direction:column;gap:12px;min-height:460px}
.slide{flex:1;border-radius:20px;padding:clamp(14px,3vw,30px);background:var(--sbg,#fff);position:relative;overflow:hidden;display:flex;flex-direction:column;gap:14px;animation:rise .45s both}
.slide h4{margin:0;font-size:clamp(22px,3.6vw,34px);line-height:1.2;text-wrap:balance}
.slide .lead{font-family:var(--fb);font-size:clamp(18px,2.4vw,23px);line-height:1.9;margin:0;max-width:62ch}
.slide .eyebrow{font-size:14px;font-weight:700;color:var(--c);letter-spacing:.5px}
.deck-nav{display:flex;align-items:center;gap:10px}
.deck-nav .dots{flex:1;display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.deck-nav .dots i{width:10px;height:10px;border-radius:5px;background:var(--line);transition:.3s}
.deck-nav .dots i.on{width:26px;background:var(--c)}
.cover{align-items:center;justify-content:center;text-align:center;background:linear-gradient(160deg,var(--cl),#fff)}
.cover .big{font-size:clamp(34px,6vw,60px);color:var(--c);margin:0;line-height:1.1}
.cover .badges{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.cover .badges span{background:#fff;border:2px solid var(--cl);border-radius:999px;padding:4px 14px;font-weight:700}
.ayabox{background:#F3FBF4;border:3px solid #BFE3C6;border-radius:18px;padding:14px 18px;text-align:center}
.ayabox .src{font-family:var(--fb);font-size:14px;color:var(--ink2)}
.aya{cursor:pointer;border-radius:10px;transition:background .2s;padding:0 2px}
.aya.hl{background:var(--sun-l)}
.num{display:inline-grid;place-items:center;width:1.5em;height:1.5em;border-radius:50%;border:2px solid #7BC39A;font-size:.55em;font-family:var(--fd);color:#1F7A4F;vertical-align:middle;margin:0 2px}
.hadith{background:#FFF7F2;border:3px solid #F4C9B4;border-radius:18px;padding:16px 20px}
.hadith .t{font-family:var(--fb);font-size:clamp(20px,2.8vw,27px);line-height:1.9;color:#8A2E4B;font-weight:600}
.hadith .src{font-family:var(--fb);font-size:14px;color:var(--ink2);margin-top:6px}
.defbox{background:linear-gradient(180deg,var(--sun-l),#fff);border-radius:40px 40px 18px 18px;padding:22px;text-align:center;font-family:var(--fb);font-size:clamp(20px,2.8vw,26px);line-height:1.8;font-weight:600;border-bottom:4px solid var(--ink)}
.defbox b{color:var(--rose)}
.flips{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.flip{perspective:800px;border:0;background:none;padding:0;min-height:120px}
.flip .in{position:relative;width:100%;height:100%;min-height:120px;transition:transform .6s;transform-style:preserve-3d}
.flip.open .in{transform:rotateY(180deg)}
.flip .f,.flip .b{position:absolute;inset:0;border-radius:16px;display:grid;place-items:center;padding:10px;backface-visibility:hidden;-webkit-backface-visibility:hidden;text-align:center;font-weight:700}
.flip .f{background:var(--c);color:#fff;font-size:22px;box-shadow:0 5px 0 rgba(0,0,0,.15)}
.flip .f::after{content:'اضغط لتعرف';position:absolute;bottom:8px;font-size:12px;opacity:.8}
.flip .b{background:#fff;border:3px solid var(--c);transform:rotateY(180deg);font-family:var(--fb);font-size:18px;line-height:1.6}
.list{display:grid;gap:10px}
.li{display:flex;gap:12px;align-items:center;background:#fff;border-radius:16px;padding:12px 14px;border:2px solid var(--line);font-family:var(--fb);font-size:clamp(17px,2.2vw,21px);font-weight:600;animation:rise .5s both}
.li .ic{width:46px;height:46px;flex:none;border-radius:14px;display:grid;place-items:center;font-size:24px;background:var(--cl)}
.chat{display:flex;flex-direction:column;gap:10px}
.msg{max-width:82%;padding:10px 16px;border-radius:18px;font-family:var(--fb);font-size:clamp(17px,2.2vw,20px);line-height:1.7;animation:pop .4s both;box-shadow:0 3px 0 rgba(0,0,0,.06)}
.msg b{display:block;font-family:var(--fd);font-size:14px;color:var(--c)}
.msg.r{align-self:flex-start;background:#fff;border:2px solid var(--line);border-top-right-radius:4px}
.msg.l{align-self:flex-end;background:var(--cl);border-top-left-radius:4px}
.story{font-family:var(--fb);font-size:clamp(18px,2.3vw,22px);line-height:2;background:#fff;border-radius:18px;padding:16px 20px;border:2px dashed var(--c)}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cmp>div{border-radius:18px;padding:14px;background:#fff;border:3px solid var(--x)}
.cmp h5{margin:0 0 8px;font-size:22px;color:var(--x)}
.cmp ul{margin:0;padding-inline-start:20px;font-family:var(--fb);font-size:18px;line-height:1.9}
.tapnext{align-self:center}
.art-row{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.art-row>svg{flex:none;max-width:100%}
.art-row>div{flex:1;min-width:220px}

/* result */
.result{position:absolute;inset:0;background:rgba(255,253,248,.96);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:30;text-align:center;padding:20px;animation:rise .4s both}
.result .st3{font-size:58px;letter-spacing:6px}
.result .st3 span{display:inline-block;animation:spinIn .5s both;filter:grayscale(1);opacity:.35}
.result .st3 span.on{filter:none;opacity:1}
.result h3{margin:0;font-size:32px}
.result p{margin:0;font-family:var(--fb);font-size:19px;color:var(--ink2)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 20px;border-radius:14px;font-weight:700;z-index:99;animation:rise .3s both;max-width:90vw;text-align:center}
canvas.confetti{position:fixed;inset:0;pointer-events:none;z-index:98;width:100%;height:100%}

@media (max-width:720px){
  .hero{grid-template-columns:1fr}
  .hero .art{display:none}
  .steps{gap:5px}.step{font-size:13px;padding:6px 2px}.step small{display:none}
  .stage{padding:12px;border-radius:20px}
  .cmp{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

<script>
/* ===== core helpers ===== */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
function h(tag,attrs,...kids){
  const el=document.createElement(tag);
  if(attrs)for(const k in attrs){
    const v=attrs[k];
    if(v==null||v===false)continue;
    if(k==='class')el.className=v;
    else if(k==='html')el.innerHTML=v;
    else if(k==='style'&&typeof v==='object')Object.assign(el.style,v);
    else if(k.startsWith('on'))el.addEventListener(k.slice(2),v);
    else el.setAttribute(k,v===true?'':v);
  }
  for(const k of kids.flat()){if(k==null||k===false)continue;el.append(k.nodeType?k:document.createTextNode(k));}
  return el;
}
function css(s){document.head.append(h('style',{html:s}));}
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}return a;};
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const pick=a=>a[Math.random()*a.length|0];

/* ===== sound (WebAudio synth) ===== */
const SND={on:true,ctx:null};
function ac(){if(!SND.ctx){try{SND.ctx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(SND.ctx&&SND.ctx.state==='suspended')SND.ctx.resume();return SND.ctx;}
function tone(f,d=.15,type='sine',v=.18,when=0,slide=0){
  if(!SND.on)return;const c=ac();if(!c)return;
  const t=c.currentTime+when,o=c.createOscillator(),g=c.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t+d);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.01);g.gain.exponentialRampToValueAtTime(.001,t+d);
  o.connect(g).connect(c.destination);o.start(t);o.stop(t+d+.05);
}
function noise(d=.2,v=.2,filt=1200,when=0){
  if(!SND.on)return;const c=ac();if(!c)return;
  const len=c.sampleRate*d,b=c.createBuffer(1,len,c.sampleRate),data=b.getChannelData(0);
  for(let i=0;i<len;i++)data[i]=(Math.random()*2-1)*(1-i/len);
  const s=c.createBufferSource(),f=c.createBiquadFilter(),g=c.createGain();
  s.buffer=b;f.type='lowpass';f.frequency.value=filt;g.gain.value=v;s.connect(f).connect(g).connect(c.destination);s.start(c.currentTime+when);
}
const sfx={
  tap(){tone(660,.07,'triangle',.12)},
  ok(){tone(523,.12,'triangle',.2);tone(659,.12,'triangle',.2,.09);tone(784,.22,'triangle',.2,.18)},
  bad(){tone(220,.22,'sawtooth',.1);tone(170,.3,'sawtooth',.1,.12)},
  pop(){tone(900,.08,'sine',.2,0,-500)},
  whoosh(){noise(.3,.12,2200)},
  win(){[523,659,784,1046,784,1046].forEach((f,i)=>tone(f,.2,'triangle',.18,i*.11))},
  flip(){tone(420,.06,'square',.06);tone(620,.06,'square',.05,.05)},
  drip(){tone(1300,.12,'sine',.2,0,-900)},
  knock(){noise(.08,.5,500);noise(.08,.5,500,.18)},
  stamp(){noise(.12,.6,300);tone(90,.15,'sine',.3)},
  step(){tone(300,.05,'triangle',.1)},
  spin(){for(let i=0;i<10;i++)tone(700+i*20,.03,'square',.04,i*.05)},
  dig(){noise(.15,.35,700)},
  bell(){tone(1320,.5,'sine',.15);tone(1760,.5,'sine',.08,.02)},
  rope(){noise(.25,.2,900);tone(160,.2,'triangle',.1)},
  unlock(){tone(880,.08,'square',.08);tone(1180,.12,'square',.08,.08)},
  splash(){noise(.35,.25,1800)}
};

/* ===== store ===== */
const KEY='dh4-stars-v1';let STORE={};
try{STORE=JSON.parse(localStorage.getItem(KEY)||'{}')||{};}catch(e){STORE={};}
function saveStars(id,stage,n){const k=id+':'+stage;if((STORE[k]||0)<n){STORE[k]=n;try{localStorage.setItem(KEY,JSON.stringify(STORE));}catch(e){}}updTotal();}
const getStars=(id,stage)=>STORE[id+':'+stage]||0;
function updTotal(){const t=Object.values(STORE).reduce((a,b)=>a+b,0);const el=$('#totalStars');if(el)el.textContent=toAr(t);}

/* ===== confetti & toast ===== */
function confetti(n=120){
  const cv=h('canvas',{class:'confetti'});document.body.append(cv);
  const x=cv.getContext('2d');cv.width=innerWidth;cv.height=innerHeight;
  const cols=['#E4466F','#F58A2E','#FFC933','#23A97F','#7563E8','#1E90C8'];
  const P=Array.from({length:n},()=>({x:innerWidth/2+(Math.random()-.5)*200,y:innerHeight*.35,vx:(Math.random()-.5)*14,vy:-Math.random()*14-4,s:6+Math.random()*7,c:pick(cols),r:Math.random()*6,vr:(Math.random()-.5)*.3}));
  let t=0;(function fr(){x.clearRect(0,0,cv.width,cv.height);P.forEach(p=>{p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);x.restore();});if(++t<150)requestAnimationFrame(fr);else cv.remove();})();

/* ===== pointer drag helper ===== */
function draggable(el,{onDrop,onMove,onStart}={}){
  el.classList.add('drag');
  let sx,sy,ox=0,oy=0,over=null,active=false;
  el.addEventListener('pointerdown',e=>{
    if(el.dataset.locked)return;e.preventDefault();active=true;
    el.setPointerCapture(e.pointerId);sx=e.clientX;sy=e.clientY;el.classList.remove('back');el.classList.add('dragging');sfx.tap();onStart&&onStart(el);
  });
  el.addEventListener('pointermove',e=>{
    if(!active)return;ox=e.clientX-sx;oy=e.clientY-sy;el.style.transform=`translate(${ox}px,${oy}px) scale(1.05)`;
    el.style.pointerEvents='none';const t=document.elementFromPoint(e.clientX,e.clientY);el.style.pointerEvents='';
    const d=t&&t.closest('[data-drop]');if(d!==over){over&&over.classList.remove('over');over=d;over&&over.classList.add('over');}
    onMove&&onMove(e,el);
  });
  const end=e=>{
    if(!active)return;active=false;el.classList.remove('dragging');over&&over.classList.remove('over');
    const target=over;over=null;
    const keep=onDrop?onDrop(target,el,e):false;
    if(!keep){el.classList.add('back');el.style.transform='';}
  };
  el.addEventListener('pointerup',end);el.addEventListener('pointercancel',end);
}

        s.art?h('div',{html:s.art}):null,
        h('h4',{class:'big'},L.title),
        s.sub?h('p',{class:'lead',style:{margin:'0 auto'}},s.sub):null,
        s.badges?h('div',{class:'badges'},s.badges.map(b=>h('span',null,b))):null);break;

function runDeck(box,L,done){
  let i=0;const deck=h('div',{class:'deck'});const holder=h('div',{style:{display:'flex',flex:'1'}});
  const dots=h('div',{class:'dots'},L.slides.map(()=>h('i')));

  const next=h('button',{class:'btn',onclick(){if(i<L.slides.length-1)go(i+1);else done(1,1);}},'التالي ←');
  const cnt=h('span',{class:'hint'});
  deck.append(holder,h('div',{class:'deck-nav'},prev,dots,cnt,next));box.append(deck);
  function go(n){if(n<0||n>=L.slides.length)return;i=n;holder.innerHTML='';holder.append(renderSlide(L.slides[i],L));
    $$('i',dots).forEach((d,k)=>d.classList.toggle('on',k===i));prev.disabled=i===0;next.textContent=i===L.slides.length-1?'أنهيت العرض ✓':'التالي ←';cnt.textContent=toAr(i+1)+' / '+toAr(L.slides.length);if(n)sfx.whoosh();}
  let tx=null;holder.addEventListener('touchstart',e=>{tx=e.touches[0].clientX},{passive:true});
  holder.addEventListener('touchend',e=>{if(tx==null)return;const dx=e.changedTouches[0].clientX-tx;if(Math.abs(dx)>70){dx>0?go(i+1):go(i-1);}tx=null;});
  deck._key=e=>{if(e.key==='ArrowLeft')go(i+1);if(e.key==='ArrowRight')go(i-1);};
  document.addEventListener('keydown',deck._key);box._cleanup=()=>document.removeEventListener('keydown',deck._key);
  go(0);
}

  game:{title:'صحيفة الأعمال',intro:'حرّك الصحيفة يميناً ويساراً (بإصبعك أو بالأسهم) لتلتقط الأعمال الصالحة، وابتعد عن الأعمال السيئة!',
    run(el,A){
      const G=[['🤲','الصلاة'],['💝','الصدقة'],['😊','الابتسامة'],['📖','قراءة القرآن'],['🤝','مساعدة الناس'],['👵','برّ الوالدين'],['🗣️','الصدق'],['🌱','الإحسان']];
      const B=[['🤥','الكذب'],['💢','الظلم'],['⚖️','التطفيف'],['🙊','الغيبة'],['😠','السخرية']];
      const play=h('div',{class:'play'});const hud=h('div',{class:'hud'},h('span',null,'⭐ ',h('b',{id:'sc'},'٠')),h('span',null,'⏱️ ',h('b',{id:'tm'},'٤٠')));
      const bask=h('div',{class:'basket'},'صحيفتي');play.append(hud,bask);
      const start=h('button',{class:'btn',onclick:begin},'▶ ابدأ اللعبة');el.append(play,h('div',{class:'row',style:{marginTop:'10px'}},start));
      let bx=.5,items=[],score=0,run=false,t0=0,last=0,spawnT=0,raf;const TOTAL=40,TARGET=14;
      const W=()=>play.clientWidth,H=()=>play.clientHeight;
      function setX(x){bx=Math.max(.08,Math.min(.92,x));bask.style.left=(bx*100)+'%';}
      play.addEventListener('pointermove',e=>{if(!run)return;const r=play.getBoundingClientRect();setX((e.clientX-r.left)/r.width);});
      play.addEventListener('pointerdown',e=>{const r=play.getBoundingClientRect();setX((e.clientX-r.left)/r.width);});
      const key=e=>{if(!run)return;if(e.key==='ArrowLeft')setX(bx-.07);if(e.key==='ArrowRight')setX(bx+.07);};document.addEventListener('keydown',key);
      A.onStop(()=>{run=false;cancelAnimationFrame(raf);document.removeEventListener('keydown',key);});
      function spawn(){const good=Math.random()<.62;const [e,l]=good?pick(G):pick(B);const d=h('div',{class:'fall '+(good?'good':'bad')},e,h('small',null,l));
        const it={el:d,x:.08+Math.random()*.84,y:-50,v:90+Math.random()*70+score*3,good};d.style.left=(it.x*100)+'%';d.style.marginLeft='-24px';play.append(d);items.push(it);}
      function begin(){start.remove();run=true;t0=performance.now();last=t0;sfx.tap();raf=requestAnimationFrame(loop);}
      function loop(t){if(!run)return;const dt=(t-last)/1000;last=t;spawnT-=dt;if(spawnT<=0){spawn();spawnT=.9-Math.min(.4,score*.02);}
        const left=Math.max(0,TOTAL-(t-t0)/1000);$('#tm',play).textContent=toAr(Math.ceil(left));
        const by=H()-70;items=items.filter(it=>{it.y+=it.v*dt;it.el.style.transform=`translateY(${it.y}px)`;
          if(it.y>by-40&&it.y<by+10&&Math.abs(it.x-bx)*W()<70){it.el.remove();
            if(it.good){score++;sfx.pop();boom('+١','var(--good)',it);}else{score=Math.max(0,score-1);sfx.bad();boom('−١','var(--bad)',it);bask.style.animation='shake .4s';setTimeout(()=>bask.style.animation='',400);}
            $('#sc',play).textContent=toAr(score);A.prog(Math.min(score,TARGET),TARGET);return false;}
          if(it.y>H()){it.el.remove();return false;}return true;});
        if(left<=0||score>=TARGET){run=false;items.forEach(i=>i.el.remove());A.done(Math.min(score,TARGET),TARGET,'كل عملٍ مكتوبٌ في صحيفتك، والله تعالى يجازي عليه يوم الحساب.');return;}
        raf=requestAnimationFrame(loop);}
      function boom(t,c,it){const p=h('div',{class:'plus',style:{left:(it.x*100)+'%',bottom:'80px',color:c}},t);play.append(p);setTimeout(()=>p.remove(),600);}
    }}

  post:{title:'قلم التمييز',intro:'اختر القلم، ثم اضغط على العبارة في القصة: <b>الأحمر</b> للمبطل و<b>البرتقالي</b> للمكروه. ابحث عن أربع عبارات.',
    run(el,A){
      const P=[['زارت بثينة صديقتها عزّة عصراً للاطمئنان على صحتها،',0],[' وبعد سماع الأذان ذهبت الصديقتان للوضوء،',0],[' ووقفتا أمام المغسلة تتوضآن',2,'الوقوف أثناء الوضوء'],[' وهما تتحدثان عن الدروس والواجبات.',2,'الكلام أثناء الوضوء'],[' وبعد أن انتهتا من الوضوء دخلتا الغرفة للصلاة،',0],[' فجأةً شعرت عزّة بالرغبة في التقيؤ فأسرعت لتتقيأ.',1,'القيء'],[' وفي هذه الأثناء سمعت بثينة أخ عزّة الرضيع يبكي،',0],[' فذهبت مسرعةً لتحمله،',0],[' فارتطم قدمها بالباب وسال الدم منها.',1,'سيلان الدم']];
      let pen=1,got=0,miss=0;const pens=h('div',{class:'pens'});
      const p1=h('button',{class:'pen on',style:{background:'#E0493E'},onclick(){pen=1;p1.classList.add('on');p2.classList.remove('on');sfx.tap();}},'🖍️ مُبطِل');
      const p2=h('button',{class:'pen',style:{background:'#F58A2E'},onclick(){pen=2;p2.classList.add('on');p1.classList.remove('on');sfx.tap();}},'🖍️ مكروه');
      pens.append(p1,p2);const st=h('div',{class:'hstory'});const f=fb();el.append(pens,st,f);
      P.forEach(([t,k,n])=>{const s=h('span',{class:'ph',onclick(){if(s.dataset.done)return;
        if(k===0){miss++;sfx.bad();s.classList.add('wrong');setTimeout(()=>s.classList.remove('wrong'),400);f.say('هذه العبارة لا تتعلّق بمبطل أو مكروه.',false);return;}
        if(k!==pen){miss++;sfx.bad();f.say(k===1?'تأمل جيداً: هذا يُبطل الوضوء، استخدم القلم الأحمر.':'تأمل جيداً: هذا لا يُبطل الوضوء بل مكروه، استخدم البرتقالي.',false);return;}
        s.dataset.done=1;s.classList.add('m'+k);sfx.stamp();got++;A.prog(got,4);f.say((k===1?'مبطل: ':'مكروه: ')+n+' ✔',true);
        if(got===4)setTimeout(()=>A.done(Math.max(1,4-Math.floor(miss/2)),4,'المبطلات: القيء وسيلان الدم. المكروهات: الوقوف والكلام أثناء الوضوء.'),1000);}},t);st.append(s);});
    }},
  game:{title:'أغلِق الصنبور!',intro:'الصنابير تُفتح بسرعة! اضغط الصنبور الأحمر الذي يحمل <b>مكروهاً</b> لتُغلقه، ولا تضغط الأخضر (من الوضوء الصحيح).',
    run(el,A){
      const BAD=['الكلام أثناء الوضوء','الإسراف في الماء','الوضوء في مكانٍ نجس','الوقوف أثناء الوضوء'];
      const GOOD=['البسملة','غسل الوجه','المضمضة','غسل اليدين إلى المرفقين','مسح الرأس','غسل الرجلين'];
      const grid=h('div',{class:'taps'});const cells=[];
      for(let i=0;i<6;i++){const c=h('div',{class:'tapc'},h('div',{class:'fau'},'🚰'),h('div',{class:'stream'}),h('div',{class:'lbl'}));c.addEventListener('pointerdown',()=>hit(i));cells.push({el:c,up:false,bad:false,t:0});grid.append(c);}
      const tank=h('div',{class:'tank'},h('i'),h('b',null,'💧 الماء المُهدَر'));
      const hud=h('div',{class:'row',style:{marginBottom:'10px'}},h('span',{class:'pill'},'⭐ ',h('b',{id:'s4'},'٠')),h('span',{class:'pill'},'⏱️ ',h('b',{id:'t4'},'٣٥')));
      const start=h('button',{class:'btn',onclick:begin},'▶ ابدأ');el.append(hud,grid,tank,h('div',{class:'row',style:{marginTop:'10px'}},start));
      let score=0,waste=0,run=false,t0,timer,tick;const TOTAL=35,TARGET=14;
      A.onStop(()=>{run=false;clearInterval(timer);clearInterval(tick);});
      function hit(i){if(!run)return;const c=cells[i];if(!c.up)return;c.up=false;c.el.classList.remove('up');
        if(c.bad){score++;sfx.pop();c.el.classList.add('hitok');}else{score=Math.max(0,score-1);sfx.bad();c.el.classList.add('hitno');}
        setTimeout(()=>c.el.classList.remove('hitok','hitno'),300);$('#s4',el).textContent=toAr(score);A.prog(Math.min(score,TARGET),TARGET);if(score>=TARGET)end();}
      function open(){const free=cells.filter(c=>!c.up);if(!free.length)return;const c=pick(free);c.bad=Math.random()<.6;c.up=true;c.t=Date.now();
        c.el.className='tapc up '+(c.bad?'bad':'good');$('.lbl',c.el).textContent=c.bad?pick(BAD):pick(GOOD);if(c.bad)sfx.drip();
        const life=1700-Math.min(700,score*40);setTimeout(()=>{if(c.up&&Date.now()-c.t>=life-20){c.up=false;c.el.classList.remove('up');if(c.bad){waste=Math.min(100,waste+10);$('i',tank).style.width=waste+'%';sfx.splash();}}},life);}
      function begin(){start.remove();run=true;t0=Date.now();timer=setInterval(open,650);
        tick=setInterval(()=>{const l=Math.max(0,TOTAL-(Date.now()-t0)/1000);$('#t4',el).textContent=toAr(Math.ceil(l));if(l<=0)end();},250);}
      function end(){if(!run)return;run=false;clearInterval(timer);clearInterval(tick);A.done(Math.min(score,TARGET),TARGET,'أحافظ على الماء، وأتجنّب مكروهات الوضوء لأنال الثواب.');}
    }}

css(`
.who{display:grid;grid-template-columns:minmax(180px,240px) 1fr;gap:18px;align-items:start}
.sil{aspect-ratio:3/4;border-radius:22px;background:linear-gradient(160deg,#2E3B5E,#58689A);display:grid;place-items:center;font-size:110px;color:#fff;position:relative;overflow:hidden;max-width:100%}
.sil b{font-size:26px;position:absolute;bottom:14px}
.sil.rev{background:linear-gradient(160deg,var(--mint),#7FD6B5)}
.clues{display:grid;gap:8px}
.clue{background:#fff;border:2px solid var(--line);border-radius:14px;padding:10px 14px;font-family:var(--fb);font-size:19px;font-weight:600;animation:rise .4s both;display:flex;gap:10px;align-items:center}
.clue i{font-style:normal;background:var(--c);color:#fff;border-radius:10px;min-width:30px;height:30px;display:grid;place-items:center;font-size:15px}
.tl{position:relative;display:grid;gap:8px;padding-inline-start:34px;margin-bottom:14px}
.tl::before{content:'';position:absolute;right:13px;top:6px;bottom:6px;width:4px;background:repeating-linear-gradient(var(--c) 0 8px,transparent 8px 14px);border-radius:3px}
.tl .slot{position:relative;min-height:44px;border-radius:14px;border:2px dashed var(--line);display:flex;align-items:center;padding:6px 12px;font-family:var(--fb);font-size:18px;font-weight:600;color:var(--ink2)}
.tl .slot::before{content:attr(data-n);position:absolute;right:-34px;width:30px;height:30px;border-radius:50%;background:#fff;border:3px solid var(--c);display:grid;place-items:center;font-family:var(--fd);font-size:14px;color:var(--c)}
.tl .slot.fill{border-style:solid;border-color:var(--c);background:var(--cl);color:var(--ink);animation:pop .4s both}
.pool{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px}
.ev{border:2px solid var(--line);background:#fff;border-radius:14px;padding:10px 12px;font-family:var(--fb);font-size:17px;font-weight:600;text-align:right;box-shadow:0 3px 0 var(--line)}
.ev.no{animation:shake .4s;border-color:var(--bad)}
.reveal{display:grid;grid-template-columns:minmax(220px,380px) 1fr;gap:18px;align-items:start}

.pic svg{width:100%;height:100%;display:block}
.tiles{position:absolute;inset:0;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr)}
.tiles div{background:var(--c);border:2px solid rgba(255,255,255,.5);display:grid;place-items:center;color:#fff;font-size:28px;font-weight:800;transition:transform .6s,opacity .6s}
.tiles div:nth-child(even){filter:brightness(1.12)}
.tiles div.off{transform:rotateY(90deg) scale(.6);opacity:0}
@media (max-width:640px){.who,.reveal{grid-template-columns:1fr}.sil{max-width:200px;margin:auto}}

css(`
.scn{display:grid;grid-template-columns:minmax(150px,220px) 1fr;gap:16px;align-items:center;background:linear-gradient(160deg,var(--cl),#fff);border-radius:20px;padding:16px}
.scn .pic{font-size:74px;text-align:center;line-height:1.2;aspect-ratio:auto}
.scn p{font-family:var(--fb);font-size:clamp(18px,2.4vw,22px);line-height:1.9;margin:0}
.scn .opts{display:grid;gap:10px;margin-top:12px}
.path{display:flex;gap:6px;justify-content:center;margin-bottom:10px}
.path i{width:34px;height:8px;border-radius:4px;background:var(--line)}
.path i.g{background:var(--good)}.path i.b{background:var(--bad)}
.link-wrap{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:60px}
.link-wrap svg.lines{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.lcol{display:grid;gap:10px}
.lnk{border:3px solid var(--line);background:#fff;border-radius:16px;padding:10px 12px;display:flex;align-items:center;gap:10px;font-family:var(--fb);font-size:17px;font-weight:600;min-height:66px;text-align:right;position:relative}
.lnk .em{font-size:32px;flex:none}
.lnk.sel{border-color:var(--sun);box-shadow:0 0 0 4px var(--sun-l)}
.lnk.done{border-color:var(--good);background:var(--mint-l)}
.lnk.no{animation:shake .4s;border-color:var(--bad)}
.lnk::after{content:'';position:absolute;top:50%;width:14px;height:14px;border-radius:50%;background:var(--c);transform:translateY(-50%)}
.lcol.a .lnk::after{left:-8px}.lcol.b .lnk::after{right:-8px}
.house{display:grid;grid-template-columns:minmax(170px,240px) 1fr;gap:16px;align-items:center}
.doorbox{position:relative;aspect-ratio:3/4;max-width:240px;width:100%;margin:auto;background:#F4E1C1;border-radius:120px 120px 10px 10px;border:8px solid #C78B4F;overflow:hidden;perspective:600px}
.doorbox .inside{position:absolute;inset:0;display:grid;place-items:center;font-size:60px;background:#FFF6E3}
.doorbox .door{position:absolute;inset:0;background:linear-gradient(90deg,#3E8C9B,#2F7482);transform-origin:left center;transition:transform .8s;border-radius:110px 110px 0 0;display:grid;place-items:center}
.doorbox .door::after{content:'';position:absolute;right:16%;top:55%;width:14px;height:14px;border-radius:50%;background:#FFC933}
.doorbox .door .win{width:50%;aspect-ratio:1;border-radius:50% 50% 6px 6px;border:5px solid #FFC933;opacity:.6}
.doorbox.open .door{transform:rotateY(-75deg)}
.doorbox.shake{animation:shake .4s}
.speech{background:#fff;border:3px solid var(--c);border-radius:18px;padding:10px 14px;font-family:var(--fb);font-size:20px;font-weight:600;animation:pop .4s both;line-height:1.7}
.vtitle{font-weight:800;font-size:20px;color:var(--c)}
@media (max-width:640px){.scn,.house{grid-template-columns:1fr}.link-wrap{gap:26px}.lnk{font-size:15px;min-height:60px}.lnk .em{font-size:26px}}
`);

  game:{title:'كلمتا السرّ',intro:'ابحث عن الكلمات في الشبكة: اسحب إصبعك على حروف الكلمة (أفقياً أو عمودياً). بعد إيجادها كلها تظهر كلمتا السرّ!',
    run(el,A){
      const WORDS=['خويلد','علي','الجنة','نساء','الحسين','طالب','أبي','سيدة','بن','بنت','خديجة'];const SECRET=[...'فاطمةالزهراء'];
      const R=6,C=11;let grid,placed;
      function build(){for(let tries=0;tries<400;tries++){grid=Array.from({length:R},()=>Array(C).fill(null));placed=[];let ok=true;
        for(const w of [...WORDS].sort((a,b)=>b.length-a.length)){const L=[...w];let done=false;
          for(let t=0;t<300&&!done;t++){const v=Math.random()<.35&&L.length<=R;const r=Math.random()*(v?R-L.length+1:R)|0,c=Math.random()*(v?C:C-L.length+1)|0;
            const cells=L.map((_,i)=>v?[r+i,c]:[r,c+i]);
            if(cells.every(([y,x],i)=>grid[y][x]===null)){cells.forEach(([y,x],i)=>grid[y][x]=L[i]);placed.push({w,cells});done=true;}}
          if(!done){ok=false;break;}}
        if(!ok)continue;const empty=[];for(let y=0;y<R;y++)for(let x=0;x<C;x++)if(grid[y][x]===null)empty.push([y,x]);
        if(empty.length<SECRET.length)continue;empty.forEach(([y,x],i)=>grid[y][x]=i<SECRET.length?{s:SECRET[i]}:{g:1});return;}}
      build();
      const ws=h('div',{class:'ws',style:{gridTemplateColumns:`repeat(${C},1fr)`}});const cellEl=[];
      for(let y=0;y<R;y++){cellEl[y]=[];for(let x=0;x<C;x++){const v=grid[y][x];const t=typeof v==='string'?v:v.s||'';const d=h('div',{class:'cl'+(v&&v.g?' gray':''),'data-y':y,'data-x':x},t);cellEl[y][x]=d;ws.append(d);}}
      const wl=h('div',{class:'wl'},WORDS.map(w=>h('span',{'data-w':w},w)));const f=fb();
      const hintB=h('button',{class:'btn ghost',onclick(){const p=placed.find(p=>!p.found);if(p){hintUsed++;mark(p,'#9AA3B5');}}},'💡 اكشف كلمة');
      el.append(wl,ws,h('div',{class:'row',style:{marginTop:'10px'}},hintB),f);
      const cols=['#E4466F','#23A97F','#7563E8','#F58A2E','#1E90C8','#D1478F'];let found=0,hintUsed=0,start=null,path=[];
      function mark(p,col,extra){p.found=true;[...p.cells,...(extra||[])].forEach(([y,x])=>{const c=cellEl[y][x];c.classList.add('fd');c.style.background=col;});$(`[data-w="${p.w}"]`,wl).classList.add('ok');found++;A.prog(found,WORDS.length+1);if(found===WORDS.length)secret();}
      function line(a,b){const [y1,x1]=a,[y2,x2]=b;if(y1!==y2&&x1!==x2)return[a];const n=Math.max(Math.abs(y2-y1),Math.abs(x2-x1));const out=[];for(let i=0;i<=n;i++)out.push([y1+Math.sign(y2-y1)*i,x1+Math.sign(x2-x1)*i]);return out;}
      function paint(){$$('.cl.sel',ws).forEach(c=>c.classList.remove('sel'));path.forEach(([y,x])=>cellEl[y][x].classList.add('sel'));}
      const at=e=>{const t=document.elementFromPoint(e.clientX,e.clientY);return t&&t.classList&&t.classList.contains('cl')?[+t.dataset.y,+t.dataset.x]:null;};
      ws.addEventListener('pointerdown',e=>{const p=at(e);if(!p)return;e.preventDefault();start=p;path=[p];paint();sfx.tap();ws.setPointerCapture(e.pointerId);});
      ws.addEventListener('pointermove',e=>{if(!start)return;const p=at(e);if(p){path=line(start,p);paint();}});
      ws.addEventListener('pointerup',()=>{if(!start)return;const str=path.map(([y,x])=>typeof grid[y][x]==='string'?grid[y][x]:'#').join('');const rts=[...str].reverse().join('');
        const p=placed.find(p=>!p.found&&(p.w===str||p.w===rts));
        if(p){sfx.ok();mark(p,cols[found%cols.length],path);f.say('وجدت: '+p.w,true);}else if(path.length>1){sfx.bad();}
        start=null;path=[];paint();});
      function secret(){hintB.remove();for(let y=0;y<R;y++)for(let x=0;x<C;x++){const v=grid[y][x];if(v&&v.s)cellEl[y][x].classList.add('secret');}
        sfx.bell();f.say('الحروف المتبقية الملوّنة بالوردي تكوّن كلمتي السرّ! اقرأها بالترتيب:',true);
        const o=h('div',{class:'choices',style:{marginTop:'8px'}});el.append(o);
        shuffle(['فاطمة الزهراء','خديجة الكبرى','سيدة النساء']).forEach(t=>{const b=h('button',{class:'choice',onclick(){$$('button',o).forEach(x=>x.disabled=true);
          const ok=t==='فاطمة الزهراء';b.classList.add(ok?'ok':'no');ok?sfx.ok():sfx.bad();A.prog(1,1);
          setTimeout(()=>A.done(WORDS.length-hintUsed+(ok?1:0),WORDS.length+1,'كلمتا السرّ: <b>فاطمة الزهراء</b> ﵂'),900);}},t);o.append(b);});}
    }}

      const Q=shuffle([['تجنّب الحكم على نيّات الناس يعينني على حُسن الظن.',1],['الشكّ في تصرّفات الآخرين يعينني على حُسن الظن.',0],['التماس الأعذار للآخرين من حُسن الظن.',1],['تحليل أقوال الناس وأفعالهم وفق أهوائي من حُسن الظن.',0],['حُسن الظن: توقّع الخير من الناس.',1],['أمرنا الله تعالى باجتناب كثيرٍ من الظن.',1],['قال: «لعلّ زميلي لم يسمعني» ← هذا حُسن ظن.',1],['قال: «زميلي لم يردّ لأنه يتكبّر عليّ» ← هذا حُسن ظن.',0],['سوء الظن يقوّي العلاقة بين الأصدقاء.',0],['﴿ إِنَّ بَعْضَ الظَّنِّ إِثْمٌ ﴾',1],['إذا تأخّر صديقي أقول: لعلّ له عذراً.',1],['رأيت زميلين يضحكان فقلت: يضحكان عليّ حتماً ← حُسن ظن.',0]]);
      const B=Array(9).fill(null);let qi=0,correct=0,answered=0,lock=false;
      const cells=Array.from({length:9},(_,i)=>h('button',{class:'q',onclick(){pickCell(i)}}));const board=h('div',{class:'ttt'},cells);
      const side=h('div',{style:{display:'grid',gap:'10px'}},h('div',{class:'hint'},'اختر مربعاً فارغاً لتبدأ.'));
      el.append(h('div',{class:'legend'},h('span',{class:'pill'},'⭐ أنت'),h('span',{class:'pill'},'☁️ الحاسوب')),h('div',{class:'tttwrap'},board,side));
      const LINES=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
      const winner=()=>{for(const l of LINES){const [a,b,c]=l;if(B[a]&&B[a]===B[b]&&B[a]===B[c])return [B[a],l];}return B.every(x=>x)?['draw',[]]:null;};
      function set(i,who){B[i]=who;cells[i].className=who;cells[i].textContent=who==='me'?'⭐':'☁️';sfx.pop();}
      function pickCell(i){if(lock||B[i])return;lock=true;cells[i].style.outline='4px solid var(--sun)';const [q,a]=Q[qi++%Q.length];side.innerHTML='';const f=fb();
        side.append(h('div',{class:'bcard',style:{fontSize:'19px'}},q),h('div',{class:'row'},h('button',{class:'btn',style:{background:'var(--good)'},onclick(){ans(1)}},'✓ صحيحة'),h('button',{class:'btn',style:{background:'var(--bad)'},onclick(){ans(0)}},'✗ خاطئة')),f);
        function ans(v){$$('button',side).forEach(x=>x.disabled=true);answered++;cells[i].style.outline='';
          if(v===a){correct++;sfx.ok();f.say('إجابة صحيحة ⭐',true);set(i,'me');}else{sfx.bad();f.say('إجابة خاطئة، أخذ الحاسوب المربع ☁️',false);set(i,'cpu');}
          A.prog(Math.min(answered,6),6);setTimeout(()=>{if(end())return;cpu();},900);}}
      function cpu(){const empty=B.map((x,i)=>x?null:i).filter(x=>x!==null);if(!empty.length){end();return;}
        let move=null;for(const w of ['cpu','me'])for(const l of LINES){const v=l.map(i=>B[i]);if(v.filter(x=>x===w).length===2&&v.includes(null)){move=l[v.indexOf(null)];break;}}
        if(move===null)move=B[4]?pick(empty):4;if(Math.random()<.35)move=pick(empty);
        setTimeout(()=>{set(move,'cpu');if(!end()){lock=false;side.innerHTML='';side.append(h('div',{class:'hint'},'دورك! اختر مربعاً.'));}},500);}
      function end(){const w=winner();if(!w)return false;lock=true;w[1].forEach(i=>cells[i].classList.add('win'));
        const msg=w[0]==='me'?'فزتَ! ⭐⭐⭐':w[0]==='cpu'?'فاز الحاسوب هذه المرة.':'تعادل!';side.innerHTML='';side.append(h('div',{class:'defbox'},msg));
        setTimeout(()=>A.done(correct,answered,'أجبتَ '+toAr(correct)+' إجابات صحيحة من '+toAr(answered)+'. '+msg),1400);return true;}
    }},
  game:{title:'متاهة الأصدقاء',intro:'أوصِل 🧒 إلى أصدقائه 👭 في نهاية المتاهة. عند كل بوابة ❓ اختر الظنّ الحسن لتنفتح! (استخدم الأسهم أو اسحب بإصبعك)',
    run(el,A){
      const N=7,S=N*2+1;let T;
      function gen(){T=Array.from({length:S},()=>Array(S).fill(1));const st=[[N-1,N-1]];const vis=new Set([(N-1)+','+(N-1)]);T[S-2][S-2]=0;
        while(st.length){const [cy,cx]=st[st.length-1];const nb=shuffle([[0,1],[1,0],[0,-1],[-1,0]]).map(([dy,dx])=>[cy+dy,cx+dx]).filter(([y,x])=>y>=0&&x>=0&&y<N&&x<N&&!vis.has(y+','+x));
          if(!nb.length){st.pop();continue;}const [ny,nx]=nb[0];vis.add(ny+','+nx);T[cy*2+1+(ny-cy)][cx*2+1+(nx-cx)]=0;T[ny*2+1][nx*2+1]=0;st.push([ny,nx]);}}
      gen();const start=[S-2,S-2],goal=[1,1];
      const prev={};const q=[start];const seen=new Set([start.join()]);while(q.length){const [y,x]=q.shift();if(y===goal[0]&&x===goal[1])break;for(const [dy,dx] of [[0,1],[1,0],[0,-1],[-1,0]]){const ny=y+dy,nx=x+dx,k=ny+','+nx;if(!seen.has(k)&&T[ny][nx]===0){seen.add(k);prev[k]=[y,x];q.push([ny,nx]);}}}
      const path=[];let cur=goal;while(cur){path.unshift(cur);cur=prev[cur.join()];}
      const G=shuffle([['سلّمتُ على زميلي فلم يردّ التحية.',['لعلّه لم يسمعني.','لعلّه يكرهني.','إنه متكبّر.']],['لم تدعُني صديقتي إلى بيتها هذا الأسبوع.',['لعلّها مشغولة مع أسرتها.','لم تعد تحبّني.','تتعمّد إهمالي.']],['رأيتُ زميلين يضحكان وأنا أمرّ بجانبهما.',['لعلّهما يضحكان من موقفٍ طريف.','يضحكان عليّ بالتأكيد.','يسخران من ملابسي.']],['تأخّر صديقي عن موعدنا.',['لعلّ له عذراً أخّره.','لا يحترم وقتي.','تعمّد أن يتأخّر.']],['لم يردّ أخي على رسالتي.',['لعلّه لم يرها بعد.','يتجاهلني عمداً.','غاضبٌ مني.']],['أخذ زميلي قلمي من الطاولة.',['لعلّه ظنّه قلمه، أو سيُعيده.','إنه يسرق أغراضي.','يريد أن يغيظني.']]]);
      const gates={};[.18,.36,.54,.72,.88].forEach((r,i)=>{const p=path[Math.round(r*(path.length-1))];if(!(p[0]===goal[0]&&p[1]===goal[1]))gates[p.join()]={q:G[i],open:false};});
      const nG=Object.keys(gates).length;
      const mz=h('div',{class:'maze',style:{gridTemplateColumns:`repeat(${S},1fr)`}});const tiles=[];
      for(let y=0;y<S;y++){tiles[y]=[];for(let x=0;x<S;x++){const t=h('i',{class:T[y][x]?'w':'p'});tiles[y][x]=t;mz.append(t);}}
      Object.keys(gates).forEach(k=>{const [y,x]=k.split(',').map(Number);tiles[y][x].className='g';tiles[y][x].textContent='❓';});
      tiles[goal[0]][goal[1]].className='go';tiles[goal[0]][goal[1]].textContent='👭';
      let P=[...start];const draw=()=>{tiles[P[0]][P[1]].textContent='🧒';};draw();
      const side=h('div',{style:{display:'grid',gap:'10px'}});const f=fb();
      const dp=h('div',{class:'dpad'},h('span'),h('button',{onclick(){mv(-1,0)},'aria-label':'أعلى'},'▲'),h('span'),h('button',{onclick(){mv(0,-1)},'aria-label':'يسار'},'◀'),h('span'),h('button',{onclick(){mv(0,1)},'aria-label':'يمين'},'▶'),h('span'),h('button',{onclick(){mv(1,0)},'aria-label':'أسفل'},'▼'),h('span'));
      const qbox=h('div');side.append(h('div',{class:'hint'},'البوابات المفتوحة: ',h('b',{id:'gc'},'٠'),' / '+toAr(nG)),qbox,dp,f);
      el.append(h('div',{class:'maze-wrap'},mz,side));
      let asking=false,score=0,opened=0;
      function mv(dy,dx){if(asking)return;const ny=P[0]+dy,nx=P[1]+dx;if(ny<0||nx<0||ny>=S||nx>=S||T[ny][nx]){sfx.tap();return;}
        const k=ny+','+nx;if(gates[k]&&!gates[k].open){ask(k);return;}
        tiles[P[0]][P[1]].textContent='';if(tiles[P[0]][P[1]].className==='p')tiles[P[0]][P[1]].className='p trail';P=[ny,nx];draw();sfx.step();
        if(ny===goal[0]&&nx===goal[1]){tiles[ny][nx].textContent='🥳';sfx.win();A.prog(1,1);setTimeout(()=>A.done(score,nG,'وصلتَ إلى أصدقائك! حُسن الظن يحفظ الصداقة.'),900);asking=true;}}
      function ask(k){asking=true;const g=gates[k];const [s,o]=g.q;qbox.innerHTML='';sfx.bell();
        const ch=h('div',{class:'choices',style:{gridTemplateColumns:'1fr'}});qbox.append(h('div',{class:'bcard',style:{fontSize:'18px'}},'❓ '+s,h('div',{class:'hint'},'اختر الظنّ الحسن:')),ch);
        shuffle(o.map((t,i)=>[t,!i])).forEach(([t,good])=>{const b=h('button',{class:'choice',onclick(){
          if(good){$$('button',ch).forEach(x=>x.disabled=true);b.classList.add('ok');sfx.unlock();if(!g.miss)score++;g.open=true;opened++;$('#gc',side).textContent=toAr(opened);A.prog(opened,nG+1);
            const [y,x]=k.split(',').map(Number);tiles[y][x].className='p';tiles[y][x].textContent='';f.say('انفتحت البوابة! 🚪',true);setTimeout(()=>{qbox.innerHTML='';asking=false;},700);}
          else{g.miss=true;b.classList.add('no');b.disabled=true;sfx.bad();f.say('هذا سوء ظن! جرّب غيره.',false);}}},t);ch.append(b);});}
      const key=e=>{const m={ArrowUp:[-1,0],ArrowDown:[1,0],ArrowLeft:[0,-1],ArrowRight:[0,1]}[e.key];if(m){e.preventDefault();mv(...m);}};
      document.addEventListener('keydown',key);A.onStop(()=>document.removeEventListener('keydown',key));
      let sx=null,sy=null;mz.addEventListener('pointerdown',e=>{sx=e.clientX;sy=e.clientY;});
      mz.addEventListener('pointerup',e=>{if(sx==null)return;const dx=e.clientX-sx,dy=e.clientY-sy;if(Math.max(Math.abs(dx),Math.abs(dy))>24){Math.abs(dx)>Math.abs(dy)?mv(0,Math.sign(dx)):mv(Math.sign(dy),0);}sx=null;});
    }}
});
