  K.fill('3- أكمل شبكة الضرب (أ):',gridTpl(5,3),{sm:1,h:'في الصف الأول: 5 × 2 = 10، 10 × 2 = 20. في كل عمود اضرب في 3 نحو الأسفل.'}),
  K.fill('3- أكمل شبكتي الضرب (ب) و (ج):',`<div class="flexc" style="gap:22px"><div><b>(ب)</b><br>${gridTpl(1,6)}</div><div><b>(ج)</b><br>${gridTpl(1,5)}</div></div>`,{sm:1,h:'ضاعف نحو اليسار، واضرب في 6 (أو 5) نحو الأسفل.'}),
  K.fill('4- استخدم الأعداد 3 و 6 و 18 لإكمال حقائق الضرب والقسمة:','(أ) 3 × 6 = [[18]] &nbsp;|&nbsp; (ب) 6 × [[3]] = 18<br>(ج) 18 ÷ 3 = [[6]] &nbsp;|&nbsp; (د) 18 ÷ [[6]] = 3',{sm:1,v:V.array(3,6,{size:20,e:'🟣'}),h:'الأعداد الثلاثة نفسها تكوّن أربع حقائق.'}),
  K.mc('5- إذا كانت 25 × ◯ = 300، فاختر ناتج 25 × ◯ + 2:','302',['◯ + 27','300','300 + ◯'],{h:'25 × ◯ = 300، ثم أضف 2.',ex:'300 + 2 = 302 (و ◯ = 12)'}),
  K.fill('6- أكمل الجدول مستخدمًا طريقة محمد (حقيقة معروفة):',`<table class="t" style="font-size:20px"><tr><th>حقيقة معروفة</th><th>الحساب</th></tr><tr><td>5 × 6 = 30</td><td>5 × 12 = [[60]]</td></tr><tr><td>48 × 4 = 192</td><td>48 × 8 = [[384]]</td></tr><tr><td>23 × 6 = 138</td><td>23 × 7 = [[161]]</td></tr><tr><td>8 × 9 = 72</td><td>4 × 9 = [[36]]</td></tr></table>`,{sm:1,h:'ضاعف، أو أضف مجموعة، أو نصّف.'}),
  K.fill('7- استخدم الحقيقة 34 × 5 = 170 لحساب 34 × 6:','34 × 6 = 170 + [[34]] = [[204]]',{h:'34 × 6 تزيد على 34 × 5 مجموعة واحدة من 34.'}),
  K.mc('أؤلف مسألة: أيّ مسألة تطابق العملية 6 × 14؟','في المكتبة 6 رفوف، على كل رف 14 كتابًا. كم كتابًا على الرفوف؟',['لدى بدر 14 قلمًا، أعطى صديقه 6 أقلام. كم قلمًا بقي معه؟','وزّعت مها 14 حلوى على 6 أطفال. كم حلوى لكل طفل؟','في الصف 14 ولدًا و 6 بنات. كم تلميذًا في الصف؟'],{cols:1,h:'الضرب = مجموعات متساوية.'})],
 h:()=>{const [a,b,c]=triSet();const st=pick([2,3,5]),k=pick([3,4,5]);const n=R(4,9),m=pick([4,6,9]);
  return[K.fill('مثلث ضرب لغز: لا نعرف أيّ دائرة! أوجد الأعداد في الدوائر:',`العليا = [[${a}]] &nbsp; اليسرى = [[${b}]] &nbsp; اليمنى = [[${c}]]`,{sm:1,v:V.tri(['','',''],[a*b,a*c,b*c]),h:`ابحث عن عدد يقسم ${a*b} و ${a*c} معًا. جرّب أعدادًا من 2 إلى 9.`,ex:`${a} × ${b} = ${a*b}، ${a} × ${c} = ${a*c}، ${b} × ${c} = ${b*c}`}),
   K.num(`في شبكة ضرب (×2 نحو اليسار، ×${k} نحو الأسفل) العدد في الخانة السفلى اليسرى ${st*4*k*k}. ما العدد في الخانة العليا اليمنى؟ [?]`,st,{v:mgridHTML(st,k,(r,c,v)=>r===2&&c===2?v:'؟',{fs:18,cs:48}),h:`من الخانة العليا اليمنى إلى السفلى اليسرى: × 2 × 2 × ${k} × ${k} = × ${4*k*k}`,ex:`${st*4*k*k} ÷ ${4*k*k} = ${st}`}),
   K.num(`مَن أنا؟ إذا ضربتني في ${m} ثم أضفت ${m} كان الناتج ${n*m+m}. [?]`,n,{h:`${n*m+m} = ${m} × ؟ + ${m}، أي أنها ${n+1} مجموعات من ${m}.`,ex:`${n} × ${m} + ${m} = ${n*m} + ${m} = ${n*m+m}`}),
   (()=>{const st=pick([['ناتج ضرب أي عدد في 4 يساوي ضعف ضعف العدد.',true],['ناتج ضرب أي عدد في 9 يساوي (العدد × 10) − العدد.',true],['ناتج ضرب عدد في 6 يساوي ناتج ضربه في 3 مضاعفًا.',true],['ناتج ضرب أي عدد في 5 يساوي ضعف ناتج ضربه في 10.',false],['حاصل ضرب عدد فردي في 6 يكون فرديًا دائمًا.',false]]);return K.tf('هل هذه العبارة صحيحة دائمًا؟ '+st[0],st[1],{h:'جرّب أمثلة: 7، 12، 25.',ex:st[1]?'نعم، صحيحة دائمًا.':'خطأ: جرّب مثالًا يثبت ذلك.'})})(),
   K.fill('إذا علمت أن 25 × 12 = 300، فأكمل:','25 × 24 = [[600]] &nbsp; 25 × 6 = [[150]] &nbsp; 25 × 13 = [[325]]',{sm:1,h:'24 ضعف 12، و 6 نصف 12، و 13 = 12 + 1'}),
   K.num('في المكتبة 6 رفوف، على كل رف 14 كتابًا، ثم أُضيف رف سابع عليه 14 كتابًا أيضًا. كم كتابًا صار؟ (استخدم 6 × 7 = 42) [?]',98,{h:'6 × 14 = ضعف 42 = 84، ثم أضف 14.',ex:'84 + 14 = 98 = 7 × 14'})]}

games:[
 {type:'memory',title:'ذاكرة حقائق الضرب',pairs:()=>{const out=[];const faces=new Set();let g=0;while(out.length<6&&g++<400){const t=pick([4,6,9,3,5]),a=R(3,10);const p=a*t;const kind=R(0,2);
   const pr=kind===0?[`${a} × ${t}`,`${p}`]:kind===1?[`${p} ÷ ${t}`,`${a}`]:[`ضعف ${p}`,`${2*p}`];if(pr.some(x=>faces.has(x)))continue;pr.forEach(x=>faces.add(x));
   out.push([`<span style="font-size:${pr[0].length>7?19:22}px">${D(pr[0])}</span>`,`<span style="font-size:28px;color:#7c4dff">${D(pr[1])}</span>`])}return out}},
 {type:'speed',title:'سباق الحقائق السريعة',goal:18,q:()=>{const k=R(0,4);

const qDivEx=(o={})=>{const [n,d,q]=mkEx();return K.num(`${n} ÷ ${d} = [?]`,q,{h:`اطرح 10 مجموعات من ${d} (${10*d}) أولًا، ثم انظر كم مجموعة في الباقي.`,ex:`${n} − ${10*d} = ${n-10*d}، ${n-10*d} ÷ ${d} = ${q-10}، 10 + ${q-10} = ${q}`,...o})};
const qDivRem=(o={})=>{const [n,d,q,r]=mkRem();return K.fill(`أوجد الناتج والباقي: ${n} ÷ ${d}`,`${n} ÷ ${d} = [[${q}]] والباقي [[${r}]]`,{sm:1,h:`${q*d} = ${q} × ${d} أقرب مضاعف لـ ${d} أصغر من ${n}.`,ex:`${q} × ${d} = ${q*d}، ${n} − ${q*d} = ${r}`,...o})};
const qHalve=(o={})=>{const q=R(11,24),n=4*q;return K.fill(`استخدم طريقة عفاف (التنصيف مرتين) لحساب ${n} ÷ 4:`,`نصف ${n} = [[${n/2}]] ← نصف ${n/2} = [[${q}]] ← ${n} ÷ 4 = [[${q}]]`,{sm:1,h:'القسمة على 4 = التنصيف ثم التنصيف مرة أخرى.',...o})};
const CTX_UP=[['حافلة صغيرة تحمل {d} أشخاص. كم حافلة تلزم لنقل {n} شخصًا؟','حافلات','🚐'],['يجلس كل {d} تلاميذ على طاولة. كم طاولة تلزم لـ {n} تلميذًا؟','طاولات','🪑'],['يحتوي الصندوق على {d} علب عصير. كم صندوقًا يلزم لـ {n} علبة؟','صناديق','🧃'],['في كل رزمة {d} طوابع. كم رزمة يلزم لإرسال {n} رسالة؟','رزم','💌']];
const CTX_DN=[['لدى عبير {n} وردة، تضع {d} وردات في كل باقة. كم باقة كاملة تصنع؟','باقات','💐'],['ثمن الكتاب {d} ريالات. كم كتابًا يمكن شراؤه بـ {n} ريالًا؟','كتب','📘'],['تعبّئ مها {d} بيضات في كل علبة. كم علبة تملأ بـ {n} بيضة؟','علب','🥚'],['يصنع بدر قلادة من {d} خرزات. كم قلادة كاملة يصنع من {n} خرزة؟','قلادات','📿']];
const fillCtx=(t,n,d)=>t.replace('{n}',n).replace('{d}',d);
const mkWord=()=>{let d,n;do{d=R(3,9);n=R(20,95)}while(n%d===0||Math.floor(n/d)>20);return [n,d]};
const qUp=(o={})=>{const [n,d]=mkWord();const c=pick(CTX_UP);const q=Math.floor(n/d);return K.num(`${c[2]} ${fillCtx(c[0],n,d)} [?]`,q+1,{u:c[1],h:`${n} ÷ ${d} = ${q} والباقي ${n%d}. هل يمكن ترك الباقي دون مكان؟`,ex:`نقرّب تصاعديًا: ${q} + 1 = ${q+1}`,...o})};
const qDn=(o={})=>{const [n,d]=mkWord();const c=pick(CTX_DN);const q=Math.floor(n/d);return K.num(`${c[2]} ${fillCtx(c[0],n,d)} [?]`,q,{u:c[1],h:`${n} ÷ ${d} = ${q} والباقي ${n%d}. هل يكفي الباقي لصنع واحدة كاملة؟`,ex:`نقرّب تنازليًا: ${q}`,...o})};
const qRem4=(o={})=>{const want=pick([1,2]);const good=uniqNums(3,()=>4*R(2,22)+want);const bad=uniqNums(5,()=>{let v;do{v=R(10,90)}while(v%4===want);return v});const opts=shuffle([...good,...bad]);
  return K.pick(`اختر كل الأعداد التي تعطي الباقي ${want} عند القسمة على 4:`,opts,opts.map((v,i)=>v%4===want?i:-1).filter(i=>i>=0),{cols:4,h:`اطرح أقرب مضاعف للعدد 4. أعداد الباقي ${want} ${want===1?'فردية':'زوجية لكنها ليست من مضاعفات 4'}.`,...o})};
const qRemMc=()=>{const want=pick([1,2,3]);const a=4*R(3,20)+want;const w=uniqNums(3,()=>{let v;do{v=4*R(3,20)+R(0,3)}while(v%4===want);return v});return K.mc(`أيّ عدد يعطي الباقي ${want} عند القسمة على 4؟`,a,w)};
const qYousuf=(o={})=>{const [n,d,q]=mkEx();return K.fill(`استخدم خط الأعداد (طريقة يوسف) لحساب ${n} ÷ ${d}:`,`${n} − [[${10*d}]] = [[${n-10*d}]] ← (10 × ${d})<br>${n-10*d} − [[${n-10*d}]] = 0 ← ([[${q-10}]] × ${d})<br>${n} ÷ ${d} = [[${q}]]`,{sm:1,v:yousuf(n,d,{anim:false,w:600,hideK:1}),h:`القفزة الكبيرة = 10 مجموعات من ${d}.`,...o})};
