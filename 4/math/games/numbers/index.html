<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>مرسى الأرقام · رياضيات الصف الرابع</title>
<meta name="description" content="برنامج تفاعلي شامل لدروس كتاب الرياضيات للصف الرابع - الفصل الأول: عروض، أنشطة قبلية وبعدية، ألعاب">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;700;800&family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>:root{
  --bg1:#eef6ff;--bg2:#fff8ec;--paper:#ffffff;--ink:#1d2742;--ink2:#3a4668;--muted:#71809f;--line:#e2e9f5;--soft:#f5f8fe;
  --blue:#2f7cf6;--blue2:#e8f1ff;--green:#16a36a;--green2:#e3f7ee;--orange:#f97316;--orange2:#fff0e3;
  --purple:#7c4dff;--purple2:#f0eaff;--teal:#0ea5a0;--teal2:#e0f7f6;--pink:#ec4899;--pink2:#fde8f2;
  --yellow:#f5b300;--yellow2:#fff6d6;--red:#e5484d;--red2:#ffe9ea;
  --th:#7c3aed;--hu:#2563eb;--te:#f97316;--on:#16a34a;
  --acc:var(--blue);--acc2:var(--blue2);
  --r:22px;--sh:0 10px 30px -12px rgba(31,52,110,.18),0 2px 6px rgba(31,52,110,.06);
  --sh2:0 18px 40px -16px rgba(31,52,110,.28);
  --fs:1;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:'Tajawal','Segoe UI',Tahoma,sans-serif;color:var(--ink);background:linear-gradient(180deg,var(--bg1),var(--bg2) 70%);background-attachment:fixed;min-height:100vh;font-size:calc(17px * var(--fs));line-height:1.65;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 12% 8%,rgba(255,205,90,.28),transparent 18%),radial-gradient(circle at 92% 22%,rgba(47,124,246,.10),transparent 25%),radial-gradient(circle at 20% 90%,rgba(22,163,106,.08),transparent 25%);z-index:-1}
h1,h2,h3,h4,.hd{font-family:'Baloo Bhaijaan 2','Tajawal',sans-serif;margin:0;line-height:1.3}
button{font-family:inherit;font-size:inherit;cursor:pointer;border:0;background:none;color:inherit}
.ltr{direction:ltr;unicode-bidi:isolate;display:inline-block}
.nd{}
svg text{font-family:'Tajawal','Segoe UI',sans-serif}
/* ---------- top bar ---------- */
#top{position:sticky;top:0;z-index:40;background:rgba(255,255,255,.82);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
#top .in{max-width:1180px;margin:auto;display:flex;align-items:center;gap:10px;padding:8px 16px}
.brand{display:flex;align-items:center;gap:10px;cursor:pointer}
.brand .logo{width:42px;height:42px;border-radius:14px;background:linear-gradient(135deg,#2f7cf6,#7c4dff);display:grid;place-items:center;color:#fff;font-weight:900;font-size:22px;box-shadow:0 6px 16px -6px rgba(47,124,246,.7)}
.brand b{font-family:'Baloo Bhaijaan 2';font-size:21px;display:block;line-height:1.1}
.brand small{color:var(--muted);font-size:12.5px}
#top .sp{flex:1}
.ib{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:var(--soft);border:1px solid var(--line);font-size:19px;transition:.2s}
.ib:hover{background:#fff;transform:translateY(-1px);box-shadow:var(--sh)}
.ib.off{opacity:.45}
#crumb{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--muted);flex-wrap:wrap}
#crumb a{color:var(--ink2);text-decoration:none;font-weight:700;cursor:pointer}
#main{max-width:1180px;margin:auto;padding:18px 16px 110px}
/* ---------- generic ---------- */
.card{background:var(--paper);border-radius:var(--r);box-shadow:var(--sh);border:1px solid rgba(226,233,245,.8)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:99px;font-size:13.5px;font-weight:700;background:var(--acc2);color:var(--acc)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 22px;border-radius:16px;font-weight:800;font-size:17px;background:var(--acc);color:#fff;box-shadow:0 8px 18px -8px var(--acc);transition:transform .15s,box-shadow .2s,opacity .2s;min-height:50px}
.btn:hover{transform:translateY(-2px)}
.btn:active{transform:translateY(1px) scale(.98)}
.btn.ghost{background:#fff;color:var(--ink2);border:1.5px solid var(--line);box-shadow:none}
.btn.soft{background:var(--acc2);color:var(--acc);box-shadow:none}
.btn.green{background:var(--green);box-shadow:0 8px 18px -8px var(--green)}
.btn.orange{background:var(--orange);box-shadow:0 8px 18px -8px var(--orange)}
.btn.sm{padding:8px 14px;font-size:15px;min-height:40px;border-radius:13px}
.btn[disabled]{opacity:.45;pointer-events:none}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.center{text-align:center}
.muted{color:var(--muted)}
.mt{margin-top:14px}.mb{margin-bottom:14px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
/* ---------- home ---------- */
.hero{position:relative;overflow:hidden;padding:26px 26px 24px;border-radius:30px;background:linear-gradient(120deg,#ffffff 0%,#eef5ff 55%,#fff3df 100%);box-shadow:var(--sh);border:1px solid var(--line);display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.hero h1{font-size:clamp(28px,4.4vw,44px);color:#1b2b5a}
.hero p{margin:6px 0 0;color:var(--ink2);font-size:17px}
.hero .art{flex:0 0 auto;margin-inline-start:auto}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.stat{background:#fff;border:1px solid var(--line);border-radius:16px;padding:8px 14px;min-width:110px}
.stat b{font-size:22px;font-family:'Baloo Bhaijaan 2';display:block;line-height:1.1}
.stat span{font-size:12.5px;color:var(--muted)}
.domain{margin:28px 0 10px;display:flex;align-items:center;gap:10px}
.domain .dot{width:14px;height:14px;border-radius:5px}
.domain h2{font-size:24px}
.unitt{font-size:14px;color:var(--muted);font-weight:700;margin:14px 4px 8px}
.lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(245px,1fr));gap:14px}
.lcard{position:relative;cursor:pointer;padding:16px;border-radius:22px;background:#fff;border:1px solid var(--line);box-shadow:var(--sh);transition:.2s;overflow:hidden;text-align:right}
.lcard:hover{transform:translateY(-3px);box-shadow:var(--sh2)}
.lcard::after{content:"";position:absolute;inset:auto -30px -40px auto;width:120px;height:120px;border-radius:50%;background:var(--acc2);z-index:0}
.lcard>*{position:relative;z-index:1}
.lcard .ic{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;font-size:27px;background:var(--acc2)}
.lcard .code{font-weight:800;color:var(--acc);font-size:13.5px}
.lcard h3{font-size:18.5px;margin:6px 0 8px;min-height:48px}
.prog{height:8px;border-radius:9px;background:var(--soft);overflow:hidden}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),#8fd3ff);border-radius:9px;transition:width .6s}
.lcard .meta{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);margin-top:6px}
/* ---------- lesson home ---------- */
.lhero{padding:22px;border-radius:28px;background:linear-gradient(120deg,var(--acc2),#fff 70%);border:1px solid var(--line);box-shadow:var(--sh);display:flex;gap:18px;flex-wrap:wrap;align-items:center}
.lhero .big{width:84px;height:84px;border-radius:26px;background:#fff;display:grid;place-items:center;font-size:44px;box-shadow:var(--sh)}
.lhero h1{font-size:clamp(24px,3.6vw,36px)}
.goals{display:grid;gap:8px;margin-top:10px}
.goal{display:flex;gap:10px;align-items:flex-start;background:#fff;border-radius:14px;padding:8px 12px;border:1px solid var(--line);font-size:15.5px}
.goal::before{content:"✓";flex:0 0 22px;height:22px;border-radius:7px;display:grid;place-items:center;background:var(--acc);color:#fff;font-weight:900;font-size:13px;margin-top:2px}
.path{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-top:18px}
.step{position:relative;cursor:pointer;background:#fff;border-radius:24px;padding:18px 16px 16px;border:1.5px solid var(--line);box-shadow:var(--sh);transition:.2s;text-align:center}
.step:hover{transform:translateY(-3px);box-shadow:var(--sh2);border-color:var(--acc)}
.step .n{position:absolute;top:10px;right:12px;width:26px;height:26px;border-radius:9px;background:var(--acc2);color:var(--acc);font-weight:900;display:grid;place-items:center;font-size:14px}
.step .e{font-size:44px;line-height:1;margin:6px 0}
.step h3{font-size:19px}
.step p{margin:4px 0 0;font-size:13.5px;color:var(--muted)}
.step .st{margin-top:8px;font-size:13px;font-weight:800}
.step.done{border-color:var(--green)}
.step.done .n{background:var(--green);color:#fff}
.stars{color:#f5b300;letter-spacing:2px;font-size:18px}
.stars .off{color:#dde3ee}
/* ---------- slides ---------- */
.stage{position:relative;background:#fff;border-radius:30px;box-shadow:var(--sh2);border:1px solid var(--line);overflow:hidden;min-height:min(72vh,640px);display:flex;flex-direction:column}
.stage .sbar{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line);background:linear-gradient(90deg,var(--acc2),#fff)}
.sdots{display:flex;gap:5px;flex:1;flex-wrap:wrap}
.sdots i{width:10px;height:10px;border-radius:5px;background:#dfe6f3;cursor:pointer;transition:.3s}
.sdots i.on{background:var(--acc);width:26px}
.sdots i.seen{background:#b9c9ea}
.sbody{flex:1;padding:22px clamp(16px,4vw,44px) 26px;overflow:auto}
.sbody h2{font-size:clamp(24px,3.4vw,34px);color:var(--acc);margin-bottom:10px}
.sbody .lead{font-size:clamp(18px,2.2vw,22px);color:var(--ink2)}
.sfoot{display:flex;gap:10px;align-items:center;padding:12px 16px;border-top:1px solid var(--line);background:#fbfcff}
.sfoot .sp{flex:1}
.reveal{animation:rev .55s cubic-bezier(.2,.8,.2,1) both}
@keyframes rev{from{opacity:0;transform:translateY(16px) scale(.98)}to{opacity:1;transform:none}}
.pop{animation:popin .45s cubic-bezier(.2,1.4,.4,1) both}
@keyframes popin{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
.box{background:var(--soft);border:1.5px solid var(--line);border-radius:18px;padding:14px 16px;margin:10px 0}
.box.acc{background:var(--acc2);border-color:transparent}
.box.warn{background:var(--red2);border-color:#ffc9cc}
.box.tip{background:var(--yellow2);border-color:#ffe39a}
.box.ok{background:var(--green2);border-color:#b5ead2}
.box h4{font-size:18px;margin-bottom:4px}
.vcard{display:flex;gap:16px;align-items:center;flex-wrap:wrap;background:#fff;border:1.5px solid var(--line);border-radius:20px;padding:14px 16px;margin:10px 0;box-shadow:var(--sh)}
.vcard .term{font-family:'Baloo Bhaijaan 2';font-size:22px;color:var(--acc);min-width:150px}
.vcard .def{flex:1;min-width:200px;font-size:18px}
.bigeq{font-size:clamp(24px,4vw,40px);font-weight:900;text-align:center;margin:12px 0;font-family:'Baloo Bhaijaan 2'}
.flexc{display:flex;gap:16px;align-items:center;justify-content:center;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;justify-content:center;min-width:46px;padding:6px 14px;border-radius:14px;background:#fff;border:2px solid var(--line);font-weight:800;font-size:20px;box-shadow:0 3px 0 #dfe6f3}
.hl{background:var(--yellow2);border-radius:8px;padding:0 6px;font-weight:800}
.c-tt{color:#db2777}table.t .bg-th{background:#efe7ff}table.t .bg-hu{background:#e3edff}table.t .bg-te{background:#ffeede}table.t .bg-on{background:#e1f6ea}table.t .bg-tt{background:#fde7f1}table.t .c-th{color:var(--th)}table.t .c-hu{color:var(--hu)}table.t .c-te{color:var(--te)}table.t .c-on{color:var(--on)}
.bg-tt{background:#fde7f1}
.c-th{color:var(--th)}.c-hu{color:var(--hu)}.c-te{color:var(--te)}.c-on{color:var(--on)}
.bg-th{background:#efe7ff}.bg-hu{background:#e3edff}.bg-te{background:#ffeede}.bg-on{background:#e1f6ea}
/* ---------- tables ---------- */
table.t{border-collapse:separate;border-spacing:0;margin:8px auto;background:#fff;border-radius:14px;overflow:hidden;border:1.5px solid var(--line);font-size:17px}
table.t th{background:var(--acc2);color:var(--ink);font-weight:800;padding:8px 12px}
table.t td{padding:7px 12px;border-top:1px solid var(--line);text-align:center}
table.t td+td,table.t th+th{border-inline-start:1px solid var(--line)}
table.pv{direction:ltr}
table.pv td{font-size:26px;font-weight:900;min-width:64px;font-family:'Baloo Bhaijaan 2'}
/* ---------- runner ---------- */
.lvbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.lv{flex:1;min-width:170px;cursor:pointer;display:flex;gap:10px;align-items:center;padding:12px 14px;border-radius:18px;background:#fff;border:2px solid var(--line);box-shadow:var(--sh);transition:.2s;text-align:right}
.lv .e{font-size:30px}
.lv b{display:block;font-size:17px}
.lv span{font-size:12.5px;color:var(--muted)}
.lv.on{border-color:var(--acc);background:var(--acc2)}
.lv .rec{font-size:11px;background:var(--orange);color:#fff;border-radius:8px;padding:1px 7px;margin-inline-start:6px}
.run{padding:0;overflow:hidden}
.rhead{display:flex;align-items:center;gap:10px;padding:12px 16px;background:linear-gradient(90deg,var(--acc2),#fff);border-bottom:1px solid var(--line);flex-wrap:wrap}
.rhead .t{font-weight:800}
.rprog{flex:1;min-width:120px;display:flex;gap:4px}
.rprog i{flex:1;height:9px;border-radius:5px;background:#e1e8f4}
.rprog i.cur{background:var(--acc);opacity:.45}
.rprog i.ok{background:var(--green)}
.rprog i.half{background:var(--yellow)}
.rprog i.no{background:var(--red)}
.qwrap{padding:18px clamp(14px,3vw,30px) 8px}
.qn{display:inline-flex;align-items:center;gap:8px;font-weight:800;color:var(--acc);font-size:14px;margin-bottom:6px}
.qt{font-size:clamp(19px,2.3vw,23px);font-weight:700;line-height:1.7}
.qv{margin:12px 0;display:flex;justify-content:center;flex-wrap:wrap;gap:10px}
.qv svg{max-width:100%;height:auto}
.ans{margin:14px 0 6px}
.rfoot{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:12px 16px 16px}
.rfoot .sp{flex:1}
.fb{display:none;align-items:center;gap:10px;margin:8px 16px 0;padding:12px 16px;border-radius:16px;font-weight:800;font-size:17px}
.fb.show{display:flex;animation:rev .4s both}
.fb.ok{background:var(--green2);color:#0d7a4d}
.fb.no{background:var(--red2);color:#b4232a}
.fb.info{background:var(--yellow2);color:#8a6100}
.fb .x{font-weight:600;font-size:15px;color:var(--ink2);display:block}
/* options */
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.opt{min-height:58px;padding:10px 14px;border-radius:16px;background:#fff;border:2px solid var(--line);font-size:19px;font-weight:800;box-shadow:0 4px 0 #e4eaf5;transition:.15s;display:flex;align-items:center;justify-content:center;gap:8px;text-align:center}
.opt:hover{border-color:var(--acc)}
.opt.sel{border-color:var(--acc);background:var(--acc2);box-shadow:0 4px 0 var(--acc)}
.opt.right{border-color:var(--green);background:var(--green2);box-shadow:0 4px 0 var(--green)}
.opt.wrong{border-color:var(--red);background:var(--red2);box-shadow:0 4px 0 var(--red);animation:shake .4s}
@keyframes shake{25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-3px)}}
.tfb{display:flex;gap:14px;justify-content:center}
.tfb .opt{min-width:150px;font-size:22px}
/* answer boxes + keypad */
.ab{display:inline-flex;align-items:center;justify-content:center;min-width:72px;height:50px;padding:0 10px;margin:2px 4px;border-radius:13px;border:2.5px dashed #b8c6e2;background:#fff;font-weight:900;font-size:22px;vertical-align:middle;cursor:pointer;transition:.15s;direction:ltr;font-family:'Baloo Bhaijaan 2','Tajawal'}
.ab.sm{min-width:48px;height:42px;font-size:19px}
.ab.foc{border-style:solid;border-color:var(--acc);box-shadow:0 0 0 4px var(--acc2)}
.ab.right{border-style:solid;border-color:var(--green);background:var(--green2);color:#0d7a4d}
.ab.wrong{border-style:solid;border-color:var(--red);background:var(--red2);color:#b4232a}
.ab:empty::after{content:"?";color:#c3cde3}
.tpl{font-size:clamp(20px,2.6vw,26px);font-weight:800;line-height:2.3;text-align:center}
.kp{display:grid;grid-template-columns:repeat(6,1fr);gap:7px;max-width:470px;margin:12px auto 0;direction:ltr}
.kp button{height:50px;border-radius:14px;background:#fff;border:1.5px solid var(--line);font-size:22px;font-weight:900;box-shadow:0 3px 0 #dfe6f3;font-family:'Baloo Bhaijaan 2','Tajawal'}
.kp button:active{transform:translateY(2px);box-shadow:none}
.kp .del{background:var(--red2);color:var(--red)}
.kp .sym{background:var(--acc2);color:var(--acc)}
/* chips drag */
.pool{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;min-height:56px;padding:10px;border-radius:18px;background:var(--soft);border:1.5px dashed var(--line)}
.tk{padding:8px 14px;border-radius:14px;background:#fff;border:2px solid var(--line);font-weight:800;font-size:18px;box-shadow:0 3px 0 #dfe6f3;cursor:pointer;user-select:none;touch-action:none;transition:transform .15s}
.tk.sel{border-color:var(--acc);background:var(--acc2);transform:translateY(-3px)}
.tk.right{border-color:var(--green);background:var(--green2)}
.tk.wrong{border-color:var(--red);background:var(--red2)}
.slots{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:12px 0;direction:rtl}
.slot{min-width:84px;min-height:52px;border-radius:14px;border:2.5px dashed #c1cde5;display:flex;align-items:center;justify-content:center;padding:4px;background:#fff}
.slot.foc{border-color:var(--acc);background:var(--acc2)}
.bins{display:grid;gap:10px;margin-top:10px}
.bin{min-height:96px;border-radius:18px;border:2.5px dashed #c1cde5;background:#fff;padding:8px;display:flex;flex-direction:column;gap:6px;transition:.15s}
.bin.hot{border-color:var(--acc);background:var(--acc2)}
.bin>b{font-size:15px;color:var(--ink2)}
.bin .in{display:flex;flex-wrap:wrap;gap:6px}
.carroll{display:grid;grid-template-columns:auto 1fr 1fr;gap:6px}
.carroll .h{display:grid;place-items:center;font-weight:800;font-size:15px;padding:6px;border-radius:12px;background:var(--acc2);text-align:center}
.carroll .bin{min-height:110px}
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px 40px;position:relative}
.match .tk{text-align:center}
.match>svg{position:absolute;inset:0;pointer-events:none;width:100%;height:100%}
/* ---------- games ---------- */
.gstage{position:relative;border-radius:26px;overflow:hidden;background:linear-gradient(180deg,#bfe3ff,#eaf6ff 60%,#fff6e0);min-height:min(68vh,560px);box-shadow:var(--sh2);border:1px solid var(--line);user-select:none;touch-action:manipulation}
.ghud{position:absolute;top:0;left:0;right:0;display:flex;gap:8px;align-items:center;padding:10px 12px;z-index:5;flex-wrap:wrap}
.ghud .tag{background:rgba(255,255,255,.92);border-radius:14px;padding:6px 12px;font-weight:800;box-shadow:0 4px 12px -6px rgba(0,0,0,.2);font-size:16px}
.gq{position:absolute;top:56px;left:0;right:0;margin:0 auto;width:fit-content;z-index:5;background:#fff;border-radius:18px;padding:8px 20px;font-size:clamp(20px,3vw,28px);font-weight:900;box-shadow:var(--sh);text-align:center;max-width:94%;font-family:'Baloo Bhaijaan 2','Tajawal'}
.gover{position:absolute;inset:0;z-index:20;display:grid;place-items:center;background:rgba(240,246,255,.86);backdrop-filter:blur(4px)}
.gover .card{padding:26px;text-align:center;max-width:420px;width:92%}
.gover h2{font-size:30px}
.gintro{position:absolute;inset:0;z-index:20;display:grid;place-items:center;background:rgba(240,246,255,.9)}
.gintro .card{padding:24px;text-align:center;max-width:470px;width:92%}
.gintro .e{font-size:64px}
.gcards{display:grid;gap:10px;padding:70px 14px 14px}
.mcard{aspect-ratio:5/4;perspective:700px;cursor:pointer}
.mcard .in{position:relative;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d}
.mcard.fl .in{transform:rotateY(180deg)}
.mcard .f,.mcard .b{position:absolute;inset:0;border-radius:16px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:grid;place-items:center;box-shadow:var(--sh)}
.mcard .f{background:linear-gradient(135deg,var(--acc),#8ec5ff);color:#fff;font-size:32px}
.mcard .b{background:#fff;transform:rotateY(180deg);font-weight:900;font-size:clamp(14px,2.2vw,20px);padding:6px;text-align:center;border:2px solid var(--line)}
.mcard.ok .b{border-color:var(--green);background:var(--green2)}
.gbtns{position:absolute;bottom:12px;left:0;right:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;padding:0 12px;z-index:6}
.gbtns .opt{min-height:60px;font-size:22px}
/* ---------- helper ---------- */
#helper{position:fixed;left:0;bottom:26vh;z-index:60;display:flex;direction:ltr;align-items:flex-end;gap:6px;pointer-events:none;transition:transform .45s cubic-bezier(.2,.9,.3,1.2)}
#helper:not(.talk){transform:translateX(-46px)}#helper:not(.talk) .sn{opacity:.85}
#helper .sn{width:86px;height:70px;pointer-events:auto;cursor:pointer;filter:drop-shadow(0 6px 8px rgba(0,0,0,.15));transition:transform .3s}
#helper.hop .sn{animation:hop .6s}
@keyframes hop{30%{transform:translateY(-16px) rotate(-6deg)}60%{transform:translateY(0)}80%{transform:translateY(-5px)}}
#helper.sad .sn{transform:rotate(8deg)}
#helper .bub{direction:rtl;max-width:min(320px,70vw);background:#fff;border:2px solid var(--line);border-radius:18px 18px 18px 4px;padding:10px 14px;font-weight:700;font-size:15.5px;box-shadow:var(--sh2);opacity:0;transform:translateY(8px) scale(.95);transition:.3s;margin-bottom:46px;pointer-events:auto}
#helper .bub.on{opacity:1;transform:none}
/* modal */
#modal{position:fixed;inset:0;z-index:80;display:none;place-items:center;background:rgba(20,30,60,.35);backdrop-filter:blur(3px)}
#modal.on{display:grid}
#modal .card{padding:24px;max-width:520px;width:92%;max-height:86vh;overflow:auto;animation:popin .35s both}
canvas#fx{position:fixed;inset:0;pointer-events:none;z-index:90}
/* report */
.rep td,.rep th{font-size:15px}
.up{color:var(--green);font-weight:900}.down{color:var(--red);font-weight:900}
.set{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.tog{display:flex;background:var(--soft);border-radius:14px;padding:4px;gap:4px;border:1px solid var(--line)}
.tog button{padding:6px 14px;border-radius:11px;font-weight:800}
.tog button.on{background:#fff;box-shadow:var(--sh);color:var(--acc)}
input.txt{font-family:inherit;font-size:17px;padding:10px 14px;border-radius:14px;border:1.5px solid var(--line);min-width:200px}
.snail-mini{width:60px}
@media (max-width:640px){
  body{font-size:calc(16px * var(--fs))}
  .brand small{display:none}
  #crumb{display:none}
  .brand b{font-size:18px;white-space:nowrap}
  .brand .logo{width:38px;height:38px;font-size:19px}
  #top .in{gap:6px;padding:8px 10px}
  .ib{width:38px;height:38px;font-size:17px}
  .hero{padding:18px}
  .hero .art{display:none}
  .stage{min-height:70vh;border-radius:22px}
  .kp button{height:46px}
  #helper .sn{width:66px;height:54px}
  #helper .bub{margin-bottom:34px}
  .lcard h3{min-height:0}
}
@media print{#top,#helper,.noprint{display:none!important}body{background:#fff}}

/* distinct wrong options near a value */
function near(a,n=3,spread=10,fn){const s=new Set([String(a)]);const out=[];let g=0;while(out.length<n&&g++<400){let v=fn?fn():a+pick([-1,1])*R(1,spread);if(typeof a==='number'&&v<0&&a>=0)continue;if(!s.has(String(v))){s.add(String(v));out.push(v)}}return out}
/* negative number wrapper (keeps minus on the left inside RTL text) */

const AR='٠١٢٣٤٥٦٧٨٩';
function toAr(s){return s.replace(/(\d)[.,](?=\d)/g,'$1٫').replace(/\d/g,d=>AR[d])}
function norm(s){return String(s??'').replace(/[٠-٩]/g,d=>AR.indexOf(d)).replace(/[٫,]/g,'.').replace(/[−–—]/g,'-').replace(/[⁦-⁩\s]/g,'')}
function same(a,b){const x=norm(a),y=norm(b);if(x===y)return true;
  if(x.includes(':')&&y.includes(':')){const p=x.split(':').map(Number),q=y.split(':').map(Number);return p[0]%12===q[0]%12&&p[1]===q[1]}
  const nx=Number(x),ny=Number(y);return x!==''&&y!==''&&isFinite(nx)&&isFinite(ny)&&Math.abs(nx-ny)<1e-9}

const Store={k:'marsa-arqam-4-v1',d:null,

/* =================== digits (auto-convert) =================== */
const Dig={
  on(){return Store.set.digits==='ar'},
  conv(n){const v=n.nodeValue;if(v&&/\d/.test(v)){const p=n.parentElement;if(p&&p.closest('.keepdig,script,style'))return;const t=toAr(v);if(t!==v)n.nodeValue=t}},
  walk(root){if(!this.on()||!root)return;if(root.nodeType===3)return this.conv(root);const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);let n;while(n=w.nextNode())this.conv(n)},
  init(){const mo=new MutationObserver(ms=>{if(!this.on())return;for(const m of ms){if(m.type==='characterData')this.conv(m.target);else m.addedNodes.forEach(n=>{if(n.nodeType===3)this.conv(n);else if(n.nodeType===1)this.walk(n)})}});
    mo.observe(document.body,{childList:true,subtree:true,characterData:true})}

const D=s=>Dig.on()?toAr(String(s)):String(s);
/* =================== sound =================== */
const S={ctx:null,
  ac(){if(!Store.set.sound)return null;if(!this.ctx){try{this.ctx=new(window.AudioContext||window.webkitAudioContext)()}catch(e){return null}}if(this.ctx.state==='suspended')this.ctx.resume();return this.ctx},
  tone(f,d=.15,type='sine',vol=.18,when=0,f2){const c=this.ac();if(!c)return;const t=c.currentTime+when;const o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.015);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(c.destination);o.start(t);o.stop(t+d+.05)},
  noise(d=.2,vol=.15,when=0,hp=800){const c=this.ac();if(!c)return;const t=c.currentTime+when;const b=c.createBuffer(1,c.sampleRate*d,c.sampleRate),x=b.getChannelData(0);for(let i=0;i<x.length;i++)x[i]=(Math.random()*2-1)*(1-i/x.length);const s=c.createBufferSource();s.buffer=b;const f=c.createBiquadFilter();f.type='highpass';f.frequency.value=hp;const g=c.createGain();g.gain.value=vol;s.connect(f).connect(g).connect(c.destination);s.start(t)},
  click(){this.tone(900,.05,'square',.05)},
  tap(){this.tone(520,.07,'triangle',.12)},
  ok(){this.tone(660,.13,'triangle',.22);this.tone(880,.13,'triangle',.22,.09);this.tone(1320,.22,'triangle',.18,.18)},
  no(){this.tone(220,.22,'sawtooth',.09);this.tone(180,.28,'sawtooth',.08,.12)},
  pop(){this.tone(500,.09,'sine',.25,0,1300);this.noise(.06,.08)},
  coin(){this.tone(988,.08,'square',.08);this.tone(1319,.25,'square',.08,.07)},
  flip(){this.noise(.08,.12,0,2500)},
  whoosh(){this.noise(.35,.1,0,400)},
  step(){this.tone(330,.06,'triangle',.12)},
  tick(){this.tone(1500,.03,'square',.04)},
  star(){[784,988,1175,1568].forEach((f,i)=>this.tone(f,.16,'triangle',.16,i*.08))},
  win(){[523,659,784,1047,784,1047].forEach((f,i)=>this.tone(f,.22,'triangle',.2,i*.12));this.noise(.5,.05,.6,3000)},
  lose(){[392,349,311,262].forEach((f,i)=>this.tone(f,.28,'triangle',.15,i*.18))},

/* =================== confetti =================== */
const FX={cv:null,parts:[],run:false,
  burst(n=120,x,y){if(!this.cv){this.cv=document.createElement('canvas');this.cv.id='fx';document.body.appendChild(this.cv)}
    const c=this.cv;c.width=innerWidth;c.height=innerHeight;x=x??innerWidth/2;y=y??innerHeight/3;
    const cols=['#2f7cf6','#16a36a','#f97316','#7c4dff','#ec4899','#f5b300'];
    for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=4+Math.random()*9;this.parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-6,r:4+Math.random()*6,c:pick(cols),rot:Math.random()*6,vr:(Math.random()-.5)*.4,life:120+Math.random()*60})}
    if(!this.run){this.run=true;this.loop()}},
  loop(){const c=this.cv,g=c.getContext('2d');g.clearRect(0,0,c.width,c.height);this.parts=this.parts.filter(p=>p.life-->0&&p.y<c.height+40);

function scrSlides(el,id){const l=lessonById(id);if(!l)return go('');setAcc(l.dom);crumb([{t:'الرئيسية',h:''},{t:'الدرس '+l.code,h:'l/'+l.id},{t:'العرض التفاعلي'}]);

/* Arabic number words (0..99999) */
const _U=['','واحد','اثنان','ثلاثة','أربعة','خمسة','ستة','سبعة','ثمانية','تسعة'];
const _T=['','عشرة','عشرون','ثلاثون','أربعون','خمسون','ستون','سبعون','ثمانون','تسعون'];
const _H=['','مائة','مئتان','ثلاثمائة','أربعمائة','خمسمائة','ستمائة','سبعمائة','ثمانمائة','تسعمائة'];
function w99(n){if(n<10)return _U[n];if(n===10)return 'عشرة';if(n===11)return 'أحد عشر';if(n===12)return 'اثنا عشر';if(n<20)return _U[n-10]+' عشر';const u=n%10,t=Math.floor(n/10);return u?_U[u]+' و'+_T[t]:_T[t]}
function w999(n){const h=Math.floor(n/100),r=n%100;const p=[];if(h)p.push(_H[h]);if(r)p.push(w99(r));return p.join(' و')}
function numWord(n){if(n===0)return 'صفر';const th=Math.floor(n/1000),r=n%1000;const p=[];
  if(th){if(th===1)p.push('ألف');else if(th===2)p.push('ألفان');else if(th<=10)p.push((th===10?'عشرة':_U[th])+' آلاف');else p.push(w99(th)+' ألفًا')}
  if(r)p.push(w999(r));return p.join(' و')}
const expand=(n,sep=' + ')=>{const s=String(n);return s.split('').map((d,i)=>d+'0'.repeat(s.length-1-i)).filter(x=>+x).join(sep)};
const digitsOf=n=>String(n).split('').map(Number);
const placeName=(n,pos)=>['آحاد','عشرات','مئات','آلاف','عشرات الآلاف'][pos];
function uniqNums(n,gen){const s=new Set();let g=0;while(s.size<n&&g++<500)s.add(gen());return [...s]}

/* =================== answer boxes + keypad =================== */
function Keypad(area,keys=''){const boxes=[];let cur=null;
  const kp=document.createElement('div');kp.className='kp nd';
  const ks=['7','8','9','⌫','1','2','3','0','4','5','6'];
  const extra=keys.split('').filter(Boolean).map(k=>k==='-'?'−':k);
  let html='';['1','2','3','4','5','6','7','8','9','0'].forEach(k=>html+=`<button data-k="${k}">${D(k)}</button>`);
  extra.forEach(k=>html+=`<button class="sym" data-k="${k}">${k===','?(Dig.on()?'٫':','):k}</button>`);html+='<button class="del" data-k="del">⌫</button>';
  kp.innerHTML=html;kp.style.gridTemplateColumns=`repeat(${Math.min(6,Math.ceil((11+extra.length)/2))},1fr)`;
  const api={boxes,kp,
    add(b){b.classList.add('ab');b.dataset.v='';boxes.push(b);b.onclick=()=>{S.tap();api.focus(b)};if(!cur)api.focus(b);return b},
    focus(b){if(b.dataset.lock)return;boxes.forEach(x=>x.classList.remove('foc'));cur=b;b.classList.add('foc')},
    type(k){if(!cur||cur.dataset.lock)return;let v=cur.dataset.v;if(k==='del')v=v.slice(0,-1);else if(v.length<9){if(k==='−'){v=v.startsWith('-')?v.slice(1):'-'+v}else v+=k}
      cur.dataset.v=v;cur.textContent=v.replace(/^-/,'−');cur.classList.remove('wrong','right')},
    next(){const i=boxes.indexOf(cur);if(i>=0&&i<boxes.length-1)api.focus(boxes[i+1])},
    mount(){if(boxes.length){area.appendChild(kp)}},
    lock(){boxes.forEach(b=>{b.dataset.lock=1;b.classList.remove('foc')})}};

function closest1000(el){const d=[2,4,5,6,9];let cur=[];let best=null;

     <div class="flexc mt" style="font-size:34px;font-weight:900;gap:10px"><div class="row nd" style="direction:ltr;gap:6px">${[0,1,2].map(k=>`<div class="slot" style="min-width:60px;min-height:66px">${cur[k]!=null?D(d[cur[k]]):''}</div>`).join('')}</div><span>+</span><span>300</span><span>=</span><span class="chip" style="font-size:32px;min-width:100px;${s===995?'border-color:#16a36a;background:#dcfce7':''}">${s!=null?D(s):'?'}</span></div>

/* book-style maze: start 100, end 10000, dead-end traps (numbers with no bigger neighbour) */
function bookMaze(H=5,W=6){for(let t=0;t<300;t++){const st=[R(0,H-1),0];const path=[st];const seen=new Set([st.join()]);let cur=st,g=0;
    while(cur[1]<W-1&&g++<200){const nb=[[cur[0]+1,cur[1]],[cur[0]-1,cur[1]],[cur[0],cur[1]+1],[cur[0],cur[1]+1]].filter(p=>p[0]>=0&&p[0]<H&&p[1]<W&&!seen.has(p.join())&&!(p[1]<cur[1]));if(!nb.length)break;cur=pick(nb);seen.add(cur.join());path.push(cur)}
    if(cur[1]!==W-1||path.length<W+2)continue;const n=path.length;const mids=uniqNums(n-2,()=>R(130,9900)).sort((a,b)=>a-b);if(mids.length<n-2)continue;const vals=[100,...mids,10000];
    const cells=range(1,H).map(()=>range(1,W).map(()=>null));path.forEach((p,k)=>cells[p[0]][p[1]]=vals[k]);
    const adj=(r,c)=>[[r+1,c],[r-1,c],[r,c+1],[r,c-1]].filter(q=>q[0]>=0&&q[0]<H&&q[1]>=0&&q[1]<W);
    for(let r=0;r<H;r++)for(let c=0;c<W;c++)if(cells[r][c]==null){const pv=adj(r,c).map(q=>cells[q[0]][q[1]]).filter(v=>v!=null);
      if(!pv.length){cells[r][c]=R(150,9800);continue}const mx=Math.max(...pv),mn=Math.min(...pv);
      if(Math.random()<.45&&mx<9400)cells[r][c]=mx+R(3,450);else cells[r][c]=Math.max(20,mn-R(2,Math.max(3,Math.floor(mn*.35))))}
    return{cells,start:st,end:path[n-1]}}
  return makeIncMaze(5,6,100,10000)}

function signsPuzzle(el){const rows=[[60,6,10],[10,15,150],[450,10,45]];const ops=rows.map(()=>['?','?']);const cyc=['×','÷','='];

    P.forEach(([a,v,k],i)=>{const r=a*Math.PI/180;const x=200+140*Math.cos(r),y=200+140*Math.sin(r);const c=cc[i%4];const show=k||open.has(i);s+=`<g data-i="${i}" style="cursor:${show?'default':'pointer'}"><circle cx="${x}" cy="${y}" r="40" fill="${show?c:'#fff'}" stroke="${c}" stroke-width="4" ${k?'':'stroke-dasharray="6 5"'}/><text x="${x}" y="${y+10}" text-anchor="middle" font-size="28" font-weight="900" fill="${show?'#fff':c}">${show?v:'؟'}</text></g>`});
    s+=`<circle cx="200" cy="200" r="46" fill="#7c4dff"/><text x="200" y="212" text-anchor="middle" font-size="34" font-weight="900" fill="#fff">100</text></svg>`;
    el.innerHTML=`<div class="flexc"><div>${s}</div><div style="max-width:360px"><div class="box tip">⭐ كل دائرتين متقابلتين بنفس اللون مجموعهما <b>100</b>. فكّر ثم اضغط على كل <b>؟</b></div><div class="box" style="font-size:16px">💡 مجموع رقمي الآحاد = 10، ومجموع رقمي العشرات = 90.<br>مثال: 37 + 63 = 100 ← 7 + 3 = 10 ، 30 + 60 = 90</div>
     ${[...open].map(i=>{const j=(i+4)%8;return `<div class="pill" style="font-size:17px;margin:3px;background:${cc[i%4]}22;color:#1e293b">${P[j][1]} + ${P[i][1]} = 100</div>`}).join('')}</div></div>`;
    $$('g[data-i]',el).forEach(g=>g.onclick=()=>{const i=+g.dataset.i;if(P[i][2]||open.has(i))return;open.add(i);S.pop();if(open.size===4){S.win();FX.burst(70)}draw()})}
  draw()}

function qAddFill(big){const [a,b]=genAdd(big);const pa=P3(a),pb=P3(b);const r=pa.map((v,j)=>v+pb[j]);
  return K.fill(`جزّئ كل عدد إلى مئات وعشرات وآحاد، ثم أوجد الناتج:`,`${a} + ${b} = ${colP(pa)} + ${colP(pb)}<br>= [[${r[0]}]] + [[${r[1]}]] + [[${r[2]}]] = [[${a+b}]]`,{sm:1,h:'اجمع المئات مع المئات، والعشرات مع العشرات، والآحاد مع الآحاد، ثم اجمع النواتج.',ex:`${a} + ${b} = ${r.join(' + ')} = ${a+b}`})}
function qSubReg(o={}){const [a,b]=genSubReg();const d=a-b;return K.num(`${o.pre||''}${a} − ${b} = [?]`,d,{h:'أعد تجزئة العدد الأول ليكون فيه آحاد وعشرات كافية.',ex:`${a} = ${regroupFor(a,b).join(' + ')} ← ${a} − ${b} = ${d}`,v:o.v?subTable(a,b,regroupFor(a,b),true):undefined})}
function qSub2(){const [a,b]=genSub2();return K.num(`أوجد الناتج: ${a} − ${b} = [?]`,a-b,{ex:`${a} − ${b} = ${a-b}، وللتحقق: ${a-b} + ${b} = ${a}`})}
function qInverse(){const [a,b]=pick([genSubReg,genSubEasy])();const d=a-b;const f=Math.random()<.5;
  if(f)return K.mc(`حسبت مها: ${a} − ${b} = ${d}. أيّ عملية تستخدمها للتحقق من إجابتها؟`,`${d} + ${b} = ${a}`,[...new Set([`${a} − ${b} = ${d}`,`${a} + ${b} = ${a+b}`,`${a} + ${d} = ${a+d}`,`${a} + ${a} = ${2*a}`])].filter(w=>w!==`${d} + ${b} = ${a}`).slice(0,3),{cols:2,ex:'الجمع معكوس الطرح: الناتج + المطروح = المطروح منه.'});
  const [x,y]=genAdd();return K.mc(`حسب بدر: ${x} + ${y} = ${x+y}. أيّ عملية تستخدمها للتحقق من إجابته؟`,`${x+y} − ${y} = ${x}`,[...new Set([`${x+y} + ${y} = ${x+2*y}`,`${x} + ${y} = ${x+y}`,`${x+y} + ${x} = ${2*x+y}`,`${x+y} + ${x+y} = ${2*(x+y)}`])].slice(0,3),{cols:2,ex:'الطرح معكوس الجمع.'})}
function qEstimate(){const t=R(0,1);const a=R(2,7)*100+pick([R(1,9),100-R(1,9)]),b=R(1,2)*100+pick([R(1,9),100-R(1,9)]);
  const ra=Math.round(a/100)*100,rb=Math.round(b/100)*100;
  if(t===0){const e=ra+rb;return K.mc(`قدّر ناتج ${a} + ${b} (قرّب كل عدد لأقرب مائة):`,e,[e+100,e-100,e+200].filter(v=>v>0),{ex:`${a} ≈ ${ra} و ${b} ≈ ${rb} ← ${ra} + ${rb} = ${e}`})}
  const A=a+300;const rA=Math.round(A/100)*100;const e=rA-rb;return K.mc(`قدّر ناتج ${A} − ${b} (قرّب كل عدد لأقرب مائة):`,e,[e+100,e-100,e+200].filter(v=>v>0),{ex:`${A} ≈ ${rA} و ${b} ≈ ${rb} ← ${rA} − ${rb} = ${e}`})}

function raceQ(){const t=R(0,2);

  if(t===1){const [a,b]=genSub2();const d=a-b;return K.gq(`${a} − ${b} = ؟`,d,wr(d,[placeErr(a,b)].filter(v=>v!==d)))}

/* stick-triangle pattern n */

  function fillT(n){fresh=new Set();for(let k=1;k<=10;k++)[[n,k],[k,n]].forEach(([r,c])=>{const key=r*100+c;if(fill[key]==null){fill[key]=n;fresh.add(key)}})}

function qFactMc(){const [a,b]=f2();return K.mc(`${a} × ${b} = ؟`,a*b,shuffle(wrongs(a,b)).slice(0,3),{ex:`${a} × ${b} = ${a*b} و ${b} × ${a} = ${a*b}`})}
function qMissing(){const [a,b]=f2();return pick([K.num(`${a} × [?] = ${a*b}`,b,{h:`عُدّ بجدول ${a}: كم مرة حتى تصل إلى ${a*b}؟`,ex:`${a} × ${b} = ${a*b}`}),K.num(`[?] × ${b} = ${a*b}`,a,{h:`استخدم القسمة: ${a*b} ÷ ${b}`,ex:`${a} × ${b} = ${a*b}`})])}

function qMultPick(){const n=pick([5,10,100]);const lim=n===100?1000:n===10?500:100;const yes=uniqNums(3,()=>n*R(1,Math.floor(lim/n)));

function speedQ(){const t=R(0,3);const [a,b]=f2();const p=a*b;

const dErr=n=>{const t=Math.floor(n/10),u=n%10;return +(String(2*t)+String(2*u))};/* 48 -> 816 */
function dWr(n){const d=2*n;return [...new Set([n+2,d+10,d-10,dErr(n),d+1,d-2].filter(v=>v>0&&v!==d))]}
const twoD=()=>{let n;do{n=R(16,49)}while(n%10===0||n%10<5&&Math.random()<.6);return n};
function qDbl(){const n=twoD();return K.mc(`ما ضعف العدد ${n}؟`,2*n,shuffle(dWr(n)).slice(0,3),{ex:`${Math.floor(n/10)*10} × 2 = ${Math.floor(n/10)*20} و ${n%10} × 2 = ${n%10*2} ← ${2*n}`})}
function qDbl10(){const n=twoD();const k=pick([10,100]);const m=n*k;return K.num(`ضعف ${n} هو ${2*n}. إذن ضعف ${m} = [?]`,2*m,{h:'إذا كان العدد أكبر بعشر مرات فضعفه أكبر بعشر مرات.',ex:`ضعف ${m} = ${2*m}`})}
function qMul10(){const a=R(2,9),b=R(2,9);return K.fill(`أكمل: ${a*10} × ${b}`,`${a*10} × ${b} = ${a} × ${b} × 10 = [[${a*b}]] × 10 = [[${a*b*10}]]`,{sm:1,h:`احسب ${a} × ${b} أولًا ثم اضرب في 10.`})}
function qSeq(){const s=pick([2,3,5,6,7]);const q=[s,2*s,4*s,8*s,16*s];const hideAt=[3,4];return K.fill('قاعدة المتسلسلة: ضاعف العدد في كل مرة. أكمل:',q.map((v,i)=>hideAt.includes(i)?`[[${v}]]`:v).join('، '),{sm:1,h:'اضرب كل عدد في 2.'})}
function qMachine(){const v=R(6,24);return K.num(`⚙️ آلة: «ضاعِف ثم اطرح 1». إذا كان المدخل ${v}، فما المخرج؟ [?]`,2*v-1,{v:`<div class="flexc">${V.machine('ضعف',v,'')}${V.machine('− 1','','?')}</div>`,ex:`${v} × 2 = ${2*v} ، ${2*v} − 1 = ${2*v-1}`})}
function qThink(){const n=R(6,45);return K.num(`يفكّر أحمد في عدد: «إذا ضاعفتُ عددي تكون الإجابة ${2*n}». ما عدده؟ [?]`,n,{h:`ابحث عن نصف ${2*n}.`,ex:`نصف ${2*n} = ${n} لأن ${n} × 2 = ${2*n}`})}
function qHalf(){const s=pick([64,96,48,80,128]);const q=[s,s/2,s/4,s/8,s/16];return K.fill('قاعدة المتسلسلة: النصف في كل مرة. أكمل:',q.map((v,i)=>i>=2?`[[${v}]]`:v).join('، '),{sm:1,h:'اقسم كل عدد على 2.'})}

function spaceQ(){const t=R(0,3);
  if(t===0){const n=twoD();return K.gq(`ضعف ${n} = ؟`,2*n,dWr(n))}
  if(t===1){const n=R(3,9)*10+pick([0,5]);return K.gq(`ضعف ${n*10} = ؟`,n*20,[n*2,n*200,n*20+10,n*20-10])}
  if(t===2){const a=R(2,9),b=R(2,9);return K.gq(`${a*10} × ${b} = ؟`,a*b*10,[a*b,a*b*100,(a*b+1)*10,a*10+b])}
  const n=R(6,49)*2;return K.gq(`نصف ${n} = ؟`,n/2,[n/2+1,n/2-1,n*2,n/2+10].filter(v=>v>0))}
function quizQ(){const t=R(0,6);
  if(t===0){const n=twoD();return K.gq(`ما ضعف ${n}؟`,2*n,dWr(n),`جزّئ ${n}: ضاعف العشرات ثم الآحاد واجمع.`)}
  if(t===1){const a=R(3,9);const s=[a,2*a,4*a];return K.gq(`${s.join('، ')}، ؟ (ضاعف كل مرة)`,8*a,[6*a,8*a+2,5*a],'اضرب آخر عدد في 2.')}
  if(t===2){const x=R(3,12);return K.gq(`آلة «ضاعِف ثم اطرح 1»: المدخل ${x}، المخرج = ؟`,2*x-1,[2*x,2*x+1,x-1,2*x-2],`${x} × 2 = ${2*x} ثم اطرح 1`)}
  if(t===3){const k=R(2,5);const T=k*(k+1)/2;return K.gq(`ضاعفتُ العدد المثلث ${T} فصنعتُ مستطيلًا. ما أبعاده؟`,`${k+1} × ${k}`,[`${k} × ${k}`,`${k+1} × ${k+1}`,`${k+2} × ${k}`],'الطول يزيد بواحد عن العرض.')}
  if(t===4){const a=R(2,9),b=R(2,9);return K.gq(`${a*10} × ${b} = ؟`,a*b*10,[a*b,a*b*100,a*10+b],`${a} × ${b} = ${a*b} ثم × 10`)}
  if(t===5){const n=R(3,12);return K.gq(`أيّ عدد فردي يساوي «ضعف ${n} + 1»؟`,2*n+1,[2*n,2*n+2,n+1],'ضاعف ثم أضف 1.')}
  const b=pick([2,3,4,5]);const a=R(2,9);return K.gq(`؟ ÷ ${b} = ${a}`,a*b,[a+b,a*b+b,a*b-1].filter(v=>v>0),`استخدم المعكوس: ${a} × ${b}`)}
function dblStr(){const n=R(12,49);const d=2*n;if(Math.random()<.5)return `ضعف ${n} = ${d}`;return `ضعف ${n} = ${pick(dWr(n))}`}

function qEst(){let a;do{a=two()}while(a%10===5);const b=R(3,9);const r=Math.round(a/10)*10;const e=r*b;return K.mc(`أيّ تقدير هو الأنسب لناتج ${a} × ${b}؟`,e,[...new Set([e+b*10,e-b*10,e+100].filter(v=>v>0&&v!==e))],{ex:`${a} ≈ ${r} ← ${r} × ${b} = ${e} (والناتج الدقيق ${a*b})`})}
const SHOP=[['✏️','تُباع أقلام الرصاص في رزم، ثمن الرزمة {p} بيسة. اشترت فاطمة {n} رزم. كم أنفقت؟','بيسة'],['🧃','ثمن علبة العصير {p} بيسة. اشترى بدر {n} علب. كم دفع؟','بيسة'],['📒','ثمن الدفتر {p} بيسة. اشترت ريم {n} دفاتر. كم دفعت؟','بيسة'],['🚌','تقطع حافلة المدرسة {p} كم يوميًا. كم كيلومترًا تقطع في {n} أيام؟','كم']];
function qShop(){const [e,t,u]=pick(SHOP);const p=two(),n=R(3,6);return K.num(`${e} ${t.replace('{p}',p).replace('{n}',n)} [?]`,p*n,{u,h:`${p} × ${n}`,ex:`${p} × ${n} = ${p*n}`})}
function qInk(){const a=two(),b=R(3,9);const k=pick(['tb','ub','t']);const t=Math.floor(a/10)*10,u=a%10;const ans={tb:t*b,ub:u*b,t}[k];return K.num(`سقط الحبر على شبكة خالد لحساب ${a} × ${b}. ما العدد تحت بقعة الحبر؟ [?]`,ans,{v:gridT(a,b,{ink:[k]}),h:'تذكّر القيمة المكانية للعشرات.',ex:`${a} × ${b} = ${u*b} + ${t*b} = ${a*b}`})}

(function(){
/* ---------- time helpers (t = minutes since midnight, 24h) ---------- */
const pad=n=>String(n).padStart(2,'0');
const T=(h,m)=>pad(((h-1+120)%12)+1)+':'+pad(m);
const f12=t=>{t=((t%1440)+1440)%1440;const h=Math.floor(t/60),m=t%60;return {s:T(h%12||12,m),ap:h<12?'ص':'م',apL:h<12?'صباحًا':'مساءً'}};
const fs=t=>{const f=f12(t);return f.s+' '+f.ap};
const fL=t=>{const f=f12(t);return f.s+' '+f.apL};
const hrs=h=>h===1?'ساعة واحدة':h===2?'ساعتان':h<=10?h+' ساعات':h+' ساعة';
const mns=m=>m===1?'دقيقة واحدة':m===2?'دقيقتان':m<=10?m+' دقائق':m+' دقيقة';
const dur=d=>{const h=Math.floor(d/60),m=d%60;return [h?hrs(h):'',m?mns(m):''].filter(Boolean).join(' و ')||'0 دقيقة'};
const blankHM=d=>`الساعات: [[${Math.floor(d/60)}]] &nbsp; الدقائق: [[${d%60}]]`;
const DN=['الأحد','الإثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
/* ---------- book data ---------- */
const ST=['سمائل','نزوى','عبري','ينقل'],TR=['أ','ب','ج'];
const BUS=[[480,560,665,740],[600,680,785,860],[750,830,935,1010]];   // 08:00 ص … 04:50 م (verified against the book)

const FLY=[['322','دبي',630],['351','بيروت',635],['151','الدوحة',645],['382','القاهرة',660]];
const NOV={start:3,days:30};const dowNov=d=>(NOV.start+d-1)%7;
const MON=[['يناير',31],['فبراير','28 أو 29'],['مارس',31],['أبريل',30],['مايو',31],['يونيو',30],['يوليو',31],['أغسطس',31],['سبتمبر',30],['أكتوبر',31],['نوفمبر',30],['ديسمبر',31]];
/* ---------- visuals ---------- */
function busTable(hl=[],o={}){const cell=(r,c)=>{const on=hl.some(([a,b])=>a===r&&b===c);return `<td style="${on?'background:#fff1c2;color:#b45309;font-weight:900;box-shadow:inset 0 0 0 2px #f5b300':''}">${fs(BUS[c][r])}</td>`};

/* RTL timeline: time flows from right to left like the book */
function tl(pts,o={}){const W=o.w||720,m=64,y=o.top?112:86,H=y+(o.st?74:56);const t0=pts[0],tot=pts[pts.length-1]-t0||1;const wts=pts.slice(1).map((p,k)=>Math.max(p-pts[k],o.exact?0:tot*.2));const cum=[0];wts.forEach(v=>cum.push(cum[cum.length-1]+v));const PX=pts.map((p,k)=>W-m-cum[k]/(cum[cum.length-1]||1)*(W-2*m));const X=t=>PX[pts.indexOf(t)];const vis=o.vis??pts.length;
  let s=`<svg viewBox="0 0 ${W} ${H}" style="width:100%;max-width:${W}px" direction="ltr"><line x1="${W-m+18}" x2="${m-22}" y1="${y}" y2="${y}" stroke="#334155" stroke-width="3"/><path d="M${m-30} ${y} l12 -7 v14z" fill="#334155"/>`;
  if(o.top){const a=X(pts[0]),b=X(pts[pts.length-1]);s+=`<path d="M${a} ${y-8} Q${(a+b)/2} ${y-150} ${b} ${y-8}" fill="none" stroke="#e5484d" stroke-width="2.5" stroke-dasharray="6 4"/><text x="${(a+b)/2}" y="${y-86}" direction="rtl" text-anchor="middle" font-size="16" font-weight="900" fill="#e5484d">${o.top}</text>`}
  pts.forEach((p,k)=>{const x=X(p),f=f12(p);const on=k<vis;s+=`<g opacity="${on?1:.18}"><line x1="${x}" x2="${x}" y1="${y-10}" y2="${y+10}" stroke="#334155" stroke-width="3"/><circle cx="${x}" cy="${y}" r="5" fill="${COLS[k%COLS.length]}"/><text x="${x}" y="${y+30}" text-anchor="middle" font-size="17" font-weight="900" fill="#1e293b">${f.s}</text>${o.ap!==false?`<text x="${x}" y="${y+48}" text-anchor="middle" font-size="13" font-weight="800" fill="#64748b">${f.ap}</text>`:''}${o.st&&o.st[k]?`<text x="${x}" y="${y+66}" text-anchor="middle" font-size="15" font-weight="900" fill="#f97316">${o.st[k]}</text>`:''}</g>`;
    if(k&&k<vis){const x0=X(pts[k-1]);const c=COLS[k%COLS.length];const hh=k%2?44:62;s+=`<path d="M${x0-4} ${y-10} Q${(x0+x)/2} ${y-hh-22} ${x+4} ${y-10}" fill="none" stroke="${c}" stroke-width="3"/><path d="M${x+4} ${y-10} l-1 -11 l9 6z" fill="${c}"/><text x="${(x0+x)/2}" y="${y-hh+2}" direction="rtl" text-anchor="middle" font-size="14" font-weight="900" fill="${c}">${o.lab&&o.lab[k-1]!=null?o.lab[k-1]:dur(p-pts[k-1])}</text>`}});
  return s+'</svg>'}
const jumps=(a,b)=>{const p=[a];let t=a;if(t%60){const n=Math.ceil(t/60)*60;if(n<=b){t=n;p.push(t)}}while(t+60<=b&&t%60===0){const k=Math.floor((b-t)/60);t+=k*60;p.push(t)}if(t<b)p.push(b);return p};

  K.num('يلعب حسام الكرة كل سبت، وأول سبت هو 1 ديسمبر. كم مرة يلعب في ديسمبر (31 يومًا)؟ [?] مرّة',5,{h:'أضف 7 كل مرة: 1، 8، …',ex:'1، 8، 15، 22، 29 ← 5 مرات'}),

function stickerRead(el){let sel=null;const says=['سارة: العمود يصل إلى 4 تدريجات فوق الخط 10 ← 14','هيثم: تدريج واحد تحت الخط 20 ← 19','فريدة: 3 تدريجات فوق الخط 10 ← 13','مروة: تدريج واحد فوق الخط 15 ← 16','عامر: تدريج واحد فوق الخط 20 ← 21'];
  function draw(){el.innerHTML=`<div class="flexc"><div style="flex:1;min-width:320px;max-width:470px">${STKchart({sel,click:1,w:460})}</div><div style="min-width:240px;max-width:340px"><div class="box acc center">${sel==null?'👆 اضغط على أيّ عمود لقراءة قيمته':`<div class="bigeq" style="margin:4px">${STK.v[sel]} ملصقًا</div><div style="font-weight:700">${says[sel]}</div>`}</div><div class="box tip" style="font-size:16px">💡 بين كل خطّين رئيسيين (5، 10، 15…) توجد تدريجات صغيرة، كل تدريج = ملصق واحد.</div></div></div>`;
    $$('rect[data-i]',el).forEach(r=>r.onclick=()=>{sel=+r.dataset.i;S.pop();draw()})}
  draw()}
function scalePick(el){let st=5;const note={1:'❌ الخطوة 1: أعداد كثيرة جدًّا على المحور (من 0 إلى 35)، والرسم مزدحم وصعب القراءة.',5:'✅ الخطوة 5: مناسبة! أكبر قيمة 33 فنصل إلى 35 في 7 خطوات، والقيم الصغيرة مثل 3 و 7 سهلة القراءة.',10:'⚠️ الخطوة 10: خطوط قليلة، فيصعب تحديد قيم مثل 3 و 7 و 9 و 6 بدقة.'};
  function draw(){el.innerHTML=`<div class="row" style="justify-content:center"><b>اختر خطوة المحور الرأسي:</b>${[1,5,10].map(k=>`<button class="btn sm ${k===st?'':'ghost'}" data-s="${k}">${k}</button>`).join('')}</div>
    <div class="center mt" style="max-width:640px;margin:auto">${chart(TRF.e.map((e,i)=>e+' '+TRF.c[i].split(' ')[0]+(i===3?' صغيرة':'')),TRF.v,{max:Math.ceil(35/st)*st,step:st,w:600,h:320,fs:st===1?9:13,yl:'عدد المركبات'})}</div>
    <div class="box ${st===5?'ok':'warn'}">${note[st]}</div>`;
    $$('[data-s]',el).forEach(b=>b.onclick=()=>{st=+b.dataset.s;S.pop();draw()})}

const qTallyRead=(lo=8,hi=29)=>{const n=R(lo,hi);return K.num('ما العدد الذي تمثّله علامات العدّ؟ [?]',n,{v:V.tally(n,{h:44}),h:'عُدّ بالخمسات: كل حزمة مشطوبة = 5، ثم أضف العلامات المنفردة.',ex:`${Math.floor(n/5)} حزم × 5 = ${Math.floor(n/5)*5}، و ${n%5} علامات ← ${n}`})};
const qTallyDraw=(lo=6,hi=18)=>{const n=R(lo,hi);return{type:'tally',q:`ارسم علامات العدّ للعدد <b>${n}</b>.`,a:n,h:`${n} = ${Math.floor(n/5)} حزم (كل حزمة 5) و ${n%5} علامات`}};
const qBarRead=()=>{const d=mkData(4,2,20);const i=R(0,3);return K.num(`يوضّح الرسم «${d.t}». كم تلميذًا اختار ${d.cats[i]}؟ [?]`,d.vals[i],{v:chart(d.cats,d.vals,{max:20,step:5,minor:1,w:400,h:250,yl:'عدد التلاميذ'}),h:'انظر إلى رأس العمود، ثم اتبع خطًّا أفقيًّا إلى المحور، واحسب التدريجات الصغيرة (كل تدريج = 1).'})};
const qMostLeast=()=>{const d=mkData(4,3,19);const most=Math.random()<.5;const i=d.vals.indexOf(most?Math.max(...d.vals):Math.min(...d.vals));return K.mc(`الجدول يوضّح «${d.t}». ما ${most?'الأكثر':'الأقلّ'} اختيارًا؟`,d.cats[i],d.cats.filter((_,k)=>k!==i),{v:tallyTable(['الاختيار','علامات العد'],d.cats.map((c,k)=>[c,d.vals[k]])),cols:2,h:'حوّل علامات كل صف إلى عدد ثم قارن.'})};
const qDiff=()=>{const d=mkData(4,2,20);let [i,j]=shuffle([0,1,2,3]).slice(0,2);if(d.vals[i]<d.vals[j])[i,j]=[j,i];return K.num(`بكم يزيد عدد من اختاروا ${d.cats[i]} عن عدد من اختاروا ${d.cats[j]}؟ [?]`,d.vals[i]-d.vals[j],{v:chart(d.cats,d.vals,{max:20,step:5,minor:1,w:400,h:250}),h:'اقرأ قيمتَي العمودين ثم اطرح الأصغر من الأكبر.',ex:`${d.vals[i]} − ${d.vals[j]} = ${d.vals[i]-d.vals[j]}`})};
const qBuild=()=>{const d=mkData(3,1,10);return{type:'bars',q:`مثّل بيانات «${d.t}» بالأعمدة (استخدم ▲ ▼):`,v:tallyTable(['الاختيار','علامات العد'],d.cats.map((c,k)=>[c,d.vals[k]]))+BF,cats:d.cats,a:d.vals,max:10,step:2,h:'حوّل علامات العد إلى أعداد، ثم ارفع كل عمود حتى يصل إلى عدده.'}};
const qTotal=()=>{const d=mkData(4,2,15);return K.num(`كم تلميذًا شارك في استبانة «${d.t}»؟ [?]`,sum(d.vals),{v:tallyTable(['الاختيار','علامات العد'],d.cats.map((c,k)=>[c,d.vals[k]])),h:'حوّل كل صف إلى عدد، ثم اجمع الأعداد.',ex:d.vals.join(' + ')+' = '+sum(d.vals)})};
const qTF=()=>{const d=mkData(3,3,19);const [a,b]=[0,1];const diff=Math.abs(d.vals[a]-d.vals[b]);const big=d.vals[a]>d.vals[b]?a:b,small=big===a?b:a;const tr=Math.random()<.5;const n=tr?diff:diff+(diff>2?pick([1,2,-1]):pick([1,2]));
  return K.tf(`عدد من اختاروا ${d.cats[big]} أكثر من عدد من اختاروا ${d.cats[small]} بـ ${n}.`,n===diff,{v:chart(d.cats,d.vals,{max:20,step:5,minor:1,w:360,h:230,vals:1}),ex:`${d.vals[big]} − ${d.vals[small]} = ${diff}`})};
const ladItems=()=>{const d=mkData(3,1,10);const a=R(7,19),b=R(11,24);const n=R(8,23);const c=mkData(4,2,20);const i=R(0,3);
  return [{type:'tally',q:`✏️ ارسم علامات العدّ للعدد <b>${a}</b>.`,a},
   K.num('🔢 ما العدد الذي تمثّله العلامات؟ [?]',n,{v:V.tally(n,{h:40})}),
   {type:'bars',q:`📊 مثّل بيانات «${d.t}» بالأعمدة:`,v:tallyTable(['الاختيار','علامات العد'],d.cats.map((x,k)=>[x,d.vals[k]]))+BF,cats:d.cats,a:d.vals,max:10,step:2},
   K.num(`📏 اقرأ الرسم: كم تلميذًا اختار ${c.cats[i]}؟ [?]`,c.vals[i],{v:chart(c.cats,c.vals,{max:20,step:5,minor:1,w:380,h:230})}),
   {type:'tally',q:`🚦 مرّت ${b} سيارة قرب المدرسة. سجّلها بعلامات العدّ.`,a:b},
   {type:'bars',q:'🚲 مثّل بالأعمدة: الدراجات الهوائية 7، والنارية 9، والشاحنات 3.',cats:['🚲 هوائية','🏍️ نارية','🚚 شاحنة'],a:[7,9,3],max:10,step:2,v:BF}]};
const quizQ=()=>{const d=mkData(4,2,20);const ch=chart(d.cats,d.vals,{max:20,step:5,minor:1,w:360,h:210,cfs:13});const t=R(1,4);const q=x=>`<div style="max-width:380px;margin:auto">${ch}</div><div>${x}</div>`;
  if(t===1){const i=R(0,3);return K.gq(q(`كم تلميذًا اختار ${d.cats[i]}؟`),d.vals[i],near(d.vals[i],4,3),'كل تدريج صغير = 1')}
  if(t===2){const most=Math.random()<.5;const v=most?Math.max(...d.vals):Math.min(...d.vals);const i=d.vals.indexOf(v);return K.gq(q(`ما ${most?'الأكثر':'الأقلّ'} اختيارًا؟`),d.cats[i],d.cats.filter((_,k)=>k!==i),most?'ابحث عن أطول عمود':'ابحث عن أقصر عمود')}
  if(t===3){let [i,j]=shuffle([0,1,2,3]);if(d.vals[i]<d.vals[j])[i,j]=[j,i];const x=d.vals[i]-d.vals[j];return K.gq(q(`بكم يزيد ${d.cats[i]} عن ${d.cats[j]}؟`),x,near(x,4,3).concat([d.vals[i]+d.vals[j]]).filter(y=>y>0),'اطرح القيمتين')}
  const [i,j]=shuffle([0,1,2,3]);const x=d.vals[i]+d.vals[j];return K.gq(q(`كم مجموع من اختاروا ${d.cats[i]} و ${d.cats[j]}؟`),x,near(x,4,4),'اجمع القيمتين')};

  return `<table class="t nd" style="direction:ltr;margin:6px auto"><tr>${DPC.map((c,i)=>`<th style="background:${c[2]};color:${c[1]};font-size:${i===2?20:13}px;padding:6px 8px;max-width:84px;line-height:1.2">${c[0]}</th>`).join('')}</tr><tr>${d.map((x,i)=>`<td style="font-size:30px;font-weight:900;font-family:'Baloo Bhaijaan 2';color:${DPC[i][1]};min-width:${i===2?24:60}px;${o.hl===i?'background:#fff3c4;':''}">${bl.includes(i)?'<span style="color:#cbd5e1">?</span>':D(x)}</td>`).join('')}</tr></table>`}

const amt=(o={})=>{const r=R(o.rmin??1,o.rmax??60);const s=pick([R(1,999),R(1,9)*100,R(1,99)*10,R(1,9)*100+R(1,9)*10,R(100,999)]);return r*1000+s};
const qToRial=(o={})=>{const b=o.b??pick([R(1,9)*500,R(1,20)*100+R(0,9)*10+R(0,9),R(1100,9999),R(100,999)]);return K.num(`اكتب المبلغ ${b} بيسة بالريال: [?] ريال`,money(b),{keys:',',v:o.v,h:'اقسم على 1000: ضع الفاصلة قبل آخر ثلاثة أرقام، وأضف صفرًا في الآحاد إذا لزم.',ex:`${b} بيسة = ${RL(b)}`})};
const qToBaisa=(o={})=>{const b=o.b??amt({rmax:9});return K.num(`اكتب المبلغ ${RL(b)} بالبيسة: [?] بيسة`,b,{h:'اضرب في 1000: احذف الفاصلة (الريالات × 1000 + البيسات).',ex:`${RL(b)} = ${b} بيسة`})};
const qCmp=()=>{const t=R(0,2);let a,b;if(t===0){a=amt();b=pick([a+R(1,9)*100,a-R(1,9)*10,Math.floor(a/1000)*1000+R(0,999),a+1000*R(1,3)]);if(b===a||b<0)b=a+100;return K.cmp(RL(a),RL(b),{a:a>b?'>':a<b?'<':'=',q:'قارن بين المبلغين:',h:'قارن الريالات أولًا، فإذا تساوت قارن البيسات.'})}
  if(t===1){a=R(1000,9999);b=pick([a,a+R(1,500),a-R(1,500)]);return K.cmp(`${a} بيسة`,RL(b),{a:a>b?'>':a<b?'<':'=',q:'قارن بين المبلغين (انتبه للوحدة!):',h:`حوّل ${a} بيسة إلى ريال أولًا.`})}
  a=R(1200,4800);const c=R(20,90);b=a+c+pick([-R(1,15),R(1,15)]);return K.cmp(`${a} بيسة + ${c} بيسة`,`${b} بيسة`,{a:a+c>b?'>':a+c<b?'<':'=',q:'قارن:',h:`احسب ${a} + ${c} أولًا.`})};
const qOrder=()=>{const base=R(3,40);const xs=uniqNums(4,()=>pick([base,base+1,base+R(2,9)])*1000+R(1,9)*100+pick([0,50,25,0]));return K.ord('رتّب المبالغ من الأصغر إلى الأكبر:',[...xs].sort((a,b)=>a-b).map(RL),{h:'قارن الريالات، ثم البيسات.'})};
const qRound=(o={})=>{const b=o.b??R(1,60)*1000+pick([R(1,499),R(501,999),R(100,999)]);const r=Math.floor(b/1000)+(b%1000>=500?1:0);return K.num(`قرّب ${RL(b)} إلى أقرب ريال: [?] ريال`,r,{v:o.v?nl(b):undefined,h:'انظر إلى البيسات: 500 فأكثر ← نقرّب للأعلى، وأقل من 500 ← تبقى الريالات كما هي.',ex:`${money(b)} ← ${r}`})};
const qDigit=()=>{const b=amt({rmax:99});const s=String(b%1000).padStart(3,'0');const k=R(0,2);const d=+s[k];if(!d)return qDigit();const val=d*[100,10,1][k];
  return K.num(`كم بيسة يمثّل الرقم <b class="hl">${d}</b> الواقع في منزلة «${['جزء من عشرة','جزء من مائة','جزء من ألف'][k]}» في المبلغ ${RL(b)}؟ [?] بيسة`,val,{v:dpv(b,{hl:3+k}),h:'جزء من عشرة = 100 بيسة ، جزء من مائة = 10 بيسات ، جزء من ألف = بيسة واحدة.'})};
const qWords=()=>{const b=amt({rmax:80});const w=[b+100,b-10>1000?b-10:b+10,Math.floor(b/1000)*1000+(b%1000)%100*10%1000||b+1,b+9000].filter(x=>x!==b&&x>0);return K.mc(`اختر المبلغ: «${moneyW(b)}»`,RL(b),[...new Set(w.map(RL))].filter(x=>x!==RL(b)).slice(0,3),{cols:2})};
const qPay=(o={})=>{const b=o.b??pick([R(2,9)*25+R(0,1)*1000,R(1,4)*1000+R(1,19)*50,R(1,9)*100+R(1,9)*5]);return {type:'money',q:`ادفع المبلغ ${RL(b)} بالضبط:`,a:b,show:o.show,h:`${RL(b)} = ${b} بيسة. ابدأ بالأوراق الكبيرة ثم العملات الصغيرة.`}};
const qStory=()=>{const [n,f]=pick([['سالم',0],['ريم',1],['بدر',0],['مها',1],['خالد',0],['عائشة',1]]);const p=f?'ها':'ه';const a=R(3,9)*100+pick([50,0,25]),b=R(2,8)*100+pick([0,75,50]),c=R(1,2)*1000+R(1,4)*100;const t=a+b+c;
  return K.num(`مع ${n} ${a} بيسة، أعطت${p} أمّ${p} ${b} بيسة، وأعطا${p} أبو${p} ${RL(c)}. كم أصبح مع${p} بالريال؟ [?] ريال`,money(t),{keys:',',h:'حوّل كل المبالغ إلى بيسة، ثم اجمع، ثم حوّل الناتج إلى ريال.',ex:`${a} + ${b} + ${c} = ${t} بيسة = ${RL(t)}`})};

function nl(b){const r=Math.floor(b/1000),s=b%1000;const W=660,x0=40,x1=620;const X=v=>x0+v/1000*(x1-x0);const up=s>=500;
  return `<svg viewBox="0 0 ${W} 120" style="position:static;width:100%;max-width:${W}px;height:auto" direction="ltr"><rect x="${X(500)}" y="40" width="${X(1000)-X(500)}" height="26" fill="#dcfce7" opacity=".6"/><rect x="${X(0)}" y="40" width="${X(500)-X(0)}" height="26" fill="#e0f2fe" opacity=".6"/>
   <line x1="${x0}" y1="66" x2="${x1}" y2="66" stroke="#334155" stroke-width="3"/>${range(0,10).map(k=>`<line x1="${X(k*100)}" y1="${k===5?50:58}" x2="${X(k*100)}" y2="74" stroke="${k===5?'#e5484d':'#64748b'}" stroke-width="${k%5?2:3}"/>`).join('')}
   <text x="${X(0)}" y="96" text-anchor="middle" font-weight="900" font-size="18" fill="#0369a1">${r}</text><text x="${X(1000)}" y="96" text-anchor="middle" font-weight="900" font-size="18" fill="#15803d">${r+1}</text><text x="${X(500)}" y="96" text-anchor="middle" font-weight="800" font-size="14" fill="#e5484d">${money(r*1000+500)}</text>
   <path d="M${X(s)} 62 l-8 -14 h16z" fill="${up?'#16a36a':'#2f7cf6'}"/><text x="${X(s)}" y="32" text-anchor="middle" font-weight="900" font-size="17" fill="${up?'#16a36a':'#2f7cf6'}">${money(b)}</text></svg>`}

   $$('[data-i]',el).forEach(b=>b.onclick=()=>{const i=+b.dataset.i;if(cur.includes(i))return;S.tap();cur.push(i);draw();if(cur.length===4){const v=+cur.map(k=>d[k]).join('');setTimeout(()=>{if(!found.includes(v)){found.push(v);S.coin();if(found.length===5){S.win();FX.burst(60)}}else{S.no();Helper.say('كوّنت هذا المبلغ من قبل! جرّب ترتيبًا جديدًا',2200)}cur=[];draw()},450)}})}draw()}

  function draw(){const tot=sum(sel.map(x=>x||0));el.innerHTML=`<div class="row" style="justify-content:center"><button class="btn sm soft" id="pO">🟧 مبلغ الكتاب البرتقالي</button><button class="btn sm soft" id="pG">🟩 مبلغ الكتاب الأخضر</button><button class="btn sm ghost" id="p0">↺ مسح</button></div>

    $$('[data-r]',el).forEach(b=>b.onclick=()=>{const r=+b.dataset.r,v=+b.dataset.v;sel[r]=sel[r]===v?null:v;S.pop();draw();if(sel.some(Boolean))Voice.say(moneyW(sum(sel.map(x=>x||0))))});

(function(){
const par=n=>n%2?'فردي':'زوجي';
const rOdd=(a,b)=>R(Math.ceil((a-1)/2),Math.floor((b-1)/2))*2+1;
const rEven=(a,b)=>R(Math.ceil(a/2),Math.floor(b/2))*2;
/* dots arranged in pairs, the leftover dot (if any) highlighted */
const dot=(c,sz)=>`<span style="display:block;width:${sz}px;height:${sz}px;border-radius:50%;background:${c};box-shadow:inset -3px -3px 0 rgba(0,0,0,.18)"></span>`;
function pairsV(n,o={}){const p=Math.floor(n/2),r=n%2,sz=o.sz||20,c=o.c||'#2f7cf6';
  return `<div style="display:inline-flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:center;max-width:${o.max||600}px;vertical-align:middle">${range(1,p).map(()=>`<span style="display:inline-flex;flex-direction:column;gap:4px;padding:4px;border-radius:12px;background:#e8f1ff;border:2px solid #bcd3fb">${dot(c,sz)}${dot(c,sz)}</span>`).join('')}${r?`<span style="display:inline-flex;flex-direction:column;gap:4px;padding:4px;border-radius:12px;border:2px dashed #e5484d;background:#fff1f1">${dot('#e5484d',sz)}<span style="display:block;width:${sz}px;height:${sz}px"></span></span>`:''}</div>`}
/* a number with its units digit highlighted */
function unitsV(n,fs=34){const s=String(n);const ev=n%2===0;return `<span class="row" style="display:inline-flex;direction:ltr;gap:5px;vertical-align:middle">${s.split('').map((d,i)=>`<span class="chip" style="font-size:${fs}px;min-width:${fs*1.5}px;min-height:${fs*1.9}px;${i===s.length-1?`background:${ev?'#dcfce7':'#ffedd5'};border-color:${ev?'#16a36a':'#f97316'};color:${ev?'#15803d':'#c2410c'}`:''}">${d}</span>`).join('')}</span>`}
const cardsV=(arr)=>`<div class="row" style="justify-content:center;gap:10px">${arr.map((d,k)=>`<span class="chip" style="font-size:34px;min-width:62px;min-height:84px;transform:rotate(${[-8,5,-4,7][k%4]}deg);background:${['#fff3c4','#ffe0c2','#efe3ff','#dcfce7'][k%4]}">${d}</span>`).join('')}</div>`;
/* build-a-number from cards (typed answer; engine 'cards' slots read right-to-left) */
const usesCards=(v,d,n)=>{const s=String(v).split('');if(s.length!==(n||d.length))return false;const pool=[...d].map(String);return s.every(c=>{const i=pool.indexOf(c);if(i<0)return false;pool.splice(i,1);return true})};
const cardNum=(q,d,f,o={})=>K.num(q+' [?]',v=>usesCards(v,d,o.n)&&f(+v),{v:cardsV(d),...o});
const riddleBox=(t,lines,c)=>`<div class="box" style="background:${c};border:none;text-align:right;min-width:190px;flex:1"><b style="font-size:18px">🔍❓ مَن أنا؟ ${t}</b><ul style="margin:6px 0 0;padding-inline-start:20px">${lines.map(l=>`<li>${l}</li>`).join('')}</ul></div>`;

function nourCards(el){const d=[4,7,9,1];let cur=[];const found=new Set();
  function draw(){el.innerHTML=`<div class="flexc" style="align-items:center;gap:18px"><div style="font-size:64px">🧕🏻</div><div class="box acc" style="max-width:320px;margin:0">«عددي يتكوّن من ثلاثة أرقام، وهو عدد زوجي.»</div></div>
    <div class="row mt" style="justify-content:center;gap:10px">${d.map((x,i)=>`<button class="chip" data-i="${i}" style="font-size:38px;min-width:70px;min-height:90px;background:${['#fff3c4','#ffe0c2','#efe3ff','#dcfce7'][i]};${cur.includes(i)?'opacity:.25':''}">${x}</button>`).join('')}</div>
    <div class="row mt" style="justify-content:center;direction:ltr">${[0,1,2].map(k=>`<div class="slot" style="min-width:64px;min-height:70px;font-size:30px;font-weight:900;${k===2?'border-color:#16a36a;background:#f0fdf4':''}">${cur[k]!=null?d[cur[k]]:''}</div>`).join('')}</div>
    <div class="center muted" style="font-size:14px">المربّع الأخضر = منزلة الآحاد</div>
    <div class="center mt"><b>الأعداد الزوجية التي وجدتها (${found.size} من 6):</b><div class="row" style="justify-content:center">${[...found].map(n=>`<span class="pill" style="font-size:18px">${n}</span>`).join('')}</div></div>`;
    $$('[data-i]',el).forEach(b=>b.onclick=()=>{const i=+b.dataset.i;if(cur.includes(i))return;S.tap();cur.push(i);
      if(cur.length===3){const n=cur.map(k=>d[k]).join('');
        if(+n%2){S.no();Helper.say(`العدد ${D(n)} فردي! 🤔 فكّر في الآحاد`,2600,'sad')}
        else if(found.has(n)){S.no();Helper.say('وجدت هذا العدد من قبل! جرّب ترتيبًا جديدًا',2200)}
        else{found.add(n);S.ok();Helper.say(`${D(n)} عدد زوجي ✔ لأن رقم آحاده 4`,2200)}
        setTimeout(()=>{cur=[];draw();if(found.size===6){FX.burst(80);S.win();Helper.say('رائع! وجدت الأعداد الستة. كلها تنتهي بـ 4 🎉',4000)}},500)}
      draw()})}
  draw()}
function pairWidget(el){let n=7;
  function draw(){const ev=n%2===0,p=Math.floor(n/2);
    el.innerHTML=`<div class="center"><div class="row" style="justify-content:center;align-items:center;gap:14px"><button class="btn soft" id="pm" style="font-size:26px;width:60px">−</button><div class="bigeq" style="min-width:90px;margin:0">${n}</div><button class="btn soft" id="pp" style="font-size:26px;width:60px">+</button><button class="btn ghost sm" id="pr">🎲 عدد عشوائي</button></div>
     <div class="mt" style="min-height:120px">${pairsV(n)}</div>
     <div class="box ${ev?'ok':'warn'}" style="max-width:600px;margin:10px auto"><b style="font-size:24px">${n} عدد ${ev?'زوجي ✔':'فردي'}</b>
     <div style="font-size:18px">عدد الأزواج: <b>${p}</b> · الباقي: <b>${n%2}</b> ${ev?'← كل نقطة لها زميل.':'← بقيت نقطة واحدة بلا زميل.'}</div><div class="muted">${n} ÷ 2 = ${p}${ev?'':' والباقي 1'}</div></div></div>`;
    $('#pm',el).onclick=()=>{if(n>1){n--;S.pop();draw()}};$('#pp',el).onclick=()=>{if(n<30){n++;S.pop();draw()}};$('#pr',el).onclick=()=>{n=R(2,30);S.flip();draw()};Dig.walk(el)}
  draw()}
function parityGame(el){let n,sc=0,tot=0,res=null;
  function nw(){let m;do{m=pick([R(10,99),R(100,999),R(1000,9999)])}while(m===n);n=m;res=null;draw()}
  function draw(){const s=String(n);const ev=n%2===0;
    el.innerHTML=`<div class="center"><div class="muted">هل العدد زوجي أم فردي؟ انظر إلى رقم الآحاد فقط 🔦</div>
     <div class="row mt" style="justify-content:center;direction:ltr;gap:6px">${s.split('').map((d,i)=>`<span class="chip" style="font-size:42px;min-width:64px;min-height:80px;transition:.3s;${i===s.length-1?`box-shadow:0 0 0 4px ${res?ev?'#16a36a':'#f97316':'#facc15'};${res?`background:${ev?'#dcfce7':'#ffedd5'}`:'background:#fffbe6'}`:'opacity:.75'}">${d}</span>`).join('')}</div>
     <div class="row mt" style="justify-content:center"><button class="btn green" data-a="0" ${res?'disabled':''}>زوجي</button><button class="btn orange" data-a="1" ${res?'disabled':''}>فردي</button>${res?'<button class="btn" id="pn">عدد جديد ←</button>':''}</div>
     ${res?`<div class="box ${res==='ok'?'ok':'warn'}" style="max-width:560px;margin:10px auto">${res==='ok'?'✔ صحيح! ':'✖ انتبه! '}رقم الآحاد ${s.slice(-1)} ${ev?'زوجي':'فردي'}، إذن ${n} عدد ${par(n)}.</div>`:''}
     <div class="pill mt" style="font-size:16px">⭐ ${sc} من ${tot}</div></div>`;
    $$('[data-a]',el).forEach(b=>b.onclick=()=>{tot++;const ok=+b.dataset.a===n%2;if(ok){sc++;S.ok()}else S.no();res=ok?'ok':'no';draw();if(sc===8&&ok){FX.burst(60)}});
    if($('#pn',el))$('#pn',el).onclick=()=>{S.whoosh();nw()};Dig.walk(el)}
  nw()}
function stmtLab(el){let mode=2;const log={2:[],3:[]};
  function roll(){const nums=range(1,mode).map(()=>R(0,4)*2+1);log[mode].unshift(nums);S.flip();draw()}
  function draw(){const L=log[mode];const last=L[0];
    el.innerHTML=`<div class="row" style="justify-content:center"><button class="btn ${mode===2?'':'ghost'} sm" data-m="2">عددان فرديان</button><button class="btn ${mode===3?'':'ghost'} sm" data-m="3">ثلاثة أعداد فردية</button><button class="btn orange" id="rl">🎲 اختر أعدادًا فردية</button></div>
    <div class="box acc center" style="margin-top:10px"><b>العبارة:</b> ${mode===2?'«مجموع عددين فرديين يكون عددًا زوجيًا»':'«مجموع ثلاثة أعداد فردية يكون عددًا فرديًا»'}</div>
    ${last?`<div class="flexc" style="gap:8px;flex-wrap:wrap">${last.map((x,k)=>`${k?'<b style="font-size:30px">+</b>':''}<div class="center">${pairsV(x,{sz:14})}<div style="font-weight:900;font-size:20px">${x}</div></div>`).join('')}<b style="font-size:30px">=</b><div class="center">${pairsV(sum(last),{sz:14})}<div style="font-weight:900;font-size:20px">${sum(last)} <span class="pill">${par(sum(last))}</span></div></div></div>
     <div class="center muted">${mode===2?'النقطتان الباقيتان تكوّنان زوجًا جديدًا!':'نقطتان باقيتان تكوّنان زوجًا، وتبقى نقطة ثالثة بلا زميل.'}</div>`:'<p class="center muted">اضغط 🎲 لتختبر العبارة بأمثلة.</p>'}
    <div class="row" style="justify-content:center">${L.slice(0,8).map(a=>`<span class="pill" style="font-size:15px;background:#dcfce7;color:#15803d">${a.join(' + ')} = ${sum(a)} ✔</span>`).join('')}</div>
    ${L.length>=3?`<div class="box ok center">جرّبت ${L.length} أمثلة وكلها تطابق العبارة، ولن تجد مثالًا مضادًا: إنها <b>عبارة عامة</b> صحيحة دائمًا ✔</div>`:''}`;
    $$('[data-m]',el).forEach(b=>b.onclick=()=>{mode=+b.dataset.m;S.tap();draw()});$('#rl',el).onclick=roll;Dig.walk(el)}
  draw()}

/* ---------- question generators ---------- */
const qPick=(want)=>{const ev=uniqNums(4,()=>rEven(10,998)),od=uniqNums(4,()=>rOdd(11,999));const all=shuffle([...ev,...od]);const w=want==='زوجي'?0:1;
  return K.pick(`اختر كل الأعداد ${want==='زوجي'?'الزوجية':'الفردية'}:`,all,all.map((x,i)=>x%2===w?i:-1).filter(i=>i>=0),{cols:4,h:'انظر إلى رقم الآحاد في كل عدد.'})};
const qBigTF=()=>{const n=R(1000,9999);const say=pick(['زوجي','فردي']);return K.tf(`العدد <b class="hl">${n}</b> عدد ${say}.`,par(n)===say,{ex:`رقم الآحاد ${n%10}، إذن ${n} عدد ${par(n)}.`})};
const qBetween=(w)=>{const a=R(20,90);const ok=v=>{v=+v;return v>a&&v<a+5&&v%2===(w==='فردي'?1:0)};const sh=range(a+1,a+4).find(x=>x%2===(w==='فردي'?1:0));
  return K.num(`اكتب عددًا ${w} أكبر من ${a} وأصغر من ${a+5}: [?]`,ok,{show:sh,ex:`الأعداد الممكنة: ${range(a+1,a+4).filter(x=>ok(x)).join('، ')}`})};
const qCards=(w)=>{let d;do{d=shuffle(uniqNums(4,()=>R(1,9)))}while(!d.some(x=>x%2===(w==='فردي'?1:0)));const k=w==='فردي'?1:0;
  const u=Math.min(...d.filter(x=>x%2===k));const rest=d.filter(x=>x!==u).sort((a,b)=>b-a);const ans=rest.join('')+u;
  return cardNum(`استخدم البطاقات الأربع لتكوّن <b>أكبر عدد ${w}</b> ممكن:`,d,v=>v===+ans,{show:ans,h:`ضع رقمًا ${w==='فردي'?'فرديًا':'زوجيًا'} في منزلة الآحاد، ثم رتّب الباقي من الأكبر.`,ex:`أكبر عدد ${w}: ${ans}`})};
const STM=[['مجموع عددين فرديين يكون:',0,'3 + 5 = 8'],['مجموع عددين زوجيين يكون:',0,'4 + 6 = 10'],['مجموع عدد زوجي وعدد فردي يكون:',1,'4 + 3 = 7'],['مجموع ثلاثة أعداد فردية يكون:',1,'1 + 3 + 5 = 9']];
const qStm=()=>{const [q,a,e]=pick(STM);const o=['عددًا زوجيًا دائمًا','عددًا فرديًا دائمًا','زوجيًا أحيانًا وفرديًا أحيانًا'];return K.mc(q,o[a],o.filter((_,i)=>i!==a),{cols:1,ex:'مثال: '+e})};
const qWho=()=>{const t=R(12,97);return K.num(`مَن أنا؟ • أنا عدد ${par(t)} مكوّن من رقمين • أكبر من ${t-2} • أصغر من ${t+2}. [?]`,t,{ex:`الأعداد بين ${t-2} و ${t+2}: ${t-1}، ${t}، ${t+1}، والعدد ال${par(t)} بينها ${t}.`})};
const qSortPar=()=>{const n=shuffle([...uniqNums(3,()=>rEven(10,999)),...uniqNums(3,()=>rOdd(11,999))]);return K.sort('صنّف الأعداد:',['زوجي','فردي'],n.map(x=>[String(x),x%2]),{h:'رقم الآحاد 0، 2، 4، 6، 8 ← زوجي'})};
const qCounter=()=>{const a=rOdd(3,39),b=rOdd(3,39),c=rOdd(3,39),e=rEven(2,40),f=rEven(2,40);
  const opts=[`${a} + ${b} = ${a+b}`,`${c} + ${e} = ${c+e}`,`${e} + ${f} = ${e+f}`];if(new Set(opts).size<3)return qCounter();
  return K.mc('قال سعيد: «مجموع عددين فرديين عدد فردي». أيّ مثال مضاد يبيّن خطأه؟',opts[0],opts.slice(1),{cols:1,ex:`${a} و ${b} فرديان، ومجموعهما ${a+b} زوجي.`})};

/* penguin letter code (book exercise 6) */
const LET=['أ','ب','ت','ث','ج','ح','خ','د','ذ','ر','ز','س','ش','ص','ض','ط','ظ','ع','غ','ف','ق','ك','ل','م','ن','هـ','و','ي'];
const CODE=[-14,8,6,1,-13,-14,8,9,-12,-10,9,-7,-14,8,-10,10,12,-13,13];
function letterLine(hl){const W=900,m=30,X=v=>m+(v+14)*(W-2*m)/27;let s=`<svg viewBox="0 0 ${W} 110" direction="ltr" style="width:100%;max-width:${W}px"><rect x="2" y="2" width="${W-4}" height="106" rx="16" fill="#fff8e6" stroke="#f5b300" stroke-width="2" stroke-dasharray="6 5"/><line x1="16" x2="${W-16}" y1="62" y2="62" stroke="#0ea5e9" stroke-width="3"/><path d="M${W-16} 56 l10 6 l-10 6z M16 56 l-10 6 l10 6z" fill="#0ea5e9"/>`;
  for(let v=-14;v<=13;v++){const x=X(v);const on=hl===v;const big=v%5===0;
    if(on)s+=`<circle cx="${x}" cy="34" r="15" fill="#facc15"/>`;
    s+=`<text x="${x}" y="40" text-anchor="middle" font-size="17" font-weight="800" fill="${on?'#0f172a':'#e11d48'}">${LET[v+14]}</text><line x1="${x}" x2="${x}" y1="${big?52:56}" y2="${big?72:68}" stroke="#334155" stroke-width="${big?2.5:1.5}"/>`;
    if(big||on)s+=`<text x="${x}" y="94" text-anchor="middle" font-size="15" font-weight="800" fill="${on?'#b45309':v<0?'#2563eb':v>0?'#dc2626':'#111'}">${N(v)}</text>`}
  return s+'</svg>'}
function codeTable(rev,cur){return `<div style="display:flex;flex-wrap:wrap;gap:4px;justify-content:center">${CODE.map((v,i)=>`${i===5||i===12?'<span style="width:14px"></span>':''}<button class="cc" data-c="${i}" style="display:flex;flex-direction:column;border-radius:10px;overflow:hidden;border:2px solid ${cur===i?'#f5b300':'#6366f1'};min-width:40px;background:#fff;padding:0"><span style="background:#4f46e5;color:#fff;font-weight:800;font-size:14px;padding:3px 2px">${neg(v)}</span><span style="font-size:20px;font-weight:900;padding:2px;min-height:30px;color:#0f172a">${rev&&rev.has(i)?LET[v+14]:'?'}</span></button>`).join('')}</div>`}
function penguinWidget(el){const rev=new Set();let cur=null;
  function draw(){el.innerHTML=`${letterLine(cur!=null?CODE[cur]:null)}<div class="row" style="align-items:center;justify-content:center;gap:10px;margin-top:8px"><span style="font-size:54px">🐧</span><div style="flex:1;min-width:280px">${codeTable(rev,cur)}</div></div>
    <div class="row" style="justify-content:center"><button class="btn ghost sm" id="pa">🔓 اكشف الكل</button><button class="btn ghost sm" id="pz">↺</button></div>
    ${rev.size===CODE.length?`<div class="box ok center pop"><div class="bigeq" style="margin:4px">❄️ القطب المتجمد الجنوبي 🐧</div>هنا يعيش البطريق، حيث تنخفض درجة الحرارة إلى ما تحت الصفر بكثير!</div>`:`<p class="center muted">اضغط على كل خانة، وابحث عن عددها على خط الأعداد لتعرف حرفها (${rev.size} من ${CODE.length}).</p>`}`;
    $$('.cc',el).forEach(b=>b.onclick=()=>{const i=+b.dataset.c;cur=i;if(!rev.has(i)){rev.add(i);S.pop()}else S.tap();draw();if(rev.size===CODE.length){FX.burst(90);S.win()}});
    $('#pa',el).onclick=()=>{CODE.forEach((_,i)=>rev.add(i));cur=null;draw();FX.burst(60);S.win()};$('#pz',el).onclick=()=>{rev.clear();cur=null;draw()};Dig.walk(el)}
  draw()}

/* ---------- question generators ---------- */
const uniqT=(n,a,b)=>uniqNums(n,()=>R(a,b));
const qRead=()=>{const t=R(-9,18);return K.num('ما درجة الحرارة التي يُظهرها الميزان؟ [?] °س',t,{keys:'-',v:thermoS(t,{min:-10,max:20,lab:5,h:340}),h:'عُدّ الخطوط من الصفر: فوقه موجب وتحته سالب.'})};
const qExtreme=(cold)=>{let v;do{v=uniqT(4,-9,9)}while(v.filter(x=>x<0).length<2);const a=cold?Math.min(...v):Math.max(...v);
  return K.mc(`أيّ درجات الحرارة الآتية هي ${cold?'الأبرد':'الأدفأ'}؟`,neg(a)+' °س',v.filter(x=>x!==a).map(x=>neg(x)+' °س'),{cols:4,h:'تخيّل ميزان الحرارة: الأبرد هو الأقرب إلى الأسفل.'})};
const qDrop=()=>{if(Math.random()<.5){const a=R(1,8),d=R(a+1,a+8);return K.num(`كانت درجة الحرارة في إحدى القرى ${a} °س، ثم انخفضت في الليل ${dg(d)}. كم أصبحت درجة الحرارة؟ [?] °س`,a-d,{keys:'-',h:`عُدّ تنازليًا من ${a} إلى الصفر، ثم تابع تحت الصفر.`,ex:`${a} − ${d} = ${neg(a-d)}`})}
  const a=R(-9,-2),d=R(3,12);return K.num(`كانت درجة الحرارة صباحًا ${neg(a)} °س، ثم ارتفعت ظهرًا ${dg(d)}. كم أصبحت؟ [?] °س`,a+d,{keys:'-',h:'ارتفعت ← تحرّك إلى الأعلى (إلى اليمين على خط الأعداد).',ex:`${neg(a)} + ${d} = ${neg(a+d)}`})};
const qWarm=()=>{if(Math.random()<.5){const t=R(-9,-1),n=R(3,12);return K.num(`ما درجة الحرارة الأكثر دفئًا بـ ${dg(n)} من ${neg(t)} °س؟ [?] °س`,t+n,{keys:'-',h:'أدفأ ← نتحرك إلى اليمين (للأعلى).',ex:`${neg(t)} + ${n} = ${neg(t+n)}`})}
  const t=R(-3,6),n=R(3,10);return K.num(`ما درجة الحرارة الأبرد بـ ${dg(n)} من ${neg(t)} °س؟ [?] °س`,t-n,{keys:'-',h:'أبرد ← نتحرك إلى اليسار (للأسفل).',ex:`${neg(t)} − ${n} = ${neg(t-n)}`})};
const qCmp=()=>{let x,y;do{x=R(-12,12);y=R(-12,12)}while(x===y||(x>=0&&y>=0));return K.cmp(neg(x),neg(y),{q:'اختر الرمز المناسب:',h:'العدد الأيمن على خط الأعداد هو الأكبر.'})};
const qOrd=()=>{let v;do{v=uniqT(5,-10,10)}while(v.filter(x=>x<0).length<2);return K.ord('رتّب درجات الحرارة بدءًا من الأكثر برودة:',[...v].sort((a,b)=>a-b).map(x=>neg(x)+' °س'),{lab:['الأبرد','الأدفأ'],h:'السالب الأبعد عن الصفر هو الأبرد.'})};
const qSeq=()=>{const st=R(2,6),a=R(st*1+1,st*3);const s=range(0,5).map(k=>a-k*st);return K.fill(`أكمل النمط (نطرح ${st} في كل مرة):`,`${s.slice(0,3).map(neg).join('، ')}، [[${s[3]}]]، [[${s[4]}]]، [[${s[5]}]]`,{keys:'-',sm:1,h:'تابع العدّ التنازلي عبر الصفر.'})};
/* game question mix */
const G=(ans,wr,q,h)=>K.gq(q,neg(ans),[...new Set(wr)].filter(x=>x!==ans).map(neg),h);
const qTug=()=>{const p=R(-6,6),a=R(1,6),b=R(1,6),pos=Math.random()<.5;const r=pos?p+a+b:p-a-b;
  return G(r,[pos?p-a-b:p+a+b,r+1,r-1,r+2],`القرص عند ${neg(p)}. رمى صاحب «${pos?'الموجب':'السالب'}» حجري النرد: ${a} و ${b}. أين يصبح القرص؟`,pos?'الموجب يتحرك إلى اليمين.':'السالب يتحرك إلى اليسار.')};
const qMix=()=>{const t=R(0,4);
  if(t===0){const a=R(-8,8),n=R(2,9),w=Math.random()<.5;const r=w?a+n:a-n;return G(r,[w?a-n:a+n,r+1,r-1],`${w?'أدفأ':'أبرد'} بـ ${dg(n)} من ${neg(a)} °س؟`)}
  if(t===1){const v=uniqT(3,-12,12);const m=Math.min(...v);return K.gq(`أيّها الأصغر: ${v.map(neg).join(' ، ')}؟`,neg(m),v.filter(x=>x!==m).map(neg))}
  if(t===2){const a=R(-3,4),st=pick([1,2,3]);const s=range(0,3).map(k=>a-k*st);return G(a-4*st,[a-4*st+1,a-4*st-1,-(a-4*st)],`ما العدد التالي؟ ${s.map(neg).join('، ')}، …`)}
  if(t===3){const a=R(1,7),d=R(a+1,a+7);return G(a-d,[d-a,a-d+1,a-d-1],`الحرارة ${a} °س ثم انخفضت ${dg(d)}. كم أصبحت؟`)}
  const v=uniqT(3,-12,12);const m=Math.max(...v);return K.gq(`أيّها الأدفأ: ${v.map(x=>neg(x)+' °س').join(' ، ')}؟`,neg(m),v.filter(x=>x!==m).map(neg))};

 {t:'🔺 مثلثات الضرب',h:`<p class="lead">العدد في المربع هو حاصل ضرب العددين في الدائرتين عند طرفي الضلع.</p>`,

   `<div class="flexc"><div>${V.tri(['؟',7,'؟'],[28,'؟',21])}</div><div class="box tip" style="font-size:19px;font-weight:800">🔁 بالعكس نستخدم القسمة:<br>28 ÷ 7 = 4 (الدائرة العليا)<br>21 ÷ 7 = 3 (الدائرة اليمنى)<br>4 × 3 = 12 (المربع الأيمن)</div></div>`],say:'مثلث الضرب: نضرب العددين في الدائرتين لنحصل على العدد في المربع، ونقسم لنجد الدائرة المفقودة.'},

 {t:'🧠 طريقة محمد: حقيقة معروفة تساعدني',h:`<div class="flexc"><div style="font-size:56px">👦🏽</div><div class="box acc" style="max-width:560px">«أعلم أن 6 × 7 = 42، وأعلم أن 14 ضعف 7، فإذا ضاعفت 42 أجد حاصل ضرب 6 × 14، الجواب هو 84.»</div></div>`,

 {t:'🔁 آلة المضاعفة والتنصيف',h:`<p class="lead">اختر عددًا، ثم ضاعفه أو نصّفه. لاحظ كيف نجزّئ العدد أولًا:</p>`,w:wDouble,say:'لمضاعفة عدد نجزّئه ونضاعف كل جزء. ولتنصيفه ننصّف كل جزء.'},

 s:()=>{const t=pick([4,6]),a=R(3,8);const [m1,m2]=[R(2,5)*10+R(1,9),R(3,6)];const mt=Math.floor(m1/10)*10,mu=m1%10;const d=R(12,24)*2+pick([0,0]);const dn=R(21,44);const [fa,fb]=famNums();const tri=[R(2,5),R(2,5),R(2,5)];

   K.fill(`أكمل عائلة الحقائق للمصفوفة:`,`${fa} × ${fb} = [[${fa*fb}]] &nbsp; ${fb} × ${fa} = [[${fa*fb}]]<br>${fa*fb} ÷ ${fa} = [[${fb}]] &nbsp; ${fa*fb} ÷ ${fb} = [[${fa}]]`,{sm:1,v:V.array(fa,fb,{size:20,e:'🟣'}),h:`في المصفوفة ${fa} صفوف و ${fb} أعمدة.`}),

   K.fill(`نصِّف العدد ${d} بالتجزئة:`,`نصف ${Math.floor(d/10)*10-(Math.floor(d/10)%2?10:0)} = [[${(Math.floor(d/10)*10-(Math.floor(d/10)%2?10:0))/2}]] &nbsp; نصف ${d%10+(Math.floor(d/10)%2?10:0)} = [[${(d%10+(Math.floor(d/10)%2?10:0))/2}]]<br>نصف ${d} = [[${d/2}]]`,{sm:1,v:V.blocks(d),h:'اجعل كل جزء عددًا زوجيًا، ثم نصّف كل جزء واجمع.'})]},
 m:()=>[K.pick('لنستكشف: بالبطاقات 3، 4، 5، 6 في مربع (نضرب عبر الصفين)، اختر كل النواتج الممكنة:',[12,30,18,20,15,24,9,36,25,10],[0,1,2,3,4,5],{cols:5,v:`<div class="flexc">${[3,4,5,6].map((d,k)=>card(d,d,{fs:28,w:52,h:62})).join('')}</div>`,h:'كوّن أزواجًا: (3 و 4)(5 و 6)، (3 و 6)(4 و 5)، (3 و 5)(4 و 6). لا يُستخدم الرقم مرتين.'}),
  K.fill('1- أكمل مثلثات الضرب (أ) و (ب):','(أ) س = [[30]] &nbsp; ص = [[20]] &nbsp; ع = [[24]]<br>(ب) س = [[30]] &nbsp; ص = [[45]] &nbsp; ع = [[54]]',{sm:1,v:`<div class="flexc"><div class="center"><b>(أ)</b>${V.tri([5,6,4],['س','ص','ع'],{w:220})}</div><div class="center"><b>(ب)</b>${V.tri([5,6,9],['س','ص','ع'],{w:220})}</div></div>`,h:'المربع = حاصل ضرب الدائرتين عند طرفي الضلع.'}),
