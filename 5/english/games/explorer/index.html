<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no, maximum-scale=1">
<meta name="theme-color" content="#0F0D24">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>مسرح الكلمات — Word Stage 5A</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Baloo+Bhaijaan+2:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --pit:#0F0D24; --stage:#1B1738; --stage2:#26204A; --panel:#241E4B; --panel2:#2E2760;
  --line:rgba(244,194,74,.22); --line2:rgba(255,255,255,.08);
  --curtain:#8C1D33; --curtain2:#5A1022; --curtain3:#A5253F;
  --gold:#F4C24A; --gold2:#FFD97A; --bulb:#FFF1CC; --ivory:#F7EEDC; --mute:#B7AFC9;
  --ok:#5FD37A; --bad:#FF5C6C; --info:#6FC7FF;
  --u:#F4C24A;
  --ar:'Baloo Bhaijaan 2','Segoe UI',Tahoma,Arial,sans-serif;
  --en:'Alfa Slab One','Rockwell','Roboto Slab',Georgia,serif;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--pit);color:var(--ivory);font-family:var(--ar);font-size:16px;overflow:hidden;overscroll-behavior:none}
body{position:fixed;inset:0}
button{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer;font-size:inherit;padding:0}
button:focus-visible,.opt:focus-visible,.tile:focus-visible{outline:3px solid var(--gold2);outline-offset:2px}
input,select{font-family:inherit;font-size:inherit;color:inherit}
h1,h2,h3{margin:0;font-weight:800}
p{margin:0}
.en{direction:ltr;unicode-bidi:isolate;text-align:left}
.enc{direction:ltr;unicode-bidi:isolate;text-align:center}
.disp{font-family:var(--en);font-weight:400;direction:ltr;unicode-bidi:isolate;letter-spacing:.3px}
.hide{display:none!important}
.mute{color:var(--mute)}
.gold{color:var(--gold)}
.small{font-size:.85em}
.center{text-align:center}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.wrap{flex-wrap:wrap}

/* ---------- layers ---------- */
#view,#cinema,#game{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--stage)}
#cinema,#game{display:none;z-index:20}
#cinema.on,#game.on{display:flex}
#fx{position:fixed;inset:0;pointer-events:none;z-index:60}
#toast{position:fixed;left:50%;bottom:calc(28px + var(--sab));transform:translate(-50%,20px);background:var(--gold);color:#2b1d00;padding:10px 18px;border-radius:30px;font-weight:700;z-index:70;opacity:0;transition:.25s;pointer-events:none;box-shadow:0 8px 24px rgba(0,0,0,.4);max-width:92vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
#modal.on ~ #toast{bottom:auto;top:calc(14px + var(--sat))}
#modal{position:fixed;inset:0;background:rgba(6,4,20,.72);z-index:50;display:none;align-items:flex-end;justify-content:center;backdrop-filter:blur(3px)}
#modal.on{display:flex}
.sheet{width:100%;max-width:560px;max-height:92vh;overflow-y:auto;background:var(--stage2);border-radius:22px 22px 0 0;padding:18px 18px calc(22px + var(--sab));border-top:3px solid var(--gold);animation:up .35s cubic-bezier(.2,.9,.3,1.2)}
@keyframes up{from{transform:translateY(60px);opacity:0}to{transform:none;opacity:1}}
@media (min-width:640px){#modal{align-items:center}.sheet{border-radius:22px;border:3px solid var(--gold)}}

/* ---------- top bar ---------- */
.bar{display:flex;align-items:center;gap:10px;padding:calc(10px + var(--sat)) 12px 10px;background:var(--pit);border-bottom:1px solid var(--line);flex:none}
.bar h2{font-size:1.15rem;line-height:1.2;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .sub{font-size:.8rem;color:var(--mute);font-weight:600}
.ib{width:42px;height:42px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:var(--panel);font-size:1.25rem;flex:none;border:1px solid var(--line2);transition:transform .12s}
.ib:active{transform:scale(.9)}
.ib.gold{background:var(--gold);color:#2b1d00}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 14px calc(30px + var(--sab));scrollbar-width:thin}
.wrapw{max-width:760px;margin:0 auto;width:100%}

/* ---------- marquee ---------- */
.marquee{position:relative;border-radius:18px;background:var(--pit);padding:18px 16px;border:2px solid #4a3a10;text-align:center;overflow:hidden}
.marquee::before,.marquee::after{content:"";position:absolute;inset:0;border-radius:18px;padding:7px;pointer-events:none;
  background:radial-gradient(circle,var(--bulb) 0 2.2px,transparent 3.2px) 4px 4px/14px 14px;
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);mask-composite:exclude;
  animation:blink 1.1s steps(1) infinite}
.marquee::after{background-position:11px 11px;animation-delay:.55s;opacity:.35}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:.25}}
.marquee .t{font-family:var(--en);font-size:clamp(26px,8vw,46px);color:var(--gold);line-height:1.05;text-shadow:0 0 18px rgba(244,194,74,.35);direction:ltr}
.marquee .ta{font-size:clamp(20px,5.6vw,30px);font-weight:800;color:var(--ivory);margin-top:2px}
.marquee .ts{font-size:.85rem;color:var(--mute);margin-top:6px;font-weight:600}
@media (prefers-reduced-motion:reduce){.marquee::before,.marquee::after,.spot,.L,.pop{animation:none!important}}

/* ---------- curtains ---------- */
.curtains{position:absolute;inset:0;pointer-events:none;z-index:5;overflow:hidden}
.curtain{position:absolute;top:0;bottom:0;width:52%;background:repeating-linear-gradient(90deg,var(--curtain3) 0 12px,var(--curtain2) 12px 24px,var(--curtain) 24px 38px);box-shadow:inset 0 -60px 80px rgba(0,0,0,.55),inset 0 40px 40px rgba(0,0,0,.25);transition:transform 1.5s cubic-bezier(.75,0,.25,1)}
.curtain.l{left:0;transform-origin:left center;border-right:6px solid #ffd97a55}
.curtain.r{right:0;transform-origin:right center;border-left:6px solid #ffd97a55}
.curtains.open .curtain{transform:scaleX(.045)}
.valance{position:absolute;top:0;left:0;right:0;height:34px;background:var(--gold);z-index:6;
  -webkit-mask:radial-gradient(circle at 50% 100%,transparent 0 10px,#000 11px) 0 0/28px 28px repeat-x,linear-gradient(#000 0 0) 0 0/100% calc(100% - 14px) no-repeat;
  mask:radial-gradient(circle at 50% 100%,transparent 0 10px,#000 11px) 0 0/28px 28px repeat-x,linear-gradient(#000 0 0) 0 0/100% calc(100% - 14px) no-repeat;transition:transform 1.2s}
.curtains.open .valance{transform:translateY(-100%)}

/* ---------- splash ---------- */
.splash{flex:1;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;gap:22px;background:radial-gradient(ellipse at 50% 20%,#2a2454,var(--pit) 70%)}
.splash > .marquee,.splash .namebox,.splash .bigbtn,.splash .credit{position:relative;z-index:8}
.splash .spotcone{position:absolute;top:-10%;left:50%;width:110vw;height:110%;transform:translateX(-50%);background:radial-gradient(ellipse 30% 60% at 50% 0%,rgba(255,236,190,.22),transparent 70%);pointer-events:none}
.bigbtn{display:inline-flex;align-items:center;justify-content:center;gap:10px;padding:16px 30px;border-radius:40px;background:var(--gold);color:#2b1d00;font-weight:800;font-size:1.2rem;box-shadow:0 10px 30px rgba(244,194,74,.35);transition:transform .15s}
.bigbtn:active{transform:scale(.95)}
.namebox{display:flex;gap:8px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:6px 12px;width:min(92vw,360px)}
.namebox input{flex:1;background:none;border:0;padding:10px 4px;font-weight:700;outline:none;min-width:0}
.credit{font-size:.8rem;color:var(--mute);text-align:center;line-height:1.5}

/* ---------- posters (lobby) ---------- */
.posters{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:16px}
@media (min-width:560px){.posters{grid-template-columns:repeat(3,1fr)}}
.poster{position:relative;aspect-ratio:3/4;border-radius:16px;overflow:hidden;text-align:center;display:flex;flex-direction:column;justify-content:flex-end;padding:12px 10px;border:2px solid rgba(255,255,255,.08);transition:transform .15s;isolation:isolate}
.poster:active{transform:scale(.97)}
.poster .bg{position:absolute;inset:0;z-index:-1}
.poster .glow{position:absolute;left:50%;top:38%;width:70%;aspect-ratio:1;border-radius:50%;transform:translate(-50%,-50%);filter:blur(24px);opacity:.55;z-index:-1}
.poster .pe{font-size:clamp(44px,13vw,72px);line-height:1;margin-bottom:auto;padding-top:18px;filter:drop-shadow(0 8px 14px rgba(0,0,0,.45))}
.poster .pn{position:absolute;top:10px;right:10px;font-family:var(--en);font-size:.95rem;color:#2b1d00;background:var(--gold);border-radius:8px;padding:2px 9px;direction:ltr}
.poster .pt{font-family:var(--en);font-size:clamp(15px,4.2vw,20px);color:#fff;line-height:1.1;direction:ltr;text-shadow:0 2px 6px rgba(0,0,0,.5)}
.poster .pa{font-size:.95rem;font-weight:700;color:var(--ivory);opacity:.95}
.poster .ps{margin-top:6px;font-size:.8rem;color:var(--gold2);letter-spacing:1px}
.poster.dim{filter:saturate(.7)}
.lobbyrow{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:16px}
.lobbyrow button{background:var(--panel);border:1px solid var(--line2);border-radius:14px;padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:4px;font-weight:700;font-size:.8rem}
.lobbyrow button span:first-child{font-size:1.5rem}
.statbar{display:flex;gap:8px;margin-top:14px}
.statbar div{flex:1;background:var(--pit);border:1px solid var(--line);border-radius:12px;padding:8px;text-align:center}
.statbar b{display:block;font-size:1.25rem;color:var(--gold)}
.statbar span{font-size:.75rem;color:var(--mute)}

/* ---------- tickets ---------- */
.ticket{position:relative;display:flex;align-items:center;gap:12px;width:100%;text-align:right;padding:12px 14px;border-radius:12px;background:var(--panel);border:1px solid var(--line2);margin-top:10px;transition:transform .12s;overflow:visible}
.ticket:active{transform:scale(.985)}
.ticket::before,.ticket::after{content:"";position:absolute;top:50%;width:16px;height:16px;border-radius:50%;background:var(--stage);transform:translateY(-50%);border:1px solid var(--line2)}
.ticket::before{right:-9px}.ticket::after{left:-9px}
.ticket .ic{width:46px;height:46px;border-radius:12px;background:var(--pit);display:flex;align-items:center;justify-content:center;font-size:1.5rem;flex:none}
.ticket .tt{flex:1;min-width:0}
.ticket .tt b{display:block;font-size:1.02rem}
.ticket .tt span{display:block;font-size:.8rem;color:var(--mute);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ticket .stub{border-right:2px dashed var(--line);padding-right:12px;margin-right:auto;text-align:center;font-size:.85rem;color:var(--gold2);flex:none;min-width:58px}
.ticket .stub small{display:block;color:var(--mute);font-size:.7rem}
.ticket.gold{background:linear-gradient(135deg,var(--gold),#e0a72b);color:#2b1d00;border-color:#0000}
.ticket.gold .tt span{color:#5a3c00}.ticket.gold .ic{background:rgba(255,255,255,.35)}.ticket.gold .stub{color:#2b1d00;border-color:#5a3c0055}.ticket.gold .stub small{color:#5a3c00}
.sec{margin-top:22px;display:flex;align-items:center;gap:10px}
.sec h3{font-size:1.05rem;color:var(--gold2)}
.sec::after{content:"";flex:1;height:1px;background:var(--line)}
.act{display:flex;gap:8px;margin-top:10px}
.act button{flex:1;border-radius:12px;padding:12px 8px;font-weight:800;background:var(--panel2);border:1px solid var(--line2);display:flex;align-items:center;justify-content:center;gap:6px}
.act button.p{background:var(--gold);color:#2b1d00;border-color:#0000}
.setcard{background:var(--pit);border:1px solid var(--line);border-radius:16px;padding:14px;margin-top:12px}
.setcard .sh{display:flex;align-items:center;gap:10px}
.setcard .sh .disp{font-size:1.1rem;color:var(--gold)}
.setcard .sh b{font-size:1.05rem}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;direction:ltr}
.chips span{background:var(--panel);border-radius:20px;padding:3px 10px;font-size:.8rem;font-weight:700;color:var(--ivory);direction:ltr}
.rule{background:var(--panel);border-radius:12px;padding:10px 12px;font-size:.92rem;line-height:1.7;margin-top:10px;color:var(--ivory)}
.pill{display:inline-block;padding:2px 10px;border-radius:20px;background:var(--panel2);font-size:.75rem;font-weight:700;color:var(--mute)}

/* ---------- cinema ---------- */
#cinema{background:#000}
.cstage{position:relative;flex:1;overflow:hidden;background:radial-gradient(ellipse at 50% 100%,#2a2454 0%,#0F0D24 55%,#000 100%)}
.cstage .floor{position:absolute;left:-10%;right:-10%;bottom:0;height:24%;background:linear-gradient(180deg,#0000,#3a2e14aa);border-top:1px solid #ffd97a33}
.spot{position:absolute;inset:0;opacity:0;transition:opacity .5s;background:radial-gradient(ellipse 48% 58% at 50% 42%,rgba(255,236,190,.30),rgba(255,236,190,.07) 55%,transparent 75%)}
.spot.on{opacity:1;animation:sweep 1.1s cubic-bezier(.3,.8,.3,1)}
@keyframes sweep{from{transform:translateX(-40%) scale(.7);opacity:0}to{transform:none;opacity:1}}
.cbody{position:absolute;inset:0;display:flex;overflow-y:auto;text-align:center;padding:calc(56px + var(--sat)) 18px calc(140px + var(--sab));z-index:3}
.cin{margin:auto;display:flex;flex-direction:column;align-items:center;gap:14px;width:100%}
@media (max-height:520px){.cbody{padding-bottom:calc(96px + var(--sab))}.cemoji{font-size:clamp(40px,10vh,90px)}.cword{font-size:clamp(28px,8vh,60px)}}
.cemoji{font-size:clamp(70px,22vw,150px);line-height:1;filter:drop-shadow(0 14px 22px rgba(0,0,0,.6));transform:scale(0);opacity:0}
.cemoji.pop{animation:popin .6s cubic-bezier(.2,1.4,.4,1) forwards}
@keyframes popin{0%{transform:scale(0) rotate(-12deg);opacity:0}70%{transform:scale(1.12) rotate(3deg);opacity:1}100%{transform:scale(1) rotate(0);opacity:1}}
.cnum{font-family:var(--en);font-size:clamp(44px,15vw,110px);color:var(--bulb);direction:ltr;line-height:1;transform:scale(0);opacity:0}
.cnum.pop{animation:popin .6s cubic-bezier(.2,1.4,.4,1) forwards}
.cword{font-family:var(--en);font-size:clamp(34px,10vw,88px);color:var(--gold);line-height:1.1;direction:ltr;unicode-bidi:isolate;text-shadow:0 0 30px rgba(244,194,74,.45),0 6px 0 #6b4d00;word-break:break-word;max-width:100%}
.cword .L{display:inline-block;opacity:0;transform:translateY(24px) scale(.5);animation:Lin .38s cubic-bezier(.2,1.2,.4,1) forwards;animation-delay:var(--d)}
.cword .L.sp{width:.35em}
@keyframes Lin{to{opacity:1;transform:none}}
.car{font-size:clamp(22px,6.2vw,42px);font-weight:800;color:var(--ivory);opacity:0;transform:translateY(14px);transition:.45s}
.car.on{opacity:1;transform:none}
.cex{direction:ltr;unicode-bidi:isolate;font-size:clamp(16px,4.6vw,26px);font-weight:700;color:#fff;max-width:640px;line-height:1.45;min-height:1.4em}
.cex .cur{display:inline-block;width:2px;height:1em;background:var(--gold);vertical-align:-2px;animation:blink .8s steps(1) infinite;margin-left:2px}
.cexa{font-size:clamp(14px,3.8vw,20px);color:var(--mute);font-weight:600;opacity:0;transition:.4s;max-width:640px}
.cexa.on{opacity:1}
.chl{color:var(--gold);border-bottom:3px solid var(--gold);padding-bottom:1px}
.ctitle{font-family:var(--en);font-size:clamp(28px,8vw,64px);color:var(--gold);direction:ltr;line-height:1.1;text-shadow:0 0 30px rgba(244,194,74,.4)}
.ctitle2{font-size:clamp(20px,5.5vw,34px);font-weight:800}
.crule{background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:clamp(15px,4.2vw,20px);line-height:1.75;max-width:680px;text-align:right}
.cmodel{direction:ltr;unicode-bidi:isolate;font-size:clamp(20px,5.6vw,36px);font-weight:800;line-height:1.5;max-width:700px;color:#fff}
.cmodel .W{display:inline-block;opacity:0;transform:translateY(16px);animation:Lin .35s forwards;animation-delay:var(--d);margin:0 .12em}
.cmodel .W.hl{color:var(--gold);border-bottom:4px solid var(--gold)}
.cbar{position:absolute;left:0;right:0;bottom:0;padding:10px 14px calc(12px + var(--sab));background:linear-gradient(0deg,#000 60%,#0000);z-index:8}
.film{display:flex;gap:3px;direction:ltr;margin-bottom:10px;padding:4px;background:#111;border-radius:6px;border-top:2px dashed #333;border-bottom:2px dashed #333}
.film i{flex:1;height:9px;background:#2a2a2a;border-radius:2px;transition:.3s}
.film i.done{background:var(--gold)}
.film i.cur{background:var(--bulb);box-shadow:0 0 8px var(--bulb)}
.cctl{display:flex;align-items:center;justify-content:space-between;gap:8px;direction:ltr}
.cctl .ib{background:#1c1c1c;border-color:#333}
.cctl .ib.big{width:56px;height:56px;font-size:1.6rem;background:var(--gold);color:#2b1d00}
.cidx{font-family:var(--en);font-size:.9rem;color:var(--mute);direction:ltr;min-width:52px;text-align:center}
.letter{height:calc(26px + var(--sat));background:#000;flex:none;z-index:7}
.letter.b{height:0}
.cinhead{position:absolute;top:calc(8px + var(--sat));left:12px;right:12px;display:flex;align-items:center;justify-content:space-between;z-index:9;pointer-events:none}
.cinhead > *{pointer-events:auto}
.cinhead .lbl{font-size:.85rem;color:var(--mute);font-weight:700;background:#0008;padding:4px 10px;border-radius:20px;max-width:56%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.grid-call{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px;width:100%;max-width:720px;max-height:52vh;overflow-y:auto;padding:4px}
.grid-call div{background:#ffffff12;border:1px solid var(--line);border-radius:12px;padding:8px 6px;font-size:.8rem;animation:popin .5s both;animation-delay:var(--d)}
.grid-call .disp{color:var(--gold);font-size:.9rem;display:block}
.tapfs{position:absolute;inset:0;z-index:4}

/* ---------- game shell ---------- */
.ghead{display:flex;align-items:center;gap:8px;padding:calc(8px + var(--sat)) 10px 8px;background:var(--pit);border-bottom:1px solid var(--line);flex:none}
.ghead .gt{flex:1;min-width:0;line-height:1.15}
.ghead .gt b{display:block;font-size:1rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ghead .gt span{font-size:.75rem;color:var(--mute);font-weight:600}
.score{font-family:var(--en);color:var(--gold);font-size:1.2rem;direction:ltr;min-width:48px;text-align:center}
.lives{font-size:1rem;letter-spacing:-2px;direction:ltr}
.tbar{height:6px;background:#000;flex:none}
.tbar i{display:block;height:100%;background:linear-gradient(90deg,var(--ok),var(--gold));width:100%;transition:width .2s linear,background .3s}
.tbar i.warn{background:var(--bad)}
.gbody{flex:1;position:relative;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 14px calc(24px + var(--sab));display:flex;flex-direction:column}
.gbody.noscroll{overflow:hidden;padding:0}
.teams{display:flex;gap:6px;padding:8px 10px 0;flex:none;background:var(--pit)}
.team{flex:1;border-radius:10px;padding:6px 6px;text-align:center;background:var(--panel);border:2px solid #0000;font-size:.8rem;font-weight:800;line-height:1.2;transition:.2s}
.team b{display:block;font-family:var(--en);font-size:1.05rem;direction:ltr}
.team.turn{border-color:var(--gold);box-shadow:0 0 14px rgba(244,194,74,.4);transform:translateY(-2px)}
.qcard{background:var(--pit);border:1px solid var(--line);border-radius:18px;padding:18px 14px;text-align:center;margin:auto 0 14px;min-height:130px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
.qcard .qe,.qcard .oe{font-size:3rem;line-height:1}
.qcard .qw{font-family:var(--en);font-size:clamp(24px,7vw,40px);color:var(--gold);direction:ltr;line-height:1.15}
.qcard .qa{font-size:clamp(20px,5.5vw,30px);font-weight:800}
.qcard .qs{direction:ltr;unicode-bidi:isolate;font-size:clamp(17px,4.8vw,24px);font-weight:800;line-height:1.5}
.qcard .qs u{text-decoration:none;color:var(--gold);border-bottom:3px solid var(--gold);padding:0 .3em}
.qcard .hint{font-size:.85rem;color:var(--mute);font-weight:600}
.spk{display:inline-flex;align-items:center;justify-content:center;width:54px;height:54px;border-radius:50%;background:var(--gold);color:#2b1d00;font-size:1.5rem;box-shadow:0 6px 18px rgba(244,194,74,.35);flex:none}
.spk.big{width:110px;height:110px;font-size:3rem}
.spk:active{transform:scale(.92)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;flex:none}
.opts.one{grid-template-columns:1fr}
.opt{position:relative;min-height:64px;border-radius:14px;background:var(--panel);border:2px solid var(--line2);padding:10px 12px;font-weight:800;font-size:1.05rem;display:flex;align-items:center;justify-content:center;text-align:center;gap:6px;transition:transform .1s,background .2s,border-color .2s;line-height:1.3}
.opt .k{position:absolute;top:4px;left:8px;font-family:var(--en);font-size:.7rem;color:var(--mute)}
@media (hover:none){.opt .k{display:none}}
.opt.en{direction:ltr}
.opt:active{transform:scale(.97)}
.opt.ok{background:#1f4d2e;border-color:var(--ok);color:#fff}
.opt.bad{background:#5a1f28;border-color:var(--bad);color:#fff;animation:shake .4s}
.opt.dis{opacity:.45;pointer-events:none}
.opt.big{min-height:84px;font-size:1.25rem}
.opt .oe{font-size:1.9rem}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.fb{margin-top:12px;border-radius:12px;padding:10px 12px;text-align:center;font-weight:700;min-height:44px;display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap}
.gbody > .fb:last-child,.gbody > .act:last-child:not(.bottom){margin-bottom:auto}
.fb.ok{background:#1f4d2e;color:#d6ffe0}.fb.bad{background:#5a1f28;color:#ffd6db}
.fb .en{font-weight:800}
.prog{display:flex;gap:3px;direction:ltr;padding:8px 10px 0;flex:none}
.prog i{flex:1;height:6px;border-radius:3px;background:#0006}
.prog i.ok{background:var(--ok)}.prog i.bad{background:var(--bad)}.prog i.cur{background:var(--gold)}
.combo{position:absolute;top:8px;left:50%;transform:translateX(-50%);background:var(--gold);color:#2b1d00;font-family:var(--en);padding:2px 12px;border-radius:20px;font-size:.9rem;opacity:0;transition:.3s;direction:ltr;z-index:5}
.combo.on{opacity:1;animation:popin .4s}

/* memory */
.mgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:auto 0}
.mgrid.c3{grid-template-columns:repeat(3,1fr)}
.card{aspect-ratio:3/4;perspective:800px;cursor:pointer}
.card .in{position:relative;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d}
.card.flip .in{transform:rotateY(180deg)}
.card .f,.card .b{position:absolute;inset:0;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;backface-visibility:hidden;-webkit-backface-visibility:hidden;padding:4px;text-align:center}
.card .f{background:repeating-linear-gradient(135deg,var(--curtain) 0 8px,var(--curtain2) 8px 16px);border:2px solid var(--gold);font-size:1.6rem}
.card .b{background:var(--panel2);border:2px solid var(--line);transform:rotateY(180deg);font-weight:800;font-size:.85rem;line-height:1.2;word-break:break-word}
.card .b .disp{color:var(--gold);font-size:.85rem}
.card .b .oe{font-size:1.7rem}
.card.done .b{background:#1f4d2e;border-color:var(--ok)}
.card.done{pointer-events:none;animation:none}

/* spelling */
.slots{display:flex;flex-wrap:wrap;justify-content:center;gap:5px;direction:ltr;margin:8px 0}
.slot{width:38px;height:46px;border-radius:8px;background:var(--pit);border-bottom:3px solid var(--line);display:flex;align-items:center;justify-content:center;font-family:var(--en);font-size:1.35rem;color:var(--gold)}
.slot.fix{background:none;border:0;width:22px;color:var(--mute)}
.slot.sp{width:16px;background:none;border:0}
.slot.on{background:var(--panel2);border-bottom-color:var(--gold)}
.tiles{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;direction:ltr;margin-top:auto}
.tile{width:52px;height:56px;border-radius:12px;background:var(--gold);color:#2b1d00;font-family:var(--en);font-size:1.5rem;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 0 #a37a1a;transition:transform .1s}
.tile:active{transform:translateY(3px);box-shadow:0 1px 0 #a37a1a}
.tile.used{visibility:hidden}
.tile.bad{animation:shake .4s;background:var(--bad);color:#fff}

/* rain */
.rainwrap{position:absolute;inset:0;overflow:hidden;background:linear-gradient(180deg,#0F0D24,#1B1738 70%,#3a2e14)}
.rainhead{position:absolute;top:0;left:0;right:0;padding:10px;text-align:center;z-index:3;background:linear-gradient(#0f0d24ee,#0f0d2400)}
.rainhead .target{font-size:clamp(22px,6vw,34px);font-weight:800;color:var(--gold2)}
.drop{position:absolute;top:0;padding:8px 12px;border-radius:12px;background:var(--panel2);border:2px solid var(--line);font-family:var(--en);font-size:clamp(14px,4vw,20px);color:#fff;direction:ltr;white-space:nowrap;cursor:pointer;transform:translateX(-50%);box-shadow:0 6px 16px #0006;will-change:top}
.drop.hit{background:var(--ok);color:#0b2a12;animation:popin .3s}
.drop.miss{background:var(--bad);animation:shake .3s}
.floorline{position:absolute;left:0;right:0;bottom:calc(60px + var(--sab));height:3px;background:linear-gradient(90deg,#0000,var(--gold),#0000)}
.hud{position:absolute;left:0;right:0;bottom:0;padding:8px 14px calc(10px + var(--sab));display:flex;justify-content:space-between;align-items:center;background:#0f0d24cc;z-index:3;font-weight:800}

/* whack */
.wgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:auto 0}
.hole{aspect-ratio:1;border-radius:50% 50% 14px 14px/40% 40% 14px 14px;background:radial-gradient(ellipse at 50% 30%,#0a0818,#2a2454);border:2px solid var(--line2);position:relative;overflow:hidden}
.mole{position:absolute;left:6%;right:6%;bottom:0;height:80%;border-radius:14px 14px 4px 4px;background:var(--gold);color:#2b1d00;font-family:var(--en);font-size:clamp(11px,3.4vw,16px);display:flex;align-items:center;justify-content:center;text-align:center;padding:4px;direction:ltr;transform:translateY(110%);transition:transform .22s cubic-bezier(.2,1,.4,1);line-height:1.1;word-break:break-word}
.mole.up{transform:none}
.mole.hit{background:var(--ok);transform:scale(.9)}
.mole.bad{background:var(--bad);color:#fff}

.wheelwrap{position:relative;width:min(88vw,380px);margin:8px auto;aspect-ratio:1}
.wheelwrap canvas{width:100%;height:100%;border-radius:50%;box-shadow:0 0 0 8px var(--pit),0 0 0 11px var(--gold),0 20px 50px #0008}
.pointer{position:absolute;top:-8px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:16px solid #0000;border-right:16px solid #0000;border-top:30px solid var(--bad);filter:drop-shadow(0 4px 4px #0008);z-index:2}
.wresult{background:var(--pit);border:1px solid var(--line);border-radius:16px;padding:14px;text-align:center;min-height:90px;margin-top:8px}
.wresult .disp{font-size:1.7rem;color:var(--gold)}
.tpts{display:flex;gap:6px;margin-top:10px}
.tpts button{flex:1;border-radius:10px;padding:8px 4px;font-weight:800;font-size:.85rem;background:var(--panel)}

.answer{min-height:74px;background:var(--pit);border:2px dashed var(--line);border-radius:14px;padding:8px;display:flex;flex-wrap:wrap;gap:6px;direction:ltr;align-content:flex-start}

.chip:active{transform:translateY(2px)}
.chip.ghost{background:var(--panel2);color:var(--ivory);box-shadow:none}
.pool{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;direction:ltr;margin-top:14px}
.pool .chip.used{visibility:hidden}

/* transform */
.tin{width:100%;direction:ltr;text-align:center;background:var(--pit);border:2px solid var(--line);border-radius:14px;padding:14px;font-size:1.3rem;font-weight:800;outline:none;color:#fff;margin-top:10px}
.tin:focus{border-color:var(--gold)}
.tin.ok{border-color:var(--ok)}.tin.bad{border-color:var(--bad);animation:shake .4s}

.rstars{font-size:2.6rem;letter-spacing:4px;direction:ltr;text-align:center;margin:6px 0}
.rstars span{display:inline-block;opacity:.25;transform:scale(.6)}
.rstars span.lit{opacity:1;animation:popin .5s both}

.rrow{display:flex;gap:8px;margin-top:12px}
.rrow div{flex:1;background:var(--pit);border-radius:12px;padding:8px;text-align:center}
.rrow b{display:block;font-size:1.2rem;color:var(--gold2)}
.rrow span{font-size:.75rem;color:var(--mute)}
.rteams{margin-top:12px}
.rteams div{display:flex;justify-content:space-between;padding:8px 12px;border-radius:10px;margin-top:6px;background:var(--pit);font-weight:800}
.rteams div:first-child{background:var(--gold);color:#2b1d00}

/* word list & misc */
.search{width:100%;background:var(--pit);border:1px solid var(--line);border-radius:14px;padding:12px 14px;outline:none;color:#fff;font-weight:700}
.wl{display:flex;align-items:center;gap:10px;padding:10px 6px;border-bottom:1px solid var(--line2)}
.wl .oe{font-size:1.6rem;width:36px;text-align:center}
.wl .disp{color:var(--gold);font-size:1rem;flex:1;text-align:left}
.wl .ar{font-weight:700;flex:1}
.wl .ib{width:38px;height:38px;font-size:1rem}
.wl .tag{font-size:.7rem;color:var(--mute);background:var(--panel);padding:2px 8px;border-radius:10px}
.lettergrp{font-family:var(--en);color:var(--gold);font-size:1.4rem;margin-top:14px;direction:ltr;text-align:left;border-bottom:2px solid var(--line)}
.srow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 4px;border-bottom:1px solid var(--line2)}
.srow label{font-weight:700}
.srow small{display:block;color:var(--mute);font-weight:600}
.sw{width:54px;height:30px;border-radius:15px;background:#444;position:relative;transition:.2s;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s}
.sw.on{background:var(--ok)}.sw.on::after{left:27px}
.sel{background:var(--pit);border:1px solid var(--line);border-radius:10px;padding:8px 10px;max-width:170px}
.rng{width:140px;accent-color:var(--gold)}
.badge{display:flex;align-items:center;gap:12px;padding:10px;border-radius:14px;background:var(--pit);border:1px solid var(--line2);margin-top:8px}
.badge .oe{font-size:2rem;width:44px;text-align:center;filter:grayscale(1);opacity:.4}
.badge.got .oe{filter:none;opacity:1}
.badge.got{border-color:var(--gold)}
.badge b{display:block}.badge span{font-size:.8rem;color:var(--mute)}
.ring{width:64px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--en);font-size:.85rem;background:conic-gradient(var(--u) calc(var(--p)*1%),#0006 0);direction:ltr}
.ring i{width:50px;height:50px;border-radius:50%;background:var(--pit);display:flex;align-items:center;justify-content:center;font-style:normal}

.pron-g .ws button{background:var(--panel);border-radius:20px;padding:6px 14px;font-weight:800;direction:ltr}
.bucket{flex:1;min-height:80px;border-radius:14px;background:var(--panel);border:2px solid var(--line2);display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--en);font-size:1.5rem;color:var(--gold);direction:ltr;padding:8px}
.bucket small{font-family:var(--ar);font-size:.75rem;color:var(--mute)}
.bucket.ok{border-color:var(--ok)}.bucket.bad{border-color:var(--bad);animation:shake .4s}
.kbdhint{font-size:.72rem;color:var(--mute);text-align:center;margin-top:8px}
@media (min-width:700px){.kbdhint{display:block}}@media (max-width:699px){.kbdhint{display:none}}

function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function pickN(a,n,excl){ const pool = excl? a.filter(x=>x!==excl && !(excl.en && x.en===excl.en)) : a; return shuffle(pool).slice(0,n); }
function rnd(n){ return Math.floor(Math.random()*n); }
function sleep(ms){ return new Promise(r=>setTimeout(r,ms)); }
function clamp(v,a,b){ return Math.max(a,Math.min(b,v)); }
function norm(s){ return String(s||'').toLowerCase().replace(/’/g,"'").replace(/[^a-z0-9' ]+/g,' ').replace(/\s+/g,' ').trim(); }
function normLoose(s){ return norm(s).replace(/'/g,'').replace(/\s/g,''); }

/* ---------- sound engine (Web Audio, no files) ---------- */
const SFX = (()=>{
  let ctx=null, master=null;
  function unlock(){ try{ if(!ctx){ ctx=new (window.AudioContext||window.webkitAudioContext)(); master=ctx.createGain(); master.gain.value=.5; master.connect(ctx.destination);} if(ctx.state==='suspended') ctx.resume(); }catch(e){} }
  function tone(f,t,{type='sine',d=.15,v=.6,slide=null,a=.005,r=null}={}){
    if(!ctx||!S.sound) return; const o=ctx.createOscillator(), g=ctx.createGain(); o.type=type; o.frequency.setValueAtTime(f,t); if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(20,slide),t+d);
    g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(v,t+a); g.gain.exponentialRampToValueAtTime(0.0001,t+d); o.connect(g); g.connect(master); o.start(t); o.stop(t+d+.02);
  }
  function noise(t,{d=.3,v=.4,lp=2000,hp=100,decay=true}={}){
    if(!ctx||!S.sound) return; const n=Math.floor(ctx.sampleRate*d), b=ctx.createBuffer(1,n,ctx.sampleRate), ch=b.getChannelData(0); for(let i=0;i<n;i++) ch[i]=(Math.random()*2-1);
    const src=ctx.createBufferSource(); src.buffer=b; const f=ctx.createBiquadFilter(); f.type='lowpass'; f.frequency.value=lp; const f2=ctx.createBiquadFilter(); f2.type='highpass'; f2.frequency.value=hp;
    const g=ctx.createGain(); g.gain.setValueAtTime(v,t); if(decay) g.gain.exponentialRampToValueAtTime(0.0001,t+d); src.connect(f); f.connect(f2); f2.connect(g); g.connect(master); src.start(t); src.stop(t+d+.02);
  }
  const now=()=>ctx?ctx.currentTime:0;
  const lib = {
    tap(){ tone(720,now(),{d:.05,v:.25}); },
    pop(){ tone(900,now(),{d:.09,v:.4,slide:300}); },
    tick(){ tone(1200,now(),{type:'square',d:.025,v:.12}); },
    letter(){ tone(1400+rnd(400),now(),{type:'triangle',d:.06,v:.18}); },
    whoosh(){ noise(now(),{d:.45,v:.35,lp:900,hp:200}); tone(200,now(),{d:.45,v:.15,slide:900,type:'sine'}); },
    spot(){ tone(300,now(),{d:.5,v:.3,slide:1200,type:'triangle'}); },
    chime(){ const t=now(); tone(880,t,{type:'triangle',d:.35,v:.35}); tone(1320,t+.08,{type:'triangle',d:.4,v:.3}); },
    ok(){ const t=now(); [523,659,784].forEach((f,i)=>tone(f,t+i*.07,{type:'triangle',d:.22,v:.4})); },
    okc(n){ const t=now(); const base=523*Math.pow(1.06,Math.min(n,8)); [1,1.25,1.5,2].forEach((m,i)=>tone(base*m,t+i*.06,{type:'triangle',d:.2,v:.4})); },
    bad(){ const t=now(); tone(220,t,{type:'sawtooth',d:.25,v:.35,slide:120}); tone(160,t+.12,{type:'square',d:.25,v:.2,slide:80}); },
    coin(){ const t=now(); tone(988,t,{type:'square',d:.08,v:.25}); tone(1319,t+.08,{type:'square',d:.25,v:.25}); },
    flip(){ noise(now(),{d:.08,v:.25,lp:3000,hp:800}); },
    swoosh(){ noise(now(),{d:.2,v:.3,lp:4000,hp:600}); },
    drum(){ const t=now(); for(let i=0;i<24;i++) noise(t+i*.05,{d:.05,v:.35,lp:600,hp:60}); },
    applause(){ const t=now(); for(let i=0;i<70;i++) noise(t+Math.random()*2.2,{d:.06+Math.random()*.08,v:.2+Math.random()*.2,lp:3500+rnd(2500),hp:900}); },
    fanfare(){ const t=now(); const seq=[[523,.15],[523,.15],[523,.15],[659,.4],[587,.15],[659,.15],[784,.6]]; let c=0; seq.forEach(([f,d])=>{ tone(f,t+c,{type:'square',d:d*.95,v:.22}); tone(f/2,t+c,{type:'triangle',d:d*.95,v:.2}); c+=d; }); },
    win(){ const t=now(); [523,659,784,1047,784,1047,1319].forEach((f,i)=>tone(f,t+i*.11,{type:'triangle',d:.3,v:.4})); setTimeout(()=>lib.applause(),400); },
    lose(){ const t=now(); [392,370,349,330].forEach((f,i)=>tone(f,t+i*.25,{type:'triangle',d:.3,v:.35})); },
    star(){ const t=now(); tone(1568,t,{type:'sine',d:.4,v:.35}); tone(2093,t+.05,{type:'sine',d:.5,v:.25}); },
    spin(){ tone(300,now(),{type:'triangle',d:.05,v:.2}); },
    curtain(){ noise(now(),{d:1.4,v:.25,lp:500,hp:80}); },
    bell(){ const t=now(); tone(1760,t,{type:'sine',d:.8,v:.3}); tone(2637,t+.01,{type:'sine',d:.6,v:.12}); },
    buzz(){ tone(110,now(),{type:'sawtooth',d:.5,v:.35}); },
    countdown(){ tone(660,now(),{type:'square',d:.12,v:.25}); },
    go(){ tone(1320,now(),{type:'square',d:.4,v:.3}); },
    hurry(){ tone(880,now(),{type:'square',d:.06,v:.15}); },
  };
  function play(n,...a){ try{ if(ctx && lib[n]) lib[n](...a); }catch(e){} }
  return { unlock, play, get ready(){ return !!ctx; } };
})();

/* ---------- TTS ---------- */
const TTS = (()=>{
  const ok = 'speechSynthesis' in window;
  let voices=[]; let token=0;
  function refresh(){ if(!ok) return; voices=speechSynthesis.getVoices().filter(v=>/^en/i.test(v.lang)); }
  if(ok){ refresh(); speechSynthesis.onvoiceschanged=refresh; }
  function pickVoice(){ refresh(); if(!voices.length) return null; if(S.voice){ const v=voices.find(v=>v.name===S.voice); if(v) return v; }
    return voices.find(v=>/en-GB/i.test(v.lang)&&/female|Google UK English Female|Serena|Kate/i.test(v.name)) || voices.find(v=>/en-GB/i.test(v.lang)) || voices.find(v=>/en-US/i.test(v.lang)) || voices[0]; }
  function speak(text,{rate,wait=true}={}){
    return new Promise(res=>{
      if(!ok||!S.sound){ res(false); return; }
      try{ speechSynthesis.cancel(); }catch(e){}
      const my=++token; const u=new SpeechSynthesisUtterance(text); const v=pickVoice(); if(v){ u.voice=v; u.lang=v.lang; } else u.lang='en-GB';
      u.rate=rate||S.rate; u.pitch=1; let done=false; const fin=()=>{ if(done) return; done=true; res(true); };
      u.onend=fin; u.onerror=fin; const to=setTimeout(fin, 1200+text.length*110);
      u.onend=()=>{clearTimeout(to);fin();}; u.onerror=()=>{clearTimeout(to);fin();};
      try{ speechSynthesis.speak(u); }catch(e){ fin(); }
      if(!wait) res(true);
    });
  }
  function stop(){ token++; if(ok) try{ speechSynthesis.cancel(); }catch(e){} }
  return { ok, speak, stop, get voices(){ refresh(); return voices; } };
})();

const FX = (()=>{
  const c=$('#fx'); const x=c.getContext&&c.getContext('2d'); let parts=[]; let raf=null;
  if(!x) return { burst(){} };
  function size(){ c.width=innerWidth*devicePixelRatio; c.height=innerHeight*devicePixelRatio; x.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0); }
  addEventListener('resize',size); size();
  function burst(n=120,{x0,y0}={}){ const cols=['#F4C24A','#FF5C6C','#5FD37A','#6FC7FF','#FFF1CC','#FF7AA8','#8C7BFF'];
    for(let i=0;i<n;i++){ parts.push({x:x0!=null?x0:Math.random()*innerWidth, y:y0!=null?y0:-10, vx:(Math.random()-.5)*(x0!=null?14:4), vy:x0!=null?-(4+Math.random()*10):(2+Math.random()*4), r:4+Math.random()*5, c:cols[rnd(cols.length)], a:Math.random()*6.28, va:(Math.random()-.5)*.3, life:1}); }
    if(!raf) loop(); }
  function loop(){ raf=requestAnimationFrame(loop); x.clearRect(0,0,innerWidth,innerHeight); parts.forEach(p=>{ p.vy+=.18; p.x+=p.vx; p.y+=p.vy; p.a+=p.va; p.vx*=.99; x.save(); x.translate(p.x,p.y); x.rotate(p.a); x.fillStyle=p.c; x.fillRect(-p.r/2,-p.r,p.r,p.r*2); x.restore(); });
    parts=parts.filter(p=>p.y<innerHeight+30); if(!parts.length){ cancelAnimationFrame(raf); raf=null; x.clearRect(0,0,innerWidth,innerHeight); } }
  return { burst };
})();

/* ---------- router (with Android back button) ---------- */
const R = { stack:[], cur:null };
function go(name, params={}, replace=false){
  const entry={name,params};
  if(!replace){ R.stack.push(entry); try{ history.pushState({i:R.stack.length},''); }catch(e){} } else { R.stack[R.stack.length-1]=entry; }
  R.cur=entry; render(entry);
}
function back(){ try{ history.back(); }catch(e){ popScreen(); } }
function popScreen(){
  TTS.stop(); Game.abort(); Cinema.abort();
  if(R.stack.length>1){ R.stack.pop(); R.cur=R.stack[R.stack.length-1]; render(R.cur); }
}
addEventListener('popstate',()=>{ if($('#modal').classList.contains('on')){ closeModal(); try{ history.pushState({i:R.stack.length},''); }catch(e){} return; } popScreen(); });
function render(e){
  closeModal(); $('#cinema').classList.remove('on'); $('#game').classList.remove('on');

function starsFor(score,max){ const p=max?score/max:0; return p>=.9?3:p>=.7?2:p>=.4?1:0; }
function recordResult(key,score,max){
  const st=starsFor(score,max); const p=S.progress[key]||{best:0,stars:0,plays:0};
  p.plays++; p.best=Math.max(p.best,score); p.stars=Math.max(p.stars,st); p.last=Date.now(); S.progress[key]=p;
  S.games++; S.coins+=Math.round(score/10)+st*5; save(); checkBadges(); return st;
}
function starsOf(key){ return (S.progress[key]||{}).stars||0; }
function starStr(n){ return '★'.repeat(n)+'☆'.repeat(3-n); }
function unitProgress(u){ let got=0,tot=0; u.sets.forEach(s=>{ ['lightning','listen','memory','spelling','rain','whack','tf','order','gap'].forEach(g=>{ tot+=3; got+=starsOf(s.id+':'+g); }); });
  u.grammar.forEach(g=>{ ['gap','order','detective','transform'].forEach(k=>{ tot+=3; got+=starsOf(g.id+':'+k); }); });
  if(u.phrases&&u.phrases.length){ ['lightning','listen','memory','order'].forEach(g=>{ tot+=3; got+=starsOf('P'+u.id+':'+g); }); }
  return tot?Math.round(got/tot*100):0; }

/* ---------- collection builder ---------- */
function coll(p){
  const u=unitById(p.unit); if(!u) return null;
  if(p.type==='set'){ const s=u.sets.find(x=>x.id===p.id); if(!s) return null;
    const words=s.words.map(w=>Object.assign({},w));
    const sentences=words.filter(w=>w.ex).map(w=>({en:w.ex,ar:w.exa,word:w.en}));
    const gaps=words.filter(w=>w.ex).map(w=>{ const re=new RegExp(w.en.replace(/[.*+?^${}()|[\]\\]/g,'\\$&').replace(/^a /,'(?:a )?'),'i'); const q=w.ex.replace(re,'___');
      return {q: q.includes('___')?q:w.ex+' → ___', o:[w.en,...pickN(words,2,w).map(x=>x.en)], a:w.en, ar:w.ar}; });
    return {key:s.id,title:s.title,ar:s.ar,kind:'vocab',unit:u,color:u.color,words,sentences,gaps}; }
  if(p.type==='phrases'){ const words=(u.phrases||[]).map(x=>({en:x.en,ar:x.ar,e:'💬'}));
    return {key:'P'+u.id,title:'English in action',ar:'عبارات الحوار',kind:'phrases',unit:u,color:u.color,words,sentences:words.map(w=>({en:w.en,ar:w.ar}))}; }
  if(p.type==='grammar'){ const g=u.grammar.find(x=>x.id===p.id); if(!g) return null;
    return {key:g.id,title:g.title,ar:g.ar,kind:'grammar',unit:u,color:u.color,g,sentences:g.models.map(m=>({en:m.en.replace(/[\[\]]/g,''),ar:m.ar})),orderList:g.order,gaps:g.gaps,detect:g.detect,transform:g.transform}; }
  return null;
}

/* ===================== CINEMA SHOWCASE ===================== */
const Cinema = (()=>{
  let items=[], idx=0, auto=true, tok=0, key='', title='', p0=null, kindAll=false;
  const L=()=>$('#cinema');
  const hold=(ms)=>ms*S.cspeed;
  function cancelled(t){ return t!==tok; }
  async function wait(ms,t){ await sleep(ms); return cancelled(t); }

  function build(p){
    p0=p; items=[]; kindAll=false;
    if(p.type==='all'){ kindAll=true; key='ALL'; title='العرض الكبير';
      UNITS.forEach(u=>{ items.push({kind:'title',t:u.title,ar:u.ar,e:u.emoji,color:u.color}); u.sets.forEach(s=>s.words.forEach(w=>items.push(Object.assign({kind:'word',color:u.color},w)))); });
      return true; }
    const c=coll(p); if(!c) return false; key=c.key; title=c.ar;
    if(c.kind==='vocab'){ items.push({kind:'title',t:c.title,ar:c.ar,e:c.words[0].e||'🔢',color:c.color}); c.words.forEach(w=>items.push(Object.assign({kind:'word',color:c.color},w))); }
    else if(c.kind==='phrases'){ items.push({kind:'title',t:'English in action',ar:'عبارات الحوار',e:'💬',color:c.color}); c.words.forEach(w=>items.push({kind:'sentence',en:w.en,ar:w.ar,color:c.color})); }
    else { items.push({kind:'title',t:c.g.title,ar:c.g.ar,e:'📐',rule:c.g.rule,color:c.color}); c.g.models.forEach(m=>items.push({kind:'model',en:m.en,ar:m.ar,color:c.color})); }
    return true;
  }
  function start(p){
    if(!build(p)){ go('lobby',{},true); return; }
    idx=0; auto=true; SFX.unlock();
    L().innerHTML=`<div class="letter"></div><div class="cstage">
      <div class="floor"></div><div class="spot" id="cspot"></div>
      <div class="curtains" id="ccur"><div class="valance"></div><div class="curtain l"></div><div class="curtain r"></div></div>
      <div class="cinhead"><button class="ib" id="cexit" title="خروج">✕</button><span class="lbl">🎬 ${esc(title)}</span><button class="ib" id="cfs" title="ملء الشاشة">⛶</button></div>
      <div class="cbody" id="cbody"></div><div class="tapfs" id="ctap"></div>
      <div class="cbar"><div class="film" id="cfilm">${items.map(()=>'<i></i>').join('')}</div>
      <div class="cctl"><button class="ib" id="cprev" title="السابق">⏮</button><button class="ib" id="crep" title="أعد النطق">🔊</button><button class="ib big" id="cplay" title="تشغيل/إيقاف">⏸</button><button class="ib" id="cnext" title="التالي">⏭</button><span class="cidx" id="cidx">1 / ${items.length}</span></div></div>
    </div><div class="letter b"></div>`;
    L().classList.add('on');
    $('#cexit').onclick=()=>{ SFX.play('tap'); abort(); back(); };
    $('#cfs').onclick=()=>{ const d=document.documentElement; if(document.fullscreenElement){ document.exitFullscreen&&document.exitFullscreen(); } else if(d.requestFullscreen) d.requestFullscreen().catch(()=>{}); };
    $('#cprev').onclick=()=>{ SFX.play('tap'); if(idx>0){ idx--; play(); } };
    $('#cnext').onclick=()=>{ SFX.play('tap'); next(true); };
    $('#ctap').onclick=()=>{ next(true); };
    $('#cplay').onclick=()=>{ auto=!auto; $('#cplay').textContent=auto?'⏸':'▶'; SFX.play('tap'); if(auto) next(false); else { tok++; TTS.stop(); } };
    $('#crep').onclick=()=>{ SFX.play('tap'); const it=items[idx]; if(!it) return; if(it.kind==='word'){ TTS.speak(it.en).then(()=>{ if(S.autoEx&&it.ex) TTS.speak(it.ex); }); } else if(it.kind==='title') TTS.speak(it.t); else TTS.speak(it.en.replace(/[\[\]]/g,'').replace(/\s*\([^)]*\)$/,'')); };
    setTimeout(()=>{ SFX.play('curtain'); const c=$('#ccur'); if(c) c.classList.add('open'); },80);
    setTimeout(()=>play(),900);
  }
  function abort(){ tok++; TTS.stop(); L().classList.remove('on'); }
  function next(manual){ if(idx<items.length-1){ idx++; play(); } else finish(); }
  function film(){ $$('#cfilm i').forEach((f,i)=>{ f.className=i<idx?'done':i===idx?'cur':''; }); const ci=$('#cidx'); if(ci) ci.textContent=`${idx+1} / ${items.length}`; }
  function spot(){ const s=$('#cspot'); if(!s) return; s.classList.remove('on'); void s.offsetWidth; s.classList.add('on'); }
  function letters(word){ return word.split('').map((ch,i)=>ch===' '?`<span class="L sp" style="--d:${i*.06}s">&nbsp;</span>`:`<span class="L" style="--d:${i*.06}s">${esc(ch)}</span>`).join(''); }
  function wordsHtml(en){ // [bracket] parts highlighted
    const parts=[]; let i=0; en.replace(/\[([^\]]+)\]|([^\[]+)/g,(m,hl,plain)=>{ (hl||plain).split(' ').filter(Boolean).forEach(w=>{ parts.push(`<span class="W ${hl?'hl':''}" style="--d:${i*.11}s">${esc(w)}</span>`); i++; }); });
    return {html:parts.join(' '),n:i};
  }
  async function typewriter(el,text,t){ el.innerHTML='<span class="cur"></span>'; let out=''; for(let i=0;i<text.length;i++){ out+=text[i]; el.innerHTML=esc(out)+'<span class="cur"></span>'; if(i%3===0) SFX.play('tick'); await sleep(28); if(cancelled(t)) return true; } el.innerHTML=esc(out); return false; }

  async function play(){
    const t=++tok; TTS.stop(); film(); const it=items[idx]; const B=$('#cbody'); if(!B) return; B.innerHTML=''; spot(); SFX.play('whoosh');

      gb.innerHTML=`<div class="qcard">${emo(w)}<div class="qa">${esc(w.ar)}</div><button class="spk" data-say="${esc(w.en)}">🔊</button></div>
        <div class="slots" id="slots">${chars.map(ch=>/[a-z]/i.test(ch)?'<span class="slot"></span>':ch===' '?'<span class="slot sp"></span>':`<span class="slot fix">${esc(ch)}</span>`).join('')}</div>
        <div class="fb" id="fb">اضغط الحروف بالترتيب الصحيح</div>
        <div class="tiles" id="tiles">${tiles.map((ch,k)=>`<button class="tile" data-k="${k}">${esc(ch)}</button>`).join('')}</div>
        <div class="act bottom"><button id="skip">تخطّ ⏭</button></div>`;
      after(300,()=>TTS.speak(w.en));
      const slots=$$('#slots .slot:not(.fix):not(.sp)'); slots[0].classList.add('on');
      $('#skip').onclick=()=>{ SFX.play('tap'); $$('#prog i')[i].className='bad'; nextW(); };
      $$('.tile').forEach(b=>b.onclick=()=>{ const ch=tiles[+b.dataset.k]; if(ch.toLowerCase()===need[pos].toLowerCase()){ b.classList.add('used'); slots[pos].textContent=need[pos]; slots[pos].classList.remove('on'); pos++; SFX.play('letter'); if(pos<need.length) slots[pos].classList.add('on'); else { const pts=Math.max(4,10-mistakes*2); score+=pts; correct++; setScore(score); $$('#prog i')[i].className='ok'; $('#fb').className='fb ok'; $('#fb').innerHTML=`✓ +${pts} <span class="en">${esc(w.en)}</span>`; SFX.play('ok'); TTS.speak(w.en); after(1100,nextW); } }
        else { mistakes++; b.classList.add('bad'); SFX.play('bad'); after(400,()=>b.classList.remove('bad')); } }); }
    function nextW(){ i++; if(i<ws.length) draw(); else finish({key:c.key+':spelling',score,max:ws.length*10,correct,total:ws.length}); }
    draw();
  }

  /* ---------- rain ---------- */
  function runRain(c){
    const gb=shell({title:'🌧️ مطر الكلمات — '+c.ar,sub:'التقط الكلمة الصحيحة',color:c.color,noscroll:true,lives:3});
    const ws=c.words; let target=null, drops=[], score=0, lives=3, catches=0, streak=0, tLeft=60, lastSpawn=0, gap=1500, fall=5200, sinceTarget=0, last=0;
    gb.innerHTML=`<div class="rainwrap" id="rw"><div class="rainhead"><div class="target" id="rt"></div><button class="ib" id="rhint" title="تلميح صوتي" style="margin-top:4px">🔊 تلميح (-2)</button></div><div class="floorline"></div><div class="hud"><span id="rtime">⏱ 60</span><span id="rc">🎯 0</span></div></div>`;
    const rw=$('#rw'); const hint=$('#rhint'); hint.style.width='auto'; hint.style.padding='0 12px'; hint.style.fontSize='.85rem'; hint.style.borderRadius='20px';
    hint.onclick=()=>{ score=Math.max(0,score-2); setScore(score); TTS.speak(target.en); };
    function newTarget(){ let t; do{ t=ws[rnd(ws.length)]; }while(t===target&&ws.length>1); target=t; $('#rt').innerHTML=`${target.e||target.n||''} ${esc(target.ar)}`; sinceTarget=0; }
    newTarget(); SFX.play('go');
    const floorY=()=>rw.clientHeight-70;
    function spawn(now){ sinceTarget++; const isT=sinceTarget>=3||Math.random()<.35; const w=isT?target:ws[rnd(ws.length)]; if(w===target) sinceTarget=0;
      const lane=rnd(3); const el=document.createElement('div'); el.className='drop'; el.textContent=w.en; el.style.left=((lane+.5)/3*100)+'%'; el.style.top='-50px'; rw.appendChild(el);
      const d={el,w,t0:now,dur:fall}; drops.push(d); el.onclick=()=>hit(d); }
    function hit(d){ if(d.dead) return; d.dead=true; if(d.w.en===target.en){ streak++; catches++; const pts=10+Math.min(streak,5)*2; score+=pts; setScore(score); $('#rc').textContent='🎯 '+catches; SFX.play('okc',streak); d.el.classList.add('hit'); TTS.speak(d.w.en); newTarget(); gap=Math.max(800,gap-40); fall=Math.max(3200,fall-120); }
      else { streak=0; score=Math.max(0,score-3); setScore(score); SFX.play('bad'); d.el.classList.add('miss'); }
      after(300,()=>{ d.el.remove(); drops=drops.filter(x=>x!==d); }); }
    const t=tok; const timeIv=every(1000,()=>{ tLeft--; $('#rtime').textContent='⏱ '+tLeft; if(tLeft<=5) SFX.play('countdown'); if(tLeft<=0) end(); });
    function loop(now){ if(t!==tok) return; raf=requestAnimationFrame(loop); if(!last) last=now; if(now-lastSpawn>gap){ lastSpawn=now; spawn(now); }
      const fy=floorY(); drops.forEach(d=>{ if(d.dead) return; const p=(now-d.t0)/d.dur; d.el.style.top=(-50+p*(fy+50))+'px'; if(p>=1){ d.dead=true; if(d.w.en===target.en){ lives--; setLives(lives); SFX.play('buzz'); streak=0; newTarget(); if(lives<=0) end(); } d.el.remove(); } }); drops=drops.filter(x=>!x.dead); }
    raf=requestAnimationFrame(loop);
    function end(){ if(t!==tok) return; clearAll(); finish({key:c.key+':rain',score,max:190,correct:catches,total:catches+(3-lives),msg:lives<=0?'نفدت المحاولات':`التقطت ${catches} كلمة`}); }
  }

  /* ---------- whack ---------- */
  function runWhack(c){
    const gb=shell({title:'🎯 اصطياد الكلمة — '+c.ar,sub:'اضرب الكلمة المطلوبة',color:c.color});
    const ws=c.words; let target=null, score=0, hits=0, misses=0, streak=0, tLeft=45, since=0;
    gb.innerHTML=`<div class="qcard" style="min-height:0;padding:10px;margin-bottom:10px"><div class="qa" id="wt"></div><div class="row"><span class="hint" id="wtime">⏱ 45</span><span class="hint" id="wh">🎯 0</span></div></div><div class="wgrid">${[0,1,2,3,4,5,6,7,8].map(i=>`<div class="hole"><div class="mole" data-i="${i}"></div></div>`).join('')}</div>`;
    const moles=$$('.mole'); const state=moles.map(()=>null);
    function newTarget(){ let t; do{ t=ws[rnd(ws.length)]; }while(t===target&&ws.length>1); target=t; $('#wt').innerHTML=`${target.e||target.n||''} ${esc(target.ar)}`; since=0; }
    newTarget(); SFX.play('go');
    moles.forEach((m,i)=>m.onclick=()=>{ const w=state[i]; if(!w) return; state[i]=null; if(w.en===target.en){ streak++; hits++; const pts=10+Math.min(streak,5)*2; score+=pts; setScore(score); $('#wh').textContent='🎯 '+hits; SFX.play('okc',streak); m.classList.add('hit'); TTS.speak(w.en); newTarget(); } else { streak=0; misses++; score=Math.max(0,score-5); setScore(score); SFX.play('bad'); m.classList.add('bad'); } after(220,()=>{ m.classList.remove('up','hit','bad'); }); });
    const t=tok;
    every(820,()=>{ const free=state.map((s,i)=>s?-1:i).filter(i=>i>=0); if(!free.length) return; const i=free[rnd(free.length)]; since++; const isT=since>=3||Math.random()<.4; let w=isT?target:ws[rnd(ws.length)]; if(!isT){ let g=0; while(state.some(s=>s&&s.en===w.en)&&g++<6) w=ws[rnd(ws.length)]; } if(w.en===target.en) since=0; state[i]=w; moles[i].textContent=w.en; moles[i].classList.add('up'); SFX.play('pop'); after(1400,()=>{ if(state[i]===w){ state[i]=null; moles[i].classList.remove('up'); } }); });
    every(1000,()=>{ tLeft--; $('#wtime').textContent='⏱ '+tLeft; if(tLeft<=5) SFX.play('countdown'); if(tLeft<=0&&t===tok){ clearAll(); finish({key:c.key+':whack',score,max:170,correct:hits,total:hits+misses}); } });
  }

  /* ---------- wheel ---------- */
  function runWheel(c){
    const ws=shuffle(c.words).slice(0,12); const gb=shell({title:'🎡 عجلة المسرح — '+c.ar,sub:'أدر العجلة ثم تحدث عن الكلمة',color:c.color});
    gb.innerHTML=`<div class="wheelwrap"><div class="pointer"></div><canvas id="wc" width="600" height="600"></canvas></div>
      <button class="bigbtn" id="spin" style="align-self:center;margin-top:4px">🎡 أدر العجلة</button>
      <div class="wresult" id="wr"><span class="mute">اضغط الزر لتدور العجلة</span></div>
      ${T.on?`<div class="tpts">${S.teamNames.slice(0,T.n).map((n,i)=>`<button data-t="${i}">+10 ${esc(n)}</button>`).join('')}</div>`:''}
      <div class="act"><button id="wend">✓ إنهاء اللعبة</button></div>`;
    const cv=$('#wc'), x=cv.getContext&&cv.getContext('2d'); if(!x){ toast('الرسم غير مدعوم'); return; } const N=ws.length; const cols=['#F4C24A','#8C7BFF','#5FD37A','#FF7AA8','#6FC7FF','#E38B3C','#35C4B5','#FF5C6C','#FFD97A','#B48CFF','#9BE8AC','#FFB3CD'];
    let rot=0, spinning=false, spins=0;
    function draw(){ x.clearRect(0,0,600,600); const cx=300, cy=300, r=290; for(let i=0;i<N;i++){ const a0=rot+i*2*Math.PI/N, a1=a0+2*Math.PI/N; x.beginPath(); x.moveTo(cx,cy); x.arc(cx,cy,r,a0,a1); x.closePath(); x.fillStyle=cols[i%cols.length]; x.fill(); x.strokeStyle='#0F0D24'; x.lineWidth=3; x.stroke();
        x.save(); x.translate(cx,cy); x.rotate(a0+Math.PI/N); x.textAlign='right'; x.fillStyle='#2b1d00'; x.font=`bold ${N>8?22:26}px "Baloo Bhaijaan 2",sans-serif`; const w=ws[i]; let label=w.en.length>14?w.en.slice(0,13)+'…':w.en; x.fillText((w.e?w.e+' ':'')+label,r-18,9); x.restore(); }
      x.beginPath(); x.arc(cx,cy,34,0,7); x.fillStyle='#0F0D24'; x.fill(); x.strokeStyle='#F4C24A'; x.lineWidth=5; x.stroke(); x.fillStyle='#F4C24A'; x.font='bold 26px sans-serif'; x.textAlign='center'; x.fillText('🎭',cx,cy+10); }
    draw();
    $('#spin').onclick=()=>{ if(spinning) return; spinning=true; spins++; SFX.play('drum'); $('#wr').innerHTML='<span class="mute">…</span>'; const start=rot; const extra=(5+Math.random()*4)*2*Math.PI+Math.random()*2*Math.PI; const dur=4200; const t0=performance.now(); let lastSeg=-1; const t=tok;
      function anim(now){ if(t!==tok) return; const p=Math.min(1,(now-t0)/dur); const e=1-Math.pow(1-p,3); rot=start+extra*e; draw(); const seg=Math.floor(((-rot-Math.PI/2)%(2*Math.PI)+2*Math.PI)%(2*Math.PI)/(2*Math.PI/N)); if(seg!==lastSeg){ SFX.play('spin'); lastSeg=seg; } if(p<1) raf=requestAnimationFrame(anim); else land(); }
      raf=requestAnimationFrame(anim); };
    function land(){ spinning=false; const seg=Math.floor(((-rot-Math.PI/2)%(2*Math.PI)+2*Math.PI)%(2*Math.PI)/(2*Math.PI/N)); const w=ws[seg]; SFX.play('chime'); FX.burst(50); setScore(spins*5);
      $('#wr').innerHTML=`<div style="font-size:2.4rem">${w.e||w.n||'💬'}</div><div class="disp">${esc(w.en)}</div><div><b>${esc(w.ar)}</b></div>${w.ex?`<div class="en small mute" style="margin-top:4px">${esc(w.ex)}</div>`:''}<div class="row" style="justify-content:center;margin-top:8px">${spkBtn(w.en,'ib')}<span class="hint">قل جملة بهذه الكلمة! 🎤</span></div>`;
      TTS.speak(w.en); }
    $$('.tpts button').forEach(b=>b.onclick=()=>{ T.turn=+b.dataset.t; T.credit(10); SFX.play('coin'); });
    $('#wend').onclick=()=>{ if(!spins){ toast('أدر العجلة أولاً'); return; } finish({key:c.key+':wheel',score:spins*5,max:40,correct:spins,total:spins,msg:`${spins} دورات`}); };
  }

  /* ---------- order ---------- */
  function runOrder(c){
    const src=c.orderList?c.orderList.map(s=>({en:s})):c.sentences; const ss=shuffle(src).slice(0,8);
    const gb=shell({title:'🧩 رتّب الجملة — '+c.ar,sub:c.title,color:c.color,extra:`<div class="prog" id="prog">${ss.map(()=>'<i></i>').join('')}</div>`});
    let i=0, score=0, correct=0;
    function draw(){ const s=ss[i]; const words=s.en.split(' '); let sh=shuffle(words); if(sh.join(' ')===s.en&&words.length>1) sh=sh.reverse(); let ans=[], tries=0;
      $$('#prog i').forEach((e,k)=>e.className=k===i?'cur':e.className.replace('cur',''));
      gb.innerHTML=`<div class="qcard" style="min-height:0"><div style="font-size:2rem">🧩</div>${s.ar?`<div class="qa" style="font-size:1.15rem">${esc(s.ar)}</div>`:''}<div class="hint">اضغط الكلمات بالترتيب الصحيح</div></div>
        <div class="answer" id="ans"></div><div class="pool" id="pool">${sh.map((w,k)=>`<button class="chip" data-k="${k}">${esc(w)}</button>`).join('')}</div><div class="fb" id="fb"></div>
        <div class="act"><button id="clr">↺ مسح</button><button class="p" id="chk">تحقق ✓</button></div>`;
      const render=()=>{ $('#ans').innerHTML=ans.map((k,j)=>`<button class="chip" data-j="${j}">${esc(sh[k])}</button>`).join(''); $$('#ans .chip').forEach(b=>b.onclick=()=>{ SFX.play('tap'); const k=ans.splice(+b.dataset.j,1)[0]; $$('#pool .chip')[k].classList.remove('used'); render(); }); };
      $$('#pool .chip').forEach(b=>b.onclick=()=>{ if(b.classList.contains('used')) return; SFX.play('pop'); b.classList.add('used'); ans.push(+b.dataset.k); render(); if(ans.length===words.length) check(); });
      $('#clr').onclick=()=>{ SFX.play('tap'); ans=[]; $$('#pool .chip').forEach(b=>b.classList.remove('used')); render(); };
      $('#chk').onclick=check;
      function check(){ const got=ans.map(k=>sh[k]).join(' '); if(ans.length<words.length){ toast('أكمل الجملة أولاً'); return; }
        if(got===s.en){ const pts=tries===0?10:6; score+=pts; correct++; setScore(score); $$('#prog i')[i].className='ok'; $('#fb').className='fb ok'; $('#fb').innerHTML=`✓ +${pts} <span class="en">${esc(s.en)}</span>`; SFX.play('ok'); TTS.speak(s.en); $('#chk').disabled=true; after(1500,next); }
        else { tries++; SFX.play('bad'); $('#ans').classList.add('bad'); after(400,()=>$('#ans').classList.remove('bad')); if(tries>=2){ $$('#prog i')[i].className='bad'; $('#fb').className='fb bad'; $('#fb').innerHTML=`الترتيب الصحيح: <span class="en">${esc(s.en)}</span>`; $('#ans').innerHTML=words.map(w=>`<span class="chip ghost">${esc(w)}</span>`).join(''); TTS.speak(s.en); after(2600,next); } else { $('#fb').className='fb bad'; $('#fb').textContent='ليس صحيحًا، حاول مرة أخرى'; } } }
    }
    function next(){ i++; if(i<ss.length) draw(); else finish({key:c.key+':order',score,max:ss.length*10,correct,total:ss.length}); }
    draw();
  }

  /* ---------- transform ---------- */
  function runTransform(c){
    const items=shuffle(c.transform).slice(0,10); const gb=shell({title:'🔁 غيّر الشكل — '+c.ar,sub:c.title,color:c.color,extra:`<div class="prog" id="prog">${items.map(()=>'<i></i>').join('')}</div>`});
    let i=0, score=0, correct=0;
    function draw(){ const it=items[i]; let tries=0; $$('#prog i').forEach((e,k)=>e.className=k===i?'cur':e.className.replace('cur',''));
      gb.innerHTML=`<div class="qcard" style="min-height:0"><div style="font-size:2rem">🔁</div><div class="qs">${esc(it.p)}</div><div class="hint">${esc(it.hint||'اكتب الإجابة بالإنجليزية')}</div></div>
        <input class="tin" id="tin" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Type here…"><div class="fb" id="fb"></div>
        <div class="act"><button id="skip">تخطّ ⏭</button><button class="p" id="chk">تحقق ✓</button></div>`;
      const inp=$('#tin'); setTimeout(()=>inp.focus(),100); inp.onkeydown=e=>{ if(e.key==='Enter') check(); };
      $('#chk').onclick=check; $('#skip').onclick=()=>{ SFX.play('tap'); showAns(); };
      function showAns(){ $$('#prog i')[i].className='bad'; $('#fb').className='fb bad'; $('#fb').innerHTML=`الإجابة: <span class="en">${esc(it.a[0])}</span>`; inp.value=it.a[0]; inp.disabled=true; TTS.speak(it.a[0]); after(2200,next); }
      function check(){ const v=normLoose(inp.value); if(!v) return; const ok=it.a.some(a=>normLoose(a)===v);
        if(ok){ const pts=tries===0?10:6; score+=pts; correct++; setScore(score); inp.className='tin ok'; inp.disabled=true; $$('#prog i')[i].className='ok'; $('#fb').className='fb ok'; $('#fb').innerHTML=`✓ +${pts} <span class="en">${esc(it.a[0])}</span>`; SFX.play('ok'); TTS.speak(it.a[0]); after(1400,next); }
        else { tries++; inp.className='tin bad'; SFX.play('bad'); after(450,()=>inp.className='tin'); if(tries>=2) showAns(); else { $('#fb').className='fb bad'; $('#fb').textContent='ليس صحيحًا، حاول مرة أخرى'; } } }
    }
    function next(){ i++; if(i<items.length) draw(); else finish({key:c.key+':transform',score,max:items.length*10,correct,total:items.length}); }
    draw();
  }

  return { start, abort };
})();

/* ===================== BOOT ===================== */
(function boot(){
  try{ history.replaceState({i:0},''); }catch(e){}
  document.addEventListener('touchstart',()=>SFX.unlock(),{once:true,passive:true});
  document.addEventListener('click',()=>SFX.unlock(),{once:true});
  R.stack=[{name:'splash',params:{}}]; R.cur=R.stack[0]; render(R.cur);
})();
</script>
<script>window.__NAV={"pre": [{"sel": "button.bigbtn", "idx": 0}], "levels": ["button.poster", "div.act button:not(.p)"]}</script><script>(function(){var N=window.__NAV,q=new URLSearchParams(location.search).get("go");if(!N||!q)return;
var P=q.split(".").map(Number);if(P.some(isNaN))return;
var steps=(N.pre||[]).map(function(p){return{sel:p.sel,idx:p.idx||0}}).concat(P.map(function(v,i){return{sel:N.levels[i],idx:v}}));
function vis(e){var r=e.getBoundingClientRect(),c=getComputedStyle(e);return r.width>4&&r.height>4&&c.visibility!=="hidden"&&c.display!=="none"}
function run(i){if(i>=steps.length)return;var s=steps[i],t=0;(function w(){var l=[].filter.call(document.querySelectorAll(s.sel),vis);
if(l.length>s.idx){l[s.idx].scrollIntoView({block:"center"});l[s.idx].click();setTimeout(function(){run(i+1)},700)}else if(t++<48)setTimeout(w,250)})()}
function go(){setTimeout(function(){run(0)},900)}if(document.readyState==="complete")go();else addEventListener("load",go)})();</script>
