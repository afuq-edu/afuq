:root{--ink:#14284b;--ink2:#3b4f72;--cream:#fdf6e9;--gold:#e3b45a;--pink:#fde3e6;--pinkb:#e8798a;--blue:#dcecff;--blueb:#6aa2e8;--yel:#fff1c9;--yelb:#e2b13c;--grn:#dff3e0;--grnb:#5fb873;--pur:#ece4ff;--purb:#9b84e6;--org:#ffe6d5;--orgb:#f0965f;--ok:#2fa35a;--no:#e05561}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#0e1830;overflow:hidden;font-family:'Baloo Bhaijaan 2','Noto Naskh Arabic',system-ui,sans-serif;color:var(--ink)}
button{font:inherit;cursor:pointer}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#stage{position:relative;width:1600px;height:900px;transform-origin:center center;overflow:hidden;border-radius:6px;background:#fff}
.scene{position:absolute;inset:0;width:100%;height:100%}
.slide{position:absolute;inset:0}
.slide.in{animation:sIn .5s ease}
@keyframes sIn{from{opacity:0;transform:scale(1.015)}to{opacity:1;transform:none}}
bdi.en{font-family:'Baloo Bhaijaan 2',system-ui,sans-serif;unicode-bidi:isolate}
mark{background:linear-gradient(transparent 45%,#ffe27a 45%,#ffe27a 92%,transparent 92%);color:inherit;padding:0 .1em}
/* banner (top title card) */
.banner{position:absolute;top:26px;left:50%;transform:translateX(-50%);min-width:760px;max-width:1300px;padding:14px 92px 16px;background:var(--cream);border:5px solid var(--gold);border-radius:34px;box-shadow:0 8px 0 rgba(0,0,0,.12),inset 0 0 0 4px #fff;text-align:center;z-index:5}
.banner:before{content:"";position:absolute;inset:8px;border:2.5px dashed #e9cf98;border-radius:26px;pointer-events:none}
.banner h1{margin:0;font-weight:800;font-size:54px;line-height:1.25;color:var(--ink)}
.banner h1 .k{color:#d6344f}
.banner .ico{position:absolute;top:50%;transform:translateY(-50%);font-size:52px}
.banner .ico.r{right:18px}.banner .ico.l{left:18px}
.banner.pink{background:#fff0f2;border-color:var(--pinkb)}.banner.pink:before{border-color:#f3b5bf}
.pill{position:absolute;left:50%;transform:translateX(-50%);background:#fffaf0;border:3px solid #d7b878;border-radius:22px;padding:4px 30px 6px;font-size:32px;font-weight:600;color:var(--ink2);white-space:nowrap;z-index:5;box-shadow:0 4px 0 rgba(0,0,0,.08)}
/* generic cards */
.card{position:relative;background:var(--cream);border:5px solid var(--gold);border-radius:30px;box-shadow:0 8px 0 rgba(0,0,0,.13);padding:18px 26px}
.card:before{content:"";position:absolute;inset:8px;border:2.5px dashed rgba(0,0,0,.14);border-radius:22px;pointer-events:none}
.c0{background:var(--pink);border-color:var(--pinkb)}.c1{background:var(--blue);border-color:var(--blueb)}.c2{background:var(--yel);border-color:var(--yelb)}.c3{background:var(--grn);border-color:var(--grnb)}.c4{background:var(--pur);border-color:var(--purb)}.c5{background:var(--org);border-color:var(--orgb)}
.big{font-size:44px;font-weight:700;line-height:1.45}
.mid{font-size:38px;font-weight:600;line-height:1.5}
.emo{font-size:72px;line-height:1;filter:drop-shadow(0 4px 0 rgba(0,0,0,.12))}
.hide{visibility:hidden}
.tap{cursor:pointer}
.panel{position:absolute;left:50%;transform:translateX(-50%);background:rgba(255,253,247,.94);border:5px solid #d9c08e;border-radius:34px;box-shadow:0 10px 0 rgba(0,0,0,.12);padding:26px 34px}
/* nav */
.nav{position:fixed;bottom:16px;width:64px;height:64px;border-radius:50%;border:0;background:rgba(255,255,255,.88);color:#14284b;font-size:30px;font-weight:800;box-shadow:0 4px 14px rgba(0,0,0,.25);z-index:50;display:flex;align-items:center;justify-content:center;transition:transform .15s,opacity .3s;opacity:.55}
.nav:hover{opacity:1;transform:scale(1.08)}
#next{left:16px}#prev{right:16px}
#menuBtn{position:fixed;top:14px;right:14px;width:50px;height:50px;border-radius:14px;border:0;background:rgba(255,255,255,.6);font-size:26px;z-index:50;opacity:.45;transition:opacity .3s}
#menuBtn:hover{opacity:1}
#count{position:fixed;bottom:30px;left:92px;color:#fff;font-size:15px;opacity:.55;z-index:50;font-family:system-ui;direction:ltr;text-shadow:0 1px 3px #000}
/* menu */
#menu{position:fixed;inset:0;background:rgba(10,20,42,.82);backdrop-filter:blur(6px);z-index:100;display:none;overflow:auto;padding:30px}
#menu.on{display:block}
#menu .mbox{max-width:1180px;margin:0 auto;background:#fffaf0;border-radius:28px;padding:22px 30px 30px;border:5px solid var(--gold)}
#menu h2{margin:0 0 4px;font-size:34px}
#menu .msub{color:#5b6782;font-size:18px;margin-bottom:12px}
#menu .unit{margin:16px 0 8px;font-size:22px;font-weight:800;color:#2f7d5b}
#menu .lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
#menu .les{border:3px solid #e5d6b5;border-radius:18px;background:#fff;padding:10px 14px}
#menu .les b{display:block;font-size:21px;line-height:1.35;cursor:pointer}
#menu .les b:hover{color:#d6344f}
#menu .les .ps{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
#menu .les .ps button{border:2px solid #9cc9d3;background:#eef8fa;color:#226b7a;border-radius:12px;padding:2px 12px;font-size:16px;font-weight:700}
#menu .les.cur{border-color:#e8798a;background:#fff5f6}
#menu .tools{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
#menu .tools button{border:2px solid #d7b878;background:#fff;border-radius:14px;padding:6px 16px;font-size:18px;font-weight:700}
#note{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);max-width:900px;background:#fffbe6;border:2px solid #e3b45a;border-radius:14px;padding:10px 18px;font-size:18px;z-index:60;display:none;box-shadow:0 6px 20px rgba(0,0,0,.3)}
#note.on{display:block}
/* fx */
.shake{animation:shake .45s}
@keyframes shake{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
.pop{animation:pop .45s}
@keyframes pop{50%{transform:scale(1.08)}}
.okc{outline:6px solid var(--ok)!important;outline-offset:3px;background:#e4f7e9!important}
.noc{outline:6px solid var(--no)!important;outline-offset:3px;background:#fde8ea!important}
.fade{opacity:.35}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:90}
/* ---------- gate (cover / lock / enter) ---------- */
.gate{position:absolute;width:560px;height:560px;overflow:hidden;border-radius:40px 40px 0 0}
.gate .frame{position:absolute;inset:0;border-radius:40px 40px 0 0;background:linear-gradient(#d9dfea,#b9c3d6);border:6px solid #2b3a55}
.gate .sign{position:absolute;top:16px;left:16px;right:16px;height:96px;background:#1f2d4d;border-radius:18px;display:flex;align-items:center;justify-content:center;gap:16px;color:#fff;font-size:40px;font-weight:800}
.gate .sign .tag{background:#ffcb3d;color:#1f2d4d;border-radius:12px;padding:0 16px;font-size:44px}
.gate .door{position:absolute;top:128px;bottom:0;width:calc(50% - 22px);background:linear-gradient(135deg,#d6e8ff,#a5c4eb);border:5px solid #2b3a55;transition:transform 1.1s cubic-bezier(.6,.05,.3,1)}
.gate .door.l{left:22px;border-radius:8px 0 0 0}.gate .door.r{right:22px;border-radius:0 8px 0 0}
.gate.open .door.l{transform:translateX(-96%)}.gate.open .door.r{transform:translateX(96%)}
.gate .inside{position:absolute;top:128px;bottom:0;left:22px;right:22px;background:radial-gradient(circle at 50% 40%,#fff9d6,#ffe08a 60%,#ffc94a);display:flex;align-items:center;justify-content:center;text-align:center;font-size:44px;font-weight:800;padding:20px;overflow:hidden}
.gate .lock{position:absolute;top:50%;left:50%;width:150px;height:150px;margin:-40px 0 0 -75px;border-radius:50%;background:rgba(255,255,255,.4);border:6px solid #fff;display:flex;align-items:center;justify-content:center;font-size:80px;transition:transform .6s,opacity .6s;z-index:3}
.gate.open .lock{transform:translateY(-200px) rotate(-30deg);opacity:0}
.gate .tape{position:absolute;left:-20px;right:-20px;top:62%;height:40px;background:repeating-linear-gradient(-45deg,#e8414f 0 30px,#fff 30px 60px);border:4px solid #2b3a55;border-radius:6px;z-index:4;transition:transform .8s,opacity .8s}
.gate.open .tape{transform:translateY(300px) rotate(8deg);opacity:0}
.gate .chev{position:absolute;bottom:40px;font-size:60px;color:#ffcb3d;font-weight:900;z-index:2}
.carpet{position:absolute;bottom:0;height:140px;background:linear-gradient(#e94a5a,#c92f42);clip-path:polygon(18% 0,82% 0,100% 100%,0 100%)}
/* cover card */
.ttlcard{position:absolute;left:50%;top:400px;transform:translateX(-50%) scale(.6);opacity:0;transition:all .9s .5s cubic-bezier(.3,1.4,.5,1);width:820px;padding:40px 50px;text-align:center;background:#fff2f4;border:7px solid #e8798a;border-radius:46px;box-shadow:0 14px 0 rgba(0,0,0,.15);z-index:6}
.ttlcard.on{transform:translateX(-50%) scale(1);opacity:1}
.ttlcard .lbl{display:inline-block;background:#ffd8df;border-radius:18px;padding:2px 26px;font-size:36px;font-weight:700}
.ttlcard .t{font-size:84px;font-weight:800;line-height:1.25;margin-top:14px}
.ttlcard .u{font-size:28px;color:#5b6782;margin-top:6px}
.ttlcard .h{position:absolute;top:-58px;left:50%;transform:translateX(-50%);width:210px;height:60px;border:12px solid #2b3a55;border-bottom:0;border-radius:30px 30px 0 0}
/* goals tickets */
.ticket{position:absolute;left:50%;transform:translateX(-50%);width:1080px;min-height:150px;display:flex;align-items:stretch;border-radius:30px;border:5px solid;box-shadow:0 8px 0 rgba(0,0,0,.12);overflow:hidden;transition:opacity .5s,transform .5s}
.ticket .st{width:120px;flex:none;display:flex;align-items:center;justify-content:center;font-size:56px;color:#fff;border-left:4px dashed rgba(255,255,255,.7)}
.ticket .n{width:110px;flex:none;display:flex;align-items:center;justify-content:center;font-size:66px;font-weight:800;border-left:3px dashed rgba(0,0,0,.18)}
.ticket .tx{flex:1;display:flex;align-items:center;padding:12px 30px;font-size:42px;font-weight:700;line-height:1.4}
.ticket .ic{width:130px;flex:none;display:flex;align-items:center;justify-content:center;font-size:72px}
.ticket.hid{opacity:0;transform:translateX(-50%) translateY(30px)}
/* list rows (tf / enter) */
.row{display:flex;align-items:center;gap:18px;background:#fff6f7;border:5px solid #f0a9b4;border-radius:30px;padding:10px 20px;box-shadow:0 6px 0 rgba(0,0,0,.1);font-size:40px;font-weight:700;transition:transform .7s,opacity .7s}
.row .num{width:64px;height:64px;border-radius:50%;background:#e8414f;color:#fff;display:flex;align-items:center;justify-content:center;font-size:36px;flex:none;border:4px solid #fff;box-shadow:0 0 0 3px #e8414f}
.row .txt{flex:1;line-height:1.35}
.row .ico{font-size:52px}
.yn{display:flex;gap:10px}
.yn button{border:4px solid #2b3a55;border-radius:18px;font-size:30px;font-weight:800;padding:4px 16px;background:#fff}
.yn .y{background:#e3f6e8;border-color:#2fa35a;color:#1d7a40}.yn .n2{background:#fde6e8;border-color:#e05561;color:#b8283a}
.row.gone{transform:translateX(-640px) scale(.3);opacity:0}
/* sort */
.bin{position:absolute;border-radius:30px;border:5px solid;box-shadow:0 8px 0 rgba(0,0,0,.12);padding:12px}
.bin .bh{display:flex;align-items:center;justify-content:center;gap:12px;background:rgba(255,255,255,.75);border:3px dashed rgba(0,0,0,.2);border-radius:20px;font-size:40px;font-weight:800;padding:4px 10px}
.bin .bb{margin-top:10px;min-height:110px;border:3px dashed rgba(0,0,0,.25);border-radius:20px;display:flex;flex-wrap:wrap;gap:8px;padding:8px;align-content:flex-start}
.bin.hot{transform:scale(1.03)}
.dcard{background:#fff8ea;border:5px solid #e2b13c;border-radius:26px;padding:10px 18px;font-size:36px;font-weight:800;text-align:center;box-shadow:0 6px 0 rgba(0,0,0,.12);cursor:grab;touch-action:none;user-select:none;display:inline-flex;align-items:center;gap:10px}
.dcard .e{font-size:44px}
.dcard.sel{outline:6px solid #5fa8ff;outline-offset:3px}
.dcard.drag{position:fixed;z-index:200;pointer-events:none;transform:rotate(-3deg) scale(1.05)}
.bin .dcard{font-size:28px;padding:4px 12px;cursor:default;box-shadow:none}
.bin .dcard .e{font-size:32px}
/* concept cards */
.ccard{position:absolute;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:6px;padding:22px 26px;cursor:pointer;transition:transform .3s}
.ccard:hover{transform:translateY(-4px)}
.ccard .hd{font-size:46px;font-weight:800;line-height:1.3}
.ccard .bd{font-size:36px;font-weight:600;line-height:1.45;transition:opacity .4s,max-height .5s;overflow:hidden}
.ccard.closed .bd{opacity:0;max-height:0}
.ccard .q{font-size:24px;opacity:.6}
.ccard:not(.closed) .q{display:none}
/* picture */
.pic{position:absolute;background:#fff;border:6px solid #2b3a55;border-radius:22px;box-shadow:0 10px 0 rgba(0,0,0,.18);overflow:hidden;display:flex;align-items:center;justify-content:center}
.pic img{max-width:100%;max-height:100%;display:block}
.pin{position:absolute;width:62px;height:62px;margin:-31px 0 0 -31px;border-radius:50%;background:#e8414f;color:#fff;font-size:32px;font-weight:800;border:5px solid #fff;box-shadow:0 0 0 4px #e8414f,0 6px 12px rgba(0,0,0,.3);display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:3;animation:pulse 1.8s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 10px rgba(232,65,79,.35),0 6px 12px rgba(0,0,0,.3)}}
.pin.done{background:#2fa35a;box-shadow:0 0 0 4px #2fa35a;animation:none}
.plabel{position:absolute;background:#fffaf0;border:4px solid #e3b45a;border-radius:16px;padding:2px 14px;font-size:28px;font-weight:800;white-space:nowrap;z-index:4;transform:translate(-50%,40px);box-shadow:0 4px 0 rgba(0,0,0,.12)}
.qbub{position:absolute;background:#fff;border:5px solid #5fa8ff;border-radius:30px;padding:16px 26px;font-size:38px;font-weight:700;line-height:1.4;box-shadow:0 8px 0 rgba(0,0,0,.12)}
.qbub .ans{margin-top:10px;padding-top:10px;border-top:3px dashed #9cc4f5;color:#1d7a40;display:none}
.qbub.on .ans{display:block;animation:pop .4s}
.qbub .rv{display:inline-block;margin-top:8px;font-size:26px;border:3px solid #5fa8ff;background:#eaf3ff;color:#2a5ea8;border-radius:14px;padding:0 16px}
.qbub.on .rv{display:none}
/* steps */
.steps{position:absolute;display:flex;flex-direction:column;gap:14px}
.step{display:flex;align-items:center;gap:16px;background:#fff;border:5px solid #9cc4f5;border-radius:26px;padding:10px 20px;font-size:36px;font-weight:700;line-height:1.35;box-shadow:0 6px 0 rgba(0,0,0,.1);transition:opacity .4s,transform .4s}
.step .sn{width:58px;height:58px;flex:none;border-radius:50%;background:#5fa8ff;color:#fff;display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:800}
.step.hid{opacity:0;transform:translateY(16px)}
/* mcq */
.opts{position:absolute;display:grid;grid-template-columns:1fr 1fr;gap:22px}
.opt{display:flex;align-items:center;gap:16px;border:5px solid #2b3a55;border-radius:28px;padding:16px 22px;font-size:40px;font-weight:800;color:#fff;text-align:start;box-shadow:0 8px 0 rgba(0,0,0,.2);min-height:120px;line-height:1.3}
.opt .sh{font-size:40px;width:60px;flex:none;text-align:center;opacity:.9}
.opt.o0{background:#e8586a}.opt.o1{background:#4f8fdf}.opt.o2{background:#e7a92d}.opt.o3{background:#3fa66a}
.opt.okc{background:#2fa35a!important;color:#fff;outline-color:#fff}
.opt.noc{background:#9aa3b5!important;color:#fff}
.opt.dim{opacity:.35}
.qcard{position:absolute;left:50%;transform:translateX(-50%);background:#fff;border:6px solid #2b3a55;border-radius:34px;padding:22px 34px;text-align:center;font-size:48px;font-weight:800;line-height:1.4;box-shadow:0 10px 0 rgba(0,0,0,.15)}
.why{position:absolute;left:50%;transform:translateX(-50%);background:#e8f8ee;border:4px solid #2fa35a;border-radius:22px;padding:8px 24px;font-size:30px;font-weight:700;color:#1d6b3a;display:none;max-width:1300px;text-align:center}
.why.on{display:block;animation:pop .4s}
/* tf */
.tfbtn{width:96px;height:80px;border-radius:22px;border:5px solid #2b3a55;font-size:46px;font-weight:900;background:#fff}
.tfbtn.t{color:#1d7a40}.tfbtn.f{color:#c22d40}
/* match */
.mcol{position:absolute;display:flex;flex-direction:column;gap:16px}
.mitem{background:#fff;border:5px solid #9cc4f5;border-radius:24px;padding:10px 18px;font-size:34px;font-weight:800;text-align:center;box-shadow:0 6px 0 rgba(0,0,0,.1);min-height:84px;display:flex;align-items:center;justify-content:center;line-height:1.3}
.mitem.sel{outline:6px solid #ffb703;outline-offset:3px}
.mitem.m0{background:#ffe1e5;border-color:#e8798a}.mitem.m1{background:#dcecff;border-color:#6aa2e8}.mitem.m2{background:#fff1c9;border-color:#e2b13c}.mitem.m3{background:#dff3e0;border-color:#5fb873}.mitem.m4{background:#ece4ff;border-color:#9b84e6}.mitem.m5{background:#ffe6d5;border-color:#f0965f}
svg.lines{position:absolute;inset:0;pointer-events:none;z-index:1}
/* order */
.olist{position:absolute;display:flex;flex-direction:column;gap:14px}
.oitem{display:flex;align-items:center;gap:16px;background:#fff;border:5px solid #c9b6f2;border-radius:24px;padding:8px 18px;font-size:36px;font-weight:700;box-shadow:0 6px 0 rgba(0,0,0,.1);cursor:pointer;line-height:1.3}
.oitem .on{width:56px;height:56px;flex:none;border-radius:16px;background:#9b84e6;color:#fff;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:800}
.oitem.sel{outline:6px solid #ffb703;outline-offset:3px}
.chk{position:absolute;left:50%;transform:translateX(-50%);border:5px solid #2b3a55;background:#ffcb3d;border-radius:22px;padding:6px 40px;font-size:36px;font-weight:800;box-shadow:0 6px 0 rgba(0,0,0,.2)}
/* fill */
.ftext{position:absolute;left:50%;transform:translateX(-50%);background:#fff;border:6px solid #2b3a55;border-radius:30px;padding:26px 36px;font-size:46px;font-weight:700;line-height:2;text-align:center;box-shadow:0 10px 0 rgba(0,0,0,.15)}
.blank{display:inline-block;min-width:200px;border-bottom:5px dashed #5fa8ff;color:#2a5ea8;text-align:center;padding:0 10px;cursor:pointer;line-height:1.4}
.blank.okc{border-bottom-color:#2fa35a;outline:0!important;background:none!important;color:#1d7a40}
.bank{position:absolute;left:50%;transform:translateX(-50%);display:flex;flex-wrap:wrap;gap:16px;justify-content:center}
.chip{background:#fff1c9;border:5px solid #e2b13c;border-radius:22px;padding:6px 22px;font-size:36px;font-weight:800;box-shadow:0 6px 0 rgba(0,0,0,.12)}
.chip.sel{outline:6px solid #5fa8ff;outline-offset:3px}
.chip.used{opacity:.3;pointer-events:none}
/* memory */
.mem{position:absolute;display:grid;gap:18px}
.mcard{perspective:900px;cursor:pointer}
.mcard .in{position:relative;width:100%;height:100%;transition:transform .6s;transform-style:preserve-3d}
.mcard.f .in,.mcard.done .in{transform:rotateY(180deg)}
.mcard .fr,.mcard .bk{position:absolute;inset:0;backface-visibility:hidden;border-radius:24px;border:5px solid #2b3a55;display:flex;align-items:center;justify-content:center;text-align:center;padding:8px;box-shadow:0 6px 0 rgba(0,0,0,.15)}
.mcard .fr{background:repeating-linear-gradient(45deg,#5fa8ff 0 18px,#79b8ff 18px 36px);font-size:60px;color:#fff}
.mcard .bk{background:#fff;transform:rotateY(180deg);font-size:30px;font-weight:800;line-height:1.3}
.mcard.done .bk{background:#e3f6e8;border-color:#2fa35a}
/* wheel */
.wheelw{position:absolute;width:600px;height:600px}
.wheel{width:100%;height:100%;border-radius:50%;border:10px solid #2b3a55;transition:transform 4s cubic-bezier(.15,.85,.25,1);box-shadow:0 12px 0 rgba(0,0,0,.18)}
.wptr{position:absolute;top:-24px;left:50%;margin-left:-28px;width:0;height:0;border-left:28px solid transparent;border-right:28px solid transparent;border-top:60px solid #e8414f;z-index:3;filter:drop-shadow(0 4px 0 rgba(0,0,0,.25))}
.whub{position:absolute;top:50%;left:50%;width:120px;height:120px;margin:-60px;border-radius:50%;background:#ffcb3d;border:8px solid #2b3a55;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:900;cursor:pointer;z-index:2}
/* race */
.track{position:absolute;left:60px;right:60px;display:flex;flex-direction:column;gap:12px}
.lane{position:relative;height:78px;border-radius:40px;background:#fff;border:5px solid #2b3a55;overflow:hidden;cursor:pointer}
.lane .fill{position:absolute;top:0;bottom:0;right:0;transition:width .8s}
.lane .car{position:absolute;top:50%;transform:translate(50%,-50%) scaleX(-1);font-size:56px;transition:right .8s}
.lane .nm{position:absolute;top:50%;right:20px;transform:translateY(-50%);font-size:28px;font-weight:800;z-index:2;mix-blend-mode:multiply}
.lane .fin{position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:46px}
.lane.turn{outline:6px solid #ffb703;outline-offset:3px}
/* boxes */
.boxes{position:absolute;display:grid;gap:22px}
.gbox{position:relative;border-radius:26px;border:5px solid #2b3a55;box-shadow:0 8px 0 rgba(0,0,0,.18);cursor:pointer;display:flex;align-items:center;justify-content:center;text-align:center;padding:12px;font-size:32px;font-weight:800;line-height:1.35;transition:transform .3s}
.gbox .lid{position:absolute;inset:0;border-radius:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:64px;transition:transform .6s,opacity .6s;z-index:2}
.gbox .lid small{font-size:34px;color:#fff;font-weight:800}
.gbox.open .lid{transform:translateY(-60px) rotate(-12deg);opacity:0;pointer-events:none}
.gbox .a{display:none;color:#1d7a40;margin-top:6px}
.gbox.ans .a{display:block}
/* mind map */
.mm{position:absolute;inset:0}
.mm .center{position:absolute;left:50%;top:520px;transform:translate(-50%,-50%);width:360px;min-height:150px;border-radius:50%;background:#ffcb3d;border:7px solid #2b3a55;display:flex;align-items:center;justify-content:center;text-align:center;font-size:44px;font-weight:900;padding:20px;box-shadow:0 10px 0 rgba(0,0,0,.18);z-index:2}
.mm .br{position:absolute;transform:translate(-50%,-50%);width:400px;padding:14px 18px;font-size:32px;font-weight:700;text-align:center;line-height:1.35;cursor:pointer;z-index:2}
.mm .br.closed{color:transparent}
.mm .br.closed:after{content:"؟";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#2b3a55;font-size:54px}
/* compare */
.cmp{position:absolute;display:flex;gap:30px}
.cmp .side{flex:1;padding:20px 26px}
.cmp .side h3{margin:0 0 10px;font-size:44px;text-align:center}
.cmp .side li{font-size:34px;font-weight:700;line-height:1.5;margin:6px 0;list-style:none;transition:opacity .4s}
.cmp .side li.hid{opacity:0}
.cmp .side li:before{content:"◆ ";color:rgba(0,0,0,.35)}
/* flip */
.flips{position:absolute;display:grid;gap:26px}
.flip{perspective:1000px;cursor:pointer}
.flip .in{position:relative;width:100%;height:100%;transition:transform .7s;transform-style:preserve-3d}
.flip.f .in{transform:rotateY(180deg)}
.flip .fr,.flip .bk{position:absolute;inset:0;backface-visibility:hidden;border-radius:30px;border:6px solid;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:16px;box-shadow:0 8px 0 rgba(0,0,0,.14)}
.flip .fr .e{font-size:84px}.flip .fr .t{font-size:44px;font-weight:900;line-height:1.25}.flip .fr .en2{font-size:30px;color:#3b4f72;font-weight:700;direction:ltr}
.flip .bk{transform:rotateY(180deg);background:#fff;font-size:34px;font-weight:700;line-height:1.45}
/* timer (try) */
.timer{position:absolute;width:250px;height:250px}
.timer svg{width:100%;height:100%;transform:rotate(-90deg)}
.timer .tv{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:62px;font-weight:900}
.timer .tv small{font-size:22px}
.timer button{position:absolute;bottom:-62px;left:50%;transform:translateX(-50%);border:4px solid #2b3a55;border-radius:16px;background:#ffcb3d;font-size:26px;font-weight:800;padding:2px 22px;white-space:nowrap}
/* exit ticket */
.exit{position:absolute;display:flex;gap:26px}
.exit .xc{flex:1;padding:22px;text-align:center;cursor:pointer}
.exit .xc .k{font-size:90px;font-weight:900;line-height:1}
.exit .xc .p{font-size:34px;font-weight:800;line-height:1.4;margin-top:8px}
/* homework */
.hwc{position:absolute;left:50%;transform:translateX(-50%) rotate(-1deg);width:1080px;background:#fffef6;border:6px solid #2b3a55;border-radius:20px;padding:30px 50px 34px;box-shadow:0 12px 0 rgba(0,0,0,.18);background-image:repeating-linear-gradient(transparent 0 62px,#cfe3f3 62px 64px)}
.hwc h3{margin:0 0 6px;font-size:50px;color:#d6344f}
.hwc li{font-size:38px;font-weight:700;line-height:64px}
.hwc .pin2{position:absolute;top:-28px;left:50%;font-size:56px;transform:translateX(-50%)}
.mascot{position:absolute;width:300px;height:300px;pointer-events:none}
.mascot svg{width:100%;height:100%;overflow:visible}
.say{position:absolute;background:#fff;border:5px solid #2b3a55;border-radius:28px;padding:10px 22px;font-size:32px;font-weight:800;line-height:1.35;box-shadow:0 6px 0 rgba(0,0,0,.14)}
.periodcard{position:absolute;left:50%;top:210px;transform:translateX(-50%);width:1000px;text-align:center;padding:36px}
.periodcard .pn{font-size:100px;font-weight:900;color:#d6344f;line-height:1.1}
.periodcard .ax{font-size:44px;font-weight:800;margin-top:12px;line-height:1.35}

/* live web editor (R.web, G10) */
.webed,.webpv{position:absolute;border-radius:22px;overflow:hidden;box-shadow:0 10px 0 rgba(0,0,0,.14);display:flex;flex-direction:column;z-index:4}
.webed{background:#1f2433;border:5px solid #3b4566}
.webpv{background:#fff;border:5px solid var(--gold);transition:all .35s}
.webpv.big{left:50px!important;width:1500px!important;z-index:9}
.webed .bar,.webpv .bar{display:flex;align-items:center;gap:14px;padding:8px 16px;font-size:24px;font-weight:700}
.webed .bar{background:#2c3349;color:#c9d3f0}.webpv .bar{background:#f2ece0;color:#5b6782}
.webed .dots i{display:inline-block;width:14px;height:14px;border-radius:50%;margin-left:6px;background:#ff6b6b}.webed .dots i:nth-child(2){background:#ffd166}.webed .dots i:nth-child(3){background:#6ccf8e}
.webed .fn{direction:ltr;font-family:Consolas,'Courier New',monospace;color:#ffd166}.webed .lb,.webpv .lb{margin-inline-start:auto;white-space:nowrap}
.webpv .url{flex:1;direction:ltr;text-align:left;background:#fff;border-radius:14px;padding:2px 14px;font-size:20px;font-family:Consolas,'Courier New',monospace;color:#3b4566;overflow:hidden;white-space:nowrap}
.webed textarea{flex:1;width:100%;border:0;outline:0;resize:none;background:transparent;color:#e8edff;caret-color:#ffd166;font:600 25px/1.45 Consolas,'Courier New',monospace;padding:14px 18px;direction:ltr;text-align:left;white-space:pre;tab-size:2}
.webpv iframe{flex:1;width:100%;border:0;background:#fff}
.webbt{position:absolute;display:flex;gap:14px;z-index:5}
.webbt button{font:700 24px 'Baloo Bhaijaan 2',sans-serif;padding:4px 22px;border-radius:18px;border:4px solid #3b4566;background:#fffaf0;color:#2c3349;cursor:pointer;box-shadow:0 5px 0 rgba(0,0,0,.12)}
.webbt button.sol{border-color:#e2b13c;background:#fff4d6}
/* ===== deck2 additions ===== */
.dots{position:absolute;bottom:22px;left:50%;transform:translateX(-50%);display:flex;gap:12px;z-index:6}
.dots i{width:22px;height:22px;border-radius:50%;background:#fff;border:4px solid #2b3a55;transition:.3s}
.dots i.c{background:#ffcb3d;transform:scale(1.35)}
.dots i.d{background:#6ccf8e}
.qn{font-size:24px;color:#5b6782;font-weight:700;margin-bottom:4px}
.askb{min-height:260px;line-height:1.45;padding:26px 40px;display:flex;flex-direction:column;justify-content:center}
.askb .ans{font-size:.9em}
.blank.qb{display:inline-block;min-width:150px;border-bottom:6px solid #e2b13c;color:#c0902c;padding:0 14px;margin:0 6px}
.blank.qb.okc{color:#1d7a40;border-color:#2fa35a;background:#e9fbef;border-radius:12px}
.readc{position:absolute;background:#fffdf6;border:5px solid #e2b13c;border-radius:30px;padding:24px 40px 24px;box-shadow:0 8px 0 rgba(0,0,0,.12);line-height:1.7;font-weight:600;max-height:690px;overflow:hidden}
.readc p{margin:0 0 12px;transition:opacity .4s,background .4s;border-radius:14px;padding:2px 10px}
.readc p.dim2{opacity:.28}
.readc p.cur{background:#fff3c4}
.readc.listen p.dim2{opacity:1;filter:blur(9px)}
.readc.quran{font-family:'Amiri','Noto Naskh Arabic',serif;line-height:2}

ace", "a": "👟"}, {"q": "Mime: make a face", "a": "😜"}, {"q": "Mime: hold a pen", "a": "🖊️"}, {"q": "Mime: win a race", "a": "🏅"}, {"q": "Mime: make a sandwich", "a": "🥪"}, {"q": "Mime: post a letter", "a": "📮"}], "icon": "🎭"}, {"type": "enter", "title": "Catch the correct sentences!", "gate": "✓", "items": [{"text": "I could walked.", "in": false}, {"text": "I could walk.", "in": true}, {"text": "Could you swim?", "in": true}, {"text": "I couldn't talk.", "in": true}, {"text": "I couldn't to talk.", "in": false}, {"text": "Could you swam?", "in": false}]}, {"type": "order", "title": "Make a sentence", "items": ["When", "I", "was", "two,", "I", "could"], "icon": "🔀"}, {"type": "memory", "title": "Memory", "pairs": [["📮", "post a letter"], ["📧", "send an email"], ["😜", "make a face"], ["📖", "tell a story"], ["🏅", "win a race"], ["👟", "tie a shoelace"]], "icon": "🧠"}, {"type": "balloons", "title": "Pop it!", "rounds": [{"q": "When I was two, I ___ talk.", "o": ["could", "coulded"], "a": 0}, {"q": "📮 =", "o": ["post a letter", "send an email"], "a": 0}, {"q": "Could you swim? No, I ___.", "o": ["couldn't", "can't"], "a": 0}, {"q": "🏅 =", "o": ["win a race", "tell a story"], "a": 0}], "icon": "🎈"}, {"type": "steps", "title": "Let's remember!", "icon": "🧠", "steps": ["8 phrases: post a letter, send an email, make a face, tell a story, hold a pen, win a race, make a sandwich, tie a shoelace", "could / couldn't + verb"]}, {"type": "exit", "title": "Exit ticket", "items": [{"k": "2", "text": "Say one thing you couldn't do when you were three."}, {"k": "1", "text": "Say one thing you could do when you were six."}], "icon": "🎟️"}, {"type": "homework", "title": "Homework", "head": "My homework", "items": ["Activity Book p. 27.", "Ask a parent: What could you do when you were five?"], "icon": "🏠"}]}, {"id": "L18", "unit": "U3", "unitName": "Unit 2: Then and now", "title": "Culture & Project: World museums", "code": "", "theme": "library", "emo": "🏛️", "slides": [{"type": "cover", "say": "Culture & Project"}, {"type": "goals", "title": "Today's goals", "items": ["I can read about three museums.", "I can say which museum I want to visit and why.", "I can write a guide to a museum in Oman."], "icon": "🎯"}, {"type": "ask", "title": "What are your favourite museums?", "qs": [{"q": "Have you visited a museum? Which one?", "a": "I visited …"}, {"q": "What can you see in a museum?", "a": "old things, pictures, models …"}], "img": "L18_c1", "icon": "🏛️"}, {"type": "read", "title": "Oman Across the Ages", "paras": ["When I went to the Wilayat of Manah, I visited the Oman Across the Ages Museum. It is a beautiful and very large modern building.", "I learnt a lot about Oman's history. There were [[ancient]] tools, old photographs, paintings and model boats. There was so much to see and do. It was amazing."], "img": "L18_c2", "icon": "🇴🇲"}, {"type": "read", "title": "Oman Across the Ages", "paras": ["Fun fact: The museum uses technology so that you feel you are living in the past!"], "img": "L18_c2", "icon": "🇴🇲"}, {"type": "quiz", "title": "Check!", "qs": [{"q": "Where is Oman Across the Ages?", "o": ["in the Wilayat of Manah", "in London"], "a": 0}, {"q": "What could you see there?", "o": ["ancient tools and model boats", "a T-Rex"], "a": 0}], "icon": "✅"}, {"type": "read", "title": "Shanghai Museum of Science and Technology", "paras": ["I like science and technology, so I love this museum in Shanghai, in China. You can explore technology from today and also learn about Chinese [[inventions]] from hundreds of years ago."], "img": "L18_c3", "icon": "🇨🇳"}, {"type": "read", "title": "Shanghai Museum of Science and Technology", "paras": ["There are lots of activities for children. I did a science workshop and learnt all about robot design. I also watched a film about exploring space. It was fantastic!"], "img": "L18_c3", "icon": "🇨🇳"}, {"type": "read", "title": "Natural History Museum", "paras": ["I visited this museum in London, England, on holiday. Here I saw a T-Rex and a blue whale, and I learnt about plants and volcanoes!", "Do you know what an [[earthquake]] is? It's when the earth shakes! At the Natural History Museum, I went into a room and the floor started shaking like an earthquake! It was so exciting!"], "img": "L18_c4", "icon": "🇬🇧"}, {"type": "match", "title": "Which museum?", "pairs": [["robot design workshop", "Shanghai 🇨🇳"], ["a T-Rex and a blue whale", "London 🇬🇧"], ["ancient tools and model boats", "Manah 🇴🇲"]], "icon": "🏛️"}, {"type": "tf", "title": "True or false?", "items": [{"text": "The Natural History Museum is in London.", "a": true, "fix": "in London, England"}, {"text": "Oman Across the Ages is a small old building.", "a": false, "fix": "a very large modern building"}, {"text": "In Shanghai you can learn about Chinese inventions.", "a": true, "fix": "from hundreds of years ago"}], "icon": "✔️✘"}, {"type": "ask", "title": "Which museum do you want to visit?", "qs": [{"q": "Which museum do you want to visit? Why?", "a": "I want to visit … because …"}], "icon": "🤔"}, {"type": "read", "title": "Model: Bait Al Zubair", "paras": ["Bait Al Zubair is in the city of Muscat. It is in a traditional building.", "In the museum, you can see lots of things about Oman's past. You can learn about Oman's amazing history.", "I loved the model village in the garden. It was fantastic."], "img": "L18_c5", "icon": "🏛️"}, {"type": "quiz", "title": "Useful phrases", "icon": "✏️", "qs": [{"q": "The museum is in the ___ of Muscat.", "o": ["city", "class"], "a": 0}, {"q": "It is in a traditional/modern ___.", "o": ["building", "boat"], "a": 0}, {"q": "In the museum, you can ___ …", "o": ["see", "saw"], "a": 0}, {"q": "You can ___ about …", "o": ["learn", "learnt"], "a": 0}, {"q": "It was ___!", "o": ["amazing", "amaze"], "a": 0}]}, {"type": "write", "title": "Write a guide to a museum in Oman", "task": "Choose a museum in Oman and write a short guide.", "steps": ["What is it called? Where is it?", "What can you see there?", "What can you do there?", "What did you love?"], "words": ["The … museum is in …", "traditional", "modern", "you can see", "you can learn about", "I loved the …", "It was fantastic!"], "model": "The National Museum is in Muscat. It is in a modern building. You can see old boats and coins. You can learn about Oman's history. It was amazing!", "icon": "✍️"}, {"type": "build", "title": "Spell it", "mode": "letters", "items": [{"a": "museum", "hint": "🏛️", "emo": "🏛️"}, {"a": "ancient", "hint": "very old", "emo": "🏺"}, {"a": "robot", "hint": "🤖", "emo": "🤖"}, {"a": "whale", "hint": "🐋", "emo": "🐋"}], "icon": "🔤"}, {"type": "wheel", "title": "Talk", "items": [{"q": "Which museum do you want to visit?", "a": "I want to visit … because …"}, {"q": "What do you like learning about?", "a": "I like learning about …"}, {"q": "Have you seen a dinosaur in a museum?", "a": "…"}], "icon": "🎡"}, {"type": "boxes", "title": "Museum boxes", "boxes": [{"label": "1", "q": "What is an earthquake?", "a": "when the earth shakes"}, {"label": "2", "q": "Where is Bait Al Zubair?", "a": "in Muscat"}, {"label": "3", "q": "What did the writer do in Shanghai?", "a": "a science workshop about robot design"}, {"label": "4", "q": "What big animal is in the London museum?", "a": "a blue whale / a T-Rex"}], "icon": "🎁"}, {"type": "summary", "title": "Let's remember!", "center": "Culture & Project: World museums", "branches": ["Museums teach us about the past and science 🏛️", "Oman Across the Ages – Manah; Bait Al Zubair – Muscat", "Guide phrases: It is in … You can see … You can learn about …"], "icon": "🧠"}, {"type": "exit", "title": "Exit ticket", "items": [{"k": "2", "text": "Name a museum in Oman."}, {"k": "1", "text": "What can you see there?"}], "icon": "🎟️"}, {"type": "homework", "title": "Homework", "head": "My homework", "items": ["Activity Book p. 28.", "Finish your museum guide for the class vote."], "icon": "🏠"}]}, {"id": "L19", "unit": "U3", "unitName": "Unit 2: Then and now", "title": "English in action: Asking for information", "code": "", "theme": "library", "emo": "ℹ️", "slides": [{"type": "cover", "say": "English in action"}, {"type": "goals", "title": "Today's goals", "items": ["I can ask for information about a museum.", "I can ask about opening times.", "I can say a tongue twister with -ed sounds."], "icon": "🎯"}, {"type": "sort", "title": "History museum or science museum?", "bins": [{"label": "history museum", "icon": "🏺"}, {"label": "science museum", "icon": "🔬"}], "cards": [{"text": "pots", "icon": "", "bin": 0}, {"text": "swords", "icon": "", "bin": 0}, {"text": "robots", "icon": "", "bin": 1}, {"text": "planes", "icon": "", "bin": 1}, {"text": "telephones", "icon": "", "bin": 1}], "icon": "🏛️"}, {"type": "ask", "title": "Listen", "qs": [{"q": "Which museum does Jake want to visit? (2.14)", "a": "The National Museum."}], "img": "L19_c1", "icon": "👂"}, {"type": "read", "title": "At the information desk", "paras": ["Hello. I'd like some information about the National Museum, please.", "Yes, of course. What do you want to know?", "What can you see and do there?", "You can learn about boats, farms, coins and many other things about Oman's history!", "It sounds great! What time does it open and close?", "It's open Saturday to Thursday from 10 am until 5 pm."], "img": "L19_c1", "icon": "💬"}, {"type": "read", "title": "At the information desk", "paras": ["OK. Thank you very much! – You're welcome! Enjoy your visit!"], "img": "L19_c1", "icon": "💬"}, {"type": "quiz", "title": "Check!", "qs": [{"q": "What can you learn about?", "o": ["boats, farms and coins", "space"], "a": 0}, {"q": "When is it open?", "o": ["Saturday to Thursday", "every day"], "a": 0}, {"q": "What time does it close?", "o": ["5 pm", "10 am"], "a": 0}], "icon": "✅"}, {"type": "order", "title": "Order the dialogue", "items": ["I'd like some information about the museum, please.", "Yes, of course. What do you want to know?", "What can you see and do there?", "You can learn about Oman's history!", "What time does it open and close?", "It's open from 10 am until 5 pm."], "icon": "🔢"}, {"type": "match", "title": "Question ➡️ answer", "pairs": [["What do you want to know?", "What can you see and do there?"], ["What time does it open?", "At 10 am."], ["Thank you very much!", "You're welcome!"], ["What can you see there?", "You can see old boats."]], "icon": "🧩"}, {"type": "quiz", "title": "Complete", "icon": "✏️", "qs": [{"q": "I'd ___ some information, please.", "o": ["like", "liked"], "a": 0}, {"q": "What time does it ___ and close?", "o": ["open", "opens"], "a": 0}, {"q": "It's open ___ 10 am until 5 pm.", "o": ["from", "at"], "a": 0}, {"q": "You're ___! Enjoy your visit!", "o": ["welcome", "thanks"], "a": 0}]}, {"type": "ask", "title": "Role play", "qs": [{"q": "Ask about the Shanghai Museum of Science and Technology.", "a": "Hi! I'd like some information about the Shanghai Museum of Science and Technology, please."}, {"q": "What can you see and do there?", "a": "You can learn about …"}, {"q": "What time does it open and close?", "a": "It's open on … from … until …"}], "icon": "🎭"}, {"type": "read", "title": "Tongue twister", "paras": ["I [[visited]] the museum and I [[looked]] for a T-Rex,", "But I couldn't find a T-Rex anywhere.", "So I [[cried]] on the street, yes, I cried on the street,", "And then I saw a T-Rex there!"], "img": "L19_c2", "icon": "👅🦖"}, {"type": "sort", "title": "How do we say -ed?", "bins": [{"label": "/ɪd/ visited", "icon": ""}, {"label": "/t/ looked", "icon": ""}, {"label": "/d/ cried", "icon": ""}], "cards": [{"text": "visited", "icon": "", "bin": 0}, {"text": "started", "icon": "", "bin": 0}, {"text": "looked", "icon": "", "bin": 1}, {"text": "walked", "icon": "", "bin": 1}, {"text": "cried", "icon": "", "bin": 2}, {"text": "played", "icon": "", "bin": 2}], "icon": "🔊"}, {"type": "build", "title": "Spell it", "mode": "letters", "items": [{"a": "information", "hint": "ℹ️", "emo": "ℹ️"}, {"a": "open", "hint": "🔓", "emo": "🔓"}, {"a": "close", "hint": "🔒", "emo": "🔒"}, {"a": "welcome", "hint": "🙂", "emo": "🙂"}], "icon": "🔤"}, {"type": "tf", "title": "True or false?", "items": [{"text": "The National Museum is open on Fridays.", "a": false, "fix": "Saturday to Thursday"}, {"text": "It opens at 10 am.", "a": true, "fix": "✔"}, {"text": "You can learn about coins.", "a": true, "fix": "✔"}], "icon": "✔️✘"}, {"type": "wheel", "title": "Role play cards", "items": [{"q": "Ask about a zoo.", "a": "I'd like some information about the zoo, please."}, {"q": "Ask about the time.", "a": "What time does it open and close?"}, {"q": "Ask what you can do.", "a": "What can you see and do there?"}], "icon": "🎡"}, {"type": "race", "title": "Race", "qs": [{"q": "I'd like some ___ , please.", "options": ["information", "informations"], "a": 0}, {"q": "What time does it ___?", "options": ["close", "closes"], "a": 0}, {"q": "Thank you! – You're ___!", "options": ["welcome", "OK"], "a": 0}, {"q": "'looked' ends with the sound …", "options": ["/t/", "/ɪd/"], "a": 0}], "icon": "🏎️"}, {"type": "summary", "title": "Let's remember!", "center": "English in action: Asking for information", "branches": ["I'd like some information about …, please.", "What can you see and do there? What time does it open and close?", "-ed: /ɪd/ visited, /t/ looked, /d/ cried"], "icon": "🧠"}, {"type": "exit", "title": "Exit ticket", "items": [{"k": "2", "text": "Ask for information about a place."}, {"k": "1", "text": "Say: It's open from … until …"}], "icon": "🎟️"}, {"type": "homework", "title": "Homework", "head": "My homework", "items": ["Activity Book p. 29.", "Write a dialogue about a museum or a park."], "icon": "🏠"}]}, {"id": "L20", "unit": "U3", "unitName": "Unit 2: Then and now", "title": "Reading: Majid's science blog", "code": "", "theme": "library", "emo": "📦", "slides": [{"type": "cover", "say": "Majid's science blog"}, {"type": "goals", "title": "Today's goals", "items": ["I can read a science blog.", "I can match headings to paragraphs.", "I can find triangles around me."], "icon": "🎯"}, {"type": "ask", "title": "Cardboard", "qs": [{"q": "What do you already know about cardboard?", "a": "It's strong. We make boxes from it."}, {"q": "What things are made of cardboard?", "a": "boxes, cereal boxes …"}], "img": "L20_c2", "icon": "📦"}, {"type": "read", "title": "Paragraphs 1–2", "paras": ["1 Hello, everyone! Today, I visited a museum and found out a lot of amazing information about cardboard!"], "icon": "📦"}, {"type": "read", "title": "Paragraphs 1–2", "paras": ["2 In 1879, a Scottish [[engineer]] called Robert Gair [[invented]] the cardboard box. Robert Gair could make a lot of cardboard boxes very quickly, and so for the first time, food companies could use cardboard to hold food. In 1906, a food company started using very thin cardboard boxes for its cereal. This was the first time that a box had the name and picture of the food on the outside!"], "icon": "📦"}, {"type": "quiz", "title": "Check!", "qs": [{"q": "Who invented the cardboard box?", "o": ["Robert Gair", "Majid"], "a": 0}, {"q": "When?", "o": ["in 1879", "in 1906"], "a": 0}, {"q": "What happened in 1906?", "o": ["a cereal box with the food name and picture", "the first bridge"], "a": 0}], "icon": "✅"}, {"type": "read", "title": "Paragraphs 3–5", "paras": ["3 Today, we use cardboard boxes for many different things because cardboard is so strong."], "img": "L20_c3", "icon": "🔺"}, {"type": "read", "title": "Paragraphs 3–5", "paras": ["4 Do you know why cardboard is so strong? Inside each piece of cardboard, there are a lot of triangles. Triangles are really strong: they can carry a lot. If you use triangles in a house of cards, it works. If you try it with square shapes, it doesn't work. The triangle shape is the strongest."], "img": "L20_c3", "icon": "🔺"}, {"type": "read", "title": "Paragraphs 3–5", "paras": ["5 I learnt that there are triangle shapes everywhere: in bridges, in houses, on bikes and even on kites!"], "img": "L20_c3", "icon": "🔺"}, {"type": "match", "title": "Write the paragraph number", "pairs": [["a Triangles everywhere", "5"], ["b Introduction", "1"], ["c Why cardboard is strong", "4"], ["d History of cardboard", "2"], ["e Cardboard today", "3"]], "icon": "🔢"}, {"type": "tf", "title": "True or false?", "items": [{"text": "Square shapes are the strongest.", "a": false, "fix": "The triangle shape is the strongest."}, {"text": "There are triangles inside cardboard.", "a": true, "fix": "there are a lot of triangles"}, {"text": "There are triangles on bikes and kites.", "a": true, "fix": "on bikes and even on kites"}], "icon": "✔️✘"}, {"type": "enter", "title": "Catch things with triangle shapes (from the blog)!", "gate": "✓", "items": [{"text": "coins", "in": false}, {"text": "kites", "in": true}, {"text": "balls", "in": false}, {"text": "bridges", "in": true}, {"text": "wheels", "in": false}, {"text": "houses", "in": true}]}, {"type": "build", "title": "Spell it", "mode": "letters", "items": [{"a": "triangle", "hint": "🔺", "emo": "🔺"}, {"a": "bridge", "hint": "🌉", "emo": "🌉"}, {"a": "strong", "hint": "💪", "emo": "💪"}, {"a": "cereal", "hint": "🥣 breakfast food", "emo": "🥣"}], "icon": "🔤"}, {"type": "ask", "title": "Think like an engineer", "qs": [{"q": "Why is a triangle strong?", "a": "It can carry a lot – it doesn't change shape."}, {"q": "Where can you see triangles in your school?", "a": "roof, stairs, chairs … (free)"}], "icon": "🧠"}, {"type": "quiz", "title": "Complete", "icon": "✏️", "qs": [{"q": "Robert Gair was a Scottish ___.", "o": ["engineer", "doctor"], "a": 0}, {"q": "Cardboard is strong because it has a lot of ___.", "o": ["triangles", "squares"], "a": 0}, {"q": "In ___, a food company used thin cardboard for cereal.", "o": ["1906", "1879"], "a": 0}]}, {"type": "order", "title": "History of cardboard", "items": ["1879: Robert Gair invents the cardboard box.", "Food companies use cardboard to hold food.", "1906: a cereal box with the name and picture of the food.", "Today: cardboard boxes for many things."], "icon": "📅"}, {"type": "wheel", "title": "Talk", "items": [{"q": "What cardboard things do you have at home?", "a": "…"}, {"q": "Can you build a house of cards?", "a": "…"}, {"q": "Where can you see triangles in our classroom?", "a": "…"}], "icon": "🎡"}, {"type": "boxes", "title": "Blog boxes", "boxes": [{"label": "1", "q": "Where was Robert Gair from?", "a": "Scotland"}, {"label": "2", "q": "What did food companies start to do?", "a": "use cardboard to hold food"}, {"label": "3", "q": "What shape is the strongest?", "a": "the triangle"}, {"label": "4", "q": "Where did Majid learn about cardboard?", "a": "at a museum"}], "icon": "🎁"}, {"type": "summary", "title": "Let's remember!", "center": "Reading: Majid's science blog", "branches": ["Robert Gair invented the cardboard box in 1879 📦", "Triangles make cardboard strong 🔺", "Triangles are everywhere: bridges, houses, bikes, kites"], "icon": "🧠"}, {"type": "exit", "title": "Exit ticket", "items": [{"k": "2", "text": "Why is cardboard strong?"}, {"k": "1", "text": "Name 2 places with triangles."}], "icon": "🎟️"}, {"type": "homework", "title": "Homework", "head": "My homework", "items": ["Activity Book p. 30.", "Find 3 cardboard things at home."], "icon": "🏠"}]}, {"id": "L21", "unit": "U3", "unitName": "Unit 2: Then and now", "title": "Listening, Speaking & Writing: a report", "code": "", "theme": "library", "emo": "📝", "slides": [{"type": "cover", "say": "Listening, speaking & writing a report"}, {"type": "goals", "title": "Today's goals", "items": ["I can listen and match children to places.", "I can talk about a visit.", "I can write a report with a date and paragraphs."], "icon": "🎯"}, {"type": "ask", "title": "Where did they go?", "qs": [{"q": "Look: Science Museum, zoo, Car Museum, funfair. Which do you like?", "a": "I like …"}, {"q": "Listen (2.20). What place did Huda, Budoor and Jood go to?", "a": "Listen and match! (check together)"}], "img": "L21 : "I'd like some ___.", "options": ["information", "informations"], "a": 0}], "icon": "🏎️"}, {"type": "summary", "title": "Let's remember!", "center": "Review, Get ready for Movers & Fun corner", "branches": ["Technology words & verb phrases", "Past simple: did/didn't, was/were, regular & irregular", "could / couldn't"], "icon": "🧠"}, {"type": "exit", "title": "Exit ticket", "items": [{"k": "2", "text": "Say 3 past verbs."}, {"k": "1", "text": "What could you do when you were six?"}], "icon": "🎟️"}, {"type": "homework", "title": "Homework", "head": "My homework", "items": ["Activity Book pp. 33–35.", "Revise Unit 2 words."], "icon": "🏠"}]}, {"id": "L23", "unit": "U3", "unitName": "Unit 2: Then and now", "title": "Graded readers: At the Technology Museum & The Special Race", "code": "", "theme": "library", "emo": "📚", "slides": [{"type": "cover", "say": "At the Technology Museum 🕹️ & The Special Race 🐧"}, {"type": "goals", "title": "Today's goals", "items": ["I can read two stories.", "I can find could/couldn't and past verbs.", "I can talk about the stories."], "icon": "🎯"}, {"type": "read", "title": "At the Technology Museum (1)", "paras": ["Last Saturday, Ivy visited a Technology Museum with her mum.", "Good morning. I'd like some information about this room, please. – Yes, of course. What do you want to know?", "What can we see and do here? Can I learn about the past? – Yes, you can. You can play old computer games, listen to music and use old telephones."], "img": "L23_c1", "icon": "🕹️"}, {"type": "read", "title": "At the Technology Museum (2)", "paras": ["Look, Mum. You couldn't send an email on this computer, but you could play games. You use the keyboard to play this game. It's fun!", "Everything was very different 40 years ago! We didn't have tablets or mobile phones, but I loved playing computer games. They were fun!"], "img": "L23_c2", "icon": "🎮"}, {"type": "quiz", "title": "Check!", "qs": [{"q": "When did Ivy visit the museum?", "o": ["last Saturday", "last Monday"], "a": 0}, {"q": "What could you do on the old computer?", "o": ["play games", "send emails"], "a": 0}, {"q": "How long ago didn't Mum have tablets?", "o": ["40 years ago", "4 years ago"], "a": 0}], "icon": "✅"}, {"type": "read", "title": "At the Technology Museum (3–4)", "paras": ["Then Ivy found some unusual things in the museum. She saw something and made a face. What are these, Mum? Are they telephones? – Yes, Ivy. Those telephones are very old. Many years ago, telephones didn't have buttons."], "img": "L23_c4", "icon": "📮"}, {"type": "read", "title": "At the Technology Museum (3–4)", "paras": ["And what's this? Is it an old computer? – No, Ivy. This is a letter box! You can buy a postcard in the museum shop and post it here.", "Oh, of course! A letter box. Let's buy a postcard for Grandad. Posting a letter or a postcard is more interesting than sending an email!"], "img": "L23_c4", "icon": "📮"}, {"type": "tf", "title": "True or false?", "items": [{"text": "Very old telephones had buttons.", "a": false, "fix": "telephones didn't have buttons"}, {"text": "Ivy thinks the letter box is an old computer.", "a": true, "fix": "Is it an old computer?"}, {"text": "Ivy buys a postcard for Grandad.", "a": true, "fix": "Let's buy a postcard for Grandad."}], "icon": "✔️✘"}, {"type": "read", "title": "The Special Race (1)", "paras": ["Khalid found an old [[medal]]. He asked his dad about it. When Dad was young, he was really good at running. He also studied Science in Britain. When he was in Britain, he ran lots of races. This race was special because he ran in a penguin [[costume]]."], "img": "L23_c5", "icon": "🐧"}, {"type": "read", "title": "The Special Race (1)", "paras": ["Look, I've got some great photos on my tablet. Do you want to see them? – Yes, please!"], "img": "L23_c5", "icon": "🐧"}, {"type": "read", "title": "The Special Race (2–4)", "paras": ["When you were in your penguin costume, could you run? – Yes, I could run slowly in my penguin costume. I tri ras": ["More than 2,000 years ago, people sold a lot of frankincense to countries around the world. The frankincense helped the towns of Al Balid and Khawr Rori to grow into important [[ports]] where boats took the frankincense to markets in other countries."], "img": "L28_c3", "icon": "⚓🏰"}, {"type": "read", "title": "Ancient ports", "paras": ["As the frankincense was important, they built big walls and forts to guard the ports. Today Al Balid and Khawr Rori are [[ruins]], but it is very interesting to visit them.", "Al Balid has a fascinating museum, too, called the Museum of the Frankincense Land."], "img": "L28_c3", "icon": "⚓🏰"}, {"type": "tf", "title": "True or false?", "items": [{"text": "People sold frankincense more than 2,000 years ago.", "a": true, "fix": "More than 2,000 years ago"}, {"text": "Al Balid and Khawr Rori were important ports.", "a": true, "fix": "grow into important ports"}, {"text": "They built walls and forts to guard the ports.", "a": true, "fix": "big walls and forts"}, {"text": "Some people use frankincense as chewing gum.", "a": true, "fix": "Fun fact!"}], "icon": "✔️✘"}, {"type": "match", "title": "Match", "pairs": [["Wadi Dawkah", "many frankincense trees"], ["Al Balid", "the Museum of the Frankincense Land"], ["Khawr Rori", "an ancient port – now ruins"], ["Bat", "buildings about 5,000 years old"]], "icon": "✏️"}, {"type": "ask", "title": "Other ancient places", "qs": [{"q": "Are there any other ancient places in Oman?", "a": "There are some ancient buildings in Bat."}, {"q": "How old are the buildings at Bat?", "a": "about 5,000 years old!"}], "img": "L28_c4", "icon": "🏛️"}, {"type": "read", "title": "Model: Bat", "paras": ["This place is called Bat. It is in Al-Dhahira Governorate.", "The buildings are about 5,000 years old.", "In the past, people lived and worked here. Today, you can see some towers and ruins of buildings."], "img": "L28_c5", "icon": "🏛️"}, {"type": "quiz", "title": "Useful phrases", "icon": "✏️", "qs": [{"q": "T s. They are learning about the solar system in Science and this afternoon they will have a space race.", "I love races, Faisal! – Me, too Hazim! I won't win because I'm not very fast, but I'll enjoy the race."], "img": "L33_c2", "icon": "🚀"}, {"type": "read", "title": "The Space Race (1–2)", "paras": ["The children get their costumes ready for the space race. Some children will dress up as rockets and others will dress up as planets and stars. Faisal and Hazim will dress up as astronauts.", "I love this helmet. It's great! – I want to be an astronaut. I'll wear this spacesuit."], "img": "L33_c2", "icon": "🚀"}, {"type": "quiz", "title": "Check!", "qs": [{"q": "What are they learning about?", "o": ["the solar system", "shops"], "a": 0}, {"q": "Why won't Hazim win?", "o": ["He's not very fast.", "He's ill."], "a": 0}, {"q": "Faisal and Hazim dress up as …", "o": ["astronauts", "rockets"], "a": 0}], "icon": "✅"}, {"type": "read", "title": "The Space Race (3–4)", "paras": ["The teacher, Mr Osama, starts the race and the boys run fast. They get to the tree and then they start to run back to the teacher. But Hazim sees a [[squirrel]] in the tree. He looks up and then he falls over."], "img": "L33_c4", "icon": "🐿️"}, {"type": "read", "title": "The Space Race (3–4)", "paras": ["Faisal and the other boys run back to Hazim. They help him to get up. – Oh no! My helmet! – Don't worry, you can have my helmet. – But you love your helmet! Thank you, Faisal!", "The boys run with Hazim and they finish the space race together. – You have a new helmet and you won the race, Hazim! Well done! – We all won, Mr Osama!"], "img": "L33_c4", "icon": "🐿️"}, {"type": "order", "title": "Order the story", "items": ["Mr Osama starts the race.", "Hazim sees a squirrel.", "Hazim falls over.", "Faisal gives Hazim his helmet.", "They finish the race together."], "icon": "🔢"}, {"type": "read", "title": "The New Telescope (1–2)", "paras": ["Reem has got a new telescope. Her sister Arwa is very excited because they will use it for the first time this evening. – Will we see any planets through the telescope, Reem? – Yes, we will. We'll see Mars. It's the red planet!"], "img": "L33_c6", "icon": "🔭"}, {"type": "read", "title": "The New Telescope (1–2)", "paras": ["Arwa runs out to the garden. It's dark now. Reem sets up the telescope and Arwa looks through it. – Wow! Look at the stars. How many stars are there in space, Reem? – There are millions of stars in space, Arwa!"], "img": "L33_c6", "icon": "🔭"}, {"type": "read", "title": "The New Telescope (1–2)", "paras": ["Look! I can see the Moon. How far is the Moon, Reem? – It's really far! It's over three hundred thousand kilometres away!"], "img": "L33_c6", "icon": "🔭"}, {"type": "read", "title": "The New Telescope (3–4)", "paras": ["I can see Mars! How big is the red planet, Reem? – It's really big, Arwa, but it's not as big as Earth.", "I think I can see a space station, Reem. It's moving fast!", "Arwa points at the sky. What is it? It isn't a space station. It's a bat! Bats come out at night to find food. Then they sleep in the day."], "img": "L33_c7", "icon": "🦇"}, {"type": "read", "title": "The New Telescope (3–4)", "paras": ["Well done, Arwa! But we sleep at night, so now we have to go to bed!"], "img": "L33_c7", "icon": "🦇"}, {"type": "tf", "title": "True or false?", "items": [{"text": "Mars is the red planet.", "a": true, "fix": "It's the red planet!"}, {"text": "Mars is bigger than Earth.", "a": false, "fix": "it's not as big as Earth"}, {"text": "Arwa saw a space station.", "a": false, "fix": "It's a bat!"}, {"text": "Bats sleep in the day.", "a": true, "fix": "Then they sleep in the day."}], "icon": "✔️✘"}, {"type": "match", "title": "Match", "pairs": [["Hazim saw", "a squirrel."], ["Faisal gave Hazim", "his helmet."], ["Reem and Arwa saw", "Mars, the Moon and stars."], ["The 'space station' was", "a bat."]], "icon": "✏️"}, {"type": "build", "title": "Story words", "mode": "letters", "items": [{"a": "helmet", d some apples.", "a": "We'll go to the greengrocer's."}, {"q": "I need a football.", "a": "We'll go to the sports shop."}], "img": "L34_c3", "icon": "🗣️"}, {"type": "enter", "title": "Catch the shop words!", "gate": "✓", "items": [{"text": "pharmacy", "in": true}, {"text": "meat", "in": false}, {"text": "apple", "in": false}, {"text": "teddy", "in": false}, {"text": "corner shop", "in": true}, {"text": "gift shop", "in": true}]}, {"type": "tf", "title": "True or false?", "items": [{"text": "You buy meat at the butcher's.", "a": true, "fix": "✔"}, {"text": "You buy medicine at the toy shop.", "a": false, "fix": "at the pharmacy"}, {"text": "A kiosk sells newspapers.", "a": true, "fix": "✔"}], "icon": "✔️✘"}, {"type": "quiz", "title": "Where will you go?", "icon": "✏️", "qs": [{"q": "I need some fish. We'll go to the ___.", "o": ["fishmonger's", "jeweller's"], "a": 0}, {"q": "I need new trainers. We'll go to the ___.", "o": ["shoe shop", "pharmacy"], "a": 0}, {"q": "I need a ring. We'll go to the ___.", "o": ["jeweller's", "butcher's"], "a": 0}]}, {"type": "wheel", "title": "Talk", "items": [{"q": "What's your favourite shop?", "a": "…"}, {"q": "What do you buy at the corner shop?", "a": "…"}, {"q": "Which shop is near your house?", "a": "…"}], "icon": "🎡"}, {"type": "balloons", "title": "Pop it!", "rounds": [{"q": "💍 =", "o": ["jeweller's", "butcher's"], "a": 0}, {"q": "🐟 =", "o": ["fishmonger's", "greengrocer's"], "a": 0}, {"q": "💊 =", "o": ["pharmacy", "kiosk"], "a": 0}, {"q": "🎁 =", "o": ["gift shop", "shoe shop"], "a": 0}], "icon": "🎈"}, {"type": "steps", "title": "Let's remember!", "icon": "🧠", "steps": ["12 shops: butcher's, greengrocer's, fishmonger's, pharmacy, kiosk, jeweller's, sports shop, gift shop, phone shop, corner shop, shoe shop, toy shop", "We'll go to the …"]}, {"type": "exit", "title": "Exit ticket", "items": [{"k": "2", "text": "Where can you buy medicine?"}, {"k": "1", "text": "Name 3 shops near your house."}], "icon": "🎟️"}, {"type": "homework", "title": "Homework", "head": "My homework", "items": ["Activity Book p. 48.", "Write 4 sentences: At the … you can buy …"], "icon": "🏠"}]}, {"id": "L35", "unit": "U5", "unitName": "Unit 4: Off to the shops", "title": "Story: Stop, thief!", "code": "", "theme": "city", "emo": "🚨", "slides": [{"type": "cover", "say": "A Discovery Team story"}, {"type": "goals", "title": "Today's goals", "items": ["I can read and understand the story.", "I can put the story in order.", "I can describe the thief."], "icon": "🎯"}, {"type": "mystery", "title": "Before you read", "img": "L35_c1", "answer": "A shopping mall with an escalator!", "qs": [{"q": "Which shops can you see in the story?", "o": ["a phone shop", "a fishmonger's"], "a": 0}, {"q": "Sami wants to buy a present for …", "o": ["his mum", "his dad"], "a": 0}, {"q": "A machine which carries you upstairs:", "o": ["an escalator", "a lift"], "a": 0}], "icon": "🏬"}, {"type": "read", "title": "Stop, thief! (1–5)", "paras": ["I have to buy a birthday present for our mum. I'll get her a new mobile phone case. There's a case which she really likes in the phone shop.", "Where's the phone shop? – It's upstairs. We have to go up the [[escalator]]."], "img": "L35_c1", "icon": "📖"}, {"type": "read", "title": "Stop, thief! (1–5)", "paras": ["This is amazing! What is it? – It's an escalator! It's a machine which carries you upstairs and downstairs! – How does it work? – Well, an escalator is actually three simple machines!", "What a rude man! Are you OK? – Yes, I am, thanks. Come on, let's go to the phone shop."], "img": "L35_c1", "icon": "📖"}, {"type": "quiz", "title": "Check!", "qs": [{"q": "What will Sami buy?", "o": ["a phone case", "a necklace"], "a": 0}, {"q": "Where's the phone shop?", "o": ["upstairs", "next to the bank"], "a": 0}, {"q": "Who walks into Fatma?", "o": ["a rude man", "Bo"], "a": 0}], "icon": "✅"}, {"type": "read", "title": "Stop, thief! (6–12)", "paras": ["Is this the phone case which Mum likes? – No, it isn't. She loves the one which has the comet on it. But I can't see it …", "Hey, isn't that the man who walked into me earlier? What's he doing? – Yes, that's it! He's stealing those phones!", "That man is stealing those phones! We have to stop him! – Stop, [[thief]]! … Where did he go?"], "img": "L35_c3", "icon": "📖"}, {"type": "read", "title": "Stop, thief! (6–12)", "paras": ["The thief has got dark, curly hair. He's wearing a black T-shirt, blue jeans and trainers. He had a blue sports bag. – Yes, and he had a moustache!"], "img": "L35_c3", "icon": "📖"}, {"type": "order", "title": "Number the sentences", "items": ["Sami is looking for the phone shop, where there's a phone case his mum likes.", "They go up the escalator.", "A man walks into Fatma.", "The children look at phone cases in the phone shop.", "The children see a man stealing a phone.", "Bo tries to stop the thief."], "icon": "🔢"}, {"type": "ask", "title": "Solve it! Who is the thief?", "qs": [{"q": "Dark, curly hair, black T-shirt, blue jeans, trainers, a blue sports bag and a moustache. Look at page 106.", "a": "The third man from the left! 🕵️"}], "img": "L35_c4", "icon": "🕵️"}, {"type": "enter", "title": "Catch the words that describe the thief!", "gate": "✓", "items": [{"text": "fair hair", "in": false}, {"text": "a beard", "in": false}, {"text": "red T-shirt", "in": false}, {"text": "black T-shirt", "in": true}, {"text": "moustache", "in": true}, {"text": "blue jeans", "in": true}]}, {"type": "tf", "title": "True or false?", "items": [{"text": "Mum likes the phone case with the comet on it.", "a": true, "fix": "She loves the one which has the comet on it."}, {"text": "The thief has got straight fair hair.", "a": false, "fix": "dark, curly hair"}, {"text": "The thief had a moustache.", "a": true, "fix": "he had a moustache!"}], "icon": "✔️✘"}, {"type": "ask", "title": "Design your own phone case", "qs": [{"q": "Tell your partner about it.", "a": "This is my phone case. It's got …"}], "icon": "📱"}, {"type": "bu  magazines. In the UK, corner shops also sell stamps, cleaning products and [[stationery]], such as pens and birthday cards."], "icon": "🏪"}, {"type": "quiz", "title": "Check!", "qs": [{"q": "Most corner shops sell …", "o": ["sweets, food, drinks", "cars"], "a": 0}, {"q": "In the UK they also sell …", "o": ["stamps and stationery", "fish"], "a": 0}], "icon": "✅"}, {"type": "read", "title": "Names around the world", "paras": ["In Australia, a traditional corner shop is called a milk bar. In New Zealand, it's called a dairy. In the past, milk bars and dairies sold a lot of milk and ice cream, and some were also cafés.", "In North America, there are many different names for corner shops! In New York, a corner shop is often called a bodega. In Canada, it's a corner store."], "icon": "🌍"}, {"type": "read", "title": "Names around the world", "paras": ["There are many names for corner shops, but one thing is the same: we all buy things from them!", "Fun fact: In Detroit, a city in the USA, a corner shop is called a party shop!"], "icon": "🌍"}, {"type": "match", "title": "Match the name", "pairs": [["Australia", "a milk bar"], ["New Zealand", "a dairy"], ["New York", "a bodega"], ["Canada", "a corner store"], ["Detroit", "a party shop"]], "icon": "🌍"}, {"type": "enter", "title": "Catch the things corner shops sell!", "gate": "✓", "items": [{"text": "fridges", "in": false}, {"text": "milk", "in": true}, {"text": "boats", "in": false}, {"text": "newspapers", "in": true}, {"text": "stamps", "in": true}, {"text": "cars", "in": false}]}, {"type": "ask", "title": "My corner shop", "qs": [{"q": "What does your corner shop sell?", "a": "My corner shop sells milk and sweets."}, {"q": "What do you like buying there?", "a": "I like buying …"}], "icon": "🗣️"}, {"type": "read", "title": "Model advert: Dream Gifts", "paras": ["Come to our friendly shop, Dream Gifts.", "You can buy the best gifts here.", "We also sell cards.", "You will be happy that you came here!"], "img": "L38_c3", "ic  ["Rosie buys the dates for her dad, but she hasn't got enough money for the chocolate. When she gets home, she sees her dad in the garden.", "I bought you some dates, Dad. – Thank you, Rosie. These are my favourite! I have something for you, too. Some chocolate! – Thank you, Dad! That's my favourite!"], "img": "L43_c4", "icon": "🌴"}, {"type": "quiz", "title": "Money problem", "qs": [{"q": "Rosie has 4 euros. Dates = 3 euros, chocolate = 2 euros. Can she buy both?", "o": ["No – 3 + 2 = 5", "Yes"], "a": 0}, {"q": "How much is the fish?", "o": ["six euros", "three euros"], "a": 0}, {"q": "What does Dad give Rosie?", "o": ["chocolate", "dates"], "a": 0}], "icon": "💶"}, {"type": "read", "title": "The Treasure Chest (1–2)", "paras": ["Hamed lives in a big city. On a road near Hamed's home, there are lots of shops. There's a pharmacy, a gift shop, a shoe shop and two toy shops. One of the toy shops has a [[treasure chest]] in the window."], "img": "L43_c5", "icon": "🧰"}, {"type": "read", "title": "The Treasure Chest (1–2)", "paras": ["One day, Hamed stops at the toy shop which has the treasure chest in the window. He thinks about the treasure inside it. – Come on Hamed, time for school.", "Hamed really wants the treasure chest. – I want to save my pocket money to buy the treasure chest."], "img": "L43_c5", "icon": "🧰"}, {"type": "read", "title": "The Treasure Chest (3–4)", "paras": ["After four weeks, Hamed has enough money in his money box to buy the treasure chest. He gives his pocket money to the man who works in the toy shop.", "At home, Hamed is excited to open the treasure chest. His sister is excited, too. – What's in the treasure chest, Hamed?"], "img": "L43_c7", "icon": "🧸"}, {"type": "read", "title": "The Treasure Chest (3–4)", "paras": ["Hamed opens the treasure chest – but it's empty! – Oh no! There's no treasure! – Don't worry, Hamed. You can put your treasure in it!", "Hamed puts lots of his favourite things in the treasure chest. – I love my treasure chest!
