<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#ffffff">
<title>مختبر العلوم التفاعلي – الصف الخامس</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&family=Baloo+Bhaijaan+2:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1d2945;--mut:#5c6886;--card:#fff;--line:#e3eaf4;--soft:#f4f7fc;
  --ok:#1fae6b;--bad:#ea4c4c;--sun:#ffb300;--sun2:#fff1c9;--pur:#8a4bc6;--pur2:#efe3fb;
  --u:#27a169;--u2:#d9f5e6;--u3:#0f6e44;--r:22px;
  --sh:0 10px 30px rgba(31,53,95,.10),0 2px 6px rgba(31,53,95,.06);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:'Tajawal',system-ui,'Segoe UI',sans-serif;color:var(--ink);min-height:100vh;font-size:17px;
  background:linear-gradient(170deg,#e8f5ff 0%,#f5fbff 45%,#fff7e6 100%) fixed;overflow-x:hidden}
body:before{content:"";position:fixed;z-index:-1;width:460px;height:460px;top:-180px;left:-140px;border-radius:50%;background:radial-gradient(circle,#fff2b8 0%,rgba(255,242,184,0) 70%)}
body:after{content:"";position:fixed;z-index:-1;width:560px;height:560px;bottom:-260px;right:-200px;border-radius:50%;background:radial-gradient(circle,#dcf5e7 0%,rgba(220,245,231,0) 70%)}
button{font-family:inherit;cursor:pointer;border:none;color:inherit}
h1,h2,h3,h4,.bb{font-family:'Baloo Bhaijaan 2','Tajawal',sans-serif}
svg{direction:ltr}
svg text{font-family:'Tajawal',sans-serif}
/* header */
.top{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.86);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.top .in{max-width:1200px;margin:auto;display:flex;align-items:center;gap:8px;padding:9px 16px}
.logo{display:flex;align-items:center;gap:10px;cursor:pointer;flex:1;min-width:0}
.logo .ic{width:44px;height:44px;border-radius:14px;background:linear-gradient(135deg,#ffd040,#ff9a1f);display:grid;place-items:center;box-shadow:0 6px 14px rgba(255,160,0,.35);flex:none}
.logo b{font-family:'Baloo Bhaijaan 2','Tajawal';font-size:21px;line-height:1.1;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.logo small{color:var(--mut);font-size:13px;display:block}
.tbtn{background:#f1f5fb;border-radius:14px;height:42px;min-width:42px;padding:0 11px;font-size:18px;display:flex;align-items:center;justify-content:center;gap:6px;font-weight:800;transition:.2s}
.tbtn:hover{background:#e5edf8}
.lvl{display:flex;background:#f1f5fb;border-radius:14px;padding:4px;gap:3px}
.lvl button{border-radius:11px;padding:7px 10px;font-weight:800;font-size:14px;background:none;color:var(--mut);white-space:nowrap}
.lvl button.on{background:#fff;color:var(--ink);box-shadow:0 2px 8px rgba(0,0,0,.08)}
.wrap{max-width:1200px;margin:auto;padding:18px 16px 70px}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);border:1px solid rgba(227,234,244,.8)}
/* home */
.hero{display:grid;grid-template-columns:1.25fr 1fr;gap:18px;align-items:center;padding:26px;position:relative;overflow:hidden}
.hero h1{margin:0 0 6px;font-size:34px;line-height:1.3}
.hero p{margin:0 0 14px;color:var(--mut);line-height:1.85}
.namebox{display:flex;gap:8px;flex-wrap:wrap}
.namebox input{flex:1;min-width:170px;border:2px solid var(--line);border-radius:14px;padding:11px 14px;font-family:inherit;font-size:17px;outline:none;background:#fff}
.namebox input:focus{border-color:var(--sun)}
.hero-art{position:relative;height:230px}
.btn{background:var(--u);color:#fff;border-radius:14px;padding:12px 20px;font-weight:800;font-size:17px;box-shadow:0 6px 14px rgba(0,0,0,.12);transition:transform .15s,filter .2s;display:inline-flex;align-items:center;gap:8px;justify-content:center;line-height:1.3}
.btn:hover{filter:brightness(1.07)}.btn:active{transform:scale(.96)}
.btn.sun{background:linear-gradient(135deg,#ffc53d,#ff9a1f)}
.btn.pur{background:linear-gradient(135deg,#a56ae0,#7c3fc0)}
.btn.ghost{background:#f1f5fb;color:var(--ink);box-shadow:none}
.btn.sm{padding:8px 14px;font-size:15px;border-radius:12px}
.btn[disabled]{opacity:.45;pointer-events:none}
.sec-t{display:flex;align-items:center;gap:10px;margin:28px 4px 12px;font-size:22px}
.sec-t:after{content:"";flex:1;height:2px;background:linear-gradient(90deg,transparent,var(--line))}
.levels{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.lv{padding:14px;border:3px solid transparent;cursor:pointer;transition:.2s;text-align:center}
.lv.on{border-color:var(--sun);background:#fffbef}
.lv .e{font-size:34px}.lv b{display:block;font-size:18px;margin:4px 0}.lv small{color:var(--mut);line-height:1.6;display:block}
.units{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.unit{padding:0;overflow:hidden;cursor:pointer;transition:transform .2s,box-shadow .2s}
.unit:hover{transform:translateY(-4px);box-shadow:0 18px 40px rgba(31,53,95,.16)}
.unit .art{height:160px;display:grid;place-items:center;position:relative;overflow:hidden}
.unit .art .em{font-size:60px;filter:drop-shadow(0 8px 10px rgba(0,0,0,.15))}
.unit .bd{padding:16px 18px 18px}
.unit h3{margin:0 0 4px;font-size:22px}
.unit .meta{color:var(--mut);font-size:14px}
.pbar{height:10px;background:#eef2f8;border-radius:10px;overflow:hidden;margin-top:12px}
.pbar i{display:block;height:100%;border-radius:10px;background:var(--u);transition:width .6s}
.extras{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.xt{padding:16px;display:flex;gap:12px;align-items:center;cursor:pointer;transition:.2s}
.xt:hover{transform:translateY(-3px)}
.xt .e{font-size:30px;width:56px;height:56px;border-radius:16px;display:grid;place-items:center;flex:none}
.xt b{display:block;font-size:17px}.xt small{color:var(--mut);font-size:13px}
/* unit page */
.uhead{padding:22px 24px;display:flex;gap:18px;align-items:center;color:#fff;background:linear-gradient(135deg,var(--u),var(--u3));border-radius:var(--r);position:relative;overflow:hidden;box-shadow:var(--sh)}
.uhead h2{margin:0;font-size:28px}.uhead p{margin:4px 0 0;opacity:.92;line-height:1.7}
.uhead .big{font-size:62px;filter:drop-shadow(0 6px 10px rgba(0,0,0,.18))}
.uhead:after{content:"";position:absolute;width:260px;height:260px;border-radius:50%;background:rgba(255,255,255,.12);left:-60px;top:-120px}
.lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;margin-top:18px}
.ltile{padding:15px;cursor:pointer;display:flex;gap:13px;align-items:center;transition:.2s;position:relative}
.ltile:hover{transform:translateY(-3px)}
.ltile .num{width:58px;height:58px;border-radius:18px;background:var(--u2);display:grid;place-items:center;font-size:30px;flex:none}
.ltile b{font-size:17px;display:block;line-height:1.45}
.ltile .no{font-size:13px;color:var(--u);font-weight:900}
.ltile .tags{display:flex;gap:5px;margin-top:6px;flex-wrap:wrap}
.ltile.chk{background:linear-gradient(135deg,#fff,#fff8e6)}
.tag{font-size:12px;padding:3px 8px;border-radius:20px;background:#f1f5fb;color:var(--mut);font-weight:800}
.tag.ok{background:#dcf6e9;color:#138a53}.tag.st{background:var(--sun2);color:#9a6200}
/* lesson */
.crumb{display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap;color:var(--mut);font-weight:700;font-size:15px}
.crumb a{cursor:pointer;color:var(--u);text-decoration:none}
.lhead{display:flex;gap:14px;align-items:center;padding:16px 18px;margin-bottom:12px;flex-wrap:wrap}
.lhead .num{width:64px;height:64px;border-radius:20px;background:var(--u2);display:grid;place-items:center;font-size:34px;flex:none}
.lhead h2{margin:0;font-size:25px;line-height:1.3}
.lhead .goal{color:var(--mut);font-size:15px;margin-top:3px;line-height:1.6}
.words{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}
.word{background:var(--u2);color:var(--u3);font-weight:800;padding:4px 11px;border-radius:20px;font-size:14px;cursor:pointer;border:1px solid transparent}
.word:hover{border-color:var(--u)}
.steps{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 10px;scrollbar-width:none}
.steps::-webkit-scrollbar{display:none}
.step{flex:none;display:flex;align-items:center;gap:8px;padding:9px 13px;border-radius:16px;background:#fff;border:2px solid var(--line);font-weight:800;color:var(--mut);transition:.2s;font-size:15px}
.step .n{width:26px;height:26px;border-radius:50%;background:#eef2f8;display:grid;place-items:center;font-size:13px}
.step.on{border-color:var(--u);color:var(--ink);background:var(--u2)}
.step.on .n{background:var(--u);color:#fff}
.step.done .n{background:var(--ok);color:#fff}
.stage{padding:20px;min-height:430px;position:relative}
.stage-t{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.stage-t h3{margin:0;font-size:22px;display:flex;align-items:center;gap:8px}
.pill{background:var(--u2);color:var(--u3);padding:6px 12px;border-radius:20px;font-weight:800;font-size:14px}
.bnav{display:flex;justify-content:space-between;gap:10px;margin-top:14px}
/* slides */
.slide{display:grid;grid-template-columns:1.05fr 1fr;gap:22px;align-items:center;animation:sin .45s ease}
@keyframes sin{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.slide .vis{background:linear-gradient(160deg,#f5fbff,#fffaf0);border-radius:20px;min-height:320px;display:grid;place-items:center;padding:12px;border:1px solid var(--line);position:relative;overflow:hidden}
.slide .vis svg{max-width:100%;height:auto;display:block}
.slide .txt h3{margin:0 0 10px;font-size:26px;color:var(--u3);line-height:1.35}
.slide .txt p{line-height:1.95;font-size:19px;margin:0 0 10px}
.slide .txt ul{padding-right:22px;line-height:2;font-size:18px;margin:6px 0}
.kw{background:var(--sun2);padding:1px 7px;border-radius:8px;font-weight:800;color:#8f5600}
.key{background:#e3f8ee;border-right:5px solid var(--ok);border-radius:12px;padding:10px 14px;font-weight:800;color:#0f6a40;margin-top:10px;line-height:1.7}
.enr{background:var(--pur2);border-right:5px solid var(--pur);border-radius:12px;padding:10px 14px;color:#4b2176;margin-top:10px;line-height:1.8;font-weight:600}
.enr b{color:var(--pur)}
.snav{display:flex;justify-content:space-between;align-items:center;margin-top:16px;gap:10px}
.dots{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.dots i{width:10px;height:10px;border-radius:10px;background:#dde5f0;transition:.3s;cursor:pointer}
.dots i.on{width:28px;background:var(--u)}
.flips{display:grid;grid-template-columns:repeat(auto-fit,minmax(125px,1fr));gap:10px;margin-top:12px}
.flip{perspective:800px;height:122px;cursor:pointer}
.flip .fi{position:relative;width:100%;height:100%;transition:transform .6s;transform-style:preserve-3d}
.flip.open .fi{transform:rotateY(180deg)}
.flip .fa,.flip .fb{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px;text-align:center;font-weight:800}
.flip .fa{background:var(--u2);color:var(--u3);font-size:15px}.flip .fa span{font-size:36px;line-height:1.2}
.flip .fb{background:#fff;border:2px solid var(--u);transform:rotateY(180deg);font-size:14px;line-height:1.55;font-weight:700}
.say{background:#fff;border:2px solid var(--line);border-radius:12px;padding:6px 11px;font-weight:800;font-size:14px;display:inline-flex;align-items:center;gap:5px}
.say:hover{border-color:var(--u)}
/* quiz */
.qwrap{max-width:800px;margin:auto}
.qtop{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.qprog{flex:1;height:12px;background:#eef2f8;border-radius:10px;overflow:hidden}
.qprog i{display:block;height:100%;background:linear-gradient(90deg,var(--u),var(--sun));transition:width .4s}
.qcard{padding:22px;border-radius:22px;background:linear-gradient(160deg,#fff,#f8fbff);border:2px solid var(--line);animation:sin .35s}
.qvis{display:flex;justify-content:center;font-size:62px;margin-bottom:4px;line-height:1.25}
.qvis svg{max-height:180px;width:auto;max-width:100%}
.qtext{font-size:22px;font-weight:800;line-height:1.7;text-align:center;margin:4px 0 16px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.opt{background:#fff;border:2.5px solid var(--line);border-radius:16px;padding:14px;font-size:18px;font-weight:700;text-align:right;display:flex;align-items:center;gap:10px;transition:.15s;line-height:1.5}
.opt:hover{border-color:var(--u);transform:translateY(-2px)}
.opt .k{width:32px;height:32px;border-radius:10px;background:#f1f5fb;display:grid;place-items:center;flex:none;font-weight:900}
.opt.good{background:#e3f8ee;border-color:var(--ok)}.opt.good .k{background:var(--ok);color:#fff}
.opt.wrong{background:#fdeaea;border-color:var(--bad);animation:shake .4s}.opt.wrong .k{background:var(--bad);color:#fff}
.opt.gone{opacity:.25;pointer-events:none}
.opt[disabled]{pointer-events:none}
@keyframes shake{25%{transform:translateX(6px)}50%{transform:translateX(-6px)}75%{transform:translateX(4px)}}
.shake{animation:shake .4s}
.fb{margin-top:14px;padding:12px 16px;border-radius:14px;font-weight:700;line-height:1.75;display:none}
.fb.show{display:block;animation:sin .3s}
.fb.y{background:#e3f8ee;color:#0f7a48}.fb.n{background:#fff3e0;color:#9a5800}
.res{text-align:center;padding:10px}
.res .stars{font-size:46px;letter-spacing:6px;margin:6px 0}
.res h3{font-size:28px;margin:4px 0}
.res p{color:var(--mut);line-height:1.8}
.cmp{display:flex;gap:26px;justify-content:center;align-items:flex-end;height:190px;margin:18px auto;max-width:360px;border-bottom:3px solid var(--line)}
.cmp div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-weight:800;gap:4px}
.cmp i{width:72%;border-radius:12px 12px 4px 4px;transition:height 1.1s cubic-bezier(.2,.9,.3,1.15);display:block;height:0}
.cmp-l{display:flex;gap:26px;justify-content:center;max-width:360px;margin:auto}
.cmp-l span{flex:1;text-align:center;font-weight:800;color:var(--mut)}
.intro{text-align:center;max-width:620px;margin:10px auto;padding:10px}
.intro .e{font-size:78px;line-height:1.2}
.intro h3{font-size:26px;margin:8px 0}
.intro p{color:var(--mut);line-height:1.9;font-size:18px}
/* games */
.gmenu{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.gcard{padding:18px;cursor:pointer;text-align:center;transition:.2s;border:2px solid var(--line);border-radius:20px;background:#fff}
.gcard:hover{transform:translateY(-3px);border-color:var(--u)}
.gcard .e{font-size:48px;line-height:1.2}.gcard b{display:block;font-size:18px;margin:6px 0 2px}.gcard small{color:var(--mut)}
.gbar{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:12px}
.gbar h4{margin:0;font-size:19px}
.gstat{display:flex;gap:8px;flex-wrap:wrap}
.gstat span{background:#f1f5fb;border-radius:12px;padding:6px 12px;font-weight:800;font-size:15px}
.ginst{background:var(--sun2);color:#7a4c00;border-radius:12px;padding:8px 14px;font-weight:800;margin-bottom:12px;line-height:1.6}
.chip{background:#fff;border:2.5px solid var(--line);border-radius:14px;padding:10px 14px;font-weight:800;font-size:16px;display:inline-flex;align-items:center;gap:6px;transition:.15s;cursor:pointer;user-select:none;line-height:1.4}
.chip.sel{border-color:var(--sun);background:var(--sun2);transform:scale(1.05);box-shadow:0 4px 12px rgba(255,179,0,.3)}
.chip.done{opacity:.3;pointer-events:none}
.chip.good{border-color:var(--ok);background:#e3f8ee}
.pool{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;padding:14px;background:#f7faff;border-radius:18px;border:2px dashed var(--line);min-height:70px}
.bins{display:grid;gap:12px;margin-top:14px}
.bin{border-radius:20px;border:3px dashed var(--line);padding:12px;min-height:150px;transition:.2s;cursor:pointer;background:#fff}
.bin h4{margin:0 0 8px;text-align:center;font-size:18px;line-height:1.4}
.bin h4 span{font-size:30px;display:block}
.bin .in{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.bin .in .chip{font-size:14px;padding:6px 10px;pointer-events:none}
.bin.hot{border-color:var(--sun);background:#fffbef}
.mcols{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.mcols .col{display:flex;flex-direction:column;gap:10px}
.mcols .chip{justify-content:center;text-align:center;min-height:60px}
.mem{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;max-width:680px;margin:auto}
.mc{aspect-ratio:1/1;perspective:600px;cursor:pointer}
.mc .fi{position:relative;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d}
.mc.op .fi{transform:rotateY(180deg)}
.mc .fa,.mc .fb{position:absolute;inset:0;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;backface-visibility:hidden;-webkit-backface-visibility:hidden;padding:6px;font-weight:800}
.mc .fa{background:linear-gradient(135deg,var(--u),var(--u3));color:#fff;font-size:34px}
.mc .fb{background:#fff;border:2.5px solid var(--u);transform:rotateY(180deg);font-size:14px;line-height:1.4}
.mc .fb span{font-size:30px;display:block}
.mc.ok .fb{background:#e3f8ee;border-color:var(--ok)}
.arena{position:relative;height:430px;border-radius:20px;overflow:hidden;background:linear-gradient(#bfe6ff,#e9f7ff 72%,#c8ecb0 72%,#a6da88);border:2px solid var(--line);touch-action:none;user-select:none}
.fall{position:absolute;padding:7px 12px;border-radius:14px;background:#fff;font-weight:800;box-shadow:0 4px 10px rgba(0,0,0,.12);white-space:nowrap;font-size:16px;top:0;left:0;will-change:transform}
.basket{position:absolute;bottom:10px;width:120px;height:64px;text-align:center;left:0;will-change:transform}
.basket .b{font-size:50px;line-height:1}.basket small{display:block;font-weight:900;font-size:12px;background:#fff;border-radius:8px;margin-top:-6px}
.aprompt{position:absolute;top:10px;right:10px;left:10px;text-align:center;z-index:3}
.aprompt span{background:rgba(255,255,255,.92);border-radius:14px;padding:6px 14px;font-weight:900;display:inline-block;box-shadow:0 3px 10px rgba(0,0,0,.08)}
.ordl{display:flex;flex-direction:column;gap:8px;max-width:640px;margin:auto}
.ordi{display:flex;align-items:center;gap:10px;background:#fff;border:2.5px solid var(--line);border-radius:16px;padding:9px 12px;font-weight:800;transition:.2s}
.ordi .n{width:34px;height:34px;border-radius:10px;background:var(--u2);color:var(--u3);display:grid;place-items:center;flex:none}
.ordi .e{font-size:26px}
.ordi .mv{margin-right:auto;display:flex;gap:4px}
.ordi .mv button{width:38px;height:38px;border-radius:10px;background:#f1f5fb;font-size:17px}
.ordi.good{border-color:var(--ok);background:#e3f8ee}.ordi.wrong{border-color:var(--bad);background:#fdeaea}
.bubbles{position:relative;height:400px;border-radius:20px;overflow:hidden;background:linear-gradient(#e9f7ff,#bfe6ff);border:2px solid var(--line);user-select:none}
.bub{position:absolute;top:0;left:0;border-radius:50%;display:grid;place-items:center;text-align:center;font-weight:800;background:radial-gradient(circle at 30% 28%,#fff 0,rgba(255,255,255,.7) 28%,rgba(140,205,255,.35) 70%);border:2px solid rgba(255,255,255,.95);box-shadow:inset 0 0 18px rgba(80,160,230,.35),0 4px 12px rgba(40,120,200,.15);cursor:pointer;padding:10px;font-size:15px;line-height:1.3;color:#0f3d66;will-change:transform}
.bub.pop{animation:pop .3s forwards}
.bub.badp{background:radial-gradient(circle,#ffd6d6,#ff9b9b)}
@keyframes pop{to{opacity:0;scale:1.6}}
.fillt{font-size:20px;line-height:2.7;text-align:center;background:#fff;border-radius:18px;padding:14px;border:2px solid var(--line)}

/* label */
.lblfig{position:relative;max-width:560px;margin:auto}

.spot{position:absolute;transform:translate(-50%,-50%);min-width:34px;height:34px;border-radius:17px;background:#fff;border:3px solid var(--u);font-weight:900;font-size:15px;padding:0 8px;box-shadow:0 3px 10px rgba(0,0,0,.18);z-index:2;white-space:nowrap;animation:pulse 1.8s infinite}
.spot.ok{background:var(--ok);border-color:var(--ok);color:#fff;animation:none}
@keyframes pulse{50%{box-shadow:0 0 0 7px rgba(39,161,105,.18)}}
/* labs */
.lab{display:grid;grid-template-columns:1.3fr 1fr;gap:18px;align-items:start}

input[type=range]{width:100%;accent-color:var(--u);height:30px}

.note.b{background:#dcefff;color:#12497a}.note.g{background:#e3f8ee;color:#0f6a40}.note.r{background:#fdeaea;color:#8c1f1f}.note.p{background:var(--pur2);color:#4b2176}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.tabs button{padding:9px 14px;border-radius:12px;background:#f1f5fb;font-weight:800;color:var(--mut);font-size:15px}
.tabs button.on{background:var(--u);color:#fff}
table.dt{width:100%;border-collapse:separate;border-spacing:0;border-radius:14px;overflow:hidden;border:1px solid var(--line);font-size:15px}
.dt th{background:var(--u2);padding:8px;font-weight:800}
.dt td{padding:7px;text-align:center;border-top:1px solid var(--line);background:#fff}
.dt td.hl{background:#fff7dc;font-weight:900}
.safety{display:flex;gap:10px;align-items:center;background:#fff0f0;border:2px solid #ffc9c9;border-radius:14px;padding:10px 14px;font-weight:800;color:#a02525}
.qa{display:flex;flex-direction:column;gap:8px}
.qa .qq{background:#fff;border:2px solid var(--line);border-radius:14px;padding:10px 12px}

.qa .qq .row button.wrong{background:#fdeaea;color:#a02525}
/* summary */
.sumgrid{display:grid;grid-template-columns:1.3fr 1fr;gap:16px}

.learned li{display:flex;gap:10px;align-items:flex-start;margin-bottom:10px;line-height:1.8;font-size:18px;background:#fff;border:2px solid var(--line);border-radius:14px;padding:10px 12px;cursor:pointer;transition:.3s}
.learned li .c{width:30px;height:30px;border-radius:50%;border:2.5px solid var(--line);flex:none;display:grid;place-items:center;font-weight:900;color:#fff;transition:.3s}
.learned li.ok{border-color:var(--ok);background:#f2fcf7}
.learned li.ok .c{background:var(--ok);border-color:var(--ok)}
.talk{background:linear-gradient(135deg,var(--pur2),#fff);border:2px dashed var(--pur);border-radius:22px;padding:18px;text-align:center}
.talk b{color:var(--pur);font-size:21px;display:block;margin-bottom:6px}
.talk p{font-size:19px;font-weight:700;line-height:1.8;margin:6px 0 12px}
.chal{background:linear-gradient(135deg,#fff5d6,#fff);border:2px dashed var(--sun);border-radius:22px;padding:16px;margin-top:14px}
.chal b{color:#b87800;font-size:19px}
/* misc */
.toast{position:fixed;bottom:22px;left:50%;opacity:0;pointer-events:none;transform:translateX(-50%) translateY(140px);background:var(--ink);color:#fff;padding:12px 20px;border-radius:14px;font-weight:800;z-index:99;transition:.35s;max-width:92vw;text-align:center;line-height:1.7;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}

.gl{padding:14px;cursor:pointer;transition:.2s}

.gl .pg{float:left;font-size:12px;background:#f1f5fb;border-radius:10px;padding:2px 8px;color:var(--mut)}
.search{width:100%;border:2px solid var(--line);border-radius:14px;padding:12px 14px;font-family:inherit;font-size:17px;margin-bottom:14px;outline:none;background:#fff}
.letters{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}

.letters button.on{background:var(--pur);color:#fff;border-color:var(--pur)}
.rep-row{display:grid;grid-template-columns:2fr 1fr 1fr 1.2fr;gap:10px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line)}
.rep-row.h{font-weight:900;background:var(--soft);border-radius:12px}
.mini{height:10px;border-radius:10px;background:#eef2f8;overflow:hidden}.mini i{display:block;height:100%}
.ring{width:120px;height:120px}
.center{text-align:center}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.mt{margin-top:12px}
.bob{animation:bob 3s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-8px)}}
.spin{animation:spin 6s linear infinite;transform-origin:center;transform-box:fill-box}@keyframes spin{to{transform:rotate(360deg)}}

@media(max-width:920px){

  .arena{height:390px}.stage{padding:14px}

}
@media print{.top,.bnav,.steps,.no-print{display:none!important}body{background:#fff}.card{box-shadow:none}}

<body>
<header class="top"><div class="in">
  <div class="logo" id="goHome"><div class="ic"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3h6M10 3v6L4.5 18.5A2 2 0 0 0 6.2 21.5h11.6a2 2 0 0 0 1.7-3L14 9V3"/><path d="M7 15h10"/></svg></div>
  <div style="min-width:0"><b>مختبر العلوم التفاعلي</b><small>الصف الخامس • الفصل الدراسي الأول</small></div></div>
  <div class="lvl" id="lvlBox"></div>
  <button class="tbtn" id="sndBtn" title="تشغيل/إيقاف الصوت">🔊</button>
  <button class="tbtn" id="repBtn" title="تقرير التقدم">📊</button>
</div></header>
<main class="wrap" id="app"></main>
<div class="toast" id="toast"></div>
<canvas class="confetti" id="conf"></canvas>
<script>
/* ================= CORE ================= */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const APP=$('#app');
const AR=n=>String(n).replace(/\d/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]);
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}
const rnd=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- state ---------- */
const KEY='sci5-lab-v1';
const S={name:'',lvl:2,snd:true,p:{}};
function load(){try{const d=JSON.parse(localStorage.getItem(KEY)||'{}');Object.assign(S,d);if(!S.p)S.p={}}catch(e){}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function P(id){return S.p[id]||(S.p[id]={d:{}})}
function markStep(id,k){const p=P(id);if(!p.d[k]){p.d[k]=1;save()}}

/* ---------- cleanup ---------- */
let CL=[];
function onClean(f){CL.push(f)}
function clean(){CL.forEach(f=>{try{f()}catch(e){}});CL=[];try{speechSynthesis.cancel()}catch(e){}}
function every(fn,ms){const t=setInterval(fn,ms);onClean(()=>clearInterval(t));return t}
function after(fn,ms){const t=setTimeout(fn,ms);onClean(()=>clearTimeout(t));return t}
function loop(fn){let on=true,last=performance.now(),id;function f(t){if(!on)return;const dt=Math.min(.05,(t-last)/1000);last=t;if(fn(dt,t)===false){on=false;return}id=requestAnimationFrame(f)}id=requestAnimationFrame(f);const stop=()=>{on=false;cancelAnimationFrame(id)};onClean(stop);return stop}

/* ---------- sound ---------- */
let AC=null;
function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){AC=null}}if(AC&&AC.state==='suspended')AC.resume();return AC}
function tone(f,d,type,v,delay,f2){if(!S.snd)return;const a=ac();if(!a)return;const t=a.currentTime+(delay||0);const o=a.createOscillator(),g=a.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v||.14,t+.012);g.gain.exponentialRampToValueAtTime(.0008,t+d);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+.05)}
function noise(d,v,fq,delay){if(!S.snd)return;const a=ac();if(!a)return;const t=a.currentTime+(delay||0);const b=a.createBuffer(1,a.sampleRate*d,a.sampleRate),x=b.getChannelData(0);for(let i=0;i<x.length;i++)x[i]=(Math.random()*2-1)*(1-i/x.length);const s=a.createBufferSource();s.buffer=b;const f=a.createBiquadFilter();f.type='bandpass';f.frequency.value=fq||1200;const g=a.createGain();g.gain.value=v||.12;s.connect(f);f.connect(g);g.connect(a.destination);s.start(t)}
const SND={
 click(){tone(620,.06,'triangle',.08)},
 ok(){tone(660,.12,'sine',.16);tone(990,.2,'sine',.14,.09)},
 bad(){tone(240,.22,'sawtooth',.06);tone(180,.25,'sawtooth',.05,.08)},
 pop(){tone(900,.08,'sine',.14,0,300)},
 flip(){noise(.12,.08,2500)},
 whoosh(){noise(.45,.1,700)},
 win(){[523,659,784,1047].forEach((f,i)=>tone(f,.25,'triangle',.13,i*.11));tone(1319,.45,'sine',.1,.5)},
 star(){tone(1200,.1,'sine',.1);tone(1600,.15,'sine',.08,.07)},
 drip(){tone(1400,.1,'sine',.1,0,500)},
 bubble(){for(let i=0;i<4;i++)tone(rnd(300,700),.07,'sine',.06,i*.07,rnd(800,1200))},
 buzz(){tone(180,.35,'sawtooth',.03,0,210)},
 tick(){tone(1000,.03,'square',.03)},
 grow(){tone(300,.5,'sine',.08,0,700)},
 splash(){noise(.3,.14,900)}
};
/* speech */
let VOICE=null;
function pickVoice(){try{const vs=speechSynthesis.getVoices();VOICE=vs.find(v=>/ar[-_]SA/i.test(v.lang))||vs.find(v=>/^ar/i.test(v.lang))||null}catch(e){}}
try{speechSynthesis.onvoiceschanged=pickVoice;pickVoice()}catch(e){}
function say(txt){if(!S.snd)return;try{speechSynthesis.cancel();const t=String(txt).replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim();const u=new SpeechSynthesisUtterance(t);u.lang='ar-SA';if(VOICE)u.voice=VOICE;u.rate=.92;speechSynthesis.speak(u)}catch(e){toast('القراءة الصوتية غير متاحة على هذا الجهاز')}}
function sayBtn(txt){return `<button class="say" data-say="${esc(txt)}">🔈 استمع</button>`}
document.addEventListener('click',e=>{const b=e.target.closest('[data-say]');if(b){e.stopPropagation();say(b.dataset.say)}});

/* ---------- toast & confetti ---------- */
let tT;
function toast(m,ms){const t=$('#toast');t.innerHTML=m;t.classList.add('show');clearTimeout(tT);tT=setTimeout(()=>t.classList.remove('show'),ms||2600)}
function confetti(){const c=$('#conf'),x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;const cols=['#ffb300','#27a169','#2a86d4','#d24f93','#8a4bc6','#ff6b3d'];const ps=[];for(let i=0;i<150;i++)ps.push({x:rnd(0,c.width),y:rnd(-c.height*.6,-10),vx:rnd(-2,2),vy:rnd(2,6),r:rnd(4,9),a:rnd(0,6),va:rnd(-.2,.2),c:cols[i%cols.length]});let n=0;(function f(){x.clearRect(0,0,c.width,c.height);ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.05;p.a+=p.va;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.c;x.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);x.restore()});if(++n<200)requestAnimationFrame(f);else x.clearRect(0,0,c.width,c.height)})()}
function stars(n){return '⭐'.repeat(n)+'<span style="opacity:.25">'+'⭐'.repeat(3-n)+'</span>'}
function starsOf(p){return p>=.9?3:p>=.6?2:1}

/* ---------- header ---------- */
const LVLS=[[1,'🌱','دعم','أسئلة أبسط، ثلاثة خيارات، تلميحات ومحاولة ثانية، وألعاب أهدأ.'],[2,'🌿','أساسي','المستوى المعتاد للصف: أربعة خيارات وأسئلة متنوعة.'],[3,'🌳','إثراء','أسئلة تفكير عليا، تحديات إضافية، وألعاب أسرع.']];
function drawLvl(){$('#lvlBox').innerHTML=LVLS.map(l=>`<button data-l="${l[0]}" class="${S.lvl==l[0]?'on':''}" title="مستوى ${l[2]}">${l[1]} <span>${l[2]}</span></button>`).join('')}
$('#lvlBox').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;setLvl(+b.dataset.l)});
function setLvl(l){S.lvl=l;save();drawLvl();SND.star();const L=LVLS[l-1];toast(`${L[1]} مستوى ${L[2]}: ${L[3]}`,3200);route()}
$('#sndBtn').onclick=()=>{S.snd=!S.snd;save();$('#sndBtn').textContent=S.snd?'🔊':'🔇';if(S.snd)SND.ok();else try{speechSynthesis.cancel()}catch(e){}};
$('#repBtn').onclick=()=>go('#/r');
$('#goHome').onclick=()=>go('#/');
function setTheme(u){const U=UNITS.find(x=>x.id==u)||UNITS[0];const r=document.documentElement.style;r.setProperty('--u',U.c);r.setProperty('--u2',U.c2);r.setProperty('--u3',U.c3)}

/* ---------- router ---------- */
function go(h){if(location.hash===h)route();else location.hash=h}
window.addEventListener('hashchange',route);
function route(){clean();const p=(location.hash||'#/').replace(/^#\/?/,'').split('/');window.scrollTo(0,0);
 try{
 if(p[0]==='u')unitPage(+p[1]);
 else if(p[0]==='l'&&L[p[1]])lessonPage(p[1],+(p[2]||0));
 else if(p[0]==='g')glossPage();
 else if(p[0]==='s')skillsPage();
 else if(p[0]==='r')reportPage();
 else if(p[0]==='t')bigTeamPage();
 else homePage();
 }catch(err){console.error(err);APP.innerHTML=`<div class="card stage center"><h3>حدث خطأ غير متوقع</h3><p>${esc(err.message)}</p><button class="btn" onclick="go('#/')">الرئيسية</button></div>`}
}

/* ---------- helpers ---------- */
function unitOf(id){return +String(id).split('-')[0]}
function lessonDone(id){const p=S.p[id];return !!(p&&p.post)}
function unitProgress(u){const ls=UNITS.find(x=>x.id==u).lessons;return ls.filter(lessonDone).length/ls.length}
function visHTML(v){if(!v)return '';if(typeof v==='function')return v();if(v.startsWith('v:')){const [k,...a]=v.slice(2).split('|');return V[k]?V[k](...a):''}return `<div>${v}</div>`}
function ring(pct,col,size){size=size||120;const r=size/2-10,c=2*Math.PI*r;return `<svg class="ring" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="#eef2f8" stroke-width="12"/><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${col}" stroke-width="12" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c*(1-pct)}" transform="rotate(-90 ${size/2} ${size/2})" style="transition:stroke-dashoffset 1s"/><text x="50%" y="54%" text-anchor="middle" font-size="${size/4.4}" font-weight="900" fill="#1d2945">${Math.round(pct*100)}%</text></svg>`}

/* ================= HOME ================= */
function homePage(){setTheme(1);
 const all=Object.keys(L),done=all.filter(lessonDone).length;
 APP.innerHTML=`
 <section class="card hero">
  <div>
   <h1>${S.name?`أهلًا يا ${esc(S.name)} 👋`:'مرحبًا بك في مختبر العلوم! 🔬'}</h1>
   <p>رحلة تفاعلية شاملة في كتاب العلوم للصف الخامس: عروض مصوّرة، مختبرات افتراضية، ألعاب متنوعة، وتمرين قبلي وبعدي لكل درس لتقيس تقدّمك بنفسك.</p>
   <div class="namebox"><input id="nm" placeholder="اكتب اسمك يا بطل العلوم" value="${esc(S.name)}" maxlength="30"><button class="btn sun" id="nmB">حفظ الاسم</button></div>
  </div>
  <div class="hero-art">${V.heroArt()}</div>
 </section>
 <h3 class="sec-t">🎯 اختر مستواك</h3>
 <div class="levels">${LVLS.map(l=>`<div class="card lv ${S.lvl==l[0]?'on':''}" data-l="${l[0]}"><div class="e">${l[1]}</div><b>${l[2]}</b><small>${l[3]}</small></div>`).join('')}</div>
 <h3 class="sec-t">📚 وحدات الكتاب</h3>
 <div class="units">${UNITS.map(u=>`<div class="card unit" data-u="${u.id}">
   <div class="art" style="background:${u.bg}">${u.art()}</div>
   <div class="bd"><div class="meta">الوحدة ${AR(u.id)} • ${AR(u.lessons.length)} دروس</div><h3>${u.t}</h3>
   <div class="pbar"><i style="width:${unitProgress(u.id)*100}%;background:${u.c}"></i></div>
   <div class="meta" style="margin-top:6px">أنجزت ${AR(u.lessons.filter(lessonDone).length)} من ${AR(u.lessons.length)}</div></div></div>`).join('')}</div>

function glossFind(w){const n=x=>x.replace(/[ًٌٍَُِّْ]/g,'').replace(/\s*\(.*?\)/g,'').trim();const a=n(w).split('/')[0].trim();return GLOSS.find(g=>{const b=n(g[0]);return b===a||b==='ال'+a||b===a.replace(/^ال/,'')||b.startsWith(a)||b.startsWith('ال'+a)})}

/* ---------- quiz selection ---------- */
function pickQs(id,kind){const l=L[id],want=S.lvl==1?[1]:S.lvl==2?[1,2]:[2,3];
 const all=l.q.map((q,i)=>({q,i}));const main=all.filter(o=>want.includes(o.q[0])),rest=all.filter(o=>!want.includes(o.q[0]));
 const off=kind==='pre'?0:1;const out=main.filter((o,i)=>i%2==off);const rs=rest.filter((o,i)=>i%2==off).concat(rest.filter((o,i)=>i%2!=off));
 const others=main.filter((o,i)=>i%2!=off);const n=5;
 for(const o of rs.concat(others)){if(out.length>=n)break;if(!out.includes(o))out.push(o)}
 return shuffle(out.slice(0,n)).map(o=>o.q)}

function quizStep(st,id,kind){const pre=kind==='pre',l=L[id],p=P(id);
 const prev=p[kind];
 st.innerHTML=stageTitle(pre?'🧭':'🏁',pre?'التمرين القبلي':'التمرين البعدي',`<span class="pill">${LVLS[S.lvl-1][1]} مستوى ${LVLS[S.lvl-1][2]}</span>`)+
 `<div class="intro"><div class="e bob">${pre?'🧭':'🏁'}</div><h3>${pre?'ماذا تعرف قبل أن نبدأ؟':'هل أصبحت خبيرًا في هذا الدرس؟'}</h3>
 <p>${pre?'خمسة أسئلة سريعة تكشف معلوماتك السابقة عن الدرس. لا تقلق من الخطأ؛ فهدفنا أن نقيس تقدّمك!':'خمسة أسئلة جديدة بعد التعلّم، وسنقارن نتيجتك بالتمرين القبلي لنرى مقدار تقدّمك.'}</p>
 ${prev?`<p class="note b" style="display:inline-block">نتيجتك السابقة: ${AR(fmt(prev[0]))} من ${AR(prev[1])}</p><br>`:''}
 ${!pre&&!p.pre?`<p class="note" style="display:inline-block">💡 يُفضّل حلّ التمرين القبلي أولًا للمقارنة.</p><br>`:''}
 <button class="btn sun" id="qStart" style="margin-top:10px;font-size:19px">${prev?'أعد المحاولة':'ابدأ التمرين'} ▶</button></div>`;
 $('#qStart').onclick=()=>{SND.click();const qs=pickQs(id,kind);
  runQuiz(st,qs,{title:pre?'التمرين القبلي':'التمرين البعدي',icon:pre?'🧭':'🏁',onEnd:(sc,tot)=>{p[kind]=[sc,tot];p.d[kind]=1;save();
   const s=starsOf(sc/tot);
   let html=`<div class="res"><div class="stars">${stars(s)}</div><h3>${sc/tot>=.9?'ممتاز! أداء رائع 🌟':sc/tot>=.6?'أحسنت! أداء جيد 👏':'بداية جيدة، واصل التعلّم 💪'}</h3><p>نتيجتك: <b>${AR(fmt(sc))} من ${AR(tot)}</b></p>`;
   if(!pre&&p.pre){const a=p.pre[0]/p.pre[1],b=sc/tot;html+=`<div class="cmp"><div><span>${AR(Math.round(a*100))}%</span><i id="cA" style="background:#b8c4d8"></i></div><div><span>${AR(Math.round(b*100))}%</span><i id="cB" style="background:var(--u)"></i></div></div><div class="cmp-l"><span>القبلي</span><span>البعدي</span></div><p style="font-size:19px;font-weight:800;color:${b>=a?'#0f7a48':'#9a5800'}">${b>a?`تقدّمت بمقدار ${AR(Math.round((b-a)*100))}% 🚀`:b==a?'حافظت على مستواك، راجع العرض لتتقدّم أكثر ✨':'راجع العرض والألعاب ثم أعد المحاولة 💡'}</p>`;after(()=>{const A=$('#cA'),B=$('#cB');if(A)A.style.height=Math.max(4,a*150)+'px';if(B)B.style.height=Math.max(4,b*150)+'px'},80)}
   html+=`<div class="row" style="justify-content:center;margin-top:14px"><button class="btn ghost" id="qAgain">🔄 إعادة</button><button class="btn" id="qNext">${pre?'انتقل إلى العرض التفاعلي ←':'انتقل إلى الدرس التالي ←'}</button></div></div>`;
   st.innerHTML=stageTitle(pre?'🧭':'🏁',pre?'نتيجة التمرين القبلي':'نتيجة التمرين البعدي')+html;
   if(s>=2){SND.win();if(!pre)confetti()}else SND.star();
   $('#qAgain').onclick=()=>quizStep(st,id,kind);
   $('#qNext').onclick=()=>{if(pre)go(`#/l/${id}/1`);else $('#nextB').click()};

/* ---------- quiz engine ---------- */
function runQuiz(st,qs,o){let i=0,sc=0;const tot=qs.length;
 function show(){const q=qs[i];let tries=0;const cor=q[2][0];const nw=S.lvl==1?2:3;const opts=shuffle([cor].concat(shuffle(q[2].slice(1)).slice(0,nw)));
  st.innerHTML=stageTitle(o.icon||'❓',o.title,`<span class="pill">السؤال ${AR(i+1)} من ${AR(tot)}</span>`)+
  `<div class="qwrap"><div class="qtop"><div class="qprog"><i style="width:${i/tot*100}%"></i></div><b>⭐ ${AR(fmt(sc))}</b></div>
  <div class="qcard">${q[4]?`<div class="qvis">${visHTML(q[4])}</div>`:''}<div class="qtext">${q[1]}</div>
  <div class="opts">${opts.map((t,k)=>`<button class="opt" data-c="${t===cor?1:0}"><span class="k">${'أبجد'[k]}</span><span>${t}</span></button>`).join('')}</div>
  <div class="row" style="justify-content:center;margin-top:12px">${sayBtn(q[1]+'. '+opts.join('، '))}${S.lvl==1?'<button class="say" id="hintB">💡 تلميح</button>':''}</div>
  <div class="fb" id="fb"></div><div class="center mt hide" id="nx"><button class="btn">${i<tot-1?'السؤال التالي ←':'عرض النتيجة 🏆'}</button></div></div></div>`;
  const hb=$('#hintB');if(hb)hb.onclick=()=>{const w=$$('.opt').filter(b=>b.dataset.c==0&&!b.classList.contains('gone')&&!b.classList.contains('wrong'));if(w.length>1){w[0].classList.add('gone');SND.pop();hb.disabled=true;hb.style.opacity=.4}};
  $$('.opt').forEach(b=>b.onclick=()=>{
   if(b.dataset.c==1){sc+=tries?.5:1;b.classList.add('good');SND.ok();$$('.opt').forEach(x=>x.disabled=true);fb(true)}
   else{b.classList.add('wrong');SND.bad();
    if(S.lvl==1&&tries==0){tries=1;b.disabled=true;const f=$('#fb');f.className='fb n show';f.innerHTML='ليست هذه الإجابة، حاول مرة أخرى 💪';}
    else{$$('.opt').forEach(x=>{x.disabled=true;if(x.dataset.c==1)x.classList.add('good')});fb(false)}}
  });
  function fb(ok){const f=$('#fb');f.className='fb show '+(ok?'y':'n');f.innerHTML=(ok?'✅ إجابة صحيحة! ':'💡 الإجابة الصحيحة: <b>'+cor+'</b>. ')+(q[3]||'');$('#nx').classList.remove('hide');$('#nx button').onclick=()=>{SND.click();i++;if(i<tot)show();else o.onEnd(sc,tot)}}
 }
 show()}

 function show(){clean();const s=sl[i];
  st.innerHTML=stageTitle('🖼️','العرض التفاعلي',`<span class="pill">شريحة ${AR(i+1)} من ${AR(sl.length)}</span>`)+
  `<div class="slide"><div class="vis" id="svis">${visHTML(s.v)}</div><div class="txt"><h3>${s.h}</h3>${s.p||''}
  ${s.k&&S.lvl<3?`<div class="key">🔑 ${s.k}</div>`:''}${s.x&&S.lvl>1?`<div class="enr"><b>📚 إثراء:</b> ${s.x}</div>`:''}
  ${s.f?`<div class="flips">${s.f.map(f=>`<div class="flip"><div class="fi"><div class="fa"><span>${f[0]}</span>${f[1]}</div><div class="fb">${f[2]}</div></div></div>`).join('')}</div>`:''}
  <div class="row mt">${sayBtn(s.h+'. '+(s.p||'')+(s.k&&S.lvl<3?'. '+s.k:''))}</div></div></div>
  <div class="snav"><button class="btn ghost sm" id="sp" ${i==0?'disabled':''}>→ السابقة</button><div class="dots">${sl.map((x,k)=>`<i class="${k==i?'on':''}" data-k="${k}"></i>`).join('')}</div><button class="btn sm" id="sn">${i<sl.length-1?'التالية ←':'إلى النشاط 🧪'}</button></div>`;
  $$('.flip').forEach(f=>f.onclick=()=>{f.classList.toggle('open');SND.flip()});
  $('#sp').onclick=()=>{i--;SND.whoosh();show()};
  $('#sn').onclick=()=>{if(i<sl.length-1){i++;SND.whoosh();show()}else go(`#/l/${id}/2`)};
  $$('.dots i').forEach(d=>d.onclick=()=>{i=+d.dataset.k;show()});
  if(s.fx)try{s.fx($('#svis'))}catch(e){console.error(e)}
 }

const GT={sort:['🗂️','صنّف'],match:['🔗','صِل'],memory:['🃏','الذاكرة'],catch:['🧺','التقط'],order:['🔢','رتّب'],bubbles:['🎈','الفقاعات'],fill:['✍️','أكمل'],tf:['⚡','صح أم خطأ'],label:['🏷️','سمِّ الأجزاء'],team:['🏆','تحدي الفرق']};
function gamesStep(st,id){const l=L[id];markStep(id,'games');

 st.innerHTML=stageTitle('🎮','ألعاب الدرس',`<span class="pill">${AR(gs.length)} ألعاب</span>`)+

 $$('.gcard').forEach(c=>c.onclick=()=>{SND.click();playGame(st,gs[+c.dataset.i],id,()=>gamesStep(st,id))});

function playGame(st,g,id,back){clean();
 st.innerHTML=`<div class="gbar"><h4>${(GT[g.type]||['🎲'])[0]} ${g.t}</h4><div class="gstat"><span id="gS">⭐ 0</span><span id="gM">❌ 0</span><button class="btn ghost sm" id="gBack">→ قائمة الألعاب</button></div></div>${g.i?`<div class="ginst">📌 ${g.i}</div>`:''}<div id="gBody"></div>`;
 $('#gBack').onclick=()=>{clean();back()};
 const api={sc:0,mi:0,set(){const a=$('#gS'),b=$('#gM');if(a)a.textContent='⭐ '+AR(api.sc);if(b)b.textContent='❌ '+AR(api.mi)},good(){api.sc++;api.set();SND.ok()},bad(){api.mi++;api.set();SND.bad()},
  end(extra){clean();const s=api.mi==0?3:api.mi<=2?2:1;SND.win();if(s==3)confetti();
   $('#gBody').innerHTML=`<div class="res"><div class="stars">${stars(s)}</div><h3>${s==3?'مذهل! بلا أخطاء 🏆':s==2?'أحسنت! 👏':'أنهيت اللعبة، جرّب مرة أخرى لتحصل على نجوم أكثر 💪'}</h3><p>${extra||`النقاط: ${AR(api.sc)} • الأخطاء: ${AR(api.mi)}`}</p><div class="row" style="justify-content:center"><button class="btn ghost" id="gR">🔄 العب مرة أخرى</button><button class="btn" id="gB2">لعبة أخرى 🎮</button></div></div>`;
   $('#gR').onclick=()=>playGame(st,g,id,back);$('#gB2').onclick=()=>{clean();back()}}};
 const f=GAMES[g.type];f($('#gBody'),g,api,id)}
function lvN(arr,a,b,c){return arr.slice(0,[a,b,c][S.lvl-1]||arr.length)}

const GAMES={
 sort(el,g,api){const items=shuffle(lvN(shuffle(g.items),6,9,99));let sel=null,left=items.length;
  el.innerHTML=`<div class="pool">${items.map((it,i)=>`<span class="chip" data-i="${i}">${it[2]?it[2]+' ':''}${it[0]}</span>`).join('')}</div>
  <div class="bins" style="grid-template-columns:repeat(${g.bins.length},1fr)">${g.bins.map((b,i)=>`<div class="bin" data-b="${i}"><h4><span>${b[1]||''}</span>${b[0]}</h4><div class="in"></div></div>`).join('')}</div><div class="drag-hint center mt" style="color:var(--mut)">اضغط البطاقة ثم اضغط المجموعة المناسبة</div>`;
  $$('.chip',el).forEach(c=>c.onclick=()=>{$$('.chip.sel',el).forEach(x=>x.classList.remove('sel'));c.classList.add('sel');sel=c;SND.click();$$('.bin',el).forEach(b=>b.classList.add('hot'))});
  $$('.bin',el).forEach(b=>b.onclick=()=>{if(!sel)return;const it=items[+sel.dataset.i];$$('.bin',el).forEach(x=>x.classList.remove('hot'));
   if(it[1]==+b.dataset.b){api.good();const cp=document.createElement('span');cp.className='chip good';cp.innerHTML=sel.innerHTML;$('.in',b).appendChild(cp);sel.classList.add('done');sel.classList.remove('sel');sel=null;if(--left==0)after(()=>api.end(),600)}

V.lines=(xs,series,o={})=>{const W=o.W||440,H=o.H||250,pl=46,pb=40,pt=16,pr=14;const mn=o.min==null?0:o.min,mx=o.max||Math.max(...series.flatMap(s=>s.v.filter(v=>v!=null)))*1.1||1;const xm=o.xmax||xs[xs.length-1]||1,x0=o.xmin||0;

 for(let v=Math.ceil(mn/st)*st;v<=mx;v+=st){s+=`<line x1="${pl}" y1="${Y(v)}" x2="${W-pr}" y2="${Y(v)}" stroke="#e3eaf4"/><text x="${pl-6}" y="${Y(v)+4}" text-anchor="end">${v}</text>`}

 s+=`<line x1="${pl}" y1="${pt-6}" x2="${pl}" y2="${H-pb}" stroke="#1d2945" stroke-width="2"/><line x1="${pl}" y1="${H-pb}" x2="${W-pr}" y2="${H-pb}" stroke="#1d2945" stroke-width="2"/>`;
 if(o.xl)s+=`<text x="${(W+pl)/2}" y="${H-6}" text-anchor="middle">${o.xl}</text>`;if(o.yl)s+=`<text x="12" y="${(H-pb)/2}" transform="rotate(-90 12 ${(H-pb)/2})" text-anchor="middle">${o.yl}</text>`;

 ['🥫 استقصاء الظروف الملائمة',c=>{const J=[{w:1,h:1,l:1},{w:1,h:0,l:1},{w:0,h:1,l:1},{w:0,h:0,l:1}];let day=0,run=null;const rec={};
  const model=(j,d)=>j.w&&j.h?[0,0,2,4,5,5,5,5,5][d]:j.w&&!j.h?[0,0,0,0,0,1,1,2,2][d]:0;
  const sc=lay(c,`<div class="ctl"><div class="lb">جهّز العلب الأربع (اضغط لتغيير الظرف)</div><div id="jc" style="display:grid;grid-template-columns:1fr 1fr;gap:8px"></div><button class="btn ghost sm mt" id="bk">📘 إعداد الكتاب</button></div>
  <div class="row"><button class="btn" id="go">▶ راقب 8 أيام</button><span class="pill" id="dy">اليوم ٠</span></div><div id="tb"></div>`);
  function jarsSVG(){return `<svg viewBox="0 0 420 210" width="420">${J.map((j,i)=>{const x=20+(3-i)*100,n=model(j,day);return `<g transform="translate(${x} 20)"><rect x="0" y="40" width="80" height="120" rx="10" fill="${j.w?'#7a5236':'#caa77c'}" stroke="#5c6886" stroke-width="3"/><rect x="-4" y="30" width="88" height="14" rx="5" fill="#c9d3e3"/>${[0,1,2,3,4].map(k=>{const sx=12+k*14,sy=90+(k%2)*30,sp=k<n;return `<ellipse cx="${sx}" cy="${sy}" rx="5" ry="6" fill="#f7e2a0" stroke="#b58a3a"/>${sp?`<path d="M${sx} ${sy+5} q-2 10 1 16" stroke="#f3ead0" stroke-width="3" fill="none"/><path d="M${sx} ${sy-5} q2 -12 -2 -22" stroke="#62c05a" stroke-width="3" fill="none"/>`:''}`}).join('')}
   <text x="40" y="22" text-anchor="middle" font-size="22">${j.h?'☀️':'❄️'}${j.l?'':'🌑'}</text><text x="40" y="182" text-anchor="middle" font-weight="900" font-size="18">${i+1}</text><text x="40" y="200" text-anchor="middle" font-size="12" font-weight="800">${j.w?'رطبة':'جافة'} • ${j.h?'دافئ':'بارد'}</text></g>`}).join('')}</svg>`}
  function drawJ(){$('#jc').innerHTML=J.map((j,i)=>`<div style="background:#fff;border-radius:12px;padding:8px;border:2px solid var(--line)"><b>علبة ${AR(i+1)}</b><div class="tgl" style="margin-top:6px"><button data-i="${i}" data-k="w" class="${j.w?'on':''}">💧 ${j.w?'رطبة':'جافة'}</button><button data-i="${i}" data-k="h" class="${j.h?'on':''}">🌡️ ${j.h?'دافئ':'بارد'}</button><button data-i="${i}" data-k="l" class="${j.l?'on':''}">💡 ${j.l?'ضوء':'ظلام'}</button></div></div>`).join('');
   $$('#jc button').forEach(b=>b.onclick=()=>{if(run)return;const j=J[+b.dataset.i];j[b.dataset.k]=j[b.dataset.k]?0:1;day=0;Object.keys(rec).forEach(k=>delete rec[k]);SND.click();drawJ();sc.innerHTML=jarsSVG();table()})}
  function table(){const ds=[2,4,6,8];$('#tb').innerHTML=tbl(['اليوم',...J.map((j,i)=>'علبة '+AR(i+1))],ds.map(d=>[AR(d),...J.map((j,i)=>rec[d]?AR(rec[d][i]):'—')]))}
  $('#bk').onclick=()=>{J.splice(0,4,{w:1,h:1,l:1},{w:1,h:0,l:1},{w:0,h:1,l:1},{w:0,h:0,l:1});day=0;Object.keys(rec).forEach(k=>delete rec[k]);drawJ();sc.innerHTML=jarsSVG();table();SND.click()};
  $('#go').onclick=()=>{if(run)return;day=0;Object.keys(rec).forEach(k=>delete rec[k]);run=every(()=>{day++;$('#dy').textContent='اليوم '+AR(day);sc.innerHTML=jarsSVG();if(day%2==0){rec[day]=J.map(j=>model(j,day));table();SND.pop()}
   if(day>=8){clearInterval(run);run=null;SND.win();const best=J.map((j,i)=>[model(j,8),i]).sort((a,b)=>b[0]-a[0])[0];
    $('#tb').insertAdjacentHTML('beforeend',`<div class="note g mt">🔎 أفضل إنبات في العلبة ${AR(best[1]+1)}. البذور تحتاج إلى <b>الماء والدفء</b> لتنبت، أما الجافة فلا تنبت أبدًا، والباردة تنبت ببطء شديد. ولاحظ أن <b>الضوء أو الظلام لا يغيّر النتيجة</b>!</div>`)}},650)};
  drawJ();sc.innerHTML=jarsSVG();table()}],
 ['🎈 هل تحتاج إلى هواء؟',c=>{let st=0;const sc=lay(c,`<div class="note">نشاط ١-٣ (أ): طبقان في كل منهما 10 بذور على مناشف رطبة، وضعنا كل طبق في كيس. سنسحب الهواء من أحد الكيسين بالماصة.</div><div class="row"><button class="btn" id="suck">🥤 اسحب الهواء من الكيس (أ)</button><button class="btn sun" id="wait" disabled>⏳ اتركهما يومين في مكان دافئ</button></div><div id="ar"></div>`);

   sc.innerHTML=`<svg viewBox="0 0 440 250" width="440">${bag(230,1,st==2?8:0)}${bag(10,st==0,st==2?(st==0?8:0):0)}</svg>`}

  $('#wait').onclick=()=>{st=2;SND.grow();d();$('#wait').disabled=true;$('#ar').innerHTML=`<div class="note g">🔎 في الكيس (ب) نبتت معظم البذور، أما في الكيس (أ) الذي سُحب منه الهواء فلم تنبت. <b>البذور تحتاج إلى الهواء لتنبت.</b></div>`};d()}],

  ['ما أفضل ظروف يمكن توفيرها للبذرة لتنبت؟',['ماء ودفء وهواء','ظلام وبرودة','ضوء وتربة جافة'],'تحتاج البذور إلى ماء، ودفء، وهواء لكي تنبت.'],

LABS.factors=(el)=>tabs(el,[
 ['🧪 مختبر عوامل النمو',c=>{const F={w:1,l:1,h:1,a:1};const N={w:['💧','الماء'],l:['☀️','الضوء'],h:['🌡️','الدفء'],a:['💨','الهواء']};let run=null;
  const sc=lay(c,`<div class="ctl"><div class="lb">وفّر للنبات العوامل التي تريدها:</div><div class="tgl" id="fx"></div></div><div class="row"><button class="btn" id="go">▶ راقب النبات أسبوعين</button><span class="pill" id="dy">اليوم ٠</span></div><div class="note" id="rs">اختر العوامل ثم اضغط «راقب».</div>`);
  function target(){if(!F.a)return{h:.18,wilt:.95,msg:'بدون هواء لا يستطيع النبات أن يعيش؛ فالنبات كائن حي يحتاج إلى الهواء، وبدونه يموت.'};if(!F.w)return{h:.3,wilt:1,msg:'بدون ماء جفّ النبات وذبل وأصبح بنيّ اللون؛ فالماء يجعل الساق قوية والأوراق ثابتة وينقل الغذاء.'};
   if(!F.h)return{h:.28,wilt:.25,leaves:3,msg:'في المكان البارد جدًا نما النبات ببطء شديد؛ فمعظم النباتات تنمو أفضل في مكان دافئ.'};if(!F.l)return{h:.62,wilt:.35,thin:1,msg:'بدون ضوء أصبح الساق نحيفًا والأوراق شاحبة وضعيفة؛ فالنبات يحتاج الطاقة الضوئية ليصنع غذاءه.'};
   return{h:.9,wilt:0,fl:3,msg:'🌟 نما النبات بصحة ممتازة! لقد وفّرت له كل العوامل: الماء والضوء والدفء والهواء.'}}
  function fx(){$('#fx').innerHTML=Object.keys(F).map(k=>`<button data-k="${k}" class="${F[k]?'on':''}">${N[k][0]} ${N[k][1]} ${F[k]?'✓':'✗'}</button>`).join('');$$('#fx button').forEach(b=>b.onclick=()=>{if(run)return;F[b.dataset.k]^=1;SND.click();fx();sc.innerHTML=V.plant({h:.15,leaves:2})})}
  $('#go').onclick=()=>{if(run)return;const T=target();let d=0;run=every(()=>{d++;const t=d/14;$('#dy').textContent='اليوم '+AR(d);sc.innerHTML=`<div class="center">${F.l?'<div style="font-size:34px">☀️</div>':'<div style="font-size:34px">🌑</div>'}${V.plant({h:.15+(T.h-.15)*t,wilt:T.wilt*t,thin:T.thin&&t>.3,leaves:T.leaves,fl:t>.85?T.fl:0})}</div>`;if(d%3==0)SND.grow();
   if(d>=14){clearInterval(run);run=null;$('#rs').className='note '+(T.wilt==0?'g':'r');$('#rs').innerHTML=T.msg;SND[T.wilt==0?'win':'bad']()}},380)};
  fx();sc.innerHTML=V.plant({h:.15,leaves:2})}],
 ['📊 ارسم التمثيل البياني',c=>{const D=[['عبدالله',25,'مكان مشمس + ري'],['محمد',18,'مكان ظليل + ري'],['سعيد',6,'مشمس بدون ري'],['طارق',14,'تحت السرير (ظلام)']];const val=[0,0,0,0];let pred=0,unl=false;
  c.innerHTML=`<div class="lab"><div><div class="scene" id="ch" style="min-height:280px"></div></div><div class="panel"><div>${tbl(['الاسم','كيف بدا النبات','طول النبات (cm)'],[['عبدالله','أخضر وصحي','25'],['محمد','أخضر فاتح وصحي إلى حدٍّ ما','18'],['سعيد','جاف وبنّي','6'],['طارق','نحيف وضعيف','14']])}</div>

   if(!unl&&val.every((v,k)=>v==D[k][1])){unl=true;SND.win();$('#cm').className='note g';$('#cm').innerHTML='✅ رسمت التمثيل البياني بشكل صحيح! نبات عبدالله نما بأفضل حال، ونبات سعيد بأسوأ حال.';
    $('#pr').innerHTML=`<div class="ctl"><label>تنبّأ: طول نبات في بيت زجاجي يحصل على القدر الكافي من الماء <b id="pv">0</b></label><input type="range" min="0" max="40" value="0" id="pi"></div><div class="note hide" id="pn"></div>`;
    $('#pi').oninput=()=>{pred=+$('#pi').value;$('#pv').textContent=pred;draw();const n=$('#pn');n.classList.remove('hide');n.className='note '+(pred>=25?'g':'');n.innerHTML=pred>=25?'✅ تنبؤ منطقي: البيت الزجاجي يوفر الدفء والضوء، ومع الماء الكافي سيكون أطول من نبات عبدالله أو مثله.':'🤔 فكّر مرة أخرى: البيت الزجاجي دافئ ومضيء، والماء كافٍ. هل سيكون أقصر من نبات عبدالله؟'}}})

LABS.pollination=(el)=>tabs(el,[
 ['🐝 التلقيح بالحشرات',c=>{let st=0;const sc=lay(c,`<div class="note" id="nt">١) اضغط على <b>الزهرة الأولى</b> لتطير النحلة إليها وتتغذى على الرحيق.</div><div class="row"><button class="btn sun hide" id="nx">ماذا يحدث بعد ذلك؟ ←</button><button class="btn ghost sm" id="rs">🔄 من البداية</button></div><div class="note b">📖 ﴿وَأَوْحَىٰ رَبُّكَ إِلَى النَّحْلِ...﴾ النحل يتغذى على رحيق الأزهار، وينقل حبوب اللقاح أثناء ذلك.</div>`);
  function scene(){sc.innerHTML=`<div id="pst" style="position:relative;width:100%;aspect-ratio:1.5;max-width:540px"><div data-f="1" style="position:absolute;right:6%;top:18%;width:40%;cursor:pointer">${V.flowerAnat().replace('id="fA"','id="f1"')}</div><div data-f="2" style="position:absolute;left:6%;top:18%;width:40%;cursor:pointer">${V.flowerAnat().replace('id="fA"','id="f2"')}</div><div id="bee" style="position:absolute;left:44%;top:0;font-size:46px;transition:all 1.6s ease-in-out;z-index:3">🐝<span id="pol" style="position:absolute;left:10px;top:30px;font-size:14px;opacity:0">🟡🟡</span></div><div id="pt" style="position:absolute;left:6%;top:18%;width:40%;pointer-events:none"></div></div>`;
   $$('[data-f]',sc).forEach(f=>f.onclick=()=>fly(+f.dataset.f))}
  function fly(n){const bee=$('#bee');if(n==1&&st==0){SND.buzz();bee.style.left='70%';bee.style.top='20%';after(()=>{st=1;SND.ok();$('#pol').style.opacity=1;$('#nt').innerHTML='٢) تغذّت النحلة على الرحيق، والتصقت بجسمها <b>حبوب اللقاح</b> من المتك 🟡. اضغط الآن على <b>الزهرة الثانية</b> من النوع نفسه.'},1700)}
   else if(n==2&&st==1){SND.buzz();bee.style.left='18%';bee.style.top='20%';after(()=>{st=2;SND.win();$('#pol').style.opacity=.3;$('#pt').innerHTML=`<svg viewBox="0 0 400 380" width="100%"><circle cx="192" cy="106" r="6" fill="#ffd23f" stroke="#c9a000"/><circle cx="206" cy="110" r="6" fill="#ffd23f" stroke="#c9a000"/></svg>`;$('#nt').className='note g';$('#nt').innerHTML='✅ انتقلت حبوب اللقاح من <b>السداة</b> إلى <b>ميسم</b> زهرة من النفس النوع. هذه العملية اسمها <b>التلقيح</b>!';$('#nx').classList.remove('hide')},1700)}
   else if(st==0&&n==2){toast('ابدأ بالزهرة الأولى لتجمع النحلة حبوب اللقاح 🐝')}}
  $('#nx').onclick=()=>{$('#nx').classList.add('hide');let k=0;const pt=$('#pt');
   pt.innerHTML=`<svg viewBox="0 0 400 380" width="100%"><circle cx="200" cy="108" r="6" fill="#ffd23f"/><path d="M200 112 L200 250" stroke="#ffd23f" stroke-width="4" stroke-dasharray="140" stroke-dashoffset="140"><animate attributeName="stroke-dashoffset" from="140" to="0" dur="2s" fill="freeze"/></path></svg>`;
   $('#nt').innerHTML='٣) تنمو من حبة اللقاح أنبوبة عبر <b>القلم</b> حتى تصل إلى <b>البويضة</b> داخل المبيض...';SND.grow();
   after(()=>{$('#nt').innerHTML='٤) تتحد حبة اللقاح مع البويضة: هذه عملية <b>الإخصاب</b> ✨. بعدها تموت البتلات والأسدية، ويكبر المبيض ليكوّن الثمرة.';SND.ok();const f=$('[data-f="2"]');const seq=[1,2,3,4,5];const iv=every(()=>{if(k>=seq.length){clearInterval(iv);$('#nt').innerHTML+='<br>🍅 تكوّنت الثمرة وبداخلها البذور!';SND.win();return}f.innerHTML=V.fruitStages(seq[k++]);pt.innerHTML=''},1100)},2600)};
  $('#rs').onclick=()=>{st=0;$('#nt').className='note';$('#nt').innerHTML='١) اضغط على <b>الزهرة الأولى</b> لتطير النحلة إليها وتتغذى على الرحيق.';$('#nx').classList.add('hide');scene()};scene()}],
 ['🌾 التلقيح بالرياح',c=>{const sc=lay(c,`<div class="ctl"><label>قوة الرياح <b id="wv">6</b></label><input type="range" id="wr" min="1" max="10" value="6"></div><button class="btn" id="go">🌬️ هبّت الرياح</button><div id="nt"></div><div class="note b">الأزهار التي تُلقّح بالرياح <b>غير زاهية</b> الألوان، ولا تحتوي على بتلات أو رائحة، وتصنع <b>الكثير</b> من حبوب اللقاح الجافة الخفيفة.</div>`);
  sc.innerHTML=`<div style="width:100%"><canvas id="cv" width="520" height="300" style="width:100%;border-radius:16px;background:linear-gradient(#dff3ff,#f5fbff)"></canvas></div>`;
  const cv=$('#cv'),x=cv.getContext('2d');let P=[],land=0,tot=0,stop=null;
  function grass(gx,col){x.strokeStyle='#8aa04a';x.lineWidth=4;x.beginPath();x.moveTo(gx,300);x.lineTo(gx,120);x.stroke();for(let i=0;i<9;i++){x.fillStyle=col;x.beginPath();x.ellipse(gx+(i%2?9:-9),130+i*14,8,4,i%2?.4:-.4,0,7);x.fill()}}
  function frame(dt){x.clearRect(0,0,520,300);grass(430,'#b8c47a');grass(110,'#b8c47a');x.fillStyle='#e05c9a';x.beginPath();x.arc(110,122,9,0,7);x.fill();x.fillStyle='#1d2945';x.font='bold 14px Tajawal';x.fillText('ميسم زهرة أخرى',60,100);
   const w=+$('#wr').value;P.forEach(p=>{if(p.dn)return;p.x-=w*18*dt*(.6+Math.random()*.8);p.y+=Math.sin(p.x/20+p.ph)*1.2+12*dt;if(Math.hypot(p.x-110,p.y-122)<14){p.dn=1;land++;SND.star()}if(p.x<-5||p.y>300)p.dn=2;x.fillStyle='#e8c63a';x.beginPath();x.arc(p.x,p.y,2.4,0,7);x.fill()});
   x.fillStyle='#1d2945';x.font='bold 16px Tajawal';x.fillText(`حبوب لقاح منطلقة: ${tot} • وصلت إلى الميسم: ${land}`,150,24);if(P.length&&P.every(p=>p.dn)){$('#nt').innerHTML=`<div class="note g">🔎 من بين ${AR(tot)} حبة لقاح وصلت ${AR(land)} فقط إلى الميسم! لهذا تنتج الأزهار الملقحة بالرياح كميات هائلة من حبوب اللقاح.</div>`;return false}}

/* ---------- particle canvas helper ---------- */
function partSim(cv,o){const x=cv.getContext('2d'),W=cv.width,H=cv.height;const P=[];const n=o.n||70;let lvl=o.lvl||.55;let gone=0;
 const top=()=>H-20-(H-60)*lvl;
 for(let i=0;i<n;i++)P.push({x:rnd(40,W-40),y:rnd(top()+10,H-30),vx:rnd(-1,1),vy:rnd(-1,1),g:0});
 return {P,get gone(){return gone},set lvl(v){lvl=v},get lvl(){return lvl},step(dt,T){const sp=20+T*2.2;x.clearRect(0,0,W,H);
  x.fillStyle='#e9f6ff';x.fillRect(30,top(),W-60,H-20-top());x.strokeStyle='#5c6886';x.lineWidth=5;x.beginPath();x.moveTo(30,20);x.lineTo(30,H-20);x.lineTo(W-30,H-20);x.lineTo(W-30,20);x.stroke();
  P.forEach(p=>{if(p.g){p.y-=40*dt;p.x+=Math.sin(p.y/15)*.8;if(p.y<-10)p.g=2;}else{const k=sp*(.6+Math.random()*.8);p.vx+=rnd(-1,1)*.5;p.vy+=rnd(-1,1)*.5;const m=Math.hypot(p.vx,p.vy)||1;p.x+=p.vx/m*k*dt;p.y+=p.vy/m*k*dt;
   if(p.x<40){p.x=40;p.vx*=-1}if(p.x>W-40){p.x=W-40;p.vx*=-1}if(p.y>H-30){p.y=H-30;p.vy*=-1}
   if(p.y<top()+6){if(T>20&&Math.random()<(T-20)/900*(o.rate||1)&&!o.noEsc){p.g=1;gone++;lvl=Math.max(.08,lvl-(o.drop||.004))}else{p.y=top()+6;p.vy=Math.abs(p.vy)}}}
   if(p.g==2)return;x.fillStyle=p.g?'rgba(120,180,240,.55)':'#3a8fd0';x.beginPath();x.arc(p.x,p.y,p.g?5:6,0,7);x.fill()});
  x.fillStyle='#1d2945';x.font='bold 15px Tajawal';x.textAlign='center';x.fillText('جزيئات تبخّرت: '+gone,W/2,16)}}}

  [1,'ما وظيفة غلاف البذرة؟',['يحمي البذرة','يصنع الغذاء','يمتص الضوء','يجذب الحشرات'],'غلاف البذرة غطاء خارجي يحمي البذرة.','🛡️'],
  [1,'كم بذرة تحتوي ثمرة الأفوكادو؟',['بذرة واحدة كبيرة','بذورًا كثيرة صغيرة','لا تحتوي على بذور','ثلاث بذور'],'تحتوي ثمرة الأفوكادو على بذرة واحدة كبيرة.','🥑'],
  [2,'ما فائدة مخزون الغذاء في البذرة؟',['يمدّ الجنين بالطاقة اللازمة للنمو','يجعل البذرة ملوّنة','يمنع وصول الماء','يثبّت البذرة في التربة'],'الجنين يعتمد على مخزون الغذاء حتى تظهر أوراقه.'],
  [2,'ما الندبة في بذرة الفول؟',['المكان الذي ترتبط فيه البذرة بالثمرة','جذر صغير','ورقة صغيرة','الغلاف الداخلي'],'الندبة علامة على جانب البذرة حيث كانت متصلة بالثمرة.','v:seedOut'],
  [2,'أيّ العبارات التالية صحيحة؟',['البذور حيّة وتنمو إلى نباتات جديدة','البذور ميتة لأنها لا تتحرك','البذور تنمو من الأوراق','كل الثمار تحتوي على بذرة واحدة'],'قد تبدو البذور ميتة، لكنها حيّة.'],
  [2,'ما الأداة المناسبة لرؤية أجزاء البذرة الصغيرة بوضوح؟',['العدسة المكبرة','المخبار المدرج','ميزان الحرارة','ساعة الإيقاف'],'العدسة المكبرة تكبّر التفاصيل الصغيرة.','🔍'],
  [3,'لماذا تنتج النباتات البذور؟',['لكي تتكاثر وتكوّن نباتات جديدة','لكي تزيّن الثمار','لكي تطعم الحيوانات فقط','لكي تصبح أثقل وزنًا'],'البذور وسيلة النبات للتكاثر.'],
  [3,'ماذا يحدث للجنين إذا لم تتوافر له الظروف المناسبة؟',['يبقى ساكنًا داخل البذرة دون أن ينمو','ينمو في الحال','يتحول إلى ثمرة','يتحوّل إلى غلاف'],'يمكن أن تبقى البذور سنوات حتى تتهيأ الظروف.'],
  [3,'لو أزلنا مخزون الغذاء من بذرة الفول، ماذا تتوقع؟',['لن يجد الجنين طاقة كافية ليبدأ النمو','ستنمو البذرة أسرع','سيصبح الغلاف أقوى','لن يتغير شيء'],'مخزون الغذاء هو مصدر طاقة الجنين في البداية.']]};

L['1-2']={t:'كيف تنمو البذور؟',e:'🌱',pg:18,words:['الإنبات','يذبل','يمتص'],goal:'أستطيع أن ألاحظ تأثير الماء على البذور وأصفه.',
 slides:[
  {h:'الإنبات',p:'<p>تنمو البذرة إذا كان الجنين حيًّا وتوافرت له الظروف الملائمة للنمو. عندما تبدأ البذرة في النمو نقول إنها <span class="kw">تنبُت</span>، وتُسمّى هذه العملية <span class="kw">الإنبات</span>.</p><p>تستخدم البذور مخزون الغذاء الموجود بداخلها ليمدها بالطاقة اللازمة للنمو.</p>',v:'v:germ|1',k:'الإنبات: عندما تبدأ البذرة في النمو.'},
  {h:'مراحل إنبات بذرة الفول (١)',p:'<ul><li>💧 <b>تمتص</b> البذرة الماء وتنتفخ.</li><li>🌰 ينفلق غلاف البذرة.</li><li>⬇️ يبدأ الجذر الأول في النمو.</li><li>🌱 ينمو الجذر إلى الأسفل في التربة.</li></ul>',v:'v:germ|1',fx:el=>{let s=0;every(()=>{s=s%4;el.innerHTML=V.germ([1,2,3,3][s]);s++},1300)},k:'الجذر هو أول جزء ينمو، ويتجه إلى الأسفل.'},
  {h:'مراحل إنبات بذرة الفول (٢)',p:'<ul><li>⬆️ يبدأ الساق الأول بالنمو.</li><li>🌿 ينمو الساق فوق الأرض.</li><li>🍃 تبدأ الأوراق الأولية بالنمو.</li><li>🌾 تنمو الجذور الجانبية.</li></ul><p>بعد الإنبات <span class="kw">تذبُل</span> البذرة ويصغر حجمها.</p>',v:'v:germ|4',fx:el=>{let s=4;every(()=>{s=s>=7?4:s+1;el.innerHTML=V.germ(s)},1300)},k:'بعد الجذر ينمو الساق إلى الأعلى، ثم تظهر الأوراق وتذبل البذرة.'},
  {h:'بذور تنتظر آلاف السنين!',p:'<p>يمكن أن تعيش البذور بدون إنبات لسنوات عديدة حتى تتهيأ لها الظروف. أقدم البذور التي تمكّن العلماء من استنباتها:</p>',v:()=>`<div class="center">${V.flowerSimple('#ff7eb6',8,170)}<div style="font-weight:800;margin-top:6px">ينمو نبات اللوتس في الماء</div></div>`,k:'البذور تبقى حيّة سنوات طويلة حتى تتوافر الظروف الملائمة.',
   f:[['🌸','بذرة لوتس','عمرها 1300 عام!'],['🌴','بذرة نخيل','عمرها 2000 عام!'],['❄️','زهرة قطبية','عمرها 30 ألف عام!']]}],
 lab:{k:'germ',t:'نشاط ١-٢: لاحظ إحدى البذور',n:'مختبر افتراضي'},
 games:[
  {type:'order',t:'رتّب مراحل إنبات بذرة الفول',i:'استخدم الأسهم ▲▼ لترتيب المراحل من الأولى إلى الأخيرة.',items:['💧 تمتص البذرة الماء وتنتفخ','🌰 ينفلق غلاف البذرة','🌱 يبدأ الجذر الأول في النمو','⬇️ ينمو الجذر إلى الأسفل في التربة','⬆️ يبدأ الساق الأول بالنمو','🌿 ينمو الساق فوق الأرض','🍃 تبدأ الأوراق الأولية بالنمو','🌾 تنمو الجذور الجانبية']},
  {type:'tf',t:'صح أم خطأ: الإنبات',items:[['تمتص البذرة الماء قبل أن تبدأ في الإنبات.',1],['الساق الأول هو أول جزء يخرج من البذرة.',0,'الجذر هو أول جزء ينمو.'],['ينمو الجذر إلى الأسفل في التربة.',1],['تكبر البذرة وتنتفخ بعد الإنبات بفترة طويلة.',0,'بعد الإنبات تذبل البذرة ويصغر حجمها.'],['تحصل البذرة على طاقة الإنبات من مخزون الغذاء.',1],['يمكن أن تعيش بعض البذور سنوات عديدة دون إنبات.',1],['تبدأ الأوراق الأولية بالنمو تحت التربة.',0,'الأوراق تنمو فوق الأرض.'],['«يذبل» تعني يصبح صغيرًا وجافًا.',1],['الإنبات يعني أن تتحوّل الزهرة إلى ثمرة.',0,'الإنبات: عندما تبدأ البذرة في النمو.'],['استنبت العلماء بذرة نخيل عمرها 2000 عام.',1]]}],
 learned:['تبدأ البذور في الإنبات إذا كانت الظروف مهيأةً والجنين حيًّا.','تحصل البذور على الطاقة اللازمة للإنبات من مخزون الغذاء الموجود داخلها.','تمتص البذور الماء لتبدأ عملية الإنبات.','في البداية ينمو الجذر الأول متجهًا إلى الأسفل، ويتبعه الساق الأول حيث ينمو متجهًا إلى الأعلى.'],
 talk:['هل تنمو النباتات الجديدة من البذور فقط؟','لا؛ فبعض النباتات تنمو من أجزاء أخرى: البطاطس من الدرنات، والبصل من الأبصال، والورد من العُقَل (قطع من الساق)، وفسائل النخيل تنمو بجوار النخلة الأم.'],
 chal:['لماذا ينمو الجذر أولًا قبل الساق؟','ليثبّت النبات الصغير في التربة، ويبدأ امتصاص الماء بسرعة، فيحصل الساق والأوراق على ما يحتاجانه للنمو.'],
 q:[[1,'ماذا نسمّي العملية التي تبدأ فيها البذرة بالنمو؟',['الإنبات','التبخر','التلقيح','الذبول'],'الإنبات: عندما تبدأ البذرة في النمو.','🌱'],
  [1,'ما أول شيء تفعله البذرة عند بدء الإنبات؟',['تمتص الماء وتنتفخ','تُنتج الأزهار','تُكوّن الثمار','تُسقط أوراقها'],'امتصاص الماء أول خطوة في الإنبات.','💧'],
  [1,'أيّ جزء ينمو أولًا من البذرة؟',['الجذر','الأوراق','الزهرة','الساق'],'الجذر الأول ينمو أولًا متجهًا إلى الأسفل.','v:germ|3'],
  [1,'إلى أين ينمو الساق الأول؟',['إلى الأعلى','إلى الأسفل','إلى داخل البذرة','لا ينمو أبدًا'],'الساق ينمو إلى الأعلى نحو الضوء.','v:germ|5'],
  [2,'من أين تحصل البذرة على الطاقة اللازمة للإنبات؟',['من مخزون الغذاء بداخلها','من ضوء الشمس','من الأزهار','من الحشرات'],'البذرة تستخدم مخزون الغذاء الموجود داخلها.'],
  [2,'ما معنى كلمة «يذبل»؟',['يصبح صغيرًا وجافًا','يمتص الماء','ينمو إلى الأعلى','يتحوّل إلى غاز'],'بعد الإنبات تذبل البذرة.'],
  [2,'لماذا تذبل البذرة ويصغر حجمها بعد الإنبات؟',['لأن النبات الصغير استهلك مخزون الغذاء','لأنها تمتص الماء','لأن الأوراق تأكلها','لأنها تتجمد'],'استُهلك مخزون الغذاء لإمداد النبات بالطاقة.','v:germ|7'],
  [2,'ماذا يحدث لغلاف البذرة بعد انتفاخها بالماء؟',['ينفلق (يتشقق)','يصبح أقسى','يتحوّل إلى ورقة','يزداد لونه غمقًا فقط'],'ينفلق الغلاف فيخرج الجذر.'],
  [3,'رتّب: (١) ينمو الساق فوق الأرض (٢) يبدأ الجذر الأول (٣) تمتص البذرة الماء. الترتيب الصحيح:',['٣ ثم ٢ ثم ١','١ ثم ٢ ثم ٣','٢ ثم ٣ ثم ١','٣ ثم ١ ثم ٢'],'الماء أولًا، ثم الجذر، ثم الساق.'],
  [3,'نبتت بذرة زهرة قطبية عمرها 30 ألف عام. ماذا يدل ذلك؟',['أن الجنين يمكن أن يبقى حيًّا سنوات طويلة حتى تتهيأ الظروف','أن البذور لا تحتاج إلى ماء','أن الإنبات يحدث في الجليد فقط','أن البذور القديمة أسرع نموًا'],'البذور تنتظر الظروف الملائمة.'],
  [3,'نقع أحمد بذرة فول ليلة كاملة فأصبحت أكبر وغلافها مجعّد. ما التفسير العلمي؟',['امتصت البذرة الماء فانتفخت','نمت البذرة وأصبحت نباتًا','دخل الهواء إلى البذرة','ذاب غلاف البذرة'],'امتصاص الماء يجعل البذرة تنتفخ.']]};

L['1-3']={t:'استقصاء عملية الإنبات',e:'🔬',pg:20,words:[],goal:'أستطيع أن أخطّط وأكمل استقصاءً يوضّح ما تحتاجه البذور لكي تنبت.',
 slides:[
  {h:'ماذا تحتاج البذور كي تنبت؟',p:'<p>تنمو البذور عندما تتهيأ لها الظروف الملائمة. تساءلت الطالبات:</p><ul><li>💭 هل يمكن أن تنبت البذور بدون ماء أو ضوء؟</li><li>💭 هل تنبت البذور إذا كانت في جو حار جدًا أو بارد جدًا؟</li></ul>',v:V.row('💧','🌡️','💨','💡'),k:'نصمّم استقصاءً لنعرف الظروف الملائمة للإنبات.'},
  {h:'الاختبار العادل',p:'<p>في الاختبار العادل نغيّر <span class="kw">عاملًا واحدًا</span> فقط، ونثبّت جميع العوامل الأخرى: نوع البذور وعددها، وكمية التربة، وحجم العلب.</p><p>العلب ١ و٢ رطبة، و٣ و٤ جافة. العلب ١ و٣ في مكان دافئ، و٢ و٤ في مكان بارد.</p>',v:'v:jars',k:'نغيّر شيئًا واحدًا فقط ونثبّت الباقي.',x:'استخدام عدد أكبر من البذور (40 بدلًا من 20) يجعل النتائج أكثر موثوقية؛ لأن بعض البذور قد لا تنبت مهما كانت الظروف.'},
  {h:'هل تحتاج البذور إلى الهواء؟',p:'<p>نضع 10 بذور على منشفة ورقية رطبة في طبقين، ونضع كل طبق في كيس. نستخدم الماصّة لشفط الهواء من أحد الكيسين، ونترك الآخر والهواء بداخله، ثم نتركهما يومين في مكان دافئ.</p><p>🔎 البذور في الكيس الذي به هواء نبتت بشكل أفضل.</p>',v:V.row('🎈','🌱','<span style="font-size:36px">✔</span>'),k:'البذور تحتاج إلى الهواء لكي تنبت.'},
  {h:'النتائج والاستنتاج',p:'<p>تنبت البذور عندما تتوافر لها الظروف الملائمة: <b>الماء</b> و<b>الدفء</b> و<b>الهواء</b>.</p><p>ولا تحتاج البذور إلى <b>الضوء</b> لكي تنبت؛ فهي تنبت تحت التربة في الظلام!</p>',v:V.row('💧','<span style="font-size:30px">+</span>','🌡️','<span style="font-size:30px">+</span>','💨','<span style="font-size:30px">=</span>','🌱'),k:'البذور تحتاج إلى الماء والدفء والهواء، ولا تحتاج إلى الضوء لتنبت.'}],
 lab:{k:'germExp',t:'نشاط ١-٣: استقصاء الظروف الملائمة للإنبات',n:'مختبر افتراضي'},
 games:[
  {type:'catch',t:'التقط ما تحتاجه البذور',i:'حرّك السلة لتلتقط فقط ما تحتاجه البذور لكي تنبت.',prompt:'🌰 التقط ما تحتاجه البذرة لتنبت',basket:'البذرة',good:['💧 ماء','🌡️ دفء','💨 هواء','💦 رطوبة','☀️ جو دافئ'],bad:['🧊 برودة شديدة','🏜️ تربة جافة','🧂 ملح','🔥 حرارة شديدة','🚫 بدون هواء']},
  {type:'fill',t:'أكمل الاستنتاج',i:'اضغط الكلمة المناسبة للفراغ المضيء.',text:'تنبت البذور عندما تتوافر لها الظروف {الملائمة}. تحتاج البذور إلى {ماء} و{دفء} و{هواء} لكي تنبت، ولا تحتاج إلى {ضوء}. في الاختبار {العادل} نغيّر عاملًا واحدًا فقط.',extra:['تربة','برودة','ملح']}],
 learned:['تنبت البذور عندما تتوافر لها الظروف الملائمة.','تحتاج البذور إلى ماءٍ، ودفءٍ، وهواءٍ لكي تنبت.','لا تحتاج البذور إلى ضوءٍ لكي تنبت.'],
 talk:['لماذا تنبت معظم البذور في فصل الربيع؟','لأن الربيع يأتي بعد الأمطار والرطوبة، ويصبح الجو دافئًا؛ فتتوافر للبذور الظروف الملائمة: الماء والدفء والهواء.'],
 chal:['خطّط لاستقصاء تختبر فيه: هل تحتاج البذور إلى الضوء من أجل الإنبات؟','ضع 10 بذور على منشفة رطبة في طبقين متماثلين في المكان الدافئ نفسه، غطِّ أحدهما بصندوق مظلم واترك الآخر في الضوء، ثم قارن عدد البذور النابتة بعد أيام. (غيّر الضوء فقط!)'],
 q:[[1,'ما الذي تحتاجه البذور لكي تنبت؟',['الماء والدفء والهواء','الضوء فقط','الظلام والبرودة','التربة الجافة'],'هذه هي الظروف الملائمة للإنبات.','🌱'],
  [1,'هل تحتاج البذور إلى الضوء لكي تنبت؟',['لا','نعم، دائمًا','فقط في الليل','فقط في الشتاء'],'البذور تنبت في الظلام تحت التربة.','💡'],
  [1,'في أيّ علبة تنبت البذور أفضل؟',['تربة رطبة في مكان دافئ','تربة جافة في مكان بارد','تربة جافة في مكان دافئ','تربة رطبة في مكان متجمد'],'الماء والدفء معًا ضروريان.','🌡️💧'],
  [1,'ماذا يحدث للبذور في التربة الجافة تمامًا؟',['لا تنبت','تنبت بسرعة','تتحوّل إلى أزهار','تنبت في الظلام فقط'],'بدون ماء لا يحدث إنبات.','🏜️'],
  [2,'ما المقصود بالاختبار العادل؟',['تغيير عامل واحد فقط وتثبيت باقي العوامل','تغيير كل العوامل معًا','عدم تغيير أي شيء','إجراء التجربة مرة واحدة سريعة'],'هكذا نعرف أثر العامل الذي غيّرناه.','⚖️'],
  [2,'سحبت مريم الهواء من كيس فيه بذور رطبة. ماذا تتوقع؟',['لن تنبت البذور جيدًا','ستنبت أسرع','ستتحوّل إلى ثمار','ستصبح أكبر حجمًا'],'البذور تحتاج إلى الهواء لتنبت.','🎈'],
  [2,'لماذا نفحص التربة الرطبة كل يوم أثناء الاستقصاء؟',['لنتأكد من أنها لم تجف','لنعدّ الأوراق','لنقيس الضوء','لنغيّر البذور'],'يجب أن تبقى رطبة طوال الاستقصاء.'],
  [2,'في استقصاء العلب الأربع، ما العامل الذي يختلف بين العلبة 1 والعلبة 3؟',['الماء (رطبة وجافة)','الدفء','نوع البذور','حجم العلبة'],'العلبتان في مكان دافئ؛ الأولى رطبة والثالثة جافة.','v:jars'],
  [3,'لماذا تكون النتائج أفضل عند استخدام 40 بذرة بدلًا من 20؟',['لأن بعض البذور قد لا تنبت، فالعدد الكبير يجعل النتائج موثوقة','لأن البذور تنبت أسرع في الزحام','لأنه يقلل الحاجة إلى الماء','لأن العلب ستكون أثقل'],'كلما زادت البذور قلّ أثر البذور الميتة.'],
  [3,'أرادت هند اختبار أثر الدفء على الإنبات. ما الذي يجب أن تغيّره؟',['مكان العلبة (دافئ أو بارد) فقط','كمية الماء والمكان معًا','نوع البذور','عدد البذور في كل علبة'],'تغيّر الدفء فقط لتكون التجربة عادلة.'],
  [3,'نبتت البذور في خزانة مظلمة دافئة وتربتها رطبة. ماذا تستنتج؟',['البذور لا تحتاج إلى الضوء لتنبت','البذور تحتاج إلى الظلام دائمًا','البذور لا تحتاج إلى الماء','الخزانة تنتج الضوء'],'الضوء ليس شرطًا للإنبات.']]};

L['1-4']={t:'ماذا يحتاج النبات كي ينمو؟',e:'🌿',pg:22,words:['العوامل'],goal:'أستطيع أن أصف الطرق المختلفة التي يمكن أن تتغيّر بها النباتات عندما يتم الاحتفاظ بها في الظلام.',

 lab:{k:'factors',t:'نشاط ١-٤: ارسم التمثيل البياني بالأعمدة لنمو النبات',n:'مختبر وتمثيل بياني'},
