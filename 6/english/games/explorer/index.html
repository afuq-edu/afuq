<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4FB0EE">
<title>Sky Words 6A | سماء الكلمات</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lalezar&family=Lilita+One&family=Readex+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: light;
  --sky1:#4FB0EE; --sky2:#9ED8FA; --sky3:#E6F6FF;
  --sun:#FFC93C; --sun2:#FFB21F;
  --ink:#16335E; --ink2:#46638F; --ink3:#8AA3C4;
  --paper:#FFFFFF; --paper2:#F4FAFF;
  --coral:#F2557A; --mint:#1FAF72; --mintbg:#DDF7EA; --coralbg:#FFE3EA;
  --hill1:#A6E27F; --hill2:#6CC75B; --hill3:#4DAE4A;
  --line:#D5E7F6;
  --air1:#E8434F; --air2:#2D5BD8;
  --shadow:0 10px 0 -4px rgba(22,51,94,.10), 0 18px 30px -18px rgba(22,51,94,.45);
  --r-lg:26px; --r-md:18px; --r-sm:12px;
  --fa:'Readex Pro', 'Segoe UI', Tahoma, system-ui, sans-serif;
  --fd:'Lalezar', 'Readex Pro', Tahoma, sans-serif;
  --fe:'Lilita One', 'Arial Rounded MT Bold', 'Trebuchet MS', system-ui, sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --sky1:#3F9FE0; --sky2:#8CCBF2; --sky3:#DDF0FC; --paper2:#EEF6FD; }
}
:root[data-theme="dark"]{ --sky1:#3F9FE0; --sky2:#8CCBF2; --sky3:#DDF0FC; --paper2:#EEF6FD; }
html{scroll-padding-top:env(safe-area-inset-top,0px); height:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0; min-height:100%; font-family:var(--fa); color:var(--ink); background:var(--sky2); -webkit-tap-highlight-color:transparent; overflow-x:hidden}
button{font:inherit; color:inherit; cursor:pointer; border:0; background:none; -webkit-user-select:none; user-select:none; touch-action:manipulation}
button:focus-visible, input:focus-visible, select:focus-visible{outline:3px solid var(--sun2); outline-offset:3px}
.en{direction:ltr; unicode-bidi:isolate}
mark{background:linear-gradient(transparent 55%, #FFE27A 55%); color:inherit; padding:0 .08em; border-radius:3px}

/* ---------- Sky backdrop ---------- */
.skybg{position:fixed; inset:0; z-index:0; overflow:hidden; pointer-events:none;
  background:linear-gradient(180deg,var(--sky1) 0%,var(--sky2) 52%,var(--sky3) 100%)}
.sun{position:absolute; top:calc(env(safe-area-inset-top,0px) + 22px); left:7vw; width:78px; height:78px; border-radius:50%;
  background:radial-gradient(circle at 38% 36%,#FFF1A8 0,#FFD447 42%,var(--sun2) 100%);
  box-shadow:0 0 0 14px rgba(255,214,71,.25),0 0 0 32px rgba(255,214,71,.12),0 0 80px 30px rgba(255,236,160,.55)}
.cloud{position:absolute; left:0; width:var(--w,160px); height:calc(var(--w,160px)*.34); background:#fff; border-radius:999px; opacity:var(--o,.92);
  animation:drift var(--t,90s) linear infinite; animation-delay:var(--dl,0s); filter:drop-shadow(0 6px 0 rgba(120,170,215,.18))}
.cloud::before{content:''; position:absolute; width:48%; height:150%; left:16%; bottom:28%; background:#fff; border-radius:50%}
.cloud::after{content:''; position:absolute; width:36%; height:115%; right:15%; bottom:32%; background:#fff; border-radius:50%}
@keyframes drift{from{transform:translateX(-35vw)} to{transform:translateX(135vw)}}
.hills{position:absolute; left:0; right:0; bottom:0; height:19vh; min-height:110px}
.hills svg{position:absolute; inset:0; width:100%; height:100%}
.palm{position:absolute; bottom:9vh; width:52px; height:86px}
.fort{position:absolute; bottom:10.5vh; width:92px; height:46px}

#view{position:relative; z-index:1; min-height:100vh; min-height:100dvh}
.wrap{max-width:1040px; margin:0 auto; padding:18px 16px 150px}

/* ---------- Skywriting ---------- */
.sw{font-family:var(--fe); color:#fff; direction:ltr; line-height:1.05; text-align:center; letter-spacing:.01em;
  text-shadow:0 3px 0 rgba(22,51,94,.22),0 0 22px rgba(255,255,255,.9)}
.sw .wd{display:inline-block; white-space:nowrap}
.sw .lt{display:inline-block; opacity:0}
.sw.go .lt{animation:smoke .85s cubic-bezier(.2,.8,.25,1) forwards; animation-delay:var(--d,0ms)}
.sw.done .lt{opacity:1; animation:none}
@keyframes smoke{
  0%{opacity:0; filter:blur(12px); transform:translateY(var(--y,0)) rotate(var(--r,0)) scale(1.7)}
  55%{opacity:.95; filter:blur(3px)}
  100%{opacity:1; filter:blur(0); transform:none}}
.plane{position:fixed; left:0; top:0; width:92px; height:46px; z-index:60; pointer-events:none; will-change:transform}
.plane .prop{transform-origin:116px 30px; animation:prop .12s linear infinite}
@keyframes prop{50%{transform:scaleY(.2)}}
.puff{position:fixed; width:22px; height:22px; margin:-11px 0 0 -11px; border-radius:50%; background:#fff; z-index:55; pointer-events:none;
  animation:puff 1.3s ease-out forwards}
@keyframes puff{from{opacity:.85; transform:scale(.5)} to{opacity:0; transform:scale(2.6)}}

/* ---------- Home ---------- */
.hero{text-align:center; padding:52px 8px 8px}
.hero h1{margin:0; font-size:clamp(46px,12vw,104px); min-height:1.1em}
.hero p{margin:14px auto 0; max-width:34ch; font-size:clamp(15px,3.8vw,19px); line-height:1.7; color:var(--ink); font-weight:500;
  background:rgba(255,255,255,.72); padding:8px 16px; border-radius:999px; backdrop-filter:blur(4px)}
.sem{margin-top:30px}
.sem-h{display:flex; align-items:center; gap:10px; justify-content:center; margin:0 0 6px; font-family:var(--fd); font-weight:400; font-size:22px; color:var(--ink)}
.sem-h b{font-family:var(--fe); font-weight:400; font-size:18px; background:var(--ink); color:#fff; padding:2px 10px 3px; border-radius:8px; direction:ltr}
.balloons{display:grid; grid-template-columns:repeat(3,1fr); gap:6px; max-width:720px; margin:0 auto}
.balloon{display:flex; flex-direction:column; align-items:center; padding:6px 2px 10px; border-radius:22px; transition:transform .2s}
.balloon:hover{transform:translateY(-4px)}
.balloon:active{transform:scale(.96)}
.balloon svg{width:min(104px,26vw); height:auto; animation:bob 5s ease-in-out infinite; animation-delay:var(--bd,0s); filter:drop-shadow(0 12px 10px rgba(22,51,94,.18))}
@keyframes bob{50%{transform:translateY(-9px) rotate(1.5deg)}}
.balloon .bl-en{font-family:var(--fe); font-size:clamp(14px,3.6vw,18px); color:var(--ink); direction:ltr; margin-top:2px; text-align:center; line-height:1.15}
.balloon .bl-ar{font-size:clamp(12px,3.2vw,14px); color:var(--ink2); font-weight:500; text-align:center}
.balloon .bl-st{font-size:12px; margin-top:3px; background:#fff; border-radius:999px; padding:1px 9px; color:var(--ink2); font-weight:600; box-shadow:0 2px 0 rgba(22,51,94,.08)}
.dock{display:grid; grid-template-columns:repeat(4,1fr); gap:10px; max-width:720px; margin:34px auto 0}
.dock button{background:#fff; border-radius:var(--r-md); padding:12px 4px 10px; display:flex; flex-direction:column; align-items:center; gap:4px; box-shadow:var(--shadow); font-weight:600; font-size:13px; color:var(--ink)}
.dock button .ic{font-size:26px; line-height:1}
.dock button:active{transform:translateY(2px)}
.credit{text-align:center; margin-top:26px; font-size:13px; color:var(--ink); font-weight:600; direction:ltr; opacity:.85}

/* ---------- Top bars ---------- */
.topbar{display:flex; align-items:center; gap:12px; margin-bottom:14px}
.back{width:46px; height:46px; flex:none; border-radius:50%; background:#fff; box-shadow:var(--shadow); display:grid; place-items:center; font-size:22px; color:var(--ink)}
.back svg{width:22px; height:22px}
.unit-head{display:flex; align-items:center; gap:12px; flex:1; min-width:0}
.unit-head .mini{width:52px; flex:none}
.unit-head h2{margin:0; font-family:var(--fe); font-weight:400; font-size:clamp(22px,5.6vw,32px); direction:ltr; text-align:right; line-height:1.05; color:var(--ink)}
.unit-head p{margin:2px 0 0; font-size:14px; color:var(--ink2); font-weight:500}
.pagetitle{margin:0; font-family:var(--fd); font-weight:400; font-size:28px}

/* ---------- Tabs ---------- */
.tabs{display:grid; grid-template-columns:repeat(4,1fr); background:rgba(255,255,255,.75); border-radius:999px; padding:5px; gap:4px; box-shadow:var(--shadow); position:sticky; top:calc(env(safe-area-inset-top,0px) + 8px); z-index:5; backdrop-filter:blur(8px)}
.tabs button{padding:10px 4px; border-radius:999px; font-weight:600; font-size:14px; color:var(--ink2); display:flex; gap:5px; justify-content:center; align-items:center}
.tabs button[aria-selected="true"]{background:var(--ud); color:#fff}
.panel{margin-top:18px}

/* ---------- Show list ---------- */
.shows{display:flex; flex-direction:column; gap:12px}
.show{display:flex; align-items:center; gap:14px; background:#fff; border-radius:var(--r-lg); padding:12px 14px; box-shadow:var(--shadow); text-align:right; width:100%}
.show .sic{width:56px; height:56px; flex:none; border-radius:50%; background:var(--paper2); display:grid; place-items:center; font-size:30px; border:3px solid var(--uf)}
.show .stx{flex:1; min-width:0}
.show .stx b{display:block; font-family:var(--fe); font-weight:400; font-size:19px; direction:ltr; text-align:right; color:var(--ink)}
.show .stx span{font-size:13.5px; color:var(--ink2); font-weight:500}
.show .play{width:48px; height:48px; flex:none; border-radius:50%; background:var(--ud); display:grid; place-items:center; color:#fff}
.show .play svg{width:20px; height:20px; margin-left:3px}
.show .seen{font-size:12px; color:var(--mint); font-weight:700}
.show.big{background:linear-gradient(135deg,#fff 0%,#FFF6D8 100%); border:2px solid var(--sun)}

/* ---------- Postcards ---------- */
.chips{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px}
.chip{background:#fff; border-radius:999px; padding:8px 14px; font-weight:600; font-size:14px; box-shadow:0 3px 0 rgba(22,51,94,.08); color:var(--ink2)}
.chip[aria-pressed="true"]{background:var(--ink); color:#fff}
.cards{display:grid; grid-template-columns:repeat(auto-fill,minmax(158px,1fr)); gap:14px}
.pc{perspective:900px; height:188px; text-align:inherit}
.pc-in{position:relative; width:100%; height:100%; transition:transform .55s cubic-bezier(.3,1.3,.5,1); transform-style:preserve-3d}
.pc.flip .pc-in{transform:rotateY(180deg)}
.pc-f,.pc-b{position:absolute; inset:0; backface-visibility:hidden; -webkit-backface-visibility:hidden; background:#fff; border-radius:14px; box-shadow:var(--shadow); overflow:hidden;
  padding:12px 12px 20px; display:flex; flex-direction:column}
.pc-f::after,.pc-b::after{content:''; position:absolute; left:0; right:0; bottom:0; height:9px;
  background:repeating-linear-gradient(135deg,var(--air1) 0 12px,#fff 12px 18px,var(--air2) 18px 30px,#fff 30px 36px)}
.pc-b{transform:rotateY(180deg); justify-content:center; gap:8px}
.stamp{align-self:flex-start; width:54px; height:60px; display:grid; place-items:center; font-size:32px; background:var(--paper2); border:3px dotted var(--uf); border-radius:6px; transform:rotate(-4deg)}
.pc-f .pw{margin-top:auto; font-family:var(--fe); font-size:21px; line-height:1.1; direction:ltr; text-align:left; color:var(--ink); word-break:break-word}
.pc-f .pa{font-size:14px; color:var(--ink2); font-weight:500; margin-top:4px}
.pc-b .ex{direction:ltr; text-align:left; font-size:15px; line-height:1.45; font-weight:500}
.pc-b .exa{font-size:13px; color:var(--ink2); line-height:1.6}
.pc .postmark{position:absolute; top:10px; left:12px; width:46px; height:46px; border:2px solid rgba(22,51,94,.18); border-radius:50%; display:grid; place-items:center; font-family:var(--fe); font-size:11px; color:rgba(22,51,94,.35); direction:ltr; transform:rotate(12deg)}
.cta{display:flex; align-items:center; justify-content:center; gap:10px; width:100%; margin-top:18px; padding:14px; border-radius:999px; background:var(--ud); color:#fff; font-weight:700; font-size:16px; box-shadow:0 6px 0 -1px rgba(22,51,94,.25)}
.cta:active{transform:translateY(3px); box-shadow:0 3px 0 -1px rgba(22,51,94,.25)}
.cta.alt{background:#fff; color:var(--ink); box-shadow:var(--shadow)}

/* ---------- Grammar sheets ---------- */
.gram{background:#fff; border-radius:var(--r-lg); box-shadow:var(--shadow); margin-bottom:14px; overflow:hidden}
.gram > button{display:flex; align-items:center; gap:12px; width:100%; padding:14px 16px; text-align:right}
.gram .gi{font-size:30px; width:50px; height:50px; display:grid; place-items:center; background:var(--paper2); border-radius:14px; flex:none}
.gram .gt{flex:1; min-width:0}
.gram .gt b{display:block; font-family:var(--fe); font-weight:400; font-size:19px; direction:ltr; text-align:right}
.gram .gt span{font-size:14px; color:var(--ink2)}
.gram .chev{transition:transform .3s; color:var(--ink3); font-size:22px}
.gram.open .chev{transform:rotate(180deg)}
.gbody{display:none; padding:0 16px 18px}
.gram.open .gbody{display:block}
.gbody h4{margin:16px 0 8px; font-size:14px; color:var(--ud); font-weight:700}
.gbody ul{margin:0; padding:0 18px 0 0; line-height:1.9; font-size:15px}
.gbody ul li::marker{color:var(--ud)}
.frow{display:flex; align-items:center; gap:10px; margin:8px 0; flex-wrap:wrap}
.frow .fl{font-size:12.5px; color:var(--ink2); width:100%; font-weight:600}
.fblocks{display:flex; gap:6px; flex-wrap:wrap; direction:ltr}
.fb{font-family:var(--fe); font-size:16px; padding:6px 12px 7px; border-radius:12px; background:#E4F3FF; color:var(--ink); box-shadow:0 3px 0 rgba(22,51,94,.12)}
.fb.a{background:var(--uf); color:var(--ink)}
.fb.v{background:#C9F2DC}
.fb.r{background:#FFF0BF}
.fb.x{background:transparent; box-shadow:none; color:var(--coral); font-size:20px; padding:4px 2px}
.exl{list-style:none; padding:0!important; margin:0}
.exl li{display:flex; gap:10px; align-items:flex-start; padding:9px 0; border-bottom:1px dashed var(--line)}
.exl li:last-child{border-bottom:0}
.exl .say{flex:none; width:34px; height:34px; border-radius:50%; background:var(--paper2); display:grid; place-items:center; font-size:16px}
.exl .t{flex:1}
.exl .t .en{display:block; text-align:left; font-weight:500; font-size:16px; line-height:1.5}
.exl .t .ar{display:block; font-size:13.5px; color:var(--ink2)}
.tip{margin-top:12px; background:#FFF8DC; border-radius:12px; padding:10px 12px; font-size:14px; line-height:1.7; border-inline-start:4px solid var(--sun)}

/* ---------- Game tiles ---------- */
.tiles{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:14px}
.tile{background:#fff; border-radius:var(--r-lg); padding:16px 12px 14px; box-shadow:var(--shadow); display:flex; flex-direction:column; align-items:center; gap:6px; text-align:center}
.tile .ti{font-size:40px; line-height:1}
.tile b{font-size:15px; font-weight:700}
.tile small{font-size:12.5px; color:var(--ink2); line-height:1.5}
.tile .stars{font-size:14px; letter-spacing:2px; min-height:18px}
.tile.wide{grid-column:1/-1; flex-direction:row; text-align:right; gap:14px; background:linear-gradient(135deg,#fff 0%,#FFF6D8 100%); border:2px solid var(--sun)}
.tile.wide .ti{font-size:46px}
.tile.wide div{flex:1}
.tile.wide b{display:block; font-size:17px}
.stars .off{opacity:.2; filter:grayscale(1)}

/* ---------- Game screen ---------- */
.gbar{display:flex; align-items:center; gap:12px; margin-bottom:10px}
.gbar .gtitle{flex:1; font-weight:700; font-size:17px}
.score{background:#fff; border-radius:999px; padding:8px 14px; font-weight:700; box-shadow:var(--shadow); font-size:15px; white-space:nowrap}
.route{position:relative; height:34px; margin:4px 8px 14px}
.route::before{content:''; position:absolute; left:0; right:0; top:50%; border-top:3px dashed rgba(255,255,255,.95)}
.route .rp{position:absolute; top:0; width:56px; height:28px; transition:right .6s cubic-bezier(.3,1.2,.5,1); transform:translateX(50%) scaleX(-1)}
.route .flag{position:absolute; left:-6px; top:2px; font-size:20px}
.teams{display:flex; gap:8px; justify-content:center; flex-wrap:wrap; margin-bottom:12px}
.team{background:#fff; border-radius:999px; padding:6px 12px; font-weight:700; font-size:14px; box-shadow:0 3px 0 rgba(22,51,94,.1); display:flex; gap:8px; align-items:center; border:3px solid transparent; transition:transform .25s}
.team i{width:12px; height:12px; border-radius:50%; background:var(--tc)}
.team.on{border-color:var(--tc); transform:scale(1.08)}
.turn{text-align:center; font-weight:700; margin:-4px 0 10px; font-size:15px}
.qcard{background:#fff; border-radius:var(--r-lg); box-shadow:var(--shadow); padding:22px 18px; text-align:center; position:relative}
.qcard .qe{font-size:62px; line-height:1.1}
.qcard .qa{font-family:var(--fd); font-size:clamp(26px,7vw,40px); line-height:1.3; margin-top:4px}
.qcard .qen{font-family:var(--fe); font-size:clamp(28px,8vw,48px); direction:ltr; line-height:1.1}
.qcard .qs{direction:ltr; font-size:clamp(19px,4.8vw,26px); font-weight:500; line-height:1.55}
.qcard .qs .gap{display:inline-block; min-width:90px; border-bottom:3px dashed var(--ink3); margin:0 4px; color:var(--mint); font-weight:700}
.qcard .qhint{font-size:14px; color:var(--ink2); margin-top:8px}
.qcard .hear{margin-top:12px; display:inline-flex; gap:8px; align-items:center; background:var(--paper2); border-radius:999px; padding:8px 16px; font-weight:600}
.big-hear{width:120px; height:120px; border-radius:50%; background:var(--sun); font-size:52px; display:grid; place-items:center; margin:6px auto; box-shadow:0 8px 0 -2px var(--sun2); animation:pulse 2s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.06)}}
.opts{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:16px}
.opts.one{grid-template-columns:1fr}
.opt{background:#fff; border-radius:var(--r-md); padding:16px 12px; font-size:18px; font-weight:600; box-shadow:var(--shadow); min-height:62px; line-height:1.35; transition:transform .15s, background .2s}
.opt.en{font-family:var(--fe); font-weight:400; font-size:21px}
.opt .oe{font-size:24px; margin-inline-end:6px}
.opt:active{transform:translateY(2px)}
.opt.ok{background:var(--mint); color:#fff}
.opt.no{background:var(--coral); color:#fff; animation:shake .4s}
.opt[disabled]{cursor:default}
@keyframes shake{25%{transform:translateX(-7px)} 75%{transform:translateX(7px)}}
.tf{display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-top:16px}
.tf .opt{font-size:22px; min-height:76px}
.fb-line{min-height:28px; text-align:center; margin-top:12px; font-weight:700; font-size:16px}
.fb-line.ok{color:var(--mint)} .fb-line.no{color:var(--coral)}
.fb-line .en{font-weight:600}

/* balloon pop */
.field{position:relative; height:min(58vh,480px); margin-top:12px; border-radius:var(--r-lg); overflow:hidden; background:linear-gradient(180deg,rgba(255,255,255,.1),rgba(255,255,255,.45)); border:2px dashed rgba(255,255,255,.9)}
.gb{position:absolute; bottom:-160px; width:24%; display:flex; flex-direction:column; align-items:center; animation:rise var(--rt,8s) linear forwards; animation-delay:var(--rd,0s)}
.gb svg{width:100%; max-width:120px; height:auto}
.gb span{position:absolute; top:22%; left:6%; right:6%; text-align:center; font-weight:700; font-size:clamp(12px,3.2vw,17px); line-height:1.15; direction:ltr; color:var(--ink); word-break:break-word}
@keyframes rise{from{transform:translateY(0) } to{transform:translateY(calc(-1 * min(58vh,480px) - 200px))}}
.gb.popped{animation:none!important; pointer-events:none}
.gb.popped svg, .gb.popped span{animation:popb .35s forwards}
@keyframes popb{to{transform:scale(1.8); opacity:0}}
.gb.hl svg{filter:drop-shadow(0 0 12px #fff) drop-shadow(0 0 4px var(--mint))}

/* spell */
.slots{display:flex; flex-wrap:wrap; gap:6px; justify-content:center; direction:ltr; margin-top:16px}
.slot{width:40px; height:48px; border-radius:10px; background:#fff; box-shadow:inset 0 -4px 0 rgba(22,51,94,.12); display:grid; place-items:center; font-family:var(--fe); font-size:24px; color:var(--ink)}
.slot.fix{background:transparent; box-shadow:none; width:14px}
.slot.filled{background:#E4F3FF}
.letters{display:flex; flex-wrap:wrap; gap:8px; justify-content:center; direction:ltr; margin-top:18px}
.ltile{width:48px; height:52px; border-radius:12px; background:var(--sun); font-family:var(--fe); font-size:25px; box-shadow:0 5px 0 var(--sun2); color:var(--ink)}
.ltile.used{visibility:hidden}
.slots.bad{animation:shake .4s}

/* order */
.ans{min-height:70px; background:rgba(255,255,255,.6); border:2px dashed #fff; border-radius:var(--r-md); padding:10px; display:flex; flex-wrap:wrap; gap:8px; direction:ltr; margin-top:14px; align-content:flex-start}
.pool{display:flex; flex-wrap:wrap; gap:8px; direction:ltr; justify-content:center; margin-top:14px}

.ans.good{border-color:var(--mint); background:var(--mintbg)}
.ans.bad{border-color:var(--coral); background:var(--coralbg); animation:shake .4s}

/* memory */
.mem{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-top:12px}

.mc{height:96px; perspective:700px}
.mc-in{position:relative; width:100%; height:100%; transition:transform .45s; transform-style:preserve-3d}
.mc.up .mc-in{transform:rotateY(180deg)}
.mc-f,.mc-b{position:absolute; inset:0; border-radius:16px; backface-visibility:hidden; -webkit-backface-visibility:hidden; display:grid; place-items:center; padding:6px; text-align:center}
.mc-f{background:linear-gradient(160deg,#fff 0 40%,#DDF1FF 40% 100%); box-shadow:var(--shadow); font-size:30px}

.mc-b.en{font-family:var(--fe); font-weight:400; font-size:17px}

/* results */
.result{background:#fff; border-radius:30px; box-shadow:var(--shadow); padding:28px 20px; text-align:center; margin-top:10px}
.result .rs{font-size:56px; letter-spacing:6px}

@keyframes starIn{from{transform:scale(0) rotate(-90deg)}}
.result h3{font-family:var(--fd); font-weight:400; font-size:34px; margin:8px 0 2px}
.result p{margin:4px 0; font-size:16px; color:var(--ink2)}
.rank{list-style:none; padding:0; margin:14px auto 0; max-width:340px}

.rank li:first-child{background:#FFF1C2}
.btnrow{display:flex; gap:10px; margin-top:18px; flex-wrap:wrap}
.btnrow .cta{flex:1; min-width:140px; margin-top:0}

/* ---------- Sheet ---------- */
.sheet-bg{position:fixed; inset:0; background:rgba(22,51,94,.35); z-index:80; display:flex; align-items:flex-end; justify-content:center; animation:fade .2s}

.sheet p{margin:0 0 14px; text-align:center; color:var(--ink2); font-size:14px}
.sheet .opts{margin-top:8px}
.sheet .opt{background:var(--paper2); box-shadow:0 4px 0 rgba(22,51,94,.1)}
.sheet .opt small{display:block; font-size:12.5px; color:var(--ink2); font-weight:500}

/* ---------- Dictionary / settings ---------- */
.search{width:100%; padding:14px 18px; border-radius:999px; border:0; font:inherit; font-size:16px; box-shadow:var(--shadow); color:var(--ink); background:#fff}
.dlist{list-style:none; padding:0; margin:16px 0 0; background:#fff; border-radius:var(--r-lg); box-shadow:var(--shadow); overflow:hidden}

.seg{display:flex; background:var(--paper2); border-radius:999px; padding:4px; gap:2px}
.seg button{padding:7px 12px; border-radius:999px; font-weight:600; font-size:14px; color:var(--ink2)}
.seg button[aria-pressed="true"]{background:var(--ink); color:#fff}
.switch{width:56px; height:32px; border-radius:999px; background:var(--line); position:relative; transition:background .2s}
.switch::after{content:''; position:absolute; top:4px; right:4px; width:24px; height:24px; border-radius:50%; background:#fff; transition:transform .2s; box-shadow:0 2px 4px rgba(0,0,0,.2)}

.danger{color:var(--coral); font-weight:700; padding:10px 0}

.toast{position:fixed; left:50%; top:calc(env(safe-area-inset-top,0px) + 16px); transform:translateX(-50%); background:var(--ink); color:#fff; padding:10px 18px; border-radius:999px; font-weight:600; z-index:90; animation:toast 2.2s forwards; font-size:15px; white-space:nowrap}
@keyframes toast{0%{opacity:0; transform:translate(-50%,-20px)} 12%,80%{opacity:1; transform:translate(-50%,0)} 100%{opacity:0}}

const Voice = {
  ok: 'speechSynthesis' in window && 'SpeechSynthesisUtterance' in window, list: [],
  load() {
    if (!this.ok) return;
    const set = () => { try { this.list = speechSynthesis.getVoices().filter(v => /^en/i.test(v.lang)); } catch (e) {} };
    set(); try { speechSynthesis.addEventListener('voiceschanged', () => { set(); document.dispatchEvent(new Event('voices')); }); } catch (e) {}
  },
  voice() {
    let v = this.list.find(v => v.name === S.voice);
    return v || this.list.find(v => /en[-_]GB/i.test(v.lang)) || this.list.find(v => /en[-_]US/i.test(v.lang)) || this.list[0] || null;
  },
  speak(text) {
    return new Promise(res => {
      if (!this.ok) { setTimeout(res, Math.min(2600, 500 + text.length * 45)); return; }
      let done = false; const fin = () => { if (!done) { done = true; res(); } };
      const go = () => {
        try {
          const u = new SpeechSynthesisUtterance(text), v = this.voice();
          if (v) { u.voice = v; u.lang = v.lang; } else u.lang = 'en-GB';
          u.rate = +S.rate || .9; u.onend = fin; u.onerror = fin;
          setTimeout(fin, 1000 + text.length * 80 / u.rate);
          speechSynthesis.speak(u);
        } catch (e) { fin(); }
      };
      try {
        if (speechSynthesis.speaking || speechSynthesis.pending) { speechSynthesis.cancel(); setTimeout(go, 90); } else go();
      } catch (e) { fin(); }
    });
  },
  stop() { if (this.ok) try { speechSynthesis.cancel(); } catch (e) {} }
};

/* ================= skywriting ================= */
function fitSize(text, maxPx) {
  const W = Math.min(innerWidth, 1100) - 44;
  maxPx = maxPx || Math.min(132, Math.max(58, innerHeight * .13));
  const longest = Math.max(...text.split(' ').map(w => w.length));
  let fs = Math.min(maxPx, W / (text.length * .6));
  if (fs < maxPx * .6) fs = Math.min(maxPx * .78, W / (longest * .62));
  return Math.max(28, Math.round(fs));
}
function skywrite(host, text, opt = {}) {
  const step = opt.step || 72;
  host.classList.remove('go', 'done');
  host.innerHTML = text.split(' ').map(w => `<span class="wd">${[...w].map(c => `<span class="lt">${esc(c)}</span>`).join('')}</span>`).join(' ');
  const lts = $$('.lt', host);
  if (!lts.length) return 0;
  let minX = 1e9, maxX = -1e9, minY = 1e9, maxY = -1e9;
  const rects = lts.map(l => { const r = l.getBoundingClientRect(); minX = Math.min(minX, r.left); maxX = Math.max(maxX, r.right); minY = Math.min(minY, r.top); maxY = Math.max(maxY, r.bottom); return r; });
  const span = Math.max(1, maxX - minX), dur = Math.max(650, lts.length * step), v = span / dur;
  const xs = minX - 70, xe = maxX + 110;
  lts.forEach((l, i) => {
    const r = rects[i], cx = r.left + r.width / 2;
    l.style.setProperty('--d', Math.round((cx - xs) / v) + 'ms');
    l.style.setProperty('--r', ((Math.random() * 2 - 1) * 12).toFixed(1) + 'deg');
    l.style.setProperty('--y', Math.round((Math.random() * 2 - 1) * 16) + 'px');
  });
  if (REDUCE()) { host.classList.add('done'); return 200; }
  void host.offsetWidth; host.classList.add('go');
  const T = (xe - xs) / v, fx = $('#fx');
  const p = document.createElement('div'); p.className = 'plane'; p.innerHTML = PLANE; fx.appendChild(p);
  const y = (minY + maxY) / 2 - 30;
  try {
    p.animate([0, .25, .5, .75, 1].map((o, k) => ({ offset:o, transform:`translate(${xs - 46 + (xe - xs) * o}px,${y + (k % 2 ? -8 : 6)}px)` })), { duration:T, easing:'linear', fill:'forwards' });
  } catch (e) { p.style.display = 'none'; }
  if (opt.sound !== false) Sfx.whoosh(T / 1000);
  const tick = setInterval(() => {
    if (!p.isConnected) { clearInterval(tick); return; }
    if (opt.paused && opt.paused()) return;
    const r = p.getBoundingClientRect(), f = document.createElement('div');
    f.className = 'puff'; f.style.left = (r.left + 8) + 'px'; f.style.top = (r.top + r.height * .5 + (Math.random() * 8 - 4)) + 'px';
    f.style.width = f.style.height = (14 + Math.random() * 14) + 'px';
    fx.appendChild(f); setTimeout(() => f.remove(), 1400);
  }, 42);
  setTimeout(() => { clearInterval(tick); p.remove(); }, T + 60);
  return Math.max(T, dur) + 650;
}

const CANCEL = { cancel:true };
function buildShots(p) {
  const sh = [];
  const addSet = (un, si) => { const s = U(un).sets[si]; sh.push({ t:'chapter', k:`الوحدة ${un}`, e:s.e, en:s.en, ar:s.ar }); s.words.forEach(w => sh.push({ t:'word', w })); };
  const addGram = g => {
    sh.push({ t:'gtitle', g }, { t:'guse', g }, { t:'gform', g });
    g.ex.forEach((ex, i) => sh.push({ t:'gex', g, ex, i }));
    if (g.tip) sh.push({ t:'gtip', g });
    sh.push({ t:'gcheck', g });
  };
  switch (p.k) {
    case 'set': addSet(p.u, p.s); break;
    case 'unit': U(p.u).sets.forEach((s, si) => addSet(p.u, si)); if (!p.wordsOnly) U(p.u).gram.forEach(addGram); break;
    case 'gram': addGram(GRAMMAR[p.g]); break;
    case 'ugram': U(p.u).gram.forEach(addGram); break;
    case 'sem': UNITS.filter(u => p.sem === 'all' || u.sem === p.sem).forEach(u => u.sets.forEach((s, si) => addSet(u.n, si))); break;
    case 'allgram': GRAMMAR.forEach(addGram); break;
    case 'full': UNITS.forEach(u => { u.sets.forEach((s, si) => addSet(u.n, si)); u.gram.forEach(addGram); }); break;
  }
  sh.push({ t:'end' });
  return sh;
}

      const prev = R.stack[R.stack.length - 2];
      stg.innerHTML = `<div class="sw c-word" id="cw"></div><div class="endcard"><h3>أحسنت! 🎉</h3><p>شاهدت ${[nWords ? arCount(nWords, 'كلمة واحدة', 'كلمتين', 'كلمات', 'كلمة') : '', nGram ? arCount(nGram, 'قاعدة واحدة', 'قاعدتين', 'قواعد', 'قاعدة') : ''].filter(Boolean).join(' و')}</p>
        <div class="btnrow"><button class="cta" id="eAgain" style="--ud:var(--ink)">↺ أعد العرض</button>${prev && prev.r === 'unit' ? '<button class="cta" id="eGames" style="--ud:#1C8049">🎮 العب الآن</button>' : ''}<button class="cta alt" id="eOut">خروج</button></div></div>`;
      $('#eAgain').onclick = () => { Sfx.tap(); go(0); };
      $('#eOut').onclick = () => goBack();
      const eg = $('#eGames'); if (eg) eg.onclick = () => { prev.p.tab = 'games'; goBack(); };
      Sfx.win(); confetti();
      await sky($('#cw'), 'The End', my, Math.min(110, innerHeight * .12));
    }
  };
  const film = () => {
    const f = shots.length > 1 ? C.i / (shots.length - 1) : 1;
    $('#film .fill').style.width = (f * 100) + '%'; $('#film .fp').style.left = (f * 100) + '%';
    $('#cc').textContent = `${C.i + 1} / ${shots.length}`;
  };
  async function go(i) {
    C.i = Math.max(0, Math.min(i, shots.length - 1));
    const my = ++C.tok; Voice.stop(); $('#fx').innerHTML = ''; C.say = '';
    if (C.paused) setPause(false);
    film();
    try {
      await SHOT[shots[C.i].t](shots[C.i], my);
      if (my === C.tok && C.i < shots.length - 1) go(C.i + 1);
    } catch (e) { if (e !== CANCEL) console.error(e); }
  }
  $('#cPrev').onclick = () => { Sfx.tap(); go(C.i - 1); };
  $('#cNext').onclick = () => { Sfx.tap(); go(C.i + 1); };
  $('#cPP').onclick = () => { Sfx.tap(); setPause(!C.paused); };
  $('#cSay').onclick = () => {
    const s = shots[C.i];
    const t = s.t === 'word' ? s.w.en : s.t === 'gex' ? plain(s.ex[0]) : C.say;
    if (t) Voice.speak(t);
  };
  $('#cSpd').onclick = () => { const L = [.7, 1, 1.4]; S.speed = L[(L.indexOf(+S.speed) + 1) % 3]; Store.save(); $('#cSpd').innerHTML = spd(); Sfx.tap(); };
  $('#film').onclick = e => { const r = e.currentTarget.getBoundingClientRect(); const f = Math.max(0, Math.min(1, (e.clientX - r.left) / r.width)); Sfx.tap(); go(Math.round(f * (shots.length - 1))); };
  const key = e => {
    if (e.key === ' ') { e.preventDefault(); setPause(!C.paused); }
    else if (e.key === 'ArrowRight') go(C.i + 1);
    else if (e.key === 'ArrowLeft') go(C.i - 1);
  };
  document.addEventListener('keydown', key);
  R.cleanup = () => { C.tok++; Voice.stop(); document.removeEventListener('keydown', key); };
  setTimeout(() => go(0), 250);
};

/* ================= GAMES ================= */
const PRAISE = ['ممتاز! 🌟', 'رائع! 👏', 'أحسنت! ✨', 'إجابة صحيحة! 🎯', 'تحليق رائع! 🚀'];
function makeRounds(gid, us, teams) {
  const W = us.flatMap(n => U(n).words);
  const fit = n => Math.ceil(n / teams) * teams;
  const take = (arr, n) => { let out = []; while (out.length < n) out = out.concat(shuffle(arr)); return out.slice(0, n); };
  const dis = (w, n = 3) => shuffle(W.filter(x => x.en !== w.en && x.ar !== w.ar)).slice(0, n);
  const gramQ = q => ({ k:'gram', q, opts:shuffle(q[1].map((t, i) => ({ t, ok:i === 0 }))) });
  const allGQ = us.flatMap(n => [...GQ[n], ...U(n).gram.map(g => g.q)]);
  const R1 = {
    balloon: () => take(W, fit(10)).map(w => ({ k:'balloon', w, opts:shuffle([w, ...dis(w)]) })),
    listen: () => take(W, fit(10)).map(w => ({ k:'listen', w, opts:shuffle([w, ...dis(w)]) })),
    spell: () => take(W.filter(w => Math.max(...w.en.split(' ').map(x => x.length)) <= 11 && w.en.replace(/[^a-z]/gi, '').length <= 15), fit(8)).map(w => ({ k:'spell', w })),
    tf: () => take(W, fit(12)).map(w => { const t = Math.random() < .5; return { k:'tf', w, shown:t ? w.ar : dis(w, 1)[0].ar, truth:t }; }),
    gram: () => take(allGQ, fit(10)).map(gramQ),
    order: () => take(us.flatMap(n => ORDER[n]), fit(5)).map(o => ({ k:'order', en:o[0], ar:o[1] })),
  };
  if (R1[gid]) return R1[gid]();
  /* mixed challenge */
  const n = fit(gid === 'grand' ? 30 : 20);
  const kinds = shuffle(Array.from({ length:n }, (_, i) => ['mean', 'rev', 'listen', 'gram', 'mean', 'gram', 'rev', 'tf', 'order', 'listen'][i % 10]));
  const ws = take(W, n), gq = take(allGQ, n), oq = take(us.flatMap(x => ORDER[x]), n);
  return kinds.map((k, i) => {
    const w = ws[i];
    if (k === 'gram') return gramQ(gq[i]);
    if (k === 'order') return { k:'order', en:oq[i][0], ar:oq[i][1] };
    if (k === 'tf') { const t = Math.random() < .5; return { k:'tf', w, shown:t ? w.ar : dis(w, 1)[0].ar, truth:t }; }
    return { k, w, opts:shuffle([w, ...dis(w)]) };
  });
}

VIEWS.game = (v, p) => {
  const def = GAMES.find(g => g.id === p.g) || GRAND;
  const u0 = U(p.us[0]), multi = p.us.length > 1;
  const G = { p, def, i:0, res:[], teams:p.teams || 1, ts:[0, 0, 0, 0], turn:0, locked:false, dead:false, tmr:0 };
  v.innerHTML = `<div class="wrap" style="--uf:${multi ? '#FFE27A' : u0.cf};--ud:${multi ? '#16335E' : u0.cd}">
    <div class="gbar"><button class="back" data-back aria-label="خروج">${IC.back}</button><div class="gtitle">${def.e} ${def.n}<small style="display:block;font-weight:500;font-size:13px;color:var(--ink2)">${esc(p.title || '')}</small></div><div class="score" id="gs">✔ 0</div></div>
    <div class="route" id="rt"><span class="flag">🏁</span><div class="rp">${PLANE}</div></div>
    <div id="tm"></div><div id="gb"></div></div>`;
  R.cleanup = () => { G.dead = true; clearTimeout(G.tmr); };
  const gb = $('#gb');
  const route = f => { $('#rt .rp').style.right = `calc((100% - 56px) * ${Math.min(1, f)})`; };
  const hud = () => {
    const ok = G.res.filter(Boolean).length;
    $('#gs').textContent = G.teams > 1 ? `${G.i + 1 > G.rounds.length ? G.rounds.length : G.i + 1} / ${G.rounds.length}` : `✔ ${ok}`;
    route(G.rounds.length ? G.i / G.rounds.length : 0);
    if (G.teams > 1) {
      $('#tm').innerHTML = `<div class="teams">${TEAMS.slice(0, G.teams).map((t, i) => `<span class="team${i === G.turn ? ' on' : ''}" style="--tc:${t[1]}"><i></i>${t[0]} ${G.ts[i]}</span>`).join('')}</div><div class="turn" style="color:${TEAMS[G.turn][1]}">دور فريق ${TEAMS[G.turn][0]}</div>`;
    }
  };
  const answer = (ok, fbHtml) => {
    if (G.locked || G.dead) return; G.locked = true;
    G.res.push(ok);
    if (ok) { Sfx.good(); G.ts[G.turn]++; } else Sfx.bad();
    const fl = $('#fbl');
    if (fl) { fl.className = 'fb-line ' + (ok ? 'ok' : 'no'); fl.innerHTML = ok ? PRAISE[Math.random() * PRAISE.length | 0] : (fbHtml || ''); }
    hud(); if (G.teams > 1) $('#gs').textContent = `${G.i + 1} / ${G.rounds.length}`;
    clearTimeout(G.tmr); G.tmr = setTimeout(next, ok ? 1400 : 2500);
  };
  const next = () => {
    if (G.dead) return;
    G.i++; if (G.teams > 1) G.turn = (G.turn + 1) % G.teams;
    if (G.i >= G.rounds.length) finish(); else round();
  };
  const bindMC = (oks, correctHTML, sayText) => {
    const btns = $$('.opt[data-i]', gb);
    btns.forEach((b, i) => b.onclick = () => {
      if (G.locked) return;
      btns.forEach((x, j) => { x.disabled = true; if (oks[j]) x.classList.add('ok'); });
      if (!oks[i]) b.classList.add('no');
      if (sayText) Voice.speak(sayText);
      answer(oks[i], `الإجابة: ${correctHTML}`);
    });
  };
  const optsHTML = (items, en) => `<div class="opts${items.some(t => t.length > 16) ? ' one' : ''}">${items.map((t, i) => `<button class="opt${en ? ' en' : ''}" data-i="${i}">${esc(t)}</button>`).join('')}</div><div class="fb-line" id="fbl"></div>`;
  const enSpan = t => `<span class="en">${esc(t)}</span>`;

  const RR = {
    mean(r) {
      gb.innerHTML = `<div class="qcard"><div class="qhint" style="margin:0 0 6px">ما معنى هذه الكلمة؟</div><div class="qen">${esc(r.w.en)}</div><button class="hear" id="hr">🔊 استمع</button></div>` + optsHTML(r.opts.map(o => o.ar));
      $('#hr').onclick = () => Voice.speak(r.w.en); setTimeout(() => !G.dead && Voice.speak(r.w.en), 300);
      bindMC(r.opts.map(o => o === r.w), esc(r.w.ar));
    },
    rev(r) {
      gb.innerHTML = `<div class="qcard"><div class="qhint" style="margin:0">اختر الكلمة الإنجليزية</div><div class="qe">${r.w.e}</div><div class="qa">${esc(r.w.ar)}</div></div>` + optsHTML(r.opts.map(o => o.en), true);
      bindMC(r.opts.map(o => o === r.w), enSpan(r.w.en), r.w.en);
    },
    listen(r) {
      gb.innerHTML = `<div class="qcard">${Voice.ok ? '<button class="big-hear" id="hr" aria-label="استمع مرة أخرى">🔊</button><div class="qhint">استمع ثم اختر الكلمة. اضغط السماعة للإعادة</div>'
        : `<div class="qe">${r.w.e}</div><div class="qhint">النطق غير متاح على هذا الجهاز، فاختر الكلمة من الصورة</div>`}</div>` + optsHTML(r.opts.map(o => o.en), true);
      if (Voice.ok) { $('#hr').onclick = () => Voice.speak(r.w.en); setTimeout(() => !G.dead && Voice.speak(r.w.en), 350); }
      bindMC(r.opts.map(o => o === r.w), `${enSpan(r.w.en)} ${r.w.e}`);
    },
    gram(r) {
      const q = r.q, correct = q[1][0];
      gb.innerHTML = `<div class="qcard"><div class="qhint" style="margin:0 0 8px">اختر الكلمة المناسبة</div><div class="qs en">${esc(q[0]).replace('___', '<span class="gap" id="gp">&nbsp;</span>')}</div></div>` + optsHTML(r.opts.map(o => o.t), true);
      bindMC(r.opts.map(o => o.ok), enSpan(correct), q[0].replace('___', correct));
      $$('.opt', gb).forEach(b => b.addEventListener('click', () => { const g = $('#gp'); if (g) g.textContent = correct; }));
    },
    tf(r) {
      gb.innerHTML = `<div class="qcard"><div class="qhint" style="margin:0 0 6px">هل المعنى صحيح؟</div><div class="qen">${esc(r.w.en)}</div><div style="font-size:28px;color:var(--ink3);margin:4px 0">=</div><div class="qa">${esc(r.shown)}</div></div>
        <div class="tf"><button class="opt" data-v="1" style="color:var(--mint)">✓ صح</button><button class="opt" data-v="0" style="color:var(--coral)">✗ خطأ</button></div><div class="fb-line" id="fbl"></div>`;
      const btns = $$('.tf .opt', gb);
      btns.forEach(b => b.onclick = () => {
        if (G.locked) return; const val = b.dataset.v === '1', ok = val === r.truth;
        btns.forEach(x => { x.disabled = true; if ((x.dataset.v === '1') === r.truth) { x.classList.add('ok'); x.style.color = ''; } });
        if (!ok) { b.classList.add('no'); b.style.color = ''; }
        Voice.speak(r.w.en);
        answer(ok, `${enSpan(r.w.en)} = ${esc(r.w.ar)}`);
      });
    },
    balloon(r) {
      gb.innerHTML = `<div class="qcard" style="padding:12px 16px;display:flex;align-items:center;justify-content:center;gap:14px"><div class="qe" style="font-size:46px">${r.w.e}</div><div class="qa" style="margin:0">${esc(r.w.ar)}</div></div><div class="field" id="fld"></div><div class="fb-line" id="fbl"></div>`;
      const f = $('#fld'), cols = shuffle([1.5, 26, 50.5, 75]); let maxT = 0;
      const els = r.opts.map((o, i) => {
        const el = document.createElement('button'); el.className = 'gb'; el.style.left = cols[i] + '%';
        const rt = 7 + Math.random() * 1.8, rd = i * .4; maxT = Math.max(maxT, rt + rd);
        el.style.setProperty('--rt', rt.toFixed(2) + 's'); el.style.setProperty('--rd', rd.toFixed(2) + 's');
        el.innerHTML = gbSVG(BCOL[(i + r.w.u) % BCOL.length]) + `<span>${esc(o.en)}</span>`;
        el.setAttribute('aria-label', o.en);
        el.onclick = () => {
          if (G.locked) return;
          Sfx.pop(); el.style.transform = getComputedStyle(el).transform; el.classList.add('popped');
          f.classList.add('stop'); els.forEach(x => { if (x !== el) x.style.animationPlayState = 'paused'; });
          const ok = o === r.w;
          if (ok) Voice.speak(r.w.en); else { const c = els[r.opts.indexOf(r.w)]; c && c.classList.add('hl'); }
          answer(ok, `الإجابة: ${enSpan(r.w.en)}`);
        };
        f.appendChild(el); return el;
      });
      G.tmr = setTimeout(() => { if (!G.locked && !G.dead) answer(false, `طارت البالونات! الإجابة: ${enSpan(r.w.en)}`); }, maxT * 1000 + 200);
    },
    spell(r) {
      const w = r.w.en, chars = [...w];
      const target = chars.filter(c => /[a-z]/i.test(c)).map(c => c.toLowerCase());
      let tiles = shuffle(target); if (tiles.join('') === target.join('') && target.length > 2) tiles = shuffle(target);
      const groups = w.split(' ');
      let li = 0;
      const slotsHTML = groups.map(g => `<span style="display:flex;gap:4px">${[...g].map(c => /[a-z]/i.test(c) ? `<span class="slot" data-k="${li++}"></span>` : `<span class="slot fix">${esc(c)}</span>`).join('')}</span>`).join('<span style="width:14px"></span>');
      gb.innerHTML = `<div class="qcard"><div class="qe">${r.w.e}</div><div class="qa">${esc(r.w.ar)}</div>${Voice.ok ? '<button class="hear" id="hr">🔊 استمع</button>' : ''}</div>
        <div class="slots" id="sl">${slotsHTML}</div><div class="letters" id="lt">${tiles.map((c, i) => `<button class="ltile" data-t="${i}">${c}</button>`).join('')}</div><div class="fb-line" id="fbl"></div>`;
      if (Voice.ok) $('#hr').onclick = () => Voice.speak(w);
      const slots = $$('.slot[data-k]', gb), fill = Array(target.length).fill(null);
      const check = () => {
        const ok = fill.every((t, k) => tiles[t] === target[k]);
        if (!ok) { $('#sl').classList.add('bad'); setTimeout(() => slots.forEach((s, k) => { s.textContent = target[k]; s.classList.add('filled'); }), 450); }
        else Voice.speak(w);
        $$('.ltile', gb).forEach(b => b.disabled = true);
        answer(ok, `الكلمة: ${enSpan(w)}`);
      };
      $$('.ltile', gb).forEach(b => b.onclick = () => {
        if (G.locked) return; const k = fill.indexOf(null); if (k < 0) return;
        fill[k] = +b.dataset.t; slots[k].textContent = tiles[fill[k]]; slots[k].classList.add('filled'); b.classList.add('used'); Sfx.tap();
        if (fill.indexOf(null) < 0) check();
      });
      slots.forEach((s, k) => s.onclick = () => {
        if (G.locked || fill[k] == null) return;
        $(`.ltile[data-t="${fill[k]}"]`, gb).classList.remove('used'); fill[k] = null; s.textContent = ''; s.classList.remove('filled'); Sfx.flip();
      });
      slots.forEach(s => { s.setAttribute('role', 'button'); });
    },
    order(r) {
      const words = r.en.split(' ');
      let pool = words.map((t, i) => ({ t, id:i }));
      do { pool = shuffle(pool); } while (words.length > 2 && pool.map(x => x.t).join(' ') === r.en);
      const built = [];
      gb.innerHTML = `<div class="qcard"><div class="qhint" style="margin:0 0 4px">رتّب الكلمات لتكوّن الجملة</div><div class="qa" style="font-size:clamp(20px,5.4vw,30px)">${esc(r.ar)}</div></div>
        <div class="ans" id="an"></div><div class="pool" id="po"></div><div class="fb-line" id="fbl"></div>`;
      const draw = () => {
        $('#an').innerHTML = built.map((x, i) => `<button class="wchip" data-b="${i}">${esc(x.t)}</button>`).join('');
        $('#po').innerHTML = pool.map((x, i) => `<button class="wchip" data-p="${i}">${esc(x.t)}</button>`).join('');
        $$('[data-p]', gb).forEach(b => b.onclick = () => { if (G.locked) return; Sfx.tap(); built.push(pool.splice(+b.dataset.p, 1)[0]); draw(); if (!pool.length) done(); });
        $$('[data-b]', gb).forEach(b => b.onclick = () => { if (G.locked) return; Sfx.flip(); pool.push(built.splice(+b.dataset.b, 1)[0]); draw(); });
      };
      const done = () => {
        const ok = built.map(x => x.t).join(' ') === r.en;
        $('#an').classList.add(ok ? 'good' : 'bad');
        Voice.speak(r.en + '.');
        answer(ok, `الجملة: ${enSpan(r.en + '.')}`);
      };
      draw();
    }
  };
  const round = () => { G.locked = false; hud(); gb.innerHTML = ''; RR[G.rounds[G.i].k](G.rounds[G.i]); };

  const finish = (starsOverride, extra) => {
    route(1);
    const total = G.res.length, ok = G.res.filter(Boolean).length, pct = total ? ok / total : 0;
    const stars = starsOverride != null ? starsOverride : pct >= .9 ? 3 : pct >= .7 ? 2 : pct >= .5 ? 1 : 0;
    if (p.key) { Store.d.best[p.key] = Math.max(Store.d.best[p.key] || 0, stars); Store.save(); }
    const msg = ['لنحاول مرة أخرى 🌤️', 'بداية جيدة! 🎈', 'رحلة رائعة! ✈️', 'تحليق عالٍ! 🚀'][stars];
    let rank = '';
    if (G.teams > 1) {
      const order = TEAMS.slice(0, G.teams).map((t, i) => ({ t, s:G.ts[i] })).sort((a, b) => b.s - a.s);
      const tie = order[1] && order[0].s === order[1].s;
      rank = `<p style="font-weight:700;color:var(--ink)">${tie ? 'تعادل في القمة! 🤝' : `الفائز: فريق ${order[0].t[0]} 🏆`}</p><ol class="rank">${order.map((o, i) => `<li><span>${['🥇', '🥈', '🥉', '🎖️'][i]} ${o.t[0]}</span><span>${o.s}</span></li>`).join('')}</ol>`;
      $('#tm').innerHTML = '';
    }
    gb.innerHTML = `<div class="result"><div class="rs">${starsHTML(stars)}</div><h3>${msg}</h3>
      <p>${extra || `الإجابات الصحيحة: ${ok} من ${total}`}</p>${rank}
      <div class="btnrow"><button class="cta" id="rA">↺ العب مرة أخرى</button><button class="cta alt" data-back>رجوع</button></div></div>`;
    $('#gs').textContent = `✔ ${ok}`;
    $('#rA').onclick = () => { Sfx.tap(); render(); };
    if (stars >= 2) { Sfx.win(); confetti(); } else Sfx.chime();
  };

  /* memory game has its own flow */
  if (p.g === 'memory') {
    const W = pick(p.us.flatMap(n => U(n).words), 6);
    const cards = shuffle(W.flatMap(w => [{ w, side:'en' }, { w, side:'ar' }]));
    let open = [], moves = 0, matched = 0, lock = false;
    gb.innerHTML = `<div class="qcard" style="padding:12px"><div class="qhint" style="margin:0">اقلب بطاقتين: كلمة إنجليزية ومعناها العربي</div></div>
      <div class="mem">${cards.map((c, i) => `<button class="mc" data-i="${i}" aria-label="بطاقة ${i + 1}"><span class="mc-in"><span class="mc-f">☁️</span><span class="mc-b${c.side === 'en' ? ' en' : ''}">${esc(c.side === 'en' ? c.w.en : c.w.ar)}</span></span></button>`).join('')}</div>
      <div class="fb-line" id="fbl">الحركات: 0</div>`;
    G.rounds = cards; route(0);
    $('#gs').textContent = '✔ 0';
    $$('.mc', gb).forEach(el => el.onclick = () => {
      if (lock || el.classList.contains('up')) return;
      const c = cards[+el.dataset.i]; el.classList.add('up'); Sfx.flip();
      if (c.side === 'en') Voice.speak(c.w.en);
      open.push(el);
      if (open.length < 2) return;
      moves++; $('#fbl').textContent = `الحركات: ${moves}`;
      const [a, b] = open.map(x => cards[+x.dataset.i]);
      if (a.w === b.w) {
        open.forEach(x => x.classList.add('done')); open = []; matched++; Sfx.good();
        $('#gs').textContent = `✔ ${matched}`; route(matched / 6);
        if (matched === 6) { G.tmr = setTimeout(() => { if (!G.dead) finish(moves <= 8 ? 3 : moves <= 12 ? 2 : 1, `أنهيت اللعبة في ${moves} ${moves >= 3 && moves <= 10 ? 'حركات' : 'حركة'}`); }, 900); }
      } else {
        lock = true;
        G.tmr = setTimeout(() => { open.forEach(x => x.classList.remove('up')); open = []; lock = false; }, 1000);
      }
    });
    return;
  }
  G.rounds = makeRounds(p.g, p.us, G.teams);
  round();
};

/* ================= boot ================= */
$('#bg').innerHTML = skyHTML(6, true);
