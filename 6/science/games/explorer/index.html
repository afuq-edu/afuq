<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مختبر العلوم التفاعلي، الصف السادس، الفصل الأول</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lalezar&family=Readex+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --ink:#10324A; --paper:#EEF5F8; --card:#FFFFFF; --line:#D3E2E9; --muted:#587385;
  --u1:#D9473B; --u2:#22915A; --u3:#6447D1; --sun:#F5B82E; --ok:#1C9A60; --bad:#D23F3F;
  --soft1:#FCE9E6; --soft2:#E3F4EA; --soft3:#ECE7FB;
  --display:'Lalezar','Readex Pro',Tahoma,'Segoe UI',sans-serif;
  --body:'Readex Pro',Tahoma,'Segoe UI',Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ink:#E4EEF3; --paper:#0E1C25; --card:#162A35; --line:#294150; --muted:#93AEBD;
    --u1:#F2695D; --u2:#3FC07C; --u3:#9580F2; --sun:#F7C24A; --ok:#39C485; --bad:#F06464;
    --soft1:#3A2224; --soft2:#173828; --soft3:#2A2448; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ink:#E4EEF3; --paper:#0E1C25; --card:#162A35; --line:#294150; --muted:#93AEBD;
  --u1:#F2695D; --u2:#3FC07C; --u3:#9580F2; --sun:#F7C24A; --ok:#39C485; --bad:#F06464;
  --soft1:#3A2224; --soft2:#173828; --soft3:#2A2448; color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.75;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;font-size:inherit;color:inherit}
button:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
img,svg{max-width:100%}
.wrap{max-width:1080px;margin:0 auto;padding:0 18px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);border-bottom:2px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:12px;min-height:62px}
.brand{font-family:var(--display);font-size:26px;line-height:1;cursor:pointer;background:none;border:0;padding:6px 0;display:flex;align-items:center;gap:8px}
.brand svg{width:30px;height:30px}
.navs{margin-inline-start:auto;display:flex;gap:4px;flex-wrap:nowrap}
.navs button,.iconbtn{background:none;border:2px solid transparent;border-radius:10px;padding:6px 12px;cursor:pointer;font-weight:600}
.navs button[aria-current="true"]{border-color:var(--ink)}
.iconbtn{padding:6px 9px}
main{padding:22px 0 60px}
h1,h2,h3{font-family:var(--display);font-weight:400;line-height:1.25;margin:0}

/* home */
.hero{display:grid;grid-template-columns:1.2fr 1fr;gap:26px;align-items:center;padding:12px 0 26px}
.hero h1{font-size:clamp(38px,6vw,64px)}
.hero p{color:var(--muted);margin:10px 0 18px;max-width:46ch}
.hero .cta{display:flex;gap:10px;flex-wrap:wrap}
.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.trio button{border:0;border-radius:18px;padding:16px 8px 12px;cursor:pointer;color:#fff;font-family:var(--display);font-size:20px;line-height:1.2;display:flex;flex-direction:column;align-items:center;gap:8px;transition:transform .15s}
.trio button:hover{transform:translateY(-3px)}
.trio svg{width:64px;height:64px}
.unitblock{margin-top:26px;border-top:4px solid var(--u);padding-top:14px}
.unithead{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.unithead .num{font-family:var(--display);font-size:54px;line-height:.9;color:var(--u)}
.unithead h2{font-size:30px}
.unithead small{color:var(--muted);margin-inline-start:auto}
.lrows{list-style:none;margin:10px 0 0;padding:0;display:grid;grid-template-columns:repeat(2,1fr);column-gap:28px}
.lrows li{border-bottom:1px solid var(--line)}
.lrows button{width:100%;text-align:start;background:none;border:0;padding:11px 4px;cursor:pointer;display:flex;align-items:center;gap:12px}
.lrows button:hover .lt{color:var(--u)}
.lrows .lid{font-family:var(--display);color:var(--u);font-size:20px;min-width:42px}
.lrows .lt{font-weight:600;flex:1}
.lrows .dots{display:flex;gap:4px}
.lrows .dots i{width:9px;height:9px;border-radius:50%;border:2px solid var(--u);display:block}
.lrows .dots i.on{background:var(--u)}

/* buttons */
.btn{border:2px solid var(--ink);background:var(--ink);color:var(--paper);border-radius:12px;padding:9px 18px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:8px;transition:transform .1s}
.btn:active{transform:scale(.97)}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.u{background:var(--u);border-color:var(--u);color:#fff}
.btn.sm{padding:5px 12px;font-size:15px;border-radius:10px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.seg{display:inline-flex;border:2px solid var(--line);border-radius:12px;overflow:hidden;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:7px 14px;cursor:pointer;font-weight:600}
.seg button[aria-pressed="true"]{background:var(--u,var(--ink));color:#fff}

/* lesson */
.lhead{display:flex;gap:18px;align-items:center;margin-bottom:16px}
.lhead .big{white-space:nowrap;direction:ltr;font-family:var(--display);font-size:clamp(64px,11vw,110px);line-height:.8;color:var(--u)}
.lhead .crumb{color:var(--muted);font-size:15px;background:none;border:0;padding:0;cursor:pointer}
.lhead h1{font-size:clamp(28px,4.5vw,44px)}
.tabs{display:flex;gap:4px;border-bottom:2px solid var(--line);margin-bottom:18px;overflow-x:auto}
.tabs button{background:none;border:0;border-bottom:4px solid transparent;margin-bottom:-2px;padding:10px 14px;cursor:pointer;font-weight:700;white-space:nowrap;color:var(--muted)}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--u)}
.ideas{display:grid;grid-template-columns:1fr 280px;gap:26px}
.ideas ol{margin:0;padding:0;list-style:none;counter-reset:k}
.ideas li{counter-increment:k;position:relative;padding:12px 52px 12px 0;border-bottom:1px dashed var(--line)}
.ideas li::before{content:counter(k);position:absolute;right:0;top:12px;width:36px;height:36px;border-radius:50%;background:var(--soft);color:var(--u);font-family:var(--display);font-size:20px;display:grid;place-items:center;line-height:1}
.vocab{background:var(--soft);border-radius:16px;padding:16px}
.vocab h3{font-size:22px;margin-bottom:8px;color:var(--u)}
.vocab span{display:inline-block;background:var(--card);border-radius:999px;padding:3px 12px;margin:3px;font-weight:600;font-size:15px}
.next-row{display:flex;justify-content:space-between;gap:10px;margin-top:26px;flex-wrap:wrap}

.panel{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:18px}
.actpick{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.actpick button{border:2px solid var(--line);background:var(--card);border-radius:12px;padding:8px 14px;cursor:pointer;font-weight:600;display:flex;align-items:center;gap:8px}
.actpick button[aria-pressed="true"]{border-color:var(--u);background:var(--soft)}
.actpick .ok{color:var(--ok);font-weight:800}
.prompt{font-weight:700;margin:0 0 12px}
.hint{color:var(--muted);font-size:15px}

/* engines */
.chip{border:2px solid var(--line);background:var(--card);border-radius:12px;padding:8px 14px;cursor:pointer;font-weight:600;line-height:1.5;text-align:center;transition:transform .12s,background .15s}
.chip:hover{border-color:var(--u)}
.chip.sel{border-color:var(--u);background:var(--soft);transform:translateY(-2px)}
.chip.good{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,var(--card));cursor:default}
.chip.badx{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,var(--card))}
.shake{animation:shake .35s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px}
.match .col{display:flex;flex-direction:column;gap:8px}
.pool{display:flex;flex-wrap:wrap;gap:8px;min-height:48px;padding:10px;border:2px dashed var(--line);border-radius:14px;margin-bottom:14px}
.buckets{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.bucket{border:2px solid var(--line);border-radius:14px;padding:10px;min-height:110px;cursor:pointer;background:var(--card);display:flex;flex-direction:column;gap:6px}
.bucket h4{margin:0 0 4px;font-size:17px;text-align:center;color:var(--u)}
.bucket .chip{font-size:14px;padding:4px 8px;pointer-events:none}
.bucket.armed{border-color:var(--u);border-style:dashed}
.slots{display:flex;flex-wrap:wrap;gap:8px;align-items:center;min-height:52px;padding:10px;border:2px solid var(--line);border-radius:14px;margin-bottom:12px;background:var(--paper)}
.slots .n{font-family:var(--display);color:var(--u);margin-inline-end:2px}
.tfcard{text-align:center;padding:10px}
.tfcard .st{font-size:21px;font-weight:600;margin:10px auto 18px;max-width:40ch}
.tfcard .row{display:flex;gap:12px;justify-content:center}
.tfbtn{min-width:120px;font-size:20px}
.feedback{margin-top:14px;padding:12px 14px;border-radius:12px;font-weight:600}
.feedback.good{background:color-mix(in srgb,var(--ok) 14%,var(--card));border-inline-start:6px solid var(--ok)}
.feedback.bad{background:color-mix(in srgb,var(--bad) 12%,var(--card));border-inline-start:6px solid var(--bad)}
.fill p{margin:8px 0;line-height:2.3}
.blank{display:inline-block;min-width:110px;border-bottom:3px solid var(--line);text-align:center;padding:0 6px;cursor:pointer;font-weight:700;border-radius:6px 6px 0 0}
.blank.active{border-bottom-color:var(--u);background:var(--soft)}
.blank.good{border-bottom-color:var(--ok);color:var(--ok)}
.bank{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;position:sticky;bottom:calc(env(safe-area-inset-bottom,0px) + 8px);background:var(--card);padding:10px;border:2px solid var(--line);border-radius:14px}
.done{text-align:center;padding:18px;border-radius:16px;background:var(--soft);margin-top:14px}
.done b{font-family:var(--display);font-size:30px;font-weight:400;color:var(--u);display:block}

/* sims */
.sim{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:18px;align-items:start}
.stage{background:var(--paper);border:2px solid var(--line);border-radius:18px;padding:10px;display:grid;place-items:center;min-height:300px;position:relative;overflow:hidden}
.stage svg{width:100%;height:auto;max-height:470px}
.side h3{font-size:24px;color:var(--u);margin-bottom:6px}
.side .info{background:var(--soft);border-radius:14px;padding:12px 14px;margin:10px 0;min-height:70px}
.ctrls{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
[data-part]{cursor:pointer;transition:filter .15s,opacity .2s}
[data-part]:hover{filter:brightness(1.12) drop-shadow(0 0 4px rgba(0,0,0,.25))}
[data-part].hl{filter:drop-shadow(0 0 6px var(--sun)) brightness(1.15)}
[data-part].hit{animation:pop .4s}
@keyframes pop{50%{transform:scale(1.06)}}
.score{font-family:var(--display);font-size:22px;color:var(--u)}
.meter{height:14px;border-radius:999px;background:var(--line);overflow:hidden;margin:4px 0 10px}
.meter i{display:block;height:100%;background:var(--u);transition:width .4s}
.kv{display:flex;justify-content:space-between;font-weight:600;font-size:15px}
.tiles{display:grid;gap:8px}
.tile{border:2px solid var(--line);background:var(--card);border-radius:14px;padding:8px;cursor:pointer;text-align:center;font-weight:600;font-size:15px;line-height:1.4}
.tile .e{font-size:34px;display:block;line-height:1.2}
.tile.used{opacity:.3;cursor:default}
.tile.good{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,var(--card))}
.tile.badx,.btn.badx{border-color:var(--bad)!important}
.chain{display:flex;flex-wrap:wrap;align-items:center;gap:6px;justify-content:center;min-height:120px;padding:10px;border:2px dashed var(--line);border-radius:16px;margin:12px 0;background:var(--paper)}
.chain .arr{font-size:26px;color:var(--u);font-weight:800}
.chain .tile{min-width:86px}
.role{display:block;font-size:12px;color:var(--u);margin-top:2px}
table.res{width:100%;border-collapse:collapse;font-size:15px}
table.res th,table.res td{border-bottom:1px solid var(--line);padding:6px;text-align:center}
.tablewrap{overflow-x:auto}
.bars .bar{display:grid;grid-template-columns:110px 1fr 54px;gap:8px;align-items:center;font-size:15px;margin:5px 0}
.bars .bar i{display:block;height:16px;border-radius:999px;background:var(--u);min-width:4px;transition:width .5s}
.beat{transform-box:fill-box;transform-origin:center;animation:beat var(--bt,0.8s) ease-in-out infinite}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.09)}30%{transform:scale(.98)}}
.bigtap{width:170px;height:170px;border-radius:50%;border:0;background:var(--u);color:#fff;font-family:var(--display);font-size:24px;cursor:pointer;box-shadow:0 8px 0 color-mix(in srgb,var(--u) 60%,#000);transition:transform .08s}
.bigtap:active{transform:translateY(5px);box-shadow:0 3px 0 color-mix(in srgb,var(--u) 60%,#000)}

/* quiz */
.qlib{display:grid;grid-template-columns:320px 1fr;gap:22px;align-items:start}
.qscopes{display:flex;flex-direction:column;gap:4px;max-height:70vh;overflow:auto;padding-inline-end:4px}
.qscopes button{display:flex;justify-content:space-between;gap:8px;text-align:start;border:2px solid transparent;background:none;border-radius:10px;padding:7px 10px;cursor:pointer;font-weight:600}
.qscopes button[aria-pressed="true"]{border-color:var(--u);background:var(--soft)}
.qscopes .grp{font-family:var(--display);font-size:20px;color:var(--u);margin:10px 4px 2px}
.qscopes em{font-style:normal;color:var(--muted);font-size:13px;white-space:nowrap}
.opt{display:flex;flex-direction:column;gap:6px;margin:14px 0}
.opt label{font-weight:700}
.qcard .qtop{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-weight:700;color:var(--muted)}
.qprog{height:8px;background:var(--line);border-radius:999px;overflow:hidden;margin:8px 0 16px}
.qprog i{display:block;height:100%;background:var(--u);transition:width .3s}
.qtext{font-size:22px;font-weight:700;margin:6px 0 16px;line-height:1.6}
.answers{display:grid;gap:10px}
.ans{border:2px solid var(--line);background:var(--card);border-radius:14px;padding:12px 16px;text-align:start;cursor:pointer;font-weight:600;display:flex;gap:12px;align-items:center}
.ans .k{width:30px;height:30px;border-radius:50%;background:var(--soft);color:var(--u);display:grid;place-items:center;font-family:var(--display);flex:none}
.ans:hover:not([disabled]){border-color:var(--u)}
.ans.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,var(--card))}
.ans.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--card))}
.ans.picked{border-color:var(--u);background:var(--soft)}
.ans[disabled]{cursor:default}
.timer{font-family:var(--display);font-size:22px;color:var(--u)}
.result{text-align:center}
.result .pct{font-family:var(--display);font-size:86px;line-height:1;color:var(--u)}
.review{margin-top:16px;text-align:start}
.review .it{border-bottom:1px solid var(--line);padding:10px 0}
.review .it.x b{color:var(--bad)}
.review .it .c{color:var(--ok);font-weight:700}
.toast{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:12px;font-weight:700;z-index:50;opacity:0;transition:opacity .25s;pointer-events:none}
.toast.show{opacity:1}

@media (max-width:820px){
  .hero{grid-template-columns:1fr}
  .lrows{grid-template-columns:1fr}
  .ideas{grid-template-columns:1fr}
  .sim{grid-template-columns:1fr}
  .qlib{grid-template-columns:1fr}
  .qscopes{max-height:none;flex-direction:row;flex-wrap:wrap}
  .qscopes .grp{width:100%}
  .match{grid-template-columns:1fr 1fr;gap:8px}
  .brand span{font-size:18px;white-space:nowrap}
  .brand svg{width:24px;height:24px}
  header.top .wrap{gap:6px;padding:0 10px}
  .navs button{padding:5px 8px;font-size:15px}
  .lhead{gap:12px}
  .lhead .big{font-size:56px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <button class="brand" id="homeBtn" aria-label="الرئيسية"><svg viewBox="0 0 40 40" aria-hidden="true"><path d="M15 4h10v3h-2v9l10 17a3 3 0 0 1-2.6 4.5H9.6A3 3 0 0 1 7 33l10-17V7h-2z" fill="var(--u3)"/><path d="M11 27h18l3.5 6a1.5 1.5 0 0 1-1.3 2.2H8.8A1.5 1.5 0 0 1 7.5 33z" fill="var(--sun)"/><circle cx="18" cy="30" r="1.6" fill="#fff"/><circle cx="23" cy="27.5" r="1.1" fill="#fff"/></svg><span>مختبر العلوم</span></button>
  <nav class="navs" aria-label="التنقل">
    <button data-go="#/">الدروس</button>
    <button data-go="#/quiz">مكتبة الاختبارات</button>
    <button class="iconbtn" id="sndBtn" aria-label="الصوت" title="الصوت">🔊</button>
  </nav>
</div></header>
<main><div class="wrap" id="app"></div></main>
<div class="toast" id="toast" role="status"></div>
<script>
const UNITS=[
 {n:1,t:'جسم الإنسان',c:'var(--u1)',s:'var(--soft1)',d:'أعضاء الجسم وكيف تعمل معًا لتبقينا أحياء وأصحاء'},
 {n:2,t:'الكائنات الحية في البيئة',c:'var(--u2)',s:'var(--soft2)',d:'السلاسل الغذائية، وكيف يؤثر الإنسان في البيئة وكيف يحميها'},
 {n:3,t:'تغيرات المادة',c:'var(--u3)',s:'var(--soft3)',d:'التغيرات القابلة وغير القابلة للعكس، والمخاليط والذوبان والمحاليل'}
];
const L=[
{id:'1-1',u:1,t:'أعضاء الجسم',v:['الأعضاء','أجهزة الجسم'],sim:'body',
k:['الأجزاء الداخلية للجسم تُسمّى الأعضاء، ويقوم كل عضو بوظيفة مختلفة تُبقينا على قيد الحياة وبصحة جيدة.',
'تعمل الأعضاء المختلفة معًا لتُشكّل أجهزة الجسم.',
'أعضاء الجسم الرئيسية: الدماغ، والقلب، والرئتان، والمعدة، والأمعاء، والكليتان، والكبد.',
'الكبد عضو لا يمكننا العيش بدونه، ومن أهم وظائفه تخزين الطاقة وتخليص الجسم من المواد السامة.',
'بعض الحيوانات مثل قناديل البحر لا تملك أعضاء، وإنما تملك أجزاء بسيطة تؤدي وظائف الجسم.'],
acts:[

/* ---------- activity engines ---------- */
function finishBox(box,msg,again){const d=document.createElement('div');d.className='done';d.innerHTML=`<b>أحسنت!</b><div>${msg}</div><button class="btn u sm" style="margin-top:10px">العب مرة أخرى</button>`;d.querySelector('button').onclick=again;box.appendChild(d);sfx.win()}
function runAct(box,a,onWin){({match:actMatch,sort:actSort,order:actOrder,tf:actTF,fill:actFill})[a.type](box,a,onWin)}
function actMatch(box,a,onWin){
  let mistakes=0,selL=null,selR=null,left=0;
  const L1=shuffle(a.pairs.map((p,i)=>({t:p[0],i}))),R1=shuffle(a.pairs.map((p,i)=>({t:p[1],i})));

  left=a.pairs.length;
  const check=()=>{if(!selL||!selR)return;if(selL.dataset.i===selR.dataset.i){[selL,selR].forEach(b=>{b.classList.remove('sel');b.classList.add('good');b.disabled=true});sfx.ok();left--;if(!left){onWin();finishBox(box,mistakes?`عدد المحاولات الخاطئة: ${mistakes}`:'بدون أي خطأ!',()=>actMatch(box,a,onWin))}}else{mistakes++;sfx.bad();[selL,selR].forEach(b=>{b.classList.remove('sel');b.classList.add('shake');setTimeout(()=>b.classList.remove('shake'),400)})}selL=selR=null};
  $$('.chip',box).forEach(b=>b.onclick=()=>{if(b.disabled)return;sfx.tap();if(b.dataset.s==='l'){if(selL)selL.classList.remove('sel');selL=b}else{if(selR)selR.classList.remove('sel');selR=b}b.classList.add('sel');check()});
}
function actSort(box,a,onWin){
  let mistakes=0,sel=null;const items=shuffle(a.items.map((x,i)=>({t:x[0],b:x[1],i})));
  box.innerHTML=`<p class="prompt">اختر بطاقة، ثم اضغط على المجموعة المناسبة لها.</p><div class="pool">${items.map(x=>`<button class="chip" data-i="${x.i}">${x.t}</button>`).join('')}</div><div class="buckets">${a.buckets.map((b,i)=>`<div class="bucket" role="button" tabindex="0" data-b="${i}"><h4>${b}</h4></div>`).join('')}</div>`;

function actOrder(box,a,onWin,ri=0){
  const r=a.rounds[ri];const pool=shuffle(r.items.map((t,i)=>({t,i})));let ans=[];
  const draw=()=>{box.innerHTML=`<p class="prompt">${r.p}${a.rounds.length>1?` <span class="hint">(${ri+1} من ${a.rounds.length})</span>`:''}</p>
  <div class="slots" aria-label="ترتيبك">${ans.length?ans.map((x,k)=>`${k?'<span class="arr" style="color:var(--u);font-weight:800">←</span>':''}<button class="chip" data-a="${k}"><span class="n">${k+1}</span> ${x.t}</button>`).join(''):'<span class="hint">اضغط على البطاقات أدناه بالترتيب الصحيح</span>'}</div>
  <div class="pool">${pool.filter(x=>!ans.includes(x)).map(x=>`<button class="chip" data-p="${x.i}">${x.t}</button>`).join('')||'<span class="hint">اضغط تحقق</span>'}</div>
  <div class="ctrls"><button class="btn u" id="chk" ${ans.length<r.items.length?'disabled':''}>تحقّق</button><button class="btn ghost" id="rst">إعادة</button></div><div id="fb"></div>`;

function actFill(box,a,onWin){
  const bank=shuffle([...new Set([...a.sents.map(s=>s[1]),...(a.extra||[])])]);const filled=a.sents.map(()=>false);let active=0,mistakes=0;

  $$('.blank',box).forEach(b=>b.onclick=()=>{if(!filled[+b.dataset.i]){active=+b.dataset.i;mark()}});

/* ---------- quiz engine ---------- */
function prepQ(item){const [q,o,e]=item.q;const opts=shuffle(o.map((t,i)=>({t,c:i===0})));return{q,opts,e,l:item.l,ans:o[0]}}
function startQuiz(box,pool,opt){
  const n=Math.min(opt.count||pool.length,pool.length);
  const qs=shuffle(pool).slice(0,n).map(prepQ);let i=0,score=0,picks=[],timer=null,tl=0;
  const stopT=()=>{clearInterval(timer);timer=null};addCleanup(stopT);
  const end=()=>{stopT();const pct=Math.round(score/qs.length*100);const k=opt.key;const prevBest=store.best[k]||0;if(pct>prevBest){store.best[k]=pct;save()}
    opt.onDone&&opt.onDone(pct);if(pct>=80)sfx.win();
    const msg=pct>=90?'ممتاز! أنت عالم صغير.':pct>=75?'رائع! أداء قوي.':pct>=60?'جيد، راجع الأسئلة الخاطئة.':'تحتاج إلى مراجعة الدرس ثم المحاولة مجددًا.';
    box.innerHTML=`<div class="result"><div class="hint">${opt.title}</div><div class="pct">${pct}%</div><div style="font-weight:700">${score} من ${qs.length} إجابة صحيحة. ${msg}</div><div class="hint">أفضل نتيجة: ${Math.max(pct,prevBest)}%</div>
    <div class="ctrls" style="justify-content:center"><button class="btn u" id="again">اختبار جديد</button>${opt.back?'<button class="btn ghost" id="back">العودة إلى المكتبة</button>':''}</div>
    <div class="review">${qs.map((q,k)=>{const p=picks[k];const ok=p&&p.c;return`<div class="it ${ok?'':'x'}"><b>${k+1}. ${q.q}</b><div>${ok?'✓ ':'✗ إجابتك: '+(p?p.t:'لم تُجب')+'<br>'}<span class="c">الإجابة الصحيحة: ${q.ans}</span>${q.e?`<div class="hint">${q.e}</div>`:''}${!ok&&opt.showLesson?`<div class="hint">راجع الدرس <a href="#/l/${q.l}">${q.l}</a></div>`:''}</div></div>`}).join('')}</div></div>`;
    $('#again',box).onclick=()=>startQuiz(box,pool,opt);if(opt.back)$('#back',box).onclick=opt.back};
  const show=()=>{const q=qs[i];
    box.innerHTML=`<div class="qcard"><div class="qtop"><span>${opt.title}</span><span>${opt.timer?'<span class="timer" id="tm"></span> ':''}السؤال ${i+1} من ${qs.length}</span></div><div class="qprog"><i style="width:${i/qs.length*100}%"></i></div>
    <div class="qtext">${q.q}</div><div class="answers">${q.opts.map((o,k)=>`<button class="ans" data-k="${k}"><span class="k">${'أبجد'[k]}</span><span>${o.t}</span></button>`).join('')}</div><div id="fb"></div></div>`;
    const pick=k=>{stopT();const o=k==null?null:q.opts[k];picks[i]=o;if(o&&o.c)score++;
      $$('.ans',box).forEach((b,j)=>{b.disabled=true;if(opt.mode==='practice'){if(q.opts[j].c)b.classList.add('right');else if(j===k)b.classList.add('wrong')}else if(j===k)b.classList.add('picked')});
      if(opt.mode==='practice'){o&&o.c?sfx.ok():sfx.bad();$('#fb',box).innerHTML=`<div class="feedback ${o&&o.c?'good':'bad'}">${o&&o.c?'إجابة صحيحة!':(o?'إجابة غير صحيحة.':'انتهى الوقت.')+' الإجابة الصحيحة: '+q.ans}${q.e?'<div class="hint">'+q.e+'</div>':''}<div style="margin-top:8px"><button class="btn sm" id="nx">${i+1<qs.length?'السؤال التالي':'عرض النتيجة'}</button></div></div>`;$('#nx',box).onclick=nxt;$('#nx',box).focus()}
      else setTimeout(nxt,k==null?600:380)};
    const nxt=()=>{i++;i<qs.length?show():end()};
    $$('.ans',box).forEach(b=>b.onclick=()=>pick(+b.dataset.k));
    if(opt.timer){tl=opt.timer;const tm=$('#tm',box);tm.textContent=tl+'ث';timer=setInterval(()=>{if(!box.isConnected){stopT();return}tl--;if(tm.isConnected)tm.textContent=tl+'ث';if(tl<=0)pick(null)},1000)}};
  show();
}

}

const SIMS={};
function raf(fn){let id,on=true;const loop=t=>{if(!on)return;fn(t);id=requestAnimationFrame(loop)};id=requestAnimationFrame(loop);const stop=()=>{on=false;cancelAnimationFrame(id)};addCleanup(stop);return stop}

function hotspotSim(box,o,onDone){
  box.innerHTML=`<div class="sim"><div class="stage">${o.svg}</div><div class="side"><h3>${o.title}</h3><p class="hint">${o.intro}</p>
  <div class="seg" id="hm"><button data-m="ex" aria-pressed="true">استكشف</button><button data-m="ch" aria-pressed="false">تحدَّ نفسك</button></div>
  <div class="info" id="info">اضغط على أي جزء في الرسم لتتعرّف عليه.</div>${o.extra||''}</div></div>`;
  const info=$('#info',box);let mode='ex',queue=[],score=0,miss=0;
  const parts=()=>$$('[data-part]',box);
  const clearHL=()=>parts().forEach(p=>p.classList.remove('hl'));
  const ask=()=>{if(!queue.length){info.innerHTML=`<b>انتهى التحدي!</b><br>أصبت ${score} من ${o.challenge.length}${miss?` مع ${miss} محاولة خاطئة`:''}.<div style="margin-top:8px"><button class="btn u sm" id="rep">أعد التحدي</button></div>`;$('#rep',box).onclick=startCh;sfx.win();onDone();return}info.innerHTML=`<span class="score">${score} من ${o.challenge.length}</span><br><b>اضغط على: ${queue[0].p}</b>`};
  const startCh=()=>{queue=shuffle(o.challenge);score=0;miss=0;clearHL();ask()};
  $$('#hm button',box).forEach(b=>b.onclick=()=>{mode=b.dataset.m;$$('#hm button',box).forEach(x=>x.setAttribute('aria-pressed',String(x===b)));clearHL();if(mode==='ch')startCh();else info.textContent='اضغط على أي جزء في الرسم لتتعرّف عليه.'});
  box.addEventListener('click',e=>{const p=e.target.closest('[data-part]');if(!p||!box.contains(p))return;const id=p.dataset.part;
    if(mode==='ex'){clearHL();$$(`[data-part="${id}"]`,box).forEach(x=>x.classList.add('hl'));const d=o.parts[id];info.innerHTML=`<b>${d.n}</b><br>${d.i}`;sfx.tap();o.seen=o.seen||new Set();o.seen.add(id);if(o.seen.size===Object.keys(o.parts).length)onDone()}
    else if(queue.length){if(id===queue[0].id){score++;sfx.ok();p.classList.add('hit');setTimeout(()=>p.classList.remove('hit'),400);queue.shift();ask()}else{miss++;sfx.bad();info.querySelector('b')&&(info.querySelector('b').innerHTML=`ليس هذا (${o.parts[id].n}). اضغط على: ${queue[0].p}`)}}});
  return box;
}

SIMS.forest=(box,l,done)=>{

SIMS.acid=(box,l,done)=>{

   <div class="info" id="lki">البحيرة سليمة: حشرات كثيرة وبيض، والضفادع تجد غذاءها.</div></div></div>`;
  const leaf=(x,y,r,c,fall)=>`<path d="M${x} ${y}c${r?18:-18} -6 ${r?30:-30} -18 ${r?28:-28} -30c${r?-16:16} 0 ${r?-28:28} 12 ${r?-28:28} 30z" fill="${c}" ${fall?`transform="translate(${r?14:-14} ${fall}) rotate(${r?40:-40} ${x} ${y})"`:''}/>`;

SIMS.recycle=(box,l,done)=>{
  const M=[{e:'📰',n:'الورق',s:['📰 جمع الصحف والدفاتر القديمة','🏭 معالجتها لتصبح منتجًا جديدًا','📄 ورق جديد'],b:'إعادة تدوير الورق تعني قطع أشجار أقل؛ لأن الورق يُصنع من لب الخشب.'},
  {e:'🍾',n:'الزجاج',s:['🍾 جمع القوارير والأوعية الزجاجية','🔥 صهر الزجاج','🫙 إعادة تشكيله أوعية جديدة'],b:'يظل الزجاج محافظًا على قوته بعد إعادة تدويره.'},
  {e:'🥫',n:'الألومنيوم',s:['🥫 جمع علب المشروبات المعدنية','🔥 صهر العلب','🥤 صناعة علب جديدة'],b:'استخراج الألومنيوم من الصخور يحتاج إلى طاقة كبيرة، أما إعادة التدوير فتستهلك طاقة أقل.'},
  {e:'🛍️',n:'البلاستيك',s:['🛍️ البلاستيك لا يتحلل','💰 إعادة تدويره ممكنة لكنها مكلفة','👜 قلّل استخدامه وأعد استخدامه'],b:'لا تستخدم أكياسًا بلاستيكية جديدة كل مرة؛ استخدم حقيبة قماشية.'},
  {e:'🍌',n:'مخلفات الحديقة والطعام',s:['🍂 اجمع القشور والأوراق والأعشاب الضارة','🛍️ ضعها في كيس وأضف قليلًا من الماء','⏳ اتركها في مكان دافئ عدة أسابيع','🌱 ضع السماد حول نباتاتك'],b:'السماد غامق اللون وطري القوام، وهو مفيد للتربة ويساعد النباتات على النمو بشكل أفضل.'}];
  let mi=0,si=0;const fin=new Set();
  const draw=()=>{const m=M[mi];const land=100-fin.size*18;
    box.innerHTML=`<h3 style="font-size:24px;color:var(--u)">مصنع إعادة التدوير</h3><p class="hint">اختر مادة وتتبّع رحلتها خطوة بخطوة. كل مادة تُعيد تدويرها تقلل حجم مردم النفايات.</p>
    <div class="tiles" style="grid-template-columns:repeat(auto-fit,minmax(110px,1fr))">${M.map((x,k)=>`<button class="tile" data-m="${k}" style="${k===mi?'border-color:var(--u);background:var(--soft)':''}"><span class="e">${x.e}</span>${x.n}${fin.has(k)?' ✓':''}</button>`).join('')}</div>
    <div class="chain">${m.s.slice(0,si+1).map((x,k)=>`${k?'<span class="arr">←</span>':''}<div class="tile" style="cursor:default;max-width:180px">${x}</div>`).join('')}</div>
    <div class="ctrls"><button class="btn u" id="st">${si<m.s.length-1?'الخطوة التالية':'تمت إعادة التدوير ✓'}</button></div>
    <div class="info">${si===m.s.length-1?'<b>'+m.b+'</b>':'اضغط «الخطوة التالية».'}</div>
    <div class="kv"><span>🗑️ حجم مردم النفايات</span><span>${land}%</span></div><div class="meter"><i style="width:${land}%;background:#8a6a4a"></i></div>`;
    $$('[data-m]',box).forEach(b=>b.onclick=()=>{mi=+b.dataset.m;si=0;draw()});
    $('#st',box).onclick=()=>{if(si<m.s.length-1){si++;sfx.tap();if(si===m.s.length-1){fin.add(mi);sfx.ok();if(fin.size>=3)done()}draw()}else{const nx=M.findIndex((x,k)=>!fin.has(k));if(nx>=0){mi=nx;si=0;draw()}else{sfx.win();toast('أعدت تدوير كل المواد!')}}}};
  draw();
};

SIMS.house=(box,l,done)=>{
  const H=[['🚰','صنبور يقطر','🚰✅','أحكمتَ غلق الصنبور وعالجت التسرب','💧'],['🛁','حوض استحمام ممتلئ','🚿','استحممت بالرشاش بدلًا من ملء الحوض','💧'],['🌧️','مياه أمطار تضيع','🛢️','جمعت مياه الأمطار في خزان لري النباتات والغسيل','💧'],['💡','مصباح مضاء في غرفة فارغة','🌙','أطفأت الكهرباء لأنك لا تستخدمها','⚡'],['📺','تلفاز يعمل ولا أحد يشاهده','📴','أطفأت التلفاز','⚡'],['🚗','السيارة لمشوار قريب','🚲','مشيت أو ركبت الدراجة','⚡'],['🔦','إنارة الحديقة بمصابيح عادية','☀️','استخدمت مصابيح الطاقة الشمسية','⚡'],['🛍️','كيس بلاستيكي على الشاطئ','🗑️','وضعت الكيس في سلة المهملات لحماية السلاحف','🧹']];
  const fixed=new Set();
  const draw=()=>{const c=k=>H.filter((h,i)=>h[4]===k&&fixed.has(i)).length,t=k=>H.filter(h=>h[4]===k).length;
    box.innerHTML=`<div class="sim"><div class="stage" style="align-content:start"><div class="tiles" style="grid-template-columns:repeat(auto-fit,minmax(120px,1fr));width:100%">${H.map((h,i)=>`<button class="tile ${fixed.has(i)?'good':''}" data-i="${i}" style="${fixed.has(i)?'border-color:var(--ok)':''}"><span class="e">${fixed.has(i)?h[2]:h[0]}</span>${fixed.has(i)?h[3]:h[1]}</button>`).join('')}</div></div>
    <div class="side"><h3>بطل البيئة في البيت</h3><p class="hint">ابحث عن مواقف تهدر الماء أو الطاقة أو تلوث البيئة، واضغط عليها لإصلاحها.</p>
     <div class="kv"><span>💧 توفير الماء</span><span>${c('💧')} من ${t('💧')}</span></div><div class="meter"><i style="width:${c('💧')/t('💧')*100}%;background:#2F7DD1"></i></div>
     <div class="kv"><span>⚡ توفير الطاقة</span><span>${c('⚡')} من ${t('⚡')}</span></div><div class="meter"><i style="width:${c('⚡')/t('⚡')*100}%;background:var(--sun)"></i></div>
     <div class="kv"><span>🧹 بيئة نظيفة</span><span>${c('🧹')} من ${t('🧹')}</span></div><div class="meter"><i style="width:${c('🧹')/t('🧹')*100}%"></i></div>
     <div class="info" id="hi">${fixed.size===H.length?'<b>رائع! أصبحت بطل البيئة.</b> العناية بالبيئة تبدأ من عاداتنا اليومية.':'كل مصدر نحافظ عليه يحمي بيئتنا.'}</div></div></div>`;
    $$('[data-i]',box).forEach(b=>b.onclick=()=>{const i=+b.dataset.i;if(fixed.has(i))return;fixed.add(i);sfx.ok();if(fixed.size===H.length){sfx.win();done()}draw()})};
  draw();
};

SIMS.heat=(box,l,done)=>{
  const IT=[['🧊','مكعب ثلج','💧','انصهر وأصبح ماءً سائلًا','🧊','تجمّد وعاد ثلجًا',1],['🍫','قطعة شوكولاتة','🫗','ذابت وأصبحت سائلة','🍫','تجمّدت وعادت صلبة',1],['🕯️','شمعة','🫗','انصهر الشمع','🕯️','تجمّد الشمع وعاد صلبًا',1],['🥚','بيضة نيئة','🍳','أصبحت بيضة مطبوخة','🍳','ما زالت مطبوخة',0],['🌽','حبيبات ذرة','🍿','فرقعت وأصبحت فشارًا','🍿','ما زالت فشارًا',0],['🪵','عود ثقاب','⚫','احترق وأصبح أسود اللون (كربون)','⚫','ما زال أسود',0],['🥣','خليط الكعكة','🎂','أصبح كعكة','🎂','ما زالت كعكة',0]];
  let i=0,step=0,pred=null,score=0;const doneSet=new Set();
  const draw=()=>{const it=IT[i];
    box.innerHTML=`<div class="sim"><div class="stage" style="gap:8px"><div style="font-size:96px;line-height:1">${step===0?it[0]:step===1?it[2]:it[4]}</div><div style="font-weight:700">${step===0?it[1]:step===1?it[3]:it[5]}</div><div style="font-size:30px">${step===1?'🔥':step===2?'❄️':''}</div></div>
    <div class="side"><h3>مختبر الحرارة</h3><p class="hint">اختر مادة، وتنبأ بنوع التغيّر، ثم سخّنها وبرّدها لتختبر تنبؤك.</p>
     <div class="tiles" style="grid-template-columns:repeat(auto-fit,minmax(78px,1fr))">${IT.map((x,k)=>`<button class="tile" data-k="${k}" style="${k===i?'border-color:var(--u);background:var(--soft)':''}"><span class="e">${x[0]}</span>${doneSet.has(k)?'✓':''}</button>`).join('')}</div>
     <div class="info" id="hi"></div><div class="ctrls" id="hb"></div><div class="kv"><span>تنبؤات صحيحة</span><span>${score} من ${doneSet.size}</span></div></div></div>`;
    const hi=$('#hi',box),hb=$('#hb',box);
    if(step===0&&pred===null){hi.innerHTML=`<b>${it[1]}</b>: ماذا تتوقع؟ إذا سخّناها ثم برّدناها، هل ستعود إلى حالتها الأولى؟`;hb.innerHTML='<button class="btn u sm" data-p="1">أتوقع: قابل للعكس</button><button class="btn ghost sm" data-p="0">أتوقع: غير قابل للعكس</button>';$$('[data-p]',box).forEach(b=>b.onclick=()=>{pred=+b.dataset.p;draw()})}
    else if(step===0){hi.innerHTML='سجّلنا تنبؤك. الآن سخّن المادة.';hb.innerHTML='<button class="btn u" id="h1">🔥 سخّن</button>';$('#h1',box).onclick=()=>{step=1;tone(300,.3,'sawtooth',.03);draw()}}
    else if(step===1){hi.innerHTML='الحرارة سببت تغيّرًا في المادة. الآن برّدها في الثلاجة.';hb.innerHTML='<button class="btn u" id="h2">❄️ برّد</button>';$('#h2',box).onclick=()=>{step=2;draw()}}
    else{const r=it[6]===1,ok=pred===it[6];if(!doneSet.has(i)){doneSet.add(i);if(ok)score++;ok?sfx.ok():sfx.bad();if(doneSet.size>=4)done();draw();return}
      hi.innerHTML=`<b>${r?'تغيّر قابل للعكس':'تغيّر غير قابل للعكس'}</b>: ${r?'عادت المادة إلى حالتها الأولى بعد التبريد.':'لم تعد المادة إلى حالتها الأولى، فقد تحوّلت إلى مادة جديدة.'} ${ok?'تنبؤك صحيح!':'تنبؤك لم يكن صحيحًا، وهذا جزء من التعلم.'}`;
      hb.innerHTML='<button class="btn u sm" id="nx">المادة التالية</button>';$('#nx',box).onclick=()=>{const n=IT.findIndex((x,k)=>!doneSet.has(k));i=n>=0?n:(i+1)%IT.length;step=0;pred=null;draw()}}
    $$('[data-k]',box).forEach(b=>b.onclick=()=>{i=+b.dataset.k;step=0;pred=null;draw()})};
  draw();
};

const SEP={solid:{methods:['الفرز باليد','الغربال'],mix:[['فول سوداني وزبيب','🥜🍇',0,'الحبات كبيرة ويمكن رؤيتها بسهولة، فنفصلها بالفرز باليد.'],['حصى وتربة','🪨🟫',1,'يسمح الغربال بمرور حبيبات التربة الصغيرة ويحجز الحصى الكبيرة، كما يفعل المزارع.'],['أرز ودقيق','🍚🌾',1,'يمر الدقيق الناعم من ثقوب الغربال وتبقى حبات الأرز.'],['حبات فاصوليا وخرز ملون','🫘🔵',0,'الحبات والخرز كبيرة ومختلفة الشكل واللون، فيسهل فرزها باليد.'],['بازلاء ودقيق','🟢🌾',1,'يمر الدقيق من الغربال وتبقى حبيبات البازلاء.'],['الملح والرمل','🧂🏖️',-1,'حبيبات الملح والرمل صغيرة جدًّا ولا يفصلها الفرز ولا الغربال بسهولة؛ سنتعلم طريقة فصلها في درس الترشيح.']]},
 liquid:{methods:['الترشيح','الإذابة ثم الترشيح','لا يُفصل بالترشيح'],mix:[['رمل وماء','🏖️💧',0,'الرمل لا يذوب، فيبقى على ورقة الترشيح ويمر الماء صافيًا.','#C9A86A','#BFE3F7'],['دقيق وماء','🌾💧',0,'الدقيق لا يذوب في الماء؛ يبقى على ورقة الترشيح ويمر الماء.','#F1EBDD','#D6EDF8'],['حبيبات القهوة المطحونة والماء الساخن','☕',0,'تبقى حبيبات القهوة على ورقة الترشيح كما في صنع القهوة، ويمر السائل.','#4A2E1F','#A87A55'],['ملح ورمل','🧂🏖️',1,'نضيف الماء فيذوب الملح ويمر مع الماء عبر المرشح، ويبقى الرمل على الورقة.','#C9A86A','#D9EEF8'],['ماء محلّى بالسكر','🍬💧',2,'السكر ذائب، وجزيئاته الصغيرة تمر عبر ثقوب المرشح مع الماء، فلا يفصله الترشيح.','#ffffff','#E9F2FB']]}};
SIMS.sep=(box,l,done)=>{
  const S=SEP[l.simArg];let mi=0;const solved=new Set();
  const draw=(state)=>{const m=S.mix[mi];const liquid=l.simArg==='liquid';
    const vis=liquid?`<svg viewBox="0 0 200 240" style="max-height:300px"><path d="M40 20H160L112 92V118H88V92Z" fill="none" stroke="var(--ink)" stroke-width="3"/><path d="M52 26H148L106 84H94Z" fill="${state==='ok'?m[4]:'#fff'}" stroke="#ccc" stroke-width="2" opacity="${state==='ok'?1:.6}"/><rect x="50" y="130" width="100" height="100" rx="10" fill="none" stroke="var(--ink)" stroke-width="3"/><rect x="53" y="${state==='ok'?170:226}" width="94" height="${state==='ok'?57:1}" rx="8" fill="${m[5]}" style="transition:all 1s"/>${state==='ok'?'<path d="M100 120v40" stroke="#7FC4EE" stroke-width="3" stroke-dasharray="4 6"/>':''}</svg>`:`<div style="font-size:84px;line-height:1">${state==='ok'?Array.from(m[1]).join(' '):m[1]}</div>`;
    box.innerHTML=`<div class="sim"><div class="stage" style="gap:10px">${vis}<div style="font-weight:700">${m[0]}</div></div>
    <div class="side"><h3>${liquid?'مختبر الترشيح':'مختبر فصل المخاليط'}</h3><p class="hint">اختر مخلوطًا، ثم اختر أفضل طريقة لفصل مكوّناته.</p>
     <div class="tiles" style="grid-template-columns:repeat(auto-fit,minmax(120px,1fr))">${S.mix.map((x,k)=>`<button class="tile" data-k="${k}" style="${k===mi?'border-color:var(--u);background:var(--soft)':''}">${x[0]}${solved.has(k)?' ✓':''}</button>`).join('')}</div>
     <p style="font-weight:700;margin:12px 0 6px">كيف تفصله؟</p><div class="ctrls">${S.methods.map((x,k)=>`<button class="btn ghost sm" data-m="${k}">${x}</button>`).join('')}${l.simArg==='solid'?'<button class="btn ghost sm" data-m="-1">لا تنفع الطريقتان</button>':''}</div>
     <div class="info" id="si">${state==='ok'?'<b>صحيح!</b> '+m[3]:'المخلوط يتكوّن من مادتين أو أكثر لم تتفاعلا، لذا يمكن فصلهما.'}</div></div></div>`;
    $$('[data-k]',box).forEach(b=>b.onclick=()=>{mi=+b.dataset.k;draw()});
    $$('[data-m]',box).forEach(b=>b.onclick=()=>{if(+b.dataset.m===m[2]){sfx.ok();solved.add(mi);if(solved.size>=Math.min(4,S.mix.length))done();draw('ok')}else{sfx.bad();b.classList.add('shake','badx');setTimeout(()=>b.classList.remove('shake'),400);$('#si',box).innerHTML='ليست أفضل طريقة. فكّر: هل الجزيئات كبيرة أم صغيرة؟ وهل تذوب في الماء أم لا؟'}})};
  draw();
};

SIMS.dissolve=(box,l,done)=>{
  const SB=[['السكر','🍬',0,'rgba(255,255,255,.0)'],['الملح','🧂',0,'rgba(255,255,255,0)'],['القهوة سريعة الذوبان','☕',0,'rgba(120,70,30,.45)'],['مسحوق المشروب البارد','🍹',0,'rgba(230,80,140,.4)'],['الرمل','🏖️',2,''],['الدقيق (الطحين)','🌾',1,'rgba(245,240,228,.92)'],['الطباشير','🖍️',1,'rgba(250,250,250,.9)']];
  let si=0,phase=0;const rec={};
  const beaker=(s,ph)=>{const water='#BFE3F7';let inner=`<rect x="34" y="70" width="132" height="126" rx="10" fill="${water}"/>`;
    if(ph===1)inner+=Array.from({length:22},(_,k)=>`<circle cx="${50+(k*37)%100}" cy="${90+(k*53)%90}" r="3" fill="${s[2]===2?'#C9A86A':s[2]===1?'#fff':'#eee'}" stroke="#999" stroke-width=".5"/>`).join('');
    if(ph===2){if(s[2]===0)inner+=`<rect x="34" y="70" width="132" height="126" rx="10" fill="${s[3]}"/>`;if(s[2]===1)inner+=`<rect x="34" y="70" width="132" height="126" rx="10" fill="${s[3]}"/>`;if(s[2]===2)inner+=`<path d="M36 196V182Q60 174 100 178T164 182V196Z" fill="#C9A86A"/>`}
    return`<svg viewBox="0 0 200 220" style="max-height:300px"><path d="M30 40V196Q30 206 40 206H160Q170 206 170 196V40" fill="none" stroke="var(--ink)" stroke-width="4"/>${inner}<text x="178" y="80" font-size="10" fill="var(--muted)">100 مل</text></svg>`};
  const draw=()=>{const s=SB[si];
    box.innerHTML=`<div class="sim"><div class="stage" style="gap:6px">${beaker(s,phase)}<div style="font-weight:700">${phase===0?'كأس فيها 100 مل من الماء':phase===1?'نحرّك المزيج...':'بعد التحريك: '+(s[2]===0?'مخلوط شفاف لا نرى فيه المادة':s[2]===1?'مخلوط ضبابي (محلول معلق)':'استقرت حبيبات الرمل في القاع')}</div></div>
    <div class="side"><h3>هل تذوب المادة في الماء؟</h3><p class="hint">نستخدم نفس كمية الماء ونفس كمية المادة في كل مرة ليكون الاختبار عادلًا.</p>
     <div class="tiles" style="grid-template-columns:repeat(auto-fit,minmax(96px,1fr))">${SB.map((x,k)=>`<button class="tile" data-k="${k}" style="${k===si?'border-color:var(--u);background:var(--soft)':''}"><span class="e">${x[1]}</span>${x[0]}${rec[k]?' ✓':''}</button>`).join('')}</div>
     <div class="ctrls" id="db"></div><div class="info" id="dbi"></div>
     <div class="tablewrap"><table class="res"><thead><tr><th>المادة</th><th>شفاف أم ضبابي؟</th><th>الاستنتاج</th></tr></thead><tbody>${Object.keys(rec).map(k=>`<tr><td>${SB[k][0]}</td><td>${SB[k][2]===0?'شفاف':SB[k][2]===1?'ضبابي':'ترسّب في القاع'}</td><td>${SB[k][2]===0?'قابلة للذوبان':'غير قابلة للذوبان'}</td></tr>`).join('')}</tbody></table></div></div></div>`;
    $$('[data-k]',box).forEach(b=>b.onclick=()=>{si=+b.dataset.k;phase=0;draw()});
    const db=$('#db',box),dbi=$('#dbi',box);
    if(phase===0){db.innerHTML='<button class="btn u" id="add">أضف ملعقة وحرّك</button>';$('#add',box).onclick=()=>{phase=1;draw();setTimeout(()=>{if(box.isConnected){phase=2;draw()}},1300)}}
    else if(phase===2&&!rec[si]){dbi.textContent='ما استنتاجك؟';db.innerHTML='<button class="btn u sm" data-a="0">قابلة للذوبان</button><button class="btn ghost sm" data-a="1">غير قابلة للذوبان</button>';
      $$('[data-a]',box).forEach(b=>b.onclick=()=>{const right=(+b.dataset.a===0)===(s[2]===0);if(right){sfx.ok();rec[si]=1;if(Object.keys(rec).length>=5)done();draw();$('#dbi',box).innerHTML='<b>صحيح!</b> '+(s[2]===0?'امتزجت المادة تمامًا مع الماء فلا نراها.':'ما زالت المادة مرئية ولم تمتزج تمامًا مع الماء.')}else{sfx.bad();dbi.innerHTML='فكّر مرة أخرى: هل ما زلنا نرى المادة الصلبة في الماء؟'}})}
    else if(phase===2)dbi.innerHTML=s[2]===0?'المادة امتزجت تمامًا مع الماء: قابلة للذوبان.':'المادة ما زالت مرئية: غير قابلة للذوبان.'};
  draw();
};

SIMS.particles=(box,l,done)=>{
  const EX=[['ماء البحر','الملح','الماء'],['الشاي المحلّى','السكر','الماء (الشاي)'],['المشروب البارد','المسحوق','الماء']];let ei=0,dissolving=false,stir=false,t0=0;
  box.innerHTML=`<div class="sim"><div class="stage"><canvas id="pc" width="360" height="280" style="width:100%;max-width:420px;border-radius:12px;background:#E6F3FB" aria-label="جزيئات المحلول"></canvas></div>
  <div class="side"><h3>ماذا يحدث داخل المحلول؟</h3><p class="hint">نكبّر المحلول لنرى جزيئاته. اختر مثالًا ثم اضغط «أذب».</p>
   <div class="seg" id="ex">${EX.map((x,k)=>`<button data-k="${k}" aria-pressed="${k===0}">${x[0]}</button>`).join('')}</div>
   <div class="ctrls"><button class="btn u" id="ds">أذب</button><button class="btn ghost" id="st">حرّك</button><button class="btn ghost" id="rs">من جديد</button></div>
   <div class="kv"><span><span style="color:#E8742C">●</span> المادة المذابة: <b id="sol"></b></span></div><div class="kv"><span><span style="color:#3E86C8">●</span> المادة المذيبة: <b id="svt"></b></span></div>
   <div class="info" id="pi"></div></div></div>`;
  const cv=$('#pc',box),cx=cv.getContext('2d');let W=cv.width,H=cv.height,ps=[];
  const reset=()=>{dissolving=false;stir=false;ps=[];for(let k=0;k<70;k++)ps.push({x:Math.random()*W,y:Math.random()*H,vx:0,vy:0,s:0});for(let k=0;k<30;k++)ps.push({x:W/2-30+(k%6)*12,y:H-70+Math.floor(k/6)*12,vx:0,vy:0,s:1,fixed:true});$('#sol',box).textContent=EX[ei][1];$('#svt',box).textContent=EX[ei][2];$('#pi',box).innerHTML=`${EX[ei][0]} محلول: <b>${EX[ei][1]}</b> مادة مذابة، و<b>${EX[ei][2]}</b> مادة مذيبة. الجزيئات البرتقالية متجمعة الآن في القاع.`;$('#st',box).textContent='حرّك'};
  raf(()=>{cx.clearRect(0,0,W,H);const sp=stir?2.4:1;ps.forEach(p=>{if(p.fixed&&!dissolving)return;if(p.fixed&&dissolving&&Math.random()<.04*sp)p.fixed=false;if(p.fixed)return;p.vx+=(Math.random()-.5)*.6*sp;p.vy+=(Math.random()-.5)*.6*sp;if(stir){const dx=p.x-W/2,dy=p.y-H/2;p.vx+=-dy*.002;p.vy+=dx*.002}p.vx*=.92;p.vy*=.92;p.x+=p.vx;p.y+=p.vy;if(p.x<6||p.x>W-6)p.vx*=-1;if(p.y<6||p.y>H-6)p.vy*=-1;p.x=Math.max(6,Math.min(W-6,p.x));p.y=Math.max(6,Math.min(H-6,p.y))});
    ps.forEach(p=>{cx.beginPath();cx.arc(p.x,p.y,p.s?6:7,0,7);cx.fillStyle=p.s?'#E8742C':'#3E86C8';cx.globalAlpha=p.s?1:.55;cx.fill()});cx.globalAlpha=1;
    if(dissolving&&!ps.some(p=>p.fixed)&&!t0){t0=1;$('#pi',box).innerHTML='<b>ذابت المادة!</b> تحركت جزيئاتها بين جزيئات المادة المذيبة، فلم نعد نراها، وأصبح للمحلول مظهر <b>متجانس</b> يبدو بنفس الشكل في جميع أجزائه.';sfx.ok();done()}});
  $('#ds',box).onclick=()=>{dissolving=true;t0=0;$('#pi',box).textContent='تبدأ الجزيئات الخارجية بالانفصال والانتشار بين جزيئات الماء...'};
  $('#st',box).onclick=()=>{stir=!stir;$('#st',box).textContent=stir?'أوقف التحريك':'حرّك';if(stir&&!dissolving){dissolving=true;t0=0}};
  $('#rs',box).onclick=()=>{t0=0;reset()};
  $$('#ex button',box).forEach(b=>b.onclick=()=>{ei=+b.dataset.k;$$('#ex button',box).forEach(x=>x.setAttribute('aria-pressed',String(x===b)));t0=0;reset()});
  reset();
};

SIMS.rate=(box,l,done)=>{
  const s={temp:'cold',stir:'no',grain:l.simArg==='grain'?'big':'mid'};const rows=[];let busy=false;
  const N={temp:{cold:'بارد',hot:'ساخن'},stir:{no:'بدون تحريك',yes:'مع التحريك'},grain:{big:'مكعبات كبيرة',mid:'حبيبات عادية',fine:'مسحوق ناعم'}};
  const VN={temp:'درجة حرارة الماء',stir:'التحريك',grain:'حجم الحبيبات'};
  const time=()=>{let t={big:240,mid:120,fine:60}[s.grain];if(s.temp==='hot')t*=.45;if(s.stir==='yes')t*=.5;return Math.round(t*(.94+Math.random()*.12))};
  box.innerHTML=`<div class="sim"><div class="stage" style="gap:8px"><svg viewBox="0 0 200 220" style="max-height:280px"><path d="M30 40V196Q30 206 40 206H160Q170 206 170 196V40" fill="none" stroke="var(--ink)" stroke-width="4"/><rect id="wt" x="34" y="70" width="132" height="132" rx="8" fill="#BFE3F7"/><g id="sug"></g><g id="steam"></g></svg>
   <div class="timer" id="clk">00:00</div><div class="hint">ساعة الإيقاف</div></div>
  <div class="side"><h3>مختبر سرعة الذوبان</h3><p class="hint">ثابت في كل تجربة: 100 مل ماء وملعقة سكر. غيّر عاملًا واحدًا كل مرة، ثم قارن الزمن.</p>
   <div class="opt"><label>${VN.temp}</label><div class="seg" data-k="temp"><button data-v="cold">بارد</button><button data-v="hot">ساخن</button></div></div>
   <div class="opt"><label>${VN.stir}</label><div class="seg" data-k="stir"><button data-v="no">بدون</button><button data-v="yes">مع التحريك</button></div></div>
   <div class="opt"><label>${VN.grain}</label><div class="seg" data-k="grain"><button data-v="big">مكعبات كبيرة</button><button data-v="mid">حبيبات</button><button data-v="fine">مسحوق ناعم</button></div></div>
   <button class="btn u" id="run">ابدأ التجربة</button><div class="info" id="ri">${l.simArg==='grain'?'ابدأ بالمكعبات الكبيرة، ثم غيّر حجم الحبيبات فقط وقارن.':'ابدأ بالماء البارد دون تحريك، ثم غيّر عاملًا واحدًا وقارن.'}</div>
   <div class="tablewrap"><table class="res"><thead><tr><th>#</th><th>الماء</th><th>التحريك</th><th>الحبيبات</th><th>الزمن</th></tr></thead><tbody id="tb"></tbody></table></div><div class="bars" id="rb"></div></div></div>`;
  const fmt=t=>String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0');
  const sugarDraw=f=>{const g=$('#sug',box);const n={big:2,mid:10,fine:30}[s.grain];const r={big:16,mid:6,fine:3}[s.grain];let h='';for(let k=0;k<n;k++){const x=60+(k*47)%80,y=188-(k%3)*(r*1.6);h+=`<rect x="${x-r*f}" y="${y-r*f}" width="${2*r*f}" height="${2*r*f}" rx="${r*.3}" fill="#fff" stroke="#bbb"/>`}g.innerHTML=f>0.02?h:'';
    $('#steam',box).innerHTML=s.temp==='hot'?'<path d="M80 60q-8-12 0-24M100 60q-8-12 0-24M120 60q-8-12 0-24" stroke="#bbb" stroke-width="3" fill="none"/>':'';$('#wt',box).setAttribute('fill',s.temp==='hot'?'#F7D2C4':'#BFE3F7')};
  const upd=()=>{$$('.seg[data-k]',box).forEach(g=>$$('button',g).forEach(b=>b.setAttribute('aria-pressed',String(s[g.dataset.k]===b.dataset.v))));if(!busy)sugarDraw(1)};
  $$('.seg[data-k]',box).forEach(g=>$$('button',g).forEach(b=>b.onclick=()=>{if(busy)return;s[g.dataset.k]=b.dataset.v;upd()}));
  $('#run',box).onclick=()=>{if(busy)return;busy=true;$('#run',box).disabled=true;const T=time();const cfg={...s};const dur=1800+T*6;const start=performance.now();
    const stop=raf(now=>{const f=Math.min(1,(now-start)/dur);$('#clk',box).textContent=fmt(Math.round(T*f));sugarDraw(1-f);if(f>=1){stop();busy=false;$('#run',box).disabled=false;rows.push({...cfg,T});report()}})};
  const report=()=>{$('#tb',box).innerHTML=rows.map((r,k)=>`<tr><td>${k+1}</td><td>${N.temp[r.temp]}</td><td>${N.stir[r.stir]}</td><td>${N.grain[r.grain]}</td><td><b>${fmt(r.T)}</b></td></tr>`).join('');
    const mx=Math.max(...rows.map(r=>r.T));$('#rb',box).innerHTML=rows.map((r,k)=>`<div class="bar"><span>التجربة ${k+1}</span><i style="width:${r.T/mx*100}%"></i><b>${r.T}ث</b></div>`).join('');
    sfx.ok();if(rows.length<2){$('#ri',box).innerHTML=`ذاب السكر في ${rows[0].T} ثانية. غيّر عاملًا واحدًا فقط وأعد التجربة للمقارنة.`;return}
    const a=rows[rows.length-2],b=rows[rows.length-1];const diff=['temp','stir','grain'].filter(k=>a[k]!==b[k]);let m;
    if(diff.length===0)m='كررت التجربة نفسها. تكرار القياس يجعل النتائج أكثر دقة.';
    else if(diff.length>1)m=`<b>انتبه!</b> غيّرت أكثر من عامل (${diff.map(k=>VN[k]).join(' و')})، فلا نعرف أيّها سبب الفرق. الاختبار العادل يغيّر عاملًا واحدًا فقط.`;
    else{const k=diff[0];const faster=b.T<a.T;m=`<b>اختبار عادل ✓</b> غيّرت ${VN[k]} فقط. ذاب السكر ${faster?'أسرع':'أبطأ'} مع «${N[k][b[k]]}» مقارنة بـ«${N[k][a[k]]}». `+({temp:'الحرارة تُكسب الجزيئات طاقة فتتحرك أسرع، فتذوب المادة أسرع.',stir:'التحريك يجعل جزيئات السكر تنتشر في الفراغات بين جزيئات الماء أسرع.',grain:'الحبيبات الصغيرة تذوب أسرع؛ لأن جزيئاتها تتصل بالسائل بسرعة، أما الكبيرة فتحتاج وقتًا أطول.'})[k]}
    $('#ri',box).innerHTML=m;if(rows.length>=3)done()};
  upd();
};

render();
</script>
<script>window.__NAV={"pre": [], "levels": [".lrows button", "div.tabs button"]}</script><script>(function(){var N=window.__NAV,q=new URLSearchParams(location.search).get("go");if(!N||!q)return;
var P=q.split(".").map(Number);if(P.some(isNaN))return;
var steps=(N.pre||[]).map(function(p){return{sel:p.sel,idx:p.idx||0}}).concat(P.map(function(v,i){return{sel:N.levels[i],idx:v}}));
function vis(e){var r=e.getBoundingClientRect(),c=getComputedStyle(e);return r.width>4&&r.height>4&&c.visibility!=="hidden"&&c.display!=="none"}
function run(i){if(i>=steps.length)return;var s=steps[i],t=0;(function w(){var l=[].filter.call(document.querySelectorAll(s.sel),vis);
if(l.length>s.idx){l[s.idx].scrollIntoView({block:"center"});l[s.idx].click();setTimeout(function(){run(i+1)},700)}else if(t++<48)setTimeout(w,250)})()}
function go(){setTimeout(function(){run(0)},900)}if(document.readyState==="complete")go();else addEventListener("load",go)})();</script>
