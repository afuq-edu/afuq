"], "a": 1}, {"q": "A chameleon catches insects with its ___.", "o": ["tongue", "hump", "whiskers"], "a": 0}, {"q": "Sea urchins have long ___ for protection.", "o": ["paws", "spines", "beaks"], "a": 1}, {"q": "A snake has ___ all over its body.", "o": ["scales", "whiskers", "humps"], "a": 0}]}, {"type": "build", "title": "Spell the body part", "mode": "letters", "items": [{"a": "beak", "hint": "a bird's hard mouth", "emo": "🦆"}, {"a": "claws", "hint": "sharp nails on an eagle's feet", "emo": "🦅"}, {"a": "hump", "hint": "on a camel's back", "emo": "🐪"}, {"a": "whiskers", "hint": "long hairs on a cat's face", "emo": "🐱"}, {"a": "tongue", "hint": "a chameleon catches insects with it", "emo": "👅"}], "icon": "🔤"}, {"type": "ask", "title": "Guessing game: What animal is it?", "qs": [{"q": "'It has scales and a long tongue.'", "a": "Is it a snake? – No, it isn't. – Is it a lizard? – Yes, it is! Your turn."}, {"q": "'It has a beak and two flippers. It can't fly, but it swims very well.'", "a": "Is it a penguin? – Yes, it is!"}, {"q": "'It has long horns and white fur. It lives in Oman.'", "a": "Is it an Arabian oryx? – Yes, it is!"}, {"q": "Now it's your turn! Describe an animal to your partner.", "a": "It has … It can … It lives in … (free answers)"}], "img": "L16_c3", "icon": "🗣️"}, {"type": "enter", "title": "Catch the animal body parts only!", "gate": "✓", "items": [{"text": "hump", "in": true}, {"text": "tongue", "in": true}, {"text": "duck", "in": false}, {"text": "swim", "in": false}, {"text": "bee", "in": false}, {"text": "scales", "in": true}]}, {"type": "race", "title": "Body parts race", "qs": [{"q": "A bird eats with its …", "options": ["beak", "paws", "fin"], "a": 0}, {"q": "A cat has long … on its face.", "options": ["horns", "whiskers", "flippers"], "a": 1}, {"q": "An insect has two … on its head.", "options": ["humps", "scales", "antennae"], "a": 2}, {"q": "A seal swims with its …", "options": ["flippers", "claws", "beak"], "a": 0}, {"q": "A hedgehog has lots of …", "options": ["fins", "spines", "humps"], "a": 1}, {"q": "Fish and snakes have …", "options": ["fur", "feathers", "scales"], "a": 2}], "icon": "🏁"}, {"type": "steps", "title": "Let's remember!", "icon": "🧠", "steps": ["Body parts: beak, tongue, hump, whiskers, antennae, spines, scales, fin, paws, claws, flippers, horns.", "We classify animals by body features: Foxes have fur. Fish have scales.", "To describe an animal: It has … / It can … / It lives in …", "The Arabian oryx has long horns. A camel has a hump."]}, {"type": "exit", "title": "Exit ticket", "items": [{"k": "3", "text": "Name three animals that have scales."}, {"k": "2", "text": "Which body parts does a cat have?"}, {"k": "1", "text": "Describe an animal in two sentences: It has … It can …"}], "icon": "🎟️"}, {"type": "homework", "title": "Homework", "head": "My homework", "items": ["Activity Book p. 26: complete Activities 1–3 and the word search.", "Activity 4: write three sentences about the body coverings of other animals.", "Learn to spell the 12 new words."], "icon": "🏠"}]}, {"id": "L17", "unit": "U3", "unitName": "Unit 2: Awesome animals", "title": "Team Talk 2: What animal is it?", "code": "", "theme": "library", "emo": "🦔", "slides": [{"type": "cover", "say": "Unit 2 · Lesson 2 – WOW! Team Talk"}, {"type": "goals", "title": "Today's goals", "items": ["I can listen to and read a dialogue about finding an animal.", "I can answer questions about the dialogue."], "icon": "🎯"}, {"type": "goals", "title": "Today's goals", "items": ["I can use the expressions: It's so cute! Watch out! Wow!", "I can act out short dialogues with my partner."], "icon": "🎯"}, {"type": "mystery", "title": "What's the hidden picture?", "img": "L17_c2", "answer": "Emily, Nawal and Bayan in the forest 🌳", "qs": [{"q": "A hedgehog has lots of …", "o": ["spines", "flippers", "horns"], "a": 0}, {"q": "A bird has two … and it can fly.", "o": ["humps", "wings", "fins"], "a": 1}, {"q": "A snake has … all over its body.", "o": ["whiskers", "paws", "scales"], "a": 2}, {"q": "A bear has long, sharp …", "o": ["claws", "antennae", "beaks"], "a": 0}], "icon": "🖼️"}, {"type": "ask", "title": "Let's predict", "qs": [{"q": "Where are the girls? What can you see?", "a": "They're in a forest / a park. There are trees and plants."}, {"q": "What animals might live in this place?", "a": "frogs, snails, bees, birds … (free answers)"}, {"q": "What do you think they find?", "a": "Free answers – let's read and find out!"}], "img": "L17_c1", "icon": "💬"}, {"type": "read", "title": "WOW! Team Talk (1)", "paras": ["Emily: I love this place. There are lots of different animals here. There might be some frogs, snails and bees …", "Bayan: I haven't seen any animals yet.", "Emily: You have to look carefully and listen.", "Nawal: Hey! There's something over there!", "Emily: What does it look like? Does it have fur?"], "img": "L17_c1"}, {"type": "read", "title": "WOW! Team Talk (1)", "paras": ["Nawal: It might have fur. I can't see it very well.", "Bayan: [[Watch out!]] It might be a bear with long claws!"], "img": "L17_c1"}, {"type": "read", "title": "WOW! Team Talk (2)", "paras": ["Nawal: It can't be a bear, Bayan. Bears don't live here.", "Emily: It could be a bird. Listen. I can hear birds.", "Bayan: You may be right, Emily.", "Nawal: It can't be a bird. It doesn't have wings. Wait! It's moving. It's small and brown.", "Bayan: Is it a snake with a long tongue?"], "img": "L17_c2"}, {"type": "read", "title": "WOW! Team Talk (2)", "paras": ["Nawal: No, Bayan! It can't be a snake. It doesn't have scales. Oh! It has spines!"], "img": "L17_c2"}, {"type": "read", "title": "WOW! Team Talk (3)", "paras": ["Bayan: Spines? Then it must be a hedgehog.", "Nawal: Wow! Yes, it is a hedgehog. [[It's so cute!]] It has small paws and it has whiskers, too. Can I [[pick it up]]?", "Emily: No, you shouldn't touch it. It may be scared. It isn't moving now!"]}, {"type": "ask", "title": "Read again and answer", "qs": [{"q": "1 Which animals do they talk about?", "a": "frogs, snails, bees, a bear, a bird, a snake and a hedgehog"}, {"q": "2 Why hasn't Bayan seen any animals yet?", "a": "Because she isn't looking carefully and listening."}, {"q": "3 Why aren't there any bears there?", "a": "Because bears don't live there."}], "icon": "🔎"}, {"type": "ask", "title": "Read again and answer", "qs": [{"q": "4 How does Bayan know it's a hedgehog?", "a": "Because it has spines."}, {"q": "5 What does Nawal want to do?", "a": "She wants to pick it up."}, {"q": "6 How does Emily think the hedgehog feels?", "a": "She thinks it may be scared."}], "icon": "🔎"}, {"type": "tf", "title": "True or false? ✔", "items": [{"text": "Emily doesn't like the place where they are.", "a": false, "fix": "Emily says that she loves the place."}, {"text": "Bayan says she has already seen some frogs.", "a": false, "fix": "'I haven't seen any animals yet.'"}, {"text": "There aren't any bears where the team are.", "a": true, "fix": "'Bears don't live here.'"}], "icon": "✘"}, {"type": "tf", "title": "True or false? ✔", "items": [{"text": "The animal could be a bird because it has wings.", "a": false, "fix": "'It can't be a bird. It doesn't have wings.'"}, {"text": "Nawal says the animal doesn't have spines.", "a": false, "fix": "'Oh! It has spines!'"}, {"text": "The team shouldn't pick up the hedgehog.", "a": true, "fix": "'No, you shouldn't touch it. It may be scared.'"}], "icon": "✘"}, {"type": "quiz", "title": "Complete the sentences", "icon": "✏️", "qs": [{"q": "Emily: There are lots of ___ animals here.", "o": ["different", "small", "cute"], "a": 0}, {"q": "Nawal: Hey! There's ___ over there!", "o": ["something", "nothing", "anything"], "a": 0}, {"q": "Bayan: It might be a bear with long ___!", "o": ["claws", "wings", "scales"], "a": 0}, {"q": "Nawal: It can't be a bird. It doesn't have ___.", "o": ["wings", "spines", "paws"], "a": 0}, {"q": "Nawal: It doesn't have ___. Oh! It has spines!", "o": ["scales", "fur", "whiskers"], "a": 0}, {"q": "Emily: No, you shouldn't ___ it. It may be scared.", "o": ["touch", "see", "hear"], "a": 0}]}, {"type": "explain", "title": "Useful expressions", "icon": "😮⚠️🥰", "lines": ["We use these expressions to show our feelings quickly."], "rule": "Wow! = surprise · Watch out! = danger · It's so cute! = love"}, {"type": "flip", "title": "Useful expressions 💡 – examples", "cards": [{"front": "[[Wow!]] It's so big! – when something is amazing", "icon": "💡", "back": "😮"}, {"front": "[[Watch out!]] There's a car! – when there is danger", "icon": "✨", "back": "⚠️"}, {"front": "[[It's so cute!]] I want one, too! – when something is sweet", "icon": "🔎", "back": "🥰"}]}, {"type": "quiz", "title": "What do you say?", "qs": [{"q": "Where's the spider? – … It's behind you!", "o": ["Watch out!", "It's so cute!", "Wow!"], "a": 0, "why": "There is danger behind you."}, {"q": "Look! There's a small crocodile! – … It's amazing.", "o": ["Watch out!", "Wow!", "It's so cute!"], "a": 1, "why": "Something amazing → Wow!"}, {"q": "Look at the baby koala! – …", "o": ["Watch out!", "Wow! It's dangerous.", "It's so cute!"], "a": 2, "why": "A baby koala is sweet and lovely."}], "icon": "🗣️"}, {"type": "quiz", "title": "Complete the dialogues", "icon": "✏️", "qs": [{"q": "A: Look at that elephant! B: ___ It's so big!", "o": ["Wow!", "Watch out!", "It's so cute!"], "a": 0}, {"q": "A: Look what we got last weekend! B: A hamster! ___", "o": ["Watch out!", "It's so cute!", "Wow!"], "a": 1}, {"q": "A: Are you cooking something? B: Yes. ___ It's very hot!", "o": ["It's so cute!", "Wow!", "Watch out!"], "a": 2}, {"q": "A: Come on! Let's cross the road. B: ___ There's a car!", "o": ["Watch out!", "Wow!", "It's so cute!"], "a": 0}, {"q": "A: What's that animal in the water? B: ___ It's a dolphin! I love dolphins!", "o": ["Watch out!", "Wow!", "It's so cute!"], "a": 1}, {"q": "A: This is my pet hamster. B: ___ I want one, too!", "o": ["Wow!", "Watch out!", "It's so cute!"], "a": 2}]}, {"type": "order", "title": "Put the dialogue in order", "items": ["Nawal: Oh! It has spines!", "Bayan: Spines? Then it must be a hedgehog.", "Nawal: Wow! Yes, it is a hedgehog. It's so cute!", "Nawal: Can I pick it up?", "Emily: No, you shouldn't touch it. It may be scared."], "icon": "🔢"}, {"type": "ask", "title": "Have you ever found an animal?", "qs": [{"q": "Have you ever found an interesting animal in an unusual place?", "a": "Yes, I have. I found a lizard in my bedroom! (free answers)"}, {"q": "What did it look like?", "a": "It was small and green. It had scales and a long tail."}, {"q": "What did you do?", "a": "I called my dad and we put it outside. (free answers)"}], "img": "L17_c2", "icon": "🐸"}, {"type": "memory", "title": "Memory: animal and clue", "pairs": [["a bear", "Bears don't live here."], ["a bird", "It doesn't have wings."], ["a snake", "It doesn't have scales."], ["a hedgehog", "It has spines!"], ["frogs, snails and bees", "There might be some here."], ["the scared hedgehog", "It isn't moving now!"]], "icon": "🧠"}, {"type": "balloons", "title": "Pop the right word!", "rounds": [{"q": "It can't be a bear. Bears don't ___ here.", "o": ["live", "lives", "living"], "a": 0}, {"q": "It can't be a bird. It doesn't have ___.", "o": ["wings", "spines", "paws"], "a": 0}, {"q": "It has spines. It must be a ___.", "o": ["hedgehog", "snake", "bear"], "a": 0}, {"q": "___! There's a car!", "o": ["Watch out", "It's so cute", "Wow, it's big"], "a": 0}, {"q": "You shouldn't ___ it. It may be scared.", "o": ["touch", "see", "love"], "a": 0}], "icon": "🎈"}, {"type": "steps", "title": "Let's remember!", "icon": "🧠", "steps": ["The team found a hedgehog: small, brown, with spines, small paws and whiskers.", "It can't be a bear – bears don't live here. It can't be a bird – it doesn't have wings.", "Expressions: Wow! · Watch out! · It's so cute!", "We shouldn't touch wild animals – they may be scared."]}, {"type": "exit", "title": "Exit ticket", "items": [{"k": "3", "text": "What animal did the team find? Describe it."}, {"k": "2", "text": "Why can't it be a bird?"}, {"k": "1", "text": "What do you say when you see a baby cat?"}], "icon": "🎟️"}, {"type": "homework", "title": "Homework", "head": "My homework", "items": ["Activity Book p. 27: Activities 1–3.", "Activity 4: write another short dialogue for each expression (Wow! / Watch out! / It's so cute!).", "Practise reading the Team Talk dialogue aloud."], "icon": "🏠"}]}, {"id": "L18", "unit": "U3", "unitName": "Unit 2: Awesome animals", "title": "Modals of deduction: may, might, could, can't, must", "code": "", "theme": "library", "emo": "🕵️", "slides": [{"type": "cover", "say": "Unit 2 · Lesson 3 – may, might, could, can't, must"}, {"type": "goals", "title": "Today's goals", "items": ["I can use must when I'm sure something is true.", "I can use can't when I'm sure something is not true."], "icon": "🎯"}, {"type": "goals", "title": "Today's goals", "items": ["I can use may, might and could when I'm not sure.", "I can guess animals from clues and pictures."], "icon": "🎯"}, {"type": "riddle", "title": "Detective game: what is it?", "items": [{"clues": ["It has four short legs and a long tail.", "It has scales on its body.", "It lives in rivers."], "a": "a crocodile", "emo": "🐊"}, {"clues": ["It's a very big, dangerous cat.", "Its fur has black and orange stripes."], "a": "a tiger", "emo": "🐅"}, {"clues": ["It's a large animal with lots of brown fur.", "It lives in the forest.", "It has long claws."], "a": "a bear", "emo": "🐻"}, {"clues": ["It has wings and it lives in the jungle.", "It's very colourful.", "It can talk!"], "a": "a parrot", "emo": "🦜"}], "icon": "🔎"}, {"type": "ask", "title": "Remember the Team Talk?", "qs": [{"q": "'It can't be a bear.' Why?", "a": "e – Bears don't live here."}, {"q": "'It could be a bird.' Why?", "a": "d – Listen. I can hear birds."}, {"q": "'It can't be a snake.' Why?", "a": "a – It doesn't have scales."}, {"q": "'It must be a hedgehog.' Why?", "a": "b – It has spines."}, {"q": "'It may be scared.' Why?", "a": "c – It isn't moving now."}], "img": "L18_c5", "icon": "💬"}, {"type": "explain", "title": "How sure are you?", "icon": "🕵️", "lines": ["We use these modals + be / have to guess (deduce) something."], "rule": "It / He / She / You + may / might / could / can't / must + be / have …"}, {"type": "flip", "title": "How sure are you? 💡 – examples", "cards": [{"front": "It [[must]] be a hedgehog. It has spines. ✅", "icon": "💡", "back": "100% sure – true"}, {"front": "It [[may / might / could]] be a bird. I can hear birds. 🤔", "icon": "✨", "back": "not sure – maybe"}, {"front": "It [[can't]] be a bear. Bears don't live here. ❌", "icon": "🔎", "back": "100% sure – NOT true"}]}, {"type": "quiz", "title": "Circle the correct rule", "qs": [{"q": "We use ___ when we are sure something is true.", "o": ["must", "may", "can't"], "a": 0, "why": "must = sure it's true."}, {"q": "We use ___ when we are sure something is not true.", "o": ["could", "can't", "might"], "a": 1, "why": "can't = sure it's not true."}, {"q": "We use could, may or might when we are ___ if something is true.", "o": ["sure", "not sure"], "a": 1, "why": "could / may / might = maybe."}], "icon": "✅"}, {"type": "sort", "title": "Sure or not sure?", "bins": [{"label": "sure – true", "icon": "✅"}, {"label": "not sure", "icon": "🤔"}, {"label": "sure – not true", "icon": "❌"}], "cards": [{"text": "It must be a hedgehog.", "icon": "", "bin": 0}, {"text": "It might be a bear.", "icon": "", "bin": 1}, {"text": "It could be a bird.", "icon": "", "bin": 1}, {"text": "You may be right.", "icon": "", "bin": 1}, {"text": "It may be scared.", "icon": "", "bin": 1}, {"text": "It can't be a bear.", "icon": "", "bin": 2}, {"text": "It can't be a snake.", "icon": "", "bin": 2}, {"text": "It might have fur.", "icon": "", "bin": 1}], "icon": "🗂️"}, {"type": "match", "title": "Match the two parts", "pairs": [["It can't be a bird.", "It doesn't have a beak."], ["It may be scared.", "o": ["It could a lion.", "It could be a lion.", "It coulds be a lion."], "a": 1, "why": "could + be"}, {"q": "Silhouette 3: must / duck", "o": ["It must be a duck.", "It must being a duck.", "It must is a duck."], "a": 0, "why": "must + be"}, {"q": "Silhouette 4: can't / rabbit", "o": ["It can't to be a rabbit.", "It can't be a rabbit.", "It doesn't can be a rabbit."], "a": 1, "why": "can't + be"}, {"q": "Silhouette 5: might / eagle", "o": ["It might be an eagle.", "It might be a eagle.", "It mights be an eagle."], "a": 0, "why": "an + eagle (vowel sound)"}], "img": "L18_c3", "icon": "🐾"}, {"type": "quiz", "title": "What is it? Choose", "icon": "✏️", "qs": [{"q": "It jumps out of the sea and it's grey. It ___ be a dolphin.", "o": ["could", "can't"], "a": 0}, {"q": "It has a hump and lives in the desert. It ___ be a camel.", "o": ["must", "can't"], "a": 0}, {"q": "It's very small and it has no wings. It ___ be a bee.", "o": ["must", "can't"], "a": 1}, {"q": "It has white fur. It ___ be a sheep or a goat – I'm not sure.", "o": ["might", "must"], "a": 0}, {"q": "It has long ears and it's bigger than a cat. It ___ be a large rabbit.", "o": ["could", "can't"], "a": 0}]}, {"type": "quiz", "title": "Riddles: use each word once", "icon": "✏️", "qs": [{"q": "Four short legs, a long tail, scales. → It ___ be a crocodile.", "o": ["may", "can't"], "a": 0}, {"q": "A very big, dangerous cat with black and orange stripes. → It ___ be a tiger.", "o": ["must", "can't"], "a": 0}, {"q": "Black and white, four legs, lives in Africa. → It ___ be a penguin.", "o": ["must", "can't"], "a": 1}, {"q": "A very large animal on land and in water, four legs and a tail. → It ___ be a hippo.", "o": ["could", "can't"], "a": 0}, {"q": "A large animal with four legs and brown fur, in the forest. → It ___ be a bear.", "o": ["might", "can't"], "a": 0}]}, {"type": "build", "title": "Make the sentence", "mode": "words", "items": [{"a": "It must be a hedgehog because it has spines.", "emo": "🦔", "hint": "must – sure"}, {"a": "It can't be a fish because it doesn't have fins.", "emo": "🐟", "hint": "can't – sure not"}, {"a": "That little animal may be a hedgehog.", "emo": "🤔", "hint": "AB p. 61"}, {"a": "You can't be hungry now.", "emo": "🍽️", "hint": "AB p. 61 – you ate a big lunch!"}], "icon": "✍️"}, {"type": "boxes", "title": "Treasure boxes", "boxes": [{"label": "1", "q": "It has a beak and wings. It ___ be a bird.", "a": "must"}, {"label": "2", "q": "It doesn't have legs. It ___ be a horse.", "a": "can't"}, {"label": "3", "q": "I'm not sure. It ___ be a cat or a fox.", "a": "might / may / could"}, {"label": "4", "q": "The girl next to the window ___ be Sara, but I'm not sure.", "a": "might / could (AB p. 61)"}], "icon": "🎁"}, {"type": "boxes", "title": "Treasure boxes", "boxes": [{"label": "1", "q": "This red jacket ___ belong to Ahmed. He was wearing it today.", "a": "must (AB p. 61)"}, {"label": "2", "q": "Correct the mistake: It must is a snake.", "a": "It must be a snake."}, {"label": "3", "q": "Which modal means 'I'm sure it's not true'?", "a": "can't"}, {"label": "4", "q": "Make a guess about the animal: It has a hump.", "a": "It must be a camel."}], "icon": "🎁"}, {"type": "race", "title": "Deduction race", "qs": [{"q": "It has spines. It ___ be a hedgehog.", "options": ["must", "can't", "might"], "a": 0}, {"q": "Bears don't live here. It ___ be a bear.", "options": ["must", "can't", "may"], "a": 1}, {"q": "I can hear birds. It ___ be a bird.", "options": ["can't", "could", "must"], "a": 1}, {"q": "It ___ be scared. It isn't moving.", "options": ["may", "can't", "mays"], "a": 0}, {"q": "Hamed doesn't look interested. He ___ be bored.", "options": ["can't", "might", "mustn't"], "a": 1}, {"q": "Which is correct?", "options": ["It could to be a lion.", "It could be a lion.", "It coulds be a lion."], "a": 1}], "icon": "🏁"}, {"type": "steps", "title": "Let's remember!", "icon": "🧠", "steps": ["must = I'm sure it's true: It must be a hedgehog.", "can't = I'm sure it's not true: It can't be a bear.", "may / might / could = I'm not sure: It might be a bird.", "modal + be / have (no to, no -s): It may be scared. It might have fur."]}, {"type": "exit", "title": "Exit ticket", "items": [{"k": "3", "text": "Complete: It has a hump. It ___ be a camel."}, {"k": "2", "text": "Complete: It doesn't have wings. It ___ be a bird."}, {"k": "1", "text": "Write a riddle about an animal and the answer with might or could."}], "icon": "🎟️"}, {"type": "homework", "title": "Homework", "head": "My homework", "items": ["Activity Book pp. 28–29: Activities 1–5.", "Activity 5: write riddles about three animals and the answers with may, might, could, can't or must.", "Grammar practice AB p. 61: Activities 1–2."], "icon": "🏠"}]}, {"id": "L19", "unit": "U3", "unitName": "Unit 2: Awesome animals", "title": "Book club: The Best Animals on Earth (a folk tale)", "code": "", "theme": "library", "emo": "🦆", "slides": [{"type": "cover", "say": "Unit 2 · Lesson 4 – WOW! Book club: a folk tale"}, {"type": "goals", "title": "Today's goals", "items": ["I can say what a folk tale is.", "I can read and understand a folk tale about a platypus."], "icon": "🎯"}, {"type": "goals", "title": "Today's goals", "items": ["I can put the events of the story in order.", "I can make nouns with -er: dive → diver."], "icon": "🎯"}, {"type": "quiz", "title": "What is a folk tale?", "qs": [{"q": "Folk tales are … stories.", "o": ["new", "old"], "a": 1, "why": "People told folk tales a long time ago."}, {"q": "Folk tales …", "o": ["tell a true story", "teach important things"], "a": 1, "why": "They have a lesson (moral) for us."}, {"q": "Which of these is a folk tale?", "o": ["a science book", "an old story about a clever animal", "a news report"], "a": 1, "why": "Many folk tales are about animals with a lesson."}], "icon": "📜"}, {"type": "ask", "title": "Meet the platypus!", "qs": [{"q": "Look at the animal next to the lions. What body parts does it have?", "a": "It has a beak like a duck, fur, a flat tail and webbed feet."}, {"q": "Where do you think it lives?", "a": "In Australia, on land and in water (rivers)."}, {"q": "Which group do you think it belongs to: animals with fur, fish or birds?", "a": "Free answers – let's read and find out!"}], "img": "L19_c1", "icon": "🦆🦫"}, {"type": "read", "title": "The Best Animals on Earth (1)", "paras": ["Long ago, all the animals on Earth were fighting. They all wanted to be the best group of animals on Earth.", "'We are the most important animals,' [[roared]] the lions. 'We have fur and we can run.'", "'What about the platypus?' someone asked. 'She has fur and she's a good runner.'"], "img": "L19_c1"}, {"type": "read", "title": "The Best Animals on Earth (1)", "paras": ["'True!' said the lion. He found the platypus, who was [[hiding]], and said, 'Please join our group. If you come with us, you'll be with the best animals.'"], "img": "L19_c1"}, {"type": "read", "title": "The Best Animals on Earth (2)", "paras": ["'I'm not sure,' said the platypus. 'I can't [[bite]] like you – I don't have teeth. But if you come and see me tomorrow, I'll tell you.'", "Then the fish said, 'We are the most interesting animals. We can swim and [[dive]].'", "'The platypus is a swimmer, too,' someone said."], "img": "L19_c2"}, {"type": "read", "title": "The Best Animals on Earth (2)", "paras": ["'Oh, yes,' said the fish. Then the fish said to the platypus, 'If you join us, you'll be in the best group.'"], "img": "L19_c2"}, {"type": "read", "title": "The Best Animals on Earth (3)", "paras": ["'I'm a swimmer and a diver,' said the platypus, 'but I can't breathe underwater like you. Ask me tomorrow.'", "'We are the most amazing animals,' sang the birds. 'We have beaks and we [[lay eggs]].'", "Someone said, 'The platypus has a beak and she can lay eggs.'"], "img": "L19_c3"}, {"type": "read", "title": "The Best Animals on Earth (3)", "paras": ["'You're right,' said the bird. Then he said to the platypus, 'Join our group. You'll be with the best animals on Earth.'"], "img": "L19_c3"}, {"type": "read", "title": "The Best Animals on Earth (4)", "paras": ["'I don't know,' said the platypus. 'I can't fly like you, but if you wait, I'll decide tomorrow.'"], "img": "L19_c3"}, {"type": "read", "title": "The Best Animals on Earth (4)", "paras": ["The next day, the platypus said to the animals, 'I'm sorry, but I don't want to join any group. If I join the lions, the birds won't be happy. If I don't join the fish, they'll be angry. You are all [[special]] in different ways, and I am special in my own way, too.'", "Then she [[curled up]] and went to sleep."], "img": "L19_c3"}, {"type": "ask", "title": "Answer the questions", "qs": [{"q": "1 Which animals are in the story?", "a": "lions, fish, birds and the platypus"}, {"q": "2 Which group does the platypus join?", "a": "None! She doesn't want to join any group."}, {"q": "3 What were the animals fighting about?", "a": "They were fighting about who was the best group of animals on Earth."}], "icon": "🔎"}, {"type": "ask", "title": "Answer the questions", "qs": [{"q": "4 How are the lions and the platypus similar?", "a": "They both have fur and they can run."}, {"q": "5 How is the platypus different from the fish?", "a": "She can't breathe underwater."}, {"q": "6 What does the platypus do at the end of the story?", "a": "She curls up and goes to sleep."}], "icon": "🔎"}, {"type": "order", "title": "Number the events in order", "items": ["All of the animals thought they were the most important.", "The lions thought they were the best group.", "The lions invited the platypus to join them.", "The fish asked the platypus to join them.", "The birds wanted the platypus to join them.", "The platypus decided not to join any group."], "icon": "🔢"}, {"type": "match", "title": "Why did they want her?", "pairs": [["the lions", "She has fur and she's a good runner."], ["the fish", "She's a swimmer and a diver."], ["the birds", "She has a beak and she can lay eggs."], ["She can't bite like the lions …", "… she doesn't have teeth."], ["She can't join the birds' world …", "… she can't fly."]], "icon": "🧩"}, {"type": "ask", "title": "Discuss in groups", "qs": [{"q": "After reading the story, which do you think is the best group of animals?", "a": "Free answers – I think … because they can …"}, {"q": "Do you like the end of the story? Why?", "a": "Yes, I do, because the platypus is fair and kind to everyone. (free answers)"}, {"q": "What can we learn from the story?", "a": "Everyone is special in their own way. We shouldn't fight about who is the best."}], "img": "L19_c3", "icon": "💬"}, {"type": "explain", "title": "verb + -er = a person or thing", "icon": "🏃✍️🤿", "lines": ["We can add -er to some verbs to make a word for someone/something that does that action."], "rule": "verb + -er → a person who does it: swim → swimmer"}, {"type": "flip", "title": "verb + -er = a person or thing 💡 – examples", "cards": [{"front": "farm → farm[[er]] · teach → teach[[er]] · play → play[[er]]", "icon": "💡", "back": "+ er"}, {"front": "run → run[[ner]] (double the consonant)", "icon": "✨", "back": "vowel + consonant"}, {"front": "write → write[[r]] · dive → dive[[r]] (end in e → add r)", "icon": "🔎", "back": "+ r"}]}, {"type": "quiz", "title": "Complete with the -er word", "icon": "✏️", "qs": [{"q": "My uncle lives in the country and has lots of animals. He's a ___.", "o": ["farmer", "player", "diver"], "a": 0}, {"q": "I talk to my friend Budoor about my problems. She's a good ___.", "o": ["listener", "teacher", "reader"], "a": 0}, {"q": "I borrow lots of books from the library because I'm a keen ___.", "o": ["writer", "reader", "runner"], "a": 1}, {"q": "Who do you think is the world's most famous football ___?", "o": ["player", "farmer", "listener"], "a": 0}, {"q": "Mrs Amani explains English really well. She's an excellent ___.", "o": ["diver", "teacher", "player"], "a": 1}, {"q": "A platypus can swim very quickly. It's also an excellent ___.", "o": ["diver", "reader", "farmer"], "a": 0}]}, {"type": "build", "title": "Spell the -er word", "mode": "letters", "items": [{"a": "singer", "hint": "sing + er", "emo": "🎤"}, {"a": "designer", "hint": "design + er", "emo": "🎨"}, {"a": "runner", "hint": "run + n + er", "emo": "🏃"}, {"a": "writer", "hint": "write + r", "emo": "✍️"}, {"a": "cleaner", "hint": "clean + er", "emo": "🧹"}], "icon": "🔤"}, {"type": "write", "title": "What might the frogs say?", "task": "Work in groups. What do you think a group of frogs might say to the platypus? Write another paragraph for the story.", "steps": ["Remember! Frogs and platypuses can live on land and water.", "Frogs can jump. Platypuses can't jump.", "What do the frogs say? ('We are the …')", "What does the platypus answer? ('… but I can't …')"], "words": ["the most", "can live", "land and water", "jump", "join our group", "if you …, you'll …", "I'm not sure", "tomorrow"], "model": "'We are the most special animals,' said the frogs. 'We can live on land and in water.' Someone said, 'The platypus can live on land and in water, too.' 'That's true,' said the frogs. 'If you join us, you'll be with the best animals.' 'I'm not sure,' said the platypus. 'I can't jump like you, but if you come back tomorrow, I'll tell you.'", "icon": "✍️"}, {"type": "memory", "title": "Memory: who said it?", "pairs": [["the lions", "'We have fur and we can run.'"], ["the fish", "'We can swim and dive.'"], ["the birds", "'We have beaks and we lay eggs.'"], ["the platypus", "'I am special in my own way, too.'"], ["someone", "'What about the platypus?'"], ["at the end", "She curled up and went to sleep."]], "icon": "🧠"}, {"type": "steps", "title": "Let's remember!", "icon": "🧠", "steps": ["A folk tale is an old story that teaches important things.", "The lions, the fish and the birds all wanted the platypus in their group.", "The platypus didn't join any group: 'You are all special in different ways.'", "verb + -er: swim → swimmer, dive → diver, run → runner, teach → teacher."]}, {"type": "exit", "title": "Exit ticket", "items": [{"k": "3", "text": "Why did the birds want the platypus to join them?"}, {"k": "2", "text": "What will happen if the platypus joins the lions?"}, {"k": "1", "text": "Write the -er word: read → … · run → …"}], "icon": "🎟️"}, {"type": "homework", "title": "Homework", "head": "My homework", "items": ["Activity Book pp. 30–31: Activities 1–4.", "Finish your frogs paragraph (Activity 5) and draw a picture.", "Tell the folk tale to someone in your family."], "icon": "🏠"}]}, {"id": "L20", "unit": "U3", "unitName": "Unit 2: Awesome animals", "title": "Animal verbs & First conditional", "code": "", "theme": "library", "emo": "🦁", "slides": [{"type": "cover", "say": "Unit 2 · Lesson 5 – animal verbs & the first conditional"}, {"type": "goals", "title": "Today's goals", "items": ["I can name 12 animal verbs: bite, sting, roar, dig, hide, dive …", "I can find the verbs in the folk tale."], "icon": "🎯"}, {"type": "goals", "title": "Today's goals", "items": ["I can use the first conditional: If …, … will …", "I can say how to get more animals to come to my garden."], "icon": "🎯"}, {"type": "build", "title": "Unscramble the action", "mode": "letters", "items": [{"a": "roar", "hint": "aorr – Lions make a loud noise.", "emo": "🦁"}, {"a": "sting", "hint": "ngsit – A bee can … you.", "emo": "🐝"}, {"a": "dive", "hint": "evid – Sharks … into deep water.", "emo": "🦈"}, {"a": "hide", "hint": "deih – My cat likes to … under the car.", "emo": "🐱"}], "icon": "🔤"}, {"type": "flip", "title": "Animal verbs", "cards": [{"front": "curl up", "icon": "🦔", "back": "make your body into a ball\n«The hedgehog curls up when it's scared.»"}, {"front": "bite", "icon": "🐱", "back": "cut something with your teeth\n«Be careful! The cat might bite you.»"}, {"front": "sting", "icon": "🐝", "back": "hurt with a sharp part of the body\n«A bee can sting you.»"}, {"front": "dig", "icon": "🐇", "back": "make a hole in the ground\n«Rabbits dig y": "The end of the story."}], "icon": "📖"}, {"type": "quiz", "title": "Circle the correct verb", "icon": "✏️", "qs": [{"q": "Sea turtles lay their eggs on sandy beaches. They ___ holes in the sand.", "o": ["dig", "hide", "roar"], "a": 0}, {"q": "I have two parrots. They usually play nicely, but sometimes they ___.", "o": ["hide", "dive", "fight"], "a": 2}, {"q": "My brother is frightened of bees and other insects that could ___ him.", "o": ["sting", "die", "fight"], "a": 0}, {"q": "We saw some lions at the zoo. They're really loud when they ___.", "o": ["run", "dig", "roar"], "a": 2}, {"q": "I have two cats. They like to ___ under my car.", "o": ["bite", "sting", "hide"], "a": 2}, {"q": "Some whales can ___ more than 2,000 metres under the water.", "o": ["dig", "dive", "curl"], "a": 1}]}, {"type": "ask", "title": "Pill bugs", "qs": [{"q": "Pill bugs live on land, but only in wet places. What will happen if they get too dry?", "a": "They will die. (listen and check)"}, {"q": "What can pill bugs do when there is danger?", "a": "They can run away and they can curl up into a ball."}, {"q": "Are pill bugs dangerous to people? Why?", "a": "No, they aren't, because they can't bite or sting."}], "img": "L20_c4", "icon": "🐛"}, {"type": "match", "title": "Match the two parts", "pairs": [["If you come with us,", "you'll be with the best animals."], ["If you come and see me tomorrow,", "I'll tell you."], ["If you join us,", "you'll be in the best group."]], "icon": "🧩"}, {"type": "match", "title": "Match the two parts", "pairs": [["If you wait,", "I'll decide tomorrow."], ["If I join the lions,", "the birds won't be happy."], ["If I don't join the fish,", "they'll be angry."]], "icon": "🧩"}, {"type": "explain", "title": "First conditional: If …, … will …", "icon": "🔮", "lines": ["We use the first conditional to talk about something that might happen in the future."], "rule": "If + present simple, … will / won't + verb"}, {"type": "flip", "title": "First conditional: If …, … will … 💡 – examples", "cards": [{"front": "If you [[come]] with us, you[['ll be]] with the best animals.", "icon": "💡", "back": "present → will"}, {"front": "If I [[don't join]] the fish, they[['ll be]] angry.", "icon": "✨", "back": "present (negative) → will"}, {"front": "If I [[join]] the lions, the birds [[won't be]] happy.", "icon": "🔎", "back": "present → won't"}]}, {"type": "quiz", "title": "Circle the correct rule", "qs": [{"q": "We use the first conditional to talk about something that might happen in the …", "o": ["present", "future"], "a": 1, "why": "It talks about a possible future."}, {"q": "The if part of the sentence is in the …", "o": ["present", "future with will"], "a": 0, "why": "If you come … (present simple)"}, {"q": "The second part uses the …", "o": ["present", "future with will"], "a": 1, "why": "… you'll be with the best animals."}], "icon": "✅"}, {"type": "quiz", "title": "Complete: first conditional", "icon": "✏️", "qs": [{"q": "If a lizard loses its tail in a fight, it ___ a new one.", "o": ["will grow", "grows", "grew"], "a": 0}, {"q": "If you ___ nice to me, I will be happy.", "o": ["will be", "are", "is"], "a": 1}, {"q": "If Shihab feels tired on Saturday, he ___ football.", "o": ["won't play", "doesn't play", "not play"], "a": 0}, {"q": "If Aliyah ___ her parents for a new dress, they will buy one for her.", "o": ["will ask", "asks", "ask"], "a": 1}, {"q": "If my friends and I go scooting today, we ___ fun.", "o": ["have", "will have", "had"], "a": 1}, {"q": "If you ___ your homework, you will fail the exam.", "o": ["don't do", "won't do", "didn't do"], "a": 0}]}, {"type": "sort", "title": "Correct or wrong?", "bins": [{"label": "correct", "icon": "✅"}, {"label": "wrong", "icon": "❌"}], "cards": [{"text": "If we plant trees, more birds will come.", "icon": "", "bin": 0}, {"text": "If it rains, we won't go to the beach.", "icon": "", "bin": 0}, {"text": "If you will help me, I'll buy you lunch.", "icon": "", "bin": 1}, {"text": "If we leave soon, we won't be late.", "icon": "", "bin": 0}, {"text": "If Hashim tidy his room, his mum will be happy.", "icon": "", "bin": 1}, {"text": "If they visit the castle, they learn will about the past.", "icon": "", "bin": 1}], "icon": "🗂️"}, {"type": "ask", "title": "More animals in our garden", "qs": [{"q": "If we plant more flowers, …", "a": "… more bees and butterflies will come."}, {"q": "If we put bird food outdoors, …", "a": "… lots of birds will visit our garden."}, {"q": "If there is water, …", "a": "… birds and insects will come to drink."}, {"q": "If we don't tidy up the dead leaves, …", "a": "… insects and hedgehogs will hide and live there."}], "img": "L20_c2", "icon": "🌸"}, {"type": "build", "title": "Make the sentence", "mode": "words", "items": [{"a": "If I don't eat breakfast, I will feel hungry at school.", "emo": "🍳", "hint": "AB p. 33"}, {"a": "If you don't water the plants, some of them will die.", "emo": "🪴", "hint": "AB p. 61"}, {"a": "If we protect our forests, they won't disappear.", "emo": "🌳", "hint": "AB p. 61"}, {"a": "If a bird is scared, it will fly away.", "emo": "🐦", "hint": "AB p. 39"}], "icon": "✍️"}, {"type": "balloons", "title": "Pop the right answer!", "rounds": [{"q": "If you ___ the dog's tail, it will bite you.", "o": ["pull", "will pull", "pulls"], "a": 0}, {"q": "If a lion is hungry, it ___ loudly.", "o": ["will roar", "roars will", "roar"], "a": 0}, {"q": "Bees can ___ you. Be careful!", "o": ["sting", "dive", "dig"], "a": 0}], "icon": "🎈"}, {"type": "balloons", "title": "Pop the right answer!", "rounds": [{"q": "A hedgehog will ___ if it's scared.", "o": ["curl up", "lay eggs", "roar"], "a": 0}, {"q": "If we put bird food outdoors, more birds ___.", "o": ["will come", "came", "comes"], "a": 0}, {"q": "Rabbits ___ holes in gardens.", "o": ["dig", "dive", "fly away"], "a": 0}], "icon": "🎈"}, {"type": "wheel", "title": "Conditional wheel", "items": [{"q": "If the weather is very hot this weekend, …", "a": "… I'll go swimming."}, {"q": "If I visit the beach with my family this year, …", "a": "… I'll see turtles."}, {"q": "If my best friend needs help with the homework, …", "a": "… I'll help him/her."}, {"q": "If you help me study for the English test, …", "a": "… I'll get a good mark."}, {"q": "If I pass my English exam, …", "a": "… I'll be very happy."}, {"q": "If it rains tomorrow, …", "a": "… we'll play inside."}], "icon": "🎡"}, {"type": "steps", "title": "Let's remember!", "icon": "🧠", "steps": ["Animal verbs: bite, sting, roar, fight, dive, dig, hide, lay eggs, curl up, fly away, run away, die.", "First conditional: If + present simple, … will / won't + verb.", "If you come with us, you'll be with the best animals.", "If we plant more flowers, more bees will come."]}, {"type": "exit", "title": "Exit ticket", "items": [{"k": "3", "text": "What does a hedgehog do when it's scared?"}, {"k": "2", "text": "Complete: If a bird is scared, it …"}, {"k": "1", "text": "Write one first conditional sentence about your school garden."}], "icon": "🎟️"}, {"type": "homework", "title": "Homework", "head": "My homework", "items": ["Activity Book pp. 32–33: Activities 1–4.", "Grammar practice AB p. 61: Activities 3–4.", "Learn to spell the 12 animal verbs."], "icon": "🏠"}]}, {"id": "L21", "unit": "U3", "unitName": "Unit 2: Awesome animals", "title": "Culture & Project: National animals / A world map", "code": "", "theme": "library", "emo": "🦌", "slides": [{"type": "cover", "say": "Unit 2 · Lesson 6 – WOW! Culture & Project"}, {"type": "goals", "title": "Today's goals", "items": ["I can read about three amazing national animals.", "I can say true or false sentences about the text."], "icon": "🎯"}, {"type": "goals", "title": "Today's goals", "items": ["I can talk about the best national animal and why.", "I can make a world map of national animals with my group."], "icon": "🎯"}, {"type": "ask", "title": "Does your country have a national animal?", "qs": [{"q": "Countries have flags and special songs. What else can they have?", "a": "National animals!"}, {"q": "What is the national animal of Oman?", "a": "The Arabian oryx (المها العربي)."}, {"q": "Why do you think a country chooses a national animal?", "a": "Because it's special / it lives there / people love it … (free answers)"}], "img": "L21_c4", "icon": "💬"}, {"type": "mystery", "title": "Which animal is hiding?", "img": "L21_c2", "answer": "the Komodo dragon 🦎 – the largest lizard in the world!", "qs": [{"q": "A lizard has … on its body.", "o": ["scales", "feathers", "fur"], "a": 0}, {"q": "Lions … loudly.", "o": ["sting", "roar", "dig"], "a": 1}, {"q": "The Arabian oryx has long …", "o": ["fins", "flippers", "horns"], "a": 2}, {"q": "If a snake … you, you'll need a doctor.", "o": ["bites", "will bite", "bite"], "a": 0}], "icon": "🖼️"}, {"type": "flip", "title": "Key words", "cards": [{"front": "national animal", "icon": "🇴🇲", "back": "a special animal that a country chooses\n«The Arabian oryx is the national animal of Oman.»"}, {"front": "communicate", "icon": "💬", "back": "share information with others\n«Lemurs communicate with their tails.»"}, {"front": "acacia tree", "icon": "🌳", "back": "a desert tree with small leaves and spines\n«Oryx eat leaves from acacia trees.»"}, {"front": "in the wild", "icon": "🏜️", "back": "living free in nature, not in a zoo\n«Now there are oryx in the wild again.»"}, {"front": "enormous", "icon": "🐘", "back": "very, very big\n«The Komodo dragon is an enormous lizard.»"}, {"front": "venom", "icon": "☠️", "back": "a poison that some animals make\n«It has venom in its mouth.»"}], "icon": "🔑"}, {"type": "read", "title": "Ring-tailed lemurs (Madagascar)", "paras": ["Ring-tailed lemurs are the national animal of Madagascar. They have long, striped tails that are easy to see in the forest. Lemurs [[communicate]] and fight with other lemurs with their tails, with loud noises and with horrible smells! They are very good at running, jumping and climbing."], "img": "L21_c1", "icon": "🐒"}, {"type": "read", "title": "The Arabian oryx (Oman)", "paras": ["The beautiful Arabian oryx has white fur and long horns and is the national animal of Oman. They eat grass and leaves from [[acacia trees]], but because they live in the desert, they must walk for long distances to find food. They get all the water that they need from their food and they usually live in groups of around 15–30. People once thought there were no more Arabian oryx living [[in the wild]], but now you can find them in Oman, Jordan, the United Arab Emirates and Saudi Arabia."], "img": "L21_c4", "icon": "🇴🇲"}, {"type": "read", "title": "The Komodo dragon (Indonesia)", "paras": ["The national animal of Indonesia is the Komodo dragon. This [[enormous]] lizard has some amazing features that help it catch animals to eat. It uses its tongue to taste the air and that helps it find animals. It also has [[venom]] in its mouth. If it bites another animal, that animal will die. It has very strong legs, too, so it's good at running. It's very difficult to run away from a Komodo dragon!"], "img": "L21_c2", "icon": "🦎"}, {"type": "read", "title": "The Komodo dragon (Indonesia)", "paras": ["WOW! Fact: The Komodo dragon is the largest lizard in the world. Some are three metres long!"], "img": "L21_c2", "icon": "🦎"}, {"type": "match", "title": "What do these sentences describe?", "pairs": [["It is the national animal of Oman.", "Arabian oryx"], ["They use noises and smells to communicate.", "ring-tailed lemurs"], ["Its national animal is a very large lizard.", "Indonesia"], ["Its national animal is the ring-tailed lemur.", "Madagascar"], ["They use their tongues to locate animals.", "Komodo dragons"]], "icon": "🧩"}, {"type": "tf", "title": "True or false? ✔", "items": [{"text": "A lemur's tail is easy to see in the forest.", "a": true, "fix": "Its tail is easy to see because it's long and striped."}, {"text": "Lemurs are good climbers, but they aren't good runners.", "a": false, "fix": "They are very good at running, jumping and climbing."}, {"text": "Arabian oryx can find food easily.", "a": false, "fix": "They must walk for long distances to find food."}], "icon": "✘"}, {"type": "tf", "title": "True or false? ✔", "items": [{"text": "Arabian oryx don't live in the wild today.", "a": false, "fix": "Now you can find them in Oman, Jordan, the UAE and Saudi Arabia."}, {"text": "Komodo dragons are very dangerous to other animals.", "a": true, "fix": "If it bites another animal, that animal will die."}, {"text": "It's easy for people to run away from Komodo dragons.", "a": false, "fix": "It's very difficult to run away from a Komodo dragon!"}], "icon": "✘"}, {"type": "sort", "title": "Lemur, oryx or Komodo dragon?", "bins": [{"label": "ring-tailed lemur", "icon": "🐒"}, {"label": "Arabian oryx", "icon": "🦌"}, {"label": "Komodo dragon", "icon": "🦎"}], "cards": [{"text": "long, striped tail", "icon": "", "bin": 0}, {"text": "horrible smells", "icon": "", "bin": 0}, {"text": "white fur and long horns", "icon": "", "bin": 1}, {"text": "lives in groups of 15–30", "icon": "", "bin": 1}, {"text": "eats leaves from acacia trees", "icon": "", "bin": 1}, {"text": "tastes the air with its tongue", "icon": "", "bin": 2}, {"text": "venom in its mouth", "icon": "", "bin": 2}, {"text": "the largest lizard in the world", "icon": "", "bin": 2}], "icon": "🗂️"}, {"type": "ask", "title": "The kiwi (New Zealand)", "qs": [{"q": "What is the national animal of New Zealand?", "a": "The kiwi."}, {"q": "Why is the kiwi an unusual bird?", "a": "Because it can't fly."}, {"q": "How big is a kiwi? What about its eggs?", "a": "It's about the size of a chicken, but its eggs are very big for its size."}, {"q": "Why are kiwis in danger?", "a": "Because people brought other animals to New Zealand (e.g. rats). They kill kiwis and steal their eggs."}], "img": "L21_c5", "icon": "🥝🐦"}, {"type": "ask", "title": "Which is the best national animal?", "qs": [{"q": "Which animal do you think is the most amazing?",
