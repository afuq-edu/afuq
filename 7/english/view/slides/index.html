le": "Talal's journey", "qs": [{"q": "Listen to the interview with Talal and make notes: When does the plane take off? When does it land?", "a": "Notes from the recording."}, {"q": "Describe his journey with: take off, land, travel by train, get off, catch a bus, leave, go home.", "a": "His plane takes off at … It lands at … Then he travels by train …"}], "img": "L33_c5", "icon": "🎧"}, {"type": "build", "title": "Make the timetable sentence", "mode": "words", "items": [{"a": "The bus leaves school at 8 o'clock.", "hint": "🚌 8:00", "emo": "🚌"}, {"a": "The plane takes off at half past nine.", "hint": "🛫 9:30", "emo": "🛫"}, {"a": "What time does the train arrive?", "hint": "❓ train", "emo": "🚆"}, {"a": "We land in Cairo at two o'clock.", "hint": "🛬 2:00", "emo": "🛬"}], "icon": "🧩"}, {"type": "ask", "title": "My journey timetable", "qs": [{"q": "How are you going to travel?", "a": "I'm going to travel by bus to Salalah."}, {"q": "When do you leave?", "a": "The bus leaves at 7 o'clock in the morning."}, {"q": "When do you arrive?", "a": "It arrives at 7 o'clock in the evening."}, {"q": "When do you go home?", "a": "We go home on Friday."}], "img": "L33_c1", "icon": "🗓️"}, {"type": "race", "title": "Timetable race", "qs": [{"q": "The opposite of 'take off':", "options": ["land", "leave", "arrive"], "a": 0}, {"q": "The train ___ at 6 p.m.", "options": ["leave", "leaves", "leaving"], "a": 1}, {"q": "'Please ___ your seats.'", "options": ["get", "take", "catch"], "a": 1}, {"q": "What time ___ the flight land?", "options": ["do", "is", "does"], "a": 2}, {"q": "We ___ a bus to the hotel.", "options": ["catch", "land", "pack"], "a": 0}, {"q": "Opposite of 'get on':", "options": ["get off", "take off", "put on"], "a": 0}], "icon": "🏁"}, {"type": "steps", "title": "Let's remember!", "icon": "🧠", "steps": ["Travel verbs: pack your suitcase, go on a journey, travel by train, catch a bus.", "get on ↔ get off · take off ↔ land · arrive ↔ leave · explore · take a seat.", "Timetables → Present simple: The train leaves in 15 minutes.", "Questions: What time does the bus leave? When do we arrive?"]}, {"type": "exit", "title": "Exit ticket", "items": [{"k": "3", "text": "Write the opposite: take off → …, arrive → …"}, {"k": "2", "text": "Complete: The flight ___ (land) at 6 o'clock."}, {"k": "1", "text": "Ask a question about a bus timetable."}], "icon": "🎟️"}, {"type": "homework", "title": "Homework", "head": "My homework", "items": ["Activity Book pp. 48–49: Activities 1–4.", "Grammar practice p. 62: Activities 3–4.", "Write the timetable of a real trip you want to go on."], "icon": "🏠"}]}, {"id": "L34", "unit": "U4", "unitName": "Unit 3: Travel", "title": "Culture & Project: Famous railways", "code": "", "theme": "park", "emo": "🚄", "slides": [{"type": "cover", "say": "Unit 3 · Lesson 6 – WOW! Culture & Project"}, {"type": "goals", "title": "Today's goals", "items": ["I can read about two famous railways.", "I can compare the Haramain and the Trans-Siberian railways."], "icon": "🎯"}, {"type": "goals", "title": "Today's goals", "items": ["I can understand big numbers: 300 km an hour, 9,000 km.", "I can plan a railway map with my group."], "icon": "🎯"}, {"type": "ask", "title": "Let's talk about trains", "qs": [{"q": "How do you usually travel?", "a": "By car / by bus / by plane … (free answers)"}, {"q": "Do you like travelling by train? Why?", "a": "Yes, because you can walk around, look out of the window, sleep … (free answers)"}, {"q": "Look at this train. Where do you think it goes?", "a": "Between Makkah and Madinah in Saudi Arabia – the Haramain High-Speed railway!"}], "img": "L34_c2", "icon": "💬"}, {"type": "mystery", "title": "Which railway is hiding?", "img": "L34_c3", "answer": "The Trans-Siberian railway next to Lake Baikal, Russia! 🚂", "qs": [{"q": "Opposite of 'get on':", "o": ["get off", "take off"], "a": 0}, {"q": "A train that is very fast is …", "o": ["high-speed", "slow"], "a": 0}, {"q": "The biggest continent in the world:", "o": ["Asia", "Europe"], "a": 0}, {"q": "You sleep on a long train journey. Bring your …", "o": ["pyjamas", "flip-flops"], "a": 0}], "icon": "🕵️"}, {"type": "flip", "title": "Railway words", "cards": [{"front": "railway", "icon": "🛤️", "back": "the track that trains run on; a train route\n«The railway is 450 kilometres long.»"}, {"front": "high-speed", "icon": "⚡", "back": "very, very fast\n«a high-speed train»"}, {"front": "kilometres an hour (kmh)", "icon": "🏎️", "back": "how fast something goes\n«Trains can travel at 300 kilometres an hour.»"}, {"front": "bridge", "icon": "🌉", "back": "it goes over a river or a road\n«The line has more than 50 bridges.»"}, {"front": "holy cities", "icon": "🕋", "back": "special cities for religion: Makkah and Madinah\n«It runs between the holy cities.»"}, {"front": "deepest", "icon": "🌊", "back": "it goes down the most\n«Lake Baikal is the deepest lake in the world.»"}], "icon": "🚉"}, {"type": "read", "title": "The Haramain High-Speed railway", "paras": ["The Haramain High-Speed railway in Saudi Arabia [[runs]] between the holy cities of Makkah and Madinah and also stops at Jeddah.", "Trains can travel at 300 kilometres an hour, so it does not take long to go along the 450-kilometre railway."], "img": "L34_c2", "icon": "🐪"}, {"type": "read", "title": "The Haramain High-Speed railway", "paras": ["The line opened in 2018 and has more than 50 bridges and 12 places where camels can [[cross]]! Trains are [[designed]] to run in temperatures of 50°C."], "img": "L34_c2", "icon": "🐪"}, {"type": "read", "title": "The Trans-Siberian railway", "paras": ["The Trans-Siberian railway from Moscow to Vladivostok in Russia is the [[longest]] railway in the world. It's more than 9,000 kilometres long.", "You get on the train in Europe and you get off it in Asia! You sleep on the train, so you need to bring your pyjamas and toothbrush!"], "img": "L34_c3", "icon": "🚂"}, {"type": "read", "title": "The Trans-Siberian railway", "paras": ["The train goes past Lake Baikal, the deepest lake in the world. There are restaurants on the train, but most people take lots of food in their suitcases, too.", "WOW! Fact: You can get off the Trans-Siberian train to buy food, but you have to do it quickly. Sometimes the train only stops for ten minutes!"], "img": "L34_c3", "icon": "🚂"}, {"type": "sort", "title": "Which railway?", "bins": [{"label": "Haramain High-Speed", "icon": "🐪"}, {"label": "Trans-Siberian", "icon": "🚂"}], "cards": [{"text": "It's the longest railway in the world.", "icon": "", "bin": 1}, {"text": "People go from Europe to Asia.", "icon": "", "bin": 1}, {"text": "The train travels at 300 kmh.", "icon": "", "bin": 0}, {"text": "You start in Makkah and finish in Madinah.", "icon": "", "bin": 0}, {"text": "It travels next to the deepest lake in the world.", "icon": "", "bin": 1}, {"text": "It has 12 places where camels can cross.", "icon": "", "bin": 0}, {"text": "You need your pyjamas.", "icon": "", "bin": 1}, {"text": "It opened in 2018.", "icon": "", "bin": 0}], "icon": "🗂️"}, {"type": "tf", "title": "True or false? Explain!", "items": [{"text": "The Haramain High-Speed railway only stops at two places.", "a": false, "fix": "It stops in Makkah, Jeddah and Madinah."}, {"text": "The Haramain trains are not very fast.", "a": false, "fix": "They travel at 300 kilometres an hour."}, {"text": "The Haramain trains do not have problems in the hot Saudi summers.", "a": true, "fix": "They are designed to run in temperatures of 50°C."}], "icon": "✔️✘"}, {"type": "tf", "title": "True or false? Explain!", "items": [{"text": "The Trans-Siberian journey is longer than 9,000 kilometres.", "a": true, "fix": "It's more than 9,000 kilometres long."}, {"text": "You can finish the Trans-Siberian journey in one day.", "a": false, "fix": "You sleep on the train – it takes many days."}, {"text": "Not many people take food on the Trans-Siberian train.", "a": false, "fix": "Most people take lots of food in their suitcases."}], "icon": "✔️✘"}, {"type": "quiz", "title": "Railway numbers", "qs": [{"q": "How long is the Haramain railway?", "o": ["450 km", "9,000 km", "300 km"], "a": 0, "why": "…the 450-kilometre railway."}, {"q": "How fast can Haramain trains travel?", "o": ["50 kmh", "300 kmh", "200 kmh"], "a": 1, "why": "300 kilometres an hour."}, {"q": "When did the Haramain line open?", "o": ["2008", "2018", "2028"], "a": 1, "why": "The line opened in 2018."}, {"q": "Sometimes the Trans-Siberian train only stops for …", "o": ["ten minutes", "ten hours", "one day"], "a": 0, "why": "WOW! Fact."}], "icon": "🔢"}, {"type": "ask", "title": "The Glacier Express", "qs": [{"q": "Listen to the advert. Where is the Glacier Express?", "a": "In Switzerland – between Zermatt and St. Moritz."}, {"q": "How long is the journey?", "a": "290 kilometres (the time is in the recording)."}, {"q": "What does the train go through and over?", "a": "Through tunnels and over hundreds of bridges; high mountains and deep valleys."}, {"q": "What's the highest part of the journey?", "a": "The Oberalp Pass – about 2,130 metres high."}], "img": "L34_c5", "icon": "🏔️"}, {"type": "ask", "title": "Ask and answer", "qs": [{"q": "Which journey from the text would you prefer to go on? Why?", "a": "I'd prefer the Haramain railway because I want to visit Makkah … / the Trans-Siberian because it's an adventure."}, {"q": "Have you ever been on a long train journey?", "a": "Yes, I have. / No, I haven't."}, {"q": "Have you ever slept on a train? If not, would you like to?", "a": "No, I haven't, but I'd like to! (free answers)"}], "img": "L34_c1", "icon": "🗣️"}, {"type": "order", "title": "Project steps: make a railway map", "items": ["Choose a continent and a famous railway.", "Decide who will find out each thing.", "Find out how long the route is and where it starts and finishes.", "Draw the route on a map and display pictures next to it.", "Write notes below the map and pictures.", "Present your map to the class."], "icon": "🗺️"}, {"type": "explain", "title": "Writing & speaking tips", "icon": "🎤", "lines": ["Writing tip: You can use the abbreviation [[kmh]] for kilometres an hour.", "Speaking tip: Remember to [[sound interested]] when you talk. Then other people will be interested, too!"], "rule": "Map + pictures + notes + an interested voice = a great presentation!"}, {"type": "flip", "title": "Writing & speaking tips 💡 – examples", "cards": [{"front": "The Ghan travels about [[85 kmh]].", "icon": "💡", "back": "✍️ short and clear"}, {"front": "It starts in [[Adelaide]] and finishes in [[Darwin]].", "icon": "✨", "back": "📍 start / finish"}, {"front": "You can see [[amazing]] deserts on the way!", "icon": "🔎", "back": "🎤 sound interested"}]}, {"type": "write", "title": "Write about your famous railway", "task": "Choose a railway (e.g. The Ghan, The Blue Train, Oslo to Bergen) and write notes for your map.", "steps": ["Where does the railway start and finish?", "How far does the train travel?", "How long does the journey take?", "What can people see as they travel?", "What is unusual about this railway?"], "words": ["starts in", "finishes in", "kilometres", "kmh", "takes … hours / days", "you can see", "bridges", "mountains", "desert", "the longest", "unusual"], "model": "The Oslo to Bergen railway in Norway starts in Oslo and finishes in Bergen. It's about 500 kilometres long and the journey takes about 7 hours. You can see mountains, lakes and snow. It's unusual because it's one of the highest railways in northern Europe.", "icon": "✍️"}, {"type": "boxes", "title": "Treasure boxes", "boxes": [{"label": "1", "q": "Which cities does the Haramain railway connect?", "a": "Makkah and Madinah (and it stops at Jeddah)."}, {"label": "2", "q": "Why does the Haramain railway have special places?", "a": "So camels can cross! 🐪"}, {"label": "3", "q": "Where does the Trans-Siberian railway start and finish?", "a": "Moscow → Vladivostok (Russia)."}, {"label": "4", "q": "What's special about Lake Baikal?", "a": "It's the deepest lake in the world."}, {"label": "5", "q": "What does kmh mean?", "a": "kilometres an hour"}, {"label": "6", "q": "Speaking tip for presentations?", "a": "Sound interested when you talk!"}], "icon": "🎁"}, {"type": "steps", "title": "Let's remember!", "icon": "🧠", "steps": ["Haramain High-Speed: Makkah – Jeddah – Madinah, 450 km, 300 kmh, opened 2018, places for camels.", "Trans-Siberian: Moscow – Vladivostok, 9,000+ km, Europe to Asia, past Lake Baikal.", "Project: choose a railway, draw the route, add pictures and notes, present it.", "kmh = kilometres an hour."]}, {"type": "exit", "title": "Exit ticket", "items": [{"k": "3", "text": "Which is the longest railway in the world?"}, {"k": "2", "text": "Give one fact about the Haramain railway."}, {"k": "1", "text": "Which railway would you like to travel on? Why?"}], "icon": "🎟️"}, {"type": "homework", "title": "Homework", "head": "My homework", "items": ["Activity Book p. 50: Activities 1–4.", "Project: find pictures and facts about your group's railway.", "Practise your part of the presentation."], "icon": "🏠"}]}, {"id": "L35", "unit": "U4", "unitName": "Unit 3: Travel", "title": "English in action: Saying how you feel about the future", "code": "", "theme": "park", "emo": "🤩", "slides": [{"type": "cover", "say": "Unit 3 · Lesson 7 – saying how you feel about the future"}, {"type": "goals", "title": "Today's goals", "items": ["I can say how I feel about the future.", "I can use: I'm looking forward to … / I can't wait … / I'm worried about …"], "icon": "🎯"}, {"type": "goals", "title": "Today's goals", "items": ["I can stress the important words in questions with going to.", "I can make a dialogue about my holiday plans."], "icon": "🎯"}, {"type": "riddle", "title": "How do I feel?", "items": [{"clues": ["Tomorrow is Eid!", "I'm going to see my cousins and get presents.", "I'm very happy about it."], "a": "excited 🤩", "emo": "🤩"}, {"clues": ["I have a big test tomorrow.", "I didn't study much.", "I can't sleep!"], "a": "worried 😟", "emo": "😟"}, {"clues": ["It's a long car journey – nine hours!", "I don't like long journeys.", "I'm not happy about it."], "a": "not looking forward to it 😒", "emo": "😒"}], "icon": "🤔"}, {"type": "read", "title": "Helen and Katy (1)", "paras": ["Helen: Hi Katy! I [[can't wait]] for the summer holidays.\nKaty: Hi Helen! What are you going to do?", "Helen: We're going to go camping. I'm [[worried about]] the journey because I don't like long car journeys. But I'm [[excited about]] camping!\nKaty: Where are you going to camp, Helen?\nHelen: In a forest!"], "img": "L35_c1", "icon": "🎧"}, {"type": "read", "title": "Helen and Katy (2)", "paras": ["Katy: That sounds great! We're going to go to Salalah.\nHelen: How are you going to travel?\nKaty: By [[coach]]. I love travelling by coach. I'm really [[looking forward to]] it!", "Helen: How long's the journey?\nKaty: About nine hours.\nHelen: Wow! That's a long time!\nKaty: You're right. I'll take some books to read!"], "icon": "🎧"}, {"type": "quiz", "title": "Circle the correct answers", "qs": [{"q": "Helen ___ long car journeys.", "o": ["likes", "doesn't like"], "a": 1, "why": "I don't like long car journeys."}, {"q": "Katy ___ travelling by coach.", "o": ["likes", "doesn't like"], "a": 0, "why": "I love travelling by coach."}, {"q": "Where is Helen going to camp?", "o": ["on a beach", "in a forest"], "a": 1, "why": "In a forest!"}, {"q": "How long is Katy's journey to Salalah?", "o": ["about nine hours", "about two hours"], "a": 0, "why": "About nine hours."}, {"q": "What will Katy take?", "o": ["some books", "a tent"], "a": 0, "why": "I'll take some books to read!"}], "icon": "✅"}, {"type": "explain", "title": "Saying how you feel about the future", "lines": ["😀 I'm (really) [[looking forward to]] … · I [[can't wait]] (for / to …) · I'm [[excited about]] …", "😟 I'm [[not looking forward to]] … · I'm [[worried about]] …"], "img": "L35_c2", "rule": "looking forward to · can't wait for/to · excited about · worried about", "icon": "💡"}, {"type": "flip", "title": "Saying how you feel about the future 💡 – examples", "cards": [{"front": "I'm really looking forward [[to]] the trip.", "icon": "💡", "back": "to + noun"}, {"front": "I can't wait [[for]] the holidays. / I can't wait [[to]] go.", "icon": "✨", "back": "for + noun · to + verb"}, {"front": "I'm worried [[about]] the journey.", "icon": "🔎", "back": "about + noun / -ing"}]}, {"type": "sort", "title": "Happy or worried?", "bins": [{"label": "Happy about the future", "icon": "😀"}, {"label": "Not happy about the future", "icon": "😟"}], "cards": [{"text": "I can't wait for the summer holidays.", "icon": "", "bin": 0}, {"text": "I'm excited about camping!", "icon": "", "bin": 0}, {"text": "I'm really looking forward to it!", "icon": "", "bin": 0}, {"text": "I'm worried about the journey.", "icon": "", "bin": 1}, {"text": "I'm not looking forward to the test.", "icon": "", "bin": 1}, {"text": "I'm worried about the language.", "icon": "", "bin": 1}], "icon": "🗂️"}, {"type": "match", "title": "Match the situation and the feeling", "pairs": [["Eid is next week! 🎁", "I can't wait for Eid!"], ["A nine-hour coach journey 🚌", "I'm worried about the long journey."], ["A camping trip in the forest ⛺", "I'm excited about camping!"], ["A Maths test on Sunday 📝", "I'm not looking forward to the test."], ["A visit to my cousins in Doha ✈️", "I'm really looking forward to it!"]], "icon": "🧩"}, {"type": "quiz", "title": "Complete Faisal's dialogue", "icon": "✏️", "qs": [{"q": "Faisal: ___ the summer break!", "o": ["I'm really looking forward to", "I'm worried about the language"], "a": 0}, {"q": "Faisal: ___ go windsurfing in Malaysia.", "o": ["My family and I are going to", "I can't wait to go because"], "a": 0}, {"q": "Faisal: Yes! ___ I love windsurfing.", "o": ["I'm really excited about it.", "I'm not looking forward to that part."], "a": 0}, {"q": "Faisal: But I'm also ___. I don't speak Malay!", "o": ["worried about the language", "excited about it"], "a": 0}, {"q": "Hilal: I'm going to Indonesia with my parents and ___", "o": ["I can't wait to go because", "I'm worried about the language"], "a": 0}, {"q": "Hilal: By plane, but ___ (He's afraid of flying.)", "o": ["I'm not looking forward to that part.", "I'm really excited about it."], "a": 0}]}, {"type": "ask", "title": "Make new dialogues", "qs": [{"q": "A: I'm looking forward to the summer holidays.", "a": "B: What are you going to do?"}, {"q": "A: I'm going to (…) and I'm excited about (…)", "a": "B: (…)? What an adventure!"}, {"q": "Try: Eid / a trip to Jebel Akhdar / a football match …", "a": "I can't wait for Eid! I'm going to visit my grandparents …"}], "img": "L35_c2", "icon": "🗣️"}, {"type": "explain", "title": "Stress in questions", "lines": ["In questions with going to, we say the [[important words]] most clearly: the question word and the main verb."], "img": "L35_c3", "rule": "QUESTION WORD … going to … MAIN VERB", "icon": "🔊"}, {"type": "flip", "title": "Stress in questions 🔊 – examples", "cards": [{"front": "[[What]] are you going to [[do]]?", "icon": "💡", "back": "🔊"}, {"front": "[[Where]] are you going to [[sleep]]?", "icon": "✨", "back": "🔊"}, {"front": "[[How]] are you going to [[travel]]?", "icon": "🔎", "back": "🔊"}, {"front": "[[Who]] are you going to [[go]] with?", "icon": "📌", "back": "🔊"}]}, {"type": "wheel", "title": "Spin and ask!", "items": [{"q": "Where are you going to go this summer?", "a": "I'm going to go to … I'm really looking forward to it!"}, {"q": "When are you going to pack?", "a": "I'm going to pack on Thursday."}, {"q": "How are you going to travel?", "a": "By car / plane / coach …"}, {"q": "Who are you going to go with?", "a": "With my family / my cousins …"}, {"q": "What are you excited about?", "a": "I'm excited about …"}, {"q": "What are you worried about?", "a": "I'm worried about …"}], "icon": "🎡"}, {"type": "write", "title": "My feelings about the future", "task": "Answer the questions with your own ideas. Explain your reasons.", "steps": ["What are you excited about doing this week? Why?", "Is there something you can't wait to do next weekend?", "What are you really looking forward to doing this school year?", "Is there something you aren't looking forward to?", "Are you worried about anything at the moment?"], "words": ["I'm excited about …", "I can't wait to …", "I'm really looking forward to …", "I'm not looking forward to …", "I'm worried about …", "because"], "model": "This week I'm excited about the school football match because our team is very good. I can't wait to visit my grandparents in Ibri next weekend. I'm really looking forward to the school trip this year. I'm not looking forward to the Maths test, and I'm a bit worried about it.", "icon": "✍️"}, {"type": "balloons", "title": "Pop the right balloon!", "rounds": [{"q": "I'm really looking forward ___ the trip.", "o": ["to", "for", "about"], "a": 0}, {"q": "I can't wait ___ the holidays!", "o": ["about", "for", "to"], "a": 1}, {"q": "I'm worried ___ the journey.", "o": ["to", "for", "about"], "a": 2}], "icon": "🎈"}, {"type": "balloons", "title": "Pop the right balloon!", "rounds": [{"q": "I'm excited ___ camping!", "o": ["about", "to", "for"], "a": 0}, {"q": "Katy is going to travel to Salalah by …", "o": ["plane", "coach", "car"], "a": 1}, {"q": "Which word is stressed? 'How are you going to travel?'", "o": ["are + to", "How + travel", "you + going"], "a": 1}], "icon": "🎈"}, {"type": "steps", "title": "Let's remember!", "icon": "🧠", "steps": ["😀 I'm (really) looking forward to … · I can't wait for/to … · I'm excited about …", "😟 I'm not looking forward to … · I'm worried about …", "Helen is worried about the long car journey; Katy is looking forward to the coach trip to Salalah.", "Stress the question word and the main verb: WHERE are you going to SLEEP?"]}, {"type": "exit", "title": "Exit ticket", "items": [{"k": "3", "text": "Write one thing you can't wait for."}, {"k": "2", "text": "Write one thing you're worried about."}, {"k": "1", "text": "Which words are stressed: 'What are you going to take?'"}], "icon": "🎟️"}, {"type": "homework", "title": "Homework", "head": "My homework", "items": ["Activity Book p. 51: Activities 1–3.", "Write a short dialogue about your next holiday using three expressions from Say it!", "Practise the questions in Activity 4 with the correct stress."], "icon": "🏠"}]}, {"id": "L36", "unit": "U4", "unitName": "Unit 3: Travel", "title": "Reading: Literacy – an email (School trip to Bahla)", "code": "", "theme": "park", "emo": "📧", "slides": [{"type": "cover", "say": "Unit 3 · Lesson 8 – Literacy: reading an email"}, {"type": "goals", "title": "Today's goals", "items": ["I can read an email about a school trip.", "I can find times and information quickly."], "icon": "🎯"}, {"type": "goals", "title": "Today's goals", "items": ["I can understand new words in context: express, lucky, brand-new …", "I can plan a one-day school trip with my group."], "icon": "🎯"}, {"type": "quiz", "title": "What do they need to take?", "qs": [{"q": "Look quickly at the email. Do the children need a swimsuit?", "o": ["Yes", "No"], "a": 0, "why": "The hotel has a brand-new swimming pool."}, {"q": "Do they need a laptop?", "o": ["Yes", "No"], "a": 1, "why": "The email doesn't say laptop."}, {"q": "Do they need flip-flops?", "o": ["Yes", "No"], "a": 0, "why": "Remember to bring your swimsuit and your flip-flops."}, {"q": "Do they need a suitcase?", "o": ["Yes", "No"], "a": 0, "why": "On Tuesday, after breakfast, pack your suitcase."}, {"q": "Do they need money?", "o": ["Yes", "No"], "a": 0, "why": "Bring a wallet, with some money…"}], "icon": "👀"}, {"type": "read", "title": "School trip to Bahla (1)", "paras": ["To: Grade 7 students\nSubject: School trip to Bahla"], "img": "L36_c2", "icon": "📧"}, {"type": "read", "title": "School trip to Bahla (1)", "paras": ["Dear students,\nWe can now send you information about our school trip to Bahla. The trip is next Sunday (16th April). Please arrive at the school at 4 p.m. The roads are very [[busy]] then, so don't be late. The [[express]] coach leaves at 4.30 p.m. and we arrive at Bahla at 6.30 p.m."], "img": "L36_c2", "icon": "📧"}, {"type": "read", "title": "School trip to Bahla (1)", "paras": ["Our hotel is near the famous Bahla fort. We're [[lucky]] because the hotel has a [[brand-new]] swimming pool. Remember to bring your swimsuit and your flip-flops, and you can swim before dinner. Dinner is at 7 p.m. every evening."], "img": "L36_c2", "icon": "📧"}, {"type": "read", "title": "School trip to Bahla (2)", "paras": ["On Monday, we visit the famous Bahla fort, which has been a UNESCO World Heritage site since 1987. You need to bring a wallet, with some money to buy a sandwich and a drink. The weather is usually hot in Bahla. Bring your sunhat and light clothes. You must wear trainers or comfortable shoes because we're going to do a lot of walking."], "icon": "📧"}, {"type": "read", "title": "School trip to Bahla (2)", "paras": ["We're going to look around the fort. You can see some [[wonderful]] views from the walls at the top. We're also going to look around the town and the souq. Bring enough money to buy a gift if you want."], "icon": "📧"}, {"type": "read", "title": "School trip to Bahla (3)", "paras": ["On Tuesday, after breakfast, pack your suitcase and wait at the hotel entrance. The coach back to Muscat leaves at 9 a.m. and arrives at the school at about 11 a.m.", "We're sure that you will have a [[lovely]] time in Bahla and look forward to seeing you soon.\nYours,\nMr Sultan, head teacher"], "icon": "📧"}, {"type": "quiz", "title": "Words in context", "icon": "✏️", "qs": [{"q": "What a ___ photo of your family. Everyone looks so happy.", "o": ["lovely", "busy"], "a": 0}, {"q": "The hospital was very ___. I had to wait an hour to see the doctor.", "o": ["busy", "lucky"], "a": 0}, {"q": "My parents used to have an old car, but now they have a ___ one.", "o": ["express", "brand-new"], "a": 1}, {"q": "Marwa won first prize at the science fair! That's ___ news!", "o": ["wonderful", "busy"], "a": 0}, {"q": "Don't take the regular train. You'll be late. Take the ___ train.", "o": ["express", "lovely"], "a": 0}, {"q": "The weather was cloudy when I visited Al Buraimi in February. I was so ___!", "o": ["lucky", "brand-new"], "a": 0}]}, {"type": "quiz", "title": "The trip timetable", "icon": "✏️", "qs": [{"q": "On day one, students must be at the school at ___.", "o": ["4 p.m.", "4.30 p.m."], "a": 0}, {"q": "The express coach leaves at ___ and arrives at Bahla at 6.30 p.m.", "o": ["4.30 p.m.", "6 p.m."], "a": 0}, {"q": "At the hotel, they have dinner at ___.", "o": ["7 p.m.", "8 p.m."], "a": 0}, {"q": "They visit Bahla Fort the ___ day.", "o": ["second", "third"], "a": 0}, {"q": "After ___ on day three, they must pack their suitcase.", "o": ["breakfast", "lunch"], "a": 0}, {"q": "The coach to Muscat leaves at 9 a.m. and they arrive at the school at about ___.", "o": ["11 a.m.", "1 p.m."], "a": 0}]}, {"type": "order", "title": "Put the trip in order", "items": ["Arrive at the school at 4 p.m.", "The express coach leaves at 4.30 p.m.", "Swim in the brand-new pool before dinner.", "Visit Bahla fort and see the views from the walls.", "Look around the town and the souq.", "Pack your suitcase after breakfast."], "icon": "🔢"}, {"type": "quiz", "title": "Why? Answer the questions", "qs": [{"q": "How are the students going to get to Bahla?", "o": ["They are going to take an express coach.", "They are going to fly."], "a": 0, "why": "The express coach leaves at 4.30 p.m."}, {"q": "Why mustn't they be late?", "o": ["The roads are very busy then.", "The fort closes early."], "a": 0, "why": "The roads are very busy then, so don't be late."}, {"q": "What is at the same time every evening?", "o": ["dinner – at 7 p.m.", "swimming – at 6 p.m."], "a": 0, "why": "Dinner is at 7 p.m. every evening."}, {"q": "Why should they take a sunhat?", "o": ["The weather is usually hot in Bahla.", "It's going to rain."], "a": 0, "why": "The weather is usually hot in Bahla."}, {"q": "What can they see from the walls of the fort?", "o": ["the sea", "some wonderful views"], "a": 1, "why": "You can see some wonderful views from the walls at the top."}, {"q": "What is the head teacher sure they will have?", "o": ["a lovely time", "a test"], "a": 0, "why": "We're sure that you will have a lovely time in Bahla."}], "icon": "✅"}, {"type": "tf", "title": "True or false?", "items": [{"text": "Bahla fort has been a UNESCO World Heritage site since 1987.", "a": true, "fix": "…since 1987."}, {"text": "The hotel is far from the fort.", "a": false, "fix": "Our hotel is near the famous Bahla fort."}, {"text": "The students can wear sandals for the walking.", "a": false, "fix": "You must wear trainers or comfortable shoes."}, {"text": "Mr Sultan is the head teacher.", "a": true, "fix": "Yours, Mr Sultan, head teacher."}], "icon": "✔️✘"}, {"type": "ask", "title": "What do you think?", "qs": [{"q": "Which do you think will be the most interesting part of the visit? Why?", "a": "The fort, because you can see wonderful views … / the souq, because I can buy a gift … (free answers)"}, {"q": "What do you think is the most important thing to take on this trip? Why?", "a": "Money, because they need to buy food … / trainers … (free answers)"}, {"q": "What other things do you think the children will need? Make a list.", "a": "a toothbrush, pyjamas, a water bottle, a charger, sun cream, a camera …"}], "img": "L36_c1", "icon": "💬"}, {"type": "ask", "title": "On the trip!", "qs": [{"q": "Imagine you're on the trip. What do you have in your bag today?", "a": "I have my wallet, my sunhat and a bottle of water."}, {"q": "What are you going to do?", "a": "We're going to look around the fort and the souq."}, {"q": "What are you going to buy at the souq?", "a": "I'm going to buy a gift for my mum – some halwa / a small pot."}], "img": "L36_c2", "icon": "🗣️"}, {"type": "ask", "title": "Plan a one-day school trip", "qs": [{"q": "Where will you go? (a theme park, a local farm, a planetarium, a science museum, a sports centre)", "a": "We'll go to the planetarium …"}, {"q": "What time will you start and finish? How will you travel?", "a": "We'll start at 8 a.m. and finish at 2 p.m. We'll travel by school bus."}, {"q": "What will you do and see there? Where will you have lunch?", "a": "We'll watch a show about the stars … We'll have lunch in the café."}, {"q": "What will you probably enjoy the most?", "a": "We'll probably enjoy … the most."}], "icon": "🗺️"}, {"type": "enter", "title": "Catch the things the email says to bring!", "gate": "✓", "items": [{"text": "torch", "in": false}, {"text": "flip-flops", "in": true}, {"text": "boots", "in": false}, {"text": "blanket", "in": false}, {"text": "wallet", "in": true}, {"text": "swimsuit", "in": true}]}, {"type": "race", "title": "Bahla race", "qs": [{"q": "The trip is on …", "options": ["Sunday", "Monday", "Friday"], "a": 0}, {"q": "The coach to Bahla takes …", "options": ["two hours", "one hour", "four hours"], "a": 0}, {"q": "'brand-new' means …", "options": ["very old", "completely new", "expensive"], "a": 1}, {"q": "The email ends with …", "options": ["Love,", "Yours,", "Bye!"], "a": 1}, {"q": "On Monday they visit …", "options": ["the beach", "Bahla fort", "a museum"], "a": 1}, {"q": "An 'express' coach is …", "options": ["fast", "slow", "small"], "a": 0}], "icon": "🏁"}, {"type": "steps", "title": "Let's remember!", "icon": "🧠", "steps": ["An email has: To, Subject, Dear …, paragraphs, Yours, (name).", "The trip: Sunday by express coach → hotel and pool → Monday the fort and souq → Tuesday back to Muscat.", "Words: express, busy, lucky, lovely, brand-new, wonderful.", "Reading tip: you don't have to look up every word!"]}, {"type": "exit", "title": "Exit ticket", "items": [{"k": "3", "text": "What time does the coach leave for Bahla?"}, {"k": "2", "text": "Name two things the students need to bring."}, {"k": "1", "text": "Who wrote the email?"}], "icon": "🎟️"}, {"type": "homework", "title": "Homework", "head": "My homework", "items": ["Activity Book p. 52: Activities 1–3.", "Finish your group notes for a one-day school trip (Activity 4).", "Read the email aloud at home."], "icon": "🏠"}]}, {"id": "L37", "unit": "U4", "unitName": "Unit 3: Travel", "title": "Writing: An email", "code": "", "theme": "park", "emo": "✍️", "slides": [{"type": "cover", "say": "Unit 3 · Lesson 9 – a school trip to the Moon … and yours!"}, {"type": "goals", "title": "Today's goals", "items": ["I can complete an email with adjectives.", "I can name the parts of a formal email."], "icon": "🎯"}, {"type": "goals", "title": "Today's goals", "items": ["I can give instructions in different ways.", "I can write an email from a head teacher about a school trip."], "icon": "🎯"}, {"type": "mystery", "title": "Where is the trip going?", "img": "L37_c1", "answer": "A school trip to the Moon! 🚀🌕", "qs": [{"q": "An email starts with …", "o": ["Dear …", "Yours,"], "a": 0}, {"q": "'brand-new' means …", "o": ["completely new", "very old"], "a": 0}, {"q": "The Bahla coach was …", "o": ["express", "slow"], "a": 0}, {"q": "Who wrote the Bahla email?", "o": ["the head teacher", "a student"], "a": 0}], "icon": "🕵️"}, {"type": "read", "title": "School trip to the Moon (1)", "paras": ["To: Grade 7 students\nSubject: School trip to the Moon\nDear students,\nWe are now ready to send you information about our school trip to the Moon next month.", "Sunday May 4th: We're going to arrive at the launch pad at 4 a.m. We're going to travel by (1) [[express]] rocket to the Moon. We take off at 6 a.m. Bring a (2) ___ suitcase because the rocket isn't very big!"], "icon": "🚀"}, {"type": "read", "title": "School trip to the Moon (1)", "paras": ["Monday May 5th: The rocket lands at 6 p.m. We're going to travel by Moon bus to the hotel. We're going to stay in the wonderful Space Hotel. It isn't very (3) ___, but it's quite comfortable. We're going to eat special space food for dinner. It looks funny, but it's (4) ___!"], "icon": "🚀"}, {"type": "read", "title": "School trip to the Moon (2)", "paras": ["Tuesday–Thursday 6th–8th May: We're going to explore the Moon! Everyone needs to wear spacesuits with big helmets and (5) ___ boots. We're going to walk on the Moon and travel in special space cars. Bring some very warm clothes to wear under your spacesuit.", "Friday 9th May: The rocket to Earth takes off at 10 a.m. Enjoy the journey! If you look through the windows, you'll see (6) ___ views of Earth!"], "icon": "🌕"}, {"type": "read", "title": "School trip to the Moon (2)", "paras": ["If you have any questions, you can email me at any time.\nWe look forward to seeing you soon,\nYours,\nMrs Muna, head teacher"], "icon": "🌕"}, {"type": "quiz", "title": "Complete the email", "icon": "✏️", "qs": [{"q": "We're going to travel by (1) ___ rocket to the Moon.", "o": ["express", "heavy"], "a": 0}, {"q": "Bring a (2) ___ suitcase because the rocket isn't very big!", "o": ["small", "big"], "a": 0}, {"q": "It isn't very (3) ___, but it's quite comfortable.", "o": ["big", "delicious"], "a": 0}, {"q": "It looks funny, but it's (4) ___!", "o": ["delicious", "heavy"], "a": 0}, {"q": "Everyone needs to wear spacesuits with big helmets and (5) ___ boots.", "o": ["heavy", "small"], "a": 0}, {"q": "You'll see (6) ___ views of Earth!", "o": ["amazing", "express"], "a": 0}]}, {"type": "explain", "title": "How to write an email", "icon": "📧", "lines": ["[[To]] + [[Subject]] at the top · Start with [[Dear]] (name) and say [[why]] you are writing.", "Use [[paragraphs]] (you can add headings) · End with [[Yours,]] (name)."], "rule": "To → Subject → Dear … → why → paragraphs → Yours, (name)"}, {"type": "flip", "title": "How to write an email 📧 – examples", "cards": [{"front": "To: Grade 7 students · Subject: School trip to the Moon", "icon": "💡", "back": "top"}, {"front": "Dear students, We are now ready to send you information about …", "icon": "✨", "back": "why"}, {"front": "We look forward to seeing you soon, Yours, Mrs Muna", "icon": "🔎", "back": "end"}]}, {"type": "sort", "title": "Formal or informal?", "bins": [{"label": "Formal", "icon": "🎩"}, {"label": "Informal", "icon": "😎"}], "cards": [{"text": "Dear …", "icon": "", "bin": 0}, {"text": "We are now ready to send you information …", "icon": "", "bin": 0}, {"text": "We look forward to seeing you soon,", "icon": "", "bin": 0}, {"text": "Yours,", "icon": "", "bin": 0}, {"text": "Hi …", "icon": "", "bin": 1}, {"text": "Here's some information …", "icon": "", "bin": 1}, {"text": "See you soon …", "icon": "", "bin": 1}, {"text": "From …", "icon": "", "bin": 1}], "icon": "🗂️"}, {"type": "explain", "title": "Giving instructions", "icon": "📋", "lines": ["You can give instructions in different ways."], "rule": "Bring … · Don't forget … · Remember to … · You need to … · You must …"}, {"type": "flip", "title": "Giving instructions 📋 – examples", "cards": [{"front": "[[Please arrive]] at 4 p.m. [[Don't be]] late.", "icon": "💡", "back": "imperative"}, {"front": "[[Remember to bring]] your swimsuit.", "icon": "✨", "back": "remember to"}, {"front": "[[You need to bring]] a wallet.", "icon": "🔎", "back": "need to"}, {"front": "[[You must wear]] trainers.", "icon": "📌", "back": "must"}]}, {"type": "quiz", "title": "Complete the instructions", "icon": "✏️", "qs": [{"q": "___ your umbrella. The weather could be rainy.", "o": ["Don't forget", "You must"], "a": 0}, {"q": "___ a pillow so that you can sleep during the flight.", "o": ["Bring", "Don't bring"], "a": 0}, {"q": "You ___ stay together. We don't want to lose you!", "o": ["must", "need"], "a": 0}, {"q": "You ___ to bring your passport with you.", "o": ["need", "must"], "a": 0}, {"q": "___ to bring flip-flops for the pool.", "o": ["Don't forget", "Must"], "a": 0}, {"q": "You ___ turn off the lights when you leave a room.", "o": ["must", "need"], "a": 0}]}, {"type": "order", "title": "Put the email in order", "items": ["To: Grade 7 students · Subject: School camping trip", "Dear students,", "We can now send you information about our school camping trip next month.", "The coach leaves at 7.30 a.m. and we arrive at the mountains at 11.30 a.m.", "On the second day, we're going to visit a wadi. Bring your swimsuit and your flip-flops.", "We're sure that you will have a lovely time and we look forward to seeing you soon."], "icon": "🔢"}, {"type": "quiz", "title": "Email check", "qs": [{"q": "What goes at the top of an email?", "o": ["To and Subject", "Yours,"], "a": 0, "why": "Write who the email is to and complete the subject box."}, {"q": "What do you say in the first paragraph?", "o": ["why you are writing", "goodbye"], "a": 0, "why": "In the first paragraph, say why you are writing."}, {"q": "Which is the best subject?", "o": ["School trip to Nizwa", "Hello!!!"], "a": 0, "why": "The subject tells the reader what the email is about."}, {"q": "How does a formal email end?", "o": ["Yours, Mr Ali", "Bye! Ali"], "a": 0, "why": "Formal emails end with Yours, (name)."}], "icon": "✅"}, {"type": "write", "title": "Write your email", "task": "You are a head teacher. Write an email to your students about an amazing school trip (one day or more). Plan, write, check and rewrite.", "steps": ["To: … · Subject: …", "Dear students, … say why you are writing.", "Describe what the students are going to do – one paragraph for each activity or day.", "Give instructions: Bring … / You must … / Don't forget …", "End correctly: We look forward to seeing you soon, Yours, (name)."], "words": ["We can now send you information about …", "The coach leaves at …", "We arrive at …", "We're going to …", "Bring …", "Remember to …", "You must …", "wonderful", "amazing", "lovely", "Yours,"], "model": "To: Grade 7 students\nSubject: School trip to Wadi Shab\nDear students,\nWe can now send you information about our school trip to Wadi Shab next Thursday. Please arrive at the school at 7 a.m. The coach leaves at 7.30 a.m. and we arrive at the wadi at 9.30 a.m.\nWe're going to walk along the wadi and swim in the beautiful pools. You must wear comfortable shoes. Remember to bring your swimsuit, a towel and a lot of water.\nThe coach back to school leaves at 3 p.m.\nWe look forward to seeing you soon,\nYours,\nMr Khalid, head teacher", "icon": "✍️"}, {"type": "tf", "title": "Check your work", "items": [{"text": "I have put who the email is to and included a subject.", "a": true, "fix": "To: … Subject: … ✅"}, {"text": "I started with 'Hi guys!'", "a": false, "fix": "A formal email starts with Dear …"}, {"text": "I divided the email into paragraphs.", "a": true, "fix": "One paragraph for each activity or day ✅"}, {"text": "I ended the email with 'See ya!'", "a": false, "fix": "End with: Yours, (name)."}], "icon": "✔️✘"}, {"type": "wheel", "title": "Email wheel", "items": [{"q": "Say a good subject for a trip email.", "a": "School trip to Jebel Shams / Nizwa / the planetarium …"}, {"q": "Start the email!", "a": "Dear students, We can now send you information about …"}, {"q": "Give an instruction with 'must'.", "a": "You must wear trainers."}, {"q": "Give an instruction with 'Remember to'.", "a": "Remember to bring a sunhat."}, {"q": "Use a nice adjective about the trip.", "a": "You'll see amazing views! / a wonderful fort …"}, {"q": "End the email.", "a": "We look forward to seeing you soon, Yours, …"}], "icon": "🎡"}, {"type": "steps", "title": "Let's remember!", "icon": "🧠", "steps": ["Email: To · Subject · Dear … · why you are writing · paragraphs · Yours, (name).", "Formal: Dear … / We look forward to seeing you soon, / Yours,", "Instructions: Bring … / Don't forget … / Remember to … / You need to … / You must …", "Adjectives make an email interesting: amazing, delicious, wonderful."]}, {"type": "exit", "title": "Exit ticket", "items": [{"k": "3", "text": "How does a formal email start and end?"}, {"k": "2", "text": "Write one instruction for a trip to the beach."}, {"k": "1", "text": "Write a subject for your email."}], "icon": "🎟️"}, {"type": "homework", "title": "Homework", "head": "My homework", "items": ["Activity Book pp. 53–54: Activities 1–4.", "Rewrite your email neatly after checking it.", "Read the Writing model on p. 67."], "icon": "🏠"}]}, {"id": "L38", "unit": "U4", "unitName": "Unit 3: Travel", "title": "Over to you! & Review 3", "code": "", "theme": "park", "emo": "🌟", "slides": [{"type": "cover", "say": "Unit 3 · Lesson 10 – your comments & Review 3"}, {"type": "goals", "title": "Today's goals", "items": ["I can read readers' comments about travel.", "I can write my comment for the WOW! Magazine."], "icon": "🎯"}, {"type": "goals", "title": "Today's goals", "items": ["I can review Unit 3 words and grammar.", "I can check my progress in Unit 3."], "icon": "🎯"}, {"type": "mystery", "title": "Who's writing?", "img": "L38_c1", "answer": "WOW! readers: Rowan, Aseel, Amber, Hussain and Dana! 💬", "qs": [{"q": "You need it at the airport:", "o": ["passport", "pillow"], "a": 0}, {"q": "We ___ in three days. (timetable)", "o": ["leave", "are leaving"], "a": 0}, {"q": "Opposite of 'take off':", "o": ["land", "get on"], "a": 0}, {"q": "I'm looking forward ___ it!", "o": ["to", "for"], "a": 0}], "icon": "🕵️"}, {"type": "read", "title": "Readers' comments (1)", "paras": ["1 Rowan: I'm going to a different country for the first time next month. Last week, I got a new passport! It has my photo in it. I'm looking forward to using it at the airport!", "2 Aseel: This is my aunt and uncle's house by the sea. We're going to stay there this summer. It's a long journey so I'm going to take my pillow and sleep all the way in the car."], "icon": "💬"}, {"type": "read", "title": "Readers' comments (1)", "paras": ["3 Amber: In the holidays we're going to fly to Italy. We're going to travel by plane. We take off on Friday after we finish school and land that evening. We're going to stay in a hotel with a swimming pool. I'm going to take my flip-flops and my sunglasses."], "icon": "💬"}, {"type": "read", "title": "Readers' comments (2)", "paras": ["4 Hussain: I love travelling by train. I'd like to go on a long train journey like the Trans-Siberian Railway. You get on in one continent and get off in another one. I'd like to go to sleep in a little bed on the train and wake up in a new place. What an adventure!"], "icon": "💬"}, {"type": "read", "title": "Readers' comments (2)", "paras": ["5 Dana: I don't think the story about the holiday on the Moon is science fiction. You can't pack your suitcases and catch a rocket to the Moon yet, but you can already buy a ticket for a journey into space. The tickets are very expensive!"], "icon": "💬"}, {"type": "sort", "title": "Going on a trip or not?", "bins": [{"label": "Going on a trip", "icon": "✅"}, {"label": "Not going on a trip", "icon": "❌"}], "cards": [{"text": "Rowan", "icon": "", "bin": 0}, {"text": "Aseel", "icon": "", "bin": 0}, {"text": "Amber", "icon": "", "bin": 0}, {"text": "Hussain", "icon": "", "bin": 1}, {"text": "Dana", "icon": "", "bin": 1}], "icon": "🗂️"}, {"type": "quiz", "title": "Who …?", "qs": [{"q": "Who got a new passport?", "o": ["Rowan", "Amber", "Dana"], "a": 0, "why": "Last week, I got a new passport!"}, {"q": "Who is going to sleep all the way in the car?", "o": ["Hussain", "Aseel", "Rowan"], "a": 1, "why": "…take my pillow and sleep all the way in the car."}, {"q": "Who is going to Italy?", "o": ["Amber", "Aseel", "Hussain"], "a": 0, "why": "…we're going to fly to Italy."}, {"q": "Who says space tickets are very expensive?", "o": ["Hussain", "Dana", "Rowan"], "a": 1, "why": "The tickets are very expensive!"}], "icon": "✅"}, {"type": "write", "title": "Your comment for WOW!", "task": "Answer the questions. Then write your comment about the WOW! Magazine and read it to the class.", "steps": ["What did you like best?", "Which is the most interesting journey in this unit?", "What did you learn about how to pack your suitcase?"], "words": ["I liked … best", "the most interesting journey", "I learned that …", "I'm going to …", "I'm looking forward to …", "because"], "model": "Salma: I liked the story about the Moon best because it was funny. The most interesting journey is the Trans-Siberian railway because you go from Europe to Asia! I learned to put my name and address on my suitcase and to take a charger. I'm looking forward to my trip to Salalah!", "icon": "✍️"}, {"type": "ask", "title": "WOW! Question again", "qs": [{"q": "Frank's question: Why do we travel?", "a": "To see new places, to visit family, to learn about other cultures, to have fun, to practise English, for adventure …"}, {"q": "Look at your answers from Lesson 1. Are your answers different now? Why?", "a": "Yes – now I know about railways, the Moon story, school trips … (free answers)"}], "img": "L38_c1", "icon": "💬"}, {"type": "ask", "title": "Find the travel words", "qs": [{"q": "Pictures 1–3:", "a": "1 toothbrush · 2 passport · 3 flip-flops"}, {"q": "Pictures 4–6:", "a": "4 charger · 5 suitcase · 6 medicine"}, {"q": "Pictures 7–9:", "a": "7 pillow · 8 washbag · 9 raincoat"}], "img": "L38_c2", "icon": "🔍"}, {"type": "match", "title": "Make travel phrases", "pairs": [["pack", "your suitcase"], ["go on", "a journey"], ["travel", "by train"]], "icon": "🧩"}, {"type": "match", "title": "Make travel phrases", "pairs": [["catch", "a bus"], ["arrive", "home"], ["explore", "a city"]], "icon": "🧩"}, {"type": "quiz", "title": "going to or will?", "icon": "✏️", "qs": [{"q": "I ___ see a show with my friend this summer. We won free tickets.", "o": ["'m going to", "'ll"], "a": 0}, {"q": "If there's a problem during the trip, I ___ call my parents.", "o": ["'ll", "'m going to"], "a": 0}, {"q": "We ___ visit the museum today because we won't have time.", "o": ["aren't going to", "won't to"], "a": 0}, {"q": "My friend ___ be happy if I forget to phone him.", "o": ["won't", "isn't going"], "a": y wallet is empty' means …", "options": ["I have no money", "I lost my wallet", "I have a new wallet"], "a": 0}, {"q": "The flight to Manama takes off at …", "options": ["11 o'clock", "8 o'clock", "12.15"], "a": 0}, {"q": "A story needs a sentence for …", "options": ["each picture", "one picture", "no pictures"], "a": 0}], "icon": "🏁"}, {"type": "steps", "title": "Let's remember!", "icon": "🧠", "steps": ["Listening: read all the options first, then listen for the gist.", "Reading: think where you might see the text; read A, B and C carefully.", "Writing: look at all the pictures, plan one sentence for each, write 35+ words.", "Fun corner: In my suitcase I'm going to pack … · We'll leave at 8. The flight takes off at 11."]}, {"type": "exit", "title": "Exit ticket", "items": [{"k": "3", "text": "Write one exam tip you learned today."}, {"k": "2", "text": "'You don't have to take off your shoes.' Can you wear your shoes?"}, {"k": "1", "text": "Continue: In my suitcase, I'm going to pack …"}], "icon": "🎟️"}, {"type": "homework", "title": "Homework", "head": "My homework", "items": ["Activity Book pp. 56–57: finish all activities.", "Write the picture story again in your notebook (35+ words).", "Plan a trip timetable to a city you like with will and the Present simple."], "icon": "🏠"}]}, {"id": "L40", "unit": "U4", "unitName": "Unit 3: Travel", "title": "Graded reader 1: The Game on the Train", "code": "", "theme": "park", "emo": "🚆", "slides": [{"type": "cover", "say": "Unit 3 · Graded reader 1"}, {"type": "goals", "title": "Today's goals", "items": ["I can predict a story from the picture and the title.", "I can read and enjoy a story about a train journey."], "icon": "🎯"}, {"type": "goals", "title": "Today's goals", "items": ["I can put the story in order and re-tell it.", "I can talk about what I like doing when I travel."], "icon": "🎯"}, {"type": "ask", "title": "Look and predict", "qs": [{"q": "Where are the boys and who are they with?", "a": "They're on a train with their mum and dad."}, {"q": "Where do you think they are going?", "a": "On holiday to a city … (free answers)"}, {"q": "Read the title: The Game on the Train. What game do you think they play?", "a": "A board game / a card game / a guessing game … (free answers)"}, {"q": "How do you think the story ends?", "a": "Free answers – let's read and see!"}], "img": "L40_c1", "icon": "🔮"}, {"type": "flip", "title": "Story words", "cards": [{"front": "audiobook", "icon": "🎧", "back": "a book you listen to\n«Brian listens to an audiobook.»"}, {"front": "screen", "icon": "📱", "back": "the glass part of a tablet, phone or TV\n«Dad looks at his screen.»"}, {"front": "field", "icon": "🌾", "back": "an area of land with grass\n«The train has stopped next to a field.»"}, {"front": "track", "icon": "🛤️", "back": "the metal lines a train goes on\n«There are cows on the track!»"}, {"front": "passengers", "icon": "🧑‍🤝‍🧑", "back": "people who travel on a train, bus or plane\n«All the passengers are worried.»"}, {"front": "battery", "icon": "🔋", "back": "it gives power to a tablet or phone\n«My tablet hasn't got any more battery.»"}], "icon": "🔤"}, {"type": "read", "title": "The Game on the Train (1)", "paras": ["Brian and Jack are going on a journey. They are travelling by train to Edinburgh. They [[can't wait]] to explore the city.", "'When does the train leave?' asks Jack.\n'It leaves in five minutes,' says Mum.\n'What time do we arrive?' asks Brian.\n'We arrive in Edinburgh at four o'clock,' says Dad. 'Then we'll catch a bus to the hotel.'"], "img": "L40_c1", "icon": "📖"}, {"type": "read", "title": "The Game on the Train (2)", "paras": ["Jack plays games on his tablet. Brian listens to an audiobook.\n'I'm going to read my guidebook,' says Mum.\n'I'll download some apps about Edinburgh,' says Dad."], "img": "L40_c2", "icon": "📖"}, {"type": "read", "title": "The Game on the Train (2)", "paras": ["Dad looks at his screen. 'Oh no. It's going to rain in Edinburgh tomorrow,' he says.\n'I'm not worried about the rain,' says Jack. 'I'll wear my raincoat and I'll use my umbrella. I put flip-flops in my suitcase too, but I won't need them!'"], "img": "L40_c2", "icon": "📖"}, {"type": "read", "title": "The Game on the Train (3)", "paras": ["The train has stopped next to a field. There are cows on the [[track]]! The train doesn't move. All the passengers are worried about being late. Jack is worried, too.", "'What am I going to do? My tablet hasn't got any more battery and I forgot to bring my charger!' Jack says.\n'Let's play this game,' Brian says."], "img": "L40_c3", "icon": "📖"}, {"type": "read", "title": "The Game on the Train (4)", "paras": ["The cows are still on the track. The train is going to be very late, but the passengers are [[enjoying]] the journey. Everyone's playing Brian's game!", "'When we arrive in Edinburgh, nobody will want to get off the train,' says Jack. 'This is really fun!'"], "img": "L40_c4", "icon": "📖"}, {"type": "quiz", "title": "Choose what each person does", "qs": [{"q": "Jack …", "o": ["listens to an audiobook", "plays games on a tablet"], "a": 1, "why": "Jack plays games on his tablet."}, {"q": "Mum …", "o": ["downloads some apps", "reads a guidebook"], "a": 1, "why": "'I'm going to read my guidebook,' says Mum."}, {"q": "Brian …", "o": ["listens to an audiobook", "reads a guidebook"], "a": 0, "why": "Brian listens to an audiobook."}, {"q": "Dad …", "o": ["plays games", "downloads some apps"], "a": 1, "why": "'I'll download some apps about Edinburgh.'"}], "icon": "✅"}, {"type": "quiz", "title": "Complete the sentences", "icon": "✏️", "qs": [{"q": "When the family arrive in Edinburgh, they'll catch a ___ to their hotel.", "o": ["bus", "train"], "a": 0}, {"q": "The train stops because there are cows on the ___.", "o": ["track", "field"], "a": 0}, {"q": "All the passengers enjoy playing Brian's ___.", "o": ["game", "audiobook"], "a": 0}, {"q": "Jack forgot to bring his ___.", "o": ["charger", "umbrella"], "a": 0}]}, {"type": "ask", "title": "Put the pictures in order", "qs": [{"q": "Which picture is first?", "a": "b – the family get on the train."}, {"q": "Which is second?", "a": "d – Jack plays on his tablet and Brian listens to an audiobook."}, {"q": "Which is third?", "a": "a – the train stops: cows on the track!"}, {"q": "Which is last?", "a": "c – everyone plays Brian's game. Order: b, d, a, c"}], "img": "L40_c5", "icon": "🔢"}, {"type": "order", "title": "Re-tell the story", "items": ["Brian and Jack get on the train to Edinburgh.", "Dad says it's going to rain tomorrow.", "The train stops next to a field.", "Jack's tablet has no battery.", "Brian says: Let's play this game.", "Everyone plays Brian's game and has fun."], "icon": "🔢"}, {"type": "tf", "title": "True or false?", "items": [{"text": "The family are travelling by plane.", "a": false, "fix": "They are travelling by train."}, {"text": "Jack is worried about the rain.", "a": false, "fix": "I'm not worried about the rain."}, {"text": "Jack put flip-flops in his suitcase.", "a": true, "fix": "I put flip-flops in my suitcase too."}, {"text": "In the end, nobody wants to get off the train.", "a": true, "fix": "Nobody will want to get off the train."}], "icon": "✔️✘"}, {"type": "ask", "title": "Over to you!", "qs": [{"q": "Do you like travelling by train? Why or why not?", "a": "Free answers."}, {"q": "Tell your partner about a train journey you have been on.", "a": "Free answers – or a bus / car journey."}, {"q": "Do you like playing games when you travel? What other things do you like doing?", "a": "I like reading / listening to music / sleeping / looking out of the window …"}], "img": "L40_c3", "icon": "💬"}, {"type": "boxes", "title": "Treasure boxes", "boxes": [{"label": "1", "q": "Where are Brian and Jack going?", "a": "To Edinburgh, by train."}, {"label": "2", "q": "What time do they arrive?", "a": "At four o'clock."}, {"label": "3", "q": "What's the weather going to be like tomorrow?", "a": "It's going to rain."}, {"label": "4", "q": "Why does the train stop?", "a": "There are cows on the track!"}, {"label": "5", "q": "Why is Jack worried?", "a": "His tablet has no battery and he forgot his charger."}, {"label": "6", "q": "How does the story end?", "a": "Everyone plays Brian's game and nobody wants to get off!"}], "icon": "🎁"}, {"type": "summary", "title": "Let's remember!", "center": "Graded reader 1: The Game on the Train", "branches": ["Brian and Jack travel by train to Edinburgh with Mum and Dad.", "The train stops – there are cows on the track!", "Jack's tablet has no battery, so Brian starts a game.", "Everyone plays and has fun – a game can make a problem fun!"], "icon": "🧠"}, {"type": "exit", "title": "Exit ticket", "items": [{"k": "3", "text": "Who listens to an audiobook?"}, {"k": "2", "text": "Find one sentence with 'will' in the story."}, {"k": "1", "text": "Would you like to play Brian's game? Why?"}], "icon": "🎟️"}, {"type": "homework", "title": "Homework", "head": "My homework", "items": ["Read the story again (pp. 84–87) aloud.", "Draw your favourite part of the story and write two sentences about it.", "Write: What do you like doing on long journeys?"], "icon": "🏠"}]}, {"id": "L41", "unit": "U4", "unitName": "Unit 3: Travel", "title": "Graded reader 2: A New Friend", "code": "", "theme": "park", "emo": "✈️", "slides": [{"type": "cover", "say": "Unit 3 · Graded reader 2"}, {"type": "goals", "title": "Today's goals", "items": ["I can predict a story from the picture and the title.", "I can read a story about a journey to Doha."], "icon": "🎯"}, {"type": "goals", "title": "Today's goals", "items": ["I can put the story in order and re-tell it.", "I can talk about making new friends when I travel."], "icon": "🎯"}, {"type": "ask", "title": "Look and predict", "qs": [{"q": "Where are the girls and who are they with?", "a": "They're at the airport with their families."}, {"q": "Where do you think they are going?", "a": "To Doha! Look at the sign. ✈️"}, {"q": "Read the title: A New Friend. Who do you think the 'new friend' is?", "a": "A girl she meets at the airport … (free answers)"}, {"q": "How do you think the story ends?", "a": "Free answers – let's read!"}], "img": "L41_c1", "icon": "🔮"}, {"type": "flip", "title": "Airport words", "cards": [{"front": "airport", "icon": "🛫", "back": "a place where planes take off and land\n«Amani is at the airport.»"}, {"front": "gate", "icon": "🚪", "back": "where you wait to get on the plane\n«They take a seat in front of the gate.»"}, {"front": "boarding pass", "icon": "🎫", "back": "a card that lets you get on the plane\n«She shows Muna her boarding pass.»"}, {"front": "flight attendant", "icon": "👩‍✈️", "back": "a person who helps passengers on a plane\n«Everyone shows their passport to the flight attendant.»"}, {"front": "row", "icon": "💺", "back": "seats in a line\n«We're all in row 8.»"}, {"front": "bangle", "icon": "📿", "back": "a round bracelet for your arm\n«I'm going to buy a colourful bangle.»"}], "icon": "🛫"}, {"type": "read", "title": "A New Friend (1)", "paras": ["Amani is at the airport. She's very excited and she [[can't wait]] for her flight. The plane takes off in half an hour. Amani and her parents take a seat in front of the gate.", "A friendly girl says, 'Hello! I'm Muna. Are you going to Doha?'\n'Yes, I am!' says Amani. She shows Muna her boarding pass.\n'Me too!' smiles Muna."], "img": "L41_c1", "icon": "📖"}, {"type": "read", "title": "A New Friend (2)", "paras": ["'Who are you going to visit in Doha?' asks Muna.\n'I'm going to visit my cousins,' says Amani. 'I'm [[looking forward to]] seeing them.'"], "img": "L41_c2", "icon": "📖"}, {"type": "read", "title": "A New Friend (2)", "paras": ["Muna is excited about flying to Doha, too. 'I'm visiting my grandparents!' she says.\nAmani checks her backpack. She's got her washbag, her smartphone and charger and some presents for her cousins."], "img": "L41_c2", "icon": "📖"}, {"type": "read", "title": "A New Friend (3)", "paras": ["Everyone shows their passport and boarding pass to the flight attendant at the gate. Amani looks at Muna's boarding pass."], "img": "L41_c3", "icon": "📖"}, {"type": "read", "title": "A New Friend (3)", "paras": ["'Oh, you're going to be next to us on the plane! We're in the same [[row]]. Look: we're all in row 8,' says Amani.\n'Great!' says Muna. 'It's going to be a fun journey.'\nSoon, the plane lands in Doha. The girls say goodbye."], "img": "L41_c3", "icon": "📖"}, {"type": "read", "title": "A New Friend (4)", "paras": ["The next day, Amani and her cousins visit a famous market in Doha. Then, she sees Muna with her family! Amani is happy to see Muna again!", "'Hi, Amani. What a lovely [[surprise]]! What are you going to buy?' asks Muna.\n'I'm going to buy a colourful bangle,' says Amani.\n'I've got a new bangle too!' says Muna. 'Look!'"], "img": "L41_c4", "icon": "📖"}, {"type": "quiz", "title": "Who is each girl going to visit?", "qs": [{"q": "Muna is going to visit her …", "o": ["cousins", "grandparents"], "a": 1, "why": "'I'm visiting my grandparents!'"}, {"q": "Amani is going to visit her …", "o": ["cousins", "grandparents"], "a": 0, "why": "'I'm going to visit my cousins.'"}, {"q": "When does the plane take off?", "o": ["in half an hour", "in two hours"], "a": 0, "why": "The plane takes off in half an hour."}, {"q": "What does Amani have for her cousins?", "o": ["some presents", "some sweets"], "a": 0, "why": "…some presents for her cousins."}], "icon": "✅"}, {"type": "quiz", "title": "Complete the sentences", "icon": "✏️", "qs": [{"q": "Muna and Amani are travelling by ___ to Doha.", "o": ["plane", "train"], "a": 0}, {"q": "On the plane, the girls sit in the same ___.", "o": ["row", "gate"], "a": 0}, {"q": "Amani is going to buy a ___ at the market.", "o": ["bangle", "backpack"], "a": 0}, {"q": "Everyone shows their passport to the flight ___.", "o": ["attendant", "pass"], "a": 0}]}, {"type": "ask", "title": "Put the pictures in order", "qs": [{"q": "Which picture is first?", "a": "b – Amani meets Muna at the gate."}, {"q": "Which is second?", "a": "c – Amani checks her backpack and talks to Muna."}, {"q": "Which is third?", "a": "d – They show their passports and boarding passes."}, {"q": "Which is last?", "a": "a – They meet again at the market in Doha. Order: b, c, d, a"}], "img": "L41_c5", "icon": "🔢"}, {"type": "order", "title": "Re-tell the story", "items": ["Amani and her parents take a seat in front of the gate.", "Muna says hello and asks: Are you going to Doha?", "Muna says she's visiting her grandparents.", "They show their boarding passes at the gate.", "They sit in the same row on the plane.", "Amani sees Muna again at a famous market."], "icon": "🔢"}, {"type": "tf", "title": "True or false?", "items": [{"text": "Amani is at the train station.", "a": false, "fix": "Amani is at the airport."}, {"text": "The plane takes off in half an hour.", "a": true, "fix": "The plane takes off in half an hour."}, {"text": "Amani has her smartphone and charger in her backpack.", "a": true, "fix": "She's got her washbag, her smartphone and charger…"}], "icon": "✔️✘"}, {"type": "tf", "title": "True or false?", "items": [{"text": "The girls sit in different rows.", "a": false, "fix": "We're in the same row – row 8."}, {"text": "Muna has a new bangle, too.", "a": true, "fix": "'I've got a new bangle too!'"}], "icon": "✔️✘"}, {"type": "ask", "title": "Over to you!", "qs": [{"q": "Do you like travelling? Why or why not?", "a": "Free answers."}, {"q": "Tell your partner about a journey you have been on.", "a": "Free answers."}, {"q": "Have you ever made a new friend when you travelled? How?", "a": "Yes, I have. I met … at the hotel / beach … (free answers)"}], "img": "L41_c3", "icon": "💬"}, {"type": "memory", "title": "Memory: who said it?", "pairs": [["'Are you going to Doha?'", "Muna"], ["'I'm going to visit my cousins.'", "Amani"], ["'I'm visiting my grandparents!'", "Muna"], ["'We're all in row 8.'", "Amani"], ["'What a lovely surprise!'", "Muna"], ["'I'm going to buy a colourful bangle.'", "Amani"]], "icon": "🧠"}, {"type": "steps", "title": "Let's remember!", "icon": "🧠", "steps": ["Amani meets Muna at the airport. They are both going to Doha.", "Amani is going to visit her cousins; Muna is visiting her grandparents.", "They sit in the same row on the plane.", "They meet again at a market – a new friend! 👭"]}, {"type": "exit", "title": "Exit ticket", "items": [{"k": "3", "text": "What do you show at the gate?"}, {"k": "2", "text": "What is Amani going to buy?"}, {"k": "1", "text": "Write one way to make a new friend."}], "icon": "🎟️"}, {"type": "homework", "title": "Homework", "head": "My homework", "items": ["Read the story again (pp. 88–91) aloud.", "Write 4–5 sentences: a journey you have been on.", "Learn the airport words: gate, boarding pass, row, flight attendant."], "icon": "🏠"}]}, {"id": "L42", "unit": "U5", "unitName": "WOW! Learning Club 1", "title": "Language booster 1: Months, seasons & telling the time", "code": "", "theme": "city", "emo": "🗓️", "slides": [{"type": "cover", "say": "WOW! Learning Club 1 · Language booster 1 – months, seasons & the time"}, {"type": "goals", "title": "Today's goals", "items": ["I can say the months of the year and the seasons.", "I can read about day and night and the seasons."], "icon": "🎯"}, {"type": "goals", "title": "Today's goals", "items": ["I can tell the time: quarter past, half past, quarter to.", "I can have a conversation about times and seasons around the world."], "icon": "🎯"}, {"type": "build", "title": "Unscramble the seasons and months", "mode": "letters", "items": [{"a": "spring", "hint": "the season before the summer", "emo": "🌸"}, {"a": "autumn", "hint": "the season after the summer", "emo": "🍂"}, {"a": "winter", "hint": "the coldest season", "emo": "❄️"}], "icon": "🔤"}, {"type": "build", "title": "Unscramble the seasons and months", "mode": "letters", "items": [{"a": "December", "hint": "the last month", "emo": "🗓️"}, {"a": "March", "hint": "the third month", "emo": "3️⃣"}, {"a": "September", "hint": "the ninth month", "emo": "9️⃣"}], "icon": "🔤"}, {"type": "order", "title": "The months in order", "items": ["January", "February", "March", "April", "May", "June"], "icon": "🗓️"}, {"type": "read", "title": "Amazing Earth (1): day and night", "paras": ["Why do we have day and night?\nThe Earth [[turns around]] every 24 hours, so different parts of the planet can see the Sun at different times. It's daytime on the side that is [[closest]] to the Sun. It's night on the side that is [[furthest]] away."], "img": "L42_c1", "icon": "🌗"}, {"type": "read", "title": "Amazing Earth (1): day and night", "paras": ["This is why the time is different around the world. When it's 7 p.m. in Muscat, it's 11 a.m. in New York! 8 a.m. in London is 7 p.m. in New Zealand!"], "img": "L42_c1", "icon": "🌗"}, {"type": "read", "title": "Amazing Earth (2): seasons", "paras": ["Why do we have seasons?\nIt takes 365 days for the Earth to go around the Sun. That's a year. It's summer in the countries that are closer to the Sun. It's winter in the countries that are further away."], "icon": "🌸☀️🍂❄️"}, {"type": "read", "title": "Amazing Earth (2): seasons", "paras": ["The calendar doesn't change around the world, but the seasons do. In Europe, there are four seasons: winter, spring, summer and autumn. June, July and August are in summer. December, January and February are in winter. Australia has the [[opposite]] seasons. So, when children are making snowmen in Europe, they're eating ice cream in Australia!"], "icon": "🌸☀️🍂❄️"}, {"type": "read", "title": "Amazing Earth (3): time travel!", "paras": ["Did you know that time travel is possible?\nIt's true! You can [[experience]] the same day twice if you fly from New Zealand to Hawaii. For example, you can have 1st January in New Zealand. Then, if you get on a plane that takes off on 1st January, the plane will land in Hawaii on 31st December and you can experience 1st January again!"], "icon": "✈️"}, {"type": "read", "title": "Amazing Earth (3): time travel!", "paras": ["You will need to pack a big suitcase. You won't need your flip-flops, but you will need your raincoat and umbrella! When it's summer in New Zealand, it's cold and rainy in Hawaii!"], "icon": "✈️"}, {"type": "tf", "title": "True or false?", "items": [{"text": "When it's 9 a.m. in Muscat, it's 7 p.m. in New York.", "a": false, "fix": "New York is 8 hours behind Muscat: 9 a.m. in Muscat = 1 a.m. in New York."}, {"text": "There are 365 days in a year.", "a": true, "fix": "It takes 365 days for the Earth to go around the Sun."}, {"text": "In Europe, June, July and August are in summer.", "a": true, "fix": "June, July and August are in summer."}], "icon": "✔️✘"}, {"type": "tf", "title": "True or false?", "items": [{"text": "In Australia, December, January and February are in summer.", "a": true, "fix": "Australia has the opposite seasons."}, {"text": "The seasons are the same in New Zealand and Hawaii.", "a": false, "fix": "When it's summer in New Zealand, it's cold and rainy in Hawaii."}], "icon": "✔️✘"}, {"type": "ask", "title": "Talk to your classmates", "qs": [{"q": "What's the date today?", "a": "It's the … of … (e.g. the 10th of December)."}, {"q": "What special dates do you know?", "a": "National Day – 20th November; my birthday is on …"}, {"q": "Which season are we in?", "a": "We're in autumn / winter …"}, {"q": "What's your favourite season? Why?", "a": "Winter, because it's cool and we can go camping in the desert! (free answers)"}], "icon": "💬"}, {"type": "explain", "title": "What's the time?", "lines": ["It's four [[o'clock]]. 🕓 (4:00)", "It's [[quarter past]] four. (4:15) · It's [[half past]] four. (4:30)", "It's [[quarter to]] five. (4:45)"], "img": "L42_c3", "rule": "past → after the hour · to → before the next hour", "icon": "🕒"}, {"type": "flip", "title": "What's the time? 🕒 – examples", "cards": [{"front": "It's quarter past two in the morning.", "icon": "💡", "back": "2:15 a.m."}, {"front": "It's quarter past four in the afternoon.", "icon": "✨", "back": "4:15 p.m."}, {"front": "How about half past eight on Saturday?", "icon": "🔎", "back": "8:30"}]}, {"type": "match", "title": "Match the times", "pairs": [["quarter past seven", "7:15"], ["half past five", "5:30"], ["quarter to five", "4:45"]], "icon": "⏰"}, {"type": "match", "title": "Match the times", "pairs": [["four o'clock", "4:00"], ["quarter to eleven", "10:45"], ["half past nine", "9:30"]], "icon": "⏰"}, {"type": "read", "title": "Faisal and Shihab (1)", "paras": ["Faisal: Hello, Shihab! Haha! You're wearing your dressing gown! What's the time?\nShihab: Hello, Faisal. It's quarter past two in the morning here in Oman! I've been asleep for four hours!\nFaisal: Oh, sorry! It's quarter past four in the afternoon here. What's the weather like?"], "img": "L42_c2", "icon": "📱"}, {"type": "read", "title": "Faisal and Shihab (1)", "paras": ["Shihab: I've no idea! It's dark outside. It's the middle of the night!\nFaisal: Sorry! I mean is it summer?\nShihab: Yes. It is summer. It's been hot and sunny every day for weeks.\nFaisal: Oh, lucky you. It's winter here and it's snowy. Look! You can see the snowman that we built this morning."], "img": "L42_c2", "icon": "📱"}, {"type": "read", "title": "Faisal and Shihab (2)", "paras": ["Shihab: That's cool! Did you have a snowball fight, too?\nFaisal: Yes, we did. It was fun.\nMum: Hey, Shihab, we're going to come and visit you in the spring.\nShihab: Great! It will be autumn here, but it's still warm. I'm going to go back to bed now."], "icon": "📱"}, {"type": "read", "title": "Faisal and Shihab (2)", "paras": ["Dad: Good plan. We'll call again soon!\nShihab: OK, but don't call so early next time!\nDad: Sorry! How about half past eight on Saturday morning?\nShihab: Er … Let's say half past nine. My time!"], "icon": "📱"}, {"type": "quiz", "title": "Circle the correct answer", "qs": [{"q": "It's quarter ___ two in the morning where Shihab is.", "o": ["to", "past"], "a": 1, "why": "It's quarter past two in the morning here in Oman!"}, {"q": "It's ___ where Faisal is.", "o": ["day", "night"], "a": 0, "why": "It's quarter past four in the afternoon here."}, {"q": "It's ___ for Shihab.", "o": ["winter", "summer"], "a": 1, "why": "Yes. It is summer."}, {"q": "Faisal built a snowman in the ___.", "o": ["morning", "afternoon"], "a": 0, "why": "…the snowman that we built this morning."}, {"q": "When it's spring in Faisal's country, it will be ___ in Oman.", "o": ["autumn", "winter"], "a": 0, "why": "It will be autumn here, but it's still warm."}, {"q": "Dad wants to call again at ___ past eight on Saturday.", "o": ["half", "quarter"], "a": 0, "why": "How about half past eight on Saturday morning?"}], "icon": "✅"}, {"type": "ask", "title": "England ↔ New Zealand", "qs": [{"q": "A (in England): What's the time?", "a": "B (in New Zealand): It's half past seven in the evening."}, {"q": "A: Is it summer or winter?", "a": "B: It's summer here! It's hot and sunny."}, {"q": "A: What's the weather like?", "a": "B: It's sunny. – A: That's great! Here it's cold and rainy."}, {"q": "End the call.", "a": "I'll call again soon!"}], "img": "L42_c3", "icon": "🗣️"}, {"type": "quiz", "title": "The calendar rhyme", "icon": "✏️", "qs": [{"q": "Thirty days have ___,", "o": ["September", "December"], "a": 0}, {"q": "April, June and ___.", "o": ["November", "October"], "a": 0}, {"q": "All the rest have thirty-one, except for ___ alone,", "o": ["February", "January"], "a": 0}, {"q": "And that has ___ days clear, but twenty-nine in each leap year.", "o": ["twenty-eight", "thirty"], "a": 0}]}, {"type": "race", "title": "Time & seasons race", "qs": [{"q": "4:45 is …", "options": ["quarter past four", "quarter to five", "half past four"], "a": 1}, {"q": "The ninth month is …", "options": ["September", "November", "August"], "a": 0}, {"q": "The opposite of midnight:", "options": ["midday", "morning", "evening"], "a": 0}, {"q": "Days in a year:", "options": ["360", "365", "300"], "a": 1}, {"q": "Winter months in Australia:", "options": ["Dec, Jan, Feb", "Jun, Jul, Aug", "Mar, Apr, May"], "a": 1}, {"q": "The opposite of late:", "options": ["early", "soon", "quick"], "a": 0}], "icon": "🏁"}, {"type": "steps", "title": "Let's remember!", "icon": "🧠", "steps": ["12 months: January … December · 4 seasons: spring, summer, autumn, winter.", "The Earth turns every 24 hours (day and night) and goes around the Sun in 365 days (a year).", "Australia and New Zealand have the opposite seasons to Europe.", "o'clock · quarter past · half past · quarter to"]}, {"type": "exit", "title": "Exit ticket", "items": [{"k": "3", "text": "Say the months of the year in order."}, {"k": "2", "text": "Write the time: 6:15, 6:30, 6:45."}, {"k": "1", "text": "What's your favourite season? Why?"}], "icon": "🎟️"}, {"type": "homework", "title": "Homework", "head": "My homework", "items": ["Activity Book pp. 58–59: Activities 1–7.", "Learn the calendar rhyme.", "Draw a clock and write three times in words."], "icon": "🏠"}]}, {"id": "L43", "unit": "U5", "unitName": "WOW! Learning Club 1", "title": "Science: How can we classify types of energy in diagrams?", "code": "", "theme": "city", "emo": "💡", "slides": [{"type": "cover"}, {"type": "goals", "title": "Today's goals", "items": ["I can say which machines need energy from electricity.", "I can read a Carroll diagram."], "icon": "🎯"}, {"type": "goals", "title": "Today's goals", "items": ["I can make sentences: A cinema needs sound and light.", "I can make my own Carroll diagram with my group."], "icon": "🎯"}, {"type": "ask", "title": "Machines and energy", "qs": [{"q": "What do you know about machines?", "a": "They help us do work: a fridge, a washing machine, a car … (free answers)"}, {"q": "Which machines need energy to work?", "a": "All machines need energy! A TV, a lamp, a fan, a car …"}, {"q": "Which machines need energy from electricity?", "a": "a TV, a lamp, a laptop, a fan, a toaster …"}], "icon": "🤔"}, {"type": "enter", "title": "Catch the machines that need electricity!", "gate": "✓", "items": [{"text": "hair dryer", "in": true}, {"text": "ball", "in": false}, {"text": "scooter", "in": false}, {"text": "book", "in": false}, {"text": "TV", "in": true}, {"text": "toaster", "in": true}]}, {"type": "flip", "title": "Science words", "cards": [{"front": "energy", "icon": "⚡", "back": "what machines need to work\n«All machines need energy.»"}, {"front": "electricity", "icon": "🔌", "back": "energy that comes through wires\n«A TV needs energy from electricity.»"}, {"front": "light", "icon": "💡", "back": "energy we can see\n«A lamp makes light.»"}, {"front": "sound", "icon": "🔊", "back": "energy we can hear\n«A speaker makes sound.»"}, {"front": "heat", "icon": "🔥", "back": "energy that makes things hot\n«A toaster makes heat.»"}, {"front": "movement", "icon": "🔄", "back": "energy that makes things move\n«A food mixer makes movement.»"}], "icon": "🔬"}, {"type": "read", "title": "Carroll diagrams", "paras": ["All machines need energy. Some of them need energy from electricity. Some types of entertainment also need energy from electricity to make sound and light."], "img": "L43_c1", "icon": "📊"}, {"type": "read", "title": "Carroll diagrams", "paras": ["Diagrams can show what types of energy different places for entertainment need. [[Carroll diagrams]] show this with 'yes' information and 'no' information. For example, it needs light ('yes' information); it doesn't need light ('no' information)."], "img": "L43_c1", "icon": "📊"}, {"type": "explain", "title": "How to read a Carroll diagram", "lines": ["Columns at the top: [[it needs light]] | [[it doesn't need light]]", "Rows on the left: [[it needs sound]] | [[it doesn't need sound]]", "Each box = top label + left label."], "img": "L43_c1", "rule": "Read the top + the side = the box!", "icon": "💡"}, {"type": "flip", "title": "How to read a Carroll diagram 💡 – examples", "cards": [{"front": "
