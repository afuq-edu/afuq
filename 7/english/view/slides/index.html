 koala · elephant", "a": "kan-ga-ROO · AL-li-ga-tor · ko-A-la · EL-e-phant"}], "img": "L22_c3", "icon": "🎵"}, {"type": "quiz", "title": "Find the stressed part", "qs": [{"q": "Where is the stress in 'dangerous'?", "o": ["DAN-ge-rous", "dan-GE-rous", "dan-ge-ROUS"], "a": 0, "why": "a DANgerous TIger"}, {"q": "Where is the stress in 'unusual'?", "o": ["UN-u-su-al", "un-U-su-al", "un-u-SU-al"], "a": 1, "why": "an unUSual JELlyfish"}, {"q": "Where is the stress in 'exciting'?", "o": ["EX-ci-ting", "ex-CI-ting", "ex-ci-TING"], "a": 1, "why": "an exCIting HOLiday"}, {"q": "Where is the stress in 'gorilla'?", "o": ["GO-ril-la", "go-RIL-la", "go-ril-LA"], "a": 1, "why": "an unFRIENDly goRILla"}], "icon": "🔊"}, {"type": "wheel", "title": "Likes wheel", "items": [{"q": "Camels 🐪", "a": "I'm crazy about camels!"}, {"q": "Spiders 🕷️", "a": "I can't stand spiders!"}, {"q": "Cats 🐱", "a": "I quite like cats."}, {"q": "Snakes 🐍", "a": "I'm not keen on snakes."}, {"q": "Dolphins 🐬", "a": "I find dolphins really interesting."}, {"q": "Bees 🐝", "a": "I don't mind bees."}, {"q": "Sharks 🦈", "a": "I don't like sharks at all."}], "icon": "🎡"}, {"type": "race", "title": "Likes race", "qs": [{"q": "I'm crazy ___ sea animals.", "options": ["about", "on", "at"], "a": 0}, {"q": "😖 = I can't ___ them!", "options": ["mind", "stand", "keen"], "a": 1}, {"q": "😐 = I don't ___ them.", "options": ["mind", "stand", "like at all"], "a": 0}, {"q": "I'm not keen ___ ants.", "options": ["about", "of", "on"], "a": 2}, {"q": "I'm scared ___ sharks!", "options": ["of", "on", "about"], "a": 0}, {"q": "Stress: kangaroo", "options": ["KAN-ga-roo", "kan-GA-roo", "kan-ga-ROO"], "a": 2}], "icon": "🏁"}, {"type": "steps", "title": "Let's remember!", "icon": "🧠", "steps": ["😍 I'm crazy about … / I find … really interesting. / I quite like …", "😐 I don't mind …", "😖 I'm not keen on … / I don't like … at all. / I can't stand …", "Ask back: What about you? / And you?"]}, {"type": "exit", "title": "Exit ticket", "items": [{"k": "3", "text": "Write one animal you're crazy about and one you can't stand."}, {"k": "2", "text": "Complete: I'm not keen ___ snakes."}, {"k": "1", "text": "Which part of 'elephant' is stressed?"}], "icon": "🎟️"}, {"type": "homework", "title": "Homework", "head": "My homework", "items": ["Activity Book p. 35: Activities 1–4.", "Write five sentences about animals you like and don't like.", "Ask a family member: Do you like …? and write their answers."], "icon": "🏠"}]}, {"id": "L23", "unit": "U3", "unitName": "Unit 2: Awesome animals", "title": "Reading: Literacy – an information text (fact files)", "code": "", "theme": "library", "emo": "🐢", "slides": [{"type": "cover", "say": "Unit 2 · Lesson 8 – Literacy: an information text"}, {"type": "goals", "title": "Today's goals", "items": ["I can match fact files to information texts.", "I can use headings to find information quickly."], "icon": "🎯"}, {"type": "goals", "title": "Today's goals", "items": ["I can understand: vertebrate, invertebrate, insect, reptile, strange.", "I can play a memory game about the two animals."], "icon": "🎯"}, {"type": "quiz", "title": "Backbone or no backbone?", "qs": [{"q": "A fish has a backbone. It's a …", "o": ["vertebrate", "invertebrate"], "a": 0, "why": "Vertebrates have a backbone."}, {"q": "An ant doesn't have a backbone. It's an …", "o": ["vertebrate", "invertebrate"], "a": 1, "why": "Invertebrates don't have a backbone."}, {"q": "A lizard has scales and lays eggs. It's a …", "o": ["reptile", "insect"], "a": 0, "why": "Reptiles have scales and lay eggs."}, {"q": "A bee has six legs. It's an …", "o": ["reptile", "insect"], "a": 1, "why": "Insects have six legs."}], "icon": "🦴"}, {"type": "flip", "title": "Words in context", "cards": [{"front": "vertebrate", "icon": "🐢", "back": "an animal that has a backbone\n«The mata mata turtle is a vertebrate.»"}, {"front": "invertebrate", "icon": "🐛", "back": "an animal that doesn't have a backbone\n«A stick insect is an invertebrate.»"}, {"front": "insect", "icon": "🦗", "back": "an invertebrate that has six legs\n«Bees and ants are insects.»"}, {"front": "reptile", "icon": "🦎", "back": "it has hard scales all over its body and it lays eggs\n«Turtles and snakes are reptiles.»"}, {"front": "strange", "icon": "🤪", "back": "unusual or different\n«This reptile looks very strange.»"}], "icon": "🔑"}, {"type": "ask", "title": "Match the fact files", "qs": [{"q": "Look quickly. Which fact file (a or b) is about information text 1?", "a": "Fact file b – the giant prickly stick insect."}, {"q": "Which fact file is about information text 2?", "a": "Fact file a – the mata mata turtle."}, {"q": "Tip: How can headings help you?", "a": "Read the headings (Name, Type, Home, Food …) to find information quickly."}], "img": "L23_c1", "icon": "📑"}, {"type": "read", "title": "Information text 1: the stick insect", "paras": ["This unusual [[invertebrate]] [[insect]] is a giant prickly stick insect which lays eggs. It lives in the forests of Australia and eats leaves. It can be up to 20 centimetres long and weighs up to 20 grams. It has long antennae and its body is brown or green. This means it's easy for it to hide on a tree because it looks like dead leaves or wood! That's very clever!"], "img": "L23_c3", "icon": "🦗"}, {"type": "read", "title": "Information text 2: the mata mata turtle", "paras": ["This [[vertebrate]] [[reptile]] looks very [[strange]]. It's a mata mata turtle and it has a very long neck and a very long nose. It lives in warm lakes, ponds and rivers in South America and eats fish and other small animals. It's quite big, growing up to 45 centimetres long and it weighs up to 15 kilograms. It lays eggs and you can often find it hiding in the water. Here it uses its very long nose to breathe."], "img": "L23_c2", "icon": "🐢"}, {"type": "read", "title": "Fact file a: Mata mata turtle", "paras": ["Name: Mata mata turtle", "Type: Vertebrate reptile", "Home: lakes, ponds and rivers in South America", "Food: fish and other small animals", "Size: up to 45 cm long, weighs up to 15 kg", "Body: very long neck and very long nose", "Family: lays eggs", "Interesting facts: It hides in the water and uses its very long nose to breathe."], "img": "L23_c2", "icon": "📋"}, {"type": "quiz", "title": "Complete the definitions", "icon": "✏️", "qs": [{"q": "A ___ is an animal that has a backbone.", "o": ["vertebrate", "insect", "reptile"], "a": 0}, {"q": "If something is ___, it is unusual or different.", "o": ["strange", "reptile", "insect"], "a": 0}, {"q": "An ___ is an animal that doesn't have a backbone.", "o": ["invertebrate", "vertebrate", "reptile"], "a": 0}, {"q": "A ___ has hard scales all over its body and it lays eggs.", "o": ["reptile", "insect", "strange"], "a": 0}, {"q": "An ___ is an invertebrate that has six legs.", "o": ["insect", "reptile", "vertebrate"], "a": 0}]}, {"type": "quiz", "title": "Find the facts", "icon": "✏️", "qs": [{"q": "The mata mata turtle is found in many ___, ponds and rivers in South America.", "o": ["lakes", "forests", "deserts"], "a": 0}, {"q": "This reptile can ___ up to 15 kilogrammes and be up to 45 centimetres long.", "o": ["weigh", "eat", "grow"], "a": 0}, {"q": "The giant prickly stick insect lives in the forests of ___.", "o": ["Australia", "South America", "Oman"], "a": 0}, {"q": "This unusual invertebrate can be up to 20 centimetres long and it has very long ___.", "o": ["antennae", "necks", "noses"], "a": 0}]}, {"type": "sort", "title": "Turtle or stick insect?", "bins": [{"label": "mata mata turtle", "icon": "🐢"}, {"label": "stick insect", "icon": "🦗"}], "cards": [{"text": "vertebrate reptile", "icon": "", "bin": 0}, {"text": "South America", "icon": "", "bin": 0}, {"text": "eats fish", "icon": "", "bin": 0}, {"text": "up to 15 kg", "icon": "", "bin": 0}, {"text": "very long nose", "icon": "", "bin": 0}, {"text": "invertebrate insect", "icon": "", "bin": 1}, {"text": "forests of Australia", "icon": "", "bin": 1}, {"text": "eats leaves", "icon": "", "bin": 1}, {"text": "up to 20 g", "icon": "", "bin": 1}, {"text": "long antennae", "icon": "", "bin": 1}], "icon": "🗂️"}, {"type": "ask", "title": "Answer in full sentences", "qs": [{"q": "1 How do you know the mata mata turtle has a backbone?", "a": "It is a vertebrate."}, {"q": "2 How do you know it likes water?", "a": "It lives in lakes, ponds and rivers, and it often hides in the water."}, {"q": "3 What things does the mata mata turtle eat?", "a": "It eats fish and other small animals."}], "img": "L23_c4", "icon": "🔎"}, {"type": "ask", "title": "Answer in full sentences", "qs": [{"q": "4 Why does a mata mata turtle need such a long nose?", "a": "It uses its long nose to breathe when it hides in the water."}, {"q": "5 Why do you think the giant prickly stick insect lives in forests?", "a": "Because it eats leaves and it can hide on trees."}, {"q": "6 Why are these insects hard to see?", "a": "Because they look like dead leaves or wood."}], "icon": "🔎"}, {"type": "ask", "title": "Fact file or text?", "qs": [{"q": "Do the information texts have the same information as the fact files?", "a": "Yes, they do."}, {"q": "Do the information texts have more or less detail?", "a": "More detail – they use full sentences and adjectives (strange, unusual, clever)."}, {"q": "Which do you think are most interesting to read? Why?", "a": "Free answers – e.g. the texts, because they are like a story."}], "img": "L23_c1", "icon": "💬"}, {"type": "tf", "title": "True or false? ✔", "items": [{"text": "The mata mata turtle is an invertebrate.", "a": false, "fix": "It's a vertebrate reptile."}, {"text": "The stick insect can be up to 20 centimetres long.", "a": true, "fix": "'It can be up to 20 centimetres long.'"}, {"text": "The mata mata turtle lives in the forests of Australia.", "a": false, "fix": "It lives in lakes, ponds and rivers in South America."}], "icon": "✘"}, {"type": "tf", "title": "True or false? ✔", "items": [{"text": "Both animals lay eggs.", "a": true, "fix": "Family: lays eggs (both fact files)."}, {"text": "The stick insect eats small animals.", "a": false, "fix": "It eats leaves."}], "icon": "✘"}, {"type": "memory", "title": "Memory game: which animal?", "pairs": [["Which animal has long antennae?", "the giant prickly stick insect"], ["Which animal has a very long neck?", "the mata mata turtle"], ["Where does the stick insect live?", "forests in Australia"], ["What does the turtle eat?", "fish and other small animals"], ["How heavy is the stick insect?", "up to 20 grams"], ["How long is the turtle?", "up to 45 centimetres"]], "icon": "🧠"}, {"type": "ask", "title": "Your animal: make notes", "qs": [{"q": "What type of animal is it?", "a": "It's a vertebrate / an invertebrate … a mammal / reptile / insect / bird / fish."}, {"q": "Where does it live? What does it eat?", "a": "It lives in … It eats …"}, {"q": "What does it look like?", "a": "It has … Its body is …"}, {"q": "Is there anything strange about it?", "a": "Yes! It can … (free answers)"}], "icon": "📝"}, {"type": "steps", "title": "Let's remember!", "icon": "🧠", "steps": ["A fact file has headings and short notes (cm, kg). An information text has full sentences.", "Read the headings to find information quickly.", "vertebrate = has a backbone · invertebrate = no backbone.", "reptile = scales + lays eggs · insect = six legs."]}, {"type": "exit", "title": "Exit ticket", "items": [{"k": "3", "text": "Is a stick insect a vertebrate or an invertebrate?"}, {"k": "2", "text": "Why does the mata mata turtle need a long nose?"}, {"k": "1", "text": "Write two headings from a fact file."}], "icon": "🎟️"}, {"type": "homework", "title": "Homework", "head": "My homework", "items": ["Activity Book p. 36: Activities 1–3.", "Activity 4: make notes about an animal you know.", "Find a picture of your animal for the next lesson."], "icon": "🏠"}]}, {"id": "L24", "unit": "U3", "unitName": "Unit 2: Awesome animals", "title": "Writing: An information text", "code": "", "theme": "library", "emo": "🦈", "slides": [{"type": "cover", "say": "Unit 2 · Lesson 9 – Writing"}, {"type": "goals", "title": "Today's goals", "items": ["I can use a fact file to complete an information text.", "I can follow the 'How to write…' rules."], "icon": "🎯"}, {"type": "goals", "title": "Today's goals", "items": ["I can use it's and its correctly.", "I can plan a fact file and write my own information text."], "icon": "🎯"}, {"type": "mystery", "title": "What's the hidden animal?", "img": "L24_c2", "answer": "an echidna – an animal with spines 🦔", "qs": [{"q": "An animal with a backbone is a …", "o": ["vertebrate", "invertebrate", "insect"], "a": 0}, {"q": "An insect has … legs.", "o": ["four", "six", "eight"], "a": 1}, {"q": "A fact file uses …", "o": ["long sentences", "headings and notes", "a story"], "a": 1}, {"q": "'kg' means …", "o": ["kilogrammes", "kilometres", "centimetres"], "a": 0}], "icon": "🖼️"}, {"type": "read", "title": "Fact file: Hammerhead shark", "paras": ["Name: Hammerhead shark", "Type: Vertebrate – fish", "Home: warm water in oceans around the world", "Food: crabs, lobsters, squid, many kinds of fish, stingrays", "Size: up to 6 m long, weighs up to 450 kg", "Body: a head that looks like a hammer", "Family: doesn't lay eggs, it has babies called pups"], "img": "L24_c1", "icon": "📋"}, {"type": "read", "title": "Fact file: Hammerhead shark", "paras": ["Interesting facts: It uses a sixth sense to find stingrays in the sand."], "img": "L24_c1", "icon": "📋"}, {"type": "quiz", "title": "Complete the information text", "icon": "✏️", "qs": [{"q": "All types of hammerhead sharks have an amazing head that (1) ___.", "o": ["looks like a hammer", "lays eggs", "eats crabs"], "a": 0}, {"q": "The great hammerhead shark lives in (2) ___.", "o": ["warm water in oceans around the world", "rivers in Australia", "the sand"], "a": 0}, {"q": "An adult can be up to (3) ___ and weigh up to (4) 450 kilogrammes.", "o": ["6 metres long", "6 m", "45 centimetres"], "a": 0}, {"q": "It eats (5) ___. Its favourite food is stingrays.", "o": ["crabs, lobsters, squid and many kinds of fish", "leaves", "insects"], "a": 0}, {"q": "It uses an amazing (6) ___ to find stingrays when they're hiding in the sand!", "o": ["sixth sense", "long nose", "tongue"], "a": 0}, {"q": "A hammerhead shark is a fish, but (7) ___.", "o": ["it doesn't lay eggs – it has babies called pups", "it lays eggs", "it can fly"], "a": 0}]}, {"type": "explain", "title": "How to write an information text", "lines": ["Turn your fact file into a good information text:"], "img": "L24_c4", "rule": "fact file (notes) → information text (full sentences + adjectives)", "icon": "💡"}, {"type": "flip", "title": "How to write an information text 💡 – examples", "cards": [{"front": "Use [[all the information]] from a fact file in your text.", "icon": "💡", "back": "📋"}, {"front": "Write [[full sentences]]. Do not use abbreviations (kg → kilogrammes).", "icon": "✨", "back": "✍️"}, {"front": "Add [[adjectives]] to make your text more interesting: amazing, strange, huge.", "icon": "🔎", "back": "🌈"}, {"front": "[[Order]] the text correctly – it may not be the same order as the fact file.", "icon": "📌", "back": "🔢"}]}, {"type": "quiz", "title": "Fact file or information text?", "qs": [{"q": "Does the information text use headings?", "o": ["Yes, it does.", "No, it doesn't."], "a": 1, "why": "Headings are in the fact file; the text has paragraphs."}, {"q": "Why does an information text not use abbreviations?", "o": ["Because it uses full sentences.", "Because it's short."], "a": 0, "why": "We write words in full: centimetres, kilograms."}, {"q": "Which uses adjectives, the fact file or the information text?", "o": ["the fact file", "the information text"], "a": 1, "why": "Adjectives make the text more interesting: unusual, strange, clever."}], "icon": "✅"}, {"type": "sort", "title": "Fact file or text?", "bins": [{"label": "fact file", "icon": "📋"}, {"label": "information text", "icon": "📄"}], "cards": [{"text": "Size: up to 6 m long", "icon": "", "bin": 0}, {"text": "Food: crabs, squid", "icon": "", "bin": 0}, {"text": "Type: Vertebrate – fish", "icon": "", "bin": 0}, {"text": "It eats crabs, lobsters and squid.", "icon": "", "bin": 1}, {"text": "An adult can be up to 6 metres long.", "icon": "", "bin": 1}, {"text": "It has an amazing head that looks like a hammer.", "icon": "", "bin": 1}], "icon": "🗂️"}, {"type": "explain", "title": "it's or its?", "icon": "🤔", "lines": ["Remember to use it's and its correctly."], "rule": "it's = it is / it has · its = belongs to it (no apostrophe!)"}, {"type": "flip", "title": "it's or its? 💡 – examples", "cards": [{"front": "[[it's]] = it is / it has: [[It's]] better at climbing than jumping!", "icon": "💡", "back": "it is"}, {"front": "[[its]] = possession (belongs to it): It uses [[its]] very long nose to breathe.", "icon": "✨", "back": "his/her for animals"}]}, {"type": "quiz", "title": "Complete with it's or its", "icon": "✏️", "qs": [{"q": "The mata mata turtle can swim well. It uses ___ long nose to breathe in the water.", "o": ["its", "it's"], "a": 0}, {"q": "Ring-tailed lemurs have a long tail. ___ used to fight and to communicate.", "o": ["Its", "It's"], "a": 1}, {"q": "A Komodo dragon uses ___ tongue to taste the air and find food.", "o": ["its", "it's"], "a": 0}, {"q": "The Arabian oryx is the national animal of Oman. ___ horns are tall and straight.", "o": ["Its", "It's"], "a": 0}, {"q": "A lizard is a type of reptile. ___ in the same family as the crocodile.", "o": ["Its", "It's"], "a": 1}, {"q": "A giraffe eats leaves from tall trees. That's why ___ neck is so long.", "o": ["its", "it's"], "a": 0}]}, {"type": "ask", "title": "Plan your fact file", "qs": [{"q": "Where can you find facts about an unusual wild animal?", "a": "In books or on the internet."}, {"q": "How do you write headings?", "a": "Use headings and put colons (:) after them – Name: … Type: …"}, {"q": "Do you write full sentences in a fact file?", "a": "No. Use simple notes."}, {"q": "How do you write size and weight?", "a": "Use abbreviations: m (metres), cm (centimetres), kg (kilogrammes)."}, {"q": "What else should you include?", "a": "Some special and unusual facts."}], "img": "L24_c3", "icon": "🗂️"}, {"type": "order", "title": "Order the information text", "items": ["Elephants are mammals and have babies called calves.", "There are three types of elephants: African bush elephants, African forest elephants and Indian elephants.", "Elephants are up to 3.3 metres tall, can weigh 6,300 kilogrammes and are the largest land animals in the world.", "They have amazing long noses called trunks which they use to drink water.", "Elephants live in groups and eat leaves and fruit. They need 150 kilogrammes of food every day!"], "icon": "🔢"}, {"type": "write", "title": "Write your information text", "task": "Choose an animal and find out about it. Draw or print a picture and write a fact file. Then use the fact file to write an information text.", "steps": ["Start with the name and type: The … is a …", "Where does it live? What does it eat?", "How big is it? What does its body look like?", "Family: does it lay eggs or have babies?", "End with an amazing fact!"], "words": ["vertebrate", "invertebrate", "mammal", "reptile", "lives in", "eats", "up to … metres long", "weighs up to … kilogrammes", "its", "it's", "amazing", "strange", "huge"], "model": "The Arabian leopard is a beautiful vertebrate mammal. It lives in the mountains of Dhofar in Oman. It eats small animals like gazelles and hares. It can be up to 2 metres long with its tail and it weighs up to 30 kilogrammes. Its fur is pale yellow with dark spots, so it's hard to see on the rocks. It has babies called cubs. It's very rare – there are only a few in the wild!", "icon": "✍️"}, {"type": "tf", "title": "Check your work", "items": [{"text": "I have included all the information from the fact file.", "a": true, "fix": "✓ Step 1 – use all the information."}, {"text": "I have used abbreviations like kg and cm in my text.", "a": false, "fix": "✗ Write the words in full: kilogrammes, centimetres."}, {"text": "I have written in full sentences and used some adjectives.", "a": true, "fix": "✓ Full sentences + adjectives."}], "icon": "✔"}, {"type": "tf", "title": "Check your work", "items": [{"text": "I wrote: 'The oryx uses it's horns to fight.'", "a": false, "fix": "✗ It should be its (possession)."}, {"text": "I have ordered the text correctly.", "a": true, "fix": "✓ Check the order makes sense."}], "icon": "✔"}, {"type": "wheel", "title": "Animal fact wheel", "items": [{"q": "What's your animal?", "a": "My animal is the …"}, {"q": "What type of animal is it?", "a": "It's a vertebrate / an invertebrate …"}, {"q": "Where does it live?", "a": "It lives in …"}, {"q": "What does it eat?", "a": "It eats …"}, {"q": "How big is it?", "a": "It can be up to … long."}, {"q": "Tell us an amazing fact!", "a": "Did you know that …?"}], "icon": "🎡"}, {"type": "summary", "title": "Let's remember!", "center": "Writing: An information text", "branches": ["Fact file → information text: use all the information.", "Write full sentences – no abbreviations (kg → kilogrammes).", "Add adjectives and order the text correctly.", "it's = it is / it has · its = belongs to it."], "icon": "🧠"}, {"type": "exit", "title": "Exit ticket", "items": [{"k": "3", "text": "Change to full words: 6 m · 450 kg · 20 cm"}, {"k": "2", "text": "Complete: The giraffe uses ___ long neck to eat leaves. (it's / its)"}, {"k": "1", "text": "Write one sentence about your animal with an adjective."}], "icon": "🎟️"}, {"type": "homework", "title": "Homework", "head": "My homework", "items": ["Activity Book pp. 37–38: finish your fact file and information text.", "Read the writing model on AB p. 66 again.", "Draw or print a picture of your animal for the class display."], "icon": "🏠"}]}, {"id": "L25", "unit": "U3", "unitName": "Unit 2: Awesome animals", "title": "Over to you! & Review 2", "code": "", "theme": "library", "emo": "🐦", "slides": [{"type": "cover", "say": "Unit 2 · Lesson 10 – Over to you! & Review 2"}, {"type": "goals", "title": "Today's goals", "items": ["I can read comments about animals.", "I can write my own comment for the WOW! Magazine."], "icon": "🎯"}, {"type": "goals", "title": "Today's goals", "items": ["I can answer the WOW! Question again.", "I can review Unit 2: body parts, animal verbs, modals and the first conditional."], "icon": "🎯"}, {"type": "mystery", "title": "What's the hidden picture?", "img": "L25_c4", "answer": "camels in the desert 🐪🏜️", "qs": [{"q": "Camels in Oman have one …", "o": ["hump", "fin", "beak"], "a": 0}, {"q": "A bird with a red face and a white … is a goldfinch.", "o": ["horn", "beak", "flipper"], "a": 1}, {"q": "Kiwi birds have small wings, but they …", "o": ["can fly", "can't fly", "must fly"], "a": 1}, {"q": "An echidna has long …", "o": ["spines", "whiskers", "flippers"], "a": 0}], "icon": "🖼️"}, {"type": "read", "title": "WOW! Over to you! (1)", "paras": ["1 Kim: If you put food on a bird table in your garden, you'll see lots of different birds. I took this photo yesterday. I like this bird with its red face, white beak and yellow and black striped wings. It's called a [[goldfinch]]. It comes every day, so it must be hungry!"], "img": "L25_c1"}, {"type": "read", "title": "WOW! Over to you! (1)", "paras": ["2 Mudrik: I loved reading about national animals. Did you know that people from New Zealand are called 'Kiwis'? Kiwi birds are about the same size as a chicken, but they lay very big eggs. They have a long beak and small wings, but they can't fly. How do you think they got to the islands of New Zealand?"], "img": "L25_c1"}, {"type": "read", "title": "WOW! Over to you! (2)", "paras": ["3 Mansoor: I liked the folk tale about the platypus. It must be the funniest animal in the world! It has fur, so it must be a mammal, but it lays eggs! They look cute, but did you know that platypuses can [[sting]] using their back feet?"], "img": "L25_c1"}, {"type": "read", "title": "WOW! Over to you! (2)", "paras": ["4 Clare: My cousins live in Australia where there are lots of interesting animals. There are camels with humps, the [[echidna]] which has long spines, the emu which is a bird with wings that cannot fly, and the platypus, of course!"], "img": "L25_c1"}, {"type": "read", "title": "WOW! Over to you! (2)", "paras": ["5 Rawan: At weekends, I sometimes go to the desert with my family. We walk, make campfires and look for birds and animals. If you look carefully, you'll see lots of camels."], "img": "L25_c1"}, {"type": "quiz", "title": "Read and choose", "qs": [{"q": "Tick the comment about animals that sting.", "o": ["Kim", "Mansoor", "Rawan"], "a": 1, "why": "'… platypuses can sting using their back feet.'"}, {"q": "Why must the goldfinch be hungry?", "o": ["It comes every day.", "It's small.", "It has a white beak."], "a": 0, "why": "'It comes every day, so it must be hungry!'"}, {"q": "What is strange about kiwi birds?", "o": ["They have fur.", "They can't fly and they lay very big eggs.", "They live in the desert."], "a": 1, "why": "Read Mudrik's comment."}, {"q": "Which bird in Australia cannot fly?", "o": ["the emu", "the goldfinch", "the eagle"], "a": 0, "why": "'… the emu which is a bird with wings that cannot fly'"}], "icon": "✅"}, {"type": "ask", "title": "Your comments", "qs": [{"q": "What did you like best in this unit?", "a": "I liked the folk tale / the national animals / the hedgehog … best."}, {"q": "Which animals did you find most interesting?", "a": "I found the Komodo dragon / the platypus most interesting because …"}, {"q": "What new information did you learn?", "a": "I learnt that bees have five eyes / the oryx gets water from its food …"}, {"q": "WOW! Question again: Why are animals so awesome? Are your answers different now?", "a": "Free answers – compare with your ideas from Lesson 1."}], "img": "L25_c1", "icon": "💬"}, {"type": "write", "title": "Write a comment for WOW!", "task": "Write your comment for the WOW! Magazine about animals. Then read it to the class.", "steps": ["What did you like best?", "Which animal did you find most interesting? Describe it.", "Use an if sentence: If you …, you'll …", "Add a question for the readers."], "words": ["I loved reading about", "It has", "It must be", "It can't", "If you …, you'll …", "Did you know that …?", "amazing", "cute"], "model": "I loved reading about the Arabian oryx. It has white fur and long horns, and it's the national animal of Oman! It must be very strong because it walks a long way to find food. If you visit the Arabian Oryx Sanctuary, you'll see them in the wild. Did you know that they don't need to drink water?", "icon": "✍️"}, {"type": "ask", "title": "Progress path: Unit 2", "qs": [{"q": "Describe an animal. Can your partner guess the animal? (It has … It can …)", "a": "It has scales and a long tongue. It can … – Is it a lizard?"}, {"q": "Name five things that an animal does.", "a": "bite, sting, roar, dig, hide, dive, fight, lay eggs, curl up, fly away …"}, {"q": "Challenge: You can see it at the aquarium. It can swim. It doesn't have fins. It has fur and flippers. It's a …", "a": "a seal 🦭"}, {"q": "AB p. 71: If it rains tomorrow, … / If it's sunny tomorrow, …", "a": "… I'll stay at home and read. / … I'll go to the beach."}, {"q": "AB p. 71: It's got flippers and fins. What animal is it?", "a": "Free answers – e.g. a dolphin or a turtle."}], "img": "L25_c3", "icon": "🛤️"}, {"type": "match", "title": "Label the parts of the animals", "pairs": [["1 🦜", "beak"], ["2 🐱", "whiskers"], ["3 🦏", "horn"]], "icon": "🧩"}, {"type": "match", "title": "Label the parts of the animals", "pairs": [["4 🐾", "paws"], ["5 🐠", "fin"], ["6 🐪", "hump"]], "icon": "🧩"}, {"type": "quiz", "title": "Complete with the correct verb", "icon": "✏️", "qs": [{"q": "Lions make a lot of noise when they ___.", "o": ["roar", "hide", "dig"], "a": 0}, {"q": "Cats often ___ under cars.", "o": ["hide", "sting", "fly away"], "a": 0}, {"q": "You and I argue, but we don't ___.", "o": ["fight", "dig", "roar"], "a": 0}, {"q": "Rabbits often ___ holes in gardens.", "o": ["dig", "sting", "hide"], "a": 0}, {"q": "Some insects can ___ you.", "o": ["sting", "roar", "dig"], "a": 0}, {"q": "If a bird is scared, it will ___.", "o": ["fly away", "fight", "dig"], "a": 0}]}, {"type": "quiz", "title": "Guess the animals", "qs": [{"q": "It's long and it doesn't have legs. It ___ be a snake.", "o": ["may", "can't", "mustn't"], "a": 0, "why": "AB example: It may be a snake."}, {"q": "It's very big and grey. It has big ears. It ___ be an elephant.", "o": ["might", "can't", "mights"], "a": 0, "why": "might = not sure"}, {"q": "It has long legs, a tail and lots of hair. It ___ be a giraffe.", "o": ["could", "can't", "must to"], "a": 0, "why": "could = not sure"}, {"q": "It has two legs and it lays eggs. It ___ be a tortoise.", "o": ["must", "can't", "may"], "a": 1, "why": "A tortoise has four legs!"}, {"q": "It's black and white and it looks like a horse. It ___ be a zebra.", "o": ["must", "can't", "might not"], "a": 0, "why": "We're sure → must"}], "icon": "🔍"}, {"type": "build", "title": "First conditional: make it true for you", "mode": "words", "items": [{"a": "If I pass my English exam, I will be very happy.", "emo": "😃", "hint": "AB example"}, {"a": "If the football team wins, we will celebrate.", "emo": "⚽", "hint": "the football team"}, {"a": "If students don't do their homework, the teacher won't be happy.", "emo": "📚", "hint": "homework"}], "icon": "✍️"}, {"type": "steps", "title": "Dictation", "icon": "✍️", "steps": ["whiskers", "antennae", "flippers", "tongue"]}, {"type": "steps", "title": "Dictation", "icon": "✍️", "steps": ["scales", "invertebrate", "It must be a hedgehog.", "If you join us, you'll be happy."]}, {"type": "race", "title": "Unit 2 race", "qs": [{"q": "A camel has a …", "options": ["hump", "fin", "beak"], "a": 0}, {"q": "Bees can … you.", "options": ["roar", "sting", "dive"], "a": 1}, {"q": "It doesn't have wings. It … be a bird.", "options": ["must", "can't", "might"], "a": 1}, {"q": "If you … me tomorrow, I'll tell you.", "options": ["see", "will see", "saw"], "a": 0}, {"q": "I'm crazy … sea animals.", "options": ["on", "about", "of"], "a": 1}, {"q": "An animal with no backbone is an …", "options": ["vertebrate", "invertebrate", "reptile"], "a": 1}], "icon": "🏁"}, {"type": "ask", "title": "How was your work in Unit 2?", "qs": [{"q": "How was your work in this unit? OK / Good / Excellent", "a": "Free answers"}, {"q": "Which lesson was your favourite?", "a": "My favourite lesson was … because …"}, {"q": "Which parts of the unit were difficult for you?", "a": "Free answers"}, {"q": "How can you work and learn better in the next unit?", "a": "I can read more / practise new words every day …"}], "icon": "🌟"}, {"type": "steps", "title": "Unit 2 in a nutshell", "icon": "🧠", "steps": ["Body parts: beak, claws, fin, flippers, horns, hump, paws, scales, spines, tongue, whiskers, antennae.", "Verbs: bite, sting, roar, fight, dive, dig, hide, lay eggs, curl up, fly away, run away, die.", "must ✓ · may / might / could ? · can't ✗", "If + present, … will …: If you look carefully, you'll see lots of camels."]}, {"type": "exit", "title": "Exit ticket", "items": [{"k": "3", "text": "Write three body parts and three animal verbs."}, {"k": "2", "text": "Complete: It has spines. It ___ be a hedgehog."}, {"k": "1", "text": "Complete: If it's sunny tomorrow, …"}], "icon": "🎟️"}, {"type": "homework", "title": "Homework", "head": "My homework", "items": ["Activity Book p. 39: Review Activities 1–5.", "Progress path AB p. 71: Unit 2.", "Learn the unit words for the dictation (AB p. 72)."], "icon": "🏠"}]}, {"id": "L26", "unit": "U3", "unitName": "Unit 2: Awesome animals", "title": "Get ready for… & Fun corner", "code": "", "theme": "library", "emo": "🎲", "slides": [{"type": "cover", "say": "Unit 2 · Lesson 11 – A2 Key practice & Fun corner"}, {"type": "goals", "title": "Today's goals", "items": ["I can read a text and choose the correct answer (A, B or C).", "I can complete a text with ONE word."], "icon": "🎯"}, {"type": "goals", "title": "Today's goals", "items": ["I can talk about my favourite animal.", "I can play the Unit 2 board game with my partner."], "icon": "🎯"}, {"type": "ask", "title": "A writer in Antarctica", "qs": [{"q": "Where is Antarctica? What's the weather like there?", "a": "It's at the very south of the Earth. It's very, very cold and icy."}, {"q": "Which animals live in Antarctica?", "a": "penguins, seals, whales …"}, {"q": "Would you like to work there? Why?", "a": "Free answers"}], "icon": "🐧"}, {"type": "explain", "title": "Reading Part 3: exam tips", "icon": "🔎", "lines": ["For each question, choose the correct answer: A, B or C."], "rule": "Find it → check the other two → choose"}, {"type": "flip", "title": "Reading Part 3: exam tips 💡 – examples", "cards": [{"front": "Read the questions first, then find the answer in the text.", "icon": "💡", "back": "1"}, {"front": "If you think you have found the correct answer, [[look at the other two again]] to check that they are wrong.", "icon": "✨", "back": "2"}, {"front": "Be careful with words like [[since / for]], [[twice a week]], [[already]].", "icon": "🔎", "back": "3"}]}, {"type": "read", "title": "Thuriya Faisal: a writer in Antarctica (1)", "paras": ["Thuriya Faisal is a writer working in Antarctica. We interviewed her by phone yesterday.", "Thuriya got her first job as a writer twenty years ago, and now she works for a magazine. It's called Wild Kids and it's full of amazing information about animals. It's read by thousands of children all around the world. Some of the children take photos and send them to the magazine."]}, {"type": "read", "title": "Thuriya Faisal: a writer in Antarctica (2)", "paras": ["This month Thuriya is working in Antarctica, writing about penguins and other animals. She's working with a team of scientists. As well as writing, she has to do other jobs. For example, she cooks dinner for the team [[every Monday and Friday]]. She's [[already]] been there for three weeks, and she's going home next week."]}, {"type": "read", "title": "Thuriya Faisal: a writer in Antarctica (2)", "paras": ["Thuriya finds Antarctica really interesting, but she doesn't like the weather. 'I'm going to Africa next,' she says. 'It's interesting there, too, and I'll be happier because it's warmer!'"]}, {"type": "quiz", "title": "Choose the correct answer", "qs": [{"q": "1 How long has Thuriya been a writer?", "o": ["A Since she was twenty.", "B For twenty years.", "C All her life."], "a": 1, "why": "'… her first job as a writer twenty years ago'"}, {"q": "2 Thousands of children …", "o": ["A send photos to the magazine.", "B write information about animals.", "C read the magazine."], "a": 2, "why": "'It's read by thousands of children …' (only some send photos)"}, {"q": "3 How often does Thuriya cook dinner?", "o": ["A Twice a week.", "B Once a month.", "C Every day."], "a": 0, "why": "'… every Monday and Friday'"}, {"q": "4 Thuriya travelled to Antarctica …", "o": ["A a month ago.", "B last week.", "C three weeks ago."], "a": 2, "why": "'She's already been there for three weeks.'"}, {"q": "5 Thuriya thinks …", "o": ["A Africa is more interesting than Antarctica.", "B Antarctica is too cold.", "C Africa is too warm."], "a": 1, "why": "She doesn't like the weather; she'll be happier in Africa because it's warmer."}], "icon": "✅"}, {"type": "ask", "title": "Talk about animals", "qs": [{"q": "What is your favourite animal?", "a": "My favourite animal is the camel / the dolphin …"}, {"q": "What does it look like?", "a": "It's big and brown. It has a hump and long legs."}, {"q": "What animals have you seen near your home?", "a": "I've seen cats, birds, lizards and goats near my home."}, {"q": "Which animal are you scared of? Why?", "a": "I'm scared of scorpions because the thes, a washbag and more! 🧳", "qs": [{"q": "You clean your teeth with a …", "o": ["toothbrush", "pillow"], "a": 0}, {"q": "Your phone needs a …", "o": ["charger", "raincoat"], "a": 0}, {"q": "On the beach you wear …", "o": ["boots", "flip-flops"], "a": 1}, {"q": "You need it at the airport:", "o": ["passport", "guidebook"], "a": 0}], "icon": "🕵️"}, {"type": "ask", "title": "Look and guess", "qs": [{"q": "Who are the boys?", "a": "Frank and Majid from the WOW! Team."}, {"q": "What kind of trip are they going on? Guess!", "a": "A trip to another country … (we'll check!)"}, {"q": "What do you take in a small rucksack on a plane?", "a": "a camera, a wallet, some water, a book … (free answers)"}], "img": "L30_c1", "icon": "💬"}, {"type": "read", "title": "Ready for our trip (1)", "paras": ["Frank: Are you ready for our trip, Majid?\nMajid: Of course!\nFrank: I'm going to take a small rucksack with my camera, my [[wallet]], some water …\nMajid: Good idea. I'll take a small bag, too."], "icon": "🎧"}, {"type": "read", "title": "Ready for our trip (1)", "paras": ["Frank: Then, in my suitcase I'm going to take sweatshirts and jeans, a raincoat …\nMajid: Er … I'll take the same clothes as you.\nFrank: Are you going to take an umbrella?\nMajid: No. I don't have one.\nFrank: Don't worry. I'll take one. We can [[share]] it."], "icon": "🎧"}, {"type": "read", "title": "Ready for our trip (2)", "paras": ["Majid: OK. Cool. What do I need to bring in my washbag?\nFrank: Bring your toothbrush. I'll bring toothpaste, soap and shampoo. We can share those.\nMajid: Good plan!\nFrank: Don't forget the most important thing, Majid.\nMajid: Er, a friend like you!\nFrank: Ha ha! Yes, but I was thinking about your passport."], "icon": "🎧"}, {"type": "read", "title": "Ready for our trip (2)", "paras": ["Majid: Of course! I'll go home and look for that now.\nFrank: Majid! Are you sure you're ready for this trip? Are you excited?\nMajid: Yes! Because we're going to visit London and practise our English.\nFrank: I'll download a guidebook about the city.\nMajid: Thanks for your help. I'll get some sweets for the plane!"], "icon": "🎧"}, {"type": "quiz", "title": "Answer the questions", "qs": [{"q": "Who's going to take a small rucksack?", "o": ["Majid", "Frank", "Both of them"], "a": 1, "why": "Frank: I'm going to take a small rucksack…"}, {"q": "Does Majid need to take toothpaste, soap and shampoo?", "o": ["Yes, he does.", "No – Frank will bring them and they'll share."], "a": 1, "why": "I'll bring toothpaste, soap and shampoo. We can share those."}, {"q": "Does Majid have his passport?", "o": ["Yes, it's in his bag.", "No – he's going to look for it at home."], "a": 1, "why": "I'll go home and look for that now."}, {"q": "Who will get some sweets?", "o": ["Majid", "Frank"], "a": 0, "why": "Majid: I'll get some sweets for the plane!"}, {"q": "How are they going to get there?", "o": ["by train", "by plane", "by bus"], "a": 1, "why": "…sweets for the plane!"}, {"q": "Who's ready for the trip?", "o": ["Frank", "Majid"], "a": 0, "why": "Majid forgot his passport and has no umbrella – Frank is ready!"}], "icon": "✅"}, {"type": "tf", "title": "True or false? Explain!", "items": [{"text": "Frank isn't going to take a camera on the trip.", "a": false, "fix": "He's going to take a rucksack with his camera in it."}, {"text": "Majid is going to take sweatshirts and jeans.", "a": true, "fix": "I'll take the same clothes as you."}, {"text": "Frank doesn't think they will need an umbrella.", "a": false, "fix": "He'll take one and they can share it."}], "icon": "✔️✘"}, {"type": "tf", "title": "True or false? Explain!", "items": [{"text": "Majid knows they are going to visit London.", "a": true, "fix": "…we're going to visit London."}, {"text": "Frank is going to buy a guidebook at a bookshop.", "a": false, "fix": "He'll download a guidebook."}], "icon": "✔️✘"}, {"type": "quiz", "title": "Complete the sentences", "icon": "✏️", "qs": [{"q": "Frank asks Majid if he's ___ for their trip to London.", "o": ["ready", "late"], "a": 0}, {"q": "Majid says he's going to take a small ___.", "o": ["bag", "suitcase"], "a": 0}, {"q": "Frank is going to put his raincoat into his ___.", "o": ["washbag", "suitcase"], "a": 1}, {"q": "Majid tells Frank that he doesn't have an ___.", "o": ["umbrella", "passport"], "a": 0}, {"q": "Frank says they can share his ___, soap and shampoo.", "o": ["toothpaste", "toothbrush"], "a": 0}, {"q": "Majid is going to look for his ___ at home.", "o": ["camera", "passport"], "a": 1}]}, {"type": "explain", "title": "Useful expressions", "icon": "🗨️", "lines": ["We use these expressions to answer friends in a friendly way."], "rule": "Of course! · Good plan! · Thanks for your help."}, {"type": "flip", "title": "Useful expressions 💡 – examples", "cards": [{"front": "Can you help me? – [[Of course!]]", "icon": "💡", "back": "yes, happily ✅"}, {"front": "I'll bring the toothpaste. – [[Good plan!]]", "icon": "✨", "back": "a good idea 👍"}, {"front": "Here's your passport. – [[Thanks for your help.]]", "icon": "🔎", "back": "thank you 🙏"}]}, {"type": "match", "title": "Match the answer", "pairs": [["I'm going to take a pillow so I can sleep on the bus.", "Good plan!"], ["Do you have your passport?", "Of course!"], ["There! Now you're ready.", "Thanks for your help."], ["Can you give me some advice about my holiday?", "Of course! I'm always happy to help."]], "icon": "🧩"}, {"type": "quiz", "title": "Complete the dialogues", "icon": "✏️", "qs": [{"q": "A: I'm going to take a raincoat. Do you think that's a good idea?\nB: ___ You don't know what the weather is like.", "o": ["Good plan!", "Thanks for your help."], "a": 0}, {"q": "A: We've done it! The house is finally tidy!\nB: Yes, it is. ___\nA: You're welcome.", "o": ["Of course!", "Thanks for your help."], "a": 1}, {"q": "B: I'm hungry. Can you help me make some pizza?\nA: ___ Pizza's my favourite food!", "o": ["Of course!", "Good plan!"], "a": 0}, {"q": "B: After lunch we could go to the 3D cinema.\nA: ___ There's a new science fiction film I want to watch.", "o": ["Good plan!", "Thanks for your help."], "a": 0}]}, {"type": "order", "title": "Put the dialogue in order", "items": ["Frank asks: Are you ready for our trip, Majid?", "Frank says he's going to take a small rucksack.", "Majid says he doesn't have an umbrella.", "Frank says they can share toothpaste, soap and shampoo.", "Frank reminds Majid about his passport.", "Majid says he'll get some sweets for the plane."], "icon": "🔢"}, {"type": "ask", "title": "Your trip!", "qs": [{"q": "Choose a trip to another country. Where are you going to go?", "a": "I'm going to go to Egypt / Malaysia / London …"}, {"q": "What are you going to do there?", "a": "I'm going to visit museums / swim / practise my English …"}, {"q": "What are you going to take?", "a": "I'm going to take my passport, a camera, flip-flops …"}, {"q": "Your partner: Good plan! / Of course! Tell the class.", "a": "Ahmed is going to go to … He's going to take …"}], "img": "L30_c1", "icon": "🌍"}, {"type": "memory", "title": "Memory: who said it?", "pairs": [["I'm going to take a small rucksack.", "Frank"], ["I don't have one.", "Majid"], ["We can share it.", "Frank"], ["A friend like you!", "Majid"], ["I'll download a guidebook.", "Frank"], ["I'll get some sweets!", "Majid"]], "icon": "🧠"}, {"type": "steps", "title": "Let's remember!", "icon": "🧠", "steps": ["Frank and Majid are going to visit London by plane to practise English.", "Frank is ready; Majid forgot his passport and has no umbrella!", "Of course! = yes, happily · Good plan! = good idea · Thanks for your help.", "I'm going to … = my plan · I'll … = I decide now."]}, {"type": "exit", "title": "Exit ticket", "items": [{"k": "3", "text": "Where are Frank and Majid going?"}, {"k": "2", "text": "What did Majid forget?"}, {"k": "1", "text": "Your friend says: 'Here's your bag.' What do you say?"}], "icon": "🎟️"}, {"type": "homework", "title": "Homework", "head": "My homework", "items": ["Activity Book p. 43: Activities 1–3.", "Activity 4: write another short dialogue for each expression.", "Read the dialogue on p. 69 aloud at home."], "icon": "🏠"}]}, {"id": "L31", "unit": "U4", "unitName": "Unit 3: Travel", "title": "Grammar: going to and will", "code": "", "theme": "park", "emo": "🔮", "slides": [{"type": "cover", "say": "Unit 3 · Lesson 3 – plans and quick decisions"}, {"type": "goals", "title": "Today's goals", "items": ["I can use going to for plans I have already decided.", "I can use will ('ll) for decisions at the time of speaking."], "icon": "🎯"}, {"type": "goals", "title": "Today's goals", "items": ["I can make negatives: aren't going to / won't.", "I can talk about my plans for the weekend."], "icon": "🎯"}, {"type": "riddle", "title": "Who said it?", "items": [{"clues": ["'I'm going to take a small rucksack.'", "He has a camera and a wallet in it."], "a": "Frank", "emo": "🎒"}, {"clues": ["'I'll take a small bag, too.'", "He doesn't have an umbrella."], "a": "Majid", "emo": "👜"}, {"clues": ["'I'll download a guidebook about the city.'", "He's always ready!"], "a": "Frank", "emo": "📲"}, {"clues": ["'I'll get some sweets for the plane!'", "He forgot his passport."], "a": "Majid", "emo": "🍬"}], "icon": "🤔"}, {"type": "quiz", "title": "Find and complete", "icon": "✏️", "qs": [{"q": "I ___ take a small rucksack.", "o": ["'m going to", "'ll"], "a": 0}, {"q": "I ___ take a small bag, too.", "o": ["'m going to", "'ll"], "a": 1}, {"q": "I ___ take sweatshirts and jeans.", "o": ["'m going to", "'ll"], "a": 0}, {"q": "I ___ take the same clothes as you.", "o": ["'re going to", "'ll"], "a": 1}, {"q": "We ___ visit London.", "o": ["'re going to", "'ll"], "a": 0}, {"q": "I ___ get some sweets for the plane!", "o": ["'m going to", "'ll"], "a": 1}]}, {"type": "explain", "title": "going to: plans", "icon": "🗓️", "lines": ["We use going to to talk about things we have [[already decided]] to do.", "be (am / is / are) + going to + verb"], "rule": "I'm / He's / We're + going to + verb"}, {"type": "flip", "title": "going to: plans 🗓️ – examples", "cards": [{"front": "I'm [[going to]] visit London.", "icon": "💡", "back": "✅ my plan"}, {"front": "We [[aren't going to]] take a guidebook.", "icon": "✨", "back": "❌ negative"}, {"front": "[[Are]] you [[going to]] take an umbrella?", "icon": "🔎", "back": "❓ question"}]}, {"type": "explain", "title": "will: quick decisions", "icon": "⚡", "lines": ["We use will when we [[decide at the time of speaking]].", "will ('ll) + verb · will not = won't"], "rule": "going to = decided before 🗓️ · will = decided now ⚡"}, {"type": "flip", "title": "will: quick decisions ⚡ – examples", "cards": [{"front": "I don't have an umbrella. – Don't worry. I[['ll]] take one.", "icon": "💡", "back": "⚡ decided now"}, {"front": "I[['ll]] get some sweets.", "icon": "✨", "back": "⚡ new idea"}, {"front": "She [[won't]] look for it now.", "icon": "🔎", "back": "❌ negative"}]}, {"type": "sort", "title": "Plan or quick decision?", "bins": [{"label": "going to – already decided", "icon": "🗓️"}, {"label": "will – decided now", "icon": "⚡"}], "cards": [{"text": "I'm going to take a small rucksack.", "icon": "", "bin": 0}, {"text": "We're going to visit London.", "icon": "", "bin": 0}, {"text": "I'm going to take sweatshirts and jeans.", "icon": "", "bin": 0}, {"text": "I'll take a small bag, too.", "icon": "", "bin": 1}, {"text": "Don't worry. I'll take one.", "icon": "", "bin": 1}, {"text": "I'll go home and look for that now.", "icon": "", "bin": 1}, {"text": "I'll download a guidebook.", "icon": "", "bin": 1}], "icon": "🗂️"}, {"type": "quiz", "title": "Circle the correct option", "qs": [{"q": "Rashid: What ___ do next weekend?", "o": ["are you going to", "will you"], "a": 0, "why": "Asking about a plan → going to."}, {"q": "Mansoor: If it's nice weather, ___ go camping.", "o": ["I'll", "I'm going to"], "a": 0, "why": "If … , … will – it depends on the weather."}, {"q": "Mansoor: ___ take a tent.", "o": ["I'm going to", "I'll"], "a": 1, "why": "He decides now, while they are talking."}, {"q": "Rashid: OK, ___. Anything else?", "o": ["I'm going to", "I will"], "a": 1, "why": "A quick answer: OK, I will."}, {"q": "Mansoor: ___ go camping in the forest. It's really great there.", "o": ["We'll", "We're going to"], "a": 1, "why": "It's his plan – already decided."}], "img": "L31_c4", "icon": "✅"}, {"type": "ask", "title": "Who said …?", "qs": [{"q": "Who said, 'I'm going to take a small rucksack'?", "a": "Frank."}, {"q": "Who said, 'I'll take a small bag, too'?", "a": "Majid."}, {"q": "Who said, 'I'll download a guidebook about the city'?", "a": "Frank."}, {"q": "Write your own question and ask your partner!", "a": "Who said, 'We're going to visit London'? – Majid."}], "img": "L31_c2", "icon": "🗣️"}, {"type": "quiz", "title": "going to or will?", "icon": "✏️", "qs": [{"q": "I'm hungry. I think I ___ a sandwich.", "o": ["will make", "am going to make"], "a": 0}, {"q": "We ___ to the cinema later. We bought our tickets online.", "o": ["will go", "are going to go"], "a": 1}, {"q": "Omaima ___ basketball today. She has her swimming lesson at 4 o'clock.", "o": ["isn't going to play", "won't to play"], "a": 0}, {"q": "Don't worry about your journey to Muscat. You ___ any problems.", "o": ["won't have", "aren't have"], "a": 0}, {"q": "If you wait a minute, I ___ you with those big suitcases.", "o": ["'ll help", "'m help"], "a": 0}, {"q": "Bassam is playing football on Saturday and we ___ him.", "o": ["are going to watch", "will watching"], "a": 0}]}, {"type": "ask", "title": "Grandma's travel things", "qs": [{"q": "Look at the things: suitcase, musical instrument, flip-flops, guidebook. Where do you think they're from?", "a": "Free guesses – then listen to 3.6 and match each thing to a place (A–F). There are two extra places."}, {"q": "Listen again (3.7): What's the suitcase made of? Which thing is from Mexico?", "a": "Answers from the recording."}, {"q": "Who bought the flip-flops? When will the girl wear them?", "a": "Answers from the recording."}, {"q": "What's Grandma going to buy?", "a": "Answer from the recording – notice: going to!"}], "img": "L31_c3", "icon": "🎧"}, {"type": "build", "title": "Make the sentence", "mode": "words", "items": [{"a": "We are going to visit Nizwa Fort.", "hint": "a plan 🗓️", "emo": "🏰"}, {"a": "I will help you with your bag.", "hint": "a quick offer ⚡", "emo": "🧳"}, {"a": "She isn't going to take a guidebook.", "hint": "negative plan ❌", "emo": "📘"}, {"a": "Are you going to take an umbrella?", "hint": "a question ❓", "emo": "☂️"}], "icon": "🧩"}, {"type": "ask", "title": "A long bus trip", "qs": [{"q": "Choose six things for your small bag on a long bus trip.", "a": "a pillow, water, a book, a charger, snacks, earphones …"}, {"q": "A: I'm going to take a pillow.", "a": "B: Good idea! I'll take a pillow, too."}, {"q": "A: I'm going to take some water.", "a": "B: Good plan! I'll take some snacks."}], "img": "L31_c2", "icon": "🚌"}, {"type": "enter", "title": "Catch the sentences that are correct!", "gate": "✓", "items": [{"text": "I'll help you.", "in": true}, {"text": "He going fly.", "in": false}, {"text": "I'll to help you.", "in": false}, {"text": "I'm going to visit London.", "in": true}, {"text": "We not going to swim.", "in": false}, {"text": "He's going to fly.", "in": true}]}, {"type": "boxes", "title": "Treasure boxes", "boxes": [{"label": "1", "q": "Make a sentence: next summer / going to", "a": "Next summer, my family is going to visit Salalah."}, {"label": "2", "q": "Your friend's bag is heavy. Offer help!", "a": "I'll carry it for you."}, {"label": "3", "q": "Negative: I'll take a guidebook.", "a": "I won't take a guidebook."}, {"label": "4", "q": "Make a question: you / going to / pack / tonight", "a": "Are you going to pack tonight?"}, {"label": "5", "q": "It's raining! Quick decision!", "a": "I'll take my umbrella."}, {"label": "6", "q": "Tell us your plan for this weekend.", "a": "This weekend, I'm going to …"}], "icon": "🎁"}, {"type": "steps", "title": "Let's remember!", "icon": "🧠", "steps": ["going to → plans we decided before: I'm going to visit London.", "will ('ll) → decisions now, offers: I'll take one. I'll help you.", "Negatives: aren't / isn't going to · won't.", "Questions: Are you going to …? · Will you …?"]}, {"type": "exit", "title": "Exit ticket", "items": [{"k": "3", "text": "Write your plan for tomorrow with going to."}, {"k": "2", "text": "Your friend is cold. Make an offer with will."}, {"k": "1", "text": "Make it negative: We're going to take a taxi."}], "icon": "🎟️"}, {"type": "homework", "title": "Homework", "head": "My homework", "items": ["Activity Book pp. 44–45: Activities 2–5.", "Grammar practice p. 62: Activities 1–2.", "Activity 5: write what you are going to do this weekend."], "icon": "🏠"}]}, {"id": "L32", "unit": "U4", "unitName": "Unit 3: Travel", "title": "Book club: Are we nearly there yet?", "code": "", "theme": "park", "emo": "🚀", "slides": [{"type": "cover", "say": "Unit 3 · Lesson 4 – WOW! Book club: a science fiction story"}, {"type": "goals", "title": "Today's goals", "items": ["I can say what a science fiction story is.", "I can read a story about a holiday on the Moon."], "icon": "🎯"}, {"type": "goals", "title": "Today's goals", "items": ["I can answer questions about the story.", "I can use phrasal verbs with on and off."], "icon": "🎯"}, {"type": "quiz", "title": "What is science fiction?", "qs": [{"q": "Science fiction stories are usually …", "o": ["in the future", "in the past"], "a": 0, "why": "They tell us about the future: rockets, robots, space hotels…"}, {"q": "They're usually in a world that is …", "o": ["the same as ours", "different from ours"], "a": 1, "why": "A different world: on the Moon, on Mars, with new machines."}, {"q": "Which of these is a science fiction idea?", "o": ["a hotel on the Moon", "a hotel in Muscat"], "a": 0, "why": "We can't stay on the Moon … yet!"}], "icon": "🤖"}, {"type": "ask", "title": "Look and predict", "qs": [{"q": "Where did the family go on holiday?", "a": "To the Moon! (we'll check)"}, {"q": "How did they travel?", "a": "By rocket 🚀"}, {"q": "Read the title: 'Are we nearly there yet?' Who says this on long journeys?", "a": "Children! When they are bored on a long journey 😄"}], "img": "L32_c1", "icon": "🔭"}, {"type": "read", "title": "Are we nearly there yet? (1)", "paras": ["I was [[bored]]. 'There's nothing to do in the holidays,' I said.\n'Ride your bike, Issa, or go to the park,' said Mum.\n'But I want to do something exciting,' I said.", "'We're going to go on an exciting [[journey]] tomorrow,' said Dad. 'Go and pack your suitcase.'", "The next morning we caught a train to the [[launch pad]] and got on the rocket.\n'Please take your seats. The flight leaves in ten minutes.'"], "icon": "📖"}, {"type": "read", "title": "Are we nearly there yet? (2)", "paras": ["There was a loud noise and suddenly we [[took off]] up into the sky. I looked out of my window and watched the Earth getting smaller and smaller.", "'Are we nearly there yet?' asked my sister Aida.\n'No way! We arrive tomorrow!' I said. 'Take that pillow and go to sleep.'\nThe sky was dark now. There were thousands of stars. It was beautiful.", "'Wake up, Issa! We [[land]] in fifteen minutes,' said Aida."], "icon": "📖"}, {"type": "read", "title": "Are we nearly there yet? (3)", "paras": ["We got off the rocket and travelled by Moon train to the space hotel. Our bedroom had big windows in the roof. We could see Mars from the window!", "It was fun for a few days [[floating]] around in the hotel and [[exploring]] the [[corridors]], but there wasn't much to do and the food wasn't fresh."], "img": "L32_c2", "icon": "📖"}, {"type": "read", "title": "Are we nearly there yet? (4)", "paras": ["One day, Aida said, 'Can we play outdoors?'\n'Well, not really,' said Mum, 'but there's a Moon walk at three o'clock.'", "The Moon walk was interesting, but it took a long time to put on the space suits and the [[helmets]] were [[uncomfortable]]."], "img": "L32_c3", "icon": "📖"}, {"type": "read", "title": "Are we nearly there yet? (4)", "paras": ["'When do we go back to Earth?' I asked.\n'We leave in three days,' said Mum.\n'Oh, good. When we get home, I'm going to ride my bike and go to the park,' I said."], "img": "L32_c3", "icon": "📖"}, {"type": "quiz", "title": "Who says it? Complete", "icon": "✏️", "qs": [{"q": "Issa: 'There's nothing to do in the ___.'", "o": ["holidays", "hotel"], "a": 0}, {"q": "Dad: 'We're going to go on an exciting ___.'", "o": ["journey", "walk"], "a": 0}, {"q": "Aida: 'Are we nearly there ___?'", "o": ["now", "yet"], "a": 1}, {"q": "Aida: 'Wake up, Issa! We ___ in fifteen minutes.'", "o": ["land", "leave"], "a": 0}, {"q": "Mum: 'Well, not really, but there's a Moon ___ at three o'clock.'", "o": ["train", "walk"], "a": 1}, {"q": "Issa: 'When do we go ___ to Earth?'", "o": ["back", "on"], "a": 0}]}, {"type": "quiz", "title": "Answer the questions", "qs": [{"q": "What did Issa want at the beginning of the story?", "o": ["He wanted to do something exciting.", "He wanted to sleep."], "a": 0, "why": "'But I want to do something exciting.'"}, {"q": "How did the family get to the launch pad?", "o": ["by bus", "by train"], "a": 1, "why": "We caught a train to the launch pad."}, {"q": "Why did Issa and Aida need pillows?", "o": ["The journey was long – they slept on the rocket.", "The seats were wet."], "a": 0, "why": "'We arrive tomorrow! Take that pillow and go to sleep.'"}, {"q": "How could Issa see Mars from the hotel room?", "o": ["on TV", "through big windows in the roof"], "a": 1, "why": "Our bedroom had big windows in the roof."}, {"q": "Why didn't Issa and Aida like the hotel very much?", "o": ["There wasn't much to do and the food wasn't fresh.", "It was too hot."], "a": 0, "why": "…there wasn't much to do and the food wasn't fresh."}, {"q": "Where does Issa want to go when he gets home?", "o": ["to the Moon again", "to the park"], "a": 1, "why": "I'm going to ride my bike and go to the park."}], "icon": "✅"}, {"type": "order", "title": "Put the story in order", "items": ["Issa is bored at home.", "Dad says: Go and pack your suitcase.", "They catch a train to the launch pad.", "The rocket takes off into the sky.", "They travel by Moon train to the space hotel.", "They go on a Moon walk."], "icon": "🔢"}, {"type": "ask", "title": "Discuss in groups", "qs": [{"q": "Were the children happier on their holiday or at home? Why?", "a": "At home! On the Moon there wasn't much to do, the food wasn't fresh and the helmets were uncomfortable."}, {"q": "Would you like to go on holiday to the Moon? Why?", "a": "Yes, because it's exciting … / No, because it's far and the food isn't fresh … (free answers)"}], "img": "L32_c3", "icon": "💬"}, {"type": "explain", "title": "Phrasal verbs with on and off", "icon": "🔛", "lines": ["Many verbs go with on or off and make a new meaning."], "rule": "get on/off · take off · put on · turn on/off"}, {"type": "flip", "title": "Phrasal verbs with on and off 💡 – examples", "cards": [{"front": "We [[got on]] the rocket. / We [[got off]] the rocket.", "icon": "💡", "back": "🚀 enter / leave"}, {"front": "We [[took off]] up into the sky.", "icon": "✨", "back": "🛫 leave the ground"}, {"front": "It took a long time to [[put on]] the space suits.", "icon": "🔎", "back": "👨‍🚀 wear"}, {"front": "[[Turn on]] the light. / [[Turn off]] the TV.", "icon": "📌", "back": "💡 start / stop"}]}, {"type": "ask", "title": "Look and say the phrasal verb", "qs": [{"q": "Picture 1 and picture 3: people and transport.", "a": "1 get on (the bus) · 3 get off (the train)"}, {"q": "Picture 2 and picture 6: a lamp and a TV.", "a": "2 turn on (the light) · 6 turn off (the TV)"}, {"q": "Picture 4 and picture 5: a helmet and a rocket.", "a": "4 put on (a helmet) · 5 take off (the rocket)"}], "img": "L32_c4", "icon": "👀"}, {"type": "write", "title": "Write the journey back to Earth", "task": "Work in groups. Write another paragraph about the journey back to Earth.", "steps": ["What happened?", "How long did it take?", "How did they feel?", "What did they say?"], "words": ["got on", "took off", "landed", "got off", "the next day", "excited", "tired", "happy", "Are we nearly there yet?"], "model": "Three days later, we got on the rocket again. It took off at nine o'clock. The journey took one day and Aida slept on her pillow. 'Are we nearly there yet?' she asked again. When we landed, I was so happy. I got off the rocket and said, 'Home at last!'", "icon": "✍️"}, {"type": "memory", "title": "Memory: phrasal verbs", "pairs": [["get on", "enter a bus / train / rocket"], ["get off", "leave a bus / train / rocket"], ["take off", "a plane leaves the ground"], ["put on", "start to wear"], ["turn on", "start a machine"], ["turn off", "stop a machine"]], "icon": "🧠"}, {"type": "steps", "title": "Let's remember!", "icon": "🧠", "steps": ["Science fiction: in the future, in a world different from ours.", "Issa's family went on holiday to the Moon by rocket and stayed in a space hotel.", "There wasn't much to do, so Issa wanted to go home!", "Phrasal verbs: get on/off, take off, put on, turn on/off."]}, {"type": "exit", "title": "Exit ticket", "items": [{"k": "3", "text": "Where did Issa's family stay?"}, {"k": "2", "text": "Why was the Moon walk not much fun?"}, {"k": "1", "text": "Write a sentence with 'take off'."}], "icon": "🎟️"}, {"type": "homework", "title": "Homework", "head": "My homework", "items": ["Activity Book pp. 46–47: Activities 1–4.", "Finish your paragraph about the journey back to Earth.", "Read the story aloud to your family."], "icon": "🏠"}]}, {"id": "L33", "unit": "U4", "unitName": "Unit 3: Travel", "title": "Transport verbs & Present simple for the future", "code": "", "theme": "park", "emo": "🛫", "slides": [{"type": "cover"}, {"type": "goals", "title": "Today's goals", "items": ["I can use 12 travel verbs: get on, take off, land, arrive …", "I can find travel verbs in the Moon story."], "icon": "🎯"}, {"type": "goals", "title": "Today's goals", "items": ["I can use the Present simple for timetables: The train leaves at 6.", "I can talk about the timetable of my journey."], "icon": "🎯"}, {"type": "build", "title": "Unscramble the travel verbs", "mode": "letters", "items": [{"a": "land", "hint": "a plane comes down to the ground", "emo": "🛬"}, {"a": "leave", "hint": "go away from a place", "emo": "👋"}, {"a": "arrive", "hint": "get to a place", "emo": "📍"}, {"a": "explore", "hint": "look around a new place", "emo": "🔎"}, {"a": "journey", "hint": "go on a …", "emo": "🗺️"}], "icon": "🔤"}, {"type": "flip", "title": "Travel verbs (1)", "cards": [{"front": "pack your suitcase", "icon": "🧳", "back": "put your things in your suitcase\n«Go and pack your suitcase.»"}, {"front": "go on a journey", "icon": "🗺️", "back": "travel somewhere\n«We're going to go on an exciting journey.»"}, {"front": "travel by train", "icon": "🚆", "back": "use a train to go somewhere\n«We travelled by Moon train.»"}, {"front": "catch a bus", "icon": "🚌", "back": "get on a bus at the right time\n«We'll catch a bus to the hotel.»"}, {"front": "get on", "icon": "⬆️", "back": "go into a bus, train, plane or rocket\n«We got on the rocket.»"}, {"front": "get off", "icon": "⬇️", "back": "leave a bus, train, plane or rocket\n«We got off the rocket.»"}], "icon": "🚌"}, {"type": "flip", "title": "Travel verbs (2)", "cards": [{"front": "take off", "icon": "🛫", "back": "a plane or rocket leaves the ground\n«The plane takes off at 9.30.»"}, {"front": "land", "icon": "🛬", "back": "a plane or rocket comes down to the ground\n«We land in fifteen minutes.»"}, {"front": "arrive", "icon": "📍", "back": "get to a place\n«We arrive tomorrow!»"}, {"front": "leave", "icon": "👋", "back": "go away from a place\n«The flight leaves in ten minutes.»"}, {"front": "explore", "icon": "🔎", "back": "travel around a place to learn about it\n«We explored the fort.»"}, {"front": "take a seat", "icon": "💺", "back": "sit down\n«Please take your seats.»"}], "icon": "✈️"}, {"type": "ask", "title": "Look and match", "qs": [{"q": "What are pictures 1, 2 and 3?", "a": "1 get on · 2 get off · 3 catch a bus"}, {"q": "What are pictures 4, 5 and 6?", "a": "4 go on a journey · 5 take off · 6 arrive"}, {"q": "What are pictures 7, 8 and 9?", "a": "7 land · 8 explore · 9 take a seat"}, {"q": "What are pictures 10, 11 and 12?", "a": "10 pack your suitcase · 11 travel by train · 12 leave"}], "img": "L33_c1", "icon": "🔢"}, {"type": "match", "title": "Match the opposites", "pairs": [["get on", "get off"], ["take off", "land"], ["arrive", "leave"], ["pack your suitcase", "unpack your suitcase"], ["take a seat", "stand up"]], "icon": "🔄"}, {"type": "sort", "title": "In the Moon story or not?", "bins": [{"label": "In the story", "icon": "🚀"}, {"label": "Not in the story", "icon": "❌"}], "cards": [{"text": "go on a journey", "icon": "", "bin": 0}, {"text": "leave", "icon": "", "bin": 0}, {"text": "get off", "icon": "", "bin": 0}, {"text": "arrive", "icon": "", "bin": 0}, {"text": "take a seat", "icon": "", "bin": 0}, {"text": "exploring", "icon": "", "bin": 0}, {"text": "took off", "icon": "", "bin": 0}, {"text": "get on", "icon": "", "bin": 0}, {"text": "pack your suitcase", "icon": "", "bin": 0}, {"text": "catch a bus", "icon": "", "bin": 1}], "icon": "🚀"}, {"type": "quiz", "title": "From the story: complete", "icon": "✏️", "qs": [{"q": "The flight ___ in ten minutes.", "o": ["leaves", "is leaving"], "a": 0}, {"q": "We ___ tomorrow.", "o": ["arrive", "arrived"], "a": 0}, {"q": "We ___ in fifteen minutes.", "o": ["land", "landed"], "a": 0}, {"q": "When ___ we go back to Earth?", "o": ["do", "does"], "a": 0}, {"q": "We ___ in three days.", "o": ["leave", "leaves"], "a": 0}]}, {"type": "explain", "title": "Present simple for the future", "icon": "🕒", "lines": ["We use the [[Present simple]] when we talk about [[timetables]] and [[fixed plans]] in the future.", "he / she / it
