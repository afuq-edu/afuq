:root{--ink:#14284b;--ink2:#3b4f72;--cream:#fdf6e9;--gold:#e3b45a;--pink:#fde3e6;--pinkb:#e8798a;--blue:#dcecff;--blueb:#6aa2e8;--yel:#fff1c9;--yelb:#e2b13c;--grn:#dff3e0;--grnb:#5fb873;--pur:#ece4ff;--purb:#9b84e6;--org:#ffe6d5;--orgb:#f0965f;--ok:#2fa35a;--no:#e05561}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#0e1830;overflow:hidden;font-family:'Baloo Bhaijaan 2','Noto Naskh Arabic',system-ui,sans-serif;color:var(--ink)}
button{font:inherit;cursor:pointer}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#stage{position:relative;width:1600px;height:900px;transform-origin:center center;overflow:hidden;border-radius:6px;background:#fff}
.scene{position:absolute;inset:0;width:100%;height:100%}
.slide{position:absolute;inset:0}
.slide.in{animation:sIn .5s ease}
@keyframes sIn{from{opacity:0;transform:scale(1.015)}to{opacity:1;transform:none}}
bdi.en{font-family:'Baloo Bhaijaan 2',system-ui,sans-serif;unicode-bidi:isolate}
mark{background:linear-gradient(transparent 45%,#ffe27a 45%,#ffe27a 92%,transparent 92%);color:inherit;padding:0 .1em}
/* banner (top title card) */
.banner{position:absolute;top:26px;left:50%;transform:translateX(-50%);min-width:760px;max-width:1300px;padding:14px 92px 16px;background:var(--cream);border:5px solid var(--gold);border-radius:34px;box-shadow:0 8px 0 rgba(0,0,0,.12),inset 0 0 0 4px #fff;text-align:center;z-index:5}
.banner:before{content:"";position:absolute;inset:8px;border:2.5px dashed #e9cf98;border-radius:26px;pointer-events:none}
.banner h1{margin:0;font-weight:800;font-size:54px;line-height:1.25;color:var(--ink)}
.banner h1 .k{color:#d6344f}
.banner .ico{position:absolute;top:50%;transform:translateY(-50%);font-size:52px}
.banner .ico.r{right:18px}.banner .ico.l{left:18px}
.banner.pink{background:#fff0f2;border-color:var(--pinkb)}.banner.pink:before{border-color:#f3b5bf}
.pill{position:absolute;left:50%;transform:translateX(-50%);background:#fffaf0;border:3px solid #d7b878;border-radius:22px;padding:4px 30px 6px;font-size:32px;font-weight:600;color:var(--ink2);white-space:nowrap;z-index:5;box-shadow:0 4px 0 rgba(0,0,0,.08)}
/* generic cards */
.card{position:relative;background:var(--cream);border:5px solid var(--gold);border-radius:30px;box-shadow:0 8px 0 rgba(0,0,0,.13);padding:18px 26px}
.card:before{content:"";position:absolute;inset:8px;border:2.5px dashed rgba(0,0,0,.14);border-radius:22px;pointer-events:none}
.c0{background:var(--pink);border-color:var(--pinkb)}.c1{background:var(--blue);border-color:var(--blueb)}.c2{background:var(--yel);border-color:var(--yelb)}.c3{background:var(--grn);border-color:var(--grnb)}.c4{background:var(--pur);border-color:var(--purb)}.c5{background:var(--org);border-color:var(--orgb)}
.big{font-size:44px;font-weight:700;line-height:1.45}
.mid{font-size:38px;font-weight:600;line-height:1.5}
.emo{font-size:72px;line-height:1;filter:drop-shadow(0 4px 0 rgba(0,0,0,.12))}
.hide{visibility:hidden}
.tap{cursor:pointer}
.panel{position:absolute;left:50%;transform:translateX(-50%);background:rgba(255,253,247,.94);border:5px solid #d9c08e;border-radius:34px;box-shadow:0 10px 0 rgba(0,0,0,.12);padding:26px 34px}
/* nav */
.nav{position:fixed;bottom:16px;width:64px;height:64px;border-radius:50%;border:0;background:rgba(255,255,255,.88);color:#14284b;font-size:30px;font-weight:800;box-shadow:0 4px 14px rgba(0,0,0,.25);z-index:50;display:flex;align-items:center;justify-content:center;transition:transform .15s,opacity .3s;opacity:.55}
.nav:hover{opacity:1;transform:scale(1.08)}
#next{left:16px}#prev{right:16px}
#menuBtn{position:fixed;top:14px;right:14px;width:50px;height:50px;border-radius:14px;border:0;background:rgba(255,255,255,.6);font-size:26px;z-index:50;opacity:.45;transition:opacity .3s}
#menuBtn:hover{opacity:1}
#count{position:fixed;bottom:30px;left:92px;color:#fff;font-size:15px;opacity:.55;z-index:50;font-family:system-ui;direction:ltr;text-shadow:0 1px 3px #000}
/* menu */
#menu{position:fixed;inset:0;background:rgba(10,20,42,.82);backdrop-filter:blur(6px);z-index:100;display:none;overflow:auto;padding:30px}
#menu.on{display:block}
#menu .mbox{max-width:1180px;margin:0 auto;background:#fffaf0;border-radius:28px;padding:22px 30px 30px;border:5px solid var(--gold)}
#menu h2{margin:0 0 4px;font-size:34px}
#menu .msub{color:#5b6782;font-size:18px;margin-bottom:12px}
#menu .unit{margin:16px 0 8px;font-size:22px;font-weight:800;color:#2f7d5b}
#menu .lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
#menu .les{border:3px solid #e5d6b5;border-radius:18px;background:#fff;padding:10px 14px}
#menu .les b{display:block;font-size:21px;line-height:1.35;cursor:pointer}
#menu .les b:hover{color:#d6344f}
#menu .les .ps{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
#menu .les .ps button{border:2px solid #9cc9d3;background:#eef8fa;color:#226b7a;border-radius:12px;padding:2px 12px;font-size:16px;font-weight:700}
#menu .les.cur{border-color:#e8798a;background:#fff5f6}
#menu .tools{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
#menu .tools button{border:2px solid #d7b878;background:#fff;border-radius:14px;padding:6px 16px;font-size:18px;font-weight:700}
#note{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);max-width:900px;background:#fffbe6;border:2px solid #e3b45a;border-radius:14px;padding:10px 18px;font-size:18px;z-index:60;display:none;box-shadow:0 6px 20px rgba(0,0,0,.3)}
#note.on{display:block}
/* fx */
.shake{animation:shake .45s}
@keyframes shake{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
.pop{animation:pop .45s}
@keyframes pop{50%{transform:scale(1.08)}}
.okc{outline:6px solid var(--ok)!important;outline-offset:3px;background:#e4f7e9!important}
.noc{outline:6px solid var(--no)!important;outline-offset:3px;background:#fde8ea!important}
.fade{opacity:.35}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:90}
/* ---------- gate (cover / lock / enter) ---------- */
.gate{position:absolute;width:560px;height:560px;overflow:hidden;border-radius:40px 40px 0 0}
.gate .frame{position:absolute;inset:0;border-radius:40px 40px 0 0;background:linear-gradient(#d9dfea,#b9c3d6);border:6px solid #2b3a55}
.gate .sign{position:absolute;top:16px;left:16px;right:16px;height:96px;background:#1f2d4d;border-radius:18px;display:flex;align-items:center;justify-content:center;gap:16px;color:#fff;font-size:40px;font-weight:800}
.gate .sign .tag{background:#ffcb3d;color:#1f2d4d;border-radius:12px;padding:0 16px;font-size:44px}
.gate .door{position:absolute;top:128px;bottom:0;width:calc(50% - 22px);background:linear-gradient(135deg,#d6e8ff,#a5c4eb);border:5px solid #2b3a55;transition:transform 1.1s cubic-bezier(.6,.05,.3,1)}
.gate .door.l{left:22px;border-radius:8px 0 0 0}.gate .door.r{right:22px;border-radius:0 8px 0 0}
.gate.open .door.l{transform:translateX(-96%)}.gate.open .door.r{transform:translateX(96%)}
.gate .inside{position:absolute;top:128px;bottom:0;left:22px;right:22px;background:radial-gradient(circle at 50% 40%,#fff9d6,#ffe08a 60%,#ffc94a);display:flex;align-items:center;justify-content:center;text-align:center;font-size:44px;font-weight:800;padding:20px;overflow:hidden}
.gate .lock{position:absolute;top:50%;left:50%;width:150px;height:150px;margin:-40px 0 0 -75px;border-radius:50%;background:rgba(255,255,255,.4);border:6px solid #fff;display:flex;align-items:center;justify-content:center;font-size:80px;transition:transform .6s,opacity .6s;z-index:3}
.gate.open .lock{transform:translateY(-200px) rotate(-30deg);opacity:0}
.gate .tape{position:absolute;left:-20px;right:-20px;top:62%;height:40px;background:repeating-linear-gradient(-45deg,#e8414f 0 30px,#fff 30px 60px);border:4px solid #2b3a55;border-radius:6px;z-index:4;transition:transform .8s,opacity .8s}
.gate.open .tape{transform:translateY(300px) rotate(8deg);opacity:0}
.gate .chev{position:absolute;bottom:40px;font-size:60px;color:#ffcb3d;font-weight:900;z-index:2}
.carpet{position:absolute;bottom:0;height:140px;background:linear-gradient(#e94a5a,#c92f42);clip-path:polygon(18% 0,82% 0,100% 100%,0 100%)}
/* cover card */
.ttlcard{position:absolute;left:50%;top:400px;transform:translateX(-50%) scale(.6);opacity:0;transition:all .9s .5s cubic-bezier(.3,1.4,.5,1);width:820px;padding:40px 50px;text-align:center;background:#fff2f4;border:7px solid #e8798a;border-radius:46px;box-shadow:0 14px 0 rgba(0,0,0,.15);z-index:6}
.ttlcard.on{transform:translateX(-50%) scale(1);opacity:1}
.ttlcard .lbl{display:inline-block;background:#ffd8df;border-radius:18px;padding:2px 26px;font-size:36px;font-weight:700}
.ttlcard .t{font-size:84px;font-weight:800;line-height:1.25;margin-top:14px}
.ttlcard .u{font-size:28px;color:#5b6782;margin-top:6px}
.ttlcard .h{position:absolute;top:-58px;left:50%;transform:translateX(-50%);width:210px;height:60px;border:12px solid #2b3a55;border-bottom:0;border-radius:30px 30px 0 0}
/* goals tickets */
.ticket{position:absolute;left:50%;transform:translateX(-50%);width:1080px;min-height:150px;display:flex;align-items:stretch;border-radius:30px;border:5px solid;box-shadow:0 8px 0 rgba(0,0,0,.12);overflow:hidden;transition:opacity .5s,transform .5s}
.ticket .st{width:120px;flex:none;display:flex;align-items:center;justify-content:center;font-size:56px;color:#fff;border-left:4px dashed rgba(255,255,255,.7)}
.ticket .n{width:110px;flex:none;display:flex;align-items:center;justify-content:center;font-size:66px;font-weight:800;border-left:3px dashed rgba(0,0,0,.18)}
.ticket .tx{flex:1;display:flex;align-items:center;padding:12px 30px;font-size:42px;font-weight:700;line-height:1.4}
.ticket .ic{width:130px;flex:none;display:flex;align-items:center;justify-content:center;font-size:72px}
.ticket.hid{opacity:0;transform:translateX(-50%) translateY(30px)}
/* list rows (tf / enter) */
.row{display:flex;align-items:center;gap:18px;background:#fff6f7;border:5px solid #f0a9b4;border-radius:30px;padding:10px 20px;box-shadow:0 6px 0 rgba(0,0,0,.1);font-size:40px;font-weight:700;transition:transform .7s,opacity .7s}
.row .num{width:64px;height:64px;border-radius:50%;background:#e8414f;color:#fff;display:flex;align-items:center;justify-content:center;font-size:36px;flex:none;border:4px solid #fff;box-shadow:0 0 0 3px #e8414f}
.row .txt{flex:1;line-height:1.35}
.row .ico{font-size:52px}
.yn{display:flex;gap:10px}
.yn button{border:4px solid #2b3a55;border-radius:18px;font-size:30px;font-weight:800;padding:4px 16px;background:#fff}
.yn .y{background:#e3f6e8;border-color:#2fa35a;color:#1d7a40}.yn .n2{background:#fde6e8;border-color:#e05561;color:#b8283a}
.row.gone{transform:translateX(-640px) scale(.3);opacity:0}
/* sort */
.bin{position:absolute;border-radius:30px;border:5px solid;box-shadow:0 8px 0 rgba(0,0,0,.12);padding:12px}
.bin .bh{display:flex;align-items:center;justify-content:center;gap:12px;background:rgba(255,255,255,.75);border:3px dashed rgba(0,0,0,.2);border-radius:20px;font-size:40px;font-weight:800;padding:4px 10px}
.bin .bb{margin-top:10px;min-height:110px;border:3px dashed rgba(0,0,0,.25);border-radius:20px;display:flex;flex-wrap:wrap;gap:8px;padding:8px;align-content:flex-start}
.bin.hot{transform:scale(1.03)}
.dcard{background:#fff8ea;border:5px solid #e2b13c;border-radius:26px;padding:10px 18px;font-size:36px;font-weight:800;text-align:center;box-shadow:0 6px 0 rgba(0,0,0,.12);cursor:grab;touch-action:none;user-select:none;display:inline-flex;align-items:center;gap:10px}
.dcard .e{font-size:44px}
.dcard.sel{outline:6px solid #5fa8ff;outline-offset:3px}
.dcard.drag{position:fixed;z-index:200;pointer-events:none;transform:rotate(-3deg) scale(1.05)}
.bin .dcard{font-size:28px;padding:4px 12px;cursor:default;box-shadow:none}
.bin .dcard .e{font-size:32px}
/* concept cards */
.ccard{position:absolute;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:6px;padding:22px 26px;cursor:pointer;transition:transform .3s}
.ccard:hover{transform:translateY(-4px)}
.ccard .hd{font-size:46px;font-weight:800;line-height:1.3}
.ccard .bd{font-size:36px;font-weight:600;line-height:1.45;transition:opacity .4s,max-height .5s;overflow:hidden}
.ccard.closed .bd{opacity:0;max-height:0}
.ccard .q{font-size:24px;opacity:.6}
.ccard:not(.closed) .q{display:none}
/* picture */
.pic{position:absolute;background:#fff;border:6px solid #2b3a55;border-radius:22px;box-shadow:0 10px 0 rgba(0,0,0,.18);overflow:hidden;display:flex;align-items:center;justify-content:center}
.pic img{max-width:100%;max-height:100%;display:block}
.pin{position:absolute;width:62px;height:62px;margin:-31px 0 0 -31px;border-radius:50%;background:#e8414f;color:#fff;font-size:32px;font-weight:800;border:5px solid #fff;box-shadow:0 0 0 4px #e8414f,0 6px 12px rgba(0,0,0,.3);display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:3;animation:pulse 1.8s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 10px rgba(232,65,79,.35),0 6px 12px rgba(0,0,0,.3)}}
.pin.done{background:#2fa35a;box-shadow:0 0 0 4px #2fa35a;animation:none}
.plabel{position:absolute;background:#fffaf0;border:4px solid #e3b45a;border-radius:16px;padding:2px 14px;font-size:28px;font-weight:800;white-space:nowrap;z-index:4;transform:translate(-50%,40px);box-shadow:0 4px 0 rgba(0,0,0,.12)}
.qbub{position:absolute;background:#fff;border:5px solid #5fa8ff;border-radius:30px;padding:16px 26px;font-size:38px;font-weight:700;line-height:1.4;box-shadow:0 8px 0 rgba(0,0,0,.12)}
.qbub .ans{margin-top:10px;padding-top:10px;border-top:3px dashed #9cc4f5;color:#1d7a40;display:none}
.qbub.on .ans{display:block;animation:pop .4s}
.qbub .rv{display:inline-block;margin-top:8px;font-size:26px;border:3px solid #5fa8ff;background:#eaf3ff;color:#2a5ea8;border-radius:14px;padding:0 16px}
.qbub.on .rv{display:none}
/* steps */
.steps{position:absolute;display:flex;flex-direction:column;gap:14px}
.step{display:flex;align-items:center;gap:16px;background:#fff;border:5px solid #9cc4f5;border-radius:26px;padding:10px 20px;font-size:36px;font-weight:700;line-height:1.35;box-shadow:0 6px 0 rgba(0,0,0,.1);transition:opacity .4s,transform .4s}
.step .sn{width:58px;height:58px;flex:none;border-radius:50%;background:#5fa8ff;color:#fff;display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:800}
.step.hid{opacity:0;transform:translateY(16px)}
/* mcq */
.opts{position:absolute;display:grid;grid-template-columns:1fr 1fr;gap:22px}
.opt{display:flex;align-items:center;gap:16px;border:5px solid #2b3a55;border-radius:28px;padding:16px 22px;font-size:40px;font-weight:800;color:#fff;text-align:start;box-shadow:0 8px 0 rgba(0,0,0,.2);min-height:120px;line-height:1.3}
.opt .sh{font-size:40px;width:60px;flex:none;text-align:center;opacity:.9}
.opt.o0{background:#e8586a}.opt.o1{background:#4f8fdf}.opt.o2{background:#e7a92d}.opt.o3{background:#3fa66a}
.opt.okc{background:#2fa35a!important;color:#fff;outline-color:#fff}
.opt.noc{background:#9aa3b5!important;color:#fff}
.opt.dim{opacity:.35}
.qcard{position:absolute;left:50%;transform:translateX(-50%);background:#fff;border:6px solid #2b3a55;border-radius:34px;padding:22px 34px;text-align:center;font-size:48px;font-weight:800;line-height:1.4;box-shadow:0 10px 0 rgba(0,0,0,.15)}
.why{position:absolute;left:50%;transform:translateX(-50%);background:#e8f8ee;border:4px solid #2fa35a;border-radius:22px;padding:8px 24px;font-size:30px;font-weight:700;color:#1d6b3a;display:none;max-width:1300px;text-align:center}
.why.on{display:block;animation:pop .4s}
/* tf */
.tfbtn{width:96px;height:80px;border-radius:22px;border:5px solid #2b3a55;font-size:46px;font-weight:900;background:#fff}
.tfbtn.t{color:#1d7a40}.tfbtn.f{color:#c22d40}
/* match */
.mcol{position:absolute;display:flex;flex-direction:column;gap:16px}
.mitem{background:#fff;border:5px solid #9cc4f5;border-radius:24px;padding:10px 18px;font-size:34px;font-weight:800;text-align:center;box-shadow:0 6px 0 rgba(0,0,0,.1);min-height:84px;display:flex;align-items:center;justify-content:center;line-height:1.3}
.mitem.sel{outline:6px solid #ffb703;outline-offset:3px}
.mitem.m0{background:#ffe1e5;border-color:#e8798a}.mitem.m1{background:#dcecff;border-color:#6aa2e8}.mitem.m2{background:#fff1c9;border-color:#e2b13c}.mitem.m3{background:#dff3e0;border-color:#5fb873}.mitem.m4{background:#ece4ff;border-color:#9b84e6}.mitem.m5{background:#ffe6d5;border-color:#f0965f}
svg.lines{position:absolute;inset:0;pointer-events:none;z-index:1}
/* order */
.olist{position:absolute;display:flex;flex-direction:column;gap:14px}
.oitem{display:flex;align-items:center;gap:16px;background:#fff;border:5px solid #c9b6f2;border-radius:24px;padding:8px 18px;font-size:36px;font-weight:700;box-shadow:0 6px 0 rgba(0,0,0,.1);cursor:pointer;line-height:1.3}
.oitem .on{width:56px;height:56px;flex:none;border-radius:16px;background:#9b84e6;color:#fff;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:800}
.oitem.sel{outline:6px solid #ffb703;outline-offset:3px}
.chk{position:absolute;left:50%;transform:translateX(-50%);border:5px solid #2b3a55;background:#ffcb3d;border-radius:22px;padding:6px 40px;font-size:36px;font-weight:800;box-shadow:0 6px 0 rgba(0,0,0,.2)}
/* fill */
.ftext{position:absolute;left:50%;transform:translateX(-50%);background:#fff;border:6px solid #2b3a55;border-radius:30px;padding:26px 36px;font-size:46px;font-weight:700;line-height:2;text-align:center;box-shadow:0 10px 0 rgba(0,0,0,.15)}
.blank{display:inline-block;min-width:200px;border-bottom:5px dashed #5fa8ff;color:#2a5ea8;text-align:center;padding:0 10px;cursor:pointer;line-height:1.4}
.blank.okc{border-bottom-color:#2fa35a;outline:0!important;background:none!important;color:#1d7a40}
.bank{position:absolute;left:50%;transform:translateX(-50%);display:flex;flex-wrap:wrap;gap:16px;justify-content:center}
.chip{background:#fff1c9;border:5px solid #e2b13c;border-radius:22px;padding:6px 22px;font-size:36px;font-weight:800;box-shadow:0 6px 0 rgba(0,0,0,.12)}
.chip.sel{outline:6px solid #5fa8ff;outline-offset:3px}
.chip.used{opacity:.3;pointer-events:none}
/* memory */
.mem{position:absolute;display:grid;gap:18px}
.mcard{perspective:900px;cursor:pointer}
.mcard .in{position:relative;width:100%;height:100%;transition:transform .6s;transform-style:preserve-3d}
.mcard.f .in,.mcard.done .in{transform:rotateY(180deg)}
.mcard .fr,.mcard .bk{position:absolute;inset:0;backface-visibility:hidden;border-radius:24px;border:5px solid #2b3a55;display:flex;align-items:center;justify-content:center;text-align:center;padding:8px;box-shadow:0 6px 0 rgba(0,0,0,.15)}
.mcard .fr{background:repeating-linear-gradient(45deg,#5fa8ff 0 18px,#79b8ff 18px 36px);font-size:60px;color:#fff}
.mcard .bk{background:#fff;transform:rotateY(180deg);font-size:30px;font-weight:800;line-height:1.3}
.mcard.done .bk{background:#e3f6e8;border-color:#2fa35a}
/* wheel */
.wheelw{position:absolute;width:600px;height:600px}
.wheel{width:100%;height:100%;border-radius:50%;border:10px solid #2b3a55;transition:transform 4s cubic-bezier(.15,.85,.25,1);box-shadow:0 12px 0 rgba(0,0,0,.18)}
.wptr{position:absolute;top:-24px;left:50%;margin-left:-28px;width:0;height:0;border-left:28px solid transparent;border-right:28px solid transparent;border-top:60px solid #e8414f;z-index:3;filter:drop-shadow(0 4px 0 rgba(0,0,0,.25))}
.whub{position:absolute;top:50%;left:50%;width:120px;height:120px;margin:-60px;border-radius:50%;background:#ffcb3d;border:8px solid #2b3a55;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:900;cursor:pointer;z-index:2}
/* race */
.track{position:absolute;left:60px;right:60px;display:flex;flex-direction:column;gap:12px}
.lane{position:relative;height:78px;border-radius:40px;background:#fff;border:5px solid #2b3a55;overflow:hidden;cursor:pointer}
.lane .fill{position:absolute;top:0;bottom:0;right:0;transition:width .8s}
.lane .car{position:absolute;top:50%;transform:translate(50%,-50%) scaleX(-1);font-size:56px;transition:right .8s}
.lane .nm{position:absolute;top:50%;right:20px;transform:translateY(-50%);font-size:28px;font-weight:800;z-index:2;mix-blend-mode:multiply}
.lane .fin{position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:46px}
.lane.turn{outline:6px solid #ffb703;outline-offset:3px}
/* boxes */
.boxes{position:absolute;display:grid;gap:22px}
.gbox{position:relative;border-radius:26px;border:5px solid #2b3a55;box-shadow:0 8px 0 rgba(0,0,0,.18);cursor:pointer;display:flex;align-items:center;justify-content:center;text-align:center;padding:12px;font-size:32px;font-weight:800;line-height:1.35;transition:transform .3s}
.gbox .lid{position:absolute;inset:0;border-radius:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:64px;transition:transform .6s,opacity .6s;z-index:2}
.gbox .lid small{font-size:34px;color:#fff;font-weight:800}
.gbox.open .lid{transform:translateY(-60px) rotate(-12deg);opacity:0;pointer-events:none}
.gbox .a{display:none;color:#1d7a40;margin-top:6px}
.gbox.ans .a{display:block}
/* mind map */
.mm{position:absolute;inset:0}
.mm .center{position:absolute;left:50%;top:520px;transform:translate(-50%,-50%);width:360px;min-height:150px;border-radius:50%;background:#ffcb3d;border:7px solid #2b3a55;display:flex;align-items:center;justify-content:center;text-align:center;font-size:44px;font-weight:900;padding:20px;box-shadow:0 10px 0 rgba(0,0,0,.18);z-index:2}
.mm .br{position:absolute;transform:translate(-50%,-50%);width:400px;padding:14px 18px;font-size:32px;font-weight:700;text-align:center;line-height:1.35;cursor:pointer;z-index:2}
.mm .br.closed{color:transparent}
.mm .br.closed:after{content:"؟";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#2b3a55;font-size:54px}
/* compare */
.cmp{position:absolute;display:flex;gap:30px}
.cmp .side{flex:1;padding:20px 26px}
.cmp .side h3{margin:0 0 10px;font-size:44px;text-align:center}
.cmp .side li{font-size:34px;font-weight:700;line-height:1.5;margin:6px 0;list-style:none;transition:opacity .4s}
.cmp .side li.hid{opacity:0}
.cmp .side li:before{content:"◆ ";color:rgba(0,0,0,.35)}
/* flip */
.flips{position:absolute;display:grid;gap:26px}
.flip{perspective:1000px;cursor:pointer}
.flip .in{position:relative;width:100%;height:100%;transition:transform .7s;transform-style:preserve-3d}
.flip.f .in{transform:rotateY(180deg)}
.flip .fr,.flip .bk{position:absolute;inset:0;backface-visibility:hidden;border-radius:30px;border:6px solid;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:16px;box-shadow:0 8px 0 rgba(0,0,0,.14)}
.flip .fr .e{font-size:84px}.flip .fr .t{font-size:44px;font-weight:900;line-height:1.25}.flip .fr .en2{font-size:30px;color:#3b4f72;font-weight:700;direction:ltr}
.flip .bk{transform:rotateY(180deg);background:#fff;font-size:34px;font-weight:700;line-height:1.45}
/* timer (try) */
.timer{position:absolute;width:250px;height:250px}
.timer svg{width:100%;height:100%;transform:rotate(-90deg)}
.timer .tv{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:62px;font-weight:900}
.timer .tv small{font-size:22px}
.timer button{position:absolute;bottom:-62px;left:50%;transform:translateX(-50%);border:4px solid #2b3a55;border-radius:16px;background:#ffcb3d;font-size:26px;font-weight:800;padding:2px 22px;white-space:nowrap}
/* exit ticket */
.exit{position:absolute;display:flex;gap:26px}
.exit .xc{flex:1;padding:22px;text-align:center;cursor:pointer}
.exit .xc .k{font-size:90px;font-weight:900;line-height:1}
.exit .xc .p{font-size:34px;font-weight:800;line-height:1.4;margin-top:8px}
/* homework */
.hwc{position:absolute;left:50%;transform:translateX(-50%) rotate(-1deg);width:1080px;background:#fffef6;border:6px solid #2b3a55;border-radius:20px;padding:30px 50px 34px;box-shadow:0 12px 0 rgba(0,0,0,.18);background-image:repeating-linear-gradient(transparent 0 62px,#cfe3f3 62px 64px)}
.hwc h3{margin:0 0 6px;font-size:50px;color:#d6344f}
.hwc li{font-size:38px;font-weight:700;line-height:64px}
.hwc .pin2{position:absolute;top:-28px;left:50%;font-size:56px;transform:translateX(-50%)}
.mascot{position:absolute;width:300px;height:300px;pointer-events:none}
.mascot svg{width:100%;height:100%;overflow:visible}
.say{position:absolute;background:#fff;border:5px solid #2b3a55;border-radius:28px;padding:10px 22px;font-size:32px;font-weight:800;line-height:1.35;box-shadow:0 6px 0 rgba(0,0,0,.14)}
.periodcard{position:absolute;left:50%;top:210px;transform:translateX(-50%);width:1000px;text-align:center;padding:36px}
.periodcard .pn{font-size:100px;font-weight:900;color:#d6344f;line-height:1.1}
.periodcard .ax{font-size:44px;font-weight:800;margin-top:12px;line-height:1.35}

/* live web editor (R.web, G10) */
.webed,.webpv{position:absolute;border-radius:22px;overflow:hidden;box-shadow:0 10px 0 rgba(0,0,0,.14);display:flex;flex-direction:column;z-index:4}
.webed{background:#1f2433;border:5px solid #3b4566}
.webpv{background:#fff;border:5px solid var(--gold);transition:all .35s}
.webpv.big{left:50px!important;width:1500px!important;z-index:9}
.webed .bar,.webpv .bar{display:flex;align-items:center;gap:14px;padding:8px 16px;font-size:24px;font-weight:700}
.webed .bar{background:#2c3349;color:#c9d3f0}.webpv .bar{background:#f2ece0;color:#5b6782}
.webed .dots i{display:inline-block;width:14px;height:14px;border-radius:50%;margin-left:6px;background:#ff6b6b}.webed .dots i:nth-child(2){background:#ffd166}.webed .dots i:nth-child(3){background:#6ccf8e}
.webed .fn{direction:ltr;font-family:Consolas,'Courier New',monospace;color:#ffd166}.webed .lb,.webpv .lb{margin-inline-start:auto;white-space:nowrap}
.webpv .url{flex:1;direction:ltr;text-align:left;background:#fff;border-radius:14px;padding:2px 14px;font-size:20px;font-family:Consolas,'Courier New',monospace;color:#3b4566;overflow:hidden;white-space:nowrap}
.webed textarea{flex:1;width:100%;border:0;outline:0;resize:none;background:transparent;color:#e8edff;caret-color:#ffd166;font:600 25px/1.45 Consolas,'Courier New',monospace;padding:14px 18px;direction:ltr;text-align:left;white-space:pre;tab-size:2}
.webpv iframe{flex:1;width:100%;border:0;background:#fff}
.webbt{position:absolute;display:flex;gap:14px;z-index:5}
.webbt button{font:700 24px 'Baloo Bhaijaan 2',sans-serif;padding:4px 22px;border-radius:18px;border:4px solid #3b4566;background:#fffaf0;color:#2c3349;cursor:pointer;box-shadow:0 5px 0 rgba(0,0,0,.12)}
.webbt button.sol{border-color:#e2b13c;background:#fff4d6}
/* ===== deck2 additions ===== */
.dots{position:absolute;bottom:22px;left:50%;transform:translateX(-50%);display:flex;gap:12px;z-index:6}
.dots i{width:22px;height:22px;border-radius:50%;background:#fff;border:4px solid #2b3a55;transition:.3s}
.dots i.c{background:#ffcb3d;transform:scale(1.35)}
.dots i.d{background:#6ccf8e}
.qn{font-size:24px;color:#5b6782;font-weight:700;margin-bottom:4px}
.askb{min-height:260px;line-height:1.45;padding:26px 40px;display:flex;flex-direction:column;justify-content:center}
.askb .ans{font-size:.9em}
.blank.qb{display:inline-block;min-width:150px;border-bottom:6px solid #e2b13c;color:#c0902c;padding:0 14px;margin:0 6px}
.blank.qb.okc{color:#1d7a40;border-color:#2fa35a;background:#e9fbef;border-radius:12px}
.readc{position:absolute;background:#fffdf6;border:5px solid #e2b13c;border-radius:30px;padding:24px 40px 24px;box-shadow:0 8px 0 rgba(0,0,0,.12);line-height:1.7;font-weight:600;max-height:690px;overflow:hidden}
.readc p{margin:0 0 12px;transition:opacity .4s,background .4s;border-radius:14px;padding:2px 10px}
.readc p.dim2{opacity:.28}
.readc p.cur{background:#fff3c4}
.readc.listen p.dim2{opacity:1;filter:blur(9px)}
.readc.quran{font-family:'Amiri','Noto Naskh Arabic',serif;line-height:2}

itle": "About us (1)", "paras": ["Egyptian food [[tastes like]] Spanish food and Omani food smells [[delicious]]! I want to cook more this year, but I need to get some help. Perhaps my mum will help me.", "Profile 2: I'm twelve and I have short dark hair and brown eyes. I usually wear an Omani hat and dishdasha. I often go camping outdoors with my family."], "img": "L02_c1", "icon": "📖"}, {"type": "read", "title": "About us (1)", "paras": ["I haven't been camping anywhere [[dangerous]], but I know you should always take a [[first-aid kit]] when you camp outdoors. We learned about first aid at school and now everyone in my class knows what to do when someone cuts their finger. I love learning about technology, and I love football, too!"], "img": "L02_c1", "icon": "📖"}, {"type": "read", "title": "About us (2)", "paras": ["Profile 3: I'm twelve, too, and I have black hair and brown eyes. I like wearing a hijab and [[casual]] clothes. I often go camping, too! I've been camping twice before but we didn't take the right things."], "img": "L02_c1", "icon": "📖"}, {"type": "read", "title": "About us (2)", "paras": ["My sleeping mat was too [[uncomfortable]] and we didn't take enough food. Everyone says that camping outside makes them happy. I love animals and I want to see some when I go camping again. Next time, we'll take everything that we need!"], "img": "L02_c1", "icon": "📖"}, {"type": "read", "title": "About us (2)", "paras": ["Profile 4: I'm twelve and I have long brown hair and blue eyes. I love reading! At the moment I'm reading about why we wear different clothes. I like wearing comfortable clothes."], "img": "L02_c1", "icon": "📖"}, {"type": "read", "title": "About us (2)", "paras": ["In summer, I like wearing a [[checked]] dress. It's smart and it's made of [[cotton]]. I love my long coat, too, but it's not usually cold enough in Oman to wear it! At the weekend, I usually wear casual clothes, but I like to look smart, too."], "img": "L02_c1", "icon": "📖"}, {"type"  weekend she usually wears casual clothes."}], "icon": "✅"}, {"type": "explain", "title": "Grade 6 grammar we used", "icon": "🔁", "lines": ["The profiles use many tenses from Grade 6:", "Present simple for habits · Present perfect for experiences · Present continuous for now · will for the future."], "rule": "Look at the time words: often · at the moment · next time · before"}, {"type": "flip", "title": "Grade 6 grammar we used 🔁 – examples", "cards": [{"front": "I [[often go]] camping with my family.", "icon": "💡", "back": "habit"}, {"front": "I[['ve travelled]] a lot.", "icon": "✨", "back": "experience"}, {"front": "At the moment I[['m reading]] about clothes.", "icon": "🔎", "back": "now"}, {"front": "Next time, we[['ll take]] everything.", "icon": "📌", "back": "future"}]}, {"type": "flip", "title": "Grade 6 words (1)", "cards": [{"front": "empty the bin", "icon": "🗑️", "back": "a job at home\n«I empty the bin every day.»"}, {"front": "chop", "icon": "🔪", "back": "cut food into small pieces\n«Chop the onions.»"}, {"front": "striped", "icon": "🦓", "back": "with lines\n«He's wearing a striped shirt.»"}, {"front": "bracelet", "icon": "📿", "back": "jewellery for your wrist\n«My sister has a gold bracelet.»"}, {"front": "compass", "icon": "🧭", "back": "it shows north, south, east and west\n«Take a compass when you go camping.»"}, {"front": "hurt your ankle", "icon": "🦶", "back": "an injury to your leg near the foot\n«He fell over and hurt his ankle.»"}], "icon": "🔤"}, {"type": "sort", "title": "Complete the table", "bins": [{"label": "Jobs at home", "icon": "🏠"}, {"label": "Food and drink", "icon": "🍽️"}, {"label": "Describing clothes", "icon": "👕"}], "cards": [{"text": "sweep the floor", "icon": "", "bin": 0}, {"text": "tidy up", "icon": "", "bin": 0}, {"text": "vacuum the carpet", "icon": "", "bin": 0}, {"text": "fry", "icon": "", "bin": 1}, {"text": "milk", "icon": "", "bin": 1}, {"text": "pepper", "icon": "", "bin": 1}, {"text": "baggy", "icon": "", "bin": 2}, {"te ays take with you when you camp outdoors?", "a": "A first-aid kit."}, {"q": "Bayan says Egyptian food ___ like Spanish food.", "a": "tastes"}, {"q": "Razan wants to find out what you call different names / parts of animals.", "a": "parts"}], "img": "L02_c5", "icon": "🛤️"}, {"type": "race", "title": "Team race", "qs": [{"q": "Frank is … years old.", "options": ["twelve", "thirteen", "eleven"], "a": 1}, {"q": "Majid usually wears …", "options": ["a hijab", "an Omani hat and dishdasha", "a checked dress"], "a": 1}, {"q": "Bayan's sleeping mat was …", "options": ["comfortable", "uncomfortable", "new"], "a": 1}, {"q": "Emily's checked dress is made of …", "options": ["cotton", "wool", "leather"], "a": 0}, {"q": "Which is outdoor equipment?", "options": ["pepper", "rucksack", "tie"], "a": 1}, {"q": "Which is a job at home?", "options": ["vacuum the carpet", "fry", "plain"], "a": 0}, {"q": "Omani food smells …", "options": ["delicious", "dangerous", "casual"], "a": 0}], "icon": "🏎️"}, {"type": "steps", "title": "Let's remember!", "icon": "🧠", "steps": ["Frank – travel and food · Majid – camping and first aid · Bayan – camping and animals · Emily – reading and clothes.", "Describing people: He/She has … hair and … eyes. He/She likes wearing …", "Grade 6 topics: jobs at home, food, clothes, outdoor equipment, injuries.", "Guessing: Is it …? – Yes! / No, it isn't."]}, {"type": "exit", "title": "Exit ticket", "items": [{"k": "3", "text": "Describe one member of the WOW! Team."}, {"k": "2", "text": "Name two pieces of outdoor equipment."}, {"k": "1", "text": "What are you interested in? Why?"}], "icon": "🎟️"}, {"type": "homework", "title": "Homework", "head": "My homework", "items": ["Activity Book p. 9 (Activities 1–2).", "Write a short 'About me' profile (4–5 sentences).", "Progress path: Class Book p. 100 / Activity Book p. 70 (Welcome)."], "icon": "🏠"}]}, {"id": "L03", "unit": "U2", "unitName": "Unit 1: Entertainment", "title": "Vocabulary: Jobs in entertainment", "code": "", "theme": "city", "emo": "🎭", "slides": [{"type": "cover", "say": "Unit 1 – jobs in entertainment"}, {"type": "goals", "title": "Today's goals", "items": ["I can name 12 jobs in entertainment.", "I can describe what people in these jobs do."], "icon": "🎯"}, {"type": "goals", "title": "Today's goals", "items": ["I can read a blog about a talent show.", "I can play a guessing game about jobs."], "icon": "🎯"}, {"type": "ask", "title": "WOW! Question", "qs": [{"q": "Majid asks: How can people and places entertain us?", "a": "They make us laugh, they show us amazing things, we learn new things, we have fun with our family …"}, {"q": "Have you ever seen actors, singers or clowns at the theatre, the cinema or the stadium?", "a": "Yes, I have. I saw a clown at …"}, {"q": "Which entertainment places can you see in the photos?", "a": "a theatre, a museum, an aquarium, a circus, a theme park, a cinema, a stadium …"}], "img": "L03_c1", "icon": "🤔"}, {"type": "mystery", "title": "What's in the picture?", "img": "L03_c2", "answer": "12 jobs in entertainment! 🎬", "qs": [{"q": "A person who makes people laugh:", "o": ["a comedian", "a writer"], "a": 0}, {"q": "He wears a red nose and big shoes:", "o": ["a presenter", "a clown"], "a": 1}, {"q": "She writes books and stories:", "o": ["a writer", "an animator"], "a": 0}, {"q": "He films with a camera:", "o": ["a sound editor", "a camera operator"], "a": 1}], "icon": "🕵️"}, {"type": "flip", "title": "Jobs in entertainment (1)", "cards": [{"front": "comedian", "icon": "🎤😂", "back": "tells jokes and makes people laugh\n«The comedian made everyone laugh. (photo 1)»"}, {"front": "animator", "icon": "✏️🎞️", "back": "draws pictures that move for cartoons\n«An animator makes cartoons. (photo 2)»"}, {"front": "writer", "icon": "✍️", "back": "writes books, stories or plays\n«My favourite writer wrote a mystery. (photo 3)»"}, {"front": "camera operator", "icon": "🎥", "back": "films with a camera\n«The camera operator films the show. (photo 4)»"}, {"front": "presenter", "icon": "📺", "back": "talks to the audience on TV or on stage\n«Emily wants to be the presenter. (photo 5)»"}, {"front": "clown", "icon": "🤡", "back": "wears a wig, a red nose and big shoes\n«Frank is the clown. (photo 6)»"}], "icon": "🔤"}, {"type": "flip", "title": "Jobs in entertainment (2)", "cards": [{"front": "sound editor", "icon": "🎚️🎧", "back": "works with the sounds and music of a film\n«The sound editor adds music. (photo 7)»"}, {"front": "performer", "icon": "🤹", "back": "does a show for people: sings, dances, juggles\n«The performer is juggling on a unicycle. (photo 8)»"}, {"front": "puppeteer", "icon": "🧸🖐️", "back": "makes puppets move\n«Frank is a puppeteer, too. (photo 9)»"}, {"front": "stunt performer", "icon": "🏍️💥", "back": "does dangerous things in films\n«The stunt performer jumped on a motorbike. (photo 10)»"}, {"front": "costume designer", "icon": "👗✂️", "back": "designs and makes clothes for a show\n«Bayan is the costume designer. (photo 11)»"}, {"front": "make-up artist", "icon": "💄🎨", "back": "puts make-up on actors' faces\n«The make-up artist painted my face. (photo 12)»"}], "icon": "🔤"}, {"type": "match", "title": "Look and match (1–6)", "pairs": [["Photo 1", "comedian 🎤"], ["Photo 2", "animator ✏️"], ["Photo 3", "writer ✍️"]], "icon": "🧩"}, {"type": "match", "title": "Look and match (1–6)", "pairs": [["Photo 4", "camera operator 🎥"], ["Photo 5", "presenter 📺"], ["Photo 6", "clown 🤡"]], "icon": "🧩"}, {"type": "match", "title": "Look and match (7–12)", "pairs": [["Photo 7", "sound editor 🎧"], ["Photo 8", "performer 🤹"], ["Photo 9", "puppeteer 🧸"]], "icon": "🧩"}, {"type": "match", "title": "Look and match (7–12)", "pairs": [["Photo 10", "stunt performer 🏍️"], ["Photo 11", "costume designer 👗"], ["Photo 12", "make-up artist 💄"]], "icon": "🧩"}, {"type": "build", "title": "Spell the job", "mode": "letters", "items": [{"a": "clown", "hint": "a red nose and big shoes", "emo": "🤡"}, {"a": "writer", "hint": "writes books", "emo": "✍️"}, {"a": "presenter", "hint": "talks on TV", "emo": "📺"}, {"a": "animator", "hint": "makes cartoons", "emo": "🎞️"}, {"a": "puppeteer", "hint": "makes puppets move", "emo": "🧸"}], "icon": "🔤"}, {"type": "read", "title": "WOW! Blog: the Talent Show", "paras": ["Majid: Are you a comedian, a costume designer, a clown or a writer? We're looking for people to help with the WOW! [[Talent Show]]. Emily wants to be the presenter. She's good at talking to the [[audience]]!"], "img": "L03_c3", "icon": "📖"}, {"type": "read", "title": "WOW! Blog: the Talent Show", "paras": ["Bayan is going to be the costume designer. She's going to design some amazing [[costumes]] for us. That will be interesting!", "As for Frank, he's the clown, of course! He's going to wear a curly [[wig]], a red nose and big shoes. He's a puppeteer, too, and he's great with puppets. He'll really make you laugh!"], "img": "L03_c3", "icon": "📖"}, {"type": "read", "title": "WOW! Blog: the Talent Show", "paras": ["I love technology, so I'll be the camera operator. I'm going to video the show and [[upload]] it to the school website so everyone can watch it. What about you? What's your talent?"], "img": "L03_c3", "icon": "📖"}, {"type": "match", "title": "Who is going to do what?", "pairs": [["Emily", "the presenter 📺"], ["Bayan", "the costume designer 👗"], ["Frank", "the clown (and puppeteer) 🤡"], ["Majid", "the camera operator 🎥"]], "icon": "🎬"}, {"type": "sort", "title": "On a stage or not?", "bins": [{"label": "on a stage", "icon": "🎭"}, {"label": "not on a stage", "icon": "🚫"}], "cards": [{"text": "writer", "icon": "", "bin": 1}, {"text": "performer", "icon": "", "bin": 0}, {"text": "presenter", "icon": "", "bin": 0}, {"text": "puppeteer", "icon": "", "bin": 0}, {"text": "sound editor", "icon": "", "bin": 1}, {"text": "make-up artist", "icon": "", "bin": 1}, {"text": "camera operator", "icon": "", "bin": 1}, {"text": "costume designer", "icon": "", "bin": 1}, {"text": "animator", "icon": "", "bin" age.", "He or she draws pictures.", "The pictures move in cartoons."], "a": "an animator", "emo": "🎞️"}, {"clues": ["This person works before the show.", "She paints actors' faces.", "She can make you look like a lion!"], "a": "a make-up artist", "emo": "💄"}, {"clues": ["This person is very fit and brave.", "He jumps from cars and motorbikes.", "He works in films."], "a": "a stunt performer", "emo": "🏍️"}], "icon": "🤔"}, {"type": "ask", "title": "Your turn: describe a job", "qs": [{"q": "What does a bus driver do?", "a": "A bus driver drives a bus and takes people to places."}, {"q": "What does a chef do?", "a": "A chef cooks food in a restaurant."}, {"q": "What does a vet do?", "a": "A vet helps sick animals."}, {"q": "Which entertainment job would you like? Why?", "a": "I'd like to be a camera operator because I love technology."}], "img": "L03_c4", "icon": "🗣️"}, {"type": "race", "title": "Jobs race", "qs": [{"q": "He makes people laugh with jokes:", "options": ["comedian", "writer", "animator"], "a": 0}, {"q": "She designs clothes for a show:", "options": ["make-up artist", "costume designer", "presenter"], "a": 1}, {"q": "Majid is going to be the …", "options": ["camera operator", "clown", "presenter"], "a": 0}, {"q": "Emily is good at talking to the …", "options": ["puppets", "audience", "camera"], "a": 1}, {"q": "A puppeteer ___ with puppets.", "options": ["work", "works", "working"], "a": 1}, {"q": "Frank is going to wear a curly …", "options": ["wig", "hat", "hijab"], "a": 0}, {"q": "Which job is NOT on a stage?", "options": ["clown", "sound editor", "comedian"], "a": 1}], "icon": "🏎️"}, {"type": "steps", "title": "Let's remember!", "icon": "🧠", "steps": ["12 jobs: presenter, performer, comedian, clown, puppeteer, sound editor, stunt performer, animator, writer, costume designer, make-up artist, camera operator.", "Describe a job: A comedian makes people laugh.", "Talent Show: Emily – presenter, Bayan – costume designer, Frank – clown, Majid – camera operat but there were so many paintings and I was a bit tired. We're spending the afternoon at the aquarium and this evening we're going to the cinema."], "img": "L06_c1", "icon": "📖"}, {"type": "read", "title": "My Muscat diary (2)", "paras": ["Monday 31st December. 9 p.m. Oops! I didn't write my diary last night. I was too tired and we've only been here for two days! The aquarium was fantastic yesterday! I loved the turtles. Today, we went to the National Museum and a [[planetarium]]. We learned a lot about the planets!"], "img": "L06_c2", "icon": "📖"}, {"type": "read", "title": "My Muscat diary (2)", "paras": ["We aren't going out tonight because we're shopping at Muscat's biggest shopping mall tomorrow and we don't want to be tired. Then we're having lunch. In the evening, we're watching a show at the Royal Opera House. Dad has had the tickets since September! Mum has wanted to see a show there for years. She's so excited."], "img": "L06_c2", "icon": "📖"}, {"type": "read", "title": "My Muscat diary (2)", "paras": ["Tuesday 1st January. Midnight. We're so tired today! We loved shopping in the big mall! And this evening, it was so dark and comfortable in the Royal Opera House. The show was great. We took a taxi back to the hotel. Suddenly, I heard my little sister [[snoring]]! I was so [[embarrassed]]. Then my little brother joined in! They were both sleeping all the way back! We're flying home to Khasab tomorrow … and I think I'll be asleep on the plane!"], "img": "L06_c2", "icon": "📖"}, {"type": "ask", "title": "Answer the questions", "qs": [{"q": "Why did the family go to Muscat?", "a": "For their holiday."}, {"q": "Which evening did they go to the Royal Opera House?", "a": "On Tuesday evening (1st January)."}, {"q": "How long has Dad had the tickets?", "a": "Since September."}, {"q": "Where is the family's home?", "a": "In Khasab."}], "img": "L06_c2", "icon": "💭"}, {"type": "order", "title": "Number the places in order", "items": ["Al-Qurum park 🌳", "the art gallery ghtseeing.", "icon": "💡", "back": "how I feel"}, {"front": "I think sightseeing is [[tiring]].", "icon": "✨", "back": "the thing"}, {"front": "Mum is so [[excited]]. The show is [[exciting]].", "icon": "🔎", "back": "feel / thing"}]}, {"type": "quiz", "title": "Circle the correct word", "icon": "✏️", "qs": [{"q": "Travelling long distances can be quite ___.", "o": ["tired", "tiring"], "a": 1}, {"q": "We were ___ by the circus performers.", "o": ["amazed", "amazing"], "a": 0}, {"q": "My sister thinks art galleries are ___.", "o": ["interested", "interesting"], "a": 1}, {"q": "I'm not very ___ about our trip to London.", "o": ["excited", "exciting"], "a": 0}, {"q": "I felt ___ when I fell down.", "o": ["embarrassed", "embarrassing"], "a": 0}, {"q": "We thought the theatre show was ___.", "o": ["bored", "boring"], "a": 1}]}, {"type": "sort", "title": "Feelings or things?", "bins": [{"label": "how we feel (-ed)", "icon": "😊"}, {"label": "the thing (-ing)", "icon": "🎢"}], "cards": [{"text": "tired", "icon": "", "bin": 0}, {"text": "amazing", "icon": "", "bin": 1}, {"text": "bored", "icon": "", "bin": 0}, {"text": "interesting", "icon": "", "bin": 1}, {"text": "excited", "icon": "", "bin": 0}, {"text": "embarrassing", "icon": "", "bin": 1}, {"text": "amazed", "icon": "", "bin": 0}, {"text": "tiring", "icon": "", "bin": 1}], "icon": "🗂️"}, {"type": "build", "title": "Places in the diary", "mode": "letters", "items": [{"a": "aquarium", "hint": "they loved the turtles here", "emo": "🐢"}, {"a": "museum", "hint": "the National …", "emo": "🏛️"}, {"a": "planetarium", "hint": "they learned about the planets", "emo": "🪐"}, {"a": "cinema", "hint": "Sunday evening", "emo": "🎬"}, {"a": "mall", "hint": "Muscat's biggest shopping …", "emo": "🛍️"}], "icon": "🔤"}, {"type": "write", "title": "An exciting day in a city", "task": "In groups, write a diary page about an exciting day in a city. Read it to the class.", "steps": ["Start with the day, date and time.", "Write in the first person: I, we, my.", "Say where you went and what you saw.", "Use -ed and -ing adjectives: tired, amazing, exciting.", "Say what you're doing tomorrow."], "words": ["We arrived in …", "Today, we went to …", "It was amazing!", "I was so excited", "Tomorrow we're visiting …", "Goodnight!"], "model": "Thursday 5th March. 8 p.m. We arrived in Salalah this morning! First, we went to the beach. It was amazing! Then we visited a museum. It was interesting, but I was a bit tired. Tomorrow we're visiting the mountains. Goodnight!", "icon": "✍️"}, {"type": "balloons", "title": "Pop the answer!", "rounds": [{"q": "The family arrived in Muscat on …", "o": ["Saturday", "Sunday", "Monday"], "a": 0}, {"q": "At the aquarium, the writer loved the …", "o": ["sharks", "turtles", "fish"], "a": 1}, {"q": "Dad has had the tickets since …", "o": ["January", "September", "Saturday"], "a": 1}], "icon": "🎈"}, {"type": "balloons", "title": "Pop the answer!", "rounds": [{"q": "How did they go back to the hotel?", "o": ["by bus", "by taxi", "on foot"], "a": 1}, {"q": "The writer felt … when the sister snored.", "o": ["embarrassed", "embarrassing", "bored"], "a": 0}, {"q": "They're flying home to …", "o": ["Salalah", "Khasab", "Sur"], "a": 1}], "icon": "🎈"}, {"type": "steps", "title": "Let's remember!", "icon": "🧠", "steps": ["A diary has dates and uses the first person (I, my, we).", "Muscat trip: park → art gallery → aquarium → cinema → museum & planetarium → mall → Royal Opera House.", "-ed = how we feel (tired, excited) · -ing = the thing (tiring, exciting)."]}, {"type": "exit", "title": "Exit ticket", "items": [{"k": "3", "text": "Name two features of a diary."}, {"k": "2", "text": "Which place in the diary would you like to visit? Why?"}, {"k": "1", "text": "Make two sentences: bored / boring."}], "icon": "🎟️"}, {"type": "homework", "title": "Homework", "head": "My homework", "items": ["Activity Book pp. 14–15 (Activities 1–4).", "Write three sentences with -ed adjectives and three with -ing adjectives.", "Write a short diary entry about your weekend."], "icon": "🏠"}]}, {"id": "L07", "unit": "U2", "unitName": "Unit 1: Entertainment", "title": "Entertainment places & Present continuous (future)", "code": "", "theme": "city", "emo": "🎡", "slides": [{"type": "cover", "say": "Vocabulary and Grammar"}, {"type": "goals", "title": "Today's goals", "items": ["I can name 12 places of entertainment.", "I can use the Present continuous for future arrangements."], "icon": "🎯"}, {"type": "goals", "title": "Today's goals", "items": ["I can talk about my plans for next weekend.", "I can plan a family trip with my group."], "icon": "🎯"}, {"type": "mystery", "title": "What's the hidden place?", "img": "L07_c1", "answer": "12 places of entertainment! 🎡", "qs": [{"q": "You see fish and sharks here:", "o": ["an aquarium", "a circus"], "a": 0}, {"q": "You learn about stars and planets here:", "o": ["a planetarium", "an ice rink"], "a": 0}, {"q": "You look at paintings here:", "o": ["an art gallery", "a bowling alley"], "a": 0}, {"q": "You watch a film with special glasses:", "o": ["a 3D cinema", "a safari park"], "a": 0}], "icon": "🕵️"}, {"type": "flip", "title": "Places (1)", "cards": [{"front": "bowling alley", "icon": "🎳", "back": "you roll a heavy ball at pins\n«Shihab loves the bowling alley. (photo 1)»"}, {"front": "aquarium", "icon": "🐠", "back": "you see fish and sea animals\n«We saw turtles at the aquarium. (photo 2)»"}, {"front": "soft play centre", "icon": "🧸", "back": "a safe place for small children to play\n«My little brother loves the soft play centre. (photo 3)»"}, {"front": "science museum", "icon": "🦖", "back": "you learn about science, dinosaurs and machines\n«We saw dinosaur bones at the science museum. (photo 4)»"}, {"front": "3D cinema", "icon": "🕶️🎬", "back": "you watch films with special glasses\n«We're going to the 3D cinema tonight. (photo 5)»"}, {"front": "art gallery", "icon": "🖼️", "back": "you look at paintings\n«The art gallery has many paintings. ing)", "we're going to the cinema."], ["Tonight (Monday)", "we aren't going out."], ["On Tuesday", "we're watching a show at the Royal Opera House."], ["On Wednesday", "we're flying home."]], "icon": "📔"}, {"type": "explain", "title": "Present continuous for the future", "lines": ["We use the Present continuous when we have decided or arranged to do something in the future.", "am / is / are + verb-ing + future time"], "img": "L07_c2", "rule": "Time words: tonight, tomorrow, this evening, next week, on Saturday", "icon": "💡"}, {"type": "flip", "title": "Present continuous for the future 💡 – examples", "cards": [{"front": "I'm [[watching]] a film tonight.", "icon": "💡", "back": "🎬"}, {"front": "She's [[going]] to the museum next week.", "icon": "✨", "back": "🏛️"}, {"front": "They [[aren't flying]] to Cairo this evening.", "icon": "🔎", "back": "✈️✘"}]}, {"type": "quiz", "title": "Circle the rule", "qs": [{"q": "We use the Present continuous when we ___ decided or arranged to do something in the future.", "o": ["have", "haven't"], "a": 0}, {"q": "We're ___ friends on Saturday.", "o": ["see", "seeing", "saw"], "a": 1}, {"q": "Which sentence is about the future?", "o": ["I'm reading now.", "I'm visiting my grandad tomorrow.", "I read every day."], "a": 1}], "icon": "✅"}, {"type": "quiz", "title": "Present continuous", "icon": "✏️", "qs": [{"q": "I ___ (stay) with my grandparents next summer.", "o": ["'m staying", "stay"], "a": 0}, {"q": "Muhanad ___ (not/go) bowling with his friends this evening.", "o": ["isn't going", "aren't going"], "a": 0}, {"q": "You and your friends ___ (watch) a film this Saturday.", "o": ["are watching", "is watching"], "a": 0}, {"q": "Tasneem ___ (visit) Bahrain with her family next month.", "o": ["is visiting", "visiting"], "a": 0}, {"q": "My parents ___ (not/work) tomorrow.", "o": ["aren't working", "isn't working"], "a": 0}]}, {"type": "build", "title": "Plans for next Saturday", "mode": "words", "items": [{"a": "Halima is helping her dad at home.", "hint": "help dad – home ✓"}, {"a": "Halima isn't having pizza for lunch.", "hint": "have pizza – lunch ✗"}, {"a": "Halima is visiting her grandad.", "hint": "visit grandad ✓"}, {"a": "Anas and Zaid are going to the planetarium.", "hint": "go to planetarium ✓"}, {"a": "Anas and Zaid aren't watching a film.", "hint": "watch film ✗"}], "icon": "🧩"}, {"type": "ask", "title": "Listen: four children's plans", "qs": [{"q": "Child 1: Where is he/she going?", "a": "He's/She's going to the … on …"}, {"q": "Child 2: What is he/she doing?", "a": "He's/She's …ing …"}, {"q": "Child 3 and Child 4?", "a": "Listen and write the place and the day."}], "icon": "🎧"}, {"type": "ask", "title": "Plan a family trip!", "qs": [{"q": "Where are you going? Agree on a place.", "a": "We're seeing the lions at a safari park."}, {"q": "When are you going? Choose a date.", "a": "We're going on 28th July to the aquarium."}, {"q": "What are you doing there?", "a": "We're watching the dolphins and having lunch in the café."}, {"q": "How are you getting there?", "a": "We're going by car / by bus."}], "img": "L07_c3", "icon": "🗺️"}, {"type": "wheel", "title": "Your weekend plans", "items": [{"q": "go shopping", "a": "I'm going shopping on Friday. / I'm not going shopping."}, {"q": "have a family party", "a": "We're having a family party on Saturday."}, {"q": "play hockey", "a": "I'm not playing hockey this weekend."}, {"q": "see friends", "a": "I'm seeing my friends tomorrow."}, {"q": "visit a castle", "a": "We're visiting Nakhal Fort next week."}, {"q": "tidy my room", "a": "I'm tidying my room this evening."}], "icon": "🎡"}, {"type": "race", "title": "Race to the future", "qs": [{"q": "We ___ to the aquarium tomorrow.", "options": ["go", "are going", "went"], "a": 1}, {"q": "She ___ to Cairo tonight.", "options": ["isn't flying", "aren't flying", "not fly"], "a": 0}, {"q": "You skate here:", "options": ["ice rink", "planetarium", "circus"], "a": 0}, {"q": "You see wild animals from a car here:", "options": ["safari park", "art gallery", "bowling alley"], "a": 0}, {"q": "Small children play safely here:", "options": ["soft play centre", "3D cinema", "theme park"], "a": 0}, {"q": "Are you ___ friends on Saturday?", "options": ["see", "seeing", "seen"], "a": 1}], "icon": "🏎️"}, {"type": "steps", "title": "Let's remember!", "icon": "🧠", "steps": ["12 places: soft play centre, science museum, 3D cinema, art gallery, planetarium, circus, aquarium, bowling alley, ice rink, theme park, adventure playground, safari park.", "Present continuous for future arrangements: I'm watching a film tonight.", "Negative: They aren't flying to Cairo this evening.", "Time words: tonight, tomorrow, next week, on Saturday."]}, {"type": "exit", "title": "Exit ticket", "items": [{"k": "3", "text": "Name five places of entertainment."}, {"k": "2", "text": "Write one plan for tomorrow."}, {"k": "1", "text": "Write one thing you aren't doing this weekend."}], "icon": "🎟️"}, {"type": "homework", "title": "Homework", "head": "My homework", "items": ["Activity Book pp. 16–17 (Activities 1–5).", "Grammar practice: Activity Book p. 60 (Activities 3–4).", "Write five sentences about your plans for next Saturday."], "icon": "🏠"}]}, {"id": "L08", "unit": "U2", "unitName": "Unit 1: Entertainment", "title": "Culture & Project: Performers around the world", "code": "", "theme": "city", "emo": "🌍", "slides": [{"type": "cover", "say": "WOW! Culture & Project"}, {"type": "goals", "title": "Today's goals", "items": ["I can read about Al Haboot and Cirque du Soleil.", "I can compare two kinds of performance."], "icon": "🎯"}, {"type": "goals", "title": "Today's goals", "items": ["I can talk about performing.", "I can make a poster for a performance with my group."], "icon": "🎯"}, {"type": "ask", "title": "Before you read", "qs": [{"q": "What kinds of performance have you seen?", "a": "Al Razha, Al Haboot, a circus, a play, a concert …"}, {"q": "Where did you see them?", "a": "On National Day, at a wedding, at school, at the theatre, on TV …"}, {"q": "What can you see in this photo?", "a": "Omani men in a traditional performance in the mountains."}], "img": "L08_c2", "icon": "🤔"}, {"type": "riddle", "title": "Guess the word!", "items": [{"clues": ["Music has this.", "You clap or move to it.", "Boom – boom – boom!"], "a": "rhythm", "emo": "🥁"}, {"clues": ["It's a long, sharp metal weapon.", "Al Haboot performers often carry it.", "It starts with S."], "a": "a sword", "emo": "⚔️"}, {"clues": ["It's a big show with clowns and acrobats.", "It sometimes travels from city to city.", "It starts with C."], "a": "a circus", "emo": "🎪"}, {"clues": ["Actors put it on their faces.", "It changes how you look.", "Performers have used it for 2,500 years!"], "a": "make-up", "emo": "💄"}], "icon": "🤔"}, {"type": "read", "title": "Al Haboot", "paras": ["Watching performers on stage can be very exciting. People in different countries enjoy watching many different kinds of [[performances]].", "Al Haboot is a [[traditional]] Omani performance. It is popular in the mountains in Oman and especially in Dhofar [[governorate]]."], "img": "L08_c2", "icon": "🇴🇲"}, {"type": "read", "title": "Al Haboot", "paras": ["The performers sing a poem to a special [[rhythm]] and they move to the rhythm of the poem. They often carry swords and they jump in the air with the swords.", "The performers might wear traditional or formal clothes. You can sometimes watch Al Haboot on national days or for [[celebrations]]."], "img": "L08_c2", "icon": "🇴🇲"}, {"type": "read", "title": "Cirque du Soleil", "paras": ["Cirque du Soleil is a big circus from Canada. Its name means 'circus of the sun'. Two men started the circus in 1984, and now it is one of the biggest [[travelling]] circuses in the world."], "img": "L08_c3", "icon": "🇨🇦"}, {"type": "read", "title": "Cirque du Soleil", "paras": ["They put on shows with fantastic costumes and amazing make-up. Cirque du Soleil have had their own theatre in Las Vegas in the USA since 1993, and they also travel all around the world.", "They perform in every [[continent]] except Antarctica!"], "img": "L08_c3", "icon": "🇨🇦"}, {"type": "read", "title": "Cirque du Soleil", "paras": ["WOW! Fact: Performers have used make-up since the time of the [[ancient]] Greeks, around 2,500 years ago!"], "img": "L08_c3", "icon": "🇨🇦"}, {"type": "sort", "title": "Al Haboot or Cirque du Soleil?", "bins": [{"label": "Al Haboot", "icon": "⚔️"}, {"label": "Cirque du Soleil", "icon": "🎪"}], "cards": [{"text": "The performers move to the rhythm of a poem.", "icon": "", "bin": 0}, {"text": "They perform the show all around the world.", "icon": "", "bin": 1}, {"text": "The performers jump in the air with swords.", "icon": "", "bin": 0}, {"text": "The performers wear fantastic costumes.", "icon": "", "bin": 1}, {"text": "You can watch the performance in Las Vegas.", "icon": "", "bin": 1}, {"text": "It's popular in Dhofar.", "icon": "", "bin": 0}], "icon": "🗂️"}, {"type": "ask", "title": "Answer the questions", "qs": [{"q": "Why do people enjoy watching performers on stage?", "a": "Watching performers on stage can be exciting."}, {"q": "When can you sometimes watch Al Haboot?", "a": "On national days or for celebrations."}, {"q": "What might the Al Haboot performers wear?", "a": "Traditional or formal clothes."}, {"q": "In which continent have Cirque du Soleil not performed?", "a": "Antarctica."}], "img": "L08_c1", "icon": "💭"}, {"type": "tf", "title": "True or False?", "items": [{"text": "Cirque du Soleil means 'circus of the moon'.", "a": false, "fix": "It means 'circus of the sun'."}, {"text": "Two men started Cirque du Soleil in 1984.", "a": true, "fix": "Two men started the circus in 1984."}, {"text": "They have had a theatre in Las Vegas since 1993.", "a": true, "fix": "since 1993"}, {"text": "Performers started using make-up 250 years ago.", "a": false, "fix": "Around 2,500 years ago – the ancient Greeks."}], "icon": "✔✘"}, {"type": "ask", "title": "Talk with your partner", "qs": [{"q": "Have you ever been in any performances? What kind of performer were you?", "a": "Yes, I have. I was an actor in a school play."}, {"q": "Do you enjoy performing (acting, playing a musical instrument, etc.)? Why? / Why not?", "a": "Yes, I do, because it's exciting. / No, I don't, because I'm shy."}, {"q": "Would you like to work as a performer? What kind?", "a": "I'd like to be a … because …"}], "icon": "🗣️"}, {"type": "ask", "title": "Listen: my favourite theme park", "qs": [{"q": "Where is the theme park?", "a": "Escape, near Penang in Malaysia."}, {"q": "Who is it for?", "a": "People of all ages – listen for the ages!"}, {"q": "What can you do there?", "a": "Listen: go through the trees, go down slides into swimming pools, go on trampolines …"}], "img": "L08_c5", "icon": "🎢"}, {"type": "explain", "title": "Project: a poster for a performance", "lines": ["1 In groups, find out about different kinds of performance around the world.", "2 Choose the one you like most and plan your own version.", "3 Decide who will describe it, find photos and prepare the place, dates and times."], "img": "L08_c4", "rule": "Interesting? ✔ Facts? ✔ Place, dates and times? ✔", "icon": "🖼️"}, {"type": "flip", "title": "Project: a poster for a performance 🖼️ – examples", "cards": [{"front": "Use [[exclamation marks (!)]] for interesting information.", "icon": "💡", "back": "Writing tip ✍️"}, {"front": "Use [[bullet points (•)]] for the dates and times.", "icon": "✨", "back": "Writing tip ✍️"}, {"front": "[[Look at the people]] who are listening when you give a talk.", "icon": "🔎", "back": "Speaking tip 🗣️"}]}, {"type": "sort", "title": "Who does what?", "bins": [{"label": "describe the performance", "icon": "✍️"}, {"label": "photos and pictures", "icon": "📷"}, {"label": "place, dates and times", "icon": "📅"}], "cards": [{"text": "Write: Come and see our shadow puppets!", "icon": "", "bin": 0}, {"text": "Print out photos", "icon": "", "bin": 1}, {"text": "• On l wanted to be a costume designer?", "since she was small"]], "icon": "⏳"}, {"type": "tf", "title": "True or False?", "items": [{"text": "The performer loves hearing the audience cheer for her.", "a": true, "fix": "It's an amazing feeling to hear the audience cheer for you!"}, {"text": "Samar's dream is to become a costume designer.", "a": false, "fix": "That's the second girl's dream. Basma's dream is to become a make-up artist."}, {"text": "Samar feels nervous when she sees the lion's face.", "a": true, "fix": "'A lion!' says Samar looking nervous."}], "icon": "✔✘"}, {"type": "explain", "title": "since / for in the story", "icon": "⏳", "lines": ["Find the Present perfect in the story:"], "rule": "for two hours · for many years · since I was small"}, {"type": "flip", "title": "since / for in the story 💡 – examples", "cards": [{"front": "They've been at a school show [[for]] two hours.", "icon": "💡", "back": "for + period"}, {"front": "I've wanted to be a performer [[for]] many years.", "icon": "✨", "back": "for + period"}, {"front": "I've wanted to be a costume designer [[since]] I was small.", "icon": "🔎", "back": "since + point"}]}, {"type": "quiz", "title": "Complete from the story", "icon": "✏️", "qs": [{"q": "Samar and Basma go ___, and the first girl they meet is a performer.", "o": ["backstage", "home"], "a": 0}, {"q": "'I really like your ___,' Samar says.", "o": ["costume", "make-up"], "a": 0}, {"q": "'I hope that my ___ becomes real one day.'", "o": ["dream", "show"], "a": 0}, {"q": "They see a ___'s face at the door.", "o": ["lion", "clown"], "a": 0}, {"q": "'Don't ___!' she says laughing.", "o": ["worry", "cheer"], "a": 0}]}, {"type": "wheel", "title": "Dream jobs", "items": [{"q": "Which job looks the best: a performer, a costume designer or a make-up artist? Why?", "a": "A make-up artist, because I can be creative."}, {"q": "What's your dream job?", "a": "My dream is to become a …"}, {"q": "How long have you wanted to be that?", "a": "I've wanted to be a … since I was … / for … years."}, {"q": "Would you like to perform on stage? Why?", "a": "Yes, because it's exciting to hear the audience cheer!"}, {"q": "Which costume would you design?", "a": "I'd design a costume for a lion / a king …"}], "icon": "🎡"}, {"type": "ask", "title": "Over to you!", "qs": [{"q": "Do you like the story? Why or why not?", "a": "Yes, I do. The lion part is funny!"}, {"q": "Do you like the pictures in the story? Why or why not?", "a": "Yes, the costumes and the make-up are colourful."}, {"q": "What would you change about the story? How would you change it?", "a": "The girls could meet the camera operator too."}], "img": "L15_c4", "icon": "🗣️"}, {"type": "race", "title": "Show race", "qs": [{"q": "The girls have been at the show for …", "options": ["one hour", "two hours", "three hours"], "a": 1}, {"q": "The first girl they meet is a …", "options": ["performer", "make-up artist", "writer"], "a": 0}, {"q": "Who says 'These costumes are wonderful!'?", "options": ["Samar", "Basma", "the performer"], "a": 1}, {"q": "Samar feels … when she sees the lion.", "options": ["bored", "nervous", "embarrassed"], "a": 1}, {"q": "The 'lion' is …", "options": ["a real lion", "a performer with make-up", "a puppet"], "a": 1}, {"q": "Basma's dream is to become a …", "options": ["make-up artist", "costume designer", "comedian"], "a": 0}], "icon": "🏎️"}, {"type": "steps", "title": "Let's remember!", "icon": "🧠", "steps": ["Samar and Basma meet a performer, a costume designer and a make-up artist backstage.", "for two hours · for many years · since she was small.", "The 'lion' was a performer with amazing make-up! 🦁", "Basma's dream: to become a make-up artist. 💄"]}, {"type": "exit", "title": "Exit ticket", "items": [{"k": "3", "text": "Who do the girls meet? Name three people."}, {"k": "2", "text": "Write one sentence from the story with since or for."}, {"k": "1", "text": "What's your dream job? Why?"}], "icon": "🎟️"}, {"type": "homework", "title": "Homework", "head": "My homework", "items": ["Read The School Show (CB pp. 36–39) aloud at home.", "Answer the questions on CB p. 107 in your notebook.", "Write about your dream job: I've wanted to be a … since/for …"], "icon": "🏠"}]}, {"id": "L16", "unit": "U3", "unitName": "Unit 2: Awesome animals", "title": "Vocabulary: Animal body parts", "code": "", "theme": "library", "emo": "🦔", "slides": [{"type": "cover", "say": "Unit 2 · Lesson 1 – animal body parts"}, {"type": "goals", "title": "Today's goals", "items": ["I can name 12 animal body parts: beak, claws, fin, flippers …", "I can read short posts and guess the animals."], "icon": "🎯"}, {"type": "goals", "title": "Today's goals", "items": ["I can classify animals by their body features (fur, scales, spines …).", "I can describe an animal in a guessing game: It has …"], "icon": "🎯"}, {"type": "riddle", "title": "What animal am I?", "items": [{"clues": ["I live in the desert.", "I can go for many days without water.", "In Oman, I have one hump."], "a": "a camel", "emo": "🐪"}, {"clues": ["I'm small and brown.", "I have lots of spines on my back.", "I curl up when I'm scared."], "a": "a hedgehog", "emo": "🦔"}, {"clues": ["I live in the sea.", "I have a big fin on my back.", "Many fish are scared of me!"], "a": "a shark", "emo": "🦈"}, {"clues": ["I'm a big cat.", "I have sharp claws and a loud voice.", "I'm the king of the animals."], "a": "a lion", "emo": "🦁"}], "icon": "🤔"}, {"type": "ask", "title": "WOW! Question", "qs": [{"q": "Look at the photos. Which animals can you see?", "a": "a rabbit, a shark, a parrot, a tortoise, a crocodile, a camel, an eagle, an oryx, a cat, a hedgehog, a lion …"}, {"q": "Which animals in the photos live in Oman?", "a": "the camel, the Arabian oryx, the cat, the hedgehog … (free answers)"}, {"q": "WOW! Question: Why are animals so awesome?", "a": "Because they look different / they can do amazing things / they help us … (free answers)"}], "img": "L16_c1", "icon": "💬"}, {"type": "flip", "title": "Animal body parts", "cards": [{"front": "beak", "icon": "🦆", "back": "the hard mouth of a bird\n«A duck has an orange beak.»"}, {"front": "tongue", "icon": "👅", "back": "the soft thing in the mouth – you taste with it\n«A chameleon catches insects with its tongue.»"}, {"front": "hump", "icon": "🐪", "back": "the big round part on a camel's back\n«Camels in Oman have one hump.»"}, {"front": "whiskers", "icon": "🐱", "back": "long hairs near the mouth of a cat\n«My cat has long white whiskers.»"}, {"front": "antennae", "icon": "🐜", "back": "two long thin parts on an insect's head\n«Ants use their antennae to communicate.»"}, {"front": "spines", "icon": "🦔", "back": "sharp points on an animal's back\n«A hedgehog has lots of spines.»"}], "icon": "🐾"}, {"type": "flip", "title": "Animal body parts", "cards": [{"front": "scales", "icon": "🐍", "back": "small hard pieces that cover fish and snakes\n«A snake has scales all over its body.»"}, {"front": "fin", "icon": "🦈", "back": "a thin flat part – fish use it to swim\n«You can see the shark's fin.»"}, {"front": "paws", "icon": "🐾", "back": "the soft feet of a dog or a cat\n«The puppy has small white paws.»"}, {"front": "claws", "icon": "🦅", "back": "sharp, hard nails on an animal's feet\n«Eagles have sharp claws.»"}, {"front": "flippers", "icon": "🦭", "back": "flat 'arms' that seals and turtles use to swim\n«Seals use their flippers to move.»"}, {"front": "horns", "icon": "🦏", "back": "hard, pointed things on an animal's head\n«The Arabian oryx has long horns.»"}], "icon": "🐾"}, {"type": "ask", "title": "Look and match", "qs": [{"q": "What are numbers 1, 2 and 3?", "a": "1 claws · 2 whiskers · 3 beak"}, {"q": "What are numbers 4, 5 and 6?", "a": "4 scales · 5 spines · 6 antennae"}, {"q": "What are numbers 7, 8 and 9?", "a": "7 paws · 8 flippers · 9 hump"}, {"q": "What are numbers 10, 11 and 12?", "a": "10 tongue · 11 horns · 12 fin"}], "img": "L16_c2", "icon": "🔢"}, {"type": "match", "title": "Match the word and the animal"
