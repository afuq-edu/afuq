<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مختبر العلوم — الصف السابع</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lalezar&family=Readex+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF4F1; --paper:#FFFFFF; --ink:#1B2B34; --soft:#5B6B73; --grid:#D8E6E0;
  --ok:#1FA36A; --bad:#E0483E; --gold:#F5B82E; --chip:#F2F6F4;
  --shadow:0 2px 0 rgba(27,43,52,.12);
  --u1:#2E9E5B; --u2:#2F7FD8; --u3:#EF7D1A; --u4:#A94BC0; --u5:#9A6B3F; --u6:#4146A8;
  --uc:var(--u1);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F171B; --paper:#18242A; --ink:#E4EEEA; --soft:#9DB0B7; --grid:#1F2E35; --chip:#22313A;
    --shadow:0 2px 0 rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  --bg:#0F171B; --paper:#18242A; --ink:#E4EEEA; --soft:#9DB0B7; --grid:#1F2E35; --chip:#22313A;
  --shadow:0 2px 0 rgba(0,0,0,.4);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{
  font-family:"Readex Pro","Segoe UI",Tahoma,sans-serif; color:var(--ink); background:var(--bg);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:26px 26px; min-height:100vh; line-height:1.6;
}
button{font-family:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--uc);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding:16px 16px 60px}
h1,h2,h3,.disp{font-family:"Lalezar","Readex Pro",sans-serif;font-weight:400;margin:0;line-height:1.25}
.hidden{display:none!important}

/* top bar */
.bar{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.iconbtn{width:44px;height:44px;border-radius:14px;border:2px solid var(--ink);background:var(--paper);font-size:20px;display:grid;place-items:center;box-shadow:var(--shadow);flex:none}
.bar .ttl{flex:1;min-width:0}
.bar .ttl h2{font-size:24px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .ttl small{color:var(--soft);font-size:13px}

/* hero */
.hero{display:flex;align-items:center;gap:18px;padding:18px 4px 22px}
.hero h1{font-size:clamp(40px,11vw,64px);letter-spacing:0}
.hero p{margin:4px 0 0;color:var(--soft);font-size:15px}
.flask{width:110px;flex:none}
.flask .liq{transition:transform 1.2s cubic-bezier(.2,.8,.2,1)}
.bubble{animation:rise 3s infinite ease-in}
.bubble:nth-child(2){animation-delay:1s}.bubble:nth-child(3){animation-delay:2s}
@keyframes rise{0%{transform:translateY(0);opacity:0}20%{opacity:.9}100%{transform:translateY(-60px);opacity:0}}
.hero .score{font-size:14px;margin-top:8px;font-weight:600}
.hero .score b{font-size:20px}

/* units */
.units{display:grid;gap:12px}
.unit{display:flex;align-items:center;gap:14px;width:100%;text-align:right;padding:14px;border-radius:20px;border:2px solid var(--ink);background:var(--paper);box-shadow:4px 4px 0 var(--uc)}
.unit:active{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--uc)}
.unit .emb{width:64px;height:64px;border-radius:18px;background:var(--uc);display:grid;place-items:center;font-size:34px;flex:none}
.unit .inf{flex:1;min-width:0}
.unit .num{font-size:13px;color:var(--uc);font-weight:700;filter:saturate(1.2)}
.unit h3{font-size:22px}
.prog{height:8px;border-radius:8px;background:var(--chip);overflow:hidden;margin-top:6px}
.prog i{display:block;height:100%;background:var(--uc);border-radius:8px}
.unit .st{font-size:13px;color:var(--soft);margin-top:4px}

/* lessons */
.lessons{display:grid;gap:10px}
.lesson{display:flex;align-items:center;gap:12px;width:100%;text-align:right;padding:12px 14px;border-radius:16px;border:2px solid var(--ink);background:var(--paper);box-shadow:var(--shadow)}
.lesson .code{font-family:"Lalezar";font-size:22px;width:54px;height:54px;border-radius:50%;display:grid;place-items:center;background:var(--uc);color:#fff;flex:none}
.lesson .inf{flex:1;min-width:0}
.lesson h3{font-size:19px}
.lesson .kind{font-size:13px;color:var(--soft)}
.stars{font-size:18px;letter-spacing:1px;white-space:nowrap}
.stars .off{opacity:.2;filter:grayscale(1)}
.unithead{border-radius:22px;background:var(--uc);color:#fff;padding:18px;margin-bottom:14px;display:flex;gap:14px;align-items:center}
.unithead .emb{font-size:46px}
.unithead h2{font-size:28px}
.unithead p{margin:0;opacity:.9;font-size:14px}

/* game */
.idea{background:var(--paper);border:2px solid var(--ink);border-radius:16px;padding:12px 14px;margin-bottom:12px;font-size:15px;position:relative}
.idea b{color:var(--uc)}
.stage{background:var(--paper);border:2px solid var(--ink);border-radius:20px;padding:14px;box-shadow:4px 4px 0 var(--uc);min-height:300px}
.task{display:flex;gap:10px;align-items:flex-start;background:var(--chip);border-radius:14px;padding:10px 12px;margin-bottom:12px;font-weight:600;font-size:15px}
.task .tn{background:var(--uc);color:#fff;border-radius:10px;padding:0 8px;font-size:13px;flex:none;margin-top:2px}
.hud{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--soft);margin:0 0 10px;flex-wrap:wrap}
.hud .pill{background:var(--chip);border-radius:20px;padding:2px 10px}
.dots{display:flex;gap:4px;flex-wrap:wrap}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--chip);border:1.5px solid var(--soft)}
.dots i.on{background:var(--uc);border-color:var(--uc)}

.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:12px}
.chip{border:2px solid var(--ink);background:var(--paper);border-radius:12px;padding:8px 12px;font-size:15px;font-weight:600;box-shadow:var(--shadow);min-height:44px}
.chip.sel{background:var(--uc);color:#fff;border-color:var(--uc);transform:translateY(-2px)}
.chip.used{opacity:.25;pointer-events:none}
.shake{animation:shake .35s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.pop{animation:pop .35s}
@keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.12)}100%{transform:scale(1)}}

.diagram{width:100%;max-height:420px;display:block;margin:0 auto}
.diagram text{font-family:"Readex Pro";font-weight:600;paint-order:stroke;stroke:var(--paper);stroke-width:4px}
.pin{cursor:pointer}
.pin circle{fill:var(--paper);stroke:var(--ink);stroke-width:2.5}
.pin.done circle{fill:var(--ok);stroke:var(--ok)}
.pin.hot circle{stroke:var(--uc);stroke-width:4}
.pin text{font-size:14px;stroke:none!important}
.pin.done text{fill:#fff}

/* sort */
.card{margin:6px auto 16px;max-width:340px;border:2px solid var(--ink);border-radius:20px;background:var(--paper);padding:18px;text-align:center;box-shadow:4px 4px 0 var(--ink);transition:transform .3s,opacity .3s}
.card .em{font-size:52px;line-height:1.1}
.card .tx{font-size:19px;font-weight:600;margin-top:6px}
.card.fly{opacity:0;transform:translateY(50px) scale(.6)}
.bins{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}
.bin{border:2px dashed var(--ink);border-radius:18px;padding:12px 8px;background:var(--chip);text-align:center;min-height:92px}
.bin .bi{font-size:28px}
.bin .bt{font-weight:700;font-size:15px}
.bin .bc{font-size:12px;color:var(--soft)}
.bin.good{background:color-mix(in srgb,var(--ok) 22%,var(--paper));border-style:solid;border-color:var(--ok)}
.bin.bad{background:color-mix(in srgb,var(--bad) 22%,var(--paper));border-color:var(--bad)}

/* order */
.slots{display:grid;gap:8px;margin-bottom:14px}
.slot{display:flex;align-items:center;gap:10px;min-height:48px;border:2px dashed var(--soft);border-radius:14px;padding:6px 10px;background:var(--chip)}
.slot .n{width:30px;height:30px;border-radius:50%;background:var(--paper);border:2px solid var(--soft);display:grid;place-items:center;font-weight:700;font-size:14px;flex:none}
.slot.fill{border:2px solid var(--uc);background:color-mix(in srgb,var(--uc) 14%,var(--paper))}
.slot.fill .n{background:var(--uc);color:#fff;border-color:var(--uc)}
.pool{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.ocard{border:2px solid var(--ink);background:var(--paper);border-radius:14px;padding:8px 12px;font-size:15px;font-weight:600;box-shadow:var(--shadow);min-height:46px;display:flex;align-items:center;gap:6px}
.ocard.used{visibility:hidden}

/* match */
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mcol{display:grid;gap:8px;align-content:start}
.mbtn{border:2px solid var(--ink);background:var(--paper);border-radius:14px;padding:10px;font-size:14px;font-weight:600;text-align:center;min-height:56px;box-shadow:var(--shadow)}
.mbtn.sel{border-color:var(--uc);background:color-mix(in srgb,var(--uc) 20%,var(--paper))}
.mbtn.done{color:#fff;border-color:transparent;pointer-events:none}

/* quiz */
.qv{font-size:58px;text-align:center;line-height:1.15;margin:4px 0 8px}
.qv svg{max-width:100%;height:auto}
.qq{font-size:19px;font-weight:700;text-align:center;margin-bottom:14px}
.opts{display:grid;gap:10px}
.opt{border:2px solid var(--ink);background:var(--paper);border-radius:14px;padding:12px;font-size:16px;font-weight:600;text-align:right;box-shadow:var(--shadow)}
.opt.right{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.wrong{background:var(--bad);border-color:var(--bad);color:#fff}
.explain{margin-top:12px;padding:10px 12px;border-radius:12px;background:var(--chip);font-size:14px}
.next{display:block;margin:14px auto 0;border:none;background:var(--ink);color:var(--paper);border-radius:14px;padding:12px 28px;font-size:16px;font-weight:700}

/* sims */
.simbox{position:relative;border-radius:16px;overflow:hidden;border:2px solid var(--ink);background:var(--chip)}
canvas.sim{display:block;width:100%;height:auto;touch-action:none}
.ctrl{display:grid;gap:10px;margin-top:12px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.row label{font-weight:600;font-size:14px;min-width:90px}
input[type=range]{direction:ltr;flex:1;accent-color:var(--uc);height:28px;min-width:140px}
.btn{border:2px solid var(--ink);background:var(--paper);border-radius:12px;padding:8px 14px;font-weight:700;font-size:15px;box-shadow:var(--shadow);min-height:44px}
.btn.pri{background:var(--uc);border-color:var(--uc);color:#fff}
.btn.on{background:var(--ink);color:var(--paper)}
.readout{font-weight:700;font-size:15px}
.toast{position:absolute;top:10px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:6px 16px;border-radius:20px;font-weight:700;font-size:16px;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1}
.tasklist{display:grid;gap:6px;margin-top:12px}
.tasklist div{font-size:14px;padding:6px 10px;border-radius:10px;background:var(--chip)}
.tasklist div.done{background:color-mix(in srgb,var(--ok) 20%,var(--paper))}
.tasklist div.cur{outline:2px solid var(--uc)}

/* result */
.modal{position:fixed;inset:0;background:rgba(10,20,25,.55);display:grid;place-items:center;z-index:20;padding:20px}
.res{background:var(--paper);border:2px solid var(--ink);border-radius:26px;padding:24px;text-align:center;max-width:360px;width:100%;box-shadow:6px 6px 0 var(--uc)}
.res .big{font-size:52px;letter-spacing:4px}
.res h2{font-size:30px;margin:6px 0}
.res p{color:var(--soft);margin:0 0 14px}
.res .row{justify-content:center}
#fx{position:fixed;inset:0;pointer-events:none;z-index:30}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<canvas id="fx"></canvas>
<div class="wrap" id="app"></div>
<script>
/* ========= utilities ========= */
const $ = (s, r = document) => r.querySelector(s);
const AR = "٠١٢٣٤٥٦٧٨٩";
const ar = n => String(n).replace(/\d/g, d => AR[d]);
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
const h = (tag, attrs = {}, ...kids) => {
  const e = document.createElement(tag);
  for (const k in attrs) {
    if (k === "class") e.className = attrs[k];
    else if (k === "html") e.innerHTML = attrs[k];
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), attrs[k]);
    else if (k === "style") e.style.cssText = attrs[k];
    else e.setAttribute(k, attrs[k]);
  }
  for (const c of kids.flat()) if (c != null) e.append(c.nodeType ? c : document.createTextNode(c));
  return e;
};
const cssv = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
function flash(el, cls) { el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); }

/* ========= storage ========= */
const KEY = "sci7-lab-v1";
let store = { stars: {}, sound: true };
try { const s = JSON.parse(localStorage.getItem(KEY)); if (s) store = Object.assign(store, s); } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(store)); } catch (e) {} };

/* ========= sound ========= */
let actx;
function tone(freqs, dur = .12, type = "sine", vol = .12) {
  if (!store.sound) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    let t = actx.currentTime;
    freqs.forEach(f => {
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = type; o.frequency.value = f; g.gain.setValueAtTime(vol, t);
      g.gain.exponentialRampToValueAtTime(.001, t + dur);
      o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t + dur); t += dur * .8;
    });
  } catch (e) {}
}
const sfx = { ok: () => tone([660, 880]), bad: () => tone([220, 160], .14, "square", .06), win: () => tone([523, 659, 784, 1046], .15, "triangle"), tap: () => tone([500], .05, "sine", .05) };

/* ========= confetti ========= */
function confetti() {
  const c = $("#fx"), x = c.getContext("2d"); c.width = innerWidth; c.height = innerHeight;
  const cols = ["#2E9E5B", "#2F7FD8", "#EF7D1A", "#A94BC0", "#F5B82E", "#E0483E"];
  const ps = Array.from({ length: 120 }, () => ({ x: innerWidth / 2, y: innerHeight / 2, vx: (Math.random() - .5) * 14, vy: -Math.random() * 14 - 4, r: Math.random() * 6 + 4, c: cols[Math.random() * 6 | 0], a: Math.random() * 6 }));
  let f = 0;
  (function loop() {
    x.clearRect(0, 0, c.width, c.height);
    ps.forEach(p => { p.x += p.vx; p.y += p.vy; p.vy += .35; p.a += .2; x.save(); x.translate(p.x, p.y); x.rotate(p.a); x.fillStyle = p.c; x.fillRect(-p.r / 2, -p.r / 4, p.r, p.r / 2); x.restore(); });
    if (++f < 110) requestAnimationFrame(loop); else x.clearRect(0, 0, c.width, c.height);
  })();
}

/* ========= navigation ========= */
const app = $("#app");
let cleanup = [];
function clearScene() { cleanup.forEach(f => { try { f(); } catch (e) {} }); cleanup = []; app.innerHTML = ""; window.scrollTo(0, 0); }
function setUnitColor(u) { document.documentElement.style.setProperty("--uc", `var(--u${u})`); }
const starsOf = id => store.stars[id] || 0;
const starStr = n => h("span", { class: "stars", "aria-label": `${n} من 3 نجوم` }, ...[1, 2, 3].map(i => h("span", { class: i <= n ? "" : "off" }, "⭐")));
const allLessons = () => UNITS.flatMap(u => u.lessons);

function topbar(title, sub, back) {
  const snd = h("button", { class: "iconbtn", "aria-label": "الصوت", onclick: () => { store.sound = !store.sound; save(); snd.textContent = store.sound ? "🔊" : "🔈"; } }, store.sound ? "🔊" : "🔈");
  return h("div", { class: "bar" },
    back ? h("button", { class: "iconbtn", "aria-label": "رجوع", onclick: back }, "→") : null,
    h("div", { class: "ttl" }, h("h2", {}, title), sub ? h("small", {}, sub) : null), snd);
}

function home() {
  clearScene(); setUnitColor(1);
  const L = allLessons(), got = L.reduce((s, l) => s + starsOf(l.id), 0), max = L.length * 3, pct = got / max;
  const flask = h("div", { class: "flask", html: `
  <svg viewBox="0 0 110 140" aria-hidden="true">
    <defs><clipPath id="fk"><path d="M40 8h30v38l30 70a12 12 0 0 1-11 17H21a12 12 0 0 1-11-17l30-70z"/></clipPath></defs>
    <g clip-path="url(#fk)">
      <rect x="0" y="0" width="110" height="140" fill="var(--paper)"/>
      <g class="liq" style="transform:translateY(${(1 - Math.max(pct, .1)) * 100}px)">
        <path d="M0 40 q14 -8 28 0 t28 0 t28 0 t28 0 V160 H0z" fill="var(--u3)"/>
        <circle class="bubble" cx="40" cy="110" r="4" fill="#fff" opacity=".7"/>
        <circle class="bubble" cx="62" cy="120" r="3" fill="#fff" opacity=".7"/>
        <circle class="bubble" cx="75" cy="105" r="5" fill="#fff" opacity=".7"/>
      </g>
    </g>
    <path d="M40 8h30v38l30 70a12 12 0 0 1-11 17H21a12 12 0 0 1-11-17l30-70z" fill="none" stroke="var(--ink)" stroke-width="4" stroke-linejoin="round"/>
    <rect x="34" y="3" width="42" height="8" rx="4" fill="var(--ink)"/>
  </svg>` });
  app.append(h("div", { class: "hero" }, flask,
    h("div", {}, h("h1", {}, "مختبر العلوم"),
      h("p", {}, "ألعاب تفاعلية لجميع دروس الصف السابع — الفصل الأول"),
      h("div", { class: "score" }, "امْلأ الدورق بالنجوم: ", h("b", {}, ar(got)), ` من ${ar(max)} ⭐`))));
  const list = h("div", { class: "units" });
  UNITS.forEach((u, i) => {
    const g = u.lessons.reduce((s, l) => s + starsOf(l.id), 0), m = u.lessons.length * 3;
    const b = h("button", { class: "unit", style: `--uc:var(--u${i + 1})`, onclick: () => unitView(i) },
      h("div", { class: "emb" }, u.emoji),
      h("div", { class: "inf" }, h("div", { class: "num" }, `الوحدة ${u.ord}`), h("h3", {}, u.title),
        h("div", { class: "prog" }, h("i", { style: `width:${g / m * 100}%` })),
        h("div", { class: "st" }, `${ar(u.lessons.length)} دروس · ${ar(g)} / ${ar(m)} نجمة`)));
    list.append(b);
  });
  app.append(list);
}

const KIND = { label: "🏷️ ضع البطاقات على الرسم", sort: "🗂️ صنّف", order: "🔢 رتّب", match: "🔗 طابق", quiz: "❓ اختبار سريع", chain: "⚡ سلسلة الطاقة" };
const SIMK = "🧪 تجربة تفاعلية";
function unitView(ui) {
  clearScene(); setUnitColor(ui + 1);
  const u = UNITS[ui];
  app.append(topbar("الوحدات", null, home));
  app.append(h("div", { class: "unithead" }, h("div", { class: "emb" }, u.emoji), h("div", {}, h("p", {}, `الوحدة ${u.ord}`), h("h2", {}, u.title))));
  const list = h("div", { class: "lessons" });
  u.lessons.forEach((l, li) => {
    const k = l.stages[0].type;
    list.append(h("button", { class: "lesson", onclick: () => play(ui, li) },
      h("div", { class: "code" }, ar(l.code)),
      h("div", { class: "inf" }, h("h3", {}, l.title), h("div", { class: "kind" }, KIND[k] || SIMK)),
      starStr(starsOf(l.id))));
  });
  app.append(list);
}

/* ========= game runner ========= */
function play(ui, li) {
  clearScene(); setUnitColor(ui + 1);
  const u = UNITS[ui], L = u.lessons[li];
  app.append(topbar(`${ar(L.code)} ${L.title}`, `الوحدة ${u.ord}: ${u.title}`, () => unitView(ui)));
  app.append(h("div", { class: "idea" }, h("b", {}, "فكرة الدرس: "), L.idea));
  const hud = h("div", { class: "hud" });
  const stage = h("div", { class: "stage" });
  app.append(hud, stage);
  let mistakes = 0, si = 0, items = 0;
  const mis = h("span", { class: "pill" }), stp = h("span", { class: "pill" });
  hud.append(stp, mis);
  const upd = () => { mis.textContent = `❌ أخطاء: ${ar(mistakes)}`; stp.textContent = L.stages.length > 1 ? `المرحلة ${ar(si + 1)} من ${ar(L.stages.length)}` : KIND[L.stages[0].type] || SIMK; };
  const ctx = {
    mistake() { mistakes++; sfx.bad(); upd(); },
    good() { sfx.ok(); },
