:root{--ink:#14284b;--ink2:#3b4f72;--cream:#fdf6e9;--gold:#e3b45a;--pink:#fde3e6;--pinkb:#e8798a;--blue:#dcecff;--blueb:#6aa2e8;--yel:#fff1c9;--yelb:#e2b13c;--grn:#dff3e0;--grnb:#5fb873;--pur:#ece4ff;--purb:#9b84e6;--org:#ffe6d5;--orgb:#f0965f;--ok:#2fa35a;--no:#e05561}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#0e1830;overflow:hidden;font-family:'Baloo Bhaijaan 2','Noto Naskh Arabic',system-ui,sans-serif;color:var(--ink)}
button{font:inherit;cursor:pointer}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#stage{position:relative;width:1600px;height:900px;transform-origin:center center;overflow:hidden;border-radius:6px;background:#fff}
.scene{position:absolute;inset:0;width:100%;height:100%}
.slide{position:absolute;inset:0}
.slide.in{animation:sIn .5s ease}
@keyframes sIn{from{opacity:0;transform:scale(1.015)}to{opacity:1;transform:none}}
bdi.en{font-family:'Baloo Bhaijaan 2',system-ui,sans-serif;unicode-bidi:isolate}
mark{background:linear-gradient(transparent 45%,#ffe27a 45%,#ffe27a 92%,transparent 92%);color:inherit;padding:0 .1em}
/* banner (top title card) */
.banner{position:absolute;top:26px;left:50%;transform:translateX(-50%);min-width:760px;max-width:1300px;padding:14px 92px 16px;background:var(--cream);border:5px solid var(--gold);border-radius:34px;box-shadow:0 8px 0 rgba(0,0,0,.12),inset 0 0 0 4px #fff;text-align:center;z-index:5}
.banner:before{content:"";position:absolute;inset:8px;border:2.5px dashed #e9cf98;border-radius:26px;pointer-events:none}
.banner h1{margin:0;font-weight:800;font-size:54px;line-height:1.25;color:var(--ink)}
.banner h1 .k{color:#d6344f}
.banner .ico{position:absolute;top:50%;transform:translateY(-50%);font-size:52px}
.banner .ico.r{right:18px}.banner .ico.l{left:18px}
.banner.pink{background:#fff0f2;border-color:var(--pinkb)}.banner.pink:before{border-color:#f3b5bf}
.pill{position:absolute;left:50%;transform:translateX(-50%);background:#fffaf0;border:3px solid #d7b878;border-radius:22px;padding:4px 30px 6px;font-size:32px;font-weight:600;color:var(--ink2);white-space:nowrap;z-index:5;box-shadow:0 4px 0 rgba(0,0,0,.08)}
/* generic cards */
.card{position:relative;background:var(--cream);border:5px solid var(--gold);border-radius:30px;box-shadow:0 8px 0 rgba(0,0,0,.13);padding:18px 26px}
.card:before{content:"";position:absolute;inset:8px;border:2.5px dashed rgba(0,0,0,.14);border-radius:22px;pointer-events:none}
.c0{background:var(--pink);border-color:var(--pinkb)}.c1{background:var(--blue);border-color:var(--blueb)}.c2{background:var(--yel);border-color:var(--yelb)}.c3{background:var(--grn);border-color:var(--grnb)}.c4{background:var(--pur);border-color:var(--purb)}.c5{background:var(--org);border-color:var(--orgb)}
.big{font-size:44px;font-weight:700;line-height:1.45}
.mid{font-size:38px;font-weight:600;line-height:1.5}
.emo{font-size:72px;line-height:1;filter:drop-shadow(0 4px 0 rgba(0,0,0,.12))}
.hide{visibility:hidden}
.tap{cursor:pointer}
.panel{position:absolute;left:50%;transform:translateX(-50%);background:rgba(255,253,247,.94);border:5px solid #d9c08e;border-radius:34px;box-shadow:0 10px 0 rgba(0,0,0,.12);padding:26px 34px}
/* nav */
.nav{position:fixed;bottom:16px;width:64px;height:64px;border-radius:50%;border:0;background:rgba(255,255,255,.88);color:#14284b;font-size:30px;font-weight:800;box-shadow:0 4px 14px rgba(0,0,0,.25);z-index:50;display:flex;align-items:center;justify-content:center;transition:transform .15s,opacity .3s;opacity:.55}
.nav:hover{opacity:1;transform:scale(1.08)}
#next{left:16px}#prev{right:16px}
#menuBtn{position:fixed;top:14px;right:14px;width:50px;height:50px;border-radius:14px;border:0;background:rgba(255,255,255,.6);font-size:26px;z-index:50;opacity:.45;transition:opacity .3s}
#menuBtn:hover{opacity:1}
#count{position:fixed;bottom:30px;left:92px;color:#fff;font-size:15px;opacity:.55;z-index:50;font-family:system-ui;direction:ltr;text-shadow:0 1px 3px #000}
/* menu */
#menu{position:fixed;inset:0;background:rgba(10,20,42,.82);backdrop-filter:blur(6px);z-index:100;display:none;overflow:auto;padding:30px}
#menu.on{display:block}
#menu .mbox{max-width:1180px;margin:0 auto;background:#fffaf0;border-radius:28px;padding:22px 30px 30px;border:5px solid var(--gold)}
#menu h2{margin:0 0 4px;font-size:34px}
#menu .msub{color:#5b6782;font-size:18px;margin-bottom:12px}
#menu .unit{margin:16px 0 8px;font-size:22px;font-weight:800;color:#2f7d5b}
#menu .lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
#menu .les{border:3px solid #e5d6b5;border-radius:18px;background:#fff;padding:10px 14px}
#menu .les b{display:block;font-size:21px;line-height:1.35;cursor:pointer}
#menu .les b:hover{color:#d6344f}
#menu .les .ps{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
#menu .les .ps button{border:2px solid #9cc9d3;background:#eef8fa;color:#226b7a;border-radius:12px;padding:2px 12px;font-size:16px;font-weight:700}
#menu .les.cur{border-color:#e8798a;background:#fff5f6}
#menu .tools{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
#menu .tools button{border:2px solid #d7b878;background:#fff;border-radius:14px;padding:6px 16px;font-size:18px;font-weight:700}
#note{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);max-width:900px;background:#fffbe6;border:2px solid #e3b45a;border-radius:14px;padding:10px 18px;font-size:18px;z-index:60;display:none;box-shadow:0 6px 20px rgba(0,0,0,.3)}
#note.on{display:block}
/* fx */
.shake{animation:shake .45s}
@keyframes shake{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
.pop{animation:pop .45s}
@keyframes pop{50%{transform:scale(1.08)}}
.okc{outline:6px solid var(--ok)!important;outline-offset:3px;background:#e4f7e9!important}
.noc{outline:6px solid var(--no)!important;outline-offset:3px;background:#fde8ea!important}
.fade{opacity:.35}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:90}
/* ---------- gate (cover / lock / enter) ---------- */
.gate{position:absolute;width:560px;height:560px;overflow:hidden;border-radius:40px 40px 0 0}
.gate .frame{position:absolute;inset:0;border-radius:40px 40px 0 0;background:linear-gradient(#d9dfea,#b9c3d6);border:6px solid #2b3a55}
.gate .sign{position:absolute;top:16px;left:16px;right:16px;height:96px;background:#1f2d4d;border-radius:18px;display:flex;align-items:center;justify-content:center;gap:16px;color:#fff;font-size:40px;font-weight:800}
.gate .sign .tag{background:#ffcb3d;color:#1f2d4d;border-radius:12px;padding:0 16px;font-size:44px}
.gate .door{position:absolute;top:128px;bottom:0;width:calc(50% - 22px);background:linear-gradient(135deg,#d6e8ff,#a5c4eb);border:5px solid #2b3a55;transition:transform 1.1s cubic-bezier(.6,.05,.3,1)}
.gate .door.l{left:22px;border-radius:8px 0 0 0}.gate .door.r{right:22px;border-radius:0 8px 0 0}
.gate.open .door.l{transform:translateX(-96%)}.gate.open .door.r{transform:translateX(96%)}
.gate .inside{position:absolute;top:128px;bottom:0;left:22px;right:22px;background:radial-gradient(circle at 50% 40%,#fff9d6,#ffe08a 60%,#ffc94a);display:flex;align-items:center;justify-content:center;text-align:center;font-size:44px;font-weight:800;padding:20px;overflow:hidden}
.gate .lock{position:absolute;top:50%;left:50%;width:150px;height:150px;margin:-40px 0 0 -75px;border-radius:50%;background:rgba(255,255,255,.4);border:6px solid #fff;display:flex;align-items:center;justify-content:center;font-size:80px;transition:transform .6s,opacity .6s;z-index:3}
.gate.open .lock{transform:translateY(-200px) rotate(-30deg);opacity:0}
.gate .tape{position:absolute;left:-20px;right:-20px;top:62%;height:40px;background:repeating-linear-gradient(-45deg,#e8414f 0 30px,#fff 30px 60px);border:4px solid #2b3a55;border-radius:6px;z-index:4;transition:transform .8s,opacity .8s}
.gate.open .tape{transform:translateY(300px) rotate(8deg);opacity:0}
.gate .chev{position:absolute;bottom:40px;font-size:60px;color:#ffcb3d;font-weight:900;z-index:2}
.carpet{position:absolute;bottom:0;height:140px;background:linear-gradient(#e94a5a,#c92f42);clip-path:polygon(18% 0,82% 0,100% 100%,0 100%)}
/* cover card */
.ttlcard{position:absolute;left:50%;top:400px;transform:translateX(-50%) scale(.6);opacity:0;transition:all .9s .5s cubic-bezier(.3,1.4,.5,1);width:820px;padding:40px 50px;text-align:center;background:#fff2f4;border:7px solid #e8798a;border-radius:46px;box-shadow:0 14px 0 rgba(0,0,0,.15);z-index:6}
.ttlcard.on{transform:translateX(-50%) scale(1);opacity:1}
.ttlcard .lbl{display:inline-block;background:#ffd8df;border-radius:18px;padding:2px 26px;font-size:36px;font-weight:700}
.ttlcard .t{font-size:84px;font-weight:800;line-height:1.25;margin-top:14px}
.ttlcard .u{font-size:28px;color:#5b6782;margin-top:6px}
.ttlcard .h{position:absolute;top:-58px;left:50%;transform:translateX(-50%);width:210px;height:60px;border:12px solid #2b3a55;border-bottom:0;border-radius:30px 30px 0 0}
/* goals tickets */
.ticket{position:absolute;left:50%;transform:translateX(-50%);width:1080px;min-height:150px;display:flex;align-items:stretch;border-radius:30px;border:5px solid;box-shadow:0 8px 0 rgba(0,0,0,.12);overflow:hidden;transition:opacity .5s,transform .5s}
.ticket .st{width:120px;flex:none;display:flex;align-items:center;justify-content:center;font-size:56px;color:#fff;border-left:4px dashed rgba(255,255,255,.7)}
.ticket .n{width:110px;flex:none;display:flex;align-items:center;justify-content:center;font-size:66px;font-weight:800;border-left:3px dashed rgba(0,0,0,.18)}
.ticket .tx{flex:1;display:flex;align-items:center;padding:12px 30px;font-size:42px;font-weight:700;line-height:1.4}
.ticket .ic{width:130px;flex:none;display:flex;align-items:center;justify-content:center;font-size:72px}
.ticket.hid{opacity:0;transform:translateX(-50%) translateY(30px)}
/* list rows (tf / enter) */
.row{display:flex;align-items:center;gap:18px;background:#fff6f7;border:5px solid #f0a9b4;border-radius:30px;padding:10px 20px;box-shadow:0 6px 0 rgba(0,0,0,.1);font-size:40px;font-weight:700;transition:transform .7s,opacity .7s}
.row .num{width:64px;height:64px;border-radius:50%;background:#e8414f;color:#fff;display:flex;align-items:center;justify-content:center;font-size:36px;flex:none;border:4px solid #fff;box-shadow:0 0 0 3px #e8414f}
.row .txt{flex:1;line-height:1.35}
.row .ico{font-size:52px}
.yn{display:flex;gap:10px}
.yn button{border:4px solid #2b3a55;border-radius:18px;font-size:30px;font-weight:800;padding:4px 16px;background:#fff}
.yn .y{background:#e3f6e8;border-color:#2fa35a;color:#1d7a40}.yn .n2{background:#fde6e8;border-color:#e05561;color:#b8283a}
.row.gone{transform:translateX(-640px) scale(.3);opacity:0}
/* sort */
.bin{position:absolute;border-radius:30px;border:5px solid;box-shadow:0 8px 0 rgba(0,0,0,.12);padding:12px}
.bin .bh{display:flex;align-items:center;justify-content:center;gap:12px;background:rgba(255,255,255,.75);border:3px dashed rgba(0,0,0,.2);border-radius:20px;font-size:40px;font-weight:800;padding:4px 10px}
.bin .bb{margin-top:10px;min-height:110px;border:3px dashed rgba(0,0,0,.25);border-radius:20px;display:flex;flex-wrap:wrap;gap:8px;padding:8px;align-content:flex-start}
.bin.hot{transform:scale(1.03)}
.dcard{background:#fff8ea;border:5px solid #e2b13c;border-radius:26px;padding:10px 18px;font-size:36px;font-weight:800;text-align:center;box-shadow:0 6px 0 rgba(0,0,0,.12);cursor:grab;touch-action:none;user-select:none;display:inline-flex;align-items:center;gap:10px}
.dcard .e{font-size:44px}
.dcard.sel{outline:6px solid #5fa8ff;outline-offset:3px}
.dcard.drag{position:fixed;z-index:200;pointer-events:none;transform:rotate(-3deg) scale(1.05)}
.bin .dcard{font-size:28px;padding:4px 12px;cursor:default;box-shadow:none}
.bin .dcard .e{font-size:32px}
/* concept cards */
.ccard{position:absolute;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:6px;padding:22px 26px;cursor:pointer;transition:transform .3s}
.ccard:hover{transform:translateY(-4px)}
.ccard .hd{font-size:46px;font-weight:800;line-height:1.3}
.ccard .bd{font-size:36px;font-weight:600;line-height:1.45;transition:opacity .4s,max-height .5s;overflow:hidden}
.ccard.closed .bd{opacity:0;max-height:0}
.ccard .q{font-size:24px;opacity:.6}
.ccard:not(.closed) .q{display:none}
/* picture */
.pic{position:absolute;background:#fff;border:6px solid #2b3a55;border-radius:22px;box-shadow:0 10px 0 rgba(0,0,0,.18);overflow:hidden;display:flex;align-items:center;justify-content:center}
.pic img{max-width:100%;max-height:100%;display:block}
.pin{position:absolute;width:62px;height:62px;margin:-31px 0 0 -31px;border-radius:50%;background:#e8414f;color:#fff;font-size:32px;font-weight:800;border:5px solid #fff;box-shadow:0 0 0 4px #e8414f,0 6px 12px rgba(0,0,0,.3);display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:3;animation:pulse 1.8s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 10px rgba(232,65,79,.35),0 6px 12px rgba(0,0,0,.3)}}
.pin.done{background:#2fa35a;box-shadow:0 0 0 4px #2fa35a;animation:none}
.plabel{position:absolute;background:#fffaf0;border:4px solid #e3b45a;border-radius:16px;padding:2px 14px;font-size:28px;font-weight:800;white-space:nowrap;z-index:4;transform:translate(-50%,40px);box-shadow:0 4px 0 rgba(0,0,0,.12)}
.qbub{position:absolute;background:#fff;border:5px solid #5fa8ff;border-radius:30px;padding:16px 26px;font-size:38px;font-weight:700;line-height:1.4;box-shadow:0 8px 0 rgba(0,0,0,.12)}
.qbub .ans{margin-top:10px;padding-top:10px;border-top:3px dashed #9cc4f5;color:#1d7a40;display:none}
.qbub.on .ans{display:block;animation:pop .4s}
.qbub .rv{display:inline-block;margin-top:8px;font-size:26px;border:3px solid #5fa8ff;background:#eaf3ff;color:#2a5ea8;border-radius:14px;padding:0 16px}
.qbub.on .rv{display:none}
/* steps */
.steps{position:absolute;display:flex;flex-direction:column;gap:14px}
.step{display:flex;align-items:center;gap:16px;background:#fff;border:5px solid #9cc4f5;border-radius:26px;padding:10px 20px;font-size:36px;font-weight:700;line-height:1.35;box-shadow:0 6px 0 rgba(0,0,0,.1);transition:opacity .4s,transform .4s}
.step .sn{width:58px;height:58px;flex:none;border-radius:50%;background:#5fa8ff;color:#fff;display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:800}
.step.hid{opacity:0;transform:translateY(16px)}
/* mcq */
.opts{position:absolute;display:grid;grid-template-columns:1fr 1fr;gap:22px}
.opt{display:flex;align-items:center;gap:16px;border:5px solid #2b3a55;border-radius:28px;padding:16px 22px;font-size:40px;font-weight:800;color:#fff;text-align:start;box-shadow:0 8px 0 rgba(0,0,0,.2);min-height:120px;line-height:1.3}
.opt .sh{font-size:40px;width:60px;flex:none;text-align:center;opacity:.9}
.opt.o0{background:#e8586a}.opt.o1{background:#4f8fdf}.opt.o2{background:#e7a92d}.opt.o3{background:#3fa66a}
.opt.okc{background:#2fa35a!important;color:#fff;outline-color:#fff}
.opt.noc{background:#9aa3b5!important;color:#fff}
.opt.dim{opacity:.35}
.qcard{position:absolute;left:50%;transform:translateX(-50%);background:#fff;border:6px solid #2b3a55;border-radius:34px;padding:22px 34px;text-align:center;font-size:48px;font-weight:800;line-height:1.4;box-shadow:0 10px 0 rgba(0,0,0,.15)}
.why{position:absolute;left:50%;transform:translateX(-50%);background:#e8f8ee;border:4px solid #2fa35a;border-radius:22px;padding:8px 24px;font-size:30px;font-weight:700;color:#1d6b3a;display:none;max-width:1300px;text-align:center}
.why.on{display:block;animation:pop .4s}
/* tf */
.tfbtn{width:96px;height:80px;border-radius:22px;border:5px solid #2b3a55;font-size:46px;font-weight:900;background:#fff}
.tfbtn.t{color:#1d7a40}.tfbtn.f{color:#c22d40}
/* match */
.mcol{position:absolute;display:flex;flex-direction:column;gap:16px}
.mitem{background:#fff;border:5px solid #9cc4f5;border-radius:24px;padding:10px 18px;font-size:34px;font-weight:800;text-align:center;box-shadow:0 6px 0 rgba(0,0,0,.1);min-height:84px;display:flex;align-items:center;justify-content:center;line-height:1.3}
.mitem.sel{outline:6px solid #ffb703;outline-offset:3px}
.mitem.m0{background:#ffe1e5;border-color:#e8798a}.mitem.m1{background:#dcecff;border-color:#6aa2e8}.mitem.m2{background:#fff1c9;border-color:#e2b13c}.mitem.m3{background:#dff3e0;border-color:#5fb873}.mitem.m4{background:#ece4ff;border-color:#9b84e6}.mitem.m5{background:#ffe6d5;border-color:#f0965f}
svg.lines{position:absolute;inset:0;pointer-events:none;z-index:1}
/* order */
.olist{position:absolute;display:flex;flex-direction:column;gap:14px}
.oitem{display:flex;align-items:center;gap:16px;background:#fff;border:5px solid #c9b6f2;border-radius:24px;padding:8px 18px;font-size:36px;font-weight:700;box-shadow:0 6px 0 rgba(0,0,0,.1);cursor:pointer;line-height:1.3}
.oitem .on{width:56px;height:56px;flex:none;border-radius:16px;background:#9b84e6;color:#fff;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:800}
.oitem.sel{outline:6px solid #ffb703;outline-offset:3px}
.chk{position:absolute;left:50%;transform:translateX(-50%);border:5px solid #2b3a55;background:#ffcb3d;border-radius:22px;padding:6px 40px;font-size:36px;font-weight:800;box-shadow:0 6px 0 rgba(0,0,0,.2)}
/* fill */
.ftext{position:absolute;left:50%;transform:translateX(-50%);background:#fff;border:6px solid #2b3a55;border-radius:30px;padding:26px 36px;font-size:46px;font-weight:700;line-height:2;text-align:center;box-shadow:0 10px 0 rgba(0,0,0,.15)}
.blank{display:inline-block;min-width:200px;border-bottom:5px dashed #5fa8ff;color:#2a5ea8;text-align:center;padding:0 10px;cursor:pointer;line-height:1.4}
.blank.okc{border-bottom-color:#2fa35a;outline:0!important;background:none!important;color:#1d7a40}
.bank{position:absolute;left:50%;transform:translateX(-50%);display:flex;flex-wrap:wrap;gap:16px;justify-content:center}
.chip{background:#fff1c9;border:5px solid #e2b13c;border-radius:22px;padding:6px 22px;font-size:36px;font-weight:800;box-shadow:0 6px 0 rgba(0,0,0,.12)}
.chip.sel{outline:6px solid #5fa8ff;outline-offset:3px}
.chip.used{opacity:.3;pointer-events:none}
/* memory */
.mem{position:absolute;display:grid;gap:18px}
.mcard{perspective:900px;cursor:pointer}
.mcard .in{position:relative;width:100%;height:100%;transition:transform .6s;transform-style:preserve-3d}
.mcard.f .in,.mcard.done .in{transform:rotateY(180deg)}
.mcard .fr,.mcard .bk{position:absolute;inset:0;backface-visibility:hidden;border-radius:24px;border:5px solid #2b3a55;display:flex;align-items:center;justify-content:center;text-align:center;padding:8px;box-shadow:0 6px 0 rgba(0,0,0,.15)}
.mcard .fr{background:repeating-linear-gradient(45deg,#5fa8ff 0 18px,#79b8ff 18px 36px);font-size:60px;color:#fff}
.mcard .bk{background:#fff;transform:rotateY(180deg);font-size:30px;font-weight:800;line-height:1.3}
.mcard.done .bk{background:#e3f6e8;border-color:#2fa35a}
/* wheel */
.wheelw{position:absolute;width:600px;height:600px}
.wheel{width:100%;height:100%;border-radius:50%;border:10px solid #2b3a55;transition:transform 4s cubic-bezier(.15,.85,.25,1);box-shadow:0 12px 0 rgba(0,0,0,.18)}
.wptr{position:absolute;top:-24px;left:50%;margin-left:-28px;width:0;height:0;border-left:28px solid transparent;border-right:28px solid transparent;border-top:60px solid #e8414f;z-index:3;filter:drop-shadow(0 4px 0 rgba(0,0,0,.25))}
.whub{position:absolute;top:50%;left:50%;width:120px;height:120px;margin:-60px;border-radius:50%;background:#ffcb3d;border:8px solid #2b3a55;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:900;cursor:pointer;z-index:2}
/* race */
.track{position:absolute;left:60px;right:60px;display:flex;flex-direction:column;gap:12px}
.lane{position:relative;height:78px;border-radius:40px;background:#fff;border:5px solid #2b3a55;overflow:hidden;cursor:pointer}
.lane .fill{position:absolute;top:0;bottom:0;right:0;transition:width .8s}
.lane .car{position:absolute;top:50%;transform:translate(50%,-50%) scaleX(-1);font-size:56px;transition:right .8s}
.lane .nm{position:absolute;top:50%;right:20px;transform:translateY(-50%);font-size:28px;font-weight:800;z-index:2;mix-blend-mode:multiply}
.lane .fin{position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:46px}
.lane.turn{outline:6px solid #ffb703;outline-offset:3px}
/* boxes */
.boxes{position:absolute;display:grid;gap:22px}
.gbox{position:relative;border-radius:26px;border:5px solid #2b3a55;box-shadow:0 8px 0 rgba(0,0,0,.18);cursor:pointer;display:flex;align-items:center;justify-content:center;text-align:center;padding:12px;font-size:32px;font-weight:800;line-height:1.35;transition:transform .3s}
.gbox .lid{position:absolute;inset:0;border-radius:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:64px;transition:transform .6s,opacity .6s;z-index:2}
.gbox .lid small{font-size:34px;color:#fff;font-weight:800}
.gbox.open .lid{transform:translateY(-60px) rotate(-12deg);opacity:0;pointer-events:none}
.gbox .a{display:none;color:#1d7a40;margin-top:6px}
.gbox.ans .a{display:block}
/* mind map */
.mm{position:absolute;inset:0}
.mm .center{position:absolute;left:50%;top:520px;transform:translate(-50%,-50%);width:360px;min-height:150px;border-radius:50%;background:#ffcb3d;border:7px solid #2b3a55;display:flex;align-items:center;justify-content:center;text-align:center;font-size:44px;font-weight:900;padding:20px;box-shadow:0 10px 0 rgba(0,0,0,.18);z-index:2}
.mm .br{position:absolute;transform:translate(-50%,-50%);width:400px;padding:14px 18px;font-size:32px;font-weight:700;text-align:center;line-height:1.35;cursor:pointer;z-index:2}
.mm .br.closed{color:transparent}
.mm .br.closed:after{content:"؟";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#2b3a55;font-size:54px}
/* compare */
.cmp{position:absolute;display:flex;gap:30px}
.cmp .side{flex:1;padding:20px 26px}
.cmp .side h3{margin:0 0 10px;font-size:44px;text-align:center}
.cmp .side li{font-size:34px;font-weight:700;line-height:1.5;margin:6px 0;list-style:none;transition:opacity .4s}
.cmp .side li.hid{opacity:0}
.cmp .side li:before{content:"◆ ";color:rgba(0,0,0,.35)}
/* flip */
.flips{position:absolute;display:grid;gap:26px}
.flip{perspective:1000px;cursor:pointer}
.flip .in{position:relative;width:100%;height:100%;transition:transform .7s;transform-style:preserve-3d}
.flip.f .in{transform:rotateY(180deg)}
.flip .fr,.flip .bk{position:absolute;inset:0;backface-visibility:hidden;border-radius:30px;border:6px solid;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:16px;box-shadow:0 8px 0 rgba(0,0,0,.14)}
.flip .fr .e{font-size:84px}.flip .fr .t{font-size:44px;font-weight:900;line-height:1.25}.flip .fr .en2{font-size:30px;color:#3b4f72;font-weight:700;direction:ltr}
.flip .bk{transform:rotateY(180deg);background:#fff;font-size:34px;font-weight:700;line-height:1.45}
/* timer (try) */
.timer{position:absolute;width:250px;height:250px}
.timer svg{width:100%;height:100%;transform:rotate(-90deg)}
.timer .tv{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:62px;font-weight:900}
.timer .tv small{font-size:22px}
.timer button{position:absolute;bottom:-62px;left:50%;transform:translateX(-50%);border:4px solid #2b3a55;border-radius:16px;background:#ffcb3d;font-size:26px;font-weight:800;padding:2px 22px;white-space:nowrap}
/* exit ticket */
.exit{position:absolute;display:flex;gap:26px}
.exit .xc{flex:1;padding:22px;text-align:center;cursor:pointer}
.exit .xc .k{font-size:90px;font-weight:900;line-height:1}
.exit .xc .p{font-size:34px;font-weight:800;line-height:1.4;margin-top:8px}
/* homework */
.hwc{position:absolute;left:50%;transform:translateX(-50%) rotate(-1deg);width:1080px;background:#fffef6;border:6px solid #2b3a55;border-radius:20px;padding:30px 50px 34px;box-shadow:0 12px 0 rgba(0,0,0,.18);background-image:repeating-linear-gradient(transparent 0 62px,#cfe3f3 62px 64px)}
.hwc h3{margin:0 0 6px;font-size:50px;color:#d6344f}
.hwc li{font-size:38px;font-weight:700;line-height:64px}
.hwc .pin2{position:absolute;top:-28px;left:50%;font-size:56px;transform:translateX(-50%)}
.mascot{position:absolute;width:300px;height:300px;pointer-events:none}
.mascot svg{width:100%;height:100%;overflow:visible}
.say{position:absolute;background:#fff;border:5px solid #2b3a55;border-radius:28px;padding:10px 22px;font-size:32px;font-weight:800;line-height:1.35;box-shadow:0 6px 0 rgba(0,0,0,.14)}
.periodcard{position:absolute;left:50%;top:210px;transform:translateX(-50%);width:1000px;text-align:center;padding:36px}
.periodcard .pn{font-size:100px;font-weight:900;color:#d6344f;line-height:1.1}
.periodcard .ax{font-size:44px;font-weight:800;margin-top:12px;line-height:1.35}

/* live web editor (R.web, G10) */
.webed,.webpv{position:absolute;border-radius:22px;overflow:hidden;box-shadow:0 10px 0 rgba(0,0,0,.14);display:flex;flex-direction:column;z-index:4}
.webed{background:#1f2433;border:5px solid #3b4566}
.webpv{background:#fff;border:5px solid var(--gold);transition:all .35s}
.webpv.big{left:50px!important;width:1500px!important;z-index:9}
.webed .bar,.webpv .bar{display:flex;align-items:center;gap:14px;padding:8px 16px;font-size:24px;font-weight:700}
.webed .bar{background:#2c3349;color:#c9d3f0}.webpv .bar{background:#f2ece0;color:#5b6782}
.webed .dots i{display:inline-block;width:14px;height:14px;border-radius:50%;margin-left:6px;background:#ff6b6b}.webed .dots i:nth-child(2){background:#ffd166}.webed .dots i:nth-child(3){background:#6ccf8e}
.webed .fn{direction:ltr;font-family:Consolas,'Courier New',monospace;color:#ffd166}.webed .lb,.webpv .lb{margin-inline-start:auto;white-space:nowrap}
.webpv .url{flex:1;direction:ltr;text-align:left;background:#fff;border-radius:14px;padding:2px 14px;font-size:20px;font-family:Consolas,'Courier New',monospace;color:#3b4566;overflow:hidden;white-space:nowrap}
.webed textarea{flex:1;width:100%;border:0;outline:0;resize:none;background:transparent;color:#e8edff;caret-color:#ffd166;font:600 25px/1.45 Consolas,'Courier New',monospace;padding:14px 18px;direction:ltr;text-align:left;white-space:pre;tab-size:2}
.webpv iframe{flex:1;width:100%;border:0;background:#fff}
.webbt{position:absolute;display:flex;gap:14px;z-index:5}
.webbt button{font:700 24px 'Baloo Bhaijaan 2',sans-serif;padding:4px 22px;border-radius:18px;border:4px solid #3b4566;background:#fffaf0;color:#2c3349;cursor:pointer;box-shadow:0 5px 0 rgba(0,0,0,.12)}
.webbt button.sol{border-color:#e2b13c;background:#fff4d6}
/* ===== deck2 additions ===== */
.dots{position:absolute;bottom:22px;left:50%;transform:translateX(-50%);display:flex;gap:12px;z-index:6}
.dots i{width:22px;height:22px;border-radius:50%;background:#fff;border:4px solid #2b3a55;transition:.3s}
.dots i.c{background:#ffcb3d;transform:scale(1.35)}
.dots i.d{background:#6ccf8e}
.qn{font-size:24px;color:#5b6782;font-weight:700;margin-bottom:4px}
.askb{min-height:260px;line-height:1.45;padding:26px 40px;display:flex;flex-direction:column;justify-content:center}
.askb .ans{font-size:.9em}
.blank.qb{display:inline-block;min-width:150px;border-bottom:6px solid #e2b13c;color:#c0902c;padding:0 14px;margin:0 6px}
.blank.qb.okc{color:#1d7a40;border-color:#2fa35a;background:#e9fbef;border-radius:12px}
.readc{position:absolute;background:#fffdf6;border:5px solid #e2b13c;border-radius:30px;padding:24px 40px 24px;box-shadow:0 8px 0 rgba(0,0,0,.12);line-height:1.7;font-weight:600;max-height:690px;overflow:hidden}
.readc p{margin:0 0 12px;transition:opacity .4s,background .4s;border-radius:14px;padding:2px 10px}
.readc p.dim2{opacity:.28}
.readc p.cur{background:#fff3c4}
.readc.listen p.dim2{opacity:1;filter:blur(9px)}
.readc.quran{font-family:'Amiri','Noto Naskh Arabic',serif;line-height:2}

<script>/* Illustrated full-bleed backdrops for the ICT decks (1600x900 SVG, cartoon style).
   SCENES[key]() returns an <svg> string. Keys: lab, library, city, space, workshop, office, playground, toyroom (the last two for grades 1-4).
   Every scene keeps its middle area calm so the slide cards stay readable. */
(function(){
const O='#2b3a55';            // outline colour
function rng(seed){let s=seed;return()=>{s=(s*16807)%2147483647;return (s-1)/2147483646}}
function svg(body,defs){return `<svg class="scene" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg"><defs>${defs||''}</defs>${body}</svg>`}
function cloud(x,y,s,o){o=o==null?1:o;return `<g transform="translate(${x} ${y}) scale(${s})" opacity="${o}"><path d="M0 40q0-26 30-26q8-22 36-22q30 0 38 26q28-2 30 22q0 22-26 22H22Q0 62 0 40z" fill="#fff" stroke="#cfe3f3" stroke-width="3"/></g>`}
function palm(x,y,s){return `<g transform="translate(${x} ${y}) scale(${s})"><path d="M0 0q6-60 2-120" stroke="#8a6a45" stroke-width="10" fill="none" stroke-linecap="round"/><g fill="#5fae6e" stroke="#3d7f4c" stroke-width="3"><path d="M2-120q-50-20-80 10q40-8 80-10z"/><path d="M2-120q-30-45-70-40q40 12 70 40z"/><path d="M2-120q20-50 66-42q-40 10-66 42z"/><path d="M2-120q50-14 78 16q-40-10-78-16z"/></g></g>`}
function plant(x,y,s){return `<g transform="translate(${x} ${y}) scale(${s})"><path d="M-45 0h90l-12 70h-66z" fill="#e9eef5" stroke="${O}" stroke-width="5"/><path d="M-50-6h100v12h-100z" fill="#d7dfea" stroke="${O}" stroke-width="5"/><g fill="#6cc07a" stroke="#3f8a4f" stroke-width="4"><path d="M0-6q-70-40-60-120q40 50 60 120z"/><path d="M0-6q60-50 80-110q10 70-80 110z"/><path d="M0-6q-10-90 20-150q20 80-20 150z"/><path d="M0-6q-80-10-110-60q70-10 110 60z"/></g></g>`}
function monitor(x,y,s,c){c=c||'#4fa3e0';return `<g transform="translate(${x} ${y}) scale(${s})"><rect x="-90" y="-130" width="180" height="120" rx="12" fill="#27354f" stroke="${O}" stroke-width="5"/><rect x="-78" y="-118" width="156" height="96" rx="6" fill="${c}"/><g stroke="#fff" stroke-width="6" stroke-linecap="round" opacity=".85"><path d="M-62-100h50M-62-82h80M-62-64h36M-62-46h64"/></g><path d="M-14-10h28l8 26h-44z" fill="#9aa8bf" stroke="${O}" stroke-width="5"/><rect x="-50" y="14" width="100" height="10" rx="5" fill="#9aa8bf" stroke="${O}" stroke-width="4"/></g>`}
function desk(x,y,w){return `<g><rect x="${x}" y="${y}" width="${w}" height="26" rx="8" fill="#c98f5a" stroke="${O}" stroke-width="5"/><rect x="${x+20}" y="${y+26}" width="18" height="140" fill="#a8743f" stroke="${O}" stroke-width="5"/><rect x="${x+w-38}" y="${y+26}" width="18" height="140" fill="#a8743f" stroke="${O}" stroke-width="5"/></g>`}
function robot(x,y,s){return `<g class="robot" transform="translate(${x} ${y}) scale(${s})"><path d="M0-200v-26" stroke="${O}" stroke-width="6"/><circle cx="0" cy="-232" r="10" fill="#ff7a8a" stroke="${O}" stroke-width="5"/><rect x="-70" y="-200" width="140" height="110" rx="34" fill="#e7f2ff" stroke="${O}" stroke-width="6"/><rect x="-50" y="-178" width="100" height="62" rx="22" fill="#27354f"/><circle cx="-20" cy="-148" r="10" fill="#7ef0ff"/><circle cx="20" cy="-148" r="10" fill="#7ef0ff"/><path d="M-12-128q12 10 24 0" stroke="#7ef0ff" stroke-width="5" fill="none" stroke-linecap="round"/><rect x="-56" y="-84" width="112" height="90" rx="26" fill="#cfe6ff" stroke="${O}" stroke-width="6"/><circle cx="0" cy="-40" r="16" fill="#ffd166" stroke="${O}" stroke-width="5"/><path d="M-56-60q-40 10-46 44M56-60q40 10 46 44" stroke="${O}" stroke-width="10" fill="none" stroke-linecap="round"/><circle cx="-102" cy="-12" r="12" fill="#ffd166" stroke="${O}" stroke-width="5"/><circle cx="102" cy="-12" r="12" fill="#ffd166" stroke="${O}" stroke-width="5"/><rect x="-40" y="6" width="26" height="30" rx="8" fill="#9fb3d1" stroke="${O}" stroke-width="5"/><rect x="14" y="6" width="26" height="30" rx="8" fill="#9fb3d1" stroke="${O}" stroke-width="5"/></g>`}
function floorTiles(y0,c1,c2,line){let s=`<rect x="0" y="${y0}" width="1600" height="${900-y0}" fill="url(#fl)"/>`;for(let i=-10;i<=10;i++){s+=`<path d="M${800+i*40} ${y0} L${800+i*260} 900" stroke="${line}" stroke-width="2" opacity=".55"/>`}let yy=y0;for(let k=1;k<7;k++){yy+=k*9;s+=`<path d="M0 ${yy}H1600" stroke="${line}" stroke-width="2" opacity=".5"/>`}return `<defs><linearGradient id="fl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${c1}"/><stop offset="1" stop-color="${c2}"/></linearGradient></defs>`+s}
function skyline(y,col,seed){const r=rng(seed);let s='';let x=-20;while(x<1620){const w=50+r()*80,h=60+r()*140;s+=`<rect x="${x}" y="${y-h}" width="${w}" height="${h}" fill="${col}"/>`;x+=w+4}
  // omani fort tower + dome + minaret
  s+=`<g fill="${col}"><rect x="300" y="${y-210}" width="90" height="210"/><path d="M295 ${y-210}h100v-14h-14v8h-14v-8h-14v8h-14v-8h-14v8h-14v-8h-16z"/><path d="M1120 ${y-150}a70 70 0 0 1 140 0z"/><rect x="1120" y="${y-150}" width="140" height="150"/><rect x="1290" y="${y-260}" width="24" height="260"/><path d="M1286 ${y-260}l16-40l16 40z"/></g>`;return s}
function sun(x,y,r){return `<g><circle cx="${x}" cy="${y}" r="${r+30}" fill="#fff3b0" opacity=".45"/><circle cx="${x}" cy="${y}" r="${r}" fill="#ffd75e" stroke="#f2b632" stroke-width="5"/></g>`}

const S={};

S.lab=()=>svg(`

${desk(-40,690,430)}${monitor(90,690,.95,'#5cc0e8')}${monitor(290,690,.85,'#8b7cf0')}
${desk(1210,690,430)}${monitor(1330,690,.95,'#6ccf8e')}${monitor(1510,690,.85,'#f39a6b')}
${plant(470,800,.9)}
<g transform="translate(1440 120)"><circle r="44" fill="#fff" stroke="${O}" stroke-width="6"/><path d="M0 0V-26M0 0l18 12" stroke="${O}" stroke-width="6" stroke-linecap="round"/></g>
`,`<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7cc8ff"/><stop offset="1" stop-color="#dff3ff"/></linearGradient>`);

/* 2. Library / writing room: shelves of books on both sides, central window, rug */
function shelf(x,y,w,seed){const r=rng(seed);const cols=['#e86f7c','#5aa0e6','#f2c14e','#66c08a','#a58be8','#f39a6b','#4fc2c2'];let s=`<rect x="${x}" y="${y}" width="${w}" height="16" fill="#a8743f" stroke="${O}" stroke-width="4"/>`;let xx=x+8;while(xx<x+w-30){const bw=18+r()*16,bh=70+r()*40,c=cols[Math.floor(r()*cols.length)];s+=`<rect x="${xx}" y="${y-bh}" width="${bw}" height="${bh}" rx="3" fill="${c}" stroke="${O}" stroke-width="3"/><rect x="${xx+4}" y="${y-bh+12}" width="${bw-8}" height="6" fill="#fff" opacity=".6"/>`;xx+=bw+3;if(r()<.12){s+=`<rect x="${xx}" y="${y-30}" width="60" height="30" rx="4" fill="${cols[Math.floor(r()*7)]}" stroke="${O}" stroke-width="3"/>`;xx+=66}}return s}

<g transform="translate(140 760)"><path d="M0 0l70-26l-30 40z" fill="#fff" stroke="${O}" stroke-width="4"/></g><g transform="translate(1420 740) scale(-1 1)"><path d="M0 0l70-26l-30 40z" fill="#fff" stroke="${O}" stroke-width="4"/></g>

function bld(x,w,h,c,seed){const r=rng(seed);let s=`<rect x="${x}" y="${720-h}" width="${w}" height="${h}" rx="6" fill="${c}" stroke="${O}" stroke-width="5"/>`;for(let yy=720-h+22;yy<700;yy+=34)for(let xx=x+14;xx<x+w-24;xx+=30)s+=`<rect x="${xx}" y="${yy}" width="16" height="20" rx="3" fill="${r()<.5?'#fff6c8':'#d9ecff'}" stroke="${O}" stroke-width="2"/>`;return s}

const stage=$('#stage');let W=null;
function fit(){const k=Math.min(innerWidth/1600,innerHeight/900);stage.style.transform=`scale(${k})`}
function go(i,dir){if(i<0||i>=FLAT.length)return;if(W&&W._cleanup)W._cleanup();cur=i;try{localStorage.setItem(D.store+'-pos',i)}catch(e){}
  const {L,s}=FLAT[i];stage.innerHTML='';const theme=s.scene||L.theme||'lab';stage.insertAdjacentHTML('beforeend',(SC[theme]||SC.lab)());
  W=el('div','slide in');stage.append(W);const f=R[s.type]||R.text;try{f(s,L,W)}catch(err){W.innerHTML=`<div class="panel" style="top:300px">⚠️ ${esc(err.message)}</div>`;console.error(err)}
  $('#count').textContent=(i+1)+' / '+FLAT.length;$('#note').textContent=s.note||'';
  $('#prev').style.visibility=i?'visible':'hidden';$('#next').style.visibility=i<FLAT.length-1?'visible':'hidden'}
function next(){if(W&&W._step&&W._step())return;go(cur+1)}
function prev(){go(cur-1)}
$('#next').onclick=next;$('#prev').onclick=prev;
addEventListener('keydown',e=>{if($('#menu').classList.contains('on')){if(e.key==='Escape')$('#menu').classList.remove('on');return}
  const FW=LANG==='en'?'ArrowRight':'ArrowLeft',BW=LANG==='en'?'ArrowLeft':'ArrowRight';if([FW,'PageDown',' ','Enter'].includes(e.key)){e.preventDefault();next()}else if([BW,'PageUp','Backspace'].includes(e.key)){e.preventDefault();prev()}else if(e.key==='Home')go(0);else if(e.key.toLowerCase()==='f')fs();else if(e.key.toLowerCase()==='n')$('#note').classList.toggle('on');else if(e.key.toLowerCase()==='m')openMenu()});
function fs(){if(!document.fullscreenElement)document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen();else document.exitFullscreen()}
function openMenu(){const m=$('#menu');const box=m.querySelector('.mbox');const curL=FLAT[cur].L.id;let h=`<h2>${esc(D.title)}</h2><div class="msub">${esc(D.sub||'')} · اختر الدرس أو الحصة</div>`;
  D.units.forEach(u=>{const ls=D.lessons.filter(l=>l.unit===u.id);if(!ls.length)return;h+=`<div class="unit">${esc(u.name)}</div><div class="lgrid">`;ls.forEach(l=>{h+=`<div class="les${l.id===curL?' cur':''}"><b data-i="${LSTART[l.id]}">${l.emo||'📘'} ${fmt(l.title)}</b><div class="ps">${PSTART[l.id].map(p=>`<button data-i="${p.i}">الحصة ${p.n}</button>`).join('')}</div></div>`});h+='</div>'});
  h+=`<div class="tools"><button id="tFs">⛶ ملء الشاشة (F)</button><button id="tMute">${muted?'🔇 الصوت مغلق':'🔊 الصوت يعمل'}</button><button id="tNote">📝 ملاحظة المعلم (N)</button><button id="tClose">✕ إغلاق</button></div>`;box.innerHTML=h;
  box.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{m.classList.remove('on');go(+b.dataset.i)});box.querySelector('#tFs').onclick=fs;box.querySelector('#tClose').onclick=()=>m.classList.remove('on');box.querySelector('#tNote').onclick=()=>{$('#note').classList.toggle('on');m.classList.remove('on')};box.querySelector('#tMute').onclick=e=>{muted=!muted;try{localStorage.setItem('ictdeck-mute',muted?'1':'0')}catch(x){}e.target.textContent=muted?'🔇 الصوت مغلق':'🔊 الصوت يعمل'};m.classList.add('on')}
$('#menuBtn').onclick=openMenu;$('#menu').onclick=e=>{if(e.target.id==='menu')$('#menu').classList.remove('on')};
addEventListener('resize',fit);fit();go(cur);
window.__deck={go,FLAT,count:()=>FLAT.length};
