e energy."}, {"q": "What things could you do to help protect the environment?", "a": "I could recycle plastic and switch off lights."}, {"q": "What things can we recycle at home?", "a": "Plastic bottles, cans, paper and glass."}, {"q": "Report it: Amjed said, 'Be careful!'", "a": "Amjed told the children to be careful."}], "icon": "🎡"}, {"type": "memory", "title": "Memory: story words", "pairs": [["conveyor belt", "➡️📦"], ["crushing machine", "⚙️💥"], ["magnet", "🧲"], ["camera", "📷"], ["recycle", "♻️"], ["worker", "👷"]], "icon": "🧠"}, {"type": "balloons", "title": "Pop the right answer!", "rounds": [{"q": "The worker's name is …", "o": ["Amjed", "Zaid", "Khalid"], "a": 0}, {"q": "The crushing machine crushes the plastic into …", "o": ["big boxes", "very small pieces", "bottles"], "a": 1}, {"q": "Zaid dropped his …", "o": ["bag", "camera", "phone"], "a": 1}], "icon": "🎈"}, {"type": "balloons", "title": "Pop the right answer!", "rounds": [{"q": "A magnet picks up …", "o": ["plastic", "metal", "paper"], "a": 1}, {"q": "Amjed told Zaid ___ worry.", "o": ["not to", "to", "don't"], "a": 0}, {"q": "We should all ___ to protect the environment.", "o": ["recycle", "waste", "destroy"], "a": 0}], "icon": "🎈"}, {"type": "steps", "title": "Let's remember!", "icon": "🧠", "steps": ["Recycling centre: conveyor belts sort plastic → crushing machine → small pieces → recycled.", "Magnets pick up metal, but not plastic.", "Zaid: 'I should be more careful!' · Amjed: 'We should all recycle!'"]}, {"type": "exit", "title": "Exit ticket", "items": [{"k": "3", "text": "What do conveyor belts do?"}, {"k": "2", "text": "How did Amjed save Zaid's camera?"}, {"k": "1", "text": "Write one thing you will recycle this week."}], "icon": "🎟️"}, {"type": "homework", "title": "Homework", "head": "My homework", "items": ["Tell this story to a friend or family member.", "Make a poster: 'How plastic is recycled' in 4 steps.", "Graded reader activities CB p. 107."], "icon": "🏠"}]}, {"id": "L16", "unit": "U3", "unitName": "Unit 2: Adventure sports", "title": "Vocabulary: Extreme sports", "code": "", "theme": "library", "emo": "🪂", "slides": [{"type": "cover", "say": "Unit 2 · Lesson 1 – Vocabulary: extreme sports"}, {"type": "goals", "title": "Today's goals", "items": ["I can name 12 extreme sports.", "I can read a blog about extreme sports."], "icon": "🎯"}, {"type": "goals", "title": "Today's goals", "items": ["I can classify sports: water, high up, with wheels …", "I can talk about sports I have done and want to try."], "icon": "🎯"}, {"type": "build", "title": "Unscramble the sport!", "mode": "letters", "items": [{"a": "diving", "hint": "you swim under the sea", "emo": "🤿"}, {"a": "caving", "hint": "you go into a cave under the ground", "emo": "🔦"}, {"a": "surfboarding", "hint": "you ride big waves on a board", "emo": "🏄"}, {"a": "paragliding", "hint": "you fly in the sky with a big wing", "emo": "🪂"}, {"a": "sandboarding", "hint": "you go down sand dunes on a board", "emo": "🏜️"}], "icon": "🔤"}, {"type": "ask", "title": "The WOW! question", "qs": [{"q": "How many extreme sports can you see on the Welcome page?", "a": "rock climbing, diving, go-karting, water skiing, sandboarding, horse riding, paragliding, motor racing …"}, {"q": "What places can you see?", "a": "the sea, mountains, the desert, a cave, a race track …"}, {"q": "Eric asks: What are the advantages of extreme sports?", "a": "They are exciting and fun, you feel proud and brave, you get fit and learn new skills."}, {"q": "… and the disadvantages?", "a": "They can be dangerous, you can hurt yourself, you need expensive equipment."}], "img": "L16_c1", "icon": "❓"}, {"type": "flip", "title": "Extreme sports (1)", "cards": [{"front": "paragliding", "icon": "🪂", "back": "flying with a big wing (picture 1)\n«Paragliding is exciting but scary.»"}, {"front": "go-karting", "icon": "🛞", "back": "driving a small, fast car (picture 2)\n«I went go-karting with my friends.»"}, {"front": "rock climbing", "icon": "🧗", "b rts centre. I love the feeling of going higher and higher and higher! It's so exciting and I know the [[ropes]] will keep me safe if I fall."], "img": "L16_c3", "icon": "📖"}, {"type": "read", "title": "The WOW! Blog", "paras": ["Rosie: I don't really like extreme sports. They're too [[dangerous]]. The extreme sport that I've tried is horse riding. At first, I was scared because the horse looked so big. But when I got on, I wasn't scared at all! I was [[proud]] of myself for being [[brave]]."], "img": "L16_c3", "icon": "📖"}, {"type": "read", "title": "The WOW! Blog", "paras": ["Ali: Last summer, we had the best holiday of our lives. My brother tried water skiing, surfboarding and paragliding! I had my first diving lesson. It was a bit difficult, but I loved the feeling of being [[underwater]]. I can't wait to go again."], "img": "L16_c3", "icon": "📖"}, {"type": "quiz", "title": "Who is it?", "qs": [{"q": "Who doesn't usually like extreme sports?", "o": ["Eric", "Rosie", "Manar"], "a": 1, "why": "I don't really like extreme sports. They're too dangerous."}, {"q": "Who went go-karting last weekend?", "o": ["Ali", "Manar", "Eric"], "a": 2, "why": "Last weekend, I went go-karting with my friends."}, {"q": "Why does Manar feel safe when she climbs?", "o": ["The ropes keep her safe.", "She never falls.", "Her teacher holds her."], "a": 0, "why": "I know the ropes will keep me safe if I fall."}, {"q": "Why was Rosie scared at first?", "o": ["The horse was fast.", "The horse looked so big.", "She fell off."], "a": 1, "why": "the horse looked so big"}, {"q": "Which sport did Ali try?", "o": ["diving", "paragliding", "water skiing"], "a": 0, "why": "I had my first diving lesson."}], "img": "L16_c3", "icon": "👀"}, {"type": "sort", "title": "Where do we do them?", "bins": [{"label": "in water", "icon": "💧"}, {"label": "up high", "icon": "⛰️"}, {"label": "with wheels", "icon": "🛞"}], "cards": [{"text": "diving", "icon": "", "bin": 0}, {"text": "surfboarding", "icon": "", "bin": 0 ng", "🏄"], ["paragliding", "🪂"]], "icon": "🧠"}, {"type": "race", "title": "Sports race", "qs": [{"q": "You go down a cliff on a rope. It's …", "options": ["caving", "diving", "abseiling"], "a": 2}, {"q": "Which is a water sport?", "options": ["water skiing", "horse riding", "go-karting"], "a": 0}, {"q": "Which sport needs a bike?", "options": ["paragliding", "mountain biking", "sandboarding"], "a": 1}, {"q": "Formula One is …", "options": ["motor racing", "rock climbing", "go-karting"], "a": 0}, {"q": "Rosie was ___ of herself for being brave.", "options": ["proud", "careful", "scared"], "a": 0}, {"q": "Sandboarding is an ___ sport.", "options": ["indoor", "individual", "team"], "a": 1}], "icon": "🏁"}, {"type": "summary", "title": "Let's remember!", "center": "Vocabulary: Extreme sports", "branches": ["Water sports: diving, surfboarding, water skiing.", "Up high: rock climbing, abseiling, paragliding.", "With wheels: go-karting, motor racing, mountain biking.", "Also: sandboarding, horse riding, caving.", "Extreme sports are exciting, but be careful and stay safe! ⛑️"], "icon": "🧠"}, {"type": "exit", "title": "Exit ticket", "items": [{"k": "3", "text": "Write three water sports."}, {"k": "2", "text": "Which sport do you do in a cave?"}, {"k": "1", "text": "Write one sentence about a sport you would like to try and why."}], "icon": "🎟️"}, {"type": "homework", "title": "Homework", "head": "My homework", "items": ["Activity Book p. 26: Activities 1–4.", "Activity 4: write five sentences about other sports – where do you do them and who with?", "Learn to spell the 12 extreme sports."], "icon": "🏠"}]}, {"id": "L17", "unit": "U3", "unitName": "Unit 2: Adventure sports", "title": "Team Talk 2: Are extreme sports too dangerous?", "code": "", "theme": "library", "emo": "🩹", "slides": [{"type": "cover", "say": "Unit 2 · Lesson 2 – WOW! Team Talk 2"}, {"type": "goals", "title": "Today's goals", "items": ["I can understand a dialogue about extreme sports.", "I can use: I suppose so. / I told you so! / Not really."], "icon": "🎯"}, {"type": "goals", "title": "Today's goals", "items": ["I can give my opinion: Should children do extreme sports?", "I can act out a short dialogue."], "icon": "🎯"}, {"type": "enter", "title": "Catch the EXTREME sports only.", "gate": "✓", "items": [{"text": "chess", "in": false}, {"text": "running", "in": false}, {"text": "sandboarding", "in": true}, {"text": "diving", "in": true}, {"text": "caving", "in": true}, {"text": "reading", "in": false}]}, {"type": "ask", "title": "Look and predict", "qs": [{"q": "Where are the boys?", "a": "At school, in the corridor."}, {"q": "What's wrong with Eric?", "a": "He hurt his arm. He fell when he was rock climbing."}, {"q": "What do you think the boys disagree about?", "a": "Are extreme sports too dangerous for children?"}], "img": "L17_c1", "icon": "🔮"}, {"type": "read", "title": "Team Talk 2 (part 1)", "paras": ["Ali: Oh no, Eric! What happened to you?", "Eric: I fell when I was rock climbing and I hurt myself.", "Ali: Poor you! But you know, I've always said that children shouldn't do extreme sports because they often hurt themselves. [[I told you so!]]"], "img": "L17_c2", "icon": "📖"}, {"type": "read", "title": "Team Talk 2 (part 1)", "paras": ["Eric: It's nothing [[serious]]. I'll be climbing again by next week. All sports can be dangerous, anyway. My sister fell over and cut herself when she was running last week and running isn't an extreme sport!"], "img": "L17_c2", "icon": "📖"}, {"type": "read", "title": "Team Talk 2 (part 1)", "paras": ["Ali: [[I suppose so.]] I don't want to stop you from enjoying yourself, but I just think that some sports are too dangerous for kids.", "Eric: [[Not really.]] I have a cousin who started sandboarding when he was four years old."], "img": "L17_c2", "icon": "📖"}, {"type": "read", "title": "Team Talk 2 (part 2)", "paras": ["Ali: That's too young. What if he hurts himself?", "Eric: He's never hurt himself! He always uses a [[helmet]] and wears special clothes. And his parents are always there. Anyway, it's just part of being a kid, isn't it? How can we learn about danger if we're always [[protected]] from everything?"], "img": "L17_c2", "icon": "📖"}, {"type": "read", "title": "Team Talk 2 (part 2)", "paras": ["Ali: Maybe you're right. Come on, let's go or we'll be late for PE.", "Eric: I can't do PE at the moment. It's so [[annoying]]. I'll just sit there and dream about rock climbing.", "Ali: That sounds like a good way to do an extreme sport without hurting yourself!"], "img": "L17_c2", "icon": "📖"}, {"type": "ask", "title": "Read again and answer", "qs": [{"q": "Why does Ali think children shouldn't do extreme sports?", "a": "Because they often hurt themselves."}, {"q": "How does Eric explain that all sports can be dangerous?", "a": "His sister fell over and cut herself when she was running – and running isn't an extreme sport!"}, {"q": "How does Eric's cousin stay safe when he's sandboarding?", "a": "He always uses a helmet, wears special clothes and his parents are always there."}, {"q": "Where is Ali going now?", "a": "To PE."}], "img": "L17_c1", "icon": "💭"}, {"type": "tf", "title": "True or False?", "items": [{"text": "Ali thinks extreme sports are good for children.", "a": false, "fix": "He thinks that children shouldn't do extreme sports."}, {"text": "Eric is sure that he can go rock climbing quite soon.", "a": true, "fix": "I'll be climbing again by next week."}, {"text": "Eric's cousin started go-karting when he was four.", "a": false, "fix": "He started sandboarding."}], "icon": "✔✘"}, {"type": "tf", "title": "True or False?", "items": [{"text": "Eric thinks that children need to learn about danger.", "a": true, "fix": "How can we learn about danger if we're always protected?"}, {"text": "Ali says that he doesn't want to go to PE.", "a": false, "fix": "Eric can't do PE; Ali says: let's go or we'll be late for PE."}], "icon": "✔✘"}, {"type": "quiz", "title": "Who said it? Complete", "icon": "✏️", "qs": [{"q": "Eric: I fell when I was ___ and I hurt myself.", "o": ["rock climbing", "running"], "a": 0}, {"q": "Eric: My sister fell over and cut herself when she was ___ last week!", "o": ["running", "diving"], "a": 0}, {"q": "Ali: I don't want to stop you from ___.", "o": ["enjoying yourself", "hurting yourself"], "a": 0}, {"q": "Ali: That's too young. What if he ___?", "o": ["hurts himself", "always uses"], "a": 0}, {"q": "Eric: He ___ a helmet and wears special clothes.", "o": ["always uses", "let's go"], "a": 0}, {"q": "Ali: Come on, ___ or we'll be late for PE.", "o": ["let's go", "running"], "a": 0}]}, {"type": "explain", "title": "Useful expressions", "icon": "🗣️", "lines": ["We use these expressions in conversations to react to what people say."], "rule": "I suppose so. = maybe yes · I told you so! = I was right · Not really. = no"}, {"type": "flip", "title": "Useful expressions 💬 – examples", "cards": [{"front": "A: Some sports are too dangerous. B: [[I suppose so.]]", "icon": "💡", "back": "I agree, but not 100% 🤔"}, {"front": "A: I hurt myself! B: [[I told you so!]]", "icon": "✨", "back": "I said this would happen ☝️"}, {"front": "A: Are you OK? B: [[Not really.]] I lost my helmet.", "icon": "🔎", "back": "No, not very much 😕"}]}, {"type": "match", "title": "Match the reply", "pairs": [["I tried mountain biking, but I hated it. Just like you said I would!", "I told you so!"], ["You don't like diving very much, do you?", "Not really."], ["You can hurt yourself playing any sport.", "I suppose so."]], "icon": "🧩"}, {"type": "quiz", "title": "Complete the dialogues", "icon": "✏️", "qs": [{"q": "A: Are you OK? B: ___ Someone took my cycling helmet today.", "o": ["Not really.", "I told you so!"], "a": 0}, {"q": "A: I've always said that you shouldn't leave it on your bike. ___", "o": ["I told you so!", "I suppose so."], "a": 0}, {"q": "A: You really have to be more careful. B: ___", "o": ["I suppose so.", "Not really."], "a": 0}, {"q": "A: Mum! I passed all my exams! B: I knew you could do it. ___", "o": ["I told you so!", "Not really."], "a": 0}, {"q": "B: Are you busy tomorrow at lunch time? A: ___ What are you thinking?", "o": ["Not really.", "I told you so!"], "a": 0}, {"q": "A: Can we go out for pizza? B: Yes, ___ It's your choice!", "o": ["I suppose so.", "Not really."], "a": 0}]}, {"type": "order", "title": "Put the dialogue in order", "items": ["Eric says he fell when he was rock climbing.", "Ali says: I told you so!", "Eric talks about his sister who cut herself running.", "Eric talks about his cousin who started sandboarding at four.", "Eric says children need to learn about danger.", "Ali says they will be late for PE."], "icon": "🔢"}, {"type": "wheel", "title": "What do you think?", "items": [{"q": "Do you think that children should do extreme sports?", "a": "Yes, I do, because they learn about danger. / No, I don't, because they can hurt themselves."}, {"q": "How can children stay safe?", "a": "They should use a helmet and their parents should be there."}, {"q": "Have you ever hurt yourself playing a sport?", "a": "Yes, I hurt my leg playing football."}, {"q": "Which sport is too dangerous for kids?", "a": "I think motor racing is too dangerous."}, {"q": "Can running be dangerous?", "a": "I suppose so. You can fall over and cut yourself."}], "icon": "🎡"}, {"type": "balloons", "title": "Pop the right answer!", "rounds": [{"q": "What happened to Eric?", "o": ["He fell rock climbing.", "He fell running.", "He fell off a horse."], "a": 0}, {"q": "Eric's sister cut herself when she was …", "o": ["caving", "running", "diving"], "a": 1}, {"q": "Eric's cousin started sandboarding when he was …", "o": ["four", "fourteen", "ten"], "a": 0}, {"q": "'I said this would happen!' =", "o": ["Not really.", "I told you so!", "I suppose so."], "a": 1}, {"q": "Eric can't do …", "o": ["PE", "Maths", "Art"], "a": 0}], "icon": "🎈"}, {"type": "steps", "title": "Let's remember!", "icon": "🧠", "steps": ["Ali: children shouldn't do extreme sports – they often hurt themselves.", "Eric: all sports can be dangerous; kids need to learn about danger.", "Stay safe: use a helmet, wear special clothes, have an adult with you. ⛑️", "I suppose so. · I told you so! · Not really."]}, {"type": "exit", "title": "Exit ticket", "items": [{"k": "3", "text": "How did Eric hurt himself?"}, {"k": "2", "text": "Reply: 'You don't like caving, do you?' – ___"}, {"k": "1", "text": "Should children do extreme sports? Write your opinion and one reason."}], "icon": "🎟️"}, {"type": "homework", "title": "Homework", "head": "My homework", "items": ["Activity Book p. 27: Activities 1–3.", "Activity 4: write another dialogue for each expression.", "Practise the dialogue to act it out in class."], "icon": "🏠"}]}, {"id": "L18", "unit": "U3", "unitName": "Unit 2: Adventure sports", "title": "Reflexive pronouns: myself, yourself, himself …", "code": "", "theme": "library", "emo": "🪞", "slides": [{"type": "cover", "say": "Unit 2 · Lesson 3 – Reflexive pronouns"}, {"type": "goals", "title": "Today's goals", "items": ["I can say the reflexive pronouns: myself, yourself, himself, herself, itself, ourselves, yourselves, themselves.", "I can use them when the subject and object are the same."], "icon": "🎯"}, {"type": "goals", "title": "Today's goals", "items": ["I can find reflexive pronouns in the dialogue.", "I can talk about the last time I hurt myself."], "icon": "🎯"}, {"type": "boxes", "title": "Who is it? Pronoun boxes", "boxes": [{"label": "1", "q": "Eric → ___", "a": "he / him"}, {"label": "2", "q": "Rosie → ___", "a": "she / her"}, {"label": "3", "q": "Ali and I → ___", "a": "we / us"}, {"label": "4", "q": "the camel → ___", "a": "it"}, {"label": "5", "q": "my cousins → ___", "a": "they / them"}, {"label": "6", "q": "Hey, Majid! → ___", "a": "you"}], "icon": "🎁"}, {"type": "tf", "title": "Remember the dialogue? True or False", "items": [{"text": "Eric hurt himself because he fell when he was mountain biking.", "a": false, "fix": "He fell when he was rock climbing."}, {"text": "Eric will be better by next week.", "a": true, "fix": "I'll be climbing again by next week."}, {"text": "Eric's sister was hurt when she was caving.", "a": false, "fix": "She cut herself when she was running."}, {"text": "Eric's cousin goes sandboarding.", "a": true, "fix": "He started sandboarding when he was four years old."}], "icon": "✔✘"}, {"type": "explain", "title": "Reflexive pronouns", "lines": ["We use reflexive pronouns when the subject and object of the verb are the [[same]]."], "img": "L18_c1", "rule": "singular: -self · plural: -selves", "icon": "💡"}, {"type": "flip", "title": "Reflexive pronouns 💡 – examples", "cards": [{"front": "I fell when I was rock climbing and hurt [[myself]].", "icon": "💡", "back": "I → myself"}, {"front": "My sister cut [[herself]] when she was running.", "icon": "✨", "back": "she → herself"}, {"front": "The camel hurt [[itself]] when it was running.", "icon": "🔎", "back": "it → itself"}, {"front": "Children shouldn't do extreme sports because they always hurt [[themselves]].", "icon": "📌", "back": "they → themselves"}]}, {"type": "match", "title": "Match the pronouns", "pairs": [["I", "myself"], ["you (one person)", "yourself"], ["he", "himself"], ["she", "herself"]], "icon": "🧩"}, {"type": "match", "title": "Match the pronouns", "pairs": [["it", "itself"], ["we", "ourselves"], ["you (many people)", "yourselves"], ["they", "themselves"]], "icon": "🧩"}, {"type": "memory", "title": "Memory: pronoun pairs", "pairs": [["I", "myself"], ["he", "himself"], ["she", "herself"], ["we", "ourselves"], ["they", "themselves"], ["it", "itself"]], "icon": "🧠"}, {"type": "ask", "title": "Find them in the dialogue", "qs": [{"q": "Eric: I fell when I was rock climbing and I hurt …", "a": "myself"}, {"q": "Ali: … because they often hurt …", "a": "themselves"}, {"q": "Eric: My sister fell over and cut …", "a": "herself"}], "img": "L18_c1", "icon": "🔍"}, {"type": "ask", "title": "Find f"}, {"a": "My sister cut herself when she was running.", "emo": "🏃‍♀️", "hint": "she → herself"}], "icon": "🧩"}, {"type": "wheel", "title": "Talk to your partner", "items": [{"q": "When was the last time you hurt yourself?", "a": "I hurt myself when I was diving last weekend."}, {"q": "How do you and your friends enjoy yourselves at weekends?", "a": "We enjoy ourselves playing football at the beach."}, {"q": "Tell me about a time you taught yourself to do something.", "a": "I taught myself to swim / to ride a bike."}, {"q": "How well do you know yourself?", "a": "I know myself very well."}, {"q": "Where do you imagine yourself in the future?", "a": "I imagine myself as a doctor in Muscat."}, {"q": "What can people do to take care of themselves?", "a": "They can eat healthy food and do exercise."}], "icon": "🎡"}, {"type": "race", "title": "Pronoun race", "qs": [{"q": "We made the sandwiches for the picnic ___.", "options": ["ourselves", "ourself", "themselves"], "a": 0}, {"q": "Did he make it ___?", "options": ["hisself", "himself", "herself"], "a": 1}, {"q": "Have you made ___ some lunch? (you and your sister)", "options": ["yourself", "yourselves", "ourselves"], "a": 1}, {"q": "The camel hurt ___ when it was running.", "options": ["itself", "himself", "itselfs"], "a": 0}, {"q": "Which is correct?", "options": ["I can see me in the mirror.", "I can see myself in the mirror.", "I can see mine in the mirror."], "a": 1}, {"q": "They can see ___ in the mirror.", "options": ["themselves", "theirselves", "themself"], "a": 0}], "icon": "🏁"}, {"type": "steps", "title": "Let's remember!", "icon": "🧠", "steps": ["Use a reflexive pronoun when the subject and object are the same person or thing.", "Singular: myself, yourself, himself, herself, itself.", "Plural: ourselves, yourselves, themselves.", "hurt yourself · enjoy yourselves · teach yourself · be proud of yourself"]}, {"type": "exit", "title": "Exit ticket", "items": [{"k": "3", "text": "Complete: My brother cut ___ while he was go-karting."}, {"k": "2", "text": "Complete: We really enjoyed ___ at the festival."}, {"k": "1", "text": "Write a sentence about a time you hurt yourself."}], "icon": "🎟️"}, {"type": "homework", "title": "Homework", "head": "My homework", "items": ["Activity Book pp. 28–29: Activities 1–5.", "Grammar practice AB p. 61: Activities 1–2.", "Activity 6: ask your partner the questions from Activity 5 and write their answers."], "icon": "🏠"}]}, {"id": "L19", "unit": "U3", "unitName": "Unit 2: Adventure sports", "title": "Book club: Old-fashioned explorers", "code": "", "theme": "library", "emo": "🧭", "slides": [{"type": "cover", "say": "Unit 2 · Lesson 4 – WOW! Book Club: an adventure story"}, {"type": "goals", "title": "Today's goals", "items": ["I can say what an adventure story is.", "I can read and understand an adventure story."], "icon": "🎯"}, {"type": "goals", "title": "Today's goals", "items": ["I can make compound adjectives: old-fashioned, ice-cold …", "I can act out an interview with the characters."], "icon": "🎯"}, {"type": "quiz", "title": "What is an adventure story?", "qs": [{"q": "An adventure story is usually …", "o": ["exciting", "boring"], "a": 0}, {"q": "A ___ is a person in a story.", "o": ["setting", "character"], "a": 1}, {"q": "There will usually be ___ in the story.", "o": ["one character", "a few characters"], "a": 1}, {"q": "A place in a story is called a …", "o": ["setting", "character"], "a": 0}], "icon": "📚"}, {"type": "ask", "title": "Look at the pictures", "qs": [{"q": "Who are the characters?", "a": "Hussain and his sisters, Rahaf and Nada."}, {"q": "What is the setting?", "a": "A campsite near a small wood, a valley, a hill and a bay."}, {"q": "What is Nada holding?", "a": "Grandad's old compass."}, {"q": "What is an 'old-fashioned explorer'?", "a": "An explorer from the past – with a map and a compass, but no phone!"}], "img": "L19_c1", "icon": "🔮"}, {"type": "read", "title": "Old-fashioned explorers (1)", "paras": ["Hussain was on a camping trip with his sisters, Rahaf and Nada. They put up their tent in a [[campsite]] near a small wood. The next morning, they woke up early to watch the sunrise. After they had eaten their breakfast, they looked in their [[guidebook]]."], "img": "L19_c1", "icon": "📖"}, {"type": "read", "title": "Old-fashioned explorers (1)", "paras": ["'I think there's a bay on the other side of that valley. Shall we walk there and go for a swim?' asked Hussain.", "'Yes! Let's be [[old-fashioned]] explorers on an adventure!' said Rahaf.", "'Good idea! We'll turn off our phones and use the map in the guidebook,' said Hussain."], "img": "L19_c1", "icon": "📖"}, {"type": "read", "title": "Old-fashioned explorers (1)", "paras": ["'I brought Grandad's old [[compass]] with me!' said Nada. 'We can use it so that we don't get lost.'"], "img": "L19_c1", "icon": "📖"}, {"type": "read", "title": "Old-fashioned explorers (2)", "paras": ["After they had packed some food and ice-cold water, they started walking.", "'We need to go north and then east, so it's this way,' said Nada, looking at the compass."], "img": "L19_c1", "icon": "📖"}, {"type": "read", "title": "Old-fashioned explorers (2)", "paras": ["After they had crossed the valley, they climbed up the hill on the other side. The [[scenery]] all around was beautiful. They started to walk down to the bay, but they hadn't got very far before Hussain stopped. He'd heard a man who was shouting for help. The man had fallen down the [[cliff]]!"], "img": "L19_c1", "icon": "📖"}, {"type": "read", "title": "Old-fashioned explorers (2)", "paras": ["'Help me!' the man cried. 'I've hurt my foot and I can't climb back up.'", "'Don't worry,' shouted Rahaf, turning on her phone. 'We'll call for help.'"], "img": "L19_c1", "icon": "📖"}, {"type": "read", "title": "Old-fashioned explorers (3)", "paras": ["After a two-hour wait, the children started to feel cold and were getting [[worried]]. It was nearly sunset. 'What are we going to do if no one comes?' said Rahaf to Nada."], "img": "L19_c2", "icon": "📖"}, {"type": "read", "title": "Old-fashioned explorers (3)", "paras": ["But just then, they heard the sound of a [[helicopter]]. The children jumped and waved at the helicopter until the people in the helicopter saw them. After they had pulled the man to [[safety]] on a rope, they took him to a nearby hospital."], "img": "L19_c2", "icon": "📖"}, {"type": "read", "title": "Old-fashioned explorers (3)", "paras": ["The children went to see the man in hospital and he thanked them for helping him. 'Next time, I won't go hiking by myself and I'll make sure I have my mobile phone with me.'", "'It's good that we aren't really old-fashioned explorers,' said Hussain to his sisters later. 'They didn't have mobile phones or helicopters to help people.'"], "img": "L19_c2", "icon": "📖"}, {"type": "order", "title": "What happened first?", "items": ["The children watched the sunrise and had breakfast.", "They packed food and ice-cold water.", "They crossed the valley and climbed the hill.", "Hussain heard a man shouting for help.", "Rahaf turned on her phone and called for help.", "A helicopter took the man to hospital."], "icon": "🔢"}, {"type": "match", "title": "Match the two parts", "pairs": [["After the children had eaten breakfast,", "they looked in their guidebook."], ["After they had packed some food,", "they started walking across the valley."], ["After they'd walked across the valley,", "they decided to climb up the hill."]], "icon": "🧩"}, {"type": "match", "title": "Match the two parts", "pairs": [["After the man had hurt his foot,", "he couldn't climb back up the cliff."], ["After Rahaf had turned on her phone,", "she used it to call for help."], ["After the people had rescued the man,", "they took him to a nearby hospital."]], "icon": "🧩"}, {"type": "ask", "title": "Answer the questions", "qs": [{"q": "Where did the children decide to camp?", "a": "They decided to camp near a small wood."}, {"q": "Why did they want to wake up early?", "a": "They wanted to watch the sunrise."}, {"q": "Whose compass did Nada bring?", "a": "She brought Grandad's (old) compass."}], "img": "L19_c2", "icon": "💭"}, {"type": "ask", "title": "Answer the questions", "qs": [{"q": "Why did Hussain stop walking to the bay?", "a": "He heard a man who was shouting for help."}, {"q": "How long did they wait for the helicopter?", "a": "They waited for two hours."}, {"q": "What will the man remember next time?", "a": "He won't go hiking by himself and he'll have his mobile phone with him."}], "icon": "💭"}, {"type": "explain", "title": "Compound adjectives", "lines": ["Some adjectives are formed from two words joined by a hyphen (-)."], "img": "L19_c4", "rule": "word + - + word → one adjective before a noun", "icon": "💡"}, {"type": "flip", "title": "Compound adjectives 💡 – examples", "cards": [{"front": "old + fashioned = [[old-fashioned]]", "icon": "💡", "back": "My dad has an old-fashioned radio from the 1960s."}, {"front": "ice + cold = [[ice-cold]]", "icon": "✨", "back": "They packed ice-cold water."}, {"front": "two + hour = [[two-hour]]", "icon": "🔎", "back": "After a two-hour wait …"}]}, {"type": "quiz", "title": "Make compound adjectives", "icon": "✏️", "qs": [{"q": "We took a nine-___ bus ride from Cordoba to Buenos Aires.", "o": ["hour", "made"], "a": 0}, {"q": "The USA is an English-___ country.", "o": ["speaking", "winning"], "a": 0}, {"q": "The Mona Lisa is a world-___ painting by Leonardo da Vinci.", "o": ["famous", "cold"], "a": 0}, {"q": "I felt really hot, so I drank an ice-___ glass of lemonade.", "o": ["cold", "made"], "a": 0}, {"q": "My uncle has a prize-___ camel. It has won lots of competitions.", "o": ["winning", "speaking"], "a": 0}, {"q": "I love my mum's home-___ chocolate cake. It's delicious!", "o": ["made", "famous"], "a": 0}]}, {"type": "wheel", "title": "Interview the explorers!", "items": [{"q": "Journalist: Why did you turn off your phones?", "a": "We wanted to be old-fashioned explorers."}, {"q": "Journalist: How did you find the way?", "a": "We used Grandad's old compass and the map in the guidebook."}, {"q": "Journalist: What did you hear?", "a": "We heard a man who was shouting for help."}, {"q": "Journalist: How did you feel while you were waiting?", "a": "We felt cold and worried."}, {"q": "Journalist: What happened in the end?", "a": "A helicopter pulled the man to safety and took him to hospital."}, {"q": "Journalist: What did you learn?", "a": "It's good to have a mobile phone with you!"}], "icon": "🎤"}, {"type": "ask", "title": "Old-fashioned or modern?", "qs": [{"q": "What did old-fashioned explorers use to find their way?", "a": "A map and a compass."}, {"q": "What do modern explorers use?", "a": "Phones, GPS, helicopters …"}, {"q": "Why was it good that Rahaf had her phone?", "a": "She called for help and the man was rescued."}, {"q": "What should you take when you go hiking?", "a": "water, food, a phone, a map, a compass, a hat …"}], "img": "L19_c2", "icon": "🧭📱"}, {"type": "boxes", "title": "Story treasure boxes", "boxes": [{"label": "1", "q": "Who are Rahaf and Nada?", "a": "Hussain's sisters."}, {"label": "2", "q": "What did they want to do at the bay?", "a": "Go for a swim."}, {"label": "3", "q": "Which directions did they need to go?", "a": "North and then east."}, {"label": "4", "q": "What had happened to the man?", "a": "He had fallen down the cliff and hurt his foot."}, {"label": "5", "q": "What time of day was it when the helicopter came?", "a": "Nearly sunset."}, {"label": "6", "q": "Make a compound adjective: ice + cold", "a": "ice-cold"}], "icon": "🎁"}, {"type": "steps", "title": "Let's remember!", "icon": "🧠", "steps": ["An adventure story is exciting; it has characters and a setting.", "Hussain, Rahaf and Nada rescued a man who had fallen down a cliff.", "Modern things like phones and helicopters keep us safe. 📱🚁", "Compound adjectives: old-fashioned, ice-cold, home-made, world-famous."]}, {"type": "exit", "title": "Exit ticket", "items": [{"k": "3", "text": "Name the three characters in the story."}, {"k": "2", "text": "Why did Rahaf turn on her phone?"}, {"k": "1", "text": "Write a sentence with a compound adjective."}], "icon": "🎟️"}, {"type": "homework", "title": "Homework", "head": "My homework", "items": ["Activity Book pp. 30–31: Activities 1–4.", "Activity 5: write sentences with compound adjectives that you know.", "Read the story again and find words for places and directions."], "icon": "🏠"}]}, {"id": "L20", "unit": "U3", "unitName": "Unit 2: Adventure sports", "title": "Geography words & Past perfect", "code": "", "theme": "library", "emo": "🌄", "slides": [{"type": "cover", "say": "Unit 2 · Lesson 5 – Vocabulary and Grammar"}, {"type": "goals", "title": "Today's goals", "items": ["I can name directions and places: north, valley, bay, wood …", "I can understand the Past perfect: had + past participle."], "icon": "🎯"}, {"type": "goals", "title": "Today's goals", "items": ["I can say which past event happened first.", "I can make sentences with after and before."], "icon": "🎯"}, {"type": "riddle", "title": "Where am I?", "items": [{"clues": ["It's a place with lots of trees.", "It's smaller than a forest."], "a": "a wood", "emo": "🌳"}, {"clues": ["It's a low place between hills or mountains.", "Sometimes there's a river in it."], "a": "a valley", "emo": "🏞️"}, {"clues": ["It's part of the sea.", "The land curves around it."], "a": "a bay", "emo": "🏖️"}, {"clues": ["The sun comes up.", "It's early in the morning."], "a": "sunrise", "emo": "🌅"}], "icon": "🔎"}, {"type": "flip", "title": "Directions and nature", "cards": [{"front": "north", "icon": "⬆️", "back": "the direction at the top of a map\n«We need to go north.»"}, {"front": "south", "icon": "⬇️", "back": "opposite of north\n«Salalah is in the south of Oman.»"}, {"front": "east", "icon": "➡️", "back": "where the sun rises\n«Sur is in the east of Oman.»"}, {"front": "west", "icon": "⬅️", "back": "where the sun sets\n«The sun goes down in the west.»"}, {"front": "sunrise", "icon": "🌅", "back": "when the sun comes up\n«They woke up early to watch the sunrise.»"}, {"front": "sunset", "icon": "🌇", "back": "when the sun goes down\n«It was nearly sunset.»"}], "icon": "🧭"}, {"type": "flip", "title": "Places in nature", "cards": [{"front": "wood", "icon": "🌳", "back": "a small forest\n«Their tent was near a small wood.»"}, {"front": "field", "icon": "🌾", "back": "an area of grass, often on a farm\n«The cows are in the field.»"}, {"front": "valley", "icon": "🏞️", "back": "low land between hills\n«They crossed the valley.»"}, {"front": "scenery", "icon": "🖼️", "back": "the natural view around you\n«The scenery was beautiful.»"}, {"front": "tide", "icon": "🌊", "back": "the sea going up and down on the beach\n«The tide is coming in.»"}, {"front": "bay", "icon": "🏖️", "back": "part of the sea with land around it\n«Let's go for a swim in the bay.»"}], "icon": "🏞️"}, {"type": "mystery", "title": "Look and match", "img": "L20_c1", "answer": "12 geography words! 🧭", "qs": [{"q": "Picture 1: the sun goes down into the sea.", "o": ["sunset", "sunrise"], "a": 0}, {"q": "Picture 5: green grass, a blue sky.", "o": ["bay", "field"], "a": 1}, {"q": "Picture 6: lots of tall trees.", "o": ["valley", "wood"], "a": 1}, {"q": "Picture 7: low land between mountains.", "o": ["tide", "valley"], "a": 1}], "icon": "🕵️"}, {"type": "quiz", "title": "Look, read and complete", "icon": "✏️", "qs": [{"q": "The cows are in the ___.", "o": ["field", "bay"], "a": 0}, {"q": "You can watch the ___ in the morning.", "o": ["sunrise", "sunset"], "a": 0}, {"q": "I love swimming in the ___.", "o": ["bay", "wood"], "a": 0}, {"q": "The house is next to a small ___.", "o": ["wood", "tide"], "a": 0}, {"q": "You can watch the ___ in the evening.", "o": ["sunset", "sunrise"], "a": 0}, {"q": "Our town is located in a beautiful ___.", "o": ["valley", "field"], "a": 0}]}, {"type": "tf", "title": "Think about the story", "items": [{"text": "The children had breakfast and then they looked in their guidebook.", "a": true, "fix": "After they had eaten their breakfast, they looked in their guidebook."}, {"text": "They packed food and water and then they started walking.", "a": true, "fix": "After they had packed some food and ice-cold water, they started walking."}, {"text": "They climbed the hill and then they crossed the valley.", "a": false, "fix": "After they had crossed the valley, they climbed up the hill."}, {"text": "They pulled Hussain up on a rope and then they took him to hospital.", "a": false, "fix": "They pulled the man (not Hussain) to safety."}], "icon": "✔✘"}, {"type": "explain", "title": "The Past perfect", "lines": ["We use the Past perfect to talk about something that happened [[before]] another event in the past."], "img": "L20_c2", "rule": "had / hadn't + past participle (eaten, got, heard, fallen)", "icon": "💡"}, {"type": "flip", "title": "The Past perfect 💡 – examples", "cards": [{"front": "After they [[had eaten]] their breakfast, they looked in their guidebook.", "icon": "💡", "back": "1️⃣ ate → 2️⃣ looked"}, {"front": "They [[hadn't got]] very far before Hussain stopped.", "icon": "✨", "back": "negative: hadn't + past participle"}, {"front": "He[[’d heard]] a man who was shouting for help.", "icon": "🔎", "back": "'d = had"}, {"front": "The man [[had fallen]] down the cliff!", "icon": "📌", "back": "fell first ⬇️"}]}, {"type": "quiz", "title": "Which happened first?", "qs": [{"q": "After we had finished our homework, we watched TV.", "o": ["finished homework", "watched TV"], "a": 0, "why": "had finished = first"}, {"q": "The bus had left before I noticed that I didn't have my backpack.", "o": ["the bus left", "I noticed"], "a": 0, "why": "had left = first"}, {"q": "I went for a run after I had put on my trainers.", "o": ["went for a run", "put on trainers"], "a": 1, "why": "had put on = first"}, {"q": "Before my parents arrived home, I had tidied my bedroom.", "o": ["parents arrived", "tidied my bedroom"], "a": 1, "why": "had tidied = first"}], "icon": "🥇"}, {"type": "ask", "title": "Younis's camping trip", "qs": [{"q": "Listen to Younis. Where did he and his dad put their tent?", "a": "Listen to 2.11 and find out!"}, {"q": "Which event is number 1?", "a": "1 They put up their tent and went for a walk."}, {"q": "Number the others: They watched the sunset. · They went fishing and then cooked their dinner. · They told adventure stories and sang some songs.", "a": "Listen to 2.12 and number them."}, {"q": "… They went to sleep, but were woken up suddenly. · They took down the tent quickly and went home.", "a": "Listen again and check. Then say: After they had …, they …"}], "img": "L20_c1", "icon": "🎧"}, {"type": "quiz", "title": "Complete with the Past perfect", "icon": "✏️", "qs": [{"q": "After I ___ my compass, I walked north.", "o": ["had checked", "have checked"], "a": 0}, {"q": "My friends and I ___ the sunrise before we had breakfast.", "o": ["had watched", "had watch"], "a": 0}, {"q": "After Amirah ___ some photos of the scenery, she posted them online.", "o": ["had taken", "had took"], "a": 0}, {"q": "The bus ___ before I noticed that I didn't have my backpack with me.", "o": ["had left", "has left"], "a": 0}, {"q": "After the campers ___ the fire, they cooked burgers for dinner.", "o": ["had started", "had start"], "a": 0}, {"q": "Mazin ___ his lunch before he started hiking back home.", "o": ["had eaten", "had ate"], "a": 0}]}, {"type": "ask", "title": "Muneera's day", "qs": [{"q": "9 am eat breakfast → 10 am go hiking", "a": "After Muneera had eaten breakfast, she went hiking in the woods."}, {"q": "10 am go hiking → 11.30 am walk home", "a": "After she had gone hiking, she walked home with Aisha."}, {"q": "12.30 pm eat lunch → 2 pm take photos", "a": "After she had eaten lunch in the bay, she took photos in the valley."}, {"q": "5 pm watch sunset → 5.30 pm visit grandma", "a": "After she had watched the sunset, she visited her grandma."}, {"q": "8 pm have dinner → 9 pm go to bed", "a": "After she had had dinner, she went to bed."}], "img": "L20_c3", "icon": "🗓️"}, {"type": "build", "title": "Ahmed at the beach", "mode": "words", "items": [{"a": "After Ahmed had arrived at the beach, he went for a swim.", "hint": "after / beach / swim"}, {"a": "After he had gone for a swim, he put up his umbrella.", "hint": "after / swim / umbrella"}, {"a": "He had put up his umbrella before he read a magazine.", "hint": "before / umbrella / magazine"}, {"a": "After he had read a magazine, he ate a sandwich.", "hint": "after / read / eat"}], "icon": "🏖️"}, {"type": "race", "title": "Past perfect race", "qs": [{"q": "After they ___ the valley, they climbed the hill.", "options": ["had crossed", "have crossed", "crossing"], "a": 0}, {"q": "The sun goes up in the …", "options": ["east", "west", "north"], "a": 0}, {"q": "He'd heard a man. 'd = …", "options": ["would", "had", "did"], "a": 1}, {"q": "We form the Past perfect with …", "options": ["have + past participle", "had + past participle", "had + verb-ing"], "a": 1}, {"q": "Low land between hills is a …", "options": ["bay", "valley", "tide"], "a": 1}, {"q": "I ___ very far before I saw the bay.", "options": ["hadn't walked", "didn't walked", "hadn't walk"], "a": 0}], "icon": "🏁"}, {"type": "steps", "title": "Let's remember!", "icon": "🧠", "steps": ["Directions: north, south, east, west · sunrise, sunset.", "Places: wood, field, valley, bay, tide, scenery.", "Past perfect = had + past participle: the FIRST event in the past.", "After I had eaten breakfast, I went hiking. 🥇➡️🥈"]}, {"type": "exit", "title": "Exit ticket", "items": [{"k": "3", "text": "Write two words for places in nature."}, {"k": "2", "text": "Complete: After I ___ (brush) my teeth, I got dressed."}, {"k": "1", "text": "Write a sentence about your morning with after + Past perfect."}], "icon": "🎟️"}, {"type": "homework", "title": "Homework", "head": "My homework", "items": ["Activity Book pp. 32–33: Activities 1–4.", "Grammar practice AB p. 61: Activities 3–4.", "Write 3 sentences about your weekend with after / before and the Past perfect."], "icon": "🏠"}]}, {"id": "L21", "unit": "U3", "unitName": "Unit 2: Adventure sports", "title": "Culture & Project: Ready for something new?", "code": "", "theme": "library", "emo": "🏑", "slides": [{"type": "cover", "say": "Unit 2 · Lesson 6 – WOW! Culture & Project: unusual sports"}, {"type": "goals", "title": "Today's goals", "items": ["I can read about three unusual sports.", "I can find things that are the same and different."], "icon": "🎯"}, {"type": "goals", "title": "Today's goals", "items": ["I can research a sport: its history, rules and interesting facts.", "I can make and present a poster with my group."], "icon": "🎯"}, {"type": "ask", "title": "Which sport would you try?", "qs": [{"q": "Look at the photos. What can you see?", "a": "People playing hockey under water, a man standing on bamboo on a river, people playing football on bikes."}, {"q": "Which sport would you most like to try? Why?", "a": "I'd like to try cycleball because I love cycling and football!"}, {"q": "Which sport looks the most difficult?", "a": "Personal answers."}], "img": "L21_c1", "icon": "🤔"}, {"type": "read", "title": "Underwater hockey", "paras": ["This sport was first played in the UK in the 1950s and is now popular in Australia, America and lots of other countries, too.", "It's a game of hockey which is played at the bottom of a swimming pool! There are two teams of six players who play two 15-minute [[halves]] with a 3-minute break."], "img": "L21_c2", "icon": "🏑"}, {"type": "read", "title": "Underwater hockey", "paras": ["Players try to score by hitting the [[puck]] (the flat 'ball') with their stick into the goal."], "img": "L21_c2", "icon": "🏑"}, {"type": "read", "title": "Bamboo drifting", "paras": ["This sport was started about one thousand years ago in China. People got the idea from watching workers who used to travel down the river on [[bamboo]].", "You have to stand on a long piece of bamboo, about 9 metres long, on the river, and use a long thin stick to help you move through the water."], "img": "L21_c3", "icon": "🎋"}, {"type": "read", "title": "Bamboo drifting", "paras": ["You race your [[opponent]] down the river. As well as racing, some people do beautiful dancing on the bamboo."], "img": "L21_c3", "icon": "🎋"}, {"type": "read", "title": "Cycleball", "paras": ["This sport was started in America in 1893 by Nicholas Kaufman, who had learned to do tricks on his bike.", "Cycleball is football played on bikes! It is usually played with two players on each team, but you can also have five or six people on each team."], "img": "L21_c4", "icon": "🚲⚽"}, {"type": "read", "title": "Cycleball", "paras": ["You can only move the ball using your bike. You mustn't use your feet or hands. The cycleball World Cup is played every year and many countries now [[take part]].", "WOW! Fact: Polo is a team game played on horses with a stick and a ball. You can play it on bicycles, too!"], "img": "L21_c4", "icon": "🚲⚽"}, {"type": "tf", "title": "True or False?", "items": [{"text": "Underwater hockey matches are played by twelve people.", "a": true, "fix": "There are two teams of six players."}, {"text": "Underwater hockey was first played in Australia.", "a": false, "fix": "It was first played in the UK."}, {"text": "Only dancers can play the sport of bamboo drifting.", "a": false, "fix": "People race; some people also dance."}], "icon": "✔✘"}, {"type": "tf", "title": "True or False?", "items": [{"text": "Players use a short stick for bamboo drifting.", "a": false, "fix": "They use a long thin stick."}, {"text": "Cycleball teams don't always have two players.", "a": true, "fix": "You can also have five or six people on each team."}, {"text": "Cycleball players can move the ball with their hands.", "a": false, "fix": "You mustn't use your feet or hands."}], "icon": "✔✘"}, {"type": "quiz", "title": "One word in each space", "icon": "✏️", "qs": [{"q": "Underwater hockey is a water sport that is played in many different ___ around the world.", "o": ["countries", "rivers"], "a": 0}, {"q": "A ___ of underwater hockey is 30 minutes long, with a 3-minute break in the middle.", "o": ["game", "team"], "a": 0}, {"q": "In bamboo drifting, people ___ on a piece of bamboo which is about 9 metres long.", "o": ["stand", "sit"], "a": 0}, {"q": "Bamboo drifting opponents race down the ___ as fast as they can.", "o": ["river", "hill"], "a": 0}, {"q": "Nicholas Kaufman started cycleball in ___ in 1893.", "o": ["America", "China"], "a": 0}, {"q": "Many countries take part in the cycleball World Cup, which is a game of ___ played on bikes.", "o": ["football", "hockey"], "a": 0}]}, {"type": "sort", "title": "Same or different?", "bins": [{"label": "underwater hockey", "icon": "🏑"}, {"label": "bamboo drifting", "icon": "🎋"}, {"label": "cycleball", "icon": "🚲"}], "cards": [{"text": "played in a swimming pool", "icon": "", "bin": 0}, {"text": "a flat puck", "icon": "", "bin": 0}, {"text": "started 1,000 years ago", "icon": "", "bin": 1}, {"text": "on a river", "icon": "", "bin": 1}, {"text": "some people dance", "icon": "", "bin": 1}, {"text": "football on bikes", "icon": "", "bin": 2}, {"text": "started in 1893", "icon": "", "bin": 2}, {"text": "a World Cup every year", "icon": "", "bin": 2}], "icon": "🗂️"}, {"type": "ask", "title": "Zorbing!", "qs": [{"q": "What is zorbing?", "a": "An unusual outdoor sport that people do on hills. They get inside a big ball called a zorb."}, {"q": "What do people do after they get inside?", "a": "They roll down the hill as fast as they can."}, {"q": "How many people can fit inside a zorb?", "a": "Only one person."}, {"q": "Listen and complete the other gaps: in ___, clear ___, about ___ metres across, zorb ___, for ___, on ___ like lakes.", "a": "Listen to 2.15 and check."}, {"q": "Does that sound fun to you?", "a": "Personal answers."}], "img": "L21_c6", "icon": "🎧"}, {"type": "explain", "title": "Project: a poster about an unusual sport", "lines": ["Your school plans to start an unusual sport next year. In groups, choose three or four sports you would like to include."], "img": "L21_c5", "rule": "Writing tip: choose your words carefully and include lots of information.", "icon": "🖼️"}, {"type": "flip", "title": "Project: a poster about an unusual sport 🖼️ – examples", "cards": [{"front": "Research: the [[history]] of the sport", "icon": "💡", "back": "When and where did it start?"}, {"front": "Research: the [[rules]]", "icon": "✨", "back": "How many players? What can't you do?"}, {"front": "Research: some [[interesting information]]", "icon": "🔎", "back": "A fun fact!"}, {"front": "Write, find photos, glue them on the poster.", "icon": "📌", "back": "✂️🖼️"}]}, {"type": "write", "title": "Write about your sport", "task": "Write a description of an unusual sport for your poster.", "steps": ["Where do people play the sport?", "What do the players have to do?", "What is needed to play the sport?", "What rules must people follow?", "What do you think of the sport?"], "words": ["This sport was started in …", "It is played …", "There are … players", "You have to …", "You mustn't …", "It's exciting because …"], "model": "Dhow racing: This sport is popular in Oman and other Gulf countries. Teams race traditional wooden boats called dhows on the sea. You have to work together with your team. It's exciting because the boats are very fast!", "icon": "✍️"}, {"type": "wheel", "title": "Present and vote!", "items": [{"q": "What is your sport called?", "a": "Our sport is called …"}, {"q": "Where and when did it start?", "a": "It was started in … in …"}, {"q": "What are the rules?", "a": "You have to … You mustn't …"}, {"q": "What's an interesting fact about it?", "a": "Did you know that …?"}, {"q": "Why should we play it in PE?", "a": "Because it's fun and safe and …"}], "icon": "🗳️"}, {"type": "memory", "title": "Memory: unusual sports", "pairs": [["underwater hockey", "🏑🌊"], ["bamboo drifting", "🎋🛶"], ["cycleball", "🚲⚽"], ["polo", "🐎🏑"], ["zorbing", "🔵⛰️"], ["camel racing", "🐪🏁"]], "icon": "🧠"}, {"type": "balloons", "title": "Pop the right answer!", "rounds": [{"q": "Underwater hockey started in …", "o": ["the UK", "China", "America"], "a": 0}, {"q": "Bamboo drifting started about ___ years ago.", "o": ["100", "1,000", "50"], "a": 1}, {"q": "In cycleball you move the ball with …", "o": ["your feet", "your bike", "your hands"], "a": 1}, {"q": "The flat 'ball' in underwater hockey is a …", "o": ["puck", "zorb", "stick"], "a": 0}, {"q": "Polo is played on horses or …", "o": ["bicycles", "bamboo", "boats"], "a": 0}], "icon": "🎈"}, {"type": "steps", "title": "Let's remember!", "icon": "🧠", "steps": ["Underwater hockey: two teams of six, at the bottom of a pool (UK, 1950s).", "Bamboo drifting: stand on 9 m of bamboo and race down a river (China).", "Cycleball: football on bikes – no feet, no hands! (America, 1893).", "A good poster: history, rules, interesting facts and photos."]}, {"type": "exit", "title": "Exit ticket", "items": [{"k": "3", "text": "Which sport is played at the bottom of a swimming pool?"}, {"k": "2", "text": "Write one thing that is the same about two of the sports."}, {"k": "1", "text": "Which unusual sport would you choose for PE? Why?"}], "icon": "🎟️"}, {"type": "homework", "title": "Homework", "head": "My homework", "items": ["Activity Book p. 34: Activities 1–4.", "Find one photo and one fact about your group's sport for the poster.", "Practise presenting your part of the poster."], "icon": "🏠"}]}, {"id": "L22", "unit": "U3", "unitName": "Unit 2: Adventure sports", "title": "English in action: Asking and saying what you prefer", "code": "", "theme": "library", "emo": "🤔", "slides": [{"type": "cover"}, {"type": "goals", "title": "Today's goals", "items": ["I can ask what someone prefers: Would you rather …? Would you prefer to …?", "I can say what I prefer: I'd rather … / I'd prefer to …"], "icon": "🎯"}, {"type": "goals", "title": "Today's goals", "items": ["I can plan an activity holiday with a partner.", "I can stress had in Past perfect sentences."], "icon": "🎯"}, {"type": "boxes", "title": "This or that?", "boxes": [{"label": "1", "q": "🏖️ the beach or 🏔️ the mountains?", "a": "I'd rather go to the beach / the mountains."}, {"label": "2", "q": "🤿 diving or 🪂 paragliding?", "a": "I'd rather go diving / paragliding."}, {"label": "3", "q": "🌅 sunrise or 🌇 sunset?", "a": "I'd rather watch the sunrise / the sunset."}, {"label": "4", "q": "⛺ a tent or 🏨 a hotel?", "a": "I'd rather sleep in a tent / a hotel."}, {"label": "5", "q": "🐪 camel riding or 🏇 horse riding?", "a": "I'd rather go camel riding / horse riding."}, {"label": "6", "q": "🏜️ sandboarding or 🏄 surfboarding?", "a": "I'd rather go sandboarding / surfboarding."}], "icon": "🎁"}, {"type": "read", "title": "Planning an adventure holiday", "paras": ["Lucas: I'm really looking forward to our adventure holiday. There are so many different activities to choose from. So, on day one, [[would you prefer to]] go rock climbing or horse riding?", "Frank: Oh, that's difficult! [[I think we should]] go horse riding. What do you think?"], "img": "L22_c1", "icon": "📖"}, {"type": "read", "title": "Planning an adventure holiday", "paras": ["Lucas: Yes, I agree. I've always wanted to try that. Let's have a look at day two. [[Would you rather]] go hiking or diving?", "Frank: [[I'd rather]] go hiking. I'm a bit scared of going underwater.", "Lucas: Oh, I think I'd rather go diving on day two. That's OK. We can choose different things if we want to!", "Frank: What about day three?"], "img": "L22_c1", "icon": "📖"}, {"type": "read", "title": "Planning an adventure holiday", "paras": ["Lucas: Let's have a look. [[Should we]] go abseiling or mountain biking?", "Frank: Well, I've been mountain biking before, so I think we should try abseiling.", "Lucas: Yes, I think that sounds very exciting! I can't wait!"], "img": "L22_c1", "icon": "📖"}, {"type": "ask", "title": "Three choices", "qs": [{"q": "Day one: rock climbing or horse riding?", "a": "Frank thinks they should go horse riding."}, {"q": "Day two: hiking or diving?", "a": "Frank would rather go hiking. (He's a bit scared of going underwater.)"}, {"q": "Day three: abseiling or mountain biking?", "a": "Frank thinks they should try abseiling. (He's been mountain biking before.)"}, {"q": "What does Lucas choose on day two?", "a": "He'd rather go diving."}], "img": "L22_c1", "icon": "💭"}, {"type": "explain", "title": "Say it!", "lines": ["Asking what someone prefers → saying what you prefer"], "img": "L22_c2", "rule": "I'd rather + verb · I'd prefer + to + verb · I think we should + verb", "icon": "🗣️"}, {"type": "flip", "title": "Say it! 🗣️ – examples", "cards": [{"front": "[[Would you rather]] go caving or abseiling?", "icon": "💡", "back": "→ I'd rather go caving."}, {"front": "[[Would you prefer to]] go skateboarding or surfboarding?", "icon": "✨", "back": "→ I'd prefer to go surfboarding."}, {"front": "[[Should we]] go paragliding or play tennis?", "icon": "🔎", "back": "→ I think we should go paragliding."}]}, {"type": "quiz", "title": "Choose the correct reply", "qs": [{"q": "Would you rather go caving or abseiling?", "o": ["I'd rather go caving.", "I'd rather to go caving.", "I rather going caving."], "a": 0, "why": "I'd rather + verb"}, {"q": "Would you prefer to go diving or hiking?", "o": ["I'd prefer go hiking.", "I prefer going to hiking.", "I'd prefer to go hiking."], "a": 2, "why": "I'd prefer + to + verb"}, {"q": "Should we play tennis or go go-karting?", "o": ["I think we should to go go-karting.", "I think we should go go-karting.", "I think should we go go-karting."], "a": 1, "why": "should + verb"}, {"q": "Which question is correct?", "o": ["Would you rather go horse riding or diving?", "Would you rather to go horse riding or diving?", "Do you rather go horse riding or diving?"], "a": 0, "why": "Would you rather + verb"}], "icon": "✅"}, {"type": "quiz", "title": "Osama and Hazim's holiday", "icon": "✏️", "qs": [{"q": "Osama: I'm really looking forward to our activity holiday. Hazim: Me too! ___", "o": ["There are so many activities we can do.", "I can't wait!"], "a": 0}, {"q": "Osama: … would you rather go paragliding or surfboarding? Hazim: Oh, that's easy! ___", "o": ["I'd rather go paragliding.", "I'd rather go caving on day two,"], "a": 0}, {"q": "Hazim: Let's have a look at day two. ___", "o": ["Should we go abseiling or caving?", "I think that sounds excellent!"], "a": 0}, {"q": "Osama: I'm nervous about caving. Hazim: Really? ___ but we can do different things.", "o": ["I'd rather go caving on day two,", "I'd rather go paragliding."], "a": 0}, {"q": "Hazim: Let's have a look. ___ or go-karting?", "o": ["Would you prefer to go horse riding", "Should we go abseiling or caving?"], "a": 0}, {"q": "Osama: … I'd prefer to try horse riding. Hazim: ___ I can't wait!", "o": ["I think that sounds excellent!", "There are so many activities we can do."], "a": 0}]}, {"type": "ask", "title": "Act it out!", "qs": [{"q": "Would you rather stay in a field at a campsite or stay in a hotel in a bay?", "a": "I'd rather stay in a hotel in a bay."}, {"q": "Would you prefer to go hiking in a wood or in a valley?", "a": "I'd prefer to go hiking in a valley."}, {"q": "Should we watch the sunrise or the sunset?", "a": "I think we should watch the sunset."}, {"q": "Student B asks: walk in a wood or up a mountain? / go horse riding or diving? / mountain bike or skateboard?", "a": "I'd rather … / I'd prefer to … / I think we should …"}], "img": "L22_c3", "icon": "🎭"}, {"type": "wheel", "title": "Your own dialogues", "items": [{"q": "Should we play basketball or football?", "a": "I think we should play basketball."}, {"q": "Would you rather go to the beach or to the desert?", "a": "I'd rather go to the desert."}, {"q": "Should we go sandboarding or surfboarding?", "a": "I think we should go sandboarding."}, {"q": "Would you prefer to visit Nizwa Fort or Bahla Fort?", "a": "I'd prefer to visit Nizwa Fort."}, {"q": "Would you rather go caving or diving?", "a": "I'd rather go diving."}, {"q": "Would you prefer to eat shuwa or majboos?", "a": "I'd prefer to eat shuwa."}], "icon": "🎡"}, {"type": "explain", "title": "Sentence stress: had", "lines": ["In the Past perfect, we stress [[had]] ('d) and the main verb."], "img": "L22_c4", "rule": "Listen, say and clap on the stressed words 👏", "icon": "🔊"}, {"type": "flip", "title": "Sentence stress: had 🔊 – examples", "cards": [{"front": "After he'd [[finished]] his game, he went home.", "icon": "💡", "back": "🔊"}, {"front": "After they'd [[paraglided]], they ate lunch.", "icon": "✨", "back": "🔊"}, {"front": "After we'd [[watched]] the sunset, we went to bed.", "icon": "🔎", "back": "🔊"}, {"front": "After I'd [[walked]] up the hill, I saw the bay.", "icon": "📌", "back": "🔊"}]}, {"type": "match", "title": "Match and say", "pairs": [["I'd finished eating breakfast", "before I left home for school."], ["After we'd cycled for an hour,", "we had a break to drink some water."], ["They'd checked their work", "before they gave it to the teacher."]], "icon": "🧩"}, {"type": "match", "title": "Match and say", "pairs": [["After I'd finished the housework,", "I played a computer game."], ["We'd visited the whole museum", "before we went to the gift shop."], ["After they'd arrived in Muscat,", "they took a bus to the hotel."]], "icon": "🧩"}, {"type": "tf", "title": "True or False?", "items": [{"text": "Lucas and Frank are planning an adventure holiday.", "a": true, "fix": "I'm really looking forward to our adventure holiday."}, {"text": "On day one, they choose rock climbing.", "a": false, "fix": "They choose horse riding."}, {"text": "Frank is a bit scared of going underwater.", "a": true, "fix": "I'm a bit scared of going underwater."}], "icon": "✔✘"}, {"type": "tf", "title": "True or False?", "items": [{"text": "They must choose the same activity every day.", "a": false, "fix": "We can choose different things if we want to!"}, {"text": "Frank has been mountain biking before.", "a": true, "fix": "I've been mountain biking before."}], "icon": "✔✘"}, {"type": "build", "title": "Build the question", "mode": "words", "items": [{"a": "Would you rather go caving or abseiling?", "hint": "rather / caving / abseiling 🔦🪢"}, {"a": "Would you prefer to go skateboarding or surfboarding?", "hint": "prefer / skateboarding / surfboarding 🛹🏄"}, {"a": "Should we go paragliding or play tennis?", "hint": "should / paragliding / tennis 🪂🎾"}, {"a": "I'd prefer to go surfboarding.", "hint": "answer with prefer 🏄"}], "icon": "🧩"}, {"type": "race", "title": "Preference race", "qs": [{"q": "Would you ___ go hiking or diving?", "options": ["prefer", "should", "rather"], "a": 2}, {"q": "I'd prefer ___ surfboarding.", "options": ["go", "going to", "to go"], "a": 2}, {"q": "___ we go abseiling or mountain biking?", "options": ["Rather", "Prefer", "Should"], "a": 2}, {"q": "Why would Frank rather go hiking?", "options": ["He's tired.", "He's scared of going underwater.", "He's been hiking before."], "a": 1}, {"q": "Frank has been ___ before.", "options": ["horse riding", "mountain biking", "diving"], "a": 1}], "icon": "🏁"}, {"type": "steps", "title": "Let's remember!", "icon": "🧠", "steps": ["Ask: Would you rather …? · Would you prefer to …? · Should we …?", "Answer: I'd rather go … · I'd prefer to go … · I think we should go …", "We can choose different things – that's OK! 😊", "Stress had and the main verb: After I'd WALKED up the hill …"]}, {"type": "exit", "title": "Exit ticket", "items": [{"k": "3", "text": "Write a question with Would you rather …?"}, {"k": "2", "text": "Answer it with I'd rather …"}, {"k": "1", "text": "Correct the mistake: I'd rather to go caving."}], "icon": "🎟️"}, {"type": "homework", "title": "Homework", "head": "My homework", "items": ["Activity Book p. 35: Activities 1–3.", "Write a dialogue planning a 3-day activity holiday in Oman.", "Practise the Say it! phrases with your family."], "icon": "🏠"}]}, {"id": "L23", "unit": "U3", "unitName": "Unit 2: Adventure sports", "title": "Reading: Literacy – brochures and adverts", "code": "", "theme": "library", "emo": "🦁", "slides": [{"type": "cover", "say": "Unit 2 · Lesson 8 – Reading: Literacy – brochures and adverts"}, {"type": "goals", "title": "Today's goals", "items": ["I can recognise a brochure and why it was written.", "I can find positive, persuasive words in a brochure."], "icon": "🎯"}, {"type": "goals", "title": "Today's goals", "items": ["I can choose the best holiday for each person.", "I can plan an adventure holiday for a place in Oman or the world."], "icon": "🎯"}, {"type": "enter", "title": "Catch the POSITIVE words that sell things.", "gate": "✓", "items": [{"text": "perfect", "in": true}, {"text": "great", "in": true}, {"text": "stunning", "in": true}, {"text": "boring", "in": false}, {"text": "expensive", "in": false}, {"text": "dirty", "in": false}]}, {"type": "quiz", "title": "Read quickly – one minute!", "qs": [{"q": "What is this text and why was it written?", "o": ["a brochure which is trying to get you to go on an adventure holiday", "a story which is describing someone's adventure holiday", "a text book which is teaching you about different parts of the world"], "a": 0, "why": "MAKE YOUR NEXT HOLIDAY AN ADAMS' ADVENTURE!"}], "img": "L23_c1", "icon": "⏱️"}, {"type": "read", "title": "Extreme sport & safari adventures", "paras": ["MAKE YOUR NEXT HOLIDAY AN ADAMS' ADVENTURE!"], "img": "L23_c2", "icon": "📖"}, {"type": "read", "title": "Extreme sport & safari adventures", "paras": ["EXTREME SPORT ADVENTURES: You can't describe the feeling of excitement when you do an extreme sport for the first time. Once you try it for yourself, you'll keep coming back for more! You can go diving in Australia, mountain biking in Mexico or sandboarding in Oman. We have the [[perfect]] extreme sports holiday for you! Choose from many [[terrific]] activities in all parts of the world."], "img": "L23_c2", "icon": "📖"}, {"type": "read", "title": "Extreme sport & safari adventures", "paras": ["SAFARI ADVENTURES: Have you ever dreamed of seeing a lion or tiger where it lives, in its natural habitat? Then come and enjoy yourself on one of our [[stunning]] safari adventures. Go and see lions, elephants and rhinos in Africa or tigers in India or oryx in Oman. All our tour groups are small, which means you can get close to the animals and have an experience you'll never forget."], "img": "L23_c2", "icon": "📖"}, {"type": "read", "title": "Climbing & polar adventures", "paras": ["CLIMBING ADVENTURES: Do you want to climb to the top of the world? Then choose one of our climbing adventures. We have trips for everyone, from [[gentle]] hill climbing in the Salalah Mountains in Oman to rock climbing in Spain or mountain climbing in the Himalayas in Nepal. All our climbing adventures are run by [[expert]] climbers, so you're always safe."], "img": "L23_c3", "icon": "📖"}, {"type": "read", "title": "Climbing & polar adventures", "paras": ["POLAR ADVENTURES: Imagine watching a polar bear walking across the sea ice in the Arctic or a huge group of penguins keeping themselves warm in the Antarctic. These amazing, icy worlds are not very far away. You can see them on our polar adventures."], "img": "L23_c3", "icon": "📖"}, {"type": "read", "title": "Climbing & polar adventures", "paras": ["'After we'd tried these adventure holidays, we didn't want to go anywhere else!' Areej, Muscat."], "img": "L23_c3", "icon": "📖"}, {"type": "match", "title": "Words in context", "pairs": [["gentle", "doing things in a nice, kind and careful way"], ["stunning", "extremely beautiful or attractive"], ["terrific", "excellent or wonderful"], ["expert", "someone who has special skills and information"], ["perfect", "made with no problems or mistakes"]], "icon": "🧩"}, {"type": "sort", "title": "Which holiday?", "bins": [{"label": "Extreme Sport", "icon": "🏄"}, {"label": "Safari", "icon": "🦁"}, {"label": "Climbing", "icon": "🧗"}, {"label": "Polar", "icon": "🐧"}], "cards": [{"text": "diving in Australia", "icon": "", "bin": 0}, {"text": "sandboarding in Oman", "icon": "", "bin": 0}, {"text": "tigers in India", "icon": "", "bin": 1}, {"text": "small tour groups", "icon": "", "bin": 1}, {"text": "the Salalah Mountains", "icon": "", "bin": 2}, {"text": "expert climbers", "icon": "", "bin": 2}, {"text": "sea ice in the Arctic", "icon": "", "bin": 3}, {"text": "penguins in the Antarctic", "icon": "", "bin": 3}], "icon": "🗂️"}, {"type": "ask", "title": "The best holiday for each person", "qs": [{"q": "Thuriya: not very sporty; would like to go hiking in a valley or across green hills.", "a": "Climbing Adventures – gentle hill climbing in the Salalah Mountains."}, {"q": "Bushra: loves animals; next time would like to see polar bears or penguins.", "a": "Polar Adventures."}, {"q": "Laith: likes lots of activities like abseiling or surfboarding; scared of high places.", "a": "Extreme Sport Adventures."}, {"q": "Juma: went to the Antarctic last year; wants somewhere warm with interesting new animals.", "a": "Safari Adventures."}], "img": "L23_c4", "icon": "🧳"}, {"type": "ask", "title": "Answer the questions", "qs": [{"q": "Where can people go to play a sport on sand?", "a": "People can go to Oman to go sandboarding."}, {"q": "Where can you go to see tigers in their natural habitat?", "a": "You can go to India."}, {"q": "Why are safari adventure groups usually quite small?", "a": "So you can get close to the animals."}], "img": "L23_c1", "icon": "💭"}, {"type": "ask", "title": "Answer the questions", "qs": [{"q": "Where can new climbers get experience on easy hills?", "a": "In the Salalah Mountains in Oman."}, {"q": "Who helps to keep the climbing adventures safe?", "a": "Expert climbers."}, {"q": "Where must people go if they want to see penguins?", "a": "To the Antarctic."}], "icon": "💭"}, {"type": "tf", "title": "Fact or selling words?", "items": [{"text": "The brochure uses questions to get the reader interested.", "a": true, "fix": "Have you ever dreamed …? Do you want to climb …?"}, {"text": "The brochure uses lots of negative words.", "a": false, "fix": "It uses positive words: perfect, terrific, stunning."}, {"text": "Everything in an advert is always true.", "a": false, "fix": "Remember that they might not be true!"}, {"text": "The brochure talks to the reader with you and we.", "a": true, "fix": "We have the perfect … holiday for you!"}], "icon": "✔✘"}, {"type": "wheel", "title": "Which holiday would you choose?", "items": [{"q": "Which adventure holiday would you most like to go on? Why?", "a": "I'd like to go on a safari adventure because I love animals."}, {"q": "Which holiday would you NOT like? Why?", "a": "I wouldn't like the polar adventure because it's too cold!"}, {"q": "Would you rather see a lion or a polar bear?", "a": "I'd rather see a lion."}, {"q": "Would you prefer to climb in Salalah or in Nepal?", "a": "I'd prefer to climb in Salalah."}, {"q": "Which word in the brochure do you like best?", "a": "stunning / terrific …"}], "icon": "🎡"}, {"type": "ask", "title": "Plan an adventure holiday", "qs": [{"q": "Choose a place: the Amazon Rainforest, Jabal Samhan, Lake Baikal, Masirah Island or Sharqiyah Sands.", "a": "e.g. Masirah Island 🏝️"}, {"q": "Where is the place located? What's the weather like there?", "a": "Masirah Island is off the east coast of Oman. It's hot and sunny, and windy in summer."}, {"q": "What sports and other activities can you do there?", "a": "You can go surfboarding, swimming and fishing, and watch turtles."}, {"q": "What advice can you give people?", "a": "Take water and sun cream, and always go with an expert."}], "img": "L23_c1", "icon": "🗺️"}, {"type": "build", "title": "Spell the selling words", "mode": "letters", "items": [{"a": "perfect", "hint": "with no problems or mistakes", "emo": "💯"}, {"a": "terrific", "hint": "excellent, wonderful", "emo": "🤩"}, {"a": "stunning", "hint": "extremely beautiful", "emo": "😍"}, {"a": "gentle", "hint": "kind and careful; not difficult", "emo": "🌿"}, {"a": "expert", "hint": "someone with special skills", "emo": "🎓"}], "icon": "🔤"}, {"type": "race", "title": "Brochure race", "qs": [{"q": "Brochures and adverts are written to …", "options": ["teach grammar", "sell things", "tell stories"], "a": 1}, {"q": "Where can you see oryx?", "options": ["Spain", "Oman", "Nepal"], "a": 1}, {"q": "Climbing adventures are run by …", "options": ["penguins", "expert climbers", "Areej"], "a": 1}, {"q": "'Stunning' means …", "options": ["very cold", "extremely beautiful", "dangerous"], "a": 1}, {"q": "Where can you go mountain biking?", "options": ["India", "Mexico", "the Arctic"], "a": 1}, {"q": "Penguins keep ___ warm.", "options": ["ourselves", "itself", "themselves"], "a": 2}], "icon": "🏁"}, {"type": "steps", "title": "Let's remember!", "icon": "🧠", "steps": ["A brochure is written to sell something.", "It uses questions, you / we and positive words: perfect, terrific, stunning.", "Adams' Adventures: extreme sport, safari, climbing and polar holidays.", "Read adverts carefully – they might not be true! 🤔"]}, {"type": "exit", "title": "Exit ticket", "items": [{"k": "3", "text": "Why was the brochure written?"}, {"k": "2", "text": "Write two positive words from the brochure."}, {"k": "1", "text": "Which holiday is best for someone who loves penguins?"}], "icon": "🎟️"}, {"type": "homework", "title": "Homework", "head": "My homework", "items": ["Activity Book p. 36: Activities 1–4.", "Find a brochure or advert at home. Underline the positive words.", "Write three questions a brochure could ask the reader."], "icon": "🏠"}]}, {"id": "L24", "unit": "U3", "unitName": "Unit 2: Adventure sports", "title": "Writing: A brochure about an extreme sport", "code": "", "theme": "library", "emo": "🌊", "slides": [{"type": "cover", "say": "Unit 2 · Lesson 9 – Writing: a brochure"}, {"type": "goals", "title": "Today's goals", "items": ["I can say what makes a good brochure.", "I can use strong adjectives: brilliant, terrific, awful …"], "icon": "🎯"}, {"type": "goals", "title": "Today's goals", "items": ["I can plan a brochure for an outdoor activity.", "I can write and check my own brochure."], "icon": "🎯"}, {"type": "build", "title": "Strong adjectives", "mode": "letters", "items": [{"a": "brilliant", "hint": "very, very good", "emo": "🌟"}, {"a": "fantastic", "hint": "extremely good", "emo": "🤩"}, {"a": "delicious", "hint": "food that tastes very good", "emo": "😋"}, {"a": "terrible", "hint": "very, very bad", "emo": "😖"}, {"a": "awful", "hint": "very bad", "emo": "👎"}], "icon": "🔤"}, {"type": "quiz", "title": "What is the brochure trying to do?", "qs": [{"q": "This brochure is trying to get people …", "o": ["to buy equipment for water skiing at Qantab Beach.", "to come water skiing at Qantab Beach.", "to learn how to stay safe when you're water skiing."], "a": 1, "why": "Book today for the adventure of your life!"}], "img": "L24_c1", "icon": "✅"}, {"type": "read", "title": "Water skiing at Qantab Beach", "paras": ["WATER SKIING AT QANTAB BEACH", "Do you get really bored of doing the same sport all the time? Would you prefer to try something more exciting? Then how about trying water skiing at Qantab Beach!", "Water skiing is one of the most [[brilliant]] extreme sports in the world."], "img": "L24_c1", "icon": "📖"}, {"type": "read", "title": "Water skiing at Qantab Beach", "paras": ["Fly like a bird on the waves. Enjoy yourself in the [[gorgeous]] bay at Qantab Beach. Our expert teachers will help you to do your best. We provide all the [[equipment]]. You can do day or week courses.", "Book today for the adventure of your life!"], "img": "L24_c1", "icon": "📖"}, {"type": "quiz", "title": "How to write a brochure", "qs": [{"q": "It starts with ___ to make readers interested.", "o": ["sentences", "questions"], "a": 1, "why": "Do you get really bored …? Would you prefer …?"}, {"q": "It uses ___ adjectives to make readers want to buy the thing.", "o": ["exciting", "boring"], "a": 0, "why": "brilliant, gorgeous"}, {"q": "It uses ___ paragraphs that are easy to read.", "o": ["long", "short"], "a": 1, "why": "short lines with bullets"}, {"q": "It finishes with ___ sentence that readers will remember.", "o": ["a boring", "an interesting"], "a": 1, "why": "Book today for the adventure of your life!"}], "img": "L24_c2", "icon": "✅"}, {"type": "explain", "title": "Strong adjectives", "lines": ["Use strong adjectives in your writing. Use [[really]] before an adjective to make it stronger."], "img": "L24_c3", "rule": "Don't use nice – use excellent or brilliant. Don't use bad – use awful or terrible.", "icon": "💪"}, {"type": "flip", "title": "Strong adjectives 💪 – examples", "cards": [{"front": "nice → [[excellent]] / [[brilliant]]", "icon": "💡", "back": "😊 → 🤩"}, {"front": "bad → [[awful]] / [[terrible]]", "icon": "✨", "back": "🙁 → 😖"}, {"front": "good → [[great]] / [[fantastic]]", "icon": "🔎", "back": "👍 → 🌟"}, {"front": "It's [[really]] exciting!", "icon": "📌", "back": "really + adjective"}]}, {"type": "quiz", "title": "Make it stronger!", "icon": "✏️", "qs": [{"q": "We went to a very nice beach in Al Ashkharah. → We went to a ___ beach.", "o": ["fantastic", "terrible"], "a": 0}, {"q": "The weather was very bad the first day. → The weather was ___ the first day.", "o": ["terrible", "brilliant"], "a": 0}, {"q": "I tried surfboarding and I had a good time. → I had a ___ time.", "o": ["great", "awful"], "a": 0}, {"q": "I liked the food in Al Ashkharah. It was nice. → It was ___.", "o": ["delicious", "awful"], "a": 0}, {"q": "You should visit Al Ashkharah. It's a good place. → It's a ___ place.", "o": ["brilliant", "terrible"], "a": 0}, {"q": "The weather was bad so we couldn't go surfboarding. → The weather was ___.", "o": ["awful", "great"], "a": 0}]}, {"type": "sort", "title": "Strong positive or strong negative?", "bins": [{"label": "strong positive", "icon": "🤩"}, {"label": "strong negative", "icon": "😖"}], "cards": [{"text": "brilliant", "icon": "", "bin": 0}, {"text": "terrific", "icon": "", "bin": 0}, {"text": "gorgeous", "icon": "", "bin": 0}, {"text": "fantastic", "icon": "", "bin": 0}, {"text": "awful", "icon": "", "bin": 1}, {"text": "terrible", "icon": "", "bin": 1}, {"text": "horrible", "icon": "", "bin": 1}, {"text": "dreadful", "icon": "", "bin": 1}], "icon": "🗂️"}, {"type": "ask", "title": "A model brochure", "qs": [{"q": "What's the title?", "a": "PARAGLIDING AT EAST VALLEY – it says what the brochure is about."}, {"q": "Find the questions to the reader.", "a": "Do you want to fly through the air over the hills? Why don't you try paragliding?"}, {"q": "Find the exciting adjectives.", "a": "terrific, perfect, friendly"}, {"q": "Find the pronouns.", "a": "you, we"}, {"q": "How does it finish?", "a": "Your paragliding adventure awaits you!"}], "img": "L24_c4", "icon": "📄"}, {"type": "order", "title": "Plan your brochure", "items": ["Include a fun title for the brochure.", "Start the text with an interesting question.", "Use exciting adjectives to keep people interested.", "Use short paragraphs that people can read easily and use pronouns, e.g. you and we.", "Finish with an interesting comment so people remember what you are writing about.", "Add an exciting picture to get people's attention."], "icon": "🔢"}, {"type": "write", "title": "Write your brochure", "task": "Write a brochure about a different extreme sport (for example: sandboarding in the Sharqiyah Sands, diving at the Daymaniyat Islands, caving in Al Hoota Cave).", "steps": ["Write a plan.", "Write a fun title.", "Start with an interesting question.", "Use strong adjectives, you and we, and short paragraphs.", "Finish with a sentence people will remember.", "Read and check your brochure."], "words": ["Do you want to …?", "Why don't you try …?", "terrific", "stunning", "brilliant", "perfect", "Our expert teachers …", "We provide …", "Book today!"], "model": "SANDBOARDING IN THE SHARQIYAH SANDS\nDo you love going fast? Would you like to fly down a golden sand dune? Then try sandboarding!\nThe Sharqiyah Sands are the perfect place for this terrific sport.\n• Our expert instructors will help you.\n• We provide boards, helmets and knee pads.\n• You can watch a stunning sunset after your lesson.\nBook today for a really brilliant desert adventure!", "icon": "✍️"}, {"type": "tf", "title": "Check your work", "items": [{"text": "A good brochure has a fun title.", "a": true, "fix": "Have I included a fun title?"}, {"text": "A good brochure starts with a long, boring paragraph.", "a": false, "fix": "Start with an interesting question."}, {"text": "A good brochure uses exciting words.", "a": true, "fix": "Have I used exciting words to make the text interesting?"}], "icon": "✔✘"}, {"type": "tf", "title": "Check your work", "items": [{"text": "A good brochure has long paragraphs.", "a": false, "fix": "Use short, easy-to-read paragraphs."}, {"text": "A good brochure finishes with a sentence people will remember.", "a": true, "fix": "Have I finished with a sentence that people will remember?"}], "icon": "✔✘"}, {"type": "ask", "title": "Brochure or story?", "qs": [{"q": "Who is a brochure written for?", "a": "For people who might buy something / come to an activity."}, {"q": "Why does the Qantab brochure ask questions?", "a": "To make readers interested."}, {"q": "Which words make water skiing sound exciting?", "a": "brilliant, gorgeous, Fly like a bird, the adventure of your life"}, {"q": "What would you add to the brochure?", "a": "a price, a phone number, a photo …"}], "img": "L24_c1", "icon": "🤔"}, {"type": "boxes", "title": "Brochure boxes", "boxes": [{"label": "1", "q": "Make it stronger: The food was nice.", "a": "The food was delicious."}, {"label": "2", "q": "Make it stronger: The weather was bad.", "a": "The weather was awful / t
