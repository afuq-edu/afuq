alk about recycling plastic bottles.", "Ali talks about the water running in the sink.", "They decide to put their ideas on the WOW! website.", "Ali reminds Eric to turn off the computer."], "icon": "🔢"}, {"type": "explain", "title": "Useful expressions", "icon": "🗣️", "lines": ["Brilliant! → when you think an idea is great.", "I know! → when you suddenly have an idea or the answer.", "Me too! → when the same is true for you."], "rule": "Brilliant! · I know! · Me too!"}, {"type": "flip", "title": "Useful expressions 💬 – examples", "cards": [{"front": "Let's put our ideas on the website. – [[Brilliant!]]", "icon": "💡", "back": "🤩"}, {"front": "What can we do? – [[I know!]] We need to switch off lights.", "icon": "✨", "back": "💡"}, {"front": "I found the water running. – [[Me too!]]", "icon": "🔎", "back": "🙋"}]}, {"type": "quiz", "title": "Which expression?", "icon": "✏️", "qs": [{"q": "A: I think recycling is very important. B: ___ I recycle as much as possible.", "o": ["Me too!", "Brilliant!", "I know!"], "a": 0}, {"q": "A: What can you do to save water at home? B: ___ I can have shorter showers.", "o": ["I know!", "Me too!", "Brilliant!"], "a": 0}, {"q": "A: I'm writing a blog about clean energy. B: ___ You're so creative!", "o": ["Brilliant!", "Me too!", "I know!"], "a": 0}, {"q": "B: How can we use less paper at school? A: ___ We can do our homework online!", "o": ["I know!", "Me too!", "Brilliant!"], "a": 0}, {"q": "A: I want to look for a new tablet. B: ___ My tablet is broken.", "o": ["Me too!", "I know!", "Brilliant!"], "a": 0}, {"q": "A: Look! I got full marks in our Science test! B: ___ You're so clever.", "o": ["Brilliant!", "Me too!", "I know!"], "a": 0}]}, {"type": "ask", "title": "Act out the dialogues", "qs": [{"q": "I watched a programme on TV last night about the future of our planet.", "a": "Me too!"}, {"q": "How can we save energy?", "a": "I know! Let's switch off some of the lights."}, {"q": "We won the competition!", "a": "Brilliant!"}], "img": "L04_c3", "icon": "🎭"}, {"type": "wheel", "title": "Our school competition", "items": [{"q": "What would you do to save energy in your classroom?", "a": "I'd switch off the lights and the fans when we go out."}, {"q": "What about the computer room?", "a": "We'd turn off all the computers at the end of the day."}, {"q": "How can we keep the classroom cool?", "a": "We can close the doors and the curtains."}, {"q": "How can we save water at school?", "a": "We can turn off the taps and report broken ones."}, {"q": "How can we tell other students?", "a": "We can make posters and use the school radio."}, {"q": "What can we recycle at school?", "a": "Paper, plastic bottles and cans."}], "icon": "🎡"}, {"type": "balloons", "title": "Pop the right answer!", "rounds": [{"q": "The competition is to save the most …", "o": ["water", "energy", "paper"], "a": 1}, {"q": "Closing doors keeps the classroom …", "o": ["cool", "warm", "clean"], "a": 0}, {"q": "The school has recycling boxes for …", "o": ["plastic", "paper", "cans"], "a": 1}], "icon": "🎈"}, {"type": "balloons", "title": "Pop the right answer!", "rounds": [{"q": "Ali found water running in the …", "o": ["kitchen", "garden", "bathroom"], "a": 2}, {"q": "They will put their ideas on the …", "o": ["newsletter", "WOW! website", "radio"], "a": 1}, {"q": "We won! – …", "o": ["Brilliant!", "Me too!", "Sorry!"], "a": 0}], "icon": "🎈"}, {"type": "steps", "title": "Let's remember!", "icon": "🧠", "steps": ["The competition: which school can save the most energy?", "Ideas: switch off lights, turn off computers, close doors, recycle plastic, save water.", "Brilliant! · I know! · Me too!"]}, {"type": "exit", "title": "Exit ticket", "items": [{"k": "3", "text": "Give two ideas from the dialogue to save energy."}, {"k": "2", "text": "When do we say 'Me too!'?"}, {"k": "1", "text": "What will you do today to save energy?"}], "icon": "🎟️"}, {"type": "homework", "title": "Homework", "head": "My homework", "items": ["Activity Book p. 11 (Activities 1–4).", "Write a short dialogue with Brilliant!, I know! and Me too!", "Make a mini poster: 3 ways to save energy at school."], "icon": "🏠"}]}, {"id": "L05", "unit": "U2", "unitName": "Unit 1: Our planet", "title": "Modal verbs of obligation: must, should, need to", "code": "", "theme": "space", "emo": "📏", "slides": [{"type": "cover", "say": "Modal verbs of obligation"}, {"type": "goals", "title": "Today's goals", "items": ["I can use should / shouldn't to give advice.", "I can use must / need to for things that are necessary."], "icon": "🎯"}, {"type": "goals", "title": "Today's goals", "items": ["I can tell the difference between mustn't and needn't.", "I can talk about rules at school and ways to save water."], "icon": "🎯"}, {"type": "ask", "title": "Remember the dialogue?", "qs": [{"q": "How are the children going to save energy? List their ideas.", "a": "Switch off lights, turn off computers, close doors, recycle plastic bottles, save water."}, {"q": "Which words did they use? 'We ___ switch off lights.'", "a": "We need to switch off lights."}, {"q": "'We ___ close doors, too.'", "a": "We must close doors, too."}], "icon": "💭"}, {"type": "explain", "title": "Modal verbs", "icon": "📏", "lines": ["We use should when you think something is the right thing to do.", "We use need to and must when it is necessary to do something."], "img": "L05_c1", "rule": "should / must + verb · need to + verb"}, {"type": "flip", "title": "Modal verbs ✅ – examples", "cards": [{"front": "We [[should]] take part in the competition.", "icon": "💡", "back": "👍"}, {"front": "We [[shouldn't]] throw away plastic bottles.", "icon": "✨", "back": "👎"}, {"front": "We [[must]] close doors.", "icon": "🔎", "back": "🚪"}, {"front": "We [[need to]] switch off the lights when we leave a room.", "icon": "📌", "back": "💡"}]}, {"type": "explain", "title": "mustn't or needn't?", "icon": "⚖️", "lines": ["We use needn't when it is not necessary to do something.", "We use mustn't when it is necessary not to do something."], "rule": "mustn't = don't do it! · needn't = you don't have to"}, {"type": "flip", "title": "mustn't or needn't? ⛔ – examples", "cards": [{"front": "We [[mustn't]] waste water. ⛔", "icon": "💡", "back": "🚱"}, {"front": "We [[needn't]] put our ideas in the newsletter. (It's OK – we can use the website.)", "icon": "✨", "back": "🤷"}, {"front": "You [[mustn't]] use mobile phones in class.", "icon": "🔎", "back": "📵"}, {"front": "You [[needn't]] bring any paper to school.", "icon": "📌", "back": "📄"}]}, {"type": "quiz", "title": "Circle the rules", "qs": [{"q": "We use should when you think something ___ the right thing to do.", "o": ["is", "isn't"], "a": 0}, {"q": "We use need to and must when it ___ necessary to do something.", "o": ["is", "isn't"], "a": 0}, {"q": "We use ___ when it is not necessary to do something.", "o": ["needn't", "mustn't"], "a": 0}, {"q": "We use ___ when it is necessary not to do something.", "o": ["needn't", "mustn't"], "a": 1}], "icon": "✅"}, {"type": "sort", "title": "Find the modals in the dialogue", "bins": [{"label": "must / need to", "icon": "✅"}, {"label": "should / shouldn't", "icon": "👍"}, {"label": "mustn't / needn't", "icon": "⛔"}], "cards": [{"text": "We need to switch off lights.", "icon": "", "bin": 0}, {"text": "We must close doors, too.", "icon": "", "bin": 0}, {"text": "We must go or we'll be late.", "icon": "", "bin": 0}, {"text": "We should take part in it!", "icon": "", "bin": 1}, {"text": "We shouldn't just throw them away.", "icon": "", "bin": 1}, {"text": "What else should we do?", "icon": "", "bin": 1}, {"text": "We mustn't do that.", "icon": "", "bin": 2}, {"text": "No, we needn't do that.", "icon": "", "bin": 2}], "icon": "🔍"}, {"type": "quiz", "title": "Circle the correct modal verb", "icon": "✏️", "qs": [{"q": "We ___ use more electric cars to reduce air pollution.", "o": ["need to", "shouldn't", "mustn't"], "a": 0}, {"q": "All the students ___ do their homework. It's very important.", "o": ["must", "need", "shouldn't"], "a": 0}, {"q": "People ___ leave the lights on when they go out.", "o": ["shouldn't", "need to", "must"], "a": 0}, {"q": "You ___ waste energy because it's bad for the environment.", "o": ["mustn't", "needn't", "should"], "a": 0}, {"q": "We ___ print so many things on paper. It's a waste!", "o": ["needn't", "must", "should"], "a": 0}, {"q": "She ___ have a quick shower instead of a long shower.", "o": ["should", "must", "need"], "a": 0}]}, {"type": "ask", "title": "Rules at our school", "qs": [{"q": "Something you must do at school:", "a": "We must wear a school uniform."}, {"q": "Something you should do:", "a": "We should work hard."}, {"q": "Something you need to do:", "a": "We need to be polite."}], "img": "L05_c2", "icon": "🏫"}, {"type": "ask", "title": "Rules at our school", "qs": [{"q": "Something you mustn't do:", "a": "We mustn't use mobile phones."}, {"q": "Something you shouldn't do:", "a": "We shouldn't forget our homework."}, {"q": "Something you needn't do:", "a": "We needn't bring any paper to school."}], "icon": "🏫"}, {"type": "ask", "title": "Listen: choose the picture", "qs": [{"q": "1 Mohammed is talking to his mother. What must he recycle?", "a": "Listen to 1.6 and choose A, B or C."}, {"q": "2 Zaid is talking to his father. What should he do to save energy?", "a": "Listen to 1.6 and choose A, B or C."}, {"q": "Is Mohammed's mum going to use the plastic water bottle again?", "a": "Listen again (1.7) and say why."}, {"q": "Should Zaid's family have quick showers instead of long showers?", "a": "Listen again (1.7) and say why."}], "img": "L05_c3", "icon": "🎧"}, {"type": "build", "title": "Order the words", "mode": "words", "items": [{"a": "People should switch off lights.", "hint": "lights / people / off / switch / should", "emo": "💡"}, {"a": "Everyone must protect the environment.", "hint": "protect / must / the environment / everyone", "emo": "🌍"}, {"a": "People shouldn't destroy the rainforests.", "hint": "people / rainforests / the / shouldn't / destroy", "emo": "🌳"}, {"a": "People must plant lots of new trees.", "hint": "new / must / lots / people / trees / of / plant", "emo": "🌱"}], "icon": "🧱"}, {"type": "ask", "title": "Say it another way", "qs": [{"q": "Don't throw rubbish on the ground. (should)", "a": "You shouldn't throw rubbish on the ground."}, {"q": "We have to stop cutting down trees. (must)", "a": "We must stop cutting down trees."}, {"q": "I don't have to tidy my room today. (need)", "a": "I needn't tidy my room today."}], "icon": "🔁"}, {"type": "ask", "title": "Say it another way", "qs": [{"q": "Hilal, please don't shout in the classroom. (must)", "a": "Hilal, you mustn't shout in the classroom."}, {"q": "Why don't you put on a sweater? (should)", "a": "You should put on a sweater."}, {"q": "People should recycle more plastic. (need)", "a": "People need to recycle more plastic."}], "icon": "🔁"}, {"type": "tf", "title": "Listen and tick", "items": [{"text": "'Osama needn't make a poster' means he doesn't have to make one.", "a": true, "fix": "needn't = not necessary"}, {"text": "'Saeed mustn't forget his Maths book' means it is OK to forget it.", "a": false, "fix": "mustn't = it is necessary NOT to forget it."}, {"text": "'Najla needs to be home at six o'clock' means it is necessary.", "a": true, "fix": "need to = necessary"}, {"text": "'Anood shouldn't go to the cinema' gives advice.", "a": true, "fix": "should / shouldn't = advice"}], "icon": "✔✘"}, {"type": "wheel", "title": "Save water!", "items": [{"q": "I have a long shower every day.", "a": "You needn't have a long shower every day. You should have quick showers."}, {"q": "I leave the tap on when I brush my teeth.", "a": "You mustn't leave the tap on. You should turn it off."}, {"q": "I water the garden at midday.", "a": "You should water it in the evening."}, {"q": "I wash the car every day.", "a": "You needn't wash it every day."}, {"q": "The tap in our kitchen is broken.", "a": "You need to fix it."}, {"q": "I use a lot of water to wash the dishes.", "a": "You should fill the sink and not leave the water running."}], "icon": "🎡"}, {"type": "boxes", "title": "Treasure boxes", "boxes": [{"label": "1", "q": "Complete: We ___ waste water. (it's necessary not to)", "a": "mustn't"}, {"label": "2", "q": "Complete: You ___ bring paper. (not necessary)", "a": "needn't"}, {"label": "3", "q": "Give advice: I'm always tired.", "a": "You should go to bed early."}, {"label": "4", "q": "Correct it: We must to close doors.", "a": "We must close doors."}, {"label": "5", "q": "Correct it: She need recycle plastic.", "a": "She needs to recycle plastic."}, {"label": "6", "q": "Say a rule for the library.", "a": "You mustn't talk loudly in the library."}], "icon": "🎁"}, {"type": "summary", "title": "Let's remember!", "center": "Modal verbs of obligation: must, should, need to", "branches": ["should / shouldn't → the right thing to do (advice).", "must / need to → necessary.", "mustn't → necessary NOT to do it.  needn't → not necessary.", "must, should + verb (no 'to') · need to + verb"], "icon": "🧠"}, {"type": "exit", "title": "Exit ticket", "items": [{"k": "3", "text": "Write one rule with must and one with mustn't."}, {"k": "2", "text": "What's the difference between mustn't and needn't?"}, {"k": "1", "text": "Give advice to save energy with should."}], "icon": "🎟️"}, {"type": "homework", "title": "Homework", "head": "My homework", "items": ["Activity Book pp. 12–13 (Activities 1–4).", "Grammar practice AB p. 60 (Activities 1–2).", "Write six rules for your home with must, mustn't, should, shouldn't, need to, needn't."], "icon": "🏠"}]}, {"id": "L06", "unit": "U2", "unitName": "Unit 1: Our planet", "title": "Book club: A frightening experience (a diary)", "code": "", "theme": "space", "emo": "📔", "slides": [{"type": "cover", "say": "WOW! Book Club – Khalid's diary"}, {"type": "goals", "title": "Today's goals", "items": ["I can say what a diary is like.", "I can read a diary about a cyclone.", "I can put the events of the story in order."], "icon": "🎯"}, {"type": "goals", "title": "Today's goals", "items": ["I can use phrasal verbs with get.", "I can write a diary paragraph about a natural disaster."], "icon": "🎯"}, {"type": "quiz", "title": "What is a diary?", "qs": [{"q": "A diary entry is written in the …", "o": ["first person (I)", "third person (he/she)"], "a": 0}, {"q": "Diaries are usually …", "o": ["formal", "informal"], "a": 1}, {"q": "A diary usually describes what happens in …", "o": ["the writer's life", "a newspaper article"], "a": 0}, {"q": "A diary often describes the writer's …", "o": ["feelings", "clothes"], "a": 0}], "icon": "📔"}, {"type": "build", "title": "Storm words", "mode": "letters", "items": [{"a": "cyclone", "hint": "a very big storm with strong winds", "emo": "🌀"}, {"a": "thunder", "hint": "the loud noise in a storm", "emo": "🔊"}, {"a": "lightning", "hint": "the bright light in a storm", "emo": "⚡"}, {"a": "flood", "hint": "a lot of water on the land", "emo": "🌊"}, {"a": "panic", "hint": "feel very afraid and not think clearly", "emo": "😱"}], "icon": "🌩️"}, {"type": "read", "title": "Dear Diary (1)", "paras": ["7th June, Thursday. Dear Diary, Yesterday I had one of the most [[frightening]] experiences of my life!"], "img": "L06_c1", "icon": "📖"}, {"type": "read", "title": "Dear Diary (1)", "paras": ["I was staying at my grandparents' house with my mum, dad and little brother. My aunt and uncle and cousins were there too. I was woken up early by a big storm. I got up and looked out of the window of my bedroom. I listened to the loud thunder and watched the amazing lightning. It wasn't scary at that time – it was exciting!"], "img": "L06_c1", "icon": "📖"}, {"type": "read", "title": "Dear Diary (1)", "paras": ["But then I looked at my dad's phone and saw on the news that a cyclone was coming. I asked my dad what a cyclone was and I asked him if he knew what to do. He told me not to worry, but to follow [[safety instructions]] because cyclones can be dangerous. We stayed in a safe room away from the windows and listened to the news. There was a flood in the [[harbour]] and a strong wind was blowing the trees!"], "img": "L06_c1", "icon": "📖"}, {"type": "read", "title": "Dear Diary (2)", "paras": ["The winds got stronger and stronger. In the evening, Grandpa told us not to [[panic]] but to go to the dining room. I asked him why he was sending us there and he said that it was the safest place in the house."], "img": "L06_c2", "icon": "📖"}, {"type": "read", "title": "Dear Diary (2)", "paras": ["My aunt and uncle and cousins were already in the dining room. When we were all inside, we put the [[furniture]] in front of the doors and then we got down on the floor together in the corner. We waited and waited. The winds got louder, the rain was falling on the roof and then it suddenly went dark. My dad told me to hold his hand. I asked him if he was scared and he told me not to be scared."], "img": "L06_c2", "icon": "📖"}, {"type": "read", "title": "Dear Diary (2)", "paras": ["We stayed there for a long time, listening to the wild weather. Finally, morning arrived and the rain stopped. I couldn't believe that the cyclone was finally over and I felt so happy that we were safe. I hope I never have a night like that again. Khalid"], "img": "L06_c2", "icon": "📖"}, {"type": "order", "title": "Number the events", "items": ["Khalid woke up early and watched the big storm.", "Khalid's dad said he shouldn't worry.", "The cyclone flooded a local harbour.", "The whole family went to the dining room.", "Everyone got down on the floor and waited.", "The lights went out and the room was dark."], "icon": "🔢"}, {"type": "ask", "title": "Answer the questions", "qs": [{"q": "Why did Khalid get up early?", "a": "He got up early because the storm woke him up."}, {"q": "How did he know about the cyclone?", "a": "He saw it on the news on his dad's phone."}, {"q": "Where did he spend the first morning?", "a": "In a safe room away from the windows."}], "img": "L06_c3", "icon": "💭"}, {"type": "ask", "title": "Answer the questions", "qs": [{"q": "Why did the family go to the dining room?", "a": "Because it was the safest place in the house."}, {"q": "What did everyone do with all the furniture?", "a": "They put it in front of the doors."}, {"q": "What did Khalid's dad tell him to do when it went dark?", "a": "He told him to hold his hand."}], "icon": "💭"}, {"type": "tf", "title": "True or False?", "items": [{"text": "Khalid was at his own house.", "a": false, "fix": "He was staying at his grandparents' house."}, {"text": "At first, the storm was exciting for Khalid.", "a": true, "fix": "It wasn't scary at that time – it was exciting!"}, {"text": "Grandpa told them to panic.", "a": false, "fix": "Grandpa told us not to panic."}], "icon": "✔✘"}, {"type": "tf", "title": "True or False?", "items": [{"text": "The family got down on the floor in the corner.", "a": true, "fix": "We got down on the floor together in the corner."}, {"text": "Khalid wants to have a night like that again.", "a": false, "fix": "I hope I never have a night like that again."}], "icon": "✔✘"}, {"type": "explain", "title": "Phrasal verbs with get", "icon": "🧗", "lines": ["We can combine the verb get with prepositions to make phrasal verbs.", "get + up = get up"], "rule": "get up · get down · get out · get into · get under · get onto"}, {"type": "flip", "title": "Phrasal verbs with get 💡 – examples", "cards": [{"front": "Why did he [[get up]]? He got up because the storm woke him up.", "icon": "💡", "back": "🛏️"}, {"front": "We [[got down]] on the floor together.", "icon": "✨", "back": "⬇️"}, {"front": "[[Get out]] of the house if there is a fire!", "icon": "🔎", "back": "🚪"}, {"front": "[[Get into]] the car. / [[Get under]] a table. / [[Get onto]] the roof.", "icon": "📌", "back": "🚗"}]}, {"type": "quiz", "title": "Complete with a phrasal verb", "icon": "✏️", "qs": [{"q": "If there's an earthquake, you should ___ a table.", "o": ["get under", "get onto"], "a": 0}, {"q": "Please ___ the car. We have to leave now.", "o": ["get into", "get down"], "a": 0}, {"q": "How did your cat ___ that tree?", "o": ["get up", "get out"], "a": 0}, {"q": "You must ___ of the house if there is a fire.", "o": ["get out", "get under"], "a": 0}, {"q": "How fast can you ___ the stairs to the front door in an emergency?", "o": ["get down", "get into"], "a": 0}, {"q": "My father used a ladder to ___ the roof.", "o": ["get onto", "get out"], "a": 0}]}, {"type": "memory", "title": "Memory: get + …", "pairs": [["get up", "🛏️⬆️"], ["get down", "⬇️"], ["get out", "🚪🏃"], ["get into", "🚗"], ["get under", "🪑"], ["get onto", "🪜🏠"]], "icon": "🧠"}, {"type": "wheel", "title": "Imagine a cyclone", "items": [{"q": "Where do you go?", "a": "We go to the safest room in the house, away from windows."}, {"q": "What do you do?", "a": "We listen to the news and follow safety instructions."}, {"q": "How do you feel?", "a": "I feel scared but I try not to panic."}, {"q": "Who do you stay with?", "a": "I stay with my family."}, {"q": "What do you take with you?", "a": "Water, food, a torch and a phone."}, {"q": "What do you do after the cyclone?", "a": "We help to clean up and check on our neighbours."}], "icon": "🎡"}, {"type": "write", "title": "Dear Diary …", "task": "Write a paragraph from a diary to describe a natural disaster. Don't say what it is!", "steps": ["Start with the date and Dear Diary,", "Say where you were and who you were with.", "Describe what you saw and heard.", "Say how you felt (first person: I …).", "Say how it ended."], "words": ["Yesterday I had one of the most … experiences of my life", "I was woken up by", "suddenly", "I felt", "Finally", "I hope I never …"], "model": "Dear Diary,\nYesterday I had one of the most frightening experiences of my life! We were driving in the desert when suddenly the sky went orange. The wind was very strong and I couldn't see anything. Dad told us to close the windows. Finally, it stopped. (What was it? – a sandstorm)", "icon": "✍️"}, {"type": "race", "title": "Diary race", "qs": [{"q": "A diary is usually written in the …", "options": ["first person", "third person"], "a": 0}, {"q": "Khalid was at his …", "options": ["school", "grandparents' house", "uncle's car"], "a": 1}, {"q": "The safest place in the house was the …", "options": ["bedroom", "kitchen", "dining room"], "a": 2}, {"q": "They put the furniture in front of the …", "options": ["doors", "windows", "TV"], "a": 0}, {"q": "If there's an earthquake, ___ a table.", "options": ["get under", "get onto", "get out"], "a": 0}, {"q": "At the end, Khalid felt …", "options": ["angry", "happy", "bored"], "a": 1}], "icon": "🏎️"}, {"type": "steps", "title": "Let's remember!", "icon": "🧠", "steps": ["A diary: first person (I), informal, about the writer's life and feelings.", "Khalid's cyclone: storm → news → safe room → dining room → dark → morning, safe!", "get up · get down · get out · get into · get under · get onto"]}, {"type": "exit", "title": "Exit ticket", "items": [{"k": "3", "text": "Name two features of a diary."}, {"k": "2", "text": "Why did the family go to the dining room?"}, {"k": "1", "text": "Write a sentence with get out or get under."}], "icon": "🎟️"}, {"type": "homework", "title": "Homework", "head": "My homework", "items": ["Activity Book pp. 14–15 (Activities 1–4).", "Write six sentences with the six phrasal verbs with get.", "Finish your diary paragraph about a natural disaster."], "icon": "🏠"}]}, {"id": "L07", "unit": "U2", "unitName": "Unit 1: Our planet", "title": "Extreme weather & Reported speech: questions and commands", "code": "", "theme": "space", "emo": "🌪️", "slides": [{"type": "cover", "say": "Natural disasters & reported questions and commands"}, {"type": "goals", "title": "Today's goals", "items": ["I can name 12 types of extreme weather and natural disasters.", "I can report Wh- questions: I asked my dad what a cyclone was."], "icon": "🎯"}, {"type": "goals", "title": "Today's goals", "items": ["I can report yes/no questions with if.", "I can report commands: He told me (not) to …"], "icon": "🎯"}, {"type": "mystery", "title": "What's in the picture?", "img": "L07_c1", "answer": "12 kinds of extreme weather! ⛈️", "qs": [{"q": "Very hot weather for a long time:", "o": ["heatwave", "snowstorm"], "a": 0}, {"q": "No rain for weeks and weeks:", "o": ["flood", "drought"], "a": 1}, {"q": "A mountain that throws out fire and rock:", "o": ["volcano", "tornado"], "a": 0}, {"q": "A huge wave from the sea:", "o": ["tsunami", "hailstorm"], "a": 0}], "icon": "🕵️"}, {"type": "flip", "title": "Extreme weather (1)", "cards": [{"front": "hailstorm", "icon": "🧊🌨️", "back": "a storm with small balls of ice\n«The hailstorm covered the street with ice. (photo 1)»"}, {"front": "thunder and lightning", "icon": "⚡🔊", "back": "loud noise and bright light in a storm\n«Khalid watched the amazing lightning. (photo 2)»"}, {"front": "snowstorm", "icon": "❄️🌨️", "back": "a storm with a lot of snow\n«The cars were under the snow. (photo 3)»"}, {"front": "heatwave", "icon": "🌡️☀️", "back": "very hot weather for a long time\n«Drink lots of water in a heatwave. (photo 4)»"}, {"front": "cyclone", "icon": "🌀", "back": "a huge storm with strong winds that blow in circles\n«A cyclone was coming. (photo 5)»"}, {"front": "sandstorm", "icon": "🏜️💨", "back": "strong wind that carries sand\n«Stay inside in a sandstorm. (photo 6)»"}], "icon": "🔤"}, {"type": "flip", "title": "Extreme weather (2)", "cards": [{"front": "tornado", "icon": "🌪️", "back": "a small, very strong wind that turns in circles\n«A tornado is smaller than a cyclone. (photo 7)»"}, {"front": "tsunami", "icon": "🌊", "back": "a huge wave from the sea\n«The tsunami hit the town. (photo 8)»"}, {"front": "drought", "icon": "🏜️💧", "back": "a long time without rain\n«In a drought, everything gets dry. (photo 9)»"}, {"front": "flood", "icon": "🏠🌊", "back": "a lot of water covering the land\n«There was a flood in the harbour. (photo 10)»"}, {"front": "volcano", "icon": "🌋", "back": "a mountain that throws out hot rock\n«The volcano is very dangerous. (photo 11)»"}, {"front": "forest fire", "icon": "🌲🔥", "back": "a big fire in a forest\n«Firefighters put out the forest fire. (photo 12)»"}], "icon": "🔤"}, {"type": "match", "title": "Look and match", "pairs": [["Photo 2", "thunder and lightning ⚡"], ["Photo 4", "heatwave 🌡️"], ["Photo 5", "cyclone 🌀"]], "icon": "🧩"}, {"type": "match", "title": "Look and match", "pairs": [["Photo 6", "sandstorm 🏜️"], ["Photo 9", "drought 🏜️"], ["Photo 11", "volcano 🌋"]], "icon": "🧩"}, {"type": "sort", "title": "Wind, water, heat or cold?", "bins": [{"label": "wind", "icon": "💨"}, {"label": "water", "icon": "💧"}, {"label": "heat", "icon": "🔥"}, {"label": "ice & snow", "icon": "❄️"}], "cards": [{"text": "cyclone", "icon": "", "bin": 0}, {"text": "tornado", "icon": "", "bin": 0}, {"text": "sandstorm", "icon": "", "bin": 0}, {"text": "flood", "icon": "", "bin": 1}, {"text": "tsunami", "icon": "", "bin": 1}, {"text": "heatwave", "icon": "", "bin": 2}, {"text": "drought", "icon": "", "bin": 2}, {"text": "forest fire", "icon": "", "bin": 2}, {"text": "snowstorm", "icon": "", "bin": 3}, {"text": "hailstorm", "icon": "", "bin": 3}], "icon": "🗂️"}, {"type": "match", "title": "Who said it?", "pairs": [["'What's a cyclone?'", "Khalid"], ["'Don't worry! A cyclone is just a big storm.'", "Khalid's dad"], ["'Do you know what to do?'", "Khalid"]], "icon": "🗣️"}, {"type": "match", "title": "Who said it?", "pairs": [["'Go to the dining room, please.'", "Khalid's grandpa"], ["'Don't panic.'", "Khalid's grandpa"], ["'Hold my hand.'", "Khalid's dad"]], "icon": "🗣️"}, {"type": "explain", "title": "Reported questions", "icon": "🗨️", "lines": ["When we report questions, we change present tenses to past tenses and we sometimes change pronouns (you → he).", "Wh- questions: ask + question word.  Yes/no questions: ask + if."], "img": "L07_c2", "rule": "asked + (person) + question word / if + subject + past verb"}, {"type": "flip", "title": "Reported questions 💡 – examples", "cards": [{"front": "'What is a cyclone?' → I asked my dad [[what a cyclone was]].", "icon": "💡", "back": "🌀"}, {"front": "'Do you know what to do?' → I asked him [[if he knew]] what to do.", "icon": "✨", "back": "❓"}]}, {"type": "explain", "title": "Reported commands", "icon": "📢", "lines": ["When we report commands, we use tell + pronoun + to + verb.", "Negative: tell + pronoun + not to + verb."], "rule": "told + me/us/him/her + (not) to + verb"}, {"type": "flip", "title": "Reported commands 💡 – examples", "cards": [{"front": "'Get out!' → Grandpa [[told us to get out]].", "icon": "💡", "back": "🚪"}, {"front": "'Don't panic!' → He [[told me not to panic]].", "icon": "✨", "back": "😱"}, {"front": "'Hold my hand.' → My dad told me [[to hold]] his hand.", "icon": "🔎", "back": "🤝"}]}, {"type": "quiz", "title": "Circle the rules", "qs": [{"q": "When we report questions, we change present tenses to ___ tenses.", "o": ["past", "future"], "a": 0}, {"q": "We sometimes ___ pronouns, e.g. you becomes he.", "o": ["change", "don't change"], "a": 0}, {"q": "When we report Wh- questions, we use ___ + question word.", "o": ["say", "ask"], "a": 1}, {"q": "When we report yes/no questions, we use ___ + if.", "o": ["ask", "tell"], "a": 0}, {"q": "When we report commands, we use ___ + pronoun + to + verb.", "o": ["ask", "tell"], "a": 1}], "icon": "✅"}, {"type": "ask", "title": "Report the questions", "qs": [{"q": "Adil: 'Are you busy, Yousuf?'", "a": "Adil asked Yousuf if he was busy."}, {"q": "Reem: 'Where do penguins live?'", "a": "Reem asked where penguins lived."}, {"q": "Hanan: 'Does a tornado last a long time?'", "a": "Hanan asked if a tornado lasted a long time."}], "img": "L07_c4", "icon": "💭"}, {"type": "ask", "title": "Report the questions", "qs": [{"q": "Issa: 'When is it summer in Australia?'", "a": "Issa asked when it was summer in Australia."}, {"q": "Hashim: 'Is a tsunami very dangerous?'", "a": "Hashim asked if a tsunami was very dangerous."}, {"q": "Noora: 'What can I do to help?'", "a": "Noora asked what she could do to help."}], "icon": "💭"}, {"type": "quiz", "title": "Report the commands", "icon": "✏️", "qs": [{"q": "Talal → us: 'Get under the table!' Talal told us ___ under the table.", "o": ["to get", "get"], "a": 0}, {"q": "My parents → me: 'Don't be late.' My parents told me ___ late.", "o": ["not to be", "to not"], "a": 0}, {"q": "Dana → her sister: 'Stop wearing my clothes!' Dana told her sister to stop wearing ___ clothes.", "o": ["her", "my"], "a": 0}, {"q": "My friends → me: 'Don't buy more shoes!' My friends ___ me not to buy more shoes.", "o": ["told", "asked if"], "a": 0}, {"q": "We → Arwa: 'Join the basketball team!' We told Arwa ___ the basketball team.", "o": ["to join", "joined"], "a": 0}, {"q": "I → everyone: 'Don't call me at night.' I told everyone ___ me at night.", "o": ["not to call", "don't call"], "a": 0}]}, {"type": "ask", "title": "The radio interview", "qs": [{"q": "Example question: 'Why are heatwaves and droughts happening more often than they used to?' – Report it.", "a": "The presenter asked why heatwaves and droughts were happening more often than they used to."}, {"q": "Example command: 'Go to the basement of your house.' – Report it.", "a": "The scientist told people to go to the basement of their house."}, {"q": "Listen: What other questions did the presenter ask?", "a": "Listen to 1.11 and note them."}, {"q": "Listen: What other commands did the scientist give?", "a": "Listen to 1.11 and note them."}], "img": "L07_c5", "icon": "📻"}, {"type": "wheel", "title": "Ask, command, report!", "items": [{"q": "'What is a drought?'", "a": "He asked me what a drought was."}, {"q": "'Do you like thunderstorms?'", "a": "She asked me if I liked thunderstorms."}, {"q": "'Stay inside!'", "a": "He told us to stay inside."}, {"q": "'Don't go near the sea!'", "a": "She told us not to go near the sea."}, {"q": "'Where is the safest room?'", "a": "He asked where the safest room was."}, {"q": "'Close the windows!'", "a": "She told me to close the windows."}], "icon": "🎡"}, {"type": "boxes", "title": "Treasure boxes", "boxes": [{"label": "1", "q": "Report: 'Are you OK?' Mum asked me …", "a": "Mum asked me if I was OK."}, {"label": "2", "q": "Report: 'Where do you live?' He asked me …", "a": "He asked me where I lived."}, {"label": "3", "q": "Report: 'Drink lots of water!' Dad told us …", "a": "Dad told us to drink lots of water."}, {"label": "4", "q": "Report: 'Don't touch it!' She told me …", "a": "She told me not to touch it."}, {"label": "5", "q": "No rain for a long time = ?", "a": "a drought"}, {"label": "6", "q": "A huge wave from the sea = ?", "a": "a tsunami"}], "icon": "🎁"}, {"type": "steps", "title": "Let's remember!", "icon": "🧠", "steps": ["Weather: cyclone, tornado, thunder and lightning, sandstorm, heatwave, drought, forest fire, volcano, tsunami, flood, hailstorm, snowstorm.", "Wh- question → asked + what/where/why … + past: I asked my dad what a cyclone was.", "Yes/no question → asked + if: I asked him if he knew what to do.", "Command → told + me + (not) to + verb."]}, {"type": "exit", "title": "Exit ticket", "items": [{"k": "3", "text": "Name four types of extreme weather."}, {"k": "2", "text": "Report: 'Do you like rain?'"}, {"k": "1", "text": "Report: 'Don't panic!'"}], "icon": "🎟️"}, {"type": "homework", "title": "Homework", "head": "My homework", "items": ["Activity Book pp. 16–17 (Activities 1–5).", "Grammar practice AB p. 60 (Activities 3–4).", "Learn to spell the 12 weather words."], "icon": "🏠"}]}, {"id": "L08", "unit": "U2", "unitName": "Unit 1: Our planet", "title": "Culture & Project: Climate change and animals / An action plan", "code": "", "theme": "space", "emo": "🐻‍❄️", "slides": [{"type": "cover", "say": "WOW! Culture & Project"}, {"type": "goals", "title": "Today's goals", "items": ["I can read about how climate change affects animals.", "I can find numbers and facts in a text."], "icon": "🎯"}, {"type": "goals", "title": "Today's goals", "items": ["I can talk about which animal I'd like to help and why.", "I can work in a group to write an action plan to help an endangered animal."], "icon": "🎯"}, {"type": "riddle", "title": "Which animal am I?", "items": [{"clues": ["I'm big and white.", "I live in the Arctic.", "I can smell seals 16 km away!"], "a": "a polar bear", "emo": "🐻‍❄️"}, {"clues": ["I'm black and white.", "I live in China.", "I eat bamboo all day."], "a": "a giant panda", "emo": "🐼"}, {"clues": ["I live in the Hajar Mountains in Oman.", "I can live in high temperatures.", "I need water."], "a": "an Arabian tahr", "emo": "🐐"}], "icon": "🤔"}, {"type": "ask", "title": "Before you read", "qs": [{"q": "What's your favourite animal and why?", "a": "My favourite animal is the camel because it's strong and lives in the desert."}, {"q": "Will it be in danger because of climate change? Why? / Why not?", "a": "Maybe, because there will be more droughts."}, {"q": "What does 'extinct' mean?", "a": "There are no more of these animals in the world."}], "img": "L08_c2", "icon": "🤔"}, {"type": "read", "title": "Sea ice and polar bears", "paras": ["We often hear about how global warming might change our lives, but what about the lives of animals? Scientists have found that some animals might become [[extinct]] because of climate change."], "img": "L08_c1", "icon": "🐻‍❄️"}, {"type": "read", "title": "Sea ice and polar bears", "paras": ["The sea ice in the Arctic is getting smaller each year. It is 30% smaller now than it was in 1979. In some areas, it [[melts]] completely in the summer. This is causing problems for polar bears. These beautiful white bears go onto the sea ice to find their food. This means that they are in danger because they can't find enough food to eat."], "img": "L08_c1", "icon": "🐻‍❄️"}, {"type": "read", "title": "Sea ice and polar bears", "paras": ["WOW! Fact: Polar bears have a very good sense of smell. For example, they can smell seals that are 16 km away!"], "img": "L08_c1", "icon": "🐻‍❄️"}, {"type": "read", "title": "Pandas and Arabian tahrs", "paras": ["Giant pandas live in the mountains in south and central China. They eat bamboo, which is 90% of their [[diet]]. But bamboo grows very slowly, and climate change might make bamboo grow even slower. If there isn't enough bamboo, then pandas won't [[survive]]. A recent survey only found 1,864 pandas, so we must protect these amazing animals."], "img": "L08_c1", "icon": "🐼🐐"}, {"type": "read", "title": "Pandas and Arabian tahrs", "paras": ["Scientists are worried because as the Earth gets hotter, there will be more droughts. Arabian tahrs live in the Hajar Mountains in Oman. They need water, and so they are in danger. In some ways, they can [[adapt]] well to climate change. They can live in high temperatures and they eat a lot of different foods. But there are very few Arabian tahrs left in the wild. We think there are fewer than 2,500, so we must protect them from drought."], "img": "L08_c1", "icon": "🐼🐐"}, {"type": "read", "title": "Pandas and Arabian tahrs", "paras": ["So what can we do to help these animals? We must do everything we can to slow down climate change. Also, we must protect their homes and make sure they have enough food."], "img": "L08_c1", "icon": "🐼🐐"}, {"type": "match", "title": "Match the numbers", "pairs": [["30%", "how much smaller the Arctic sea ice is now"], ["1979", "the year we compare the sea ice with"], ["90%", "bamboo in a panda's diet"]], "icon": "🔢"}, {"type": "match", "title": "Match the numbers", "pairs": [["1,864", "pandas in a recent survey"], ["2,500", "fewer Arabian tahrs than this in the wild"], ["16 km", "a polar bear can smell seals this far away"]], "icon": "🔢"}, {"type": "quiz", "title": "What do the sentences describe?", "qs": [{"q": "These animals eat mostly one type of plant material.", "o": ["giant pandas", "polar bears", "Arabian tahrs"], "a": 0}, {"q": "It's getting smaller every year because of global warming.", "o": ["bamboo", "sea ice", "the Hajar Mountains"], "a": 1}, {"q": "These animals live in very high, warm areas of Oman.", "o": ["Arabian tahrs", "giant pandas", "polar bears"], "a": 0}, {"q": "There'll be more of these things if our planet gets hotter.", "o": ["seals", "droughts", "pandas"], "a": 1}, {"q": "They are large animals that live in very cold climates.", "o": ["polar bears", "Arabian tahrs", "giant pandas"], "a": 0}, {"q": "This doesn't grow very quickly and that could be a problem.", "o": ["sea ice", "bamboo", "grass"], "a": 1}], "icon": "✅"}, {"type": "ask", "title": "Answer the questions", "qs": [{"q": "What could be dangerous for animals in the future?", "a": "Climate change could be dangerous for animals in the future."}, {"q": "Why is sea ice so important for polar bears' survival?", "a": "They go onto the sea ice to find their food."}, {"q": "Why do some polar bears have problems in the summer?", "a": "In some areas the sea ice melts completely, so they can't find enough food."}], "icon": "💭"}, {"type": "ask", "title": "Answer the questions", "qs": [{"q": "What will happen if there isn't enough bamboo in China?", "a": "Pandas won't survive."}, {"q": "How many Arabian tahrs are there in the world now?", "a": "Fewer than 2,500."}, {"q": "Why can Arabian tahrs survive if the Earth gets hotter?", "a": "They can live in high temperatures and eat a lot of different foods."}], "icon": "💭"}, {"type": "ask", "title": "The monarch butterfly", "qs": [{"q": "Where can we find monarch butterflies?", "a": "In North America."}, {"q": "What colours are they?", "a": "Listen: black and … with … spots."}, {"q": "How far do they travel in winter?", "a": "Listen: about … kilometres from Canada to Mexico."}, {"q": "What problems do they have?", "a": "Listen: problems if winters become … and …; people are destroying the … where they live."}], "img": "L08_c4", "icon": "🦋"}, {"type": "wheel", "title": "Which animal would you help?", "items": [{"q": "Which animal would you most like to help? Why?", "a": "The Arabian tahr, because it lives in Oman and there are very few left."}, {"q": "How can we help polar bears?", "a": "We can slow down climate change, so the sea ice doesn't melt."}, {"q": "How can we help pandas?", "a": "We must protect their homes and make sure there's enough bamboo."}, {"q": "How can we help Arabian tahrs?", "a": "We must protect them from drought and protect the Hajar Mountains."}, {"q": "What can YOU do to slow down climate change?", "a": "I can save energy, recycle and plant trees."}], "icon": "🎡"}, {"type": "ask", "title": "Project: an action plan", "qs": [{"q": "Choose an endangered animal for your group.", "a": "snow leopard · African/Asian elephant · striped hyena · Arabian oryx · Arabian tahr"}, {"q": "Who will research what?", "a": "the internet · protecting natural habitats · a sponsored event · a second-hand sale or bake sale · visiting wildlife centres"}, {"q": "Discuss and choose the three best ideas.", "a": "e.g. a bake sale, a poster campaign, a visit to a wildlife centre"}], "img": "L08_c3", "icon": "📋"}, {"type": "order", "title": "Make your poster", "items": ["Write a description of each idea on small pieces of paper.", "Find photos or pictures.", "Glue your description onto the poster.", "Glue your photos beside the description.", "Present the information to the class – speak slowly and clearly.", "Take a class vote on the best action plan."], "icon": "🔢"}, {"type": "write", "title": "Our action plan", "task": "Write an action plan to help an endangered animal. Use bullet points.", "steps": ["Write the animal's name and where it lives.", "Write one interesting fact.", "Write your three best ideas as bullet points.", "Add photos or pictures."], "words": ["We are going to …", "We must …", "We should …", "We need to …", "• organise a bake sale", "• protect its habitat"], "model": "Help the Arabian oryx! 🐐\nThe Arabian oryx lives in the desert in Oman.\n• We are going to organise a bake sale and give the money to a wildlife centre.\n• We should make posters about the oryx for our school.\n• We need to visit a wildlife centre to learn more.", "icon": "✍️"}, {"type": "build", "title": "Spell the key words", "mode": "letters", "items": [{"a": "extinct", "hint": "no more animals of this kind", "emo": "🦤"}, {"a": "survive", "hint": "continue to live", "emo": "💪"}, {"a": "bamboo", "hint": "pandas eat it", "emo": "🎋"}, {"a": "drought", "hint": "no rain for a long time", "emo": "🏜️"}, {"a": "adapt", "hint": "change to live in new conditions", "emo": "🔄"}], "icon": "🔤"}, {"type": "balloons", "title": "Pop the right answer!", "rounds": [{"q": "Arabian tahrs live in the …", "o": ["Hajar Mountains", "Arctic", "rainforests"], "a": 0}, {"q": "Pandas eat …", "o": ["seals", "bamboo", "fish"], "a": 1}, {"q": "The Arctic sea ice is ___ smaller than in 1979.", "o": ["30%", "90%", "50%"], "a": 0}], "icon": "🎈"}, {"type": "balloons", "title": "Pop the right answer!", "rounds": [{"q": "Polar bears can smell seals ___ away.", "o": ["16 km", "1 km", "160 km"], "a": 0}, {"q": "Arabian tahrs are in danger because of …", "o": ["drought", "snow", "floods"], "a": 0}, {"q": "To make writing clear, use …", "o": ["bullet points", "long paragraphs", "no titles"], "a": 0}], "icon": "🎈"}, {"type": "steps", "title": "Let's remember!", "icon": "🧠", "steps": ["Polar bears: sea ice is melting → they can't find food.", "Giant pandas: bamboo grows slowly → not enough food. Only 1,864 found.", "Arabian tahrs (Hajar Mountains, Oman): more droughts → fewer than 2,500 left.", "We must slow down climate change and protect animals' homes."]}, {"type": "exit", "title": "Exit ticket", "items": [{"k": "3", "text": "Why are polar bears in danger?"}, {"k": "2", "text": "Where do Arabian tahrs live?"}, {"k": "1", "text": "Give one idea to help an endangered animal."}], "icon": "🎟️"}, {"type": "homework", "title": "Homework", "head": "My homework", "items": ["Activity Book p. 18 (Activities 1–4).", "Find three facts and a photo for your group's action plan poster.", "Find out more! Watch the video about endangered animals (if available)."], "icon": "🏠"}]}, {"id": "L09", "unit": "U2", "unitName": "Unit 1: Our planet", "title": "English in action: Giving advice (+ silent letters)", "code": "", "theme": "space", "emo": "💁", "slides": [{"type": "cover", "say": "English in action – I think you should …"}, {"type": "goals", "title": "Today's goals", "items": ["I can understand a dialogue where someone gives advice.", "I can give advice in five different ways.", "I can hear silent letters: mustn't, shouldn't, lightning."], "icon": "🎯"}, {"type": "enter", "title": "Catch the expressions for GIVING ADVICE.", "gate": "✓", "items": [{"text": "Brilliant!", "in": false}, {"text": "I think you should …", "in": true}, {"text": "I'm afraid …", "in": false}, {"text": "You could always …", "in": true}, {"text": "If I were you, I would …", "in": true}, {"text": "How old are you?", "in": false}]}, {"type": "riddle", "title": "What's the problem?", "items": [{"clues": ["I have an English test tomorrow.", "I don't know the new words.", "What should I do?"], "a": "You should learn some vocabulary!", "emo": "📚"}, {"clues": ["I'm always tired at school.", "I go to bed at midnight.", "What should I do?"], "a": "You should go to bed early!", "emo": "😴"}, {"clues": ["My room is very hot.", "The AC is at 16 degrees and it uses a lot of energy.", "What should I do?"], "a": "You should increase the temperature a little!", "emo": "❄️"}], "icon": "🤔"}, {"type": "ask", "title": "Watch or listen", "qs": [{"q": "What does Eliza want to do?", "a": "She and her friends want to do something to help animals that are in danger."}, {"q": "How is Miss Brown helping her?", "a": "She is giving her advice / ideas."}], "img": "L09_c1", "icon": "🎧"}, {"type": "read", "title": "Eliza and Miss Brown", "paras": ["Eliza: My friends and I want to do something to help animals that are in danger. Do you have any ideas?", "Miss Brown: Yes, of course. First of all, [[I think you should]] find out what animals you can help in our area. [[Why don't you]] look online to find out more? [[You could always]] help to pick up rubbish from the beach, too."], "img": "L09_c2", "icon": "📖"}, {"type": "read", "title": "Eliza and Miss Brown", "paras": ["Eliza: Oh yes. That's a good idea.", "Miss Brown: [[Perhaps you ought to]] put a notice in the school newsletter as well.", "Eliza: OK. Yes, I can do that.", "Miss Brown: Also, [[if I were you, I would]] have a look at your garden and make sure that it's safe for animals and birds.", "Eliza: Thank you, yes, that's a good idea, too!"], "img": "L09_c2", "icon": "📖"}, {"type": "ask", "title": "Five pieces of advice", "qs": [{"q": "Advice 1", "a": "Find out what animals you can help in our area."}, {"q": "Advice 2", "a": "Look online to find out more."}, {"q": "Advice 3", "a": "Help to pick up rubbish from the beach."}, {"q": "Advice 4", "a": "Put a notice in the school newsletter."}, {"q": "Advice 5", "a": "Have a look at your garden and make sure it's safe for animals and birds."}], "icon": "💭"}, {"type": "explain", "title": "Say it! Giving advice", "icon": "💁", "lines": ["Five ways to give advice:"], "img": "L09_c3", "rule": "should / ought to / could always / would / Why don't you … ? + verb"}, {"type": "flip", "title": "Say it! Giving advice 💡 – examples", "cards": [{"front": "[[I think you should]] find out more.", "icon": "💡", "back": "1"}, {"front": "[[Perhaps you ought to]] put a notice in the newsletter.", "icon": "✨", "back": "2"}, {"front": "[[You could always]] pick up rubbish.", "icon": "🔎", "back": "3"}, {"front": "[[If I were you, I would]] look at your garden.", "icon": "📌", "back": "4"}, {"front": "[[Why don't you]] look online?", "icon": "⭐", "back": "5"}]}, {"type": "quiz", "title": "Complete the dialogue", "icon": "✏️", "qs": [{"q": "Halima: Do you have any ideas? Samar: If I were you, I would join a nature ___.", "o": ["club", "blog"], "a": 0}, {"q": "Halima: Oh! I don't know any clubs like that. Samar: Why don't you look for one ___?", "o": ["online", "outside"], "a": 0}, {"q": "Samar: Hmm. You could always pick up ___.", "o": ["rubbish", "energy"], "a": 0}, {"q": "Samar: I think you should try to ___ more, too.", "o": ["recycle", "waste"], "a": 0}, {"q": "Samar: You write well. Perhaps you ought to write a ___.", "o": ["blog", "test"], "a": 0}]}, {"type": "order", "title": "Order the dialogue", "items": ["Really? That sounds interesting.", "If I were you, I would join a nature club.", "Why don't you look for one online?", "Hmm. You could always pick up rubbish.", "I think you should try to recycle more, too.", "You write well. Perhaps you ought to write a blog."], "icon": "🔢"}, {"type": "wheel", "title": "Give me advice!", "items": [{"q": "I want to revise for an English test. How?", "a": "Perhaps you ought to learn some vocabulary."}, {"q": "I want to buy a present. Where?", "a": "Why don't you go to the mall?"}, {"q": "I want to go out for lunch. Which café?", "a": "If I were you, I would go to …"}, {"q": "I want to play a new computer game. Which game?", "a": "You could always try …"}, {"q": "I want to save energy with the air conditioning. What temperature?", "a": "I think you should set it to 24 degrees."}, {"q": "I want to help out at school or family events. How?", "a": "Why don't you help to set up the tables?"}, {"q": "I want to download a new app. Which app?", "a": "Perhaps you ought to download a dictionary app."}], "icon": "🎡"}, {"type": "ask", "title": "Write advice", "qs": [{"q": "'I want to do something fun this weekend. The weather is going to be nice.'", "a": "I think you should have a picnic at the beach."}, {"q": "'I'm not doing very well in Maths this year.'", "a": "Perhaps you ought to ask your teacher for help."}, {"q": "'I don't know what present to get my mother for Eid.'", "a": "If I were you, I would buy her some perfume."}, {"q": "'I have too much free time. I think I need a new hobby.'", "a": "Why don't you join a football club?"}], "icon": "🗣️"}, {"type": "explain", "title": "Pronunciation: silent letters", "icon": "🤫", "lines": ["Some letters are silent – we write them but we don't say them."], "img": "L09_c4", "rule": "mustn't (t) · should/could/would (l) · lightning, night (gh)"}, {"type": "flip", "title": "Pronunciation: silent letters 🤫 – examples", "cards": [{"front": "We mus[[t]]n't waste water. → /ˈmʌsnt/", "icon": "💡", "back": "t"}, {"front": "They shou[[l]]dn't pollute the environment.", "icon": "✨", "back": "l"}, {"front": "You needn't worry about thunder and li[[gh]]tning.", "icon": "🔎", "back": "gh"}, {"front": "cou[[l]]d · wou[[l]]d · shou[[l]]d", "icon": "📌", "back": "l"}]}, {"type": "quiz", "title": "Which letter is silent?", "qs": [{"q": "They mustn't call me today.", "o": ["t", "m", "s"], "a": 0}, {"q": "We shouldn't read that book.", "o": ["d", "l", "s"], "a": 1}, {"q": "I couldn't do my homework.", "o": ["l", "c", "d"], "a": 0}, {"q": "You should tidy your room.", "o": ["h", "l", "d"], "a": 1}, {"q": "Please could you turn off the lights?", "o": ["gh", "l", "both"], "a": 2}], "icon": "🔇"}, {"type": "build", "title": "Build the advice", "mode": "words", "items": [{"a": "I think you should find out more.", "hint": "advice 1", "emo": "🔍"}, {"a": "Perhaps you ought to write a blog.", "hint": "advice 2", "emo": "✍️"}, {"a": "If I were you, I would join a club.", "hint": "advice 3", "emo": "🤝"}, {"a": "Why don't you look online?", "hint": "advice 4", "emo": "💻"}], "icon": "🧱"}, {"type": "race", "title": "Advice race", "qs": [{"q": "Perhaps you ___ to put a notice in the newsletter.", "options": ["ought", "should", "could"], "a": 0}, {"q": "If I were you, I ___ look online.", "options": ["will", "would", "am"], "a": 1}, {"q": "___ don't you join a nature club?", "options": ["Why", "What", "How"], "a": 0}, {"q": "You could ___ pick up rubbish.", "options": ["always", "never", "ought"], "a": 0}, {"q": "Eliza wants to help …", "options": ["animals", "her teacher", "old people"], "a": 0}, {"q": "Silent letter in 'lightning':", "options": ["gh", "n", "t"], "a": 0}], "icon": "🏎️"}, {"type": "steps", "title": "Let's remember!", "icon": "🧠", "steps": ["I think you should … · Perhaps you ought to … · You could always … · If I were you, I would … · Why don't you …?", "Silent letters: mustn't (t), shouldn't / could (l), lightning (gh)."]}, {"type": "exit", "title": "Exit ticket", "items": [{"k": "3", "text": "Give advice: 'I want to save water.'"}, {"k": "2", "text": "Write advice with 'If I were you …'"}, {"k": "1", "text": "Which letter is silent in 'shouldn't'?"}], "icon": "🎟️"}, {"type": "homework", "title": "Homework", "head": "My homework", "items": ["Activity Book p. 19 (Activities 1–3).", "Write advice for three friends with three different expressions.", "Practise saying: We mustn't waste water."], "icon": "🏠"}]}, {"id": "L10", "unit": "U2", "unitName": "Unit 1: Our planet", "title": "Reading: Literacy – reports (Plastic pollution in the sea)", "code": "", "theme": "space", "emo": "🐟", "slides": [{"type": "cover", "say": "Literacy: reports"}, {"type": "goals", "title": "Today's goals", "items": ["I can find the main idea of a report from the title and first paragraph.", "I can use diagrams to understand information quickly."], "icon": "🎯"}, {"type": "goals", "title": "Today's goals", "items": ["I can learn words in context: foundation, tonne, piece, business, government, end up.", "I can talk about how to stop plastic pollution."], "icon": "🎯"}, {"type": "riddle", "title": "Guess the word!", "items": [{"clues": ["It's a very big sea.", "Fish, turtles and seals live in it.", "It starts with O."], "a": "the ocean", "emo": "🌊"}, {"clues": ["Bottles and bags are made of me.", "I can be recycled.", "Sometimes I end up in the sea."], "a": "plastic", "emo": "🧴"}, {"clues": ["I show numbers as bars or circles.", "I help you understand information quickly.", "I start with D."], "a": "a diagram", "emo": "📊"}], "icon": "🤔"}, {"type": "ask", "title": "Before you read", "qs": [{"q": "Look at the title and the diagrams. What do you think this report is about?", "a": "It's about how much plastic is in the sea and how it is growing."}, {"q": "What does the bar chart show?", "a": "How much plastic we make: 15 mt 50 years ago, 311 mt today, 1,124 mt in 2050."}, {"q": "What does the ratio diagram show?", "a": "Plastics to fish in the ocean: 1:5 today and more than 1:1 in 2050."}], "img": "L10_c1", "icon": "🤔"}, {"type": "flip", "title": "Words in context", "cards": [{"front": "foundation", "icon": "🏛️", "back": "an organisation that provides money to help people\n«The Ellen MacArthur Foundation wrote the report.»"}, {"front": "tonne", "icon": "⚖️", "back": "a unit of weight = 1,000 kilogrammes\n«8 million tonnes of plastic go into the ocean.»"}, {"front": "piece", "icon": "🧩", "back": "a part of something bigger\n«Small pieces of plastic can kill fish.»"}, {"front": "business", "icon": "🏢", "back": "an organisation that sells products or services for money\n«Businesses must work together.»"}, {"front": "government", "icon": "🏛️🇴🇲", "back": "a group of people who lead a town, region or country\n«Governments should protect the oceans.»"}, {"front": "end up", "icon": "🗑️🌊", "back": "be in a place after someone has done something to it\n«Plastic should never end up in the sea.»"}], "icon": "🔤"}, {"type": "read", "title": "Plastic pollution in the sea", "paras": ["A report by the Ellen MacArthur [[Foundation]] has shown that by 2050, there will be more plastic in the sea than fish! This will cause problems for the whole planet."], "img": "L10_c1", "icon": "📖"}, {"type": "read", "title": "Plastic pollution in the sea", "paras": ["Firstly, the report showed that we are making twenty times more plastic than we were making 50 years ago. However, only 5% of these plastics are recycled, so this means that a lot is thrown away. Secondly, the report said that every year 8 million [[tonnes]] of plastic pollution goes into the ocean. Small [[pieces]] of plastic can kill fish and are dangerous to turtles and seals."], "img": "L10_c1", "icon": "📖"}, {"type": "read", "title": "Plastic pollution in the sea", "paras": ["It told [[businesses]] and [[governments]] to work together to protect the oceans. It said that in the future they should only use plastics that can be recycled and it said that plastic should never [[end up]] in the sea as rubbish.", "This report is important because it shows how serious the plastic problem is."], "img": "L10_c1", "icon": "📖"}, {"type": "tf", "title": "True or False?", "items": [{"text": "This report is about how much plastic we will need to make in the future.", "a": false, "fix": "It's about plastic pollution in the sea."}, {"text": "There is more plastic in the sea than fish at the moment.", "a": false, "fix": "By 2050 there will be more plastic than fish."}, {"text": "We made twenty times less plastic 50 years ago than we do today.", "a": true, "fix": "We are making twenty times more plastic than 50 years ago."}], "icon": "✔✘"}, {"type": "tf", "title": "True or False?", "items": [{"text": "Only 5% of plastics are thrown away.", "a": false, "fix": "Only 5% are recycled; a lot is thrown away."}, {"text": "Every year, 8 million tonnes of plastic pollution ends up in the sea.", "a": true, "fix": "Every year 8 million tonnes … goes into the ocean."}, {"text": "The report says that businesses and governments must both help with this problem.", "a": true, "fix": "It told businesses and governments to work together."}], "icon": "✔✘"}, {"type": "ask", "title": "How do the diagrams help?", "qs": [{"q": "How much plastic did we make 50 years ago? Today? In 2050?", "a": "15 million tonnes · 311 million tonnes · 1,124 million tonnes."}, {"q": "How do the diagrams help us?", "a": "We can see the numbers quickly and compare them easily."}, {"q": "Which is easier to remember: the text or the chart? Why?", "a": "The chart, because we can see the big difference."}], "img": "L10_c2", "icon": "📊"}, {"type": "match", "title": "Match the numbers", "pairs": [["2050", "more plastic in the sea than fish"], ["20 times", "more plastic now than 50 years ago"], ["5%", "plastics that are recycled"]], "icon": "🔢"}, {"type": "match", "title": "Match the numbers", "pairs": [["8 million tonnes", "plastic that goes into the ocean every year"], ["1:5", "plastics to fish today"], ["1,124 mt", "plastic we will make in 2050"]], "icon": "🔢"}, {"type": "quiz", "title": "Complete with two words", "icon": "✏️", "qs": [{"q": "Plastic in the sea will ___ for the whole planet in the future.", "o": ["cause problems", "end up"], "a": 0}, {"q": "About 95% of the plastic we make is ___.", "o": ["thrown away", "recycled again"], "a": 0}, {"q": "Eight million tonnes of plastic goes into the ocean ___.", "o": ["every year", "every day"], "a": 0}, {"q": "Pieces of plastic in the ocean ___ for fish and other animals.", "o": ["are dangerous", "are food"], "a": 0}, {"q": "Plastic pollution ___ a serious problem in the future.", "o": ["will be", "was"], "a": 0}, {"q": "The world's ___ is serious. We must protect our oceans.", "o": ["plastic problem", "fish problem"], "a": 0}]}, {"type": "ask", "title": "Answer the questions", "qs": [{"q": "Who wrote the report about the pollution?", "a": "The Ellen MacArthur Foundation wrote the report."}, {"q": "How much more plastic do we make now than we did 50 years ago?", "a": "We make twenty times more plastic now."}, {"q": "How much plastic goes into the ocean every year?", "a": "8 million tonnes."}], "icon": "💭"}, {"type": "ask", "title": "Answer the questions", "qs": [{"q": "What causes problems for seals and turtles?", "a": "Small pieces of plastic."}, {"q": "Why is the report important?", "a": "Because it shows how serious the plastic problem is."}, {"q": "What type of plastic should businesses always use?", "a": "Plastics that can be recycled."}], "icon": "💭"}, {"type": "memory", "title": "Memory: word + meaning", "pairs": [["foundation", "gives money to help 🏛️"], ["tonne", "1,000 kg ⚖️"], ["piece", "a small part 🧩"], ["business", "sells things 🏢"], ["government", "leads a country 🏛️"], ["end up", "be in a place at the end 🌊"]], "icon": "🧠"}, {"type": "wheel", "title": "What could you do?", "items": [{"q": "How serious is the plastic pollution problem?", "a": "It's very serious because it kills fish, turtles and seals."}, {"q": "What could you do at home?", "a": "I could use a water bottle again and again."}, {"q": "What could you do at the beach?", "a": "I could pick up plastic rubbish."}, {"q": "What could shops do?", "a": "They could use paper bags or cloth bags."}, {"q": "What can countries do to solve the problem?", "a": "They can make laws and recycle more plastic."}, {"q": "Choose: air pollution, forest fires or water shortage. Who does it affect?", "a": "Water shortage affects people, animals and farms."}], "icon": "🎡"}, {"type": "build", "title": "Spell the words in context", "mode": "letters", "items": [{"a": "tonne", "hint": "1,000 kilogrammes", "emo": "⚖️"}, {"a": "piece", "hint": "a small part", "emo": "🧩"}, {"a": "business", "hint": "sells things for money", "emo": "🏢"}, {"a": "foundation", "hint": "gives money to help people", "emo": "🏛️"}], "icon": "🔤"}, {"type": "enter", "title": "Catch the things that are usually made of PLASTIC.", "gate": "✓", "items": [{"text": "glass jar", "in": false}, {"text": "metal can", "in": false}, {"text": "bottle top", "in": true}, {"text": "water bottle", "in": true}, {"text": "shopping bag", "in": true}, {"text": "banana skin", "in": false}]}, {"type": "balloons", "title": "Pop the right answer!", "rounds": [{"q": "By 2050 there will be more plastic than ___ in the sea.", "o": ["fish", "water", "ships"], "a": 0}, {"q": "Only ___ of plastics are recycled.", "o": ["5%", "50%", "95%"], "a": 0}, {"q": "1 tonne = …", "o": ["100 kg", "1,000 kg", "10 kg"], "a": 1}], "icon": "🎈"}, {"type": "balloons", "title": "Pop the right answer!", "rounds": [{"q": "Small pieces of plastic can kill …", "o": ["fish", "trees", "birds only"], "a": 0}, {"q": "To find the main idea, read the title and the …", "o": ["first paragraph", "last word", "numbers"], "a": 0}, {"q": "A group that leads a country:", "o": ["business", "government", "foundation"], "a": 1}], "icon": "🎈"}, {"type": "steps", "title": "Let's remember!", "icon": "🧠", "steps": ["Main idea: read the title and the first paragraph; use the diagrams.", "By 2050: more plastic than fish. Only 5% recycled. 8 million tonnes a year go into the ocean.", "Words: foundation, tonne, piece, business, government, end up."]}, {"type": "exit", "title": "Exit ticket", "items": [{"k": "3", "text": "What is the main idea of the report?"}, {"k": "2", "text": "Give one number from the report and explain it."}, {"k": "1", "text": "What can you do to help?"}], "icon": "🎟️"}, {"type": "homework", "title": "Homework", "head": "My homework", "items": ["Activity Book p. 20 (Activities 1–4).", "Make notes about one problem: air pollution, endangered animals, forest fires or water shortage.", "Learn the six words in context."], "icon": "🏠"}]}, {"id": "L11", "unit": "U2", "unitName": "Unit 1: Our planet", "title": "Writing: A report on a survey", "code": "", "theme": "space", "emo": "📊", "slides": [{"type": "cover", "say": "Writing – How to write a report"}, {"type": "goals", "title": "Today's goals", "items": ["I can read survey diagrams.", "I can say what each paragraph of a report does."], "icon": "🎯"}, {"type": "goals", "title": "Today's goals", "items": ["I can use firstly, secondly, in conclusion, while and however.", "I can write a report on a survey – facts, not opinions."], "icon": "🎯"}, {"type": "build", "title": "Report words", "mode": "letters", "items": [{"a": "survey", "hint": "asking people questions", "emo": "📋"}, {"a": "firstly", "hint": "number 1 in a list", "emo": "1️⃣"}, {"a": "however", "hint": "a word to contrast", "emo": "↔️"}, {"a": "conclusion", "hint": "the end of a report", "emo": "✅"}, {"a": "diagram", "hint": "a picture with numbers", "emo": "📊"}], "icon": "🔤"}, {"type": "ask", "title": "Look at the diagrams", "qs": [{"q": "Do you think diagrams are a helpful way to present information? Why?", "a": "Yes, because we can see and compare the numbers quickly."}, {"q": "How many students answered the survey?", "a": "453 students, aged between 13 and 14."}, {"q": "What's the most popular way to help the environment?", "a": "Recycling (32%)."}], "img": "L11_c1", "icon": "📊"}, {"type": "read", "title": "Young people and the environment", "paras": ["These diagrams show how students answered a survey about the environment. 453 students, between the ages of 13 and 14, were asked two questions."], "img": "L11_c2", "icon": "📖"}, {"type": "read", "title": "Young people and the environment", "paras": ["[[Firstly]], the survey asked students if it was important to help the environment. Most students (87%) said yes. [[Secondly]], the survey asked what the best way to help the environment was. 32% of students said recycling [[while]] 24% said saving energy. 18% said saving water and 14% said picking up rubbish. [[However]], only 9% of students said planting trees."], "img": "L11_c2", "icon": "📖"}, {"type": "read", "title": "Young people and the environment", "paras": ["[[In conclusion]], [[this survey shows]] that most young people are interested in helping the environment. Also, they think that recycling and saving energy are the best ways to help."], "img": "L11_c2", "icon": "📖"}, {"type": "match", "title": "Match the paragraphs", "pairs": [["Paragraph one", "Says what the survey was about."], ["Paragraph two", "Describes the survey results in detail."], ["Paragraph three", "Explains what the survey results show."]], "icon": "🧩"}, {"type": "explain", "title": "How to write a report", "icon": "📝", "lines": ["Use a clear title which explains what the report is about.", "Use expressions such as this survey shows … to explain the results.", "Use phrases such as firstly, secondly and in conclusion.", "Don't include your own opinion – just present the facts."], "img": "L11_c3", "rule": "title → introduction → results (firstly, secondly) → conclusion"}, {"type": "flip", "title": "How to write a report 💡 – examples", "cards": [{"front": "Title: [[Young people and the environment]]", "icon": "💡", "back": "🏷️"}, {"front": "[[In conclusion]], [[this survey shows]] that …", "icon": "✨", "back": "✅"}]}, {"type": "explain", "title": "while and however", "icon": "↔️", "lines": ["To contrast two different things, use while or however."], "rule": "… while … (one sentence)  ·  … . However, … (new sentence)"}, {"type": "flip", "title": "while and however ⚖️ – examples", "cards": [{"front": "32% of students said recycling [[while]] 24% said saving energy.", "icon": "💡", "back": "↔️"}, {"front": "18% said saving water. [[However]], only 9% said planting trees.", "icon": "✨", "back": "⚠️"}]}, {"type": "quiz", "title": "while or however?", "icon": "✏️", "qs": [{"q": "My sister says she wants to help the environment. ___, she doesn't pick up her rubbish.", "o": ["However", "While"], "a": 0}, {"q": "In our survey we found that 52% of students recycle rubbish ___ 8% turn off lights.", "o": ["while", "However"], "a": 0}, {"q": "27 students say they save water at home. ___, only 6 students say they plant trees.", "o": ["However", "while"], "a": 0}]}, {"type": "sort", "title": "Fact or opinion?", "bins": [{"label": "fact (OK in a report)", "icon": "✅"}, {"label": "opinion (not in a report)", "icon": "❌"}], "cards": [{"text": "87% of students said yes.", "icon": "", "bin": 0}, {"text": "453 students were asked two questions.", "icon": "", "bin": 0}, {"text": "Only 9% said planting trees.", "icon": "", "bin": 0}, {"text": "I think planting trees is the best.", "icon": "", "bin": 1}, {"text": "Recycling is boring.", "icon": "", "bin": 1}, {"text": "In my opinion, everyone should save water.", "icon": "", "bin": 1}], "icon": "🗂️"}, {"type": "ask", "title": "Read the diagrams: saving water", "qs": [{"q": "What do the diagrams show?", "a": "They show students' answers to a survey about saving water."}, {"q": "How many students did the survey?", "a": "386 students."}, {"q": "How old were the students?", "a": "Between 11 and 14."}], "img": "L11_c5", "icon": "💭"}, {"type": "ask", "title": "Read the diagrams: saving water", "qs": [{"q": "How many students think saving water is important?", "a": "77% of the students."}, {"q": "How many ways to save water are listed?", "a": "Four."}, {"q": "Which two ideas are the most popular?", "a": "Take a quick shower (46%) and turn off the water when you're brushing your teeth (28%)."}], "icon": "💭"}, {"type": "order", "title": "Plan your report", "items": ["Include a clear title.", "Write an introduction: what do the diagrams show? What was the survey about?", "Explain the two diagrams with firstly and secondly; contrast with while and however.", "Write a conclusion: this survey shows …", "Check: formal language, no contractions, no opinions."], "icon": "🔢"}, {"type": "write", "title": "Write your report", "task": "Write a report on a survey about endangered animals (342 students, aged 13–14).", "steps": ["Title: Young people and endangered animals", "Introduction: These diagrams show … 342 students … were asked two questions.", "Firstly … 92% said yes. Secondly … 42% said protecting their homes while 18% said …", "However, only 9% said not using plastic.", "In conclusion, this survey shows that …"], "words": ["These diagrams show", "Firstly", "Secondly", "while", "However", "In conclusion", "this survey shows"], "model": "Young people and endangered animals\nThese diagrams show how students answered a survey about endangered animals. 342 students, between the ages of 13 and 14, were asked two questions.\nFirstly, the survey asked students if it was important to help endangered animals. Most students (92%) said yes. Secondly, the survey asked what the best way to help endangered animals was. 42% of students said protecting their homes while 18% said supporting wildlife charities. 15% said making our gardens safe and 12% said picking up rubbish. However, only 9% of students said not using plastic.\nIn conclusion, this survey shows that most young people think it is important to help endangered animals. Also, they think that protecting their homes is the best way to help.", "icon": "✍️"}, {"type": "tf", "title": "Check your work", "items": [{"text": "'Most students (92%) said yes.' is a fact.", "a": true, "fix": "It comes from the survey."}, {"text": "We should use contractions like don't and it's.", "a": false, "fix": "Use full forms and formal language."}, {"text": "'In conclusion, this survey shows …' explains the results.", "a": true, "fix": "It's an expression to explain the results."}, {"text": "We should say 'I love elephants!' in the report.", "a": false, "fix": "Don't include your own opinion."}], "icon": "✔✘"}, {"type": "build", "title": "Build report sentences", "mode": "words", "items": [{"a": "These diagrams show how students answered a survey.", "hint": "introduction", "emo": "📊"}, {"a": "Most students said yes.", "hint": "results", "emo": "✅"}, {"a": "In conclusion, this survey shows that …", "hint": "conclusion", "emo": "🏁"}], "icon": "🧱"}, {"type": "race", "title": "Report race", "qs": [{"q": "A report needs a clear …", "options": ["title", "joke", "question"], "a": 0}, {"q": "First paragraph: says what the survey was …", "options": ["about", "for", "like"], "a": 0}, {"q": "32% said recycling ___ 24% said saving energy.", "options": ["while", "however", "because"], "a": 0}, {"q": "___, only 9% said planting trees.", "options": ["However", "While", "And"], "a": 0}, {"q": "In a report, don't include your …", "options": ["facts", "opinion", "title"], "a": 1}, {"q": "Last paragraph starts with …", "options": ["Firstly", "In conclusion", "Secondly"], "a": 1}], "icon": "🏎️"}, {"type": "summary", "title": "Let's remember!", "center": "Writing: A report on a survey", "branches": ["Report = title + introduction + results + conclusion.", "Firstly, Secondly, In conclusion, this survey shows …", "Contrast: … while … / However, …", "Facts, not opinions. Formal language, full forms."], "icon": "🧠"}, {"type": "exit", "title": "Exit ticket", "items": [{"k": "3", "text": "What goes in the first paragraph of a report?"}, {"k": "2", "text": "Write a sentence with while."}, {"k": "1", "text": "Why don't we write opinions in a report?"}], "icon": "🎟️"}, {"type": "homework", "title": "Homework", "head": "My homework", "items": ["Activity Book pp. 21–22 (Activities 1–5): write your report about saving water.", "Read the writing model on AB p. 65.", "Check your report with the checklist."], "icon": "🏠"}]}, {"id": "L12", "unit": "U2", "unitName": "Unit 1: Our planet", "title": "Over to you! & Review 1", "code": "", "theme": "space", "emo": "🔁", "slides": [{"type": "cover", "say": "Readers' comments & Unit 1 review"}, {"type": "goals", "title": "Today's goals", "items": ["I can read readers' comments about Unit 1.", "I can write my own comment for the WOW! Magazine."], "icon": "🎯"}, {"type": "goals", "title": "Today's goals", "items": ["I can review the words and grammar of Unit 1.", "I can answer the WOW! Question again."], "icon": "🎯"}, {"type": "build", "title": "Unscramble the weather!", "mode": "letters", "items": [{"a": "cyclone", "hint": "nyclcoe – stay indoors!", "emo": "🌀"}, {"a": "heatwave", "hint": "vewathea – too hot!", "emo": "🌡️"}, {"a": "snowstorm", "hint": "sstrwoomn – build a snowman later", "emo": "❄️"}, {"a": "tsunami", "hint": "namitsu – a huge wave", "emo": "🌊"}], "icon": "🌪️"}, {"type": "read", "title": "Readers' comments", "paras": ["Maryam, 13, Oman: I like all your ideas for how to save energy at school. Our school is very green! We use nveyor belt, crushing machine and magnet.", "I can read and understand a graded reader."], "icon": "🎯"}, {"type": "goals", "title": "Today's goals", "items": ["I can say how plastic is recycled.", "I can talk about protecting the environment."], "icon": "🎯"}, {"type": "flip", "title": "Before you read: words", "cards": [{"front": "conveyor belt", "icon": "➡️📦➡️", "back": "a moving belt that carries things\n«The conveyor belts sort the plastic.»"}, {"front": "crushing machine", "icon": "⚙️💥", "back": "a machine that breaks things into very small pieces\n«This machine crushes the plastic.»"}, {"front": "magnet", "icon": "🧲", "back": "a piece of metal that pulls other metal to it\n«Magnets pick up metal, but not plastic.»"}], "icon": "🔤"}, {"type": "ask", "title": "Look at the pictures", "qs": [{"q": "Where are the children?", "a": "At a recycling centre."}, {"q": "Why are they wearing yellow hats?", "a": "To be safe – it's a factory."}, {"q": "What do you think happens to the boy's camera?", "a": "It falls on the conveyor belt!"}], "img": "L15_c3", "icon": "👀"}, {"type": "read", "title": "At the Recycling Centre (1)", "paras": ["This month, the class are learning how to protect the environment. They have learned that they need to save water, and that they mustn't waste energy. Now they always remember to switch off lights."], "img": "L15_c1", "icon": "📖"}, {"type": "read", "title": "At the Recycling Centre (1)", "paras": ["Last week, the class went on a school trip to a recycling centre. They learned how plastic is recycled. This helps to stop plastic pollution."], "img": "L15_c1", "icon": "📖"}, {"type": "read", "title": "At the Recycling Centre (1)", "paras": ["A worker called Amjed showed the class around the recycling centre. He took them to a room with [[conveyor belts]] in it. Zaid asked him what the conveyor belts did. 'The conveyor belts [[sort]] these plastic things into different types,' Amjed said. 'Then they are recycled.'"], "img": "L15_c1", "icon": "📖"}, {"type": "read", "title": "At the Recycling Centre (2)", "paras": ["In the next room, there was a conveyor belt going to a big machine. Amjed told the children to be careful. 'This machine [[crushes]] the plastic into very small pieces,' Amjed said. Zaid wanted to take a photo, so he took his camera out of his bag."], "img": "L15_c3", "icon": "📖"}, {"type": "read", "title": "At the Recycling Centre (2)", "paras": ["Just then, the machine made a loud noise, and Zaid dropped his camera. It fell on the conveyor belt and started moving to the crushing machine! 'Oh no!' said Zaid."], "img": "L15_c3", "icon": "📖"}, {"type": "read", "title": "At the Recycling Centre (2)", "paras": ["Amjed told Zaid not to worry, and he went to get something. He came back with a [[magnet]]. He used the magnet to get Zaid's camera off the conveyor belt. 'Magnets pick up metal, but not plastic,' Amjed said. Zaid was very happy! 'Thank you, Amjed. I should be more careful!' he said. 'Yes, and we should all recycle to help protect the environment!' Amjed said."], "img": "L15_c3", "icon": "📖"}, {"type": "enter", "title": "Catch the things Zaid's class have learned about.", "gate": "✓", "items": [{"text": "switching off lights", "in": true}, {"text": "recycling plastic", "in": true}, {"text": "wasting energy", "in": true}, {"text": "extreme weather", "in": false}, {"text": "planting trees", "in": false}, {"text": "endangered animals", "in": false}]}, {"type": "quiz", "title": "Choose the correct words", "qs": [{"q": "Zaid's class are visiting a ___ centre.", "o": ["recycling", "renewable energy"], "a": 0}, {"q": "Plastic things are sorted into different types ___ they are recycled.", "o": ["before", "after"], "a": 0}, {"q": "The class see a machine that ___ the plastic into small pieces.", "o": ["cuts", "crushes"], "a": 1}], "icon": "✅"}, {"type": "match", "title": "Match to make sentences", "pairs": [["Zaid drops his camera", "onto a conveyor belt."], ["Amjed uses a magnet", "to pick up Zaid's c
