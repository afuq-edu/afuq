, "Write three sentences about your shopping habits with the zero conditional."], "icon": "🏠"}]}, {"id": "L32", "unit": "U4", "unitName": "Unit 3: Spend or save?", "title": "Book club: If you could… (a poem)", "code": "", "theme": "park", "emo": "🚀", "slides": [{"type": "cover", "say": "Unit 3 · Lesson 4 – WOW! Book Club: a poem"}, {"type": "goals", "title": "Today's goals", "items": ["I can describe a poem: verses, lines and rhyme.", "I can read and enjoy a poem about imaginary situations."], "icon": "🎯"}, {"type": "goals", "title": "Today's goals", "items": ["I can say what I would like to do: I'd like to … / Would you like to …?", "I can use look + preposition: look at, look down …"], "icon": "🎯"}, {"type": "wheel", "title": "Imagine!", "items": [{"q": "If you could fly, where would you go?", "a": "I'd fly to Salalah!"}, {"q": "If you could meet anyone, who would you meet?", "a": "I'd meet a famous footballer."}, {"q": "If you could have any animal, what would you have?", "a": "I'd have a falcon."}, {"q": "If you could be any age, how old would you be?", "a": "I'd be 18."}], "icon": "🎡"}, {"type": "quiz", "title": "What is the poem like?", "qs": [{"q": "This poem has ___ verses.", "o": ["four", "three"], "a": 0, "why": "Egypt, Sherlock Holmes, the Arctic, space"}, {"q": "Each verse has ___ sentences.", "o": ["four", "six"], "a": 0, "why": "Look at the spaces between the sentences."}, {"q": "The first and second lines and the third and fourth lines of each verse …", "o": ["rhyme", "rhythm"], "a": 0, "why": "do / new · school / cool"}], "img": "L32_c1", "icon": "📜"}, {"type": "poem", "title": "If you could … (verses 1–2)", "lines": ["If you could travel back in time, what would you choose to do?", "I'd go to Ancient Egypt to see the pyramids when they were new.", "We learned about this in History last year and we wore costumes to school.", "I dressed as an old Egyptian pharaoh; I looked really cool!"], "img": "L32_c1", "icon": "🎵"}, {"type": "poem", "title": "If you could … (verses 1–2)", "lines": ["If you could become a character, what film or book would you choose?", "I'd like to become Sherlock Holmes, then I'd catch a thief or two!", "I'd live in London, years ago, and I would be the best.", "Sherlock always finds the thief; he's cleverer than the rest!"], "icon": "🎵"}, {"type": "poem", "title": "If you could … (verses 3–4)", "lines": ["If you could travel the world one day, where would you choose to go?", "I'd go to the Arctic, I'd play in the ice and I'd build a house in the snow.", "The sea ice is melting quickly, so I want to go while I can.", "I want to look after some polar bears and make a huge snowman!"], "img": "L32_c2", "icon": "🎵"}, {"type": "poem", "title": "If you could … (verses 3–4)", "lines": ["If you could go into space, what would you do and why?", "I'd walk on the Moon, I'd look down at Earth and see how it looks from the sky.", "First Neil Armstrong, then Buzz Aldrin, stepped down to have a look.", "They walked around, left a flag and walked into history books!"], "icon": "🎵"}, {"type": "sort", "title": "Find the rhyming pairs", "bins": [{"label": "do / new", "icon": "🔊"}, {"label": "school / cool", "icon": "🔊"}, {"label": "go / snow", "icon": "🔊"}, {"label": "why / sky", "icon": "🔊"}], "cards": [{"text": "two", "icon": "", "bin": 0}, {"text": "blue", "icon": "", "bin": 0}, {"text": "pool", "icon": "", "bin": 1}, {"text": "rule", "icon": "", "bin": 1}, {"text": "know", "icon": "", "bin": 2}, {"text": "slow", "icon": "", "bin": 2}, {"text": "fly", "icon": "", "bin": 3}, {"text": "high", "icon": "", "bin": 3}], "icon": "🗂️"}, {"type": "ask", "title": "Answer the questions", "qs": [{"q": "When did the speaker learn about the pyramids?", "a": "The speaker learned about them in History last year."}, {"q": "How did the speaker dress up at school?", "a": "As an old Egyptian pharaoh."}, {"q": "Why does the speaker say Sherlock is clever?", "a": "Because he always finds the thief."}], "img": "L32_c4", "icon": "💭"}, {"type": "ask", "title": "Answer the questions", "qs": [{"q": "Who were the first people on the Moon?", "a": "Neil Armstrong, then Buzz Aldrin."}, {"q": "What did the astronauts leave on the Moon?", "a": "A flag."}, {"q": "Why must the speaker visit the Arctic soon?", "a": "Because the sea ice is melting quickly."}], "icon": "💭"}, {"type": "tf", "title": "True or False?", "items": [{"text": "The speaker would like to see the pyramids when they were new.", "a": true, "fix": "to see the pyramids when they were new"}, {"text": "The speaker would like to become a pharaoh.", "a": false, "fix": "He'd like to become Sherlock Holmes."}, {"text": "Sherlock Holmes lived in London.", "a": true, "fix": "I'd live in London, years ago."}], "icon": "✔✘"}, {"type": "tf", "title": "True or False?", "items": [{"text": "The speaker wants to look after some penguins.", "a": false, "fix": "some polar bears"}, {"text": "Buzz Aldrin was the first person on the Moon.", "a": false, "fix": "First Neil Armstrong, then Buzz Aldrin."}], "icon": "✔✘"}, {"type": "explain", "title": "look + preposition", "lines": ["We can make collocations with prepositions after the verb look."], "img": "L32_c5", "rule": "look + around / behind / down / through / under / up", "icon": "💡"}, {"type": "flip", "title": "look + preposition 💡 – examples", "cards": [{"front": "The teacher told us to [[look at]] the board.", "icon": "💡", "back": "👀 ➡️ 📋"}, {"front": "[[look down]] at Earth / [[look up]] at the sky", "icon": "✨", "back": "⬇️ ⬆️"}, {"front": "[[look behind]] you · [[look under]] the table", "icon": "🔎", "back": "🔙 ⬇️"}, {"front": "[[look around]] the room · [[look through]] the window", "icon": "📌", "back": "🔄 🪟"}]}, {"type": "quiz", "title": "Complete with look + …", "icon": "✏️", "qs": [{"q": "Look ___ you! Is there someone following you?", "o": ["behind", "through"], "a": 0}, {"q": "Don't look ___ at the Sun or you could hurt your eyes.", "o": ["up", "under"], "a": 0}, {"q": "I looked ___ the room, but I couldn't see my bag.", "o": ["around", "up"], "a": 0}, {"q": "My mother found her phone when she looked ___ the table.", "o": ["under", "behind"], "a": 0}, {"q": "We can't look ___ the window because it's dirty.", "o": ["through", "around"], "a": 0}, {"q": "Nabhan climbed the mountain and looked ___ at the ocean.", "o": ["down", "up"], "a": 0}]}, {"type": "wheel", "title": "Would you like to …?", "items": [{"q": "Would you like to go into space?", "a": "Yes, I would. I'd like to see Earth from space. / No, I wouldn't. I prefer to keep my feet on the ground."}, {"q": "Would you like to travel back in time to Ancient Egypt?", "a": "Yes, I would. I'd like to see the pyramids."}, {"q": "Would you like to become Sherlock Holmes?", "a": "Yes, I would. I'd catch a thief or two!"}, {"q": "Would you like to go to the Arctic?", "a": "No, I wouldn't. It's too cold!"}, {"q": "Would you like to walk on the Moon?", "a": "Yes, I would!"}], "icon": "🎡"}, {"type": "match", "title": "Match the question and the answer", "pairs": [["If you could travel back in time, …", "I'd go to Ancient Egypt."], ["If you could become a character, …", "I'd like to become Sherlock Holmes."], ["If you could travel the world one day, …", "I'd go to the Arctic."], ["If you could go into space, …", "I'd walk on the Moon."]], "icon": "🧩"}, {"type": "write", "title": "Write your own verse", "task": "Write your own verse for the poem: a question and your answer.", "steps": ["Choose: If you could … (fly / meet anyone / be invisible …)", "Write the question: what / where would you …?", "Write your answer: I'd …", "Try to make two lines rhyme."], "words": ["If you could …", "what would you …?", "I'd …", "because", "rhyme: day / play · sea / free · sky / fly"], "model": "If you could fly up in the sky,\nwhere would you go and why?\nI'd fly to Salalah to see the rain,\nthen I'd fly back home again!", "icon": "✍️"}, {"type": "balloons", "title": "Pop the right answer!", "rounds": [{"q": "The speaker dressed as …", "o": ["a pharaoh", "a detective", "an astronaut"], "a": 0}, {"q": "Sherlock Holmes always finds …", "o": ["the thief", "the pyramids", "the snowman"], "a": 0}, {"q": "In the Arctic, the speaker wants to build …", "o": ["a house in the snow", "a pyramid", "a rocket"], "a": 0}, {"q": "The astronauts left a ___ on the Moon.", "o": ["flag", "snowman", "hat"], "a": 0}, {"q": "school rhymes with …", "o": ["cool", "snow", "sky"], "a": 0}], "icon": "🎈"}, {"type": "summary", "title": "Let's remember!", "center": "Book club: If you could… (a poem)", "branches": ["The poem has four verses; lines 1–2 and 3–4 rhyme.", "Places: Ancient Egypt, London years ago, the Arctic, the Moon.", "If you could …, what would you …? → I'd …", "look at / up / down / around / behind / under / through"], "icon": "🧠"}, {"type": "exit", "title": "Exit ticket", "items": [{"k": "3", "text": "Name two places the speaker would like to visit."}, {"k": "2", "text": "Find two words that rhyme in the poem."}, {"k": "1", "text": "Complete: If I could travel back in time, I'd …"}], "icon": "🎟️"}, {"type": "homework", "title": "Homework", "head": "My homework", "items": ["Activity Book pp. 46–47: Activities 1–4.", "Activity 5: write six or more sentences with look + preposition.", "Write your own verse: If I could …, I'd …"], "icon": "🏠"}]}, {"id": "L33", "unit": "U4", "unitName": "Unit 3: Spend or save?", "title": "Imaginary situations & Second conditional", "code": "", "theme": "park", "emo": "💭", "slides": [{"type": "cover", "say": "Unit 3 · Lesson 5 – Imaginary situations & the second conditional"}, {"type": "goals", "title": "Today's goals", "items": ["I can use 12 phrases for imaginary situations: be invisible, win a cup …", "I can use the second conditional for imaginary situations."], "icon": "🎯"}, {"type": "goals", "title": "Today's goals", "items": ["I can form it: if + Past simple, would + verb.", "I can play a sentence chain game."], "icon": "🎯"}, {"type": "build", "title": "Dream words", "mode": "letters", "items": [{"a": "invisible", "hint": "no one can see you", "emo": "👻"}, {"a": "inventor", "hint": "a person who makes new things", "emo": "💡"}, {"a": "charity", "hint": "it helps people who need help", "emo": "🤲"}, {"a": "principal", "hint": "the head of a school", "emo": "🏫"}, {"a": "wish", "hint": "something you really want", "emo": "🌠"}], "icon": "🔤"}, {"type": "flip", "title": "Imaginary situations (1)", "cards": [{"front": "be an inventor", "icon": "💡", "back": "make new things nobody has made before\n«I'd like to be an inventor.»"}, {"front": "become a book or film character", "icon": "🎬", "back": "be a person from a story\n«I'd become Sherlock Holmes.»"}, {"front": "win a cup", "icon": "🏆", "back": "be the winner of a competition\n«Our team could win a cup.»"}, {"front": "have a lot of money", "icon": "💰", "back": "be rich\n«If I had a lot of money, I'd help people.»"}, {"front": "have a wish", "icon": "🌠", "back": "be able to ask for something you want\n«If I had a wish, I'd fly.»"}, {"front": "go into space", "icon": "🚀", "back": "travel out of our planet\n«He'd like to go into space.»"}], "icon": "🔤"}, {"type": "flip", "title": "Imaginary situations (2)", "cards": [{"front": "become a school principal", "icon": "🏫", "back": "be the head of a school\n«If I became a school principal, I'd …»"}, {"front": "travel the world", "icon": "🌍", "back": "visit many countries\n«I'd love to travel the world.»"}, {"front": "donate to a charity", "icon": "🤲", "back": "give money to help people\n«Would you donate to a charity?»"}, {"front": "travel back in time", "icon": "⏳", "back": "go to the past\n«If I could travel back in time, I'd go to Ancient Egypt.»"}, {"front": "pass exams", "icon": "📝✅", "back": "be successful in tests\n«Most students have to pass exams.»"}, {"front": "be invisible", "icon": "👻", "back": "nobody can see you\n«Would it be fun to be invisible?»"}], "icon": "🔤"}, {"type": "mystery", "title": "What's the phrase?", "img": "L33_c1", "answer": "12 imaginary situations! 💭", "qs": [{"q": "Nobody can see you:", "o": ["be an inventor", "be invisible"], "a": 1}, {"q": "Give money to help people:", "o": ["donate to a charity", "have a wish"], "a": 0}, {"q": "Go to the past:", "o": ["travel the world", "travel back in time"], "a": 1}, {"q": "Be the winner of a competition:", "o": ["win a cup", "pass exams"], "a": 0}], "icon": "🕵️"}, {"type": "quiz", "title": "Complete the questions", "icon": "✏️", "qs": [{"q": "Would it be fun to ___ so that no one else could see you?", "o": ["be invisible", "be an inventor"], "a": 0}, {"q": "Would you like to ___ of cool things when you're older?", "o": ["be an inventor", "travel back in time"], "a": 0}, {"q": "Would you like to donate ___ that helps other people?", "o": ["to a charity", "a wish"], "a": 0}, {"q": "Would you like to act and sing and become ___?", "o": ["a film character", "a wish"], "a": 0}, {"q": "Would you like to have ___ to become a doctor one day?", "o": ["a wish", "to a charity"], "a": 0}, {"q": "Would you like to ___ to visit Ancient Egypt?", "o": ["travel back in time", "be invisible"], "a": 0}]}, {"type": "ask", "title": "Real or imaginary?", "qs": [{"q": "'If you could travel back in time, what would you choose to do?' Real or imaginary?", "a": "Imaginary – we can't travel back in time."}, {"q": "'If you could go into space, what would you do?'", "a": "Imaginary (for us now)."}, {"q": "'If I need something, I ask my parents.' Real or imaginary?", "a": "Real – zero conditional."}, {"q": "'If we all buy everything online, shops will close.'", "a": "Real possibility – first conditional."}], "img": "L33_c2", "icon": "🤔"}, {"type": "explain", "title": "Second conditional", "lines": ["We use the second conditional to talk about [[imaginary]] situations."], "img": "L33_c2", "rule": "if + Past simple …, would ('d) + verb", "icon": "💡"}, {"type": "flip", "title": "Second conditional 💡 – examples", "cards": [{"front": "If I [[could travel]] back in time, I[[’d go]] to Ancient Egypt.", "icon": "💡", "back": "could + verb"}, {"front": "If I [[went]] into space, I[[’d walk]] on the moon.", "icon": "✨", "back": "Past simple, 'd + verb"}, {"front": "If you [[could become]] a film character, what character [[would]] you [[choose]]?", "icon": "🔎", "back": "question"}, {"front": "If you [[were]] rich, [[would]] you [[donate]] to a charity?", "icon": "📌", "back": "If I / you / he were …"}]}, {"type": "quiz", "title": "Choose the correct form", "qs": [{"q": "If I ___ a wish, I'd ask for a long and happy life.", "o": ["had", "have", "will have"], "a": 0}, {"q": "If I ___ invisible, I'd help the police catch criminals.", "o": ["am", "were", "will be"], "a": 1}, {"q": "If you ___ be an inventor, what new thing would you invent?", "o": ["can", "could", "will"], "a": 1}, {"q": "If you ___ 50 OMR in a competition, what would you buy?", "o": ["won", "win", "will win"], "a": 0}, {"q": "If I could travel into space, I ___ Mars.", "o": ["will visit", "would visit", "visit"], "a": 1}], "icon": "✅"}, {"type": "build", "title": "Imagine it!", "mode": "words", "items": [{"a": "If I could see the snake, I would be scared.", "hint": "I can't see the snake. I'm not scared. 🐍"}, {"a": "If I knew the answer, I would tell you.", "hint": "I don't know the answer. I won't tell you. ❓"}, {"a": "If we had the time, we would visit the museum.", "hint": "We don't have time. We won't visit the museum. 🏛️"}, {"a": "If I spoke Italian, I would understand Mario.", "hint": "I don't speak Italian. I don't understand Mario. 🇮🇹"}, {"a": "If you were 18, you could drive a car.", "hint": "You aren't 18. You can't drive a car. 🚗"}], "icon": "🧩"}, {"type": "ask", "title": "Hassan and Sara", "qs": [{"q": "Listen to Hassan and his sister Sara. What two things do they wish for?", "a": "Listen to 3.11 and find out!"}, {"q": "What would you wish for?", "a": "If I had a wish, I'd …"}], "img": "L33_c3", "icon": "🎧"}, {"type": "wheel", "title": "Imagine this!", "items": [{"q": "If you got 50 OMR as an Eid present, what would you buy?", "a": "If I got 50 OMR, I would buy a new football."}, {"q": "If you had a two-week holiday now, where would you go?", "a": "I'd go to Salalah."}, {"q": "If you could choose anywhere in the world, where would you live?", "a": "I'd live in Japan."}, {"q": "If you met your favourite celebrity, what would you say?", "a": "I'd say: Can I take a photo with you?"}, {"q": "If you lost your mobile phone, how would you feel?", "a": "I'd feel worried."}, {"q": "If you could become anyone in the world, who would you choose?", "a": "I'd choose to be a famous inventor."}], "icon": "🎡"}, {"type": "ask", "title": "Sentence chain game", "qs": [{"q": "1 If I had a wish, …", "a": "… I'd become an inventor."}, {"q": "2 If I became an inventor, …", "a": "… then I'd have lots of good ideas."}, {"q": "3 If I had lots of good ideas, …", "a": "… I'd win a prize."}, {"q": "4 If I won a prize, …", "a": "… I'd donate the money to a charity. (your idea!)"}, {"q": "5 If I donated to a charity, …", "a": "… I'd help a lot of people. (your idea!)"}], "img": "L33_c3", "icon": "⛓️"}, {"type": "race", "title": "Second conditional race", "qs": [{"q": "If I ___ rich, I'd donate to a charity.", "options": ["am", "were", "will be"], "a": 1}, {"q": "If people took care of our planet, it ___ a nicer place.", "options": ["will be", "would be", "is"], "a": 1}, {"q": "We use the second conditional for …", "options": ["real situations", "imaginary situations", "facts"], "a": 1}, {"q": "Nobody can see you:", "options": ["be invisible", "travel the world", "pass exams"], "a": 0}, {"q": "If you knew a big secret, ___ me?", "options": ["would you tell", "will you tell", "do you tell"], "a": 0}, {"q": "I'd = ", "options": ["I would", "I did", "I will"], "a": 0}], "icon": "🏁"}, {"type": "steps", "title": "Let's remember!", "icon": "🧠", "steps": ["Imaginary situations: be invisible, travel back in time, go into space, win a cup …", "Second conditional: if + Past simple, would + verb.", "If I had a wish, I'd become an inventor. 💡", "Zero = real · First = might happen · Second = imaginary"]}, {"type": "exit", "title": "Exit ticket", "items": [{"k": "3", "text": "Complete: If I ___ (can) travel into space, I'd visit Mars."}, {"k": "2", "text": "Complete: If I became a school principal, I ___ …"}, {"k": "1", "text": "Write: If I had a wish, …"}], "icon": "🎟️"}, {"type": "homework", "title": "Homework", "head": "My homework", "items": ["Activity Book pp. 48–49: Activities 1–6.", "Grammar practice AB p. 62: Activities 3–4.", "Activity 6: write five more 'Imagine this!' questions and ask your family."], "icon": "🏠"}]}, {"id": "L34", "unit": "U4", "unitName": "Unit 3: Spend or save?", "title": "Culture & Project: Interesting markets", "code": "", "theme": "park", "emo": "🏮", "slides": [{"type": "cover", "say": "Unit 3 · Lesson 6 – WOW! Culture & Project: a tourist leaflet"}, {"type": "goals", "title": "Today's goals", "items": ["I can read about three interesting markets around the world.", "I can find information: where, when and what you can buy."], "icon": "🎯"}, {"type": "goals", "title": "Today's goals", "items": ["I can make a tourist leaflet with my group.", "I can present it and vote for the best market."], "icon": "🎯"}, {"type": "ask", "title": "Markets where you live", "qs": [{"q": "What are markets like where you live?", "a": "e.g. Muttrah Souq is old and busy, with small shops selling frankincense, silver and clothes."}, {"q": "What type of things do you buy at a market?", "a": "fruit, vegetables, fish, dates, halwa, clothes, souvenirs …"}, {"q": "Which is the most famous market in Oman?", "a": "Muttrah Souq / Nizwa Souq."}], "img": "L34_c1", "icon": "🇴🇲"}, {"type": "read", "title": "Muara Kuin Floating Market, Indonesia", "paras": ["There aren't any shops in this market, but there are a lot of shop-boats! There's been a market on this river for hundreds of years.", "You can buy fruit, vegetables, flowers and fish. But you have to get there before sunrise because it's usually finished by 7am."], "img": "L34_c2", "icon": "🛶"}, {"type": "read", "title": "Djemaa el Fna, Marrakech, Morocco", "paras": ["One of the most interesting markets in the world, Djemaa el Fna, is in the central [[square]] in Marrakech every day.", "This market is famous for selling [[leather]] bags and shoes and bright bowls and cups."], "img": "L34_c3", "icon": "🐍"}, {"type": "read", "title": "Djemaa el Fna, Marrakech, Morocco", "paras": ["After sunset, the market becomes even more [[charming]]. You can eat delicious food, listen to stories and watch snakes and monkeys doing tricks."], "img": "L34_c3", "icon": "🐍"}, {"type": "read", "title": "Flower Market, Hong Kong", "paras": ["This beautiful flower market is popular with tourists and local people, too.", "It's open from 7am to 7pm every day and you can choose from all types of different flowers as well as plants and trees. You can smell this market from streets away!"], "img": "L34_c4", "icon": "🌸"}, {"type": "read", "title": "Flower Market, Hong Kong", "paras": ["WOW! Fact: One of the oldest markets in the world is Khan al-Khalili market in Cairo, Egypt, which started more than 600 years ago."], "img": "L34_c4", "icon": "🌸"}, {"type": "sort", "title": "Which market is it?", "bins": [{"label": "Muara Kuin", "icon": "🛶"}, {"label": "Djemaa el Fna", "icon": "🐍"}, {"label": "Flower Market", "icon": "🌸"}], "cards": [{"text": "You can see fun shows with animals.", "icon": "", "bin": 1}, {"text": "The market isn't on land. It's on a river.", "icon": "", "bin": 0}, {"text": "The things you can buy there smell amazing.", "icon": "", "bin": 2}, {"text": "It's a great place to visit in the evening.", "icon": "", "bin": 1}, {"text": "It's famous for bags, shoes and other leather items.", "icon": "", "bin": 1}, {"text": "The market starts at 7 o'clock in the morning.", "icon": "", "bin": 2}], "icon": "🗂️"}, {"type": "ask", "title": "Short answers", "qs": [{"q": "Which time does the Hong Kong Flower Market close?", "a": "At 7pm."}, {"q": "How often is there a market in Djemaa el Fna?", "a": "Every day."}, {"q": "What time must you go to the Muara Kuin Market?", "a": "Before sunrise / before 7am."}, {"q": "How long has there been a market at Muara Kuin?", "a": "For hundreds of years."}, {"q": "Which market should you visit if you want to buy a tree?", "a": "The Flower Market in Hong Kong."}], "img": "L34_c1", "icon": "💭"}, {"type": "quiz", "title": "Quick quiz", "qs": [{"q": "At Muara Kuin, people sell things from …", "o": ["shop-boats", "tents", "cars"], "a": 0}, {"q": "Djemaa el Fna is in …", "o": ["Indonesia", "Hong Kong", "Morocco"], "a": 2}, {"q": "After sunset, Djemaa el Fna becomes …", "o": ["closed", "more charming", "empty"], "a": 1}, {"q": "Khan al-Khalili market is in …", "o": ["Marrakech", "Cairo", "Muscat"], "a": 1}], "img": "L34_c1", "icon": "✅"}, {"type": "ask", "title": "The Yuyuan Bazaar", "qs": [{"q": "Where is the Yuyuan Bazaar?", "a": "In Shanghai, the biggest city in China."}, {"q": "How many shops does it have?", "a": "More than 100 shops."}, {"q": "How many people go there every day?", "a": "More than 200,000 people!"}, {"q": "Listen and complete the other gaps (it's ___, many different ___, food, ___ and tea, first opened in ___ …).", "a": "Listen to 3.14 and check. (famous is the example)"}], "img": "L34_c1", "icon": "🎧"}, {"type": "wheel", "title": "Which market would you visit?", "items": [{"q": "Which market would you most like to visit? Why?", "a": "I'd like to visit Djemaa el Fna because I'd love to watch the monkeys doing tricks."}, {"q": "Would you get up before sunrise to go to a market?", "a": "Yes, I would! / No, I wouldn't."}, {"q": "What would you buy at the Flower Market?", "a": "I'd buy some flowers for my mum."}, {"q": "Which market in Oman would you show a tourist?", "a": "I'd show them Muttrah Souq."}, {"q": "What would you buy at Muttrah Souq?", "a": "frankincense, silver jewellery, halwa …"}], "icon": "🎡"}, {"type": "explain", "title": "Project: a tourist leaflet", "lines": ["In groups, find out about some interesting markets from around the world. Choose two or three."], "img": "L34_c5", "rule": "Writing tip: use a wide range of adjectives.", "icon": "🗺️"}, {"type": "flip", "title": "Project: a tourist leaflet 🗺️ – examples", "cards": [{"front": "Where is the market?", "icon": "💡", "back": "📍"}, {"front": "When is the market?", "icon": "✨", "back": "🕖"}, {"front": "What can you buy at the market?", "icon": "🔎", "back": "🛍️"}, {"front": "Write, find photos, glue them on the leaflet.", "icon": "📌", "back": "✂️🖼️"}]}, {"type": "write", "title": "Write about your market", "task": "Write a description of a market for your group's tourist leaflet.", "steps": ["Where is the market?", "How big is the market?", "What time is the market open?", "What items do the shops sell?", "How many people go there?", "What is special about the market?"], "words": ["famous", "busy", "colourful", "charming", "delicious", "traditional", "It's open from … to …", "You can buy …"], "model": "Muttrah Souq, Muscat, Oman: This busy, traditional market is next to the sea in Muttrah. It's one of the oldest markets in Oman. You can buy frankincense, silver jewellery, colourful scarves and delicious halwa. It's charming in the evening when the lights are on!", "icon": "✍️"}, {"type": "memory", "title": "Memory: market + picture", "pairs": [["floating market", "🛶🍌"], ["snakes and monkeys", "🐍🐒"], ["flowers and trees", "🌸🌳"], ["leather bags", "👜"], ["Khan al-Khalili", "🇪🇬"], ["Muttrah Souq", "🇴🇲"]], "icon": "🧠"}, {"type": "balloons", "title": "Pop the right answer!", "rounds": [{"q": "The Muara Kuin market is usually finished by …", "o": ["7am", "7pm", "noon"], "a": 0}, {"q": "Djemaa el Fna is famous for selling ___ bags and shoes.", "o": ["leather", "paper", "plastic"], "a": 0}, {"q": "The Flower Market is open from …", "o": ["7am to 7pm", "sunset to sunrise", "9am to 5pm"], "a": 0}, {"q": "Khan al-Khalili started more than ___ years ago.", "o": ["600", "60", "6,000"], "a": 0}, {"q": "Speaking tip: point to the ___ of each market.", "o": ["photo", "map", "price"], "a": 0}], "icon": "🎈"}, {"type": "steps", "title": "Let's remember!", "icon": "🧠", "steps": ["Muara Kuin (Indonesia): a floating market on shop-boats – go before sunrise!", "Djemaa el Fna (Morocco): leather, bright bowls, food, stories, snakes and monkeys.", "Flower Market (Hong Kong): flowers, plants and trees, 7am–7pm.", "A good leaflet: where, when, what to buy + photos + lots of adjectives."]}, {"type": "exit", "title": "Exit ticket", "items": [{"k": "3", "text": "Which market is on a river?"}, {"k": "2", "text": "What can you buy at Djemaa el Fna?"}, {"k": "1", "text": "Which market would you most like to visit? Why?"}], "icon": "🎟️"}, {"type": "homework", "title": "Homework", "head": "My homework", "items": ["Activity Book p. 50: Activities 1–4.", "Find a photo and three facts about your group's market.", "Practise presenting your part of the leaflet."], "icon": "🏠"}]}, {"id": "L35", "unit": "U4", "unitName": "Unit 3: Spend or save?", "title": "English in action: Making a complaint", "code": "", "theme": "park", "emo": "🧾", "slides": [{"type": "cover", "say": "Unit 3 · Lesson 7 – English in action: making a complaint"}, {"type": "goals", "title": "Today's goals", "items": ["I can make a polite complaint in a shop.", "I can ask for a refund or to exchange something."], "icon": "🎯"}, {"type": "goals", "title": "Today's goals", "items": ["I can answer a complaint as a shop assistant.", "I can say would weakly in second conditional sentences."], "icon": "🎯"}, {"type": "enter", "title": "Catch the PROBLEMS with things you bought.", "gate": "✓", "items": [{"text": "it's broken", "in": true}, {"text": "it works", "in": false}, {"text": "it doesn't work", "in": true}, {"text": "it's beautiful", "in": false}, {"text": "it's too small", "in": true}, {"text": "it fits", "in": false}]}, {"type": "read", "title": "At the clothes shop", "paras": ["Customer: Good morning. [[I'm afraid]] I have a [[complaint]] about some things I bought last week.", "Shop assistant: OK, what's the problem?", "Customer: When I got home, I found that there is a button [[missing]] on this skirt. I need to exchange it.", "Shop assistant: I'm very sorry about that. Of course you can exchange it."], "img": "L35_c1", "icon": "📖"}, {"type": "read", "title": "At the clothes shop", "paras": ["Customer: I'm afraid there's also a problem with this scarf. It's [[damaged]] here.", "Shop assistant: Oh, yes. I'm sorry about that. Would you like to exchange it, too?", "Customer: No. Please could I have a refund for the scarf?", "Shop assistant: No problem. I'll just need to see your receipt.", "Customer: Here you go."], "img": "L35_c1", "icon": "📖"}, {"type": "read", "title": "At the clothes shop", "paras": ["Shop assistant: That's great. Thanks."], "img": "L35_c1", "icon": "📖"}, {"type": "ask", "title": "Two complaints", "qs": [{"q": "What's the first complaint?", "a": "There's a button missing on the skirt."}, {"q": "What does she ask the shop assistant to do about it?", "a": "To exchange it."}, {"q": "What's the second complaint?", "a": "The scarf is damaged."}, {"q": "What does she ask for?", "a": "A refund for the scarf."}, {"q": "What does the shop assistant need to see?", "a": "Her receipt."}], "img": "L35_c2", "icon": "💭"}, {"type": "explain", "title": "Say it! Making a complaint", "lines": ["Be polite! Start with I'm afraid … and say what you want."], "img": "L35_c3", "rule": "complaint → problem → refund / exchange → receipt", "icon": "🗣️"}, {"type": "flip", "title": "Say it! Making a complaint 🗣️ – examples", "cards": [{"front": "[[I'm afraid I have a complaint about]] this jacket.", "icon": "💡", "back": "🧥"}, {"front": "[[I'd like to complain about]] this phone.", "icon": "✨", "back": "📱"}, {"front": "[[I'm afraid there is a problem with]] these shoes.", "icon": "🔎", "back": "👟"}, {"front": "[[Please could I have a refund?]] / [[I need to exchange]] them.", "icon": "📌", "back": "💵 / 🔄"}]}, {"type": "order", "title": "Adam's complaint: put it in order", "items": ["Adam: I'm afraid I have a complaint about these jeans.", "Shop assistant: Oh, really? What seems to be wrong with them?", "Adam: They're damaged here. I need to exchange them.", "Shop assistant: I'm sorry about that. Of course you can exchange them.", "Adam: I'm afraid there's a problem with this jacket, too.", "Shop assistant: What's the problem? Is it too big or too small for you?"], "icon": "🔢"}, {"type": "quiz", "title": "What would you say?", "qs": [{"q": "Your new phone is broken. You say:", "o": ["Give me money now!", "I love this phone!", "I'd like to complain about this phone."], "a": 2, "why": "polite complaint"}, {"q": "You want your money back. You say:", "o": ["Please could I have a refund?", "It fits.", "I need a receipt."], "a": 0}, {"q": "You want different shoes. You say:", "o": ["I'm only kidding!", "No chance!", "I need to exchange them."], "a": 2}, {"q": "The shop assistant says:", "o": ["That's your problem!", "Go away.", "I'm sorry about that. What's the problem?"], "a": 2}, {"q": "To get a refund, you usually need your …", "o": ["receipt", "queue", "wallet"], "a": 0}], "icon": "✅"}, {"type": "ask", "title": "Act it out!", "qs": [{"q": "📱 broken phone", "a": "A: I'm afraid I have a complaint about this phone. B: OK, what's the problem? A: It's broken. Please could I have a refund?"}, {"q": "👕 shirt missing button", "a": "A: I'm afraid there's a problem with this shirt. There's a button missing. I need to exchange it."}, {"q": "👟 damaged trainers", "a": "A: I'd like to complain about these trainers. They're damaged. B: I'm sorry. Would you like to exchange them?"}, {"q": "👖 damaged trousers", "a": "A: I'm afraid these trousers are damaged here. Please could I have a refund?"}, {"q": "📲 tablet doesn't work", "a": "A: I'd like to complain about this tablet. It doesn't work. B: I'll just need to see your receipt."}], "img": "L35_c4", "icon": "🎭"}, {"type": "wheel", "title": "Your own complaints", "items": [{"q": "I'd like to complain about this …", "a": "… watch. It stopped working after one day."}, {"q": "I'm afraid there's a problem with these …", "a": "… sandals. They're too small."}, {"q": "Excuse me. I need to exchange this …", "a": "… dishdasha. There's a button missing."}, {"q": "Shop assistant: What's wrong with it?", "a": "It's damaged here."}, {"q": "Shop assistant: Would you like a refund or an exchange?", "a": "Please could I have a refund?"}], "icon": "🎡"}, {"type": "explain", "title": "Is would stressed?", "lines": ["Listen and say. In the second conditional, would is usually [[unstressed]] – we stress the main verb."], "img": "L35_c5", "rule": "would = /wəd/ or 'd – quick and weak", "icon": "🔊"}, {"type": "flip", "title": "Is would stressed? 🔊 – examples", "cards": [{"front": "If I had a lot of money, I would [[donate]] some to charity.", "icon": "💡", "back": "🔊"}, {"front": "If I could travel the world, I would [[go]] to Africa.", "icon": "✨", "back": "🔊"}, {"front": "If she was an inventor, she would [[have]] a lot of great ideas.", "icon": "🔎", "back": "🔊"}, {"front": "If they could travel back in time, they would [[go]] back to ancient China.", "icon": "📌", "back": "🔊"}]}, {"type": "quiz", "title": "Complete with would + verb", "icon": "✏️", "qs": [{"q": "If I won 100 OMR in a competition, I ___ myself a new bike.", "o": ["would buy", "would become"], "a": 0}, {"q": "If I could have any job in the world, I ___ a pilot.", "o": ["would become", "would go"], "a": 0}, {"q": "If I were the school principal, I ___ a lot of changes.", "o": ["would make", "would take"], "a": 0}, {"q": "If I had a big house near the beach, I ___ there every weekend.", "o": ["would go", "would choose"], "a": 0}, {"q": "If I could learn to play any instrument, I ___ the electric guitar.", "o": ["would choose", "would make"], "a": 0}, {"q": "If I travelled the world, I ___ photos, of course!", "o": ["would take", "would buy"], "a": 0}]}, {"type": "tf", "title": "True or False?", "items": [{"text": "The woman bought the things last week.", "a": true, "fix": "some things I bought last week"}, {"text": "The skirt is damaged.", "a": false, "fix": "There's a button missing on the skirt."}, {"text": "She wants to exchange the skirt.", "a": true, "fix": "I need to exchange it."}], "icon": "✔✘"}, {"type": "tf", "title": "True or False?", "items": [{"text": "She wants to exchange the scarf too.", "a": false, "fix": "Please could I have a refund for the scarf?"}, {"text": "The shop assistant needs to see her receipt.", "a": true, "fix": "I'll just need to see your receipt."}], "icon": "✔✘"}, {"type": "build", "title": "Build the complaint", "mode": "words", "items": [{"a": "I'm afraid I have a complaint about this jacket.", "hint": "jacket 🧥"}, {"a": "I'd like to complain about this phone.", "hint": "phone 📱"}, {"a": "I'm afraid there is a problem with these shoes.", "hint": "shoes 👟"}, {"a": "Please could I have a refund?", "hint": "money back 💵"}], "icon": "🧩"}, {"type": "race", "title": "Complaint race", "qs": [{"q": "What was wrong with the skirt?", "options": ["It was damaged.", "It was too big.", "A button was missing."], "a": 2}, {"q": "What did the woman want for the scarf?", "options": ["an exchange", "a new receipt", "a refund"], "a": 2}, {"q": "I'm ___ I have a complaint.", "options": ["afraid", "scared", "sorry"], "a": 0}, {"q": "Give back and take a different one:", "options": ["refund", "exchange", "complain"], "a": 1}, {"q": "In 'I would donate', which word is stressed?", "options": ["donate", "would", "I"], "a": 0}], "icon": "🏁"}, {"type": "steps", "title": "Let's remember!", "icon": "🧠", "steps": ["Complain politely: I'm afraid I have a complaint about … / I'd like to complain about …", "Say the problem: It's damaged. A button is missing. It doesn't work.", "Ask: Please could I have a refund? / I need to exchange it.", "Bring your receipt! 🧾"]}, {"type": "exit", "title": "Exit ticket", "items": [{"k": "3", "text": "Start a complaint about a broken watch."}, {"k": "2", "text": "Ask for your money back politely."}, {"k": "1", "text": "What's the difference between a refund and an exchange?"}], "icon": "🎟️"}, {"type": "homework", "title": "Homework", "head": "My homework", "items": ["Activity Book p. 51: Activities 1–3.", "Write a dialogue: you complain about a damaged pair of trainers.", "Practise the Say it! phrases."], "icon": "🏠"}]}, {"id": "L36", "unit": "U4", "unitName": "Unit 3: Spend or save?", "title": "Reading: Literacy – emails (My shopping trip)", "code": "", "theme": "park", "emo": "📧", "slides": [{"type": "cover", "say": "Unit 3 · Lesson 8 – Reading: Literacy – emails"}, {"type": "goals", "title": "Today's goals", "items": ["I can scan an inbox and read the subject first.", "I can read and understand two informal emails."], "icon": "🎯"}, {"type": "goals", "title": "Today's goals", "items": ["I can learn new words in context: enormous, jealous …", "I can talk about shopping centres I know."], "icon": "🎯"}, {"type": "build", "title": "Email words", "mode": "letters", "items": [{"a": "subject", "hint": "it tells you what the email is about", "emo": "📌"}, {"a": "inbox", "hint": "where your new emails arrive", "emo": "📥"}, {"a": "reply", "hint": "write back to someone", "emo": "↩️"}, {"a": "website", "hint": "a place on the internet", "emo": "🌐"}], "icon": "🔤"}, {"type": "ask", "title": "Read the subjects only", "qs": [{"q": "Subjects: 'My shopping trip' and 'My funny shopping trip!' Are these emails formal or informal?", "a": "Informal – they are between friends."}, {"q": "What do you think they will be about?", "a": "Two shopping trips – one of them is funny!"}, {"q": "Reading tip: how can you choose which emails to read first?", "a": "Scan your inbox, see who the emails are from and read the subject box. Then read the most important ones first."}], "img": "L36_c4", "icon": "👀"}, {"type": "read", "title": "Nawal's email", "paras": ["To: Rasha · From: Nawal · Subject: My shopping trip", "Hi Rasha,", "Hope you're well and enjoying the school holidays! I'm having a great time here in Dubai. I know how much you love shopping, so I had to write and tell you about the shopping centre that we visited yesterday."], "img": "L36_c2", "icon": "📧"}, {"type": "read", "title": "Nawal's email", "paras": ["I've never been to such an [[enormous]] place! There are 1,200 shops and more than 200 places to eat. If you get bored of shopping, you can visit the aquarium and [[underwater]] zoo, the ice rink or the cinema with 22 different films. If you have time, look at the website. I know you'll love it!"], "img": "L36_c2", "icon": "📧"}, {"type": "read", "title": "Nawal's email", "paras": ["The only problem is … I hate shopping, so I didn't buy anything! Write soon and tell me what you're doing.", "Bye, Nawal"], "img": "L36_c2", "icon": "📧"}, {"type": "read", "title": "Rasha's reply", "paras": ["To: Nawal · From: Rasha · Subject: My funny shopping trip!", "Hi Nawal,", "I'm so [[jealous]]! That shopping centre sounds [[incredible]]. If I could, I'd get on a plane and come right now! Anyway, I'm having a good holiday here at home."], "img": "L36_c3", "icon": "📧"}, {"type": "read", "title": "Rasha's reply", "paras": ["I went to the shops yesterday, too. I bought a new black T-shirt last week. But after it was washed, it was too small for me! So I decided to take it back to the shop to make a complaint and ask for a refund."], "img": "L36_c3", "icon": "📧"}, {"type": "read", "title": "Rasha's reply", "paras": ["I explained the problem to the shop assistant. She was very helpful, but then she looked inside the T-shirt and she said, 'If this T-shirt is too small for you, it's probably because it's for children aged 4–5!' It wasn't my black T-shirt – it was my little sister's black T-shirt! I felt so [[embarrassed]]!"], "img": "L36_c3", "icon": "📧"}, {"type": "read", "title": "Rasha's reply", "paras": ["I got out of the shop as quickly as I could. If you have time, send me some photos and tell me more about your adventures!", "See you soon, Rasha"], "img": "L36_c3", "icon": "📧"}, {"type": "match", "title": "Words in context", "pairs": [["underwater", "under the surface of water"], ["jealous", "unhappy that someone has something you don't have"], ["enormous", "extremely large in size or quantity"], ["embarrassed", "very shy or uncomfortable"], ["incredible", "very difficult or impossible to believe"]], "icon": "🧩"}, {"type": "ask", "title": "Answer the questions", "qs": [{"q": "How many shops are there in the shopping centre that Nawal visited?", "a": "1,200."}, {"q": "How many places are there to eat?", "a": "More than 200."}, {"q": "What else can you do there if you don't want to go shopping?", "a": "Visit the aquarium and underwater zoo, the ice rink or the cinema."}], "img": "L36_c1", "icon": "💭"}, {"type": "ask", "title": "Answer the questions", "qs": [{"q": "Who likes shopping?", "a": "Rasha. (Nawal hates shopping!)"}, {"q": "Why did Rasha go to the shops yesterday?", "a": "To take back a T-shirt, make a complaint and ask for a refund – it was too small."}, {"q": "Why did Rasha feel embarrassed?", "a": "It wasn't her T-shirt – it was her little sister's (for children aged 4–5)!"}], "icon": "💭"}, {"type": "sort", "title": "Who wrote it: Nawal or Rasha?", "bins": [{"label": "Nawal", "icon": "📱"}, {"label": "Rasha", "icon": "💻"}], "cards": [{"text": "If you have time, look at the website.", "icon": "", "bin": 0}, {"text": "If you get bored of shopping, you can visit the aquarium.", "icon": "", "bin": 0}, {"text": "I had to write and tell you about the shopping centre.", "icon": "", "bin": 0}, {"text": "I explained the problem to the shop assistant.", "icon": "", "bin": 1}, {"text": "I felt so embarrassed!", "icon": "", "bin": 1}, {"text": "If I could, I'd get on a plane and come right now!", "icon": "", "bin": 1}], "icon": "🗂️"}, {"type": "tf", "title": "True or False?", "items": [{"text": "Rasha was enjoying a holiday in Dubai.", "a": false, "fix": "Nawal says she's having a great time in Dubai."}, {"text": "Nawal had never seen such a big shopping centre before.", "a": true, "fix": "I've never been to such an enormous place!"}, {"text": "There wasn't anywhere to eat in the shopping centre.", "a": false, "fix": "more than 200 places to eat"}], "icon": "✔✘"}, {"type": "tf", "title": "True or False?", "items": [{"text": "Rasha wrote that she wasn't enjoying herself at home.", "a": false, "fix": "I'm having a good holiday here at home."}, {"text": "Rasha wanted to exchange the T-shirt for a different colour.", "a": false, "fix": "She wanted a refund."}, {"text": "The T-shirt was small because it didn't belong to Rasha.", "a": true, "fix": "It was my little sister's black T-shirt!"}], "icon": "✔✘"}, {"type": "wheel", "title": "Ask and answer", "items": [{"q": "Would you like to go to the shopping centre that Nawal describes? Why? / Why not?", "a": "Yes, I would, because I'd love to visit the aquarium."}, {"q": "What's the most interesting shop or shopping centre you have ever been to? Why?", "a": "Mall of Oman, because it has a snow park!"}, {"q": "Have you ever felt embarrassed in a shop? Why?", "a": "Yes – I forgot my wallet!"}, {"q": "If you could visit any shopping centre in the world, where would you go?", "a": "I'd go to …"}], "icon": "🎡"}, {"type": "ask", "title": "Shopping centres around the world", "qs": [{"q": "Choose one: Mall of Oman (Oman), Dubai Mall (Dubai), Forum Istanbul (Türkiye), Galerías Pacífico (Argentina).", "a": "e.g. Mall of Oman"}, {"q": "Where is it? How many shops does it have?", "a": "Find out and make notes."}, {"q": "What fun activities can you do there? Where can you eat?", "a": "Find out and make notes."}, {"q": "What makes it special or unusual?", "a": "Share your ideas with the class."}], "img": "L36_c1", "icon": "🏬"}, {"type": "quiz", "title": "Read the inbox first", "qs": [{"q": "What should you read first in your inbox?", "o": ["the whole email", "who the email is from and the subject", "only the last line"], "a": 1}, {"q": "Which email would you read first if you wanted a funny story?", "o": ["My funny shopping trip!", "My shopping trip"], "a": 0}, {"q": "Are emails between friends formal or informal?", "o": ["informal", "formal"], "a": 0}], "img": "L36_c4", "icon": "📥"}, {"type": "build", "title": "Spell the new words", "mode": "letters", "items": [{"a": "enormous", "hint": "extremely large", "emo": "🐘"}, {"a": "jealous", "hint": "unhappy that someone has something you don't have", "emo": "😒"}, {"a": "incredible", "hint": "very difficult to believe", "emo": "🤯"}, {"a": "embarrassed", "hint": "very shy or uncomfortable", "emo": "😳"}, {"a": "underwater", "hint": "under the surface of water", "emo": "🐠"}], "icon": "🔤"}, {"type": "race", "title": "Email race", "qs": [{"q": "Where is Nawal on holiday?", "options": ["Dubai", "Cairo", "Muscat"], "a": 0}, {"q": "How many films are at the cinema?", "options": ["200", "12", "22"], "a": 2}, {"q": "Who hates shopping?", "options": ["Rasha", "the shop assistant", "Nawal"], "a": 2}, {"q": "Whose T-shirt was it?", "options": ["Rasha's mum's", "Rasha's little sister's", "Nawal's"], "a": 1}, {"q": "'Extremely large' =", "options": ["jealous", "embarrassed", "enormous"], "a": 2}, {"q": "These emails are …", "options": ["formal", "informal", "reports"], "a": 1}], "icon": "🏁"}, {"type": "steps", "title": "Let's remember!", "icon": "🧠", "steps": ["Scan your inbox and read the subject first.", "Nawal visited an enormous shopping centre in Dubai – but she hates shopping!", "Rasha took back a T-shirt … it was her little sister's! 😳", "New words: enormous, underwater, jealous, incredible, embarrassed."]}, {"type": "exit", "title": "Exit ticket", "items": [{"k": "3", "text": "Why was Rasha jealous?"}, {"k": "2", "text": "Why did Rasha feel embarrassed?"}, {"k": "1", "text": "Write a sentence with 'incredible'."}], "icon": "🎟️"}, {"type": "homework", "title": "Homework", "head": "My homework", "items": ["Activity Book p. 52: Activities 1–4.", "Find out three facts about Mall of Oman or another shopping centre.", "Read the emails again aloud."], "icon": "🏠"}]}, {"id": "L37", "unit": "U4", "unitName": "Unit 3: Spend or save?", "title": "Writing: An informal email reply", "code": "", "theme": "park", "emo": "✉️", "slides": [{"type": "cover", "say": "Unit 3 · Lesson 9 – Writing: an informal email reply"}, {"type": "goals", "title": "Today's goals", "items": ["I can choose a good subject line.", "I can start and finish an informal email correctly."], "icon": "🎯"}, {"type": "goals", "title": "Today's goals", "items": ["I can use unless = if … not.", "I can plan, write and check an email reply."], "icon": "🎯"}, {"type": "boxes", "title": "Email boxes", "boxes": [{"label": "1", "q": "How do we start an informal email?", "a": "Hi + the name of the person."}, {"label": "2", "q": "How do we finish an informal email?", "a": "Bye / See you soon + your name."}, {"label": "3", "q": "What does the subject box tell us?", "a": "Why you're sending the email."}, {"label": "4", "q": "Who wrote 'My funny shopping trip!'?", "a": "Rasha."}, {"label": "5", "q": "Formal or informal: an email to your cousin?", "a": "Informal."}], "icon": "🎁"}, {"type": "read", "title": "Kamla's email", "paras": ["To: Zainab · From: Kamla · Subject: …", "Hi Zainab,", "I'm so excited about coming to visit you next weekend! I'd really like to go shopping while I'm there. I need to buy a present for my mother and I won't have time to get it [[unless]] I go next weekend. What are the shops like where you live?"], "img": "L37_c1", "icon": "📧"}, {"type": "read", "title": "Kamla's email", "paras": ["I love shopping! If I had a lot of money, I'd go shopping every day! What's your favourite shop and why?", "If we have time after shopping, let's do something fun in town. What else is there to do there?", "I can't wait to see you!", "Bye, Kamla"], "img": "L37_c1", "icon": "📧"}, {"type": "quiz", "title": "Choose the best subject line", "qs": [{"q": "What's the best subject line for Kamla's email?", "o": ["My new computer game", "Next weekend!", "My favourite shop"], "a": 1, "why": "Kamla is writing about her visit next weekend."}], "img": "L37_c1", "icon": "✅"}, {"type": "ask", "title": "How to write an informal email", "qs": [{"q": "What do we put in the subject box?", "a": "Why you're sending the email."}, {"q": "How do we start an informal email?", "a": "With Hi + the name of the person: Hi Zainab,"}, {"q": "How do we finish an informal email?", "a": "With Bye or See you soon + your name: Bye, Kamla"}, {"q": "What else makes an email easy to understand?", "a": "Clear and simple language, and paragraphs."}], "img": "L37_c2", "icon": "💭"}, {"type": "explain", "title": "unless = if … not", "lines": ["We use the word [[unless]] for if … not."], "img": "L37_c3", "rule": "unless + positive verb = if + not", "icon": "💡"}, {"type": "flip", "title": "unless = if … not 💡 – examples", "cards": [{"front": "I won't have time to get it [[unless]] I go this weekend.", "icon": "💡", "back": "= If I don't go this weekend, I won't have time to get it."}, {"front": "[[Unless]] I go to bed early, I'll feel tired tomorrow.", "icon": "✨", "back": "= If I don't go to bed early …"}]}, {"type": "build", "title": "Rewrite with unless", "mode": "words", "items": [{"a": "Unless I go to bed early, I'll feel tired tomorrow.", "hint": "If I don't go to bed early, I'll feel tired tomorrow. 😴"}, {"a": "We'll miss the last bus unless we leave now.", "hint": "We'll miss the last bus if we don't leave now. 🚌"}, {"a": "Unless Sabah calls me today, I'll be angry with her.", "hint": "If Sabah doesn't call me today, I'll be angry with her. 📞"}, {"a": "You won't get a refund unless you have a receipt.", "hint": "You won't get a refund if you don't have a receipt. 🧾"}], "icon": "🧩"}, {"type": "ask", "title": "A model email", "qs": [{"q": "What's in the subject box?", "a": "Weekend trip to the market! – it explains why he's sending the email."}, {"q": "How does Mohammed start?", "a": "Hi Ammar,"}, {"q": "How many paragraphs are there? What is each one about?", "a": "Four: his new school – why he's writing – the Old City Market – asking for a message."}, {"q": "How does he finish?", "a": "Bye, Mohammed"}, {"q": "Find a conditional sentence.", "a": "If you have time, send me a message."}], "img": "L37_c4", "icon": "📄"}, {"type": "order", "title": "Plan your email", "items": ["Explain in the subject box why you are sending an email.", "Start with Hi and your friend's name.", "Use paragraphs to organise your ideas clearly.", "Use very clear, simple, everyday language.", "Finish your email with Bye or See you soon and your name."], "icon": "🔢"}, {"type": "write", "title": "Write Zainab's reply", "task": "Write Zainab's email to Kamla. Answer all of Kamla's questions.", "steps": ["Subject: say why you're writing.", "Start: Hi Kamla,", "Paragraph 1: describe the shops where you live.", "Paragraph 2: describe your favourite shop and say why.", "Paragraph 3: say what else there is to do where you live.", "Finish: See you soon, Zainab"], "words": ["I can't wait!", "There's a big shopping centre …", "My favourite shop is … because …", "If we have time, we can …", "unless", "See you soon,"], "model": "Subject: Shopping next weekend!\nHi Kamla,\nI'm so happy you're coming! There are lots of shops where I live. There's a big shopping centre and an old souq.\nMy favourite shop is the bookshop in the souq because it sells second-hand books for a good price.\nIf we have time after shopping, we can go to the beach and watch the sunset. Unless it rains, it'll be great!\nSee you soon,\nZainab", "icon": "✍️"}, {"type": "tf", "title": "Check your work", "items": [{"text": "My email is organised so it's easy to understand.", "a": true, "fix": "Use paragraphs."}, {"text": "It's OK to finish an informal email with 'Yours faithfully'.", "a": false, "fix": "Use Bye or See you soon + your name."}, {"text": "I should use conditional sentences correctly.", "a": true, "fix": "Have I used conditional sentences correctly?"}, {"text": "I should use long, difficult words.", "a": false, "fix": "Use clear and simple language."}], "icon": "✔✘"}, {"type": "sort", "title": "Start, middle or end?", "bins": [{"label": "start", "icon": "👋"}, {"label": "middle", "icon": "📝"}, {"label": "end", "icon": "👋"}], "cards": [{"text": "Hi Kamla,", "icon": "", "bin": 0}, {"text": "Hi Ammar,", "icon": "", "bin": 0}, {"text": "There's a big shopping centre near my house.", "icon": "", "bin": 1}, {"text": "My favourite shop is the bookshop.", "icon": "", "bin": 1}, {"text": "See you soon,", "icon": "", "bin": 2}, {"text": "Bye, Zainab", "icon": "", "bin": 2}], "icon": "🗂️"}, {"type": "quiz", "title": "unless or if?", "qs": [{"q": "I'll be late ___ I hurry.", "o": ["if", "unless"], "a": 1}, {"q": "___ it rains, we'll stay at home.", "o": ["If", "Unless"], "a": 0}, {"q": "You can't come in ___ you have a ticket.", "o": ["unless", "if"], "a": 0}, {"q": "Which means the same as 'If you don't study, you won't pass'?", "o": ["Unless you don't study, you won't pass.", "Unless you study, you won't pass."], "a": 1}], "img": "L37_c3", "icon": "✅"}, {"type": "race", "title": "Email race", "qs": [{"q": "unless = …", "options": ["because", "if … not", "when"], "a": 1}, {"q": "Start an informal email with …", "options": ["Dear Sir,", "Hi Zainab,", "To whom it may concern,"], "a": 1}, {"q": "Kamla needs to buy a present for her …", "options": ["mother", "teacher", "sister"], "a": 0}, {"q": "If I had a lot of money, I ___ shopping every day!", "options": ["'ll go", "'d go", "go"], "a": 1}, {"q": "You won't get a refund ___ you have a receipt.", "options": ["because", "if", "unless"], "a": 2}], "icon": "🏁"}, {"type": "summary", "title": "Let's remember!", "center": "Writing: An informal email reply", "branches": ["Subject box: why you're writing.", "Hi + name … paragraphs … Bye / See you soon + name.", "Clear, simple, everyday language.", "Answer ALL your friend's questions · unless = if … not."], "icon": "🧠"}, {"type": "exit", "title": "Exit ticket", "items": [{"k": "3", "text": "Write a subject line for an email about your birthday party."}, {"k": "2", "text": "Rewrite with unless: If you don't hurry, you'll be late."}, {"k": "1", "text": "How do you finish an informal email?"}], "icon": "🎟️"}, {"type": "homework", "title": "Homework", "head": "My homework", "items": ["Activity Book pp. 53–54: Activities 1–4.", "Finish Zainab's email and check it.", "Read the Writing model on AB p. 67."], "icon": "🏠"}]}, {"id": "L38", "unit": "U4", "unitName": "Unit 3: Spend or save?", "title": "Over to you! & Review 3", "code": "", "theme": "park", "emo": "🌟", "slides": [{"type": "cover", "say": "Unit 3 · Lesson 10 – WOW! Over to you! & Review"}, {"type": "goals", "title": "Today's goals", "items": ["I can read readers' comments and write my own.", "I can review shopping words and imaginary situations."], "icon": "🎯"}, {"type": "goals", "title": "Today's goals", "items": ["I can use zero, first and second conditionals.", "I can check my progress in Unit 3."], "icon": "🎯"}, {"type": "memory", "title": "Unit 3 memory", "pairs": [["receipt", "🧾"], ["queue", "🚶‍♂️🚶‍♀️🚶"], ["be invisible", "👻"], ["go into space", "🚀"], ["donate to a charity", "🤲"], ["win a cup", "🏆"]], "icon": "🧠"}, {"type": "read", "title": "Readers' comments", "paras": ["Eva, 14, Argentina: I enjoyed reading the discussion about online shopping. I hope that we still have shops in the future because I really enjoy shopping! My favourite shops are clothes shops and gift shops."], "img": "L38_c1", "icon": "📖"}, {"type": "read", "title": "Readers' comments", "paras": ["Muna, 14, Oman: I enjoyed listening to the conversation about things that are made in Oman. I had  "L41_c3", "icon": "📖"}, {"type": "read", "title": "The School Trip (4)", "paras": ["The show at the planetarium has finished.", "'It's my turn to ask you a question, Basil,' says the school principal. 'If you could go anywhere in space, where would you go?'"], "img": "L41_c4", "icon": "📖"}, {"type": "read", "title": "The School Trip (4)", "paras": ["'I'd go to the moon,' says Basil. 'If I wore a [[spacesuit]], I could still breathe [[oxygen]]. I'd explore the moon and see the whole of Earth. That would be amazing!'"], "img": "L41_c4", "icon": "📖"}, {"type": "match", "title": "Match the questions and answers", "pairs": [["Who is Basil interviewing for the school radio station?", "the school principal"], ["Where do the children go on their school trip?", "a planetarium"], ["Where would Basil go if he could go into space?", "the moon"]], "icon": "🧩"}, {"type": "tf", "title": "True or False?", "items": [{"text": "If the principal could do any job, he'd work in a planetarium.", "a": false, "fix": "He always wanted to become a school principal."}, {"text": "You can watch a show about space in a planetarium.", "a": true, "fix": "an amazing show about space on the screen above your head"}, {"text": "If Basil had a lot of money, he'd buy a spacesuit.", "a": false, "fix": "He'd buy a telescope."}, {"text": "The principal would rather go into space.", "a": true, "fix": "'I'd rather go into space.'"}], "icon": "✔✘"}, {"type": "order", "title": "Put the story in order", "items": ["Basil interviews the principal for the school radio.", "The principal says he always wanted to be a principal.", "The principal plans a trip to a planetarium.", "The students watch a show about space.", "The principal asks Basil a question.", "Basil says he'd go to the moon."], "icon": "🔢"}, {"type": "wheel", "title": "Interview time!", "items": [{"q": "If you could do any job in the world, what would you do?", "a": "I'd be a pilot."}, {"q": "If you had a wish, would you rather travel the world, go in erence.", "Anas: How do you mean?", "Rashid: Well, global warming is destroying the sea ice. So we should do everything we can to stop global warming."], "img": "L42_c3", "icon": "📖"}, {"type": "read", "title": "Rashid and Anas", "paras": ["Anas: Oh, yes, I see. There are lots of things we can do to help with that. For example, we shouldn't (4) waste energy and we should (5) recycle plastic, paper and glass.", "Rashid: Yes, and I should repair my bike so I can cycle to school. We also need to find a way to tell other people how they can help."], "img": "L42_c3", "icon": "📖"}, {"type": "read", "title": "Rashid and Anas", "paras": ["Anas: I know! Let's (6) invent a new game about protecting the environment! We can call it the 'Go Green Game'!", "Rashid: Great idea!"], "img": "L42_c3", "icon": "📖"}, {"type": "quiz", "title": "Circle the correct word", "qs": [{"q": "The Arctic sea ice is …", "o": ["disappearing", "appearing"], "a": 0}, {"q": "What can we do to ___ things for polar bears?", "o": ["save", "improve"], "a": 1}, {"q": "We shouldn't ___ energy.", "o": ["waste", "disappear"], "a": 0}, {"q": "We should ___ plastic, paper and glass.", "o": ["recycle", "destroy"], "a": 0}, {"q": "Let's ___ a new game!", "o": ["improve", "invent"], "a": 1}, {"q": "Renewable energy has got better = it has …", "o": ["improved", "wasted"], "a": 0}], "img": "L42_c3", "icon": "✅"}, {"type": "explain", "title": "Reflexive pronouns after by", "lines": ["by + reflexive pronoun = alone, without help."], "img": "L42_c5", "rule": "We use myself with 'I' · We use yourself with 'you'.", "icon": "💡"}, {"type": "flip", "title": "Reflexive pronouns after by 💡 – examples", "cards": [{"front": "I can't save them [[by myself]].", "icon": "💡", "back": "I → myself"}, {"front": "Of course you can't do it [[by yourself]].", "icon": "✨", "back": "you → yourself"}, {"front": "I can do my homework [[by myself]].", "icon": "🔎", "back": "= on my own"}]}, {"type": "quiz", "title": "by myself or by yourself?", "icon": "✏️", "qs": [{"q": "I can do my homework ___. (on my own)", "o": ["by myself", "by yourself"], "a": 0}, {"q": "Are you going to walk to the shop ___? (alone)", "o": ["by yourself", "by myself"], "a": 0}, {"q": "I want to watch this film ___. (alone)", "o": ["by myself", "by yourself"], "a": 0}, {"q": "You can't do this job by ___.", "o": ["yourself", "myself"], "a": 0}, {"q": "I ate the whole pizza by ___!", "o": ["myself", "yourself"], "a": 0}, {"q": "Did you do this project by ___?", "o": ["yourself", "myself"], "a": 0}]}, {"type": "wheel", "title": "The 'Go Green Game'", "items": [{"q": "1 save water", "a": "We should save water."}, {"q": "2 plant trees", "a": "We should plant trees."}, {"q": "3 switch off lights", "a": "We should switch off the lights."}, {"q": "4 waste energy", "a": "We shouldn't waste energy."}, {"q": "5 recycle plastic", "a": "We should recycle plastic."}, {"q": "6 destroy the rainforests", "a": "We shouldn't destroy the rainforests."}, {"q": "7 pick up rubbish", "a": "We should pick up rubbish."}, {"q": "8 use renewable energy", "a": "We should use renewable energy."}], "icon": "🌱"}, {"type": "race", "title": "Show what you know!", "qs": [{"q": "Polar bears have ___ skin.", "options": ["white", "pink", "black"], "a": 2}, {"q": "687 =", "options": ["six hundreds eighty-seven", "sixty-eight seven", "six hundred and eighty-seven"], "a": 2}, {"q": "Of course you can't do it by …", "options": ["yourself", "myself", "you"], "a": 0}, {"q": "About how many polar bears are left?", "options": ["3,000", "300,000", "30,000"], "a": 2}, {"q": "We shouldn't ___ energy.", "options": ["waste", "recycle", "save"], "a": 0}], "icon": "🏁"}, {"type": "summary", "title": "Let's remember!", "center": "Language booster 1: Big numbers & by myself", "branches": ["Polar bears: black skin, up to 800 kg, can swim 687 km!", "Sad facts: only about 30,000 left; the sea ice is 30% smaller.", "Big numbers: four hundred and fifty · thirty thousand.", "by myself / by yourself = alone · We should go green! 🌱"], "icon": "🧠"}, {"type": "exit", "title": "Exit ticket", "items": [{"k": "3", "text": "Write 950 in words."}, {"k": "2", "text": "Complete: I can't carry this box by ___."}, {"k": "1", "text": "Write one way we can help polar bears."}], "icon": "🎟️"}, {"type": "homework", "title": "Homework", "head": "My homework", "items": ["Activity Book pp. 58–59: Activities 1–8.", "Activity 4: research one more fun fact and one more sad fact about polar bears.", "Activity 8: write three more ideas for the 'Go Green Game'."], "icon": "🏠"}]}, {"id": "L43", "unit": "U5", "unitName": "WOW! Learning Club 1", "title": "Science: How can we give an explanation?", "code": "", "theme": "city", "emo": "🔬", "slides": [{"type": "cover", "say": "WOW! Learning Club 1 · Science – How can we give an explanation?"}, {"type": "goals", "title": "Today's goals", "items": ["I can say what an explanation is: how or why something happens.", "I can plan cause and effect with arrows (→)."], "icon": "🎯"}, {"type": "goals", "title": "Today's goals", "items": ["I can explain why rainforests are in danger.", "I can present a cause and effect explanation about plastic rubbish."], "icon": "🎯"}, {"type": "ask", "title": "Changes in the environment", "qs": [{"q": "What do you know about changes in the environment?", "a": "The climate is getting hotter, sea ice is melting, there's more pollution, forests are cut down …"}, {"q": "Which changes have you seen in Oman?", "a": "hotter summers, cyclones, less rain in some places, plastic on beaches …"}, {"q": "Why do these changes happen?", "a": "Because of things people do: cars, factories, cutting down trees …"}], "img": "L43_c1", "icon": "🌍"}, {"type": "read", "title": "Planning an explanation", "paras": ["When we give an [[explanation]], we say how or why something happens or why something happened in the past. An explanation often needs to show [[cause and effect]]. When we plan to write about cause and effect, we can use arrows (→) between our notes.", "gases from cars, buses and aeroplanes → pollution → global warming"], "img": "L43_c1", "icon": "📖"}, {"type": "read", "title": "Planning an explanation", "paras": ["fossil fuels from fires → pollution → global warming", "cutting down trees in forests → global warming", "global warming → planet gets hotter → climate change"], "img": "L43_c1", "icon": "📖"}, {"type": "read", "title": "Planning an explanation", "paras": ["Why is our climate changing? Our climate is changing because of many things we do. Gases made by cars, buses and aeroplanes cause pollution and pollution causes global warming. Using [[fossil fuels]] for fires and cutting down trees in forests also cause global warming. Due to global warming our planet gets hotter, so the climate changes."], "img": "L43_c1", "icon": "📖"}, {"type": "tf", "title": "True or False?", "items": [{"text": "Explanations tell us when and where something happens.", "a": false, "fix": "They tell us how or why something happens."}, {"text": "Explanations can tell us about something that's happening now or something that happened in the past.", "a": true, "fix": "how or why something happens or … happened in the past"}, {"text": "Arrows link ideas in our notes.", "a": true, "fix": "we can use arrows (→) between our notes"}], "icon": "✔✘"}, {"type": "tf", "title": "True or False?", "items": [{"text": "Pollution from transport causes global warming.", "a": true, "fix": "Gases made by cars, buses and aeroplanes cause pollution …"}, {"text": "Global warming causes the cutting down of forests.", "a": false, "fix": "Cutting down forests causes global warming."}], "icon": "✔✘"}, {"type": "order", "title": "Make the chain", "items": ["gases from cars, buses and aeroplanes", "pollution", "global warming", "the planet gets hotter", "climate change"], "icon": "🔗"}, {"type": "explain", "title": "Cause and effect language", "lines": ["Write three things that are caused by climate change. Use an arrow between the cause and effect."], "img": "L43_c2", "rule": "cause → effect · because / because of / so / causes", "icon": "💡"}, {"type": "flip", "title": "Cause and effect language 💡 – examples", "cards": [{"front": "climate change → melting ice in the Arctic", "icon": "💡", "back": "Climate change [[is causing]] the melting of ice in the Arctic."}, {"front": "This [[is causing]] / [[has caused]] …", "icon": "✨", "back": "This happens [[because]] / [[because of]] …"}, {"front": "[[Because of this]], …", "icon": "🔎", "back": "… is happening / has happened, [[so]] …"}]}, {"type": "read", "title": "Why are rainforests in danger?", "paras": ["Why are rainforests in danger? Rainforests are forests that grow where there is lots of rain. They are very important because they have more plants and animals than any other [[habitat]]."], "img": "L43_c3", "icon": "🌳"}, {"type": "read", "title": "Why are rainforests in danger?", "paras": ["However, workers in the rainforests are cutting down many trees. This is because trees are used to make fuel and oil. They are also used to make paper, furniture and wooden homes. Forest workers sometimes burn the trees so that farmers can have new land for their crops and farm animals. All this is causing the rainforests to be in danger."], "img": "L43_c3", "icon": "🌳"}, {"type": "read", "title": "Why are rainforests in danger?", "paras": ["Why is cutting down and burning rainforest trees a problem? Cutting down many rainforest trees causes problems for plants, animals and people. Plants and trees are important because they help to keep the [[soil]] good for other plants. Without good soil, plants start dying. Then without plants, animals lose food and habitat, so they move away."], "img": "L43_c3", "icon": "🌳"}, {"type": "read", "title": "Why are rainforests in danger?", "paras": ["Another problem is for people. When rainforest trees are burned, they make gases. These gases go into the air and cause pollution, so people can get ill. The pollution also causes global warming."], "img": "L43_c3", "icon": "🌳"}, {"type": "order", "title": "Plan 1: cutting down trees", "items": ["rainforest trees are cut down", "plants die", "animals move away"], "icon": "🔗"}, {"type": "order", "title": "Plan 2: burning trees", "items": ["burning rainforest trees", "makes gases", "air pollution", "global warming"], "icon": "🔗"}, {"type": "quiz", "title": "Cause or effect?", "qs": [{"q": "Why are trees in the rainforest cut down?", "o": ["to make fuel, oil, paper, furniture and homes", "to help the soil", "to give animals food"], "a": 0}, {"q": "Why do forest workers sometimes burn trees?", "o": ["to make soil good", "so farmers can have new land", "to make rain"], "a": 1}, {"q": "Without good soil, …", "o": ["it rains more", "animals get bigger", "plants start dying"], "a": 2}, {"q": "Burning trees makes gases, so …", "o": ["plants grow faster", "people can get ill", "the air gets cleaner"], "a": 1}], "img": "L43_c3", "icon": "✅"}, {"type": "write", "title": "Presentation: plastic rubbish", "task": "In groups, make a cause and effect presentation about pollution caused by plastic rubbish.", "steps": ["Think about the problems: Lots of … on beach → … in wind → … into sea → fish …", "Use these words: cause / causes, because, then.", "Draw or find pictures for your presentation.", "Present your information to the class.", "Think about other groups' presentations: clear pictures? clear diagrams? correct facts?"], "words": ["Today we'll explain …", "It's our turn to explain what happens when …", "causes", "because", "then", "so"], "model": "Today we'll explain what happens when we drop plastic on the beach. When people drop plastic bottles and plastic from food on the beach, the wind causes it to blow into the sea. Then fish and turtles eat the plastic because they think it's food, so they get ill.", "icon": "🧴➡️🐟"}, {"type": "match", "title": "Match cause and effect", "pairs": [["gases from cars and aeroplanes", "pollution"], ["pollution", "global warming"], ["without good soil", "plants start dying"], ["without plants", "animals lose food and habitat"], ["burning trees", "gases go into the air"]], "icon": "🧩"}, {"type": "memory", "title": "Memory: science words", "pairs": [["fuel", "⛽"], ["burning", "🔥"], ["soil", "🟫🌱"], ["habitat", "🏞️"], ["pollution", "🏭"], ["global warming", "🌡️"]], "icon": "🧠"}, {"type": "race", "title": "Scientist race", "qs": [{"q": "An explanation says …", "options": ["who and what", "how or why something happens", "when and where"], "a": 1}, {"q": "In our notes, arrows link …", "options": ["names", "numbers", "cause and effect"], "a": 2}, {"q": "Pollution causes …", "options": ["global warming", "rainforests", "good soil"], "a": 0}, {"q": "Without plants, animals …", "options": ["grow bigger", "stay", "move away"], "a": 2}, {"q": "Climate change is causing the ___ of ice in the Arctic.", "options": ["making", "melting", "freezing"], "a": 1}], "icon": "🏁"}, {"type": "steps", "title": "Let's remember!", "icon": "🧠", "steps": ["An explanation says how or why something happens.", "Plan with arrows: cause → effect.", "Cutting down and burning trees → plants die, animals move away, pollution, global warming.", "Use: cause(s), because (of), so, then. 🔬"]}, {"type": "exit", "title": "Exit ticket", "items": [{"k": "3", "text": "Complete: cutting down trees → ___"}, {"k": "2", "text": "Write one sentence with 'causes'."}, {"k": "1", "text": "What happens when plastic goes into the sea?"}], "icon": "🎟️"}, {"type": "homework", "title": "Homework", "head": "My homework", "items": ["Write a cause and effect plan with arrows about one environmental problem in Oman.", "Write a short explanation (4–5 sentences) from your plan.", "Prepare pictures for your group's plastic rubbish presentation."], "icon": "🏠"}]}]}/*afuq-lesson-filter*/;(function(){var q=new URLSearchParams(location.search).get("l");if(!q)return;var D=window.DECK,L=D.lessons.filter(function(x){return x.id===q});if(!L.length)return; <script>/* Illustrated full-bleed backdrops for the ICT decks (1600x900 SVG, cartoon style).
   SCENES[key]() returns an <svg> string. Keys: lab, library, city, space, workshop, office, playground, toyroom (the last two for grades 1-4).
   Every scene keeps its middle area calm so the slide cards stay readable. */
(function(){
const O='#2b3a55';            // outline colour
function rng(seed){let s=seed;return()=>{s=(s*16807)%2147483647;return (s-1)/2147483646}}
function svg(body,defs){return `<svg class="scene" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg"><defs>${defs||''}</defs>${body}</svg>`}
function cloud(x,y,s,o){o=o==null?1:o;return `<g transform="translate(${x} ${y}) scale(${s})" opacity="${o}"><path d="M0 40q0-26 30-26q8-22 36-22q30 0 38 26q28-2 30 22q0 22-26 22H22Q0 62 0 40z" fill="#fff" stroke="#cfe3f3" stroke-width="3"/></g>`}
function palm(x,y,s){return `<g transform="translate(${x} ${y}) scale(${s})"><path d="M0 0q6-60 2-120" stroke="#8a6a45" stroke-width="10" fill="none" stroke-linecap="round"/><g fill="#5fae6e" stroke="#3d7f4c" stroke-width="3"><path d="M2-120q-50-20-80 10q40-8 80-10z"/><path d="M2-120q-30-45-70-40q40 12 70 40z"/><path d="M2-120q20-50 66-42q-40 10-66 42z"/><path d="M2-120q50-14 78 16q-40-10-78-16z"/></g></g>`}
function plant(x,y,s){return `<g transform="translate(${x} ${y}) scale(${s})"><path d="M-45 0h90l-12 70h-66z" fill="#e9eef5" stroke="${O}" stroke-width="5"/><path d="M-50-6h100v12h-100z" fill="#d7dfea" stroke="${O}" stroke-width="5"/><g fill="#6cc07a" stroke="#3f8a4f" stroke-width="4"><path d="M0-6q-70-40-60-120q40 50 60 120z"/><path d="M0-6q60-50 80-110q10 70-80 110z"/><path d="M0-6q-10-90 20-150q20 80-20 150z"/><path d="M0-6q-80-10-110-60q70-10 110 60z"/></g></g>`}
function monitor(x,y,s,c){c=c||'#4fa3e0';return `<g transform="translate(${x} ${y}) scale(${s})"><rect x="-90" y="-130" width="180" height="120" rx="12" fill="#27354f" stroke="${O}" stroke-width="5"/><rect x="-78" y="-118" width="156" height="96" rx="6" fill="${c}"/><g stroke="#fff" stroke-width="6" stroke-linecap="round" opacity=".85"><path d="M-62-100h50M-62-82h80M-62-64h36M-62-46h64"/></g><path d="M-14-10h28l8 26h-44z" fill="#9aa8bf" stroke="${O}" stroke-width="5"/><rect x="-50" y="14" width="100" height="10" rx="5" fill="#9aa8bf" stroke="${O}" stroke-width="4"/></g>`}
function desk(x,y,w){return `<g><rect x="${x}" y="${y}" width="${w}" height="26" rx="8" fill="#c98f5a" stroke="${O}" stroke-width="5"/><rect x="${x+20}" y="${y+26}" width="18" height="140" fill="#a8743f" stroke="${O}" stroke-width="5"/><rect x="${x+w-38}" y="${y+26}" width="18" height="140" fill="#a8743f" stroke="${O}" stroke-width="5"/></g>`}
function robot(x,y,s){return `<g class="robot" transform="translate(${x} ${y}) scale(${s})"><path d="M0-200v-26" stroke="${O}" stroke-width="6"/><circle cx="0" cy="-232" r="10" fill="#ff7a8a" stroke="${O}" stroke-width="5"/><rect x="-70" y="-200" width="140" height="110" rx="34" fill="#e7f2ff" stroke="${O}" stroke-width="6"/><rect x="-50" y="-178" width="100" height="62" rx="22" fill="#27354f"/><circle cx="-20" cy="-148" r="10" fill="#7ef0ff"/><circle cx="20" cy="-148" r="10" fill="#7ef0ff"/><path d="M-12-128q12 10 24 0" stroke="#7ef0ff" stroke-width="5" fill="none" stroke-linecap="round"/><rect x="-56" y="-84" width="112" height="90" rx="26" fill="#cfe6ff" stroke="${O}" stroke-width="6"/><circle cx="0" cy="-40" r="16" fill="#ffd166" stroke="${O}" stroke-width="5"/><path d="M-56-60q-40 10-46 44M56-60q40 10 46 44" stroke="${O}" stroke-width="10" fill="none" stroke-linecap="round"/><circle cx="-102" cy="-12" r="12" fill="#ffd166" stroke="${O}" stroke-width="5"/><circle cx="102" cy="-12" r="12" fill="#ffd166" stroke="${O}" stroke-width="5"/><rect x="-40" y="6" width="26" height="30" rx="8" fill="#9fb3d1" stroke="${O}" stroke-width="5"/><rect x="14" y="6" width="26" height="30" rx="8" fill="#9fb3d1" stroke="${O}" stroke-width="5"/></g>`}
function floorTiles(y0,c1,c2,line){let s=`<rect x="0" y="${y0}" width="1600" height="${900-y0}" fill="url(#fl)"/>`;for(let i=-10;i<=10;i++){s+=`<path d="M${800+i*40} ${y0} L${800+i*260} 900" stroke="${line}" stroke-width="2" opacity=".55"/>`}let yy=y0;for(let k=1;k<7;k++){yy+=k*9;s+=`<path d="M0 ${yy}H1600" stroke="${line}" stroke-width="2" opacity=".5"/>`}return `<defs><linearGradient id="fl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${c1}"/><stop offset="1" stop-color="${c2}"/></linearGradient></defs>`+s}
function skyline(y,col,seed){const r=rng(seed);let s='';let x=-20;while(x<1620){const w=50+r()*80,h=60+r()*140;s+=`<rect x="${x}" y="${y-h}" width="${w}" height="${h}" fill="${col}"/>`;x+=w+4}
  // omani fort tower + dome + minaret
  s+=`<g fill="${col}"><rect x="300" y="${y-210}" width="90" height="210"/><path d="M295 ${y-210}h100v-14h-14v8h-14v-8h-14v8h-14v-8h-14v8h-14v-8h-16z"/><path d="M1120 ${y-150}a70 70 0 0 1 140 0z"/><rect x="1120" y="${y-150}" width="140" height="150"/><rect x="1290" y="${y-260}" width="24" height="260"/><path d="M1286 ${y-260}l16-40l16 40z"/></g>`;return s}
function sun(x,y,r){return `<g><circle cx="${x}" cy="${y}" r="${r+30}" fill="#fff3b0" opacity=".45"/><circle cx="${x}" cy="${y}" r="${r}" fill="#ffd75e" stroke="#f2b632" stroke-width="5"/></g>`}

const S={};

${desk(1210,690,430)}${monitor(1330,690,.95,'#6ccf8e')}${monitor(1510,690,.85,'#f39a6b')}
${plant(470,800,.9)}
<g transform="translate(1440 120)"><circle r="44" fill="#fff" stroke="${O}" stroke-width="6"/><path d="M0 0V-26M0 0l18 12" stroke="${O}" stroke-width="6" stroke-linecap="round"/></g>
`,`<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7cc8ff"/><stop offset="1" stop-color="#dff3ff"/></linearGradient>`);

function shelf(x,y,w,seed){const r=rng(seed);const cols=['#e86f7c','#5aa0e6','#f2c14e','#66c08a','#a58be8','#f39a6b','#4fc2c2'];let s=`<rect x="${x}" y="${y}" width="${w}" height="16" fill="#a8743f" stroke="${O}" stroke-width="4"/>`;let xx=x+8;while(xx<x+w-30){const bw=18+r()*16,bh=70+r()*40,c=cols[Math.floor(r()*cols.length)];s+=`<rect x="${xx}" y="${y-bh}" width="${bw}" height="${bh}" rx="3" fill="${c}" stroke="${O}" stroke-width="3"/><rect x="${xx+4}" y="${y-bh+12}" width="${bw-8}" height="6" fill="#fff" opacity=".6"/>`;xx+=bw+3;if(r()<.12){s+=`<rect x="${xx}" y="${y-30}" width="60" height="30" rx="4" fill="${cols[Math.floor(r()*7)]}" stroke="${O}" stroke-width="3"/>`;xx+=66}}return s}

<g transform="translate(140 760)"><path d="M0 0l70-26l-30 40z" fill="#fff" stroke="${O}" stroke-width="4"/></g><g transform="translate(1420 740) scale(-1 1)"><path d="M0 0l70-26l-30 40z" fill="#fff" stroke="${O}" stroke-width="4"/></g>
${plant(380,760,.8)}${plant(1220,760,.8)}
`,`<linearGradient id="sky2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9fd6ff"/><stop offset="1" stop-color="#f1e6ff"/></linearGradient>`);

function bld(x,w,h,c,seed){const r=rng(seed);let s=`<rect x="${x}" y="${720-h}" width="${w}" height="${h}" rx="6" fill="${c}" stroke="${O}" stroke-width="5"/>`;for(let yy=720-h+22;yy<700;yy+=34)for(let xx=x+14;xx<x+w-24;xx+=30)s+=`<rect x="${xx}" y="${yy}" width="16" height="20" rx="3" fill="${r()<.5?'#fff6c8':'#d9ecff'}" stroke="${O}" stroke-width="2"/>`;return s}
function ant(x,y){return `<path d="M${x} ${y}v-50" stroke="${O}" stroke-width="5"/><circle cx="${x}" cy="${y-54}" r="7" fill="#ff7a8a" stroke="${O}" stroke-width="4"/><g fill="none" stroke="#ff9db0" stroke-width="5" stroke-linecap="round"><path d="M${x-22} ${y-70}a30 30 0 0 1 44 0"/><path d="M${x-38} ${y-86}a52 52 0 0 1 76 0" opacity=".7"/></g>`}
