errible."}, {"label": "3", "q": "Write a question to start a brochure about diving.", "a": "Do you want to swim with colourful fish?"}, {"label": "4", "q": "Which pronouns talk to the reader?", "a": "you and we"}, {"label": "5", "q": "Write a good last sentence.", "a": "Book today for the adventure of your life!"}, {"label": "6", "q": "Why do we write a brochure?", "a": "To sell something."}], "icon": "🎁"}, {"type": "steps", "title": "Let's remember!", "icon": "🧠", "steps": ["Title → question → short paragraphs → memorable ending.", "Use you and we to talk to the reader.", "Use strong adjectives: brilliant, terrific, stunning – and really!", "Make it sound as good as possible – a brochure sells something."]}, {"type": "exit", "title": "Exit ticket", "items": [{"k": "3", "text": "Write a fun title for a brochure about caving."}, {"k": "2", "text": "Write one question to start the brochure."}, {"k": "1", "text": "Change 'nice' to a strong adjective: It's a nice place."}], "icon": "🎟️"}, {"type": "homework", "title": "Homework", "head": "My homework", "items": ["Activity Book pp. 37–38: Activities 1–4.", "Finish your brochure and add an exciting picture.", "Read the Writing model on AB p. 66 again."], "icon": "🏠"}]}, {"id": "L25", "unit": "U3", "unitName": "Unit 2: Adventure sports", "title": "Over to you! & Review 2", "code": "", "theme": "library", "emo": "🌟", "slides": [{"type": "cover", "say": "Unit 2 · Lesson 10 – WOW! Over to you! & Review"}, {"type": "goals", "title": "Today's goals", "items": ["I can read readers' comments on the WOW! Magazine.", "I can write my own comment about Unit 2."], "icon": "🎯"}, {"type": "goals", "title": "Today's goals", "items": ["I can review extreme sports, geography words, reflexive pronouns and the Past perfect.", "I can check my progress."], "icon": "🎯"}, {"type": "memory", "title": "Unit 2 memory", "pairs": [["caving", "🔦"], ["paragliding", "🪂"], ["sunrise", "🌅"], ["valley", "🏞️"], ["compass", "🧭"], ["helmet", "⛑️"]], "icon": "🧠"}, {"type": "read", "title": "Readers' comments", "paras": ["Laura, 14, Belgium: I agree with Eric. I think extreme sports teach children about danger. We've got a new adventure playground at our school. It helps us to get better at climbing, jumping and swinging. We always look after each other, too, so that nobody gets hurt."], "img": "L25_c1", "icon": "📖"}, {"type": "read", "title": "Readers' comments", "paras": ["Chang, 13, China: I enjoyed reading about all the different extreme sports. There are so many that I want to try now! The one I really want to do is diving. It must be so amazing to be underwater with all the fish!"], "img": "L25_c1", "icon": "📖"}, {"type": "read", "title": "Readers' comments", "paras": ["Yasir, 13, Oman: I liked the story about the helicopter rescue. Some children had an adventure in my town last year when they were [[trapped]] in a tower. They had gone up to look at the view, but then they couldn't get down. It was very scary for them. In the end, a helicopter pulled them up on a rope."], "img": "L25_c1", "icon": "📖"}, {"type": "read", "title": "Readers' comments", "paras": ["Hamzah, 14, Oman: My favourite extreme sport is horse riding. I first went horse riding when I was six and now I can ride really well. When I get older, I want to take part in horse riding [[competitions]]!"], "img": "L25_c1", "icon": "📖"}, {"type": "read", "title": "Readers' comments", "paras": ["Samira, 14, Oman: I enjoyed reading the brochure about the adventure holidays. It made me think of the safari that I went on last year in Africa with my family. After we'd seen zebras, we saw lions, rhinos and elephants, too. It was so exciting!"], "img": "L25_c1", "icon": "📖"}, {"type": "quiz", "title": "Who wrote it?", "qs": [{"q": "Who wants to try diving?", "o": ["Chang", "Laura", "Samira"], "a": 0}, {"q": "Who has an adventure playground at school?", "o": ["Yasir", "Laura", "Hamzah"], "a": 1}, {"q": "Who went on a safari in Africa?", "o": ["Samira", "Chang", "Hamzah"], "a": 0}, {"q": "Who first went horse riding when he was six?", "o": ["Yasir", "Hamzah", "Chang"], "a": 1}, {"q": "In Yasir's town, the children were trapped in a …", "o": ["cave", "tower", "valley"], "a": 1}], "img": "L25_c1", "icon": "👀"}, {"type": "write", "title": "Write your comment", "task": "Answer the questions with your partner. Then write your comment for the WOW! Magazine and read it to the class.", "steps": ["Which stories did you like best?", "What's the most interesting sport you've learned about?", "What place would you most like to go hiking in and why?"], "words": ["I liked the story about …", "I enjoyed reading …", "The most interesting sport is …", "I'd like to go hiking in …", "because", "It must be so amazing!"], "model": "Salma, 13, Oman: I liked the story about the old-fashioned explorers. The most interesting sport I've learned about is cycleball – football on bikes! I'd love to go hiking in Wadi Shab because the scenery is stunning.", "icon": "✍️"}, {"type": "ask", "title": "The WOW! question again", "qs": [{"q": "Eric asks: What are the advantages of extreme sports?", "a": "They're exciting, they teach children about danger, you feel proud and brave, you can see stunning places."}, {"q": "… and the disadvantages?", "a": "You can hurt yourself, some are too dangerous for young children, you need special equipment."}, {"q": "Are your answers different now?", "a": "Compare with the list from Lesson 1."}], "img": "L25_c2", "icon": "❓"}, {"type": "build", "title": "Write the sports", "mode": "letters", "items": [{"a": "abseiling", "hint": "A B S E I L I N G", "emo": "🪢"}, {"a": "paragliding", "hint": "_ _ R A _ _ _ _ _ _ _", "emo": "🪂"}, {"a": "caving", "hint": "C _ _ _ _ G", "emo": "🔦"}], "icon": "🔤"}, {"type": "build", "title": "Write the sports", "mode": "letters", "items": [{"a": "sandboarding", "hint": "S _ _ D _ O _ _ _ _ _ _", "emo": "🏜️"}, {"a": "surfboarding", "hint": "riding waves on a board", "emo": "🏄"}, {"a": "diving", "hint": "swimming deep under water", "emo": "🤿"}], "icon": "🔤"}, {"type": "ask", "title": "Look at the island", "qs": [{"q": "The field is on the ___ side of the island.", "a": "north (example)"}, {"q": "The ___ is on the west side of the island.", "a": "Look at the map and the compass to find the place."}, {"q": "The wood is on the ___ side of the island.", "a": "Look at the map and check."}, {"q": "The ___ is on the east side of the island.", "a": "Look at the map and check."}], "img": "L25_c3", "icon": "🏝️"}, {"type": "quiz", "title": "Reflexive pronouns", "icon": "✏️", "qs": [{"q": "Did you and your friends teach ___ to cook?", "o": ["yourselves", "yourself"], "a": 0}, {"q": "The girls ordered ___ a big pizza for dinner.", "o": ["themselves", "herself"], "a": 0}, {"q": "Tameem fell off his bicycle and hurt ___ yesterday.", "o": ["himself", "itself"], "a": 0}, {"q": "My sister Sara is always telling ___ to work harder.", "o": ["herself", "himself"], "a": 0}, {"q": "We really enjoyed ___ at the festival last week.", "o": ["ourselves", "themselves"], "a": 0}]}, {"type": "build", "title": "Past perfect sentences", "mode": "words", "items": [{"a": "After I had brushed my teeth, I got dressed.", "hint": "I brushed my teeth. I got dressed. (after)"}, {"a": "The game had ended before we went home.", "hint": "The game ended. We went home. (before)"}, {"a": "After Mudrik had eaten lunch, he washed up.", "hint": "Mudrik ate lunch. He washed up. (after)"}, {"a": "Everyone had left before we tidied up.", "hint": "Everyone left. We tidied up. (before)"}], "icon": "🧩"}, {"type": "wheel", "title": "Progress path – Unit 2", "items": [{"q": "Name six types of extreme sports. What's your favourite and why?", "a": "diving, caving, abseiling, paragliding, surfboarding, sandboarding … My favourite is … because …"}, {"q": "I hurt myself / yourself when I was caving.", "a": "myself"}, {"q": "My brother cut herself / himself while he was go-karting.", "a": "himself"}, {"q": "I sometimes sing to me / myself when I am happy.", "a": "myself"}, {"q": "Did you hurt you / yourself when you fell over?", "a": "yourself"}], "icon": "🛤️"}, {"type": "steps", "title": "Dictation", "icon": "✍️", "steps": ["abseiling", "paragliding", "sandboarding", "scenery"]}, {"type": "steps", "title": "Dictation", "icon": "✍️", "steps": ["valley", "themselves", "After they had eaten their breakfast, they looked in their guidebook.", "Would you rather go caving or abseiling?"]}, {"type": "balloons", "title": "Pop the right answer!", "rounds": [{"q": "Hamzah first went horse riding when he was …", "o": ["six", "ten", "fourteen"], "a": 0}, {"q": "Chang really wants to try …", "o": ["diving", "caving", "abseiling"], "a": 0}, {"q": "Laura's school has a new …", "o": ["adventure playground", "swimming pool", "climbing wall"], "a": 0}, {"q": "In Yasir's town, a ___ pulled the children up on a rope.", "o": ["helicopter", "bus", "boat"], "a": 0}, {"q": "After Samira had seen zebras, she saw …", "o": ["lions, rhinos and elephants", "polar bears", "penguins"], "a": 0}], "icon": "🎈"}, {"type": "race", "title": "Unit 2 race", "qs": [{"q": "You go down a cliff on a rope:", "options": ["abseiling", "caving", "surfboarding"], "a": 0}, {"q": "Children shouldn't do extreme sports because they always hurt …", "options": ["themselves", "himself", "theirselves"], "a": 0}, {"q": "After we ___ the zebras, we saw lions.", "options": ["had saw", "had seen", "have seen"], "a": 1}, {"q": "Would you rather ___ hiking or diving?", "options": ["to go", "going", "go"], "a": 2}, {"q": "A brochure is written to …", "options": ["sell something", "tell a story", "report facts"], "a": 0}, {"q": "Make a compound adjective: old + ___", "options": ["fashioned", "cold", "made"], "a": 0}], "icon": "🏁"}, {"type": "steps", "title": "Unit 2 in a nutshell", "icon": "🧠", "steps": ["12 extreme sports + places: wood, valley, bay, field, scenery, tide.", "Reflexive pronouns: myself … themselves.", "Past perfect: had + past participle (the earlier event).", "Would you rather …? I'd rather … · Brochures sell with strong adjectives."]}, {"type": "exit", "title": "Exit ticket", "items": [{"k": "3", "text": "Which lesson in Unit 2 was your favourite?"}, {"k": "2", "text": "Which part of the unit was difficult for you?"}, {"k": "1", "text": "How can you work and learn better in the next unit?"}], "icon": "🎟️"}, {"type": "homework", "title": "Homework", "head": "My homework", "items": ["Activity Book p. 39: Activities 1–5.", "Progress path AB pp. 70–71: Unit 2.", "Dictation AB p. 72: practise the Unit 2 words."], "icon": "🏠"}]}, {"id": "L26", "unit": "U3", "unitName": "Unit 2: Adventure sports", "title": "Get ready for… & Fun corner", "code": "", "theme": "library", "emo": "🏆", "slides": [{"type": "cover"}, {"type": "goals", "title": "Today's goals", "items": ["I can listen for people's opinions (Listening Part 2).", "I can compare pictures and explain my choice (Speaking Parts 3 and 4)."], "icon": "🎯"}, {"type": "goals", "title": "Today's goals", "items": ["I can choose sentences with a similar meaning (Reading Part 3).", "I can make a fun story with Unit 2 words."], "icon": "🎯"}, {"type": "riddle", "title": "Which sport am I?", "items": [{"clues": ["You need a horse.", "Hamzah loves it."], "a": "horse riding", "emo": "🏇"}, {"clues": ["You need a bike.", "You go up and down hills."], "a": "mountain biking", "emo": "🚵"}, {"clues": ["You need a board.", "You go down sand dunes."], "a": "sandboarding", "emo": "🏜️"}, {"clues": ["You need a small car.", "You drive round a track."], "a": "go-karting", "emo": "🛞"}], "icon": "🔎"}, {"type": "explain", "title": "Exam tips", "icon": "🧠", "lines": ["Listening Part 2: listen to the conversations. Try to understand and think about the [[opinions]] of speakers."], "rule": "Think! → Try! → Do!"}, {"type": "flip", "title": "Exam tips 💡 – examples", "cards": [{"front": "Listening Part 1: all the pictures are from the [[same lexical set]].", "icon": "💡", "back": "listen for the best option for each person"}, {"front": "Speaking: don't just say 'Water skiing is the most exciting.' [[Explain]] your answer.", "icon": "✨", "back": "… because you get to jump over waves."}, {"front": "Reading Part 3: look at the questions one by one and [[compare]] each option with the text.", "icon": "🔎", "back": "📖↔️❓"}]}, {"type": "ask", "title": "Listen and choose", "qs": [{"q": "1 A brother tells his sister about his school trip. What does he say about horse riding? A He's always wanted to try it. B He went really fast and it was great fun. C He was really scared, but he was brave.", "a": "Listen to 2.22 and choose."}, {"q": "2 Two boys talk about an adventure holiday. Which activity would they both like to do on the second day? A go-karting B mountain biking C sandboarding", "a": "Listen and choose."}, {"q": "3 What does the sister think about extreme sports? A Sandboarding is the most dangerous. B You can hurt yourself doing any sport. C Extreme sports are dangerous.", "a": "Listen and choose."}, {"q": "4 What was mum's favourite holiday? A the camping trip B by the sea C in the mountains", "a": "Listen and choose."}], "img": "L26_c1", "icon": "🎧"}, {"type": "ask", "title": "A camping trip: which is the most exciting?", "qs": [{"q": "Look at the pictures. What activities can the students do on the camping trip?", "a": "Name the activities in the pictures: climbing, cycling, camping, horse riding, water sports …"}, {"q": "Which would be the most exciting? Why?", "a": "I think that water skiing is more exciting than mountain biking because you get to jump over waves."}, {"q": "Which would be the most dangerous?", "a": "I think abseiling is more dangerous than horse riding because you can fall."}, {"q": "Which would you choose? Do you agree with your partner?", "a": "I'd rather go … What do you think? – I agree. / I'm not sure …"}], "img": "L26_c2", "icon": "🗣️"}, {"type": "wheel", "title": "Let's talk about camping", "items": [{"q": "Have you ever been camping?", "a": "Yes, I have. I went camping in Wahiba Sands."}, {"q": "Did you enjoy it? Why? / Why not?", "a": "Yes, I did, because we watched the stars."}, {"q": "What do you need to take when you go camping?", "a": "a tent, water, food, a torch and a compass."}, {"q": "What are the advantages of camping compared to staying in a hotel?", "a": "It's cheaper and more exciting, and you're close to nature."}, {"q": "… and the disadvantages?", "a": "It can be cold or hot, and it's less comfortable."}], "icon": "⛺"}, {"type": "ask", "title": "Listen and choose the picture", "qs": [{"q": "Try! Which sport has Osama already tried? (2.23)", "a": "Listen and choose A, B or C. Then explain your answer."}, {"q": "1 What will Haitham do this summer? 2 Which new sport does Azza want to try this year? 3 Which sport does Zakeya do every weekend?", "a": "Listen to 2.24 and choose."}, {"q": "4 Which sport will Reem choose? 5 What will Rashid try this summer? 6 What was Ibrahim doing when he hurt himself?", "a": "Listen and choose."}], "img": "L26_c4", "icon": "🎧"}, {"type": "quiz", "title": "Similar meaning", "qs": [{"q": "I don't enjoy myself when I'm alone.", "o": ["I like spending time by myself.", "Being alone can be quite enjoyable.", "I prefer doing things with other people.", "People should leave me alone."], "a": 2, "why": "don't enjoy … alone = prefer other people"}, {"q": "We rested when the sun had set.", "o": ["The sun set and then we rested.", "We were resting when the sun set.", "After resting, we watched the sun set.", "The sun hadn't set when we rested."], "a": 0, "why": "had set = first; rested = second"}], "icon": "✅"}, {"type": "read", "title": "Majid talks about his love of horse riding", "paras": ["I grew up on a small farm where I spent a lot of time around animals, but there's always been a special place in my heart for horses. They're amazing animals with their own [[personalities]], just like people! I love spending time around them, and that's why I became a [[professional]] rider when I finished school."], "img": "L26_c5", "icon": "🐎"}, {"type": "read", "title": "Majid talks about his love of horse riding", "paras": ["I entered my first horse riding competition at the age of fifteen, but I started riding a long time before that, when I was only five. Over the next fifteen years, I won lots of awards in Oman and other countries. My favourite horse is called Apollo, but he's too old for competitions now. That's OK, because I stopped competing last year."], "img": "L26_c5", "icon": "🐎"}, {"type": "read", "title": "Majid talks about his love of horse riding", "paras": ["Now I give lessons to young people on my parents' farm. One day, I'd like to buy my own farm and start a horse riding [[academy]]. It won't be easy, but I've always enjoyed a [[challenge]]!"], "img": "L26_c5", "icon": "🐎"}, {"type": "quiz", "title": "Choose A, B, C or D", "qs": [{"q": "1 Majid thinks …", "o": ["small farms are amazing.", "horses have special hearts.", "all people should like horses.", "all horses behave differently."], "a": 3, "why": "They're amazing animals with their own personalities, just like people!"}, {"q": "2 Majid says he …", "o": ["won fifteen awards for horse riding.", "started horse riding when he was young.", "always competed in Oman.", "stopped horse riding at the age of fifteen."], "a": 1, "why": "I started riding … when I was only five."}, {"q": "3 Majid would like to …", "o": ["teach his parents to horse ride.", "compete with Apollo again.", "teach horse riding on his own farm.", "improve his horse riding."], "a": 2, "why": "One day, I'd like to buy my own farm and start a horse riding academy."}, {"q": "4 Which sentence is correct?", "o": ["The professional horse rider Majid started his career at quite an early age.", "For Majid, there is nothing more exciting than watching a horse riding competition.", "In this article, Majid explains how his family raised horses and started an academy.", "After growing up in the countryside, Majid moved to the city."], "a": 0, "why": "He started riding at five and competed at fifteen."}], "img": "L26_c5", "icon": "✅"}, {"type": "ask", "title": "Make a story!", "qs": [{"q": "Last week, I went … rock climbing or sandboarding?", "a": "Last week, I went rock climbing. I hadn't climbed very high before I fell and hurt myself."}, {"q": "Who helped you? Why do you like him / her?", "a": "My friend Ahmed helped me because he is kind."}, {"q": "Then where did you go: a valley or a wood? Diving or abseiling?", "a": "After he had helped me, we went for a walk in a valley."}, {"q": "How does the story end?", "a": "We really enjoyed ourselves! My favourite part of the day was …"}], "img": "L26_c3", "icon": "🎲"}, {"type": "ask", "title": "Speaking: compare the pictures", "qs": [{"q": "Compare: water skiing / mountain biking", "a": "I think that water skiing is more exciting than mountain biking because you get to jump over waves."}, {"q": "Compare: camping in a tent / horse riding", "a": "I think horse riding is more fun than camping because …"}, {"q": "Which is the most dangerous? Why?", "a": "I think … is the most dangerous because you can hurt yourself."}, {"q": "Which would you choose? Ask your partner.", "a": "What do you think? / Do you agree?"}], "img": "L26_c2", "icon": "🗣️"}, {"type": "tf", "title": "Majid: True or False?", "items": [{"text": "Majid grew up on a small farm.", "a": true, "fix": "I grew up on a small farm."}, {"text": "Majid entered his first competition at the age of five.", "a": false, "fix": "at the age of fifteen"}, {"text": "Apollo is too old for competitions now.", "a": true, "fix": "he's too old for competitions now"}], "icon": "✔✘"}, {"type": "tf", "title": "Majid: True or False?", "items": [{"text": "Majid still competes every year.", "a": false, "fix": "I stopped competing last year."}, {"text": "Majid gives lessons on his parents' farm.", "a": true, "fix": "Now I give lessons to young people on my parents' farm."}], "icon": "✔✘"}, {"type": "race", "title": "Exam skills race", "qs": [{"q": "In Speaking, after giving your opinion you should …", "options": ["explain your answer", "stop talking", "say only one word"], "a": 0}, {"q": "Majid started riding when he was …", "options": ["five", "fifteen", "twenty"], "a": 0}, {"q": "Majid's favourite horse is …", "options": ["Apollo", "Zeus", "Rocky"], "a": 0}, {"q": "Water skiing is ___ than mountain biking.", "options": ["more exciting", "most exciting", "excitinger"], "a": 0}, {"q": "We rested when the sun had set = ", "options": ["The sun set and then we rested.", "We rested and then the sun set.", "The sun didn't set."], "a": 0}], "icon": "🏁"}, {"type": "steps", "title": "Let's remember!", "icon": "🧠", "steps": ["Listening: think about the speakers' opinions.", "Speaking: compare the pictures and explain: … is more exciting than … because …", "Reading: compare each option with the text, one by one.", "Have fun telling stories with Unit 2 words! 🎲"]}, {"type": "exit", "title": "Exit ticket", "items": [{"k": "3", "text": "Compare two sports: ___ is more exciting than ___ because …"}, {"k": "2", "text": "What does Majid want to do one day?"}, {"k": "1", "text": "Write one thing you need to take when you go camping."}], "icon": "🎟️"}, {"type": "homework", "title": "Homework", "head": "My homework", "items": ["Activity Book pp. 40–41: Get ready for… activities.", "Write answers to the four camping questions (CB p. 57, Activity 3).", "Write your Fun corner story in your notebook."], "icon": "🏠"}]}, {"id": "L27", "unit": "U3", "unitName": "Unit 2: Adventure sports", "title": "Graded reader 1: A Sandboarding Adventure", "code": "", "theme": "library", "emo": "🏜️", "slides": [{"type": "cover", "say": "Unit 2 · Graded reader 1"}, {"type": "goals", "title": "Today's goals", "items": ["I can predict what a story is about from its title and pictures.", "I can read and enjoy a graded reader."], "icon": "🎯"}, {"type": "goals", "title": "Today's goals", "items": ["I can put the story pictures in order and retell it.", "I can talk about sandboarding and the Sharqiyah Sands."], "icon": "🎯"}, {"type": "memory", "title": "Story words memory", "pairs": [["sand dunes", "🏜️"], ["knee pads", "🦵"], ["helmet", "⛑️"], ["goggles", "🥽"], ["bracelet", "📿"], ["instructor", "👨‍🏫"]], "icon": "🧠"}, {"type": "ask", "title": "Look and predict", "qs": [{"q": "What do you think the 'sandboarding adventure' could be?", "a": "Personal answers – e.g. someone falls, gets lost or finds something."}, {"q": "What words do you expect to see in the story?", "a": "sand, desert, dunes, board, helmet …"}, {"q": "Look at the picture on page 60. What do you think Aliyah is pointing at?", "a": "Something in the sand."}, {"q": "How do you think the story ends?", "a": "Write your ideas on the board and check after reading."}], "img": "L27_c4", "icon": "🔮"}, {"type": "read", "title": "A Sandboarding Adventure (1)", "paras": ["Laith and Aliyah are brother and sister. Last week, they had a sandboarding lesson in the Sharqiyah Sands in the east of Oman. Laith had wanted to go sandboarding for a long time, so he was very excited.", "'You don't need to worry, Aliyah. I'll [[look after]] you,' he said.", "'I can look after myself!' Aliyah said happily."], "img": "L27_c1", "icon": "📖"}, {"type": "read", "title": "A Sandboarding Adventure (2)", "paras": ["The scenery at the Sharqiyah Sands was beautiful. Laith and Aliyah's mum had packed [[goggles]], [[knee pads]] and helmets, so the children put them on.", "'Look after yourselves!' Mum told the children.", "'Don't worry, Mum!' they said. 'Sandboarding is easier than surfboarding and water skiing!'"], "img": "L27_c2", "icon": "📖"}, {"type": "read", "title": "A Sandboarding Adventure (2)", "paras": ["Then they went with their [[instructor]]. The children went down some [[sand dunes]], and they had lots of fun."], "img": "L27_c2", "icon": "📖"}, {"type": "read", "title": "A Sandboarding Adventure (3)", "paras": ["The instructor was in front of the children when Aliyah saw something and stopped.", "'Are you OK?' Laith asked her. 'Did you hurt yourself?'", "Aliyah looked at him and said, 'No, I'm fine, but look at that!' Aliyah pointed at something in the sand."], "img": "L27_c4", "icon": "📖"}, {"type": "read", "title": "A Sandboarding Adventure (3)", "paras": ["'It's [[jewellery]]!' she said, and picked it up. 'It looks very old. People have lived in this desert for thousands of years, Laith. It might be [[ancient]] [[treasure]]!'"], "img": "L27_c4", "icon": "📖"}, {"type": "read", "title": "A Sandboarding Adventure (4)", "paras": ["Just then, the instructor came back to the children. Aliyah showed him the jewellery.", "'Oh, that's Bushra's [[bracelet]]!' the instructor said happily. 'I taught a lesson before I met you this morning. We saw the sunrise, but one girl dropped her bracelet and couldn't find it. She'll be very pleased. Well done, Aliyah!'"], "img": "L27_c5", "icon": "📖"}, {"type": "read", "title": "A Sandboarding Adventure (4)", "paras": ["'That's great!' Aliyah said. 'The bracelet might not be ancient, but it's still treasure for Bushra!'"], "img": "L27_c5", "icon": "📖"}, {"type": "match", "title": "Find the words", "pairs": [["sand dunes", "hills of sand in the desert 🏜️"], ["knee pads", "they protect your knees 🦵"], ["an instructor", "a person who teaches a sport 👨‍🏫"]], "icon": "🧩"}, {"type": "quiz", "title": "Complete the sentences", "icon": "✏️", "qs": [{"q": "Laith and Aliyah had a ___ lesson at Sharqiyah Sands.", "o": ["sandboarding", "surfboarding"], "a": 0}, {"q": "Aliyah found some ___ and thought it was ancient treasure.", "o": ["jewellery", "goggles"], "a": 0}, {"q": "In the end, it wasn't ancient treasure. It was Bushra's ___.", "o": ["bracelet", "helmet"], "a": 0}]}, {"type": "tf", "title": "True or False?", "items": [{"text": "The Sharqiyah Sands are in the east of Oman.", "a": true, "fix": "in the east of Oman"}, {"text": "Aliyah wanted Laith to look after her.", "a": false, "fix": "'I can look after myself!'"}, {"text": "The children say sandboarding is easier than surfboarding.", "a": true, "fix": "Sandboarding is easier than surfboarding and water skiing!"}], "icon": "✔✘"}, {"type": "tf", "title": "True or False?", "items": [{"text": "Aliyah hurt herself.", "a": false, "fix": "No, I'm fine."}, {"text": "Bushra dropped her bracelet at sunset.", "a": false, "fix": "They saw the sunrise – it was in the morning."}], "icon": "✔✘"}, {"type": "order", "title": "Put the story in order", "items": ["Laith tells Aliyah he'll look after her.", "Mum gives the children helmets and knee pads.", "The children go down the sand dunes with their instructor.", "Aliyah finds some jewellery in the sand.", "The instructor says it's Bushra's bracelet."], "icon": "🔢"}, {"type": "wheel", "title": "Over to you!", "items": [{"q": "Would you like to go sandboarding? Why or why not?", "a": "Yes, I would, because it looks exciting!"}, {"q": "What other extreme sports would you like to do?", "a": "I'd like to try paragliding and diving."}, {"q": "What do you know about the Sharqiyah Sands?", "a": "They are big sand dunes in the east of Oman. People camp and ride camels there."}, {"q": "What would you do if you found jewellery in the sand?", "a": "I'd give it to an adult / the instructor to find the owner."}, {"q": "Retell the story in three sentences.", "a": "Laith and Aliyah went sandboarding. Aliyah found a bracelet. It was Bushra's!"}], "icon": "🎡"}, {"type": "quiz", "title": "Quick quiz", "qs": [{"q": "Who had wanted to go sandboarding for a long time?", "o": ["Laith", "Aliyah", "Mum"], "a": 0}, {"q": "What did Mum tell the children?", "o": ["Go home!", "Look after yourselves!", "Don't go!"], "a": 1}, {"q": "What did Aliyah find?", "o": ["a helmet", "jewellery", "a phone"], "a": 1}, {"q": "When did Bushra lose her bracelet?", "o": ["in the morning, at sunrise", "last year", "at night"], "a": 0}], "img": "L27_c3", "icon": "✅"}, {"type": "balloons", "title": "Pop the right answer!", "rounds": [{"q": "Where did they go sandboarding?", "o": ["Sharqiyah Sands", "Salalah", "Muscat"], "a": 0}, {"q": "Who packed goggles and knee pads?", "o": ["Mum", "Laith", "the instructor"], "a": 0}, {"q": "Aliyah thought the jewellery was …", "o": ["ancient treasure", "her bracelet", "a toy"], "a": 0}, {"q": "Whose bracelet was it?", "o": ["Bushra's", "Mum's", "Aliyah's"], "a": 0}, {"q": "'I can look after ___!' said Aliyah.", "o": ["myself", "herself", "yourself"], "a": 0}], "icon": "🎈"}, {"type": "steps", "title": "Let's remember!", "icon": "🧠", "steps": ["Laith and Aliyah had a sandboarding lesson in the Sharqiyah Sands.", "Aliyah found some old-looking jewellery in the sand.", "It was Bushra's bracelet – treasure for Bushra! 💍", "Always wear a helmet, goggles and knee pads. ⛑️"]}, {"type": "exit", "title": "Exit ticket", "items": [{"k": "3", "text": "Who are Laith and Aliyah?"}, {"k": "2", "text": "What did Aliyah find?"}, {"k": "1", "text": "Write one thing you need for sandboarding."}], "icon": "🎟️"}, {"type": "homework", "title": "Homework", "head": "My homework", "items": ["Read the story (CB pp. 58–61) to someone at home.", "Answer the Over to you! questions (CB p. 108) in your notebook.", "Find out about the people who live in the Sharqiyah Sands."], "icon": "🏠"}]}, {"id": "L28", "unit": "U3", "unitName": "Unit 2: Adventure sports", "title": "Graded reader 2: A Rock Climbing Adventure", "code": "", "theme": "library", "emo": "🦅", "slides": [{"type": "cover", "say": "Unit 2 · Graded reader 2"}, {"type": "goals", "title": "Today's goals", "items": ["I can predict the story from the title and a picture.", "I can read and understand a graded reader."], "icon": "🎯"}, {"type": "goals", "title": "Today's goals", "items": ["I can retell the story in order.", "I can say if the characters did the right thing."], "icon": "🎯"}, {"type": "build", "title": "Story words", "mode": "letters", "items": [{"a": "falcon", "hint": "a fast bird that hunts", "emo": "🦅"}, {"a": "nest", "hint": "a bird's home", "emo": "🪺"}, {"a": "cliff", "hint": "a high, steep rock", "emo": "⛰️"}, {"a": "equipment", "hint": "things you need for a sport", "emo": "🪢"}, {"a": "abseil", "hint": "go down a cliff on a rope", "emo": "🧗"}], "icon": "🔤"}, {"type": "ask", "title": "Look and predict", "qs": [{"q": "What do you think the 'rock climbing adventure' could be?", "a": "Personal answers."}, {"q": "What words do you expect to see in the story?", "a": "cliff, rope, helmet, climb, rocks …"}, {"q": "Look at the picture on page 63. What do Adil and Sultan find on the cliff?", "a": "A baby falcon."}, {"q": "What do you think the boys will do?", "a": "Write the ideas on the board and check after reading."}], "img": "L28_c2", "icon": "🔮"}, {"type": "read", "title": "A Rock Climbing Adventure (1)", "paras": ["Last Tuesday was an exciting day for Adil and Sultan. Their dad took them rock climbing in the north of Oman. They had to get up very early. They had seen the sunrise before they got to the [[cliffs]]!", "At the cliffs, the boys were excited to see people mountain biking, abseiling and caving."], "img": "L28_c1", "icon": "📖"}, {"type": "read", "title": "A Rock Climbing Adventure (1)", "paras": ["'You must look after yourselves,' their dad said. 'You need lots of [[equipment]] to rock climb safely.'"], "img": "L28_c1", "icon": "📖"}, {"type": "read", "title": "A Rock Climbing Adventure (2)", "paras": ["The boys had taken some rock climbing classes, so they knew what to do. Their dad waited for them at the bottom of the cliff. Adil and Sultan climbed up the cliff, but then Sultan saw something.", "'What's that?' he asked.", "'It's a baby [[falcon]]!' Adil said. The baby falcon had fallen out of its [[nest]]."], "img": "L28_c2", "icon": "📖"}, {"type": "read", "title": "A Rock Climbing Adventure (2)", "paras": ["'Look!' said Adil. 'We should put the baby falcon back in its nest.'"], "img": "L28_c2", "icon": "📖"}, {"type": "read", "title": "A Rock Climbing Adventure (3)", "paras": ["Adil carefully picked up the falcon and started to climb up the cliff. Sultan looked down a valley to the east and saw beautiful scenery.", "'Be careful,' Sultan said to Adil. 'Don't hurt yourself!'", "When Adil got to the nest, he saw the mother falcon. She was [[flapping]] her wings, and making noises."], "img": "L28_c3", "icon": "📖"}, {"type": "read", "title": "A Rock Climbing Adventure (3)", "paras": ["'She's looking for her baby,' Adil thought."], "img": "L28_c3", "icon": "📖"}, {"type": "read", "title": "A Rock Climbing Adventure (4)", "paras": ["Adil was tired, but he didn't stop. He [[stretched out]] his arms and carefully put the baby falcon back in its nest. Then the mother stopped making noises and flew to the baby.", "Adil abseiled back down to Sultan. Then they both abseiled down to their dad at the bottom of the cliff."], "img": "L28_c5", "icon": "📖"}, {"type": "read", "title": "A Rock Climbing Adventure (4)", "paras": ["'I watched everything!' their dad said happily. 'You should feel proud of yourself, Adil!'"], "img": "L28_c5", "icon": "📖"}, {"type": "match", "title": "Find the words", "pairs": [["equipment", "ropes, helmets and harnesses 🪢"], ["a falcon", "a fast bird that hunts 🦅"], ["a nest", "a bird's home 🪺"]], "icon": "🧩"}, {"type": "quiz", "title": "Complete the sentences", "icon": "✏️", "qs": [{"q": "Adil and Sultan find a ___ falcon that has fallen out of its nest.", "o": ["baby", "mother"], "a": 0}, {"q": "Adil sees the mother falcon, and she's ___ for her baby.", "o": ["looking", "waiting"], "a": 0}, {"q": "Adil climbs up the ___ and puts the baby falcon back in its nest.", "o": ["cliff", "valley"], "a": 0}]}, {"type": "tf", "title": "True or False?", "items": [{"text": "They went rock climbing in the south of Oman.", "a": false, "fix": "in the north of Oman"}, {"text": "The boys had taken some rock climbing classes.", "a": true, "fix": "so they knew what to do"}, {"text": "Sultan saw the baby falcon first.", "a": true, "fix": "Sultan saw something. 'What's that?'"}], "icon": "✔✘"}, {"type": "tf", "title": "True or False?", "items": [{"text": "Dad climbed up with the boys.", "a": false, "fix": "He waited at the bottom of the cliff."}, {"text": "Adil stopped because he was tired.", "a": false, "fix": "Adil was tired, but he didn't stop."}], "icon": "✔✘"}, {"type": "order", "title": "Put the story in order", "items": ["Dad takes the boys rock climbing very early.", "Sultan sees a baby falcon on the cliff.", "Adil climbs up with the baby falcon.", "Adil sees the mother falcon at the nest.", "Adil puts the baby back and abseils down.", "Dad says Adil should feel proud of himself."], "icon": "🔢"}, {"type": "wheel", "title": "Over to you!", "items": [{"q": "Have you ever been rock climbing? If not, would you like to?", "a": "No, I haven't, but I'd love to try it!"}, {"q": "What extreme sports can people do near where you live?", "a": "People can go diving / caving / sandboarding near …"}, {"q": "Do you think Adil and Sultan did the right thing? Why or why not?", "a": "Yes, they did, because they helped the baby falcon. But it was a bit dangerous."}, {"q": "What would you do?", "a": "I would ask Dad / an expert to help."}, {"q": "Why are falcons special in Oman?", "a": "Falconry is a traditional sport in Oman and the Gulf."}], "icon": "🎡"}, {"type": "quiz", "title": "Quick quiz", "qs": [{"q": "Where did Dad wait?", "o": ["at home", "at the bottom of the cliff", "at the top"], "a": 1}, {"q": "What did the boys see at the cliffs?", "o": ["people swimming", "people mountain biking, abseiling and caving", "camels"], "a": 1}, {"q": "What was the mother falcon doing?", "o": ["eating", "flapping her wings and making noises", "sleeping"], "a": 1}, {"q": "How did the boys get down?", "o": ["They walked.", "They jumped.", "They abseiled."], "a": 2}], "img": "L28_c4", "icon": "✅"}, {"type": "race", "title": "Falcon race", "qs": [{"q": "When did they go rock climbing?", "options": ["yesterday", "last Tuesday", "last Friday"], "a": 1}, {"q": "What had fallen out of its nest?", "options": ["a helmet", "a baby falcon", "an egg"], "a": 1}, {"q": "Who put the falcon back?", "options": ["Adil", "Dad", "Sultan"], "a": 0}, {"q": "Sultan looked down a valley to the …", "options": ["east", "north", "west"], "a": 0}, {"q": "'You should feel proud of ___, Adil!'", "options": ["yourself", "himself", "myself"], "a": 0}], "icon": "🏁"}, {"type": "steps", "title": "Let's remember!", "icon": "🧠", "steps": ["Adil and Sultan went rock climbing with their dad in the north of Oman.", "A baby falcon had fallen out of its nest.", "Adil carefully put it back and abseiled down. 🦅", "Be kind to animals – and stay safe!"]}, {"type": "exit", "title": "Exit ticket", "items": [{"k": "3", "text": "What did the boys find on the cliff?"}, {"k": "2", "text": "How did the mother falcon feel at first?"}, {"k": "1", "text": "Did Adil do the right thing? Why?"}], "icon": "🎟️"}, {"type": "homework", "title": "Homework", "head": "My homework", "items": ["Read the story (CB pp. 62–65) aloud at home.", "Answer the Over to you! questions (CB p. 109).", "Draw your favourite part of the story and write two sentences about it."], "icon": "🏠"}]}, {"id": "L29", "unit": "U4", "unitName": "Unit 3: Spend or save?", "title": "Vocabulary: Shopping", "code": "", "theme": "park", "emo": "🛍️", "slides": [{"type": "cover", "say": "Unit 3 · Lesson 1 – Vocabulary: shopping"}, {"type": "goals", "title": "Today's goals", "items": ["I can name 12 shopping words: receipt, queue, till, refund …", "I can read a blog about shopping."], "icon": "🎯"}, {"type": "goals", "title": "Today's goals", "items": ["I can use shopping verbs: buy, sell, spend, save.", "I can talk about how I shop."], "icon": "🎯"}, {"type": "enter", "title": "Catch the words you can find in a shop.", "gate": "✓", "items": [{"text": "tide", "in": false}, {"text": "customer", "in": true}, {"text": "valley", "in": false}, {"text": "queue", "in": true}, {"text": "helmet", "in": false}, {"text": "till", "in": true}]}, {"type": "ask", "title": "The WOW! question", "qs": [{"q": "What can you see on the Welcome page?", "a": "shops, a market, people shopping online, a queue, pens, a bank card …"}, {"q": "Manar asks: Why is money important?", "a": "We need money to buy food, clothes and a house, to travel, to help people and to save for the future."}, {"q": "Do you prefer to spend money or to save money?", "a": "Personal answers."}], "img": "L29_c1", "icon": "❓"}, {"type": "flip", "title": "Shopping words (1)", "cards": [{"front": "shop assistant", "icon": "🧑‍💼", "back": "a person who works in a shop\n«The shop assistant helped me.»"}, {"front": "bank card", "icon": "💳", "back": "a plastic card to pay with money from the bank\n«I paid with my dad's bank card.»"}, {"front": "till", "icon": "🖥️", "back": "the machine that adds up prices in shops\n«Pay at the till, please.»"}, {"front": "customer", "icon": "🛒", "back": "a person who buys something in a shop\n«There are lots of customers today.»"}, {"front": "online shopping", "icon": "💻", "back": "buying things on the internet\n«My parents do online shopping.»"}, {"front": "on sale", "icon": "🏷️", "back": "at a special, lower price\n«These shoes are on sale – 70% off!»"}], "icon": "🔤"}, {"type": "flip", "title": "Shopping words (2)", "cards": [{"front": "receipt", "icon": "🧾", "back": "a piece of paper you get when you buy something\n«Keep your receipt!»"}, {"front": "second-hand", "icon": "♻️", "back": "already used by another person\n«My dad bought a second-hand car.»"}, {"front": "queue", "icon": "🚶‍♂️🚶‍♀️", "back": "a line of people waiting\n«There was a long queue at the till.»"}, {"front": "pay with contactless", "icon": "📶", "back": "pay by touching your card on the machine\n«You can pay with contactless.»"}, {"front": "get a refund", "icon": "💵↩️", "back": "get your money back\n«I got a refund for the broken toy.»"}, {"front": "exchange (v)", "icon": "🔄", "back": "give something back and take a different one\n«Can I exchange these shoes?»"}], "icon": "🔤"}, {"type": "mystery", "title": "Look and match!", "img": "L29_c2", "answer": "12 shopping words! 🛍️", "qs": [{"q": "Picture 2: a gold plastic card.", "o": ["receipt", "bank card"], "a": 1}, {"q": "Picture 3: the machine that adds up prices.", "o": ["queue", "till"], "a": 1}, {"q": "Picture 6: SALE 70%", "o": ["second-hand", "on sale"], "a": 1}, {"q": "Picture 7: a long piece of paper with prices.", "o": ["customer", "receipt"], "a": 1}], "icon": "🕵️"}, {"type": "read", "title": "The WOW! Blog", "paras": ["Manar: I like shopping for a tablet or a laptop in second-hand shops. If you look carefully, you can find really brilliant things for a good price. So, I'm helping my [[wallet]] and the environment!"], "img": "L29_c3", "icon": "📖"}, {"type": "read", "title": "The WOW! Blog", "paras": ["Ali: Some things are grown or made in other countries and travel a long way to us. That's not good for the environment. We must go to shops that sell things grown or made in our country. If we only buy from these shops, we'll help the environment and we'll help the people who make the things we buy."], "img": "L29_c3", "icon": "📖"}, {"type": "read", "title": "The WOW! Blog", "paras": ["Rosie: I don't really like shopping. Why would I stand in a queue of customers at a till when my parents can buy everything we need online? I prefer to be outside enjoying myself!"], "img": "L29_c3", "icon": "📖"}, {"type": "read", "title": "The WOW! Blog", "paras": ["Eric: I love shopping! My favourite shop is Sports Superstar. You can pay with contactless, so you don't need your wallet. I'm not very good at [[saving]] money … I'm much better at [[spending]] it!"], "img": "L29_c3", "icon": "📖"}, {"type": "quiz", "title": "Who said it?", "qs": [{"q": "Who buys second-hand tablets and laptops?", "o": ["Rosie", "Eric", "Manar"], "a": 2}, {"q": "Who thinks we should buy ]] things from shops.", "icon": "✨", "back": "🧑 ⬅️ 🏪"}, {"front": "You can [[save]] money for later.", "icon": "🔎", "back": "🐷💰"}, {"front": "You can [[spend]] money in shops.", "icon": "📌", "back": "💸🛍️"}]}, {"type": "quiz", "title": "buy, sell, spend or save?", "icon": "✏️", "qs": [{"q": "I don't usually ___ a lot of money on clothes.", "o": ["spend", "sell"], "a": 0}, {"q": "My rucksack is quite old. I need to ___ a new one.", "o": ["buy", "save"], "a": 0}, {"q": "They ___ some really nice clothes in that shop.", "o": ["sell", "spend"], "a": 0}, {"q": "I don't have enough money for a comic. I need to ___ some money.", "o": ["save", "sell"], "a": 0}]}, {"type": "quiz", "title": "buy, sell, spend or save?", "icon": "✏️", "qs": [{"q": "We don't have any milk, so we need to ___ some later.", "o": ["buy", "spend"], "a": 0}, {"q": "How much money do you ___ on sweets each week?", "o": ["spend", "buy"], "a": 0}, {"q": "My parents are trying to ___ money so we can all go on holiday this year.", "o": ["save", "sell"], "a": 0}]}, {"type": "wheel", "title": "Spin and talk!", "items": [{"q": "Do you like shopping for electronic devices in second-hand shops? Why? / Why not?", "a": "Yes, I do, because they're cheaper."}, {"q": "Do you ever pay with contactless? Why? / Why not?", "a": "I never pay with contactless. It's too easy to spend lots of money!"}, {"q": "Are you better at saving or spending money?", "a": "I'm better at saving money."}, {"q": "Have you or someone in your family ever had to ask for a refund or exchange something? What was it?", "a": "My mum exchanged a dress because it was too small."}, {"q": "Where do you like shopping in Oman?", "a": "I like shopping at Muttrah Souq / the shopping centre."}], "icon": "🎡"}, {"type": "memory", "title": "Memory: word + picture", "pairs": [["receipt", "🧾"], ["bank card", "💳"], ["queue", "🚶‍♂️🚶‍♀️🚶"], ["on sale", "🏷️"], ["online shopping", "💻"], ["exchange", "🔄"]], "icon": "🧠"}, {"type": "race", "title": "Shopping race", "qs": [{"q": "A line of people waiting:", "options": ["queue", "till", "receipt"], "a": 0}, {"q": "Get your money back:", "options": ["get a refund", "exchange", "save"], "a": 0}, {"q": "Already used by another person:", "options": ["on sale", "second-hand", "online"], "a": 1}, {"q": "A person who buys something:", "options": ["shop assistant", "customer", "till"], "a": 1}, {"q": "Shops ___ things to customers.", "options": ["buy", "sell", "spend"], "a": 1}, {"q": "Eric is better at ___ money.", "options": ["saving", "spending", "selling"], "a": 1}], "icon": "🏁"}, {"type": "steps", "title": "Let's remember!", "icon": "🧠", "steps": ["People: shop assistant, customer.", "Things: till, receipt, bank card, queue.", "Ways to shop: online shopping, second-hand, on sale, pay with contactless.", "Problems: get a refund, exchange · Verbs: buy, sell, spend, save."]}, {"type": "exit", "title": "Exit ticket", "items": [{"k": "3", "text": "What do you get when you buy something?"}, {"k": "2", "text": "Write two people you might see in a shop."}, {"k": "1", "text": "Are you better at saving or spending money? Why?"}], "icon": "🎟️"}, {"type": "homework", "title": "Homework", "head": "My homework", "items": ["Activity Book p. 42: Activities 1–4.", "Activity 4: write five or more sentences using buy, sell, spend and save.", "Learn to spell receipt, queue and customer."], "icon": "🏠"}]}, {"id": "L30", "unit": "U4", "unitName": "Unit 3: Spend or save?", "title": "Team Talk 3: Online shopping or shops?", "code": "", "theme": "park", "emo": "🛒", "slides": [{"type": "cover", "say": "Unit 3 · Lesson 2 – WOW! Team Talk 3"}, {"type": "goals", "title": "Today's goals", "items": ["I can understand a dialogue about online shopping and shops.", "I can use: No chance! / I'm only kidding! / That's true.", "I can give my opinion about shopping in the future."], "icon": "🎯"}, {"type": "balloons", "title": "Pop the shopping word!", "rounds": [{"q": "A line of people waiting:", "o": ["queue", "till", "refund"], "a": 0}, {"q": "Buying things on the internet:", "o": ["second-hand", "online shopping", "on sale"], "a": 1}, {"q": "Where you pay in a shop:", "o": ["the till", "the queue", "the receipt"], "a": 0}, {"q": "A person who works in a shop:", "o": ["customer", "shop assistant", "wallet"], "a": 1}], "icon": "🎈"}, {"type": "read", "title": "Team Talk 3 (part 1)", "paras": ["Manar: Hey, Rosie! Do you want to come shopping with me at the weekend?", "Rosie: [[No chance!]] I don't like shopping.", "Manar: I know! [[I'm only kidding!]] I read your blog. But why don't you like shopping?", "Rosie: It's just such a [[waste of time]]. If I need something, I ask my parents to buy it online."], "img": "L30_c2", "icon": "📖"}, {"type": "read", "title": "Team Talk 3 (part 1)", "paras": ["Manar: But what about clothes and shoes? Buying trainers online, for example, what do you do if they aren't big enough?", "Rosie: You can still [[try things on]] when you do online shopping. If something isn't big enough, you can send it back."], "img": "L30_c2", "icon": "📖"}, {"type": "read", "title": "Team Talk 3 (part 1)", "paras": ["Manar: Hmm, I suppose so. But I still prefer shops. I really love walking around bookshops and clothes stores. You don't get that online."], "img": "L30_c2", "icon": "📖"}, {"type": "read", "title": "Team Talk 3 (part 2)", "paras": ["Rosie: You also don't get long queues for the tills!", "Manar: Ha ha! But if we all buy everything online, shops will close.", "Rosie: [[That's true.]] Maybe we won't need shops at all in the future.", "Manar: If that happens, I won't be happy. Also, what will the shop assistants do if there aren't any shops?"], "img": "L30_c2", "icon": "📖"}, {"type": "read", "title": "Team Talk 3 (part 2)", "paras": ["Rosie: Yes, I hadn't thought of that. Maybe we should keep some shops then. [[As long as]] I don't have to go to them!"], "img": "L30_c2", "icon": "📖"}, {"type": "ask", "title": "Read again and answer", "qs": [{"q": "What does Manar invite Rosie to do at the weekend?", "a": "To come shopping with her."}, {"q": "Why doesn't Rosie like shopping?", "a": "It's such a waste of time."}, {"q": "What does Rosie do if something she buys online doesn't fit her?", "a": "She sends it back."}], "img": "L30_c1", "icon": "💭"}, {"type": "ask", "title": "Read again and answer", "qs": [{"q": "Which shops does Manar really like?", "a": "Bookshops and clothes stores."}, {"q": "What does Rosie not like about shops?", "a": "The long queues for the tills."}, {"q": "Who thinks we may not need shops in the future?", "a": "Rosie."}], "icon": "💭"}, {"type": "tf", "title": "True or False?", "items": [{"text": "Rosie says she wants to go shopping.", "a": false, "fix": "She says she doesn't like shopping."}, {"text": "Manar has already seen Rosie's blog.", "a": true, "fix": "I read your blog."}, {"text": "Rosie's parents don't buy things online.", "a": false, "fix": "I ask my parents to buy it online."}], "icon": "✔✘"}, {"type": "tf", "title": "True or False?", "items": [{"text": "Manar says she doesn't like going to shops.", "a": false, "fix": "I still prefer shops."}, {"text": "Rosie says she doesn't have to wait online.", "a": true, "fix": "You also don't get long queues for the tills!"}, {"text": "Manar won't be sad if all the shops close.", "a": false, "fix": "If that happens, I won't be happy."}], "icon": "✔✘"}, {"type": "explain", "title": "Useful expressions", "icon": "🗣️", "lines": ["Use these expressions to react in a friendly conversation."], "rule": "No chance! = no way · I'm only kidding! = joking · That's true. = I agree"}, {"type": "flip", "title": "Useful expressions 💬 – examples", "cards": [{"front": "A: Do you want to come shopping? B: [[No chance!]]", "icon": "💡", "back": "Definitely not! 🙅"}, {"front": "I know! [[I'm only kidding!]]", "icon": "✨", "back": "I'm joking 😄"}, {"front": "A: Shops will close. B: [[That's true.]]", "icon": "🔎", "back": "You're right 👍"}]}, {"type": "match", "title": "Match the reply", "pairs": [["It's usually cheaper to buy things online.", "That's true."], ["Are you going to get some new trainers?", "No chance! I've spent all my pocket money!"], ["I'm going to buy this expensive T-shirt. – Really?", "No. I'm only kidding! I never spend lots of money on clothes."]], "icon": "🧩"}, {"type": "quiz", "title": "Complete the dialogues", "icon": "✏️", "qs": [{"q": "A: Don't buy that bag. You don't need it. B: ___ I have lots of bags.", "o": ["That's true.", "No chance!"], "a": 0}, {"q": "A: Do you want a burger for lunch? B: Of course not! I don't like meat. A: ___ We're having salad.", "o": ["I'm only kidding!", "That's true."], "a": 0}, {"q": "A: Let's go to the cinema this evening. B: ___ I have to study for tomorrow's Maths test.", "o": ["No chance!", "I'm only kidding!"], "a": 0}, {"q": "A: I got 20 rials as a present. B: You should probably save some of it. A: ___ I might need it later.", "o": ["That's true.", "No chance!"], "a": 0}, {"q": "A: Can my friends come over, Mum? B: ___ I've just cleaned the house.", "o": ["No chance!", "That's true."], "a": 0}, {"q": "A: Oh, no! My phone isn't working. B: What? A: Ha ha. ___ Don't worry!", "o": ["I'm only kidding!", "That's true."], "a": 0}]}, {"type": "wheel", "title": "What do you think?", "items": [{"q": "Do you prefer online shopping or going to the shops? Why?", "a": "I prefer going to the shops because I can try things on."}, {"q": "Are there any shops that you really like? Why?", "a": "I really like bookshops because I love reading."}, {"q": "Are there any shops that you don't like? Why?", "a": "I don't like supermarkets because there are long queues."}, {"q": "Do you think we'll need shops in the future? Why? / Why not?", "a": "Yes, I do, because people like to meet and shop together."}, {"q": "What will shop assistants do if there aren't any shops?", "a": "They'll work for online shops / deliver things."}], "icon": "🎡"}, {"type": "order", "title": "Put the dialogue in order", "items": [ m buy locally?", "a": "Listen and choose."}, {"q": "True or false? Huda's banana was grown in Oman. / The supermarket only sells things made in Oman.", "a": "Listen to 3.7 and say why."}, {"q": "True or false? If Huda wants to find out more, she will ask her teacher. / Huda hopes her school uses food grown locally.", "a": "Listen and say why."}, {"q": "True or false? Huda has to do a project next semester. / If Huda does her project about this topic, she will teach other students.", "a": "Listen and say why."}], "img": "L31_c3", "icon": "🍌🎧"}, {"type": "build", "title": "Build the question", "mode": "words", "items": [{"a": "What will you do if it rains this weekend?", "hint": "you / do 🌧️"}, {"a": "Where will you have lunch if you go to the shopping centre?", "hint": "you / have 🍔"}, {"a": "How will you spend it if you get some money?", "hint": "you / spend 💰"}, {"a": "What will you say if someone invites you to a party?", "hint": "you / say 🎉"}], "icon": "🧩"}, {"type": "wheel", "title": "What will you do if …?", "items": [{"q": "If I need to buy something, I usually …", "a": "If I need to buy something, I usually buy it online."}, {"q": "If I go to a shopping centre, I always …", "a": "… I always have an ice cream."}, {"q": "What will you do if you go shopping on Saturday?", "a": "If I go shopping on Saturday, I'll buy a new game."}, {"q": "What will you do if it rains tomorrow?", "a": "If it rains tomorrow, I'll stay at home and read."}, {"q": "What will you do if you lose your wallet?", "a": "If I lose my wallet, I'll tell my parents."}, {"q": "What will you do if you save a lot of money?", "a": "If I save a lot of money, I'll buy a bike."}, {"q": "What will you do if there is a long queue at the till?", "a": "If there's a long queue, I'll wait / come back later."}], "icon": "🎡"}, {"type": "tf", "title": "Correct or not?", "items": [{"text": "If it will rain tomorrow, I'll stay at home.", "a": false, "fix": "No will after if: If it rains tomorrow …"}, {"text": "
