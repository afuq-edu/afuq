<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>مختبر الأحياء التفاعلي – الصف التاسع – كتاب النشاط (الجزء الأول)</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;800;900&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg1:#eef8f4; --bg2:#e9f2fb; --card:#ffffff; --ink:#123b32; --muted:#5b7a72;
  --acc:#0f9d76; --acc2:#14b8a6; --accSoft:#d8f3ea; --gold:#f5b301; --bad:#e2503f; --badSoft:#fde4e0;
  --ok:#22a06b; --okSoft:#dcf5e9; --line:#dbe9e4; --shadow:0 10px 30px rgba(18,59,50,.10);
  --r:22px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;min-height:100%}
body{font-family:'Tajawal',system-ui,sans-serif;color:var(--ink);background:
 radial-gradient(1200px 600px at 100% -10%,#d9f3ea 0%,transparent 60%),
 radial-gradient(900px 500px at -10% 110%,#dbeafe 0%,transparent 60%),
 linear-gradient(160deg,var(--bg1),var(--bg2));background-attachment:fixed;font-size:18px;line-height:1.6;overflow-x:hidden}
h1,h2,h3,h4{font-family:'Cairo','Tajawal',sans-serif;margin:0;line-height:1.35}
button{font-family:inherit;font-size:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:inherit}
.hidden{display:none!important}
.screen{display:none;min-height:100vh;padding:0 0 60px}
.screen.active{display:block;animation:fadeUp .35s ease both}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
@keyframes floatUp{from{transform:translateY(0)}to{transform:translateY(-120vh)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes glow{0%,100%{filter:drop-shadow(0 0 2px rgba(20,184,166,.4))}50%{filter:drop-shadow(0 0 12px rgba(20,184,166,.9))}}
@keyframes dash{to{stroke-dashoffset:0}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes wiggle{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes confetti{0%{transform:translateY(-10vh) rotate(0);opacity:1}100%{transform:translateY(110vh) rotate(720deg);opacity:.2}}
@keyframes bubbleRise{from{transform:translateY(0) scale(1)}to{transform:translateY(-110%) scale(1.05)}}
@keyframes ping{0%{transform:scale(1);opacity:.8}100%{transform:scale(2.2);opacity:0}}

.wrap{max-width:1180px;margin:0 auto;padding:18px 16px}
.topbar{position:sticky;top:0;z-index:20;backdrop-filter:blur(10px);background:rgba(255,255,255,.72);border-bottom:1px solid var(--line)}
.topbar .wrap{display:flex;align-items:center;gap:12px;padding:10px 16px}
.topbar h2{font-size:1.15rem;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{width:44px;height:44px;border-radius:14px;background:var(--card);box-shadow:0 4px 14px rgba(18,59,50,.08);display:grid;place-items:center;font-size:1.25rem;transition:.2s}
.iconbtn:hover{transform:translateY(-2px);box-shadow:0 8px 18px rgba(18,59,50,.14)}
.iconbtn.on{background:var(--acc);color:#fff}

/* HOME */
.hero{display:grid;grid-template-columns:1.3fr 1fr;gap:20px;align-items:center;padding:26px 0 8px}
.hero .title{font-size:2.1rem;font-weight:900;color:var(--ink)}
.hero .sub{color:var(--muted);font-size:1.05rem;margin-top:6px}
.hero .badge{display:inline-flex;align-items:center;gap:8px;background:var(--card);padding:8px 14px;border-radius:999px;box-shadow:var(--shadow);font-weight:700;margin-top:14px;font-size:.95rem}
.ring{width:150px;height:150px;position:relative;margin:auto}
.ring svg{transform:rotate(-90deg)}
.ring .num{position:absolute;inset:0;display:grid;place-items:center;font-family:'Cairo';font-weight:900;font-size:1.6rem}
.ring .num small{display:block;font-size:.7rem;font-weight:700;color:var(--muted);font-family:'Tajawal'}
.units{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;margin-top:18px}
.ucard{background:var(--card);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);cursor:pointer;position:relative;overflow:hidden;transition:.25s;border:2px solid transparent}
.ucard:hover{transform:translateY(-4px);border-color:var(--u)}
.ucard .ico{width:64px;height:64px;border-radius:20px;display:grid;place-items:center;font-size:2rem;background:color-mix(in srgb,var(--u) 16%,white);margin-bottom:10px}
.ucard h3{font-size:1.2rem}
.ucard .en{color:var(--muted);font-size:.9rem;font-family:'Cairo'}
.ucard .meta{display:flex;justify-content:space-between;color:var(--muted);font-size:.9rem;margin-top:8px}
.pbar{height:10px;border-radius:99px;background:#eef3f1;overflow:hidden;margin-top:10px}
.pbar i{display:block;height:100%;background:linear-gradient(90deg,var(--u,var(--acc)),color-mix(in srgb,var(--u,var(--acc)) 60%,#fff));border-radius:99px;transition:width .6s}
.ucard .num{position:absolute;top:14px;left:16px;font-family:'Cairo';font-weight:900;font-size:2.4rem;color:color-mix(in srgb,var(--u) 25%,white)}

/* UNIT */
.uhead{background:linear-gradient(135deg,var(--u),color-mix(in srgb,var(--u) 55%,#0b3b52));color:#fff;border-radius:var(--r);padding:22px;box-shadow:var(--shadow);display:flex;gap:16px;align-items:center;margin-top:8px}
.uhead .ico{font-size:3rem}
.uhead h1{font-size:1.7rem}
.uhead p{margin:4px 0 0;opacity:.9}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}
.tool{background:var(--card);border-radius:16px;padding:10px 16px;box-shadow:var(--shadow);font-weight:700;display:flex;gap:8px;align-items:center;transition:.2s;border:2px solid transparent}
.tool:hover{border-color:var(--u)}
.lessons{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.lcard{background:var(--card);border-radius:18px;padding:14px 16px;box-shadow:var(--shadow);cursor:pointer;display:flex;gap:12px;align-items:center;transition:.2s;border:2px solid transparent}
.lcard:hover{border-color:var(--u);transform:translateY(-3px)}
.lcard .k{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;font-family:'Cairo';font-weight:900;font-size:.85rem;color:#fff;background:var(--u);flex-shrink:0;text-align:center;line-height:1.1}
.lcard .k.ws{background:#f59e0b}
.lcard h3{font-size:1.02rem}
.lcard .stars{color:#d9dee0;font-size:1rem;letter-spacing:2px}
.lcard .stars b{color:var(--gold)}
.lcard .sub{font-size:.85rem;color:var(--muted)}
.sect{font-family:'Cairo';font-weight:800;font-size:1.1rem;margin:18px 0 10px;display:flex;align-items:center;gap:8px}
.sect:before{content:'';width:6px;height:22px;border-radius:4px;background:var(--u,var(--acc))}

/* LESSON */
.stages{display:flex;gap:8px;margin:12px 0;background:var(--card);padding:8px;border-radius:18px;box-shadow:var(--shadow)}
.stage{flex:1;padding:10px 6px;border-radius:12px;text-align:center;font-weight:700;color:var(--muted);transition:.2s;font-size:.95rem;position:relative}
.stage.on{background:var(--u,var(--acc));color:#fff}
.stage .ic{display:block;font-size:1.3rem}
.stage .done{position:absolute;top:4px;left:8px;font-size:.8rem}
.panel{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:20px;min-height:420px;position:relative}
.panel h2{font-size:1.35rem;margin-bottom:8px}
.goal{background:color-mix(in srgb,var(--u,var(--acc)) 10%,white);border-right:5px solid var(--u,var(--acc));padding:10px 14px;border-radius:12px;margin-bottom:14px;color:var(--ink)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--u,var(--acc));color:#fff;padding:12px 22px;border-radius:14px;font-weight:800;font-size:1.02rem;box-shadow:0 6px 16px color-mix(in srgb,var(--u,var(--acc)) 35%,transparent);transition:.2s}
.btn:hover{transform:translateY(-2px)}
.btn.sec{background:#fff;color:var(--ink);border:2px solid var(--line);box-shadow:none}
.btn.gold{background:var(--gold);color:#3b2a00}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.center{text-align:center}
.mt{margin-top:14px}

/* slides */
.slide{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:center;animation:fadeUp .35s}
.slide .vis{background:linear-gradient(160deg,#f7fbfa,#eef6f4);border-radius:18px;padding:12px;min-height:280px;display:grid;place-items:center;border:1px solid var(--line)}
.slide .vis svg{width:100%;height:auto;max-height:380px}
.slide .txt h3{font-size:1.4rem;color:var(--u,var(--acc));margin-bottom:8px}
.slide .txt ul{padding-right:20px;margin:6px 0}
.slide .txt li{margin:6px 0}
.slide .txt li::marker{color:var(--u,var(--acc))}
.kbox{background:#fff8e1;border:1px dashed #f1c40f;border-radius:12px;padding:8px 12px;margin-top:10px;font-size:.98rem}
.q{background:#f1f7ff;border-radius:12px;padding:10px 12px;margin:8px 0;border-right:4px solid #3b82f6}
.ans{background:var(--okSoft);border-radius:12px;padding:10px 12px;margin:6px 0;border-right:4px solid var(--ok);display:none}
.ans.show{display:block;animation:fadeUp .3s}
.reveal{background:#fff;border:2px solid var(--ok);color:var(--ok);padding:6px 14px;border-radius:10px;font-weight:700;margin-top:4px}
.snav{display:flex;align-items:center;justify-content:space-between;margin-top:18px;gap:10px}
.dots{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.dots i{width:10px;height:10px;border-radius:50%;background:#dfe7e4;transition:.2s}
.dots i.on{background:var(--u,var(--acc));transform:scale(1.3)}
.tts{background:#eef6f4;border-radius:10px;padding:2px 8px;font-size:.9rem;margin-right:8px;vertical-align:middle}

/* games list */
.glist{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.gcard{background:linear-gradient(160deg,#ffffff,#f4faf8);border:2px solid var(--line);border-radius:18px;padding:16px;cursor:pointer;transition:.2s;text-align:center}
.gcard:hover{border-color:var(--u,var(--acc));transform:translateY(-3px)}
.gcard .ic{font-size:2.4rem;animation:bob 3s infinite}
.gcard h4{font-size:1.05rem;margin-top:6px}
.gcard .sc{font-size:.85rem;color:var(--muted);margin-top:4px}
.gcard .sc b{color:var(--gold)}

/* game UI */
.qhead{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.qnum{font-family:'Cairo';font-weight:800;background:var(--accSoft);color:var(--acc);padding:4px 12px;border-radius:99px;font-size:.9rem}
.qbar{flex:1;height:8px;background:#eef3f1;border-radius:99px;overflow:hidden}
.qbar i{display:block;height:100%;background:var(--u,var(--acc));transition:width .4s}
.timer{font-family:'Cairo';font-weight:900;min-width:52px;text-align:center;background:#fff3cd;border-radius:10px;padding:2px 8px}
.timer.low{background:var(--badSoft);color:var(--bad);animation:pulse .6s infinite}
.qvis{background:#f7fbfa;border-radius:16px;padding:8px;margin-bottom:10px;border:1px solid var(--line)}
.qvis svg{width:100%;max-height:300px;height:auto;display:block;margin:auto}
.qtext{font-size:1.25rem;font-weight:700;margin-bottom:12px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.opt{background:#fff;border:2px solid var(--line);border-radius:14px;padding:14px;font-weight:700;text-align:right;transition:.2s;font-size:1.05rem}
.opt:hover{border-color:var(--u,var(--acc));background:#f7fbfa}
.opt.ok{background:var(--okSoft);border-color:var(--ok);color:#0b6b43}
.opt.bad{background:var(--badSoft);border-color:var(--bad);animation:shake .4s}
.opt:disabled{cursor:default}
.explain{margin-top:12px;background:#f1f7ff;border-radius:12px;padding:10px 12px;border-right:4px solid #3b82f6;animation:fadeUp .3s}
.tfbtns{display:flex;gap:14px;justify-content:center;margin-top:16px}
.tfbtns .opt{min-width:150px;text-align:center;font-size:1.3rem}
.stmt{font-size:1.3rem;font-weight:700;background:#f7fbfa;border-radius:16px;padding:22px;text-align:center;border:1px solid var(--line);animation:pop .35s}
.score{font-family:'Cairo';font-weight:900;color:var(--acc)}
.result{text-align:center;padding:20px;animation:pop .4s}
.result .big{font-size:4rem;line-height:1}
.result h3{font-size:1.5rem;margin:8px 0}
.result .stars{font-size:2.2rem;letter-spacing:6px;color:#d9dee0}
.result .stars b{color:var(--gold);animation:pop .5s both}
.result .stars b:nth-child(2){animation-delay:.2s}.result .stars b:nth-child(3){animation-delay:.4s}
/* match */
.match{display:grid;grid-template-columns:1fr 60px 1fr;gap:8px;position:relative}
.mcol{display:flex;flex-direction:column;gap:8px}
.mitem{background:#fff;border:2px solid var(--line);border-radius:12px;padding:10px 12px;font-weight:700;cursor:pointer;transition:.2s;font-size:.98rem;position:relative}
.mitem:hover{border-color:var(--u,var(--acc))}
.mitem.sel{border-color:#3b82f6;background:#eaf2ff;box-shadow:0 0 0 4px rgba(59,130,246,.15)}
.mitem.done{background:var(--okSoft);border-color:var(--ok);cursor:default;opacity:.85}
.mitem.bad{animation:shake .4s;border-color:var(--bad);background:var(--badSoft)}
.mlines{position:absolute;inset:0;pointer-events:none}
/* sort */
.buckets{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.bucket{border:2px dashed var(--line);border-radius:16px;padding:10px;min-height:110px;background:#fbfdfc;cursor:pointer;transition:.2s}
.bucket:hover{border-color:var(--u,var(--acc));background:#f0f9f5}
.bucket.hint{border-color:var(--ok);background:var(--okSoft);animation:pulse .5s 2}
.bucket h4{text-align:center;font-size:1rem;margin-bottom:6px;color:var(--u,var(--acc))}
.bucket .chip{display:inline-block;background:#fff;border:1px solid var(--line);border-radius:99px;padding:2px 10px;font-size:.85rem;margin:2px;animation:pop .3s}
.sitem{font-size:1.3rem;font-weight:800;text-align:center;background:linear-gradient(160deg,#fff,#f4faf8);border:2px solid var(--u,var(--acc));border-radius:18px;padding:22px;animation:pop .35s;box-shadow:var(--shadow)}
.sitem.bad{animation:shake .4s;border-color:var(--bad)}
/* fill */
.fills{display:flex;flex-direction:column;gap:12px}
.fsent{background:#f7fbfa;border-radius:14px;padding:12px 14px;font-size:1.12rem;line-height:2.2;border:1px solid var(--line)}
.blank{display:inline-block;min-width:110px;border-bottom:3px dashed var(--muted);padding:0 8px;margin:0 4px;text-align:center;cursor:pointer;color:var(--muted);font-weight:800;border-radius:6px;transition:.2s}
.blank.act{background:#eaf2ff;border-color:#3b82f6;color:#1d4ed8}
.blank.ok{background:var(--okSoft);border-color:var(--ok);color:#0b6b43;cursor:default}
.blank.bad{animation:shake .4s;background:var(--badSoft);border-color:var(--bad)}
.bank{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;padding:12px;background:#fff;border:2px dashed var(--line);border-radius:14px}
.word{background:var(--accSoft);color:var(--ink);border-radius:99px;padding:6px 14px;font-weight:800;cursor:pointer;transition:.2s;border:2px solid transparent}
.word:hover{border-color:var(--acc)}
.word.used{opacity:.3;pointer-events:none;text-decoration:line-through}
/* order */
.olist{display:flex;flex-direction:column;gap:8px}
.oitem{display:flex;align-items:center;gap:10px;background:#fff;border:2px solid var(--line);border-radius:12px;padding:10px 12px;font-weight:700;transition:.2s;cursor:grab}
.oitem .n{width:32px;height:32px;border-radius:10px;background:var(--accSoft);display:grid;place-items:center;font-family:'Cairo';font-weight:900;color:var(--acc);flex-shrink:0}
.oitem .ctl{margin-right:auto;display:flex;gap:4px}
.oitem .ctl button{width:34px;height:34px;border-radius:10px;background:#f1f5f4;font-size:1rem}
.oitem.ok{background:var(--okSoft);border-color:var(--ok)}
.oitem.bad{background:var(--badSoft);border-color:var(--bad)}
.oitem.drag{opacity:.5}
/* label */
.lab{display:grid;grid-template-columns:1.4fr 1fr;gap:14px}
.lab .vis{background:#f7fbfa;border-radius:16px;padding:8px;border:1px solid var(--line)}
.lab .vis svg{width:100%;height:auto}
.pin{cursor:pointer}
.pin circle{fill:#fff;stroke:var(--acc);stroke-width:3;transition:.2s}
.pin text{font-family:'Cairo';font-weight:900;font-size:13px;fill:var(--acc);pointer-events:none}
.pin.sel circle{fill:#3b82f6;stroke:#1d4ed8}
.pin.sel text{fill:#fff}
.pin.done circle{fill:var(--ok);stroke:#0b6b43}
.pin.done text{fill:#fff}
.pin.bad circle{fill:var(--bad)}
.labtxt{font-family:'Tajawal';font-weight:800;font-size:12px;fill:#0b6b43;animation:pop .3s}
.chips{display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start}
.chips .word{font-size:1rem}
/* memory */
.mem{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.mcard{aspect-ratio:4/3;perspective:600px;cursor:pointer}
.mcard .in{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.mcard.flip .in{transform:rotateY(180deg)}
.mcard .f,.mcard .b{position:absolute;inset:0;border-radius:14px;display:grid;place-items:center;padding:8px;text-align:center;font-weight:800;backface-visibility:hidden;font-size:.95rem}
.mcard .f{background:linear-gradient(135deg,var(--u,var(--acc)),#0b6b43);color:#fff;font-size:2rem}
.mcard .b{background:#fff;border:2px solid var(--line);transform:rotateY(180deg)}
.mcard.done .b{background:var(--okSoft);border-color:var(--ok)}
/* calc */
.calc{max-width:560px;margin:auto}
.calc .in{display:flex;gap:8px;align-items:center;margin:12px 0}
.calc input{flex:1;padding:12px;border:2px solid var(--line);border-radius:14px;font-size:1.4rem;text-align:center;font-family:'Cairo';font-weight:800;direction:ltr}
.calc input.ok{border-color:var(--ok);background:var(--okSoft)}
.calc input.bad{border-color:var(--bad);background:var(--badSoft);animation:shake .4s}
.formula{background:#fff8e1;border-radius:14px;padding:10px 16px;text-align:center;font-family:'Cairo';font-weight:800;font-size:1.15rem;direction:rtl}
.frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 6px;line-height:1.3}
.frac span:first-child{border-bottom:2px solid var(--ink);padding:0 6px}
/* bubble */
.bubwrap{position:relative;height:440px;overflow:hidden;border-radius:18px;background:linear-gradient(180deg,#e0f2fe,#f0f9ff);border:1px solid var(--line)}
.bub{position:absolute;bottom:-90px;width:92px;height:92px;border-radius:50%;display:grid;place-items:center;text-align:center;font-weight:800;font-size:.85rem;padding:6px;cursor:pointer;background:radial-gradient(circle at 30% 30%,#fff,#bfe7ff 60%,#8fd0fb);box-shadow:inset -4px -6px 12px rgba(0,0,0,.08),0 6px 14px rgba(0,0,0,.08);animation:bubbleRise linear forwards;user-select:none}
.bub.pop{animation:ping .35s forwards}
.bub.wrong{background:radial-gradient(circle at 30% 30%,#fff,#ffc9c2 60%,#ff8a7a)}
.hud{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-weight:800}
.rule{background:#fff8e1;border-radius:12px;padding:8px 14px;text-align:center;font-weight:800;margin-bottom:10px;border:1px dashed #f1c40f}
/* crossword */
.cw{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.cwgrid{--cs:34px;display:grid;gap:3px;direction:rtl;margin:auto;width:max-content;max-width:100%}
.cell{width:var(--cs);height:var(--cs);border-radius:6px;background:#fff;border:2px solid var(--line);display:grid;place-items:center;font-family:'Cairo';font-weight:900;font-size:1.05rem;position:relative}
.cell.empty{background:transparent;border-color:transparent}
.cell.filled{background:var(--okSoft);border-color:var(--ok);animation:pop .3s}
.cell.hl{border-color:#3b82f6;background:#eaf2ff}
.cell small{position:absolute;top:0;right:2px;font-size:.55rem;color:var(--muted)}
.clue{background:#fff;border:2px solid var(--line);border-radius:12px;padding:8px 12px;margin:6px 0;cursor:pointer;font-weight:700}
.clue.sel{border-color:#3b82f6;background:#eaf2ff}
.clue.done{background:var(--okSoft);border-color:var(--ok)}
/* grid game */
table.gg{width:100%;border-collapse:separate;border-spacing:4px}
table.gg th{background:var(--u,var(--acc));color:#fff;padding:8px;border-radius:10px;font-size:.95rem}
table.gg td{background:#fff;border:2px solid var(--line);border-radius:10px;padding:8px;text-align:center;font-weight:700}
table.gg td.st{text-align:right;background:#f7fbfa}
table.gg td.tog{cursor:pointer;font-size:1.3rem;transition:.2s}
table.gg td.tog.on{background:#eaf2ff;border-color:#3b82f6}
table.gg td.ok{background:var(--okSoft);border-color:var(--ok)}
table.gg td.bad{background:var(--badSoft);border-color:var(--bad)}
/* sim */
.sim{display:grid;grid-template-columns:1.4fr 1fr;gap:16px}
.sim .sstage{background:#f7fbfa;border:1px solid var(--line);border-radius:16px;padding:8px}
.sim .sstage svg{width:100%;height:auto;display:block}
.sim .ctl{display:flex;flex-direction:column;gap:12px}
.ctlbox{background:#fff;border:2px solid var(--line);border-radius:14px;padding:12px}
.ctlbox label{font-weight:800;display:block;margin-bottom:6px}
input[type=range]{width:100%;accent-color:var(--acc)}
.readout{font-family:'Cairo';font-weight:900;font-size:1.3rem;color:var(--acc)}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1;padding:8px 10px;border-radius:10px;border:2px solid var(--line);background:#fff;font-weight:700}
.seg button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.note{font-size:.95rem;color:var(--muted)}
/* exit ticket */
.faces{display:flex;gap:10px;justify-content:center;margin:10px 0}
.faces button{font-size:2.4rem;padding:6px;border-radius:16px;transition:.2s;background:#fff;border:2px solid var(--line)}
.faces button.on{border-color:var(--acc);background:var(--accSoft);transform:scale(1.15)}
textarea{width:100%;min-height:90px;border:2px solid var(--line);border-radius:14px;padding:12px;resize:vertical}
/* overlays */
.overlay{position:fixed;inset:0;background:rgba(10,30,25,.45);z-index:50;display:none;place-items:center;padding:16px;backdrop-filter:blur(3px)}
.overlay.show{display:grid}
.modal{background:#fff;border-radius:24px;padding:22px;max-width:640px;width:100%;box-shadow:0 30px 60px rgba(0,0,0,.25);animation:pop .35s;max-height:92vh;overflow:auto}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:99px;font-weight:700;z-index:60;opacity:0;transition:.3s;pointer-events:none}
.toast.show{opacity:1}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:70;overflow:hidden}
#confetti i{position:absolute;top:-10px;width:10px;height:14px;animation:confetti 2.6s ease-in forwards;border-radius:2px}
.gloss{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.gitem{background:#fff;border:2px solid var(--line);border-radius:14px;padding:10px 12px}
.gitem b{color:var(--u,var(--acc));font-family:'Cairo'}
.gitem .en{color:var(--muted);font-size:.85rem;font-family:'Cairo'}
/* team quiz */
.teams{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.team{border-radius:16px;padding:12px;text-align:center;border:3px solid transparent;transition:.3s}
.team.a{background:#e0f2fe}.team.b{background:#fde68a}
.team.on{border-color:var(--ink);transform:scale(1.03)}
.team .pts{font-family:'Cairo';font-size:2.2rem;font-weight:900}
.wheel{width:220px;height:220px;border-radius:50%;margin:auto;position:relative;background:conic-gradient(#0f9d76 0 60deg,#f59e0b 60deg 120deg,#3b82f6 120deg 180deg,#e2503f 180deg 240deg,#8b5cf6 240deg 300deg,#14b8a6 300deg 360deg);box-shadow:var(--shadow);transition:transform 3s cubic-bezier(.2,.8,.2,1)}
.wheel:after{content:'▼';position:absolute;top:-22px;left:50%;transform:translateX(-50%);font-size:1.6rem;color:var(--ink)}
.kbd{display:inline-block;background:#f1f5f4;border-radius:6px;padding:0 6px;font-family:'Cairo';font-weight:800}
.tbl{width:100%;border-collapse:collapse;font-size:.92rem;background:#fff;border-radius:12px;overflow:hidden}
.tbl th{background:var(--u,var(--acc));color:#fff;padding:6px}
.tbl td{padding:6px;border-bottom:1px solid var(--line);text-align:center}
.tbl tr:nth-child(even) td{background:#f7fbfa}
.tbl td.hl{background:#fff3cd;font-weight:800}
.tag{display:inline-block;background:var(--accSoft);color:var(--acc);border-radius:99px;padding:2px 10px;font-size:.85rem;font-weight:800}
.dark{--card:#0f1f1b;--ink:#e8f5f0;--muted:#9fb8b0;--line:#1f3a33;--accSoft:#123a30;--bg1:#0b1613;--bg2:#0d1a22}

@media (max-width:820px){
  .hero{grid-template-columns:1fr;text-align:center}
  .slide,.lab,.sim,.cw{grid-template-columns:1fr}
  .stage{font-size:.8rem;padding:8px 2px}
  body{font-size:16px}
  .panel{padding:14px}
  .hero .title{font-size:1.6rem}
  .bubwrap{height:380px}
  .match{grid-template-columns:1fr 24px 1fr}
  .cwgrid{--cs:26px;gap:2px}
  .cell{font-size:.85rem;border-radius:4px}
}
@media print{.topbar,.stages,.snav{display:none}}
</style>
</head>
<body>
<div id="app">
  <!-- HOME -->
  <section id="home" class="screen active">
    <div class="topbar"><div class="wrap">
      <div class="iconbtn" style="background:var(--acc);color:#fff">🧬</div>
      <h2>مختبر الأحياء التفاعلي – الصف التاسع</h2>
      <button class="iconbtn" id="btnSound" title="الصوت">🔊</button>
      <button class="iconbtn" id="btnReset" title="إعادة ضبط التقدم">♻️</button>
    </div></div>
    <div class="wrap">
      <div class="hero">
        <div>
          <div class="title">كتاب النشاط – الأحياء – الجزء الأول</div>
          <div class="sub">رحلة تفاعلية عبر ٦ وحدات: عروض بصرية، ألعاب، محاكاة، أنشطة قبلية وختامية لكل درس.</div>
          <div class="badge">🎯 <span id="homeStats">—</span></div>
        </div>
        <div class="ring" id="homeRing"></div>
      </div>
      <div class="units" id="units"></div>
      <p class="center note mt">✨ كل درس = نشاط قبلي ← عرض تفاعلي ← ألعاب ← نشاط ختامي. تُحفظ إنجازاتك تلقائيًا على هذا الجهاز.</p>
    </div>
  </section>

  <!-- UNIT -->
  <section id="unit" class="screen">
    <div class="topbar"><div class="wrap">
      <button class="iconbtn" onclick="go('home')">🏠</button>
      <h2 id="unitTitle"></h2>
      <button class="iconbtn" onclick="Sfx.toggle()" id="btnSound2">🔊</button>
    </div></div>
    <div class="wrap" id="unitBody"></div>
  </section>

  <!-- LESSON -->
  <section id="lesson" class="screen">
    <div class="topbar"><div class="wrap">
      <button class="iconbtn" id="btnBackUnit">↩️</button>
      <h2 id="lessonTitle"></h2>
      <button class="iconbtn" onclick="Sfx.toggle()" id="btnSound3">🔊</button>
    </div></div>
    <div class="wrap">
      <div class="stages" id="stages"></div>
      <div class="panel" id="stagePanel"></div>
    </div>
  </section>
</div>
<div class="overlay" id="overlay"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>
<div id="confetti"></div>
<script>
/* ============================================================
   ENGINE — utilities, audio, progress, router, game runners
   ============================================================ */
'use strict';
const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const rnd = (a, b) => Math.random() * (b - a) + a;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const AR = n => String(n).replace(/\d/g, d => '٠١٢٣٤٥٦٧٨٩'[d]);
const idAR = id => AR(String(id).replace('w', ''));
const sleep = ms => new Promise(r => setTimeout(r, ms));
function toast(msg, ms = 1800) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('show'), ms); }
function confetti(n = 90) { const c = $('#confetti'); const cols = ['#0f9d76', '#f5b301', '#3b82f6', '#e2503f', '#8b5cf6', '#14b8a6']; for (let i = 0; i < n; i++) { const p = document.createElement('i'); p.style.left = rnd(0, 100) + 'vw'; p.style.background = cols[i % cols.length]; p.style.animationDelay = rnd(0, .8) + 's'; p.style.animationDuration = rnd(2, 3.4) + 's'; p.style.transform = `rotate(${rnd(0, 360)}deg)`; c.appendChild(p); setTimeout(() => p.remove(), 4200); } }
function modal(html, opts = {}) { const o = $('#overlay'), m = $('#modal'); m.innerHTML = html; o.classList.add('show'); m.querySelectorAll('[data-close]').forEach(b => b.onclick = closeModal); if (opts.onOpen) opts.onOpen(m); }
function closeModal() { $('#overlay').classList.remove('show'); }
$('#overlay').addEventListener('click', e => { if (e.target.id === 'overlay') closeModal(); });

/* ---------- AUDIO (Web Audio synthesized) ---------- */
const Sfx = (() => {
  let ctx = null, on = localStorage.getItem('bio9_sound') !== '0';
  const ac = () => { if (!ctx) { try { ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { } } if (ctx && ctx.state === 'suspended') ctx.resume(); return ctx; };
  function tone(f, t = .12, type = 'sine', vol = .18, delay = 0, slide = 0) { const c = ac(); if (!c || !on) return; const o = c.createOscillator(), g = c.createGain(); o.type = type; o.frequency.setValueAtTime(f, c.currentTime + delay); if (slide) o.frequency.exponentialRampToValueAtTime(slide, c.currentTime + delay + t); g.gain.setValueAtTime(0, c.currentTime + delay); g.gain.linearRampToValueAtTime(vol, c.currentTime + delay + .01); g.gain.exponentialRampToValueAtTime(.0001, c.currentTime + delay + t); o.connect(g); g.connect(c.destination); o.start(c.currentTime + delay); o.stop(c.currentTime + delay + t + .05); }
  function noise(t = .15, vol = .12) { const c = ac(); if (!c || !on) return; const b = c.createBuffer(1, c.sampleRate * t, c.sampleRate); const d = b.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length); const s = c.createBufferSource(); s.buffer = b; const g = c.createGain(); g.gain.value = vol; const f = c.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = 800; s.connect(f); f.connect(g); g.connect(c.destination); s.start(); }
  const api = {
    click() { tone(660, .06, 'triangle', .08); },
    correct() { tone(660, .1, 'sine', .16); tone(880, .12, 'sine', .16, .09); tone(1320, .18, 'sine', .14, .18); },
    wrong() { tone(220, .18, 'sawtooth', .12, 0, 140); tone(160, .22, 'square', .06, .05); },
    pop() { tone(900, .05, 'sine', .14, 0, 1500); noise(.06, .06); },
    win() { [523, 659, 784, 1047].forEach((f, i) => tone(f, .22, 'sine', .16, i * .11)); tone(1319, .5, 'sine', .14, .45); },
    star() { tone(1568, .12, 'sine', .12); tone(2093, .2, 'sine', .1, .08); },
    tick() { tone(1200, .03, 'square', .05); },
    whoosh() { noise(.25, .1); },
    flip() { tone(500, .05, 'triangle', .08, 0, 800); },
    fail() { tone(300, .25, 'sawtooth', .1, 0, 100); tone(200, .35, 'sawtooth', .1, .2, 80); },
    bubble() { tone(400, .08, 'sine', .1, 0, 900); },
    toggle() { on = !on; localStorage.setItem('bio9_sound', on ? '1' : '0'); api.syncBtn(); if (on) api.click(); toast(on ? 'الصوت مفعّل 🔊' : 'الصوت صامت 🔇'); },
    syncBtn() { $$('#btnSound,#btnSound2,#btnSound3').forEach(b => { b.textContent = on ? '🔊' : '🔇'; b.classList.toggle('on', on); }); },
    get on() { return on; }
  };
  return api;
})();
document.addEventListener('pointerdown', () => { try { Sfx.click; } catch (e) { } }, { once: true });
/* text-to-speech */
function speak(text) {
  if (!('speechSynthesis' in window)) { toast('القراءة الصوتية غير مدعومة في هذا المتصفح'); return; }
  const t = String(text).replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim();
  speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(t); u.lang = 'ar-SA'; u.rate = .95;
  const v = speechSynthesis.getVoices().find(v => /^ar/i.test(v.lang)); if (v) u.voice = v;
  speechSynthesis.speak(u);
}
document.addEventListener('click', e => { const b = e.target.closest('[data-tts]'); if (b) { e.stopPropagation(); Sfx.click(); speak(b.dataset.tts); } });

/* ---------- PROGRESS ---------- */
const PKEY = 'bio9_ab1_progress_v1';
const Prog = {
  d: JSON.parse(localStorage.getItem(PKEY) || '{}'),
  save() { localStorage.setItem(PKEY, JSON.stringify(this.d)); },
  L(id) { if (!this.d[id]) this.d[id] = { pre: false, slides: false, games: {}, post: null, note: '', face: '' }; return this.d[id]; },
  stars(id) { const l = this.L(id); let s = 0; if (l.pre && l.slides) s++; const g = Object.values(l.games); if (g.length && g.reduce((a, b) => a + b, 0) / g.length >= .7) s++; if (l.post !== null && l.post >= .8) s++; return s; },
  lessonPct(id) { const l = this.L(id); const les = LESSONS[id]; let done = 0, tot = 3 + (les ? les.games.length : 0); if (l.pre) done++; if (l.slides) done++; if (l.post !== null) done++; done += Object.keys(l.games).length; return done / tot; },
  unitPct(u) { const ls = u.lessons; return ls.reduce((a, l) => a + this.lessonPct(l.id), 0) / ls.length; },
  totalPct() { return UNITS.reduce((a, u) => a + this.unitPct(u), 0) / UNITS.length; },
  reset() { this.d = {}; this.save(); }
};

/* ---------- ROUTER ---------- */
const LESSONS = {};
let cur = { unit: null, lesson: null, stage: 'pre' };
function go(screen) { $$('.screen').forEach(s => s.classList.remove('active')); $('#' + screen).classList.add('active'); window.scrollTo({ top: 0, behavior: 'smooth' }); speechSynthesis && speechSynthesis.cancel(); if (screen === 'home') renderHome(); }
function ringSVG(pct, size = 150, stroke = 12, color = 'var(--acc)') { const r = (size - stroke) / 2, c = 2 * Math.PI * r; return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}"><circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="#e6efec" stroke-width="${stroke}"/><circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="${color}" stroke-width="${stroke}" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c * (1 - pct)}" style="transition:stroke-dashoffset 1s"/></svg>`; }
function renderHome() {
  const pct = Prog.totalPct();
  $('#homeRing').innerHTML = ringSVG(pct) + `<div class="num">${Math.round(pct * 100)}%<small>الإنجاز الكلي</small></div>`;
  const totalStars = UNITS.reduce((a, u) => a + u.lessons.reduce((b, l) => b + Prog.stars(l.id), 0), 0);
  const maxStars = UNITS.reduce((a, u) => a + u.lessons.length * 3, 0);
  $('#homeStats').textContent = `${AR(totalStars)} / ${AR(maxStars)} نجمة  •  ${AR(UNITS.reduce((a, u) => a + u.lessons.length, 0))} درسًا`;
  $('#units').innerHTML = UNITS.map((u, i) => `<div class="ucard" style="--u:${u.color}" onclick="openUnit(${i})">
    <div class="num">${AR(i + 1)}</div><div class="ico">${u.icon}</div><h3>${u.t}</h3><div class="en">${u.en}</div>
    <div class="meta"><span>📚 ${AR(u.lessons.length)} دروس</span><span>⭐ ${AR(u.lessons.reduce((a, l) => a + Prog.stars(l.id), 0))}/${AR(u.lessons.length * 3)}</span></div>
    <div class="pbar"><i style="width:${Prog.unitPct(u) * 100}%"></i></div></div>`).join('');
  Sfx.syncBtn();
}
function openUnit(i) {
  Sfx.click(); const u = UNITS[i]; cur.unit = i; document.documentElement.style.setProperty('--u', u.color);
  $('#unitTitle').textContent = `الوحدة ${['الأولى', 'الثانية', 'الثالثة', 'الرابعة', 'الخامسة', 'السادسة'][i]}: ${u.t}`;
  const ex = u.lessons.filter(l => l.kind === 'ex'), ws = u.lessons.filter(l => l.kind === 'ws');
  const card = l => `<div class="lcard" onclick="openLesson('${l.id}')"><div class="k ${l.kind}">${l.kind === 'ex' ? 'تمرين' : 'ورقة عمل'}<br>${idAR(l.id)}</div><div style="flex:1"><h3>${l.t}</h3><div class="sub">${l.tag || ''}</div><div class="stars">${[1, 2, 3].map(n => n <= Prog.stars(l.id) ? '<b>★</b>' : '★').join('')}</div></div><div class="pbar" style="width:60px;margin:0"><i style="width:${Prog.lessonPct(l.id) * 100}%"></i></div></div>`;
  $('#unitBody').innerHTML = `<div class="uhead" style="--u:${u.color}"><div class="ico">${u.icon}</div><div><h1>${u.t}</h1><p>${u.en} — ${u.desc}</p></div></div>
  <div class="tools"><button class="tool" onclick="showGlossary(${i})">📖 المصطلحات العلمية</button><button class="tool" onclick="teamQuiz(${i})">🏆 مسابقة الفريقين</button><button class="tool" onclick="unitReport(${i})">📊 تقرير الوحدة</button></div>
  ${ex.length ? `<div class="sect">التمارين</div><div class="lessons">${ex.map(card).join('')}</div>` : ''}
  ${ws.length ? `<div class="sect">أوراق العمل</div><div class="lessons">${ws.map(card).join('')}</div>` : ''}`;
  go('unit');
}
function showGlossary(i) { const u = UNITS[i]; Sfx.click(); modal(`<h2>📖 مصطلحات الوحدة: ${u.t}</h2><div class="gloss mt">${u.terms.map(t => `<div class="gitem"><b>${t.a}</b> <span class="en">${t.e}</span><button class="tts" data-tts="${esc(t.a + '. ' + t.d)}">🔊</button><div>${t.d}</div></div>`).join('')}</div><div class="center mt"><button class="btn" data-close>إغلاق</button></div>`); }
function unitReport(i) { const u = UNITS[i]; Sfx.click(); modal(`<h2>📊 تقرير الوحدة: ${u.t}</h2><table class="tbl mt"><tr><th>الدرس</th><th>قبلي</th><th>عرض</th><th>ألعاب</th><th>ختامي</th><th>نجوم</th></tr>${u.lessons.map(l => { const p = Prog.L(l.id); const g = Object.values(p.games); const ga = g.length ? Math.round(g.reduce((a, b) => a + b, 0) / g.length * 100) + '%' : '—'; return `<tr><td style="text-align:right">${l.t}</td><td>${p.pre ? '✅' : '—'}</td><td>${p.slides ? '✅' : '—'}</td><td>${ga} (${g.length}/${l.games.length})</td><td>${p.post !== null ? Math.round(p.post * 100) + '%' : '—'}</td><td style="color:var(--gold)">${'★'.repeat(Prog.stars(l.id))}</td></tr>`; }).join('')}</table><div class="center mt"><button class="btn" data-close>إغلاق</button></div>`); }

/* ---------- LESSON ---------- */
const STAGES = [{ k: 'pre', n: 'نشاط قبلي', ic: '🚀' }, { k: 'slides', n: 'العرض التفاعلي', ic: '🎞️' }, { k: 'games', n: 'الألعاب', ic: '🎮' }, { k: 'post', n: 'نشاط ختامي', ic: '🏁' }];
function openLesson(id, stage = 'pre') {
  Sfx.click(); const l = LESSONS[id]; cur.lesson = id; cur.stage = stage; const u = UNITS[cur.unit]; document.documentElement.style.setProperty('--u', u.color);
  $('#lessonTitle').textContent = `${l.kind === 'ex' ? 'تمرين' : 'ورقة العمل'} ${idAR(l.id)}: ${l.t}`;
  $('#btnBackUnit').onclick = () => openUnit(cur.unit);
  renderStage(); go('lesson');
}
function renderStages() { const p = Prog.L(cur.lesson); const l = LESSONS[cur.lesson]; const done = { pre: p.pre, slides: p.slides, games: Object.keys(p.games).length >= l.games.length, post: p.post !== null }; $('#stages').innerHTML = STAGES.map(s => `<button class="stage ${cur.stage === s.k ? 'on' : ''}" onclick="setStage('${s.k}')"><span class="ic">${s.ic}</span>${s.n}${done[s.k] ? '<span class="done">✅</span>' : ''}</button>`).join(''); }
function setStage(k) { Sfx.click(); cur.stage = k; renderStage(); }
function renderStage() { renderStages(); const l = LESSONS[cur.lesson]; const P = $('#stagePanel'); P.innerHTML = ''; ({ pre: renderPre, slides: renderSlides, games: renderGames, post: renderPost })[cur.stage](l, P); window.scrollTo({ top: 0, behavior: 'smooth' }); }
function nextStageBtn(k) { const idx = STAGES.findIndex(s => s.k === k); const n = STAGES[idx + 1]; return n ? `<button class="btn" onclick="setStage('${n.k}')">${n.ic} الانتقال إلى: ${n.n} ←</button>` : `<button class="btn gold" onclick="openUnit(cur.unit)">🏁 العودة إلى الوحدة</button>`; }

function renderPre(l, P) {
  P.innerHTML = `<h2>🚀 النشاط القبلي: ${l.pre.title || 'تهيئة'}</h2><div class="goal">${l.pre.goal || 'نشاط سريع يوقظ معرفتك السابقة ويهيئك للدرس.'}</div><div id="gameMount"></div>`;

function simShell(mount, stageHtml, ctlHtml) { mount.innerHTML = `<div class="sim"><div class="sstage" id="sst">${stageHtml}</div><div class="ctl" id="sct">${ctlHtml}</div></div>`; return { st: mount.querySelector('#sst'), ct: mount.querySelector('#sct') }; }

/* 1. الانتشار */
SIMS.diffusion = (mount, done) => {
  const { st, ct } = simShell(mount, `<canvas id="dc" width="520" height="340" style="width:100%;border-radius:12px;background:#eef7ff"></canvas><div class="row mt" style="justify-content:space-between;font-weight:800"><span style="color:#e2503f">يسار: <span id="dl">0</span></span><span id="dt">الزمن: 0 ث</span><span style="color:#3b82f6">يمين: <span id="dr">0</span></span></div>`,
    `<div class="ctlbox"><label>🌡️ درجة الحرارة: <span class="readout" id="tv">20</span> °C</label><input type="range" id="temp" min="0" max="80" value="20"></div><div class="ctlbox"><label>🧫 حجم الثقب (عدد الجزيئات)</label><div class="seg"><button data-n="40">قليل</button><button data-n="80" class="on">متوسط</button><button data-n="140">كثير</button></div></div><div class="row"><button class="btn" id="run">▶ ابدأ</button><button class="btn sec" id="rst">↺ إعادة</button></div><p class="note">راقب كيف تنتشر الجزيئات الحمراء من المنطقة ذات التركيز المرتفع (يسار) إلى المنطقة ذات التركيز المنخفض. جرّب رفع الحرارة.</p>`);
  const tasks = simTasks(mount, ['شغّل المحاكاة حتى تتوزع الجزيئات', 'جرّب درجة حرارة 60 أو أكثر', 'غيّر عدد الجزيئات'], done);
  const cv = st.querySelector('#dc'), cx = cv.getContext('2d'); let P = [], N = 80, run = false, t = 0, raf = null, last = 0;
  const reset = () => { cancelAnimationFrame(raf); run = false; t = 0; P = Array.from({ length: N }, () => ({ x: rnd(10, 120), y: rnd(10, 330), vx: 0, vy: 0 })); draw(); ct.querySelector('#run').textContent = '▶ ابدأ'; };
  const draw = () => { cx.clearRect(0, 0, 520, 340); cx.strokeStyle = '#8ab8e6'; cx.setLineDash([6, 6]); cx.beginPath(); cx.moveTo(260, 0); cx.lineTo(260, 340); cx.stroke(); cx.setLineDash([]); let l = 0; P.forEach(p => { if (p.x < 260) l++; cx.beginPath(); cx.arc(p.x, p.y, 5, 0, 7); cx.fillStyle = '#e2503f'; cx.fill(); }); st.querySelector('#dl').textContent = l; st.querySelector('#dr').textContent = P.length - l; st.querySelector('#dt').textContent = 'الزمن: ' + Math.floor(t) + ' ث'; };
  const step = ts => { if (!run || !document.body.contains(cv)) return; const T_ = +ct.querySelector('#temp').value; const sp = .6 + T_ / 22; t += 1 / 60; P.forEach(p => { p.vx += rnd(-1, 1) * sp; p.vy += rnd(-1, 1) * sp; p.vx *= .9; p.vy *= .9; p.x = clamp(p.x + p.vx, 5, 515); p.y = clamp(p.y + p.vy, 5, 335); }); draw(); if (t > 6) tasks.hit(0); if (T_ >= 60 && t > 2) tasks.hit(1); raf = requestAnimationFrame(step); };
  ct.querySelector('#temp').oninput = e => ct.querySelector('#tv').textContent = e.target.value;
  ct.querySelectorAll('.seg button').forEach(b => b.onclick = () => { ct.querySelectorAll('.seg button').forEach(x => x.classList.remove('on')); b.classList.add('on'); N = +b.dataset.n; tasks.hit(2); reset(); });
  ct.querySelector('#run').onclick = () => { Sfx.click(); run = !run; ct.querySelector('#run').textContent = run ? '⏸ إيقاف' : '▶ ابدأ'; if (run) raf = requestAnimationFrame(step); };
  ct.querySelector('#rst').onclick = () => { Sfx.click(); reset(); }; reset();
};

};

/* 4. تجربة الليبيز */

  draw([]);
  ct.querySelectorAll('#tp button').forEach(b => b.onclick = () => { ct.querySelectorAll('#tp button').forEach(x => x.classList.remove('on')); b.classList.add('on'); temp = +b.dataset.t; draw([]); });

  ct.querySelector('#run').onclick = () => { Sfx.whoosh(); const rate = !milk ? 0 : temp === 0 ? .02 : temp === 20 ? .1 : temp === 40 ? .16 : temp === 60 ? .06 : 0; const pts = [0, 1, 2, 3, 4, 5].map(i => Math.max(5.6, 7 - rate * i * 2 * (1 - i * .05))); draw(pts.map(p => Math.round(p * 10) / 10)); if (temp === 40 && milk) tasks.hit(0); if (temp === 100) tasks.hit(1); if (!milk) tasks.hit(2); };

/* 5. pH الأمثل للأميليز */
SIMS.amylase = (mount, done) => {
  const results = {}; const { st, ct } = simShell(mount, `<div id="am"></div>`, `<div class="ctlbox"><label>🧪 اختر pH المحلول المنظم</label><div class="seg" id="ph">${[2, 4, 6, 7.5, 8, 10].map(p => `<button data-p="${p}">${p}</button>`).join('')}</div></div><button class="btn" id="run" disabled>▶ ابدأ الاختبار</button><div class="ctlbox"><label>📋 جدول النتائج</label><div id="tb">لا نتائج بعد</div></div>`);

  let ph = null, running = false; const timeFor = p => Math.round(30 + Math.abs(p - 7.5) * 45 + (p < 4 ? 120 : 0));

/* 6. القفل والمفتاح */
SIMS.lockkey = (mount, done) => {

  const { st, ct } = simShell(mount, `<div id="lk"></div>`, `<div class="ctlbox"><label>🔑 اختر مادة تفاعل وجرّبها في الموقع النشط</label><div class="seg" id="ss">${subs.map((s, i) => `<button data-i="${i}">${s[0]}</button>`).join('')}</div></div><div class="ctlbox"><label>🌡️ درجة الحرارة: <span class="readout" id="tv">37</span>°C</label><input type="range" id="temp" min="0" max="80" value="37"></div><div id="msg"></div>`);
  const tasks = simTasks(mount, ['جرّب المالتوز (يتفكك إلى جلوكوز)', 'جرّب مادة لا تناسب الموقع النشط', 'ارفع الحرارة فوق 60°C وجرّب المالتوز'], done);
  let temp = 37; const draw = (si, state) => { const den = temp > 60; const enz = den ? 'M40,150 C40,80 110,50 180,60 L180,105 L150,120 L170,150 L150,170 L175,195 L180,230 L180,250 C110,262 40,220 40,150 Z' : 'M40,150 C40,80 110,50 180,60 L180,110 L150,110 L150,150 L180,150 L180,190 L150,190 L150,230 L180,230 L180,250 C110,262 40,220 40,150 Z'; let sub = ''; if (si !== null) { const s = subs[si]; const ok = s[2] && !den; const tx = state === 'in' ? (ok ? -30 : -8) : 100; sub = state === 'split' ? `<rect x="240" y="100" width="34" height="38" rx="6" fill="#fca5a5" stroke="#b91c1c" stroke-width="2" style="animation:bob 1.2s infinite"/><rect x="240" y="160" width="34" height="38" rx="6" fill="#fca5a5" stroke="#b91c1c" stroke-width="2" style="animation:bob 1.5s infinite"/>${T(257, 225, 'جلوكوز + جلوكوز', { s: 11, f: '#b91c1c' })}` : `<path d="${s[1]}" transform="translate(${tx},0)" fill="${ok ? '#fde68a' : '#fca5a5'}" stroke="${ok ? '#d97706' : '#b91c1c'}" stroke-width="3" style="transition:transform .8s"/>`; } st.querySelector('#lk').innerHTML = svgWrap(420, 300, `<path d="${enz}" fill="${den ? '#fecaca' : '#b8e0d2'}" stroke="${den ? '#b91c1c' : '#0f9d76'}" stroke-width="4" style="transition:.5s"/>${T(100, 155, den ? 'أنزيم تالف!' : 'الأنزيم', { s: 14, f: den ? '#b91c1c' : '#0b6b43' })}${sub}${T(210, 285, den ? 'تغيّر شكل الموقع النشط ← لا تناسب مادة التفاعل' : 'الموقع النشط يناسب المالتوز فقط', { s: 12 })}`); };
  draw(null, '');
  ct.querySelector('#temp').oninput = e => { temp = +e.target.value; ct.querySelector('#tv').textContent = temp; draw(null, ''); ct.querySelector('#msg').innerHTML = ''; };
  ct.querySelectorAll('#ss button').forEach(b => b.onclick = () => { const i = +b.dataset.i; Sfx.whoosh(); draw(i, 'out'); setTimeout(() => draw(i, 'in'), 50); setTimeout(() => { const ok = subs[i][2] && temp <= 60; if (ok) { Sfx.correct(); draw(i, 'split'); ct.querySelector('#msg').innerHTML = '<div class="ans show">✅ المالتوز يناسب الموقع النشط ← يتكوّن مركب أنزيم–مادة تفاعل ← ينتج جزيئا جلوكوز</div>'; tasks.hit(0); } else { Sfx.wrong(); draw(i, 'out'); ct.querySelector('#msg').innerHTML = `<div class="explain">❌ ${temp > 60 ? 'الأنزيم تالف بالحرارة: شكل الموقع النشط تغيّر فلا تناسبه مادة التفاعل.' : 'الشكل لا يطابق الموقع النشط — الأنزيم متخصص بمادة تفاعل واحدة.'}</div>`; if (!subs[i][2]) tasks.hit(1); if (temp > 60 && subs[i][2]) tasks.hit(2); } }, 1000); });
};

/* 8. مستكشف الجدول الغذائي */
SIMS.nutrition = (mount, done) => {

/* 9. قارئ التمثيل البياني (فيتامين د) */
SIMS.vitdreader = (mount, done) => {
  const pts = [[0, 0], [6, 126], [12, 142], [24, 120], [48, 60], [72, 56]]; const val = t => { for (let i = 1; i < pts.length; i++) if (t <= pts[i][0]) { const [t0, v0] = pts[i - 1], [t1, v1] = pts[i]; return v0 + (v1 - v0) * (t - t0) / (t1 - t0); } return 56; };
  const { st, ct } = simShell(mount, `<div id="vd"></div>`, `<div class="ctlbox"><label>⏱️ الزمن: <span class="readout" id="tv">0</span> ساعة</label><input type="range" id="t" min="0" max="72" value="0"></div><div class="ctlbox"><div>التركيز: <span class="readout" id="vv">0</span> وحدة</div><div id="ph" class="note mt"></div></div>`);
  const tasks = simTasks(mount, ['اذهب إلى الذروة (12 ساعة)', 'اذهب إلى 48 ساعة', 'اذهب إلى نهاية التجربة (72 ساعة)'], done);
  const X = t => 50 + t * 4.6, Y = v => 260 - v * 1.5; const draw = t => { const v = val(t); st.querySelector('#vd').innerHTML = VIS.vitDGraph().replace('</svg>', `<line x1="${X(t)}" y1="20" x2="${X(t)}" y2="260" stroke="#e2503f" stroke-dasharray="5 4"/><circle cx="${X(t)}" cy="${Y(v)}" r="8" fill="#e2503f" stroke="#fff" stroke-width="3"/></svg>`); ct.querySelector('#vv').textContent = Math.round(v); ct.querySelector('#ph').textContent = t < 12 ? 'ارتفاع سريع: الامتصاص من الأمعاء أسرع من الإزالة' : t <= 48 ? 'انخفاض سريع: الفيتامين يُستخدم ويُخزَّن في الجسم' : 'انخفاض بطيء: يقترب من الاستقرار'; if (t === 12) tasks.hit(0); if (t === 48) tasks.hit(1); if (t === 72) tasks.hit(2); };
  draw(0); ct.querySelector('#t').oninput = e => { ct.querySelector('#tv').textContent = e.target.value; draw(+e.target.value); };
};

/* 10. مقياس التنفس */
SIMS.respirometer = (mount, done) => {
  const { st, ct } = simShell(mount, `<div id="rs"></div><div id="rg"></div>`, `<div class="ctlbox"><label>🌡️ درجة حرارة الحمام المائي: <span class="readout" id="tv">20</span>°C</label><input type="range" id="temp" min="0" max="70" value="20" step="5"></div><div class="ctlbox"><label>🌱 البذور</label><div class="seg" id="sd"><button data-s="1" class="on">نابتة</button><button data-s="0">مغلية (ضابطة)</button></div></div><button class="btn" id="run">▶ قِس 5 دقائق</button><div id="out" class="mt"></div>`);
  const tasks = simTasks(mount, ['قِس عند 3 درجات حرارة مختلفة', 'جرّب البذور المغلية', 'اعثر على الدرجة المثلى'], done);
  let temp = 20, seeds = 1; const res = {}; const rate = t => seeds ? Math.round((t <= 40 ? 10 * Math.exp((t - 40) * .07) : 10 * Math.max(0, 1 - ((t - 40) / 25) ** 2)) * 10) / 10 : 0;
  const draw = (mv = 0) => { st.querySelector('#rs').innerHTML = VIS.respirometer().replace('<circle cx="300" cy="132" r="6" fill="#e2503f" style="animation:bob 1.5s infinite"/>', `<circle cx="${300 - mv * 8}" cy="132" r="6" fill="#e2503f" style="transition:cx 1.5s"/>`).replace('حمام مائي بدرجة حرارة ثابتة', `حمام مائي ${temp}°C — بذور ${seeds ? 'نابتة' : 'مغلية'}`); const ks = Object.keys(res).map(Number).sort((a, b) => a - b); st.querySelector('#rg').innerHTML = ks.length ? svgWrap(420, 160, `<line x1="40" y1="10" x2="40" y2="130" stroke="#123b32"/><line x1="40" y1="130" x2="400" y2="130" stroke="#123b32"/>${ks.map(k => `<circle cx="${40 + k * 5}" cy="${130 - res[k] * 11}" r="5" fill="#0f9d76"/>${T(40 + k * 5, 148, k, { s: 10 })}`).join('')}${ks.length > 1 ? `<polyline points="${ks.map(k => (40 + k * 5) + ',' + (130 - res[k] * 11)).join(' ')}" fill="none" stroke="#0f9d76" stroke-width="2"/>` : ''}${T(220, 12, 'معدل التنفس (mm/دقيقة) مقابل درجة الحرارة', { s: 11 })}`) : ''; };
  draw(); ct.querySelector('#temp').oninput = e => { temp = +e.target.value; ct.querySelector('#tv').textContent = temp; draw(); }; ct.querySelectorAll('#sd button').forEach(b => b.onclick = () => { ct.querySelectorAll('#sd button').forEach(x => x.classList.remove('on')); b.classList.add('on'); seeds = +b.dataset.s; draw(); });
  ct.querySelector('#run').onclick = () => { Sfx.whoosh(); const r = rate(temp); if (seeds) res[temp] = r; draw(r); ct.querySelector('#out').innerHTML = `<div class="${r ? 'ans show' : 'explain'}">${seeds ? `تحركت القطرة ${r * 5} mm خلال 5 دقائق ← المعدل ${r} mm/دقيقة` : 'لم تتحرك القطرة: البذور المغلية ميتة ولا تتنفس (تلفت أنزيماتها)'}</div>`; if (Object.keys(res).length >= 3) tasks.hit(0); if (!seeds) tasks.hit(1); if (res[40] !== undefined && Object.keys(res).length >= 3) tasks.hit(2); };
};

/* 11. موازنة معادلة التنفس */
SIMS.balance = (mount, done) => {
  const { st, ct } = simShell(mount, `<div id="be"></div>`, `<div class="ctlbox"><label>ضع المعاملات الصحيحة</label><div class="row" style="justify-content:center;direction:ltr;font-family:Cairo;font-weight:900;font-size:1.2rem;flex-wrap:nowrap"><span>C₆H₁₂O₆ + 6O₂ →</span><input id="c1" type="number" min="1" max="12" value="1" style="width:56px;padding:6px;border:2px solid var(--line);border-radius:10px;text-align:center"><span>CO₂ +</span><input id="c2" type="number" min="1" max="12" value="1" style="width:56px;padding:6px;border:2px solid var(--line);border-radius:10px;text-align:center"><span>H₂O</span></div></div><div id="msg"></div>`);
  const tasks = simTasks(mount, ['اجعل عدد ذرات الكربون متساويًا', 'اجعل عدد ذرات الهيدروجين متساويًا', 'وازن المعادلة كاملة'], done);
  const draw = () => { const a = clamp(+ct.querySelector('#c1').value || 1, 1, 12), b = clamp(+ct.querySelector('#c2').value || 1, 1, 12); const L = { C: 6, H: 12, O: 6 + 12 }, R = { C: a, H: 2 * b, O: 2 * a + b }; st.querySelector('#be').innerHTML = svgWrap(420, 300, `${['C', 'H', 'O'].map((el, i) => { const ok = L[el] === R[el]; return `<g transform="translate(0,${40 + i * 80})"><rect x="30" y="0" width="160" height="60" rx="12" fill="#dbeafe" stroke="#3b82f6"/><rect x="230" y="0" width="160" height="60" rx="12" fill="#fef3c7" stroke="#f59e0b"/>${T(110, 25, el + ' في الطرف الأيسر', { s: 11 })}${T(110, 50, L[el], { s: 18, f: '#1d4ed8' })}${T(310, 25, el + ' في الطرف الأيمن', { s: 11 })}${T(310, 50, R[el], { s: 18, f: '#b45309' })}<text x="210" y="40" font-size="26" text-anchor="middle">${ok ? '✅' : '⚖️'}</text></g>`; }).join('')}${T(210, 290, L.C === R.C && L.H === R.H && L.O === R.O ? 'المعادلة موزونة! 🎉' : 'غيّر المعاملات حتى تتساوى الذرات', { s: 13, f: '#0b6b43' })}`); if (L.C === R.C) tasks.hit(0); if (L.H === R.H) tasks.hit(1); if (L.C === R.C && L.H === R.H && L.O === R.O) { tasks.hit(2); Sfx.win(); } };
  draw(); ct.querySelectorAll('input').forEach(i => i.oninput = () => { Sfx.click(); draw(); });
};

/* 12. اختبار زمن الاستجابة */
SIMS.reaction = (mount, done) => {
  const { st, ct } = simShell(mount, `<div id="rt" style="height:320px;border-radius:14px;background:#94a3b8;display:grid;place-items:center;font-size:1.5rem;font-weight:900;color:#fff;cursor:pointer;user-select:none">اضغط للبدء</div>`, `<div class="ctlbox"><label>📋 النتائج (ms)</label><div id="rl">—</div><div class="mt">المتوسط: <span class="readout" id="avg">—</span> ms</div><div class="note" id="rul"></div></div><button class="btn sec" id="clr">↺ جولة جديدة</button><p class="note">انتظر حتى يتحول اللون إلى الأخضر ثم اضغط بأسرع ما يمكن. كرّر 5 مرات واحسب المتوسط. يمكن مقارنة الجولات (قبل/بعد مشروب يحتوي كافيين).</p>`);
  const tasks = simTasks(mount, ['أكمل 5 محاولات', 'أكمل جولة ثانية للمقارنة'], done);
  const box = st.querySelector('#rt'); let state = 'idle', t0 = 0, to = null, res = [], rounds = 0;
  const update = () => { ct.querySelector('#rl').textContent = res.length ? res.map(r => AR(r)).join(' ، ') : '—'; if (res.length) { const a = Math.round(res.reduce((x, y) => x + y, 0) / res.length); ct.querySelector('#avg').textContent = AR(a); const d = 0.5 * 9.8 * (a / 1000) ** 2 * 100; ct.querySelector('#rul').textContent = `يعادل سقوط مسطرة نحو ${AR(Math.round(d))} cm`; } if (res.length >= 5) { tasks.hit(0); rounds++; if (rounds >= 2) tasks.hit(1); toast('اكتملت الجولة! ابدأ جولة جديدة للمقارنة'); } };
  box.onclick = () => { if (state === 'idle') { if (res.length >= 5) return; state = 'wait'; box.style.background = '#ef4444'; box.textContent = 'انتظر الأخضر...'; to = setTimeout(() => { state = 'go'; box.style.background = '#22c55e'; box.textContent = 'اضغط الآن!'; t0 = performance.now(); Sfx.pop(); }, rnd(1500, 4000)); } else if (state === 'wait') { clearTimeout(to); state = 'idle'; box.style.background = '#94a3b8'; box.textContent = 'مبكر جدًا! اضغط للمحاولة'; Sfx.wrong(); } else if (state === 'go') { const ms = Math.round(performance.now() - t0); res.push(ms); state = 'idle'; box.style.background = '#94a3b8'; box.textContent = `${AR(ms)} ms — اضغط للتالي`; Sfx.correct(); update(); } };
  ct.querySelector('#clr').onclick = () => { res = []; state = 'idle'; clearTimeout(to); box.style.background = '#94a3b8'; box.textContent = 'اضغط للبدء'; ct.querySelector('#rl').textContent = '—'; ct.querySelector('#avg').textContent = '—'; ct.querySelector('#rul').textContent = ''; };
};

/* 13. تكيّف العين */
SIMS.accommodation = (mount, done) => {

  let seen = { n: false, f: false }; const draw = d => { const near = d < 50; const rx = 14 + (100 - d) * .14; st.querySelector('#ac').innerHTML = eyeSide(rx, near).replace('📖', d < 30 ? '📖' : d < 70 ? '🐈' : '🌳').replace('🌳', d < 30 ? '📖' : d < 70 ? '🐈' : '🌳'); ct.querySelector('#dv').textContent = d < 30 ? 'قريب جدًا' : d < 70 ? 'متوسط' : 'بعيد'; ct.querySelector('#info').innerHTML = `<div><b>العضلة الهدبية:</b> ${near ? 'منقبضة 🔴' : 'مرتخية ⚪'}</div><div><b>الأربطة المعلقة:</b> ${near ? 'مرتخية' : 'مشدودة'}</div><div><b>العدسة:</b> ${near ? 'سميكة (أكثر تحدبًا) ← انكسار أكبر' : 'رقيقة ← انكسار أقل'}</div>`; if (d <= 5) seen.n = true; if (d >= 95) seen.f = true; if (seen.n) tasks.hit(0); if (seen.f) tasks.hit(1); if (seen.n && seen.f) tasks.hit(2); };

};

  const X = e => 50 + e * 8.5, Y = b => 260 - b * 4.7; const draw = e => { st.querySelector('#bt').innerHTML = VIS.bodyTempGraph().replace('</svg>', `<line x1="${X(e)}" y1="20" x2="${X(e)}" y2="260" stroke="#e2503f" stroke-dasharray="5 4" stroke-width="2"/></svg>`); ct.querySelector('#tbl').innerHTML = `<table class="tbl">${animals.map(a => { const b = clamp(a[1](e), 0, 45); return `<tr><td style="text-align:right">${a[0]}</td><td><b>${b.toFixed(1)}°C</b></td><td style="color:${a[2] ? '#b91c1c' : '#1d4ed8'}">${a[2] ? 'ثابت' : 'متغير'}</td><td>${b < 15 ? '😴 خامل' : b < 30 ? '🚶 بطيء' : '🏃 نشط'}</td></tr>`; }).join('')}</table>`; ct.querySelector('#ev').textContent = e; if (e === 5) tasks.hit(0); if (e === 40) tasks.hit(1); if (e === 5 || e === 40) tasks.hit(2); };

/* 15. تنظيم الجلوكوز */
SIMS.glucose = (mount, done) => {
  const { st, ct } = simShell(mount, `<div id="gl"></div>`, `<div class="ctlbox"><label>👤 الشخص</label><div class="seg" id="ps"><button data-p="0" class="on">سليم</button><button data-p="1">مصاب بالنوع الأول</button></div></div><div class="row"><button class="btn" id="eat">🍚 تناول وجبة نشوية</button><button class="btn sec" id="ins">💉 حقنة إنسولين</button></div><div class="ctlbox" id="gs"></div>`);
  const tasks = simTasks(mount, ['شاهد استجابة الشخص السليم لوجبة', 'شاهد استجابة المصاب لوجبة', 'أعطِ المصاب حقنة إنسولين'], done);
  let diab = 0, g = .5, ins = 0, hist = [], t = 0, raf; const X = i => 40 + i * 1.6, Y = v => 250 - v * 60;
  const draw = () => { st.querySelector('#gl').innerHTML = svgWrap(420, 300, `<line x1="40" y1="20" x2="40" y2="250" stroke="#123b32" stroke-width="2"/><line x1="40" y1="250" x2="400" y2="250" stroke="#123b32" stroke-width="2"/>${[0, 1, 2, 3].map(v => `<line x1="40" y1="${Y(v)}" x2="400" y2="${Y(v)}" stroke="#eef3f1"/>${T(26, Y(v) + 4, v, { s: 10 })}`).join('')}<rect x="40" y="${Y(.9)}" width="360" height="${Y(.4) - Y(.9)}" fill="#dcf5e9" opacity=".6"/>${T(220, Y(.65) + 4, 'المدى الطبيعي', { s: 10, f: '#0b6b43' })}${hist.length > 1 ? `<polyline points="${hist.map((v, i) => X(i) + ',' + Y(v)).join(' ')}" fill="none" stroke="${diab ? '#e2503f' : '#0f9d76'}" stroke-width="3"/>` : ''}${T(220, 285, 'الزمن ←', { s: 11 })}`); ct.querySelector('#gs').innerHTML = `<div>الجلوكوز: <span class="readout" style="color:${g > 1.2 ? '#b91c1c' : g < .4 ? '#b45309' : '#0b6b43'}">${g.toFixed(2)}</span></div><div>الإنسولين: <b>${ins > .05 ? '🟢 يُفرز' : '⚪ لا'}</b></div><div class="note">${diab ? 'البنكرياس لا يفرز الإنسولين ← الجلوكوز يبقى مرتفعًا' : 'ارتفاع الجلوكوز ← البنكرياس يفرز الإنسولين ← الكبد يحوله إلى جلايكوجين'}</div>`; };
  const loop = () => { t++; if (!diab && g > .9) ins = Math.min(1, ins + .08); else ins *= .9; g += (.5 - g) * (diab ? .0012 : .003) - ins * .05; g = Math.max(.3, g); if (t % 3 === 0) { hist.push(g); if (hist.length > 220) hist.shift(); draw(); } raf = requestAnimationFrame(loop); };
  ct.querySelectorAll('#ps button').forEach(b => b.onclick = () => { ct.querySelectorAll('#ps button').forEach(x => x.classList.remove('on')); b.classList.add('on'); diab = +b.dataset.p; hist = []; g = .5; ins = 0; draw(); });
  ct.querySelector('#eat').onclick = () => { Sfx.pop(); g += diab ? 2.6 : 1; if (!diab) tasks.hit(0); else tasks.hit(1); };
  ct.querySelector('#ins').onclick = () => { Sfx.pop(); ins = 1; if (diab) tasks.hit(2); };
  draw(); loop(); const obs = new MutationObserver(() => { if (!document.body.contains(mount)) { cancelAnimationFrame(raf); obs.disconnect(); } }); obs.observe(document.body, { childList: true, subtree: true });
};

/* 16. الجلد ومنظم الحرارة */
SIMS.skinthermo = (mount, done) => {
