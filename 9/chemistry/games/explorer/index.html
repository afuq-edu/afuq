<style>
:root{
  --bg1:#0b1026;--bg2:#141b3d;--card:rgba(255,255,255,.07);--card2:rgba(255,255,255,.12);--line:rgba(255,255,255,.14);
  --txt:#f4f6ff;--muted:#aab3d6;--acc:#22d3ee;--acc2:#a78bfa;--ok:#22c55e;--bad:#ef4444;--warn:#f59e0b;--gold:#fbbf24;
  --r:22px;--sh:0 10px 40px rgba(0,0,0,.35);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;min-height:100%}
body{font-family:'Cairo','Tajawal',system-ui,sans-serif;background:radial-gradient(1200px 800px at 80% -10%,#2a2f6b 0%,transparent 60%),radial-gradient(900px 700px at -10% 110%,#0f4c5c 0%,transparent 55%),linear-gradient(160deg,var(--bg1),var(--bg2));color:var(--txt);overflow-x:hidden;direction:rtl}
#bgc{position:fixed;inset:0;z-index:0;opacity:.55;pointer-events:none}
#app{position:relative;z-index:1;max-width:1180px;margin:0 auto;padding:12px 14px 60px}
button{font-family:inherit;cursor:pointer;border:none;color:inherit}
.hdr{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--card);border:1px solid var(--line);border-radius:18px;backdrop-filter:blur(12px);position:sticky;top:8px;z-index:50;box-shadow:var(--sh)}
.hdr .logo{display:flex;align-items:center;gap:10px;font-weight:900;font-size:1.15rem;flex:1;min-width:0}
.hdr .logo .ic{font-size:1.6rem;filter:drop-shadow(0 0 10px var(--acc))}
.hdr .logo small{display:block;font-size:.75rem;color:var(--muted);font-weight:600}
.ib{width:42px;height:42px;border-radius:12px;background:var(--card2);font-size:1.2rem;display:grid;place-items:center;transition:.2s;border:1px solid var(--line)}
.ib:hover{transform:translateY(-2px);background:rgba(255,255,255,.2)}
.ib.off{opacity:.45;text-decoration:line-through}
.crumbs{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:14px 4px 6px;color:var(--muted);font-size:.9rem}
.crumbs span{cursor:pointer}.crumbs span:hover{color:var(--acc)}
.hero{position:relative;padding:36px 26px;border-radius:var(--r);background:linear-gradient(135deg,rgba(34,211,238,.18),rgba(167,139,250,.18));border:1px solid var(--line);margin:16px 0 22px;overflow:hidden}
.hero h1{margin:0 0 6px;font-size:clamp(1.5rem,4vw,2.4rem);font-weight:900}
.hero p{margin:0;color:var(--muted);font-size:1.05rem}
.hero .flask{position:absolute;left:24px;top:50%;transform:translateY(-50%);font-size:5rem;animation:float 4s ease-in-out infinite;filter:drop-shadow(0 0 22px rgba(34,211,238,.6))}
@keyframes float{0%,100%{transform:translateY(-50%) rotate(-6deg)}50%{transform:translateY(-62%) rotate(6deg)}}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.chip{background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-weight:700;font-size:.9rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.ucard{position:relative;padding:22px 20px;border-radius:var(--r);background:var(--card);border:1px solid var(--line);cursor:pointer;transition:.25s;overflow:hidden;min-height:170px;display:flex;flex-direction:column;gap:8px}
.ucard:hover{transform:translateY(-6px) scale(1.01);background:var(--card2);box-shadow:var(--sh)}
.ucard::before{content:"";position:absolute;inset:0;background:radial-gradient(300px 160px at 90% 0%,var(--uc) 0%,transparent 70%);opacity:.35}
.ucard .ic{font-size:2.6rem;filter:drop-shadow(0 0 12px var(--uc))}
.ucard .num{font-size:.8rem;color:var(--muted);font-weight:700}
.ucard h3{margin:0;font-size:1.25rem;font-weight:900}
.ucard .meta{margin-top:auto;display:flex;justify-content:space-between;align-items:center;font-size:.85rem;color:var(--muted)}
.ring{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;font-size:.75rem;font-weight:800;background:conic-gradient(var(--uc) calc(var(--p)*1%),rgba(255,255,255,.12) 0);position:relative}
.ring::after{content:"";position:absolute;inset:6px;border-radius:50%;background:#171d44}
.ring b{position:relative;z-index:1}
.lcard{display:flex;align-items:center;gap:14px;padding:16px 18px;border-radius:18px;background:var(--card);border:1px solid var(--line);cursor:pointer;transition:.2s;margin-bottom:12px}
.lcard:hover{background:var(--card2);transform:translateX(-4px)}
.lcard .ic{font-size:2rem;width:56px;height:56px;border-radius:16px;display:grid;place-items:center;background:rgba(0,0,0,.25);border:1px solid var(--line)}
.lcard .t{flex:1;min-width:0}.lcard .t b{font-size:1.1rem;display:block}.lcard .t small{color:var(--muted)}
.dots{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}
.dot{width:12px;height:12px;border-radius:50%;background:rgba(255,255,255,.15);border:1px solid var(--line)}
.dot.on{background:var(--ok);box-shadow:0 0 8px var(--ok)}
.stars{color:var(--gold);letter-spacing:2px;font-size:1rem}
.sec-title{display:flex;align-items:center;gap:10px;margin:22px 4px 12px;font-size:1.3rem;font-weight:900}
.sec-title .ln{flex:1;height:1px;background:var(--line)}
.btn{display:inline-flex;align-items:center;gap:8px;padding:12px 22px;border-radius:14px;font-weight:800;font-size:1rem;background:linear-gradient(135deg,var(--acc),#0ea5e9);color:#06202a;transition:.2s;box-shadow:0 6px 20px rgba(34,211,238,.3)}
.btn:hover{transform:translateY(-2px);filter:brightness(1.08)}
.btn.sec{background:var(--card2);color:var(--txt);box-shadow:none;border:1px solid var(--line)}
.btn.pur{background:linear-gradient(135deg,#a78bfa,#7c3aed);color:#fff;box-shadow:0 6px 20px rgba(124,58,237,.35)}
.btn.grn{background:linear-gradient(135deg,#34d399,#16a34a);color:#03230f;box-shadow:0 6px 20px rgba(22,163,74,.35)}
.btn.org{background:linear-gradient(135deg,#fbbf24,#f97316);color:#2a1200;box-shadow:0 6px 20px rgba(249,115,22,.35)}
.btn.sm{padding:8px 14px;font-size:.9rem;border-radius:11px}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
.tab{padding:10px 16px;border-radius:14px;background:var(--card);border:1px solid var(--line);font-weight:800;transition:.2s;display:flex;align-items:center;gap:6px}
.tab.on{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#0b1026}
.tab .ok{font-size:.8rem}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px;animation:pop .35s ease}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}
.lhead{display:flex;align-items:center;gap:16px;padding:18px 22px;border-radius:var(--r);background:linear-gradient(135deg,var(--uc),transparent 70%),var(--card);border:1px solid var(--line);margin-top:10px}
.lhead .ic{font-size:3rem}.lhead h2{margin:0;font-size:1.5rem;font-weight:900}.lhead small{color:var(--muted);display:block;margin-top:4px}
.obj{display:grid;gap:10px}
.obj li{list-style:none;background:rgba(0,0,0,.2);padding:12px 16px;border-radius:14px;border-right:4px solid var(--acc);animation:slideIn .4s ease both}
.obj li:nth-child(2){animation-delay:.08s}.obj li:nth-child(3){animation-delay:.16s}.obj li:nth-child(4){animation-delay:.24s}
@keyframes slideIn{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:none}}
.terms{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.term{background:rgba(0,0,0,.22);border:1px solid var(--line);border-radius:16px;padding:14px;cursor:pointer;transition:.2s;position:relative;min-height:90px}

          slides: [
            {title:"الحالات الفيزيائية الثلاث", body:"توجد المادة في ثلاث حالات فيزيائية: الصلبة والسائلة والغازية.\nيمكن للمادة أن تتحول من حالة إلى أخرى بالتسخين أو التبريد، وتسمى هذه التحولات: الانصهار والتجمد والتبخر والغليان والتكثف.", visual:{type:"states", label:"التحولات بين حالات المادة"}, note:"أيّ التحولات يحتاج إلى تسخين؟ وأيّها يحدث عند التبريد؟"},
            {title:"الجسيمات في الحالة الصلبة", body:"ينصّ النموذج الجسيمي الحركي على أن المادة تتكوّن من جسيمات صغيرة جدًا.\nفي المادة الصلبة تستقرّ الجسيمات في مواقع ثابتة وضمن شبكة منتظمة، ويمكن للجسيمات فقط أن تهتز في مواقعها الثابتة.", visual:{type:"particles", state:"solid", label:"صلب: جسيمات متراصّة تهتز في مكانها"}},
            {title:"الجسيمات في الحالة السائلة", body:"في السائل تكون الجسيمات متقاربة لكنها غير مرتبة، وتتحرك حركة عشوائية فتنزلق بعضها فوق بعض.\nلذلك يأخذ السائل شكل الإناء الذي يوضع فيه، لكن حجمه ثابت.", visual:{type:"particles", state:"liquid", label:"سائل: جسيمات متقاربة تتحرك عشوائيًا"}},
            {title:"الجسيمات في الحالة الغازية", body:"تكون الجسيمات في الغاز متباعدة، وتكون حركتها عشوائية وسريعة ومستمرة.\nتتصادم جسيمات الغاز فيرتدّ بعضها عن بعض في اتجاهات مختلفة، لذا يملأ الغاز أي وعاء يوضع فيه ويمكن ضغطه.", visual:{type:"particles", state:"gas", label:"غاز: جسيمات متباعدة وسريعة"}},
            {title:"قراءة منحنى التسخين", body:"يوضّح المنحنى تسخين مادة نقية. عند النقطة A تكون المادة صلبة، وعند B (الجزء الأفقي الأول) تنصهر فتكون صلبة وسائلة معًا.\nعند C تكون سائلة، وعند D (الجزء الأفقي الثاني) تغلي فتكون سائلة وغازية معًا.\nدرجة الانصهار هنا 17°C ودرجة الغليان 115°C.", visual:{type:"curve", kind:"heating", mp:17, bp:115, unit:"°C", labels:["صلب","صلب+سائل","سائل","سائل+غاز","غاز"]}, note:"عند أي نقطة تكون المادة في حالتين معًا؟"},
            {title:"لماذا تثبت درجة الحرارة أثناء تغيُّر الحالة؟", body:"أثناء الانصهار والغليان تبقى درجة الحرارة ثابتة رغم استمرار التسخين.\nالسبب أن الطاقة الحرارية تُستخدم في التغلّب على قوى التجاذب بين الجسيمات وليس في زيادة سرعتها.\nبعد اكتمال تغيُّر الحالة تعود درجة الحرارة إلى الارتفاع.", visual:{type:"icons", items:[{icon:"🔥", label:"تسخين مستمر"},{icon:"🔗", label:"كسر قوى التجاذب"},{icon:"🌡️", label:"درجة حرارة ثابتة"},{icon:"📈", label:"ارتفاع بعد اكتمال التحول"}]}},

            {title:"جدول بيانات المواد (1-1)", body:"نستخدم درجتي الانصهار والغليان لتحديد حالة المادة عند 25°C: إذا كانت 25°C أقل من درجة الانصهار فالمادة صلبة، وإذا كانت بين الدرجتين فهي سائلة، وإذا كانت أعلى من درجة الغليان فهي غاز.\nغلت عيّنة من حمض الإيثانويك عند 121°C بدل 118°C، فهي غير نقية لأن الشوائب ترفع درجة الغليان.", visual:{type:"table", head:["المادة","درجة الانصهار (°C)","درجة الغليان (°C)"], rows:[["الصوديوم","98","883"],["الرادون","-71","-62"],["الإيثانول","-117","78"],["الكوبالت","1492","2900"],["النيتروجين","-210","-196"],["البروبان","-188","-42"],["حمض الإيثانويك","16","118"]]}, note:"أيّ المواد تكون غازًا عند 25°C؟"},
            {title:"قوى التماسك بين الجسيمات", body:"كلما كانت قوى التماسك بين الجسيمات أقوى احتاجت المادة إلى طاقة أكبر لتغيير حالتها.\nينصهر الكبريت عند 115°C والجليد عند 0°C، إذن قوى التماسك بين جسيمات الكبريت أقوى.\nيتكثّف الإيثانول تحت 78°C والماء تحت 100°C، إذن قوى التماسك بين جسيمات الإيثانول أضعف.", visual:{type:"bar", items:[{label:"الجليد (انصهار)", value:0, color:"#38bdf8"},{label:"الكبريت (انصهار)", value:115, color:"#eab308"},{label:"الإيثانول (غليان)", value:78, color:"#a78bfa"},{label:"الماء (غليان)", value:100, color:"#0ea5e9"}], unit:"°C"}},

            {title:"العدد الذرّي والعدد الكتلي", body:"العدد الذرّي = عدد البروتونات.\nالعدد الكتلي = عدد البروتونات + عدد النيوترونات.\nلذلك: عدد النيوترونات = العدد الكتلي - العدد الذرّي.\nوفي الذرّة المتعادلة: عدد الإلكترونات = عدد البروتونات.", visual:{type:"text", big:"²³₁₁Na", caption:"العدد الكتلي 23 في الأعلى، والعدد الذرّي 11 في الأسفل"}},
            {title:"توزيع الإلكترونات على مستويات الطاقة", body:"تتوزع الإلكترونات في الذرّة على سلسلة من مستويات الطاقة التي تحيط بالنواة، حيث يتم ملء مستوى الطاقة الأقرب إلى النواة أولًا، ثم ينتقل لملء مستوى الطاقة التالي.\nأقصى عدد: 2 في المستوى الأول، و8 في الثاني، و8 في الثالث؛ فيكون المجموع 18 إلكترونًا عندما تمتلئ المستويات الثلاثة.", visual:{type:"atom", symbol:"Ar", p:18, n:22, shells:[2,8,8]}},
            {title:"النظائر", body:"جميع الذرّات التي تنتمي إلى العنصر نفسه تحتوي على العدد نفسه من البروتونات والإلكترونات، أمّا الذرّات التي تنتمي إلى العنصر نفسه لكنها تختلف في أعداد النيوترونات فتُسمّى نظائر.\nمثال: الكلور-35 والكلور-37 كلاهما 17 بروتونًا، لكن الأول 18 نيوترونًا والثاني 20 نيوترونًا.", visual:{type:"compare", left:{title:"Cl-35", items:["17 بروتونًا","18 نيوترونًا","17 إلكترونًا"]}, right:{title:"Cl-37", items:["17 بروتونًا","20 نيوترونًا","17 إلكترونًا"]}}},
            {title:"تشيرنوبيل والنظائر المشعّة", body:"في العام 1986 نتج عن انفجار تشيرنوبيل في أوكرانيا سحابة تحتوي على نظائر مشعّة مختلفة، منها السترونشيوم-90 واليود-131 والسيزيوم-137.\nالنظائر المشعّة غير مستقرة وتطلق إشعاعات قد تضر الخلايا الحيّة.", visual:{type:"table", head:["النظير","العدد الذرّي","العدد الكتلي","بروتونات","نيوترونات","إلكترونات"], rows:[["السترونشيوم-90","38","90","38","52","38"],["اليود-131","53","131","53","78","53"],["السيزيوم-137","55","137","55","82","55"]]}},
            {title:"استخدامات النشاط الإشعاعي", body:"رغم مخاطرها، للنظائر المشعّة استخدامات مفيدة: تتبّع المركّبات في الأبحاث الطبية والحيوية، وعلاج بعض الأمراض مثل استخدام اليود-131 في علاج الغدة الدرقية، وتقدير عمر المواد باستخدام الكربون-14.", visual:{type:"icons", items:[{icon:"🏥", label:"الطب والعلاج"},{icon:"🔬", label:"تتبّع المركّبات في الأبحاث"},{icon:"🦴", label:"تقدير عمر المواد (C-14)"},{icon:"☢️", label:"خطر على الخلايا الحيّة"}]}},

            {title:"الترتيب يحدّد الخصائص", body:"تكتسب الذرّة خصائصها المميّزة من طريقة ترتيب الجسيمات المكوّنة لها.\nوسواء كانت الذرّة مشعّة أو لا، فإن نوع الرابطة التي تشكّلها، وتفاعلها الكيميائي وموقعها في الجدول الدوري، تعتمد كلها على هذا الترتيب.", visual:{type:"icons", items:[{icon:"☢️", label:"هل الذرّة مشعّة؟"},{icon:"🔗", label:"نوع الرابطة"},{icon:"⚗️", label:"التفاعل الكيميائي"},{icon:"🧮", label:"الموقع في الجدول الدوري"}]}},

            {title:"أثر التركيز", body:"يؤثر في التفاعلات التي تتضمّن محاليل أو غازات.\nإن أي زيادة في تركيز أحد المتفاعلات أو كليهما تعني أن هناك المزيد من الجسيمات المتوفرة في الحجم (الحيّز) نفسه.\nيزيد معدل سرعة التفاعل لأن الجسيمات تتصادم بشكل أكثر تكرارًا.", visual:{type:"compare", left:{title:"تركيز منخفض", items:["جسيمات قليلة في الحجم","تصادمات أقل","تفاعل أبطأ"]}, right:{title:"تركيز مرتفع", items:["جسيمات أكثر في الحجم","تصادمات أكثر تكرارًا","تفاعل أسرع"]}}},
            {title:"أثر درجة الحرارة", body:"يؤثر في جميع التفاعلات.\nارتفاع درجة الحرارة يعني أن الجسيمات تتحرك بشكل أسرع وتتصادم بشكل أكثر، وتمتلك الجسيمات أيضًا طاقة أكبر عندما تتصادم، فيزيد عدد التصادمات التي تتخطى طاقة التنشيط.\nيؤدي ذلك إلى زيادة معدل سرعة التفاعل.", visual:{type:"gauge", label:"ارتفاع الحرارة ← تصادمات أكثر وأقوى", value:85, color:"#ef4444"}},
            {title:"أثر مساحة سطح التفاعل", body:"يؤثر في تفاعلات المواد الصلبة والسائلة، أو المواد الصلبة والغازية، أو مخاليط المواد الصلبة.\nاستخدام الكتلة نفسها من المادة الصلبة لكن بتحويلها إلى قطع أصغر أو مسحوق يزيد المساحة المعرّضة للتصادم.\nيؤدي إلى زيادة كبيرة في معدل سرعة التفاعل.", visual:{type:"icons", items:[{icon:"🪨", label:"قطعة كبيرة: سطح قليل"},{icon:"🧱", label:"قطع صغيرة: سطح أكبر"},{icon:"🧂", label:"مسحوق: أكبر مساحة سطحية"}]}},
            {title:"أثر العامل الحفاز", body:"يمكن تسريع التفاعلات البطيئة عبر إضافة عامل حفاز مناسب.\nيعمل العامل الحفاز على التقليل من قيمة طاقة التنشيط اللازمة لحدوث التفاعل، فيصبح عدد أكبر من التصادمات فعّالًا.\nتكون كتلة العامل الحفاز هي نفسها في نهاية التفاعل.", visual:{type:"energy", kind:"exo", reactants:"المتفاعلات", products:"النواتج", label:"العامل الحفاز يقدّم مسارًا بطاقة تنشيط أقل"}},
            {title:"العوامل الحفازة والإنزيمات", body:"تزيد العوامل الحفازة سرعة التفاعل الكيميائي دون أن تتأثر في أي شيء آخر. تُستخدم كي تُحدث التفاعلات بشكل أسرع، أو يمكن استخدامها كي يحدث التفاعل عند درجة حرارة أقل.\nلا تُستهلك خلال التفاعل ويمكن استخدامها أكثر من مرة، وغالبًا ما تتكوّن من الفلزات الانتقالية أو من مركّباتها.\nتتحكم العوامل الحفازة الحيوية التي تسمى الإنزيمات بجميع التفاعلات الكيميائية التي تحدث في الخلايا الحيّة.", visual:{type:"icons", items:[{icon:"⏩", label:"تسرّع التفاعل"},{icon:"❄️", label:"تسمح بحرارة أقل"},{icon:"♻️", label:"لا تُستهلك"},{icon:"🔩", label:"فلزات انتقالية أو مركّباتها"},{icon:"🧬", label:"الإنزيمات: حفازات حيوية"}]}},
            {title:"تفاعل ثيوكبريتات الصوديوم مع الحمض", body:"عند إضافة محلول ثيوكبريتات الصوديوم إلى حمض الهيدروكلوريك يتكوّن الكبريت، فيصبح المخلوط معكّرًا تدريجيًا حتى تختفي علامة X المرسومة تحت الدورق.\nالنواتج الأخرى: كلوريد الصوديوم وثنائي أكسيد الكبريت والماء.\nنقيس المدة الزمنية حتى تختفي العلامة.", visual:{type:"equation", text:"Na₂S₂O₃ + 2HCl → 2NaCl + S + SO₂ + H₂O", caption:"تكوّن راسب الكبريت الأصفر يعكّر المخلوط"}},
            {title:"نتائج الثيوكبريتات (ورقة العمل 5-2)", body:"خُلطت كميات مختلفة من محلول الثيوكبريتات (0.15 mol/L) مع الماء، وبقي حجم الحمض (1 mol/L) ثابتًا 5 mL لتكون المقارنة عادلة.\nالمتغيّر الذي نتابعه هو تركيز الثيوكبريتات. كلما زاد تركيزها قلّت مدة التفاعل؛ فالتجربة 1 (أعلى تركيز) أسرعها.", visual:{type:"table", head:["التجربة","Na₂S₂O₃ (mL)","الماء (mL)","الحمض (mL)","مدة التفاعل (s)"], rows:[["1","50","0","5","5"],["2","40","10","5","13"],["3","30","20","5","27"],["4","20","30","5","56"],["5","10","40","5","180"]]}}

            {title:"تجربة هاشم", body:"أجرى الطالب هاشم استقصاءً مستخدمًا التفاعل بين المغنيسيوم وحمض الكبريتيك.\nفي كل تجربة أخذ 10 mL من حمض الكبريتيك بتراكيز مختلفة وسجّل درجة حرارته، ثم أضاف 0.1 g من شريط المغنيسيوم، ثم قاس حجم الغاز الناتج في أول 30 ثانية وسجّل درجة الحرارة عند توقف التفاعل.\nثبّت كميات المغنيسيوم وحمض الكبريتيك في كل تجربة ليكون الاختبار موثوقًا.", visual:{type:"equation", text:"Mg + H₂SO₄ → MgSO₄ + H₂", caption:"تفاعل طارد للحرارة ينتج غاز الهيدروجين"}},

            {title:"التركيز والارتفاع في درجة الحرارة", body:"كلما زاد تركيز الحمض زاد الفرق في درجة الحرارة.\nعند التركيز الأعلى يكون التفاعل أسرع، فتنطلق الحرارة في زمن أقصر ولا تجد وقتًا كافيًا لتتسرّب إلى المحيط، فترتفع درجة حرارة الخليط أكثر.", visual:{type:"bar", items:[{label:"1.00", value:32, color:"#dc2626"},{label:"0.67", value:23, color:"#ea580c"},{label:"0.50", value:17, color:"#f59e0b"},{label:"0.40", value:13, color:"#eab308"},{label:"0.33", value:9, color:"#84cc16"},{label:"0.25", value:6, color:"#22c55e"},{label:"0.20", value:4, color:"#10b981"}], unit:"°C"}, note:"المحور الأفقي: تركيز الحمض (mol/L)."},
            {title:"ماذا يخبرنا حجم الغاز؟", body:"حجم الغاز الناتج في أول 30 ثانية مقياس لمعدل سرعة التفاعل: حجم أكبر في الزمن نفسه يعني تفاعلًا أسرع.\nعند 1.00 mol/L نتج 42 mL، بينما عند 0.20 mol/L نتج 7 mL فقط.\nعُرض المحور الأفقي بمقياس تناقصي، فكلما تناقص التركيز زاد تخفيف المحلول، والتشديد في الرسم يكون على أثر التركيز.", visual:{type:"bar", items:[{label:"1.00", value:42, color:"#3b82f6"},{label:"0.67", value:27, color:"#3b82f6"},{label:"0.50", value:21, color:"#3b82f6"},{label:"0.40", value:17, color:"#3b82f6"},{label:"0.33", value:13, color:"#3b82f6"},{label:"0.25", value:10, color:"#3b82f6"},{label:"0.20", value:7, color:"#3b82f6"}], unit:"mL"}},

            {title:"أكياس تدفئة اليدين", body:"تعتمد أكياس تدفئة اليدين أيضًا على تفاعلات طاردة للحرارة، مثل أكسدة مسحوق الحديد بأكسجين الهواء بوجود الماء والملح، فتنطلق حرارة لعدة ساعات.\nومن الأمثلة الأخرى على التفاعلات الطاردة المستخدمة في علب التسخين الذاتي تفاعل أكسيد الكالسيوم مع الماء.", visual:{type:"beaker", label:"تفاعل طارد: ارتفاع درجة الحرارة", color:"#fb923c", bubbles:false, precipitate:true}},
            {title:"كمادات التبريد", body:"هناك نوعان من كمادات التبريد:\n1) كمادات التبريد الفوري: تحتوي على مادة صلبة (عادةً نترات الأمونيوم) تذوب في الماء بشكل ماص للحرارة، ويبقى الماء منفصلًا في كيس بلاستيكي يُشق لتنشيط الكمادة.\n2) كمادات «الجل»: يتم تبريدها في المجمّد وتسخن ببطء عند إخراجها، ويمكن إعادة استخدامها.", visual:{type:"compare", left:{title:"التبريد الفوري", items:["ميزة: تعمل فورًا دون مجمّد","عيب: تُستخدم مرة واحدة فقط"]}, right:{title:"كمادات الجل", items:["ميزة: يمكن إعادة استخدامها","عيب: تحتاج إلى مجمّد مسبقًا"]}}},
            {title:"قراءة تمثيلات تغيّر الحرارة (ورقة العمل 5-3)", body:"في التمثيل البياني (أ) ترتفع درجة الحرارة من 20°C إلى نحو 50°C ثم تنخفض ببطء: التغيّر طارد للحرارة.\nفي التمثيل البياني (ب) تنخفض درجة الحرارة من 50°C إلى نحو 12°C ثم ترتفع ببطء: التغيّر ماص للحرارة.\nالتغيّر البطيء بعد ذلك سببه تبادل الحرارة مع المحيط.", visual:{type:"compare", left:{title:"التمثيل (أ)", items:["الحرارة ترتفع","طارد للحرارة"]}, right:{title:"التمثيل (ب)", items:["الحرارة تنخفض","ماص للحرارة"]}}},
            {title:"حرارة تفاعل الفلزات مع الحمض (ورقة العمل 5-4)", body:"تُعدّ تفاعلات الأحماض مع الفلزات من التفاعلات الطاردة للحرارة. قيست درجات الحرارة باستخدام ميزان حرارة، وبدأت جميعها عند 19°C.\nالمغنيسيوم (النهاية 57°C، الفرق 38°C) أكبرها لأنه أنشط الفلزات الثلاثة، ثم الخارصين (النهاية 30°C، الفرق 11°C)، ثم النيكل (النهاية 24°C، الفرق 5°C).\nلزيادة تغيّر الحرارة بالكمية نفسها من الفلز: استخدم الفلز مسحوقًا وعزل الوعاء حراريًا (كوب بوليسترين).", visual:{type:"bar", items:[{label:"المغنيسيوم", value:38, color:"#ef4444"},{label:"الخارصين", value:11, color:"#f59e0b"},{label:"النيكل", value:5, color:"#22c55e"}], unit:"°C"}}

<script>
(function(){
'use strict';
const B = window.BOOK;
const $ = (s, r=document) => r.querySelector(s);
const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html !== undefined) e.innerHTML = html; return e; };
const esc = s => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const LTR_RE = /[A-Za-z0-9Δ][A-Za-z0-9₀-₉⁰-⁹⁺⁻²³¹×·•⦵Δ\[\].,%°()\/+\-−=→⇌ ]*[A-Za-z0-9₀-₉⁰-⁹⁺⁻²³¹⦵%°)\]]/g;
const TX = s => esc(s).replace(LTR_RE, m => { let t = m; while ((t.endsWith(')') && (t.split('(').length < t.split(')').length)) || (t.endsWith(']') && (t.split('[').length < t.split(']').length))) t = t.slice(0,-1); const rest = m.slice(t.length); if (!/[A-Za-z0-9]/.test(t) || t.length < 2) return m; return '<bdi dir="ltr">' + t + '</bdi>' + rest; });
const shuffle = a => { a = a.slice(); for (let i = a.length-1; i>0; i--) { const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]] = [a[j],a[i]]; } return a; };
const app = $('#app');
const KEY = 'chem_g' + B.grade + '_v1';
const GAME_ICON = {quiz:'❓',truefalse:'✅',match:'🔗',order:'🔢',fill:'✍️',sort:'🗂️',memory:'🧠',wheel:'🎡',wordguess:'🔤',balance:'⚖️',calc:'🧮',speed:'⚡',hotcold:'🔥'};
const GAME_NAME = {quiz:'اختيار من متعدد',truefalse:'صح أم خطأ',match:'توصيل',order:'ترتيب',fill:'أكمل الفراغ',sort:'تصنيف',memory:'بطاقات الذاكرة',wheel:'عجلة الأسئلة',wordguess:'خمّن المصطلح',balance:'وزن المعادلات',calc:'حسابات',speed:'تحدي السرعة',hotcold:'أيهما؟'};

/* ---------- state / progress ---------- */
let P = {}; try { P = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch(e) { P = {}; }
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(P)); } catch(e){} };
const lp = id => (P[id] = P[id] || {games:{}, slides:0});
let settings = {sfx:true, tts:true}; try { Object.assign(settings, JSON.parse(localStorage.getItem(KEY+'_set')||'{}')); } catch(e){}
const saveSet = () => { try { localStorage.setItem(KEY+'_set', JSON.stringify(settings)); } catch(e){} };

/* ---------- audio ---------- */
let AC = null;
const ac = () => { if (!AC) { try { AC = new (window.AudioContext||window.webkitAudioContext)(); } catch(e){} } if (AC && AC.state === 'suspended') AC.resume(); return AC; };
function tone(f, t, type='sine', vol=.18, when=0) { const c = ac(); if (!c || !settings.sfx) return; const o = c.createOscillator(), g = c.createGain(); o.type = type; o.frequency.value = f; g.gain.setValueAtTime(vol, c.currentTime+when); g.gain.exponentialRampToValueAtTime(.0001, c.currentTime+when+t); o.connect(g); g.connect(c.destination); o.start(c.currentTime+when); o.stop(c.currentTime+when+t+.02); }
const SFX = {
  click: () => tone(600,.06,'triangle',.08),
  flip: () => { tone(400,.08,'sine',.1); tone(700,.1,'sine',.08,.05); },
  ok: () => { tone(523,.12,'sine',.18); tone(659,.12,'sine',.18,.1); tone(784,.2,'sine',.18,.2); },
  bad: () => { tone(200,.25,'sawtooth',.12); tone(150,.3,'sawtooth',.1,.1); },
  win: () => { [523,659,784,1047,1319].forEach((f,i)=>tone(f,.25,'triangle',.16,i*.11)); },
  tick: () => tone(900,.03,'square',.05),
  spin: () => { for (let i=0;i<20;i++) tone(300+i*40,.04,'square',.04,i*.12); },
  select: () => tone(880,.07,'sine',.1),
  star: () => { tone(1200,.1,'sine',.12); tone(1600,.15,'sine',.12,.08); }
};
/* ---------- TTS ---------- */
let voice = null;
function pickVoice(){ if (!('speechSynthesis' in window)) return; const vs = speechSynthesis.getVoices(); voice = vs.find(v=>/^ar/i.test(v.lang) && /google|natural|premium/i.test(v.name)) || vs.find(v=>/^ar/i.test(v.lang)) || null; }
if ('speechSynthesis' in window) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function speak(text){ if (!settings.tts || !('speechSynthesis' in window)) return; try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(String(text).replace(/[_]{2,}/g,' فراغ ')); u.lang = 'ar-SA'; if (voice) u.voice = voice; u.rate = .95; u.pitch = 1; speechSynthesis.speak(u); } catch(e){} }
function stopSpeak(){ if ('speechSynthesis' in window) speechSynthesis.cancel(); }
const spkBtn = (text, cls='ib') => { const b = el('button', cls, '🔊'); b.title = 'استمع'; b.onclick = e => { e.stopPropagation(); SFX.click(); speak(text); }; return b; };

/* ---------- background molecules ---------- */
(function bg(){ const c = $('#bgc'), x = c.getContext('2d'); let w, h, pts = []; const rs = () => { w = c.width = innerWidth; h = c.height = innerHeight; }; addEventListener('resize', rs); rs(); for (let i=0;i<45;i++) pts.push({x:Math.random()*w, y:Math.random()*h, vx:(Math.random()-.5)*.35, vy:(Math.random()-.5)*.35, r:2+Math.random()*3}); (function loop(){ x.clearRect(0,0,w,h); for (const p of pts){ p.x+=p.vx; p.y+=p.vy; if(p.x<0||p.x>w)p.vx*=-1; if(p.y<0||p.y>h)p.vy*=-1; } x.strokeStyle='rgba(34,211,238,.12)'; for (let i=0;i<pts.length;i++) for (let j=i+1;j<pts.length;j++){ const a=pts[i],b=pts[j],d=Math.hypot(a.x-b.x,a.y-b.y); if(d<140){ x.globalAlpha=1-d/140; x.beginPath(); x.moveTo(a.x,a.y); x.lineTo(b.x,b.y); x.stroke(); } } x.globalAlpha=1; for (const p of pts){ x.fillStyle='rgba(167,139,250,.5)'; x.beginPath(); x.arc(p.x,p.y,p.r,0,7); x.fill(); } requestAnimationFrame(loop); })(); })();
/* ---------- confetti ---------- */
function confetti(n=120){ const c = $('#confetti'), x = c.getContext('2d'); c.width = innerWidth; c.height = innerHeight; const ps = []; const cols = ['#22d3ee','#a78bfa','#fbbf24','#22c55e','#f472b6','#f97316']; for (let i=0;i<n;i++) ps.push({x:Math.random()*c.width, y:-20-Math.random()*200, vy:2+Math.random()*4, vx:(Math.random()-.5)*3, s:6+Math.random()*8, c:cols[i%cols.length], r:Math.random()*6.28, vr:(Math.random()-.5)*.3}); let t = 0; (function loop(){ x.clearRect(0,0,c.width,c.height); t++; for (const p of ps){ p.x+=p.vx; p.y+=p.vy; p.r+=p.vr; x.save(); x.translate(p.x,p.y); x.rotate(p.r); x.fillStyle=p.c; x.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6); x.restore(); } if (t<220) requestAnimationFrame(loop); else x.clearRect(0,0,c.width,c.height); })(); }
function toast(msg){ const t = el('div','toast',msg); document.body.appendChild(t); setTimeout(()=>t.remove(),2200); }

/* ---------- helpers ---------- */
const allLessons = []; B.units.forEach(u => u.lessons.forEach(l => { l._u = u; l._id = 'L' + l.num; allLessons.push(l); }));
function lessonScore(l){ const p = lp(l._id); const parts = []; parts.push(p.pre ?? 0); parts.push(Math.min(100, Math.round((p.slides||0)/l.slides.length*100))); const gs = l.games.map((g,i)=>p.games[i] ?? 0); parts.push(gs.reduce((a,b)=>a+b,0)/l.games.length); parts.push(p.post ?? 0); return Math.round(parts.reduce((a,b)=>a+b,0)/parts.length); }
function unitScore(u){ return Math.round(u.lessons.reduce((a,l)=>a+lessonScore(l),0)/u.lessons.length); }
function stars(pct){ const n = pct>=90?3:pct>=60?2:pct>=30?1:0; return '★'.repeat(n)+'☆'.repeat(3-n); }
function pctOf(score,total){ return total ? Math.round(score/total*100) : 0; }

/* ---------- header ---------- */
function header(){
  const h = el('div','hdr');
  const logo = el('div','logo'); logo.innerHTML = `<span class="ic">⚗️</span><div>${TX(B.subject)} – ${TX(B.gradeName)}<small>${TX(B.bookName)}</small></div>`; logo.style.cursor='pointer'; logo.onclick = ()=>go('#home');
  h.appendChild(logo);
  const home = el('button','ib','🏠'); home.title='الرئيسية'; home.onclick=()=>{SFX.click();go('#home');};

function slidesTab(panel,l,startAt){
  const p = lp(l._id); let i = Math.min(l.slides.length-1, Math.max(0, +startAt||0)); let seen = new Set();
  const box = el('div','slidebox'); const pb = el('div','pbar','<i></i>'); const dots = el('div','slidesdots');

  function render(){
    const s = l.slides[i]; seen.add(i); p.slides = Math.max(p.slides||0, seen.size); save();
    box.innerHTML = ''; const t = el('div','txt'); t.innerHTML = `<h3>${TX(s.title)}</h3><p>${TX(s.body)}</p>${s.note?`<div class="note">💭 ${TX(s.note)}</div>`:''}`;
    const sp = spkBtn(s.title+'. '+s.body+(s.note?'. '+s.note:''),'btn sec sm'); sp.innerHTML='🔊 استمع'; sp.style.alignSelf='flex-start'; t.appendChild(sp);
    const v = el('div','vis'); v.appendChild(visual(s.visual||{type:'text',big:'⚗️'}));
    box.appendChild(t); box.appendChild(v);
    const nav = el('div','slidenav'); const prev = el('button','btn sec sm','→ السابق'); prev.disabled = i===0; prev.onclick=()=>{SFX.flip(); i--; render();}; const next = el('button','btn sm', i<l.slides.length-1?'التالي ←':'🎮 انتقل للألعاب'); next.onclick=()=>{ SFX.flip(); if(i<l.slides.length-1){ i++; render(); } else go('#l'+l.num+'/games'); };
    nav.appendChild(prev); nav.appendChild(el('span','cnt',`${i+1} / ${l.slides.length}`)); nav.appendChild(next); box.appendChild(nav);
    pb.firstChild.style.width = ((i+1)/l.slides.length*100)+'%';
    dots.innerHTML=''; l.slides.forEach((_,k)=>{ const d = el('span', k===i?'on':(seen.has(k)?'seen':'')); d.onclick=()=>{i=k;render();}; dots.appendChild(d); });
  }

  addEventListener('keydown', kh);
}

/* ---------- game runner ---------- */
function runGame(panel, g, onScore, onNext){
  if (!g) { panel.appendChild(el('p','intro','لا يوجد نشاط.')); return; }
  const wrap = el('div',''); panel.appendChild(wrap);
  const head = el('div','ghead'); head.innerHTML = `<span style="font-size:1.8rem">${GAME_ICON[g.type]||'🎮'}</span><h3>${TX(g.title)}</h3>`; const sc = el('span','score','⭐ 0'); head.appendChild(sc); const sp = spkBtn(g.title+'. '+(g.intro||'')); head.appendChild(sp); wrap.appendChild(head);
  if (g.intro) wrap.appendChild(el('p','intro',TX(g.intro)));
  const body = el('div',''); wrap.appendChild(body);
  let score = 0, total = 0;
  const setScore = (s,t) => { score = s; total = t; sc.textContent = '⭐ ' + s + (t?' / '+t:''); };
  const finish = (s, t, extra) => {
    const pct = pctOf(s,t); onScore && onScore(pct); body.innerHTML = '';
    const r = el('div','result',`<div class="big">${pct>=90?'🏆':pct>=60?'🎉':pct>=30?'👍':'💪'}</div><h3>${pct>=90?'ممتاز! أداء رائع':pct>=60?'أحسنت!':pct>=30?'جيد، يمكنك التحسّن':'حاول مرة أخرى'}</h3><div class="stars">${stars(pct)}</div><p>النتيجة: ${s} من ${t} (${pct}%)</p>${extra||''}`);
    const f = el('div','gfoot'); f.style.justifyContent='center'; const again = el('button','btn sec','🔄 إعادة'); again.onclick=()=>{ body.innerHTML=''; setScore(0,0); start(); }; f.appendChild(again); if (onNext){ const n = el('button','btn','التالي ←'); n.onclick=onNext; f.appendChild(n); } r.appendChild(f); body.appendChild(r);
    if (pct>=60) { SFX.win(); confetti(pct>=90?200:100); speak(pct>=90?'ممتاز! أداء رائع':'أحسنت'); } else { SFX.bad(); }
  };
  const ctx = {body, setScore, finish, g};
  const start = () => { body.innerHTML=''; (GAMES[g.type]||GAMES.quiz)(ctx); };
  start();
}
