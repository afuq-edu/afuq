on as friends again!"], "img": "L18_c2", "icon": "🗨️"}, {"type": "ask", "title": "One word for each gap", "qs": [{"q": "(1) Why ___ this happen?", "a": "did"}, {"q": "(2) What ___ my friend hoping to achieve?", "a": "was"}, {"q": "(3) keen ___ having the conversation", "a": "on"}], "icon": "🔑"}, {"type": "ask", "title": "One word for each gap", "qs": [{"q": "(4) you could end ___ losing the friendship", "a": "up"}, {"q": "(5) it's important to ___ your friend how you feel", "a": "tell"}, {"q": "(6) listen ___ them", "a": "to"}], "icon": "🔑"}, {"type": "write", "title": "Communicate better!", "task": "Write a blog post giving young people advice on how to communicate better.", "steps": ["A title and a short introduction", "Three or four tips", "Use verbs: listen to, talk to, explain, tell", "A friendly ending"], "words": ["First, …", "Always listen to …", "Don't …", "Try to explain …", "Remember, …"], "model": "How to communicate better 💬\nGood communication makes friendships stronger. First, always listen to your friends and don't look at your phone while they are talking. Second, tell people how you feel in a calm way. Third, if you don't understand something, ask them to explain it again. Finally, talk to people face to face when there is a problem – messages can be misunderstood. Remember, a good listener is a good friend!", "icon": "✍️"}, {"type": "race", "title": "Unit 2 race", "qs": [{"q": "Please ___ me the answer.", "options": ["tell", "say", "speak"], "a": 0}, {"q": "The meme was absolutely …", "options": ["funny", "hilarious", "good"], "a": 1}, {"q": "While I ___ , my phone rang.", "options": ["studied", "was studying"], "a": 1}, {"q": "Which is a state verb?", "options": ["believe", "watch", "stop"], "a": 0}, {"q": "___ is good for you. (eat vegetables)", "options": ["Eat vegetables", "Eating vegetables"], "a": 1}, {"q": "listen ___ someone", "options": ["to", "at", "–"], "a": 0}, {"q": "\"at risk\" means …", "options": ["in danger", "very old", "happy"], "a": 0}], "icon": "🏎️"}, {"type": "steps", "title": "Let's remember!", "icon": "🧠", "steps": ["Verbs: explain, mean, pronounce, repeat, say, speak, talk, tell, translate, understand.", "Strong adjectives + absolutely; normal adjectives + very/really/extremely.", "Past continuous (background) + past simple (events); no stative verbs in the continuous.", "-ing as subject and after prepositions."]}, {"type": "exit", "title": "Exit ticket", "items": [{"k": "3", "text": "Write a sentence with \"while\" in the past."}, {"k": "2", "text": "Give two strong adjectives."}, {"k": "1", "text": "tell or say: ___ me a story."}], "icon": "🎟️"}, {"type": "homework", "title": "Homework", "head": "My homework", "items": ["Learn the Unit 2 wordlist (p. 35).", "Finish your blog post (Review Ex 7).", "Workbook p. 27."], "icon": "🏠"}]}, {"id": "L19", "unit": "U4", "unitName": "Unit 3: The future is now", "title": "Lesson 1 · Reading: The Future of Entertainment", "code": "", "theme": "park", "emo": "🎬", "slides": [{"type": "cover", "say": "Unit 3 · Lesson 1 · Reading: The Future of Entertainment"}, {"type": "goals", "title": "Today's goals", "items": ["I can talk about technology and entertainment.", "I can skim-read a text quickly."], "icon": "🎯"}, {"type": "goals", "title": "Today's goals", "items": ["I can put missing sentences back into a text (gapped text).", "I can find words from their meanings."], "icon": "🎯"}, {"type": "ask", "title": "Technology around us", "qs": [{"q": "What equipment can you see in the photo? What is it used for?", "a": "A virtual reality headset. It's used for games, films and learning."}, {"q": "In what ways do you use technology for entertainment?", "a": "I watch films on a tablet and play games online."}, {"q": "In what ways does technology make your life easier? Think of three examples.", "a": "Maps on my phone, online shopping, and video calls with my family."}], "img": "L19_c1", "icon": "🕶️"}, {"type": "ask", "title": "Films, books and devices", "qs": [{"q": "Tell your partner about one film you have enjoyed recently, and why.", "a": "I enjoyed an animated film because it was hilarious."}, {"q": "One book you have read recently?", "a": "I read a story about a girl who travels in time."}, {"q": "What devices do you and your family use to watch television and films at home?", "a": "A smart TV, tablets and phones."}, {"q": "Read the title: The Future of Entertainment. What's the topic?", "a": "How technology (AI) will change films, TV and social media."}], "img": "L19_c2", "icon": "📺"}, {"type": "explain", "title": "Study tip: skim-reading", "lines": ["Before the task, read the text quickly to understand what it's about.", "Move your eyes across the text quickly to pick out key words (verbs and nouns).", "Or read the first one or two lines in each paragraph."], "rule": "skim = quick reading for the general idea", "icon": "⚡"}, {"type": "flip", "title": "Study tip: skim-reading ⚡ – examples", "cards": [{"front": "Para 1: AI is transforming the world of entertainment …", "icon": "💡", "back": "🎬"}, {"front": "Para 2: Have you ever wanted to change the style of a movie …?", "icon": "✨", "back": "🎞️"}, {"front": "Para 3: On social media, you can expect to see … unreal profiles …", "icon": "🔎", "back": "👤"}, {"front": "Para 4: AI won't just be about consuming entertainment …", "icon": "📌", "back": "🎥"}, {"front": "Para 5: … it's important to think about the challenges, too.", "icon": "⭐", "back": "⚠️"}]}, {"type": "sort", "title": "What does the article mention?", "bins": [{"label": "mentioned", "icon": "✔"}, {"label": "not mentioned", "icon": "✘"}], "cards": [{"text": "AI technology", "icon": "", "bin": 0}, {"text": "choosing what happens in a film", "icon": "", "bin": 0}, {"text": "virtual characters on social media", "icon": "", "bin": 0}, {"text": "making your own films", "icon": "", "bin": 0}, {"text": "jobs in films (actors)", "icon": "", "bin": 0}, {"text": "advertisements", "icon": "", "bin": 1}], "icon": "🔍"}, {"type": "read", "title": "The Future of Entertainment (1)", "paras": ["Artificial Intelligence (AI) is [[transforming]] the world of entertainment. We're used to the fact that we can ask our smart speaker what time a movie starts, or when a TV company is filming the next series of our favourite show. Online platforms [[regularly]] use AI to recommend movies based on what we like. (1) ___ But in the future, AI technology will make entertainment even more exciting."], "img": "L19_c3", "icon": "🎬"}, {"type": "read", "title": "The Future of Entertainment (1)", "paras": ["Have you ever wanted to change the style of a movie, or some of the details? (2) ___ In fact, some online movie services already offer interactive content, where viewers can choose between different endings. It's clear that AI is going to take this further by changing entire movies according to your [[preferences]]. Do you love action? Your [[version]] of the movie will have more car chases. Or are you going to choose a comedy film? The same film will have the characters telling jokes and making you laugh!"], "img": "L19_c3", "icon": "🎬"}, {"type": "read", "title": "The Future of Entertainment (2)", "paras": ["On social media, you can expect to see people and profiles that are completely unreal, created with the help of AI technology. Such characters are already becoming popular. (3) ___ These digital stars will become even more [[lifelike]] over the next few years. It's even possible you will be able to chat with these 'people' directly."], "img": "L19_c4", "icon": "🤖"}, {"type": "read", "title": "The Future of Entertainment (2)", "paras": ["AI won't just be about [[consuming]] entertainment, either – it will also allow you to make your own. Soon, you'll be able to [[produce]] films or videos that look and sound professional, without needing expensive equipment or technical skills. (4) ___ AI will make it easier to share your story and ideas with the world. In fact, there are already tools that can help you with simple things like short texts – and you know what, I'll definitely try them myself!"], "img": "L19_c4", "icon": "🤖"}, {"type": "read", "title": "The Future of Entertainment (2)", "paras": ["While AI sounds amazing, it's important to think about the [[challenges]], too. (5) ___ Will we still need actors when computers can produce characters that look and sound just as good? The key, I think, will be the ability of humans to work creatively with AI to improve entertainment for the benefit of actors and audiences alike."], "img": "L19_c4", "icon": "🤖"}, {"type": "match", "title": "Put the sentences back", "pairs": [["Gap 1 – after: AI recommends movies …", "C And writers are already using AI to help write and film their scripts."], ["Gap 2 – after: change the style of a movie?", "H Soon, AI will enable you to change the story to suit you."], ["Gap 3 – after: Such characters are already becoming popular.", "A For example, there are virtual influencers with millions of followers."], ["Gap 4 – after: … without expensive equipment.", "F Imagine making your own movie with characters and special effects created by AI."], ["Gap 5 – after: think about the challenges, too.", "D Some people worry that AI could replace human jobs in entertainment industries."]], "icon": "🧩"}, {"type": "ask", "title": "Why does it fit?", "qs": [{"q": "Gap 2: H \"change the story to suit you\"", "a": "It answers the question \"Have you ever wanted to change … a movie?\" and the next sentence says \"In fact, … already …\"."}, {"q": "Gap 3: A \"For example, … virtual influencers\"", "a": "\"For example\" gives an example of \"such characters\"; \"These digital stars\" in the next sentence refers back to them."}, {"q": "Gap 4: F \"Imagine making your own movie …\"", "a": "The paragraph is about making your own films without expensive equipment."}, {"q": "Gap 5: D \"Some people worry …\"", "a": "It is a challenge, and the next question asks: \"Will we still need actors …?\""}, {"q": "Why not B \"Unfortunately, AI has brought some big changes\"?", "a": "The text is positive here; \"Unfortunately\" doesn't fit the ideas around any gap."}], "icon": "🔗"}, {"type": "ask", "title": "Find the words", "qs": [{"q": "change something completely (para 1)", "a": "transform(ing) – verb"}, {"q": "very often (para 1)", "a": "regularly – adverb"}, {"q": "something that you like more than others (para 2)", "a": "preference(s) – noun"}, {"q": "one form of something, different to others (para 2)", "a": "version – noun"}], "icon": "🔎"}, {"type": "ask", "title": "Find the words", "qs": [{"q": "make something (para 3/4)", "a": "produce – verb"}, {"q": "looking or sounding like a real person (para 3)", "a": "lifelike – adjective"}, {"q": "use something by watching it, listening to it (para 4)", "a": "consuming / consume – verb"}, {"q": "something that is difficult to do (para 5)", "a": "challenge(s) – noun"}], "icon": "🔎"}, {"type": "memory", "title": "Word ↔ meaning", "pairs": [["transform", "change completely"], ["regularly", "very often"], ["version", "one form of something"], ["lifelike", "like a real person"], ["produce", "make"], ["challenge", "something difficult"]], "icon": "🧠"}, {"type": "ask", "title": "Sum up & speak", "qs": [{"q": "Explain in your own words how AI will change entertainment.", "a": "We will choose how films end, chat with digital stars and make our own films easily."}, {"q": "Agree on one change that you think is good.", "a": "Making your own films is good – everyone can share their ideas."}, {"q": "Agree on one change that is not good. Why?", "a": "Replacing actors is not good because people may lose their jobs."}], "icon": "🗣️"}, {"type": "wheel", "title": "Future entertainment", "items": [{"q": "Would you like to choose the ending of a film? Why?", "a": "Yes, because I always want happy endings!"}, {"q": "Would you chat with a virtual star? Why / Why not?", "a": "No, I prefer real people."}, {"q": "Think of a new change you'd like to see in entertainment.", "a": "Films with Arabic and English subtitles chosen by AI."}, {"q": "Will we still need actors in 20 years?", "a": "Yes, people will always want real actors."}, {"q": "What film would you make with AI?", "a": "A film about the history of Nizwa Fort."}], "icon": "🎡"}, {"type": "race", "title": "Team race", "qs": [{"q": "Skim-reading means reading …", "options": ["quickly for the general idea", "every word slowly"], "a": 0}, {"q": "\"For example\" at the start of a sentence …", "options": ["gives an example", "gives a contrast"], "a": 0}, {"q": "\"lifelike\" means …", "options": ["very old", "like a real person", "expensive"], "a": 1}, {"q": "In a gapped text, how many extra sentences are there?", "options": ["one", "three", "five"], "a": 1}, {"q": "\"version\" is a …", "options": ["verb", "noun", "adjective"], "a": 1}, {"q": "One challenge of AI:", "options": ["it could replace human jobs", "films are cheaper"], "a": 0}], "icon": "🏎️"}, {"type": "steps", "title": "Let's remember!", "icon": "🧠", "steps": ["Skim first: key words or the first lines of each paragraph.", "Gapped text: check the sentence before AND after the gap.", "Look at first words (For example, But) and pronouns (these, they).", "New words: transform, regularly, preference, version, produce, lifelike, consume, challenge."]}, {"type": "exit", "title": "Exit ticket", "items": [{"k": "3", "text": "Name two ways AI will change entertainment."}, {"k": "2", "text": "What does \"consume\" mean?"}, {"k": "1", "text": "Which clue words help in a gapped text?"}], "icon": "🎟️"}, {"type": "homework", "title": "Homework", "head": "My homework", "items": ["Write a paragraph: Is AI your friend? Give two reasons.", "Practice guide pp. 68–69.", "Workbook pp. 28–29."], "icon": "🏠"}]}, {"id": "L20", "unit": "U4", "unitName": "Unit 3: The future is now", "title": "Lesson 2 · Grammar: talking about the future", "code": "", "theme": "park", "emo": "🔮", "slides": [{"type": "cover"}, {"type": "goals", "title": "Today's goals", "items": ["I can use will for predictions (opinions), offers and quick decisions.", "I can use be going to for plans and predictions with evidence."], "icon": "🎯"}, {"type": "goals", "title": "Today's goals", "items": ["I can use the present continuous for arrangements and the present simple for timetables.", "I can talk about my plans and predictions."], "icon": "🎯"}, {"type": "ask", "title": "What will happen soon?", "qs": [{"q": "Think about the future of entertainment you read about. What changes will happen quite soon?", "a": "I think we will choose the endings of films soon."}, {"q": "What are you going to do this evening?", "a": "I'm going to watch a football match."}], "icon": "🎬"}, {"type": "build", "title": "Future words", "mode": "letters", "items": [{"a": "tomorrow", "hint": "the day after today", "emo": "📅"}, {"a": "tonight", "hint": "this evening", "emo": "🌙"}, {"a": "predict", "hint": "say what will happen", "emo": "🔮"}, {"a": "hologram", "hint": "a 3D picture made by light", "emo": "✨"}, {"a": "schedule", "hint": "a timetable", "emo": "🗓️"}], "icon": "🔤"}, {"type": "explain", "title": "will", "lines": ["A for predictions based on our personal opinions.", "B for offers and immediate decisions.", "will / won't + verb (no -s, no to)."], "img": "L20_c1", "rule": "opinion prediction · offer · decision now → will", "icon": "🔮"}, {"type": "flip", "title": "will 🔮 – examples", "cards": [{"front": "I think the way a book is written [[will change]] in the future.", "icon": "💡", "back": "A 📚"}, {"front": "Don't worry, [[I'll lend]] you some money for the ticket.", "icon": "✨", "back": "B offer 💵"}, {"front": "It's quiet in here. [[I'll put]] the radio on.", "icon": "🔎", "back": "B decision 📻"}, {"front": "Perhaps we [[will use]] e-books for all our studies in the future.", "icon": "📌", "back": "A (p. 56)"}]}, {"type": "explain", "title": "be going to", "lines": ["C for intentions or things we're planning.", "D for predictions based on outside information (evidence).", "am / is / are + going to + verb."], "rule": "plan / intention · prediction with evidence → be going to", "icon": "🎯"}, {"type": "flip", "title": "be going to 🎯 – examples", "cards": [{"front": "Some of my friends [[are going to start]] their own book club.", "icon": "💡", "back": "C 📖"}, {"front": "You like history, so you [[are going to love]] this film.", "icon": "✨", "back": "D 🎞️"}, {"front": "[[It's going to rain]] soon. (There are big grey clouds.)", "icon": "🔎", "back": "D 🌧️"}, {"front": "I'm going to visit my friend in Türkiye sometime next year.", "icon": "📌", "back": "C ✈️"}]}, {"type": "explain", "title": "Present continuous & present simple for the future", "lines": ["E present continuous → arrangements with other people (we've agreed when, where …).", "F present simple → scheduled / timetabled events."], "img": "L20_c3", "rule": "arrangement → am/is/are + -ing · timetable → present simple", "icon": "📅"}, {"type": "flip", "title": "Present continuous & present simple for the future 📅 – examples", "cards": [{"front": "[[I'm meeting]] my aunt at the cinema at 8 p.m.", "icon": "💡", "back": "E 🤝"}, {"front": "I'm playing in a football match on Saturday.", "icon": "✨", "back": "E ⚽"}, {"front": "The show [[finishes]] late tonight.", "icon": "🔎", "back": "F 🕙"}, {"front": "The film [[finishes]] at 9.30 p.m.", "icon": "📌", "back": "F 🎬"}]}, {"type": "match", "title": "Match the forms with the uses", "pairs": [["1 We can ask … what time a movie starts.", "F scheduled event"], ["2 … when a TV company is filming the next series", "E arrangement"], ["3 AI technology will make entertainment more exciting.", "A prediction (opinion)"]], "icon": "🧩"}, {"type": "match", "title": "Match the forms with the uses", "pairs": [["4 It's clear that AI is going to take this further …", "D prediction (evidence)"], ["5 Or are you going to choose comedy films?", "C intention"], ["6 … you know what, I'll definitely try them myself!", "B immediate decision ding", "'m going to read"], "a": 1}, {"q": "You ___ tonight after that scary film.", "o": ["aren't sleeping", "aren't going to sleep"], "a": 1}, {"q": "I ___ the train to my grandparents' house at the weekend. I've already got my ticket.", "o": ["'m taking", "'m going to take"], "a": 0}, {"q": "It's cold outside. I ___ the heating on.", "o": ["'m going to put", "'m putting"], "a": 0}, {"q": "We ___ at six on Friday.", "o": ["'re meeting up", "'re going to meet up"], "a": 0}], "icon": "✅"}, {"type": "quiz", "title": "Will, won't or going to?", "icon": "✏️", "qs": [{"q": "I ___ enjoy the film. I don't like scary movies.", "o": ["won't", "will"], "a": 0}, {"q": "It's ___ rain later. I saw it on the weather report.", "o": ["going to", "will"], "a": 0}, {"q": "I don't think we ___ win the match tonight. We've lost our best player.", "o": ["will", "are going"], "a": 0}, {"q": "Our teacher ___ be late. His car's broken down.", "o": ["is going to", "won't"], "a": 0}, {"q": "We ___ finish this homework in time. The lesson starts in ten minutes.", "o": ["won't", "will"], "a": 0}]}, {"type": "ask", "title": "Find and correct the mistakes", "qs": [{"q": "Bader and I go to the cinema later.", "a": "Bader and I are going (to go) to the cinema later. (arrangement)"}, {"q": "I think the trip tomorrow is being fun.", "a": "I think the trip tomorrow will be fun. (opinion)"}, {"q": "Do we play football after school?", "a": "Are we playing / Shall we play football after school?"}], "icon": "🔍"}, {"type": "ask", "title": "Find and correct the mistakes", "qs": [{"q": "Sara's going play video games later.", "a": "Sara's going to play video games later."}, {"q": "Oh look, there's no bread left. I'm going to the shop to get some.", "a": "I'll go to the shop to get some. (decision now)"}, {"q": "The class starts at six on Monday.", "a": "✔ Correct – a timetable."}], "icon": "🔍"}, {"type": "wheel", "title": "Tell your partner", "items": [{"q": "something you'll offer to do for your parents to gy in the home", "code": "", "theme": "park", "emo": "🏠", "slides": [{"type": "cover", "say": "Unit 3 · Lesson 3 · Vocabulary: technology in the home & phrasal verbs"}, {"type": "goals", "title": "Today's goals", "items": ["I can name machines and devices in the home.", "I can use phrasal verbs like switch on, turn down, set up."], "icon": "🎯"}, {"type": "goals", "title": "Today's goals", "items": ["I know which phrasal verbs can be separated.", "I can do a multiple-choice cloze about smart homes."], "icon": "🎯"}, {"type": "ask", "title": "Machines at home", "qs": [{"q": "Which machines do you have in your kitchen?", "a": "We have a fridge-freezer, a microwave and a kettle."}, {"q": "Which machine is the most important in the summer in Oman? Why?", "a": "Air conditioning, because it's very hot!"}], "img": "L21_c1", "icon": "🏠"}, {"type": "match", "title": "Match the words with the photos", "pairs": [["A", "kettle"], ["B", "microwave"], ["C", "TV"], ["D", "fridge-freezer"], ["E", "washing machine"]], "icon": "📷"}, {"type": "match", "title": "Match the words with the photos", "pairs": [["F", "dishwasher"], ["G", "coffee maker"], ["H", "speaker"], ["I", "air conditioning"]], "icon": "📷"}, {"type": "memory", "title": "Memory: machine + emoji", "pairs": [["kettle", "🫖"], ["microwave", "♨️📦"], ["fridge-freezer", "🧊"], ["washing machine", "👕🌀"], ["speaker", "🔊"], ["air conditioning", "❄️🌬️"]], "icon": "🧠"}, {"type": "ask", "title": "Agree with your partner", "qs": [{"q": "Three things you and your family use every day.", "a": "The fridge-freezer, the kettle and the air conditioning."}, {"q": "The two things that are most important to you and your family.", "a": "The fridge-freezer and the washing machine."}, {"q": "One thing you and your family never use.", "a": "The dishwasher – we wash the dishes by hand."}], "icon": "🤝"}, {"type": "flip", "title": "Phrasal verbs (1)", "cards": [{"front": "switch on", "icon": "💡", "back": "start a light/machine working\n«I don't know how  recognise us as individuals and do some of the thinking for us. So, if we get home late and are feeling tired, the system will automatically (5) ___ down the lights, so they're softer and more relaxing. And when we take the last pizza from the freezer, it will perhaps (6) ___ us to buy more."], "img": "L21_c2", "icon": "🏡"}, {"type": "quiz", "title": "Multiple-choice cloze", "icon": "✏️", "qs": [{"q": "We talk to our smart speaker and music ___ on.", "o": ["gets", "comes", "goes", "puts"], "a": 1}, {"q": "We say, '___ on the central heating' …", "o": ["Get", "Switch", "Try", "Keep"], "a": 1}, {"q": "… and the air conditioning ___ off.", "o": ["takes", "puts", "goes", "comes"], "a": 2}, {"q": "… we need to be able to ___ all of our machines and devices to one app.", "o": ["connect", "mix", "attach", "join"], "a": 0}, {"q": "… the system will automatically ___ down the lights.", "o": ["put", "go", "get", "turn"], "a": 3}, {"q": "… it will perhaps ___ us to buy more.", "o": ["say", "remember", "remind", "speak"], "a": 2}]}, {"type": "wheel", "title": "Is it true for you?", "items": [{"q": "Do you always remember to switch off lights?", "a": "Yes, I always remember to switch off lights."}, {"q": "Who sets up new devices in your family?", "a": "I set them up – my parents ask me!"}, {"q": "Does the electricity ever go off at your home?", "a": "Sometimes, during storms."}, {"q": "Invent a smart machine. What's it called? What does it do?", "a": "A smart schoolbag that checks my timetable and reminds me what to take."}, {"q": "How does it make your life easier?", "a": "I won't ever forget anything!"}], "icon": "🎡"}, {"type": "race", "title": "Team race", "qs": [{"q": "Make the sound louder = …", "options": ["turn up", "turn down", "go off"], "a": 0}, {"q": "Connect to electricity = …", "options": ["set up", "plug in", "come on"], "a": 1}, {"q": "The lights ___ for no reason.", "options": ["went off", "went it off"], "a": 0}, {"q": "Correct:", "options": ["Turn on it.", "Turn it on."], "a": 1}, {"q": "It will ___ us to buy more pizza.", "options": ["remember", "remind"], "a": 1}, {"q": "A machine that washes plates:", "options": ["dishwasher", "kettle", "speaker"], "a": 0}], "icon": "🏎️"}, {"type": "steps", "title": "Let's remember!", "icon": "🧠", "steps": ["Home: air conditioning, coffee maker, dishwasher, fridge-freezer, kettle, microwave, speaker, TV, washing machine.", "switch on/off · turn up/down · plug in · set up · go off · come on", "Separable: Turn the light on / Turn it on.", "Not separable: go off, come on."]}, {"type": "exit", "title": "Exit ticket", "items": [{"k": "3", "text": "Write a sentence with \"turn it down\"."}, {"k": "2", "text": "Which two phrasal verbs can't be separated?"}, {"k": "1", "text": "Name three machines in your kitchen."}], "icon": "🎟️"}, {"type": "homework", "title": "Homework", "head": "My homework", "items": ["Write six sentences about your home with phrasal verbs.", "Draw and label your smart machine.", "Workbook p. 31."], "icon": "🏠"}]}, {"id": "L22", "unit": "U4", "unitName": "Unit 3: The future is now", "title": "Lesson 4 · Listening: discussing technology", "code": "", "theme": "park", "emo": "🎧", "slides": [{"type": "cover"}, {"type": "goals", "title": "Today's goals", "items": ["I can predict words before a picture listening task.", "I can identify differences between pictures."], "icon": "🎯"}, {"type": "goals", "title": "Today's goals", "items": ["I can give advice with should and ought to.", "I can make suggestions and offers (Why don't you … ? How about … ? Shall I … ?)."], "icon": "🎯"}, {"type": "ask", "title": "Do you have these?", "qs": [{"q": "Look at question 1: a tablet, a phone, a smart watch. Do you have any of these items?", "a": "I have a phone. My sister has a smart watch."}, {"q": "What do you use them for?", "a": "I use my phone for messages and my tablet for homework."}], "img": "L22_c1", "icon": "📱"}, {"type": "memory", "title": "Things in the pictures", "pairs": [["tabl k for advice.", "a": "What kind of tablet should I buy? Should I get a big one?"}, {"q": "Student B: Give some advice and make some suggestions.", "a": "You ought to buy one with a good battery. Why don't you read some reviews?"}, {"q": "Swap roles. Think of a different device and practise again.", "a": "Headphones: How about these? You could try them in the shop."}], "img": "L22_c4", "icon": "🎭"}, {"type": "race", "title": "Team race", "qs": [{"q": "How about ___ a toasted sandwich?", "options": ["make", "making", "to make"], "a": 1}, {"q": "You ought ___ look for it properly.", "options": ["to", "–", "for"], "a": 0}, {"q": "Why don't you ___ a tablet?", "options": ["get", "getting", "to get"], "a": 0}, {"q": "___ I open the window? (offer)", "options": ["Shall", "Ought", "How"], "a": 0}, {"q": "\"You should …\" gives …", "options": ["advice", "an offer"], "a": 0}, {"q": "Before a picture listening task, you …", "options": ["look at the pictures and predict words", "close your book"], "a": 0}], "icon": "🏎️"}, {"type": "steps", "title": "Let's remember!", "icon": "🧠", "steps": ["Picture task: read the question, look at the pictures, predict words.", "Advice: should / ought to + verb.", "Suggestions: Why don't you … ? · You could … · How about + -ing/noun?", "Offers: Shall I … ?"]}, {"type": "exit", "title": "Exit ticket", "items": [{"k": "3", "text": "Give advice to a friend who is always tired."}, {"k": "2", "text": "Make a suggestion with \"How about …?\""}, {"k": "1", "text": "Offer to help with \"Shall I …?\""}], "icon": "🎟️"}, {"type": "homework", "title": "Homework", "head": "My homework", "items": ["Write a short dialogue: a friend asks for advice about a new phone.", "Practice guide pp. 76–77.", "Workbook p. 32."], "icon": "🏠"}]}, {"id": "L23", "unit": "U4", "unitName": "Unit 3: The future is now", "title": "Lesson 5 · Speaking: the future of technology", "code": "", "theme": "park", "emo": "🤖", "slides": [{"type": "cover"}, {"type": "goals", "title": "Today's goals", "items": ["I can give and ask for opinions.", "I can agree and disagree politely."], "icon": "🎯"}, {"type": "goals", "title": "Today's goals", "items": ["I can listen and respond to my partner before giving my ideas.", "I can do a collaborative task and a discussion."], "icon": "🎯"}, {"type": "ask", "title": "If you had a robot …", "qs": [{"q": "If you had a robot, what would you like it to do for you?", "a": "I'd like it to tidy my room and help me with maths."}, {"q": "In what ways might an AI robot assistant be better than a human? Why?", "a": "It never gets tired and it can work 24 hours a day."}], "icon": "🤖"}, {"type": "riddle", "title": "Which AI assistant am I?", "items": [{"clues": ["I help you in the supermarket.", "I know what is in your fridge."], "a": "a shopping assistant", "emo": "🛒"}, {"clues": ["I stand in front of the class.", "I can explain lessons again and again."], "a": "an AI teacher", "emo": "🧑‍🏫"}, {"clues": ["I check if you are ill.", "I work in a clinic or hospital."], "a": "an AI doctor / nurse", "emo": "🩺"}, {"clues": ["I clean the floor for you."], "a": "a cleaning robot", "emo": "🧹"}, {"clues": ["I cook dinner in the kitchen."], "a": "a cooking robot", "emo": "🍳"}], "icon": "🧩"}, {"type": "ask", "title": "Listen: AI robots", "qs": [{"q": "What types of AI robots do they talk about?", "a": "Listen to 3.03 – answer from the recording."}, {"q": "Which do they think would be the most useful? Why?", "a": "Listen to 3.03."}, {"q": "Ex 3: complete the extracts (In my ___ , That's ___ , I ___ …).", "a": "Listen again (3.03) and complete – answers from the recording."}], "icon": "🎧"}, {"type": "explain", "title": "Useful language", "lines": ["Giving opinions: I think (that) … · For me, …", "Asking for opinions: What do you think? · Is this a good idea?", "Agreeing: I agree. · That's right. · That's true.  Disagreeing: I don't agree. · OK, but … · I'm not sure about …"], "img": "L23_c3", "rule": "opinion → ask → agree / disagree (+ re decide"}]}, {"type": "match", "title": "What is the speaker doing?", "pairs": [["So, we have to talk about which present …", "repeats the question"], ["Shall we start with the tablet?", "chooses a starting point"], ["What do you think?", "involves partner"]], "icon": "🎯"}, {"type": "match", "title": "What is the speaker doing?", "pairs": [["How about the photographs?", "makes a suggestion"], ["But for me the photographs are probably the best present …", "gives opinion"], ["Yes, let's go for those.", "makes a decision"]], "icon": "🎯"}, {"type": "ask", "title": "Speaking task: AI assistants", "qs": [{"q": "A company is thinking of creating a new kind of AI assistant. Talk together about the different kinds they could make.", "a": "So, we have to talk about AI assistants. Shall we start with the shopping assistant? What do you think?"}, {"q": "Respond to your partner, then add your idea.", "a": "That's true, it would save time. But for me, the AI teacher is more useful because …"}, {"q": "Which would be the most useful?", "a": "I agree – let's go for the AI doctor because it can help people in villages far from hospitals."}], "img": "L23_c2", "icon": "🤖"}, {"type": "ask", "title": "Extra practice: AI at school", "qs": [{"q": "A company wants to create AI technology to help students at school. Talk about the different ways it could help.", "a": "Shall we start with getting to school on time? An AI app could tell students when the bus is coming."}, {"q": "Respond and add ideas.", "a": "OK, but I think homework help is more useful. What do you think?"}, {"q": "Which would be the most useful?", "a": "For me, an AI tutor for exams would be the most useful."}], "img": "L23_c4", "icon": "🏫"}, {"type": "wheel", "title": "Discussion", "items": [{"q": "Would you like more technology in your life? Why / Why not?", "a": "Not really. I think we already spend too much time on screens."}, {"q": "Which would be more useful: a robot to clean your room or an AI assistant for your homework? Why?", "a": "A robot to clean my room – I want to do my homework myself!"}, {"q": "What's the best technology for watching a film? Why?", "a": "A big smart TV, because the whole family can watch together."}, {"q": "What do you think is most interesting about social media? Why?", "a": "Learning about other countries and cultures."}], "icon": "🎡"}, {"type": "ask", "title": "Persuade the other group!", "qs": [{"q": "AI assistants will change our lives.", "a": "Group A: They'll save us time. Group B: We'll become lazy."}, {"q": "It won't be necessary to learn how to write with a pen.", "a": "A: We'll type everything. B: Writing by hand helps us remember."}, {"q": "Children will learn faster and better from an AI teacher at home.", "a": "A: It can explain again and again. B: Children need friends and real teachers."}, {"q": "No one will need to learn how to drive.", "a": "A: Self-driving cars are safer. B: What if the system goes off?"}], "icon": "⚖️"}, {"type": "race", "title": "Team race", "qs": [{"q": "\"What do you think?\" is …", "options": ["giving an opinion", "asking for an opinion"], "a": 1}, {"q": "\"OK, but …\" is …", "options": ["agreeing", "disagreeing"], "a": 1}, {"q": "\"That's true.\" is …", "options": ["agreeing", "disagreeing"], "a": 0}, {"q": "In the collaborative task, first …", "options": ["listen and respond to your partner", "talk about every picture quickly"], "a": 0}, {"q": "To make a decision you say:", "options": ["Let's go for …", "I'm not sure."], "a": 0}, {"q": "\"For me, …\" =", "options": ["giving an opinion", "asking"], "a": 0}], "icon": "🏎️"}, {"type": "steps", "title": "Let's remember!", "icon": "🧠", "steps": ["Give opinions: I think … · For me, …", "Ask: What do you think? · Is this a good idea?", "Agree: I agree / That's true · Disagree: I don't agree / OK, but …", "Collaborative task: listen, respond, involve your partner, decide together."]}, {"type": "exit", "title": "Exit ticket", "items": [{"k": "3", "text": "Write one way to agree and one way to disagree politely."}, {"k": "2", "text": "How can you involve your partner?"}, {"k": "1", "text": "Which AI assistant would be most useful? Why?"}], "icon": "🎟️"}, {"type": "homework", "title": "Homework", "head": "My homework", "items": ["Write a short dialogue (6 lines) about the best AI assistant using the useful language.", "Practice guide pp. 86–89.", "Workbook p. 33."], "icon": "🏠"}]}, {"id": "L24", "unit": "U4", "unitName": "Unit 3: The future is now", "title": "Lesson 6 · Writing: an email – Teen Tech Help", "code": "", "theme": "park", "emo": "💻", "slides": [{"type": "cover"}, {"type": "goals", "title": "Today's goals", "items": ["I can read an email and the notes for a reply.", "I can include all the points and add more information."], "icon": "🎯"}, {"type": "goals", "title": "Today's goals", "items": ["I can use different phrases for advice and suggestions.", "I can write an informal email of about 100 words."], "icon": "🎯"}, {"type": "ask", "title": "The notice", "qs": [{"q": "Teenagers often have better technology skills than adults. Do you think it's a good idea to share these skills?", "a": "Yes – teenagers can help their grandparents use their phones."}, {"q": "Which projects would be the most useful? Why?", "a": "Workshops for older adults, because many of them need help with apps."}, {"q": "Which project would you most like to help with? Why?", "a": "Collecting old devices for recycling, because it helps the environment."}, {"q": "Can you think of any other ideas?", "a": "Helping people pay bills online safely."}], "img": "L24_c1", "icon": "📌"}, {"type": "read", "title": "Arwa's email", "paras": ["Hi! Sorry I didn't email last week. I had a terrible cold and I was in bed all weekend.", "Have you seen the notice about Teen Tech Help Month? I'm going to try and help with one of the projects. Which do you think is better, offering to help a local business go digital, or helping with recycling old tech? And how can I best help?"], "img": "L24_c2", "icon": "📩"}, {"type": "read", "title": "Arwa's email", "paras": ["Are you going to help with a project? Arwa", "Jood's notes: say you're sorry · say which one · suggest ideas · tell Arwa"], "img": "L24_c2", "icon": "📩"}, {"type": "quiz", "title": "Why is Arwa writing?", "qs": [{"q": "Why is Arwa writing?", "o": ["to ask for advice about Teen Tech Help Month", "to invite Jood to a party", "to say she is ill again"], "a": 0}, {"q": "Note 1 \"say you're sorry\" – sorry about …", "o": ["Arwa's cold", "the notice", "the project"], "a": 0}, {"q": "Note 2 \"say which one\" – which …", "o": ["project is better", "day is better", "phone is better"], "a": 0}, {"q": "Note 3 \"suggest ideas\" – ideas for …", "o": ["how Arwa can best help", "a holiday", "a birthday"], "a": 0}, {"q": "Note 4 \"tell Arwa\" – tell her …", "o": ["if Jood is going to help with a project", "about school", "about her family"], "a": 0}], "icon": "🤔"}, {"type": "read", "title": "Jood's reply", "paras": ["Hi Arwa, Sorry to hear you were ill. [[I hope you're feeling better now.]]"], "img": "L24_c3", "icon": "💌"}, {"type": "read", "title": "Jood's reply", "paras": ["[[I think you ought to]] help a local business go digital. Something like a local café or bakery. You're very good at thinking of ideas for websites, and I think you will enjoy it. [[You could]] help them set up their website, so they can reach more customers. [[How about]] helping them set up an online ordering system, too? I'm sure they'd like that, and it would help their business to grow."], "img": "L24_c3", "icon": "💌"}, {"type": "read", "title": "Jood's reply", "paras": ["[[I'm going to]] help with a project to collect old devices because I feel that we should recycle old phones, tablets and computers. Hopefully, we can make a difference! Jood"], "img": "L24_c3", "icon": "💌"}, {"type": "tf", "title": "Read Jood's reply again", "items": [{"text": "Jood only includes the information from her notes.", "a": false, "fix": "She says a little more about each point (e.g. a café or bakery, a website, online ordering)."}, {"text": "There are three paragraphs in the email.", "a": true, "fix": "1 sorry · 2 advice and suggestions · 3 her own project."}, {"text": "The email is formal.", "a": false, "fix": "It's informal: Hi Arwa, contractions (you're, I'm), friendly tone."}, {"text": "\"I think you ought to\", \"You could\" and \"How about\" give advice or make suggestions.", "a": true, "fix": "The other two: \"I hope you're feeling better\" (say sorry) and \"I'm going to\" (tell Arwa)."}], "icon": "✔✘"}, {"type": "explain", "title": "Study tip: vary your phrases", "lines": ["Use a variety of appropriate phrases in your email for giving advice or making suggestions.", "Avoid repeating the same one(s)."], "rule": "should · ought to · why don't you · could · how about + -ing", "icon": "🌈"}, {"type": "flip", "title": "Study tip: vary your phrases 🌈 – examples", "cards": [{"front": "You should …", "icon": "💡", "back": "👍"}, {"front": "You ought to …", "icon": "✨", "back": "👍"}, {"front": "Why don't you … ?", "icon": "🔎", "back": "💡"}, {"front": "You could …", "icon": "📌", "back": "💡"}, {"front": "How about … + -ing?", "icon": "⭐", "back": "💡"}]}, {"type": "ask", "title": "Five more ideas for Jood", "qs": [{"q": "You should …", "a": "You should ask the café owner what customers need."}, {"q": "You ought to …", "a": "You ought to take good photos of the food for the website."}, {"q": "Why don't you … ?", "a": "Why don't you make a social media page for the bakery?"}, {"q": "You could …", "a": "You could teach the staff how to use the ordering system."}, {"q": "How about … ?", "a": "How about adding a map so customers can find the café?"}], "icon": "💡"}, {"type": "read", "title": "Khalid's email", "paras": ["Hi! Did you see the notice about ideas for helping with technology? I'm going to try and help with something. I can't decide between helping organise recycling of old devices and helping people use the internet. What do you think I should do?", "What are you going to help with? Do you think it will be fun or boring? Khalid"], "img": "L24_c4", "icon": "📧"}, {"type": "read", "title": "Khalid's email", "paras": ["Notes: Great! · say which and why · tell Khalid · say which and why"], "img": "L24_c4", "icon": "📧"}, {"type": "ask", "title": "Discuss with your partner", "qs": [{"q": "Which project do you think Khalid should help with? Why?", "a": "Helping people use the internet, because many older people need help."}, {"q": "Which project are you going to help with? Why?", "a": "I'm going to help collect old devices for recycling."}, {"q": "Will it be fun or boring? Why?", "a": "Fun – we'll work as a team and meet new people."}], "icon": "🗣️"}, {"type": "order", "title": "Plan your reply", "items": ["Hi Khalid,", "Great! (react to his news)", "Which project he should do and why (advice + suggestions)", "Which project I am going to help with", "Fun or boring? Why", "Bye for now, …"], "icon": "🗺️"}, {"type": "write", "title": "Write your reply to Khalid", "task": "Write your reply to Khalid in about 100 words. Include all the information in the notes.", "steps": ["Great! – react to the news", "Say which project and why", "Tell Khalid about your project", "Say if it will be fun or boring and why"], "words": ["That's great!", "I think you ought to …", "Why don't you …?", "How about …?", "I'm going to …", "It will be fun because …"], "model": "Hi Khalid,\nThat's great news! I think you should help people use the internet. You're very patient, and older people need someone like you. Why don't you show them how to make video calls to their families? You could also teach them how to stay safe online.\nI'm going to help with the recycling project. We're going to collect old phones at school next week.\nI think it will be fun because we'll work in a team and help the environment.\nSee you soon,\nAhmed", "icon": "✍️"}, {"type": "ask", "title": "Improve it!", "qs": [{"q": "Does it include all the information in the notes? Did you add a little more to each one?", "a": "Check the four notes and add one detail to each."}, {"q": "Did you organise your ideas clearly into paragraphs?", "a": "One paragraph for each main idea."}, {"q": "Did you use a variety of phrases for advice and suggestions?", "a": "should / ought to / could / why don't you / how about"}, {"q": "Look for other errors: grammar, spelling, punctuation.", "a": "How about help → How about helping ✔"}], "icon": "🔧"}, {"type": "race", "title": "Team race", "qs": [{"q": "How about ___ a website?", "options": ["make", "making"], "a": 1}, {"q": "You ___ to recycle old phones.", "options": ["ought", "should", "could"], "a": 0}, {"q": "An informal email starts with …", "options": ["Dear Sir,", "Hi Khalid,"], "a": 1}, {"q": "Jood's email has ___ paragraphs.", "options": ["two", "three", "five"], "a": 1}, {"q": "Good emails include ___ the points in the notes.", "options": ["some of", "all of"], "a": 1}, {"q": "\"Why don't you …?\" makes a …", "options": ["suggestion", "complaint"], "a": 0}], "icon": "🏎️"}, {"type": "steps", "title": "Let's remember!", "icon": "🧠", "steps": ["Answer ALL the notes and add a little more information.", "Use paragraphs: each has a purpose.", "Vary advice/suggestions: should, ought to, could, why don't you, how about + -ing.", "Informal email: Hi …, contractions, friendly ending."]}, {"type": "exit", "title": "Exit ticket", "items": [{"k": "3", "text": "Write two different ways to give advice."}, {"k": "2", "text": "Write a suggestion with \"How about …?\""}, {"k": "1", "text": "What do you check before you finish an email?"}], "icon": "🎟️"}, {"type": "homework", "title": "Homework", "head": "My homework", "items": ["Write the final copy of your reply to Khalid.", "Practice guide pp. 72–73.", "Workbook p. 34."], "icon": "🏠"}]}, {"id": "L25", "unit": "U4", "unitName": "Unit 3: The future is now", "title": "Lesson 7 · Switch On Programme: Technology helps every nly one text matches ALL the information. Watch out for paraphrasing (weekly = regularly)."], "rule": "scan → underline → check every need → move on", "icon": "🧠"}, {"type": "flip", "title": "Reading Part 2: multiple matching 🧠 – examples", "cards": [{"front": "Ella: seventeen · a week · near her home · doesn't want to perform · technical skills + acting", "icon": "💡", "back": "🎭"}, {"front": "Find the text that matches all five things!", "icon": "✨", "back": "🔍"}]}, {"type": "read", "title": "Five young people", "paras": ["6 Ella is seventeen and has a week to spend during the summer on a drama course near her home. She doesn't want to perform yet, but wants to learn about technical skills as well as acting."], "img": "L27_c1", "icon": "👥"}, {"type": "read", "title": "Five young people", "paras": ["7 Molly loves drama, especially acting. She's eighteen and enjoys being on stage, both as an actor and as a singer. She'd like to join a group or course that meets every week in her holidays, which finish at the end of August."], "img": "L27_c1", "icon": "👥"}, {"type": "read", "title": "Five young people", "paras": ["8 Marty has never acted before, but wants to learn and go on stage. He'd like something regular during the summer months, where he can also do some writing and talk about plays, too. He's fifteen."], "img": "L27_c1", "icon": "👥"}, {"type": "read", "title": "Five young people", "paras": ["9 Toby is interested in plays, but not acting. He'd like an activity or job to do in the summer that is linked to drama if possible. He wants to see some plays, too, and chat to actors. He's nineteen."], "img": "L27_c1", "icon": "👥"}, {"type": "read", "title": "Five young people", "paras": ["10 Alice is fifteen and likes watching plays, and streaming films and series. She's tried acting, but didn't enjoy it. However, she's done some writing and would like to improve. She has some time in August."], "img": "L27_c1", "icon": "👥"}, {"type": "read", "title": "Drama in the summer (A–D)", "paras": ["A Hightown College: Do you love drama and want to spend a week away this summer? Are you over sixteen? Come to us and focus on both writing and acting, with a final play in front of an audience. Experts will give you one-to-one advice. Courses run in July and August."], "img": "L27_c2", "icon": "🎭"}, {"type": "read", "title": "Drama in the summer (A–D)", "paras": ["B Morningtown stage course: The Longford short play festival is in September. Join us for one day a week over the summer, and help write a play to enter the three-day competition. Members will do the acting, directing and stage design. No experience needed. Two groups: 12–16 year olds, and 16 and over."], "img": "L27_c2", "icon": "🎭"}, {"type": "read", "title": "Drama in the summer (A–D)", "paras": ["C Barford theatre school: Our weekly acting classes – Mondays or Fridays, through July, August and September – are very popular, with no pressure of an audience! We also organise theatre trips to London, followed by discussions. Classes are open to under-eighteens."], "img": "L27_c2", "icon": "🎭"}, {"type": "read", "title": "Drama in the summer (A–D)", "paras": ["D Get Creative at Collingwood! If you'd like to start a new hobby related to drama, join our one- or two-week courses available every month this summer. Learn from experts about writing for the stage or for television. You'll need to be over 14 and a little experience is good, but not necessary."], "img": "L27_c2", "icon": "🎭"}, {"type": "read", "title": "Drama in the summer (E–H)", "paras": ["E Norwood drama course: We are now looking for local young people aged between 14 and 18 to come on our week's summer theatre course. We teach all theatre skills, including lights, costume and make-up. There will be no final production, but you will visit a local professional theatre group and watch rehearsals."], "img": "L27_c3", "icon": "🎭"}, {"type": "read", "title": "Drama in the summer (E–H)", "paras": ["F Burley Youth Zone: The famous local Shakespeare festival is here again in August. We need some volunteers at the weekends (over eighteen) to sell tickets and show audiences to their seats. You can watch all the plays for free! Also, there are weekly question-and-answer sessions with the actors."], "img": "L27_c3", "icon": "🎭"}, {"type": "read", "title": "Drama in the summer (E–H)", "paras": ["G Dibden Players: We put on an end-of-summer play each year in the last week of August. If you've done some acting and are aged between 14 and 21, contact us. We rehearse weekly. We are also looking for singers and dancers."], "img": "L27_c3", "icon": "🎭"}, {"type": "read", "title": "Drama in the summer (E–H)", "paras": ["H National Young Actors' Group: Apply now to join our summer production in London. If you're successful you can travel to London for six weeks of the holidays. You will rehearse and act with other 14–17 year olds in a famous theatre!"], "img": "L27_c3", "icon": "🎭"}, {"type": "match", "title": "Who goes where?", "pairs": [["6 Ella", "E Norwood drama course"], ["7 Molly", "G Dibden Players"], ["8 Marty", "B Morningtown stage course"], ["9 Toby", "F Burley Youth Zone"], ["10 Alice", "D Get Creative at Collingwood"]], "icon": "🧩"}, {"type": "ask", "title": "Why?", "qs": [{"q": "Ella → E", "a": "Age OK (14–18), no public performance, technical skills (lights …), a week, local."}, {"q": "Molly → G", "a": "Right age, in August, regular (weekly), and her singing might be useful too."}, {"q": "Marty → B", "a": "Age fine, no experience needed, regular (one day a week), a chance to write."}], "icon": "🔍"}, {"type": "ask", "title": "Why?", "qs": [{"q": "Toby → F", "a": "No acting, a job linked to drama in summer, watch plays, chat to actors; over eighteen."}, {"q": "Alice → D", "a": "Keen to write, time in August, some experience, right age."}, {"q": "Why not C for Marty?", "a": "C is regular with discussions, but there is no writing."}], "icon": "🔍"}, {"type": "wheel", "title": "Speaking Part 1", "items": [{"q": "Where do you live? Who do you live with?", "a": "I live in Rustaq with my parents and two brothers."}, {"q": "Tell us about a film you like.", "a": "I really like … The story is brilliant!"}, {"q": "What do you usually do at the weekends?", "a": "I love the weekends because I can spend time with my family …"}, {"q": "What's your favourite subject at school?", "a": "My favourite subject is science because I love experiments."}, {"q": "Do you prefer the summer or the winter?", "a": "That's an interesting question. I prefer the winter because …"}, {"q": "Do you prefer playing or watching sport?", "a": "I prefer playing, as I'm very sporty."}], "icon": "🎤"}, {"type": "race", "title": "Review race", "qs": [{"q": "I ___ any help right now, thanks.", "options": ["don't need", "'m not needing"], "a": 0}, {"q": "She's keen ___ painting.", "options": ["on", "in", "at"], "a": 0}, {"q": "Someone who makes loud sounds in an annoying way:", "options": ["noisy", "calm", "shy"], "a": 0}, {"q": "Tennis isn't ___ dangerous as rugby.", "options": ["as", "so", "than"], "a": 0}, {"q": "There's ___ university near my home.", "options": ["a", "an"], "a": 0}, {"q": "Reading Part 2 has ___ extra texts.", "options": ["two", "three", "five"], "a": 1}], "icon": "🏎️"}, {"type": "steps", "title": "Let's remember!", "icon": "🧠", "steps": ["Articles, past simple, as … as / -er / the -est (Starter).", "Present simple vs continuous; stative verbs; adverbs of frequency (Unit 1).", "Reading Part 2: underline needs, match ALL of them, 3 extra texts.", "Speaking Part 1: answer + reason + example."]}, {"type": "exit", "title": "Exit ticket", "items": [{"k": "3", "text": "Write one sentence in the present continuous about this week."}, {"k": "2", "text": "What is the trick in multiple matching?"}, {"k": "1", "text": "Which Unit 1 word do you always forget?"}], "icon": "🎟️"}, {"type": "homework", "title": "Homework", "head": "My homework", "items": ["Grammar file p. 53 – Ex 3 and Ex 8.", "Learn the Starter and Unit 1 irregular verbs and wordlist."], "icon": "🏠"}]}, {"id": "L28", "unit": "U5", "unitName": "Reviews (1–3)", "title": "Review 2 · Unit 2 Connections", "code": "", "theme": "city", "emo": "🔁", "slides": [{"type": "cover", "say": "Grammar file practice · wordlist · Reading Part 3 · Listening Part 3"}, {"type": "goals", "title": "Today's goals", "items": ["I can use the past simple, past continuous and -ing forms.", "I can remember communication verbs and strong adjectives."], "icon": "🎯"}, {"type": "goals", "title": "Today's goals", "items": ["I can do a multiple-choice long text (Reading Part 3).", "I can complete notes while listening (Listening Part 3)."], "icon": "🎯"}, {"type": "balloons", "title": "Irregular verbs", "rounds": [{"q": "speak → ?", "o": ["spoke", "speaked"], "a": 0}, {"q": "tell → ?", "o": ["telled", "told"], "a": 1}, {"q": "mean → ?", "o": ["meant", "meaned"], "a": 0}], "icon": "🎈"}, {"type": "balloons", "title": "Irregular verbs", "rounds": [{"q": "understand → ?", "o": ["understood", "understanded"], "a": 0}, {"q": "hear → ?", "o": ["heard", "hore"], "a": 0}, {"q": "win → ?", "o": ["winned", "won"], "a": 1}], "icon": "🎈"}, {"type": "quiz", "title": "Past simple practice", "icon": "✏️", "qs": [{"q": "I ___ my friend last night. (see)", "o": ["saw", "seed", "seen"], "a": 0}, {"q": "I ___ the book more than the film. (enjoy)", "o": ["enjoyed", "was enjoying", "enjoy"], "a": 0}, {"q": "The lesson ___ on time. (not end)", "o": ["didn't end", "didn't ended", "wasn't end"], "a": 0}, {"q": "We ___ Italian when we were on holiday. (speak)", "o": ["spoke", "speaked", "spoken"], "a": 0}, {"q": "Where ___ last night? (you / be)", "o": ["were you", "did you be", "was you"], "a": 0}, {"q": "I ___ the night to end. (not want)", "o": ["didn't want", "wasn't wanting", "didn't wanted"], "a": 0}]}, {"type": "quiz", "title": "Past continuous & -ing", "icon": "✏️", "qs": [{"q": "I ___ entering the competition. (not consider)", "o": ["wasn't considering", "didn't considering"], "a": 0}, {"q": "___ tennis in the park on Saturday? (your sister / play)", "o": ["Was your sister playing", "Were your sister playing"], "a": 0}, {"q": "___ on your way home yesterday? (it / rain)", "o": ["Was it raining", "Did it raining"], "a": 0}, {"q": "I had the TV on, but I ___ attention to it. (not pay)", "o": ["wasn't paying", "didn't paying"], "a": 0}, {"q": "After ___ my dinner, I went round my friend's house. (eat)", "o": ["eating", "eat"], "a": 0}, {"q": "My dad finished ___ my room yesterday. (paint)", "o": ["painting", "to paint"], "a": 0}]}, {"type": "match", "title": "Unit 2 words", "pairs": [["pronounce", "say the sounds of a word"], ["translate", "change into another language"], ["hilarious", "extremely funny"]], "icon": "🧩"}, {"type": "match", "title": "Unit 2 words", "pairs": [["miserable", "very unhappy"], ["ancient", "very old"], ["at risk", "in danger"]], "icon": "🧩"}, {"type": "explain", "title": "Reading Part 3: multiple choice (long text)", "lines": ["Read the text first, then the questions.", "Underline the key words in the question and the options.", "The questions follow the text in order; the last one tests the whole text / main point."], "rule": "key words → find the part → check every option", "icon": "📖"}, {"type": "flip", "title": "Reading Part 3: multiple choice (long text) 📖 – examples", "cards": [{"front": "Q11 Why did Claudia want to learn to drive? → look in the first paragraph for a reason.", "icon": "💡", "back": "🚗"}, {"front": "Answer A \"to become more independent\" ← \"I don't like relying on other people.\"", "icon": "✨", "back": "✔"}, {"front": "B is incorrect: she doesn't mention money for buses.", "icon": "🔎", "back": "✘"}]}, {"type": "read", "title": "My new skill (1)", "paras": ["I've always done several sports. That has meant a lot of travelling. When I was younger, my parents used to drive me to different places, like the swimming pool or to music lessons, and they never complained! In the last few years, I've travelled around on buses or for long distances with a friend who has a car and I have paid towards the petrol. But it isn't always that convenient and I don't like [[relying on]] other people. Now I don't have to. Last year, I decided to learn to drive. And the world has opened up to me!"], "img": "L28_c1", "icon": "🚗"}, {"type": "read", "title": "My new skill (1)", "paras": ["It wasn't an easy decision, mainly because of the price of lessons. They were really expensive, but luckily my parents were kind enough to give me some lessons as a birthday present. I was so excited before my first lesson, but, afterwards, not so much! It was harder than I'd expected. I like to be in control – and I wasn't. I made so many mistakes and the car kept jumping! The instructor told me it was the same for everyone, but I didn't believe him. I was sure I could never pass a test."], "img": "L28_c1", "icon": "🚗"}, {"type": "read", "title": "My new skill (2)", "paras": ["Of course, the next lesson went better, and the next. People gave me a lot of advice, but in the end, you need to just carry on and learn from experience. And I must say, driving instructors have a very difficult job, which they do well. They stay so calm, even when their students, like me, get [[irritated]] or drive down the wrong streets. Once, I went the wrong way round a small roundabout! My instructor still stayed calm. Amazing!"], "img": "L28_c1", "icon": "🚗"}, {"type": "read", "title": "My new skill (2)", "paras": ["It took a long time, but finally I was ready to take my test. The night before, I decided to watch several films to stop me worrying. Not a good idea. Always get a good rest before something difficult and eat well, too. I did neither. I went to bed late, was too nervous for breakfast and, to be honest, I'm amazed I passed. 'Relax' is the key word. I was stressed the whole time. I've always thought that forty minutes with an examiner is not enough for them to decide if you pass or fail. Why aren't there regular [[assessments]]? Now, I'm happy it was only forty minutes! But if I can do it, anyone can!"], "img": "L28_c1", "icon": "🚗"}, {"type": "quiz", "title": "Choose the correct answer", "qs": [{"q": "11 Why did Claudia want to learn to drive?", "o": ["to become more independent", "to save money on public transport", "to socialise with her friends", "to please her parents"], "a": 0}, {"q": "12 How did Claudia feel after her first lesson?", "o": ["worried about the cost", "keen to take more lessons", "surprised by the difficulty", "encouraged by her instructor"], "a": 2}, {"q": "13 In the third paragraph Claudia says that she …", "o": ["listens to suggestions.", "needs to be patient.", "gets angry with other drivers.", "admires instructors."], "a": 3}, {"q": "14 What is Claudia doing in the final paragraph?", "o": ["explaining how she passed the test", "advising people how to prepare for the test", "complaining about how long the test took", "describing how she felt after the test"], "a": 1}, {"q": "15 What might Claudia post about learning to drive?", "o": ["I can drive all my friends around and I'll be very popular.", "Anyone can learn in a few weeks – it's not that hard.", "I appreciate my parents' help, particularly just before my test.", "I'm glad I did it, in spite of all the worries, and I benefitted in many ways."], "a": 3}], "icon": "✅"}, {"type": "explain", "title": "Listening Part 3: note completion", "lines": ["Read the notes before you listen and predict the kind of word.", "Write one or two words, a number, a date or a time.", "Listen for distractors: the speaker may mention other answers first!"], "img": "L28_c2", "rule": "predict → listen → watch out for distractors", "icon": "🎧"}, {"type": "flip", "title": "Listening Part 3: note completion 🎧 – examples", "cards": [{"front": "… when she was (14) ___ years old → a number (an age)", "icon": "💡", "back": "🔢"}, {"front": "At college Leila decided she wanted to write (15) ___ → a noun", "icon": "✨", "back": "📺"}, {"front": "Leila won an award which was a gold (17) ___ → a noun that can be gold", "icon": "🔎", "back": "🏆"}, {"front": "Leila usually gets ideas when she's at her (18) ___ → a place", "icon": "📌", "back": "🏠"}]}, {"type": "read", "title": "Leila Danton, TV writer", "paras": ["Good morning! I'm Leila Danton and I'm a TV writer. It's my dream job. I wrote my first short story when I was six. Then later at the age of twelve, I decided I was going to write dramas for TV! And I love it!"], "hide": true, "icon": "📺"}, {"type": "read", "title": "Leila Danton, TV writer", "paras": ["After school, I went on to study creative writing at college. Most of my classmates wanted to write police dramas, but it was children's programmes that interested me. I remember how important TV was when I was a child."], "hide": true, "icon": "📺"}, {"type": "read", "title": "Leila Danton, TV writer", "paras": ["Luckily, people have liked what I write! My first success was about a princess called Greta. But now I prefer writing stories that can teach children important things. My favourite programme has stories with a fox called Lexi. I love her! Check it out!"], "hide": true, "icon": "📺"}, {"type": "read", "title": "Leila Danton, TV writer", "paras": ["I actually won an award for that story! It was completely unexpected when they called my name. It wasn't a gold statue like the Oscars, unfortunately, but a gold keyboard! I imagine fifty years ago, a writer might have won a gold pen!"], "hide": true, "icon": "📺"}, {"type": "read", "title": "Leila Danton, TV writer", "paras": ["So, where do I get my ideas? Sometimes I sit at my screen at home and wait for an idea. That doesn't usually work! Most often I think of stories at my aunt's house, when I'm with my young cousins. They inspire me."], "hide": true, "icon": "📺"}, {"type": "read", "title": "Leila Danton, TV writer", "paras": ["Right now I'm doing something that I hope will help parents. The stories are about a place called Dreamland – that's all one word, and it's the name I've chosen for them. The idea is they will encourage young children to go to bed! At first, I wanted to call them Bedtime, but I don't think that's as good."], "hide": true, "icon": "📺"}, {"type": "quiz", "title": "Complete Leila's notes", "icon": "✏️", "qs": [{"q": "Leila's ambition to become a TV writer started when she was ___ years old.", "o": ["12", "6", "50"], "a": 0}, {"q": "At college Leila decided she wanted to write ___ .", "o": ["children's programmes", "police dramas", "short stories"], "a": 0}, {"q": "The stories Leila likes writing most are about a ___ .", "o": ["fox", "princess", "cousin"], "a": 0}, {"q": "Leila won an award which was a gold ___ .", "o": ["keyboard", "statue", "pen"], "a": 0}, {"q": "Leila usually gets ideas when she's at her ___ .", "o": ["aunt's house", "screen at home", "college"], "a": 0}, {"q": "Leila decided to call her recent stories ___ .", "o": ["Dreamland", "Bedtime", "Lexi"], "a": 0}]}, {"type": "race", "title": "Review race", "qs": [{"q": "While I ___ breakfast, I heard the news.", "options": ["had", "was having"], "a": 1}, {"q": "I ___ the answer. (know)", "options": ["knew", "was knowing"], "a": 0}, {"q": "Swimming ___ good exercise.", "options": ["is", "are"], "a": 0}, {"q": "very funny = …", "options": ["hilarious", "huge"], "a": 0}, {"q": "In Listening Part 3 you write …", "options": ["one or two words or a number", "a full paragraph"], "a": 0}, {"q": "The last question in Reading Part 3 tests …", "options": ["the main point", "one word"], "a": 0}], "icon": "🏎️"}, {"type": "steps", "title": "Let's remember!", "icon": "🧠", "steps": ["Past simple + past continuous (when/while); no stative verbs in the continuous.", "-ing as subject, after prepositions and verbs like finish, enjoy.", "Reading Part 3: underline key words; questions follow the text; last = main point.", "Listening Part 3: predict the word; watch out for distractors."]}, {"type": "exit", "title": "Exit ticket", "items": [{"k": "3", "text": "Write a sentence with when and the past continuous."}, {"k": "2", "text": "What is a \"distractor\" in a listening task?"}, {"k": "1", "text": "Give two strong adjectives from Unit 2."}], "icon": "🎟️"}, {"type": "homework", "title": "Homework", "head": "My homework", "items": ["Grammar file p. 55 – Ex 7 (true sentences with -ing).", "Learn the Unit 2 wordlist (p. 35)."], "icon": "🏠"}]}, {"id": "L29", "unit": "U5", "unitName": "Reviews (1–3)", "title": "Review 3 · Unit 3 The future is now", "code": "", "theme": "city", "emo": "🔁", "slides": [{"type": "cover", "say": "Grammar file practice · wordlist · Reading Part 4 · Speaking Part 3"}, {"type": "goals", "title": "Today's goals", "items": ["I can choose the right future form.", "I can give advice and make suggestions."], "icon": "🎯"}, {"type": "goals", "title": "Today's goals", "items": ["I can put missing sentences into a text (Reading Part 4).", "I can discuss and agree with a partner (Speaking Part 3)."], "icon": "🎯"}, {"type": "memory", "title": "Phrasal verbs", "pairs": [["turn up", "make louder"], ["turn down", "make quieter"], ["plug in", "connect to electricity"], ["set up", "make ready to use"], ["go off", "stop working"], ["come on", "start working"]], "icon": "🔌"}, {"type": "quiz", "title": "The most appropriate future form", "icon": "✏️", "qs": [{"q": "We ___ Hashim at school in five minutes. (meet)", "o": ["'re meeting", "meet", "'ll meet"], "a": 0}, {"q": "I think you ___ tired tonight. You've been busy all day. (be)", "o": ["'ll be", "'re being", "are"], "a": 0}, {"q": "The train ___ at 12.35 p.m., so we've got thirty minutes. (leave)", "o": ["leaves", "will leave", "is leaving"], "a": 0}, {"q": "My grandparents ___ to visit us tomorrow. (come)", "o": ["are coming", "come", "will come"], "a": 0}]}, {"type": "quiz", "title": "The most appropriate future form", "icon": "✏️", "qs": [{"q": "Watch out! The cat ___ on you. (jump)", "o": ["'s going to jump", "jumps", "'ll jump"], "a": 0}, {"q": "We need some bread. I ___ to the bakery to buy some now. (go)", "o": ["'ll go", "go", "'m going to go"], "a": 0}, {"q": "Where ___ your cousin tonight? (you / meet)", "o": ["are you meeting", "do you meet", "will you meet"], "a": 0}, {"q": "The play ___ at 8 p.m., so don't be late. (start)", "o": ["starts", "is starting", "will start"], "a": 0}]}, {"type": "quiz", "title": "Advice (A) or suggestion (S)?", "qs": [{"q": "You shouldn't eat so many sweets!", "o": ["A advice", "S suggestion"], "a": 0}, {"q": "Why don't you grow your hair long?", "o": ["A advice", "S suggestion"], "a": 1}, {"q": "How about chicken for dinner?", "o": ["A advice", "S suggestion"], "a": 1}, {"q": "We could cycle or walk. Which would you prefer?", "o": ["A advice", "S suggestion"], "a": 1}, {"q": "Omar should apologise to his friend.", "o": ["A advice", "S suggestion"], "a": 0}], "icon": "💡"}, {"type": "explain", "title": "Reading Part 4: gapped text", "lines": ["Read the title and the whole text quickly first. Then read the eight sentences.", "At each gap, read the sentence BEFORE and AFTER it.", "Check first words (But, So, That's why, For example) and pronouns (she, they, them)."], "rule": "context + first words + pronouns + meaning", "icon": "🧩"}, {"type": "flip", "title": "Reading Part 4: gapped text 🧩 – examples", "cards": [{"front": "So … → introduces a result", "icon": "💡", "back": "➡️"}, {"front": "For example … → introduces an example", "icon": "✨", "back": "📝"}, {"front": "But slowly … → a contrast / bridge from negative to positive", "icon": "🔎", "back": "🔄"}, {"front": "them, they → who do they refer to?", "icon": "📌", "back": "👥"}]}, {"type": "read", "title": "Moving on (1)", "paras": ["When her parents told her they were moving from the city to a small mountain village, Molly did not react well. Whereas her parents saw it as an adventure, Molly had a very different view. She had grown up in a busy neighbourhood with lots of places to visit nearby. (16) … She was happy at school, with great teachers and a strong circle of friends."], "img": "L29_c1", "icon": "🏔️"}, {"type": "read", "title": "Moving on (1)", "paras": ["At first, life in the mountains was exactly as Molly had expected – quiet and boring, and there was no public transport. (17) … She depended on them to take her to school, or to the nearest town for shopping. It was lonely and starting a new school was scary. She missed her old friends and the activities she used to do with them. (18) … Here, in the mountains, there were just trees and hills and wildlife."], "img": "L29_c1", "icon": "🏔️"}, {"type": "read", "title": "Moving on (2)", "paras": ["For months, Molly was really unhappy. (19) … She joined a local hiking group for teenagers and found that she enjoyed walking in the mountains. She also got to know some of the other students in her class and started to feel more comfortable."], "img": "L29_c1", "icon": "🏔️"}, {"type": "read", "title": "Moving on (2)", "paras": ["Moving home and moving schools is sometimes upsetting and stressful, but Molly realised that change can actually be good for us. She got to live in a whole new environment, meet another set of lovely people and learn a lot of new things. (20) … Whatever they are!"], "img": "L29_c1", "icon": "🏔️"}, {"type": "match", "title": "Put the sentences back", "pairs": [["Gap 16", "H She couldn't imagine living somewhere else with only a few houses and no shops."], ["Gap 17", "D So, she had to get lifts everywhere from her parents."], ["Gap 18", "B For example, they often used to go to the cinema together or for a swim at the beach."], ["Gap 19", "G But slowly, things began to change for the better."], ["Gap 20", "F Because of this, she is now confident about facing new challenges in the future."]], "icon": "🧩"}, {"type": "ask", "title": "Why?", "qs": [{"q": "17 D \"So, she had to get lifts …\"", "a": "So introduces a result of \"no public transport\"; \"them\" in the next sentence = her parents."}, {"q": "18 B \"For example, they often used to …\"", "a": "For example introduces what she used to do with her friends; \"Here\" in the next sentence is a contrast."}, {"q": "19 G \"But slowly, things began to change …\"", "a": "A bridge between negative (unhappy) and positive (she enjoyed hiking)."}, {"q": "20 F \"Because of this, … new challenges\"", "a": "It refers back to the new things she learnt; \"Whatever they are!\" refers to new challenges."}, {"q": "Why not E \"Her parents were therefore happy with the move\"?", "a": "Nothing is said about her parents' attitude; \"therefore\" needs a reason before it."}], "icon": "🔍"}, {"type": "explain", "title": "Speaking Part 3: collaborative task", "lines": ["You and your partner discuss a situation and try to agree (about 3 minutes).", "Interact: give ideas, ask your partner, respond. Give reasons.", "You don't need to talk about all the pictures – a good discussion is what matters."], "rule": "start → involve → respond → suggest → decide", "icon": "🤝"}, {"type": "flip", "title": "Speaking Part 3: collaborative task 🤝 – examples", "cards": [{"front": "So, we have to talk about … Shall we start with …?", "icon": "💡", "back": "🟢 start"}, {"front": "What do you think? / Is this a good idea?", "icon": "✨", "back": "❓ involve"}, {"front": "That's true. / I'm not sure about … / For me, …", "icon": "🔎", "back": "💬 respond"}, {"front": "How about …? / I think we should …", "icon": "📌", "back": "💡 suggest"}, {"front": "Let's go for …", "icon": "⭐", "back": "✅ decide"}]}, {"type": "ask", "title": "A 70th birthday present for Grandma", "qs": [{"q": "A girl wants to give her grandmother a 70th birthday present. She doesn't have much money. Which would be best?", "a": "So, we have to talk about which present the girl should buy. Shall we start with the tablet? What do you think?"}, {"q": "The tablet? The flowers?", "a": "A tablet will cost a lot. Flowers are cheaper, but they don't last."}, {"q": "The photographs? The T-shirt? The afternoon tea? The chocolates?", "a": "How about the photographs? Then she can remember lots of special events."}, {"q": "Make a decision.", "a": "For me the photographs are probably the best present that doesn't cost a lot. – Yes, let's go for those."}], "img": "L29_c2", "icon": "🎁"}, {"type": "sort", "title": "Useful language", "bins": [{"label": "involving your partner", "icon": "❓"}, {"label": "opinions & responding", "icon": "💬"}, {"label": "suggestions", "icon": "💡"}, {"label": "ordering the discussion", "icon": "🗺️"}], "cards": [{"text": "What do you think?", "icon": "", "bin": 0}, {"text": "Is this a good idea?", "icon": "", "bin": 0}, {"text": "That's a great idea.", "icon": "", "bin": 1}, {"text": "I'm not sure about …", "icon": "", "bin": 1}, {"text": "That's a possibility.", "icon": "", "bin": 1}, {"text": "How about …?", "icon": "", "bin": 2}, {"text": "Let's go for …", "icon": "", "bin": 2}, {"text": "We mustn't forget …", "icon": "", "bin": 2}, {"text": "So, we have to talk about …", "icon": "", "bin": 3}, {"text": "Next, there's the …", "icon": "", "bin": 3}], "icon": "🗂️"}, {"type": "wheel", "title": "Discussion (Part 4)", "items": [{"q": "Will people still watch TV in ten years? Why / Why not?", "a": "I think they will, but on their phones and tablets."}, {"q": "Would you like a smart home? Why?", "a": "Yes, it would save energy – the lights would switch off automatically."}, {"q": "Should teenagers help adults with technology? How?", "a": "Yes, they could teach their grandparents how to use apps."}, {"q": "What technology will help health most in the future?", "a": "I think drones will, because they can reach far villages."}, {"q": "Is AI your friend? Why?", "a": "Sometimes – it helps me learn, but I prefer real friends!"}], "icon": "🎡"}, {"type": "race", "title": "Review race", "qs": [{"q": "The play ___ at 8 p.m.", "options": ["starts", "'s starting"], "a": 0}, {"q": "Watch out! It ___ fall!", "options": ["'s going to", "'ll"], "a": 0}, {"q": "How about ___ a film?", "options": ["watch", "watching"], "a": 1}, {"q": "Turn ___ ! It's too loud.", "options": ["it down", "down it"], "a": 0}, {"q": "\"So, …\" at the start of a sentence introduces …", "options": ["a result", "an example"], "a": 0}, {"q": "To end Part 3 you say:", "options": ["Let's go for …", "Goodbye"], "a": 0}], "icon": "🏎️"}, {"type": "steps", "title": "Let's remember!", "icon": "🧠", "steps": ["Future: will (opinion/decision) · going to (plan/evidence) · present continuous (arrangement) · present simple (timetable).", "Advice: should/ought to · Suggestions: could, why don't, how about + -ing.", "Reading Part 4: before + after the gap, first words, pronouns.", "Speaking Part 3: involve your partner, respond, suggest, decide."]}, {"type": "exit", "title": "Exit ticket", "items": [{"k": "3", "text": "Write your plan for the holiday with going to."}, {"k": "2", "text": "What clue do \"So\" and \"For example\" give in a gapped text?"}, {"k": "1", "text": "Write one phrase to involve your partner."}], "icon": "🎟️"}, {"type": "homework", "title": "Homework", "head": "My homework", "items": ["Grammar file p. 57 – Ex 4 (all items).", "Learn the Unit 3 wordlist (p. 47) and revise for the semester exam."], "icon": "🏠"}]}]}/*afuq-lesson-filter*/;(function(){var s=new URLSearchParams(location.search),q=s.get("l"),p=s.get("p");if(!q)return;var D=window.DECK,L=D.lessons.filter(function(x){return x.id===q});if(!L.length)return;var P=p&&(L[0].parts||[]).filter(function(x){return x.id===p})[0];if(P){var o=L[0],sl=o.slides;L=[Object.assign({},o,{title:P.t,unitName:(o.unitName?o.unitName+" – ":"")+o.title,slides:[sl[0]].concat(sl.slice(P.a,P.b+1))})]}else if((L[0].parts||[]).some(function(x){return x.x})){var o=L[0];L=[Object.assign({},o,{slides:o.slides.filter(function(z,i){return !o.parts.some(function(x){return x.x&&i>=x.a&&i<=x.b})})})]}D.lessons=L;D.units=(D.units||[]).filter(function(u){return u.id===L[0].unit});D.store+="-"+q+( <script>/* Illustrated full-bleed backdrops for the ICT decks (1600x900 SVG, cartoon style).

   Every scene keeps its middle area calm so the slide cards stay readable. */
(function(){
const O='#2b3a55';            // outline colour
function rng(seed){let s=seed;return()=>{s=(s*16807)%2147483647;return (s-1)/2147483646}}
function svg(body,defs){return `<svg class="scene" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg"><defs>${defs||''}</defs>${body}</svg>`}
function cloud(x,y,s,o){o=o==null?1:o;return `<g transform="translate(${x} ${y}) scale(${s})" opacity="${o}"><path d="M0 40q0-26 30-26q8-22 36-22q30 0 38 26q28-2 30 22q0 22-26 22H22Q0 62 0 40z" fill="#fff" stroke="#cfe3f3" stroke-width="3"/></g>`}
function palm(x,y,s){return `<g transform="translate(${x} ${y}) scale(${s})"><path d="M0 0q6-60 2-120" stroke="#8a6a45" stroke-width="10" fill="none" stroke-linecap="round"/><g fill="#5fae6e" stroke="#3d7f4c" stroke-width="3"><path d="M2-120q-50-20-80 10q40-8 80-10z"/><path d="M2-120q-30-45-70-40q40 12 70 40z"/><path d="M2-120q20-50 66-42q-40 10-66 42z"/><path d="M2-120q50-14 78 16q-40-10-78-16z"/></g></g>`}
function plant(x,y,s){return `<g transform="translate(${x} ${y}) scale(${s})"><path d="M-45 0h90l-12 70h-66z" fill="#e9eef5" stroke="${O}" stroke-width="5"/><path d="M-50-6h100v12h-100z" fill="#d7dfea" stroke="${O}" stroke-width="5"/><g fill="#6cc07a" stroke="#3f8a4f" stroke-width="4"><path d="M0-6q-70-40-60-120q40 50 60 120z"/><path d="M0-6q60-50 80-110q10 70-80 110z"/><path d="M0-6q-10-90 20-150q20 80-20 150z"/><path d="M0-6q-80-10-110-60q70-10 110 60z"/></g></g>`}
