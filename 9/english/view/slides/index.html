:root{--ink:#14284b;--ink2:#3b4f72;--cream:#fdf6e9;--gold:#e3b45a;--pink:#fde3e6;--pinkb:#e8798a;--blue:#dcecff;--blueb:#6aa2e8;--yel:#fff1c9;--yelb:#e2b13c;--grn:#dff3e0;--grnb:#5fb873;--pur:#ece4ff;--purb:#9b84e6;--org:#ffe6d5;--orgb:#f0965f;--ok:#2fa35a;--no:#e05561}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#0e1830;overflow:hidden;font-family:'Baloo Bhaijaan 2','Noto Naskh Arabic',system-ui,sans-serif;color:var(--ink)}
button{font:inherit;cursor:pointer}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#stage{position:relative;width:1600px;height:900px;transform-origin:center center;overflow:hidden;border-radius:6px;background:#fff}
.scene{position:absolute;inset:0;width:100%;height:100%}
.slide{position:absolute;inset:0}
.slide.in{animation:sIn .5s ease}
@keyframes sIn{from{opacity:0;transform:scale(1.015)}to{opacity:1;transform:none}}
bdi.en{font-family:'Baloo Bhaijaan 2',system-ui,sans-serif;unicode-bidi:isolate}
mark{background:linear-gradient(transparent 45%,#ffe27a 45%,#ffe27a 92%,transparent 92%);color:inherit;padding:0 .1em}
/* banner (top title card) */
.banner{position:absolute;top:26px;left:50%;transform:translateX(-50%);min-width:760px;max-width:1300px;padding:14px 92px 16px;background:var(--cream);border:5px solid var(--gold);border-radius:34px;box-shadow:0 8px 0 rgba(0,0,0,.12),inset 0 0 0 4px #fff;text-align:center;z-index:5}
.banner:before{content:"";position:absolute;inset:8px;border:2.5px dashed #e9cf98;border-radius:26px;pointer-events:none}
.banner h1{margin:0;font-weight:800;font-size:54px;line-height:1.25;color:var(--ink)}
.banner h1 .k{color:#d6344f}
.banner .ico{position:absolute;top:50%;transform:translateY(-50%);font-size:52px}
.banner .ico.r{right:18px}.banner .ico.l{left:18px}
.banner.pink{background:#fff0f2;border-color:var(--pinkb)}.banner.pink:before{border-color:#f3b5bf}
.pill{position:absolute;left:50%;transform:translateX(-50%);background:#fffaf0;border:3px solid #d7b878;border-radius:22px;padding:4px 30px 6px;font-size:32px;font-weight:600;color:var(--ink2);white-space:nowrap;z-index:5;box-shadow:0 4px 0 rgba(0,0,0,.08)}
/* generic cards */
.card{position:relative;background:var(--cream);border:5px solid var(--gold);border-radius:30px;box-shadow:0 8px 0 rgba(0,0,0,.13);padding:18px 26px}
.card:before{content:"";position:absolute;inset:8px;border:2.5px dashed rgba(0,0,0,.14);border-radius:22px;pointer-events:none}
.c0{background:var(--pink);border-color:var(--pinkb)}.c1{background:var(--blue);border-color:var(--blueb)}.c2{background:var(--yel);border-color:var(--yelb)}.c3{background:var(--grn);border-color:var(--grnb)}.c4{background:var(--pur);border-color:var(--purb)}.c5{background:var(--org);border-color:var(--orgb)}
.big{font-size:44px;font-weight:700;line-height:1.45}
.mid{font-size:38px;font-weight:600;line-height:1.5}
.emo{font-size:72px;line-height:1;filter:drop-shadow(0 4px 0 rgba(0,0,0,.12))}
.hide{visibility:hidden}
.tap{cursor:pointer}
.panel{position:absolute;left:50%;transform:translateX(-50%);background:rgba(255,253,247,.94);border:5px solid #d9c08e;border-radius:34px;box-shadow:0 10px 0 rgba(0,0,0,.12);padding:26px 34px}
/* nav */
.nav{position:fixed;bottom:16px;width:64px;height:64px;border-radius:50%;border:0;background:rgba(255,255,255,.88);color:#14284b;font-size:30px;font-weight:800;box-shadow:0 4px 14px rgba(0,0,0,.25);z-index:50;display:flex;align-items:center;justify-content:center;transition:transform .15s,opacity .3s;opacity:.55}
.nav:hover{opacity:1;transform:scale(1.08)}
#next{left:16px}#prev{right:16px}
#menuBtn{position:fixed;top:14px;right:14px;width:50px;height:50px;border-radius:14px;border:0;background:rgba(255,255,255,.6);font-size:26px;z-index:50;opacity:.45;transition:opacity .3s}
#menuBtn:hover{opacity:1}
#count{position:fixed;bottom:30px;left:92px;color:#fff;font-size:15px;opacity:.55;z-index:50;font-family:system-ui;direction:ltr;text-shadow:0 1px 3px #000}
/* menu */
#menu{position:fixed;inset:0;background:rgba(10,20,42,.82);backdrop-filter:blur(6px);z-index:100;display:none;overflow:auto;padding:30px}
#menu.on{display:block}
#menu .mbox{max-width:1180px;margin:0 auto;background:#fffaf0;border-radius:28px;padding:22px 30px 30px;border:5px solid var(--gold)}
#menu h2{margin:0 0 4px;font-size:34px}
#menu .msub{color:#5b6782;font-size:18px;margin-bottom:12px}
#menu .unit{margin:16px 0 8px;font-size:22px;font-weight:800;color:#2f7d5b}
#menu .lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
#menu .les{border:3px solid #e5d6b5;border-radius:18px;background:#fff;padding:10px 14px}
#menu .les b{display:block;font-size:21px;line-height:1.35;cursor:pointer}
#menu .les b:hover{color:#d6344f}
#menu .les .ps{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
#menu .les .ps button{border:2px solid #9cc9d3;background:#eef8fa;color:#226b7a;border-radius:12px;padding:2px 12px;font-size:16px;font-weight:700}
#menu .les.cur{border-color:#e8798a;background:#fff5f6}
#menu .tools{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
#menu .tools button{border:2px solid #d7b878;background:#fff;border-radius:14px;padding:6px 16px;font-size:18px;font-weight:700}
#note{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);max-width:900px;background:#fffbe6;border:2px solid #e3b45a;border-radius:14px;padding:10px 18px;font-size:18px;z-index:60;display:none;box-shadow:0 6px 20px rgba(0,0,0,.3)}
#note.on{display:block}
/* fx */
.shake{animation:shake .45s}
@keyframes shake{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
.pop{animation:pop .45s}
@keyframes pop{50%{transform:scale(1.08)}}
.okc{outline:6px solid var(--ok)!important;outline-offset:3px;background:#e4f7e9!important}
.noc{outline:6px solid var(--no)!important;outline-offset:3px;background:#fde8ea!important}
.fade{opacity:.35}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:90}
/* ---------- gate (cover / lock / enter) ---------- */
.gate{position:absolute;width:560px;height:560px;overflow:hidden;border-radius:40px 40px 0 0}
.gate .frame{position:absolute;inset:0;border-radius:40px 40px 0 0;background:linear-gradient(#d9dfea,#b9c3d6);border:6px solid #2b3a55}
.gate .sign{position:absolute;top:16px;left:16px;right:16px;height:96px;background:#1f2d4d;border-radius:18px;display:flex;align-items:center;justify-content:center;gap:16px;color:#fff;font-size:40px;font-weight:800}
.gate .sign .tag{background:#ffcb3d;color:#1f2d4d;border-radius:12px;padding:0 16px;font-size:44px}
.gate .door{position:absolute;top:128px;bottom:0;width:calc(50% - 22px);background:linear-gradient(135deg,#d6e8ff,#a5c4eb);border:5px solid #2b3a55;transition:transform 1.1s cubic-bezier(.6,.05,.3,1)}
.gate .door.l{left:22px;border-radius:8px 0 0 0}.gate .door.r{right:22px;border-radius:0 8px 0 0}
.gate.open .door.l{transform:translateX(-96%)}.gate.open .door.r{transform:translateX(96%)}
.gate .inside{position:absolute;top:128px;bottom:0;left:22px;right:22px;background:radial-gradient(circle at 50% 40%,#fff9d6,#ffe08a 60%,#ffc94a);display:flex;align-items:center;justify-content:center;text-align:center;font-size:44px;font-weight:800;padding:20px;overflow:hidden}
.gate .lock{position:absolute;top:50%;left:50%;width:150px;height:150px;margin:-40px 0 0 -75px;border-radius:50%;background:rgba(255,255,255,.4);border:6px solid #fff;display:flex;align-items:center;justify-content:center;font-size:80px;transition:transform .6s,opacity .6s;z-index:3}
.gate.open .lock{transform:translateY(-200px) rotate(-30deg);opacity:0}
.gate .tape{position:absolute;left:-20px;right:-20px;top:62%;height:40px;background:repeating-linear-gradient(-45deg,#e8414f 0 30px,#fff 30px 60px);border:4px solid #2b3a55;border-radius:6px;z-index:4;transition:transform .8s,opacity .8s}
.gate.open .tape{transform:translateY(300px) rotate(8deg);opacity:0}
.gate .chev{position:absolute;bottom:40px;font-size:60px;color:#ffcb3d;font-weight:900;z-index:2}
.carpet{position:absolute;bottom:0;height:140px;background:linear-gradient(#e94a5a,#c92f42);clip-path:polygon(18% 0,82% 0,100% 100%,0 100%)}
/* cover card */
.ttlcard{position:absolute;left:50%;top:400px;transform:translateX(-50%) scale(.6);opacity:0;transition:all .9s .5s cubic-bezier(.3,1.4,.5,1);width:820px;padding:40px 50px;text-align:center;background:#fff2f4;border:7px solid #e8798a;border-radius:46px;box-shadow:0 14px 0 rgba(0,0,0,.15);z-index:6}
.ttlcard.on{transform:translateX(-50%) scale(1);opacity:1}
.ttlcard .lbl{display:inline-block;background:#ffd8df;border-radius:18px;padding:2px 26px;font-size:36px;font-weight:700}
.ttlcard .t{font-size:84px;font-weight:800;line-height:1.25;margin-top:14px}
.ttlcard .u{font-size:28px;color:#5b6782;margin-top:6px}
.ttlcard .h{position:absolute;top:-58px;left:50%;transform:translateX(-50%);width:210px;height:60px;border:12px solid #2b3a55;border-bottom:0;border-radius:30px 30px 0 0}
/* goals tickets */
.ticket{position:absolute;left:50%;transform:translateX(-50%);width:1080px;min-height:150px;display:flex;align-items:stretch;border-radius:30px;border:5px solid;box-shadow:0 8px 0 rgba(0,0,0,.12);overflow:hidden;transition:opacity .5s,transform .5s}
.ticket .st{width:120px;flex:none;display:flex;align-items:center;justify-content:center;font-size:56px;color:#fff;border-left:4px dashed rgba(255,255,255,.7)}
.ticket .n{width:110px;flex:none;display:flex;align-items:center;justify-content:center;font-size:66px;font-weight:800;border-left:3px dashed rgba(0,0,0,.18)}
.ticket .tx{flex:1;display:flex;align-items:center;padding:12px 30px;font-size:42px;font-weight:700;line-height:1.4}
.ticket .ic{width:130px;flex:none;display:flex;align-items:center;justify-content:center;font-size:72px}
.ticket.hid{opacity:0;transform:translateX(-50%) translateY(30px)}
/* list rows (tf / enter) */
.row{display:flex;align-items:center;gap:18px;background:#fff6f7;border:5px solid #f0a9b4;border-radius:30px;padding:10px 20px;box-shadow:0 6px 0 rgba(0,0,0,.1);font-size:40px;font-weight:700;transition:transform .7s,opacity .7s}
.row .num{width:64px;height:64px;border-radius:50%;background:#e8414f;color:#fff;display:flex;align-items:center;justify-content:center;font-size:36px;flex:none;border:4px solid #fff;box-shadow:0 0 0 3px #e8414f}
.row .txt{flex:1;line-height:1.35}
.row .ico{font-size:52px}
.yn{display:flex;gap:10px}
.yn button{border:4px solid #2b3a55;border-radius:18px;font-size:30px;font-weight:800;padding:4px 16px;background:#fff}
.yn .y{background:#e3f6e8;border-color:#2fa35a;color:#1d7a40}.yn .n2{background:#fde6e8;border-color:#e05561;color:#b8283a}
.row.gone{transform:translateX(-640px) scale(.3);opacity:0}
/* sort */
.bin{position:absolute;border-radius:30px;border:5px solid;box-shadow:0 8px 0 rgba(0,0,0,.12);padding:12px}
.bin .bh{display:flex;align-items:center;justify-content:center;gap:12px;background:rgba(255,255,255,.75);border:3px dashed rgba(0,0,0,.2);border-radius:20px;font-size:40px;font-weight:800;padding:4px 10px}
.bin .bb{margin-top:10px;min-height:110px;border:3px dashed rgba(0,0,0,.25);border-radius:20px;display:flex;flex-wrap:wrap;gap:8px;padding:8px;align-content:flex-start}
.bin.hot{transform:scale(1.03)}
.dcard{background:#fff8ea;border:5px solid #e2b13c;border-radius:26px;padding:10px 18px;font-size:36px;font-weight:800;text-align:center;box-shadow:0 6px 0 rgba(0,0,0,.12);cursor:grab;touch-action:none;user-select:none;display:inline-flex;align-items:center;gap:10px}
.dcard .e{font-size:44px}
.dcard.sel{outline:6px solid #5fa8ff;outline-offset:3px}
.dcard.drag{position:fixed;z-index:200;pointer-events:none;transform:rotate(-3deg) scale(1.05)}
.bin .dcard{font-size:28px;padding:4px 12px;cursor:default;box-shadow:none}
.bin .dcard .e{font-size:32px}
/* concept cards */
.ccard{position:absolute;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:6px;padding:22px 26px;cursor:pointer;transition:transform .3s}
.ccard:hover{transform:translateY(-4px)}
.ccard .hd{font-size:46px;font-weight:800;line-height:1.3}
.ccard .bd{font-size:36px;font-weight:600;line-height:1.45;transition:opacity .4s,max-height .5s;overflow:hidden}
.ccard.closed .bd{opacity:0;max-height:0}
.ccard .q{font-size:24px;opacity:.6}
.ccard:not(.closed) .q{display:none}
/* picture */
.pic{position:absolute;background:#fff;border:6px solid #2b3a55;border-radius:22px;box-shadow:0 10px 0 rgba(0,0,0,.18);overflow:hidden;display:flex;align-items:center;justify-content:center}
.pic img{max-width:100%;max-height:100%;display:block}
.pin{position:absolute;width:62px;height:62px;margin:-31px 0 0 -31px;border-radius:50%;background:#e8414f;color:#fff;font-size:32px;font-weight:800;border:5px solid #fff;box-shadow:0 0 0 4px #e8414f,0 6px 12px rgba(0,0,0,.3);display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:3;animation:pulse 1.8s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 10px rgba(232,65,79,.35),0 6px 12px rgba(0,0,0,.3)}}
.pin.done{background:#2fa35a;box-shadow:0 0 0 4px #2fa35a;animation:none}
.plabel{position:absolute;background:#fffaf0;border:4px solid #e3b45a;border-radius:16px;padding:2px 14px;font-size:28px;font-weight:800;white-space:nowrap;z-index:4;transform:translate(-50%,40px);box-shadow:0 4px 0 rgba(0,0,0,.12)}
.qbub{position:absolute;background:#fff;border:5px solid #5fa8ff;border-radius:30px;padding:16px 26px;font-size:38px;font-weight:700;line-height:1.4;box-shadow:0 8px 0 rgba(0,0,0,.12)}
.qbub .ans{margin-top:10px;padding-top:10px;border-top:3px dashed #9cc4f5;color:#1d7a40;display:none}
.qbub.on .ans{display:block;animation:pop .4s}
.qbub .rv{display:inline-block;margin-top:8px;font-size:26px;border:3px solid #5fa8ff;background:#eaf3ff;color:#2a5ea8;border-radius:14px;padding:0 16px}
.qbub.on .rv{display:none}
/* steps */
.steps{position:absolute;display:flex;flex-direction:column;gap:14px}
.step{display:flex;align-items:center;gap:16px;background:#fff;border:5px solid #9cc4f5;border-radius:26px;padding:10px 20px;font-size:36px;font-weight:700;line-height:1.35;box-shadow:0 6px 0 rgba(0,0,0,.1);transition:opacity .4s,transform .4s}
.step .sn{width:58px;height:58px;flex:none;border-radius:50%;background:#5fa8ff;color:#fff;display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:800}
.step.hid{opacity:0;transform:translateY(16px)}
/* mcq */
.opts{position:absolute;display:grid;grid-template-columns:1fr 1fr;gap:22px}
.opt{display:flex;align-items:center;gap:16px;border:5px solid #2b3a55;border-radius:28px;padding:16px 22px;font-size:40px;font-weight:800;color:#fff;text-align:start;box-shadow:0 8px 0 rgba(0,0,0,.2);min-height:120px;line-height:1.3}
.opt .sh{font-size:40px;width:60px;flex:none;text-align:center;opacity:.9}
.opt.o0{background:#e8586a}.opt.o1{background:#4f8fdf}.opt.o2{background:#e7a92d}.opt.o3{background:#3fa66a}
.opt.okc{background:#2fa35a!important;color:#fff;outline-color:#fff}
.opt.noc{background:#9aa3b5!important;color:#fff}
.opt.dim{opacity:.35}
.qcard{position:absolute;left:50%;transform:translateX(-50%);background:#fff;border:6px solid #2b3a55;border-radius:34px;padding:22px 34px;text-align:center;font-size:48px;font-weight:800;line-height:1.4;box-shadow:0 10px 0 rgba(0,0,0,.15)}
.why{position:absolute;left:50%;transform:translateX(-50%);background:#e8f8ee;border:4px solid #2fa35a;border-radius:22px;padding:8px 24px;font-size:30px;font-weight:700;color:#1d6b3a;display:none;max-width:1300px;text-align:center}
.why.on{display:block;animation:pop .4s}
/* tf */
.tfbtn{width:96px;height:80px;border-radius:22px;border:5px solid #2b3a55;font-size:46px;font-weight:900;background:#fff}
.tfbtn.t{color:#1d7a40}.tfbtn.f{color:#c22d40}
/* match */
.mcol{position:absolute;display:flex;flex-direction:column;gap:16px}
.mitem{background:#fff;border:5px solid #9cc4f5;border-radius:24px;padding:10px 18px;font-size:34px;font-weight:800;text-align:center;box-shadow:0 6px 0 rgba(0,0,0,.1);min-height:84px;display:flex;align-items:center;justify-content:center;line-height:1.3}
.mitem.sel{outline:6px solid #ffb703;outline-offset:3px}
.mitem.m0{background:#ffe1e5;border-color:#e8798a}.mitem.m1{background:#dcecff;border-color:#6aa2e8}.mitem.m2{background:#fff1c9;border-color:#e2b13c}.mitem.m3{background:#dff3e0;border-color:#5fb873}.mitem.m4{background:#ece4ff;border-color:#9b84e6}.mitem.m5{background:#ffe6d5;border-color:#f0965f}
svg.lines{position:absolute;inset:0;pointer-events:none;z-index:1}
/* order */
.olist{position:absolute;display:flex;flex-direction:column;gap:14px}
.oitem{display:flex;align-items:center;gap:16px;background:#fff;border:5px solid #c9b6f2;border-radius:24px;padding:8px 18px;font-size:36px;font-weight:700;box-shadow:0 6px 0 rgba(0,0,0,.1);cursor:pointer;line-height:1.3}
.oitem .on{width:56px;height:56px;flex:none;border-radius:16px;background:#9b84e6;color:#fff;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:800}
.oitem.sel{outline:6px solid #ffb703;outline-offset:3px}
.chk{position:absolute;left:50%;transform:translateX(-50%);border:5px solid #2b3a55;background:#ffcb3d;border-radius:22px;padding:6px 40px;font-size:36px;font-weight:800;box-shadow:0 6px 0 rgba(0,0,0,.2)}
/* fill */
.ftext{position:absolute;left:50%;transform:translateX(-50%);background:#fff;border:6px solid #2b3a55;border-radius:30px;padding:26px 36px;font-size:46px;font-weight:700;line-height:2;text-align:center;box-shadow:0 10px 0 rgba(0,0,0,.15)}
.blank{display:inline-block;min-width:200px;border-bottom:5px dashed #5fa8ff;color:#2a5ea8;text-align:center;padding:0 10px;cursor:pointer;line-height:1.4}
.blank.okc{border-bottom-color:#2fa35a;outline:0!important;background:none!important;color:#1d7a40}
.bank{position:absolute;left:50%;transform:translateX(-50%);display:flex;flex-wrap:wrap;gap:16px;justify-content:center}
.chip{background:#fff1c9;border:5px solid #e2b13c;border-radius:22px;padding:6px 22px;font-size:36px;font-weight:800;box-shadow:0 6px 0 rgba(0,0,0,.12)}
.chip.sel{outline:6px solid #5fa8ff;outline-offset:3px}
.chip.used{opacity:.3;pointer-events:none}
/* memory */
.mem{position:absolute;display:grid;gap:18px}
.mcard{perspective:900px;cursor:pointer}
.mcard .in{position:relative;width:100%;height:100%;transition:transform .6s;transform-style:preserve-3d}
.mcard.f .in,.mcard.done .in{transform:rotateY(180deg)}
.mcard .fr,.mcard .bk{position:absolute;inset:0;backface-visibility:hidden;border-radius:24px;border:5px solid #2b3a55;display:flex;align-items:center;justify-content:center;text-align:center;padding:8px;box-shadow:0 6px 0 rgba(0,0,0,.15)}
.mcard .fr{background:repeating-linear-gradient(45deg,#5fa8ff 0 18px,#79b8ff 18px 36px);font-size:60px;color:#fff}
.mcard .bk{background:#fff;transform:rotateY(180deg);font-size:30px;font-weight:800;line-height:1.3}
.mcard.done .bk{background:#e3f6e8;border-color:#2fa35a}
/* wheel */
.wheelw{position:absolute;width:600px;height:600px}
.wheel{width:100%;height:100%;border-radius:50%;border:10px solid #2b3a55;transition:transform 4s cubic-bezier(.15,.85,.25,1);box-shadow:0 12px 0 rgba(0,0,0,.18)}
.wptr{position:absolute;top:-24px;left:50%;margin-left:-28px;width:0;height:0;border-left:28px solid transparent;border-right:28px solid transparent;border-top:60px solid #e8414f;z-index:3;filter:drop-shadow(0 4px 0 rgba(0,0,0,.25))}
.whub{position:absolute;top:50%;left:50%;width:120px;height:120px;margin:-60px;border-radius:50%;background:#ffcb3d;border:8px solid #2b3a55;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:900;cursor:pointer;z-index:2}
/* race */
.track{position:absolute;left:60px;right:60px;display:flex;flex-direction:column;gap:12px}
.lane{position:relative;height:78px;border-radius:40px;background:#fff;border:5px solid #2b3a55;overflow:hidden;cursor:pointer}
.lane .fill{position:absolute;top:0;bottom:0;right:0;transition:width .8s}
.lane .car{position:absolute;top:50%;transform:translate(50%,-50%) scaleX(-1);font-size:56px;transition:right .8s}
.lane .nm{position:absolute;top:50%;right:20px;transform:translateY(-50%);font-size:28px;font-weight:800;z-index:2;mix-blend-mode:multiply}
.lane .fin{position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:46px}
.lane.turn{outline:6px solid #ffb703;outline-offset:3px}
/* boxes */
.boxes{position:absolute;display:grid;gap:22px}
.gbox{position:relative;border-radius:26px;border:5px solid #2b3a55;box-shadow:0 8px 0 rgba(0,0,0,.18);cursor:pointer;display:flex;align-items:center;justify-content:center;text-align:center;padding:12px;font-size:32px;font-weight:800;line-height:1.35;transition:transform .3s}
.gbox .lid{position:absolute;inset:0;border-radius:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:64px;transition:transform .6s,opacity .6s;z-index:2}
.gbox .lid small{font-size:34px;color:#fff;font-weight:800}
.gbox.open .lid{transform:translateY(-60px) rotate(-12deg);opacity:0;pointer-events:none}
.gbox .a{display:none;color:#1d7a40;margin-top:6px}
.gbox.ans .a{display:block}
/* mind map */
.mm{position:absolute;inset:0}
.mm .center{position:absolute;left:50%;top:520px;transform:translate(-50%,-50%);width:360px;min-height:150px;border-radius:50%;background:#ffcb3d;border:7px solid #2b3a55;display:flex;align-items:center;justify-content:center;text-align:center;font-size:44px;font-weight:900;padding:20px;box-shadow:0 10px 0 rgba(0,0,0,.18);z-index:2}
.mm .br{position:absolute;transform:translate(-50%,-50%);width:400px;padding:14px 18px;font-size:32px;font-weight:700;text-align:center;line-height:1.35;cursor:pointer;z-index:2}
.mm .br.closed{color:transparent}
.mm .br.closed:after{content:"؟";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#2b3a55;font-size:54px}
/* compare */
.cmp{position:absolute;display:flex;gap:30px}
.cmp .side{flex:1;padding:20px 26px}
.cmp .side h3{margin:0 0 10px;font-size:44px;text-align:center}
.cmp .side li{font-size:34px;font-weight:700;line-height:1.5;margin:6px 0;list-style:none;transition:opacity .4s}
.cmp .side li.hid{opacity:0}
.cmp .side li:before{content:"◆ ";color:rgba(0,0,0,.35)}
/* flip */
.flips{position:absolute;display:grid;gap:26px}
.flip{perspective:1000px;cursor:pointer}
.flip .in{position:relative;width:100%;height:100%;transition:transform .7s;transform-style:preserve-3d}
.flip.f .in{transform:rotateY(180deg)}
.flip .fr,.flip .bk{position:absolute;inset:0;backface-visibility:hidden;border-radius:30px;border:6px solid;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:16px;box-shadow:0 8px 0 rgba(0,0,0,.14)}
.flip .fr .e{font-size:84px}.flip .fr .t{font-size:44px;font-weight:900;line-height:1.25}.flip .fr .en2{font-size:30px;color:#3b4f72;font-weight:700;direction:ltr}
.flip .bk{transform:rotateY(180deg);background:#fff;font-size:34px;font-weight:700;line-height:1.45}
/* timer (try) */
.timer{position:absolute;width:250px;height:250px}
.timer svg{width:100%;height:100%;transform:rotate(-90deg)}
.timer .tv{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:62px;font-weight:900}
.timer .tv small{font-size:22px}
.timer button{position:absolute;bottom:-62px;left:50%;transform:translateX(-50%);border:4px solid #2b3a55;border-radius:16px;background:#ffcb3d;font-size:26px;font-weight:800;padding:2px 22px;white-space:nowrap}
/* exit ticket */
.exit{position:absolute;display:flex;gap:26px}
.exit .xc{flex:1;padding:22px;text-align:center;cursor:pointer}
.exit .xc .k{font-size:90px;font-weight:900;line-height:1}
.exit .xc .p{font-size:34px;font-weight:800;line-height:1.4;margin-top:8px}
/* homework */
.hwc{position:absolute;left:50%;transform:translateX(-50%) rotate(-1deg);width:1080px;background:#fffef6;border:6px solid #2b3a55;border-radius:20px;padding:30px 50px 34px;box-shadow:0 12px 0 rgba(0,0,0,.18);background-image:repeating-linear-gradient(transparent 0 62px,#cfe3f3 62px 64px)}
.hwc h3{margin:0 0 6px;font-size:50px;color:#d6344f}
.hwc li{font-size:38px;font-weight:700;line-height:64px}
.hwc .pin2{position:absolute;top:-28px;left:50%;font-size:56px;transform:translateX(-50%)}
.mascot{position:absolute;width:300px;height:300px;pointer-events:none}
.mascot svg{width:100%;height:100%;overflow:visible}
.say{position:absolute;background:#fff;border:5px solid #2b3a55;border-radius:28px;padding:10px 22px;font-size:32px;font-weight:800;line-height:1.35;box-shadow:0 6px 0 rgba(0,0,0,.14)}
.periodcard{position:absolute;left:50%;top:210px;transform:translateX(-50%);width:1000px;text-align:center;padding:36px}
.periodcard .pn{font-size:100px;font-weight:900;color:#d6344f;line-height:1.1}
.periodcard .ax{font-size:44px;font-weight:800;margin-top:12px;line-height:1.35}

/* live web editor (R.web, G10) */
.webed,.webpv{position:absolute;border-radius:22px;overflow:hidden;box-shadow:0 10px 0 rgba(0,0,0,.14);display:flex;flex-direction:column;z-index:4}
.webed{background:#1f2433;border:5px solid #3b4566}
.webpv{background:#fff;border:5px solid var(--gold);transition:all .35s}
.webpv.big{left:50px!important;width:1500px!important;z-index:9}
.webed .bar,.webpv .bar{display:flex;align-items:center;gap:14px;padding:8px 16px;font-size:24px;font-weight:700}
.webed .bar{background:#2c3349;color:#c9d3f0}.webpv .bar{background:#f2ece0;color:#5b6782}
.webed .dots i{display:inline-block;width:14px;height:14px;border-radius:50%;margin-left:6px;background:#ff6b6b}.webed .dots i:nth-child(2){background:#ffd166}.webed .dots i:nth-child(3){background:#6ccf8e}
.webed .fn{direction:ltr;font-family:Consolas,'Courier New',monospace;color:#ffd166}.webed .lb,.webpv .lb{margin-inline-start:auto;white-space:nowrap}
.webpv .url{flex:1;direction:ltr;text-align:left;background:#fff;border-radius:14px;padding:2px 14px;font-size:20px;font-family:Consolas,'Courier New',monospace;color:#3b4566;overflow:hidden;white-space:nowrap}
.webed textarea{flex:1;width:100%;border:0;outline:0;resize:none;background:transparent;color:#e8edff;caret-color:#ffd166;font:600 25px/1.45 Consolas,'Courier New',monospace;padding:14px 18px;direction:ltr;text-align:left;white-space:pre;tab-size:2}
.webpv iframe{flex:1;width:100%;border:0;background:#fff}
.webbt{position:absolute;display:flex;gap:14px;z-index:5}
.webbt button{font:700 24px 'Baloo Bhaijaan 2',sans-serif;padding:4px 22px;border-radius:18px;border:4px solid #3b4566;background:#fffaf0;color:#2c3349;cursor:pointer;box-shadow:0 5px 0 rgba(0,0,0,.12)}
.webbt button.sol{border-color:#e2b13c;background:#fff4d6}
/* ===== deck2 additions ===== */
.dots{position:absolute;bottom:22px;left:50%;transform:translateX(-50%);display:flex;gap:12px;z-index:6}
.dots i{width:22px;height:22px;border-radius:50%;background:#fff;border:4px solid #2b3a55;transition:.3s}
.dots i.c{background:#ffcb3d;transform:scale(1.35)}
.dots i.d{background:#6ccf8e}
.qn{font-size:24px;color:#5b6782;font-weight:700;margin-bottom:4px}
.askb{min-height:260px;line-height:1.45;padding:26px 40px;display:flex;flex-direction:column;justify-content:center}
.askb .ans{font-size:.9em}
.blank.qb{display:inline-block;min-width:150px;border-bottom:6px solid #e2b13c;color:#c0902c;padding:0 14px;margin:0 6px}
.blank.qb.okc{color:#1d7a40;border-color:#2fa35a;background:#e9fbef;border-radius:12px}
.readc{position:absolute;background:#fffdf6;border:5px solid #e2b13c;border-radius:30px;padding:24px 40px 24px;box-shadow:0 8px 0 rgba(0,0,0,.12);line-height:1.7;font-weight:600;max-height:690px;overflow:hidden}
.readc p{margin:0 0 12px;transition:opacity .4s,background .4s;border-radius:14px;padding:2px 10px}
.readc p.dim2{opacity:.28}
.readc p.cur{background:#fff3c4}
.readc.listen p.dim2{opacity:1;filter:blur(9px)}
.readc.quran{font-family:'Amiri','Noto Naskh Arabic',serif;line-height:2}

 "My friend ___ me an email last night.", "o": ["sent", "sended", "send"], "a": 0}]}, {"type": "explain", "title": "Comparing things", "lines": ["as + adjective + as → two things are equal.", "not as + adjective + as / -er than / more … than → not equal.", "the -est / the most … → three or more things."], "img": "L02_c4", "rule": "good → better → the best · bad → worse → the worst · far → further → the furthest", "icon": "⚖️"}, {"type": "flip", "title": "Comparing things ⚖️ – examples", "cards": [{"front": "Reem is [[as tall as]] her sister now.", "icon": "💡", "back": "👭"}, {"front": "Tennis [[isn't as dangerous as]] rugby.", "icon": "✨", "back": "🎾"}, {"front": "My brother's room is [[bigger than]] mine.", "icon": "🔎", "back": "🛏️"}, {"front": "Yesterday was [[the coldest]] day of the year so far.", "icon": "📌", "back": "🥶"}, {"front": "This is [[the most beautiful]] beach I've ever seen.", "icon": "⭐", "back": "🏝️"}]}, {"type": "quiz", "title": "Comparative or superlative?", "icon": "✏️", "qs": [{"q": "My sister is so much ___ than me. (short)", "o": ["shorter", "shortest", "more short"], "a": 0}, {"q": "That was the ___ thing anyone ever did for me. (kind)", "o": ["kindest", "kinder", "most kind"], "a": 0}, {"q": "My last holiday was much ___ than this one. (nice)", "o": ["nicer", "nicest", "more nice"], "a": 0}, {"q": "That was the ___ day of my life. (happy)", "o": ["happiest", "happyest", "most happy"], "a": 0}]}, {"type": "quiz", "title": "Comparative or superlative?", "icon": "✏️", "qs": [{"q": "Fish is much ___ than most other food. (smelly)", "o": ["smellier", "smellyer", "more smelly"], "a": 0}, {"q": "The coffee is ___ in that shop than in the one near home. (expensive)", "o": ["more expensive", "expensiver", "most expensive"], "a": 0}, {"q": "The documentary was the ___ thing on TV last night. (interesting)", "o": ["most interesting", "more interesting", "interestingest"], "a": 0}]}, {"type": "ask", "title": "Say it another way", "qs": [{"q": "That tree is the same size as our house. (as)", "a": "That tree is as big as our house."}, {"q": "My bag is stronger than Najla's bag. (not as)", "a": "Najla's bag is not as strong as mine."}, {"q": "I've never seen a bigger cat. (the)", "a": "It's the biggest cat I've ever seen."}], "icon": "🔁"}, {"type": "ask", "title": "Say it another way", "qs": [{"q": "London isn't as near to my home as Manchester. (far)", "a": "London is further / farther away from my home than Manchester."}, {"q": "My best friend and I are the same age. (as)", "a": "I'm as old as my best friend."}, {"q": "Documentaries are more interesting than soap operas. (not)", "a": "Soap operas aren't as interesting as documentaries."}], "icon": "🔁"}, {"type": "ask", "title": "Which activity is the best?", "qs": [{"q": "Family friends with two children your age are visiting. Which activity would everyone enjoy the least? Why?", "a": "I think everyone would enjoy going to a museum the least because the children might be bored."}, {"q": "Which activity is better: the cinema or the park? Why?", "a": "The park is better than the cinema because it's cheaper and we can play together."}, {"q": "Can you agree on the best activity?", "a": "We agree that the pizza restaurant is the best – everyone likes pizza!"}], "img": "L02_c1", "icon": "🍕"}, {"type": "read", "title": "My best moment!", "paras": ["We want to use our website to show the world what great students we have in our school. Tell us about your personal best moment! • When did it happen? • What did you do? • What skills did you use? • Why was it your best moment?"], "img": "L02_c3", "icon": "🎻"}, {"type": "read", "title": "My best moment!", "paras": ["Last summer, the theatre in my town posted an [[advert]] for young musicians to take part in a show. I really love playing the violin, so I decided to [[apply]]."], "img": "L02_c3", "icon": "🎻"}, {"type": "read", "title": "My best moment!", "paras": ["I had to prepare a two-minute musical piece to do in front of the [[organisers]]. I chose some music and practised on my violin for days! When I went to the theatre, I felt really nervous, but I also really wanted to do well."], "img": "L02_c3", "icon": "🎻"}, {"type": "read", "title": "My best moment!", "paras": ["When I started playing, I forgot how nervous I was and I played perfectly. And they [[accepted]] me! Being in the show with the other musicians was an amazing experience, and I learnt that if you want to do something and you work hard, you can be [[successful]]."], "img": "L02_c3", "icon": "🎻"}, {"type": "order", "title": "Put the story in order", "items": ["The theatre posted an advert. 📰", "The student decided to apply. ✅", "He prepared a two-minute piece. 🎼", "He practised on his violin for days. 🎻", "He felt nervous at the theatre. 😬", "He played perfectly. 🌟"], "icon": "🔢"}, {"type": "write", "title": "Write about your best moment", "task": "Write a paragraph about your personal best moment for the school website. Write about 100 words.", "steps": ["When did it happen?", "What did you do?", "What skills did you use?", "Why was it your best moment?"], "words": ["Last year, …", "I decided to …", "I practised …", "I felt nervous, but …", "It was the best … because …", "I learnt that …"], "model": "Last winter, my school had a science competition. I love science, so I decided to make a small robot with my friend Salim. We worked after school for three weeks and we used our maths and computer skills. On the day of the competition, I felt really nervous, but our robot worked perfectly. We won second prize! It was my best moment because I learnt that teamwork and hard work can make anything possible.", "icon": "✍️"}, {"type": "wheel", "title": "Two true, two false", "items": [{"q": "Say a true or false sentence: Last holiday I went …", "a": "Last holiday I went to Turkey. (true or false? Guess!)"}, {"q": "Say a true or false sentence: I tried …", "a": "I tried camel milk. (true or false?)"}, {"q": "Say a true or false sentence: I learnt …", "a": "I learnt to ride a horse."}, {"q": "Say a true or false sentence: I met …", "a": "I met a famous footballer!"}, {"q": "Say a true or false sentence: I swam …", "a": "I swam with dolphins in Musandam."}, {"q": "Say a true or false sentence: I saw …", "a": "I saw a sea turtle at Ras Al Jinz."}], "icon": "🎲"}, {"type": "balloons", "title": "Pop the right answer!", "rounds": [{"q": "go → ?", "o": ["goed", "went", "gone"], "a": 1}, {"q": "swim → ?", "o": ["swam", "swum", "swimmed"], "a": 0}, {"q": "Tennis isn't ___ dangerous as rugby.", "o": ["as", "than", "more"], "a": 0}], "icon": "🎈"}, {"type": "balloons", "title": "Pop the right answer!", "rounds": [{"q": "big → comparative", "o": ["biger", "bigger", "more big"], "a": 1}, {"q": "good → superlative", "o": ["the goodest", "the best", "the better"], "a": 1}, {"q": "Yesterday was the ___ day of the year.", "o": ["colder", "coldest", "most cold"], "a": 1}], "icon": "🎈"}, {"type": "steps", "title": "Let's remember!", "icon": "🧠", "steps": ["Past simple: finished actions → went, swam, took, felt, chose.", "as … as = equal · not as … as / -er than / more … than = not equal.", "the -est / the most … for three or more things.", "A good paragraph answers: When? What? What skills? Why?"]}, {"type": "exit", "title": "Exit ticket", "items": [{"k": "3", "text": "Write the past simple of: choose, feel, bring, think."}, {"k": "2", "text": "Compare two places in Oman with as … as or -er than."}, {"k": "1", "text": "What was your best moment this summer?"}], "icon": "🎟️"}, {"type": "homework", "title": "Homework", "head": "My homework", "items": ["Finish your paragraph: My best moment! (about 100 words).", "Grammar file p. 51 – Ex 3 (past simple).", "Learn ten irregular verbs from p. 49."], "icon": "🏠"}]}, {"id": "L03", "unit": "U2", "unitName": "Unit 1: Identity", "title": "Lesson 1 · Reading: How to make your own Photo board", "code": "", "theme": "city", "emo": "🖼️", "slides": [{"type": "cover", "say": "Unit 1 · Lesson 1 · Reading: How to make your own Photo board"}, {"type": "goals", "title": "Today's goals", "items": ["I can talk about my identity and personality.", "I can read short profiles and find key words."], "icon": "🎯"}, {"type": "goals", "title": "Today's goals", "items": ["I can match people with the right photo board (multiple matching).", "I can plan my own photo board."], "icon": "🎯"}, {"type": "ask", "title": "Who are you?", "qs": [{"q": "Can you think of three words that describe your personality?", "a": "I'm friendly, funny and hard-working."}, {"q": "What do you want to be, now and in the future? Think about your personality.", "a": "I want to be more confident in the future."}, {"q": "Think about your school and your way of life.", "a": "I want to be a good student now and a doctor in the future."}], "img": "L03_c1", "icon": "💭"}, {"type": "build", "title": "Identity words", "mode": "letters", "items": [{"a": "identity", "hint": "who you are", "emo": "🪪"}, {"a": "hobby", "hint": "something you do for fun", "emo": "🎨"}, {"a": "valley", "hint": "land between hills", "emo": "⛰️"}, {"a": "stadium", "hint": "a big place for sports games", "emo": "🏟️"}, {"a": "puzzle", "hint": "a game with many pieces", "emo": "🧩"}], "icon": "🔤"}, {"type": "ask", "title": "What is a photo board?", "qs": [{"q": "What is a photo board?", "a": "A board with five or six photos that show who you are."}, {"q": "What kind of person do you think made this board? Why?", "a": "A sociable person who loves sport and travelling – there are photos of friends, a basketball ticket and old buildings."}, {"q": "What does the board show?", "a": "Different parts of your life: where you live, your family, your hobbies and interests and your dreams."}], "img": "L03_c2", "icon": "🖼️"}, {"type": "read", "title": "Six profiles (1)", "paras": ["1 OSAMA I live with my family in Muscat – our [[capital city]]. I love football and I'm having karate lessons at the moment. My friends are really important to me. I [[hang out with]] them at the weekend."], "img": "L03_c3", "icon": "👫"}, {"type": "read", "title": "Six profiles (1)", "paras": ["2 HANA I come from a very small village, where everyone is very friendly. I like cooking for my family and I get lots of ideas for recipes online. I travel a lot with my family, which is great. Travelling is really exciting!"], "img": "L03_c3", "icon": "👫"}, {"type": "read", "title": "Six profiles (1)", "paras": ["3 BASIL I live in a village near the mountains with my parents and my sisters. All my cousins live [[nearby]], so we spend a lot of time together outdoors. I'm very [[cheerful]]. I like watching movies at home. I want to be a film star."], "img": "L03_c3", "icon": "👫"}, {"type": "read", "title": "Six profiles (2)", "paras": ["4 KIM I live in a city with my parents and my brother. We're very musical and we all play instruments. We go to a lot of shows, especially musicals. I also love hairstyles and clothes, and I make videos with my ideas."], "img": "L03_c3", "icon": "👫"}, {"type": "read", "title": "Six profiles (2)", "paras": ["5 RILEY I'm living with my grandparents by the [[coast]] this summer, and I'm really enjoying being by the sea! But I go back home every weekend to see my family. I love being outdoors, and I'm very sporty. I do a lot of different sports."], "img": "L03_c3", "icon": "👫"}, {"type": "read", "title": "Six profiles (2)", "paras": ["6 CODY I live with my parents in an apartment in Warsaw, the capital of Poland. I don't have any brothers or sisters. I spend a lot of time gaming with friends online. I'm also [[keen on]] sport, but only watching it, not playing it!"], "img": "L03_c3", "icon": "👫"}, {"type": "match", "title": "Who has which hobbies?", "pairs": [["Osama", "football ⚽ + karate 🥋"], ["Hana", "cooking 🍳 + travelling ✈️"], ["Basil", "watching movies 🎬 + being outdoors"]], "icon": "🎯"}, {"type": "match", "title": "Who has which hobbies?", "pairs": [["Kim", "music 🎸 + hairstyles and clothes 💇"], ["Riley", "lots of different sports 🏄"], ["Cody", "gaming online 🎮 + watching sport"]], "icon": "🎯"}, {"type": "quiz", "title": "Study tip: what do we know about Osama?", "qs": [{"q": "Osama lives in a …", "o": ["city", "village"], "a": 0}, {"q": "Osama likes …", "o": ["football", "school"], "a": 0}, {"q": "Osama is learning …", "o": ["karate", "the guitar"], "a": 0}, {"q": "Osama likes being …", "o": ["alone", "with friends"], "a": 1}, {"q": "So, which photo board belongs to Osama?", "o": ["A", "D", "H"], "a": 1}], "img": "L03_c5", "icon": "🔎"}, {"type": "explain", "title": "Study tip: multiple matching", "lines": ["Make sure ALL the information matches, not just some of it.", "Underline the key words in each profile first.", "Remember: the words can be different but mean the same (paraphrasing)."], "rule": "All the information must match → one board for each person.", "icon": "🧠"}, {"type": "flip", "title": "Study tip: multiple matching 🧠 – examples", "cards": [{"front": "Osama: Muscat → [[a large mosque]] and beautiful buildings", "icon": "💡", "back": "🕌"}, {"front": "Osama: karate lessons → [[a new karate club]]", "icon": "✨", "back": "🥋"}, {"front": "Osama: hang out with friends → [[a large group of students laughing]]", "icon": "🔎", "back": "😄"}, {"front": "Board H has football too … but no city or karate → ✘", "icon": "📌", "back": "❌"}]}, {"type": "read", "title": "Photo boards A–E", "paras": ["A This board has a photo of a big family, with eight children. They are standing near a house at the bottom of a [[valley]]. There's also a picture of some walking boots and a photo of the [[cover]] of a book called How to become an actor."], "img": "L03_c4", "icon": "🖼️"}, {"type": "read", "title": "Photo boards A–E", "paras": ["B A photo of a girl. She looks about fifteen. Another photo of the same girl next to the Eiffel Tower in Paris. A photo of a musician, and a teenager playing the guitar."], "img": "L03_c4", "icon": "🖼️"}, {"type": "read", "title": "Photo boards A–E", "paras": ["C A page from an entertainment guide. Two teenagers with their parents, on a bridge on a [[busy]] street. The boy is carrying a guitar. A screenshot of an online account about clothes called 'My Style'."], "img": "L03_c4", "icon": "🖼️"}, {"type": "read", "title": "Photo boards A–E", "paras": ["D A large mosque and some beautiful buildings. A sports kit and a card with the contact details of a new karate club. A fun photo of a large group of students laughing together in a park.", "E A recipe book and a wooden spoon. A family next to a modern apartment building in a city. A new pair of tennis shoes."], "img": "L03_c4", "icon": "🖼️"}, {"type": "read", "title": "Photo boards F–I", "paras": ["F A family at the seaside. A boat. A book called Teach yourself to play the piano. The family on a plane.", "G A suitcase and some flight tickets. Houses around a square, with a river nearby. A homemade cake, and a tablet screen with a video of a famous chef."], "img": "L03_c4", "icon": "🖼️"}, {"type": "read", "title": "Photo boards F–I", "paras": ["H A boy playing basketball. A boy with a surfboard, next to an older couple who are smiling. A school football team on a bus, with mountains in the [[background]]."], "img": "L03_c4", "icon": "🖼️"}, {"type": "read", "title": "Photo boards F–I", "paras": ["I A teenage boy with his parents in a city. The same boy in a bedroom, with a computer with a very big screen. An international football [[stadium]], with the teams ready to start playing."], "img": "L03_c4", "icon": "🖼️"}, {"type": "match", "title": "Whose photo board is it?", "pairs": [["Osama ⚽🥋", "Board D"], ["Hana 🍳✈️", "Board G"], ["Basil 🎬⛰️", "Board A"]], "icon": "🧩"}, {"type": "match", "title": "Whose photo board is it?", "pairs": [["Kim 🎸💇", "Board C"], ["Riley 🏄", "Board H"], ["Cody 🎮", "Board I"]], "icon": "🧩"}, {"type": "tf", "title": "True or false?", "items": [{"text": "Board E belongs to Hana because it has a recipe book.", "a": false, "fix": "Board E has a city apartment – Hana comes from a small village. Her board is G."}, {"text": "Board H shows an older couple – Riley's grandparents.", "a": true, "fix": "Riley is living with his grandparents by the coast."}, {"text": "Board I has a football stadium because Cody likes watching sport.", "a": true, "fix": "He is keen on sport, but only watching it."}, {"text": "Boards B, E and F don't belong to anyone in Ex 2.", "a": true, "fix": "There are three extra boards in a multiple-matching task."}], "icon": "✔✘"}, {"type": "mystery", "title": "Words from the photo boards", "img": "L03_c2", "answer": "Identity is like a puzzle: you need all of the pieces! 🧩", "qs": [{"q": "An area of land between hills and mountains:", "o": ["valley", "coast"], "a": 0}, {"q": "The outside part of a book:", "o": ["cover", "page"], "a": 0}, {"q": "With a lot of people:", "o": ["busy", "quiet"], "a": 0}, {"q": "The area behind the main thing you look at:", "o": ["background", "bottom"], "a": 0}], "icon": "🕵️"}, {"type": "ask", "title": "Sum up & speak", "qs": [{"q": "Cover the descriptions. What did Hana put on her board? Why?", "a": "She chose a photo of a cake because she likes cooking."}, {"q": "What did Basil put on his board? Why?", "a": "He put a photo of walking boots because he likes to spend time outdoors."}, {"q": "Plan your photo board: choose five photos. Why did you choose them?", "a": "A photo of my family, my football, Nizwa Fort because I live near it, my cat, and a plane because I want to be a pilot."}], "icon": "🗣️"}, {"type": "race", "title": "Team race", "qs": [{"q": "Osama lives in …", "options": ["Muscat", "Warsaw", "a village"], "a": 0}, {"q": "Who wants to be a film star?", "options": ["Basil", "Cody", "Kim"], "a": 0}, {"q": "Who is living by the sea this summer?", "options": ["Hana", "Riley", "Osama"], "a": 1}, {"q": "Kim's family is very …", "options": ["sporty", "musical", "quiet"], "a": 1}, {"q": "Cody likes sport, but only …", "options": ["playing it", "watching it", "reading about it"], "a": 1}, {"q": "Hana's board is …", "options": ["E", "G", "F"], "a": 1}, {"q": "In multiple matching, ___ the information must match.", "options": ["some of", "all of", "none of"], "a": 1}], "icon": "🏎️"}, {"type": "steps", "title": "Let's remember!", "icon": "🧠", "steps": ["A photo board shows who you are: family, home, hobbies, dreams.", "Underline key words in each profile.", "Multiple matching: ALL the information must match; there are extra texts.", "New words: valley, cover, busy, background, stadium, coast, nearby."]}, {"type": "exit", "title": "Exit ticket", "items": [{"k": "3", "text": "Write three key words about yourself for a photo board."}, {"k": "2", "text": "Which board belongs to Cody? Why?"}, {"k": "1", "text": "What does \"background\" mean?"}], "icon": "🎟️"}, {"type": "homework", "title": "Homework", "head": "My homework", "items": ["Make your own photo board (five or six photos or drawings) and write one sentence for each photo.", "Learn the words from Ex 5.", "Workbook pp. 12–13."], "icon": "🏠"}]}, {"id": "L04", "unit": "U2", "unitName": "Unit 1: Identity", "title": "Lesson 2 · Grammar: present simple & continuous", "code": "", "theme": "city", "emo": "⏰", "slides": [{"type": "cover", "say": "Unit 1 · Lesson 2 · Grammar: present simple & present continuous"}, {"type": "goals", "title": "Today's goals", "items": ["I can use the present simple for states, habits and repeated actions.", "I can use the present continuous for actions happening now or around now."], "icon": "🎯"}, {"type": "goals", "title": "Today's goals", "items": ["I can choose the right form and know the stative verbs.", "I can tell my partner a few things about myself."], "icon": "🎯"}, {"type": "ask", "title": "Think about the photo boards", "qs": [{"q": "What activities do the people like doing?", "a": "Osama likes football, Hana likes cooking, Kim plays instruments, Cody games online…"}, {"q": "What is one person learning to do?", "a": "Osama is learning karate – he's having karate lessons at the moment."}], "icon": "💭"}, {"type": "enter", "title": "Catch the words we use with the present continuous.", "gate": "✓", "items": [{"text": "Look!", "in": true}, {"text": "this week", "in": true}, {"text": "on Tuesdays", "in": false}, {"text": "never", "in": false}, {"text": "often", "in": false}, {"text": "today", "in": true}]}, {"type": "explain", "title": "Present simple", "lines": ["A for permanent states.", "B for habits and repeated actions.", "He/She/It + -s · don't/doesn't + verb · Do/Does … ?"], "img": "L04_c1", "rule": "I/We/You/They dance · He/She/It dances · Does he dance? Yes, he does.", "icon": "🔁"}, {"type": "flip", "title": "Present simple 🔁 – examples", "cards": [{"front": "I [[live]] in a village in the mountains.", "icon": "💡", "back": "A 🏡"}, {"front": "I [[hang out]] with them at the weekend.", "icon": "✨", "back": "B 👬"}, {"front": "I [[travel]] a lot with my family.", "icon": "🔎", "back": "B ✈️"}, {"front": "He [[sees]] his friends most weekends.", "icon": "📌", "back": "B (p. 52)"}]}, {"type": "explain", "title": "Present continuous", "lines": ["A for actions that are happening now.", "B for actions that are happening around now.", "We can contrast regular activities with activities happening now or around this time."], "img": "L04_c4", "rule": "am/is/are + verb-ing · put → putting · take → taking", "icon": "▶️"}, {"type": "flip", "title": "Present continuous ▶️ – examples", "cards": [{"front": "I'[[m living]] with my grandparents.", "icon": "💡", "back": "A 👵"}, {"front": "I'[[m having]] karate lessons at the moment.", "icon": "✨", "back": "B 🥋"}, {"front": "I'm living with my grandparents by the coast this summer, … but I [[go back]] home every weekend.", "icon": "🔎", "back": "🔁 vs ▶️"}, {"front": "I'm studying French this summer but in school I [[do]] German.", "icon": "📌", "back": "p. 52"}]}, {"type": "sort", "title": "Simple or continuous?", "bins": [{"label": "present simple", "icon": "🔁"}, {"label": "present continuous", "icon": "▶️"}], "cards": [{"text": "I live with my family in Muscat.", "icon": "", "bin": 0}, {"text": "I hang out with them at the weekend.", "icon": "", "bin": 0}, {"text": "We all play instruments.", "icon": "", "bin": 0}, {"text": "I go back home every weekend.", "icon": "", "bin": 0}, {"text": "I'm having karate lessons at the moment.", "icon": "", "bin": 1}, {"text": "I'm living with my grandparents this summer.", "icon": "", "bin": 1}, {"text": "I'm really enjoying being by the sea!", "icon": "", "bin": 1}], "icon": "🗂️"}, {"type": "explain", "title": "Stative verbs", "lines": ["Some verbs don't often use the continuous form.", "They describe states (feelings, thinking, senses, owning), not actions.", "But: some stative verbs can describe actions: having = eating, thinking = considering."], "img": "L04_c2", "rule": "feel, hate, hear, know, like, love, see, think, understand, want, need, prefer, believe, own…", "icon": "🧠"}, {"type": "flip", "title": "Stative verbs 🧠 – examples", "cards": [{"front": "I [[like]] cooking for my family. (✘ I'm liking)", "icon": "💡", "back": "❤️"}, {"front": "I [[want]] to be a film star.", "icon": "✨", "back": "⭐"}, {"front": "We're [[having]] lunch at the moment. (having = eating)", "icon": "🔎", "back": "🍽️"}, {"front": "I'm [[thinking]] about my answer. (= considering)", "icon": "📌", "back": "🤔"}]}, {"type": "enter", "title": "Catch only the verbs that don't usually use the continuous form.", "gate": "✓", "items": [{"text": "want", "in": true}, {"text": "write", "in": false}, {"text": "run", "in": false}, {"text": "understand", "in": true}, {"text": "travel", "in": false}, {"text": "hate", "in": true}]}, {"type": "quiz", "title": "Hi, Ibrahim!", "icon": "✏️", "qs": [{"q": "What ___ at the moment? (you / do)", "o": ["are you doing", "do you do"], "a": 0}, {"q": "It's three o'clock in Argentina. I ___ outside. (sit)", "o": ["'m sitting", "sit"], "a": 0}, {"q": "What time ___? (your classes / finish)", "o": ["do your classes finish", "are your classes finishing"], "a": 0}, {"q": "School ___ at two o'clock. (end)", "o": ["ends", "is ending"], "a": 0}, {"q": "That's why I ___ now! (relax)", "o": ["'m relaxing", "relax"], "a": 0}]}, {"type": "quiz", "title": "Hi, Ibrahim!", "icon": "✏️", "qs": [{"q": "My school day ___ at eight o'clock … (start)", "o": ["starts", "is starting"], "a": 0}, {"q": "… and it ___ until two o'clock. (not finish)", "o": ["doesn't finish", "isn't finishing"], "a": 0}, {"q": "___ now? (you / study)", "o": ["Are you studying", "Do you study"], "a": 0}, {"q": "No, I'm not. I ___ videos on my tablet. (watch)", "o": ["'m watching", "watch"], "a": 0}, {"q": "Well, you ___ your English now, too! (practise)", "o": ["'re practising", "practise"], "a": 0}]}, {"type": "quiz", "title": "Choose the correct form", "qs": [{"q": "My older sister ___ a lot of text messages, so she's always on her phone.", "o": ["sends", "is sending"], "a": 0}, {"q": "Our football team ___ hard for the competition on Saturday.", "o": ["practises", "is practising"], "a": 1}, {"q": "___ on the phone? I need your help.", "o": ["Are you chatting", "Do you chat"], "a": 0}, {"q": "We ___ any lessons when it's the festival.", "o": ["don't have", "aren't having"], "a": 0}, {"q": "Look! She ___ really quickly.", "o": ["runs", "'s running"], "a": 1}, {"q": "They ___ at home because they are ill.", "o": ["stay", "are staying"], "a": 1}], "icon": "✅"}, {"type": "quiz", "title": "Stative or not?", "qs": [{"q": "___ about your holiday?", "o": ["Do you think", "Are you thinking"], "a": 1}, {"q": "My mother ___ using a laptop.", "o": ["doesn't like", "isn't liking"], "a": 0}, {"q": "___ this lesson?", "o": ["Are you understanding", "Do you understand"], "a": 1}, {"q": "I ___ any help right now, thanks.", "o": ["don't need", "'m not needing"], "a": 0}, {"q": "We ___ dinner. Do you want to join us?", "o": ["have", "'re having"], "a": 1}], "img": "L04_c5", "icon": "🤔"}, {"type": "quiz", "title": "Jack's email", "icon": "✏️", "qs": [{"q": "At the moment, I ___ in my bedroom in my flat.", "o": ["'m sitting", "sit"], "a": 0}, {"q": "I ___ here with my grandparents.", "o": ["live", "'m living"], "a": 0}, {"q": "My friends ___ to the flat very often.", "o": ["don't come", "aren't coming"], "a": 0}, {"q": "We usually ___ in town.", "o": ["meet", "are meeting"], "a": 0}]}, {"type": "quiz", "title": "Jack's email", "icon": "✏️", "qs": [{"q": "Today it ___ outside, …", "o": ["'s snowing", "snows"], "a": 0}, {"q": "… so I ___ at home.", "o": ["'m staying", "stay"], "a": 0}, {"q": "___ in New York at the moment, too?", "o": ["Is it snowing", "Does it snow"], "a": 0}, {"q": "What ___ when it snows?", "o": ["do you do", "are you doing"], "a": 0}]}, {"type": "build", "title": "Make questions", "mode": "words", "items": [{"a": "Where do you live?", "hint": "where / you / live?", "emo": "🏠"}, {"a": "Who do you live with?", "hint": "who / you / live / with?", "emo": "👨‍👩‍👧"}, {"a": "How do you usually get to school?", "hint": "how / usually / you / get / to school?", "emo": "🚌"}, {"a": "What are you studying at the moment?", "hint": "what / you / study / at the moment?", "emo": "📚"}, {"a": "What are you doing now?", "hint": "what / you / do / now?", "emo": "📺"}], "icon": "🧱"}, {"type": "wheel", "title": "Tell your partner!", "items": [{"q": "What are you doing at the moment that's different to what you usually do?", "a": "I'm learning to speak Spanish at the moment."}, {"q": "What do you usually do in the evenings?", "a": "I usually do my homework and play football."}, {"q": "What do you usually do at weekends?", "a": "I visit my grandparents in Nizwa."}, {"q": "Tell me something I might not know about you.", "a": "My favourite food is harees."}, {"q": "What are you reading or watching these days?", "a": "I'm watching a series about space."}, {"q": "What's your mum or dad doing right now?", "a": "My mum is probably working at the hospital."}], "icon": "🎡"}, {"type": "race", "title": "Team race", "qs": [{"q": "I ___ in a village in the mountains. (permanent)", "options": ["live", "'m living"], "a": 0}, {"q": "Shh! The baby ___ .", "options": ["sleeps", "is sleeping"], "a": 1}, {"q": "She ___ cooking for her family.", "options": ["likes", "is liking"], "a": 0}, {"q": "Which is a stative verb?", "options": ["run", "know", "cook"], "a": 1}, {"q": "He ___ his friends most weekends.", "options": ["sees", "is seeing"], "a": 0}, {"q": "take → ?", "options": ["takeing", "taking", "takking"], "a": 1}, {"q": "___ you understand the exercise?", "options": ["Do", "Are"], "a": 0}], "icon": "🏎️"}, {"type": "steps", "title": "Let's remember!", "icon": "🧠", "steps": ["Present simple 🔁: permanent states + habits (every day, usually, at the weekend).", "Present continuous ▶️: now / around now (at the moment, today, this week).", "Stative verbs (know, like, want, understand…) don't usually take -ing.", "having = eating / thinking = considering → continuous is OK."]}, {"type": "exit", "title": "Exit ticket", "items": [{"k": "3", "text": "Write one present simple and one present continuous sentence about you."}, {"k": "2", "text": "Correct: I'm knowing the answer."}, {"k": "1", "text": "Write three stative verbs."}], "icon": "🎟️"}, {"type": "homework", "title": "Homework", "head": "My homework", "items": ["Grammar file p. 53 – Ex 2 and Ex 7.", "Write five sentences: what you usually do and what you are doing this week.", "Workbook p. 14."], "icon": "🏠"}]}, {"id": "L05", "unit": "U2", "unitName": "Unit 1: Identity", "title": "Lesson 3 · Vocabulary: personality adjectives", "code": "", "theme": "city", "emo": "😄", "slides": [{"type": "cover"}, {"type": "goals", "title": "Today's goals", "items": ["I can use twelve personality adjectives.", "I can say if an adjective is positive or negative."], "icon": "🎯"}, {"type": "goals", "title": "Today's goals", "items": ["I can use adjective + preposition collocations (good at, keen on …).", "I can do a multiple-choice cloze task."], "icon": "🎯"}, {"type": "build", "title": "Personality words", "mode": "letters", "items": [{"a": "sporty", "hint": "loves team games ⚽", "emo": "🏃"}, {"a": "funny", "hint": "makes people laugh", "emo": "😂"}, {"a": "shy", "hint": "nervous with new people", "emo": "🙈"}], "icon": "🔤"}, {"type": "build", "title": "Personality words", "mode": "letters", "items": [{"a": "calm", "hint": "relaxed, not angry", "emo": "😌"}, {"a": "lazy", "hint": "doesn't like working", "emo": "😴"}, {"a": "rude", "hint": "not polite", "emo": "😠"}], "icon": "🔤"}, {"type": "ask", "title": "What are you like?", "qs": [{"q": "Look at the three sets of adjectives. Which words describe you?", "a": "I'm sociable and sporty, but sometimes I'm a bit lazy!"}, {"q": "Which word describes your best friend?", "a": "My best friend is very funny."}, {"q": "Which word would you NOT like people to use about you? Why?", "a": "Rude, because I always try to be polite."}], "img": "L05_c1", "icon": "🙂"}, {"type": "flip", "title": "Personality adjectives (1)", "cards": [{"front": "clever", "icon": "🧠", "back": "is intelligent\n«My cousin's very clever. He always gets good marks.»"}, {"front": "confident", "icon": "💪", "back": "believes he/she can do things well\n«She's confident about the exams.»"}, {"front": "funny", "icon": "😂", "back": "makes people laugh\n«My brother loves telling jokes.»"}, {"front": "sociable", "icon": "👫", "back": "enjoys spending time with other people\n«Asma loves being with a big crowd of friends.»"}, {"front": "sporty", "icon": "⚽", "back": "likes activities such as ball games or team games\n«We often go swimming or cycling.»"}, {"front": "calm", "icon": "😌", "back": "is relaxed and not angry\n«My dad never gets annoyed.»"}], "icon": "😃"}, {"type": "flip", "title": "Personality adjectives (2)", "cards": [{"front": "lazy", "icon": "😴", "back": "doesn't like working\n«They never help with anything around the house.»"}, {"front": "unpleasant", "icon": "😒", "back": "i  park.", "o": ["lazy", "sociable"], "a": 0}, {"q": "You know I'm not very ___ , Anna.", "o": ["sporty", "rude"], "a": 0}, {"q": "It's OK for you to go out and be ___ .", "o": ["sociable", "clever"], "a": 0}, {"q": "I've got exams next week, so I need to relax and be ___ .", "o": ["calm", "shy"], "a": 0}, {"q": "Are you feeling ___ about the exams?", "o": ["confident", "serious"], "a": 0}, {"q": "OK, don't be ___ !", "o": ["rude", "clever"], "a": 0}]}, {"type": "explain", "title": "Adjective + preposition", "lines": ["Some adjectives go with a special preposition.", "We use adjective + preposition + noun.", "Remember: you can use some -ing forms as nouns."], "img": "L05_c3", "rule": "good/brilliant at · bad/terrible at · bored/fed up with · excited about · interested in · afraid/frightened of · keen on", "icon": "🔗"}, {"type": "flip", "title": "Adjective + preposition 🔗 – examples", "cards": [{"front": "She's also [[interested in]] languages.", "icon": "💡", "back": "🌍"}, {"front": "I'm [[fed up with]] this song.", "icon": "✨", "back": "🎵"}, {"front": "Frank's [[brilliant at]] cooking.", "icon": "🔎", "back": "🍳 (-ing)"}, {"front": "Are you [[keen on]] drawing or painting?", "icon": "📌", "back": "🎨"}]}, {"type": "match", "title": "Which preposition?", "pairs": [["good / brilliant / bad / terrible", "at"], ["bored / fed up", "with"], ["excited", "about"]], "icon": "🧲"}, {"type": "match", "title": "Which preposition?", "pairs": [["interested", "in"], ["afraid / frightened", "of"], ["keen", "on"]], "icon": "🧲"}, {"type": "read", "title": "How our personality develops", "paras": ["Can you see that the way you behave in different social situations is changing as you're getting older? I'm noticing it about myself, and I'm quite interested (1) ___ the changes."], "img": "L05_c2", "icon": "📝"}, {"type": "read", "title": "How our personality develops", "paras": ["I think that from the age of about thirteen, it becomes more important for us to (2) ___ in a way that means other people will like us. I think we also start to become (3) ___ on, and more serious about, our work and study."], "img": "L05_c2", "icon": "📝"}, {"type": "read", "title": "How our personality develops", "paras": ["We become good at (4) ___ rules and we want to complete tasks that we started much more than we did when we were younger. One thing I'm not sure about is if our friends affect our (5) ___ towards others."], "img": "L05_c2", "icon": "📝"}, {"type": "read", "title": "How our personality develops", "paras": ["I think we usually choose to hang out with people who are like us, but does that mean that we change to get new friends? I don't think so. I think we stay the same – we just choose friends who are (6) ___ to us!"], "img": "L05_c2", "icon": "📝"}, {"type": "quiz", "title": "Multiple-choice cloze", "icon": "✏️", "qs": [{"q": "I'm quite interested ___ the changes.", "o": ["in", "with", "of", "for"], "a": 0}, {"q": "… it becomes more important for us to ___ in a way that means other people will like us.", "o": ["appear", "act", "stay", "try"], "a": 1}, {"q": "We also start to become ___ on, and more serious about, our work and study.", "o": ["prepared", "careful", "keen", "active"], "a": 2}, {"q": "We become good at ___ rules …", "o": ["following", "keeping", "achieving", "doing"], "a": 0}, {"q": "… if our friends affect our ___ towards others.", "o": ["performance", "behaviour", "activities", "ways"], "a": 1}, {"q": "… we just choose friends who are ___ to us!", "o": ["same", "like", "matching", "similar"], "a": 3}]}, {"type": "memory", "title": "Memory: adjective + emoji", "pairs": [["sociable", "👫"], ["sporty", "⚽"], ["shy", "🙈"], ["noisy", "📢"], ["clever", "🧠"], ["calm", "😌"]], "icon": "🧠"}, {"type": "wheel", "title": "Find someone who …", "items": [{"q": "Are you interested in drawing or painting?", "a": "Yes, I am. I'm very interested in painting."}, {"q": "What are you good at?", "a": "I'm good at maths."}, {"q": "What are you afraid of?", "a": "I'm afraid
