s", "title": "Today's goals", "items": ["I can talk about how a city makes me feel.", "I can decide if a question asks for agreement, a suggestion or feelings."], "icon": "🎯"}, {"type": "goals", "title": "Today's goals", "items": ["I can listen for agreement and disagreement.", "I can put adverbs of frequency and time phrases in the right place."], "icon": "🎯"}, {"type": "memory", "title": "Feelings", "pairs": [["excited", "🤩"], ["happy", "😊"], ["interested", "🧐"], ["pleased", "😌"], ["relaxed", "😎"], ["stressed", "😫"]], "icon": "😊"}, {"type": "ask", "title": "A city you know", "qs": [{"q": "Think about a city you know. How does it make you feel?", "a": "Muscat makes me feel relaxed because of the sea and the mountains."}, {"q": "When does a city make you stressed?", "a": "When the roads are busy and there's a lot of traffic."}, {"q": "Compare with your partner. Are your answers similar or different?", "a": "They are different: my partner feels excited in big cities, but I feel stressed."}], "img": "L06_c1", "icon": "🌇"}, {"type": "sort", "title": "What are we listening for?", "bins": [{"label": "agreement (A)", "icon": "🤝"}, {"label": "suggestion (S)", "icon": "💡"}, {"label": "feelings (F)", "icon": "❤️"}], "cards": [{"text": "Q1 What do they both think?", "icon": "", "bin": 0}, {"text": "Q3 What do they agree about?", "icon": "", "bin": 0}, {"text": "Q6 They agree that in the city they are …", "icon": "", "bin": 0}, {"text": "Q5 What advice does Henry give?", "icon": "", "bin": 1}, {"text": "Q2 How does she feel about the change?", "icon": "", "bin": 2}, {"text": "Q4 How does the boy feel about living in a new city?", "icon": "", "bin": 2}], "icon": "🎯"}, {"type": "explain", "title": "Study tip: multiple choice", "lines": ["Decide if you're listening for agreement or disagreement.", "People may express the same ideas in different ways …", "… or give different opinions. Listen very carefully!"], "img": "L06_c4", "rule": "agree = same idea, different words · disagree = different opinions", "icon": "🎧"}, {"type": "flip", "title": "Study tip: multiple choice 🎧 – examples", "cards": [{"front": "Q1 What do they BOTH think? → only ONE option is true for both speakers.", "icon": "💡", "back": "🤝"}, {"front": "Speaker A: São Paulo is so exciting! Speaker B: Hmm, not for me. → disagreement ✘", "icon": "✨", "back": "🙅"}, {"front": "A: Istanbul has such an interesting past. B: Yes, all that history! → agreement ✔", "icon": "🔎", "back": "👍"}]}, {"type": "ask", "title": "Find the key words", "qs": [{"q": "Q1 options: A São Paulo … B Istanbul … C Paris …", "a": "very exciting / interesting past / museums … interesting"}, {"q": "Q2 options: A … B … C …", "a": "variety of restaurants / modern buildings / busier now"}, {"q": "Q3 options", "a": "don't like the very hot weather / snow … annoying / enjoy the different seasons"}, {"q": "Q5 options", "a": "bus … fastest / train … reliable, relaxing / quicker to walk"}, {"q": "Q6 options", "a": "more relaxed / more stressed / more interested"}], "img": "L06_c2", "icon": "🔑"}, {"type": "ask", "title": "Listen and choose", "qs": [{"q": "1 Cities they want to visit: what do they both think?", "a": "Listen to 1.03 – the answer is in the recording."}, {"q": "2 The grandmother: how does she feel about the change?", "a": "Listen to 1.04."}, {"q": "3 The weather: what do they agree about?", "a": "Listen to 1.04."}], "img": "L06_c2", "icon": "🎧"}, {"type": "ask", "title": "Listen and choose", "qs": [{"q": "4 The boy: how does he feel about living in a new city?", "a": "Listen to 1.04."}, {"q": "5 Travelling in the city: what advice does Henry give?", "a": "Listen to 1.04."}, {"q": "6 City and country: they agree that in the city they are …", "a": "Listen again (1.04) and check."}], "icon": "🎧"}, {"type": "explain", "title": "Adverbs of frequency", "lines": ["Adverbs of frequency go AFTER the verb be (and modal verbs).", "They go BEFORE other main verbs.", "Other time expressions usually go at the END of a sentence."], "img": "L06_c3", "rule": "be + adverb · adverb + main verb · time phrase at the end", "icon": "⏱️"}, {"type": "flip", "title": "Adverbs of frequency ⏱️ – examples", "cards": [{"front": "I hate winter – it's [[always]] so cold!", "icon": "💡", "back": "after be ❄️"}, {"front": "I [[often]] go on foot.", "icon": "✨", "back": "before verb 🚶"}, {"front": "Give me sunshine and heat [[every day]]!", "icon": "🔎", "back": "end ☀️"}, {"front": "You must [[never]] open this door.", "icon": "📌", "back": "after modal 🚪"}]}, {"type": "order", "title": "How often?", "items": ["always", "usually", "often", "sometimes", "occasionally", "rarely"], "icon": "📊"}, {"type": "build", "title": "Put the words in order", "mode": "words", "items": [{"a": "We can see a full moon once a month.", "hint": "we can see / once a month / a full moon", "emo": "🌕"}, {"a": "It isn't usually dark in June.", "hint": "it isn't / in June / usually / dark", "emo": "🌞"}, {"a": "I like swimming in the river now and then.", "hint": "in the river / I like swimming / now and then", "emo": "🏊"}], "icon": "🧱"}, {"type": "build", "title": "Put the words in order", "mode": "words", "items": [{"a": "Tom and I go skating once a week.", "hint": "Tom and I / once a week / go skating", "emo": "⛸️"}, {"a": "It often rains in the middle of the day.", "hint": "often / it / rains / in the middle of the day", "emo": "🌧️"}, {"a": "I am always tired on Thursday evenings.", "hint": "always / tired / am / on Thursday evenings / I", "emo": "😴"}], "icon": "🧱"}, {"type": "sort", "title": "Simple or continuous time words?", "bins": [{"label": "present simple", "icon": "🔁"}, {"label": "present continuous", "icon": "▶️"}], "cards": [{"text": "every day", "icon": "", "bin": 0}, {"text": "never", "icon": "", "bin": 0}, {"text": "often", "icon": "", "bin": 0}, {"text": "on Tuesdays", "icon": "", "bin": 0}, {"text": "once a month", "icon": "", "bin": 0}, {"text": "usually", "icon": "", "bin": 0}, {"text": "at the moment", "icon": "", "bin": 1}, {"text": "now", "icon": "", "bin": 1}, {"text": "this week", "icon": "", "bin": 1}, {"text": "today", "icon": "", "bin": 1}], "icon": "⏰"}, {"type": "quiz", "title": "Where does it go?", "qs": [{"q": "Karl is ___ happy. (always)", "o": ["Karl always is happy.", "Karl is always happy."], "a": 1}, {"q": "I go swimming in the winter. (never)", "o": ["I never go swimming in the winter.", "I go never swimming in the winter."], "a": 0}, {"q": "We go to the cinema. (twice a month)", "o": ["We twice a month go to the cinema.", "We go to the cinema twice a month."], "a": 1}, {"q": "He is late for school. (rarely)", "o": ["He is rarely late for school.", "He rarely is late for school."], "a": 0}, {"q": "I read a book. (from time to time)", "o": ["I read a book from time to time.", "I from time to time read a book."], "a": 0}], "img": "L06_c5", "icon": "📍"}, {"type": "wheel", "title": "True sentences about you", "items": [{"q": "hang out with my friends", "a": "I hang out with my friends every weekend."}, {"q": "go on my phone", "a": "I go on my phone most days."}, {"q": "take part in a sport", "a": "I take part in a sport twice a week."}, {"q": "watch a film", "a": "I watch a film now and then."}, {"q": "study", "a": "I study every day."}, {"q": "read a book", "a": "I rarely read a book in the summer."}], "icon": "🎡"}, {"type": "race", "title": "Team race", "qs": [{"q": "Adverbs of frequency go ___ the verb be.", "options": ["before", "after"], "a": 1}, {"q": "Adverbs of frequency go ___ other main verbs.", "options": ["before", "after"], "a": 0}, {"q": "Time phrases (once a week) usually go …", "options": ["at the start", "at the end"], "a": 1}, {"q": "Which is correct?", "options": ["I often go on foot.", "I go often on foot."], "a": 0}, {"q": "\"What do they BOTH think?\" asks for …", "options": ["agreement", "a suggestion", "feelings"], "a": 0}, {"q": "\"What advice does Henry give?\" asks for …", "options": ["feelings", "a suggestion", "agreement"], "a": 1}, {"q": "100% = …", "options": ["usually", "always", "often"], "a": 1}], "icon": "🏎️"}, {"type": "summary", "title": "Let's remember!", "center": "Lesson 4 · Listening: cities & adverbs of frequency, time phrases", "branches": ["Read the question: agreement 🤝, suggestion 💡 or feelings ❤️?", "Listen carefully: same idea in different words = agreement.", "be + always/often … · always/often … + main verb", "Time phrases (once a week, now and then) go at the end."], "icon": "🧠"}, {"type": "exit", "title": "Exit ticket", "items": [{"k": "3", "text": "Write a sentence with \"usually\" and the verb be."}, {"k": "2", "text": "Write a sentence with \"once a month\"."}, {"k": "1", "text": "What key word tells you a question asks for agreement?"}], "icon": "🎟️"}, {"type": "homework", "title": "Homework", "head": "My homework", "items": ["Write six true sentences with the prompts in Ex 9.", "Practice guide p. 78–79: read the tips for Listening Part 2.", "Workbook p. 16."], "icon": "🏠"}]}, {"id": "L07", "unit": "U2", "unitName": "Unit 1: Identity", "title": "Lesson 5 · Speaking: giving personal information", "code": "", "theme": "city", "emo": "🗣️", "slides": [{"type": "cover", "say": "Unit 1 · Lesson 5 · Speaking: giving personal information"}, {"type": "goals", "title": "Today's goals", "items": ["I can give personal information and spell difficult words.", "I can answer interview questions with full answers."], "icon": "🎯"}, {"type": "goals", "title": "Today's goals", "items": ["I can give reasons and examples (because, as, for example).", "I can do Speaking Part 1 (Introduction)."], "icon": "🎯"}, {"type": "riddle", "title": "What am I?", "items": [{"clues": ["I'm your first name and your family name together.", "You write me on forms."], "a": "full name", "emo": "🪪"}, {"clues": ["Everyone in your family has me.", "I'm also called your surname."], "a": "family name", "emo": "👨‍👩‍👧"}, {"clues": ["I come between your first name and your family name.", "I'm also called your second name."], "a": "middle name", "emo": "🔤"}, {"clues": ["I'm a short code of letters and numbers in an address.", "The post office uses me."], "a": "postcode", "emo": "📮"}, {"clues": ["I have an @ in me.", "You use me to send messages online."], "a": "email address", "emo": "📧"}], "icon": "🤔"}, {"type": "ask", "title": "What answers would you give?", "qs": [{"q": "What's your name / family name / full name / surname?", "a": "My name is Saif. My family name is Al Harthy. My full name is Saif Hamed Al Harthy."}, {"q": "What's your first name / second name / middle name?", "a": "My first name is Saif and my middle name is Hamed."}, {"q": "Which words mean the same?", "a": "family name = surname · second name = middle name"}], "icon": "✍️"}, {"type": "ask", "title": "Personal information", "qs": [{"q": "Full name? Can you spell it?", "a": "Maryam Salim Al Busaidi. M-A-R-Y-A-M …"}, {"q": "Street and house number?", "a": "House 25, Way 3107."}, {"q": "Town? How do you spell it?", "a": "Ibri. I-B-R-I."}, {"q": "Postcode? Email?", "a": "My postcode is 511. My email is maryam09@… (only in class, never share it online!)"}], "img": "L07_c2", "icon": "📋"}, {"type": "build", "title": "Spell the town!", "mode": "letters", "items": [{"a": "MUSCAT", "hint": "the capital of Oman", "emo": "🏙️"}, {"a": "SALALAH", "hint": "green in the khareef", "emo": "🌿"}, {"a": "NIZWA", "hint": "a famous fort and souq", "emo": "🏰"}, {"a": "SOHAR", "hint": "a port city in Al Batinah", "emo": "⚓"}, {"a": "ANTALYA", "hint": "the town in the book example", "emo": "🇹🇷"}], "icon": "🔡"}, {"type": "ask", "title": "Listen: Huda and Chen", "qs": [{"q": "Where do you live? Where do you come from? Who gives the best answers? Why?", "a": "Listen to 1.05 – decide from the recording."}, {"q": "How could the students improve their answers?", "a": "Add information, descriptions and reasons."}, {"q": "What do you enjoy doing in your free time? Who gives the best answer this time?", "a": "Listen to 1.06 – decide from the recording."}, {"q": "How could the other student improve?", "a": "Add examples, opinions and reasons."}], "img": "L07_c1", "icon": "🎧"}, {"type": "explain", "title": "Giving reasons and examples", "lines": ["Don't just answer with one or two words.", "Give a reason: because / as / one reason is (that).", "Give an example: for example."], "img": "L07_c4", "rule": "answer + reason + example = a good answer ✅", "icon": "💡"}, {"type": "flip", "title": "Giving reasons and examples 💡 – examples", "cards": [{"front": "I live in Sur [[because]] my father works there.", "icon": "💡", "back": "🏠"}, {"front": "I love weekends [[as]] I can spend time with my family.", "icon": "✨", "back": "👨‍👩‍👦"}, {"front": "[[One reason is that]] it's near the sea.", "icon": "🔎", "back": "🌊"}, {"front": "I like sport. [[For example]], I play football and basketball.", "icon": "📌", "back": "⚽🏀"}]}, {"type": "quiz", "title": "Reason or example?", "icon": "✏️", "qs": [{"q": "I like history ___ I love learning about the past.", "o": ["because", "for example"], "a": 0}, {"q": "I enjoy many sports. ___ , I swim and play tennis.", "o": ["For example", "Because"], "a": 0}, {"q": "I prefer winter. One reason ___ that it isn't too hot.", "o": ["is", "as"], "a": 0}, {"q": "I walk to school ___ it's very near my house.", "o": ["as", "for example"], "a": 0}, {"q": "I like spicy food, ___ shuwa and mishkak.", "o": ["for example", "because"], "a": 0}]}, {"type": "ask", "title": "Example answers (Practice guide)", "qs": [{"q": "Tell us about a film you like.", "a": "I really like the film Funny Animals 2. I like the first film, too, but that's my favourite. The story and the effects are brilliant!"}, {"q": "What do you usually do at the weekends?", "a": "I love the weekends because I can spend time with my family. I often go shopping with my friends and I like to watch sports on TV."}, {"q": "What's your favourite subject at school?", "a": "I'm sorry – could you repeat that, please? … OK. Well, my favourite subject at school at the moment is history. I love learning about the past …"}, {"q": "Do you prefer the summer or the winter?", "a": "That's an interesting question. I like both seasons. They have good and bad points …"}], "icon": "⭐"}, {"type": "tf", "title": "Speaking Part 1: tips", "items": [{"text": "Answer the question, giving a reason and an example.", "a": true, "fix": "Yes – that's the first study tip."}, {"text": "Short answers like \"I watch the TV.\" are best.", "a": false, "fix": "Try not to give very short answers. Give some details."}, {"text": "In Part 1 you talk to your partner.", "a": false, "fix": "You don't need to speak to your partner. You just speak to the teacher."}], "icon": "✔✘"}, {"type": "tf", "title": "Speaking Part 1: tips", "items": [{"text": "If you don't hear the question, ask the teacher to repeat it.", "a": true, "fix": "I'm sorry – could you repeat that, please?"}, {"text": "If you don't know what to say, stay silent.", "a": false, "fix": "Say something, even \"I'm sorry, I've never thought about that before.\""}], "icon": "✔✘"}, {"type": "match", "title": "Useful language", "pairs": [["I'm sorry – could you repeat that, please?", "difficult question 😕"], ["That's because …", "giving reasons 💡"], ["My favourite … is …", "likes ❤️"], ["I'm not very keen on …", "dislikes 👎"], ["I like both, but I prefer to …", "choosing ⚖️"]], "icon": "🗂️"}, {"type": "ask", "title": "Famous Person Fact File", "qs": [{"q": "Student A: ask for the information. What's your name?", "a": "My name is … (imagine you are a famous person)."}, {"q": "Where do you live? Which town or city?", "a": "I live in Madrid because my football team is there."}, {"q": "What do you do in your free time?", "a": "I play video games and I go to the beach. For example, …"}], "img": "L07_c3", "icon": "⭐"}, {"type": "wheel", "title": "Interview me!", "items": [{"q": "How do you get to school every day?", "a": "I go by bus because I live far from school."}, {"q": "What's your favourite subject?", "a": "English, as I love talking to people from other countries."}, {"q": "What do you like doing at the weekend?", "a": "I like visiting my grandparents. For example, last Friday we had lunch together."}, {"q": "Who do you like to spend time with?", "a": "My cousins, because they're funny."}, {"q": "What do you like doing in the school holidays?", "a": "I like travelling. One reason is that I can see new places."}, {"q": "Do you prefer playing or watching sport?", "a": "I prefer playing because I'm very sporty."}, {"q": "What kinds of films do you like?", "a": "I like comedies because they make me laugh."}], "icon": "🎡"}, {"type": "race", "title": "Team race", "qs": [{"q": "family name = …", "options": ["surname", "first name", "middle name"], "a": 0}, {"q": "middle name = …", "options": ["second name", "full name", "surname"], "a": 0}, {"q": "Which word gives an example?", "options": ["because", "for example", "as"], "a": 1}, {"q": "Which word gives a reason?", "options": ["as", "for example", "and"], "a": 0}, {"q": "You didn't hear the question. You say:", "options": ["What?", "I'm sorry – could you repeat that, please?", "Nothing."], "a": 1}, {"q": "A good Part 1 answer is …", "options": ["one word", "answer + reason + example", "very, very long"], "a": 1}], "icon": "🏎️"}, {"type": "steps", "title": "Let's remember!", "icon": "🧠", "steps": ["Spell difficult words: How do you spell …?", "Answer + reason (because, as, one reason is that) + example (for example).", "Part 1: talk to the teacher, not your partner.", "Ask politely: Could you repeat that, please?"]}, {"type": "exit", "title": "Exit ticket", "items": [{"k": "3", "text": "Answer with a reason: Where do you live?"}, {"k": "2", "text": "Answer with an example: What do you do in your free time?"}, {"k": "1", "text": "Spell your family name."}], "icon": "🎟️"}, {"type": "homework", "title": "Homework", "head": "My homework", "items": ["Write answers (2–3 sentences each) to the four questions in Ex 9.", "Practise speaking for one minute about yourself.", "Workbook p. 17."], "icon": "🏠"}]}, {"id": "L08", "unit": "U2", "unitName": "Unit 1: Identity", "title": "Lesson 6 · Writing: an email – a personal profile", "code": "", "theme": "city", "emo": "📧", "slides": [{"type": "cover", "say": "Unit 1 · Lesson 6 · Writing: an email – a personal profile"}, {"type": "goals", "title": "Today's goals", "items": ["I can read an advert and an email.", "I can match paragraphs with notes."], "icon": "🎯"}, {"type": "goals", "title": "Today's goals", "items": ["I can use quite and very correctly.", "I can write an email about myself in about 100 words."], "icon": "🎯"}, {"type": "wheel", "title": "Talk about you", "items": [{"q": "something you love", "a": "I love hiking in the mountains."}, {"q": "something you're interested in", "a": "I'm interested in photography."}, {"q": "something you're keen on", "a": "I'm keen on drawing."}, {"q": "something you can't stand", "a": "I can't stand playing video games."}, {"q": "something you're good at", "a": "I'm good at cooking."}, {"q": "something you're afraid of", "a": "I'm afraid of the dark."}], "icon": "🎡"}, {"type": "read", "title": "The advert: Tell us about you!", "paras": ["Channel 1 is making a programme about life for young people around the world. We want to know more about you and the place you live. We will come and film you and your family.", "For this programme, you can be 13–16, so lots of teenagers can take part! We want to know what you are like and what kind of things you enjoy."], "img": "L08_c2", "icon": "📺"}, {"type": "read", "title": "The advert: Tell us about you!", "paras": ["Why should we choose you? Send us your [[profile]] in an email.", "Rahaf's notes: A tell them · B talk about my personality · C say what · D give a reason"], "img": "L08_c2", "icon": "📺"}, {"type": "read", "title": "Rahaf's email", "paras": ["Dear Dana,", "1 I'm Rahaf. I'm fourteen, and I come from Oman. My life is very [[unusua ng? What's so funny?", "What? Why do you laugh? What's so funny?"], "a": 0}, {"q": "2", "o": ["Do you visit always your grandparents at the weekend?", "Do you always visit your grandparents at the weekend?"], "a": 1}, {"q": "3", "o": ["Brandon doesn't want to come with us today.", "Brandon isn't wanting to come with us today."], "a": 0}, {"q": "4", "o": ["Can you stop that noise? I try to revise for my test.", "Can you stop that noise? I'm trying to revise for my test."], "a": 1}, {"q": "5", "o": ["I don't think that's a very good idea.", "I'm not thinking that's a very good idea."], "a": 0}, {"q": "6", "o": ["What happened? Why does Eliza cry?", "What happened? Why is Eliza crying?"], "a": 1}], "icon": "🎧"}, {"type": "read", "title": "A new kind of club", "paras": ["Do you want to do something different after school? Many of you play sports or learn music, but we think it's time to start a new club (1) ___ helps other people. There are many older people who live on their own, and often feel lonely. Are you interested (2) ___ helping them? We hope so!"], "img": "L10_c2", "icon": "☕"}, {"type": "read", "title": "A new kind of club", "paras": ["We (3) ___ looking for students who would like to help. All you have to do is spend one hour (4) ___ Wednesday afternoons serving coffee and tea to older people who want to come and meet others for a chat. We are also (5) ___ to serve cakes and biscuits, which we will make. We start next Wednesday in the school hall at 4 p.m."], "img": "L10_c2", "icon": "☕"}, {"type": "read", "title": "A new kind of club", "paras": ["At (6) ___ moment, we are still organising everything we need. Send us a message if you're keen on the idea of helping."], "img": "L10_c2", "icon": "☕"}, {"type": "ask", "title": "One word for each gap", "qs": [{"q": "(1) a new club ___ helps other people", "a": "that / which"}, {"q": "(2) Are you interested ___ helping them?", "a": "in"}, {"q": "(3) We ___ looking for students", "a": "are"}], "icon": "🔑"}, {"type": "ask", "title": "One word for each gap", "qs": [{"q": "(4) one hour ___ Wednesday afternoons", "a": "on"}, {"q": "(5) We are also ___ to serve cakes and biscuits", "a": "going (also: planning / hoping)"}, {"q": "(6) At ___ moment", "a": "the"}], "icon": "🔑"}, {"type": "write", "title": "My free time", "task": "Write a paragraph about how you do and don't enjoy spending your free time.", "steps": ["What do you usually do in your free time?", "What are you doing these days?", "What are you keen on / not keen on?", "Use adverbs of frequency."], "words": ["I usually …", "At the moment, I'm …", "I'm really keen on …", "I'm fed up with …", "I never …"], "model": "In my free time, I usually play football with my friends near our house. I'm really keen on sport, so I also go swimming twice a week. At the moment, I'm learning to play the oud, which is quite difficult! I don't enjoy shopping – I'm bored with walking around the mall. I never play video games for a long time because I get tired of them.", "icon": "✍️"}, {"type": "race", "title": "Unit 1 race", "qs": [{"q": "Someone who is relaxed and not angry is …", "options": ["calm", "noisy", "shy"], "a": 0}, {"q": "I'm fed up ___ this song.", "options": ["of", "with", "at"], "a": 1}, {"q": "Look! She ___ really quickly.", "options": ["runs", "'s running"], "a": 1}, {"q": "I ___ in Muscat. (permanent)", "options": ["live", "'m living"], "a": 0}, {"q": "Which is correct?", "options": ["Karl always is happy.", "Karl is always happy."], "a": 1}, {"q": "quite ___ interesting story", "options": ["a", "an", "the"], "a": 1}, {"q": "Multiple matching: ___ the information must match.", "options": ["some of", "all of"], "a": 1}], "icon": "🏎️"}, {"type": "steps", "title": "Let's remember!", "icon": "🧠", "steps": ["Personality: sociable, clever, confident, lazy, rude, calm, shy …", "Collocations: good at, keen on, interested in, afraid of …", "Present simple (habits/states) vs present continuous (now/around now).", "Adverbs: after be, before main verbs; time phrases at the end."]}, {"type": "exit", "title": "Exit ticket", "items": [{"k": "3", "text": "Write two sentences: one present simple, one present continuous."}, {"k": "2", "text": "Write a sentence with \"keen on\"."}, {"k": "1", "text": "Which Unit 1 word was the hardest for you?"}], "icon": "🎟️"}, {"type": "homework", "title": "Homework", "head": "My homework", "items": ["Learn the Unit 1 wordlist (p. 23).", "Review Ex 1–3 p. 24 – finish the items we didn't do in class.", "Workbook p. 19."], "icon": "🏠"}]}, {"id": "L11", "unit": "U3", "unitName": "Unit 2: Connections", "title": "Lesson 1 · Reading: The importance of languages", "code": "", "theme": "library", "emo": "🗣️", "slides": [{"type": "cover", "say": "Unit 2 · Lesson 1 · Reading: The importance of languages"}, {"type": "goals", "title": "Today's goals", "items": ["I can talk about how I communicate with my friends.", "I can read short texts and choose the correct meaning."], "icon": "🎯"}, {"type": "goals", "title": "Today's goals", "items": ["I can understand the main point of a long article.", "I can find words in a text from their meanings."], "icon": "🎯"}, {"type": "ask", "title": "How do you communicate?", "qs": [{"q": "How do you prefer to communicate with your friends?", "a": "I prefer talking face to face, but I also send voice messages."}, {"q": "When do you and your friends usually talk?", "a": "We talk at break time and in the evenings."}, {"q": "What kinds of things do you talk about?", "a": "Football, school, games and our plans for the weekend."}], "img": "L11_c1", "icon": "📱"}, {"type": "tf", "title": "Language facts: true or false?", "items": [{"text": "Arabic is spoken by more than 300 million people around the world.", "a": true, "fix": "Answers p. 58: they are all true!"}, {"text": "Australia does not have an official language.", "a": true, "fix": "True (p. 58)."}, {"text": "The Latin alphabet, used in English and Spanish, dates back over 1,000 years.", "a": true, "fix": "True (p. 58)."}], "icon": "🌍"}, {"type": "tf", "title": "Language facts: true or false?", "items": [{"text": "Twenty-five percent of people in the world speak at least a small amount of English.", "a": true, "fix": "True (p. 58)."}, {"text": "Speaking more than one language increases your brain power.", "a": true, "fix": "True (p. 58). Which fact is the most surprising?"}], "icon": "🌍"}, {"type": "ask", "title": "Languages around us", "qs": [{"q": "What languages are spoken in your country?", "a": "Arabic, and also English, Swahili, Balochi, Urdu and others."}, {"q": "What are the advantages of speaking more than one language?", "a": "You can travel, find better jobs and make friends from other countries."}, {"q": "Are some languages easier to learn than others? Why?", "a": "Yes – a language that is similar to your own language is easier."}], "img": "L11_c5", "icon": "🗺️"}, {"type": "read", "title": "Two short texts", "paras": ["NOTICE – Extra English lessons: Students with low grades can attend extra classes after school. Contact your teacher if you are interested.", "MESSAGE: Hi Anna, are you OK? You weren't in school. The Spanish teacher asked me to [[remind]] you that money for the trip is [[due]] on Friday. Eliza"], "img": "L11_c2", "icon": "📝"}, {"type": "quiz", "title": "Short texts: choose the answer", "qs": [{"q": "What does the notice say about extra English lessons?", "o": ["They are only open to students with good grades.", "They take place during the school day.", "Students should speak to their teacher about them."], "a": 2}, {"q": "Why has Eliza sent the message to Anna?", "o": ["to tell her she needs to speak to the Spanish teacher", "to tell her she needs to pay for something", "to remind her about the Spanish class on Friday"], "a": 1}], "img": "L11_c2", "icon": "✅"}, {"type": "explain", "title": "Study tip: the main point", "lines": ["In a multiple-choice long text, the LAST question tests your understanding of the main point.", "Read the whole text first. Then ask: what is the writer's message?", "The other questions follow the paragraphs in order."], "rule": "Last question = main point of the whole text", "icon": "🎯"}, {"type": "flip", "title": "Study tip: the main point 🎯 – examples", "cards": [{"front": "How does the article argue that we must stop languages from dying out?", "icon": "💡", "back": "❓"}, {"front": "If they are allowed to die, it is not only the words that will be lost, but also the stories, traditions and memories …", "icon": "✨", "back": "💡"}]}, {"type": "read", "title": "The importance of languages (1)", "paras": ["1 I grew up in Canada, which has two official languages – English and French. At school, I learnt both, and while English was the main language I used daily with friends and family, I saw French used on signs and in stores, and I often heard it on TV. I remember feeling [[slightly]] angry sometimes: why did I have to deal with two languages when almost everyone spoke English?"], "img": "L11_c3", "icon": "🇨🇦"}, {"type": "read", "title": "The importance of languages (1)", "paras": ["2 But when I was in middle school, something [[occurred]] during a family trip to France that gave me a different way of looking at things. While I was chatting with some local teenagers, I [[realised]] that my French skills were useful. They allowed me to communicate with my new friends in a way that felt completely different from speaking English. Using the same language as them helped me to understand their culture better. I started to see that language wasn't just about words but about belonging to a community and sharing a way of looking at the world."], "img": "L11_c3", "icon": "🇨🇦"}, {"type": "read", "title": "The importance of languages (2)", "paras": ["3 When I returned home, I thought more about the role of French in my home country. I realised that it wasn't just another language that people were telling me to learn – it was an important part of Canadian culture, especially in regions like Quebec. I [[discovered]] that some of my classmates grew up in families where French was their first language, and they felt this helped give them their sense of belonging. I started to understand how important it was to keep languages [[alive]], in order to protect cultures."], "img": "L11_c4", "icon": "🌍"}, {"type": "read", "title": "The importance of languages (2)", "paras": ["4 As a result of my experiences, I became interested in the older languages of Canada that were spoken long before the Europeans arrived. I learnt that many have almost died out, but some of them, such as Cree, Ojibwe and Inuktitut are still spoken, although they are [[at risk]] because nowadays fewer people speak them as a first language. If they are allowed to die, it is not only the words that will be lost, but also the stories, traditions and memories that connect people to their past."], "img": "L11_c4", "icon": "🌍"}, {"type": "read", "title": "The importance of languages (3)", "paras": ["5 Now, I feel lucky I can understand both English and French, and I'm thinking about learning one of the [[original]] languages of Canada in order to connect with these ancient cultures and help protect their words and traditions for the future."], "img": "L11_c4", "icon": "🌍"}, {"type": "quiz", "title": "Read again and choose", "qs": [{"q": "How did the writer feel about learning French when he was young?", "o": ["pleased because it was useful for signs and TV", "unhappy because it didn't seem necessary", "keen to use it with his friends", "annoyed that it wasn't an official language"], "a": 1}, {"q": "What does he say about his trip to France?", "o": ["It was organised by his middle school.", "He didn't find it easy to communicate.", "He didn't learn much about French culture.", "The trip changed his opinion about learning other languages."], "a": 3}, {"q": "What did the writer learn when he returned to Canada?", "o": ["Some people in his class spoke French at home.", "French was not as important as English.", "Many friends couldn't speak French.", "It was difficult to explain why French was important."], "a": 0}, {"q": "What does the writer say about the older languages of Canada?", "o": ["They have all died out.", "Many people speak them as their first language.", "More people want to learn them now.", "They help people understand the history of the country."], "a": 3}, {"q": "What would the writer be most likely to say?", "o": ["We must keep as many languages alive as possible.", "People should travel to learn languages.", "It's very difficult to stop languages dying out.", "Everyone should learn English."], "a": 0}], "icon": "✅"}, {"type": "ask", "title": "Find the words", "qs": [{"q": "a little (para 1) s…", "a": "slightly"}, {"q": "happened (para 2) o…", "a": "occurred"}, {"q": "suddenly learnt or understood (para 2) r…", "a": "realised"}, {"q": "made it possible for me (para 2) a… m…", "a": "allowed me"}], "icon": "🔎"}, {"type": "ask", "title": "Find the words", "qs": [{"q": "learnt (para 3) d…", "a": "discovered"}, {"q": "still in use regularly (para 3) a…", "a": "alive"}, {"q": "in danger (para 4) a… r…", "a": "at risk"}, {"q": "first (para 5) o…", "a": "original"}], "icon": "🔎"}, {"type": "build", "title": "Spell the new words", "mode": "letters", "items": [{"a": "slightly", "hint": "a little", "emo": "🤏"}, {"a": "occurred", "hint": "happened", "emo": "❗"}, {"a": "realised", "hint": "suddenly understood", "emo": "💡"}, {"a": "discovered", "hint": "learnt", "emo": "🔍"}, {"a": "original", "hint": "first", "emo": "1️⃣"}], "icon": "🔤"}, {"type": "ask", "title": "Sum up", "qs": [{"q": "How did the writer feel about language as a young child?", "a": "He felt slightly angry – he didn't see why he needed two languages."}, {"q": "How have the writer's opinions changed?", "a": "Now he feels lucky; he understands that language is about community and culture."}, {"q": "What might help languages survive?", "a": "People learning them, using them at home and teaching them to children."}], "icon": "🧾"}, {"type": "wheel", "title": "For or against?", "items": [{"q": "\"The world only needs one language.\"", "a": "Against: every language carries stories and traditions."}, {"q": "\"It would be better if everyone could speak the same language.\"", "a": "For: it would be easier to travel and work."}, {"q": "\"It would be easier if everything was only in one language.\"", "a": "For: no translation. Against: we would lose cultures."}, {"q": "\"Different languages make the world much more interesting.\"", "a": "For: we learn new ways of looking at the world."}], "icon": "🎡"}, {"type": "race", "title": "Team race", "qs": [{"q": "The writer grew up in …", "options": ["France", "Canada", "Spain"], "a": 1}, {"q": "Canada has ___ official languages.", "options": ["one", "two", "three"], "a": 1}, {"q": "His opinion changed during a trip to …", "options": ["France", "Quebec", "England"], "a": 0}, {"q": "\"at risk\" means …", "options": ["in danger", "very old", "famous"], "a": 0}, {"q": "Cree, Ojibwe and Inuktitut are …", "options": ["old languages of Canada", "cities in France", "TV shows"], "a": 0}, {"q": "The last question in a long text tests the …", "options": ["first paragraph", "main point", "title"], "a": 1}], "icon": "🏎️"}, {"type": "steps", "title": "Let's remember!", "icon": "🧠", "steps": ["Short texts: read and find what the notice/message really says.", "Long text: the last question = the main point.", "The writer's message: keep languages alive to protect cultures.", "New words: slightly, occurred, realised, allowed, discovered, alive, at risk, original."]}, {"type": "exit", "title": "Exit ticket", "items": [{"k": "3", "text": "Why did the writer change his opinion about French?"}, {"k": "2", "text": "Give a synonym for \"happened\"."}, {"k": "1", "text": "Is it important to keep languages alive? Why?"}], "icon": "🎟️"}, {"type": "homework", "title": "Homework", "head": "My homework", "items": ["Write five sentences with words from Ex 9.", "Practice guide pp. 62–63 and 66–67: read the tips.", "Workbook pp. 20–21."], "icon": "🏠"}]}, {"id": "L12", "unit": "U3", "unitName": "Unit 2: Connections", "title": "Lesson 2 · Grammar: past simple & past continuous", "code": "", "theme": "library", "emo": "⏪", "slides": [{"type": "cover", "say": "Unit 2 · Lesson 2 · Grammar: past simple & past continuous"}, {"type": "goals", "title": "Today's goals", "items": ["I can use the past simple for finished actions and past habits.", "I can use the past continuous for actions in progress."], "icon": "🎯"}, {"type": "goals", "title": "Today's goals", "items": ["I can use when and while with both tenses.", "I know which verbs are not used in the past continuous."], "icon": "🎯"}, {"type": "ask", "title": "Remember the article?", "qs": [{"q": "When did the writer realise his French skills were useful?", "a": "During a family trip to France."}, {"q": "What was he doing when he realised?", "a": "He was chatting with some local teenagers."}], "icon": "🇨🇦"}, {"type": "balloons", "title": "Irregular past simple", "rounds": [{"q": "grow → ?", "o": ["grew", "growed", "grown"], "a": 0}, {"q": "see → ?", "o": ["seed", "saw", "seen"], "a": 1}, {"q": "hear → ?", "o": ["heard", "heared", "hore"], "a": 0}], "icon": "🎈"}, {"type": "balloons", "title": "Irregular past simple", "rounds": [{"q": "speak → ?", "o": ["spoke", "speaked", "spoken"], "a": 0}, {"q": "understand → ?", "o": ["understanded", "understood", "understand"], "a": 1}, {"q": "feel → ?", "o": ["feeled", "felt", "fell"], "a": 1}], "icon": "🎈"}, {"type": "explain", "title": "Past simple", "lines": ["Finished actions or situations in the past, past habits, regular past events,", "or past actions that happened one after the other.", "Regular verbs + -ed (study → studied, chop → chopped). Irregular: p. 49."], "img": "L12_c1", "rule": "did + verb · didn't + verb · Did you … ? Yes, I did.", "icon": "✔️"}, {"type": "flip", "title": "Past simple ✔️ – examples", "cards": [{"front": "I [[grew up]] in Canada.", "icon": "💡", "back": "🇨🇦"}, {"front": "I [[started]] to see that language wasn't just about words.", "icon": "✨", "back": "💡"}, {"front": "I [[got]] home and [[sat]] down.", "icon": "🔎", "back": "🏠 one after the other"}, {"front": "Areej and Razan [[visited]] the lake every day on their holiday.", "icon": "📌", "back": "🏞️ habit"}]}, {"type": "explain", "title": "Past continuous", "lines": ["Actions in progress in the past (was/were + -ing).", "Often another action (past simple) interrupts it.", "when + past simple · while + past continuous. Also: set the scene in a story."], "img": "L12_c4", "rule": "was/were + verb-ing · while + past continuous · when + past simple", "icon": "▶️⏪"}, {"type": "flip", "title": "Past continuous ▶️⏪ – examples", "cards": [{"front": "[[While I was chatting]] with some local teenagers, I [[realised]] that my French skills were useful.", "icon": "💡", "back": "💬"}, {"front": "Zahra [[was studying]] in Pisa when she [[met]] Halima.", "icon": "✨", "back": "📚"}, {"front": "The sun [[was shining]].", "icon": "🔎", "back": "☀️ scene"}, {"front": "My uncle [[heard]] the news while he [[was reading]] his social media account.", "icon": "📌", "back": "📱"}]}, {"type": "sort", "title": "Simple or continuous?", "bins": [{"label": "past simple", "icon": "✔️"}, {"label": "past continuous", "icon": "▶️"}], "cards": [{"text": "I grew up in Canada.", "icon": "", "bin": 0}, {"text": "I learnt both languages.", "icon": "", "bin": 0}, {"text": "I realised that my French skills were useful.", "icon": "", "bin": 0}, {"text": "I discovered that …", "icon": "", "bin": 0}, {"text": "While I was chatting with some local teenagers …", "icon": "", "bin": 1}, {"text": "I was playing video games.", "icon": "", "bin": 1}, {"text": "We were eating breakfast.", "icon": "", "bin": 1}], "icon": "🗂️"}, {"type": "explain", "title": "Verbs NOT used in the past continuous", "lines": ["Some verbs, particularly about sensing and knowing, ten to a talk about people who can communicate with animals. What animals are mentioned?", "a": "Listen to 2.03 – the answer is in the recording. (Look at the notes in Ex 3 for clues!)"}], "img": "L14_c1", "icon": "🎧"}, {"type": "explain", "title": "Study tip: predict before you listen", "lines": ["Look at the gaps before you listen.", "Predict the kind of word you need: a place, a number, a thing …", "This helps you to focus. Write one or two words, a number or a date."], "img": "L14_c2", "rule": "Before listening: number? place? thing? feeling?", "icon": "🔮"}, {"type": "flip", "title": "Study tip: predict before you listen 🔮 – examples", "cards": [{"front": "… when he was ___ years old. → a number", "icon": "💡", "back": "🔢"}, {"front": "… behaved in ___ . → a noun (a place / a situation)", "icon": "✨", "back": "📍"}, {"front": "Monty uses ___ to communicate … → a noun (a thing / a way)", "icon": "🔎", "back": "🧰"}, {"front": "… behave with ___ towards them. → a noun (a feeling / quality)", "icon": "📌", "back": "❤️"}]}, {"type": "quiz", "title": "What kind of word is missing?", "qs": [{"q": "Mudrik first became interested in animal communication when he was ___ years old.", "o": ["a number", "a place", "an adjective"], "a": 0}, {"q": "In the USA, Monty Roberts watched the way horses behaved in ___ .", "o": ["a verb", "a noun (place / situation)", "a number"], "a": 1}, {"q": "Monty uses ___ to communicate with the horses he is training.", "o": ["a noun (thing / way)", "a date", "a verb"], "a": 0}, {"q": "In Brazil, dolphins chase fish towards ___ for the fishermen.", "o": ["a number", "a noun (place / thing)", "an adverb"], "a": 1}, {"q": "Experts can use ___ to keep elephants away from villages.", "o": ["a noun (thing)", "a number", "a verb"], "a": 0}, {"q": "It is important to behave with ___ towards them.", "o": ["a number", "a noun (feeling / quality)", "a place"], "a": 1}], "icon": "🧩"}, {"type": "ask", "title": "Listen and complete", "qs": [{"q": "1 Mudrik … when he was ___ years old.", "a": "Listen to 2.03 – answer from the recording."}, {"q": "2 … the way horses behaved in ___ .", "a": "Listen to 2.03."}, {"q": "3 Monty uses ___ to communicate with the horses.", "a": "Listen to 2.03."}], "img": "L14_c2", "icon": "🎧"}, {"type": "ask", "title": "Listen and complete", "qs": [{"q": "4 Dolphins chase fish towards ___ for the fishermen.", "a": "Listen to 2.03."}, {"q": "5 Experts … use ___ to keep elephants away from villages.", "a": "Listen to 2.03."}, {"q": "6 … behave with ___ towards them.", "a": "Listen again and check."}], "icon": "🎧"}, {"type": "explain", "title": "The -ing form", "lines": ["A as the subject or object of a sentence.", "B after prepositions.", "C after some verbs: begin, continue, enjoy, finish, hate, imagine, like, love, practise, remember, start, stop, suggest."], "img": "L14_c4", "rule": "subject/object · after a preposition · after enjoy, finish, stop … → verb-ing", "icon": "🔤"}, {"type": "flip", "title": "The -ing form 🔤 – examples", "cards": [{"front": "[[Copying]] this allowed Monty to communicate with young horses.", "icon": "💡", "back": "A 🐴"}, {"front": "All the cases I've mentioned rely on [[treating]] the animals with respect.", "icon": "✨", "back": "B 🙏"}, {"front": "[[Eating]] vegetables is good for you.", "icon": "🔎", "back": "A 🥦"}, {"front": "I went home after [[finishing]] my game.", "icon": "📌", "back": "B 🎮"}, {"front": "I continued [[playing]] in the rain.", "icon": "⭐", "back": "C 🌧️"}]}, {"type": "read", "title": "Are you ready to talk to animals?", "paras": ["Many animal lovers dream of (1) ___ able to talk to animals. And it seems that with the help of AI, we may be close to (2) ___ this goal. (3) ___ AI, scientists have discovered that sperm whales use an 'alphabet' of 143 different sounds to talk to each other. (4) ___ the meaning of each of these sounds may one day allow the scientists to communicate directly with the animals."], "img": "L14_c3", "icon": "🦜"}, {"type": "read", "title": "Are you ready to talk to animals?", "paras": ["Many people hope that the same AI techniques could also result in us (5) ___ conversations with the animals around us, on farms and in zoos. But do we really want to hear what they might say? What if a cat is unhappy about (6) ___ only one or two meals a day? What if a rabbit is fed up with (7) ___ in the same area of a garden every day, or isn't keen on (8) ___ hay?"], "img": "L14_c3", "icon": "🦜"}, {"type": "read", "title": "Are you ready to talk to animals?", "paras": ["And even worse, what would the animals in a zoo say to us if they knew we planned on (9) ___ the zoo to look at them? (10) ___ the technology to allow animals to tell us what's on their minds might not be such a good idea after all!"], "img": "L14_c3", "icon": "🦜"}, {"type": "quiz", "title": "Complete with the -ing form", "icon": "✏️", "qs": [{"q": "Many animal lovers dream of ___ able to talk to animals.", "o": ["being", "be", "to be"], "a": 0}, {"q": "… we may be close to ___ this goal.", "o": ["achieving", "achieve", "achieved"], "a": 0}, {"q": "___ AI, scientists have discovered that sperm whales use an 'alphabet'.", "o": ["Using", "Use", "Used"], "a": 0}, {"q": "___ the meaning of each of these sounds may one day allow …", "o": ["Understanding", "Understand", "Understood"], "a": 0}, {"q": "… could also result in us ___ conversations with the animals.", "o": ["having", "have", "had"], "a": 0}]}, {"type": "quiz", "title": "Complete with the -ing form", "icon": "✏️", "qs": [{"q": "What if a cat is unhappy about ___ only one or two meals a day?", "o": ["getting", "get", "to get"], "a": 0}, {"q": "What if a rabbit is fed up with ___ in the same area of a garden …?", "o": ["playing", "play", "played"], "a": 0}, {"q": "… or isn't keen on ___ hay?", "o": ["eating", "eat", "eats"], "a": 0}, {"q": "… if they knew we planned on ___ the zoo to look at them?", "o": ["visiting", "visit", "visited"], "a": 0}, {"q": "___ the technology to allow animals to tell us … might not be such a good idea!", "o": ["Developing", "Develop", "Developed"], "a": 0}]}, {"type": "sort", "title": "Why -ing?", "bins": [{"label": "A subject / object", "icon": ""}, {"label": "B after a preposition", "icon": ""}, {"label": "C after a verb", "icon": ""}], "cards": [{"text": "Swimming is the best form of exercise.", "icon": "", "bin": 0}, {"text": "Listening to music is relaxing.", "icon": "", "bin": 0}, {"text": "I really love surfing!", "icon": "", "bin": 2}, {"text": "I'm interested in looking at old things.", "icon": "", "bin": 1}, {"text": "You shouldn't leave without saying goodbye.", "icon": "", "bin": 1}, {"text": "My dad finished painting my room.", "icon": "", "bin": 2}, {"text": "I hate playing chess with my brother.", "icon": "", "bin": 2}, {"text": "After eating my dinner, I went out.", "icon": "", "bin": 1}], "icon": "🗂️"}, {"type": "quiz", "title": "Grammar file practice", "icon": "✏️", "qs": [{"q": "___ is probably the best form of exercise. (swim)", "o": ["Swimming", "Swim"], "a": 0}, {"q": "Nada doesn't like ___ in front of everyone else in class. (talk)", "o": ["talking", "talks"], "a": 0}, {"q": "I'm interested in ___ at old things. (look)", "o": ["looking", "look"], "a": 0}, {"q": "Without ___ , I ran into the garden and rescued the cat! (think)", "o": ["thinking", "think"], "a": 0}]}, {"type": "quiz", "title": "Grammar file practice", "icon": "✏️", "qs": [{"q": "___ to music is the most relaxing hobby. (listen)", "o": ["Listening", "Listen"], "a": 0}, {"q": "Experts say that by ___ homework, students learn to manage their time. (do)", "o": ["doing", "do"], "a": 0}, {"q": "I hate ___ chess with my brother. He always wins! (play)", "o": ["playing", "play"], "a": 0}]}, {"type": "wheel", "title": "Animal interview", "items": [{"q": "What kind of animal are you?", "a": "I'm a camel from Al Sharqiyah."}, {"q": "What do you enjoy doing?", "a": "I enjoy running in races."}, {"q": "What are you fed up with?", "a": "I'm fed up with carrying heavy bags!"}, {"q": "What are you keen on eating?", "a": "I'm keen on eating fresh dates."}, {"q": "How do you feel about humans?", "a": "I like humans who treat me with respect."}, {"q": "What would you like to say to humans?", "a": "Please stop dropping plastic in the desert!"}], "icon": "🎤"}, {"type": "race", "title": "Team race", "qs": [{"q": "___ vegetables is good for you.", "options": ["Eat", "Eating", "Eaten"], "a": 1}, {"q": "I went home after ___ my game.", "options": ["finish", "finishing", "finished"], "a": 1}, {"q": "I enjoy ___ to music.", "options": ["listen", "listening", "to listening"], "a": 1}, {"q": "Before you listen, ___ the kind of word you need.", "options": ["predict", "forget", "translate"], "a": 0}, {"q": "\"… when he was ___ years old\" needs …", "options": ["a number", "a place", "a verb"], "a": 0}, {"q": "A horse …", "options": ["quacks", "moos", "neighs"], "a": 2}], "icon": "🏎️"}, {"type": "steps", "title": "Let's remember!", "icon": "🧠", "steps": ["Before listening: predict the kind of word (number, place, thing …).", "Write one or two words, a number or a date.", "-ing as subject/object: Eating vegetables is good for you.", "-ing after prepositions (about, of, on, without) and verbs like enjoy, finish, stop."]}, {"type": "exit", "title": "Exit ticket", "items": [{"k": "3", "text": "Write a sentence that starts with an -ing word."}, {"k": "2", "text": "Complete: I'm keen on ___ (play) football."}, {"k": "1", "text": "What do you do before you listen to a note-completion task?"}], "icon": "🎟️"}, {"type": "homework", "title": "Homework", "head": "My homework", "items": ["Grammar file p. 55 – Ex 7 (true sentences with -ing).", "Practice guide pp. 80–81: read the tips.", "Workbook p. 24."], "icon": "🏠"}]}, {"id": "L15", "unit": "U3", "unitName": "Unit 2: Connections", "title": "Lesson 5 · Speaking: describing a photo", "code": "", "theme": "library", "emo": "📸", "slides": [{"type": "cover"}, {"type": "goals", "title": "Today's goals", "items": ["I can talk about people I speak to every day.", "I can organise my description of a photo."], "icon": "🎯"}, {"type": "goals", "title": "Today's goals", "items": ["I can say where the photo was taken and what the people are doing.", "I can speak for about one minute."], "icon": "🎯"}, {"type": "ask", "title": "Who do you speak to?", "qs": [{"q": "Which of these people do you speak to most days: best friend, bus drivers, people in queues, people on public transport, shop assistants, teachers?", "a": "I speak to my best friend and my teachers most days."}, {"q": "Which do you never speak to? Why / Why not?", "a": "I never speak to people in queues because I don't know them."}], "icon": "🗣️"}, {"type": "wheel", "title": "Talk for thirty seconds!", "items": [{"q": "someone you see every day but never say hello to", "a": "Who? What? Where? When? Why? – e.g. a man at the bus stop …"}, {"q": "the person you find it easiest to talk to about problems", "a": "My older sister, because she always listens to me."}, {"q": "someone you would like to speak to one day", "a": "An astronaut – I want to ask about life in space."}], "icon": "⏱️"}, {"type": "explain", "title": "Describing a photo", "lines": ["Give an introduction · introduce the people · say where the photo was taken · say what the people are doing.", "Use might be … because … when you are not sure."], "img": "L15_c3", "rule": "intro → people → place → actions (might be … because …)", "icon": "🖼️"}, {"type": "flip", "title": "Describing a photo 🖼️ – examples", "cards": [{"front": "I think this photo shows a typical scene in a …", "icon": "💡", "back": "1 intro"}, {"front": "There are three people in this photo, and they are chatting to each other.", "icon": "✨", "back": "2 people"}, {"front": "You can see that this photo was taken on a bus because people are sitting on seats or standing up and holding on.", "icon": "🔎", "back": "3 place"}, {"front": "The friends might be watching a film because …", "icon": "📌", "back": "4 action"}, {"front": "The woman might be taking the girl to school because …", "icon": "⭐", "back": "4 action"}]}, {"type": "match", "title": "Phrase and job", "pairs": [["I think this photo shows …", "giving an introduction"], ["There are three people in this photo …", "introducing the people"], ["You can see that this photo was taken …", "saying where"], ["They might be watching a film because …", "saying what they are doing"]], "icon": "🧩"}, {"type": "ask", "title": "Photo A", "qs": [{"q": "Where are they? How do you know?", "a": "They are at home, in a living room – there's a sofa, cushions and family photos."}, {"q": "What objects can you see? What adjectives describe them?", "a": "A laptop, a big pizza, drinks and a wooden table. The sofa looks comfortable."}, {"q": "What do the people look like?", "a": "There are three girls. They look happy and relaxed. They are teenagers."}, {"q": "What are they wearing? What are they doing?", "a": "They are wearing headscarves. They might be watching a film on the laptop because they are all looking at the screen."}], "img": "L15_c1", "icon": "🍕"}, {"type": "order", "title": "Study tip: one minute in four steps", "items": ["1 Introduce the idea. 💡", "2 Describe the place. 📍", "3 Say what the people look like. 👀", "4 Say what the people are doing. 🏃"], "icon": "⏱️"}, {"type": "ask", "title": "Listen: a student describes photo A", "qs": [{"q": "Listen to a student describing photo A. What else could she talk about to fill the sixty seconds?", "a": "Listen to 2.04, then add ideas: the food, the room, how they feel, what they might do next."}], "img": "L15_c1", "icon": "🎧"}, {"type": "ask", "title": "Photo B", "qs": [{"q": "Introduce the idea.", "a": "I think this photo shows a typical scene on public transport."}, {"q": "Describe the place.", "a": "It was taken on a bus because people are standing up and holding on."}, {"q": "What do the people look like?", "a": "There are a lot of people – young and old. One man has grey hair and glasses."}, {"q": "What are they doing?", "a": "They might be going to work or school because it looks very busy, maybe in the morning."}], "img": "L15_c2", "icon": "🚌"}, {"type": "ask", "title": "Photo for Student A", "qs": [{"q": "Introduce the idea.", "a": "I think this photo shows two friends in a café."}, {"q": "Describe the place.", "a": "It's a colourful café with plants, cushions and a blackboard menu."}, {"q": "What do the people look like?", "a": "Two young women. They look very happy – they are laughing. One is in a wheelchair."}, {"q": "What are they doing?", "a": "They are eating and drinking juice. They might be celebrating something because they look so happy."}], "img": "L15_c4", "icon": "☕"}, {"type": "tf", "title": "Long turn: true or false?", "items": [{"text": "You need to speak for about one minute.", "a": true, "fix": "Practise with a timer at home."}, {"text": "If you don't know a word, stop talking.", "a": false, "fix": "Try to explain it in other words."}, {"text": "Use \"might be … because …\" when you are not sure.", "a": true, "fix": "The friends might be watching a film because …"}, {"text": "Only describe the people – not the place.", "a": false, "fix": "Describe the place too: You can see that this photo was taken …"}], "icon": "✔✘"}, {"type": "ask", "title": "Extra practice: people eating", "qs": [{"q": "Here is your photograph. It shows people eating something. Talk for about one minute.", "a": "I think this photo shows a family eating at a busy outdoor restaurant. There are three people … They might be on holiday because …"}], "img": "L15_c5", "icon": "🍜"}, {"type": "ask", "title": "Extra practice: new clothes", "qs": [{"q": "Here is your photograph. It shows people looking at new clothes. Talk for about one minute.", "a": "I think this photo shows two women shopping in a clothes shop. One of them is holding a pink jumper … They might be buying a present because …"}], "img": "L15_c6", "icon": "👚"}, {"type": "ask", "title": "Speaking extra", "qs": [{"q": "Tell the class about a conversation you had with someone you didn't know.", "a": "Last week I was waiting at the clinic when an old man started talking to me …"}, {"q": "What were you doing? What happened?", "a": "I was reading a book. He told me about his trip to Hajj 40 years ago!"}], "icon": "💬"}, {"type": "race", "title": "Team race", "qs": [{"q": "How long do you speak in the long turn?", "options": ["10 seconds", "about one minute", "five minutes"], "a": 1}, {"q": "\"You can see that this photo was taken on a bus because …\" =", "options": ["saying where", "introducing people"], "a": 0}, {"q": "When you're not sure, say: They ___ be watching a film.", "options": ["might", "must", "are"], "a": 0}, {"q": "The first step is to …", "options": ["introduce the idea", "say goodbye", "describe clothes"], "a": 0}, {"q": "You don't know a word. You …", "options": ["stop", "explain it in other words"], "a": 1}], "icon": "🏎️"}, {"type": "summary", "title": "Let's remember!", "center": "Lesson 5 · Speaking: communicating – describing a photo (individual long turn)", "branches": ["One minute: intro → place → people → actions.", "I think this photo shows … · There are … people …", "You can see that this photo was taken … because …", "They might be … because …"], "icon": "🧠"}, {"type": "exit", "title": "Exit ticket", "items": [{"k": "3", "text": "Write your first sentence to introduce a photo."}, {"k": "2", "text": "Write a sentence with \"might be … because …\"."}, {"k": "1", "text": "Name the four steps of the long turn."}], "icon": "🎟️"}, {"type": "homework", "title": "Homework", "head": "My homework", "items": ["Find a family photo and practise describing it for one minute (use a timer).", "Practice guide pp. 84–85.", "Workbook p. 25."], "icon": "🏠"}]}, {"id": "L16", "unit": "U3", "unitName": "Unit 2: Connections", "title": "Lesson 6 · Writing: a story on social media", "code": "", "theme": "library", "emo": "📱", "slides": [{"type": "cover", "say": "Unit 2 · Lesson 6 · Writing: a story – posting on social media"}, {"type": "goals", "title": "Today's goals", "items": ["I can correct mistakes in social media posts.", "I can use the past simple and past continuous in a story."], "icon": "🎯"}, {"type": "goals", "title": "Today's goals", "items": ["I can use strong adjectives and adverbs (absolutely brilliant!).", "I can plan and write a story of about 100 words."], "icon": "🎯"}, {"type": "ask", "title": "Social media", "qs": [{"q": "What social media platforms do you know about?", "a": "Instagram, Snapchat, TikTok, YouTube, X …"}, {"q": "What kinds of people do people usually follow online? Why?", "a": "Famous people, footballers and friends – they want to see their news."}, {"q": "What kinds of photos or videos do people post about themselves?", "a": "Food, holidays, family events and funny videos."}, {"q": "In what ways can people be honest or not honest online?", "a": "Some people only post the best moments or change their photos."}], "icon": "🌐"}, {"type": "ask", "title": "One mistake in each post", "qs": [{"q": "1 Lucky me – I'm in holiday again. A great place, and amazing weather!", "a": "I'm on holiday again."}, {"q": "2 This is so easy for make – just flour, eggs, butter and chocolate. Mmm!", "a": "This is so easy to make."}, {"q": "3 Check up my latest story – I think it's amazing, but see if you like it!", "a": "Check out my latest story."}], "img": "L16_c2", "icon": "🔎"}, {"type": "ask", "title": "One mistake in each post", "qs": [{"q": "4 A fantastic day out! All the rides here is absolutely brilliant.", "a": "All the rides here are absolutely brilliant."}, {"q": "5 My natural look. I've decided to stop putting up make-up …", "a": "I've decided to stop putting on make-up."}, {"q": "6 I can't believe it, but I won my first competition today. So proud with myself!", "a": "So proud of myself!"}], "icon": "🔎"}, {"type": "ask", "title": "A photo you took", "qs": [{"q": "Think about a photograph you took recently. Where were you? What were you doing?", "a": "I was at Bimmah Sinkhole. I was swimming with my cousins."}, {"q": "What happened? What photo did you show your family? Why?", "a": "A turtle swam next to me! I showed them the photo because it was amazing."}, {"q": "Which tense do we use for the main events in a story?", "a": "the past simple"}, {"q": "Which tense do we use to say what we were doing at the time it happened?", "a": "the past continuous"}], "icon": "📷"}, {"type": "read", "title": "Giving a presentation", "paras": ["Last week, I (1) ___ (give) a presentation in class about my history project. My partner for the presentation was brilliant, and she (2) ___ (make) some absolutely fantastic slides for us to show."], "img": "L16_c3", "icon": "🎤"}, {"type": "read", "title": "Giving a presentation", "paras": ["While we (3) ___ (wait) to start, I (4) ___ (feel) really nervous. Luckily, my partner (5) ___ (speak) first, and her part of the talk was really interesting. While she (6) ___ (present), I (7) ___ (pick up) my laptop to look at my notes. But guess what? It was out of battery!"], "img": "L16_c3", "icon": "🎤"}, {"type": "read", "title": "Giving a presentation", "paras": ["I felt miserable as I sat there and waited to give my presentation! When it was my turn to speak, I (8) ___ (do) my best, but if I'm honest, my part of the talk wasn't as good as I'd hoped. The teacher (9) ___ (thank) us at the end of our presentation, and I'll remember to charge my laptop before a presentation next time!"], "img": "L16_c3", "icon": "🎤"}, {"type": "quiz", "title": "Past simple or past continuous?", "icon": "✏️", "qs": [{"q": "Last week, I ___ a presentation in class. (give)", "o": ["gave", "was giving"], "a": 0}, {"q": "She ___ some absolutely fantastic slides. (make)", "o": ["made", "was making"], "a": 0}, {"q": "While we ___ to start, … (wait)", "o": ["were waiting", "waited"], "a": 0}, {"q": "… I ___ really nervous. (feel)", "o": ["fel e best photo ever!"}], "icon": "🧐"}, {"type": "write", "title": "Write your story", "task": "Your story must begin with this sentence: I looked around and thought: 'I have to take a photo and show it to my friends.' Write about 100 words.", "steps": ["Start with the sentence from the task.", "Past continuous: what was happening?", "Past simple: the main events.", "Strong adjectives + a good ending."], "words": ["While I was …", "Suddenly, …", "It was absolutely …", "I felt …", "In the end, …"], "model": "I looked around and thought: 'I have to take a photo and show it to my friends.' I was sitting on a boat with my family near Mutrah. The sun was shining and the sea was absolutely beautiful. Suddenly, a huge group of dolphins started jumping next to our boat! My little brother was laughing and my dad was shouting with excitement. I quickly took out my phone and took ten photos. Later, I showed them to my friends at school. They thought the photos were absolutely fantastic. It was a wonderful day!", "icon": "✍️"}, {"type": "ask", "title": "Improve it!", "qs": [{"q": "Find the adjectives. Can you find a place to add two more?", "a": "e.g. a beautiful boat, a calm sea"}, {"q": "Can you change adjectives into strong adjectives or use strong adverbs?", "a": "very big → huge · very good → absolutely fantastic"}, {"q": "Did you use the past simple and past continuous?", "a": "While I was …, I saw … – use both!"}], "icon": "🔧"}, {"type": "race", "title": "Team race", "qs": [{"q": "very funny = …", "options": ["hilarious", "huge", "awful"], "a": 0}, {"q": "___ fantastic", "options": ["very", "absolutely", "extremely"], "a": 1}, {"q": "I'm ___ holiday again.", "options": ["in", "on", "at"], "a": 1}, {"q": "So proud ___ myself!", "options": ["with", "of", "for"], "a": 1}, {"q": "Main events in a story use the …", "options": ["past simple", "present simple"], "a": 0}, {"q": "While she ___ , I picked up my laptop.", "options": ["presented", "was presenting"], "a": 1}], "icon": "
