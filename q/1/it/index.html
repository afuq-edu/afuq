واستخدامها دون إذننا", 2]], "o": ["يتعرف الإنترنت وطرق الاتصال به (الاتصال السلكي واللاسلكي، والأقمار الصناعية والهوائيات).", "يتعرف استخدامات الإنترنت في الحياة اليومية (مكالمات الفيديو، ومشاهدة المقاطع، والبحث عن المعلومات، ومعرفة الطريق GPS).", "يتّبع قواعد الأمان والسلامة في أثناء تصفح الإنترنت.", "يحكم على السلوكيات عبر الإنترنت ويحمي معلوماته الشخصية (الاسم الكامل، والعنوان، ورقم الهاتف، وكلمة المرور)."]}, {"t": "الدرس 3.2: استمتع", "u": "الوحدة الثالثة: لنتصفح", "q": [["أشر إلى أيقونة متصفح الإنترنت Google Chrome.", "يشير إلى أيقونة Google Chrome الدائرية الملونة", 0], ["أين تكتب عنوان الموقع في المتصفح؟", "في شريط العنوان أعلى نافذة المتصفح", 1], ["كتبت عنوان الموقع لكن الصفحة لم تظهر؛ ما الخطأ المحتمل؟", "نسيت الضغط على مفتاح الإدخال (Enter) بعد كتابة العنوان، أو كتبت العنوان خطأً", 2], ["سمِّ متصفحين للإنترنت.", "متصفح Google Chrome، ومتصفح Microsoft Edge", 0], ["رتّب خطوات زيارة موقع: (اكتب العنوان، اضغط Enter، افتح المتصفح، انقر شريط العنوان).", "افتح المتصفح ← انقر شريط العنوان ← اكتب العنوان ← اضغط Enter", 1]], "o": ["يتعرف متصفحات الإنترنت (Google Chrome, Microsoft Edge) ويميزها عن الأيقونات الأخرى.", "يستخدم متصفح الإنترنت لزيارة موقع ويب بكتابة عنوانه في شريط العنوان.", "يميّز في صفحة الويب بين النص والصورة ومقطع الفيديو."]}, {"t": "الدرس 3.3: تواصل", "u": "الوحدة الثالثة: لنتصفح", "q": [["هل يمكن إرسال قميص عبر البريد الإلكتروني؟", "لا، لأنه شيء مادي وليس ملفًا رقميًا", 0], ["اذكر ميزتين للبريد الإلكتروني.", "سريع الوصول، ويصل إلى أي مكان في العالم دون تكلفة", 1], ["لم تستطع سارة التواصل مع أحمد لأن جهازها غير متصل بالإنترنت؛ اقترح حلين.", "التأكد من الاتصال بشبكة Wi-Fi، أو طلب المساعدة من شخص بالغ لإعادة الاتصال، أو استخدام جهاز آخر متصل بالإنترنت", 2], ["أكمل: في رسالة البريد الإلكتروني نكتب اسم الصديق في خانة ......، وعنوان الرسالة في خانة ......", "إلى، والموضوع", 1], ["أردت إرسال صور حيواناتك المفضلة إلى صديقك؛ رتّب أجزاء الرسالة التي ستكتبها.", "من (اسمي) ← إلى (اسم صديقي) ← الموضوع (حيواناتي المفضلة) ← الصور ← نص الرسالة", 2]], "o": ["يتعرف كيفية التواصل مع الآخرين عبر البريد الإلكتروني ومزاياه (سريع، ودون تكلفة، ويصل إلى أي مكان في العالم).", "يميّز بين الملفات التي يمكن إرسالها عبر البريد الإلكتروني (نص، وصورة، وصوت، وفيديو) والأشياء المادية التي لا يمكن إرسالها.", "يكمل أجزاء رسالة بريد إلكتروني (من، وإلى، والموضوع، ونص الرسالة، والصور المرفقة)."]}, {"t": "الدرس 3.4: ابحث", "u": "الوحدة الثالثة: لنتصفح", "q": [["ما اسم محرك البحث الذي استخدمناه؟", "Google", 0], ["ماذا تكتب في مربع البحث لتعرف عن الحيوانات البرية في عُمان؟", "الحيوانات البرية في سلطنة عمان", 1], ["ظهرت نتائج كثيرة؛ كيف تنتقل إلى الموقع الذي تريده؟ وكيف ترى بقية الصفحة؟", "أنقر على الارتباط التشعبي (الرابط) للموقع، وأستخدم شريط التمرير أو عجلة الفأرة للنزول في الصفحة", 2], ["رتّب خطوات البحث: (اكتب كلمات البحث، افتح www.google.com، اضغط Enter، افتح المتصفح).", "افتح المتصفح ← افتح www.google.com ← اكتب كلمات البحث ← اضغط Enter", 1], ["لماذا نكتب كلمات بحث محددة مثل «الحيوانات البرية في سلطنة عمان» بدل كلمة «حيوانات» فقط؟", "لأن الكلمات المحددة تعطي نتائج أقرب لما نريد، فنصل إلى المعلومة بسرعة", 2]], "o": ["يبحث عن مواقع ويب ومعلومات باستخدام محرك البحث Google.", "يتنقل في صفحة الويب باستخدام شريط التمرير والارتباطات التشعبية (Hyperlink).", "يختار كلمات بحث محددة تناسب ما يريد الوصول إليه (مثل: الحيوانات البرية في سلطنة عمان)."]}, {"t": "المشروع", "u": "مشروع ختامي يوظّف مهارات الوحدات الثلاث", "q": [["ما الأداة التي ستلوّن بها الخلفية لتمثل الصحراء أو الجبل؟", "أداة التعبئة (Fill) بلون مناسب", 1], ["كيف تجعل لوحتك واضحة لمن يشاهدها في ممر المدرسة؟", "أرسم الحيوان كبيرًا في وسط اللوحة، وأختار ألوانًا مناسبة، وأضيف بيئته بالفرشاة والتعبئة", 2]], "o": ["يوظّف أدوات تطبيق الرسام (الأشكال، والفرش، والتعبئة، والخلفية) لإنتاج رسمة رقمية عن حيوان من بيئة سلطنة عُمان.", "يستعين بصور مرجعية من محرك البحث بإشراف المعلم لتحديد أشكال الحيوان وألوانه.", "يحفظ مشروعه باسم مناسب ويعرضه على زملائه.", "يقيّم عمله ذاتيًا ببطاقة «أستطيع أن» وفق معايير المشروع."]}]};</script>
