<script>window.QZ={"g": "10", "gn": "العاشر", "s": "english", "sn": "اللغة الإنجليزية", "L": [{"t": "Unit 1: New Media – Introducing New Media", "u": "", "q": [["Which device is used to listen to the news and can run on solar power or wind up?", "radio", 0, ["blog", "tablet"]], ["In Listening 1.1, which words helped you decide that speaker 3 was talking about social media?", "connect with other people / scroll through pictures, posts, updates and comments", 2], ["Complete: A ______ is a smartphone, a tablet or a computer.", "device", 1, ["blog", "website"]], ["Explain why the first speaker says the radio can be more important than television.", "Because it reaches everyone, rich or poor, in cities or in the desert, and some radios run on solar power or wind up, so they do not need batteries", 2], ["Match: “interactive” means … (a) involving communication between people (b) very old (c) printed on paper", "a", 0], ["Use the word “communicate” in a sentence about new media.", "Social media helps people communicate with friends all over the world", 1], ["Why is a blog considered a type of new media but a printed newspaper is not?", "Because a blog is interactive and lets readers comment and communicate with the writer, while a printed newspaper is one-way communication", 2], ["Complete: New media are types of media that are ______.", "interactive", 0, ["silent"]], ["Which of these is an online news site? (a) a digital version of a newspaper (b) a video game (c) a stereo", "a", 1], ["Imagine a day without social media. Give two problems it might cause and explain one in a full sentence.", "I couldn’t chat with my friends, and I couldn’t see the news. It would be difficult because I use social media to connect with my family", 2]], "o": ["Identify the titles of the Grade 10 units and predict the topic of each unit.", "Match the names of digital devices and media to their pictures (blog, TV, magazine, newspaper…).", "Listen to three descriptions and identify the type of media each speaker describes."]}, {"t": "Unit 1: New Media – Reading and Understanding", "u": "", "q": [["Which statement is NOT true? (1) Many teenagers are addicted to smartphones. (2) Excessive screen time is negative regardless of content.", "Statement 2", 0], ["What does “screenager” mean?", "informal word for a teenager who spends a lot of time in front of a screen (screen + teenager)", 1], ["Why is statement 3 (“Excessive screen time is negative regardless of content”) not true according to the article?", "Because the article says that the content and context of screen use matter more than the amount of time, so useful content is not negative", 2], ["Complete: A person who uses a phone too much is ______ it.", "addicted to", 0, ["afraid of"]], ["Write the blend word: screen + teenager = ______", "screenager", 1], ["Give your opinion about screen time. Use “In my opinion” and a reason.", "In my opinion, screen time is fine if the content is useful because I can learn new things", 2], ["According to the article, how many hours a day do teenagers spend online?", "Nine hours", 0], ["Match: “attention span” = ______", "the length of time you can concentrate", 1, ["a type of video"]], ["Which social media platform is the most popular for this age group according to the article? Why might that be?", "YouTube; reasons vary, e.g. because it offers many kinds of videos", 2], ["Complete: Too much screen time can ______ the brain’s development.", "harm", 0, ["help"]], ["Replace the underlined words: “Teenagers who are always on their phones are ______.”", "glued to their phones", 1, ["glued in the books"]], ["Do all video games contain violent content? Answer and explain what the writer means by “content and context are more important than the amount of time”.", "No. The writer means that what a teenager watches and its context matter more than the number of hours", 2], ["What does “skimming” mean?", "reading a text quickly, focusing on key words, to get the general idea", 0], ["Complete: Many ______ use social media to advertise products.", "brands", 1, ["comments"]], ["Which word in the texts means “unwilling and slow to do something”? Use it in your own sentence.", "reluctant; e.g. I was reluctant to log in to my old account", 2], ["Complete: You can ______ videos to watch them later without Internet.", "download", 1, ["source"]]], "o": ["Predict the meaning of ‘screenagers’ from the picture and title and explain it.", "Read the article for gist and identify the statement that is not true, giving a reason.", "Use screen time, excessive and addicted to in sentences about their own habits."]}, {"t": "Unit 1: New Media – Grammar and Vocabulary", "u": "", "q": [["Say if the statement is T, F or NG: “The chart shows the age of Patrick’s family.”", "NG (the chart gives no information about ages)", 0], ["Complete: Salim is taller than Ahmed. = Ahmed is ______ as tall as Salim.", "not", 1], ["Rewrite: “Taxis are more expensive than buses.” with “not as … as”.", "Buses are not as expensive as taxis", 2], ["Choose: Muscat is bigger than Nizwa. = Nizwa is not as ______ as Muscat.", "big", 0, ["bigger"]], ["What does NG mean in a True/False/Not Given task?", "There is no information in the text or chart to decide whether it is true or false", 1], ["Explain why “not as bigger as” is wrong.", "Because the adjective after as … as stays in its base form (big), not the comparative form (bigger)", 2], ["Rewrite: “My ticket to New York is more expensive than my ticket to Mumbai.”", "My ticket to Mumbai is not as expensive as my ticket to New York", 0], ["Choose: Eating fast food is not as ______ as eating salad.", "healthy", 1, ["healthier"]], ["Rewrite: “Watching football is more exciting than watching swimming.” using “not as … as”.", "Watching swimming is not as exciting as watching football", 0], ["Find the mistake: “I am not as taller as my brother.” Correct it.", "I am not as tall as my brother", 1], ["In the cartoon, what does “brought you up” mean in the man’s answer?", "raised you as a child", 0], ["Complete: I ______ a very interesting website last night.", "came across", 1, ["came with"]], ["Classify “log in” and “go into” by structure.", "log in = verb + adverb; go into = verb + preposition", 2], ["Match: “hurry up” means ______.", "go faster", 0, ["go slowly"]], ["Which sentence uses a phrasal verb? (a) I click on the link. (b) I like links.", "a", 1], ["Why is it difficult to understand phrasal verbs by translating each word?", "Because their meaning is often figurative or idiomatic and cannot be understood from the individual words", 2], ["Complete: Please ______ your phone before the battery dies.", "plug in", 0, ["look up"]], ["What does “back up” mean when we talk about files?", "copy files to keep them safe", 1], ["Complete the sentence: “I use a dictionary to ______ new words.”", "look up", 2], ["Choose: “Press the button to ______ of your account.”", "log out", 0, ["hurry up"]]], "o": ["Read the bar chart and decide whether the ten statements are T, F or NG, giving reasons.", "Infer the difference between more … than, the most, as … as and not as … as from examples.", "Choose the sentence with the same meaning using not as + adjective + as."]}, {"t": "Unit 1: New Media – Listening and Speaking", "u": "", "q": [["Match: “journalist” = a person who ______.", "reports the news", 0, ["plays video games"]], ["Listening 1.3: True or False? “Journalism is faster than social media at reporting news.”", "False", 1, 1], ["Which key words would you listen for in the statement “Anyone can be a journalist”?", "anyone / journalist (students may also hear ‘smartphone’)", 2], ["Complete: News that is not based on facts is ______.", "fake news", 0, ["digital age"]], ["According to Dr David, what can journalists do to compete with social media? Give two things.", "Develop technological skills; integrate audio and video; use social media to support reporting", 1], ["Which chart matches the trend: printed newspaper sales going down, online readership growing? (a / b / c)", "chart b", 0], ["Underline the stressed syllable: ONline or onLINE?", "onLINE (the second syllable)", 1], ["Complete: “In my opinion, online newspapers are better ______ I can read them anywhere.”", "because", 2, ["but"]], ["Which syllable is stressed in “participate”?", "par-TI-ci-pate (the second syllable)", 0], ["Which expression gives an example? (a) One example of this is… (b) I’m sorry but…", "a", 1], ["Give an opinion about printed newspapers with a reason and an example.", "I think printed newspapers will disappear because most people read online. One example of this is my father, who now reads the news on his phone", 2], ["How many followers does Mo have?", "About 120,000 (120K)", 0], ["Complete: “______ don’t we start our own YouTube channel?”", "Why", 1], ["Which expression responds positively to a suggestion: “That sounds great” or “I’m not sure about it”?", "That sounds great", 2], ["Mo says you should create content you love. Explain in one sentence why this helps you succeed.", "Because your passion for the content shows to your followers and creates value for them", 2]], "o": ["Explain the meanings of journalism vocabulary (journalism, reporter, trust, fake news, source…) and use them in sentences.", "Identify key words in the six statements before listening.", "Listen to the interview, decide whether the six statements are T or F and justify the answers."]}, {"t": "Unit 1: New Media – Writing: Describing Charts", "u": "", "q": [["What is the name of a chart with vertical bars?", "column chart", 0], ["In the summary, which tense is used to describe the charts?", "present simple", 1], ["Replace “illustrate” with a synonym.", "show", 2], ["Complete: A ______ is a circle divided into slices.", "pie chart", 0, ["line graph"]], ["Does the summary include the writer’s personal opinion? Explain.", "No; it presents only the data in an objective way", 1], ["Rewrite using a comparative structure: “Snapchat is popular with women. Twitter is not as popular.”", "Snapchat is more popular with women than Twitter", 2], ["The column chart shows the sports played by boys and girls at the IB School. Which sport do both groups play most?", "Football (as shown in the chart)", 0], ["Complete: “The column chart ______ the sports played by boys and girls.”", "illustrates / shows", 1], ["What information do we put in the first sentence of a chart summary?", "The type of chart, its topic, who it is about and the time period", 2], ["Complete: Poetry is the ______ popular genre.", "least", 0, ["more"]], ["Why is it important to read a chart before writing about it?", "To identify the type, topic, categories and general trend so that the information written is accurate", 2], ["What is the purpose of a writing plan?", "To organise ideas before writing", 0], ["Which linking word shows contrast?", "However", 0, ["Because"]], ["Check this sentence with the checklist: “the chart show football are popular.” Correct it.", "The chart shows that football is popular", 2], ["What is peer feedback?", "Comments from a classmate on your work to help you improve it", 0], ["Give a specific comment for a draft that has no “Overall” sentence.", "You could add an overall sentence at the end, e.g. Overall, football is the most popular sport", 1], ["Choose: Which comment is more helpful? (a) Good. (b) Your first paragraph clearly says what the charts show.", "b", 2], ["Complete: After we finish the second draft, we ______ our work with the checklist.", "self-edit", 0, ["delete"]], ["Correct: “Boys is more interested in football than girls.”", "Boys are more interested in football than girls", 1], ["Explain how the second draft should be better than the first.", "It is better organised and more accurate, and it includes the partner’s and the teacher’s corrections", 2]], "o": ["Name the four types of charts (pie, column, line, bar) and distinguish between horizontal and vertical bars.", "Read two pie charts and answer questions (the most popular, the least popular, gender differences).", "Analyse the structure of the summary (introduction, analysis, conclusion), replace phrases with synonyms and identify comparative structures."]}, {"t": "Unit 1: New Media – Project: Design a Blog", "u": "", "q": [["What is the difference between a blog homepage and a blog post page?", "The homepage shows the menu and recent posts; the blog post page shows one post with its comments", 0], ["Which category? “Choose attractive colours”", "Design", 1, ["Content", "Technical"]], ["Why is “Don’t post personal details” an important tip for bloggers?", "To protect privacy and stay safe online", 2], ["Complete: Someone who writes a blog is a ______.", "blogger", 0, ["reporter"]], ["Sort: “Blog regularly” belongs to which category?", "Content", 1], ["What is the role of the designer in a group?", "Responsible for the creative side and the look of the design", 0], ["Complete: The ______ is the first page of a blog.", "homepage", 1, ["menu"]], ["Give one suggestion to improve another group’s blog layout.", "Why don’t you add a menu at the top?", 2], ["Which feature helps readers move between pages?", "menu", 0, ["comment"]], ["Why is it useful to get feedback from another group?", "It shows points to improve that we cannot see ourselves and raises the quality of the product", 2], ["Complete: Today our group will ______ our blog to the class.", "present", 0, ["delete"]], ["Which question helps you reflect on teamwork?", "How well did you work together as a team?", 2], ["Rewrite politely: “Your blog is bad.”", "Your blog is good, but you could add more photos", 1]], "o": ["Analyse Noora’s blog and distinguish between the homepage and the blog post page and their features.", "Listen to blogging tips and sort them into Content, Design and Technical.", "Plan the content and design of the group’s blog (topic, audience, name, colours)."]}, {"t": "Unit 1: New Media – Review", "u": "", "q": [["Complete: A ______ is a regular online record of your thoughts.", "blog", 0, ["chart"]], ["Rewrite: “Football is more popular than chess.” using “not as … as”.", "Chess is not as popular as football", 1], ["Correct the sentence: “I click in the link and log out the website.”", "I click on the link and log in to the website (or log out of)", 2], ["Choose the correct phrasal verb: “Please ______ your files regularly.”", "back up", 0, ["hang up"]]], "o": ["Review unit vocabulary, phrasal verbs and comparative structures in new contexts.", "Correct language errors in sentences that describe a chart and make comparisons.", "Evaluate their progress in the unit and set a learning goal for Unit 2."]}, {"t": "Unit 2: Climate Change – Introducing Climate Change", "u": "", "q": [["What do you think caused the melting of the ice caps?", "global warming / higher temperatures", 1], ["Complete: A long period without rain is a ______.", "drought", 0, ["flood"]], ["Which word means the weather condition of very high temperatures?", "heat wave", 1, ["sea level"]], ["Which definition is correct? Climate is (a) the weather in one place over a long time (b) today’s rain", "a", 0], ["Explain the difference between weather and climate with an example about Oman.", "Weather is the conditions today (e.g. rain today); climate is the long-term pattern (e.g. hot and dry summers in Oman)", 2], ["Complete: Climate change means that average global temperatures are ______.", "rising", 0, ["falling"]], ["What might happen if we do not take action?", "serious consequences for people, animals and plants", 1]], "o": ["Recognise climate change vocabulary (drought, floods, heat waves, ice caps, sea level) from pictures.", "Predict the causes of what the three pictures show and express their feelings about them.", "Use weather, climate change and threat in sentences about their environment."]}, {"t": "Unit 2: Climate Change – Reading and Understanding", "u": "", "q": [["What kind of chart is in Activity 1?", "column chart", 0], ["Match: Paragraph 2 “What causes climate change?” (a/b…)", "Subheading b: What causes climate change?", 1], ["What does the horizontal axis of the chart show?", "the years (1881–2010)", 2], ["Complete: When we ______ we read quickly to find general meaning.", "scan", 0, ["copy"]], ["Which subheading matches the paragraph about stopping climate change?", "How can we stop climate change?", 1], ["What trend does the chart show and what might cause it?", "Average global temperatures are rising; the cause is more greenhouse gases from burning fossil fuels", 2], ["Choose: The Earth is getting hotter because there are more ______ in the atmosphere.", "greenhouse gases", 0, ["ice caps"]], ["What are greenhouse gases produced by?", "burning fossil fuels and bacteria", 1], ["Why are countries at sea level at risk?", "Because rising sea levels and floods threaten them", 2], ["Complete: Countries at sea level are at risk from ______.", "floods", 0, ["droughts"]], ["Complete: If the ice melts, polar bears ______ be able to hunt seals.", "won’t", 0, ["will"]], ["What does “threat” mean?", "possibility that something bad will happen", 1], ["Choose: Koalas ______ eat eucalyptus leaves if carbon dioxide changes them.", "won’t be able to", 0, ["will able"]], ["Explain why predicting helps readers before reading a text.", "Because it activates prior knowledge and prepares readers for the vocabulary and ideas they expect", 2]], "o": ["Interpret the column chart and state what it shows and what the trend means.", "Match the five paragraphs to their subheadings by scanning.", "Review the meaning of climate change and explain the link between global temperatures and the chart."]}, {"t": "Unit 2: Climate Change – Grammar and Vocabulary", "u": "", "q": [["Which is the cause? “Ice caps melt. Sea levels rise.”", "Ice caps melt is the cause", 0], ["Complete: Sea levels are rising ______ the melting of ice caps.", "because of", 1, ["so"]], ["Join: “Temperatures rise. Many species lose their habitat.” using “as a result of”.", "Many species lose their habitat as a result of rising temperatures", 2], ["Choose: Fossil fuels are burned, ______ greenhouse gases increase.", "so", 0, ["due to"]], ["Explain the difference between “because of” and “therefore” with one example each.", "‘Because of’ comes before the cause (because of floods…); ‘therefore’ comes before the result (It rained; therefore, the roads closed)", 2], ["Put in order: because / sea / rising / are / levels / of / melting", "Sea levels are rising because of melting (ice)", 0], ["Complete: Too much plastic ends up in the ocean. ______, sea animals are in danger.", "Therefore", 1, ["Because of"]], ["Choose the correct sentence.", "Drought is a consequence of rising temperatures", 0], ["Correct: “Due to the rain, there are floods because.”", "Due to the rain, there are floods (or: There are floods because of the rain)", 2], ["Combine: foot + ball = ______", "football", 0], ["Which compound noun is written as two separate words?", "ice cap", 1, ["football"]], ["Which compound noun has a hyphen?", "tea-bag", 0, ["fireman"]], ["Complete: Our ______ shows how much carbon dioxide we release.", "carbon footprint", 1, ["ice cap"]], ["Explain the three ways compound nouns can be written, with one example each.", "One word: football; with a hyphen: tea-bag; two separate words: ice cap", 2], ["Complete: A ______ is a plastic tube we use to drink.", "plastic straw", 0, ["plastic waste"]], ["Use “carbon dioxide” in a sentence.", "Burning fuel releases carbon dioxide", 2], ["Choose: ______ is the heating of the Earth by gases that trap heat.", "greenhouse effect", 0, ["ice cap"]], ["Explain why compound nouns are important for talking about climate change.", "Because many scientific terms are compound nouns, such as global warming and fossil fuel", 2]], "o": ["Distinguish the cause from the effect in the reading texts and complete the table.", "Infer cause and effect connectors from the Grammar Focus (because of, due to, as a result of, therefore, so…).", "Link a cause to an effect in correct sentences using a suitable connector."]}, {"t": "Unit 2: Climate Change – Listening and Speaking: Debate", "u": "", "q": [["Match: consumer = ______ (a person who buys goods / a government)", "a person who buys goods or services", 0], ["What is the topic of the debate?", "Governments are responsible for stopping global warming", 1], ["Use “eco-friendly” in a sentence.", "The new bag is eco-friendly", 2], ["Complete: A set of ideas officially agreed by a government is a ______.", "policy", 0, ["emission"]], ["Which word means “to control something”?", "regulate", 1], ["Why might governments need to regulate factories?", "To reduce emissions and protect the environment", 2], ["Complete: “We ______ that governments must act.”", "believe", 0, ["believes"]], ["Is this an argument FOR or AGAINST: “Governments can regulate factories.”", "For", 1], ["Which expression shows partial agreement?", "You are right to some extent, but…", 2], ["Complete: “I see your ______, but I disagree.”", "point", 0, ["policy"]], ["Which words should we stress in “Governments should regulate emissions”?", "Governments / regulate / emissions", 1], ["Which phrasal verb means “stop a machine”?", "switch off / turn off", 0], ["Complete: “We ______ that it is easy to live eco-friendly.”", "believe", 1, ["believing"]], ["Choose: “______ up your water bottle instead of buying a new one.”", "Fill", 0, ["Look"]]], "o": ["Choose the correct definition of six words (policy, emission, responsibility, regulate, consumer, eco-friendly).", "Listen to the debate and identify its topic.", "Use the new vocabulary in sentences about the environment."]}, {"t": "Unit 2: Climate Change – Writing: Opinion Essay", "u": "", "q": [["Why does plastic end up in the ocean?", "because it is lightweight and can be blown or washed into the ocean", 0], ["Name two plastic items that cause pollution.", "packaging, cups, straws, bottles", 1], ["In which paragraph is the writer’s opinion given?", "Paragraph 1", 2], ["Complete: A bottle we use many times is a ______ bottle.", "reusable", 0, ["disposable"]], ["Why is plastic pollution dangerous for people?", "Because we may eat plastic when we eat fish that have swallowed it", 2], ["What is a topic sentence?", "The sentence that states the main idea of the paragraph", 0], ["Complete: Using reusable bottles will ______ in less plastic in the ocean.", "result", 1, ["cause"]], ["Which sentence is a supporting sentence? (a) Plastic is a problem. (b) For example, bottles end up in the sea.", "b", 2], ["Complete: A good paragraph has a topic sentence and ______ sentences.", "supporting", 0, ["empty"]], ["Explain how an example supports the topic sentence.", "It illustrates the idea with a real case, which makes it convincing", 2], ["What goes in the introduction of an opinion essay?", "An introduction to the topic and the writer’s opinion", 0], ["Choose a connector: “Plastic is cheap. ______, it harms the ocean.”", "However", 2, ["Because"]], ["Complete: After the first draft, we check our work with the ______.", "checklist", 0, ["calendar"]], ["Add a connector: “Sea turtles eat plastic ______ they are in danger.”", "so", 1, ["because of"]], ["Why should an opinion essay include examples?", "Because examples support the opinion and make it more convincing", 2], ["What is the purpose of a second draft?", "To improve the work after feedback", 0], ["Give one specific peer comment for an essay without a conclusion.", "You could add a conclusion that repeats your opinion", 1], ["Which spelling is correct?", "environment", 2, ["enviroment"]], ["Complete: We ______ our work with the checklist before we submit it.", "self-edit", 0, ["forget"]], ["Correct: “Plastic harm the ocean.”", "Plastic harms the ocean", 1]], "o": ["Read facts about plastic pollution in the ocean and discuss them.", "Read the opinion essay and answer its four questions.", "Match the essay paragraphs to their functions and identify phrasal verbs, compound nouns and cause and effect connectors."]}, {"t": "Unit 2: Climate Change – Project: Reusable Shopping Bag", "u": "", "q": [["What is the message on a good reusable bag?", "An environmental message, e.g. Reduce plastic", 0], ["Complete: A short phrase on a bag is a ______.", "slogan", 1, ["material"]], ["Why are reusable bags better than plastic bags?", "They reduce plastic waste and can be used many times", 2], ["What does the designer do?", "Designs the bag and the illustration", 0], ["Complete: The ______ explains the design in words.", "writer", 1, ["consumer"]], ["Give one suggestion to another team.", "You could use a bigger slogan", 2], ["Choose: A bag that can be used many times is…", "reusable", 1, ["disposable"]], ["How does feedback improve a project?", "It shows strengths and weaknesses, so the product improves", 2], ["Complete: We ______ for the best design.", "vote", 1, ["copy"]], ["Why is communication important in a team?", "To coordinate roles and complete the work well", 2]], "o": ["Evaluate four reusable bag designs using set criteria.", "Listen to an explanation of a bag design and identify its elements (image, slogan, material).", "Generate ideas with the team for an eco-friendly bag design."]}, {"t": "Unit 2: Climate Change – Review", "u": "", "q": [["Complete: Sea levels rise ______ the melting ice.", "because of", 0, ["so"]], ["Correct: “Plastic harm the ocean, so because.”", "Plastic harms the ocean", 2], ["Choose: “Burning fuel releases greenhouse gases. ______, the planet gets hotter.”", "Therefore", 0, ["Because of"]]], "o": ["Review climate change vocabulary, cause and effect connectors and compound nouns in new contexts.", "Correct errors in sentences about the environment and improve their wording.", "Evaluate their progress in the unit and set a goal for Unit 3."]}, {"t": "Unit 3: Renewable Energy – Introducing Renewable Energy", "u": "", "q": [["Which energy comes from the sun?", "solar power", 0], ["Complete: Oil and coal are ______ energy.", "non-renewable", 1, ["renewable"]], ["Why will non-renewable energy run out?", "Because it exists in limited amounts and cannot be renewed", 2], ["Match: wind power uses ______ to generate electricity.", "turbines", 0, ["panels"]], ["What is biofuel?", "fuel made from living things or their waste", 1]], "o": ["Name renewable and non-renewable energy sources (solar power, wind power, hydropower, geothermal energy, biofuel…).", "Listen to a conversation and decide whether statements are true or false.", "Discuss the difference between renewable and non-renewable energy and express an opinion."]}, {"t": "Unit 3: Renewable Energy – Reading and Understanding", "u": "", "q": [["What is an email for? Give one purpose.", "request information / invite someone / send news", 0], ["Choose: “Dear Mr Brown” is", "formal", 1, ["informal"]], ["Which email is more informal? Give one clue.", "The email that begins with ‘Hi’ and ends with ‘Take care’", 2], ["Complete: At the end of a formal email we write “Kind ______.”", "regards", 0, ["see you"]], ["Write the purpose of this sentence: “I am writing to request some information.”", "to request information", 1], ["Why do we need a clear purpose in an email?", "So that the reader understands what is needed and replies quickly", 2], ["What is an infographic?", "a visual that shows information with pictures and short text", 0], ["Complete: ______ energy comes from sources that do not run out.", "Renewable", 1, ["Fossil"]], ["Identify a compound noun", "solar power", 2, ["quickly”"]], ["Complete: ______ is generated using natural heat and steam in the ground.", "Geothermal power", 0, ["Wind power"]], ["Explain why infographics are useful for sharing facts.", "Because they present information visually and briefly", 2], ["Which project uses wind turbines?", "a wind farm", 0], ["Unscramble: RAOSL", "solar", 1], ["Where can you find the capacity of a project?", "In the text or the table, measured in megawatts", 2], ["Complete: A hydroelectric ______ uses water to generate electricity.", "dam", 0, ["panel"]]], "o": ["Identify the purpose of an email (request, invitation, information) from its structure.", "Read a formal and an informal email for specific information.", "Compare the style of the two emails, giving language evidence."]}, {"t": "Unit 3: Renewable Energy – Grammar and Vocabulary", "u": "", "q": [["Which stadium generates its own electricity with solar panels?", "Estadio Mineirão", 0], ["Complete: The Aviva Stadium uses renewable energy, ______ it reduced its carbon footprint.", "so", 1, ["but"]], ["Which conjunction adds information?", "also", 2, ["so"]], ["Choose: Solar power is clean ______ it is expensive.", "but", 0, ["because"]], ["Join: “I like football. I like tennis.” using “also”.", "I like football. I also like tennis", 1], ["Explain the difference between “so” and “because”.", "‘So’ introduces the result and ‘because’ introduces the reason", 2], ["Complete: Solar power is clean. ______, it is expensive to build.", "However", 0, ["Moreover"]], ["Which connector adds similar information?", "moreover", 1, ["but"]], ["Join: “Wind power is renewable. It is quiet.” using “in addition”.", "Wind power is renewable. In addition, it is quiet", 2], ["Choose: Coal is cheap. ______, it pollutes the air.", "Moreover", 0, ["On the other hand"]], ["Explain how “however” and “moreover” differ.", "‘However’ shows contrast; ‘moreover’ adds similar information", 2], ["Add a suffix: power + ful = ______", "powerful", 0], ["Which is an adjective?", "renewable", 1, ["renew"]], ["Choose: danger + ous = ______", "dangerous", 0, ["dangerful"]], ["Classify: “sustainable” ends with which suffix?", "-able", 1], ["Why are suffixes useful for building vocabulary?", "Because they let us form new words from the same root", 2]], "o": ["Listen to descriptions of eco-friendly stadiums and match them (Estadio Mineirão, Aviva Stad
