ذب رغم كبر حجم الشمس", 1], ["ما الفرق بين الشاطئ والساحل؟", "الشاطئ الأراضي الممتدة بين الجروف وأدنى مستوى تصله مياه الجزر، أما الساحل فيبدأ من خط الساحل ويمتد إلى ما خلف الشاطئ من أراضٍ مواجهة للبحر", 2], ["عرّف المد والجزر.", "المد أقصى ارتفاع يبلغه سطح البحر، والجزر أدنى انخفاض يبلغه، وينشآن عن قوى جذب القمر والشمس للمياه", 0], ["كيف تتولد الأمواج؟", "بفعل الرياح التي تهب فوق سطح المياه، ويسهم المد والجزر والزلازل والبراكين في توليدها أيضًا", 1], ["وفق قانون كوريولي، إلى أي اتجاه تنحرف التيارات في نصف الكرة الجنوبي؟ ولماذا؟", "نحو اليسار، بسبب القوة الناتجة عن دوران الأرض حول نفسها", 2], ["اذكر مثالين للأنشطة البشرية المؤثرة في السواحل.", "بناء الموانئ، أنشطة الترفيه والسياحة، السدود، الطرق، نقل رمال الشاطئ (أي اثنين)", 0], ["على ماذا تتوقف استجابة السواحل لعمليات التعرية؟", "على طبيعة الصخور المكونة للساحل ومقدار ما بها من فواصل وشقوق", 1], ["كيف يؤدي ضغط الهواء إلى تفتيت الجروف الصخرية؟", "حين تصطدم الأمواج بالجروف ينحصر الهواء في الشقوق والتجاويف فيتولد ضغط داخلها يؤدي إلى تفتيتها", 2], ["سمِّ طريقتين من طرق النحت البحري.", "ضغط الهواء، النحت القاعدي، الذوبان، التصادم (أي اثنتين)", 0], ["ما النتائج المتوقعة لإقامة مشاريع خدمية على الشواطئ دون مراعاة الأسس البيئية؟", "تدمير الأشكال الطبيعية المتكونة على الساحل وتآكل الشواطئ وخسائر اقتصادية واجتماعية", 1], ["علّل: كلما اشتدت صلابة الصخور وقلت فواصلها ضعف تأثير التعرية البحرية.", "لأن الصخور الصلبة تقاوم النحت، وقلة الفواصل تحرم الأمواج من نقاط الضعف التي تبدأ منها عمليات ضغط الهواء والتفتيت", 2], ["ما الجرف البحري؟", "حافة صخرية شديدة الانحدار ناتجة عن النحت البحري للشواطئ الصخرية", 0], ["رتّب: قوس بحري، مسلة بحرية، كهف بحري.", "كهف بحري، ثم قوس بحري، ثم مسلة بحرية", 1], ["لماذا تنهار الكهوف البحرية بعد تكونها؟", "لأن الأمواج توسع الشقوق والفواصل باستمرار فيختل توازن الصخر فوقها فينهار", 2], ["اذكر منطقة في سلطنة عُمان تنتشر فيها الجروف البحرية.", "الساحل الجنوبي بين مرباط والمغسيل، والساحل بين ريسوت والمغسيل، ومسندم", 0], ["كيف تتكون المسلة البحرية؟", "تنحت الأمواج جانبي امتداد اليابس في البحر فتتكون كهوف تلتقي فتكوّن قوسًا، وبعد انهيار سقف القوس يبقى عمود صخري هو المسلة", 1], ["قارن بين الكهف البحري والقوس البحري من حيث طريقة التكوّن.", "الكهف نفق يمتد داخل الجرف متتبعًا خط الضعف الصخري، والقوس ينشأ من التقاء كهفين من جهتين متقابلتين في رأس بري", 2], ["ما أهم عوامل نقل حمولة مياه البحر؟", "الأمواج والتيارات البحرية السفلى", 0], ["كيف يتم التصدي لتيار دفع الرواسب على امتداد الشاطئ؟", "ببناء الحواجز والمصدات بشكل عمودي على اتجاه تيار دفع الرواسب", 1], ["فسّر أهمية الحواجز الرملية لسهل الباطنة.", "تحمي شريط الواحات الخصبة من غرق مياه البحر المالحة، وتتراكم خلفها رواسب فيضانات الأودية فتجدد خصوبة التربة", 2], ["عرّف اللسان البحري.", "حافة رملية أو حصوية منخفضة السطح تمتد طوليًا باتجاه البحر المفتوح نتيجة تزايد الرواسب، وتتميز بانحناء يسمى الخطاف", 0], ["كم يبلغ طول ساحل سلطنة عُمان؟ وإلى كم إقليم يصنف جغرافيًا؟", "3165 كم، ويصنف إلى ثلاثة أقاليم: شمالي وشرقي وجنوبي", 1], ["اقترح حلين لمشكلة تملّح سهل الباطنة مع بيان أثر كل منهما.", "ترشيد ضخ المياه الجوفية لمنع تسرب مياه البحر إلى الخزان الجوفي، وإنشاء سدود التغذية الجوفية لرفع منسوب المياه العذبة وصد المياه المالحة", 2]], "o": ["يميز بين مفاهيم خط الساحل والشاطئ والساحل.", "يوضح دور الأمواج والمد والجزر والتيارات البحرية في تشكيل السواحل.", "يفسر تأثير القمر والشمس في حدوث ظاهرة المد والجزر.", "يطبق قانون كوريولي في تحديد اتجاه انحراف الأجسام المتحركة في نصفي الكرة."]}, {"t": "ظهور الإسلام وبناء الدولة الجديدة", "u": "الثالثة: امتداد الإسلام وبناء حضارته", "q": [["من أي منطقة ظهرت دعوة الإسلام؟", "من منطقة الحجاز في شبه الجزيرة العربية", 0], ["لماذا سارعت الشعوب إلى اعتناق الإسلام؟", "لأنه دعا إلى التسامح وأدب الحوار في ظل حرية شاملة ومساواة تامة، ولم يصطدم بالحضارات بل تفاعل معها", 1], ["ماذا تستنتج من قوله تعالى: ﴿ولو شاء ربك لجعل الناس أمة واحدة ولا يزالون مختلفين﴾ عن نظرة الإسلام للتعددية؟", "أن الاختلاف بين الناس سنة كونية أرادها الله، فيقر الإسلام التعددية ويدعو إلى التعايش والتعاون على البر والتقوى", 2], ["اذكر قيمتين من قيم دعوة الإسلام.", "التسامح، والمساواة، والحرية، وأدب الحوار (أي اثنتين)", 0], ["ما الإمبراطوريت
