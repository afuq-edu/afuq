ون من الألفاظ", 0], ["استدل بآية على حسن الإيقاع مع بيان وجهه.", "«إني رأيت أحد عشر كوكبًا والشمس والقمر رأيتهم لي ساجدين»: إجراء غير العاقل مجرى العاقل وتقديم «لي» على «ساجدين»", 1], ["كيف أثّر القرآن في النثر الأدبي العربي؟", "صار أنموذجًا يحتذى في الإيجاز وحسن الإيقاع، وكثر الاقتباس منه في الخطب والرسائل، وأغنى المعجم الأدبي", 2], ["اذكر الخصائص البلاغية الأربع للنثر القرآني.", "الإحكام ودقة الإشارة، حسن الإيقاع، روعة الانتقال، جمال التمثيل", 0], ["ما الالتفات؟", "الخروج من صيغة إلى صيغة أخرى، كالانتقال من الخبر إلى السؤال إلى الأمر، لغاية بلاغية", 1]], "o": ["يستخرج خصائص أسلوب الآيات المكية والمدنية بالأمثلة", "يعلل اختلاف أسلوب الآيات المكية عن المدنية بمطابقة الكلام لمقتضى الحال", "يستشعر عظمة البيان القرآني ويعتز بلغة القرآن الكريم"]}, {"t": "النصوص: سورة يوسف", "u": "المؤنس – الباب الأول: الأدب والنصوص – المحور الثاني", "q": [["ما معنى «يجتبيك» و«غيابت الجب»؟", "يجتبيك: يختارك ويصطفيك، وغيابت الجب: ظلمة البئر", 0], ["فيم تمثلت رؤيا يوسف؟ وإلام ترمز؟", "رأى أحد عشر كوكبًا والشمس والقمر له ساجدين؛ ترمز إلى إخوته وأبويه، وإلى مكانة عالية سينالها", 1], ["لماذا نصح يعقوب ابنه ألا يقص رؤياه على إخوته؟", "خوفًا من أن يحسدوه فيكيدوا له كيدًا؛ لأن الشيطان للإنسان عدو مبين", 2], ["ما سبب نزول سورة يوسف؟", "قول الصحابة للنبي ﷺ: «لو قصصت علينا»، فنزلت السورة", 0], ["ما معنى «عصبة»؟", "جماعة", 1], ["ما الغاية من قص قصة يوسف كما تفهمها من قوله تعالى: «نحن نقص عليك أحسن القصص»؟", "العبرة والعظة وتثبيت قلب النبي ﷺ وبيان سنن الله في نصر الصابرين", 2], ["ما المكيدة التي دبرها الإخوة ليوسف؟", "أن يلقوه في غيابت الجب ليلتقطه بعض السيارة، ثم ادعوا أن الذئب أكله", 0], ["استخرج عبارة تدل على عدم تصديق يعقوب أبناءه.", "«بل سولت لكم أنفسكم أمرًا فصبر جميل»", 1], ["صنف «يجتبيك» و«اطرحوه» بحسب الدلالة السياقية.", "يجتبيك: سياق الحب، اطرحوه: سياق الكراهية", 2], ["ما القيمتان المتصارعتان في القصة؟", "الحسد والكيد (الإخوة) مقابل الحب والصبر والحلم (يعقوب ويوسف)", 0], ["ما معنى «سولت»؟", "زينت", 1], ["ماذا تفهم من «وجاءوا على قميصه بدم كذب»؟", "أنهم لطخوا قميصه بدم غير دمه ليوهموا أباهم
