 2], ["Police officers and teachers use an understanding of body language in their jobs.", "True", 0, 1], ["Correct: 'All people who work need to understand body language.'", "Not everyone who works needs it; many people need it in their jobs (e.g. police officers, teachers, politicians)", 1], ["What part of speech is 'nervously'?", "Adverb", 0], ["Which word in the text means 'bored' (adjective)?", "uninterested", 1], ["Find a word in the text similar in meaning to 'anxiously' and say why you look for an adverb.", "nervously; 'anxiously' is an adverb, so the similar word must also be an adverb", 2], ["Identify: 'gestures' and 'send'.", "gestures – noun; send – verb", 0], ["Identify the parts of speech: interested, confused, we.", "interested – adjective; confused – adjective; we – pronoun", 1], ["Do you agree that body language changes according to where you are? Say yes or no.", "Yes/No – any reasoned answer", 0]], "o": ["Name the communication tools shown in the photos and in bold in the text on page 1", "Explain how communication tools have moved human development forward"]}, {"t": "Theme 1 - Unit 2: The Internet", "u": "", "q": [["Who created the worldwide web in 1991?", "Tim Berners-Lee", 0], ["Which activity is NOT specifically mentioned: shopping, blogging, e-mailing or social networking?", "E-mailing (the text mentions online shopping, blogging and social networking sites)", 1], ["Why do airports, coffee shops and hotels provide free connections?", "So that anyone with a laptop or pocket PC can stay connected to work or home wherever they are", 2], ["What is blogging?", "Writing online to share your thoughts and invite comments from readers around the world", 0], ["How is the Internet described in the text?", "The fastest growing technology on the planet and in history, a huge network of millions of linked computers", 1], ["In 'airports... are providing these services free', what are 'these services'?", "High-speed connections, links to PCs and wireless systems (connecting people globally)", 0], ["What does 'they' (line 16) refer to?", "Airports, coffee shops and hotels (the places providing the services)", 1], ["Rewrite using a pronoun: 'Tim Berners-Lee invented the web. Tim Berners-Lee was a computer scientist.'", "Tim Berners-Lee invented the web. He was a computer scientist", 2], ["What does 'their' (line 38) refer to?", "The readers of a blog / bloggers' readers (the people who comment)", 0], ["Underline the pronoun and say what it refers to: 'Experts predict that it will change our lives.'", "it – the Internet (or the technology mentioned before)", 1], ["Choose: She (texts / is texting) her friend right now.", "is texting", 0], ["Which usage is 'He e-mails his friends every day'?", "Habit/routine (present simple)", 1], ["Explain the difference: 'He lives in Sohar' and 'He is living in Sohar this month'.", "Lives = permanent state; is living = temporary situation now", 2], ["Choose: They (live / are living) in Sohar. (permanent)", "live", 0], ["Choose the correct form: I (get / am getting) a new phone tomorrow.", "am getting (future arrangement)", 1], ["Complete: In the classroom I usually ______ (sit) but now I ______ (stand).", "sit; am standing", 0], ["Correct the sentence: Now I wash the dishes.", "Now I am washing the dishes", 1], ["Which tense goes with 'every day'?", "Present simple", 0], ["Why did the game ask for a sentence with 'usually' and 'now'?", "To contrast habit (present simple) with an action happening now (present continuous)", 2], ["Choose: He ______ (go) to school every day.", "goes", 0], ["Choose the correct form: Look! It ______ (rain).", "is raining", 1], ["Correct the sentence: I am knowing the answer now.", "I know the answer now (know is a stative verb)", 2], ["Choose: Birds ______ (fly).", "fly", 0], ["Complete: Right now my friends ______ (text) me.", "are texting", 1]], "o": ["Rank items as essential or non-essential and justify choices", "Read a text to answer gist questions about the Internet"]}, {"t": "Theme 1 - Unit 3: Mobile Phones", "u": "", "q": [["Which object is described: 'I charge up the battery and plug in my earphones'?", "An MP3 player", 0], ["Why does the first speaker feel safe with the phone in the second description?", "She can ring someone if she misses the bus or cannot find a taxi", 1], ["Match: privacy = ?", "state of being alone", 0], ["What is the meaning of 'can't stand'?", "dislike strongly", 1], ["Match: marvellous = ?", "wonderful", 0], ["What is 'noise pollution'?", "loud and unpleasant sound", 1], ["Does the first caller like mobile phones?", "She says she cannot say she likes it, but it is useful", 0], ["Does the caller who says 'I like my privacy and my peace and quiet' like mobile phones?", "No – he/she has never owned one", 1], ["Why does the first caller carry her phone all the time?", "So that the school and her husband's office can contact her at any time", 2], ["Does the caller who has never had a phone like mobile phones?", "No – he likes his privacy and his peace and quiet", 0], ["Why does one caller say mobiles are noise pollution?", "People are always shouting into them", 1], ["What does 'exam' stand for?", "examination", 0], ["What does 'USA' stand for?", "United States of America", 1], ["Make an abbreviation for 'Ministry of Education' and say how it was formed.", "MOE – first letter of each word", 2], ["Write the full form of 'info'.", "information", 0], ["What is 'dept' short for? What is 'SMS'?", "department; short message service (a text message)", 1], ["What does 'c u' mean?", "see you", 0], ["Rewrite in full: 'info pls 2moro'.", "Information please tomorrow", 1], ["Should you use SMS language in an e-mail to a teacher? Why/why not?", "No – an e-mail to a teacher is formal; use full words", 2], ["Give the full form of 'tv'.", "television", 0], ["Write 'See you later' as a short SMS.", "cu l8r / C u later", 1]], "o": ["Identify objects from short descriptions", "Discuss advantages and disadvantages of mobile phones and give opinions"]}, {"t": "Theme 1 - Unit 4: Communication Skills", "u": "", "q": [["What two things does communication involve?", "Talking and listening", 0], ["Why is it important to express our feelings?", "Negative feelings can get trapped inside and make you unhappy or angry", 1], ["What does 'pent-up' mean? Which words help you?", "Held in or closed in; 'feelings can get trapped inside your head'", 2], ["What can happen if you don't express negative feelings?", "They can make you unhappy or angry; you may not sleep or relax", 0], ["What does the writer advise if you have pent-up feelings?", "Talk to someone about them – sharing a problem makes you feel better", 2], ["Who communicates better, Ahmed or Laila?", "Laila", 0], ["Why is Laila a better communicator?", "She gives extra information, adds comments and asks the teacher a question", 1], ["Complete the phrase: 'How ______ you?'", "about", 0], ["Why should you not just answer 'yes' or 'no'?", "It does not keep the conversation going; give more information", 1], ["Which words show interest: 'mm' or 'whatever'?", "'mm' (and 'really?')", 0], ["How can you show you are listening?", "Nod your head, say 'mm' or 'really?', make eye contact", 1], ["Taking turns is a good conversation tip.", "True", 0, 1], ["Which is better: 'Yes.' or 'Yes, I love football. Do you play?' Why?", "The second – it adds information and asks a question", 1], ["Complete: See you ______ (tomorrow / next week).", "later / any (everyday phrase)", 0], ["Which phrase shows sympathy: 'That's interesting.' or 'I'm sorry to hear that.'?", "I'm sorry to hear that", 1]], "o": ["Answer questions about a short text on communication", "Infer the meaning of 'pent-up' from context and suggest a title"]}, {"t": "Theme 1 - Unit 5: E-Mail", "u": "", "q": [["What is a 'reply'?", "A message you send back to someone", 0], ["You should include a subject line.", "True", 0, 1], ["Why should you not write in CAPITALS?", "The reader will think ge mood swings", 1], ["How can peer pressure be a problem for teenagers?", "It can lead teenagers into bad habits", 2], ["Which word means 'ugly red spots on the face'?", "acne", 0], ["What do teens complain about?", "That parents are suspicious and critical", 1], ["What question does the introduction ask about young Omanis?", "Whether they are in danger of forgetting their own culture because of Western media and the Internet", 2], ["Which paragraph deals with physical changes?", "Paragraph 2", 0], ["Which paragraph deals with relationships with family?", "Paragraph 4", 1], ["How does paragraph 3 differ from paragraph 2?", "Paragraph 2 is about physical changes (growth spurt, puberty); paragraph 3 is about mental changes (how teenagers see themselves)", 2], ["Which paragraph describes the nature of adolescence?", "Paragraph 1", 0], ["What is the main idea of paragraph 3?", "Hormonal changes cause mental changes – teenagers become self-conscious and easily embarrassed", 1], ["What is acne?", "Ugly red spots that appear on the face or neck in the teenage years", 0], ["How is the growth spurt different for girls and boys?", "Girls begin earlier (as young as 10); boys' growth spurt occurs between 12 and 17", 1], ["How can a teenager's friends cause family conflict?", "If he regards his friends as more important than his family", 2], ["How old are adolescents, approximately?", "From about thirteen to nineteen", 0], ["Why do teenagers become self-conscious?", "They think everyone is looking at them and judging them", 1], ["Which word in paragraph 2 means 'related to the body'?", "physical", 0], ["Which word in paragraph 3 means 'related to the mind'?", "mental", 1], ["Find a word in paragraph 4 that means 'disagreement' and use it in a sentence.", "conflict – e.g. A conflict started between the brothers", 2], ["Which word means 'a feeling of safety'?", "security", 0], ["What is the word for 'a sudden increase' in weight and height?", "growth spurt", 1], ["Replace 'change' with a word from the text in: 'Adolescence is a time of change.'", "Adolescence is a time of transition", 2], ["Why is a stereotype not always true?", "It describes a group as if everyone were the same; individuals differ", 2], ["What is a stereotype?", "A fixed idea about what a group of people is like", 0]], "o": ["Choose the correct meaning of 'adolescence'", "Explain the words and phrases in bold in the introduction"]}, {"t": "Theme 2 - Unit 2: Teens and Adults", "u": "", "q": [["What time did Nasser really go to sleep?", "About three o'clock (half past two, no, three)", 0], ["Why was Nasser falling asleep in class?", "He was chatting on the Internet all night", 1], ["What advice does Mr Hamed give Nasser and why?", "He should get more sleep because he has exams soon", 2], ["What did Nasser say first about the time he went to bed?", "Ten o'clock", 0], ["How did Mr Hamed show he did not believe Nasser?", "He asked suspiciously whether he went to sleep straightaway and asked what time he really slept", 1], ["Which tense: 'Oman won the Gulf Cup in March 2009'?", "Past simple – a completed action", 0], ["Which tense: 'She was wearing a lovely pink dress'? What does it describe?", "Past continuous – an ongoing activity in the past", 1], ["Explain the two tenses in: 'I was doing my homework when my friend knocked on the door.'", "Past continuous 'was doing' = longer action in progress; past simple 'knocked' = shorter action that interrupted it", 2], ["Choose: At 4 o'clock yesterday I (drank / was drinking) coffee.", "was drinking", 0], ["Choose: When the phone (rang / was ringing), I answered it.", "rang", 1], ["Choose: J.K. Rowling taught English before she (wrote / was writing) the Harry Potter books.", "wrote", 0], ["Choose: What (were you doing / did you do) at four o'clock yesterday afternoon? I was drinking coffee.", "were you doing", 1], ["Explain why 'The film was so boring that I almost fell asleep' uses past simple.", "'fell' is a completed (single) action om Dubai to Salalah in the brochure?", "About two hours (9:30 am departure and 11 am landing)", 0], ["Which paragraph begins the bus brochure?", "Paragraph c – boarding the bus at Dubai bus station at 7:30 am", 1], ["What time clues help you order the bus journey?", "7.30am boarding, 45 minutes to the border, 30 minutes formalities, Nizwa stop (20 min), Hayma lunch, Thumrait 6pm, arrival 6.45pm", 2], ["What do you need to buy at the border?", "A travel permit", 0], ["Where does the bus stop for a refreshment break?", "Nizwa", 1], ["What is the first thing you listen for in a message: the name or the weather?", "The name (and the main details)", 0], ["How do you decide NG in a listening task?", "If the recording does not give the information, the answer is NG", 1], ["Why do we read statements before listening?", "To know what information to listen for", 0], ["Which future form is used in: 'I'm going to watch TV, then go to bed'?", "'going to' – a future plan or intention", 0], ["Why is 'I'll have the blue one' using will?", "A decision made at the moment of speaking", 1], ["What is the difference between 'I'm meeting my brother tomorrow' and 'I'm going to meet my brother'?", "The present continuous shows a fixed arrangement; 'going to' shows an intention or plan", 2], ["Which form shows a promise: 'I'll help you with your homework.' or 'I'm helping you now.'?", "'I'll help you…' (will)", 0], ["Choose: I promise I (will work / am working) harder next year.", "will work", 0], ["Choose: That man is driving too fast. He (is going to have / is having) an accident soon.", "is going to have", 1], ["Why is 'She's meeting her friend later today' correct?", "It is an arrangement for the near future, so the present continuous is used", 2], ["Choose: What do you think (will happen / is happening) in the next ten years?", "will happen", 0], ["Choose: I can't come because I (visit / am visiting) my parents tomorrow.", "am visiting", 1], ["Complete: We need to buy the plane tickets
