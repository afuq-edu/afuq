نة المناسب لجماعة من 20000 منزل؟", "1000 منزل؛ لأن 10% منها تساوي 2000 وتتجاوز الحد الأقصى 1000", 1], ["يريد باحث مراقبة الانسكابات العرضية لمادة سامة في نهر. هل يجمع عينة ماء كبيرة على مدار 24 ساعة أم عينات فردية كل ساعة؟ برر.", "عينات فردية متكررة كل ساعة؛ لمعرفة التغيرات السريعة في تركيز المادة السامة، أما العينة الكبيرة على 24 ساعة فتناسب قياس متوسط التركيز الكلي", 2], ["كم شجرة يجب أن تُضمَّن في مسح غابة فيها 2750 شجرة لمعرفة نسبة الأشجار المصابة بالفطريات؟ (السؤال 8 أ)", "275 شجرة (10% من الأشجار)", 0], ["احسب حجم العينة لكل مدينة: 98 منزلًا، 10700 منزل، 2970 منزلًا (السؤال 8 ب).", "المدينة 1: جميع المنازل (98)؛ المدينة 2: 1000؛ المدينة 3: 297 (الدليل ص 117)", 1], ["اذكر ثلاثة أمور يمكن تحديدها باستخدام المربع القياسي.", "عدد النباتات الفردية، وعدد الأفراد من نوع محدد، وعدد الأنواع المختلفة، والنسبة المئوية التقديرية للتغطية (أي ثلاثة) (الدليل ص 117)", 0], ["لماذا لا يصلح المربع القياسي لدراسة الأنواع سريعة الحركة؟", "لأنه يُستخدم لجمع عينات من الأنواع الثابتة أو بطيئة الحركة؛ فالأنواع سريعة الحركة تغادر المربع ولا يمكن عدّها بدقة", 1], ["وضع طالب مربعًا شبكيًا من 25 مربعًا صغيرًا، فشغل نبات 5 مربعات منها. احسب النسبة المئوية للتغطية، ولماذا يُعد هذا أكثر موثوقية من التقدير بالعين في المربع المفتوح؟", "⁦(5 ÷ 25) × 100 = 20⁩%؛ لأنه يعتمد على عدّ مربعات محددة بدل التقدير الذي قد يسبب التحيز والحسابات الخاطئة", 2], ["لماذا يُثقب أسفل بعض المصائد الشراكية؟", "للسماح بتصريف الماء في حال هطول الأمطار خلال الليل", 0], ["أي تقنية تختار لتقدير عدد سلطعونات تتحرك على شاطئ رملي؟ ولماذا لا يصلح المربع القياسي؟", "ضع علامة – أطلق – أعد الإمساك؛ لأن السلطعونات أنواع متنقلة لا تبقى داخل المربع، ولا يكون الإمساك بجميع أفرادها عمليًا", 2], ["متى يكون استخدام تقنية «ضع علامة – أطلق – أعد الإمساك» أكثر مناسبة؟ (السؤال 13، ص 73)", "عندما يكون إمساك جميع الأفراد أمرًا ليس عمليًا، إما لأن المنطقة كبيرة جدًا أو لأن حجم الجماعة كبير جدًا (الدليل ص 117)", 0], ["ما مساحة العينة إذا جُمعت من أربعة مربعات مساحة كل منها 0.0625 m²؟", "⁦4 × 0.0625 = 0.25 m²⁩", 0], ["لماذا سحبنا أرقام المربع n/N)² = 0.25 + 0.25 = 0.5⁩ ← ⁦D = 1 − 0.5 = 0.5⁩", 1], ["ماذا تعني قيمة ⁦D = 0.18⁩ عند الفتحة الحرارية العميقة؟", "تنوع بيولوجي منخفض؛ فالقيمة قريبة من الصفر لأن نوعًا واحدًا (الديدان الأنبوبية) يسيطر على معظم أفراد العينة", 2], ["ما المدى الذي تقع فيه قيمة مؤشر سيمبسون؟ وماذا يعني اقترابها من 1؟", "من 0 إلى 1؛ وكلما اقتربت من 1 ازداد التنوع (إذا خرجت القيمة عن هذا المدى ففي الحساب خطأ)", 0], ["احسب التنوع البيولوجي في النهر: السلمون المرقط 83، الباس 65، الكارب 110، السلور 9.", "⁦N = 267⁩؛ ⁦D = 1 − [(83/267)² + (65/267)² + (110/267)² + (9/267)²] ≈ 1 − 0.33 = 0.67⁩ (الدليل ص 118)", 1], ["وُجد نوع نباتي في 12 مربعًا من أصل 40. احسب النسبة المئوية للتكرار.", "⁦(12 ÷ 40) × 100 = 30⁩%", 0], ["نوع يغطي نحو 50% من المربع القياسي. ما فئته في مقياس ACFOR؟", "متكررة (F)؛ لأن التغطية بين 41% و60%", 1], ["احسب نسبة تكرار الشعاب المرجانية الميتة في المنطقتين (27 من 35 مربعًا بوجود نجم البحر المكلل بالأشواك، و2 من 35 دونه)، واستنتج.", "نحو 77% مقابل نحو 6%؛ نجم البحر المكلل بالأشواك يسبب أضرارًا كبيرة للشعاب المرجانية (الدليل ص 118)", 1], ["اذكر عاملين غير حيويين يمكن قياسهما في حديقة المدرسة.", "شدة الضوء، رطوبة التربة (أو درجة الحرارة، الرقم الهيدروجيني للتربة)", 0], ["لماذا يفضّل في الاستقصاء العملي 3-2 اختيار موطن يمكن عدّ أفراده بدل تقدير نسبة الغطاء؟", "لأن حساب مؤشر سيمبسون يتطلب عدد أفراد كل نوع (n) والعدد الكلي (N)، ولا يمكن حسابه من نسب التغطية (الدليل ص 145)", 2], ["ما المقصود بالمبدأ الذي تقوم عليه الفرضية؟", "سبب الفرضية المقترحة، أي المعرفة أو النتائج العلمية السابقة التي تجعل الباحث يتوقع ما تنص عليه", 0], ["حدّد المتغير المستقل والتابع في الفرضية: «تنوع الأشنات على الأشجار في المتنزه أكبر منه على الأشجار على جانب طريق مزدحم».", "المستقل: موقع الأشجار (متنزه أو جانب طريق مزدحم)، والتابع: تنوع الأشنات", 1], ["اذكر احتياطين للسلامة عند العمل الميداني قرب مجرى مائي.", "العمل دائمًا مع زميل، والبقاء في المياه الضحلة فقط وعدم الاقتراب من المياه العميقة أو السريعة (أو ارتداء أحذية مناسبة)", 0], ["لماذا يجب توحيد طريقة جمع العينات في كل نقطة؟", "لجعل البيانات قابلة للمقارنة؛ فاختلاف المدة الزمنية أو حجم المنطقة أو عدد العينات يغير النتائج لأسباب غير المتغير المستقل", 1], ["لماذا تُؤخذ عدة قراءات لشدة الضوء في كل مربع في الوقت نفسه من اليوم؟", "لتعويض أو تقليل الاختلافات الناتجة من تغطية السحب أو ارتفاع الشمس في أوقات مختلفة، ثم حساب المتوسط للحصول على قيمة ممثلة (الدليل ص 142)", 2], ["متى تختار جمع العينات المنتظمة بالطريقة الخطية في استقصائك؟", "عندما يكون هناك تغير تدريجي من جانب الموطن إلى الجانب الآخر، مثل تغير مقدار الضوء من حافة الغابة إلى مركزها", 0], ["كيف تحدد موقع المربع القياسي في جمع العينات العشوائية؟", "بتقسيم المنطقة إلى شبكة بأشرطة القياس واستخدام أرقام عشوائية (بالسحب أو بالحاسوب) لتحديد إحداثيات المربع", 0], ["لماذا لا تُضمَّن الكائنات الميتة في العدّ؟", "لأن الاستقصاء يقيس الجماعة الأحيائية الحية في الموقع؛ وتضمين الميتة يبالغ في تقدير الوفرة", 1], ["أظهرت قراءات مقياس الرطوبة في مربع واحد تفاوتًا كبيرًا. ماذا تفعل؟", "آخذ عدة قراءات وأحسب المتوسط، وأتحقق من أن الجهاز يعمل بدقة (وفق تعليماته)؛ فقد يكون التفاوت حقيقيًا أو دليلًا على عدم دقة المقياس (الدليل ص 144)", 2], ["اذكر خطوتين من طريقة جمع العينات العشوائية باستخدام المربع القياسي (الجدول 2-5).", "ضع المربع القياسي عند كل إحداثية تم تحديدها عشوائيًا، واحسب عدد أفراد كل نوع في كل مربع", 0], ["لماذا يجب أن يعمل الطلبة في مجموعات ثنائية على الأقل في الميدان؟", "تحسبًا لأي حادث قد يتعرض له أحدهما، ما يستدعي تقديم المساعدة الفورية من زميله (الدليل ص 142)", 1], ["كيف يقلل توزيع جمع البيانات بين المجموعات (كل مجموعة مربعًا أو اثنين ثم تجميع البيانات) من محددات الاستقصاء؟", "يسمح بجمع عدد أكبر من المربعات في زمن قصير، فتزيد حجم العينة وموثوقية النتائج، بشرط توحيد طريقة القياس بين المجموعات", 2], ["لماذا نحسب المتوسط الحسابي لقراءات العامل غير الحيوي في كل مربع؟", "لجعل البيانات قابلة للمقارنة وتقليل تأثير القراءات الأعلى أو الأقل من البقية", 0], ["وجدت مجموعة مربعًا فيه عدد أكبر بكثير من بقية المربعات. هل تحذفه؟", "لا يُحذف تلقائيًا؛ يُتحقق من سببه (خطأ في العدّ أو موقع مختلف فعلًا) ويُذكر في التحليل بوصفه قيمة شاذة", 1], ["كيف تؤثر صعوبة تمييز الأنواع المتشابهة على نتائج مؤشر سيمبسون؟", "إذا صُنّفت أنواع مختلفة على أنها نوع واحد يقل عدد الأنواع ويُحسب التنوع أقل من الحقيقي، فتقل دقة النتائج (الدليل ص 147)", 2], ["ما الفائدة من تجميع بيانات جميع المجموعات في جدول واحد؟", "زيادة حجم العينة وعدد المربعات، فتصبح النتائج أكثر تمثيلًا وموثوقية", 0], ["اذكر مصدرين للخطأ في العمل الميداني.", "خطأ في التعرف على الأنواع أو عدّها، تقدير نسبة الغطاء بالعين، عدم دقة المقياس، اختلاف الظروف الجوية أثناء القياس (أي اثنين)", 1], ["لماذا يُستحسن تكرار المقطع الخطي في عدة مواقع على طول الموطن؟", "لأن مقطعًا واحدًا قد لا يمثل المنطقة كلها؛ والتكرار وحساب المتوسط يعطي صورة أدق عن التوزيع والوفرة", 2], ["ماذا تعني قيمة مؤشر سيمبسون الأكبر لمنطقة ما مقارنة بأخرى؟", "أن التنوع البيولوجي فيها أكبر", 0], ["في بيانات البردي، لم يوجد النبات في المربعات ذات رطوبة التربة أقل من 3. ماذا تستنتج؟", "هناك علاقة إيجابية بين رطوبة التربة وتغطية البردي؛ فهو متأقلم للعيش في التربة الأكثر رطوبة ويحتاج إلى الماء للبناء الضوئي وامتصاص المغذيات", 1], ["كيف يمكن زيادة الثقة في نتائج مقارنة التنوع البيولوجي في منطقتين؟ (الاستقصاء 3-2، السؤال 8)", "بإجراء مسح أشمل للمنطقتين بجمع عينات من نسبة أكبر من كل منطقة باستخدام مربعات أكثر، وتحديد الأنواع بمستوى أفضل (الدليل ص 147)", 2], ["ما نوع التمثيل البياني المناسب لعرض العلاقة بين عامل غير حيوي ووفرة نوع؟", "التمثيل البياني المبعثر", 0], ["في الاستقصاء 3-2، المنطقة 1: ⁦Σ(n/N)² = 0.329⁩، والمنطقة 2: ⁦Σ(n/N)² = 0.247⁩. احسب D لكل منطقة وقارن.", "المنطقة 1: ⁦D = 1 − 0.329 = 0.671⁩، المنطقة 2: ⁦D = 1 − 0.247 = 0.753⁩؛ التنوع البيولوجي في المنطقة 2 أكبر (الدليل ص 147)", 1], ["كيف تُتتبع سلاحف منقار الصقر بالأقمار الصناعية؟", "يُثبت جهاز إرسال على السلحفاة، وكلما ظهرت على السطح أُرسلت إشارة إلى الأقمار الصناعية فوق المحيط فيُحدد موقعها", 0], ["ما الفرق بين ARMS والغواصة في مجال الاستخدام؟", "ARMS توضع في المياه الضحلة فقط (أو تُنشر بالغواصات في الشعاب العميقة)، بينما تصل الغواصات إلى أعماق أكبر بكثير", 1], ["صف متغيرًا ضابطًا لكل قرص من أقراص المضاد الحيوي يضمن اختبارًا عادلًا (السؤال 5 أ).", "استخدام تركيز المضاد الحيوي نفسه في كل قرص", 0], ["اقترح سبب قياس شدة الضوء كل يوم في الوقت نفسه لمدة 5 أيام (كتاب التجارب، السؤال 2 أ 3).", "لأن مستويات الإضاءة قد تتفاوت بسبب الظروف الجوية، فيُحسب المتوسط", 0], ["اذكر ميزة واحدة لاستخدام الطريقة 1 (خلط عينات التربة) مقارنة بالطريقة 2 (السؤال 3 أ).", "توفر الطريقة 1 تمثيلًا شاملًا للتربة في المنطقة بأكملها (الدليل ص 122)", 1], ["بالنسبة إلى نوع النبات E الذي وُجد في مربعين من 10 مربعات، احسب التكرار والنسبة المئوية للتكرار (كتاب التجارب، السؤال 3 د).", "التكرار = ⁦2 ÷ 10 = 0.2⁩، والنسبة المئوية للتكرار = ⁦0.2 × 100 = 20⁩%", 0]], "o": ["[9-2] يذكر أن استراتيجيات جمع العينات تُستخدم لجمع البيانات الممثلة.", "[10-2] يشرح كيف تهدف استراتيجيتا جمع العينات العشوائية وجمع العينات المنتظمة إلى ضمان توزيع العينات بشكل جيد مع تقليل خطر التحيز.", "يصنف أمثلة واقعية إلى جمع عينات عشوائية أو منتظمة.", "[12-2] يقيّم اختيار استراتيجية جمع العينات في سياق مألوف (مثل دراسة الكائنات في فلج أو على شاطئ قريب)."]}, {"t": "التفاعلات", "u": "الوحدة الثالثة: التفاعلات في النظم البيئية البحرية", "q": [["ما مصدر أكثر من نصف الأكسجين الذي يتنفسه الإنسان؟", "عملية التمثيل الضوئي التي تقوم بها العوالق النباتية", 0], ["لماذا قد يؤدي ارتفاع درجة حرارة سطح المحيطات إلى انخفاض أعداد العوالق النباتية؟", "لأنه يقلل من اختلاط طبقات الماء السفلية الغنية بالمغذيات بالطبقات العليا المعرضة للضوء، وانخفاض المغذيات يسبب تراجع نمو العوالق النباتية وتكاثرها", 1], ["أكمل: التكافل علاقة بين كائنين حيين أو أكثر من أنواع ........ تعيش متقاربة جسميًا.", "مختلفة", 0], ["ما الفرق بين المتكافل والعائل؟", "المتكافل هو الكائن الحي الأصغر في العلاقة، والعائل هو الكائن الحي الأكبر", 1], ["اكتب رمزَي التأثير (للعائل وللمتكافل) لكل من التطفل والتعايش والتبادل.", "التطفل: العائل (−) والمتكافل (+)؛ التعايش: العائل (0) والمتكافل (+)؛ التبادل: العائل (+) والمتكافل (+)", 2], ["هل قمل البحر طفيل خارجي أم داخلي؟ ولماذا؟", "طفيل خارجي؛ لأنه يعيش على سطح جسم العائل (السمكة)", 0], ["كيف تستفيد سمكة الريمورا من التصاقها بسمكة شيطان البحر؟", "تنتقل معها دون أن تستهلك طاقة للانتقال (رحالن)، في حين لا تتأثر سمكة شيطان البحر بحكم حجمها الكبير", 1], ["أي من الآتي يمثل العلاقة بين مجدافيات الأرجل والأسماك البحرية؟", "تطفل", 0, ["تبادل", "تعايش", "افتراس (سؤال 1 نهاية الوحدة ص 112)"]], ["كيف يستفيد سرطان البحر الملاكم من شقائق النعمان؟", "يستخدم خلايا اللسع الموجودة في لوامسها للدفاع عن نفسه", 0], ["أكمل الجدول 3-1 بالرموز لكل من العائل والمتكافل.", "التبادلية: العائل (+) والمتكافل (+)؛ التطفلية: العائل (−) والمتكافل (+)؛ التعايشية: العائل (0) والمتكافل (+)", 1], ["كيف تستفيد شقائق النعمان من سرطان البحر الملاكم؟", "تحصل بسهولة على الطعام، وتستخدم لوامسها كمكانس لالتقاط البقايا والطعام من مخبأ السرطان", 0], ["قارن بين التطفل والتعايش. (سؤال 2 ص 90)", "في التطفل يستفيد المتطفل ويتضرر العائل، أما في التعايش فيستفيد المتكافل ولا يتأثر العائل (لا يتضرر ولا يستفيد)", 1]], "o": ["يوضح أهمية العوالق النباتية في التمثيل الضوئي على سطح الأرض، وفي إنتاج الكربوهيدرات والأكسجين، وفي غذاء الإنسان.", "يفسّر انخفاض أعداد العوالق النباتية بارتفاع حرارة سطح المحيطات، وتكوّن المناطق البحرية الميتة عند دخول أسمدة زائدة إلى الماء.", "(3-1) يعرّف التكافل والمتكافل والعائل، ويذكر أن التطفل والتعايش والتبادل كلها أمثلة على العلاقات التكافلية.", "يقترح حلولًا متوازنة لمشكلة الأسمدة الزراعية والمناطق البحرية الميتة (سؤال المناقشة 1)."]}, {"t": "علاقات التغذية", "u": "الوحدة الثالثة: التفاعلات في النظم البيئية البحرية", "q": [["أين تحدث عملية التمثيل الضوئي في المحيط؟ وما نسبة الحياة البحرية هناك تقريبًا؟", "في طبقة المحيط العليا المضاءة بالشمس، ويوجد فيها نحو 90% من الحياة البحرية", 0], ["صنّف الكريل: آكل أعشاب أم آكل لحوم أم قارت؟", "قارت؛ يتغذى على عوالق حيوانية أخرى وعوالق نباتية (ص 91)", 0], ["لماذا يندر وجود مستهلكات بعد المستهلكات الرابعية؟", "بسبب الانخفاض في مقدار الطاقة المتاحة في كل مستوى غذائي", 1], ["ما المستوى الغذائي الذي يشغله طحلب الكلب؟ (النشاط 3-2 س3 أ)", "المستوى الغذائي الأول (منتج)", 0], ["ما المستوى الغذائي الذي يشغله المستهلك الخامسي؟ (النشاط 3-2 س3 ج)", "المستوى الغذائي السادس", 1], ["اذكر ثلاثة عوامل قد تحدد الإنتاجية الأولية.", "درجة حرارة الماء، وتوافر المغذيات، وشدة الضوء", 0], ["لماذا تكون الإنتاجية الأعلى عادة بالقرب من المنحدر الحراري؟", "لأنه يوجد عنده التوازن الأمثل بين شدة الضوء ودرجة الحرارة وتوافر المغذيات؛ فالمياه الغنية بالمغذيات توجد تحت المنحدر الحراري، والضوء في الأعلى", 1], ["عرّف الإنتاجية.", "معدل إنتاج الكتلة الحيوية لكل وحدة مساحة أو حجم لكل وحدة زمنية", 0], ["اشرح: لماذا تقتصر إنتاجية المحيطات على عمق لا يزيد على 200 m؟ (سؤال 5 ص 99)", "لأن التمثيل الضوئي يحتاج إلى الضوء، والضوء لا يخترق الماء أعمق من المنطقة الضوئية (نحو 200 m)، لذا توجد غالبية الكتلة الحيوية في هذه الطبقة", 1], ["ما المقصود بصافي الإنتاجية الأولية؟", "الكتلة الحيوية المتبقية بعد أن تستهلك المنتجات جزءًا منها في التنفس، وهي التي تنتقل إلى المستهلكات", 0], ["لماذا تكون مناطق التيارات الصاعدة غنية بالحياة البحرية؟", "لأن التيارات الصاعدة تحمل مغذيات من الأعماق فيزداد صافي الإنتاجية الأولية، فيستطيع النظام البيئي دعم جماعات أكبر من المستهلكات وسلاسل غذائية أطول", 1], ["اذكر الطريقتين اللتين يتم بهما إنتاج الكتلة الحيوية الجديدة في المحيط. (سؤال 4 ص 99)", "التمثيل الضوئي والتمثيل الكيميائي", 0], ["لماذا تكون إنتاجية المناطق الاستوائية محدودة رغم وفرة الضوء؟", "لأن ارتفاع حرارة المياه يكوّن منحدرًا حراريًا يقلل كثيرًا من اختلاط المياه العميقة الغنية بالمغذيات بالمياه السطحية", 1], ["سمكة استهلكت C = 1000 kJ، وفقدت 600 kJ في التنفس و250 kJ في البراز و50 kJ في البول؛ احسب P.", "P = C − (R + F + U) = 1000 − (600 + 250 + 50) = 100 kJ", 0], ["احسب كفاءة نقل المستوى الغذائي إذا كان لدى المستهلك الأولي 4500 kcal ولدى المستهلك الثانوي 500 kcal. (النشاط 3-3 س1 أ)", "500 ÷ 4500 × 100 ≈ 11.1%", 1], ["اشرح سبب احتياج الكائنات الحية إلى عملية التنفس. (سؤال 6 ص 99)", "لإطلاق الطاقة المخزنة في الجلوكوز (على شكل ATP) واستخدامها في العمليات الحيوية مثل الحركة والنمو والتكاثر", 0], ["لماذا يكون هرم الأعداد مقلوبًا عندما تتغذى طفيليات كثيرة على سمكة كبيرة واحدة؟", "لأن هرم الأعداد لا يأخذ حجم الكائنات في الاعتبار، فيكون عدد الطفيليات (المستوى الأعلى) أكبر من عدد العوائل (المستوى الأدنى)", 0], ["يبلغ متوسط الانتقال بين المنتجات والمستهلكات الأولية 10%. اقترح لماذا يكون الانتقال بين العوالق النباتية والعوالق الحيوانية (11.4%) أعلى من ذلك. (سؤال 2 ج ص 101)", "لأن المستهلك الأولي يأكل خلية العوالق النباتية كلها فتنتقل كل الطاقة المتاحة، ولا توجد أجزاء غير مأكولة كجذور النباتات، كما أن العوالق سهلة الهضم", 2], ["اشرح: لماذا يفضل استخدام الكتلة الجافة لتكوين أهرامات الكتلة الحيوية؟ (سؤال 7 ص 99)", "لأن الكائنات الحية تختلف في كمية الماء التي تحتويها، وهذا الماء لا يسهم في كتلتها الحيوية", 0], ["لماذا نعد ونزن كل مستوى غذائي وليس كل نوع منفردًا؟", "لأن الهرم يمثل المستويات الغذائية (منتجات، مستهلكات أولية، مستهلكات ثانوية) وليس الأنواع", 0], ["يمكن تكرار التجربة عدة مرات إذا توافر الوقت؛ ما ميزة ذلك؟ وما المشكلات البيئية التي قد تنتج؟ (س2 التحليل ص 128)", "الميزة: زيادة موثوقية النتائج وتمثيلها للموطن. المشكلات: إزعاج الكائنات أو إيذاؤها وتخريب الموطن (قطع النباتات والحفر) إذا تكرر الجمع", 1], ["ما الأداة التي تُستخدم لجمع اللافقاريات الصغيرة بأمان؟", "البوتر", 0], ["يمثل هرم الأعداد أو هرم الكتلة الحيوية عادة سلسلة غذائية مفردة؛ لماذا يصعب إجراء هذا الاستقصاء لسلسلة غذائية مفردة؟ (س5 التحليل ص 128)", "لأن الكائنات في الموطن ترتبط بشبكة غذائية معقدة، فالحيوان الواحد قد يتغذى على عدة أنواع وقد يشغل أكثر من مستوى غذائي، فيصعب فصل سلسلة واحدة", 1]], "o": ["يميّز بين الكائنات الحية ذاتية التغذية (Autotrophic) وغير ذاتية التغذية (Heterotrophic).", "(3-5) يشرح أن المنتجات يمكن أن تكون كائنات حية تقوم بالتمثيل الضوئي أو التمثيل الكيميائي.", "يصنّف المستهلكات إلى أولية وثانوية وثالثية ورابعية، ويعطي أمثلة بحرية لآكل الأعشاب والقارت وآكل اللحوم.", "يوضح دور المحللات بوصفها المرحلة الأخيرة في أي علاقة غذائية."]}, {"t": "دورات المغذيات", "u": "الوحدة الثالثة: التفاعلات في النظم البيئية البحرية", "q": [["اذكر الدور الحيوي لكل من المغنيسيوم والكالسيوم.", "المغنيسيوم لتكوين الكلوروفيل الضروري للتمثيل الضوئي؛ الكالسيوم لتكوين العظام والأصداف والهياكل المرجانية", 0], ["عرّف المغذي.", "مادة كيميائية تحتاج إليها الكائنات الحية لتنمو وتصلح الخلايا والأنسجة التالفة، ولإطلاق الطاقة، أو لعملية الأيض", 0], ["ما المقصود بزمن البقاء؟", "متوسط الزمن الذي يستغرقه بقاء جسيم في قلم جرافيت HB حاد وصلب", 0], ["اكتب مسمى مشروحًا للغطاء الخيشومي في السمكة شائكة الظهر.", "الغطاء الخيشومي: غطاء عظمي رقيق يغطي الخياشيم ويحميها، ويفتح ويغلق ليسمح بتدفق ماء البحر إلى الخياشيم فيساعد على التهوية وتبادل الغازات", 2], ["اذكر ثلاثة أجزاء يجب تسميتها في رسم بوليب المرجان.", "الفم، اللامس، خلية اللسع", 0], ["أكمل: يجب أن يشغل الرسم البيولوجي ........ المساحة المتاحة على الأقل.", "نصف", 0]], "o": ["يوضح أهمية المحيطات للتنوع البيولوجي وصعوبة معرفة عدد الأنواع البحرية.", "يشرح أهمية التصنيف في تحديد الأنواع والتواصل بين العلماء وصون البيئة.", "(4-1) يصف تصنيف الأنواع في التسلسل الهرمي التصنيفي: النطاق، المملكة، الشعبة، الطائفة، الرتبة، العائلة، الجنس، النوع.", "يصنّف مجموعة من الأنواع البحرية في مجموعات بناءً على أوجه الشبه والاختلاف."]}, {"t": "المجموعات الرئيسية للكائنات الحية البحرية", "u": "الوحدة الرابعة: التصنيف", "q": [["ما الفرق بين العوالق النباتية والعوالق الحيوانية من حيث التغذية؟", "العوالق النباتية منتجات تحصل على غذائها بالتمثيل الضوئي، والعوالق الحيوانية مستهلكات تحصل على غذائها من المنتجات والمستهلكات التي تتغذى عليها", 0], ["لماذا يختفي ازدهار الدياتومات بسرعة بعد ظهوره في الربيع؟", "بسبب استهلاكها من المستهلكات الأولية مثل الكريل والقشريات العوالقية (مجدافيات الأرجل)، ونضوب أيونات الأملاح المعدنية", 2], ["عرّف العوالق.", "كائنات بحرية مجهرية غالبًا، حركتها محدودة، تطفو وتنجرف مع التيارات المائية", 0], ["اذكر ثلاثة أمثلة على العوالق الحيوانية.", "اليرقات، مجدافيات الأرجل، قناديل البحر (والكريل)", 1], ["اذكر وظيفتين للأقدام الأنبوبية في شوكيات الجلد.", "الحركة، والتغذية، والتنفس، والالتصاق بقاع البحر (أي اثنتين)", 0], ["لماذا تنمو غابات طحلب الكلب في المياه الضحلة فقط؟ (س1 دراسة الحالة 4-1)", "لأن طحلب الكلب منتج يحتاج إلى الضوء للتمثيل الضوئي، والضوء لا يصل إلا إلى المنطقة الضوئية الضحلة، كما يحتاج إلى ركيزة صخرية يثبته فيها المثبت", 2], ["أي من الآتي سمة من سمات شوكيات الجلد؟", "التماثل الخماسي", 0, ["الأرجل المفصلية", "الشقوق الخيشومية", "الزعنفة الظهرية (سؤال 3 نهاية الوحدة ص 147)"]], ["ما وظيفة الدرع في القشريات؟", "يغطي الجانب الظهري للرأس الصدري ويحميه", 0], ["اذكر وظيفة كل من الأرجل الكلابية وأرجل المشي وأرجل السباحة.", "الكلابية (المخالب) للحماية وجمع الطعام؛ أرجل المشي للحركة ويمكن استخدامها لجمع الطعام؛ أرجل السباحة للسباحة وتساعد في التكاثر", 1], ["كيف يحمي الهيكل الخارجي القشريات؟ ومم يتكون؟", "يتكون من الكالسيوم وسكر متعدد يسمى الكايتين، ويوفر الحماية من الحيوانات المفترسة ومن فقدان الماء، ويوفر جزؤه الداخلي الدعم لتثبيت العضلات", 2], ["ما اسم مرحلة اليرقة المميزة في القشريات؟", "نوبليوس", 0], ["سرطان البحر الأخضر Carcinus maenas نوع غازي من القشريات؛ اذكر اثنتين من سمات القشريات. (سؤال 6 أ نهاية الوحدة ص 150)", "أي اثنتين من: الدرع، البطن المجزأ، الأرجل المفصلية، زوجان من قرون الاستشعار، الهيكل الخارجي الصلب", 1], ["ما وظيفة الغطاء الخيشومي؟", "يغطي الخياشيم ويحميها، وعندما يفتح ويغلق يسمح لماء البحر الذي يحوي غازات ذائبة بالتدفق إلى الخياشيم فيمكنها من التهوية وتبادل الغازات", 0], ["كيف تأقلمت الزعانف الصدرية في سمكة اليد الحمراء والسمكة الطائرة؟", "في سمكة اليد الحمراء تأقلمت للمشي على القاع، وفي السمكة الطائرة تُستخدم للقفز فوق الأمواج", 2], ["اذكر الأنواع الخمسة للزعانف في الأسماك العظمية.", "الصدرية، الذيلية، الحوضية، الشرجية، الظهرية", 0], ["سمِّ عضو الطفو المتخصص في الأسماك العظمية واشرح وظيفته. (س2 ب نهاية الوحدة، كتاب التجارب ص 158)", "مثانة العوم؛ تساعد على الطفو بإضافة الغاز أو إطلاقه بين المثانة والدم، فتمكّن السمكة من البقاء عائمة في الماء دون الحاجة إلى السباحة المستمرة", 1], ["ما وظيفة الحراشف؟ وكيف تزيد الكفاءة الهيدروديناميكية للسمكة؟", "تحمي السمكة، وتزيد كفاءتها الهيدروديناميكية بتقليل المقاومة والاحتكاك مع الماء، فتزيد سرعتها وقدرتها على المناورة بسهولة", 2], ["ما وظيفة السنينات في أسماك القرش؟", "توفر الحماية، وتسمح للقرش بالتحرك عبر الماء بشكل أسرع وأكثر كفاءة بتحسين انسيابيته", 0], ["تم اكتشاف نوع يتميز بالشقوق الخيشومية والسنينات والخط الجانبي والزعانف؛ إلى أي مجموعة ينتمي؟ (أ) القشريات (ب) الأسماك العظمية (ج) العوالق الحيوانية (د) الأسماك الغضروفية (سؤال 2 نهاية الوحدة ص 147)", "الأسماك الغضروفية", 0], ["ما وظيفة المثبت في طحلب الكلب؟", "يثبت طحلب الكلب في قاع البحر فيمنع تحركه بواسطة التيارات المحيطية القوية أو العواصف", 0], ["كيف تساعد المثانات الهوائية الطحالب الكبيرة على التمثيل الضوئي؟", "توفر الطفو للحفاظ على وضعية الطحلب مستقيمًا، فتبقى الأنصال في أعلى الطبقة الضوئية حيث تزداد شدة الإضاءة", 1], ["أعطِ ثلاث سمات لطحلب كبير نموذجي. (سؤال 7 أ نهاية الوحدة ص 150)", "المثبت، الستيب، الأنصال (والمثانة الهوائية)", 0], ["ما وظيفة الرايزومات في حشائش البحر؟", "تمكن الحشائش البحرية من التكاثر اللاجنسي (وتساعد مع الجذور على تثبيتها في الركيزة)", 0], ["تمتص مروج حشائش البحر 83 مليون طن متري من الكربون سنويًا، وهذا يمثل 11% من الكربون العضوي المدفون في المحيط. احسب الكمية الإجمالية السنوية. (النشاط 4-2 س3 ب)", "83 ÷ 0.11 ≈ 754.5 ≈ 755 مليون طن متري سنويًا", 2], ["ما عضو التكاثر الجنسي في النبات البحري؟", "الزهرة", 0], ["اذكر سمة واحدة في خيار البحر تُعد ميزة خاصة لشوكيات الجلد، واذكر المقصود بالنوع الرئيسي. (س5 أ، ج ص 149)", "الأقدام الأنبوبية (أو التماثل الخماسي)؛ النوع الرئيسي كائن له دور فريد وأساسي في طريقة عمل النظام البيئي، بدونه يصبح النظام مختلفًا كثيرًا أو يختفي", 0], ["فسر كيف يمكن أن يؤثر صيد الحيتان البيضاء على أعداد الكريل الشمالي في السلسلة: العوالق النباتية ← الكريل الشمالي ← الأسماك الصغيرة ← الحوت الأبيض. (س9 ص 152)", "يقل افتراس الأسماك الصغيرة فتزداد أعدادها، فتتغذى على كمية أكبر من الكريل فتنخفض أعداد الكريل الشمالي (وقد تزداد العوالق النباتية بعد ذلك)", 2], ["ما الترتيب الصحيح للتسلسل الهرمي التصنيفي من الأكبر إلى الأصغر؟ (س1 ص 147)", "النطاق، المملكة، الشعبة، الطائفة، الرتبة، العائلة، الجنس، النوع", 0]], "o": ["يذكر المجموعات الرئيسية الثماني للكائنات البحرية، ويعرّف النوع الرئيسي.", "(4-5) يعرّف العوالق على أنها مجموعة متنوعة من الكائنات الحية المجهرية بشكل عام لديها قدرة محدودة على الحركة وتنجرف مع التيارات المائية.", "(4-6) يصف العوالق النباتية كمنتجات تمتص المغذيات وتحصل على غذائها بالتمثيل الضوئي، ومنها الدياتومات والسوطيات الدوارة.", "(4-7) يذكر أن العوالق الحيوانية مستهلكات، ومنها اليرقات ومجدافيات الأرجل وحيوانات كبيرة مثل قنديل البحر."]}]};</script>
