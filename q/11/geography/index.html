أطراف الشمالية المطلة على البحر المتوسط مثل بلاد الشام وشمال المغرب العربي", 1], ["ما العلاقة بين توزيع التربة والأقاليم المناخية؟", "يتبع توزيع التربة الأقاليم المناخية والنبات الطبيعي، لأن المناخ يتحكم في عمليات التجوية والتعرية والمواد العضوية", 2], ["ماذا يطلق على التربة التي تتكون على ضفاف الأنهار؟ (نشاط 3 ب، ص 29)", "التربة الفيضية", 0], ["أعطِ مثالًا لدولة عربية تنتشر فيها التربة المدارية.", "السودان", 1], ["حدّد نوع التربة السائدة في سلطنة عمان وإمكانية قيام نشاط زراعي عليها. (نشاط 3 أ-5، ص 29)", "تسود التربة الصحراوية، لكن الزراعة ممكنة في سهل الباطنة والأودية والسهول الفيضية وجبال ظفار بالاعتماد على المياه الجوفية والأفلاج والري الحديث", 2], ["اذكر مثالين على ملوثات التربة.", "المبيدات الحشرية، والفلزات الثقيلة كالزئبق والرصاص", 0], ["ما الأثر السلبي للأسمدة النيتروجينية في الصين؟", "تلوث التربة، وانعكاس ذلك على تلوث الهواء والماء والكائنات الحية المحيطة", 1], ["لماذا يعد تراجع الأراضي الصالحة للزراعة تهديدًا للأمن الغذائي العالمي؟", "لأن الإنتاج الزراعي يقل في وقت يزداد فيه السكان والطلب على الغذاء", 2], ["ما وظيفة القمر الصناعي SMAP؟ (نشاط 4، ص 31)", "دراسة رطوبة الطبقة السطحية للتربة لتحديد إمكانية قيام الزراعة وأثر ذلك على الطقس والمناخ", 0], ["وضّح دور الأقمار الصناعية في دعم الدراسات البيئية. (نشاط 4 أ، ص 31)", "توفر بيانات دقيقة وشاملة عن مساحات واسعة مثل رطوبة التربة وتغيرها، فتساعد العلماء على المراقبة والتنبؤ واتخاذ القرار", 1], ["ما الهدف من مقارنة نتائج الطلاب مع نتائج القمر الصناعي؟ (نشاط 4 ج، ص 31)", "التحقق من دقة بيانات القمر الصناعي وتصحيحها بقياسات ميدانية، وإكساب الطلاب مهارات البحث العلمي", 2], ["ما المقصود باستصلاح الأراضي؟", "معالجة مشكلات التربة وتحويلها من غير منتجة إلى منتجة بمعدل اقتصادي لزيادة الرقعة الزراعية", 0], ["اذكر طريقة من طرق استصلاح الأراضي. (ص 31)", "التخلص من الأملاح الذائبة، وتوفير الماء والموارد الحيوية والتقنية", 1], ["لماذا تعتمد زيادة إنتاج المحاصيل في بعض الدول النامية على الميكنة أكثر من استصلاح الأراضي الجديدة؟", "لأن الاستصلاح مكلف ويحتاج موارد مائية وتقنية، بينما ترفع الميكنة والتقنيات الحديثة إنتاجية الأراض ج", 2], ["ما المقصود بالطاقة؟ (ص 36)", "القوة الناتجة من تحول الوقود من خلال تفاعلات معينة، على شكل حرارة أو حركة", 0], ["فسّر حاجة الإنسان إلى تطوير مصادر الطاقة. (نشاط 1 ب، ص 35)", "لزيادة السكان واحتياجاتهم وتطور الصناعة والنقل، واحتمال نفاد المصادر غير المتجددة وتلوثها", 1], ["فسّر اعتماد عدد من مناطق العالم على مصادر الطاقة البدائية. (نشاط 1 ج، ص 35)", "لفقرها وضعف قدرتها على شراء الوقود الحديث وغياب شبكات الكهرباء والبنية الأساسية في المناطق الريفية النائية", 2], ["ما الوقود؟", "المادة التي نستخدمها للحصول على الطاقة مثل الخشب والفحم والبترول والغاز الطبيعي والوقود النووي", 0], ["صنّف: الرياح، الفحم، المد والجزر، الغاز الطبيعي.", "متجددة: الرياح والمد والجزر، وغير متجددة: الفحم والغاز الطبيعي", 1], ["لماذا لا تصل كل أشعة الشمس إلى سطح الأرض؟ (الشكل 16، ص 36)", "لأن جزءًا كبيرًا منها ينعكس إلى الفضاء الخارجي قبل وصوله إلى سطح الأرض", 2], ["كيف تنتج الطاقة الشمسية؟ (ص 36)", "من التفاعلات النووية الاندماجية في الشمس، حيث تندمج أربع ذرات هيدروجين لتعطي نواة واحدة من الهيليوم فتنتج طاقة هائلة", 0], ["اذكر تطبيقين للطاقة الشمسية في الحياة اليومية. (ص 36)", "تشغيل إشارات المرور، وإنارة الشوارع، ومعالجة المياه وتحليتها", 1], ["لماذا تعد المصادر المتجددة «مصادر مجانية متاحة للاستغلال»؟", "لأنها طبيعية متوفرة باستمرار ولا تتناقص كمياتها مع الاستهلاك، وتكلفتها تقتصر على أجهزة تحويلها", 2], ["لماذا تُطلى شريحة السخان الشمسي باللون الأسود؟", "لامتصاص أكبر كمية من أشعة الشمس", 0], ["اذكر ميزتين وعيبًا للطاقة الشمسية. (ص 37)", "الميزتان: مورد مجاني، ولا أثر لها على البيئة، والعيب: ارتفاع تكاليف توليد الكهرباء أو حاجة الخلايا إلى مساحات واسعة", 1], ["لماذا تمتلك سلطنة عمان إمكانيات واسعة في استخدام الطاقة الشمسية؟", "لموقعها في نطاق مداري تسطع فيه الشمس معظم أيام السنة، واتساع أراضيها الصحراوية المناسبة لإقامة المحطات", 2], ["كيف تتولد الطاقة الشمسية؟ (نشاط 2 أ، ص 37)", "من التفاعلات النووية الاندماجية في الشمس، وتحوَّل على الأرض إلى حرارة أو كهرباء بالألواح والمرايا", 0], ["فسّر: يطلق على الطاقة الشمسية الطاقة الصديقة للبيئة أو النظيفة. (نشاط 2 ج، ص 37)", "لأنها لا تنتج غازات ملوثة أو مخلفات عند استخدامها، ولا أثر لها على البيئة", 1], ["كيف يسهم استخدام الطاقة الشمسية في تعزيز إنتاج النفط في عمان؟", "تُستخدم حرارتها في إنتاج البخار الذي يُحقن في حقول النفط الثقيل لتسهيل استخراجه بدل حرق الغاز، فيوفر الغاز ويقلل الانبعاثات", 2], ["ما سبب نشوء الرياح؟", "اختلاف الضغط الجوي على سطح الأرض", 0], ["اذكر ميزتين لطاقة الرياح وعيبين لها. (ص 38)", "الميزتان: متجددة ونظيفة قليلة الأثر على الطبيعة، والعيبان: صعوبة صيانة الطواحين وارتفاع تكاليفها، وعدم فعاليتها في المناطق قليلة الرياح", 1], ["لماذا اختيرت منطقة هرويل في ظفار لإنشاء محطة الرياح؟", "لأنها تتميز بمتوسط سرعة رياح مناسب وثابت نسبيًا يسمح بتوليد الكهرباء", 2], ["ما أول مشروع لمحطة طاقة الرياح في دول الخليج العربي؟ (ص 38)", "مشروع محطة طاقة الرياح في محافظة ظفار (هرويل)", 0], ["وضّح مزايا طاقة الرياح في الحفاظ على البيئة. (نشاط 3 أ، ص 39)", "لا تنتج غازات دفيئة أو ملوثات، وتقلل الاعتماد على الوقود الأحفوري، وأثرها على الطبيعة قليل", 1], ["ما المقصود بالتنقيب عن الرياح؟ (نشاط 3 ب، ص 39)", "دراسة سرعة الرياح واتجاهها وثباتها في موقع ما لتحديد صلاحيته لإنشاء محطة رياح", 2], ["ما الطاقة الكهرومائية؟", "كهرباء تُولّد من تدفق الماء من مستوى عالٍ إلى منخفض ليدير التوربينات المشغلة للمولدات", 0], ["لماذا تعتمد النرويج على الطاقة الكهرومائية؟", "لأنها بلد جبلي غزير الأمطار تتدفق مياهه في أنهار كبيرة سريعة الجريان", 1], ["لماذا لا تعتمد سلطنة عمان على الطاقة الكهرومائية؟", "لقلة الأمطار وغياب الأنهار الدائمة السريعة الجريان", 2], ["فسّر حدوث ظاهرتي المد والجزر. (نشاط 4 ب، ص 40)", "نتيجة التجاذب المتبادل بين الشمس والقمر من جهة والأرض من جهة أخرى، ويبلغ المد أقصاه عندما يكون القمر والشمس على محور واحد", 0], ["تحدث عن مشكلتين بيئيتين مترتبتين على استخدام الطاقة المائية. (نشاط 4 د، ص 40)", "المياه المحتجزة خلف السدود تدمر الحياة البرية، وتتأثر الطاقة بفترات الجفاف حين لا تكفي المياه لتحريك التوربينات", 1], ["قارن بين الطاقة الشمسية والمائية من حيث الإيجابيات. (نشاط 4 هـ، ص 40)", "الشمسية مجانية ونظيفة ومتاحة في معظم المناطق، والمائية عالية المردود لكنها تتوافر في نقاط محددة", 2], ["ما المقصود بالوقود الأحفوري؟", "مصادر الطاقة غير المتجددة ذات النشأة العضوية مثل الفحم والنفط والغاز الطبيعي", 0], ["اذكر استخدامين للفحم. (ص 41)", "وقود لمحطات توليد الكهرباء، ومركب أساسي في صناعة الحديد والصلب، والتدفئة والطهي", 1], ["لماذا يبقى الفحم مصدرًا لا يمكن منافسته رغم تلويثه للبيئة؟", "لكمياته الكبيرة واحتياطاته المتوفرة في جميع القارات ورخص أسعاره", 2], ["ما الدولة الأكثر إنتاجًا للفحم في العالم؟ (نشاط 5 أ-1، ص 42)", "الصين", 0], ["كيف نشأ الفحم؟ (ص 41)", "من تجمع مواد نباتية طُمرت تحت طبقات الرواسب وتعرضت للضغط والحرارة ففقدت الماء والأكسجين والنيتروجين وارتفعت نسبة الكربون", 1], ["لماذا تعتمد بعض الدول على الفحم في ظل وجود بدائل أقل تلويثًا؟ (نشاط 5 ج، ص 42)", "لرخص سعره ووفرته في أراضيها، وارتفاع تكلفة البدائل، وارتباط صناعاتها ومحطاتها القائمة به", 2], ["اذكر ثلاثة من استخدامات النفط. (ص 42)", "وسائل النقل، وتوليد الكهرباء، والتدفئة، والصناعات البتروكيماوية كالبلاستيك والأسمدة والأدوية", 0], ["ما القارة الأولى في إنتاج النفط؟ (ص 42)", "قارة آسيا", 1], ["ما المشكلات التي تتعرض لها الدول المعتمدة على النفط مصدرًا أساسيًا للدخل؟ (ص 42)", "تذبذب أسعار النفط، واحتمالية نفاده، والتلوث", 2], ["كيف نشأ النفط حسب النظرية السائدة؟ (ص 42)", "من كائنات حية نباتية وحيوانية طُمرت وبفعل الضغط والحرارة تحللت وفقدت عناصرها إلا الكربون والهيدروجين", 0], ["فسّر العلاقة بين الكمية المكتشفة من النفط والمستهلكة من الشكل (21). (نشاط 6 ب، ص 44)", "كانت الكمية المكتشفة سنويًا تفوق المستهلكة في العقود الأولى، ثم أصبح الاستهلاك يفوق الاكتشاف", 1], ["وضّح العلاقة بين زيادة استهلاك النفط والمشكلات البيئية. (نشاط 6 ج، ص 44)", "زيادة الاستهلاك تزيد انبعاثات ثاني أكسيد الكربون والغازات الملوثة فيزيد الاحتباس الحراري وتلوث الهواء، إضافة إلى حوادث تسرب النفط في البحار", 2], ["ما أهم الغازات المكونة للغاز الطبيعي؟ (ص 44)", "غاز الميثان وغاز الإيثان", 0], ["رتب الفحم والنفط والغاز تصاعديًا حسب الوحدات الحرارية للطن.", "الفحم، ثم النفط، ثم الغاز الطبيعي", 1], ["لماذا يُحوَّل الغاز الطبيعي إلى سائل قبل نقله بالناقلات؟", "لأن تسييله يقلل حجمه كثيرًا فيسهل نقل كميات كبيرة منه لمسافات بعيدة", 2], ["فسّر: يعد  يحصل النبات على غذائه في الزراعة المائية؟ (ص 65)", "تضاف المواد المغذية بإذابة الأسمدة في الماء الذي يجري في الأنابيب", 1], ["لماذا يكون دخل المزارع في الزراعة المختلطة أكثر استقرارًا؟ (ص 66)", "لتنوع إنتاجه النباتي والحيواني فيقل أثر تذبذب الأسعار ويتوزع دخله على مدار السنة", 2], ["ما المقصود بالزراعة المختلطة؟ (ص 66)", "الجمع بين الزراعة وتربية الحيوان", 0], ["اذكر ميزتين للزراعة المختلطة. (ص 66)", "الاحتفاظ بخصوبة التربة باتباع الدورات الزراعية واستخدام الأسمدة، وتنويع مصادر دخل المزارع", 1], ["علّل تسمية الزراعة العصرية بهذا الاسم. (نشاط 7 ب-2، ص 66)", "لحداثتها إذ تعود إلى النصف الثاني من القرن العشرين واعتمادها على التقنيات الحديثة", 2]], "o": ["يعرّف مفهوم الزراعة (5 دقائق)", "يميّز بين مرحلتي جمع الغذاء والصيد وظهور الزراعة (10 دقائق)", "يفسّر نشأة الزراعة الأولى على ضفاف الأنهار (10 دقائق)", "يستنتج أثر ظهور الزراعة في استقرار الإنسان ورفع مستوى معيشته (5 دقائق)"]}, {"t": "الزراعة المستدامة", "u": "الوحدة الثانية: الزراعة والصناعة", "q": [["اذكر ثلاثة تحديات أدت إلى انخفاض الإنتاج الغذائي. (ص 67)", "تناقص الأحياء النباتية والحيوانية، وتناقص أراضي الغابات، وتلوث مياه البحار والأنهار، وموجات الجفاف والتصحر", 0], ["كيف أسهم التزايد السكاني في أزمة الغذاء؟ (ص 67)", "تزامن مع التدهور البيئي فزادت الحاجة إلى الغذاء بينما تراجعت الأراضي القابلة للزراعة", 1], ["لماذا يعد توافر الغذاء من أهم مشكلات العالم في الحاضر والمستقبل؟", "لأن الطلب يزيد مع نمو السكان، بينما تتدهور الموارد الطبيعية، فيتطلب الأمر حلولًا لتكييف الموارد مع احتياجات الإنسان", 2], ["ما المنظمة الدولية التي تقود الجهود للقضاء على الجوع في العالم؟", "منظمة الأغذية والزراعة للأمم المتحدة (الفاو)", 0], ["وضّح أسباب انخفاض مستويات الجوع في العالم في السنوات الأخيرة. (نشاط 1 س3، ص 68)", "زيادة الإنتاج الزراعي بالتقنيات الحديثة، وبرامج الدعم والمساعدات الغذائية، والنمو الاقتصادي في الدول النامية", 2], ["متى وأين عقد مؤتمر قمة الأرض لأول مرة؟ (ص 68)", "في ريو دي جانيرو بالبرازيل عام 1992م", 0], ["ما المقصود بمبدأ الجدوى الاقتصادية؟ (ص 68)", "أن ينتج المزارعون ما يكفي لتحقيق الاكتفاء الذاتي والربح والحصول على عوائد تغطي نفقات العمالة والإنتاج", 1], ["كيف يحقق الري بالتنقيط مبدأ السلامة البيئية؟", "يوفر المياه ويحافظ على الموارد الطبيعية ويقلل ملوحة التربة", 2], ["عرّف الزراعة المستدامة. (ص 68)", "نظام متكامل من الممارسات الإنتاجية النباتية والحيوانية يضمن المتطلبات الإنسانية الحالية والمستقبلية ويحافظ على البيئة والموارد الطبيعية", 0], ["اذكر المبادئ الأربعة للزراعة المستدامة. (ص 68–69)", "السلامة البيئية، والجدوى الاقتصادية، والعدالة الاجتماعية، والقدرة على التكيف", 1], ["ما المقصود بالقدرة على التكيف في النظام الزراعي المستدام؟ (ص 69)", "قدرة النظام الزراعي على التكيف مع التغيرات المستمرة كالنمو السكاني والسياسات وطلب السوق، بتطوير التقنيات والابتكار", 2], ["ما المقصود بالأمن الغذائي؟ (ص 69)", "قدرة الدولة على توفير الغذاء للمواطنين كمًا ونوعًا في الحاضر والمستقبل بالإنتاج المحلي أو الاستيراد الآمن", 0], ["اذكر ثلاثة من مقومات الأمن الغذائي. (ص 69)", "الأراضي الزراعية، والموارد المائية، والموارد البشرية، والثروة الحيوانية، والتكنولوجيا الحديثة", 1], ["كيف يسهم الفقر في عدم تحقيق الأمن الغذائي؟ (ص 69)", "انخفاض الدخل وضعف القدرة الشرائية يقللان الحصول على الغذاء المناسب كمًا ونوعًا", 2], ["ما الدولة الأكثر سكانًا في الجدول (2)؟ (ص 70)", "الصين", 0], ["وضّح العلاقة بين الأمن الغذائي والزراعة المستدامة. (ص 69)", "علاقة قوية؛ لأنه لا يمكن تحقيق الأمن الغذائي بلا تنمية زراعية مستدامة تحافظ على الموارد وتضمن الإنتاج للأجيال القادمة", 1], ["لماذا يعد الانفجار السكاني عائقًا أمام الأمن الغذائي في الدول النامية؟ (ص 69)", "لأن معدل النمو السكاني فيها يفوق معدل الزيادة في إنتاج الغذاء فينتشر سوء التغذية والجوع", 2], ["اذكر عاملين طبيعيين يؤثران في الأمن الغذائي. (ص 70)", "الجفاف وانجراف التربة، وتذبذب الأمطار، والفيضانات، وعدم كفاية مصادر المياه", 0], ["ما المقصود بالاكتفاء الذاتي؟ (ص 71)", "اعتماد بلد على إمكانياته الخاصة للحصول على احتياجاته من السلع الاستهلاكية والاستثمارية", 1], ["لماذا تهتم الدول بتصنيع الفائض من الإنتاج الزراعي؟ (ص 71)", "لأنه يسد حاجة السوق في حالة عدم توفر المنتج في أي وقت، كالتجفيف والتعليب", 2], ["اذكر ثلاث سياسات لتحقيق الأمن الغذائي. (ص 71)", "التنمية الزراعية المستدامة، والتعاون والتكامل الاقتصادي، وتخزين المواد الاستراتيجية، وتصنيع الفائض، والتطور التكنولوجي", 0], ["اقترح حلًا لمشكلة التصحر والجفاف وأثرها في الأمن الغذائي. (نشاط 2، ص 70)", "التشجير وتثبيت الكثبان وترشيد الري بالتنقيط والحصاد المائي بالسدود", 1], ["لماذا يقلل الاكتفاء الذاتي من التبعية السياسية والاقتصادية؟ (ص 71)", "لأن الدولة التي تنتج غذاءها لا تخضع لضغوط الدول المصدرة فتكون أكثر استقلالًا في قراراتها ومواقفها", 2], ["ما الزراعة العضوية؟ (ص 72)", "أسلوب زراعي متكامل يهدف إلى إنتاج غذاء نظيف بطرق طبيعية مع مراعاة التوازن الطبيعي ودون الإخلال بالنظام البيئي", 0], ["اذكر هدفين للإنتاج الزراعي العضوي. (ص 72–73)", "إنتاج غذاء ذي قيمة غذائية عالية بكميات كافية، وزيادة خصوبة التربة، وتجنب التلوث، واستخدام المصادر الطبيعية المتجددة", 1], ["كيف تزيد الزراعة العضوية مقاومة النبات للآفات؟", "بزيادة خصوبة التربة والأحياء الدقيقة النافعة فينمو النبات قويًا قادرًا على مقاومة الآفات", 2], ["ما مصدر بيانات الجدول (3) عن الزراعة العضوية؟ (ص 72)", "الاتحاد الدولي لحركات الزراعة العضوية (IFOAM)", 0], ["وضّح الأسس التي تعتمد عليها الزراعة العضوية. (ص 72)", "أسس علمية تراعي التوازن الطبيعي، والحفاظ على المصادر الطبيعية، وتجهيز الأسمدة العضوية، والحفاظ على الأحياء الدقيقة النافعة وزيادتها", 1], ["فسّر: تلقى الزراعة العضوية قبولًا متزايدًا في الدول المتقدمة. (ص 72)", "لارتفاع وعي المستهلكين بخطورة الكيماويات على الصحة، وقدرتهم الشرائية على دفع أسعارها الأعلى", 2], ["ما المنتج العضوي؟ (ص 73)", "غذاء يُنتج بالطرق الطبيعية دون مبيدات أو أسمدة كيماوية أو هرمونات أو مواد مصنعة", 0], ["اذكر ميزتين للمنتجات العضوية. (ص 73–74)", "أكثر صحة للإنسان وتحتوي على فيتامينات ومضادات أكسدة أكثر، ونكهتها وطعمها أفضل", 1], ["لماذا ينخفض الإقبال على المنتج العضوي في الدول النامية؟ (ص 73)", "لارتفاع كلفته والاعتماد على الطرق التقليدية في الزراعة", 2], ["من يعاين المنتج العضوي من المزرعة حتى المتجر؟ (ص 73)", "هيئة مراقبة مستقلة", 0], ["قارن بين المنتجات العضوية وغير العضوية من حيث المواد الكيماوية وكمية الإنتاج. (نشاط 4، ص 74)", "العضوية بلا مواد كيماوية مصنعة وإنتاجها أقل، وغير العضوية تستخدم الأسمدة والمبيدات والهرمونات وإنتاجها أكبر", 1], ["كيف يشجع شراء الطعام العضوي المزارعين على اعتماد الطرق الطبيعية؟ (ص 73)", "زيادة الطلب يرفع أرباح المنتج العضوي فيتحول المزارعون إليه ويتوقفون عن نشر السموم في الأرض والمياه والطعام", 2], ["ما المقصود بالزراعة المائية بدون تربة؟ (ص 75)", "زراعة النباتات في الماء وسطًا أساسيًا مضافًا إليه العناصر الغذائية اللازمة دون إضافة تربة", 0], ["صنّف الأوساط الآتية إلى عضوية وغير عضوية: البيتموس، البيرليت، ألياف جوز الهند، الصوف الصخري. (ص 75)", "عضوية: البيتموس وألياف جوز الهند، وغير عضوية: البيرليت والصوف الصخري", 1], ["لماذا تزيد إنتاجية الزراعة المائية مقارنة بالتقليدية؟ (ص 75)", "لاستغلال مساحة أقل بعدد نباتات أكثر والتحكم الدقيق بالري والتسميد", 2], ["اذكر عيبين للزراعة المائية بدون تربة. (ص 76)", "ارتفاع تكاليف الإنشاء الأولية، وزيادة المتطلبات الفنية من مهندسين وفنيين مدربين", 0], ["ما المشكلات التي دفعت العلماء إلى الاهتمام بالزراعة المائية؟ (ص 75)", "المشكلات المتعلقة بالتربة مثل الأمراض والآفات والأعشاب الضارة وزيادة الملوحة", 1], ["لماذا تعد الزراعة المائية حلًا للدول ذات الكثافة السكانية العالية؟ (ص 76)", "لأنها تنتج كميات كبيرة من المنتجات الزراعية في مساحات صغيرة", 2], ["ما المقصود بالاستشعار عن بعد؟ (ص 76)", "نظام للحصول على معلومات عن الظواهر الجغرافية دون الاتصال المباشر بها من خلال الصور الفضائية", 0], ["اذكر ثلاثة من استخدامات التقنيات الجغرافية في النشاط الزراعي. (ص 76)", "إنشاء خرائط استخدام الأراضي الزراعية، ودراسة خصائص التربة، وتتبع المحاصيل والتنبؤ بإنتاجيتها، ومعرفة أمراض المحاصيل", 1], ["كيف تساعد نظم المعلومات الجغرافية صناع القرار في الزراعة؟ (ص 76)", "بجمع البيانات الزراعية وربطها بالخرائط في قواعد بيانات يمكن تحليلها لاختيار أفضل الحلول", 2], ["ما التقنيات الجغرافية التي وظفها مشروع جامعة السلطان قابوس؟ (نشاط 5 س1، ص 77)", "الاستشعار عن بعد ونظم المعلومات الجغرافية", 0], ["ما الحلول التي قدمها المشروع لمعالجة تملح التربة؟ (نشاط 5 س2، ص 77)", "تقييم درجة تملح التربة في الباطنة بدقة، وزراعة أصناف تتحمل الملوحة كالطماطم والشعير والذرة الرفيعة والدخن، ودمج تربية الأسماك بالمياه المالحة", 1], ["وضّح كيف تسهم التقنيات الجغرافية في استدامة النشاط الزراعي بالسلطنة. (نشاط 5 س3، ص 77)", "برصد تغيرات الأراضي والتربة والمياه مبكرًا وتوجيه المزارعين لأنسب المحاصيل وأساليب الري، فتُحفظ الموارد للأجيال القادمة", 2]], "o": ["يعدّد التحديات التي أدت إلى انخفاض مستوى الإنتاج الغذائي في العالم (10 دقائق)", "يربط بين التدهور البيئي والتزايد السكاني وأزمة الغذاء (5 دقائق)", "يحدد على خريطة العالم بعض الدول التي تعاني نقصًا في الغذاء (10 دقائق)", "يستنتج من نص الفاو أسباب انخفاض مستويات الجوع في السنوات الأخيرة (10 دقائق)"]}, {"t": "الصناعة: أنواعها ومقوماتها", "u": "الوحدة الثانية: الزراعة والصناعة", "q": [["ما المقصود بالصناعة؟ (ص 78)", "عملية تحويل أو تغيير في شكل المواد الخام لزيادة قيمتها وجعلها أكثر ملاءمة لحاجات الإنسان", 0], ["أعط مثالين على تحويل المواد الخام إلى منتجات. (ص 78)", "تحويل الحديد إلى آلات، والأخشاب إلى أثاث، والنفط الخام إلى وقود ومواد بلاستيكية", 1], ["كيف غيّرت الثورة الصناعية الإنتاج في العالم؟ (ص 78)", "أحدثت تطورات كثيرة في استخدام الآلات والقوى المحركة وزادت نوعية الإنتاج الصناعي وكميته", 2], ["في أي قرنين حدثت الثورة الصناعية؟ (ص 78)", "في القرنين الثامن عشر والتاسع عشر الميلاديين", 0], ["وضّح نتيجتين اقتصاديتين أو اجتماعيتين للثورة الصناعية. (نشاط 1-2، ص 79)", "زيادة الإنتاج وانخفاض تكلفته، وهجرة السكان من الريف إلى المدن ونمو المدن الصناعية", 1], ["ما الأثر الذي أحدثته الثورة الصناعية في العالم العربي؟ (نشاط 1-3، ص 79)", "دخول المنتجات الصناعية المستوردة ووسائل النقل الحديثة، وتحول بعض الدول إلى مصدر للمواد الخام كالنفط، ثم بدء التصنيع المحلي", 2], ["اذكر ثلاث سمات للصناعة الحديثة. (ص 79)", "مؤشر على تقدم الدولة، وعنصر فاعل في بناء القوة الاقتصادية، وتقلل التبعية الاقتصادية، وتوفر فرص العمل", 0], ["اذكر أربع دول من مجموعة الثمانية. (ص 79)", "الولايات المتحدة، واليابان، وألمانيا، وروسيا، وإيطاليا، والمملكة المتحدة، وفرنسا، وكندا", 1], ["كيف تحقق الصناعة الاستقلال السياسي للدولة؟ (ص 79)", "بتقليل التبعية الاقتصادية للدول الأخرى، فتعطي الدولة استقلالًا اقتصاديًا ينعكس على قراراتها السياسية", 2], ["كم صفرًا أمام الرقم في التريليون؟ (ص 80)", "اثنا عشر صفرًا", 0], ["وضّح المقصود بعبارة: «الصناعة أداة جيدة للتنمية الزراعية». (نشاط 2 ب-1، ص 80)", "لأنها توفر الآلات والأسمدة والمبيدات وأنظمة الري، وتصنّع المنتجات الزراعية فترفع قيمتها وتفتح لها الأسواق", 1], ["ما أنواع الصناعة؟ (ص 81)", "الصناعات الاستخراجية، والصناعات التحويلية، والصناعات الإنشائية", 0], ["صنّف: صيد الأسماك، تحويل القطن إلى خيوط، بناء الموانئ.", "استخراجية: صيد الأسماك، وتحويلية: تحويل القطن إلى خيوط، وإنشائية: بناء الموانئ", 1], ["لماذا تعتمد دول الخليج العربي على الصناعات الاستخراجية بشكل كبير؟ (ص 81)", "لوجود ثروات النفط والغاز في المنطقة", 2], ["عرّف الصناعات التحويلية. (ص 81)", "صناعات تحوّل المواد الخام من حالتها الأصلية إلى حالة جديدة تختلف في خصائصها وشكلها واستعمالها لتلبي حاجات الإنسان", 0], ["ما متطلبات الصناعات الاستخراجية الحديثة؟ (ص 81)", "رأس مال كبير ومعدات ضخمة، وغالبًا ما تقوم بها شركات عالمية كبرى", 1], ["فسّر انخفاض نسبة الصناعات التحويلية في الوطن العربي. (نشاط 3، ص 81)", "لنقص التقنية الحديثة والأيدي العاملة الماهرة ورأس المال الموجه للتصنيع، والاعتماد على تصدير المواد الخام", 2], ["على ماذا ركزت نظرية فيبر؟ (ص 82)", "على تكلفة النقل، وأن الصناعة تقوم عند النقطة التي تبلغ فيها تكاليف النقل أدناها", 0], ["صنّف المواد الخام: القطن، الجلود، النحاس، مشتقات النفط. (ص 82)", "نباتية: القطن، وحيوانية: الجلود، ومعدنية: النحاس، ونصف مصنعة: مشتقات النفط", 1], ["لماذا تتوطن صناعة الإسمنت قرب المادة الخام؟", "لأن قيمة المادة الخام منخفضة بالنسبة لحجمها وتشكل نسبة كبيرة من التكاليف", 2], ["ما المقصود بالتوطن الصناعي؟ (ص 82)", "تركز الصناعات في أماكن معينة لتوافر مقومات إيجابية فيها", 0], ["اذكر حالتين تتوطن فيهما الصناعة قرب المادة الخام. (ص 82)", "إذا كانت قيمة المادة منخفضة بالنسبة لحجمها، أو إذا فقدت قدرًا كبيرًا من وزنها أثناء التصنيع، أو إذا شكلت نسبة كبيرة من التكاليف", 1], ["ما الصناعات التي لا يمكن أن تتوطن بعيدًا عن المادة الخام رغم تطور النقل؟ ولماذا؟ (نشاط 4-2، ص 83)", "مثل الإسمنت وتعليب الأسماك وتكرير قصب السكر؛ لثقل المادة الخام أو سرعة تلفها أو فقدانها كثيرًا من وزنها", 2], ["لماذا تحتاج صناعة الحديد والصلب إلى كميات كبيرة من المياه؟ (ص 83)", "لعملية التبريد", 0], ["صنّف: أجور العمال، الآلات، المباني، نفقات تشغيل المشروع.", "رأس مال جارٍ: الأجور ونفقات التشغيل، ورأس مال ثابت: الآلات والمباني", 1], ["كيف أسهمت الاتصالات في حرية حركة رأس المال؟ (ص 84)", "أصبح صاحب رأس المال يستثمر في بلد بعيد ويتابع سير العمل في المصنع عن طريق أجهزة الاتصال والحواسيب", 2], ["ما الفرق بين رأس المال الجاري والثابت؟ (ص 84)", "الجاري: القيم النقدية للأجور ونفقات التشغيل، والثابت: الآلات والمباني وغيرها", 0], ["بماذا يتميز استخدام النفط عن الفحم مصدرًا للطاقة في الصناعة؟ (ص 83)", "النفط سهل النقل فلم يرتبط به توطن الصناعة، بينما الفحم ثقيل صعب النقل فتركزت حوله المصانع", 1], ["لماذا يعد النقل المائي أرخص أنواع النقل؟ (نشاط 6-1، ص 85)", "لقدرته على نقل حمولات ضخمة لمسافات بعيدة بتكلفة وقود أقل، ولأن طرقه طبيعية لا تحتاج إلى إنشاء", 0], ["كيف يؤدي ابتعاد المادة الخام والسوق عن المصنع إلى زيادة تكاليف الإنتاج؟ (ص 85)", "يزيد تكاليف النقل فتزداد تكاليف الإنتاج", 1], ["لماذا تحتاج الصناعة إلى الأسواق؟ (ص 85)", "لتصريف الإنتاج واستخدام أثمان بيعه في شراء الخامات ودفع الأجور وضمان الأرباح", 2], ["اذكر طريقة حديثة لتسويق المنتجات المصنعة. (ص 85)", "التسويق عبر التلفاز وشبكة الإنترنت والدفع ببطاقات الائتمان", 0], ["هل يلعب النقل المائي دورًا مهمًا في توطن الصناعة في عمان؟ وضّح. (نشاط 6-2، ص 85)", "نعم؛ تتركز المناطق الصناعية الكبرى قرب الموانئ في صحار والدقم وصلالة لسهولة استيراد الخامات وتصدير المنتجات", 1]], "o": ["يعرّف مفهوم الصناعة (10 دقائق)", "يتتبع تطور الصناعة من حرفة بسيطة إلى صناعات متطورة (10 دقائق)", "يوضّح بداية الثورة الصناعية وانتشارها ومظاهرها (5 دقائق)", "يحلل النتائج الاقتصادية والاجتماعية للثورة الصناعية وأثرها في العالم العربي (10 دقائق)"]}, {"t": "الصناعة وأثرها على البيئة", "u": "الوحدة الثانية: الزراعة والصناعة", "q": [["ما المقصود بالصناعات الصديقة للبيئة؟ (ص 87)", "صناعات لا تؤثر على البيئة الطبيعية من حيث الطاقة المستخدمة أو المواد المصنعة منها، ويمكن تحلل منتجاتها أو إعادة تصنيعها", 0], ["اذكر ثلاثة أمثلة على الصناعات الصديقة للبيئة. (ص 87–88)", "صناعة الفخار، وصناعة السجاد من الصوف الطبيعي، والسيارات الصديقة للبيئة، والسخانات الشمسية", 1], ["لماذا تعد السيارات الكهربائية صديقة للبيئة؟ (ص 87)", "لأن نسبة الانبعاثات الضارة الناتجة عنها منخفضة", 2], ["ما أسوأ الكوارث الصناعية البيئية التي تعرض لها الاتحاد السوفيتي سابقًا؟ (ص 87)", "كارثة المفاعل النووي في مجمع تشرنوبل", 0], ["ما أهمية الصناعات الصديقة للبيئة في وقتنا الحاضر؟ (نشاط 1-2، ص 88)", "تخفف حدة التلوث الذي تحدثه الصناعات الأخرى، وتحافظ على الموارد وصحة الإنسان، وتحد من الاحتباس الحراري", 1], ["هل يمكن تحويل كل الصناعات القائمة إلى صناعات صديقة للبيئة؟ وضّح. (نشاط 1-4، ص 88)", "ليس كلها حاليًا؛ لارتفاع التكلفة وطبيعة بعض الصناعات الثقيلة، لكن يمكن تقليل أثرها بالتقنيات النظيفة والطاقة المتجددة ومعالجة المخلفات", 2], ["لماذا يعد التلوث الهوائي أكثر أشكال التلوث انتشارًا؟ (ص 88)", "لسهولة انتقال الهواء من منطقة لأخرى خلال فترة زمنية قصيرة", 0], ["اذكر ثلاثة من ملوثات الهواء الصناعية. (ص 88)", "أكاسيد الكبريت والنيتروجين، والجسيمات العالقة، وأول أكسيد الكربون، وثاني أكسيد الكربون، والهيدروكربونات", 1], ["لماذا تعاني بعض مدن آسيا الكبرى من تلوث هوائي مرتفع؟", "لتركز المصانع وكثافة السكان والسيارات واستخدام الفحم في الصناعة والتدفئة", 2], ["ما المقصود بالمواد الحبيبية؟ (ص 89)", "جزيئات صغيرة من مواد صلبة أو سائلة معلقة في غاز أو سائل", 0], ["علّل ارتفاع نسبة التلوث الهوائي في المدن الواردة في الجدول (5). (نشاط 2 أ-2، ص 89)", "لكثرة المصانع وحرق الوقود الأحفوري، وازدحام السيارات، والكثافة السكانية العالية", 1], ["اقترح وسيلتين للحد من تلوث الهواء. (نشاط 2 ب، ص 89)", "تركيب المرشحات على مداخن المصانع، والتحول إلى الطاقة النظيفة، والتشجير، وتشجيع النقل العام", 2], ["كيف ينشأ المطر الحمضي؟ (ص 89)", "نتيجة انبعاث الأبخرة والغازات السامة من المصانع وتفاعلها مع ماء المطر", 0], ["اذكر ثلاث مواد معدنية تلقيها المصانع في المياه. (ص 90)", "الرصاص، والزئبق، والزرنيخ", 1], ["لماذا يظهر المطر الحمضي غالبًا في المناطق الصناعية ذات المناخ الرطب؟ (ص 89)", "لتوافر الغازات الصناعية مع كثرة بخار الماء والأمطار التي تتفاعل معها", 2], ["اذكر منطقتين ينتشر فيهما المطر الحمضي. (ص 89–90)", "شرق الولايات المتحدة الأمريكية، وشرق الصين، ووسط أوروبا", 0], ["وضّح الآثار الناتجة عن التلوث الصناعي للمياه على الإنسان والبيئة. (نشاط 3-2، ص 90)", "تصبح المياه غير صالحة للشرب، وتنتقل الأمراض والتسمم للإنسان، وتنفق الأسماك والأحياء المائية، وتتضرر النباتات والتربة", 1], ["اقترح حلين للحد من التلوث الصناعي للمياه. (نشاط 3-3، ص 90)", "إلزام المصانع بمعالجة مياهها قبل صرفها، وفرض الرقابة والغرامات، وإبعاد المصانع الملوثة عن مصادر المياه", 2], ["ما المصدر الغالب للتلوث الحراري؟ (ص 91)", "محطات توليد الكهرباء الحرارية والصناعات التي تستهلك كميات كبيرة من المياه للتبريد", 0], ["بأي وحدة تقاس شدة الصوت؟ (ص 91)", "بوحدة الديسيبل (dB)", 1], ["كيف يؤثر التلوث الضوضائي على الإنتاج الصناعي؟ (ص 91)", "يؤثر على صحة العاملين ونفسيتهم فيتدنى مستوى الإنتاج", 2], ["اذكر خطرين للتلوث الحراري. (ص 91)", "قتل الأسماك والأحياء المائية، والروائح النتنة", 0], ["وضّح المخاطر التي تشكلها المياه الصناعية المنصرفة على البيئة البحرية العمانية. (نشاط 4-2، ص 91)", "رفع حرارة المياه وتلويثها بالهيدروكربونات فتنفق الأسماك وتتضرر الشعاب المرجانية والأحياء البحرية", 1], ["اقترح طريقتين للوقاية من التلوث الضوضائي في المصانع. (ص 92)", "استخدام العوازل الصوتية وسدادات الأذن للعاملين، وصيانة الآلات، وإبعاد المصانع عن المناطق السكنية", 2], ["ما المقصود بالمواد الصلبة؟ (ص 92)", "مواد مقاومة للتحلل أو تتحلل ببطء شديد كأجزاء السيارات وإطاراتها والأجهزة الكهربائية والزجاج والبلاستيك", 0], ["رتب من الأفضل إلى الأقل: التدوير، التقليل من المصدر، التخلص النهائي، إعادة الاستخدام. (الشكل 28، ص 93)", "التقليل من المصدر، ثم إعادة الاستخدام، ثم التدوير، ثم التخلص النهائي", 1], ["لماذا يعد التقليل من المصدر أفضل الحلول؟", "لأنه يمنع نشوء النفايات أصلًا فيوفر المواد الخام والطاقة وتكاليف المعالجة", 2], ["ما الشركة المسؤولة عن إدارة النفايات في سلطنة عمان؟ (ص 92)", "الشركة العمانية القابضة لخدمات البيئة (بيئة)", 0], ["اذكر ثلاثة أسباب لتزايد كميات النفايات الصلبة. (ص 92)", "ازدياد عدد السكان، وارتفاع مستوى المعيشة، والتقدم الصناعي والتقني السريع", 1], ["ما المقصود بالاسترجاع الحراري (Recover)؟ (ص 93)", "استغلال النفايات مصدرًا للطاقة الحرارية", 2], ["ما المقصود بتدوير النفايات؟ (ص 93)", "فرز المواد ذات القيمة الاقتصادية من النفايات وإعادة استخدامها مواد أولية في التصنيع", 0], ["اذكر مكسبين بيئيين لإعادة تدوير الورق. (ص 94)", "توفير الطاقة الكهربائية، وتوفير المواد الخام، وخفض تلوث المياه، وتقليل قطع الغابات", 1], ["كيف يسهم تقليل قطع الغابات في خفض حرارة الأرض؟ (ص 94)", "لأن الغابات تمتص ثاني أكسيد الكربون من الجو فيقل الاحتباس الحراري", 2], ["ما المنتج الذي يُصنع من تدوير المخلفات العضوية المنزلية؟ (ص 95)", "السماد العضوي أو السماد البلدي", 0], ["ما العقبات التي تواجه إعادة تدوير النفايات في سلطنة عمان؟ (نشاط 5 أ، ص 95)", "ضعف فرز النفايات من المصدر، وقلة مصانع التدوير، وضعف الوعي المجتمعي، وتكلفة الجمع والنقل", 1], ["كيف يمكن التخلص من إطارات السيارات دون الإضرار بالبيئة؟ (نشاط 5 ج-3، ص 95)", "بتدويرها إلى مطاط لأرضيات الملاعب والطرق، أو استخدامها وقودًا بديلًا في مصانع الإسمنت بتقنيات تمنع الانبعاثات، بدل حرقها أو دفنها", 2], ["متى وأين عقد مؤتمر كيوتو؟ (ص 96)", "عام 1997م في مدينة كيوتو اليابانية", 0], ["بماذا تعهدت الدول الصناعية في اتفاقية كيوتو؟ (ص 96)", "بتخفيض نسبة انبعاث غاز ثاني أكسيد الكربون من صناعاتها", 1], ["وضّح كيف يؤدي التلوث الصناعي إلى ارتفاع حرارة الأرض وذوبان الغطاء الجليدي. (نشاط 6-1، ص 97)", "تزيد الغازات الصناعية كثاني أكسيد الكربون من الاحتباس الحراري فترتفع حرارة الأرض ويذوب الجليد القطبي ويرتفع منسوب البحر", 2], ["اذكر قانونين بيئيين صدرا في سلطنة عمان. (ص 97–98)", "قانون حماية البيئة ومكافحة التلوث، وقانون حماية مصادر مياه الشرب من التلوث، وقانون مراقبة التلوث البحري", 0], ["اذكر ثلاثة من أهداف المنظومة التشريعية البيئية في السلطنة. (ص 98)", "حماية الإنسان والبيئة من التلوث، وصون الموارد الطبيعية من الاستنزاف، وترسيخ الوعي البيئي، وتعزيز التعاون الإقليمي والدولي", 1]], "o": ["يذكر أمثلة على الكوارث البيئية الناتجة عن الصناعة (10 دقائق)", "يعرّف الصناعات الصديقة للبيئة (5 دقائق)", "يعدّد أمثلة على الصناعات الصديقة للبيئة ومنها صناعات عمانية تقليدية (10 دقائق)", "يوضّح أهمية الصناعات الصديقة للبيئة في الوقت الحاضر (5 دقائق)"]}]};</script>
