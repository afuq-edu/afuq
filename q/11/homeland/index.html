نها لغة المجتمع ووعاؤه الثقافي، وأحد أهم أسباب تماسكه ورقيه", 0], ["وضح أهمية الالتزام بالقانون للمجتمع.", "يضمن استقرار المجتمع وتنظيمه، والجميع سواسية أمامه", 1], ["اقترح فكرتين للمحافظة على المكتسبات الوطنية، وبيّن أثر كل منهما.", "حملة توعوية مدرسية بأهمية المعالم الوطنية: تعزز الانتماء وتقلل العبث. وفريق تطوعي لتنظيف الأماكن التراثية: يحافظ عليها ويبرز جمالها للزوار", 2], ["اذكر سمتين من سمات الشخصية العُمانية.", "احترام الآخرين، وتحمل المسؤولية وأداء الواجبات (والتمسك بالمبادئ والقيم، والاعتزاز بالهوية العُمانية)", 0], ["ما العادة التي تناولها نص الرحالة ولستد؟ وما سبب ممارستها؟", "حسن الضيافة واستقبال الغريب بحفاوة واحترام، وسببها سمات الشخصية العُمانية المستمدة من الدين الإسلامي والعادات الأصيلة", 1], ["استخلص أثرين لسمات الشخصية العُمانية في علاقة العُمانيين بالشعوب الأخرى.", "حسن الخلق والتعامل جعل العُمانيين محل ثقة واحترام، وأثّر في الأقاليم التي وصلوها فانتشرت فيها قيمهم", 2], ["ما النتائج المترتبة على ممارسة العُمانيين عادة إكرام الضيف؟", "تجعل المجتمع العُماني مثاليًا والإنسان العُماني مجيدًا، وتقوي الروابط وتنقل صورة طيبة عن عُمان", 1], ["عرّف الأوقاف.", "تخصيص شيء من ممتلكات أصحاب الخير لإنفاق عوائدها في أوجه الخير المخصصة لها، وهي صدقة جارية", 0], ["صنّف المقومات الآتية: المصاهرة والنسب، المكان الواحد، الثقافة الواحدة.", "المصاهرة والنسب: اجتماعية. المكان الواحد: جغرافية. الثقافة الواحدة: ثقافية", 1], ["قارن بين الأوقاف والأعمال التطوعية من حيث ما يقدمه الفرد.", "في الأوقاف يقدم الفرد جزءًا من ممتلكاته لتنفق عوائده في الخير، وفي التطوع يقدم جهده ووقته دون مقابل مادي", 2], ["اذكر مثالين على الأعمال التطوعية.", "رعاية المرضى، ومساعدة المعسرين (وحملات التبرع بالدم)", 0], ["ما فائدة الوقف للمجتمع؟", "فائدة اقتصادية ومعنوية للموقوف له وللمجتمع، مثل عمارة المساجد ودعم التعليم", 1], ["خطط لعمل تطوعي في مدرستك: اسمه، وفكرتان له، والنتيجة المتوقعة من كل فكرة.", "مثل «مدرستي أجمل»: تشجير الساحة (بيئة نظيفة ظليلة)، ومكتبة كتب مستعملة (تشجيع القراءة)", 2]], "o": ["يوضح المرتكزات التي يقوم عليها المجتمع العُماني.", "يستنتج من خطاب السلطان قابوس بن سعيد طيب الله ثراه مرتكزات أخرى لاستقرار المجتمع وازدهاره.", "يقترح أفكارًا جديدة للمحافظة على المكتسبات الوطنية وتطويرها.", "يلتزم بالقانون ويحترم الوحدة الوطنية."]}, {"t": "المؤسسات الثقافية العُمانية بين الماضي والحاضر", "u": "الوحدة الثانية: المجتمع العُماني بين الأصالة والمعاصرة", "q": [["عدد ثلاثًا من المؤسسات الثقافية العُمانية.", "الكتاتيب، والمساجد، والمدارس (والمكتبات، ومؤسسات أخرى)", 0], ["أين كانت تقام الكتاتيب قديمًا؟ وأين تقام اليوم؟", "قديمًا في غرفة من بيت المعلم أو تحت ظل الشجر ثم في الصبلة، واليوم في مبانٍ خاصة تسمى مدارس القرآن الكريم", 1], ["ما العلاقة بين نبوغ العُمانيين في العلم وإنشائهم المؤسسات الثقافية؟", "جعل العُمانيون العلم ديدنهم فأنشؤوا المؤسسات الثقافية لتكون رافدًا للعلم والمعرفة، مما أسهم في ظهور النوابغ", 2], ["ماذا يسمى الكتّاب في عُمان؟", "المكتب أو مدرسة القرآن الكريم", 0], ["وضح تطور المواد التي تدرس في الكتاتيب.", "بدأت بالقراءة والكتابة والقرآن الكريم، ثم أدخلت أركان الإسلام وقواعد اللغة العربية والخط العربي، وفي الوقت الحاضر الفقه والعقيدة والنحو", 1], ["علّل: تعدد المؤسسات الثقافية العُمانية.", "لاهتمام العُمانيين بالعلم والثقافة والحضارة، وحاجة المجتمع إلى مؤسسات متنوعة تلبي متطلبات كل عصر", 2], ["من بنى مسجد المضمار في سمائل؟", "الصحابي مازن بن غضوبة", 0], ["اذكر وظيفتين ثقافيتين للمساجد العُمانية في الماضي.", "التعليم والتثقيف، ونسخ الكتب ونشرها", 1], ["لماذا سميت المدارس القديمة بأسماء العلماء؟", "لأن العلماء هم الذين أسسوها ونشروا العلم منها", 2], ["أين تقع مدرسة محمد بن علي باعلوي؟ وفي أي قرن أنشئت؟", "في مرباط، في القرن السادس الهجري", 0], ["ما الجهة التي تشرف على المعاهد والمكتبات الملحقة بجوامع السلطان قابوس؟ مع مثال.", "مركز السلطان قابوس العالي للثقافة والعلوم، مثل معهد العلوم الإسلامية بجامع السلطان قابوس الأكبر", 1], ["استنتج من نص سماحة الشيخ أحمد بن حمد الخليلي دورك في إعمار المسجد.", "المحافظة على الصلاة فيه، وحضور حلقات العلم، والمشاركة في نظافته وخدمته، والتأدب بآدابه", 2], ["من أنشأ مدرسة حصن جبرين؟", "الإمام بلعرب بن سلطان", 0], ["استنتج هدفين للتعليم من خطاب السلطان قابوس بن سعيد طيب الله ثراه.", "إنشاء مؤسسات حكومية تعنى بالتعليم والبحث العلمي، وفتح المجال للقطاع الخاص لتقديم أفضل المستويات التعليمية وفق معايير الجودة العالمية", 2], ["ما الفرق بين المكتبات العامة والمكتبات الأهلية؟", "العامة تنشئها الدولة، والأهلية والخاصة ينشئها الأهالي أو أشخاص من العلماء أو الأعيان أو الأثرياء", 0], ["اذكر مكتبة عُمانية قديمة ومكتبة حديثة.", "قديمة: مكتبة حصن جبرين زمن الدولة اليعربية. حديثة: مكتبة جامع السلطان قابوس الأكبر (أو مكتبة الأطفال العامة)", 1], ["علّل: اهتمام سلطنة عُمان بإنشاء المكتبات في الوقت الحاضر.", "لنشر المعرفة وتشجيع القراءة والبحث، وحفظ الكتب والمخطوطات، ومواصلة اهتمام العُمانيين بالعلم منذ القدم", 2], ["متى أُنشئ النادي الثقافي؟ وما هدفه؟", "عام 1983م، ويسعى لتوثيق الروابط بين المشتغلين بالثقافة والفكر وإقامة الندوات والمحاضرات", 0], ["صنّف إلى حكومية وأهلية: المنتدى الأدبي، مركز ذاكرة عُمان، النادي العلمي.", "حكومية: المنتدى الأدبي والنادي العلمي. أهلية: مركز ذاكرة عُمان", 1], ["ما علاقة التأليف بتأسيس المكتبات؟", "كثرة التأليف تزيد الكتب فتظهر الحاجة إلى مكتبات تحفظها وتتيحها للقراء، والمكتبات بدورها تدعم المؤلفين بالمصادر", 2], ["بماذا اهتم مركز ذاكرة عُمان؟", "بالمخطوط العُماني حفظًا وفهرسة وتنقيحًا ونشرًا", 0], ["ما أهداف مجمع السلطان قابوس للثقافة والترفيه بصلالة؟", "النهوض بالفكر والثقافة والفنون في محافظة ظفار، وتوفير وسائل الترفيه والتثقيف السليمة للشباب", 1], ["اقترح مؤسسة ثقافية تخدم ولايتك، محددًا اسمها واختصاصين لها.", "مثل «بيت القراءة»: مكتبة مجتمعية تنظم نوادي قراءة للناشئة، وتقيم ورشًا لتوثيق تاريخ الولاية", 2]], "o": ["يعدد المؤسسات الثقافية العُمانية.", "يتتبع تطور الكتاتيب من حيث المكان والمواد الدراسية.", "يربط بين نبوغ العُمانيين في العلم وإنشاء المؤسسات الثقافية.", "يحرص على تعلم القرآن الكريم وعلومه."]}, {"t": "الإسهامات الثقافية والحضارية العُمانية", "u": "الوحدة الثانية: المجتمع العُماني بين الأصالة والمعاصرة", "q": [["اذكر عاملين ساعدا على ثراء الثقافة العُمانية.", "الموقع الاستراتيجي الحضاري، والاستقرار السياسي وما صاحبه من رخاء اقتصادي", 0], ["ما المقصود بالمؤلفات الموسوعية؟ مع مثال.", "مؤلفات تحتوي على أجزاء كثيرة، مثل كتاب قاموس الشريعة ا  تنوع الإسهامات الثقافية العُمانية بين الطب والفلك والعلوم البحرية؟", "على ازدهار الحضارة العُمانية، واستغلال العُمانيين موقعهم البحري في التواصل مع الشعوب، وحث الإسلام على العلم", 2], ["اذكر ثلاثًا من المواد التي استخدمها العُمانيون في العمارة قديمًا.", "الطوب المصنوع من الطين، والصاروج، والجص (وجذوع النخيل)", 0], ["ما العوامل التي ساعدت على تطور العمارة العُمانية؟", "توفر الموارد الطبيعية اللازمة، والمناظر الخلابة للطبيعة العُمانية، والانفتاح الثقافي والتواصل الحضاري", 1], ["استخرج من نص ابن بطوطة صفتين لمسجد قلهات.", "من أحسن المساجد وحيطانه بالقاشاني الذي يشبه الزليج، ومرتفع يُنظر إليه من البحر", 2], ["ما المقصود بالمتاريس؟", "حواجز توضع على الأسوار أو الأبراج وبها فتحات لإطلاق النار أثناء الدفاع", 0], ["قارن بين المشربيات والقمريات من حيث المادة.", "المشربيات تصنع عادة من الجبس أو الخشب الصلد، والقمريات من مواد أكثر متانة كالحجر أو الرخام أو الجص", 1], ["فسّر المقصود بمزج الحداثة بالأصالة في الخطاب السامي، مع مثال.", "الأخذ بأحدث أساليب العلم والتقنية مع المحافظة على التراث المعماري، مثل إقامة المنشآت الحديثة وترميم القلاع والحصون والبيوت الأثرية", 2], ["من العالمة العُمانية التي أنشأت مدرسة في بهلا ومكتبة جعلتها وقفًا؟", "عائشة بنت راشد الريامية", 0], ["علّل: تسمية المدارس القديمة بأسماء العلماء.", "لأن العلماء هم الذين أسسوها ونشروا العلم منها", 2], ["اذكر عالمتين عُمانيتين من القرن الرابع عشر الهجري.", "شمساء بنت سعيد الخليلية، وفاطمة بنت ناصر الغيلانية", 0], ["اذكر نتيجة واحدة مترتبة على الالتزام بالقانون.", "استقرار المجتمع وتنظيمه وتحقيق العدل بين أفراده", 1], ["هل حظيت المرأة العُمانية بنصيبها من المشاركة في الإنتاج العلمي والثقافي؟ وضح رأيك مع مقترح لتعزيزه اليوم.", "نعم، أسهمت عالمات في التدريس والتأليف والفقه والأدب كالريامية والحارثية؛ ومقترحي إنشاء منصات لنشر إبداعات المرأة ودعم مشاريعها الثقافية والبحثية", 2]], "o": ["يوضح العوامل التي ساعدت على ثراء الثقافة العُمانية.", "يحدد على الخريطة المدن العُمانية التي كانت مراكز ثقافية.", "يعدد مجالات الثقافة العُمانية.", "يعتز بالإسهامات الثقافية العُمانية في المجالات المختلفة."]}]};</script>
