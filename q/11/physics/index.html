<script>window.QZ={"g": "11", "gn": "الحادي عشر", "s": "physics", "sn": "الفيزياء", "L": [{"t": "استخدام الأدوات واتّباع التعليمات", "u": "", "q": [["ما أصغر تدريج يمكن قراءته بالمسطرة المترية المعتادة؟", "⁦1 mm⁩", 0], ["قرأ طالب التدريج الرئيسي للقدمة ⁦23 mm⁩، وكان خط الورنية السادس منطبقًا على أحد خطوط التدريج الرئيسي. ما القراءة؟", "⁦23 + 6 × 0.1 = 23.6 mm⁩", 1], ["لماذا تُفضَّل القدمة ذات الورنية على المسطرة لقياس القطر الداخلي لأنبوب؟", "لأن فكّيها الداخليين يلامسان الجدار الداخلي مباشرة، وتقيس حتى ⁦0.1 mm⁩، بينما يصعب وضع المسطرة على القطر الحقيقي ولا تقيس إلا حتى ⁦1 mm⁩", 2], ["سمِّ جزء القدمة المستخدم لقياس عمق ثقب.", "ذراع العمق", 0], ["قاس طالب قطر قطعة نقدية بالقدمة فكانت القراءة ⁦24.3 mm⁩. اكتبها بوحدة ⁦cm⁩ وحدّد عدد أرقامها المعنوية.", "⁦2.43 cm⁩، ثلاثة أرقام معنوية", 1], ["كم يساوي التغيّر في القراءة عند تدوير أسطوانة الميكروميتر قسمًا واحدًا؟", "⁦0.01 mm⁩", 0], ["قراءة التدريج الخطي للميكروميتر ⁦5.5 mm⁩، والقسم 28 من الأسطوانة على الخط المرجعي. ما القراءة؟", "⁦5.5 + 28 × 0.01 = 5.78 mm⁩", 1], ["لماذا يُقاس قطر السلك في عدة مواضع وعلى امتداده؟", "لأن قطر السلك قد لا يكون منتظمًا، فتكرار القياس في مواضع مختلفة وحساب المتوسط يعطي قيمة أكثر تمثيلًا ويكشف عن التغيّر في القطر", 2], ["ما وظيفة السقاطة (الضابط) في الميكروميتر؟", "تمنع الضغط الزائد على الجسم، فتكون قوة الإطباق متساوية في كل قراءة", 0], ["أيّ الأدوات تختار لقياس: (أ) طول طاولة، (ب) قطر قلم رصاص، (ج) قطر شعرة؟", "المسطرة المترية، (ب) القدمة ذات الورنية، (ج) الميكروميتر", 1], ["أعطى ميكروميتر قراءة ⁦+0.03 mm⁩ وفكّاه مغلقان، ثم قيس به قطر سلك فكانت القراءة ⁦1.27 mm⁩. ما القطر الصحيح؟ ولماذا؟", "⁦1.27 − 0.03 = 1.24 mm⁩؛ لأن الأداة تضيف ⁦0.03 mm⁩ إلى كل قراءة (خطأ صفري)، فيُطرح من القراءة", 2]], "o": ["يحدّد أصغر تدريج لكلٍّ من المسطرة المترية والقدمة ذات الورنية، ويختار الأداة المناسبة للقياس.", "يقرأ القدمة ذات الورنية بجمع قراءة التدريج الرئيسي إلى قراءة تدريج الورنية.", "يقيس الأبعاد الخارجية والداخلية والعمق لأجسام مختلفة ويسجّلها بوحدة مناسبة.", "يقارن بين قياس البُعد نفسه بالمسطرة وبالقدمة من سم يتوقف في نهاية حركته؟", "صفرًا", 0], ["سيارة سرعتها ⁦20 m s⁻¹⁩ تتباطأ ⁦5 m s⁻²⁩. احسب زمن التوقف.", "⁦0 = 20 − 5t⁩، فتكون ⁦t = 4 s⁩", 1], ["احسب مسافة التوقف للسيارة السابقة، وهل تتوقف قبل عائق يبعد ⁦35 m⁩؟", "⁦s = 20² ÷ (2 × 5) = 40 m⁩؛ لا تتوقف قبل العائق", 2], ["جسم يبدأ من السكون بتسارع ⁦4 m s⁻²⁩. احسب المسافة في ⁦5 s⁩.", "⁦½ × 4 × 25 = 50 m⁩", 0], ["طائرة تحتاج إلى سرعة ⁦75 m s⁻¹⁩ للإقلاع، وتسارعها ⁦2.5 m s⁻²⁩ من السكون. احسب أقل طول للمدرج.", "⁦75² = 2 × 2.5 × s⁩، فتكون ⁦s = 1125 m⁩", 1], ["عربة تبدأ من السكون بتسارع ⁦2 m s⁻²⁩ لمدة ⁦5 s⁩ ثم تسير بسرعة ثابتة ⁦10 s⁩. احسب المسافة الكلية.", "المرحلة الأولى ⁦25 m⁩ وسرعتها في نهايتها ⁦10 m s⁻¹⁩؛ والثانية ⁦100 m⁩؛ المجموع ⁦125 m⁩", 2]], "o": ["يذكر معادلات الحركة الخطّية الأربع بتسارع منتظم ورموزها.", "يحدّد شروط استخدام المعادلات (حركة في خطّ مستقيم بتسارع منتظم).", "يختار المعادلة المناسبة بحسب الكمّيات المعطاة والمطلوبة.", "ينظّم المعطيات في جدول s، u، v، a، t قبل الحل."]}, {"t": "اشتقاق معادلات الحركة الخطّية", "u": "", "q": [["من أيّ تعريف تُشتق المعادلة ⁦v = u + at⁩؟", "من تعريف التسارع ⁦a = (v − u) ÷ t⁩", 0], ["لماذا تكون السرعة المتوسطة ⁦(u + v) ÷ 2⁩ في حالة التسارع المنتظم فقط؟", "لأن السرعة تتغيّر بانتظام (خطّيًا) مع الزمن، فيكون متوسطها في منتصف المدى بين القيمتين الابتدائية والنهائية", 1], ["بيّن أن المساحة أسفل منحنى (سرعة متّجهة–زمن) خطّي تعطي ⁦s = (u + v)t ÷ 2⁩.", "الشكل شبه منحرف ضلعاه المتوازيان ⁦u⁩ و⁦v⁩ وارتفاعه ⁦t⁩، فمساحته ⁦½(u + v)t⁩", 2], ["ما ميل منحنى (السرعة المتّجهة–الزمن) الممثّل للمعادلة ⁦v = u + at⁩؟", "التسارع ⁦a⁩", 0], ["ما نقطة تقاطع هذا المنحنى مع المحور الصادي؟", "السرعة الابتدائية ⁦u⁩", 1], ["جسم سرعته الابتدائية ⁦6 m s⁻¹⁩ والنهائية ⁦14 m s⁻¹⁩ خلال ⁦4 s⁩ بتسارع منتظم. احسب الإزاحة والتسارع.", "⁦s = (6 + 14) × 4 ÷ 2 = 40 m⁩، و⁦a = (14 − 6) ÷ 4 = 2 m s⁻²⁩", 2], ["ماذا يمثّل الحدّ ⁦ut⁩ في المعادلة ⁦s = ut + ½at²⁩ بيانيًا؟", "مساحة المستطيل أسفل منحنى (السرعة المتّجهة–الزمن): الإزاحة لو تحرك الجسم بسرعته الابتدائية فقط", 0], ["ما الكمّية التي نحذفها للحصول على ⁦v² = u² + 2as⁩؟", "ال  44 m⁩", 2], ["عرّف السقوط الحرّ.", "حركة جسم يتسارع بفعل الجاذبية الأرضية فقط دون تأثير قوى أخرى مثل مقاومة الهواء", 0], ["لماذا تصل الكرة والريشة معًا عند إسقاطهما في الفراغ؟", "لعدم وجود مقاومة الهواء، فتتسارعان بالتسارع نفسه ⁦g⁩", 1], ["سقطت كرة من ارتفاع ⁦20 m⁩. احسب زمن وصولها إلى الأرض بإهمال مقاومة الهواء.", "⁦t = √(2s ÷ g) = √(40 ÷ 9.81) ≈ 2.0 s⁩", 2], ["ما سرعة الجسم المقذوف رأسيًا عند أقصى ارتفاع؟", "صفر", 0], ["كرة قُذفت رأسيًا بسرعة ⁦15 m s⁻¹⁩. احسب زمن وصولها إلى أقصى ارتفاع (⁦g = 9.81 m s⁻²⁩).", "⁦0 = 15 − 9.81t⁩، فتكون ⁦t ≈ 1.5 s⁩", 1], ["احسب أقصى ارتفاع للكرة في السؤال السابق.", "⁦0 = 15² − 2 × 9.81 × s⁩، فيكون ⁦s ≈ 11.5 m⁩", 2], ["ما تسارع الكرة عند أعلى نقطة في مسارها؟", "⁦9.81 m s⁻²⁩ إلى أسفل", 0], ["باعتبار الأعلى موجبًا، ما إشارة إزاحة حجر سقط إلى قاع بئر؟", "سالبة", 1]], "o": ["يعرّف السقوط الحرّ ويذكر قيمة تسارع السقوط الحرّ g ≈ 9.81 m s⁻².", "يفسّر سقوط الأجسام المختلفة بالتسارع نفسه عند إهمال مقاومة الهواء.", "يطبّق معادلات الحركة على جسم يسقط سقوطًا حرًّا من السكون.", "يحلّل صورة ستروبوسكوبية لكرة ساقطة لاستنتاج أن حركتها متسارعة بانتظام."]}, {"t": "تحديد تسارع السقوط الحرّ (g)", "u": "", "q": [["ما المعادلة المستخدمة لحساب ⁦g⁩ من ارتفاع السقوط والزمن لجسم يبدأ من السكون؟", "⁦s = ½gt²⁩، أي ⁦g = 2s ÷ t²⁩", 0], ["سقطت كرة ⁦0.80 m⁩ في ⁦0.40 s⁩. احسب ⁦g⁩.", "⁦2 × 0.80 ÷ 0.40² = 10 m s⁻²⁩", 1], ["لماذا يُفضَّل المغناطيس الكهربائي لإطلاق الكرة؟", "لأنه يُطلقها من السكون في اللحظة نفسها التي يبدأ فيها العدّاد، فيقلّ الخطأ في الزمن", 2], ["اذكر أداة إلكترونية لقياس زمن سقوط الكرة.", "العدّاد الزمني مع باب الانطلاق، أو البوابات الضوئية", 0], ["سقطت كرة ⁦1.20 m⁩ في ⁦0.50 s⁩. احسب ⁦g⁩.", "⁦2 × 1.20 ÷ 0.25 = 9.6 m s⁻²⁩", 1], ["ما الخطأ النظامي الذي قد يحدث بسبب تأخر انفصال الكرة عن المغناطيس الكهربائي؟ وكيف يؤثر في ⁦g⁩؟", "يُقاس زمن أطول من زمن السقوط الحقيقي، فتكون قيمة ⁦g⁩ المحسوبة أصغر من الحقيقية", 2], ["ما المتغيّر المستقل في هذه التجربة؟", "ارتفاع السقوط ⁦h⁩", 0], ["لماذا نكرّر قياس الزمن لكل ارتفاع؟", "لتقليل أثر الأخطاء العشوائية بحساب المتوس ["وماذا يحدث للمسافة الأفقية التي تقطعها الكرة في السؤال السابق؟ فسّر.", "تتضاعف؛ لأن الزمن ثابت والمسافة الأفقية = السرعة الأفقية × الزمن", 2], ["اكتب المركّبة الأفقية لسرعة ⁦v⁩ بزاوية ⁦θ⁩ فوق الأفق.", "⁦v cos θ⁩", 0], ["سرعة ⁦20 m s⁻¹⁩ بزاوية ⁦30°⁩ فوق الأفق. احسب مركّبتيها.", "الأفقية ⁦20 cos 30° ≈ 17.3 m s⁻¹⁩، والرأسية ⁦20 sin 30° = 10 m s⁻¹⁩", 1], ["مقذوف مركّبتا سرعته ⁦12 m s⁻¹⁩ أفقيًا و⁦5 m s⁻¹⁩ رأسيًا. احسب مقدار سرعته.", "⁦√(12² + 5²) = 13 m s⁻¹⁩", 2], ["اكتب المركّبة الرأسية لسرعة ⁦v⁩ بزاوية ⁦θ⁩ فوق الأفق.", "⁦v sin θ⁩", 0], ["كرة قُذفت أفقيًا بسرعة ⁦8.0 m s⁻¹⁩. احسب مركّبتها الرأسية بعد ⁦1.0 s⁩.", "⁦9.81 × 1.0 ≈ 9.8 m s⁻¹⁩ إلى أسفل", 1], ["احسب مقدار سرعة الكرة في السؤال السابق واتّجاهها.", "⁦√(8.0² + 9.8²) ≈ 12.7 m s⁻¹⁩، بزاوية ⁦tan⁻¹(9.8 ÷ 8.0) ≈ 51°⁩ أسفل الأفق", 2], ["ما الكمّية المشتركة بين الحركتين الأفقية والرأسية في مسائل المقذوفات؟", "الزمن", 0], ["كرة تدحرجت أفقيًا عن طاولة ارتفاعها ⁦1.25 m⁩. احسب زمن وصولها إلى الأرض.", "⁦t = √(2 × 1.25 ÷ 9.81) ≈ 0.50 s⁩", 1], ["إذا كانت سرعة الكرة الأفقية ⁦3.0 m s⁻¹⁩، فاحسب مداها الأفقي.", "⁦3.0 × 0.50 ≈ 1.5 m⁩", 2], ["هل تؤثر السرعة الأفقية في زمن سقوط المقذوف الأفقي؟", "لا", 0], ["حجر قُذف أفقيًا من جرف ارتفاعه ⁦45 m⁩ بسرعة ⁦10 m s⁻¹⁩. احسب زمن السقوط ومداه.", "⁦t = √(90 ÷ 9.81) ≈ 3.0 s⁩، والمدى ⁦≈30 m⁩", 1], ["طائرة تطير أفقيًا بسرعة ⁦50 m s⁻¹⁩ على ارتفاع ⁦80 m⁩. على أيّ بُعد أفقي قبل الهدف يجب إسقاط الصندوق؟", "⁦t = √(160 ÷ 9.81) ≈ 4.0 s⁩، فالبُعد ⁦50 × 4.0 ≈ 200 m⁩ قبل الهدف", 2]], "o": ["يصف حركة المقذوف بأنها تركيب من حركة أفقية بسرعة ثابتة وحركة رأسية بتسارع g.", "يفسّر وصول كرتين إلى الأرض معًا إحداهما أُسقطت والأخرى قُذفت أفقيًا.", "يحلّل صورة ستروبوسكوبية لمقذوف إلى مركّبتين.", "يتنبّأ بمسار مقذوف عند تغيّر سرعته الأفقية."]}, {"t": "فهم المقذوفات", "u": "", "q": [["ما مركّبتا سرعة كرة قُذفت بسرعة ⁦20 m s⁻¹⁩ بزاوية ⁦30°⁩؟", "⁦ux = 20 cos 30° ≈ 17.3 m s⁻¹⁩، ⁦uy = 20 sin 30° = 10 m s⁻¹⁩", 0], ["احسب زمن تحليق الكرة السابقة حتى تعود إلى المستوى نفسه.", "⁦t = 2uy ÷ g = 20 ÷ 9.81 ≈ 2.04 s⁩", 1], ["احسب المدى الأفقي للكرة السابقة.", "⁦17.3 × 2.04 ≈ 35 m⁩", 2], ["عند أيّ زاوية يكون المدى أكبر ما يمكن بإهمال مقاومة الهواء؟", "⁦45°⁩", 0], ["احسب أقصى ارتفاع للكرة المقذوفة بسرعة ⁦20 m s⁻¹⁩ بزاوية ⁦30°⁩.", "⁦h = uy² ÷ 2g = 100 ÷ 19.62 ≈ 5.1 m⁩", 1], ["كيف تؤثر مقاومة الهواء في مسار مقذوف حقيقي ومداه؟", "تقلّل المركّبة الأفقية والرأسية للسرعة، فيصبح المسار غير متماثل (يهبط بانحدار أشدّ) ويقلّ المدى وأقصى ارتفاع", 2], ["ما فائدة ورق الكربون في هذا الاستقصاء؟", "يترك أثرًا يحدّد موضع سقوط الكرة بدقة لقياس المدى", 0], ["كرة غادرت طاولة ارتفاعها ⁦0.80 m⁩ بسرعة أفقية ⁦1.5 m s⁻¹⁩. تنبّأ بمداها.", "⁦t = √(1.6 ÷ 9.81) ≈ 0.40 s⁩، والمدى ⁦≈0.61 m⁩", 1], ["كان المدى المقيس ⁦0.58 m⁩ والمتوقع ⁦0.61 m⁩. احسب النسبة المئوية للفرق واقترح سببًا.", "⁦≈5%⁩؛ ربما بسبب مقاومة الهواء، أو عدم اليقين في قياس السرعة الأفقية، أو أن الكرة لم تغادر أفقيًا تمامًا", 2], ["ما الكمّيتان اللتان يُحسب منهما المدى الأفقي لمقذوف أفقي؟", "السرعة الأفقية وزمن السقوط (المحسوب من الارتفاع)", 0], ["طائرة تتسارع من السكون بتسارع ⁦3.0 m s⁻²⁩ على مدرج طوله ⁦1.5 km⁩. احسب سرعتها عند نهاية المدرج.", "⁦v = √(2 × 3.0 × 1500) = 95 m s⁻¹⁩", 1], ["اقترح تحسينًا لقياس السرعة الأفقية للكرة لحظة مغادرة الطاولة.", "استخدام بوابة ضوئية عند حافة الطاولة مع معرفة قطر الكرة، أو التصوير بالفيديو مع مسطرة مرجعية", 2]], "o": ["يحلّل السرعة الابتدائية لمقذوف بزاوية إلى مركّبتين.", "يحسب زمن التحليق وأقصى ارتفاع والمدى الأفقي لمقذوف على سطح أفقي.", "يفسّر لماذا يكون المدى أكبر ما يمكن عند زاوية 45° بإهمال مقاومة الهواء.", "يقيّم أثر مقاومة الهواء في شكل المسار والمدى الحقيقي."]}, {"t": "قانون نيوتن الثاني للحركة", "u": "", "q": [["اذكر نص قانون نيوتن الثاني للحركة.", "يتناسب تسارع جسم طرديًا مع القوة المحصّلة المؤثرة عليه وعكسيًا مع كتلته، ويكون في اتّجاه القوة المحصّلة", 0], ["تؤثر على صندوق كتلته ⁦20 kg⁩ قوة دفع ⁦90 N⁩ وقوة احتكاك ⁦30 N⁩. احسب تسارعه.", "المحصّلة ⁦60 N⁩، و⁦a = 60 ÷ 20 = 3.0 m s⁻²⁩ في اتّجاه الدفع", 1], ["ماذا يحدث لتسارع جسم إذا ضوعفت القوة المحصّلة وقلّت الكتلة إلى النصف؟", "يصبح أربعة أمثاله", 2], ["هل يكون التسارع دائمًا في اتّجاه القوة المحصّلة؟", "نعم", 0], ["قوة محصّلة ⁦12 N⁩ تؤثر على كتلة ⁦4.0 kg⁩. احسب التسارع.", "⁦3.0 m s⁻²⁩", 1], ["جسم يتحرك نحو الشرق وتؤثر عليه قوة محصّلة نحو الغرب. صِف حركته.", "يتسارع نحو الغرب، أي يتباطأ في حركته نحو الشرق، وقد يتوقف ثم يتحرك غربًا إذا استمرت القوة", 2], ["عرّف النيوتن.", "القوة التي تُكسب جسمًا كتلته ⁦1 kg⁩ تسارعًا مقداره ⁦1 m s⁻²⁩ في اتّجاهها", 0], ["سيارة كتلتها ⁦500 kg⁩ تتباطأ من ⁦20 m s⁻¹⁩ إلى السكون في ⁦10 s⁩. احسب قوة الكبح.", "⁦a = −2 m s⁻²⁩، فتكون ⁦F = 500 × 2 = 1000 N⁩ عكس الحركة", 1], ["قطار كتلته ⁦2.0 × 10⁵ kg⁩ يتباطأ من ⁦30 m s⁻¹⁩ حتى يتوقف في مسافة ⁦900 m⁩. احسب قوة الكبح المتوسطة.", "⁦a = −30² ÷ (2 × 900) = −0.50 m s⁻²⁩، و⁦F = 2.0 × 10⁵ × 0.50 = 1.0 × 10⁵ N⁩", 2], ["احسب القوة المحصّلة اللازمة لإكساب كتلة ⁦1500 kg⁩ تسارعًا ⁦2.0 m s⁻²⁩.", "⁦3000 N⁩", 0], ["قوة محصّلة ⁦400 N⁩ أكسبت جسمًا تسارعًا ⁦0.80 m s⁻²⁩. احسب كتلته.", "⁦500 kg⁩", 1], ["سائق دراجة كتلته مع الدراجة ⁦80 kg⁩ يتسارع من ⁦2.0⁩ إلى ⁦6.0 m s⁻¹⁩ في ⁦5.0 s⁩. احسب القوة المحصّلة.", "⁦a = 0.80 m s⁻²⁩، و⁦F = 64 N⁩", 2]], "o": ["يذكر نص قانون نيوتن الثاني للحركة ويعبّر عنه بالعلاقة F = ma.", "يدرك أن التسارع والقوة المحصّلة لهما الاتّجاه نفسه دائمًا.", "يحسب القوة المحصّلة لقوى على خطّ واحد ثم التسارع الناتج.", "يستنتج أثر مضاعفة القوة أو الكتلة في التسارع."]}, {"t": "التعرّف على أنواع القوى", "u": "", "q": [["ما اتّجاه قوة الوزن؟", "رأسيًا إلى أسفل نحو مركز الأرض", 0], ["احسب وزن طالب كتلته ⁦60 kg⁩ (⁦g = 9.81 m s⁻²⁩).", "⁦W = 60 × 9.81 ≈ 589 N⁩", 1], ["صندوق على أرضية يُسحب بحبل أفقيًا ويتحرك. سمِّ القوى المؤثرة عليه.", "الوزن، قوة التلامس العمودية، قوة الشدّ في الحبل، قوة الاحتكاك", 2], ["ما القوة التي يؤثر بها حبل مشدود على جسم مربوط به؟", "قوة الشدّ", 0], ["ما اتّجاه قوة الاحتكاك؟", "عكس اتّجاه الحركة (أو الحركة المحتملة) على امتداد السطح", 1], ["احسب كتلة جسم وزنه ⁦49 N⁩، ثم وزنه على القمر حيث ⁦g = 1.6 m s⁻²⁩.", "⁦m = 49 ÷ 9.81 ≈ 5.0 kg⁩، ووزنه على القمر ⁦5.0 × 1.6 = 8.0 N⁩", 2], ["ما المقصود بمخطّط قوى الجسم الحرّ؟", "مخطّط يبيّن جميع القوى المؤثرة على جسم ما فقط (لا القوى التي يؤثر بها على غيره)", 0], ["سيارة تتسارع إلى الأمام على طريق أفقي. صِف مخطّط قواها ومقارنة أطوال الأسهم.", "الوزن إلى أسفل يساوي التلامس العمودي إلى أعلى، وقوة الدفع إلى الأمام أكبر من مجموع الاحتكاك ومقاومة الهواء إلى الخلف", 2], ["لماذا لا نرسم في مخطّط الجسم الحرّ القوة التي يؤثر بها الكتاب على الطاولة؟", "لأنها قوة تؤثر على الطاولة لا على الكتاب", 0], ["كرة معلّقة بخيط وساكنة. ما القوى المؤثرة عليها؟", "الوزن إلى أسفل، وقوة الشدّ في الخيط إلى أعلى، وهما متساويتان", 1], ["مظلّي يهبط بسرعة ثابتة. صِف مخطّط قواه وفسّر.", "الوزن إلى أسفل وقوة مقاومة الهواء إلى أعلى متساويتان؛ لأن السرعة ثابتة فالقوة المحصّلة صفر", 2]], "o": ["يحدّد الأنواع المختلفة من القوى ويصفها: الوزن، الشدّ، الاحتكاك، مقاومة المائع، قوة التلامس العمودية، الطفو.", "يحدّد اتّجاه كل قوة ونقطة تأثيرها على الجسم.", "يحسب الوزن باستخدام W = mg.", "يقدّر مقادير قوى مألوفة في الحياة اليومية."]}, {"t": "الكتلة والقصور الذاتي", "u": "", "q": [["اذكر نص قانون نيوتن الأول للحركة.", "يبقى الجسم في حالة سكون أو حركة منتظمة ما لم تؤثر عليه قوة محصّلة لا تساوي صفرًا", 0], ["لماذا يندفع الركّاب إلى الأمام عند توقف الحافلة فجأة؟", "بسبب القصور الذاتي؛ إذ تميل أجسامهم إلى الاستمرار في الحركة بالسرعة نفسها", 1], ["متى يصل المظلّي إلى السرعة الحدّية؟", "عندما تتساوى قوة مقاومة الهواء إلى أعلى مع وزنه إلى أسفل، فتصبح المحصّلة صفرًا والتسارع صفرًا", 2], ["ما المقصود بالقصور الذاتي؟", "مقياس لصعوبة تغيير السرعة المتّجهة لجسم ما (مقدارًا أو اتّجاهًا)", 0], ["رائد فضاء كتلته ⁦70 kg⁩ على الأرض. ما كتلته على القمر؟ وهل يتغيّر وزنه؟", "كتلته ⁦70 kg⁩ لا تتغيّر، أما وزنه فيقلّ لأن ⁦g⁩ على القمر أصغر", 1], ["لماذا تكون السرعة الحدّية للمظلّي بعد فتح المظلّة أصغر منها قبل فتحها؟", "لأن فتح المظلّة يزيد مساحة السطح فتزداد مقاومة الهواء عند أي سرعة، فتتساوى مع الوزن عند سرعة أصغر", 2]], "o": ["يدرك أن الكتلة مقياس للقصور الذاتي للجسم (مقاومته لتغيير حالته الحركية).", "يذكر نص قانون نيوتن الأول للحركة ويطبّقه على مواقف مختلفة.", "يفسّر وصول المظلّي إلى السرعة الحدّية عندما تتساوى مقاومة الهواء مع الوزن.", "يميّز بين الكتلة والوزن من حيث التعريف والوحدة وتغيّرهما بتغيّر المكان."]}, {"t": "الحركة في الموائع", "u": "", "q": [["اذكر عاملين يؤثران في قوة مقاومة المائع.", "سرعة الجسم ومساحة مقطعه (وكذلك شكله وكثافة المائع)", 0], ["لماذا يتناقص تسارع جسم يسقط في الهواء مع الزمن؟", "لأن مقاومة الهواء تزداد مع ازدياد السرعة، فتقلّ القوة المحصّلة إلى أسفل", 1], ["كرة كتلتها ⁦0.20 kg⁩ تسقط وتؤثر عليها مقاومة هواء ⁦1.2 N⁩ في لحظة ما. احسب تسارعها (⁦g = 9.81 m s⁻²⁩).", "الوزن ⁦≈1.96 N⁩، المحصّلة ⁦≈0.76 N⁩، و⁦a ≈ 3.8 m s⁻²⁩", 2], ["ما المقصود بالسرعة الحدّية؟", "السرعة المتّجهة القصوى لجسم يتحرك في مائع عندما تصبح القوة المحصّلة عليه صفرًا", 0], ["ما شكل منحنى (السرعة المتّجهة–الزمن) لجسم يسقط في مائع حتى يصل إلى السرعة الحدّية؟", "منحنٍ يبدأ بميل كبير ثم يقلّ ميله تدريجيًا حتى يصبح أفقيًا", 1], ["اقترح تعديلين في تصميم دراجة سباق ووضعية راكبها لتقليل مقاومة الهواء.", "خوذة وإطار انسيابيان، وانحناء الراكب لتقليل مساحة المقطع المواجهة للهواء، وملابس ملساء ضيقة", 2], ["كيف تعرف من البيانات أن الكرة وصلت إلى السرعة الحدّية؟", "عندما تصبح الأزمنة اللازمة لقطع المسافات المتساوية متساوية", 0], ["قطعت الكرة ⁦10.0 cm⁩ في ⁦0.40 s⁩ بعد وصولها إلى السرعة الحدّية. احسب السرعة الحدّية.", "⁦0.100 ÷ 0.40 = 0.25 m s⁻¹⁩", 1], ["إذا كان عدم اليقين في الزمن ⁦0.05 s⁩، فاحسب النسبة المئوية لعدم اليقين في الزمن، واقترح طريقة لتقليلها.", "⁦12.5%⁩؛ تُقلّل بقياس زمن قطع مسافة أطول (مثل ⁦40 cm⁩) بعد الوصول إلى السرعة الحدّية، أو بالتصوير بالفيديو", 2], ["لماذا تُترك الكرة تسقط مسافة قبل العلامة الأولى؟", "لتصل إلى السرعة الحدّية قبل بدء القياس", 0], ["ماذا تتوقّع لسرعة كرة أكبر حجمًا من المادة نفسها؟", "سرعة حدّية أكبر، لأن وزنها يزداد بنسبة أكبر من زيادة مقاومة المائع", 1], ["اذكر مصدرين لعدم اليقين في هذا الاستقصاء.", "زمن الاستجابة عند تشغيل ساعة الإيقاف وإيقافها، وخطأ اختلاف المنظر عند تحديد مرور الكرة بالعلامة", 2]], "o": ["يصف قوة مقاومة المائع والعوامل المؤثرة فيها (السرعة، المساحة، الشكل، كثافة المائع).", "يفسّر تناقص تسارع جسم يسقط في مائع حتى يصل إلى السرعة الحدّية.", "يحلّل منحنى (السرعة المتّجهة–الزمن) لجسم يسقط في مائع.", "يقترح تصميمًا لتقليل مقاومة الهواء لسيارة أو دراجة."]}, {"t": "قوى التلامس العمودية والطفو", "u": "", "q": [["ما اتّجاه قوة التلامس العمودية؟", "عمودي على سطح التلامس", 0], ["قراءة الميزان لكتلة في الهواء ⁦8.0 N⁩ وفي الماء ⁦5.0 N⁩. احسب قوة الطفو.", "⁦8.0 − 5.0 = 3.0 N⁩", 1], ["فسّر نشوء قوة الطفو على جسم مغمور.", "ضغط المائع يزداد مع العمق، فيكون الضغط على السطح السفلي أكبر منه على العلوي، فتنشأ قوة محصّلة إلى أعلى", 2], ["متى تتساوى قوة التلامس العمودية مع وزن جسم؟", "عندما يكون الجسم ساكنًا على سطح أفقي ولا تؤثر عليه قوى رأسية أخرى", 0], ["قارب يطفو ساكنًا وزنه ⁦12 000 N⁩. ما مقدار قوة الطفو عليه؟", "⁦12 000 N⁩", 1], ["لماذا يطفو قارب فولاذي بينما تغوص قطعة فولاذ صغيرة؟", "لأن شكل القارب المجوّف يُزيح حجمًا كبيرًا من الماء، فتصبح قوة الطفو مساوية لوزنه، أما القطعة المصمتة فتُزيح ماءً قليلًا فيكون الطفو أقل من وزنها", 2]], "o": ["يصف قوة التلامس العمودية بأنها قوة عمودية على السطح تنشأ عند تلامس جسمين.", "يفسّر قوة الطفو بفرق ضغط المائع على السطحين العلوي والسفلي للجسم المغمور.", "يحسب القوة المحصّلة على جسم مغمور أو طافٍ.", "يفسّر طفو القارب الفولاذي رغم أن كثافة الفولاذ أكبر من كثافة الماء."]}, {"t": "قانون نيوتن الثالث للحركة", "u": "", "q": [["اذكر نص قانون نيوتن الثالث للحركة.", "عندما يتأثر جسمان أحدهما بالآخر، فإن القوتين اللتين يؤثر بهما كل منهما على الآخر متساويتان مقدارًا ومتعاكستان اتّجاهًا", 0], ["ما القوة المقابلة لقوة جذب الأرض لتفاحة (وزنها)؟", "قوة جذب التفاحة للأرض إلى أعلى، ومقدارها مساوٍ للوزن", 1], ["فسّر حركة البالون عند خروج الهواء منه.", "يدفع البالون الهواء إلى الخلف، فيدفع الهواء البالون بقوة مساوية إلى الأمام", 2], ["هل تؤثر قوتا زوج القانون الثالث على الجسم نفسه؟", "لا؛ تؤثران على جسمين مختلفين", 0], ["شخص يدفع حائطًا بقوة ⁦50 N⁩. ما القوة التي يؤثر بها الحائط على الشخص؟", "⁦50 N⁩ باتّجاه معاكس", 1], ["اصطدمت سيارة صغيرة بشاحنة كبيرة. قارن بين القوتين المتبادلتين وبين تسارعيهما.", "القوتان متساويتان مقدارًا (القانون الثالث)، لكن تسارع السيارة أكبر لأن كتلتها أصغر (⁦a = F ÷ m⁩)", 2], ["هل الوزن وقوة التلامس العمودية على كتاب ساكن زوجا قانون نيوتن الثالث؟", "لا؛ فهما على الجسم نفسه ومن نوعين مختلفين، وهما قوتان متّزنتان", 0], ["ما القوة المقابلة (في القانون الثالث) لقوة التلامس التي تؤثر بها الطاولة على الكتاب؟", "قوة التلامس التي يؤثر بها الكتاب على الطاولة إلى أسفل", 1], ["اذكر خاصيتين تميّزان زوج القانون الثالث عن القوتين المتّزنتين.", "زوج القانون الثالث يؤثر على جسمين مختلفين ومن النوع نفسه، أما المتّزنتان فعلى الجسم نفسه وقد تكونان من نوعين مختلفين", 0], ["شخص يقف ساكنًا على أرض. سمِّ زوج القانون الثالث للوزن.", "قوة جذب الشخص للأرض إلى أعلى", 1], ["رجل في مصعد يتسارع إلى أعلى. أيهما أكبر: قوة التلامس من الأرضية على الرجل أم وزنه؟ وهل يخالف ذلك القانون الثالث؟", "قوة التلامس أكبر لأن المحصّلة إلى أعلى؛ ولا يخالف القانون الثالث، لأن الوزن والتلامس ليسا زوجًا؛ قرين التلامس هو قوة الرجل على الأرضية وتساويه", 2]], "o": ["يذكر نص قانون نيوتن الثالث للحركة.", "يحدّد زوج القوى في القانون الثالث في مواقف مختلفة.", "يصف خصائص زوج القوى: متساويتان مقدارًا، متعاكستان اتّجاهًا، من النوع نفسه، تؤثران على جسمين مختلفين.", "يفسّر حركة بالون ينطلق منه الهواء أو صاروخ باستخدام القانون الثالث."]}, {"t": "الوحدات الأساسية والنيوتن", "u": "", "q": [["عبّر عن النيوتن بالوحدات الأساسية.", "⁦kg m s⁻²⁩", 0], ["تحقّق من تجانس المعادلة ⁦v² = u² + 2as⁩.", "الطرف الأيسر ⁦m² s⁻²⁩، و⁦2as⁩ وحدتها ⁦(m s⁻²)(m) = m² s⁻²⁩؛ متجانسة", 1], ["هل المعادلة ⁦s = ut² + at⁩ متجانسة؟", "لا؛ ⁦ut²⁩ وحدتها ⁦m s⁩ و⁦at⁩ وحدتها ⁦m s⁻¹⁩، ولا تساويان ⁦m⁩", 2], ["ما المقصود بالمعادلة المتجانسة؟", "معادلة لها الوحدات الأساسية نفسها في كل حدّ من طرفيها", 0], ["المعادلة ⁦s = 2ut⁩ متجانسة. هل هي صحيحة بالضرورة؟", "لا؛ التجانس شرط لازم غير كافٍ، فالمعامل ⁦2⁩ خاطئ هنا", 1], ["في المعادلة ⁦F = kv²⁩ (قوة مقاومة الهواء)، استنتج وحدة ⁦k⁩ بالوحدات الأساسية.", "⁦k = F ÷ v² = kg m s⁻² ÷ m² s⁻² = kg m⁻¹⁩", 2]], "o": ["يعبّر عن النيوتن بالوحدات الأساسية kg m s⁻².", "يعرّف المعادلة المتجانسة ويتحقّق من تجانس معادلات فيزيائية باستخدام الوحدات الأساسية.", "يدرك أن التجانس شرط لازم غير كافٍ لصحة المعادلة.", "يستنتج وحدة ثابت مجهول في معا 0 ≈ 61 − 40 = 21 N⁩", 2], ["ما مقدار المركّبة الرأسية لقوة أفقية؟", "صفر", 0], ["قوة ⁦100 N⁩ بزاوية ⁦60°⁩ مع الأفقي. احسب مركّبتها الأفقية.", "⁦100 cos 60° = 50 N⁩", 1], ["فسّر لماذا يكون سحب حقيبة بحبل مائل إلى أعلى أسهل من دفعها بزاوية إلى أسفل.", "عند السحب إلى أعلى تقلّل المركّبة الرأسية قوة التلامس العمودية فيقلّ الاحتكاك، أما الدفع إلى أسفل فيزيد التلامس العمودي والاحتكاك", 2], ["ما مركّبة الوزن الموازية لمستوى مائل بزاوية ⁦θ⁩؟", "⁦mg sin θ⁩", 0], ["صندوق كتلته ⁦10 kg⁩ على منحدر أملس ميله ⁦30°⁩. احسب مركّبة وزنه الموازية للمنحدر.", "⁦10 × 9.81 × sin 30° ≈ 49 N⁩", 1], ["احسب تسارع الصندوق السابق إلى أسفل المنحدر.", "⁦a = g sin 30° ≈ 4.9 m s⁻²⁩", 2], ["ما مقدار قوة التلامس العمودية على جسم ساكن على منحدر أملس ميله ⁦θ⁩ (بإهمال القوى الأخرى العمودية)؟", "⁦mg cos θ⁩", 0], ["لماذا لا تعتمد قيمة ⁦a = g sin θ⁩ على كتلة الجسم؟", "لأن القوة الموازية ⁦mg sin θ⁩ تتناسب مع الكتلة، فتُلغى الكتلة عند القسمة عليها", 1], ["طفل كتلته ⁦40 kg⁩ على زلّاقة ميلها ⁦25°⁩ وتؤثر عليه قوة احتكاك ⁦100 N⁩. احسب تسارعه.", "القوة الموازية ⁦40 × 9.81 × sin 25° ≈ 166 N⁩، والمحصّلة ⁦≈66 N⁩، و⁦a ≈ 1.7 m s⁻²⁩", 2]], "o": ["يحلّل قوة إلى مركّبتين متعامدتين F cos θ وF sin θ.", "يحسب المحصّلة لعدة قوى بجمع مركّباتها الأفقية والرأسية.", "يحدّد الزاوية المناسبة لكل مركّبة بحسب موقعها في الرسم.", "يفسّر لماذا يكون سحب حقيبة بحبل مائل أسهل من دفعها."]}]};</script>
