<script>window.QZ={"g": "12", "gn": "الثاني عشر", "s": "english", "sn": "اللغة الإنجليزية", "L": [{"t": "Unit 1: A Fair Exchange (Reading)", "u": "Unit 1: A Fair Exchange (Reading)", "q": [["What does ‘therapy’ mean?", "The treatment of an illness or a disease over a long period", 0], ["Explain ‘retail therapy’ in your own words.", "It is a way to make yourself feel better by shopping", 1], ["Which ship carries oil: the dhow or the tanker?", "The tanker", 0], ["Which paragraph is about the Arabs as traders?", "Paragraph 2", 0], ["What is a topic sentence?", "The sentence that gives the main idea of a paragraph", 1], ["In which paragraph is the topic sentence not necessarily the first sentence? Explain what to do.", "Topic sentences are usually, but not always, first; read the whole paragraph for its main idea (in this text they are the first sentences)", 2], ["How many words may you write for each answer in Activity 1?", "No more than three words", 0], ["Which heading is best for the Farooq Al Sumar text?", "Heading c, because it relates to what the whole text is about", 1], ["Match: brand = ?", "The name given to a product by the company that makes it", 0], ["Complete: Short memorable phrases used by companies in advertisements are called ______ .", "slogans", 1], ["What is skimming used for?", "To get the gist (overall idea) of a text and see how its ideas are organised", 0], ["Why is d (Trading in Ancient and Modern Times) the best title?", "It covers the whole text; the other titles relate to only part of it", 1], ["Give an example of when skimming is useful.", "When looking through a newspaper to decide whether to read an article in detail, or when choosing useful articles for a project", 2], ["Find the word for ‘people who buy and sell goods’ in paragraph 1.", "merchants", 0], ["Complete: Frankincense was ______ to Greece, Italy and Egypt.", "exported", 1], ["Skim: which organisation deals with the rules of trade between countries?", "The World Trade Organisation (WTO)", 0], ["When did Oman become a member of the WTO?", "On 9 November 2000", 1], ["Why should you read the whole text before answering multiple-choice items?", "To get the gist; then it is easier to reject three answers and choose the correct one", 2]], "o": ["Infer the meaning of ‘retail therapy’ from a cartoon and four given choices", "Describe and compare photographs of a dhow and an oil tanker using the given phrases", "Skim a reading text quickly and choose the most appropriate title, justifying the choice", "Match four headings to paragraphs by identifying the topic sentence of each paragraph"]}, {"t": "Unit 2: What’s in a Name? (Grammar)", "u": "Unit 2: What’s in a Name? (Grammar)", "q": [["What does ‘logo’ mean?", "A small design that is the official symbol of a company or organisation", 0], ["Why did the Chevrolet Nova not sell well in Latin America?", "Because in Spanish ‘no va’ means ‘it doesn’t go’", 1], ["Would companies agree with Juliet? Give a reason.", "No; they spend a lot of money choosing the right brand name because customers use it to identify and trust a product", 2], ["How do we form the past simple passive?", "was/were + past participle", 0], ["Is ‘Adidas was taken from the name of its founder’ past simple or past simple passive?", "Past simple passive", 1], ["Why is the passive used in ‘Branding was not developed until the 19th century’?", "Because the action matters more than who did it / the doer is unknown or unimportant", 2], ["Write the past simple of ‘tear’.", "tore", 0], ["Change into the passive: People used branding in ancient times.", "Branding was used by people in ancient times", 1], ["Change into the passive: John S. Pemberton changed ‘Kola’ to ‘Cola’.", "‘Kola’ was changed to ‘Cola’ by John S. Pemberton", 2], ["Complete: The list ______ (publish) in 2013.", "was published", 0], ["Which tense: ‘Apple remained in first place’?", "Past simple (active)", 1], ["Why is ‘was founded’ used in ‘Apple was founded in 1976’?", "Because the focus is on the company and the completed past action, not on who founded it", 2], ["Make a question: ‘Levi Strauss was born in Germany.’ (Where)", "Where was Levi Strauss born?", 0], ["Make a past simple question about the miners.", "What did he make for the miners?", 1], ["Why do we use ‘did’ in some questions and ‘was’ in others?", "‘Did’ is used with active past simple verbs; ‘was/were’ is used with the passive", 2], ["What is Oman Air’s logo?", "A swirl of frankincense smoke", 0], ["Where does the name ‘Adidas’ come from?", "From the nickname ‘Adi’ of Adolf Dassler plus the first three letters of Dassler", 1], ["Why was frankincense chosen for the Oman Air logo?", "Because it is an important symbol of Oman’s traditional heritage and is still part of life in Oman today", 2], ["Write the past simple of ‘choose’.", "chose", 0], ["Complete: A new logo ______ (choose) by Oman Air.", "was chosen", 1], ["Find a negative past simple verb in the text.", "did not sell", 2], ["Give the past simple of ‘freeze’.", "froze", 0], ["Rewrite: Adolf Dassler founded Adidas.", "Adidas was founded by Adolf Dassler", 1], ["Explain why ‘by + agent’ may be omitted in some passive sentences.", "Because the agent is unknown, obvious or unimportant", 2], ["Put in the passive: They designed the iPhone in California.", "The iPhone was designed in California", 0], ["Fill in: The first iPad ______ (release) in 2010.", "was released", 1], ["Explain the difference between ‘Samsung entered the market’ and ‘The market was entered by Samsung’.", "The first emphasises Samsung (the doer); the second emphasises the market", 2], ["Complete: ______ was the famous brand design created? (asking about time)", "When", 0], ["Explain how to check that a question is grammatically correct.", "Check the auxiliary (did/was/were), the order (question word + auxiliary + subject) and the verb form", 2]], "o": ["Interpret Juliet’s quotation and give an opinion about brand names", "Answer comprehension questions about a text on branding and record new vocabulary", "Match example sentences to the uses of the past simple passive in the Grammar Recall box", "Identify past simple and past simple passive verbs in a text and classify them in two columns"]}, {"t": "Unit 3: Shop Till You Drop (Vocabulary)", "u": "Unit 3: Shop Till You Drop (Vocabulary)", "q": [["What is a shopaholic?", "Someone who is a compulsive buyer and is addicted to shopping", 0], ["Which two jobs do Vanessa and Katy have?", "Vanessa is a corporate lawyer and Katy is an accountant", 1], ["What do you think the article will say about over-shopping? Give a reason.", "It will explain that over-shopping is a modern problem because the title and photograph suggest shopping that is out of control (answers may vary)", 2], ["How can the women afford to spend so much money?", "They have very good jobs: a corporate lawyer and an accountant", 0], ["Why doesn’t Katy feel bad about spending?", "She thinks she deserves a treat for working hard", 1], ["Is shopping a short-term or long-term solution to feeling bad? Explain.", "A short-term fix; in the long run it creates more problems than it solves, such as credit card debt", 2], ["Which verb goes with ‘a mistake’?", "make", 0], ["Which verb goes with ‘the washing-up’?", "do", 1], ["What helps you guess the meaning of an unknown word?", "The words that come before or after it (context)", 2], ["Who are the three speakers in the listening?", "The presenter, Dr Michael Thrift and the caller Susan Spender", 0], ["What is Dr Thrift’s job?", "He is a consumer psychologist", 2], ["Complete: A ______ is someone who is addicted to shopping.", "shopaholic", 0], ["Why does the writer say shopping is a problem for the women?", "They are compulsive buyers who cannot control how they spend money", 1], ["Name two reasons why people buy things they do not need.", "Clever marketing by companies; feeling in need of consolation (lonely or depressed)", 0], ["What can lack of financial self-restraint result in?", "Bankruptcy and even divorce", 1], ["Fill in: She ______ a promise to her mother.", "made", 0], ["Fill in: Please ______ me a favour.", "do", 1], ["Why must you learn collocations by heart?", "There are no rules about which words go with make and which with do", 2], ["Give a synonym for ‘enormous’.", "huge", 0], ["Explain how you can choose the correct word for a gap in a sentence.", "Decide the part of speech (noun, verb, adjective, adverb) of the missing word, then choose a word of that type", 1], ["What disorder does Dr Thrift say Susan suffers from?", "Compulsive Shopping Disorder (too much shopping)", 2]], "o": ["Predict the content of a magazine article from its title and photograph", "Skim an article to find the meaning of ‘shopaholic’", "Read the article in detail and answer comprehension questions", "Evaluate the reasons given for over-shopping and its long-term effects"]}, {"t": "Unit 4: Malls and Markets (Listening & Speaking)", "u": "Unit 4: Malls and Markets (Listening & Speaking)", "q": [["Why does predicting help with listening?", "Predicting the probable content and vocabulary makes the text easier to understand", 2], ["How many phrases in the list are not in the talk?", "Four (1, 5, 7, 11)", 0], ["How many phrases apply to both a mall and a market?", "Two (2 and 4)", 1], ["According to the guide, what do tourists love about souqs?", "The traditional market style, narrow passages with tiny shops and friendly shopkeepers", 2], ["Where does Tom like to shop?", "At the City Mall", 0], ["Which place does Carol prefer?", "The traditional souq in Muttrah", 1], ["Complete: I’m not a ______ of modern shopping malls.", "fan", 2], ["How do you ask for someone’s opinion?", "What do you think about…? / How about you?", 2], ["Complete: In a souq you can ______ (discuss price) with the shopkeeper.", "bargain", 0], ["Give one similarity between malls and markets.", "Both sell a great variety of things (answers may vary)", 1], ["Which place  grounds and buildings of a university", 0], ["How do new students feel about starting university?", "Excited but terrified; they also have many worries", 1], ["Who can new students ask for help?", "Other students, tutors (teachers) or student support services", 2], ["Below how many words per minute is close reading?", "Below 100 words per minute", 0], ["What is the formula for reading speed?", "Total number of words ÷ time taken in minutes", 1], ["Which type of reading uses the speed 250–400 wpm?", "Casual or informal reading (newspapers, magazines)", 2], ["Why must you answer the questions after reading, not during?", "Answering during reading distracts you from reading the text", 0], ["What accuracy should you aim for?", "75% accuracy", 1], ["Why is it useful to record your WPM and score?", "To compare with later readings and see if you are improving", 2], ["Match: prospects = ?", "Future chances of success", 0], ["Complete: A ______ is a qualification obtained after completing a university course.", "degree", 1], ["Why is title d the best title?", "It covers both the challenges of starting university and how to cope with them", 0], ["Why is title a (first year at university) wrong?", "The text is not about someone’s first year", 1], ["How can a faster reading speed help you?", "It helps with reading in English and in other subjects, with essays, research papers and exams", 2], ["Complete: She missed the ______ for her essay.", "deadline", 0], ["Name two problems new students may face.", "Getting lost and forgetting a deadline", 1], ["What advice does the text give about making friends?", "Join clubs and societies", 2], ["Calculate: 300 words in 2 minutes.", "150 wpm", 0], ["Which speed would you use to skim an article?", "Above 400 wpm", 1], ["Why do university students need to read fast?", "They have many reading assignments for essays, research papers and exams", 2], ["Calculate: 420 words in 3 minutes.", "140 wpm", 0], ["Explain why speed without understanding is not enough.", "Because the aim is to read as fast as possible while still understanding", 2]], "o": ["Discuss options after leaving school and describe a student’s feelings from a picture", "Match the Theme 2 core words (transition, scary, apprehensive, prospects, degree, foreign, challenging, rewarding, confident, independent, culture) with their meanings", "Discuss challenges of starting university and tips for new students", "Skim a text to choose the best title and explain why other titles are rejected"]}, {"t": "Unit 2: Coping with Change (Grammar)", "u": "Unit 2: Coping with Change (Grammar)", "q": [["What problem does Faisal have with time?", "He leaves essays to the last minute and is late for class", 0], ["How does Abdullah help Faisal?", "He gives him a lift, tells him it is normal to find university strange and invites him to dinner", 1], ["What two things is Faisal finding challenging apart from studying?", "Cooking and washing his clothes (looking after himself)", 2], ["How do we form the past perfect?", "had + past participle", 0], ["Which event happened first in ‘I’d never lived away from home before I started university’?", "Not living away from home (the earlier event)", 1], ["Which words are often followed by the past perfect for regret?", "wish and if only", 2], ["What had Sara expected?", "A huge number of students (and teachers from many nationalities)", 0], ["Which statement shows the past perfect: ‘I’d expected the campus to be large’?", "Yes, ‘I’d expected’ is past perfect", 1], ["What is Zaher’s favourite activity?", "Volleyball/the gym", 2], ["Report: ‘I forgot my keys,’ he said.", "He said he had forgotten his keys", 0], ["Why do verbs move back a tense in reported speech?", "Because the reporting verb is in the past", 2], ["Name one thing students have to learn at university besides studying.", "To manage their time and live independently", 0], ["Why is it useful to learn from older students?", "They can give advice and support from
