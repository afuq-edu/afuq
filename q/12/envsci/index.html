<script>window.QZ={"g": "12", "gn": "الثاني عشر", "s": "envsci", "sn": "العلوم البيئية", "L": [{"t": "التركيب العام للخلية", "u": "الوحدة الأولى: فسيولوجيا الكائنات الحية البحرية", "q": [["ما وظيفة النوية؟", "النوية مناطق دائرية صغيرة داخل النواة تُبنى (تُنتج) فيها الرايبوسومات", 0], ["خلية في مبيض سمكة تفرز هرمون الإستروجين. أي نوعي الشبكة الإندوبلازمية تتوقع أن يكثر فيها؟ ولماذا؟", "الشبكة الإندوبلازمية الناعمة؛ لأن وظيفتها الرئيسية بناء الهرمونات الستيرويدية ومنها الإستروجين، وهي توجد بكميات كبيرة في خلايا المبيضين والخصيتين", 1], ["لماذا تبدو الشبكة الإندوبلازمية الخشنة خشنة في الصور المجهرية الإلكترونية؟ ولماذا لا يمكن رؤيتها والرايبوسومات بالمجهر الضوئي؟", "لوجود العديد من الرايبوسومات على سطحها؛ وهذه التراكيب صغيرة جدًا بحيث لا يمكن رؤيتها بالمجهر الضوئي، وإنما تُرى بالمجهر الإلكتروني", 2], ["سمِّ العضيات والتراكيب التي توجد في الخلايا النباتية ولا توجد في الخلايا الحيوانية.", "البلاستيدات الخضراء، وجدران الخلية (السليلوزية)، والفجوات الدائمة الكبيرة", 0], ["صُوّرت نواة بالمجهر الإلكتروني فظهرت فيها مناطق داكنة وأخرى أفتح. فسّر هذا الاختلاف.", "المناطق الداكنة يكون فيها الكروماتين أكثر تكثفًا، والمناطق الأفتح يكون فيها الكروماتين أقل تكثفًا (ص 22)", 1], ["ينثني غشاء سطح الخلية في خلايا بطانة الأمعاء الدقيقة مكونًا خملات دقيقة. ما فائدة ذلك للخلية؟", "تزيد الخملات الدقيقة مساحة السطح، فتسهل عملية الانتشار عبر الغشاء ويزداد امتصاص المواد", 2], ["أين تحدث المرحلة المعتمدة على الضوء من التمثيل الضوئي داخل البلاستيدة الخضراء؟", "في أغشية الثايلاكويد (المكدسة في الجرانا)، أما المرحلة غير المعتمدة على الضوء ففي الستروما", 0], ["تحتاج خلايا عضلات سمكة التونة سريعة السباحة إلى مقدار كبير من الطاقة. أي عضية تتوقع أن تكثر فيها؟ ولماذا؟", "الميتوكندريا؛ لأنها تنتج ATP عن طريق التنفس الهوائي، وكثرتها تشير إلى أن الخلية تتطلب الكثير من الطاقة", 1], ["أي العضيات الآتية مسؤولة عن إنتاج ATP عن طريق التنفس في الخلايا؟", "الميتوكندريون", 0, ["النواة", "جهاز جولجي", "الشبكة الإندوبلازمية (سؤال 1 نهاية الوحدة ص 57)"]], ["ما الأنواع الرئيسية الثلاثة من الجزيئات التي تتكون منها أغشية الخلايا؟", "الدهون المفسفرة، والبروتينات، والكوليسترول", 0], ["عرّف النقل النشط.", "حركة الجزيئات عبر الغشاء من منطقة ذات تركيز أقل إلى منطقة ذات تركيز أعلى (عكس منحدر التركيز)، ويتطلب تحرير الطاقة من ATP", 0], ["تعيش بعض الكائنات البحرية في مياه شديدة البرودة. ما دور الكوليسترول في أغشية خلاياها؟", "يوجد الكوليسترول بين ذيول الأحماض الدهنية، فيحافظ على سيولة الغشاء في درجات الحرارة المنخفضة", 1], ["اكتب صيغة حساب مقدار التكبير.", "مقدار التكبير = طول الصورة المشاهدة ÷ الطول الحقيقي (M = I ÷ A)", 0], ["حوّل 250 mm و270 nm إلى المتر (المثال 1-1).", "250 mm = 0.25 m؛ 270 nm = 0.00000027 m", 1], ["كم ميكرومترًا يساوي المليمتر الواحد؟", "1 mm = 1000 μm", 0], ["ميتوكندريون طول صورته 70 mm وطوله الحقيقي 5 μm. احسب مقدار التكبير (النشاط 1-3 س1 ب).", "70 mm = 70000 μm؛ مقدار التكبير = 70000 ÷ 5 = ×14000", 1], ["ما الهدف من استخدام محلول اليود عند فحص بشرة البصل؟", "يصبغ محلول اليود الخلايا فتصبح النوى مرئية؛ وتكون الخلايا شفافة إذا لم تُصبغ", 0], ["فحص طالب خلايا البصل بعدسة عينية ×10 وعدسة شيئية ×40. ما مقدار التكبير الكلي الذي يكتبه بجوار رسمه؟", "مقدار التكبير الكلي = 40 × 10 = ×400", 1], ["لماذا يجب التأكد من أن بشرة البصل وورقة النبات غير مطويتين أو ملتفتين؟", "إذا كانت العينة مطوية أو ملتفة يصبح المقطع سميكًا جدًا فلا يمر الضوء من خلاله، ويستحيل التركيز على طبقة واحدة فتكون الصورة غير واضحة", 2]], "o": ["يعرّف الخلية والعضية والسيتوبلازم، ويميّز بين الصورة المجهرية الضوئية والصورة المجهرية الإلكترونية", "(1-1) يسمي ويحدد غشاء سطح الخلية والنواة على الصور المجهرية والرسوم التخطيطية، ويذكر وظيفة كل منهما", "(1-1) يقارن بين الشبكة الإندوبلازمية الخشنة والشبكة الإندوبلازمية الناعمة من حيث المظهر والوظيفة", "(1-1) يذكر تركيب الرايبوسومات وأماكن وجودها في الخلية ووظيفتها في بناء البروتينات"]}, {"t": "حركة المواد", "u": "الوحدة الأولى: فسيولوجيا الكائنات الحية البحرية", "q": [["عرّف الانتشار.", "الحركة العشوائية للجزيئات من المنطقة ذات التركيز الأعلى إلى المنطقة ذات التركيز الأقل (مع منحدر التركيز)، وهو نقل سلبي لا يتطلب طاقة إضافية", 0], ["في الشكل 1-13 تركيز الجزيئات في المنطقة A أعلى منه في المنطقة B. حدد اتجاه محصلة الانتشار وفسر ذلك.", "من A إلى B؛ لأن الجزيئات تتحرك عشوائيًا وعددها في A أكبر، فاحتمال انتقالها من A إلى B أعلى من احتمال انتقالها من B إلى A، حتى يتساوى التركيز", 1], ["لماذا استغرقت رائحة العطر زمنًا أطول للوصول إلى الطلبة الأبعد عن مكان الرش؟", "لأن جزيئات العطر تنتقل بالانتشار، وكلما زادت المسافة التي يجب أن تقطعها الجزيئات استغرقت زمنًا أطول؛ فمسافة الانتشار من العوامل المؤثرة على معدله", 2], ["اذكر أربعة عوامل تؤثر على معدل انتشار الجزيئات من الخلايا وإليها.", "درجة الحرارة، منحدر التركيز، مسافة الانتشار، مساحة سطح التبادل", 0], ["لماذا يزداد معدل الانتشار بارتفاع درجة الحرارة؟", "لأن ارتفاع درجة الحرارة يزيد الطاقة الحركية للجزيئات فتتحرك بسرعة أكبر، فيكون الانتشار أسرع", 1], ["كيف تساعد الخملات الدقيقة في خلايا بطانة الأمعاء الدقيقة على سرعة الانتشار؟", "هي انثناءات في غشاء سطح الخلية تزيد مساحة السطح التي يحدث عبرها الانتشار، فيزداد معدل الانتشار", 2], ["ما نوعا البروتينات الناقلة التي يحدث عبرها الانتشار المسهل؟", "البروتينات القنوية والبروتينات الحاملة", 0], ["قناة أيون الصوديوم في الغشاء تسمح بمرور أيونات الصوديوم فقط. ما الخاصية التي يوضحها ذلك؟ ولماذا لا تعبر هذه الأيونات بالانتشار البسيط؟", "انتقائية البروتينات القنوية؛ ولا تعبر بالانتشار البسيط لأنها مشحونة ولا تستطيع اختراق ذيول الأحماض الدهنية الكارهة للماء في الدهون المفسفرة", 1], ["يستخدم كل من الانتشار المسهل والنقل النشط بروتينات الغشاء، فلماذا يحتاج النقل النشط وحده إلى الطاقة؟", "لأن النقل النشط ينقل المواد عكس منحدر التركيز (من التركيز الأقل إلى الأعلى)، أما الانتشار المسهل فيحدث مع منحدر التركيز", 2], ["ما مصدر الطاقة المستخدمة في النقل النشط؟", "الطاقة المتحررة من تحلل ATP إلى ADP وفوسفات، وهي تُستخدم لتغيير شكل البروتين الحامل (المضخة)", 0], ["لماذا تحتوي الخلايا التي تقوم بالنقل النشط عادة على الكثير من الميتوكندريا؟", "لأن النقل النشط يتطلب ATP، والميتوكندريا موقع التنفس الهوائي وإنتاج ATP؛ فالعملية لا تحدث إلا في الخلايا الحية التي تقوم بالتنفس الخلوي", 1], ["ما مقدار جهد الماء النقي؟ وماذا يحدث لجهد الماء عند إذابة الملح فيه؟", "0 kPa وهو أعلى جهد ماء ممكن؛ وإذابة الملح تخفض جهد الماء إلى قيم سالبة، وكلما زاد تركيز المذاب انخفض جهد الماء", 0], ["رتب ما يأتي تصاعديًا بحسب جهد الماء: ماء نقي، محلول كلوريد الصوديوم بتركيز 2 mol L⁻¹، بتركيز 1.5 mol L⁻¹، بتركيز 0.2 mol L⁻¹. (السؤال 4 ص 39)", "محلول 2 mol L⁻¹، ثم محلول 1.5 mol L⁻¹، ثم محلول 0.2 mol L⁻¹، ثم الماء النقي", 1], ["عرّف المحلول منخفض التركيز.", "محلول يحتوي على تركيز أقل من المواد المذابة مقارنة بمحلول آخر، ويكون جهد الماء فيه أعلى، فينتقل الماء منه إلى داخل الخلايا", 0], ["من جدول السؤال 5 (ص 39): قارن بين الانتشار والأسموزية من حيث المواد المنقولة والحاجة إلى غشاء.", "الانتشار: جزيئات صغيرة، ولا يحتاج إلى غشاء. الأسموزية: الماء فقط، وتحتاج إلى غشاء (منفذ انتقائيًا)؛ وكلاهما لا يحتاج إلى طاقة", 1], ["ما المقصود بضغط الامتلاء؟", "القوة داخل خلية نباتية التي تضغط غشاء الخلية باتجاه الجدار الخلوي، وتمنح النبات الدعامة والقوة ليظل قائمًا", 0], ["ماذا يحدث لخلايا الدم الحمراء إذا وُضعت في ماء مقطر؟ فسّر.", "تنتفخ ثم تنفجر؛ لأن جهد الماء خارجها أعلى من داخلها فيدخل الماء بالأسموزية، ولا يوجد جدار خلية يمنع انفجارها", 1], ["لماذا تُعد أنبوبة الديلسة نموذجًا لغشاء سطح الخلية؟", "لأنها منفذة انتقائيًا؛ تسمح للجزيئات الصغيرة مثل الماء بالمرور وتمنع الجزيئات الأكبر مثل السكروز", 0], ["نتائج الاستقصاء نوعية. اقترح طريقة لتعديله للحصول على تقدير كمّي لكمية الماء التي دخلت الأنبوبة. (س ز ص 43)", "قياس كتلة الأنبوبة ومحتواها قبل التجربة وبعدها، فالزيادة في الكتلة تمثل كتلة الماء الداخل؛ أو قياس ارتفاع عمود السائل في أنبوبة شعرية متصلة بالكيس", 1], ["حدد المتغير المستقل والمتغير التابع في هذا الاستقصاء. (س أ ص 46)", "المستقل: تركيز محلول السكروز / جهد الماء للمحاليل. التابع: كتلة قطع البطاطس", 0], ["قطعة بطاطس كتلتها الابتدائية 8.81 g وكتلتها النهائية 7.95 g. احسب النسبة المئوية للتغير في كتلتها، وماذا تستنتج عن المحلول؟", "(7.95 − 8.81) ÷ 8.81 × 100 = −9.76%؛ فقدت القطعة كتلة، فالمحلول عالي التركيز بالنسبة إلى خلايا البطاطس وخرج الماء منها بالأسموزية", 1], ["لماذا تُجفَّف قطع البطاطس برفق قبل وزنها؟ (س ح)", "لإزالة الماء عن سطحها الذي قد يزيد كتلتها، فهذا الماء لم يدخل الخلايا ولم يمر عن طريق الأسموزية", 0], ["لماذا تُغلق أنابيب الاختبار بالسدادات أثناء الاستقصاء؟ (س ط)", "لمنع تبخر الماء الذي قد يؤدي إلى زيادة تركيز المحاليل", 1], ["ما المقصود بالخلية المتبلزمة؟", "خلية نباتية فقدت الماء بالأسموزية فانكمش السيتوبلازم وانفصل غشاء سطح الخلية عن جدار الخلية", 0], ["خلايا حشائش البحر خلايا نباتية نموذجية. اشرح كيف يسهم تركيبها في منع تلفها عند وضعها في الماء النقي. (السؤال 10 أ-3 ص 61)", "سيدخل الماء إلى الخلية بالأسموزية، لكن جدار الخلية يعمل كدعامة تمنع انفجارها؛ لأنه مكوّن من العديد من ألياف السليلوز الملتفة حول الخلية", 2], ["عرّف الأسموزية. (السؤال 10 أ-1 ص 61)", "حركة الماء من جهد ماء أعلى إلى جهد ماء أقل عبر غشاء منفذ انتقائيًا", 0], ["ثلاث خلايا في ورقة نوع من حشائش البحر جهود الماء فيها −1200 kPa و−600 kPa و−800 kPa. حدد اتجاهات حركة الماء بالأسموزية بينها. (السؤال 10 أ-2)", "من −600 kPa إلى −1200 kPa، ومن −800 kPa إلى −1200 kPa، ومن −600 kPa إلى −800 kPa", 1]], "o": ["(1-7) يعرّف الانتشار بأنه محصلة الحركة العشوائية للجزيئات من المنطقة ذات التركيز الأعلى إلى المنطقة ذات التركيز الأقل، ويصفه بأنه نقل سلبي لا يتطلب طاقة إضافية", "يفسّر حدوث الانتشار بدلالة الطاقة الحركية للجزيئات ومنحدر التركيز، ويوضح أن محصلة الانتشار تصبح صفرًا عند تساوي التركيز دون أن تتوقف حركة الجزيئات", "يشرح أثر درجة الحرارة ومنحدر التركيز ومسافة الانتشار ومساحة سطح التبادل على معدل الانتشار", "يذكر أن المواد الصغيرة غير القطبية مثل الأكسجين وثاني أكسيد الكربون تنتشر عبر الطبقة الثنائية للدهون المفسفرة"]}, {"t": "تبادل الغازات", "u": "الوحدة الأولى: فسيولوجيا الكائنات الحية البحرية", "q": [["اذكر اسم الغاز المستخدم كمادة خام والغاز الناتج كناتج ثانوي في عملية التنفس الهوائي. (سؤال 5 أ نهاية الوحدة ص 58)", "الأكسجين مادة خام، وثاني أكسيد الكربون ناتج ثانوي", 0], ["اذكر سببين يجعلان تبادل الغازات في الماء يتطلب جهدًا وتأقلمات أكبر منه في الهواء.", "تركيز الأكسجين في الماء أقل بكثير منه في الهواء ويتغير بدرجة الحرارة والملوحة؛ والماء أكثر كثافة ولزوجة فيتطلب تحريكه عبر الجسم جهدًا أكبر", 1], ["اكتب معادلة حساب نسبة مساحة السطح إلى الحجم، وما علاقتها بمعدل الانتشار؟", "النسبة = مساحة السطح ÷ الحجم؛ كلما زادت النسبة زاد معدل الانتشار، وكلما قلت انخفض معدل الانتشار", 0], ["احسب نسبة مساحة السطح إلى الحجم لمكعب طول ضلعه 0.5 cm. (من جدول السؤال 9 ص 60)", "مساحة السطح = 6 × 0.5² = 1.5 cm²، الحجم = 0.5³ = 0.125 cm³، النسبة = 1.5 ÷ 0.125 = 12", 1], ["ماذا يحدث لنسبة مساحة السطح إلى الحجم عند زيادة طول ضلع المكعب؟ (الشكل 1-22)", "تتناقص؛ لأن الحجم يزداد بمعدل أكبر نسبيًا من مساحة السطح", 0], ["احسب نسبة مساحة السطح إلى الحجم لمكعبين طولا ضلعيهما 2 cm و5 cm، وقارن بينهما.", "المكعب 2 cm: 24 ÷ 8 = 3؛ المكعب 5 cm: 150 ÷ 125 = 1.2؛ المكعب الأصغر نسبته أكبر فمعدل الانتشار عبره أسرع", 1], ["ما لون كاشف الكريزول الأحمر في الوسط القلوي وفي الوسط الحمضي؟", "أحمر أرجواني في الوسط القلوي، وأصفر في الوسط الحمضي", 0], ["احسب مساحة السطح والحجم ونسبتهما لمكعب آجار أبعاده 2.5 × 5 × 5 mm.", "مساحة السطح = 2 × (2.5 × 5 + 2.5 × 5 + 5 × 5) = 100 mm²، الحجم = 62.5 mm³، النسبة = 100 ÷ 62.5 = 1.6", 1], ["اذكر متغيرين يجب ضبطهما في الاستقصاء 1-4.", "أي اثنين: حجم الحمض، تركيز الحمض، درجة الحرارة، تركيز الآجار، تركيز المادة القلوية داخل الآجار", 0], ["ما وظيفة الهيموجلوبين؟ وأين يتكون الأوكسيهيموجلوبين في السمكة؟", "بروتين في خلايا الدم الحمراء ينقل الأكسجين إلى جميع أنحاء الجسم؛ ويتكون الأوكسيهيموجلوبين في الخياشيم عند ارتباط الهيموجلوبين بالأكسجين", 0], ["رتّب مسار الدم في سمكة عظمية بدءًا من الخياشيم حتى يعود إليها.", "الخياشيم ← الشرايين ← الشعيرات الدموية في العضلات والأنسجة ← الأوردة ← القلب ← الشرايين ← الخياشيم", 1], ["تمتلك شقائق نعمان البحر لوامس كثيرة. فسّر فائدة ذلك لتبادل الغازات رغم عدم امتلاكها أعضاء متخصصة.", "اللوامس نتوءات بارزة من السطح تزيد مساحة السطح ونسبة مساحة السطح إلى الحجم، فيصبح الانتشار عبر سطح الجسم أسرع وكافيًا", 2], ["أين يحرر الدم الأكسجين ويكتسب ثاني أكسيد الكربون في جسم السمكة؟", "في الشعيرات الدموية الجسمية (في العضلات والأنسجة الأخرى)", 0], ["لماذا يحتاج سمك التونة إلى جهاز دوري عالي الكفاءة؟", "لأنه نشط جدًا ويحتاج إلى تنفس سريع في العضلات، فيُضخ الدم بسرعة إليها للحفاظ على معدل مرتفع من تدفق الدم يوصل الأكسجين ويزيل ثاني أكسيد الكربون", 2], ["صنّف سمات الخياشيم الآتية بحسب العامل الذي تحسّنه: كثرة الخيوط والصفائح، رقة الصفائح، شبكة الشعيرات الكثيفة وتدفق الدم، التيار المتعاكس.", "مساحة السطح: كثرة الخيوط والصفائح؛ مسافة الانتشار: رقة الصفائح وقرب خلايا الدم من الماء؛ منحدر التركيز: تدفق الدم في الشعيرات والتيار المتعاكس", 1], ["عرّف الصفائح الخيشومية.", "تفرعات إضافية من الخيوط الخيشومية تزيد من مساحة سطح الخياشيم، وتُسمّى أحيانًا الصفائح الثانوية", 0], ["لو تدفق الدم والماء في الاتجاه نفسه في خياشيم سمكة، ماذا يحدث لكفاءة تبادل الغازات؟ ولماذا؟", "تقل؛ لأن منحدر الانتشار يستمر حتى نقطة الاتزان فقط حيث يتساوى تركيز الأكسجين في الدم والماء، فلا يحدث صافي انتشار للأكسجين في بقية طول الخيشوم", 2], ["متى تحدث كل من التهوية بالاندفاع والتهوية بالضخ؟ (الجدول 1-2)", "التهوية بالاندفاع تحدث فقط أثناء السباحة؛ والتهوية بالضخ يمكن أن تحدث أثناء السباحة والراحة", 0], ["ماذا يحدث للضغط داخل تجويف الفم عند زيادة حجمه؟ وما أثر ذلك على حركة الماء؟", "ينخفض الضغط فيجري الماء إلى تجويف الفم مع منحدر الضغط، ويُغلق الغطاء الخيشومي لمنع تدفق الماء مرة أخرى", 1], ["لماذا تكون الأقواس الخيشومية مدمجة في أسماك التونة؟", "لمنع تلف التراكيب الدقيقة للخياشيم بفعل التدفق السريع للماء الناتج من السباحة بسرعة كبيرة", 0], ["ما وظيفة الحلقات الغضروفية في القصبة الهوائية؟", "تحافظ على بقاء مجرى الهواء مفتوحًا", 0], ["اذكر احتياطين للأمان والسلامة عند التعامل مع العينات البيولوجية الطازجة كالرئتين والأسماك. (التمهيد للاستقصاء ب، كتاب التجارب ص 64)", "ارتداء القفازات خصوصًا عند وجود جروح أو تشققات في الجلد، وغسل اليدين جيدًا بعد الانتهاء (ويقبل: الحذر من الشفرات الحادة، مسح جميع الأسطح)", 1], ["كيف يساعد التركيب المجهري للخياشيم في زيادة معدل الانتشار لتبادل الغازات؟ (التحليل ح، كتاب التجارب ص 66)", "جدران الصفائح رقيقة (سماكة خلية واحدة) فتقل مسافة الانتشار، والشعيرات الدموية قريبة جدًا من سطح الصفائح، وكثرة الصفائح تزيد مساحة السطح", 2], ["صف مظهر الخيوط الخيشومية في التشريح وموضعها.", "تمتد بزاوية قائمة تقريبًا على الأقواس الخيشومية، وتبدو بمظهر ريشي أحمر", 0], ["ما السبات الصيفي؟ ولماذا تلجأ إليه الأسماك الرئوية الأفريقية؟", "حالة سكون يهبط فيها معدل التنفس الخلوي إلى مستوى منخفض جدًا، تلجأ إليها للنجاة من الظروف الحارة والجافة عندما توشك الأنهار على الجفاف", 0], ["اذكر طريقة تبادل الغازات لدى كل من: البوليب المرجاني، التونة، الهامور، السمك الرئوي الأسترالي.", "الانتشار عبر سطح الجسم؛ التهوية بالاندفاع؛ التهوية بالضخ؛ الخياشيم إضافة إلى رئة واحدة لتنفس الهواء", 0], ["اقترح كيف تمكّن الرئتان الأسماك الرئوية من البقاء على قيد الحياة في برك مائية صغيرة في الطقس الحار. (سؤال 2 دراسة الحالة 1-1)", "البرك الصغيرة تجف بسرعة بالتبخر، ودرجات الحرارة المرتفعة تقلل تركيز الأكسجين فيها، والرئتان تمكنان السمكة من استخلاص الأكسجين من الهواء", 1], ["في تجربة حوض السلمون، لماذا يُتوقع أن يتناقص تركيز الأكسجين أسرع لو رُفعت درجة حرارة الماء؟", "لأن ارتفاع درجة الحرارة يزيد معدل التنفس فيزيد معدل استهلاك الأكسجين، كما أن الماء الأدفأ يحوي أكسجينًا مذابًا أقل (الشكل 1-20)", 2]], "o": ["(1-10) يشرح لماذا تحتاج الكائنات الحية البحرية إلى تبادل الأكسجين وثاني أكسيد الكربون مع محيطها", "يميّز بين عملية التنفس الخلوي وعملية تبادل الغازات", "يفسّر أثر كل من درجة الحرارة ومنحدر التركيز ومسافة الانتشار ومساحة السطح على معدل تبادل الغازات", "يفسّر صعوبة تبادل الغازات في الماء مقارنة بالهواء، ويحلل الشكل 1-20 (أثر درجة الحرارة والملوحة على تركيز الأكسجين المذاب)"]}, {"t": "التنظيم الأسموزي", "u": "الوحدة الأولى: فسيولوجيا الكائنات الحية البحرية", "q": [["عرّف الأسموزية.", "محصلة حركة جزيئات الماء من منطقة ذات جهد ماء أعلى إلى منطقة ذات جهد ماء أقل عبر غشاء منفذ انتقائيًا", 0], ["مستعينًا بالجدول 1-4، حدّد اتجاه حركة الماء بالأسموزية لسمكة سلمون في مياه المحيط، وفسّر ذلك.", "يخرج الماء من جسم السمكة إلى مياه المحيط؛ لأن تركيز المواد الذائبة في مياه المحيط (3.5%) أعلى منه في سوائل جسمها (1.0%)، أي أن جهد ماء المحيط أقل", 1], ["وُضعت بيضة منزوعة القشرة في ماء مقطر فانتفخت. فسّر ذلك بدلالة جهد الماء.", "جهد الماء في الماء المقطر أعلى منه داخل البيضة (للبيضة جهد ماء أكثر سالبية)، فينتقل الماء إلى داخلها بالأسموزية عبر الغشاء فيزداد حجمها", 2], ["ما المقصود بالكائن واسع المدى الملحي؟ أعط مثالًا.", "كائن حي يمكنه تحمل مدى واسع من مستويات الملوحة، مثل السلمون", 0], ["أيهما له جهد ماء أعلى: مياه المحيط أم المياه العذبة؟ ولماذا؟ (الاستقصاء العملي 1-7، التمهيد ب)", "المياه العذبة؛ لأن تركيز المواد المذابة فيها أقل، وكلما زادت المواد المذابة أصبح جهد الماء أكثر سالبية", 1], ["ما المقصود بالكائنات المتوافقة أسموزيًا؟ أعط مثالًا.", "كائنات حية تكون ملوحة سوائل أجسامها الداخلية مساوية لملوحة الماء الخارجي، مثل بلح البحر", 0], ["صنّف كلًّا من بلح البحر والتونة من حيث التنظيم الأسموزي ومدى تحمل الملوحة.", "بلح البحر: متوافق أسموزيًا، واسع المدى الملحي. التونة: منظمة للأسموزية، ضيقة المدى الملحي", 1], ["أكمل: في أسماك المياه العذبة يتحرك الماء …… الجسم بالأسموزية، وتضخ الخياشيم أيونات الصوديوم والكلوريد …… ، وتنتج السمكة …… .", "إلى داخل؛ من الماء الخارجي إلى الدم وسوائل الجسم؛ كميات كبيرة من البول المخفف", 1], ["لماذا تحتاج الخلايا المتخصصة في خياشيم الأسماك البحرية إلى ATP؟", "لأنها تضخ أيونات الصوديوم والكلوريد إلى الماء الخارجي بعكس منحدر تركيزها بواسطة مضخات بروتينية (نقل نشط)، وهذه العملية تتطلب طاقة على شكل ATP", 2], ["قارن بين كمية البول وتركيزه في سمكة عظمية بحرية وسمكة مياه عذبة.", "السمكة البحرية تنتج كمية قليلة من البول المركز، وسمكة المياه العذبة تنتج كميات كبيرة من البول المخفف جدًا", 1], ["اذكر مثالين على أسماك منظمة للأسموزية واسعة المدى الملحي.", "السلمون والأنقليس", 0], ["ما الذي يمكّن السلمون من العيش في المياه العذبة والمياه المالحة؟", "قدرته على تغيير اتجاه مضخات الأيونات في خياشيمه تبعًا لملوحة الماء المحيط: يضخ الأملاح إلى الخارج في البحر وإلى الدم في المياه العذبة", 0], ["اكتب صيغة حساب النسبة المئوية للتغير في كتلة البيضة.", "النسبة المئوية للتغير = (القيمة النهائية − القيمة الابتدائية) ÷ القيمة الابتدائية × 100", 0], ["بيضة كتلتها الابتدائية 69.93 g أصبحت 74.69 g بعد غمرها في الماء المقطر. احسب النسبة المئوية للتغير في كتلتها.", "(74.69 − 69.93) ÷ 69.93 × 100 = 4.76 ÷ 69.93 × 100 ≈ +6.8%", 1], ["هل تشير نتائجك إلى أن بيض الدجاج متوافق أسموزيًا أم منظم للأسموزية؟ ولماذا؟ (سؤال ز ص 77)", "متوافق أسموزيًا؛ لأنه يكتسب كتلة في الماء منخفض الملوحة ويفقد كتلة في الماء عالي الملوحة، أي أن محتواه المائي يتغير مع تركيز الوسط ولا ينظمه", 2], ["ما النهران اللذان كانا يغذيان بحر آرال؟ ولماذا حُوّل مجراهما؟", "نهر أمو داريا ونهر سير داريا؛ حُوّل مجراهما لبناء شبكة ري ضخمة لري المنطقة الصحراوية لأغراض زراعية، وبخاصة إنتاج القطن والقمح", 0], ["بيضة كتلتها الابتدائية 73.38 g أصبحت 67.15 g في محلول كلوريد الصوديوم 20%. احسب النسبة المئوية للتغير وفسّر إشارتها.", "(67.15 − 73.38) ÷ 73.38 × 100 = −6.23 ÷ 73.38 × 100 ≈ −8.5%؛ الإشارة سالبة لأن البيضة فقدت ماءً بالأسموزية إلى المحلول ذي جهد الماء الأقل", 1], ["اذكر المقصود بكل من: متوافق أسموزيًا، ضيق المدى الملحي. (أسئلة نهاية الوحدة في كتاب التجارب س5 ب ص 83)", "متوافق أسموزيًا: كائن حي له ملوحة الماء الخارجي نفسها. ضيق المدى الملحي: كائن حي يمكنه العيش فقط في نطاق ضيق من الملوحة", 0], ["حدّد آلية تنظيم الأسموزية في سمك السلمون عندما يكون في البيئة البحرية. (س5 ج ص 83)", "شرب الماء؛ إخراج الأملاح (أيونات الصوديوم والكلوريد) بالنقل النشط بواسطة الخياشيم؛ تعيد الكلى امتصاص الماء وتفرز الأملاح؛ فيكون البول عالي التركيز", 1], ["اذكر اسم الغاز المستخدم كمادة خام والغاز الناتج كناتج ثانوي في عملية التنفس الهوائي. (السؤال 5 أ (1) ص 58)", "الأكسجين مادة خام؛ وثاني أكسيد الكربون ناتج ثانوي", 0], ["ثلاث خلايا متجاورة في ورقة حشائش بحر جهود الماء فيها: −1200 kPa و−800 kPa و−1100 kPa. حدّد اتجاه حركة الماء بالأسموزية بينها. (س3 أ (2) كتاب التجارب ص 80)", "من الخلية −800 kPa إلى الخليتين −1100 kPa و−1200 kPa، ومن الخلية −1100 kPa إلى الخلية −1200 kPa (من جهد الماء الأعلى إلى الأقل)", 1]], "o": ["(1-15) يشرح سبب حاجة الكائنات الحية البحرية إلى تنظيم محتواها المائي والأيوني، مع الإشارة إلى التركيز النسبي للأيونات في مياه البحر وسوائل الجسم", "يعرّف الأسموزية بدلالة جهد الماء، ويحدد اتجاه حركة الماء بين خلايا الكائن البحري والماء المحيط به", "يقارن بين تراكيز المواد الذائبة في سوائل جسم السلمون ومياه المحيط والمياه العذبة (الجدول 1-4)", "(1-17) يميّز بين الكائنات ضيقة المدى الملحي (Stenohaline) وواسعة المدى الملحي (Euryhaline)"]}, {"t": "التمثيل الضوئي", "u": "الوحدة الثانية: الطاقة في النظم البيئية البحرية", "q": [["ما العضية التي تقوم بعملية التمثيل الضوئي؟ وأين توجد الصبغات الضوئية فيها؟", "البلاستيدة الخضراء؛ توجد الصبغات في أغشية الثايلاكويدات، في المناطق المتراصة المسماة الجرانا", 0], ["وازن المعادلة: _CO₂ + _H₂O → C₆H₁₂O₆ + _O₂، واذكر شرطي حدوثها.", "6CO₂ + 6H₂O → C₆H₁₂O₆ + 6O₂؛ بوجود الضوء والكلوروفيل", 1], ["لماذا يُعد اتساع شبكة أغشية الثايلاكويدات مهمًا للبلاستيدة الخضراء؟", "لأنه يعرّض مساحة سطحية كبيرة من الأغشية الحاملة للصبغات للضوء، فيزداد امتصاص طاقة الضوء اللازمة للتمثيل الضوئي", 1], ["ما الصبغة الأساسية التي تستخدمها النباتات البحرية والطحالب في عملية التمثيل الضوئي؟", "كلوروفيل a", 0, ["كاروتينات.", "كلوروفيل b.", "زانثوفيل. (سؤال 1 نهاية الوحدة ص 85)"]], ["قطع المذيب 90 mm، وقطعت بقعة برتقالية مصفرة 85.5 mm. احسب قيمة Rf وحدد الصبغة.", "Rf = 85.5 ÷ 90 = 0.95؛ الصبغة كاروتين (الجدول 2-1)", 1], ["ما مدى أطوال موجات الضوء المرئي؟", "بين 380 nm و750 nm (ص 71)", 0], ["في الاستقصاء العملي 2-1، لماذا يجب الانتظار خمس دقائق قبل البدء بعدّ الفقاعات عند استخدام لون جديد؟ (س و، كتاب التجارب ص 102)", "للسماح باستقرار معدل التمثيل الضوئي عند الضوء الجديد (دليل المعلم ص 196)", 1], ["عرّف اختراق الضوء وشدة الضوء.", "اختراق الضوء: العمق الذي يمكن للضوء أن يخترق فيه مادة معيّنة. شدة الضوء: مقياس قوة الضوء أو سطوعه", 0], ["أيّ ألوان الضوء يخترق مياه المحيط إلى أكبر عمق؟ وأيها يُمتص أولًا؟", "الضوء الأزرق يصل إلى أكبر عمق (نحو 200 m كحد أقصى)، والضوء الأحمر يُمتص في أول 10 m تقريبًا", 0], ["اذكر المواد الثلاث التي تُستخرج من الأعشاب البحرية لصناعة الهلام والمستحلبات.", "الألجينات والآجار والكاراجينان (ص 75)", 0]], "o": ["(2-1) يذكر أن التمثيل الضوئي سلسلة من التفاعلات الكيميائية تستخدمها جميع المنتجات البحرية تقريبًا لتثبيت الكربون في مواد عضوية مثل الكربوهيدرات", "(2-2) يصف عملية التمثيل الضوئي باستخدام المعادلة الكيميائية اللفظية والمعادلة الرمزية الموزونة", "يصف تركيب البلاستيدة الخضراء (الثايلاكويدات والجرانا) ويربطه بامتصاص طاقة الضوء", "يقارن بين التمثيل الضوئي والتمثيل الكيميائي من حيث مصدر الطاقة ومكان حدوث كل منهما"]}, {"t , ["اكتب المعادلة الكيميائية الرمزية الموزونة للتنفس الهوائي.", "C₆H₁₂O₆ + 6O₂ → 6CO₂ + 6H₂O", 0], ["كم جزيئًا من ATP ينتج من جزيء واحد من الجلوكوز في التنفس اللاهوائي؟ وما ناتجه في عضلات الإنسان؟", "جزيئان فقط من ATP؛ وينتج اللاكتات", 0], ["ما نواتج التنفس اللاهوائي في النباتات والفطريات؟", "الإيثانول وثاني أكسيد الكربون", 0], ["أنهى عدّاء سباق 100 m لكن معدل تنفسه بقي مرتفعًا عدة دقائق؛ فسّر ذلك.", "لاستنشاق المزيد من الأكسجين وتفكيك اللاكتات الذي تكوّن في العضلات أثناء التنفس اللاهوائي (يُزال اللاكتات من الخلايا ويعاد تحويله إلى جلوكوز)", 1], ["أعط اسم مادة واحدة تُستخدم مصدرًا للطاقة في التمثيل الكيميائي، واذكر الجزيء العضوي الناتج من كل من التمثيل الضوئي والتمثيل الكيميائي. (س7 أ ص 89)", "كبريتيد الهيدروجين (أو الحديد أو الميثان أو الهيدروجين)؛ الجلوكوز", 0], ["اذكر عاملين كان يجب التحكم بهما في تجربة قياس استهلاك أسماك البلطي للأكسجين. (س6 أ ص 88)", "أي عاملين من: عمر السمكة أو كتلتها أو صحتها، تركيز الأكسجين الأولي، الطعام المقدم مسبقًا، مستوى الضوء، حجم الخزان، ملوحة الماء، حركة السمكة", 1], ["أكمل المعادلة الكيميائية الرمزية للتنفس الهوائي: C₆H₁₂O₆ + ...... → 6CO₂ + ...... (س8 أ ص 89)", "6O₂ ، 6H₂O", 0]], "o": ["(2-15) يذكر أن التنفس الهوائي هو العملية التي تستخدمها الكائنات الحية لإطلاق الطاقة التي تحتاج إليها على شكل ATP عندما يتوافر الأكسجين", "(2-16) يصف التنفس الهوائي باستخدام المعادلة الكيميائية اللفظية (جلوكوز + أكسجين ← ثاني أكسيد الكربون + ماء) والرمزية (C₆H₁₂O₆ + 6O₂ → 6CO₂ + 6H₂O)", "يوضح أن الطاقة المنطلقة من التنفس تُستخدم لإعادة تكوين ATP من ADP ومجموعة فوسفات، وأن التنفس الهوائي يحدث في الميتوكندريا", "يقارن بين معادلتي التمثيل الضوئي والتنفس الهوائي، ويحدد تأثير بعض العوامل في معدل كل منهما (النشاط 2-1 س1)"]}, {"t": "الترسيب الحمضي والضباب الدخاني الكيميائي الضوئي", "u": "الوحدة الثالثة: إدارة الغلاف الجوي", "q": [["عرّف الترسيب الحمضي.", "مزيج من ملوثات الهواء التي تترسب من الغلاف الجوي على شكل ترسيب حمضي رطب (pH < 5.6) أو ترسيب حمضي جاف", 0], ["صنّف ما يأتي إلى ترسيب حمضي رطب أو جاف: ضباب حمضي يغطي قمة جبل، غبار حمضي يستقر على سطح سيارة، برد حمضي، غازات حمضية تترسب على أوراق الأشجار.", "رطب: الضباب الحمضي والبرد الحمضي. جاف: الغبار الحمضي والغازات الحمضية المترسبة دون رطوبة", 1], ["ما الحمضان الرئيسيان في الترسيب الحمضي الرطب والجاف؟", "حمض الكبريتيك (H2SO4) وحمض النيتريك (HNO3)", 0], ["ما المادة التي تتكون عندما تتفاعل كربونات الكالسيوم في الحجر الجيري والرخام مع ثاني أكسيد الكبريت؟ وما أثرها على المباني؟", "الجبس، وهو مادة أكثر ليونة تسبب تقشر الصخر أو ذوبانه فتفقد المنحوتات شكلها ومعالمها", 0], ["ما القراءة السنوية لـ PM2.5 التي توصي بها منظمة الصحة العالمية للحصول على «هواء نظيف»؟ وما القراءة التي سجلها تقرير 2021م لسلطنة عُمان؟", "5 µg/m³ أو أقل؛ وسُجلت لسلطنة عُمان قراءة سنوية تبلغ 53.9 µg/m³", 0]], "o": ["(3-1) يعرّف الترسيب الحمضي بأنه مزيج من ملوثات الهواء التي تترسب من الغلاف الجوي على شكل ترسيب حمضي رطب (pH < 5.6) أو ترسيب حمضي جاف", "يميّز بين ملوثات الهواء الأولية وملوثات الهواء الثانوية بأمثلة من الكتاب", "(3-2) يصف نوعي الترسيب الحمضي: الرطب من خلال الثلج والمطر والبرد والضباب، والجاف من خلال الغبار والغازات", "(3-3) يلخص تكوّن حمض الكبريتيك من الكبريت الموجود في الوقود الأحفوري، وتكوّن حمض النيتريك من نيتروجين الغلاف الجوي بفعل الحرارة الناتجة من محركات المركبات"]}, {"t": "إدارة تلوث الهواء", "u": "الوحدة الثالثة: إدارة الغلاف الجوي", "q": [["عرّف الطاقة المتجددة، واذكر مصدرين لها.", "طاقة نظيفة تُولَّد باستغلال مصادر طبيعية تتجدد باستمرار بحيث يمكن استخدامها بشكل مستدام، مثل الرياح، والمياه، والمد والجزر، وضوء الشمس (أي مصدرين)", 0], ["اذكر ثلاثة منتجات منزلية تحتوي على مستويات عالية من المركبات العضوية المتطايرة (VOCs).", "أي ثلاثة: الطلاءات، مزيلات الطلاء، المذيبات، مواد حفظ الخشب، البخاخات الهوائية، المنظفات، المطهرات، الوقود", 0], ["ما الشركة العابرة للحدود (TNC)؟", "شركة لها مقر رئيسي في بلد واحد، والعديد من الفروع أو المكاتب في بلدان أخرى، وتعمل عبر الحدود الدولية", 0], ["لماذا لا تكفي التشريعات على المستوى المحلي لتقليل تأثير الترسيب الحمضي على الغابات في جمهورية التشيك؟ (كتاب التجارب، أسئلة نهاية الوحدة س2 د ص 128)", "لأن الانبعاثات مشكلة دولية ولا توجد حواجز في الغلاف الجوي، فتنقل الرياح الملوثات بين الدول المتجاورة؛ لذا تلزم اتفاقيات دولية وتعاون عالمي", 2]], "o": ["يذكر الخطوات العامة للسيطرة على تلوث الهواء (تحديد المصدر، ثم تقليل التلوث أو إزالته أو منع حدوثه)، ويفسّر حاجة إدارته إلى استراتيجيات محلية وإقليمية ووطنية ودولية", "(3-8) يصف تقليل استخدام الوقود الأحفوري واعتماد الطاقة المتجددة والمركبات الكهربائية بوصفها استراتيجية لإدارة تلوث الهواء (محطة عبري للطاقة الشمسية)", "يلخّص في فقرة كيف يسهم أحد عناصر المخطط الانسيابي «إدارة تلوث الهواء» في تقليل تلوث الهواء", "يقيّم محددات استراتيجية التحول إلى الطاقة النظيفة (طول مدة التنفيذ، والتأثير البيئي لتصنيع المركبات الجديدة والتخلص من القديمة وبناء محطات الطاقة المتجددة)"]}, {"t": "استنفاد الأوزون", "u": "الوحدة الثالثة: إدارة الغلاف الجوي", "q": [["ما الوحدة التي يقاس بها تركيز الأوزون؟ وما المقصود بثقب الأوزون؟", "وحدة دوبسون؛ وثقب الأوزون منطقة يكون فيها متوسط تركيز الأوزون أقل من 100 وحدة دوبسون", 0], ["سُجّل فوق منطقة ما 180 وحدة دوبسون، وفوق منطقة أخرى 85 وحدة دوبسون. صنّف كل منطقة مع التعليل.", "180 أقل من 220 وحدة دوبسون فهي منطقة استنفاد للأوزون لكنها ليست ثقبًا؛ و85 أقل من 100 وحدة دوبسون فهي ثقب في طبقة الأوزون", 1], ["أين يوجد معظم أوزون الغلاف الجوي؟ واذكر استخدامين سابقين لمركبات (CFCs).", "نحو 90% منه في الستراتوسفير؛ الثلاجات، المذيبات، عبوات الهباء المضغوط، العوامل الكيميائية لتشكيل الرغوة (أي اثنين)", 0], ["ما نوع الأشعة التي يمتصها الأوزون؟ واذكر تأثيرين لزيادتها على صحة الإنسان.", "الأشعة فوق البنفسجية (UV)؛ ومن تأثيراتها: سرطان الجلد، وتثبيط جهاز المناعة، والساد (إعتام عدسة العين) (أي اثنين)", 0], ["عرّف الدوامة القطبية.", "نظام من الهواء البارد جدًا وضغط منخفض دوّار واسع النطاق وطويل الأمد يقع فوق القطبين الشمالي والجنوبي، يضعف في الصيف ويقوى في الشتاء", 0], ["ما اسم الاتفاقية الدولية التي وُضعت لضمان الإدارة العالمية لمركبات (CFCs)؟ وما هدفها؟", "بروتوكول مونتريال (1987م)؛ هدفه تقليل استخدام (CFCs) عالميًا، وتقليل انبعاثاتها بنسبة 50% بحلول عام 2000م ثم التوقف التدريجي عنها", 0], ["أعط تأثيرين للضباب الدخاني الكيميائي الضوئي. (سؤال 6 ب ص 124)", "أي اثنين: تهيج الجهاز التنفسي وصعوبة التنفس، نوبات الربو، تهيج العين والتهابها، انخفاض إنتاجية المحاصيل، تدهور البلاستيك والمطاط", 0]], "o": ["(3-9) يذكر أن تركيز الأوزون يُقاس بوحدة دوبسون، وأن وحدة دوبسون تعادل طبقة من الأوزون النقي سمكها 0.01 mm عند درجة حرارة وضغط قياسيين", "(3-10) يعرّف ثقب الأوزون بأنه المنطقة التي يكون فيها متوسط تركيز الأوزون أقل من 100 وحدة دوبسون، ويميّزه من منطقة الاستنفاد (أقل من 220 وحدة دوبسون)", "(3-11) يلخّص كيفية حدوث استنفاد الأوزون: استقرار مركبات (CFCs) في التروبوسفير، وتفككها بالأشعة فوق البنفسجية في الستراتوسفير، وتفاعل ذرات الكلور مع الأوزون", "يفسّر استمرار ذرات الكلور في تدمير الأوزون، ولماذا يفوق معدل الاستنفاد معدل تجدد الأوزون الطبيعي"]}, {"t": "تغير المناخ", "u": "الوحدة الرابعة: إدارة تغير المناخ", "q": [["عرّف غازات الدفيئة، واذكر ثلاثة أمثلة شائعة منها.", "غازات موجودة في الغلاف الجوي تمتص الأشعة تحت الحمراء المنبعثة من سطح الأرض؛ مثل ثاني أكسيد الكربون (CO₂) وبخار الماء والميثان (CH₄)", 0], ["أي البدائل يمثل غاز الدفيئة الرئيسي المسؤول عن تغيّر المناخ الناجم عن النشاط البشري؟", "ثاني أكسيد الكربون (CO₂)", 0, ["الأكسجين (O₂)", "النيتروجين (N₂)", "الكلوروفلوروكربونات (CFCs). (سؤال 1 نهاية الوحدة ص 164)"]], ["اذكر مصدرين للميثان من الأنشطة البشرية غير إنتاج اللحوم. (أسئلة نهاية الوحدة س2 ج2، كتاب التجارب ص 160)", "زراعة الأرز في الحقول المغمورة، ومرادم النفايات (دليل المعلم ص 305)", 0], ["ما متوسط درجة حرارة سطح الأرض بوجود غازات الدفيئة؟ وكم يكون تقريبًا بدونها؟", "نحو 15°C بوجودها، ونحو −18°C بدونها، ولن تكون الأرض قادرة على استدامة الحياة لأن مخازن المياه ستبقى متجمدة (ص 134)", 0], ["كيف ستتغير درجة الحرارة داخل العلبة المغطاة بالكأس الكبيرة إذا أضيف إليها CO₂؟ اشرح. (س هـ، الاستقصاء العملي 4-1)", "سترتفع درجة الحرارة أكثر، لأن ثاني أكسيد الكربون غاز دفيئة يمتص الأشعة تحت الحمراء فيحتجز مزيدًا من الحرارة؛ وهذا يمثل تأثير الاحتباس الحراري المعزز", 2], ["أي كأس يحتوي على CO₂ الإضافي؟ وما تأثير ذلك على درجة الحرارة فيها؟ (س و)", "الكأس 2؛ ويظهر فيها ارتفاع أكبر في درجة الحرارة مقارنة بالكأس 1، لأن CO₂ الإضافي يحتجز مزيدًا من الحرارة (دليل المعلم ص 303)", 1], ["ما الغاز الناتج من تفاعل رقائق الرخام مع حمض الهيدروكلوريك؟ ولماذا؟", "ثاني أكسيد الكربون؛ لأن رقائق الرخام تحتوي على كربونات الكالسيوم التي تتفاعل مع الحمض لإنتاج فقاعات CO₂", 0], ["في البيانات النموذجية ارتفعت حرارة الكأس 1 من 38.9°C إلى 39.5°C، والكأس 2 من 39.0°C إلى 43.2°C بعد 600 ثانية. احسب الارتفاع في كل كأس والفرق بينهما.", "الكأس 1: 39.5 − 38.9 = 0.6°C؛ الكأس 2: 43.2 − 39.0 = 4.2°C؛ الفرق = 4.2 − 0.6 = 3.6°C لصالح الكأس التي أضيف إليها CO₂", 1], ["اذكر ثلاثة مصادر يستخدمها العلماء للحصول على بيانات عن المناخات الماضية.", "عيّنات لب الجليد، وحلقات الأشجار، والسجلات التاريخية (سجلات السفن والمزارعين ومذكرات المسافرين والصحف)", 0], ["استخدم الشكل في كتاب التجارب (ص 160) لوصف الاتجاه الذي تبيّنه بيانات تراكيز الميثان في الغلاف الجوي. (س2 أ)", "تركيز ثابت أو مستقر للميثان حتى نحو عام 1800 م، ثم زيادة سريعة بعد عام 1800 م (دليل المعلم ص 305)", 1], ["عرّف الإبلاغ الكاذب، واذكر عاملين أسهما فيه في موضوع تغيّر المناخ.", "تقديم معلومات خاطئة أو ملفقة أو متحيزة؛ وقد أسهم فيه التحيز والبيانات غير الموثوقة (ص 138)", 0], ["حاليًا يبلغ تركيز CO₂ في الغلاف الجوي نحو 400 ppm، وكان منذ نحو 150 000 سنة نحو 200 ppm. بناءً على فهمك، هل كانت درجة الحرارة آنذاك: (أ) أكثر دفئًا (ب) مماثلة (ج) أكثر برودة مقارنة باليوم؟ (اختبار غازات الدفيئة، دليل المعلم ص 259)", "أكثر برودة؛ لأن انخفاض تركيز غاز الدفيئة يعني احتجاز حرارة أقل", 1]], "o": ["يميّز بين مفهومي تغيّر المناخ والاحترار العالمي، ويوضح أن تغيّر المناخ أحد أعراض الاحترار العالمي", "يصف الاتجاه في متوسط درجات الحرارة العالمية وتراكيز (CO₂) في الغلاف الجوي من الشكل 4-1 ومن سجلات الأعوام الأشد حرارة", "يذكر غازات دفيئة أخرى (أكاسيد النيتروجين NOx، الأوزون O₃، الكلوروفلوروكربونات CFCs)، ويصحح المفهوم الخاطئ بأن استنفاد الأوزون هو سبب تغيّر المناخ", "يفسّر كيف تسهم العمارة المستدامة في تقليل انبعاثات غازات الدفيئة (أسئلة العلوم البيئية ضمن سياقها ص 130)"]}, {"t": "تأثيرات تغير المناخ", "u": "الوحدة الرابعة: إدارة تغير المناخ", "q": [["اذكر سببين لارتفاع مستوى سطح البحر مع تغير المناخ.", "انصهار الجليد على اليابسة والصفائح الجليدية ودخول مياهه إلى المحيطات، وتمدد مياه المحيطات عند ارتفاع درجة حرارتها", 0], ["اشرح كيف يمكن أن تتعرض منطقة واحدة للفيضانات والجفاف معًا بسبب تغير المناخ.", "يتغير نمط الهطول من حيث المدة والشدة، فيهطل المزيد من الأمطار في فترة زمنية أقصر (عواصف شديدة وفيضانات) تليها فترات أطول من الطقس الجاف والحار (جفاف)", 1], ["بكم درجة تقريبًا أصبحت الأرض أكثر حرارة مما كانت عليه قبل الثورة الصناعية؟", "بنحو 1.1°C", 0], ["عرّف ظاهرة الألبيدو.", "قدرة السطح على عكس الضوء", 0], ["عرّف الهجرة القسرية.", "الانتقال غير الطوعي لشخص أو أشخاص بعيدًا عن موطنهم أو منطقتهم الأصلية، وتشمل الأسباب الكوارث الطبيعية والحروب وانعدام الأمن الغذائي أو المائي", 0], ["فسّر كيف تهدد الفيضانات الأمن المائي مع أنها تزيد كمية المياه.", "تلوث الفيضانات مياه الشرب فتسبب أمراضًا مثل الكوليرا، ولا يمكن استهلاك المياه الملوثة لأنها تشكل خطرًا على الصحة، ما يفرض ضغوطًا على الأمن المائي", 2], ["اذكر ثلاثة أضرار تزداد في المناطق المعرضة لنظم العواصف الشديدة مع تغير المناخ.", "الفيضانات، والرياح الشديدة، وفقدان الأراضي، والأضرار التي تلحق بالممتلكات والبنية التحتية، وفقدان الأرواح (أي ثلاثة)", 0], ["ما الظروف المثالية لمعيشة معظم أنواع المرجان؟", "مياه مالحة صافية درجة حرارتها بين 23°C و29°C، ضمن المنطقة الضوئية التي يخترقها ضوء الشمس", 0], ["ما نوع العلاقة بين المرجان والحييونات الصفراء؟", "علاقة تبادلية؛ تقوم الحييونات الصفراء بالتمثيل الضوئي وتكسب المرجان ألوانه، ويعتمد الكائنان أحدهما على الآخر للبقاء", 0], ["لماذا يزداد تحمض مياه المحيطات مع زيادة (CO2) في الغلاف الجوي؟", "تمتص المحيطات (CO2) من الغلاف الجوي كجزء من دورة الكربون، فكلما زادت كميته في الغلاف الجوي امتصت المحيطات المزيد منه فتزداد حموضة مياهها", 1]], "o": ["(4-7) يصف تأثير تغير المناخ على درجات الحرارة (زيادة الأيام الحارة وموجات الحر)، مستشهدًا بارتفاع متوسط درجات الحرارة في سلطنة عُمان", "(4-7) يصف التغيرات في شدة الهطول وتكراره، ويفسّر كيف تتعرض المنطقة نفسها للفيضانات والجفاف", "(4-7) يفسّر سببي ارتفاع مستوى سطح البحر (انصهار الجليد على اليابسة وتمدد مياه المحيطات بالحرارة)، ويوضح أن الارتفاع لا يكون متساويًا في جميع أنحاء العالم", "(4-7) يشرح دور الحزام الناقل المحيطي في نقل الطاقة حول الأرض، ويصف أثر تغير درجات حرارة المحيطات والغلاف الجوي على التيارات والرياح"]}, {"t": "إدارة تغير المناخ", "u": "الوحدة الرابعة: إدارة تغير المناخ", "q": [["اقترح ثلاثة إجراءات فردية يمكن لأسرتك اتباعها للحد من استخدام الوقود الأحفوري.", "استخدام الأجهزة الموفرة للطاقة، عزل المنزل بشكل فعال، استخدام وسائل النقل العام أو مشاركة المركبات، المشي أو ركوب الدراجة حيثما أمكن (أي ثلاثة)", 1], ["اذكر مثالين على الوقود منخفض الكربون.", "الغاز الطبيعي، والوقود الحيوي (مثل الديزل الحيوي)", 0], ["ما الطرائق الرئيسية الثلاث لاحتجاز الكربون؟", "قبل الاحتراق، وبعد الاحتراق، والوقود المؤكسج", 0], ["احسب النسبة المئوية للتغير في ارتفاع مستوى سطح البحر المتنبأ به لجزر مارشال بين عامي 2030 و2090م عند الانبعاثات المرتفعة (من 16 cm إلى 72 cm).", "(72 − 16) ÷ 16 × 100 = 350%", 1], ["اذكر ثلاثة مقترحات لإدارة الإشعاع الشمسي تعمل داخل الغلاف الجوي أو خارجه.", "تعزيز الألبيدو بتبييض السحب البحرية، وحقن الهباء الستراتوسفيري، والعاكسات (المرايا) الفضائية", 0], ["من حلول إدارة الإشعاع الشمسي المقترحة تكوين طبقة من الفقاعات في الفضاء بين الأرض والشمس. اقترح كيف يمكن لها أن تواجه تغير المناخ. (س3 أ، كتاب التجارب ص 161)", "تعكس جزءًا من الإشعاع الشمسي الساقط قبل أن يصل إلى سطح الأرض أو يُحتجز في الغلاف الجوي، فتقل درجة حرارة سطح الأرض", 1], ["أي البدائل يمثل غاز الدفيئة الرئيسي المسؤول عن تغير المناخ الناجم عن النشاط البشري؟ (أ) الأكسجين (ب) النيتروجين (ج) ثاني أكسيد الكربون (د) الكلوروفلوروكربونات. (س1 ص 164)", "ثاني أكسيد الكربون (CO₂)", 0], ["اذكر غازين من غازات الدفيئة غير الميثان. (س2 د، كتاب التجارب ص 160)", "ثاني أكسيد الكربون (CO₂)، وبخار الماء", 0], ["يُعتقد أن لانبعاثات (CO₂) تأثيرًا إيجابيًا محتملًا على بعض المحاصيل. اشرح لماذا يُتوقع أن تزيد إنتاجيتها. (س6 ج ص 166)", "لأن ارتفاع مستويات CO₂ يزيد عملية التمثيل الضوئي، إذ إن CO₂ مادة متفاعلة وعامل محدد في التمثيل الضوئي", 1]], "o": ["(4-9) يوضح أن تقليل انبعاثات الكربون هو الإجراء الأساسي لمكافحة تغير المناخ (التخفيف)، ويصف طرائق الحد من استخدام الوقود الأحفوري على المستوى الفردي ومستوى الحكومات", "(4-9) يعرّف الوقود منخفض الكربون ويذكر أمثلة عليه، ويشرح أحد محدداته (تأثيره غير المباشر على استخدام الأراضي والتنوع البيولوجي)", "(4-9) يقارن بين انبعاثات ثاني أكسيد الكربون من الفحم وطاقة الرياح لإنتاج واحد كيلوواط/ساعة من الكهرباء، ويفسر أهمية التحول إلى مصادر الطاقة البديلة", "(4-9) يصف إجراءات تحديث سياسات النقل لخفض انبعاثات (CO₂): تحسين كفاءة الوقود، المحولات الحفازة، الوقود الحيوي المستدام، النقل العام، المركبات الكهربائية، رسوم الازدحام"]}]};</script>
