تى لا يتمركز فيها العدو ويصل شره إلى عُمان", 2], ["أكمل: قاد الشيخ ...... المعركة التي انتهت بتحرير جلفار.", "علي بن أحمد النزوي", 0], ["تتبع مسار حملة واحدة من حملات العمانيين ضد البرتغاليين، واذكر قائدها.", "من نزوى إلى صور ثم قريات بقيادة سلطان بن سيف وأبي العرب بن مانع، أو من لوى إلى صحار بقيادة حافظ بن سيف", 1], ["لماذا يُعد تحرير مسقط ومطرح عام 1650م حدثًا فاصلًا؟", "لأنهما آخر معاقل البرتغاليين في عُمان؛ فبتحريرهما طُهّرت البلاد منهم نهائيًا، وانتقل العمانيون إلى ملاحقتهم خارج عُمان", 2], ["متى حرر العمانيون ممباسا؟ وفي عهد من؟", "عام 1698م في عهد الإمام سيف بن سلطان الأول", 0], ["ما العوامل التي ساعدت العمانيين على ملاحقة البرتغاليين خارج عُمان؟", "ذيوع صيتهم بعد انتصاراتهم في طرد البرتغاليين، وتلبية نداءات الاستغاثة من المناطق المتضررة، وقوة أسطولهم البحري", 1], ["استنتج من قول المؤرخ كوبلاند مكانة الأسطول العماني في القرن الثامن عشر.", "أصبحت القوة البحرية العمانية تخشاها الأساطيل الإنجليزية والهولندية في المحيط الهندي؛ أي أن عُمان صارت قوة بحرية كبرى منافسة للقوى الأوروبية", 2], ["استمرت أسرة المزاريع تحكم ممباسا حتى نهاية دولة اليعاربة.", "صح", 0, 1], ["اذكر ثلاث مناطق خارج عُمان واجه فيها العمانيون البرتغاليين.", "ممباسا وزنجبار في شرقي إفريقيا، والمخا عند مدخل البحر الأحمر، وبومباي على ساحل الهند الغربي", 1], ["اذكر ثلاثة من التنظيمات الإدارية في عصر اليعاربة.", "الولاة، والقضاة، والوكلاء، والمستشارون", 0], ["ما دلالة قول الإمام سلطان بن سيف الثاني: «لإن أعاشني الله لأجعلن المسافر للحج يخرج من عُمان بلا زاد»؟", "يدل على الرخاء الاقتصادي وعموم الأمن وانتشار الخير، بحيث يجد المسافر ما يحتاجه دون أن يحمل زادًا", 2], ["أكمل: أُدرج فلج ...... في نزوى في قائمة اليونسكو للتراث العالمي عام 2006م.", "الخطمين", 0], ["انسب كل وظيفة إلى المؤسسة التي تقابلها اليوم: الوالي، وكيل بيت المال، القاضي.", "الوالي: الولاة التابعون لوزارة الداخلية، ووكيل بيت المال: وزارة المالية، والقاضي: المحاكم (السلطة القضائية)", 1], ["من وجهة نظرك، ما أهمية وجود نظام إداري في الدولة؟", "يحفظ وحدة البلاد واستقرارها، وينظم الأموال العامة والحقوق، ويحقق العدل، وييسر تقديم الخدمات ومتابعة شؤون الناس", 2], ["أين ظهر التعليم النظامي لأول مرة في عُمان؟ وفي عهد من؟", "في مدرسة جبرين في عهد الإمام بلعرب بن سلطان", 0], ["اذكر نموذجين من العمارة الحربية في عصر اليعاربة مع ذكر موقعيهما.", "حصن الحزم في الرستاق، وحصن بيت النعمان في بركاء، وحصن السنيسلة في صور، وقلعة نزوى", 1], ["بنى الإمام سلطان بن سيف الأول قلعة نزوى من الغنائم التي اكتسبها من انتصاره على البرتغاليين في معركة ديو.", "صح", 0, 1], ["انسب كل مؤلف إلى صاحبه: جواهر المنافع، ديوان الحبسي، قصص وأخبار جرت في عُمان.", "جواهر المنافع: الشيخ سليمان بن إبراهيم بن محمد العوفي، وديوان الحبسي: الشاعر راشد بن خميس الحبسي، وقصص وأخبار جرت في عُمان: الشيخ محمد بن عامر المعولي", 1]], "o": ["يوضح التحديات التي واجهها الإمام ناصر بن مرشد اليعربي في بداية حكمه.", "يتتبع مراحل حملات الإمام ناصر بن مرشد لتوحيد عُمان.", "يستخلص صفات الإمام ناصر بن مرشد من سيرته.", "يثمّن جهود العمانيين في تحقيق الوحدة الوطنية."]}, {"t": "عُمان في عصر البوسعيد... وحدة ومنجزات", "u": "الوحدة الأولى: عُمان... تاريخ وحضارة", "q": [["متى بدأ عصر البوسعيد في عُمان؟", "عام 1744م بتولي الإمام أحمد بن سعيد البوسعيدي", 0], ["ما المنصب الذي كان يشغله أحمد بن سعيد قبل توليه الإمامة؟ وما أبرز ما حققه بعد توليها؟", "كان واليًا على صحار في أواخر عصر الدولة اليعربية، ووحّد البلاد وطرد الفرس منها واتخذ الرستاق عاصمة له", 1], ["كيف ساعدت صفات الإمام أحمد بن سعيد على نجاحه في توحيد البلاد؟", "شجاعته وعلو همته مكّنتاه من مواجهة الفرس، وحنكته وذكاؤه وخبرته في التجارة أعانته على إدارة الموارد وكسب الناس وجمعهم", 2], ["أكمل: اتخذ الإمام أحمد بن سعيد مدينة ...... عاصمة له.", "الرستاق", 0], ["وُلد الإمام أحمد بن سعيد في ولاية أدم بمحافظة الداخلية وتوفي في الرستاق عام 1783م.", "صح", 1, 1], ["من الحاكم البوسعيدي الذي حرر البحرين من سيطرة الفرس؟", "السيد سلطان بن أحمد", 0], ["وضح دور الأسطول العماني في عهد الإمام أحمد بن سعيد.", "تأمين السواحل العمانية وطرد الفرس منها، وتحرير مدينة البصرة من الحصار الفارسي عام 1775م", 1], ["كيف أسهم الأسطول في عهد السيد سعيد بن سلطان في بناء الإمبراطورية العمانية؟", "ربط الشق الآسيوي بالشق الإفريقي من الإمبراطورية، فيسّر التنقل والتجارة والإدارة، وكان سببًا في قوة العلاقة بين عُمان والدول الأخرى", 2], ["يُعد السلطان سعيد بن تيمور أول حاكم عربي يزور الولايات المتحدة الأمريكية.", "صح", 0, 1], ["انسب الإنجاز إلى صاحبه: توحيد البلاد والمحافظة على استقرارها، وإقامة علاقة متوازنة بين عُمان والقوى الأوروبية المتنافسة.", "الإمام عزان بن قيس، والسلطان فيصل بن تركي", 1], ["استنتج العلاقة بين قوة الأسطول وقوة العلاقات الخارجية لعُمان في عصر البوسعيد.", "الأسطول القوي أمّن الطرق البحرية والتجارة ومنح عُمان نفوذًا من آسيا إلى إفريقيا، فحرصت الدول على التواصل معها وعقد الاتفاقيات", 2], ["متى انطلقت النهضة العمانية الحديثة؟", "في 23 يوليو 1970م", 0], ["لماذا تُعد قوات السلطان المسلحة وشرطة عُمان السلطانية من شواهد النهضة العمانية الحديثة؟", "لأنها حظيت باهتمام بالغ من خلال برامج التأهيل والتدريب الفني والأكاديمي لمنتسبيها، وتزويدها بالأسلحة والمعدات المتطورة التي تكفل الأمن والاستقرار", 1], ["استنتج دليلين من سرعة انتقال الحكم وسلاسته بعد وفاة السلطان قابوس بن سعيد.", "عراقة عُمان وتماسك شعبها وحكمة حكامها، ورسوخ دولة المؤسسات والقانون والالتزام بالنظام الأساسي للدولة", 2], ["أكمل: تولى السلطان هيثم بن طارق مقاليد الحكم في ...... يناير 2020م.", "11", 0], ["اذكر منصبين تولاهما السلطان هيثم بن طارق قبل توليه الحكم.", "وكيل الشؤون السياسية في وزارة الخارجية عام 1986م، ووزير التراث والثقافة (2002م–2020م)، ورئيس اللجنة الرئيسية لرؤية عُمان 2040", 1], ["استخلص قيمتين من رسالة السلطان قابوس إلى مجلس العائلة الحاكمة، وبيّن أهميتهما للمجتمع.", "وحدة الصف والكلمة وتجنب الفرقة والشقاق، والطاعة والأمانة في العسر واليسر؛ فهما تحفظان استقرار الدولة وتماسك المجتمع", 2], ["اذكر ثلاثة من التنظيمات التي تتبع السلطة التنفيذية في عهد الإمام أحمد بن سعيد.", "الولاة، وبيت المال، وجباة الضرائب، والشرطة، والحرس، والجيش، والأسطول", 0], ["علل: أصبحت زنجبار أكبر مصدّر للقرنفل في العالم.", "لأن السيد سعيد بن سلطان أدخل القرنفل إليها عام 1842م وراجت تجارته حتى أصبح من الموارد الرئيسية الممولة لخزينة الدولة", 1], ["استنتج سببين ساعدا التجار العمانيين على ممارسة الوساطة التجارية.", "موقع عُمان المتوسط بين الهند وفارس واليمن وشرقي إفريقيا، وقوة الأسطول وأمن الطرق البحرية مع وجود موانئ مزدهرة كمسقط وزنجبار", 2], ["أكمل: زارت ميناء زنجبار ...... سفينة تجارية أجنبية خلال الفترة (1832م–1834م).", "41", 0], ["كانت مطرح ومسقط وصور من أهم أحواض بناء السفن في عهد السيد سعيد بن سلطان.", "صح", 1, 1], ["قارن بين السلطة التشريعية في عهد الإمام أحمد بن سعيد وما يقابلها في سلطنة عُمان اليوم.", "كانت تتمثل في العلماء والوجهاء والأعيان، أما اليوم فيشارك مجلس عُمان بمجلسيه (الدولة والشورى) في المهام التشريعية وفق النظام الأساسي للدولة", 2], ["من بنى حصن المنصور؟ وأين يقع؟", "بناه الإمام سعيد بن أحمد، ويقع في الرستاق", 0], ["ما نوع الوقف الذي يوضحه الشكل (20)؟ وما معنى الوقف؟", "وقف تعليمي، والوقف حبس أصل المال وتسبيل منفعته (غلته) في وجوه الخير", 1], ["ظهر التعليم النظامي في المدرسة السلطانية الأولى في عهد السلطان تيمور بن فيصل.", "صح", 0, 1], ["استخرج من وثيقة وقف السيد فيصل بن حمود نظام العمل في مدرسة بيت القرن.", "تعليم القرآن العظيم والآداب والكتابة كل يوم صباحًا ورواحًا، والإجازة يوم الجمعة وأيام الأعياد وخمسة أيام قبلها", 1], ["كيف يمكن الاستفادة من الوقف في حياتنا المعاصرة؟ اذكر مثالين.", "يغرس التكافل والتعاون ويساند جهود الدولة، مثل وقف المدارس والمكتبات والمنح الدراسية، ووقف المساكن ورعاية الأيتام", 2], ["متى عقد السيد سعيد بن سلطان معاهدة مع الولايات المتحدة الأمريكية؟", "عام 1833م", 0], ["علام نصت اتفاقية السيد سلطان بن أحمد مع السير جون مالكولم عام 1800م؟", "على السماح لبريطانيا بتعيين وكيل سياسي لها في ميناء مسقط", 1], ["فسر حرص الدول الكبرى على توثيق علاقاتها مع عُمان.", "بسبب أهمية موقع عُمان الاستراتيجي على طرق التجارة البحرية، وقوة الأسطول العماني ونفوذه في الخليج العربي والمحيط الهندي", 2], ["أكمل: أُرسلت السفينة ...... إلى لندن عام 1842م تحمل هدايا السيد سعيد بن سلطان إلى الملكة.", "سلطانة", 0], ["اذكر مبدأين من مبادئ السياسة الخارجية العمانية في عهد السلطان قابوس بن سعيد.", "السلم والحوار، وعدم التدخل في شؤون الغير، وحل المشكلات بالطرق السلمية، والقيام بدور الوسيط", 1], ["كيف أكسبت سياسة السلام سلطنة عُمان مكانتها الدولية؟", "جعلت عُمان طرفًا موثوقًا ووسيطًا في حل الخلافات، فاكتسبت محبة العالم وأصبحت مرسى للسلام والأمان، وهو نهج يستمر في عهد السلطان هيثم بن طارق", 2]], "o": ["يوضح ظروف نشأة دولة البوسعيد وجهود مؤسسها الإمام أحمد بن سعيد.", "يستخلص صفات الإمام أحمد بن سعيد البوسعيدي من سيرته.", "يبحث في مصادر التعلم عن دور العلامة حبيب بن سالم أمبوسعيدي.", "يقدّر دور الحاكم العادل والعالم المخلص في حفظ أمن الدول."]}, {"t": "البيئة... قضية عالمية ويقظة وطنية", "u": "الوحدة الثانية: بيئتنا... تنوع وثراء واستدامة", "q": [["عرّف البيئة.", "الوسط أو المجال المكاني الذي تعيش فيه الكائنات الحية، تتأثر به وتؤثر فيه", 0], ["صنّف ما يأتي إلى بيئة طبيعية وبيئة مشيدة: المزرعة، الهواء، المباني، الماء.", "طبيعية: الهواء والماء، ومشيدة: المزرعة والمباني", 1], ["كيف تحولت علاقة الإنسان بالبيئة من إيجابية إلى سلبية؟", "كان يأخذ منها قدر حاجته دون الإضرار بمكوناتها، ومع تطور مجالات الحياة وتعدد متطلباته تعرضت البيئة للاستنزاف الذي أثّر في التنوع الأحيائي", 2], ["تتضمن البيئة المشيدة كل ما أنشأه الإنسان نتيجة تفاعله واستثماره لموارد بيئته الطبيعية.", "صح", 0, 1], ["وضح بمثال كيف يكون التفاعل بين البيئتين الطبيعية والمشيدة إيجابيًا، وكيف يكون سلبيًا.", "إيجابي: مزرعة تستخدم الري بالتنقيط فتحافظ على المياه، وسلبي: مصنع يلوث الهواء والمياه فتظهر مشكلات بيئية", 1], ["اقترح ثلاثة معايير لبيئة مستدامة تطمح للعيش فيها.", "هواء نقي ومياه نظيفة، ومساحات خضراء وتنوع أحيائي محمي، ومبانٍ ومواصلات صديقة للبيئة مع إدارة سليمة للنفايات", 2], ["ما المقصود بالتنوع الأحيائي؟", "تعدد أنواع الكائنات الحية وكثرتها وتباينها، سواء في النظم البيئية البرية أم المائية أم الجوية", 0], ["اذكر مثالًا على أهمية التنوع الأحيائي في كل من المجالين الطبي والزراعي.", "الطبي: بعض العقاقير من أصل نباتي أو حيواني، والزراعي: المكافحة الحيوية للآفات الزراعية", 1], ["أكمل: المكافحة الحيوية للآفات الزراعية مثال على أهمية التنوع الأحيائي في المجال ......", "الزراعي", 0], ["تعتمد بعض الصناعات على مواد خام حيوانية أو نباتية.", "صح", 1, 1], ["اذكر اتفاقيتين بيئيتين دوليتين صادقت عليهما سلطنة عُمان.", "اتفاقية التنوع الأحيائي، واتفاقية فيينا لحماية طبقة الأوزون", 0], ["ما دلالة إطلاق الدول المطلة على المحيط الهندي اسم سلطنة عُمان على برنامجها لحماية السلاحف البحرية عام 2006م؟", "تقدير دولي لمكانة سلطنة عُمان وجهودها الملموسة في العمل البيئي", 2], ["عقدت سلطنة عُمان المؤتمر البيئي «الحياة تحت الماء» في صلالة عام 2017م.", "صح", 0, 1], ["استنتج من خطاب السلطان قابوس في العيد الوطني الخامس عشر (1985م) توجيهين لحماية البيئة.", "بذل المزيد من الجهد ومراعاة اعتبارات حماية البيئة عند تخطيط المشاريع الإنمائية وتنفيذها، والمضي في تطوير الصلات مع المنظمات الإقليمية والدولية المعنية", 1], ["متى أعلن السلطان قابوس تخصيص جائزة للبيئة؟ وأين؟", "عام 1989م أثناء زيارته مقر اليونسكو", 0], ["إذا كانت الجائزة قد سُلّمت للمرة الثامنة عام 2005م وتُسلّم كل عامين، ففي أي عام سُلّمت للمرة الأولى؟ وضح طريقة الحساب.", "عام 1991م؛ لأن بين المرة الأولى والثامنة سبع دورات مدة كل منها عامان، أي 14 عامًا، وبطرحها من 2005 ينتج 1991", 2], ["صواب أم خطأ: تُمنح جائزة اليونسكو-السلطان قابوس لصون البيئة كل أربعة أعوام.", "خطأ؛ تُمنح كل عامين", 0], ["استخلص قيمتين بيئيتين من خطاب السلطان قابوس إلى المؤتمر العام لليونسكو عام 2005م.", "التوعية بقضايا البيئة، والتضامن الدولي لتخفيف حدة الأضرار الناشئة عن المخاطر الطبيعية", 1], ["كيف تسهم هذه الجائزة في حماية البيئة العالمية؟", "تحفز الأفراد والمؤسسات حول العالم على العمل البيئي والابتكار، وتبرز التجارب الناجحة ليُحتذى بها، وتعزز التعاون الدولي ومكانة عُمان في العمل البيئي", 2]], "o": ["يوضح مفهوم البيئة ومكوناتها الرئيسية.", "يصنف عناصر من الواقع إلى بيئة طبيعية وبيئة مشيدة.", "يستنتج أثر التفاعل الإيجابي والسلبي بين مكونات البيئة على استدامتها.", "يصف البيئة التي يطمح للعيش فيها مراعيًا شروط استدامتها."]}, {"t": "البيئة العُمانية... حماية واستدامة", "u": "الوحدة الثانية: بيئتنا... تنوع وثراء واستدامة", "q": [["اذكر عاملين من عوامل تنوع البيئات الطبيعية في سلطنة عُمان.", "تعدد مظاهر السطح كالجبال والسهول والواحات والهضاب، والموقع الجغرافي والفلكي وما ترتب عليه من سواحل طويلة وتنوع مناخي", 0], ["كيف أثر الموقع الفلكي لسلطنة عُمان على تنوع بيئاتها الطبيعية؟", "أسهم في تنوع المناخ (الصحراوي والموسمي ومناخ المرتفعات)، فتنوعت البيئات الطبيعية وما فيها من حياة فطرية", 1], ["وضح بمثال كيف اعتمد العمانيون على البيئة الطبيعية في إقامة بيئتهم المشيدة.", "في البيئة الساحلية امتهنوا الصيد وصناعة السفن، وفي الواحات الزراعة وشق الأفلاج، وفي الجبال أقاموا المدرجات الزراعية والبيوت الحجرية الملائمة للمناخ", 2], ["صواب أم خطأ: يقتصر سطح سلطنة عُمان على السهول الساحلية.", "خطأ؛ تتعدد مظاهره بين جبال وسهول وواحات وهضاب", 0], ["علل: يتميز المجتمع العماني بالثراء في مختلف مجالات الحياة.", "لاعتماد العمانيين على إمكانات بيئاتهم المتنوعة، مما أدى إلى تعدد المهن والحرف وتنوع أنماط الحياة والعادات والتقاليد", 1], ["قارن بين نمط الحياة في بيئة جبلية وبيئة ساحلية في سلطنة عُمان.", "الجبلية: زراعة المدرجات والرعي والمساكن الحجرية، والساحلية: صيد الأسماك والتجارة البحرية وصناعة السفن", 2], ["ما سبب التنوع الأحيائي الفريد في سلطنة عُمان؟", "اختلاف بيئاتها الطبيعية", 0], ["وضح الأهمية الاقتصادية للتنوع الأحيائي في سلطنة عُمان.", "أدى تنوع الثروات الطبيعية الحيوانية والمائية والنباتية إلى تعدد الأنشطة الاقتصادية المرتبطة بها كالصيد والزراعة والرعي والسياحة البيئية", 1], ["ما الأثر الاقتصادي المتوقع لتراجع التنوع الأحيائي في البيئة البحرية العمانية؟", "تراجع الثروة السمكية ودخل الصيادين والصادرات وفرص العمل، وضعف السياحة البحرية", 2], ["أكمل: أدى تنوع الثروات الطبيعية في سلطنة عُمان إلى تعدد ...... المرتبطة بها.", "الأنشطة الاقتصادية", 0], ["اقترح إجراءين يحققان الاستفادة الاقتصادية من التنوع الأحيائي دون الإضرار به.", "تنظيم مواسم الصيد ومنع الصيد الجائر، وتطوير سياحة بيئية منظمة بأعداد محددة من الزوار", 2], ["اذكر ثلاثة أمثلة لمواقع السياحة البيئية في سلطنة عُمان كما وردت في الكتاب.", "السواحل، والأخوار، والجزر، والكهوف", 0], ["كيف أسهم التنوع الأحيائي في امتلاك سلطنة عُمان مقومات السياحة البيئية؟", "بوجود مواقع ذات مناظر طبيعية جميلة وحياة فطرية متنوعة، مما جعلها وجهة لمحبي الطبيعة والمغامرات ومراقبة الحيوانات", 1], ["صواب أم خطأ: المحافظة على المواقع السياحية البيئية مسؤولية الحكومة وحدها.", "خطأ؛ هي مسؤولية مشتركة", 0], ["قيّم أثر السياحة البيئية على الاقتصاد المحلي والبيئة معًا.", "توفر فرص عمل ودخلًا للمجتمع المحلي وتشجع على حماية المواقع، وقد تضر بالبيئة إذا زاد عدد الزوار أو أُهملت النفايات؛ لذا يجب تنظيمها", 2], ["متى انطلقت الخطط التنموية الخمسية التي تضمنت مبدأ ربط التنمية بالمحافظة على البيئة؟", "عام 1975م", 0], ["استنتج من خطاب السلطان قابوس في قمة الأرض (1992م) ثلاث مشكلات بيئية ناجمة عن التعامل غير العقلاني مع البيئة.", "التلوث بأنواعه، ونقص المياه، وتدهور المراعي الطبيعية، والتصحر والجفاف", 1], ["لماذا يُعد التوازن بين متطلبات التنمية وحماية البيئة ضروريًا؟", "لأن التنمية دون مراعاة البيئة تستنزف الموارد وتلوثها فتتضرر الأجيال القادمة وتتراجع التنمية نفسها، والتوازن يحقق التنمية المستدامة", 2], ["نصت المادة (12) من النظام الأساسي للدولة على التزام سلطنة عُمان بالمحافظة على البيئة وحمايتها ومنع التلوث.", "صح", 0, 1], ["ما الإجراءات التي ينبغي اتخاذها لحماية البيئة كما يُفهم من خطاب السلطان قابوس في قمة الأرض؟", "الحد من التكاثر العشوائي، والمحافظة على ما تبقى من مراعٍ ومياه، والانتباه لمسببات التلوث والحد منها، والتعامل العقلاني مع البيئة", 1], ["متى صدر قانون «حماية البيئة ومكافحة التلوث»؟ وبأي مرسوم عُدّل؟", "صدر عام 1982م، وعُدّل بموجب المرسوم السلطاني رقم (114/2001)", 0], ["أين توجد محطات قياس جودة الهواء في سلطنة عُمان؟ اذكر مثالين.", "بالقرب من ميناء الفحل في محافظة مسقط، وفي صلالة بالقرب من منطقة ريسوت الصناعية، وفي ميناء صحار بمحافظة شمال الباطنة", 1], ["علل: تُفرض تصاريح بيئية لبعض المشاريع المنفذة في محافظات سلطنة عُمان.", "لأن بعض المشاريع قد يكون لها تأثير سلبي متوقع على البيئة، فالتصريح يضمن الالتزام بمعايير سلامة البيئة والمحافظة عليها", 2], ["ما الهدف من تصنيف المنطقة البحرية من رأس الحد إلى الحدود العمانية الجنوبية منطقة بحرية خاصة؟", "حماية البيئة البحرية العمانية من التلوث", 1], ["اقترح ثلاث ممارسات مدرسية تحقق ما يهدف إليه قانون حماية البيئة ومكافحة التلوث.", "فرز النفايات وإعادة تدويرها، وترشيد استهلاك المياه والكهرباء، والمحافظة على نظافة المدرسة ومنع حرق المخلفات", 2], ["متى أصبحت سلطنة عُمان أول دولة عربية تخصص وزارة معنية بالبيئة؟", "عام 1984م", 0], ["ما المقصود بالاقتصاد الأخضر؟", "منظومة اقتصادية تستهدف تحقيق التنمية مع المحافظة على البيئة، من خلال تطوير مشاريع إنتاجية تُعنى بالاستغلال الأمثل للموارد الطبيعية", 1], ["من وجهة نظرك، ما الإجراءات اللازمة لتحول سلطنة عُمان إلى الاقتصاد الأخضر؟", "التوسع في الطاقة الشمسية وطاقة الرياح، وإعادة تدوير المياه والمخلفات، وتشجيع العمارة الخضراء، ودعم البحوث والتقنيات الخضراء وربط العلم بالسياسات", 2], ["مبادرة «أشجار» من المبادرات البيئية التي تشرف عليها هيئة البيئة.", "صح", 0, 1], ["اذكر ثلاثة أنشطة تقوم بها المؤسسات الخاصة والأهلية لحماية البيئة العمانية.", "حملات تنظيف الشواطئ، والمسابقات، وحملات التوعية", 1]], "o": ["يفسر تنوع البيئات الطبيعية في سلطنة عُمان.", "يربط بين البيئة الطبيعية العمانية والبيئة المشيدة وأنماط حياة السكان.", "يحصر البيئات الطبيعية في محافظته ويوضح تأثيرها على نمط حياة السكان.", "يعتز بتنوع البيئة العمانية وتفردها."]}, {"t": "قضايا بيئية... تحديات عالمية وجهود وطنية", "u": "الوحدة الثانية: بيئتنا... تنوع وثراء واستدامة", "q": [["عرّف النفايات.", "مواد ليس لها قيمة للاحتفاظ بها، وقد تنتج عن العمليات الصناعية أو التعدينية أو الزراعية أو الحرفية أو عن المنازل أو المستشفيات أو المنشآت العامة", 0], ["صنّف ما يأتي بحسب نوع النفايات: مياه الصرف الصحي، الميثان، مخلفات البناء، الكلوروفلوروكربون.", "سائلة: مياه الصرف الصحي، وغازية: الميثان والكلوروفلوروكربون، وصلبة: مخلفات البناء", 1], ["علل: تشكل النفايات تهديدًا للبيئة وخطرًا على صحة الإنسان وسلامته.", "بسبب تزايدها وعدم اتباع الطرق المناسبة لمعالجتها والتخلص منها، فتلوث الماء والهواء والتربة وتنقل الأمراض", 2], ["أكمل: من العوامل التي أثرت سلبًا في مكونات البيئة الانفجار السكاني، والتقدم العلمي والتكنولوجي، و......", "ارتفاع مستوى المعيشة", 0], ["ما عقوبة تصريف النفايات الخطرة في الأودية أو الأفلاج أو الآبار وفق قانون حماية البيئة ومكافحة التلوث كما وردت في دليل المعلم؟", "السجن مدة لا تقل عن شهر ولا تزيد على سنة، وغرامة لا تقل عن (500) ريال عماني ولا تزيد على (50000) ريال عماني، أو إحدى هاتين العقوبتين", 1], ["اقترح حلين للتقليل من النفايات الخطرة.", "استخدام بدائل أقل خطورة في الصناعة والمنازل، وتخصيص نقاط جمع آمنة للبطاريات والأدوية والمواد الكيميائية ومعالجتها في منشآت متخصصة", 2], ["ما المقصود بإدارة النفايات؟", "عمليات جمع ونقل ومعالجة النفايات للتخلص منها", 0], ["قارن بين إعادة التدوير وإعادة الاستخدام.", "إعادة التدوير تحويل النفايات إلى منتجات جديدة، أما إعادة الاستخدام فاستخدام العنصر مرارًا وتكرارًا في هيئته الأصلية", 1], ["أكمل: انضمت سلطنة عُمان عام 2020م إلى اتفاقية ...... بشأن الزئبق.", "ميناماتا", 0], ["كيف يحمي المردم الهندسي المياه الجوفية من التلوث؟", "بطبقة عازلة لحماية التربة، وخطوط لتجميع المرتشحات ونقلها إلى محطة معالجة، وآبار لمراقبة جودة المياه الجوفية", 2], ["متى تنقرض إحدى فصائل الحيوانات؟", "بوفاة آخر حيوان قادر على التكاثر من تلك الفصيلة", 0], ["اذكر سببين بشريين من أسباب انقراض الحيوانات.", "الصيد الجائر للغذاء أو لأغراض تجارية، وتدمير المواطن الطبيعية أو تجزئتها، وتغيير الموطن الطبيعي، وإدخال أنواع جديدة قد تقضي على أنواع أخرى", 1], ["وضح كيف يؤدي انقراض نوع حيواني إلى اختلال التوازن البيئي.", "يتأثر ترابط السلسلة الغذائية، فتتكاثر أنواع كان يتغذى عليها هذا النوع وقد تكون ضارة، وتقل الكائنات التي تعتمد عليه في غذائها، فيختل التوازن", 2], ["من الحيوانات المعرضة للانقراض عالميًا النمر السيبيري ووحيد القرن الأسود.", "صح", 0, 1], ["اذكر سببين طبيعيين لانقراض الحيوانات.", "الكوارث الطبيعية كالجفاف والفيضانات والأعاصير والحرائق والبراكين، والأمراض والأوبئة", 1], ["علل: إدخال أنواع جديدة إلى بيئة ما قد يؤدي إلى انقراض أنواع أخرى.", "لأن الأنواع الجديدة قد تفترس الأنواع المحلية أو تنافسها على الغذاء والموطن أو تنقل إليها أمراضًا لا تقاومها", 2], ["اذكر ثلاثة حيوانات معرضة للانقراض في البيئة العمانية.", "النمر العربي، والوشق، والمها العربية، وبعض السلاحف البحرية كالريماني والشرفاف، والصقر الأدهم", 0], ["أكمل: انضمت سلطنة عُمان إلى اتفاقية الاتجار الدولي في أنواع الحيوانات والنباتات المهددة بالانقراض عام ...... م.", "2007", 0], ["ما أهمية تنسيق الجهود بين فئات المجتمع ومؤسساته للمحافظة على البيئة؟", "يوحد الجهود ويمنع تضاربها، ويجمع بين القوانين الحكومية ودعم القطاع الخاص ومشاركة الأفراد والجمعيات، فتتحقق حماية أشمل وأدوم للبيئة", 2]], "o": ["يعرّف النفايات ويحدد مصادرها.", "يصنف النفايات بحسب نوعها (الصلبة، والسائلة، والغازية).", "يوضح المقصود بالنفايات الخطرة وعقوبة تصريفها وفق قانون حماية البيئة ومكافحة التلوث.", "يقترح حلولًا للتقليل من النفايات الخطرة."]}]};</script>
