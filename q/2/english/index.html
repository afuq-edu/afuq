<script>window.QZ={"g": "2", "gn": "الثاني", "s": "english", "sn": "اللغة الإنجليزية", "L": [{"t": "Welcome – Lesson 1: Classroom language", "u": "Welcome: Hello!", "q": [], "o": ["Pupils will be able to recognise the classroom instructions look, listen, read, point, draw and write.", "Another learning outcome:", "Pupils will be able to respond physically to stand up, sit down, open/pick up/close your book and wave goodbye."]}, {"t": "Welcome – Lesson 2: Hello! (Story and meeting new friends)", "u": "Welcome: Hello!", "q": [["Who is the parrot in the story?", "Polly", 0], ["Whose birthday is it in the story?", "It’s Sami’s birthday", 1], ["Listen: \"Hi, I’m Jack. I’m seven.\" How old is Jack?", "Seven", 1], ["Which name starts with a capital S?", "Sami", 0]], "o": ["Pupils will be able to understand the Welcome story and name the characters.", "Another learning outcome:", "Pupils will be able to ask and answer What’s your name? and How old are you?"]}, {"t": "Welcome – Lesson 3: Numbers and colours", "u": "Welcome: Hello!", "q": [["Hold a blue crayon: What colour is it?", "It’s blue", 1], ["Count from one to ten.", "one, two, three, four, five, six, seven, eight, nine, ten", 0], ["How many balloons are on p. 12?", "Six", 1], ["Read the word \"four\" on the board.", "four", 0], ["Match \"eight\" to the right number.", "8", 0], ["Read: What colour is it? It’s orange. Colour the balloon.", "The balloon is coloured orange", 1], ["Write the number word for 6 and the colour of your bag.", "six; e.g. blue", 2]], "o": ["Pupils will be able to count and say numbers one to ten.", "Another learning outcome:", "Pupils will be able to name ten colours and answer What colour is it?"]}, {"t": "Unit 1 – Lesson 1: Vocabulary and Grammar (Indoor toys)", "u": "Unit 1: Look at my toys!", "q": [["Why do we say \"an\" action figure?", "Because action begins with a vowel sound (a)", 2]], "o": ["Pupils will be able to name ten indoor toys.", "Another learning outcome:", "Pupils will be able to ask and answer What’s this? It’s a (car). It’s an (action figure)."]}, {"t": "Sounds and Spelling – Unit 1, Lesson 1: ai", "u": "Unit 1: Look at my toys!", "q": [["Segment the word \"rain\".", "r – ai – n", 1], ["Circle ai in \"paint\".", "p-ai-nt (ai circled)", 0], ["Blend: ch – ai – n.", "chain", 1]], "o": ["Pupils will be able to recognise the digraph ai and say its sound /eɪ/.", "Pupils will be able to blend and segment ai words such as rain, tail and train.", "Another learning outcome:", "Pupils will be able to read the tricky word his in a sentence."]}, {"t": "Unit 1 – Lesson 2: Story \"New toys\"", "u": "Unit 1: Look at my toys!", "q": [["In frame 6, Jack says \"It’s a car.\" What does Sami say?", "No, it’s a plane", 1], ["Who says \"This is fun!\" in frame 8?", "Fatma", 2], ["Circle: It’s a yo-yo / doll (frame 4).", "It’s a yo-yo", 0], ["What toy is \"very big\" in the story?", "The plane (the big toy they build)", 1], ["Which frame comes first?", "Frame 1: Look! It’s Polly", 0], ["Is the teddy robot a good idea? Why?", "Yes, it is creative / fun", 2], ["Number the speech bubble \"It’s a yo-yo. Look!\" in the right place.", "Correct number given", 0]], "o": ["Pupils will be able to follow the story \"New toys\" and identify the toys in it.", "Pupils will be able to answer simple questions about the story.", "Another learning outcome:", "Pupils will be able to act out parts of the story."]}, {"t": "Sounds and Spelling – Unit 1, Lesson 2: oa", "u": "Unit 1: Look at my toys!", "q": [["Blend g – oa – t.", "goat", 1], ["Circle oa in \"soap\".", "s-oa-p", 0], ["Complete: It is ___ boat. (a boy)", "his", 2]], "o": ["Pupils will be able to say the sound /əʊ/ for oa and do its action.", "Pupils will be able to read and write oa words: boat, coat, goat, road, soap.", "Another learning outcome:", "Pupils will be able to use the tricky words his and her correctly."]}, {"t": "Unit 1 – Lesson 3: Vocabulary and Grammar (Outdoor toys)", "u": "Unit 1: Look at my toys!", "q": [["Is it a ball? (show the ball)", "Yes, it is", 1], ["Look at the bike: Is it a slide?", "No, it isn’t", 2]], "o": ["Pupils will be able to name six outdoor toys.", "Another learning outcome:", "Pupils will be able to ask and answer Is it a (swing)? Yes, it is. / No, it isn’t."]}, {"t": "Sounds and Spelling – Unit 1, Lesson 3: ie", "u": "Unit 1: Look at my toys!", "q": [["Read: pie.", "pie", 1], ["Blend t – ie.", "tie", 0], ["Which word has ie?", "tie", 1, ["tail"]]], "o": ["Pupils will be able to recognise ie and say the sound /aɪ/.", "Pupils will be able to read and write tie, pie, lie and die.", "Another learning outcome:", "Pupils will be able to read questions with the tricky word who."]}, {"t": "Unit 1 – Lesson 4: Skills (Listening and speaking)", "u": "Unit 1: Look at my toys!", "q": [["Listen to item 1: What’s Safa’s toy?", "The toy named in the recording (as ticked)", 0], ["Lead the cut-out game for two rounds.", "Asks and answers correctly", 2], ["Is it a brown teddy? (brown teddy)", "Yes, it is", 1], ["Circle: Is it a red car? Yes, it is / No, it isn’t.", "Correct choice for the picture", 0]], "o": ["Pupils will be able to listen to short dialogues and identify toys.", "Another learning outcome:", "Pupils will be able to play a guessing game asking Is it a …? and What’s this?"]}, {"t": "Sounds and Spelling – Unit 1, Lesson 4: a-e", "u": "Unit 1: Look at my toys!", "q": [["Read: cake.", "cake", 0], ["What does the e do in \"game\"?", "It makes the a say /eɪ/", 1], ["Read: I have got a snake.", "I have got a snake", 2], ["Circle a-e in \"lake\".", "l-a-k-e (a and e joined)", 0]], "o": ["Pupils will be able to recognise the split digraph a-e and say /eɪ/.", "Pupils will be able to read and write game, snake, cake, lake, rake and flame.", "Another learning outcome:", "Pupils will be able to read sentences with the tricky word have."]}, {"t": "Unit 1 – Lesson 5: Culture and Project (Oman’s Children Museum)", "u": "Unit 1: Look at my toys!", "q": [["Where is Oman’s Children Museum?", "In Muscat", 0], ["Is it a school?", "No, it isn’t. It’s a museum", 1], ["What can you make at the museum?", "Toys / puppets", 2], ["What can you ride in the museum?", "A special bike", 1], ["What is step 1 of the project?", "Draw a picture of your favourite toy", 0], ["Write: This is my ___.", "This is my (toy)", 1], ["Read your group’s poster sentences.", "Correct reading", 1], ["Present the poster with three sentences.", "This is our toy museum. This is my … It’s …", 2]], "o": ["Pupils will be able to read a simple text about Oman’s Children Museum.", "Pupils will be able to identify things you can do in the museum.", "Another learning outcome:", "Pupils will be able to talk about their favourite toy."]}, {"t": "Unit 1 – Lesson 6: English in action (Sharing your toys)", "u": "Unit 1: Look at my toys!", "q": [["How do you ask to play with a friend’s toy?", "Can I play with it, please?", 0], ["What does the friend answer?", "Yes, of course. Let’s play together", 1], ["Why is sharing good?", "It makes friends happy / we play together", 2], ["Complete: Can I play with it, ___?", "please", 1], ["Complete: It’s my new ___. (scooter)", "scooter", 1], ["Say the answer: Can I play with it, please?", "Yes, of course", 2], ["Write the missing word: Yes, of ___.", "course", 1]], "o": ["Pupils will be able to read and match toy words with pictures.", "Pupils will be able to ask politely Can I play with it, please? and answer Yes, of course.", "Another learning outcome:", "Pupils will be able to show the value of sharing toys."]}, {"t": "Unit 1 – Lesson 7: Review and Get ready for Starters", "u": "Unit 1: Look at my toys!", "q": [["What’s this? (yo-yo)", "It’s a yo-yo", 0], ["Which Progress path question can you answer best? Why?", "Pupil reflects on own progress", 2], ["Circle: Is it an action figure? (action figure)", "Yes, it is", 1], ["Unscramble: p-l-e-n-a.", "plane", 0], ["Look at the ball: This is a ball. Tick or cross?", "✓", 1], ["Look at the kite: This is a bike. Tick or cross?", "✗", 2], ["Unscramble: z-u-p-z-e-l.", "puzzle", 0], ["Write the word for the toy with six letters that you can ride on", "scooter", 2, ["slide"]]], "o": ["Pupils will be able to review toy words and What’s this? / Is it a …?", "Pupils will be able to assess their progress on the Progress path.", "Another learning outcome:", "Pupils will be able to write about their favourite toy."]}, {"t": "Sounds and Spelling – Unit 1, Lesson 5: Graded readers", "u": "Unit 1: Look at my toys!", "q": [["Where is the girl?", "At the lake", 0], ["What has the goat got?", "Her pie / her boat", 1], ["Find a word with oa on the page.", "goat / boat / coat", 2], ["Sort: cake – ai or a-e?", "a-e", 0], ["Read: You have got my pie, goat!", "Correct reading", 1], ["Is the girl happy at the end? Why?", "Pupil’s reasoned answer from the pictures", 2], ["Read: My boat is on the lake.", "Correct reading", 0], ["Which word has ai?", "sail", 1, ["tie"]], ["Choose: You have got my (mat / boat), goat!", "boat", 2], ["Read a page to your partner without help.", "Fluent reading", 0], ["Choose: My (coat / boat) is on the gate.", "coat", 2], ["How old is the boy?", "Six", 0], ["What is on the cake?", "A boat", 1], ["What is in the box?", "A game", 2], ["Blend: s – oa – p.", "soap", 0], ["Find a word with a-e in the story.", "cake / game", 1], ["Why is the boy happy?", "It’s his birthday / he has got presents", 2], ["Read: It is a tie.", "Correct reading", 0], ["Say the tricky word in: What is in it?", "What (is)", 2], ["Read a page fluently to the teacher.", "Fluent reading", 0]], "o": ["Pupils will be able to sort Unit 1 words by digraph (ai, oa, ie, a-e).", "Pupils will be able to predict and follow the story \"At the lake\".", "Another learning outcome:", "Pupils will be able to answer simple questions about the story."]}, {"t": "Unit 2 – Lesson 1: Vocabulary and Grammar (Classroom objects)", "u": "Unit 2: Where’s my pen?", "q": [["When do we say These are?", "When there is more than one thing", 2], ["Choose", "These are my crayons", 1, ["This is"]], ["How many cars can you see on CB p. 26?", "The number shown in the picture (as circled)", 1], ["Read and colour: The ruler is yellow.", "The ruler is coloured yellow", 1], ["Write the plural: one crayon – two ___.", "crayons", 2]], "o": ["Pupils will be able to name ten classroom objects.", "Another learning outcome:", "Pupils will be able to use This is my (pen). and These are my (books). correctly."]}, {"t": "Sounds and Spelling – Unit 2, Lesson 1: or", "u": "Unit 2: Where’s my pen?", "q": [["Blend f – or – k.", "fork", 1], ["Read: It is our torch.", "Correct reading", 2], ["Circle or in \"storm\".", "st-or-m", 0], ["Complete: It is ___ game. (we)", "our", 2]], "o": ["Pupils will be able to say the sound /ɔː/ for or with its action.", "Pupils will be able to blend and write fork, corn, storm, torch, sport and north.", "Another learning outcome:", "Pupils will be able to read the tricky word our in a sentence."]}, {"t": "Unit 2 – Lesson 2: Story \"The computer\"", "u": "Unit 2: Where’s my pen?", "q": [["What is Lily’s project?", "A computer", 0], ["Where’s Atomic?", "She’s under the table", 1], ["Why do they say \"What a mess!\"?", "Because Polly makes the room untidy", 2], ["Tick: These are my books.", "✓ (frame 1)", 0], ["Where is the pen in the story?", "It’s under the desk", 1], ["Why is it good to be tidy?", "We can find our things / the room is nice", 2], ["Who says \"This is my desk\"?", "Lily", 0], ["Finish the line: Oh! It’s a ___.", "computer", 2], ["Match: \"These are my books and this is Atomic, my cat.\" to the frame.", "Frame 1", 0]], "o": ["Pupils will be able to follow the story \"The computer\" and say where things are.", "Pupils will be able to answer questions about the story using This is / These are.", "Another learning outcome:", "Pupils will be able to explain why being tidy is important."]}, {"t": "Sounds and Spelling – Unit 2, Lesson 2: ng", "u": "Unit 2: Where’s my pen?", "q": [["Say the last sound in \"ring\".", "/ŋ/", 0], ["Blend s – i – ng.", "sing", 1], ["Read: It is their game.", "Correct reading", 2], ["Circle ng in \"swing\".", "sw-i-ng", 0], ["Complete: It is ___ torch. (two children)", "their", 2]], "o": ["Pupils will be able to recognise ng at the end of words and say /ŋ/.", "Pupils will be able to read and write ring, sing, bang, long, swing and sting.", "Another learning outcome:", "Pupils will be able to read the tricky word their in a sentence."]}, {"t": "Unit 2 – Lesson 3: Vocabulary and Grammar (Where’s the pencil?)", "u": "Unit 2: Where’s my pen?", "q": [["Put a pencil on the desk: Where’s the pencil?", "It’s on the desk", 1], ["Put a book under the chair and ask the pupil to make the question and answer.", "Where’s the book? It’s under the chair", 2], ["Listen to the song line: Where’s the computer?", "It’s on the desk", 1], ["Look: Where’s the ball? (under the chair)", "It’s under the chair", 1], ["Circle: The book is in / on the shelf.", "on", 2]], "o": ["Pupils will be able to name six classroom furniture words.", "Another learning outcome:", "Pupils will be able to ask and answer Where’s the (pencil)? It’s in/on/under the (desk)."]}, {"t": "Sounds and Spelling – Unit 2, Lesson 3: short oo", "u": "Unit 2: Where’s my pen?", "q": [["Read: book.", "book", 0], ["Blend c – oo – k.", "cook", 1], ["Read: Why is he sad?", "Correct reading", 2], ["Circle oo in \"foot\".", "f-oo-t", 0], ["Which word starts the question: ___ is she sad?", "Why", 2]], "o": ["Pupils will be able to say the short sound /ʊ/ for oo.", "Pupils will be able to read and write book, look, foot, hook, wood and cook.", "Another learning outcome:", "Pupils will be able to read questions with the tricky word why."]}, {"t": "Unit 2 – Lesson 4: Skills (Listening and speaking)", "u": "Unit 2: Where’s my pen?", "q": [["Listen: The bag is under the chair. Where’s the bag?", "It’s under the chair", 0], ["Answer: Where’s the ruler? : "Sounds and Spelling – Unit 2, Lesson 5: Review of Units 1–2 sounds", "u": "Unit 2: Where’s my pen?", "q": [["Which digraph is in \"nail\"?", "ai", 0], ["Write the word: l-a-k-e.", "lake", 1], ["Read: It is his game.", "Correct reading", 2], ["Circle the sound in \"torch\".", "or", 0], ["Write the missing digraph: fl __ t", "oa (float)", 1], ["Complete: Who is ___? (five)", "five → Who is five?", 2]], "o": ["Pupils will be able to identify the medial or final digraph in a word.", "Pupils will be able to write words with the correct digraph.", "Another learning outcome:", "Pupils will be able to complete sentences with the tricky words his, her, our, their, have, who."]}, {"t": "Unit 2 – Lesson 6: English in action (Borrowing things)", "u": "Unit 2: Where’s my pen?", "q": [["How do you ask to borrow a ruler?", "Can I borrow it, please?", 0], ["What do you say when you give it?", "Here you are", 1], ["What do you say after you borrow?", "Thank you", 2], ["Complete: Is this ___ pen? Yes, it is.", "your", 1], ["Write: This is my ___. (ruler)", "ruler", 0], ["Choose", "These are my books", 1, ["This is"]], ["Say the reply: Can I borrow it, please?", "Yes. Here you are", 2], ["Write the missing words: Here ___ ___.", "you are", 1], ["Perform the borrowing dialogue you wrote.", "Correct and polite dialogue", 2]], "o": ["Pupils will be able to read and match classroom object words.", "Pupils will be able to ask politely to borrow an object and reply.", "Another learning outcome:", "Pupils will be able to show good manners when borrowing."]}, {"t": "Sounds and Spelling – Unit 2, Lesson 6: Let’s blend!", "u": "Unit 2: Where’s my pen?", "q": [["Blend sp – or – t.", "sport", 0], ["Does \"hook\" match moon or book?", "book", 1], ["Read: It is our book.", "Correct reading", 2], ["Write: br + oo + m.", "broom", 0], ["Find the odd sound: spoon, boot, cook.", "cook", 1]], "o": ["Pupils will be able to blend words with consonant clusters and digraphs (chain, sport, broom).", "Pupils will be able to match words that share the same middle sound.", "Another learning outcome:", "Pupils will be able to write sentences with our, their, when and why."]}, {"t": "Unit 2 – Lesson 7: Review and Get ready for Starters", "u": "Unit 2: Where’s my pen?", "q": [["Circle: This is / These are my pens.", "These are", 0], ["Which Unit 2 sentence is still difficult for you?", "Pupil reflects honestly", 2], ["Write: This is my ___. (computer)", "computer", 0], ["Count and write how many erasers you can find.", "Correct number", 2], ["Read: These are computers. (one computer)", "✗", 0], ["Unscramble: o-o-b-k.", "book", 1], ["Answer the examiner: What’s this? (pencil case)", "It’s a pencil case", 2]], "o": ["Pupils will be able to choose This is / These are correctly.", "Pupils will be able to listen and decide Yes or No about where things are.", "Another learning outcome:", "Pupils will be able to evaluate their progress on the Progress path."]}, {"t": "Sounds and Spelling – Unit 2, Lesson 7: Review and dictation", "u": "Unit 2: Where’s my pen?", "q": [["Match \"fork\" to its sound.", "or", 0], ["Odd one out: moon, spoon, book.", "book", 1], ["Read: Our boat is red.", "Correct reading", 2], ["Find and write \"string\".", "string", 0], ["Number: This is our train.", "Correct picture", 1], ["Write the dictated sentence: When is it hot?", "When is it hot?", 2]], "o": ["Pupils will be able to match pictures to digraphs and find the odd one out.", "Pupils will be able to read a short text and follow instructions to colour and draw.", "Another learning outcome:", "Pupils will be able to write dictated sentences with tricky words."]}, {"t": "Sounds and Spelling – Unit 2, Lesson 8: Graded readers", "u": "Unit 2: Where’s my pen?", "q": [["What is in the boy’s hand?", "A tooth", 0], ["Is the tooth big?", "Yes, it is", 1], ["Where does he put the tooth?", "On the roof", 2], ["Find a word with oo in the story.", "tooth / roof / moon", 0], ["What does the boy wait for?", "The sun", 1], ["Why does the boy sing?", "Pupil’s answer from the story (to say goodbye to his tooth / it is a tradition)", 2], ["Read: Wait for the sun.", "Correct reading", 0], ["Complete: It is a big ___.", "tooth", 1], ["What happens first in the story?", "The boy has got a tooth in his hand", 2], ["Read your favourite page fluently to the class.", "Fluent reading", 0], ["Match", "sun", 1, ["\"Wait for the ___.\" → moon"]], ["Retell the story in three sentences.", "He has got a tooth. He waits for the sun. He puts it on the roof and sings", 2], ["Who is the story about?", "The king", 0], ["Who is sick?", "Cook", 1], ["What does the king make?", "Popcorn", 2], ["Blend k – i – ng.", "king", 0], ["Order: The pot is hot. / Cook is sick! – which comes first?", "Cook is sick!", 1], ["Can the king cook at the end? How do you know?", "Yes, he can. He makes popcorn", 2]], "o": ["Pupils will be able to read words with oo and or from the story.", "Pupils will be able to follow and predict events in \"My tooth\".", "Another learning outcome:", "Pupils will be able to answer questions about the story."]}, {"t": "Learning Club 1 – Lesson 1: Language booster 1", "u": "Learning Club 1", "q": [["Describe the helicopter with very.", "The helicopter is very noisy", 2], ["Match: The computer is very ___.", "interesting", 1], ["Is Jack and the Beanstalk very scary?", "Yes, it is", 1], ["Complete: My favourite book is ___. It’s very ___.", "Pupil’s book + adjective", 2], ["Order the dialogue: What’s your favourite book? / It’s very scary. / Jack and the Beanstalk.", "What’s your favourite book? Jack and the Beanstalk. It’s very scary", 1]], "o": ["Pupils will be able to name monster, helicopter, robot, computer and book.", "Pupils will be able to describe things with very + adjective (big, small, noisy, interesting, scary).", "Another learning outcome:", "Pupils will be able to ask and answer Is it very …? Yes, it is. / No, it isn’t."]}, {"t": "Learning Club 1 – Lesson 2: CLIL Natural Sci
