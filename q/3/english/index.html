ce.", "The chant says I don't play, but I play. (any logical answer)", 2], ["Which routine is it? A boy is sleeping in bed at night.", "go to bed", 0], ["Order: go / I / school. / to", "I go to school", 1], ["Write the routine for eating eggs and bread in the morning.", "have breakfast", 0]], "o": ["Pupils identify and say ten daily routines (get up, pray, have breakfast, go to school, have art lessons, play, have lunch, do homework, have dinner, go to bed).", "Pupils use I / We + verb and I / We + don't + verb to talk about their routines.", "Another learning outcome:", "Pupils compare their own day with the chant and say what is the same or different."]}, {"t": "Unit 1 – Lesson 2: Story (Atomic is colourful!)", "u": "Unit 1: It's a happy day!", "q": [["Who is colourful at the end of the story?", "Atomic", 0], ["Choose: We have / don't have art lessons at school today.", "We have art lessons at school today", 1], ["Why is Atomic colourful?", "Polly is on the table, the paints fall and Atomic gets paint on him", 2], ["Where do Sami and Jack play tennis?", "In the park (before school)", 0], ["What do blue and yellow make?", "Green", 1], ["The flowers are a mess but the children say See beauty in everything. What do they do?", "They tidy up and paint a picture of colourful Atomic", 2], ["Blue and yellow make green.", "True", 0, 1], ["Jack and Sami have tennis lessons in the morning.", "True", 1, 1], ["Correct the false sentence: They don't have art lessons.", "They have art lessons", 2], ["What do the children paint at the end?", "A picture of Atomic", 0]], "o": ["Pupils follow the story and answer simple questions about the characters, places and events.", "Pupils choose the correct sentences about the story (CB p. 19 act 3).", "Another learning outcome:", "Pupils act out part of the story with expression."]}, {"t": "Unit 1 – Lesson 3: Vocabulary and Grammar (times of the day)", "u": "Unit 1: It's a happy day!", "q": [["Complete: We have dinner ___ the evening.", "in ve for breakfast?", "Cereal, milk and juice", 0], ["Where do people have corn porridge with sugar and milk?", "South Africa", 1], ["Compare a Japanese breakfast and an Omani breakfast.", "In Japan they have fish, pickles, rice and soup. In Oman we have Khubz Rakhal with eggs and beans", 2], ["Name two breakfast foods from the lesson.", "toast, cereal (any two)", 0], ["Choose: In Japan, some people have fish / toast for breakfast.", "fish", 1], ["Which breakfast do you like? Why?", "I like Khubz Rakhal because it is tasty. (any answer with a reason)", 2], ["Name one food for your Omani breakfast menu.", "Khubz Rakhal / eggs / beans / tea (any correct food)", 0], ["Complete: This ___ Khubz Rakhal.", "is", 1], ["What do we put on a breakfast menu?", "Food and drinks for breakfast", 0], ["Which group menu do you like? Why?", "I like group 2's menu because it has many foods. (any reason)", 2]], "o": ["Pupils name breakfast foods: cereal, pickles, porridge, soup, tea, toast.", "Pupils read short texts and say what people eat for breakfast in the UK, South Africa, Japan and Oman.", "Another learning outcome:", "Pupils compare a breakfast from another country with an Omani breakfast (Khubz Rakhal)."]}, {"t": "Unit 1 – Lesson 6: English in action (saying the time)", "u": "Unit 1: It's a happy day!", "q": [["Say the time: the minute hand is on 3 and the hour hand is just after 9.", "It's quarter past nine", 1], ["Which is earlier: quarter to eight or quarter past eight?", "quarter to eight", 2], ["What time do they have English in the dialogue?", "At quarter past eight", 0], ["Say the time: the minute hand is on 12 and the hour hand is on 4.", "It's four o'clock", 1], ["Make a dialogue line: have breakfast / quarter to six.", "What time do we have breakfast? We have breakfast at quarter to six", 2], ["Complete: It's quarter ___ eight. (minute hand on 9)", "to", 0], ["Complete: It's half past ___. (hour hand between 6 and 7)", "six", 1], ["What time is it in the dialogue?", "I
