<script>window.QZ={"g": "3", "gn": "الثالث", "s": "social", "sn": "الهوية والمواطنة", "L": [{"t": "أعتني بجسدي", "u": "الوحدة الأولى: أحافظ على ذاتي", "q": [["ما الحروف الأربعة في قاعدة مازن (تمرن)؟ وعلامَ يدل كل حرف؟", "ت: تغذية صحية، م: ممارسة الرياضة، ر: راحة، ن: نظافة شخصية", 0], ["اذكر نصيحتين لحرف (م) ممارسة الرياضة.", "الانتظام في ممارسة الرياضة، والالتزام بتمارين الصباح في الطابور (أو ممارسة الرياضة في مكان مناسب، ولبس الملابس الرياضية المناسبة)", 1], ["لماذا لا يكفي أن يمارس مازن الرياضة وحدها ليصبح جسده قويًّا؟", "لأن الجسد يحتاج إلى الطرق الأربع معًا؛ فالرياضة دون تغذية صحية وراحة ونظافة لا تكفي، وقد يتعب الجسد أو يمرض", 2], ["اختر العادة الصحيحة", "النوم باكرًا", 0, ["السهر أمام التلفاز"]], ["صنّف النصائح الآتية تحت حروفها في قاعدة (تمرن): شرب الماء بكثرة، قص الأظافر أسبوعيًّا، الاسترخاء والتنفس بعمق.", "شرب الماء بكثرة: ت (تغذية صحية)، قص الأظافر: ن (نظافة شخصية)، الاسترخاء والتنفس بعمق: ر (راحة)", 1], ["زميلك يترك وجبة الإفطار ويسهر كل ليلة؛ اقترح له يومًا صحيًّا وفق قاعدة (تمرن).", "إفطار صحي متوازن، ومشي أو لعب رياضي يومي، ونوم مبكر وكافٍ، واستحمام وتنظيف الأسنان بعد الوجبات", 2], ["لماذا نحتاج إلى النوم؟", "ليرتاح الجسم ويستعيد نشاطه وينمو، ويرتاح العقل فنستطيع التركيز", 0], ["لماذا يجب علينا الاهتمام بنظافتنا الشخصية؟ واذكر مصدرًا موثوقًا للإجابة.", "لنحمي أجسامنا من الجراثيم والأمراض ونبدو بمظهر حسن، والمصدر: معلم العلوم أو الزائرة الصحية أو كتاب العلوم", 1], ["قرأ أحمد في رسالة مجهولة أن شرب الماء يضر الجسم؛ هل يأخذ بها؟ ولماذا؟ وكيف يتحقق منها؟", "لا يأخذ بها؛ لأن مصدرها غير موثوق والمعلومة خاطئة، ويتحقق بسؤال مختص كالطبيب أو معلم العلوم أو بالرجوع إلى مرجع معتمد", 2], ["اختر المصدر الموثوق للمعلومة الصحية", "الزائرة الصحية", 0, ["رسالة مجهولة"]], ["وضّح فائدة واحدة لكل من: الغذاء الصحي المتوازن، وممارسة الرياضة باستمرار.", "الغذاء الصحي يمد الجسم بالطاقة ويساعده على النمو، والرياضة تقوي العضلات والقلب وتنشط الجسم", 1]], "o": ["يعدد طرق العناية بالجسد وفق قاعدة (تمرن): التغذية الصحية، وممارسة الرياضة، والراحة، والنظافة الشخصية.", "يقترح نصائح عملية تساعد على أن يصبح الجسد قويًّا ونشيطًا.", "يبادر إلى الالتزام بعادات صحية يومية للعناية بجسده."]}, {"t": "أهتم بعقلي", "u": "الوحدة الأولى: أحافظ على ذاتي", "q": [["اذكر طريقتين يهتم بهما ناصر بعقله وردتا في النص.", "قراءة الكتب، وحل الألغاز (أو ألعاب التركيب، أو الاستماع إلى القصص الشعبية)", 0], ["لماذا شبّه ناصر عقله بالبستان المليء بالزهور؟", "لأن العقل ينمو ويزهر كالبستان كلما اعتنينا به بالقراءة والتفكير والغذاء والماء والحنان، ويذبل إن أهملناه", 2], ["صل الرمز بالطريقة: الكتاب، القلب ← (الحب والحنان، القراءة).", "الكتاب: القراءة، القلب: الحب والحنان", 0], ["أكمل: تنمو زهرة في عقلي حينما ............ وحينما ............", "أقرأ كتابًا، أحل لغزًا، أفكر مع عائلتي في حل مشكلة (أي إجابتين صحيحتين)", 1], ["اقترح طريقة جديدة لتنشيط عقلك لم ترد في النص، ووضّح فائدتها لعقلك.", "مثل حفظ آيات من القرآن الكريم، أو لعب الشطرنج، أو تعلم كلمات جديدة؛ لأنها تقوي الذاكرة والتركيز", 2], ["في لعبة اللون والكلمة، ماذا نقرأ: لون الكلمة أم الكلمة المكتوبة؟", "نقرأ لون الكلمة لا الكلمة المكتوبة", 0], ["ما المهارة العقلية التي تنميها لعبة الكتابة المعكوسة أو الرسم باليد الأخرى؟", "التركيز والانتباه وتنشيط العقل", 1], ["اذكر لعبة واحدة من ألعاب بيت تنشيط العقل.", "لعبة اللون والكلمة (أو شمس قمر، أو XO، أو الكتابة المعكوسة، أو الرسم باليد الأخرى، أو الرسم مغمض العينين)", 0], ["ضع خطوتين لتطوير مهارة تختارها حتى تصل إلى «أنا في المستقبل».", "مثل مهارة العمليات الحسابية: أتدرب كل يوم على مسائل الجمع والطرح، وألعب ألعاب الأرقام مع أسرتي", 2]], "o": ["يذكر طرق الاهتمام بالعقل الواردة في نص «كيف يزهر عقلي؟».", "يستنتج طرقًا للاهتمام بالعقل من الرموز الدالة عليها.", "يقترح طريقة جديدة لتنشيط عقله لم ترد في النص."]}, {"t": "أحمي ذاتي", "u": "الوحدة الأولى: أحافظ على ذاتي", "q": [["ممّ يحمي ناصر جسده؟ وممّ يحمي عقله كما في النص؟", "يحمي جسده من الأضرار، ويحمي عقله من النسيان", 0], ["متى يسمح ناصر للغرباء بالاقتراب منه؟", "إذا كانوا يقدمون له المساعدة، مثل الطبيب والشرطي", 1], ["كيف يحمي ناصر عقله؟ واذكر طريقة أخرى من عندك.", "بالغذاء الصحي وقلة استخدام اللوح الرقمي، ومن الطرق الأخرى: قراءة القرآن، وعدم السهر، والإقلال من مشاهدة التلفاز", 2], ["ضع (✓) أو (✗): أسمح لأي شخص برؤية أعضاء جسمي الحساسة أو لمسها.", "(✗)؛ لا أسمح لأحد أن يرى أو يلمس أعضاء جسمي الحساسة", 0], ["ماذا تفعل إذا شعرت بأن لمسة أحدهم غير آمنة؟", "أرفض بحزم وأقول: توقف، وأبتعد إلى مكان آمن، وأبلغ من أثق به مثل والديّ أو معلمي", 2], ["ما قواعد «أحمي جسدي» الأربع؟", "أصرخ، أدفع، أهرب، أبلّغ", 0], ["«طلب إليّ شخص غريب في لعبة إلكترونية إرسال موقع منزلي»: ماذا تختار: قف أم سِر؟ ولماذا؟ وماذا تفعل بعدها؟", "قف؛ لأن إعطاء الغريب معلومات المنزل خطر، فأرفض وأغلق المحادثة وأبلغ والديّ", 2], ["اذكر شخصين أبلغهما إذا تعرضت لموقف مزعج.", "الوالدان، المعلم، الأخصائي الاجتماعي، مدير المدرسة، الشرطة (أي اثنين)", 0], ["اختر مع ذكر السبب: «أرغب في اللعب باللوح الرقمي لثلاث ساعات متتالية بعد المذاكرة» (قف / سِر).", "قف؛ لأن الجلوس طويلًا أمام اللوح الرقمي يضر العقل والجسد، والأفضل وقت محدد مع نشاط حركي", 1]], "o": ["يوضح طرق حماية الجسد والعقل كما وردت في نص «كلمات ترافقني».", "يميز صور اللمسة الآمنة من غيرها.", "يحدد أجزاء الجسد الخاصة التي لا يسمح لأحد برؤيتها أو لمسها."]}, {"t": "حقوقي الأسرية", "u": "الوحدة الثانية: حقوقي وواجباتي الأسرية", "q": [["ما الوثيقة التي تُسجَّل فيها أسماؤنا عند الولادة؟", "شهادة الميلاد", 0], ["اذكر ثلاثة من حقوق شمساء التي وفرتها لها أسرتها.", "المدرسة المناسبة، والملبس المناسب، والبيت الآمن، والعدل والمساواة مع إخوتها، والتعبير عن الرأي، والغذاء والرعاية الصحية (أي ثلاثة)", 1], ["كيف ساعدت الأسرة شمساء على تحقيق أمنياتها؟", "وفرت لها حقوقها: المدرسة الجميلة، والملابس، والبيت الآمن المملوء بالحب، والعدل مع إخوتها، وحرية التعبير، والغذاء والرعاية؛ فتحققت أحلامها", 2], ["صل الرمز بالحق: الميزان، قبعة التخرج ← (التعليم، العدل والمساواة).", "الميزان: العدل والمساواة، قبعة التخرج: التعليم", 0], ["أكمل: من حقي في أسرتي أن ............ وأن ............", "أي حقين صحيحين، مثل: أعبر عن رأيي، وأحصل على الرعاية الصحية، وألعب، وأعيش بأمان", 1], ["ما الحق الذي حُرم منه الولد الذي يذهب إلى المدرسة دون إفطار؟", "الغذاء الصحي", 0], ["ما النتيجة المتوقعة لحرمان الفتاة كفيفة البصر من الالتحاق بالمدرسة الخاصة بالمكفوفين؟", "الجهل وعدم القدرة على القراءة والكتابة، وضياع فرصتها في التعلم", 1], ["فتاة ذكية لا تجد اهتمامًا عندما تتحدث أمام أسرتها: ما الحق الغائب؟ وما النتيجة؟ واقترح حلًّا.", "حق التعبير عن الرأي، والنتيجة: الخوف والتردد وعدم الثقة بالنفس، والحل: أن تخصص الأسرة وقتًا للاستماع إليها وتشجيع أفكارها", 2], ["ضع (✓) أو (✗): من حق الطفل أن تحميه أسرته من الأذى.", "(✓)", 0], ["ولد يتعرض للتنمر من زملائه، ووالداه منشغلان عنه: ما الحق الذي يحتاج إليه؟", "الحماية والرعاية", 1], ["إذا شعرت بوجود خطر عليك، فماذا تفعل؟ ولماذا؟", "أبلغ المعلمة أو الأخصائية الاجتماعية بالمدرسة؛ لأنها تستطيع مساعدتي وحمايتي", 2]], "o": ["يعبّر عن حقوقه الأسرية التي توفرها له أسرته.", "يستنتج حقوق شمساء في أسرتها من الرموز الدالة عليها.", "يقدّر جهود أسرته في توفير حقوقه ويعبّر عن شكره لها."]}, {"t": "واجباتي الأسرية", "u": "الوحدة الثانية: حقوقي وواجباتي الأسرية", "q": [["ماذا تفعل شمساء وأخوها عندما تناديهما أمهما؟", "يسرعان بالدخول إلى البيت", 0], ["اذكر واجبين لشمساء تجاه ممتلكات بيتها.", "المحافظة على ممتلكات البيت، والمحافظة على نظافته", 1], ["اختر الواجب الأسري", "مساعدة أمي في تجهيز المائدة", 0, ["رمي الألعاب على الأرض"]], ["قدّم نصيحة لأحمد الذي ترك غرفته غير مرتبة.", "يا أحمد، رتب غرفتك وأعد ألعابك وأغراضك إلى أماكنها؛ فهذا من واجباتك", 1], ["قال الأب لأحمد: «لديك ساعة واحدة فقط للعب باللوح الرقمي». ما الواجب المطلوب من أحمد؟ وما الحق الذي يحصل عليه إن التزم؟", "طاعة والده والالتزام بالوقت المحدد، ويحصل على حقه في اللعب مع حماية صحته وثقة والده به", 2], ["لماذا لا نوافق على عبارة: «الاهتمام بالمطبخ ونظافته مهمة أمي وأختي فقط»؟", "لأن أعمال البيت مسؤولية جميع أفراده، وكل فرد يساعد بحسب قدرته", 1], ["صحّح الموقف: «جدي كبير السن، عندما يطلب مني شيئًا أخبر شخصًا آخر لإحضاره له».", "أسارع إلى إحضار ما يطلبه جدي بنفسي احترامًا له وبرًّا به", 2], ["اذكر واجبًا واحدًا تجاه غرفتك.", "ترتيبها، أو المحافظة على نظافتها، أو إعادة الأغراض إلى أماكنها", 0], ["اكتب واجبًا تجاه كل من: أبي وأمي، وجدي وجدتي.", "أبي وأمي: طاعتهما ومساعدتهما واحترامهما، وجدي وجدتي: زيارتهما واحترامهما وتلبية طلباتهما", 1]], "o": ["يوضح واجباته الأسرية تجاه أفراد أسرته وممتلكات بيته.", "يقدم نصائح مناسبة في مواقف تتعلق بالواجبات الأسرية.", "يربط بين القيام بالواجبات والحصول على الحقوق."]}, {"t": "ميثاق أسرتي", "u": "الوحدة الثانية: حقوقي وواجباتي الأسرية", "q": [["أين وجدت جدة شمساء ميثاق أسرة الجد؟", "في المندوس، وهو ورقة قديمة خطتها يد الجد", 0], ["ما المقصود بميثاق الأسرة؟", "وثيقة مكتوبة تنظم العلاقات بين أفراد الأسرة، وتوضح حقوقهم وواجباتهم، ويلتزم بها الجميع", 1], ["ما العلاقة بين لوحة إشارة المرور وميثاق الأسرة؟", "كلاهما قواعد يجب الالتزام بها؛ فعدم الالتزام بقواعد المرور يسبب الحوادث، وعدم الالتزام بميثاق الأسرة يسبب المشكلات ويحرم أفرادها من حقوقهم", 2], ["أكمل: من حقوقنا في ميثاق أسرة شمساء: الحب و............", "العطف", 0], ["اقترح واجبين يُضافان إلى واجبات ميثاق أسرة شمساء.", "المحافظة على نظافة البيت، ومساعدة أفراد الأسرة، واحترام الكبير والعطف على الصغير (أي اثنين)", 1], ["ما فائدة كتابة الميثاق بدل الاكتفاء بقوله شفهيًّا؟", "الكتابة تحفظه من النسيان، ويرجع إليه الجميع عند الحاجة، ويصبح التزامًا واضحًا للجميع", 2], ["«اسمي جميل وأنا أحب اسمي»: آخذ أم أعطي؟", "آخذ (حق)", 0], ["«أحافظ على أسرار أسرتي ولا أخبر بها أحدًا»: حق أم واجب؟ ولماذا؟", "واجب؛ لأنه شيء أقدمه لأسرتي وألتزم به تجاهها", 1], ["صنّف: «أستقبل الضيوف مع والدي، وأقدم لهم التحية».", "واجب (أعطي)", 0], ["ماذا تقترح لتتأكد أسرتك من التزام الجميع بالميثاق؟", "تعليقه في مكان يراه الجميع، ومراجعته في جلسة أسرية أسبوعية، وتشجيع الملتزم به", 2]], "o": ["يوضح المقصود بميثاق الأسرة وفائدته.", "يتوقع حقوقًا وواجبات مناسبة لميثاق أسرة شمساء.", "يقدّر أهمية الالتزام بالقواعد والأنظمة في البيت والطريق."]}, {"t": "أنا أحتاج.. أنا ألتزم", "u": "الوحدة الثالثة: حقوقي وواجباتي في الحي", "q": [["ما سبب سعادة ناصر في النص؟", "دخوله مكتبة الحي التي يحبها", 0], ["عبارة «تضم كتبًا وقصصًا متنوعة» تدل على أي حق؟", "حق التعليم", 1], ["عبارة ناصر عن أفكاره ومقترحاته التي سيقدمها للمكتبة دون تردد تدل على أي حق؟ وما الواجب الذي يقابله؟", "حق التعبير عن الرأي، ويقابله واجب تقديم المقترح بأدب واحترام رأي المسؤول", 2], ["اذكر مكونين من مكونات الحي.", "المسجد، والمدرسة، والحديقة، والبقالة، والمركز الصحي، والمكتبة (أي اثنين)", 0], ["اكتب التزامين يلتزم بهما ناصر للمحافظة على مكتبة الحي.", "إعادة الكتب إلى أماكنها، والمحافظة على الهدوء، والمحافظة على نظافة المكتبة، وعدم العبث بالكتب والألعاب (أي اثنين)", 1], ["رأيت طفلًا يكتب على جدار في الحي؛ ماذا تقول له؟ ولماذا؟", "أنصحه بلطف بعدم الكتابة على الجدار وأدعوه إلى مساعدتي في تنظيفه؛ لأن ذلك يشوه المظهر الحضاري للحي الذي نعيش فيه جميعًا", 2], ["ماذا تحتاج من المسجد؟", "مكان نظيف للصلاة، ومصاحف لقراءة القرآن، ومحاضرات وحلقات لتعليم القرآن", 0], ["اذكر التزامين تجاه الحديقة العامة.", "المحافظة على نظافتها، وعدم العبث بالألعاب وتحطيمها، وعدم قطع الأشجار (أي اثنين)", 1], ["لماذا يجب أن ألتزم بالهدوء والنظام في المركز الصحي؟", "لأن فيه مرضى يحتاجون إلى الراحة، وحتى يتلقى الجميع العلاج بنظام دون إزعاج", 2], ["صل المكون بالالتزام: البقالة، المدرسة ← (المحافظة على الكراسي والطاولات، عدم العبث بالمنتجات أو فتحها وتركها).", "البقالة: عدم العبث بالمنتجات أو فتحها وتركها، المدرسة: المحافظة على الكراسي والطاولات", 0], ["لو لم يلتزم أفراد الحي بواجباتهم تجاه مكوناته، فماذا سيحدث لحقوقهم؟", "ستتلف المكونات وتتسخ فلا يجدون ما يحتاجون إليه منها؛ فالحقوق لا تُحفظ إلا بالقيام بالواجبات", 2]], "o": ["يصنف عبارات نص «مكتبة الحي» بحسب الحق الذي تدل عليه (الحماية، العدالة، اللعب، التعليم، التعبير عن الرأي).", "يقترح التزامات للمحافظة على مكتبة الحي.", "يرفض التصرفات التي تشوه المظهر الحضاري للحي كالكتابة على الجدران."]}, {"t": "أخذ وعطاء", "u": "الوحدة الثالثة: حقوقي وواجباتي في الحي", "q": [["في أي مدينة تدور أحداث الأنشودة؟", "صلالة، في أيام الخريف", 0], ["اذكر قيمتين يحتاجهما أفراد الحي ليعيشوا سعداء كما في الأنشودة.", "الحب، والتعاون، والمساواة، والتكافل، ومساعدة الضعفاء (أي اثنتين)", 1], ["ما المقصود بأن العلاقة بيننا وبين أفراد الحي «أخذ وعطاء»؟", "أن ما نقدمه لهم من واجبات كالمساعدة والاحترام يعود علينا حقوقًا كالمحبة والأمان، فنعيش جميعًا في مودة", 2], ["ضع (✓) أو (✗): لا فرق بين الفقير والغني في الحي.", "(✓)؛ فكل الناس سواء", 0], ["وضّح معنى ا
