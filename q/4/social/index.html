<script>window.QZ={"g": "4", "gn": "الرابع", "s": "social", "sn": "الهوية والمواطنة", "L": [{"t": "الدرس الأول: أنا أجيد", "u": "", "q": [["ما النشاط الذي يجيده ناصر كما ورد في النص؟", "فك القطع وتركيبها ليصنع منها أشكالًا جميلة", 0], ["ناصر يحب الرسم، لكنه لا يجيده كما تجيده أخته شمساء. ماذا يعني ذلك؟", "أن حب النشاط وحده لا يكفي لإجادته؛ فشمساء ملمة بالرسم ومتقنة له، أما ناصر فيستمتع به دون أن يتقنه", 1], ["لماذا اختار ناصر صنع روبوت للمشاركة في مسابقة المبتكر الصغير؟", "لأنه نشاط يحبه ويجيده في الوقت نفسه؛ فهو يحب برمجة الروبوتات والمنافسة، ويجيد فك القطع وتركيبها", 2], ["أكمل: إجادة الأنشطة تعني ........ بأداء النشاط، و........ العمل به.", "الإلمام، إتقان", 0], ["خالد يرسم في وقت فراغه ويستمتع بالرسم، أما عائشة ففازت في مسابقة الرسم بالمدرسة. مَن يحب الرسم؟ ومَن يجيده؟", "خالد يحب الرسم، وعائشة تجيده؛ لأنها متقنة له وحققت فيه إنجازًا", 1], ["«حل الألغاز» نشاط يحبه أحمد ويحله بسرعة ودقة دائمًا. في أي عمود يضعه؟", "في عمود «أحبه وأجيده»", 0], ["لماذا لا يكفي أن أضع النشاط في عمود «أحبه وأجيده» لأني أستمتع به فقط؟", "لأن الإجادة تحتاج إلى إتقان وإلمام يظهران في الأداء، لا مجرد الاستمتاع بالنشاط", 1], ["كيف تتأكد أن تصنيفك لنفسك في نشاط ما صادق؟", "بالاستناد إلى أدلة، مثل: إنجاز حققته فيه، أو رأي معلمي وأسرتي، أو مقارنة أدائي بأداء المتقنين له", 2], ["صواب أم خطأ: كل نشاط أحبه فأنا أجيده بالضرورة.", "خطأ؛ فقد أحب نشاطًا ولا أتقنه بعد", 0], ["اقترح كيف ينقل زميلك نشاطًا من عمود «أحبه ولا أجيده» إلى عمود «أحبه وأجيده».", "بالتدرب المستمر، والتعلم من المختصين أو من الكتب، وتكرار المحاولة حتى يتقنه", 2]], "o": ["يوضح المقصود بإجادة الأنشطة.", "يميز بين ما يحبه ناصر من أنشطة وما يجيده في نص «المبتكر الصغير (1)».", "يقدّر تميّز الآخرين فيما يجيدونه، ويحترم اختلافهم عنه."]}, {"t": "الدرس الثاني: أنمّي ما أجيد", "u": "", "q": [["من أين حصل ناصر على المعلومات لتنمية ما يجيده؟", "من الكتب الموجودة في مكتبة أبيه، ومن شبكة الإنترنت، ومن البرامج التدريبية الإلكترونية", 0], ["ماذا تعلم ناصر من أخته شمساء؟ وكيف ساعده أبوه؟", "علمته شمساء كيف يضفي لمسات جميلة على رسم الروبوت، وساعده أبوه بتوفير القطع والأدوات المناسبة لصنعه", 1], ["ما وجه الشبه بين البالونة في التجربة وما يجيده الإنسان؟", "البالونة بقيت خاملة حتى تفاعلت المواد فانتفخت، وكذلك ما نجيده يبقى خاملًا إن لم نجد عوامل تنميه، مثل: التعلم، والتدريب، والدعم", 2], ["اذكر طريقتين من طرق تنمية ما نجيده.", "قراءة الكتب، والبحث في الإنترنت (ويقبل: الدورات التدريبية، تشجيع الأسرة، مساعدة الأصدقاء، تكرار المحاولات)", 0], ["وضح دور كل من الأب وشمساء ومعاذ في تنمية ما يجيده ناصر.", "الأب: وفّر القطع والأدوات. شمساء: علمته إضافة لمسات جميلة على رسم الروبوت. معاذ: شاركه بأفكاره الإبداعية في برمجة الروبوت", 1], ["صديقك يجيد كتابة القصص؛ اقترح عليه ثلاث طرق لتنمية هذه الإجادة مستفيدًا مما فعله ناصر.", "قراءة قصص وكتب في فن القصة، والالتحاق بورشة أو دورة في الكتابة، وعرض قصصه على معلمه وأسرته للاستفادة من ملاحظاتهم مع الكتابة باستمرار", 2], ["ماذا فعل ناصر عندما لم يعمل الروبوت؟", "حزن في البداية، لكن أمه احتضنته وشجعه أبوه، فكرر المحاولة أيامًا أخرى", 0], ["ما العلاقة بين المثابرة وتحقيق الإنجاز في قصة المخترع وقصة ناصر؟", "المثابرة وتكرار المحاولة رغم الفشل هي التي أوصلت كليهما إلى الإنجاز، ولولاها لتوقفا عند أول صعوبة", 2], ["اذكر العناصر الأربعة لخطة تنمية ما أجيده في نشاط ص 33.", "النشاط الذي أجيده، وكيف أنميه، وماذا أحتاج لأنميه، ومن يساعدني", 1], ["قيّم خطة زميلك: «أجيد السباحة، وسأنميها بالتدرب مرة واحدة في السنة دون مدرب». ما ملاحظتك؟", "الخطة ضعيفة؛ فالتدرب مرة واحدة في السنة لا يكفي، والأفضل التدرب بانتظام مع مدرب أو في نادٍ وبمتابعة الأسرة", 2]], "o": ["يستنتج طرق تنمية ما يجيده الفرد من نص «المبتكر الصغير (2)».", "يوضح دور الكتب والإنترنت وشمساء والأب ومعاذ في تنمية ما يجيده ناصر.", "يقدّر دور الأسرة والأصدقاء في دعم ما يجيده الفرد."]}, {"t": "الدرس الثالث: أستفيد مما أجيد", "u": "", "q": [["بماذا كُرِّم ناصر في المسابقة؟", "بهدية مميزة، هي طابعة ثلاثية الأبعاد", 0], ["اذكر أثرين لابتكار ناصر في ذاته.", "الشعور بالسعادة، والثقة بالنفس (ويقبل: تحقيق الذات، الاستقلالية، تعلم أهمية تكرار المحاولات)", 1], ["كيف استفاد الصف من روبوت ناصر؟ وماذا تستنتج؟", "طلبت المعلمة استخدامه في الصف ليساعدهم في الحصول على الموضوعات التي يحتاجون إلى البحث عنها؛ وأستنتج أن ما يجيده الفرد يعود بالنفع على الآخرين أيضًا", 2], ["صواب أم خطأ: ما يجيده الفرد يفيده هو وحده ولا يفيد الآخرين.", "خطأ؛ فقد استفاد من ابتكار ناصر أسرته وزملاؤه في الصف", 0], ["كيف استفاد الناس مما أجاده أحمد بن ماجد؟", "استفادوا من البوصلة في معرفة الاتجاهات في البحر والصحراء وأي مكان آخر", 1], ["كيف أثّر نجاح مجموعتك في بقية زملائك في الصف؟", "ألهمهم أفكارًا للبناء، ونشر روح المنافسة الإيجابية، وتعلموا من طريقة تعاوننا", 2], ["لماذا نجحت المجموعة التي وزعت الأدوار بحسب ما يجيده أفرادها؟", "لأن كل فرد أدى المهمة التي يتقنها، فقل الخطأ وأُنجز العمل بدقة في الوقت المحدد", 1]], "o": ["يوضح أثر ابتكار ناصر في ذاته وفي أسرته وزملائه.", "يستنتج أن ما يجيده الفرد يستفيد منه هو والآخرون، من خلال مثال أحمد بن ماجد والبوصلة.", "يعتز بإسهامات الشخصيات العمانية فيما أجادته."]}, {"t": "الدرس الأول: أسرتي تجيد", "u": "", "q": [["ماذا يجيد جد شمساء؟", "صنع السعفيات", 0], ["لماذا فكرت شمساء في منتج تتعاون فيه مع أسرتها؟", "لتحقق أمنيتها في أن تصل رائحة بخور أمها إلى الجميع، ولتقدم جزءًا من مردوده المالي للهيئة العمانية للأعمال الخيرية", 1], ["كيف يجمع منتج أسرة شمساء بين ما يجيده أفرادها؟", "الأم تصنع البخور، والجد يصنع السعفيات، وناصر يصمم الأشكال بطابعته ثلاثية الأبعاد، وشمساء ترسم وتلون، فيخرج منتج واحد متكامل", 2], ["أكمل: الأسر التي تعتمد على مهارات أفرادها في إنتاج منتجات وبيعها من المنزل تسمى ........", "الأسر المنتجة", 0], ["اذكر فردين من أسرة شمساء وما يجيده كل منهما.", "الأم تجيد صناعة البخور، وناصر يجيد تصميم الأشكال بالطابعة ثلاثية الأبعاد (ويقبل: الجد يجيد صنع السعفيات، وشمساء تجيد الرسم والتلوين)", 1], ["ما الفائدة التي تعود على المجتمع من مشروع أسرة شمساء؟", "يصل منتج عماني جميل إلى الناس، ويُقدَّم جزء من مردوده للأعمال الخيرية فتستفيد منه الأسر المحتاجة", 2], ["لو انضم إلى مجموعتكم فرد يجيد التصوير، كيف يطوّر منتجكم؟", "يصوّر المنتج صورًا جذابة تساعد على عرضه وتسويقه", 2], ["المشروع المنزلي الريادي نشاط يقدم منتجًا أو خدمة مقابل مردود مادي.", "صح", 0, 1], ["لماذا يعد مشروع أسرة شمساء مشروعًا رياديًا ناجحًا في بدايته؟", "لأنه بُني على ما يجيده أفرادها فعلًا، وجمع مهاراتهم في منتج واحد، وله هدف واضح يخدم الأسرة والمجتمع", 2]], "o": ["يستخرج من نص «مشروع أسرتي (1)» ما يجيده كل فرد من أفراد أسرة شمساء.", "يوضح المقصود بالأسر المنتجة.", "يصمم بالرسم منتجًا أسريًا يجمع ما يجيده أفراد أسرة شمساء."]}, {"t": "الدرس الثاني: أخطط لمشروع أسرتي", "u": "", "q": [["لماذا وصل أحد الطالبين إلى الشيء المخفي قبل زميله؟", "لأنه كان يملك خريطة توضح له المسار", 0], ["ما المهمة التي سيقوم بها كل من الجد وناصر والأم والأب في المشروع؟", "الجد يصنع عشرين سلة، وناصر ينتج عشرين علبة للبخور بطابعته ثلاثية الأبعاد، والأم تصنع بخورًا يكفي عشرين علبة، والأب يوفر المال", 1], ["احسب التكلفة المتوقعة لمشروع أسرة شمساء، ووضح خطوات حسابك.", "السلال: 20 × 2 = 40 ريالًا، والعلب: 20 × 1 = 20 ريالًا، والبخور: 20 × 2 = 40 ريالًا؛ المجموع: 40 + 20 + 40 = 100 ريال عماني", 2], ["أكمل: خطة المشروع هي ........ للعمل بها تفاصيل كافية لما يجب أداؤه لإنجاز المشروع.", "خريطة", 0], ["اذكر ثلاثة من عناصر خطة المشروع في نشاط ص 50.", "اسم المشروع، وأدوات المشروع، والتكلفة المتوقعة (ويقبل: المستهلكون)", 1], ["لو قررت أسرة شمساء إنتاج عشر سلال وعشر علب وبخورًا يكفيها بالأسعار نفسها، فكم تصبح التكلفة المتوقعة؟", "10 × 2 + 10 × 1 + 10 × 2 = 20 + 10 + 20 = 50 ريالًا عمانيًا", 2], ["من الفئة المستهدفة لمنتج مجموعتكم؟", "بحسب المجموعة، مثل: طلاب المدرسة، أو الأسر، أو زوار المعارض", 0], ["كيف وزعتم المهام في مجموعتكم؟ ولماذا؟", "وزعناها بحسب ما يجيده كل فرد؛ فمن يجيد الرسم صمّم، ومن يجيد الحساب قدّر الكلفة، ليُنجَز العمل بإتقان", 1], ["ماذا يحدث لو بدأت المجموعة التنفيذ دون تحديد كلفة المشروع ومدة التنفيذ؟", "قد ينفد المال قبل إكمال المنتج، أو يتأخر الإنجاز، فيتعثر المشروع", 2], ["نجاح المشاريع الريادية يعتمد على التخطيط الناجح.", "صح", 0, 1], ["لماذا نحدد الفئة المستهدفة في خطة المشروع؟", "لنصمم المنتج بما يناسب احتياجاتهم، ونعرف أين نعرضه وكيف نصل إليهم", 1]], "o": ["يوضح المقصود بخطة المشروع وأهميتها في نجاح المشروعات الأسرية.", "يكمل خطة مشروع أسرة شمساء (الاسم، والأدوات، والتكلفة المتوقعة، والمستهلكين) مستعينًا ببيانات النص.", "يقدّر أهمية التخطيط وتوزيع المهام بين أفراد الأسرة."]}, {"t": "الدرس الثالث: أثر مشروع أسرتي", "u": "", "q": [["ما الطريقة التي استُخدمت في لوحة «اكتشف الفرق» لجذب الناس إلى شراء المنتج؟", "الإعلان عن تخفيضات بنسبة 30% على الإلكترونيات", 0], ["ماذا اقترح ناصر على أسرته لتوسيع منافذ بيع مشروعهم؟", "أن يسوّقوا لمشروعهم بطرق إلكترونية وغير إلكترونية في مختلف أنحاء سلطنة عمان", 1], ["أكمل: الإعلان الذي يوضح طبيعة المنتج بأسلوب ترويجي جذاب يسمى ........", "التسويق", 0], ["اذكر طريقتين للتسويق الإلكتروني، وطريقتين للتسويق غير الإلكتروني.", "إلكتروني: مواقع التواصل الاجتماعي، والبريد الإلكتروني (ويقبل: رسائل الهاتف). غير إلكتروني: الصحف، واللوحات الإعلانية (ويقبل: المطويات)", 1], ["أي طريقة تسويق تختار لبخور أسرة شمساء ليصل إلى أكبر عدد من الناس؟ ولماذا؟", "مواقع التواصل الاجتماعي مثلًا؛ لأنها تصل إلى عدد كبير من الناس داخل عمان وخارجها بسرعة وبتكلفة قليلة (وتقبل إجابات أخرى معللة)", 2], ["ما اسم منتج مجموعتكم؟ وما الطريقة التي اخترتموها لتسويقه؟", "بحسب المجموعة، مثل: «سلة الخير»، ونسوّقه بلوحة إعلانية ومنشور مقترح لمواقع التواصل", 0], ["ما الذي جعل طريقة تسويق المجموعة الفائزة مؤثرة؟", "وضوح المعلومات، وجاذبية التصميم، وابتكار الفكرة، ومناسبتها للفئة المستهدفة", 1], ["كيف يسهم المشروع الأسري في الاقتصاد الوطني العماني؟", "يزيد تنوع المنتجات المحلية، وينشر ثقافة الإنتاج بدل الاستهلاك، ويزيد دخل الأسر، ويعرّف العالم بالمنتجات العمانية", 2], ["اذكر أثرًا واحدًا للمشروع الأسري في الفرد.", "الشعور بالفخر والاعتزاز (ويقبل: زيادة دخله الخاص)", 0], ["وضح أثر المشروع الأسري في الأسرة وفي الوطن.", "الأسرة: زيادة دخلها المادي وتعزيز المشاركة المجتمعية. الوطن: تنوع المنتجات المحلية، وإشاعة ثقافة الإنتاج، والمساهمة في تعزيز الاقتصاد الوطني العماني", 1], ["كيف يمكن أن يصل أثر مشروع أسرة شمساء إلى العالم؟", "بتسويقه إلكترونيًا وتبادل المنتجات مع بقية دول العالم، فيتعرف العالم بالمنتجات العمانية المحلية", 2]], "o": ["يوضح المقصود بالتسويق وأهميته في نجاح المشروعات الأسرية.", "يصنف طرائق التسويق إلى إلكترونية وغير إلكترونية.", "يختار طريقة تسويق مناسبة لمنتج أسري ويعلل اختياره."]}, {"t": "الدرس الأول: أنا متطوع", "u": "", "q": [["أين اجتمع أفراد الحي؟ ولماذا؟", "في المجلس العام؛ لمناقشة أهمية تطوير حديقة الحي واقتراح أعمال تطوعية تسهم في ذلك", 0], ["اذكر ثلاثة من الحضور وما يجيده كل منهم.", "سعيد: الكهرباء، وسالم: النجارة، وراشد: البناء (ويقبل: العم صالح: ورشة الحديد والألمنيوم، وأم ناصر وسعاد: التشجير)", 1], ["لماذا يعد اجتماع أفراد الحي في المجلس خطوة مهمة قبل العمل التطوعي؟", "لأنه يتيح تبادل الأفكار ومعرفة ما يجيده كل فرد، فيُقترح لكل منهم عمل يناسبه ويتعاونون في تطوير الحديقة", 2], ["صواب أم خطأ: العمل التطوعي يكون مقابل أجر مادي.", "خطأ؛ فهو عمل خير يُبذل عن رغبة دون مقابل مادي", 0], ["اقترح عملًا تطوعيًا في الحديقة لكل من سالم النجار وسعيد المتخصص في الكهرباء.", "سالم: صناعة الطاولات والكراسي. سعيد: إصلاح المصابيح والتوصيلات الكهربائية", 1], ["ميّز بين العمل التطوعي الفردي والجماعي بمثال لكل منهما من حيك.", "فردي: أن أسقي أشجار الحديقة بنفسي. جماعي: أن يشترك أفراد الحي في تنظيف الحديقة وإعادة تشجيرها", 2], ["ما المرفق الذي زارته مجموعتك؟ وما المشكلة التي لاحظتموها فيه؟", "بحسب المجموعة، مثل: ساحة المدرسة، وفيها أوراق ومخلفات متناثرة", 0], ["كيف اخترتم الحل الأنسب من بين الحلول المقترحة؟", "وازنّا بين الحلول من حيث سهولة التنفيذ، والتكلفة، وقدرتنا على تنفيذه بأنفسنا، ودوام أثره", 2], ["أكمل عناصر عجلة حل المشكلات: اسم المرفق، والمشكلة، و........، والحل الأنسب.", "الحلول المقترحة للمشكلة", 0], ["لماذا يعد إصلاح مرفق في المدرسة عملًا تطوعيًا؟", "لأنه عمل خير نقدمه للمدرسة برغبتنا دون مقابل مادي، ويستفيد منه الجميع", 1]], "o": ["يوضح المقصود بالعمل التطوعي ونوعيه الفردي والجماعي.", "يقترح عملًا تطوعيًا لكل فرد من أفراد الحي بحسب ما يجيده لتطوير الحديقة.", "يقدّر قيمة المبادرة إلى عمل الخير في الحي دون انتظار مقابل."]}, {"t": "الدرس الثاني: أخطط للعمل التطوعي", "u": "", "q": [["لماذا كان الشارع الآخر حزينًا؟", "لأنه غير نظيف؛ بسبب عدم التنظيم والتخطيط وتوزيع العمل، فقد اهتم أفراد الحي بشارع وأهملوا الآخر", 0], ["اذكر ثلاثة من مظاهر حاجة حديقة الحي إلى التطوير.", "مقاعد قديمة وأخشاب بالية، ومصابيح مكسورة وأخرى لا تعمل، وأشجار ذابلة (ويقبل: طرق بها شقوق وحفر، وألعاب قديمة)", 1], ["من يتولى مهمة إعادة رصف ممرات الحديقة؟ ولماذا؟ وما الأدوات التي يحتاج إليها؟", "راشد؛ لأنه يجيد البناء، ويحتاج إلى رمل وإسمنت وماء وحجارة", 2], ["حدد المسؤول عن كل مهمة: إصلاح مصابيح الحديقة، صناعة الطاولات.", "إصلاح المصابيح: سعيد. صناعة الطاولات: سالم", 0], ["لماذا نوزع مهام العمل التطوعي بحسب ما يجيده كل فرد؟", "ليؤدي كل فرد ما يتقنه، فيُنجز العمل بجودة ودقة وفي وقت أقل", 1], ["ما المهمة التي كُلفت بها في فريق العمل؟", "بحسب توزيع المجموعة، مثل: جمع المخلفات، أو سقي النباتات، أو تثبيت اللوحات التوعوية", 0], ["صواب أم خطأ: يكفي أن نبدأ العمل التطوعي دون توزيع للمهام.", "خطأ؛ فعدم توزيع المهام يؤدي إلى العشوائية وإهمال بعض الأعمال", 0]], "o": ["يستنتج أهمية التنظيم والتخطيط وتوزيع المهام في العمل التطوعي.", "يحدد لكل مهمة في تطوير حديقة الحي مسؤولية تنفيذها والأدوات المقترحة لها.", "يخطط مع مجموعته لعمل تطوعي في المدرسة مستفيدًا من الحل الأنسب الذي توصلوا إليه."]}, {"t": "الدرس الثالث: تطوعي حياة", "u": "", "q": [["ماذا نظم أفراد الحي في الحديقة بعد تطويرها؟", "وليمة جماعية", 0], ["قارن بين حال حديقة الحي قبل العمل التطوعي وبعده في أمرين.", "قبل: أشجار ذابلة وطرق بها شقوق وحفر. بعد: ظلال وافرة وشجر، وطرق سالكة دون حفر (ويقبل: المصابيح والألعاب)", 1], ["ما المقصود بقوله تعالى: «فمن تطوع خيرًا فهو خير له»؟ وكيف يظهر ذلك في قصة ناصر؟", "أن من يعمل الخير تطوعًا يعود عليه بالخير والثواب من الله تعالى؛ وقد عاد على ناصر وأفراد الحي بالسعادة وبحديقة جميلة يستمتعون بها", 2], ["اذكر فائدتين للعمل التطوعي على ناصر.", "السعادة، والثواب (ويقبل: التواصل، واستثمار الوقت)", 0], ["اذكر فائدتين للعمل التطوعي على أفراد الحي.", "التعاون، وحب الوطن (ويقبل: حل المشكلات، وانتشار الوعي)", 1]], "o": ["يستنتج فوائد العمل التطوعي على ناصر وعلى أفراد الحي من خلال الرموز وسحابة الكلمات.", "يكتب مع مجموعته رسالة إلى مجلس أولياء الأمور تتضمن أفكارًا تطويرية لأحد مرافق المدرسة وأثرها الإيجابي.", "يقدّر أهمية استثمار ما يجيده أفراد الحي في العمل التطوعي."]}]};</script>
