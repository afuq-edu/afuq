<script>window.QZ={"g": "5", "gn": "الخامس", "s": "english", "sn": "اللغة الإنجليزية", "L": [{"t": "Lesson 1: Welcome back (story and freetime activities)", "u": "", "q": [["Who are the members of the Discovery Team?", "Sami, Fatma, Lottie and Bo", 0], ["Look at the week planner. What does Sami do on Mondays?", "On Mondays, Sami goes to Chess Club", 1], ["Why does Bo say \"You are all very busy!\"?", "Because the children have activities on most days (lessons, clubs and visits), so it is hard to find free time", 2], ["Complete: There’s a new girl in the school. She’s from ______.", "Egypt", 0], ["Look at the week planner. What do Fatma and Lottie do on Tuesdays?", "On Tuesdays, Fatma and Lottie have a swimming lesson", 1]], "o": ["By the end of the period, students will be able to:", "Identify the Discovery Team characters and understand the main events of the story \"Welcome back\".", "Ask and answer about weekly freetime activities using a week planner (On Sundays, Sami plays football.).", "Describe what a person in a picture is doing using the present continuous."]}, {"t": "Lesson 2: Grammar – Present simple with when / before / after", "u": "", "q": [["Complete: I have a shower ______ I go to school.", "before", 0], ["Put the words in order: gets home / she does her homework / When Arwa", "When Arwa gets home, she does her homework", 1], ["What is the difference between \"I watch TV after I do my homework\" and \"I watch TV before I do my homework\"?", "After: homework comes first, then TV. Before: TV comes first, then homework", 2], ["Complete with before or after: I wash my hands ______ I eat.", "before", 0], ["Rewrite: I play tennis and then I go home. After I ______, I go home.", "play tennis", 0], ["Rewrite with When: He goes to the library and reads a book there.", "When he goes to the library, he reads a book there", 1], ["Rewrite with Before: My sister does her homework and then she watches TV.", "Before my sister watches TV, she does her homework", 2], ["Choose: ______ I get home, I always do my homework.", "When", 0, ["Before"]], ["Rewrite with After: We have lunch and then we go to the park.", "After we have lunch, we go to the park", 1], ["Rewrite with before: On Mondays, you have Maths first and then you have Art.", "On Mondays, before you have Art, you have Maths", 2]], "o": ["By the end of the period, students will be able to:", "Identify sentences from the Welcome story in a picture.", "Use before, after and when to show the order of daily activities.", "Ask and answer about their own routines using before, after and when."]}, {"t": "Lesson 3: Vocabulary – Appearance", "u": "", "q": [["Who has got a beard in the poem?", "Dad", 0], ["Put the words in order: hair / curly / long / dark → She’s got …", "She’s got long, dark, curly hair", 1], ["Describe Laith from the poem.", "He’s got a moustache and his hair is fair", 2], ["Write the opposite: curly hair – ______ hair.", "straight", 0], ["Describe Thuriya.", "She’s very tall. She’s got long, dark, curly hair", 1]], "o": ["By the end of the period, students will be able to:", "Name hair and face features (curly, straight, dark, fair, long, short hair, a beard, a moustache).", "Describe people in the poem using the correct word order (She’s got long, dark, curly hair.).", "Write short sentences or a short poem about the appearance of family members."]}, {"t": "Lesson 1: Vocabulary – Personality adjectives", "u": "", "q": [["Which adjective describes a person who always says \"please\" and \"thank you\"?", "polite", 1], ["Why does a waiter need to be polite and friendly?", "Because he talks to many customers every day and needs to be nice to them", 2], ["Match: shy – confident; lazy – ______.", "hard-working", 0], ["Which prefix makes the opposite of \"friendly\"?", "un- (unfriendly)", 0], ["\"She’s got all her things in order.\" Which adjective is it?", "tidy", 1], ["Is \"mean\" made with un-? What is its opposite?", "No. Its opposite is kind", 2], ["Write the opposite: confident – ______.", "shy", 0], ["Match: \"He always says please and thank you.\" → ______", "polite", 1]], "o": ["By the end of the period, students will be able to:", "Recognise and say the twelve personality adjectives (shy, confident, lazy, hard-working, friendly, unfriendly, kind, mean, polite, rude, tidy, untidy).", "Match personality adjectives to people in a picture and to their opposites.", "Complete sentences about the personality that different jobs need."]}, {"t": "Lesson 2: Story – Talent show", "u": "", "q": [["Who is great at karate?", "Tameem", 0], ["Why does Lottie give Fatma a banana?", "Because Fatma didn’t eat anything after lunchtime and she needs energy; you need to eat something every three hours", 1], ["Fatma looks confident on stage. How did she feel before the show? How do you know?", "She was nervous: she said \"I’m feeling worse and worse\" and Lottie said \"Don’t worry, Fatma!\"", 2], ["The cat is very friendly.", "True", 0, 1], ["Put in order: a) The cat runs onto the stage. b) Fatma eats a banana. c) Everyone says Fatma is the best.", "b, a, c", 1], ["Who helps Fatma on stage, and what does this show about him?", "Bo helps her; it shows that he is kind and a good friend", 2], ["Is the cat’s name Rayner?", "No, it isn’t. His name is Bailey", 0], ["Correct: Tameem is very shy when he’s on stage.", "Tameem is very confident when he’s on stage", 1], ["Which sentence helps a friend: \"Juggling is too difficult for you.\" or \"You’ve worked very hard! You can do it!\"? Why?", "The second one, because it makes the friend feel happy and confident", 2], ["Complete: Sami and Lottie meet a friendly ______ at the talent show.", "cat", 0], ["Why does Bo help Fatma?", "Because she has a problem: she can’t get the balls out", 1]], "o": ["By the end of the period, students will be able to:", "Listen to and read the story and identify the main characters and events.", "Order events from the story correctly.", "Act out part of the story with expression in a group."]}, {"t": "Lesson 3: Grammar – Comparative and superlative adjectives", "u": "", "q": [["big → bigger → ______", "the biggest", 0], ["Complete: Rahaf is ______ (good) than me at schoolwork.", "better", 1], ["Why do we say \"more hard-working\" but \"kinder\"?", "Because hard-working is a long adjective (more / the most) and kind is a short adjective (-er / -est)", 2], ["Choose: My mum is (short / shorter) than me.", "shorter", 0], ["Write the superlative: Basil is the ______ (bad) boy in the whole school.", "worst", 1], ["Correct the mistake: Hazim is more tidy than Zainab.", "Hazim is tidier than Zainab", 2], ["curly → ______ (comparative)", "curlier", 0], ["Choose: She always gets (best / better) marks in exams than me.", "better", 1], ["shy → shier → ______", "the shiest", 0], ["Complete: This film is ______ (bad) than that film because it’s very boring.", "worse", 1]], "o": ["By the end of the period, students will be able to:", "Identify comparative and superlative forms in sentences from the story.", "Form comparatives and superlatives of short, long and irregular adjectives.", "Complete a text and ask questions using comparatives and superlatives."]}, {"t": "Lesson 4: Vocabulary and Grammar – Hobbies and be good at", "u": "", "q": [["Complete: I’m good at ______ (bake) cakes.", "baking", 1], ["Correct: She’s terrible at throw a ball.", "She’s terrible at throwing a ball", 2], ["Match: fix – toys; do – ______.", "experiments", 0], ["Match: count – ______", "fingers", 0, ["a cake"]], ["Put in order from best to worst: good at, terrible at, great at, not very good at.", "great at, good at, not very good at, terrible at", 2], ["Complete: throw a ______", "ball", 0], ["Answer with great at: Is Thamer good at throwing a ball a long way?", "Yes, he is. He’s great at throwing a ball a long way", 1]], "o": ["By the end of the period, students will be able to:", "Say and recognise eight hobby phrases (count, spell, do experiments, bake a cake, throw a ball, fix toys, juggle, make a pizza).", "Sing the song and talk about ability using be good at + verb-ing.", "Ask and answer about what they are great at, good at, not very good at and terrible at."]}, {"t": "Lesson 5: Culture – Good manners around the world", "u": "", "q": [["In the UK, what do people say to the bus driver when they get off?", "Thank you", 0], ["Where is it better to give a gentle handshake?", "In some parts of Asia", 1], ["Why is it rude in China to finish everything on your plate?", "Because it means you didn’t get enough food", 2], ["In Oman, you take off your shoes when you go inside someone’s house.", "True", 0, 1], ["Where is it rude to laugh with your mouth wide open?", "In Japan", 1], ["Complete: It’s polite ______ say \"thank you\".", "to", 0], ["Change into advice: listen to older people.", "You should listen to older people", 1], ["Is \"wearing shoes inside a house\" good or bad manners in Oman? Write it as a rule.", "Bad manners. In Oman, you must take off your shoes inside a house", 2]], "o": ["By the end of the period, students will be able to:", "Read about good manners in different countries and identify differences from Oman.", "Answer questions about manners in the UK, Oman, China and Japan.", "Compare good manners in Oman with another country."]}, {"t": "Lesson 6: English in action – Describing people", "u": "", "q": [["Complete: What’s he ______? He’s very friendly.", "like", 0], ["Which word has the /eɪ/ sound: hair, chair, eight?", "eight", 1], ["Which question is about personality: \"What’s he like?\" or \"What does he look like?\"", "What’s he like? (What does he look like? is about appearance.)", 2], ["Who is Arthur?", "A new boy in the class with fair hair; he’s very friendly and good at hockey", 0], ["Put the dialogue in order: What’s she like? / Who’s that girl over there? / She’s really kind.", "Who’s that girl over there? – What’s she like? – She’s really kind", 1]], "o": ["By the end of the period, students will be able to:", "Understand a dialogue in which children describe a new student.", "Use functional language to describe people (Who’s that boy over there? What’s he like? He seems very …).", "Pronounce the sounds /eə/ (fair, hair) and /eɪ/ (today, eight) in a tongue twister."]}, {"t": "Lesson 7: Skills – Reading: a police report", "u": "", "q": [["What kind of text is it: a blog, a report or a magazine article?", "A report", 0], ["What is Mr Parker’s job?", "He’s a vet", 1], ["Why did Mr Parker need money?", "His wife is ill and he needs to pay for an expensive operation", 2], ["Where was the diamond?", "In a glass box at Mrs Morgan’s house", 0], ["Correct: Mr Allen is an Art student.", "Mr Allen is a Science student", 1]], "o": ["By the end of the period, students will be able to:", "Identify the type of text (a report).", "Scan the report for details about the suspects.", "Correct false sentences using information from the text."]}, {"t": "Lesson 8: Skills – Listening, speaking and writing a description", "u": "", "q": [["How old is Maite’s granny?", "She’s 72 years old", 0], ["What doesn’t Maite’s granny like?", "She doesn’t like watching cooking shows or films about cooks on TV", 1], ["Find the linking word and its use: \"She always makes me delicious sushi because she’s great at making sushi.\"", "because – it gives a reason", 2], ["Join with \"but\": She likes cooking. She doesn’t like cooking shows.", "She likes cooking, but she doesn’t like cooking shows", 1], ["Choose: What’s more delicious: chocolate (or / so) a cupcake?", "or", 0], ["Complete: This room is very untidy, ______ be careful!", "so", 1], ["What do we use at the start of each sentence?", "A capital letter", 0], ["Join with because: I like my granny. She is very kind.", "I like my granny because she is very kind", 1]], "o": ["By the end of the period, students will be able to:", "Listen for physical descriptions and identify the right people.", "Talk about a family member’s appearance and personality.", "Read a model description and find the linking words and, or, but, so, because."]}, {"t": "Lesson 9: Review", "u": "", "q": [["Complete: If you don’t do any work, you are ______.", "lazy", 0], ["Complete: My sister is ______ (tidy) than I am.", "tidier", 1], ["Correct: That boy is the most mean boy in the school.", "That boy is the meanest boy in the school", 2], ["Write the opposite: polite – ______.", "rude", 0], ["Complete: My toy is broken! But I’m ______ fixing toys!", "good at", 1]], "o": ["By the end of the period, students will be able to:", "Use Unit 1 vocabulary (personality adjectives and hobbies) in context.", "Use comparatives, superlatives and be good at correctly.", "Assess their own progress in Unit 1."]}, {"t": "Lesson 10: Get ready for A1 Movers", "u": "", "q": [["Choose: My brother always says ______ and thank you.", "please", 0, ["yes", "why"]], ["Choose: He is shorter than me, but he is not the ______ person in our family.", "shortest", 1, ["most short", "shorter"]], ["Why is \"He’s tall with long, black, curly hair.\" the best answer to \"What does he look like?\"?", "Because the question asks about appearance, not personality or hobbies", 2], ["Choose: He is good at ______ experiments.", "doing", 0, ["having", "taking"]], ["Choose the best answer to \"What’s he like?\": A He likes making pizza. B He’s very polite and he seems very confident.", "B", 1]], "o": ["By the end of the period, students will be able to:", "Choose the right words to complete a text (A1 Movers Reading and Writing Part 4).", "Listen and choose the correct picture (A1 Movers Listening Part 4).", "Answer personal questions about appearance, personality and abilities (A1 Movers Speaking Part 4)."]}, {"t": "Fun corner (optional lesson)", "u": "", "q": [["Square 1: Are you … (confident) than your best friend?", "more confident", 0], ["Square 28: Which is the … (hot) month in the year?", "hottest", 1], ["Answer square 3 with a reason: Is it better to be polite or rude?", "It’s better to be polite because people like polite people", 2], ["easy → ______ (comparative)", "easier", 0], ["Complete: Is fixing toys … (difficult) than doing experiments?", "more difficult", 1]], "o": ["By the end of the period, students will be able to:", "Form comparatives and superlatives in questions.", "Ask and answer opinion questions and give reasons with because.", "Evaluate choices and justify their opinions."]}, {"t": "Graded readers 1 and 2", "u": "", "q": [["Which bowl is the biggest?", "The red bowl", 0], ["Who is more confident, Arwa or Areej?", "Arwa", 1], ["Why is the cake so big?", "They counted badly: the recipe was for eight people, but they baked a cake for eighty", 2], ["Circle the foods for the recipe: milk, eggs, sugar, butter, bananas, flour.", "eggs, sugar, butter, flour", 0], ["Complete: The blue bowl is ______ than the red bowl.", "smaller", 1], ["What sport are the boys playing?", "Tennis", 0], ["What is Hisham good at at the start of the story?", "Painting and doing experiments", 1], ["Why does Hisham’s ball always hit the net?", "Because he isn’t good at hitting the ball with his racquet yet", 2], ["Who is the best at tennis in the class?", "Hamed", 0], ["Sort: shy, kind, polite, hard-working → Hisham / Hamed.", "Hisham: shy, hard-working. Hamed: kind, polite", 1], ["Write the two main ideas of the story.", "Friends help each other; with help and practice, you can become good at something", 2]], "o": ["By the end of the period, students will be able to:", "Predict what a story is about from the title and pictures.", "Scan the text for specific information (foods, bowls, number of people).", "Evaluate the story and suggest a change."]}, {"t": "Lesson 1: Vocabulary – Technology", "u": "", "q": [["You use it to listen to music. What is it?", "a CD player", 1], ["Which is the odd one out: email, letter, mouse? Why?", "mouse – it is part of a computer; email and letter are messages", 2], ["A small telephone you carry with you is a ______.", "mobile phone", 0], ["Complete: I ______ my grandma on the phone every Friday.", "call", 1, ["carry", "study"]], ["You touch the letters on it to write. What is it?", "a keyboard", 0], ["Which verb goes with \"the doctor\": carry, call or study?", "call", 1], ["You write this with a pen and some paper. What is it?", "a letter", 0], ["Complete: She ______ her school bag every day.", "carries", 1, ["calls"]]], "o": ["By the end of the period, students will be able to:", "Recognise and say twelve technology words (computer, keyboard, mouse, tablet, email, letter, telephone, mobile phone, CD player, carry, call, study).", "Find the words in a picture and identify objects from spoken descriptions.", "Describe an object for a partner to guess."]}, {"t": "Lesson 2: Story – Then and now", "u": "", "q": [["What is Sami’s project about?", "How things were different ten years ago and more", 0], ["What did Sami’s parents have ten years ago: a tablet or a computer?", "A computer (they didn’t have a tablet)", 1], ["Why couldn’t you walk around with an old telephone?", "Because it stayed in the house; it wasn’t mobile", 2], ["What did people in big houses use like a phone 100 years ago?", "Speaking tubes", 0], ["What do the children use to make their speaking tube?", "Two cans, a hose and some string", 1], ["Write \"Hello Sami\" in the Discovery Team code.", "Ellohay Amisay", 2], ["Who says \"Let’s use this code mum told me about\"?", "Lottie", 0], ["Correct: Sami’s parents had a tablet ten years ago.", "They didn’t have a tablet; they had a computer", 1], ["Give one example of a creative idea from the story.", "Making a speaking tube with cans, a hose and string / making a secret code", 2], ["Correct: The children make a speaking tube with two bottles.", "They make it with two cans", 0], ["Correct: Over 100 years ago, people used a mobile phone to talk to each other.", "They used speaking tubes", 1]], "o": ["By the end of the period, students will be able to:", "Listen to and read the story and identify the different types of phone.", "Match sentence halves about the story.", "Act out the story in a group."]}, {"t": "Lesson 3: Grammar – Past simple", "u": "", "q": [["What is the past simple of \"have\"?", "had", 0], ["Make a question: you / have a phone / ten years ago", "Did you have a phone ten years ago?", 1], ["Why do we write \"tried\" with -ied?", "Because the verb ends in a consonant + y, so y changes to i before -ed", 2], ["play → ______", "played", 0], ["Complete: Faisal’s dad ______ (go) to the beach with his family.", "went", 1], ["Make it negative: I used a tablet.", "I didn’t use a tablet", 0], ["What is the past simple of \"wear\"?", "wore", 1], ["Correct: They didn’t drank water.", "They didn’t drink water", 2], ["drink → ______", "drank", 0], ["Complete: She ______ (go) to the lake. She ______ (not go) to the river.", "went; didn’t go", 1]], "o": ["By the end of the period, students will be able to:", "Identify past simple forms in sentences from the story.", "Form regular and irregular past simple verbs and questions (Did you …? Yes, we did.).", "Retell a short story using past simple verbs."]}, {"t": "Lesson 4: Vocabulary and Grammar – Verbs and could / couldn’t", "u": "", "q": [["Complete: When I was two, I ______ hold a pen.", "could", 1], ["Answer: Could you send an email when you were three?", "No, I couldn’t", 2], ["Match: win – a race; post – ______.", "a letter", 0], ["Make a question: you / tie a shoelace / when you were four", "Could you tie a shoelace when you were four?", 1], ["Unscramble: niw a crae", "win a race", 0], ["Correct: She could sends an email.", "She could send an email", 2], ["Unscramble: dloh a pne", "hold a pen", 0], ["Write: Rawan / post a letter (no) / make a face (yes)", "Rawan couldn’t post a letter, but she could make a face", 1]], "o": ["By the end of the period, students will be able to:", "Say eight verb phrases (post a letter, send an email, make a face, tell a story, hold a pen, win a race, make a sandwich, tie a shoelace).", "Identify could and couldn’t in a song.", "Ask and answer about abilities when they were younger."]}, {"t": "Lesson 5: Culture – World museums", "u": "", "q": [["Where is the Natural History Museum?", "In London, England", 0], ["In which museum can you learn about robot design?", "The Shanghai Museum of Science and Technology", 1], ["Why does the floor shake in one room of the Natural History Museum?", "To show visitors what an earthquake feels like", 2], ["Where is the Oman Across the Ages Museum?", "In the Wilayat of Manah, Oman", 0], ["Complete: Bait Al Zubair is in the city of ______.", "Muscat", 0], ["Which speaking tip helps the class hear you?", "Speak loudly and clearly", 2], ["Is Bait Al Zubair in a modern or a traditional building?", "A traditional building", 0]], "o": ["By the end of the period, students will be able to:", "Read about three museums and identify what visitors can see and do.", "Answer questions about which museum offers which experience.", "Choose a museum to visit and justify their choice."]}, {"t": "Lesson 6: English in action – Asking for information", "u": "", "q": [["Which museum does Jake want to visit?", "The National Museum", 0], ["Which sound does \"visited\" end with: /t/, /d/ or /ɪd/?", "/ɪd/", 2], ["When is the National Museum open?", "Saturday to Thursday, from 10 am until 5 pm", 0], ["Sort: looked, cried, needed → /t/, /d/, /ɪd/.", "looked /t/, cried /d/, needed /ɪd/", 2]], "o": ["By the end of the period, students will be able to:", "Understand a dialogue in which a boy asks for information about a museum.", "Ask for and give information (I’d like some information about …, What time does it open and close?).", "Pronounce past simple -ed endings as /ɪd/, /t/ and /d/."]}, {"t": "Lesson 7: Skills – Reading: a science blog", "u": "", "q": [["Who invented the cardboard box?", "Robert Gair, a Scottish engineer", 0], ["Which paragraph is \"History of cardboard\"?", "Paragraph 2", 1], ["Why does a house of cards work with triangles but not with squares?", "Because the triangle is the strongest shape; it can carry a lot", 2], ["When did Robert Gair invent the cardboard box?", "In 1879", 0], ["What happened for the first time in 1906?", "A food company put the name and a picture of the food on the outside of a cereal box", 1]], "o": ["By the end of the period, students will be able to:", "Predict the content of a text from its title.", "Match headings to paragraphs.", "Explain why cardboard is strong using information from the text."]}, {"t": "Lesson 8: Skills – Listening, speaking and writing a report", "u": "", "q": [["Where did Osama go?", "The Louvre Abu Dhabi", 0], ["About how many paintings does it have?", "Around 700", 1], ["Why does a report about a visit start with the date?", "To tell the reader when the visit happened", 2], ["Complete the question: Where ______ you go?", "did", 0], ["What is special about the Louvre Abu Dhabi?", "The building is very modern and beautiful, with lots of light", 1], ["Match: \"On 23 June, I visited the British Museum.\" → Which heading?", "When and where did you go?", 0], ["Which punctuation mark do we use for interesting facts?", "An exclamation mark (!)", 1], ["Complete: I learnt a lot ______ Oman’s history.", "about", 1]], "o": ["By the end of the period, students will be able to:", "Listen and match children to the places they visited.", "Ask and answer about a visit (Where did you go? What did you see?).", "Identify the parts of a report about a visit."]}, {"t": "Lesson 9: Review", "u": "", "q": [["What is the past simple of \"carry\"?", "carried", 0], ["Complete: My brother ______ (not study) Science last year.", "didn’t study", 1], ["Correct: Did you saw the doctor yesterday?", "Did you see the doctor yesterday?", 2], ["Write: Arwa / tell a story / when she was six (yes)", "Arwa could tell a story when she was six", 1], ["Why does the floor shake in the Natural History Museum? (Challenge question)", "To show visitors what an earthquake feels like", 2]], "o": ["By the end of the period, students will be able to:", "Find Unit 2 vocabulary in a picture and answer questions.", "Use the past simple and could / couldn’t correctly.", "Assess their own progress in Unit 2."]}, {"t": "Lesson 10: Get ready for A1 Movers", "u": "", "q": [["Complete: I use my computer to send ______.", "emails", 0], ["Complete: I want to win a ______.", "race", 1], ["Complete: Sometimes I listen to ______ on my computer.", "music", 0]], "o": ["By the end of the period, students will be able to:", "Say which picture is different and explain why (Speaking Part 3).", "Choose words from a box to complete a text (Reading and Writing Part 3).", "Listen and write words to complete notes (Listening Part 2)."]}, {"t": "Fun corner (optional lesson)", "u": "", "q": [["Decode: 5 13 1 9 12", "email", 0], ["Make the phrase: tie + ______ (a shoelace / a race)", "tie a shoelace", 1], ["Write \"mouse\" in the number code.", "13 15 21 19 5", 2], ["Decode: 3 4", "CD", 0], ["Write \"letter\" in the number code.", "12 5 20 20 5 18", 2]], "o": ["By the end of the period, students will be able to:", "Decode number messages and spell technology words.", "Make verb phrases and ask \"Could you … when you were six?\".", "Write a coded message for a partner to read."]}, {"t": "Graded readers 1 and 2", "u": "", "q": [["Who did Ivy visit the museum with?", "Her mum", 0], ["What could you do on the old computer?", "You could play games, but you couldn’t send an email", 1], ["How were very old telephones different from newer ones?", "They didn’t have buttons", 2], ["When did Ivy visit the museum?", "Last Saturday", 0], ["Why does Ivy want to buy a postcard?", "To post it to her grandad", 1], ["Where did Khalid’s dad study Science?", "In Britain", 0], ["What did Khalid’s dad wear in the special race?", "A penguin costume", 1], ["Why couldn’t Khalid’s dad call his friends at the end of the race?", "Because they didn’t have mobile phones then", 2], ["Could Khalid’s dad run quickly in the costume?", "No, he couldn’t. He could run slowly", 0], ["Who tied Khalid’s dad’s shoelace?", "His friend", 1], ["Why do you think winning wasn’t important to Khalid’s dad?", "Because he had fun, he got a medal and his photo was in the newspaper", 2]], "o": ["By the end of the period, students will be able to:", "Predict what happens in a story from the title and pictures.", "Answer questions about what people can do at the Technology Museum.", "Give an opinion on letters and emails with a reason."]}, {"t": "Lesson 1: Vocabulary – Space", "u": "", "q": [["Astronauts wear it in space. What is it?", "a spacesuit", 1], ["Is a satellite something people make or a natural object?", "Something people make", 2], ["Which one must you never look at: the Sun, the Moon or a star?", "the Sun", 1], ["There are eight ______ in our solar system.", "planets", 0], ["Our planet has got a satellite called the ______.", "Moon", 1], ["Why is the Sun called a star?", "Because it is a big, very hot ball that gives light, like the stars at night", 2], ["We live on planet ______.", "Earth", 0], ["It’s fun to watch the sky at night with a ______.", "telescope", 1]], "o": ["By the end of the period, students will be able to:", "Recognise and say twelve space words (Sun, Moon, Earth, planet, star, solar system, telescope, comet, rocket, space station, spacesuit, satellite).", "Classify space words into groups (things you can see with a telescope, things you must not look at, things people make).", "Give clues about a space word for a partner to guess."]}, {"t": "Lesson 2: Story – The Science Fair", "u": "", "q": [["What are the children making for the Science Fair?", "A model of the solar system", 0], ["How far is the Moon from the Earth?", "About 380,000 kilometres", 1], ["Why is brushing your teeth in space different?", "Because everything is weightless and water floats away", 2], ["Correct: There are three challenges for the Science Fair.", "There are two challenges for the Science Fair", 0], ["Correct: The Moon is about a thousand kilometres from the Earth.", "The Moon is about 380,000 kilometres from the Earth", 1], ["How many projects do the children make?", "The children make two projects", 0], ["What should you do when something doesn’t go well?", "Try again later and think about why it didn’t go well", 2], ["Who breaks the model?", "Bo", 0], ["What things do the children use in their final project?", "A bottle of water, a straw, toothpaste and a toothbrush", 1]], "o": ["By the end of the period, students will be able to:", "Listen to and read the story and identify the space objects in it.", "Correct false sentences about the story.", "Suggest how astronauts do everyday things in a weightless place."]}, {"t": "Lesson 3: Grammar – will / won’t", "u": "", "q": [["What is the full form of \"I’ll\"?", "I will", 0], ["Complete: It’s Hilal’s birthday tomorrow. I ______ get him a present later.", "will (’ll)", 1], ["Make it negative: We will have time.", "We won’t have time", 2], ["Choose: I (will / won’t) buy a book; I think I’ll get him a game.", "won’t", 0], ["Answer: Will you wear trainers to school tomorrow? (no)", "No, I won’t", 0], ["Complete: Shahad ______ (not wear) her new jeans.", "won’t wear", 1], ["Correct: He will sends a letter.", "He will send a letter", 2], ["Write the short answer: Will they study English tomorrow? (yes)", "Yes, they will", 0], ["Complete: Azza and Badriya ______ (bake) a rocket cake.", "will bake", 1]], "o": ["By the end of the period, students will be able to:", "Identify sentences with will and won’t in the story.", "Use will / won’t with time words to talk about decisions and plans.", "Plan a surprise party in a group and report the plan."]}, {"t": "Lesson 4: Vocabulary and Grammar – Big numbers and How …?", "u": "", "q": [["Say this number: 50,000.", "fifty thousand", 0], ["Complete: How ______ is the Sea of Oman? It’s 3,700 metres deep.", "deep", 1], ["Write in words: 100,000", "a hundred thousand", 2], ["Write in numbers: five thousand.", "5,000", 0], ["Answer: How far is the Moon from the Earth?", "It’s 384,400 kilometres away", 2], ["Order from the biggest: 5,000 / 1,000,000 / 500", "1,000,000; 5,000; 500", 0], ["Choose the adjective: How ______ is it from Muscat to Salalah?", "far", 1, ["tall"]], ["How wide is the Moon?", "It’s 3,474 kilometres wide", 2], ["Write in words: 10,000", "ten thousand", 0], ["Complete: How ______ is the Pacific Ocean at its deepest point?", "deep", 1]], "o": ["By the end of the period, students will be able to:", "Say big numbers from a hundred to a million.", "Ask and answer How …? questions about size and distance (How deep is the Sea of Oman?).", "Read and say numbers like 7,650 and 700,500 correctly."]}, {"t": "Lesson 5: Culture – Frankincense Land", "u": "", "q": [["Where do many frankincense trees grow?", "In Wadi Dawkah in the south of Oman", 0], ["What did people use frankincense for in the past?", "For perfume and for medicine", 1], ["Why did Al Balid and Khawr Ruri become important ports?", "Because boats took frankincense from them to markets in other countries", 2], ["Frankincense comes from trees.", "True", 0, 1], ["What is the name of the museum at Al Balid?", "The Museum of Frankincense Land", 1], ["Why did people build big walls and forts at the ports?", "To guard the ports because frankincense was very important", 2], ["How old are the buildings at Bat?", "About 5,000 years old", 0], ["Complete: This place is ______ Bahla Fort.", "called", 1], ["Which speaking tip is in this lesson?", "Look at the people you are talking to", 2], ["Where is Bat?", "In Al-Dhahira Governorate", 0]], "o": ["By the end of the period, students will be able to:", "Read about the history of frankincense in Oman.", "Answer questions about how people used frankincense and where it grows.", "Explain why Al Balid and Khawr Ruri became important ports."]}, {"t": "Lesson 6: English in action – Giving personal information", "u": "", "q": [["Which club does Emily want to join?", "The Space Explorers Club", 0], ["Complete: How do you ______ your last name?", "spell", 1], ["How do we say 445006 in a phone number?", "double-four five double-oh six", 2], ["Write: I / interested / join / the Chess Club", "I’m interested in joining the Chess Club", 1], ["Sort the plurals: stars, places, planets → /s/, /ɪz/, /z/.", "stars /z/, places /ɪz/, planets /s/", 2]], "o": ["By the end of the period, students will be able to:", "Understand a dialogue in which a girl joins a club.", "Ask for and give personal information (name spelling, date of birth, phone number).", "Pronounce plural endings /s/, /ɪz/ and /z/."]}, {"t": "Lesson 7: Skills – Reading: life on the International Space Station", "u": "", "q": [["How often does the ISS go around the Earth?", "Once every 90 minutes", 0], ["Why do astronauts need to exercise for two hours a day?", "Because they are weightless in space, so their muscles can become very weak", 1], ["Correct: Astronauts can see 24 sunrises every 16 hours.", "They see 16 sunrises or sunsets every 24 hours", 2], ["What is the ISS?", "A satellite (the International Space Station)", 0], ["Ten astronauts live on the ISS.", "True", 1, 1]], "o": ["By the end of the period, students will be able to:", "Predict what astronauts do on the International Space Station.", "Complete sentences and decide if sentences are true or false using the text.", "Solve a planning problem: choose nine things to take to Mars in a small box."]}, {"t": "Lesson 8: Skills – Listening, speaking and writing a blog post", "u": "", "q": [["What is Astronaut Ali’s blog post about?", "Food on the ISS", 0], ["Why don’t astronauts eat biscuits or cakes?", "Because crumbs float around and that is a problem", 1], ["Find the question in Ali’s blog post.", "What do astronauts eat?", 2], ["How many meals a day do astronauts have?", "Three meals a day", 0], ["Match: Why don’t we take biscuits? → …", "They have a lot of crumbs which float around!", 0], ["What punctuation mark do we use at the end of a question?", "A question mark (?)", 1], ["Match: What can we see from the ISS? → …", "We can see rivers, mountains and oceans on Earth!", 0], ["Why do astronauts wear a spacesuit outside the ISS?", "Because there is no air to breathe in space", 1]], "o": ["By the end of the period, students will be able to:", "Listen for specific information about an astronaut.", "Talk about what they will do in different situations on the ISS.", "Find the question in a model blog post and say why writers use questions."]}, {"t": "Lesson 9: Review", "u": "", "q": [["How long is the River Nile?", "It’s 6,670 kilometres long", 0], ["Complete: How ______ is Mount Everest? It’s 8,849 metres high.", "high", 1], ["Correct: Will they plays football? No, they won’t.", "Will they play football? No, they won’t", 2], ["Write in words: 1,000,000", "a million", 0], ["Complete: Astronauts wear a ______ when they travel into space.", "spacesuit", 1]], "o": ["By the end of the period, students will be able to:", "Find and say Unit 3 space words and big numbers.", "Use will / won’t and How …? questions correctly.", "Assess their own progress in Unit 3."]}, {"t": "Lesson 10: Get ready for A1 Movers", "u": "", "q": [["Malik: Will you go to Space Club this afternoon? Which is the best answer: A, B or C?", "A: No, I don’t think I’ll go today. I’ve got a lot of homework", 0], ["Why is \"Thank you, Malik!\" the best answer when Malik brings the bag?", "Because Malik helped him, so he needs to thank him", 1]], "o": ["By the end of the period, students will be able to:", "Choose the best answers in a dialogue (Reading and Writing Part 2).", "Tell a story from pictures (Speaking Part 2).", "Talk about space and answer personal questions (Speaking Parts 3 and 4)."]}, {"t": "Fun corner (optional lesson)", "u": "", "q": [["Clue: It is big and round. It’s grey. It goes around the Earth.", "the Moon", 0], ["Clue: We send these into space. They send us information.", "satellites", 1], ["Clue: This flies through space. It’s bright in the night sky. It has a long tail.", "a comet", 2], ["Clue: Astronauts live here when they’re in space.", "a space station", 0], ["Clue: There are eight of these in our solar system.", "planets", 1]], "o": ["By the end of the period, students will be able to:", "Read and give clues for space words.", "Guess and write space words in a crossword.", "Find the hidden word in the puzzle."]}, {"t": "Graded reader 1: The Space Race", "u": "", "q": [["Who are Faisal and Hazim dressed as?", "Astronauts", 0], ["Why does Hazim fall over?", "Because he sees a squirrel in the tree and looks up", 1], ["Faisal says, \"I won’t win, but I’ll enjoy the race.\" What does this tell you about him?", "He thinks enjoying the race is more important than winning", 2], ["What is the class learning about in Science?", "The solar system", 0], ["What does Faisal give Hazim?", "His helmet", 1], ["Who won the race? Explain the teacher’s and the boys’ answers.", "Hazim finished with a new helmet, and the boys said they all won because they finished the race together", 2]], "o": ["By the end of the period, students will be able to:", "Predict what will happen in a story from the pictures.", "Scan the story for details (costumes, the race, what happened to Hazim).", "Evaluate the characters’ actions and the story."]}, {"t": "Lesson 1: Vocabulary – Shops", "u": "", "q": [["Where can you buy meat?", "At the butcher’s", 1], ["Where can you buy newspapers, magazines and snacks?", "At the kiosk", 2], ["Where can you buy fish?", "At the fishmonger’s", 0], ["Complete: I need to buy a necklace for my sister. We’ll go to the ______.", "jeweller’s (or the gift shop)", 1], ["Choose: Yesterday, we went to the (butcher’s / shoe shop) to buy some meat.", "butcher’s", 0], ["Choose: I went to the (toy shop / gift shop) to buy a present for my granny.", "gift shop", 1], ["Which group does \"greengrocer’s\" belong to: food, clothes or toys?", "food", 2], ["Choose: My mum often goes to the (pharmacy / kiosk) to buy a magazine.", "kiosk", 0], ["Correct: On Saturdays, my dad goes to the fishmonger’s to buy some fruit.", "… to the fishmonger’s to buy some fish. (or: to the greengrocer’s to buy some fruit)", 1]], "o": ["By the end of the period, students will be able to:", "Match shops to the things you can buy there.", "Decide with a partner which shops to visit to buy things.", "Additional outcome:"]}, {"t": "Lesson 2: Story – Stop, thief!", "u": "", "q": [["What does Sami want to buy for his mum?", "A new mobile phone case", 0], ["What is an escalator?", "A machine which carries you upstairs and downstairs", 1], ["How did the children know the man was the thief?", "He was the rude man who walked into Fatma earlier, and they saw him stealing phones", 2], ["Which case does Sami’s mum love?", "The one which has the comet on it", 0], ["Put in order: a) They look at phone cases. b) They go up the escalator.", "b, a", 1], ["Describe the thief.", "He’s got dark, curly hair and a moustache. He’s wearing a black T-shirt, blue jeans and trainers, and he had a blue sports bag", 2], ["Why are the friends on the escalator?", "They want to go upstairs", 0], ["What is the man doing?", "He’s stealing phones", 1], ["Is \"Shout at children\" good behaviour? Why?", "No, it isn’t. It makes children sad and afraid", 2], ["What is the man carrying?", "A blue sports bag", 0], ["Complete: Bo tries to stop the ______.", "thief", 1]], "o": ["By the end of the period, students will be able to:", "Listen to and read the story and identify the shops in it.", "Order the events of the story.", "Act out the story in a group."]}, {"t": "Lesson 3: Grammar – Relative clauses (who, which, where)", "u": "", "q": [["Which word do we use for people: who, which or where?", "who", 0], ["Complete: That’s the phone case ______ my mum wants.", "which", 1], ["Choose: This is New Shoes. It’s the shop (who / which / where) I buy all my shoes.", "where", 2], ["Complete: It’s the man ______ we saw earlier.", "who", 0], ["Complete: Hassan likes magazines ______ are about space.", "which", 1], ["Complete: A shoe shop is the shop ______ you can buy shoes and boots.", "where", 0], ["Complete: That’s the woman ______ works at the corner shop.", "who", 1], ["Complete: I’m very good at fixing the toys ______ my brother breaks.", "which", 2], ["Complete: The Earth is the planet ______ we live.", "where", 0], ["Complete: Who’s the boy ______ is wearing glasses?", "who", 1]], "o": ["By the end of the period, students will be able to:", "Identify relative clauses in sentences from the story.", "Choose who for people, which for things and where for places.", "Describe a person, place or thing for a partner to guess."]}, {"t": "Lesson 4: Vocabulary and Grammar – Money and have to / don’t have to", "u": "", "q": [["Where do you keep money at home?", "In a money box", 0], ["Complete: He ______ get some pocket money.", "has to", 1, ["have to"]], ["What is the difference between \"I have to\" and \"I don’t have to\"?", "have to = it is necessary; don’t have to = it is not necessary", 2], ["The opposite of \"buy\" is ______.", "sell", 0], ["Make a question: you / have to / buy that boat?", "Do you have to buy that boat?", 1], ["Find the word: a small bag for money that women often carry.", "a purse", 0], ["Complete: I’ve got a lot of pocket money, so I ______ save any money.", "don’t have to", 1], ["Complete: She’s got all the ingredients she needs, so she ______ go to the greengrocer’s.", "doesn’t have to", 0], ["Complete: We have a difficult exam tomorrow, so we ______ study a lot this evening.", "have to", 1]], "o": ["By the end of the period, students will be able to:", "Say eight money words (money box, purse, wallet, get pocket money, save, spend, buy, sell).", "Use have to / don’t have to for things that are necessary or not necessary.", "Ask and answer about what families have to buy."]}, {"t": "Lesson 5: Culture – The world of the corner shop", "u": "", "q": [["What is a corner shop called in Australia?", "A milk bar", 0], ["What do corner shops in the UK also sell?", "Stamps, cleaning products and stationery", 1], ["Why do people go to a corner shop?", "To get something quickly and easily", 2], ["What is a corner shop called in New Zealand?", "A dairy", 0], ["Where is a corner shop called a party shop?", "In Detroit, in the USA", 1], ["Complete: Come to our ______ shop, Dream Gifts.", "friendly", 0], ["How should you sound in a TV advert?", "Excited", 2], ["What does Dream Gifts sell?", "Gifts (the best gifts) and cards", 0]], "o": ["By the end of the period, students will be able to:", "Read about corner shops in different countries.", "Match names for corner shops to countries and cities.", "Compare corner shops in other countries with shops in Oman."]}, {"t": "Lesson 6: English in action – Asking for a price", "u": "", "q": [["How much is the necklace with the blue star?", "It’s fifteen rials", 0], ["Complete: How ______ is it?", "much", 1], ["Which word has the /ʒ/ sound: station, television, machine?", "television", 2], ["How much money has Lucas got?", "Thirteen rials", 0], ["Which necklace does Lucas buy and how much is it?", "The necklace which has a flower on it; it’s twelve rials", 1]], "o": ["By the end of the period, students will be able to:", "Understand a dialogue in which a boy buys a present.", "Ask for and give prices (How much is it? It’s fifteen rials.).", "Pronounce the sound /ʒ/ (pleasure, measure, treasure)."]}, {"t": "Lesson 7: Skills – Reading: an email", "u": "", "q": [["Who did Razan first go to the shoe shop with?", "Her friend Rasha", 0], ["Why didn’t Razan buy the shoes?", "She didn’t have enough money", 1], ["Why is summary a better than summary b?", "Because it mentions all the important points of the story", 2], ["Her friend Rasha bought the shoes.", "False", 0, 1], ["Why was Razan sad the next week?", "Because the shop assistant sold the shoes", 1], ["How did Mum know that Razan wanted the shoes?", "Her friend Rasha told her", 2]], "o": ["By the end of the period, students will be able to:", "Predict what a text is about from the picture.", "Decide if sentences about the email are true or false.", "Choose the best summary of the story and explain why."]}, {"t": "Lesson 8: Skills – Listening, speaking and writing an email", "u": "", "q": [["What is the shopping mall in Westport called?", "The Smith Centre", 0], ["What does Nada like to buy from the greengrocer’s?", "Apples and pears", 1], ["Why do we write an apostrophe in \"greengrocer’s\"?", "Because it is short for the greengrocer’s shop", 2], ["Where can you go for medicine in Westport?", "The pharmacy in the shopping mall", 0], ["What is Nada’s favourite shop?", "The toy shop (Kids Toys)", 1], ["Which name needs ’s: kiosk or fishmonger?", "fishmonger (fishmonger’s)", 0], ["How do you start an email to your friend Basma?", "Hi Basma,", 1], ["Write correctly: the jeweller / the pharmacy", "the jeweller’s / the pharmacy", 0], ["How does Sharifa end her email?", "Love from Sharifa", 1]], "o": ["By the end of the period, students will be able to:", "Listen for specific information about shops in a town.", "Ask and answer where they like to go shopping.", "Find shop names with an apostrophe in a model email and explain why."]}, {"t": "Lesson 9: Review", "u": "", "q": [["Sort: Where can you buy medicine?", "At the pharmacy", 0], ["Complete: This is the new shop ______ you can buy nice presents.", "where", 1], ["What is the name of a machine which carries you upstairs and downstairs?", "an escalator", 2], ["Circle the odd one out: greengrocer’s, apples, bananas, meat, carrots.", "meat", 0], ["Complete: Some children get ______ money from their mum or dad.", "pocket", 1]], "o": ["By the end of the period, students will be able to:", "Sort shops by the things you can buy there.", "Use relative clauses and have to / don’t have to correctly.", "Plan spending and saving money and assess their own progress."]}, {"t": "Lesson 10: Get ready for A1 Movers", "u": "", "q": [["Complete: The greengrocer’s ______ bananas and other fruit.", "sells", 0], ["Juma, Sultan and Sabah ______ go to the shops to buy their grandma a present.", "have to", 1], ["Complete: Sultan wants to go to the shop ______ sells necklaces.", "which", 0], ["Complete: Juma is the boy ______ will buy a phone case.", "who", 1]], "o": ["By the end of the period, students will be able to:", "Listen and match people to pictures (Listening Part 3).", "Look, read and write words to complete sentences and answer questions (Reading and Writing Part 6).", "Read a story and write one word in each gap (Reading and Writing Part 5)."]}, {"t": "Fun corner (optional lesson)", "u": "", "q": [["Clue: It’s a place where you can buy fish.", "the fishmonger’s", 0], ["Clue: This is someone who flies a plane.", "a pilot", 1], ["Clue: It’s something which I carry my money in when I go shopping.", "a wallet (or a purse)", 2], ["Clue: It’s a place where you can buy a tablet.", "the phone shop", 0], ["Clue: It’s someone who puts out fires and rescues people.", "a firefighter", 1]], "o": ["By the end of the period, students will be able to:", "Find and describe differences between two pictures.", "Define people, places and things using who, which and where.", "Describe shops and jobs quickly in a game."]}, {"t": "Graded readers 1 and 2", "u": "", "q": [["What does Rosie buy at the greengrocer’s?", "Mushrooms", 0], ["How much money does Rosie have when she gets to the corner shop?", "Four euros", 1], ["Why can’t Rosie buy the chocolate?", "The dates are three euros and the chocolate is two euros, so she hasn’t got enough money for both", 2], ["Where does Rosie buy the chicken?", "At the butcher’s", 0], ["You can buy fish and chicken in the greengrocer’s.", "False", 1, 1], ["Where is the treasure chest?", "In the window of a toy shop", 0], ["How long does Hamed save his pocket money?", "Four weeks", 1], ["How does Hamed feel when he opens the chest? Why?", "He is surprised and sad because it is empty", 2], ["Who does Hamed give his money to?", "The man who works in the toy shop", 0], ["After eight weeks, Hamed buys the treasure chest.", "False", 1, 1]], "o": ["By the end of the period, students will be able to:", "Predict a story from its pictures.", "Find the shops Rosie visits and what she buys.", "Identify the main idea of the story."]}, {"t": "Semester review: Grammar reference, Solve it and Progress path", "u": "", "q": [["Complete: Hamed is the ______ (good) tennis player in the class.", "best", 0], ["Complete: When I was one, I ______ walk, but I couldn’t talk.", "could", 1], ["Choose: It’s the shop (who / which / where) my brother works.", "where", 2], ["Make it negative: I will get him a book.", "I won’t get him a book", 0], ["Complete: He ______ get some pocket money. (have to)", "has to", 1], ["What number is this: 1,000,000?", "a million", 0], ["Circle the odd one out: satellite, planet, space station, rocket.", "planet (it is natural; the others are made by people)", 1]], "o": ["By the end of the period, students will be able to:", "Recall the main grammar of Units 1–4 (comparatives, past simple, could, will, How …?, relative clauses, have to).", "Choose the correct grammar form in sentences from all four units.", "Solve the four story puzzles (Solve it) using clues from the stories."]}, {"t": "Lesson 1: Language booster – Hobbies and making suggestions", "u": "", "q": [["Choose: How about (play / playing) board games?", "playing", 0], ["Choose: Let’s (go / going) to the kiosk.", "go", 1], ["Respond to \"What about building a robot?\" if you like robots.", "Yes, that’s a great idea. I love robots", 2], ["Choose: Shall we (visit / visiting) my granny?", "visit", 0], ["Complete: What ______ we do today?", "shall", 1], ["Complete: ______ a robot.", "build", 0], ["Match: How about baking a cake? → …", "Yes, I’m hungry. Let’s bake!", 1], ["Order: shall / What / do / we?", "What shall we do?", 2], ["Complete: How about ______ the kiosk? (visit)", "visiting", 0], ["Match: What about visiting a fishmonger’s? → …", "No, I don’t like fish", 1]], "o": ["By the end of the period, students will be able to:", "Say hobby phrases (make a pizza, bake a cake, do an experiment, build a robot, make a rocket, visit a toy shop).", "Understand a dialogue in which children decide what to do.", "Make and respond to suggestions (How about …? What about …? Shall we …? Let’s …)."]}, {"t": "Lesson 2: Science – The solar system", "u": "", "q": [["How many planets are there in the solar system?", "There are eight", 0], ["How long does it take for Earth to go around the Sun?", "One year (365 days)", 1], ["Why can we live on Earth?", "Because there is air and water", 2], ["Which planets are the farthest from the Sun?", "Uranus and Neptune", 0], ["Why is Saturn amazing?", "It has 146 moons and a big ring around it", 1]], "o": ["By the end of the period, students will be able to:", "Name the eight planets (Mercury, Venus, Earth, Mars, Jupiter, Saturn, Uranus, Neptune).", "Read a science text and match questions with answers.", "Explain why we can live on Earth."]}, {"t": "Lesson 3: Let’s practise – A planet fact file", "u": "", "q": [["Mars is the smallest planet in the solar system.", "False", 0, 1], ["Mars has more moons than Earth.", "True", 1, 1], ["When did a spaceship first visit Mars?", "In 1971", 0], ["Which planet is fourth from the Sun?", "Mars", 1]], "o": ["By the end of the period, students will be able to:", "Read a fact file about Mars and decide if sentences are true or false.", "Write questions about a planet and find the answers.", "Make and present a planet fact file in pairs."]}]};</script>
