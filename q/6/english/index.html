<script>window.QZ={"g": "6", "gn": "السادس", "s": "english", "sn": "اللغة الإنجليزية", "L": [{"t": "Welcome – Lesson 1: Meet the WOW! Magazine", "u": "Welcome: The WOW! Team", "q": [["What does WOW! stand for?", "World of Wonder!", 0], ["Is WOW! a magazine in the shops or online?", "It’s an online magazine", 1], ["Why does the WOW! Team ask students for ideas?", "Because they want to choose topics that are interesting for students", 2], ["Write the names of the WOW! Team members.", "Reem, Sultan, Arlo and Julia", 0], ["Choose: WOW! is a) a magazine about the world b) the magazine made by kids for kids c) where learning is fun.", "The magazine made by kids for kids", 1], ["Who had a new computer from his/her dad?", "Omaima", 0], ["Which girl wants to know about places in the past? Why?", "Rahaf, because she went to a museum in the holidays", 1], ["Find two readers who want to learn how to stay healthy.", "Basil (sports, happy and healthy) and Hisham (stay safe and healthy on adventures)", 2], ["Who loves cooking?", "Huda", 0], ["Complete: Faisal wants to read about ___ clothes around the world.", "traditional", 1]], "o": ["Identify the purpose of the WOW! Magazine after listening to and reading the Welcome page.", "Ask and answer four personal questions (name, age, favourite hobby, reason for learning English) with a partner.", "Other learning outcome:", "Name the four members of the WOW! Team."]}, {"t": "Welcome – Lesson 2: The WOW! Team (adjectives)", "u": "Welcome: The WOW! Team", "q": [["Which adjective means “not tall and not short”?", "medium height", 0], ["Who designed the WOW! Magazine?", "Sultan", 1], ["Why does Reem say “I think they’re being kind”?", "Because her friends say she’s pretty and she thinks they are just being nice", 2], ["Match: Arlo – a) clever b) energetic c) handsome", "energetic", 0], ["Who is clever and likes Science? Write one more fact about her.", "Julia. She has a pet bird / she cares about animals and plants", 1], ["Which adjective matches: “He’s 1 metre 80 and he never feels tired”?", "tall and energetic", 0], ["Complete: She has lots of new ideas. She’s ___.", "creative", 1], ["Describe a person who “shouts and sings a lot and is good at Maths” with two adjectives.", "noisy and clever", 2], ["Circle: I’m not afraid of anything. I’m", "brave", 0, ["pretty", "noisy"]]], "o": ["Say and spell the twelve Welcome adjectives (energetic, fun, pretty, kind, brave, clever, medium height, chatty, friendly, handsome, creative, tall).", "Match each WOW! Team profile to the correct person after listening and reading.", "Other learning outcome:", "Answer questions about the team members using details from the profiles."]}, {"t": "Unit 1 – Lesson 1: Vocabulary – Sports", "u": "Unit 1: Free-time fun", "q": [["Say the winter sport with skis and snow, with its verb.", "go skiing", 0], ["Which verb do we use with volleyball, hockey and badminton?", "play", 1], ["Give one reason why we do sports.", "They help keep us healthy / we make friends / they help us relax", 2], ["Complete: I ___ swimming every week.", "go", 0, ["play", "do"]], ["Which sport uses wheels and a helmet in Julia’s post?", "cycling", 0], ["Name two winter sports.", "skiing, ice skating", 1], ["Which clue tells you Reem’s sport is table tennis?", "She uses small bats, a small ball and a big table", 2], ["Read: “We play it indoors and on the beach.” What is it?", "volleyball", 0], ["Put these into team or individual: hockey, karate, volleyball.", "Team: hockey, volleyball; individual: karate", 1]], "o": ["Name twelve sports with the correct verb (go skiing, play volleyball, do karate …).", "Match sports pictures to the words and pronounce them correctly after Audio 1.1.", "Other learning outcome:", "Give two reasons why people do sports and hobbies (the WOW! Question)."]}, {"t": "Unit 1 – Lesson 2: Team Talk – How often do you do sports?", "u": "Unit 1: Free-time fun", "q": [["How does Arlo get to school?", "By scooter", 0], ["How often does Sultan do gymnastics?", "Once a week", 1], ["Why does Sultan say “I don’t believe it!”?", "Because he is surprised that Arlo does karate too", 2], ["Who does the most sports, Arlo or Sultan?", "Arlo", 0], ["Complete: Sultan does karate every ___.", "Monday", 1], ["Which expression shows surprise?", "I don’t believe it! (or Really?)", 0], ["Respond: “I can stand on one leg and make a face.”", "You’re so funny!", 1], ["Choose: “I go swimming at 5.30 every morning.” –", "I don’t believe it!", 0, ["You’re so funny!"]]], "o": ["Understand the main idea and details of the Team Talk dialogue (who does the most sports).", "Answer questions about how often the characters do sports using frequency expressions.", "Other learning outcome:", "Read the dialogue aloud with correct intonation."]}, {"t": "Unit 1 – Lesson 3: Grammar – Present simple and Present continuous", "u": "Unit 1: Free-time fun", "q": [["Which tense: “I’m reading the WOW! Quiz”?", "Present continuous", 0], ["Complete the rule: We use the ___ for habits and routines.", "Present simple", 1], ["Make a question: Arlo / go scooting / every day?", "Does Arlo go scooting every day?", 2], ["Circle: (Are you learning / Do you learn) hockey at the moment?", "Are you learning", 0], ["Correct: “Is she play volleyball now?”", "Is she playing volleyball now?", 1], ["Where is it cold every day?", "At the winter sports centre", 0], ["How often does Majid do karate?", "Twice a week", 1], ["Why does Arwa love volleyball?", "Because it’s a great way to meet people and make new friends", 2], ["Complete: Osama ___ (go) to athletics club on Saturdays.", "goes", 0], ["Correct: “He don’t play chess every day.”", "He doesn’t play chess every day", 1]], "o": ["Distinguish between habits/routines and actions happening now in example sentences.", "State the rule for using the Present simple and the Present continuous.", "Other learning outcome:", "Form correct questions in both tenses about Arlo and Sultan."]}, {"t": "Unit 1 – Lesson 4: Book club – A picture story", "u": "Unit 1: Free-time fun", "q": [["Why can’t Samar do athletics?", "Because it’s raining", 0], ["What is Nawal’s good idea?", "To put on a show", 1], ["How does Samar feel about the piano at the start? How do you know?", "She hates playing the piano – she says “I hate playing the piano.”", 2], ["Who makes the invitations?", "Amani", 1], ["Were the children happier before or after the show? Give a reason.", "After – they say “That was fantastic!” and they had fun together without Wi-Fi", 2], ["Who says “Let’s put on a show!”?", "Nawal", 0], ["What happens first: there’s no Wi-Fi or Nawal comes to the house?", "There’s no Wi-Fi", 1], ["Complete: Mum says, “Why don’t you ___ your homework … or ___ a puzzle?”", "do … do", 2], ["Number: a) The friends sing. b) Samar plays computer games. c) There’s no Wi-Fi.", "b, c, a", 0]], "o": ["Identify the features of a picture story (pictures tell the story, many characters).", "Answer comprehension questions about the story (why there is no Wi-Fi, Nawal’s idea).", "Other learning outcome:", "Infer the characters’ feelings from pictures and speech bubbles."]}, {"t": "Unit 1 – Lesson 5: Vocabulary and Grammar – Hobbies and state verbs", "u": "Unit 1: Free-time fun", "q": [["Which hobby uses a camera?", "do photography", 0], ["What does Rasha think about singing?", "She doesn’t like it – she prefers acting", 1], ["Why is “I’m not believing you” wrong?", "Because believe is a state verb; we say “I don’t believe you.”", 2], ["Complete: ___ a diary, ___ cards, ___ models.", "write, collect, make", 0], ["Circle: She (doesn’t like / isn’t liking) making models.", "doesn’t like", 1], ["Which child talks about writing a diary?", "Child 3", 0], ["Complete: That song ___ (sound) fantastic.", "sounds", 1], ["Correct: “Do you knowing how to play table tennis?”", "Do you know how to play table tennis?", 0]], "o": ["Name twelve hobbies (do photography, collect cards, write a diary …).", "Find hobbies in the Lesson 4 story and answer questions about the characters’ likes.", "Other learning outcome:", "Work out the rule that state verbs are not usually used in continuous tenses."]}, {"t": "Unit 1 – Lesson 6: Culture and Project – Sports and hobbies around the world", "u": "Unit 1: Free-time fun", "q": [["Which sport is popular in New Zealand?", "Rugby (Rippa Rugby)", 0], ["What do you need to be good at to go snorkelling?", "Swimming", 1], ["How is cross-country skiing different from downhill skiing?", "You can ski uphill too", 2], ["Where do people go windsurfing?", "At Oman’s beautiful beaches (when it is windy)", 0], ["Name one way rugby and cross-country skiing are the same.", "They both keep you fit", 1], ["What three things should each page tell readers?", "When, where and what people have to do in the activity", 1]], "o": ["Read three short culture texts and identify the activity popular in each country.", "Compare free-time activities in Oman with those in other countries.", "Other learning outcome:", "Complete sentences and a sports review after reading and listening (AB p. 18)."]}, {"t": "Unit 1 – Lesson 7: English in action – Making and responding to suggestions", "u": "Unit 1: Free-time fun", "q": [["What club is the boy going to go to?", "The video club", 0], ["Find a suggestion with “How about”.", "How about going to the video club at school?", 1], ["Respond politely to “Why don’t you play hockey?” if you don’t want to.", "No, I don’t think so. I don’t like team sports", 2], ["Complete: ___ don’t you learn a musical instrument?", "Why", 0], ["Choose the positive response", "That sounds good", 1, ["I don’t think so"]], ["Is can strong or weak in “Yes, I can!”?", "Strong", 0], ["Is can strong or weak in “I can play the guitar”?", "Weak", 1], ["Say “Can you sing? – No, I can’t.” with correct pronunciation.", "Can (weak) … can’t (strong, full vowel)", 2], ["Circle the stressed can: “Can you skateboard? – Yes, I can.”", "The second can (Yes, I can)", 0]], "o": ["Understand a dialogue in which friends make suggestions about a new hobby.", "Identify the language for making and responding to suggestions.", "Other learning outcome:", "Make and respond to suggestions in a new dialogue."]}, {"t": "Unit 1 – Lesson 8: Literacy – Reading an interview", "u": "Unit 1: Free-time fun", "q": [["Which countries are Henry and Cody visiting?", "Argentina and Chile", 0], ["What does “altitude” mean?", "How high a place is above sea level", 1], ["Why is cycling over the Andes difficult?", "Because it’s above 4,000 metres and there isn’t much oxygen", 2], ["Where are they sleeping tonight?", "In a hostel", 0], ["What do they do if there aren’t any hostels?", "They camp in a tent", 1], ["“Henry and Cody are always hungry.” T, F or DS?", "True", 0, 1], ["“Cody is a teacher.” T, F or DS?", "Doesn’t say", 1], ["Which word means “the way you go to a place”?", "route", 2], ["Write the word: a very cheap and simple hotel.", "hostel", 0]], "o": ["Scan the interview questions to locate specific information.", "Answer comprehension questions about Henry and Cody’s cycling trip.", "Other learning outcome:", "Guess the meaning of new words from context (freedom, altitude, oxygen, energy, hostel, route)."]}, {"t": "Unit 1 – Lesson 9: Writing – An interview", "u": "Unit 1: Free-time fun", "q": [["What is Hashim’s biggest model?", "A model of a ship, nearly one metre long", 0], ["Which question words appear in the interviews?", "what, why, when, who, where, how", 1], ["Why is “What’s the best model you’ve made?” a good question?", "It asks about the best thing, so the answer is interesting", 2], ["Match: “Who helps you?” – a) Sometimes my dad. b) It’s fun!", "Sometimes my dad", 0], ["Name two features of a good interview.", "Use lots of question words; ask about the biggest/best/most interesting", 2], ["Correct: “what do you like swimming?”", "Why do you like swimming? (capital letter + correct question word)", 0], ["Complete: ___ did you start this hobby? – When I was six.", "When", 1], ["Turn the answer “I play every Saturday” into a question.", "When do you play? / How often do you play?", 2]], "o": ["Match interview questions to the correct answers in a model text.", "Identify the features of a good interview (question words, superlatives, interesting questions).", "Other learning outcome:", "Suggest more questions they would ask Hashim."]}, {"t": "Unit 1 – Lesson 10: Over to you! and Review", "u": "Unit 1: Free-time fun", "q": [["Which child is reading a book about cycling?", "John", 0], ["Who wants to learn to ski after reading the article?", "Henry", 1], ["Why did one reader start a karate club at lunch time?", "Because he/she wanted his/her friends to be healthy", 2], ["Which comment is not about sport?", "The comment about painting and art classes", 1], ["Complete: ___ the gardening, ___ badminton, ___ scooting.", "do, play, go", 0], ["Correct: “I am usually doing karate after school.”", "I usually do karate after school", 2]], "o": ["Read comments from the WOW! Magazine and identify those from children interested in sports.", "Express opinions about the unit topics and write a comment for the magazine.", "Other learning outcome:", "Revisit the WOW! Question and explain whether their answers changed."]}, {"t": "Unit 1 – Lesson 11: Get ready for… (exam practice)", "u": "Unit 1: Free-time fun", "q": [["Why should you read the whole text first?", "To understand the meaning before choosing the answers", 0], ["Which girl is Katy?", "The one who is running", 0], ["Who is William?", "The boy who’s wearing a blue helmet (with the bicycle)", 1], ["Write the word: This is something hard that you wear on your head.", "a helmet", 2], ["Write the word: You need a bike and a helmet to do this sport.", "cycling", 0], ["Write the word: It’s an indoor sport that people play with a small, plastic ball.", "table tennis", 1]], "o": ["Choose the correct word for each gap in a text about photography (A2 Flyers R&W Part 4).", "Apply the exam tip of reading the whole text first.", "Other learning outcome:", "Talk about which hobbies they like and why, using adjectives and reasons (A2 Key Speaking Part 2)."]}, {"t": "Unit 1 – Graded reader 1: Let’s Play Volleyball!", "u": "Unit 1: Free-time fun", "q": [["Where are the girls?", "At the sports centre", 0], ["Which sport is Maryam good at?", "Volleyball", 1], ["What does “fall over” mean? Use the story.", "To suddenly go down onto the ground – Huda falls over when she tries karate", 2], ["Which girl can kick really well?", "Arwa", 0], ["Why does Huda go to get some water?", "Because she doesn’t like doing karate / she falls over", 1], ["Who always misses the ball?", "Huda", 0], ["What does Huda’s mum say to her?", "You can do lots of things, Huda!", 1], ["Why is Huda happy at the end?", "Because she can do gymnastics really well", 2], ["Maryam can’t play volleyball.", "False", 0, 1], ["Complete: Huda tries gymnastics and she ___ it.", "loves", 1]], "o": ["Predict the content of the story from the title and the first picture.", "Scan the story to find which sport each girl is good at.", "Other learning outcome:", "Understand the new words belt, miss (a ball), fall over and mat from context and pictures."]}, {"t": "Unit 1 – Graded reader 2: The Blue Butterfly", "u": "Unit 1: Free-time fun", "q": [["What are Jood and Hassan doing in the park?", "Doing photography", 0], ["What is the first “butterfly” really?", "An eraser (on the puzzle book)", 2], ["What are the boys wearing in the show?", "Costumes and crowns", 0], ["Where is the real butterfly?", "On top of the table tennis bat", 1], ["Why is Hassan sad in the middle of the story?", "Because he can’t find a blue butterfly", 2], ["Who are putting on a show?", "A group of boys", 0], ["Complete: Hassan finds a blue butterfly on top of his ___.", "bat", 1], ["Why does Jood say “Sorry, Hassan”?", "Because the thing he saw wasn’t a butterfly (it was an eraser/a badge)", 2], ["Match: Some children … a) are playing table tennis b) on top of his bat", "are playing table tennis", 0], ["Choose: Some girls are (playing board games / doing puzzles) in the park.", "doing puzzles", 1]], "o": ["Predict what the story is about from the title and first picture.", "Identify the hobbies that people are doing in the park.", "Other learning outcome:", "Work out the meaning of butterfly, crown, badge and bat from pictures and context."]}, {"t": "Unit 2 – Lesson 1: Vocabulary – Devices", "u": "Unit 2: Technology", "q": [["What do you call a small computer you can carry?", "a laptop", 0], ["Which device do you use to listen to music without other people hearing?", "headphones", 1], ["Write the word: You type it to open your laptop or app.", "password", 0], ["Who loves watching sport on TV?", "Arlo", 0], ["Why does Julia use headphones?", "So nobody else can hear her music (she doesn’t have a speaker)", 1], ["Who sends homework to the school homework website?", "Sultan", 0]], "o": ["Name twelve devices and technology words (password, app, laptop, digital camera …).", "Match device pictures to words and pronounce them correctly after Audio 2.1.", "Other learning outcome:", "Suggest ways technology can help us at home and at school."]}, {"t": "Unit 2 – Lesson 2: Team Talk – A problem with technology", "u": "Unit 2: Technology", "q": [["Did Arlo forget his password?", "No, his laptop stopped working", 0], ["Whose computer did he use?", "His brother’s computer", 1], ["Why can’t Arlo print his homework?", "Because their printer doesn’t work", 2], ["Arlo had to use Mr Ammar’s computer.", "False", 0, 1], ["What does Sultan give Arlo?", "A pen and some paper", 1], ["Why does Arlo say “You’re joking!”?", "Because he doesn’t want to write all his homework again by hand", 2], ["Respond: “I couldn’t go to football practice yesterday.”", "Why not?", 0], ["Respond: “I dropped my smartphone in the river!”", "You’re joking!", 1], ["Respond: “I don’t feel well. I’ve got a headache.”", "Oh, dear", 2], ["Complete: Did you ___ your password? (Arlo’s dialogue)", "forget", 0]], "o": ["Understand why Arlo didn’t send his homework.", "Decide whether statements are true or false and justify them from the dialogue.", "Other learning outcome:", "Read the dialogue aloud with appropriate feeling."]}, {"t": "Unit 2 – Lesson 3: Grammar – could/couldn’t, had to/didn’t have to", "u": "Unit 2: Technology", "q": [["What is the past of can?", "could", 0], ["What is the past of don’t have to?", "didn’t have to", 1], ["Why do we say “He had to use his brother’s computer”?", "Because it was necessary – his laptop stopped working", 2], ["Circle: He (had to / didn’t have to) use his brother’s computer.", "had to", 0], ["Complete: In the past, children ___ use computers to do their homework.", "couldn’t", 1], ["What password did Hanan’s grandad use?", "Hanan’s name and Hanan’s birthday", 0], ["How did Hanan’s dad listen to the news before?", "On TV", 1], ["What did Hanan’s grandma want to do?", "Send an email to Hanan’s aunt", 2], ["How did Hanan’s mum thank her?", "She read her a story", 0], ["Complete: When Grandma was young, people ___ write messages on smartphones.", "couldn’t", 1]], "o": ["Identify could/couldn’t and had to/didn’t have to as the past forms of can and have to.", "Choose the correct form in sentences about Arlo.", "Other learning outcome:", "Write true or false sentences about Arlo using the new grammar."]}, {"t": "Unit 2 – Lesson 4: Book club – A poem", "u": "Unit 2: Technology", "q": [["Are the lines in poems usually long or short?", "Short", 0], ["Find a word that rhymes with “brighter”.", "lighter", 1], ["What can you do with the free map app in the poem?", "Find your way more easily / find your place on the map and get home safely", 2], ["Find a word that rhymes with “line” in the shopping verse.", "time (online/time)", 0], ["What does the poem say about the new phone’s screen?", "It is much brighter", 1], ["Change easy to an adverb.", "easily", 1], ["Complete: Check the facts more ___ on the screen.", "carefully", 2], ["Write the adverb of quiet.", "quietly", 0]], "o": ["Identify the features of a poem (short lines, rhyme, verses).", "Match a verse to a picture after listening and reading.", "Other learning outcome:", "Find rhyming words in the poem."]}, {"t": "Unit 2 – Lesson 5: Vocabulary and Grammar – Using technology and comparative adverbs", "u": "Unit 2: Technology", "q": [["What is the comparative of fast?", "faster", 1], ["Why do we say “more carefully” but “harder”?", "Carefully ends in -ly (more); hard is a short adverb (-er)", 2], ["Complete: You can find your way ___ (easily) with the app.", "more easily", 0], ["Write the comparative of well and badly.", "better, worse", 1], ["Which app helps you prepare for an English exam?", "Pass first", 0], ["Complete: I can run ___ (fast) than my brother.", "faster", 1], ["Correct: “She writes more clear than me.”", "She writes more clearly than me", 2], ["Choose: I play tennis (gooder / better) than my sister.", "better", 0], ["Complete: Please turn ___ the TV now. It’s time for bed.", "off", 1]], "o": ["Name twelve technology actions (go online, upload a photo, download an app …).", "Find the phrases in the poem and complete sentences with comparative adverbs.", "Other learning outcome:", "Deduce the rules for forming comparative adverbs (more + -ly, -er, irregular)."]}, {"t": "Unit 2 – Lesson 6: Culture and Project – Technology helps us", "u": "Unit 2: Technology", "q": [["How can children who are deaf wake up in the morning?", "With special alarm clocks that use lights and vibrations", 0], ["How do e-readers help young people who cannot see well?", "The letters can be very large and they can also hear the words", 1], ["What can people who cannot talk use to make computers do things?", "Their eyes", 2], ["In which country do deaf children use special alarm clocks?", "The UK", 0], ["What helps children with Down’s Syndrome to paint?", "Virtual Reality (VR)", 1], ["What do you write in the middle of the spider diagram?", "Technology", 0], ["Complete: You can use a tablet to help you ___ notes.", "take", 1], ["Why should you summarise when you present?", "So listeners understand the most important information quickly", 2]], "o": ["Understand how technology helps children with special needs in three countries.", "Match each device to the people it helps.", "Other learning outcome:", "Show respect and empathy when discussing people with special needs."]}, {"t": "Unit 2 – Lesson 7: English in action – Asking for help", "u": "Unit 2: Technology", "q": [["What does the girl want to print?", "Her English homework", 0], ["How does she turn on the printer?", "She presses that button", 1], ["Make this polite: “Help me with my homework.”", "Could you help me with my homework, please?", 2], ["Complete: Can you show me ___ to turn it on?", "how", 0], ["When can Mum help her revise?", "After dinner", 1], ["Is to long or short in “I need to go online”?", "Short (weak)", 0], ["Say: “Do you have time to help me?” with the weak form.", "/duː juː hæv taɪm tə help miː/", 1], ["Which word is stressed: “Can you show me how to do it?”", "show / do (not to)", 2], ["Complete: You need ___ type the password.", "to", 0]], "o": ["Understand a dialogue in which a girl asks her mum for help.", "Identify polite questions for asking for help.", "Other learning outcome:", "Ask for and give help with a technology task in a new dialogue."]}, {"t": "Unit 2 – Lesson 8: Literacy – Reading reviews", "u": "Unit 2: Technology", "q": [["In TopCity, what are you looking for?", "Treasure", 0], ["How do you move around the city?", "You write instructions – like programming a computer", 1], ["What is GameFan’s bad point?", "The game isn’t free (but it’s good value)", 2], ["What score did GameFan get last night?", "50,000 points", 0], ["Which expression means “to test yourself with something difficult”?", "challenge yourself", 1], ["Who says the game was easy to start playing?", "GameFan", 0], ["Complete: In every building you have to ___ a problem.", "solve", 1], ["Who thinks there are better programming games?", "MrCool001", 2], ["Who learnt to play by watching a video?", "MrCool001", 0]], "o": ["Scan two reviews quickly to find which reviewer mentions given things.", "Identify good and bad points in each review.", "Other learning outcome:", "Understand the expressions solve a problem, challenge yourself, program a computer, score points, give tips, play online."]}, {"t": "Unit 2 – Lesson 9: Writing – A review", "u": "Unit 2: Technology", "q": [["How long does the app take to open?", "Two minutes", 0], ["Find one adjective in the TechWhizz review.", "great / fantastic / real", 1], ["Find one adverb in the reviews.", "slowly / easily", 2], ["What should a review start with?", "A short introduction", 0], ["Why do reviews use “you”?", "To speak directly to the reader and show how the app helps them", 2]], "o": ["Use notes to complete a model review.", "Identify the features of a good review (introduction, good/bad points, adjectives, adverbs).", "Other learning outcome:", "Compare the reviews on pages 54 and 55."]}, {"t": "Unit 2 – Lesson 10: Over to you! and Review", "u": "Unit 2: Technology", "q": [["How does Nadia’s app help her learn English?", "She clicks on pictures, hears and says words and it tells her if she’s right", 0], ["Why did Najla download the book onto her e-reader?", "Because she reads really slowly – now she can listen to it too", 1], ["What did Katya change in the poem?", "The last verse – about making videos", 2], ["What do we call the part of a tablet that you look at?", "the screen", 0], ["Complete: I read ___ (fast) than my sister.", "faster", 1], ["Correct: “We didn’t had to wear uniform.”", "We didn’t have to wear uniform", 2], ["Write the dictation sentence about the computers.", "They couldn’t use the computers yesterday", 0], ["Complete: She speaks English ___ (clearly) than me.", "more clearly", 1]], "o": ["Read comments and identify those about technology and learning.", "Give opinions about the unit and write a magazine comment.", "Other learning outcome:", "Re-evaluate their answers to the WOW! Question."]}, {"t": "Unit 2 – Lesson 11: Get ready for… (exam practice)", "u": "Unit 2: Technology", "q": [["Why shouldn’t you choose the first thing you hear?", "Because the correct answer isn’t always at the beginning or the end", 0], ["Write the word: a place where a waiter brings your food.", "a café", 1], ["Write the word: a small computer you can carry in a bag.", "a laptop", 2], ["Write the word: You do this sport outdoors, under the water.", "snorkelling", 0], ["Write the word: a place where actors work.", "a theatre", 1], ["What should you do the first time you listen?", "Listen very carefully to the whole description", 0], ["Answer: Which girl? – The one ___ headphones.", "wearing", 1]], "o": ["Listen to short dialogues and choose the correct picture (A2 Key Listening Part 1).", "Apply the tip of listening to the whole dialogue before choosing.", "Other learning outcome:", "Write the correct words for definitions (A2 Flyers R&W Part 1)."]}, {"t": "Unit 2 – Graded reader 1: The Lost Phone", "u": "Unit 2: Technology", "q": [["Why did the family take a coach?", "Because they couldn’t take their car", 0], ["How did Jake lose his phone?", "A strong wind came and it fell out of the window", 1], ["Where was the phone?", "Under the rabbit’s tail", 2], ["What was Jake doing on the coach?", "Watching a video on his smartphone (with headphones)", 0], ["What could the boys see from the window?", "Fields, hills and lots of cows", 1], ["Number: a) They took selfies. b) The phone fell out. c) They are on their way to London.", "c, a, b", 0], ["Correct: “Finn saw a cat moving under a bush.”", "Finn saw a rabbit moving under a bush", 1], ["Why was Jake very happy at the end?", "Because he found his smartphone and saw the funny selfies", 2], ["Correct: “They could see lots of camels.”", "They c nd emails.”", "People couldn’t send emails", 2], ["Complete: Children ___ write with a pen or pencil – not a computer.", "had to", 0], ["Complete: They ___ worry about Wi-Fi working.", "didn’t have to", 1], ["Correct: “He speaks English more badly than his brother.”", "He speaks English worse than his brother", 0], ["Correct: “You can type more fast than me.”", "You can type faster than me", 1], ["Write the comparative of quietly.", "more quietly", 2], ["Correct: “My dad understands technology weller than my grandad.”", "… better than my grandad", 0], ["Complete: Anood does her homework ___ (carefully) than Basma.", "more carefully", 1], ["Which verb goes with “an icon”?", "click on", 1], ["Choose: (turn off / go off) the TV.", "turn off", 1]], "o": ["Choose the correct present or past form of can and have to in context.", "Complete a text about the past and present with the correct forms.", "Other learning outcome:", "Correct common mistakes with had to and couldn’t."]}, {"t": "Unit 3 – Lesson 1: Vocabulary – Places and buildings", "u": "Unit 3: Places", "q": [["Where do big boats stop?", "At a harbour", 0], ["What is a very tall, modern building?", "A skyscraper", 1], ["Why might a castle be important to people?", "Because it tells us about history / people visit it and have memories there", 2], ["Write the word: Doctors and nurses work here.", "hospital", 0], ["Write the word: A king or queen lives here.", "palace", 1], ["In the quiz, which place has kind doctors and nurses?", "The hospital", 0], ["Where can you see how to make chocolate?", "At the (chocolate) factory", 1], ["Read: “It’s the tallest building in the city. There’s a café at the top.” What is it?", "a skyscraper", 0], ["Name two places people use for sports.", "stadium, sports centre / swimming pool", 1]], "o": ["Name twelve places and buildings (castle, harbour, stadium, skyscraper …).", "Match pictures to place words and pronounce them correctly after Audio 3.1.", "Other learning outcome:", "Expla
