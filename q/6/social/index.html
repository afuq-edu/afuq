 1], ["قارن بين العامل قديمًا والوالي حاليًا من حيث حجم المهام.", "مهام العامل قديمًا محدودة كجمع الصدقات وتعليم الدين، ومهام الوالي حاليًا أوسع وتشمل مجالات خدمية وتنظيمية متعددة", 2], ["أكمل: من مهام العامل في عصر الخلافة الراشدة ........ و........", "جمع الصدقات، تعليم الناس أمور دينهم", 0], ["استنتج أهمية وجود عامل الخلافة الراشدة في عُمان.", "يسهل معرفة الخلافة لأحوال عُمان وإمدادها بالعون، ويقوي اتصال عُمان بالدولة الإسلامية", 1], ["ما أوجه الشبه بين العامل قديمًا والوالي حاليًا؟", "كلاهما يمثل الدولة في ولاية من ولاياتها، ويخدم الناس وينظم بعض شؤونهم", 2], ["ما أول ما فعله العُمانيون بعد وصول خبر وفاة الرسول صلى الله عليه وسلم؟", "أرسلوا وفدًا إلى المدينة المنورة للتعزية ومبايعة أبي بكر الصديق", 0], ["رتب: مواجهة آل جفنة، ذهاب الوفد إلى المدينة، وفاة الرسول صلى الله عليه وسلم.", "وفاة الرسول صلى الله عليه وسلم، ثم ذهاب الوفد إلى المدينة، ثم مواجهة آل جفنة", 1], ["من ترأس الوفد العُماني إلى المدينة؟", "عبد بن الجلندى", 0], ["اذكر عاملًا للخلافة في عُمان في عهد عمر بن الخطاب رضي الله عنه.", "عثمان بن أبي العاص", 1], ["لخص علاقة عُمان بالخلافة الراشدة في ثلاث نقاط.", "إرسال وفد للتعزية والمبايعة، والثبات على الإسلام ومحاربة المرتدين، وارتباطها بالخلافة مع استمرار حكم آل الجلندى ووجود عامل للخلافة", 2]], "o": ["يوضح موقف عُمان بعد وفاة الرسول صلى الله عليه وسلم بإرسال وفد إلى المدينة المنورة.", "يتتبع على الخريطة مسار الوفد العُماني إلى المدينة المنورة.", "يقدّر حرص العُمانيين على القيام بواجبهم تجاه دولة الخلافة."]}, {"t": "الدرس الثالث: منجزات عُمانية في عصر الخلافة الراشدة", "u": "الوحدة الثانية: عُمان في عصر الخلافة الراشدة", "q": [["في عهد أي خليفة شارك العُمانيون في فتوحات العراق وفارس والسند؟", "في عهد الخليفة عمر بن الخطاب رضي الله عنه", 0], ["ما المقصود بالأسطول؟", "مجموعة من السفن تستخدم لأغراض مدنية أو عسكرية", 1], ["علل: اعتمدت دولة الخلافة في فتوحاتها البحرية على العُمانيين بالدرجة الأولى.", "لخبرتهم في ارتياد البحر والملاحة، وحماستهم الكبيرة للمشاركة في الفتوحات", 2], ["اذكر منطقتين شارك العُمانيون في فتحهما.", "العراق وبلاد فارس، أو السند", 0], ["م
