<script>window.QZ={"g": "7", "gn": "السابع", "s": "english", "sn": "اللغة الإنجليزية", "L": [{"t": "Welcome – Lesson 1: The WOW! Team", "u": "", "q": [["Name the four members of the new WOW! Team.", "Majid, Frank, Bayan and Emily", 0], ["Who needs information about travel?", "Basim (going to Egypt by plane) and Eliza (using the metro in the city)", 1], ["Why might Juma want to read about architects? Give a reason from his comment.", "He is doing a school project about different jobs and wants to know what an architect does every day", 2], ["Complete: Last year, the WOW! Team looked at happy homes, different clothes and keeping ___ outdoors.", "safe", 0], ["Which reader is interested in animals, and why?", "Razan, because she went to the zoo and wants to learn the names of parts of animals", 1], ["Complete: Hello! I’m Emily and I’m ___ to meet you, too.", "pleased", 0], ["Which tense is used in: Next summer, I’m going to go on a plane for the first time?", "The future with going to (a plan)", 1], ["Correct the mistake: Last year, we look at how to make our homes happy.", "Last year, we looked at how to make our homes happy", 2], ["Choose: It was raining yesterday but today it ___ very hot.", "is", 0, ["was"]]], "o": ["Identify the four members of the new WOW! Team and the three topics of last year’s magazine.", "Match readers’ comments to the magazine topics they want to read about.", "Additional outcome: Introduce themselves and say what they want to read about in the WOW! Magazine this year."]}, {"t": "Welcome – Lesson 2: Team Talk", "u": "", "q": [["Who is thirteen and likes travelling with his parents?", "Frank", 0], ["Why was Bayan hungry when she went camping before?", "Because they didn’t take enough food", 1], ["Why doesn’t Emily usually wear her long coat? Explain using the text.", "It is not usually cold enough in Oman to wear it", 2], ["Who usually wears an Omani hat and dishdasha?", "Majid", 0], ["Which food tastes like Spanish food?", "Egyptian food", 1], ["Is this T, F or DS? Majid has been camping in dangerous places.", "F – he hasn’t been camping anywhere dangerous", 1], ["Explain the difference between F and DS.", "F means the text says the opposite; DS means the text gives no information about it", 2], ["Complete: All the students in Majid’s class know some ___ ___.", "first aid", 0], ["T, F or DS? Frank likes cooking and wants to cook more.", "T", 1]], "o": ["Identify each WOW! Team member from the details in their profile.", "Answer comprehension questions about the About Us page using information from the text.", "Additional outcome: Describe a team member so that classmates can guess who it is."]}, {"t": "Lesson 1: Vocabulary – Jobs in entertainment", "u": "", "q": [["Which job is this? He makes people laugh by telling jokes.", "comedian", 0], ["What is Majid going to do in the talent show?", "He’s going to be the camera operator and video the show", 1], ["Which jobs need people who are very fit? Why?", "Stunt performers and performers, because they do dangerous or energetic actions", 2], ["Write the job: She puts make-up on actors’ faces.", "make-up artist", 0], ["Complete: I’ve read this book four times! It’s by my favourite ___.", "writer", 0], ["Describe a stunt performer in one sentence.", "A stunt performer does dangerous things for films", 1], ["What is the difference between a performer and a presenter?", "A performer entertains an audience by acting, singing or doing tricks; a presenter introduces a programme and talks to the audience", 2], ["Write the job: He works with puppets.", "puppeteer", 0], ["Complete: You’re very good at telling funny stories. You would be a great ___.", "comedian", 1]], "o": ["Say and match the 12 jobs in entertainment to their pictures.", "Explain what people do in each job in a simple sentence.", "Additional outcome: Answer the WOW! question: How can people and places entertain us?"]}, {"t": "Lesson 2: Team Talk – I’ve no idea! I get it!", "u": "", "q": [["How long has Frank been a puppeteer?", "Since he was eight", 0], ["Majid’s uncle is a sound editor.", "False", 1, 1], ["Why is the joke Nobody Nose funny?", "Because nose sounds like knows, so it also means “nobody knows”", 2], ["Which expression do you use when you don’t know the answer?", "I’ve no idea", 0], ["Complete: My aunt is a TV presenter. – Wow! That’s ___!", "cool", 1], ["How long has Frank had his costume?", "He’s had it for a long time", 0], ["Is Frank’s costume too big or too small?", "It’s a bit small now", 1], ["Why did Ali tell Frank and Majid to come on?", "Because it was time for the WOW! Talent Show", 2], ["Choose: A: What’s the capital of Peru? B", "I’ve no idea", 0, ["That’s cool"]]], "o": ["Find information in the Team Talk dialogue to decide if sentences are true or false.", "Use the expressions I’ve no idea. / That’s cool! / I get it. in short dialogues.", "Additional outcome: Say which job they would like in a school talent show and why."]}, {"t": "Lesson 3: Grammar – Present perfect with since and for", "u": "", "q": [["since or for? I’ve lived here ___ five years.", "for", 0], ["since or for? He has been a puppeteer ___ he was eight.", "since", 1], ["Make a question: you / have / your bike / how long?", "How long have you had your bike?", 2], ["Complete: Majid’s uncle has been a comedian ___ ten years.", "for", 0], ["Correct the mistake: I haven’t been to the cinema for I was seven.", "I haven’t been to the cinema since I was seven", 1], ["Complete: How long ___ she lived in Sur?", "has", 0], ["Change to a question: He has played football for five years.", "How long has he played football?", 1], ["Choose the correct sentence: (a) I’ve had my watch since two years. (b) I’ve had my watch for two years.", "(b)", 2], ["since or for? My uncle has worked at the aquarium ___ 2016.", "since", 0], ["Write the answer: How long have you studied English? (since Grade 1)", "I’ve studied English since Grade 1", 1]], "o": ["Distinguish between since (point in time) and for (period of time).", "Ask and answer How long questions with the Present perfect.", "Additional outcome: Say true and false sentences about themselves using since and for."]}, {"t": "Lesson 4: Book club – My Muscat diary", "u": "", "q": [["When did the family arrive in Muscat?", "On Saturday 29th December, in the evening", 0], ["How long has Dad had the tickets for the Royal Opera House?", "Since September", 1], ["Why didn’t the writer write the diary on Sunday night?", "Because he/she was too tired", 2], ["Where is the family flying home to?", "Khasab", 0], ["Which two places did they visit on Monday?", "The National Museum and a planetarium", 1], ["Choose: The show was", "exciting", 0, ["excited"]], ["Choose: I was so", "embarrassed", 1, ["embarrassing"]], ["The family went to the aquarium on Monday. Explain.", "False", 2, 1], ["Complete with -ed or -ing: The art gallery was interest___.", "interesting", 0]], "o": ["Identify the features of a diary (dates, first person).", "Answer questions about the family’s holiday in Muscat.", "Additional outcome: Give an opinion about the most exciting day with a reason."]}, {"t": "Lesson 5: Vocabulary and Grammar – Places of entertainment; Present continuous for future arrangements", "u": "", "q": [["Where do you skate?", "At an ice rink", 0], ["Complete: Tomorrow we ___ (visit) Al-Qurum park.", "are visiting", 1], ["Why is the Present continuous used in: We’re watching a show on Tuesday?", "Because it is a future arrangement – they have already decided and have tickets", 2], ["Which place has stars and planets on the ceiling?", "planetarium", 0], ["Make negative: We are going out tonight.", "We aren’t going out tonight", 1], ["Complete: She ___ (not / come) to the circus tonight.", "isn’t coming", 0], ["Which sentence is an arrangement? (a) I’m reading now. (b) I’m flying to Cairo on Monday.", "(b)", 2], ["Where can you see fish, sharks and turtles?", "At an aquarium", 0], ["Complete: My dad ___ (take) us to the theme park this evening.", "is taking", 1]], "o": ["Name and match 12 places of entertainment.", "Use the Present continuous to talk about future arrangements.", "Additional outcome: Plan a family day out and present the arrangements."]}, {"t": "Lesson 6: Culture and Project – Performers around the world", "u": "", "q": [["Where is Al Haboot especially popular?", "In the mountains of Oman, especially in Dhofar governorate", 0], ["What does Cirque du Soleil mean?", "Circus of the sun", 1], ["Give one similarity and one difference between the two performances.", "Both entertain people with performers; Al Haboot uses a poem, rhythm and swords, while Cirque du Soleil uses costumes, make-up and circus acts", 2], ["When did Cirque du Soleil start?", "In 1984", 0], ["On which continent do they NOT perform?", "Antarctica", 1], ["What three details must your poster include?", "The place, dates and times of the show", 0], ["Where do we use bullet points on a poster?", "For the dates and times of the show", 1], ["Why should you look at the people who are listening?", "To keep them interested and show confidence", 2]], "o": ["Find details about Al Haboot and Cirque du Soleil in a text.", "Compare two kinds of performance.", "Additional outcome: Talk about performing and the kind of performer they would like to be."]}, {"t": "Lesson 7: English in action – Buying tickets", "u": "", "q": [["How many tickets does the boy buy?", "Four tickets", 0], ["How much is a guide?", "Ten rials", 1], ["Why does the boy decide to have a guide?", "Because he wants to find out about the fort and its history", 2], ["Complete: Can I ___ four tickets, please?", "have", 0], ["Write the question to ask the price of a guide.", "How much is a guide?", 1], ["Two adults and two children (Adult 7, Child 4). How much in total?", "22 rials", 2], ["Complete: That’s 19 rials ___ total.", "in", 0], ["Which syllable has the schwa in operator?", "The last syllable: -tor /tə/", 1], ["What does the ticket seller say when giving the tickets?", "Here are your tickets. Enjoy the …!", 2], ["Write what the customer says when giving the money.", "Here you are", 0], ["A 3D cinema ticket is 3 rials for adults and 2 for children. Two adults and three children want tickets. Write the seller’s total sentence.", "That’s 12 rials in total", 2]], "o": ["Understand a dialogue about buying tickets at a fort.", "Use expressions to buy tickets and ask about prices.", "Additional outcome: Pronounce the schwa sound in job-word endings (-er, -or)."]}, {"t": "Lesson 8: Literacy – Reading an advert", "u": "", "q": [["What is the adventure playground called?", "Treetops Adventure Playground", 0], ["How high is the climbing wall?", "15 metres", 1], ["Y, N or DS? If you’re ten, you can play in the Tiny-Tots Playground.", "N – it is for children aged six or under", 2], ["How can you buy tickets?", "On the website or by phoning 0181 496 077", 0], ["What do you wear for the high activities?", "A helmet and a special harness", 1], ["Correct: The café has made its own ice cream since 2014.", "The ice cream shop has made its own ice cream since 2004", 2], ["What can you do in the Treetops Maze?", "You can go along the paths and through the tunnels and try to find the exit", 0], ["Who helps you put on your harness?", "The Treetops guides", 1], ["Why do you think the advert says It’s the best ice cream in the world!?", "To make people want to visit; adverts use strong words to persuade", 2]], "o": ["Scan an advert to find specific information quickly.", "Decide if statements are Yes, No or Doesn’t say.", "Additional outcome: Say which activity in the advert they would like to try and why."]}, {"t": "Lesson 9: Literacy – Writing an advert", "u": "", "q": [["Complete: ___ through the glass tunnel and see sharks above your head.", "Walk", 0], ["What is the slogan of City Beach Aquarium?", "See the sea in the city!", 1], ["Why do adverts use bullet points?", "To make information short, clear and easy to read", 2], ["List four features you will include in your advert.", "Logo, slogan, bullet points with activities, special offer and how to buy tickets", 2], ["Is this a good slogan? Our museum. Why/why not?", "No, it is not exciting; a slogan should be short and catchy, e.g. Discover the past today!", 1]], "o": ["Complete an advert with suitable imperative verbs.", "Identify the features of a good advert using the How to write box.", "Additional outcome: Plan an advert for an attraction with a logo, slogan and special offer."]}, {"t": "Lesson 10: Over to you!", "u": "", "q": [["Who wants to be a make-up artist and why?", "The girl who loves art and helped paint everyone’s faces at a family party", 0], ["since or for? I’ve written a diary ___ I was seven.", "since", 1], ["Complete: In July we ___ (fly) to Cairo.", "are flying", 2], ["Which place do you go to for bowling?", "A bowling alley", 0]], "o": ["Read readers’ comments and find specific information.", "Use unit vocabulary and grammar (since/for, Present continuous) in sentences.", "Additional outcome: Answer the WOW! question with ideas from the unit."]}, {"t": "Lesson 11: Get ready for… A2 Flyers and A2 Key", "u": "", "q": [["What should you do if a speaker mentions two places?", "Listen until the end to find which place the person actually went to", 0], ["Fahad: Can I come with you? Choose Yousuf’s best answer: (A) In the morning. (D) Of course you can!", "D", 1], ["Fahad: How do we buy tickets? Which answer fits?", "H – You have to visit the website", 2], ["Fahad: Are you going to have lunch in the café? Answer:", "F – No, we’re taking a picnic", 0], ["Complete from the AB listening: Jasim’s been a footballer ___ he was ten.", "since", 1]], "o": ["Listen and match people to places (A2 Flyers Listening Part 3).", "Choose the best response in a conversation (A2 Flyers Reading and Writing Part 2).", "Additional outcome: Use exam tips to check answers."]}, {"t": "Lesson 12: Optional lesson – Fun corner", "u": "", "q": [["Write the job: She designs costumes for films.", "costume designer", 0], ["Correct: He has been a stunt performer since ten years.", "He has been a stunt performer for ten years", 1]], "o": ["Make sentences about pictures using Unit 1 words and grammar.", "Ask and answer How long questions in a game.", "Additional outcome: Help a partner correct sentences during the game."]}, {"t": "Graded readers 1 and 2: The Entertainment Tour / The School Show", "u": "", "q": [["Who is taking the boys on the tour?", "Their teacher, Mr Talal", 0], ["What time are they meeting the guide at the Science Museum?", "At ten o’clock", 1], ["What is the problem at the end of the story?", "Hazim can’t find his camera", 2], ["What do the boys buy in the gift shop?", "A postcard", 0], ["Put in order: art gallery – bus back to school – Science Museum.", "Science Museum → art gallery → bus back to school", 1], ["Why has Hazim been excited since breakfast time?", "Because it’s a fun day at school and they are going on an entertainment tour", 2], ["What did Hazim understand at the Science Museum?", "How hot-air balloons fly", 0], ["Find a Present continuous sentence for the future in the story.", "We’re visiting an art gallery at one o’clock. / We’re catching the bus back to school at four o’clock", 1], ["What does sculpture mean?", "A piece of art made from stone, metal or wood that you can walk around", 2], ["How does Faisal help Hazim feel better?", "He says they can do another tour with their parents tomorrow and find the camera", 1], ["How long have Samar and Basma been at the school show?", "For two hours", 0], ["Who do the girls meet first backstage?", "One of the performers", 1], ["Why is Samar nervous at the classroom door?", "Because she sees a lion’s face at the door", 2], ["Whose dream is to become a make-up artist?", "Basma’s", 0], ["Complete: I’ve wanted to be a costume designer ___ I was small.", "since", 1], ["Who painted the lion’s face? Explain.", "The make-up artist; the lion is a performer wearing make-up", 2], ["The performer has wanted to be a performer for a few days.", "False", 0, 1], ["What does the costume designer hope?", "That performers all over the world use her costumes one day", 1], ["Why does the girl laugh at the door?", "Because Samar thinks the performer with lion make-up is a real lion", 2], ["What does the performer love?", "Performing in school shows and hearing the audience cheer", 0], ["Complete: I’ve wanted to be a writer ___ many years.", "for", 1]], "o": ["Predict the story from the title and pictures.", "Scan the story for specific information (times and places).", "Additional outcome: Retell the order of the visits on the tour."]}, {"t": "Unit 1 Review: Unit 1 practice sheet", "u": "", "q": [["since or for? This art gallery has been here ___ twenty years.", "for", 0], ["Complete: I’m ___ (meet) my friends at the bowling alley on Friday.", "meeting", 1], ["Find and correct: He has worked at the aquarium for 2016.", "He has worked at the aquarium since 2016", 2], ["Write the job: This person controls a camera to film shows.", "camera operator", 0], ["Which place has rides and roller coasters?", "A theme park", 1]], "o": ["Apply Unit 1 vocabulary and grammar in practice tasks.", "Identify personal strengths and areas to improve from the practice results.", "Additional outcome: Set one personal learning goal for Unit 2."]}, {"t": "Lesson 1: Vocabulary – Animal body parts", "u": "", "q": [["Which body part does a camel have on its back?", "A hump", 0], ["Which animal in the quiz has flippers and long whiskers?", "A seal", 1], ["Why are bees important, according to the quiz?", "They help plants grow", 2], ["Write the body part: hard pointed mouth of a bird.", "beak", 0], ["Complete: A cat has long ___ on its face.", "whiskers", 0], ["Which body part helps a fish swim?", "fin(s)", 1], ["Which animal is the odd one out: snake, fish, bird? Why?", "Bird – it has feathers, not scales", 2], ["Write the body part: the feet of a cat or a bear.", "paws", 0], ["Complete: An oryx has two long ___ on its head.", "horns", 1]], "o": ["Name and match 12 animal body parts.", "Identify animals from descriptions of their body parts.", "Additional outcome: Answer the WOW! question: Why are animals so awesome?"]}, {"t": "Lesson 2: Team Talk – Watch out! It’s so cute!", "u": "", "q": [["Why hasn’t Bayan seen any animals yet?", "Because you have to look carefully and listen", 0], ["Why can’t it be a snake?", "Because it doesn’t have scales", 1], ["Why does Emily say they shouldn’t touch the hedgehog?", "Because it may be scared", 2], ["Which expression do you use to warn someone of danger?", "Watch out!", 0], ["Which body parts does the hedgehog have?", "Spines, small paws and whiskers", 1], ["Bears live in the place where they are walking.", "False", 0, 1], ["Nawal wants to pick up the hedgehog.", "True", 1, 1], ["Explain why Emily thinks it could be a bird.", "Because she can hear birds", 2], ["Choose: (Watch out! / It’s so cute!) There’s a scorpion near your foot!", "Watch out!", 0], ["Correct: The animal has wings.", "The animal doesn’t have wings", 1]], "o": ["Follow a dialogue to find how the children identify the animal.", "Use the expressions Watch out! Wow! It’s so cute! in context.", "Additional outcome: Explain why we shouldn’t touch wild animals."]}, {"t": "Lesson 3: Grammar – may, might, could, can’t, must", "u": "", "q": [["It has a hump and lives in the desert. It ___ be a camel.", "must", 0], ["It doesn’t have wings. It ___ be a bird.", "can’t", 1], ["I’m not sure what it is. It ___ be a fox. (Give two possible modals)", "may / might / could", 2], ["Which modal do we use when we are sure something is not true?", "can’t", 0], ["Make a deduction: It has eight legs and makes webs.", "It must be a spider", 1], ["It has flippers but no fins. It ___ be a fish.", "can’t", 0], ["It has wings and a beak. It ___ be a bird.", "must", 1], ["Explain the difference: It might be a cat. / It must be a cat.", "Might = not sure; must = sure", 2], ["Choose: It isn’t moving. It (must / can’t) be asleep.", "must", 0], ["Correct: It can’t to be a bear.", "It can’t be a bear", 0], ["Choose: Her phone is ringing but she isn’t answering. She (must / can’t) be busy.", "must", 1], ["Why is might better than must here: Someone is at the door. It ___ be Dad.", "Because we are not sure who it is", 2], ["Complete: The light is off. They ___ be at home. (sure not)", "can’t", 0], ["Solve: It lays eggs, swims and has a beak like a duck. What must it be?", "It must be a platypus", 2]], "o": ["Distinguish between must, can’t and may/might/could for deduction.", "Make deductions about animals from clues.", "Additional outcome: Justify deductions with a reason."]}, {"t": "Lesson 4: Book club – The platypus (a folk tale)", "u": "", "q": [["What do the lions say makes them important?", "They have fur and they can run", 0], ["Why can’t the platypus bite like the lions?", "Because she doesn’t have teeth", 1], ["Which group does the platypus join in the end?", "None – she doesn’t join any group", 2], ["Which animals have beaks and lay eggs in the story?", "The birds", 0], ["What can’t the platypus do like the fish?", "She can’t breathe underwater", 1], ["What is the message of the story?", "Everyone is special in different ways", 2], ["What is the noun from dive?", "diver", 0], ["Write the noun from swim and spell it correctly.", "swimmer", 1], ["Why did the platypus curl up and go to sleep?", "Because she decided she was special in her own way and didn’t want to join any group", 2], ["Complete: The platypus is a good ___ (run).", "runner", 0], ["Answer in a complete sentence: Why can’t the platypus join the birds?", "She can’t join the birds because she can’t fly", 1]], "o": ["Identify the features of a folk tale.", "Explain why the platypus fits each animal group but does not join any.", "Additional outcome: Discuss the lesson the story teaches."]}, {"t": "Lesson 5: Vocabulary and Grammar – Animal verbs; First conditional", "u": "", "q": [["Which verb? A lion does this loudly.", "roar", 0], ["Complete: If you come with us, you ___ (be) with the best animals.", "’ll be / will be", 1], ["What tense is used in the if part of a first conditional?", "The Present simple", 2], ["Which verb? A hedgehog makes itself into a ball.", "curl up", 0], ["Complete: If we plant more flowers, more bees ___ (come).", "will come", 1], ["Complete: If a scorpion ___ (sting) you, you’ll need to go to hospital.", "stings", 0], ["Make negative: If I join the lions, the birds will be happy.", "If I join the lions, the birds won’t be happy", 1], ["Choose: If you look up, you (see / will see) an eagle.", "will see", 0], ["Complete: If you ___ (not hurry), you’ll miss the bus.", "don’t hurry", 1], ["Correct: If I will see a lion, I will run away.", "If I see a lion, I’ll run away", 1], ["Which animal verb means “go away quickly on foot because you are scared”?", "run away", 2], ["Complete: If you touch a hedgehog, it ___ (curl up).", "will curl up", 0]], "o": ["Name and match 12 animal verbs.", "Form first conditional sentences about real future possibilities.", "Additional outcome: Suggest ways to bring more animals to a garden using the first conditional."]}, {"t": "Lesson 6: Culture and Project – National animals", "u": "", "q": [["What colour is the Arabian oryx’s fur?", "White", 0], ["How does the Komodo dragon find animals?", "It uses its tongue to taste the air", 1], ["How does the Arabian oryx get water in the desert?", "It gets all the water it needs from its food", 2], ["Which country has the ring-tailed lemur as its national animal?", "Madagascar", 0], ["How long can some Komodo dragons be?", "Three metres", 1], ["Use but: The oryx lives in the desert / it doesn’t need to drink water.", "The oryx lives in the desert, but it doesn’t need to drink water", 0], ["What should you check before you present the names of countries?", "How to say them correctly (online or in a dictionary)", 1], ["What information should each note include?", "The animal’s name, country, appearance and an interesting fact", 2]], "o": ["Find facts about three national animals in a text.", "Compare the features of the ring-tailed lemur, the Arabian oryx and the Komodo dragon.", "Additional outcome: Suggest a new national animal for their country and justify the choice."]}, {"t": "Lesson 7: English in action – Saying what you like and don’t like", "u": "", "q": [["Which animals do the children talk about?", "Spiders, ants, sea animals and sharks", 0], ["Which animal is one child scared of?", "Sharks", 1], ["Which is stronger: I’m not keen on spiders or I can’t stand spiders?", "I can’t stand spiders", 2], ["Complete: I’m crazy ___ sea animals.", "about", 0], ["Mark the stress: kangaroo.", "kan-ga-ROO (stress on the last syllable)", 1], ["Write the stressed syllable in elephant.", "EL", 0], ["Complete: I don’t like sharks ___ ___!", "at all", 1], ["Choose a polite neutral answer: Do you like ants? – I don’t ___ them.", "mind", 2], ["Mark the stress: giraffe.", "gi-RAFFE", 0]], "o": ["Understand a dialogue about likes and dislikes.", "Express likes and dislikes about animals with a range of expressions.", "Additional outcome: Place word stress correctly in animal names."]}, {"t": "Lesson 8: Literacy – Reading an information text", "u": "", "q": [["Is the giant prickly stick insect a vertebrate or an invertebrate?", "An invertebrate (insect)", 0], ["Where does the mata mata turtle live?", "In warm lakes, ponds and rivers in South America", 1], ["Why is it easy for the stick insect to hide?", "Because it looks like dead leaves or wood", 2], ["How long can the stick insect be?", "Up to 20 centimetres", 0], ["What does the turtle use its long nose for?", "To breathe while it hides in the water", 1], ["Give one similarity and one difference between the two animals.", "Both lay eggs; the turtle is a vertebrate reptile, but the stick insect is an invertebrate insect", 2], ["Complete the fact file: Food – mata mata turtle.", "fish and other small animals", 0], ["Answer in a complete sentence: How much does the stick insect weigh?", "The stick insect weighs up to 20 grams", 1], ["Correct: The mata mata turtle is an invertebrate.", "The mata mata turtle is a vertebrate reptile", 2], ["What colour is the stick insect’s body?", "Brown or green", 0], ["Answer in a complete sentence: Where does the stick insect live?", "It lives in the forests of Australia", 1], ["Why does an information text use full sentences while a fact file doesn’t?", "A fact file gives quick notes under headings; an information text explains the facts in full sentences", 2]], "o": ["Match fact files to information texts.", "Find specific information quickly using headings in fact files.", "Additional outcome: Compare the two animals using information from the texts."]}, {"t": "Lesson 9: Literacy – Writing an information text", "u": "", "q": [["How long can a hammerhead shark be?", "Up to 6 metres", 0], ["What are hammerhead babies called?", "Pups", 1], ["Why shouldn’t we use abbreviations in an information text?", "Because an information text uses full sentences and complete words, e.g. kilograms not kg", 2], ["What is the hammerhead shark’s favourite food?", "Stingrays", 0], ["Change the note into a sentence: Home – warm water in oceans.", "The hammerhead shark lives in warm water in oceans all around the world", 1], ["Rewrite without abbreviations: up to 6 m long and 450 kg.", "up to six metres long and it weighs up to 450 kilograms", 0], ["Which information comes first in your text? Why?", "The animal’s name and type, to introduce the animal", 2]], "o": ["Use information from a fact file to complete an information text.", "Identify the rules for writing information texts.", "Additional outcome: Plan a fact file about an unusual wild animal."]}, {"t": "Lesson 10: Over to you!", "u": "", "q": [["Why can’t kiwi birds fly, according to the comment?", "They have small wings", 0], ["What surprising thing can the platypus do with its back feet?", "It can sting", 1], ["Complete: If you put food on a bird table, you ___ (see) lots of birds.", "will see", 2], ["Name one animal from Australia mentioned in the comments.", "Echidna, emu, platypus or camel", 0], ["Make a deduction: The goldfinch comes every day.", "It must be hungry", 1]], "o": ["Read readers’ comments and find information about animals.", "Use modals of deduction and the first conditional in personal sentences.", "Additional outcome: Answer the WOW! question: Why are animals so awesome?"]}, {"t": "Lesson 11: Get ready for… A2 Key for Schools", "u": "", "q": [["How long has Thuriya been a writer?", "B – For twenty years", 0], ["How often does Thuriya cook dinner?", "A – Twice a week (Monday and Friday)", 1], ["Why is “A month ago” wrong for when she travelled to Antarctica?", "Because she has been there for three weeks", 2], ["Who reads Wild Kids magazine?", "Thousands of children all around the world", 0], ["Where is Thuriya going next?", "To Africa", 1], ["Why will she be happier in Africa?", "Because it’s warmer there", 2], ["What type of word is missing? I’ve lived here ___ 2019.", "A preposition (since)", 0], ["Complete with one word: If it rains, we ___ stay at home.", "will", 1], ["Why is it important to read the whole text first?", "To understand the general meaning and predict the missing words", 2], ["Complete with one word: It ___ be a bird. It doesn’t have wings.", "can’t", 0], ["Complete with one word: A seal has ___ instead of feet.", "flippers", 1]], "o": ["Read an interview text and choose the correct answers (A2 Key Reading Part 3).", "Check wrong options to confirm the correct answer.", "Additional outcome: Explain why the other options are wrong."]}, {"t": "Lesson 12: Optional lesson – Fun corner", "u": "", "q": [["Which animals have paws, claws and whiskers?", "Cats, tigers, lions, leopards", 1], ["Complete: It might be a ___ because it has antennae.", "beetle / bee / ant", 2], ["A bird has ___.", "a beak / wings / feathers", 0]], "o": ["Use Unit 2 vocabulary and grammar to complete sentences in a board game.", "Make deductions and first conditional sentences in play.", "Additional outcome: Take turns and help partners correct their sentences."]}, {"t": "Graded readers 1 and 2: The Desert Safari / The Nature Hunt", "u": "", "q": [["What does the eagle catch?", "A rabbit", 0], ["What do the gazelles use their long horns for?", "To fight with", 1], ["Why do they leave the scorpion quickly?", "Because if it stings you, you’ll need to go to hospital", 2], ["Where are Khalid and his family?", "On a desert safari, on the back of a big truck", 0], ["What does the Arabian leopard look like?", "It has big paws and long whiskers", 1], ["Write the guide’s sentence about the leopard with if.", "If you look over there, you’ll see an Arabian leopard!", 2], ["The family are on the back of a big bus.", "False", 0, 1], ["How sure is the guide in: They could be Arabian gazelles?", "Not sure", 1], ["What does the guide do when the leopard comes close?", "He throws some meat to the leopard", 2], ["Complete: It ___ be looking for food. (Khalid is sure)", "must", 0], ["Why does Khalid’s mum look worried?", "Because the leopard is running to the truck and roaring", 1], ["What do the girls need to find?", "An animal with antennae, one with spines, one with scales and fins and one that lays eggs", 0], ["Which animal lays eggs in the story?", "Flamingos", 1], ["Where do they find fish with fins and scales?", "In a lake", 0], ["Which animal with antennae do they find at the end?", "A beetle on the bus window", 1], ["Why do they win the prize?", "Because they found all the animals on the list", 2], ["The girls find a hedgehog in the lake.", "False", 0, 1], ["Complete: If you find all the animals, you ___ win a prize.", "’ll / will", 1], ["Why does Sabah think the hunt might be difficult?", "Because they need to find four different kinds of animals", 2], ["Complete: If we work hard, we ___ find them all.", "’ll / will", 1]], "o": ["Predict the story using new words and pictures.", "Scan the story for the animals the family see.", "Additional outcome: Explain the guide’s warnings using the first conditional."]}, {"t": "Units 1–2 Review and Assessment: Short Test 1 and Unit 2 practice sheet", "u": "", "q": [["What should you do before listening?", "Read the questions and look at the pictures", 0], ["Match: I’ve chosen to write about seals … They’re good at diving because they have flippers. → Which continuation fits?", "B – But for the same reason, they’re not very fast on land …", 1], ["Which text continues with “It also has a big hump on its back”?", "4 – the animal that uses its tongue to eat plants and lives in the desert (the camel)", 2], ["Which text matches “His circus, Dream Show, will miss him very much”?", "1 – the clown who is leaving his job", 0], ["Match: If you want a place to have fun with your children … → ?", "C – We are open from 8 a.m. to 8 p.m. …", 1], ["Complete: I can’t see the turtle. It ___ be under the water. (not sure)", "might / may / could", 0], ["Choose: If you ___ (touch) the fish, it will swim away.", "touch", 1], ["Write the body part: long hairs near a cat’s nose.", "whiskers", 0], ["Complete: If a bee ___ you, it will hurt.", "stings", 1]], "o": ["Listen for specific information about places, jobs and animals.", "Match texts to their continuations in a reading task.", "Additional outcome: Reflect on test strategies they used."]}, {"t": "Lesson 1: Vocabulary – Holiday equipment", "u": "", "q": [["What do you use to charge your phone?", "A charger", 0], ["How often do children need a new passport, according to Frank?", "Every five years", 1], ["Why does Frank say not to take guidebooks?", "Because they are heavy and you can download apps instead", 2], ["Which items go in a washbag?", "Toothbrush, toothpaste, shampoo and soap", 0], ["What should you take for rainy days?", "A raincoat or an umbrella", 1], ["Which item do you need to travel to another country?", "A passport", 0], ["Complete: Take your ___ if you are ill.", "medicine", 1], ["Why is a pillow useful on a night journey?", "So you can sleep comfortably", 2], ["What do you wear on your feet at the beach?", "Flip-flops", 0]], "o": ["Name and match 12 items of holiday equipment.", "Explain Frank’s travel tips and why each item is useful.", "Additional outcome: Answer the WOW! question: Why do we travel?"]}, {"t": "Lesson 2: Team Talk – Of course! Good plan!", "u": "", "q": [["Who is going to take a small rucksack?", "Frank", 0], ["Does Majid need to take toothpaste, soap and shampoo? Why?", "No, because Frank will bring them and they can share", 1], ["How are they going to get to London? How do you know?", "By plane – Majid will get some sweets for the plane", 2], ["What does Majid not have?", "An umbrella", 0], ["Which expression means “That’s a good idea!”?", "Good plan!", 1], ["Majid has an umbrella.", "False", 0, 1], ["Complete: A: Are you ready for our trip? B: Of ___!", "course", 1], ["Explain why Frank says “Are you sure you’re ready for this trip?”", "Because Majid forgot about his passport and doesn’t have an umbrella", 2], ["Who will download a guidebook?", "Frank", 0], ["Choose an expression: Your friend helps you pack.", "Thanks for your help", 1]], "o": ["Understand a dialogue about preparing for a trip.", "Use the expressions Of course! Good plan! Thanks for your help.", "Additional outcome: Explain who will bring each item and why."]}, {"t": "Lesson 3: Grammar – going to and will", "u": "", "q": [["going to or will? We bought the tickets. We ___ visit London.", "are going to", 0], ["going to or will? The phone is ringing. I ___ answer it.", "’ll / will", 1], ["Why does Frank say I’ll take one about the umbrella?", "Because he decides at the time of speaking when Majid says he doesn’t have one", 2], ["Complete: I ___ (take) a small bag, too.", "’ll take", 0], w places in a city.", "explore", 1], ["Correct: What time the train leaves?", "What time does the train leave?", 2], ["Complete: When ___ we ___ (arrive) in Salalah?", "do … arrive", 0], ["Write the opposite: get on → ?", "get off", 1]], "o": ["Name and match 12 transport and travel verbs.", "Use the Present simple to talk about timetables and fixed plans.", "Additional outcome: Describe a journey timetable to classmates."]}, {"t": "Lesson 6: Culture and Project – Famous railways", "u": "", "q": [["Which cities does the Haramain railway connect?", "Makkah and Madinah (it also stops at Jeddah)", 0], ["How long is the Trans-Siberian railway?", "More than 9,000 kilometres", 1], ["Why do you need pyjamas on the Trans-Siberian train?", "Because you sleep on the train", 2], ["How fast can Haramain trains travel?", "300 kilometres an hour", 0], ["Which is the deepest lake in the world?", "Lake Baikal", 1], ["Write 300 kilometres an hour with the abbreviation.", "300 kmh", 0], ["What four things must your map show?", "Where the route starts and finishes, how long it is, and what you can see on the way", 1], ["Why should you sound interested when you present?", "So other people will be interested too", 2]], "o": ["Find facts about the Haramain High-Speed railway and the Trans-Siberian railway.", "Compare the two railways using numbers and facts.", "Additional outcome: Say which train journey they would prefer and why."]}, {"t": "Lesson 7: English in action – Saying how you feel about the future", "u": "", "q": [["Why is Helen worried about the journey?", "Because she doesn’t like long car journeys", 0], ["How long is Katy’s journey to Salalah?", "About nine hours", 1], ["Which expression shows a negative feeling?", "I’m worried about … / I’m not looking forward to …", 2], ["Complete: I can’t ___ for the summer holidays!", "wait", 0], ["How is Katy going to travel?", "By coach", 1], ["Complete: I’m excited ___ camping.", "about", 0], ["Which words are stressed in: Where are you going to sleep?", "Where and sleep", 1], ["Choose: I’m (looking forward to / worried about) the exam because I haven’t studied.", "worried about", 2], ["Complete: I’m really looking forward ___ the trip.", "to", 0]], "o": ["Understand a dialogue about holiday plans and feelings.", "Express feelings about future events with the Say it! expressions.", "Additional outcome: Use stress correctly in Wh- questions with going to."]}, {"t": "Lesson 8: Literacy – Reading an email", "u": "", "q": [["What time does the express coach leave?", "At 4.30 p.m", 0], ["Why do the students need to bring a swimsuit?", "Because the hotel has a brand-new swimming pool", 1], ["Since when has Bahla fort been a UNESCO World Heritage site?", "Since 1987", 2], ["What time should the students arrive at school?", "At 4 p.m", 0], ["Why must they wear trainers or comfortable shoes?", "Because they are going to do a lot of walking", 1], ["Answer in a complete sentence: When is the trip?", "The trip is next Sunday, 16th April", 0], ["What time is dinner every evening?", "At 7 p.m", 1], ["T, F or DS? The students will buy gifts in the souq.", "DS – the email says they can bring money to buy a gift if they want", 2], ["What do they need money for on Monday?", "To buy a sandwich and a drink", 0], ["Why is the weather information important?", "So students bring a sunhat and light clothes", 1], ["Answer in a complete sentence: What can you see from the walls at the top of the fort?", "You can see some wonderful views from the walls at the top", 2]], "o": ["Find specific information in an email about a school trip.", "Use a dictionary only for important words while reading.", "Additional outcome: Decide what else the students might need on the trip."]}, {"t": "Lesson 9: Literacy – Writing an email", "u": "", "q": [["Complete: We’re going to travel by ___ rocket to the Moon.", "express", 0], ["How does the Moon email end?", "Yours, Mrs Muna, head teacher", 1], ["Why is the Moon email organised by days?", "To make the plan clear and easy to follow", 2], ["Complete: Bring a ___ suitcase because the rocket isn’t very big!", "small", 0], ["Which part of the email tells the reader the topic?", "The subject box", 0], ["Is a school trip email formal or informal? How do you know?", "Quite formal – it starts with Dear students and ends with Yours and the teacher’s name", 2]], "o": ["Complete an email with suitable adjectives.", "Identify how emails start, end and are organised.", "Additional outcome: Plan an email about a school trip."]}, {"t": "Lesson 10: Over to you!", "u": "", "q": [["Which child is going to take a pillow and sleep in the car?", "The child going to stay at the aunt and uncle’s house by the sea", 0], ["Complete: We ___ (take off) on Friday after school.", "take off", 1], ["Why does one child think the Moon story might not be science fiction?", "Because you can already buy a ticket for a journey into space", 2], ["Match: catch a ___ / travel by ___", "bus / train", 0], ["Complete: It’s cold. I ___ (take) my jacket.", "’ll take", 1]], "o": ["Read comments and identify children who are going on trips.", "Use going to, will and the Present simple for the future accurately.", "Additional outcome: Answer the WOW! question: Why do we travel?"]}, {"t": "Lesson 11: Get ready for… A2 Key for Schools", "u": "", "q": [["Circus notice: half-price tickets on Monday, 10 rials. How much is a ticket on Monday?", "5 rials (A)", 0], ["Airport notice: Which sentence is true?", "B – There are boxes to put devices in", 1], ["Why does Zahran ask Nawaf to buy a guidebook?", "Because his wallet is empty and he wants to read about the paintings", 2], ["Airport notice: Do you have to take off your shoes?", "No, you don’t have to take off your shoes", 0], ["What is one exam tip for Reading Part 1?", "Look at each text and think where you might see it", 1]], "o": ["Listen and match people to presents (A2 Key Listening Part 5).", "Understand short notices and messages (A2 Key Reading and Writing Part 1).", "Additional outcome: Write a short story of 35 words or more about a picture."]}, {"t": "Graded reader 1: The Game on the Train", "u": "", "q": [["Where are Brian and Jack travelling to?", "To Edinburgh, by train", 0], ["Why does the train stop?", "Because there are cows on the track", 1], ["Why is Jack worried?", "His tablet has no more battery and he forgot to bring his charger", 2], ["What time do they arrive in Edinburgh?", "At four o’clock", 0], ["Find a Present simple sentence for the future in the story.", "It leaves in five minutes. / We arrive in Edinburgh at four o’clock", 1]], "o": ["Predict and follow the main events of a story.", "Find examples of will, going to and the Present simple for the future in the story.", "Additional outcome: Suggest a game to play on a long journey."]}, {"t": "Learning club 1 – Lesson 1: Language booster (months, seasons, telling the time)", "u": "", "q": [["How long does it take the Earth to go around the Sun?", "365 days (a year)", 0], ["When it’s 7 p.m. in Muscat, what time is it in New York?", "11 a.m", 1], ["Why are the seasons in Australia opposite to Europe?", "Because when Europe is closer to the Sun, Australia is further away, and the other way round", 2], ["Which months are winter in Europe?", "December, January and February", 0], ["Write the time: 4:15.", "It’s quarter past four", 1], ["What season is it for Shihab in Oman in the dialogue?", "Summer", 2], ["Which month comes after March?", "April", 0], ["Write 2:45 in words.", "It’s quarter to three", 1], ["If it’s summer in Oman, which season is it in Australia?", "Winter", 2], ["Write the four seasons.", "spring, summer, autumn, winter", 0], ["Write 8:30 in words.", "It’s half past eight", 1]], "o": ["Name the months and seasons and explain why we have seasons and day and night.", "Tell the time with o’clock, quarter past, half past and quarter to.", "Additional outcome: Compare seasons in Oman and other countries."]}, {"t": "Learning club 1 – Lesson 2: Think like a scientist! Carroll diagrams", "u": "", "q": [["What type of diagram shows yes and no information?", "A Carroll diagram", 0], ["A cinema needs sound and it needs light.", "True", 1, 1], ["A bowling alley needs sound, but it doesn’t need any light.", "False", 2, 1], ["Does a zip wire need light or sound?", "No, it doesn’t need light or sound", 0], ["Correct: A street parade needs light, but it doesn’t need any sound.", "A street parade needs sound, but it doesn’t need light", 1]], "o": ["Read a Carroll diagram showing which entertainment places need light and sound.", "Say if statements about the diagram are true or false.", "Additional outcome: Make sentences with needs … but doesn’t need …"]}, {"t": "Learning club 1 – Lesson 3: Let’s practise! Carroll diagrams", "u": "", "q": [["Where does a hair dryer go: heat, movement or both?", "Both – it makes heat and movement", 0], ["Does an escalator make heat or movement?", "Movement", 1], ["Does a comedian need music or sports equipment? Where does a comedian go in the diagram?", "No – a comedian doesn’t need music or sports equipment, so he/she goes in the box for don’t need sports equipment and don’t need music", 2], ["Does a blender make heat?", "No, it makes movement", 0]], "o": ["Place machines in a Carroll diagram (makes heat / makes movement).", "Create a Carroll diagram to classify jobs.", "Additional outcome: Play Guess the job using the diagram categories."]}]};</script>
