لموارد", 0], ["ما الفرق بين الهيكلية الخطية والهيكلية النجمية في طريقة توصيل الأجهزة؟", "في الخطية تتصل الأجهزة بسلك مركزي واحد مشترك (الناقل)، وفي النجمية تتصل جميع الأجهزة بجهاز مركزي مثل المبدّل أو المحوّل", 1], ["لماذا ينخفض أداء الشبكة الخطية عندما ترسل عدة أجهزة بيانات في الوقت نفسه؟", "لأن جميع الأجهزة تشترك في سلك واحد (الناقل)، فتتزاحم البيانات عليه كما تتباطأ السيارات الكثيرة على طريق واحد", 2], ["أكمل: طريقة ربط أجهزة الحاسوب ببعضها تُسمى ........", "هيكلية الشبكة", 0], ["اختر الصحيح: الهيكلية التي تربط جهازين فقط في وقت واحد هي", "نقطة إلى نقطة", 1, ["النجمية"]], ["ماذا يحدث للشبكة النجمية إذا تعطل جهاز واحد من أجهزتها؟ وماذا يحدث إذا تعطل المبدّل؟", "تعطل جهاز واحد لا يؤثر في أداء الشبكة، أما تعطل الجهاز المركزي (المبدّل أو المحوّل) فيوقف الشبكة بأكملها", 2], ["في نموذج العميل والمزوّد، من يطلب الخدمة ومن يقدّمها؟", "العميل يطلب الخدمة، والمزوّد يقدّمها ويلبّي الطلب", 0], ["ما وظيفة بروتوكولات الاتصال؟", "تحدد كيفية تنسيق الرسائل وتبادلها بين أجهزة الحاسوب عبر الشبكة، مثل قواعد المرور التي تنظم حركة السيارات", 1], ["اذكر سببين لتقسيم البيانات إلى حزم صغيرة بدلًا من إرسالها وحدة واحدة.", "إذا فُقدت حزمة يُعاد إرسالها وحدها لا الملف كله، ويحتوي رأس كل حزمة على رقمها وعنوان المرسل والمستلم فيعيد المستلم ترتيبها بشكل صحيح", 2], ["أكمل: الجزء من الحزمة الذي يحتوي على البيانات الفعلية المرسلة هو ........", "الحمولة (Payload)", 0], ["صح أم خطأ: في شبكة النظير للنظير يتحكم حاسوب واحد بجميع الحواسيب الأخرى. صحّح الخطأ إن وجد.", "خطأ؛ في شبكة النظير للنظير يكون لجميع الأجهزة أدوار متساوية ولا يوجد جهاز رئيس يتحكم بالأجهزة الأخرى", 1]], "o": ["يتعرّف مفهوم شبكة الحاسوب (Computer Network) والغرض منها.", "يتعرّف مفهوم هيكلية الشبكة (Network Topology).", "يميّز بين أنواع هيكليات الشبكة: نقطة إلى نقطة، والخطية، والنجمية، من حيث طريقة التوصيل والمزايا والعيوب.", "يفسّر سبب انخفاض أداء الشبكة في الهيكلية الخطية عندما ترسل عدة أجهزة بيانات في الوقت نفسه."]}, {"t": "اختيار جهاز الحاسوب وإصلاح الأنظمة", "u": "الوحدة الثالثة: الشبكات والمواطنة الرقمية", "q": [["أي جهاز يناس
