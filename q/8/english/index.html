 1]], "o": ["Read the About Us page and match the photos to the WOW! Team members.", "Choose the correct question words to complete personal questions.", "Ask and answer personal questions with a partner and compare the answers.", "Guess the question word from a partner’s clue (reason, place, time…)."]}, {"t": "Lesson 1: Vocabulary – The environment", "u": "Unit 1: Our planet", "q": [["What does “switch off lights” mean?", "To turn off the lights so they stop using electricity", 0], ["How did Manar help the environment?", "She picked up more than 30 pieces of rubbish from the beach", 1], ["Is “global warming” a problem or a solution? Explain.", "A problem – the planet is getting hotter", 2], ["Complete: Please ___ ___ the lights when you go out.", "switch off", 0], ["Circle: Scientists think people’s activities are causing global / climate / environment warming.", "global", 1], ["Complete: Could you please ___ ___ those bottles and put them in the bin?", "pick up", 2], ["Write the missing word: ___ the rainforests.", "destroy", 0], ["Put these in the correct group: pollution, plant trees, waste energy, recycle.", "Problems: pollution, waste energy. Help: plant trees, recycle", 1], ["Complete: People need to use ___ energy.", "renewable", 0], ["Choose", "waste", 1, ["A lot of people switch", "save energy by leaving on lights all the time"]]], "o": ["Recognise and pronounce 12 phrases about the environment.", "Classify the phrases into our planet’s problems and things we can do to help.", "Answer personal questions about recycling, saving water and saving energy.", "Complete sentences with the correct environment phrases using picture prompts."]}, {"t": "Lesson 2: WOW! Team Talk – Saving energy", "u": "Unit 1: Our planet", "q": [["Why are they going to close doors?", "To keep the classroom cool", 0], ["What recycling boxes do they already have?", "Recycling boxes for paper", 1], ["Which expression shows you agree you do the same thing?", "Me too!", 2], ["Match: There’  report.", "never", 2]], "o": ["Use the title and diagrams to predict what a report is about.", "Decide if statements about the report are true or false and explain why.", "Explain how diagrams help readers understand information.", "Match definitions to the Words in context."]}, {"t": "Lesson 9: Literacy – Writing a report", "u": "Unit 1: Our planet", "q": [["How many students answered the survey?", "453 students", 0], ["What does paragraph three do?", "It explains what the survey results show", 1], ["Complete: 32% said recycling ___ 24% said saving energy.", "while", 2], ["Complete: My sister says she wants to help the environment. ___, she doesn’t pick up her rubbish.", "However", 0], ["What is the most popular way to save water in the survey?", "Take a quick shower (46%)", 2], ["What was the least popular way to help the environment?", "Planting trees (9%)", 0], ["Which words in the report show the order of information?", "Firstly, secondly, in conclusion", 1], ["Check: Does your report include your own opinion? Should it?", "No – a report presents only the facts", 2]], "o": ["Read a survey report and interpret its diagrams.", "Match the report’s paragraphs to their purposes.", "Use while and however to contrast two pieces of information.", "Complete sentences with while or however."]}, {"t": "Lesson 10: Over to you! – Unit review", "u": "Unit 1: Our planet", "q": [["Who made a statue from rubbish found on the beach?", "Faris", 0], ["Unscramble: nyclcoe", "cyclone", 1], ["Choose: We must / mustn’t destroy the rainforests.", "mustn’t", 2], ["Report: ‘Spell the word cyclone aloud.’", "I told you to spell the word cyclone aloud", 0], ["Report: ‘Do you save water?’", "I asked you if you saved water", 1], ["Report: ‘How many letters are in the word drought?’", "I asked you how many letters were in the word drought", 2], ["What did Leo say about floods in his town?", "It rained so much that the river water destroyed a lot of homes", 0], ["Report: ‘Do you recycle?’ (Sh
