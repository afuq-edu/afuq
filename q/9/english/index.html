<script>window.QZ={"g": "9", "gn": "التاسع", "s": "english", "sn": "اللغة الإنجليزية", "L": [{"t": "Starter: Fun times!", "u": "Starter", "q": [["Who has made a decision about their future career? Which words show it?", "Dana: 'I now know what kind of job I want to do when I'm older.'", 1], ["Complete: I bought ___ new camera last week.", "a", 0], ["Complete: Writing a blog takes ___ time, and ___ communication is really important.", "No article (–) in both gaps", 1], ["What did speaker 2 think of the new food?", "She didn't really like it; it was much too sweet for her", 0], ["Make a past simple question for activity E: have a picnic.", "Did you have a picnic with friends or family?", 1], ["Write the past simple of: go, swim, take.", "went, swam, took", 0], ["Correct the mistake: Did you went to the beach?", "Did you go to the beach?", 1], ["What did the writer of the model paragraph do?", "She played the violin at an audition and was accepted to perform in a show", 0], ["Which skills did the writer use?", "Playing the violin, preparing a musical piece and practising hard", 1], ["Why was it the writer's best moment?", "She was accepted, performed in the show and learnt that hard work leads to success", 2], ["Write the four questions your paragraph must answer.", "When did it happen? What did you do? What skills did you use? Why was it your best moment?", 0], ["Complete: I ___ (feel) nervous, but I ___ (play) perfectly.", "felt, played", 1], ["Make a comparative sentence: walking to school / taking the bus (good).", "Walking to school is better than taking the bus", 0], ["Complete: Mexico City is ___ (big) city I've visited.", "the biggest", 1], ["Rewrite with as ... as: Sara is very shy and so is Shannon.", "Sara is as shy as Shannon", 2], ["Choose: You shouldn't leave (a / the / –) Mexico without trying elote.", "– (no article)", 0], ["Rewrite: My brother is more active than me. (not as ... as)", "I'm not as active as my brother", 1]], "o": ["Find things in common with classmates by asking and answering questions about free time.", "Scan short social media posts to match them with photos, topics and specific information.", "Complete a blog post using a, an, the or no article correctly.", "Respect classmates' interests and share personal experiences politely."]}, {"t": "Lesson 1: Reading – identities", "u": "Unit 1: Identity", "q": [["What hobbies does Hana have?", "Cooking and travelling", 1], ["Which key words show that Cody likes sport, and how is his interest different?", "'keen on sport, but only watching it, not playing it' – he watches sport but doesn't play it", 2], ["Who is having karate lessons at the moment?", "Osama", 0], ["Name two things Kim does in his free time.", "He plays instruments/goes to musicals, and he makes videos about hairstyles and clothes", 1], ["Why does board D belong to Osama?", "It shows a mosque and buildings (capital city), a sports kit (football), a karate club card and friends together", 0], ["Which word means 'the area behind the main thing you are looking at'?", "background", 1], ["Why doesn't board B match Kim even though it shows a guitar?", "Board B doesn't show a busy city street, shows or clothes; all of Kim's information must match, and only board C does", 2], ["Complete: In the ___ you can see tall mountains.", "background", 1], ["Which club is best for Majid, and why?", "C, the Basketball Club: he is fit, wants to learn something new, take part in competitions and do something at weekends", 0], ["What does 'pick up' mean in 'You will pick up skills quickly'?", "learn something new (without formal study)", 1], ["Why is the Hiking Club right for Brooke but not for Rob?", "Brooke likes being outdoors and meeting people; Rob doesn't like being in nature and wants a creative hobby", 2], ["Complete: I need to buy a racket because I'm going to ___ tennis.", "take up", 0], ["Complete: They never ___ when we go hiking. They prefer to play video games.", "join in", 1]], "o": ["Describe their own personality and identity using simple adjectives.", "Explain what a photo board is and what it shows about a person.", "Read six short profiles and underline the key words about hobbies.", "Appreciate that every person's identity is made of many different parts."]}, {"t": "Lesson 2: Grammar – present simple and present continuous", "u": "Unit 1: Identity", "q": [["Which tense do we use for habits: 'I ___ (play) football on Tuesdays'?", "Present simple: I play football on Tuesdays", 0], ["Complete: Look! The children ___ (play) in the garden.", "are playing", 1], ["Why is 'I'm knowing the answer' wrong?", "Know is a stative verb, so we use the present simple: I know the answer", 2], ["Complete: My school day ___ (start) at eight o'clock.", "starts", 0], ["Choose: I think / I'm thinking you're wrong.", "I think (opinion = state)", 1], ["Complete: What ___ you ___ (think) about? You look happy!", "are you thinking", 0], ["Why does Darcy have to go?", "Because her dad is calling her", 1], ["Choose and explain: Scottish food tastes / is tasting very different.", "tastes – taste is a stative verb describing a quality", 2], ["Complete: It never ___ (rain) in June, but look, it ___ (rain) outside now!", "rains, 's raining", 0], ["Make a question: you / often / listen / to classical music?", "Do you often listen to classical music?", 1]], "o": ["Distinguish the uses of the present simple (permanent states, habits) and the present continuous (now, around now).", "Complete sentences from a video/recording with the correct present tense.", "Recognise stative verbs that are not usually used in the continuous form.", "Use English confidently to talk about their daily lives."]}, {"t": "Lesson 3: Vocabulary – personality adjectives", "u": "Unit 1: Identity", "q": [["Which adjective describes someone who doesn't like working?", "lazy", 0], ["Complete: She's very good ___ listening.", "at", 1], ["Why is 'interested' the right answer in 'I'm quite interested ___ the changes' only with 'in'?", "Interested always collocates with in; the other prepositions are not used with it", 2], ["Complete: I'm fed up ___ this song.", "with", 0], ["Choose: Someone who believes he can do things well is", "confident", 1, ["shy"]], ["Which adjective matches: 'Thuriya makes me laugh'?", "funny", 0], ["Complete: We're both keen ___ sports.", "on", 1], ["Correct the mistake: I'm interested on technology.", "I'm interested in technology", 2], ["Complete: I'm terrible ___ playing the piano.", "at", 0], ["Choose: Najla doesn't often joke or smile. She's", "serious", 1, ["sociable"]]], "o": ["Match personality adjectives with their meanings and classify them as positive, negative or neutral.", "Use adjective + preposition collocations (good at, keen on, interested in ...) correctly.", "Complete a multiple-choice cloze text about how personality develops.", "Describe people fairly and avoid unkind labels."]}, {"t": "Lesson 4: Listening – cities", "u": "Unit 1: Identity", "q": [["Is question 5 (What advice does Henry give?) asking for agreement, a suggestion or feelings?", "A suggestion", 0], ["What does the grandmother find exciting about the city now?", "All the different places to eat with food from around the world", 1], ["How do we know the two friends in conversation 6 are both more stressed in the city?", "One laughs more in the country and the other says he worries more in the city", 2], ["What do the two friends in conversation 3 agree about?", "They enjoy the different seasons", 0], ["How does Dylan feel about his new city?", "Surprised by how friendly people are", 1], ["Where does 'always' go in: I am tired on Thursday evenings?", "After the verb be: I am always tired on Thursday evenings", 0], ["Order: often / it / rains / in the middle of the day", "It often rains in the middle of the day", 1], ["Why is 'Tom and I go once a week skating' wrong?", "Time phrases usually go at the end: Tom and I go skating once a week", 2], ["Order: usually / it / dark / isn't / in June", "It isn't usually dark in June", 0], ["Choose the correct position: I (rarely) take part in a sport.", "I rarely take part in a sport", 1], ["Which word in question 3 shows it asks for a suggestion?", "should (What does the boy think Juma should do?)", 0], ["What do the two friends agree to do in the city centre?", "Look at books (go to a bookshop)", 1], ["Rewrite: My parents go to the cinema. (hardly ever)", "My parents hardly ever go to the cinema", 2], ["Match: 'rarely' has a similar meaning to ...", "hardly ever", 0], ["Rewrite: We travel by train. (rarely)", "We rarely travel by train", 1]], "o": ["Describe how a city makes them feel using adjectives for emotions.", "Decide whether a listening question asks for agreement, a suggestion or feelings, and find its key words.", "Listen to six short conversations and choose the correct answers.", "Appreciate both city and country life and the people who live there."]}, {"t": "Lesson 5: Speaking – giving personal information", "u": "Unit 1: Identity", "q": [["How do you ask someone to spell the name of their town?", "How do you spell the (name of the) town?", 0], ["Why does Chen give the best answers in Ex 3?", "His answers are fuller and more descriptive (he says where Guangzhou is and adds details)", 1], ["Which words introduce a reason in the useful language box?", "because, as, one reason is (that)", 0], ["Order: middle / 's / your / what / name / ?", "What's your middle name?", 0], ["Complete: I take the bus to school ___ the bus stop is just across the street.", "because", 1], ["Complete with what, where, who or how: ___ do you get to school every day?", "How", 0], ["Complete: It's a big city in Spain, ___ it's not the capital.", "but", 1]], "o": ["Ask for and give personal information (full name, address, postcode, email), spelling difficult words.", "Evaluate two students' interview answers and decide who answers better and why.", "Use because, as, one reason is (that) and for example to extend answers.", "Share personal information carefully and only when it is safe and appropriate."]}, {"t": "Lesson 6: Writing – an email (a personal profile)", "u": "Unit 1: Identity", "q": [["Which paragraph tells Channel 1 why they should choose Rahaf?", "Paragraph 4", 0], ["Where does 'quite' go with 'an interesting story'?", "Before the article: quite an interesting story", 1], ["Why can't we say 'I was very terrified'?", "Terrified is an extreme adjective, so we don't use very or quite with it", 2], ["Complete with quite or very and an article: It was ___ exciting day.", "a very exciting day / quite an exciting day", 0], ["Find one phrase with quite in Rahaf's email.", "quite sociable", 1], ["Join with so: I'm not very keen on maths. I prefer art and P.E.", "I'm not very keen on maths, so I prefer subjects like art and P.E", 0], ["Which linking word introduces a contrast?", "but", 1], ["What should each content point in the email include?", "The point itself plus some extra information (details, reasons or examples)", 2], ["Complete: Choose me ___ I'm a very funny person.", "because", 0], ["Name the four content points in the Channel 1 email.", "Where you live, your personality, what you enjoy, and why they should choose you", 1], ["Is 'I do karate once a week' about personality, hobbies or likes and dislikes?", "Hobbies (H)", 0], ["Rewrite: I don't like speaking in public. (very) – I'm not a ___ person.", "very confident", 1], ["What makes Dana's email persuasive?", "She covers all four points, gives extra information and uses adjectives and quite/very, e.g. I always try to help people", 2], ["Which preposition goes with 'fed up'?", "with", 0], ["Rewrite: I'm terrified of heights. (very) – I'm ___ of heights.", "very scared", 1]], "o": ["Talk about likes and dislikes using love, be interested in, be keen on and can't stand.", "Match the paragraphs of a model email with the writer's notes.", "Explain how quite and very change the strength of adjectives, including their position with a/an.", "Value the unique places and communities of Oman, such as Misfat Al Abryeen."]}, {"t": "Lesson 7: Switch On – Learning is fun (video and project)", "u": "Unit 1: Identity", "q": [["According to the video, where and when can people learn?", "Anywhere and at any time/age", 0], ["Complete: My dad is taking an evening class so he can ___ our car himself.", "repair", 1], ["Give two advantages of learning new skills mentioned in the video.", "It helps you feel more confident and meet new people (and can save money)", 2], ["How do some people learn new things from home?", "They use apps or watch video tutorials", 0], ["Complete: She ___ new friends there, and that ___ her the confidence to apply for a promotion.", "made, gave", 1], ["What information must each class description include?", "Time, length, what to bring, and what people will learn", 0], ["Complete: The cooking class ___ (start) at 6 p.m. every Monday.", "starts", 0]], "o": ["Discuss where and when people learn new things.", "Watch a video and complete a summary with key information.", "Use verb–noun collocations from the video (arrange flowers, repair a car, take a class, join a class).", "Value lifelong learning as a habit at any age."]}, {"t": "Lesson 8: Unit Check", "u": "Unit 1: Identity", "q": [["Choose: My cousin's very ___. He always gets good marks.", "clever", 0, ["shy"]], ["Complete: I'm not afraid ___ trying!", "of", 1], ["Which adjective describes Asma, who loves being with a big crowd of friends?", "sociable", 2], ["Complete: I love hanging ___ with my new French friends.", "out", 0], ["Complete: You're ___ at science – you get great marks! (b...)", "brilliant", 1], ["Choose: Do you visit always / Do you always visit your grandparents?", "Do you always visit", 0], ["Complete: That smells nice! What ___ (you / cook)?", "are you cooking", 1], ["Why is 'I'm not thinking that's a good idea' wrong?", "Think here means opinion (state), so we use the present simple: I don't think", 2], ["Order: never / Osama / is / late / for school", "Osama is never late for school", 0], ["Complete: All you have to do is spend one hour ___ Wednesday afternoons.", "on", 1], ["Make a question: why / Lew / have to / translate for Fred?", "Why does Lew have to translate for Fred?", 0], ["Complete: I don't like speaking in front of many people. I'm very s___.", "shy", 1], ["Choose: They think we're all bad (in / with / at / on) writing.", "at", 2], ["Is Fred's Polish improving? Answer in a full sentence.", "No, it isn't", 0], ["Complete: I'm really keen ___ drama.", "on", 1]], "o": ["Recall unit vocabulary: personality adjectives, adjective + preposition collocations and adjectives for emotions.", "Choose the correct adjective to complete sentences.", "Complete a message and a conversation with prepositions and collocations.", "Take responsibility for revising and organising their own vocabulary."]}, {"t": "Unit 1 Consolidation: Grammar file and speaking practice", "u": "Unit 1: Identity", "q": [["Choose: My mother doesn't like / isn't liking using a laptop.", "doesn't like", 0], ["Is 'this week' used with the present simple or present continuous?", "Present continuous", 1], ["Complete: At the moment, I ___ (do) my homework.", "'m doing", 0], ["Make a question and short answer: you / like / school? Yes, ...", "Do you like school? Yes, I do", 1]], "o": ["Choose the correct present tense in sentences, an email and questions with stative verbs.", "Classify time expressions as used with the present simple or present continuous.", "Answer Part 1 introduction questions fluently with reasons and examples.", "Use the grammar file independently to check and correct their own work."]}, {"t": "Lesson 1: Reading – the importance of languages", "u": "Unit 2: Connections", "q": [["Is it true that Arabic is spoken by more than 300 million people?", "True", 0, 1], ["Where might you see the 'Extra English lessons' text?", "On a school noticeboard", 1], ["Why is option A wrong for question 1 in Ex 5?", "The notice says students with low grades can attend, not only students with good grades", 2], ["Why has Eliza sent the message to Anna?", "To tell her she needs to pay for something (the trip money is due on Friday)", 0], ["How did the writer feel about learning French when he was young?", "B – unhappy because it didn't seem necessary", 0], ["Which word in paragraph 4 means 'in danger'?", "at risk", 1], ["Why is answer A correct for question 5?", "The writer says languages carry stories, traditions and memories, so he wants to keep as many languages alive as possible", 2], ["What did the writer learn when he returned to Canada?", "Some of his classmates spoke French at home (French was their first language)", 0], ["Complete: Something strange ___ (happen = o...) over the weekend.", "occurred", 1], ["What does Fatma need her dad to do?", "Deliver her Chinese notes to the school reception", 0], ["Who helped Léa learn the most Wolof?", "Her cousins, who were her age and learning French", 1], ["What does 'flew by' mean in 'The three weeks flew by'?", "went very quickly", 2], ["Does Léa think learning a new language is positive or negative?", "Positive", 0], ["Complete: The grammar lesson was s___ confusing at first.", "slightly", 1], ["What would Léa say to someone who is thinking about learning a new language?", "If you ever get the chance to learn a new language, do it – it's a wonderful experience", 2]], "o": ["Discuss how they communicate with friends and what they talk about.", "Decide whether facts about languages are true or false and check them.", "Read short texts (a notice and a message) and choose the option that matches all the information.", "Value Arabic and other languages as part of people's identity and culture."]}, {"t": "Lesson 2: Grammar – past simple and past continuous", "u": "Unit 2: Connections", "q": [["How do we form the past continuous?", "was/were + verb-ing, e.g. was talking", 0], ["Complete: I ___ (do) my homework when my auntie ___ (ring).", "was doing, rang", 1], ["Why is 'I wasn't understanding why...' wrong?", "Understand is a stative verb, so we use the past simple: I didn't understand", 2], ["Choose: While I listened / was listening to the podcast, I realised something.", "was listening", 0], ["Write the past simple of: grow, make, see.", "grew, made, saw", 1], ["Write the past simple of 'stop' and 'try'.", "stopped, tried", 0], ["Complete: It ___ (rain) and I ___ (stand) at the bus stop getting wet.", "was raining, was standing", 1], ["Choose and explain: When we arrived / were arriving, all the guests were eating.", "arrived – it is the short action that happened while the longer action was in progress", 2], ["Complete: I ___ (sleep). I fell asleep while I ___ (watch) a film.", "was sleeping, was watching", 0], ["Complete: ___ you ___ (take) a lot of books with you on your language exchange?", "Did you take", 1]], "o": ["Explain the uses and form of the past simple and past continuous.", "Complete sentences from a video with the past simple or past continuous.", "Choose the correct past form in a text, recognising stative verbs that are not used in the continuous.", "Appreciate how older generations communicated and respect their experiences."]}, {"t": "Lesson 3: Vocabulary – language and communication", "u": "Unit 2: Connections", "q": [["Which verb means 'change words into another language'?", "translate", 0], ["Choose: She didn't tell / talk me the answer.", "tell", 1], ["Why is 'Can you listen me now?' wrong?", "Listen needs to before an object; here we need hear: Can you hear me now?", 2], ["Complete: Sometimes she ___ Spanish to me, and I tried to keep up.", "spoke", 0], ["Choose: We say / speak two languages at home.", "speak", 1], ["Which verb means 'have a definition or explanation'?", "mean", 0], ["Complete: How do you ___ this word? You say it like this: 'quiet'.", "pronounce", 1], ["Choose?", "talk", 2, ["Do you tell", "say to your friends about your problems"]], ["Complete: I didn't catch all that. Could you ___ it, please?", "repeat", 0], ["Complete: I ask my Thai friend to ___ for me.", "translate", 1]], "o": ["Use communication verbs (explain, mean, pronounce, repeat, say, speak, translate, understand) correctly.", "Distinguish confusing verbs: tell/talk, say/speak, hear/listen, and use them with the right prepositions.", "Complete a multiple-choice cloze about communicating across languages.", "Communicate patiently with people who speak other languages."]}, {"t": "Lesson 4: Listening – communicating with animals", "u": "Unit 2: Connections", "q": [["What kind of word is missing in: 'In the USA, Monty Roberts watched the way horses behaved in ___'?", "A place", 0], ["How old was Mudrik when he became interested in animal communication?", "12 (twelve)", 1], ["Why is '25' a wrong answer for gap 1?", "25 is the number of years he has been interested, not his age when he started", 2], ["What do dolphins chase fish towards in Brazil?", "(the) nets", 0], ["What do experts in Africa use to keep elephants away from villages?", "sounds (copying elephant sounds)", 1], ["According to the talk, what is important when we communicate with animals?", "Treating them with respect", 2], ["Why do we use 'being' in 'Many animal lovers dream of being able to talk to animals'?", "Because it comes after the preposition of", 0], ["Complete: ___ (use) AI, scientists discovered that whales use 143 different sounds.", "Using", 1], ["Write the -ing form of: make, swim, lie.", "making, swimming, lying", 2], ["Complete: What if a rabbit is fed up with ___ (play) in the same area every day?", "playing", 0], ["Correct: Swim is really good for you.", "Swimming is really good for you", 1], ["What will the online course teach you to use AI for?", "Presentations", 0], ["How much is the fee for the course?", "€20 (twenty euros)", 1], ["Why do children under thirteen need a parent at face-to-face sessions?", "Because the course rules say anyone not yet a teenager must attend with a parent", 2], ["What do you get if you pass the end-of-course test?", "A certificate", 0], ["Complete: I'm not very good at ___ (work) independently.", "working", 1]], "o": ["Predict the type of word missing in each gap (number, place, thing, feeling).", "Listen to a talk and complete sentences with one or two words or a number.", "Explain how people communicate with horses, dolphins and elephants.", "Treat animals with respect and kindness."]}, {"t": "Lesson 5: Speaking – describing a photo", "u": "Unit 2: Connections", "q": [["Why do we say 'The friends might be watching a film'?", "Because we are guessing; might shows possibility", 1], ["What could the student in 2.04 add to fill one minute?", "What the people look like and wear, more objects and the background", 2], ["Complete: In the ___, there are some trees and buildings.", "background", 0], ["Which function does 'The boys are both wearing coats' have?", "Saying what the people look like or are wearing", 1]], "o": ["Talk about the people they speak to every day, giving reasons and examples.", "Speak fluently for thirty seconds about a person using who, what, where, when and why.", "Organise a photo description: introduction, place, people's appearance and actions.", "Be polite and friendly when communicating with people in the community."]}, {"t": "Lesson 6: Writing – a story", "u": "Unit 2: Connections", "q": [["Correct the mistake: Lucky me – I'm in holiday again.", "I'm on holiday again", 0], ["Why does the story use 'were waiting' in gap 3?", "It is a longer background action in progress when something else happened", 1], ["Correct: So proud with myself!", "So proud of myself!", 0], ["Complete: While she ___ (present), I picked up my laptop.", "was presenting", 1], ["Replace 'very funny' with a strong adjective.", "hilarious", 0], ["Correct: It was very fantastic!", "It was absolutely fantastic!", 1], ["Where must the given sentence come in your story?", "At the beginning (first)", 2], ["Replace 'really big' in: The beach here is really big.", "huge", 0], ["Complete with a strong adverb: The film was ___ brilliant.", "absolutely", 1], ["Which note answers 'Where did it happen?'", "A – a restaurant; huge, not busy", 0], ["Replace 'very bad to eat' in the story.", "disgusting", 1], ["What makes a story more interesting for the reader?", "Strong adjectives and adverbs, a clear order of events and a good ending", 2], ["Replace: We were ___ (very angry) when we saw the bill.", "furious", 0], ["Complete: The restaurant was ___ (very big) but there weren't many people there.", "huge", 1]], "o": ["Discuss social media and honesty in what people post online.", "Correct preposition mistakes in short social media posts.", "Complete a story with the past simple and past continuous.", "Be honest and responsible when posting online."]}, {"t": "Lesson 7: Switch On – You and your phone (video interviews and project)", "u": "Unit 2: Connections", "q": [["Which speaker mentions writing to people offline?", "Maxwell", 0], ["Complete: I think ___ be quite bored.", "I'll", 1, ["I", "I'd"]], ["Why did Jack seem relaxed about a week without his phone?", "He isn't on it much and likes camps with the scouts, so it would be nice to get off screens", 2], ["Which speaker says she would be late every day without her phone?", "Sophie", 0], ["Complete: ___ probably hang out with them.", "I'd", 1, ["I", "I'll"]], ["Complete: In the 1980s, people ___ (buy) tickets at the stadium.", "bought", 0]], "o": ["Calculate the group's average daily phone time and list phone uses.", "Watch video interviews and identify which speaker mentions each idea.", "Hear and produce the small difference between I, I'd and I'll.", "Balance screen time with real-life communication and activities."]}, {"t": "Lesson 8: Unit Check", "u": "Unit 2: Connections", "q": [["Complete: My history teacher used to ___ us jokes all the time.", "tell", 0], ["Which ending fits: 'The awful joke my broth
