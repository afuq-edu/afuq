ات (14–17) من سورة آل عمران تلاوة صحيحة مراعيًا أحكام التجويد التي تعلمها.", "يبيّن معاني بعض المفردات والتراكيب الواردة في الآيات.", "يستخرج أحكام النون الساكنة والتنوين من الآيات.", "يعظّم القرآن الكريم ويحرص على إتقان تلاوته."]}, {"t": "الإجمال في طلب الدنيا", "u": "الوحدة الأولى", "q": [["من راوي حديث «أجملوا في طلب الدنيا»؟", "أبو حميد الساعدي، عبد الرحمن بن سعد بن المنذر الأنصاري رضي الله عنه", 0], ["ما معنى «أجملوا في طلب الدنيا»؟", "اعتدلوا وتأنّوا وتمهّلوا في طلب الرزق، فإن الله قد قدّر الأرزاق", 1], ["هل يتعارض الإجمال في الطلب مع السعي والعمل؟ وضّح.", "لا، بل هو تهذيب للسعي وإرشاد إلى عدم الحرص المذموم وعدم الأسى على ما فات، مع الأخذ بالأسباب", 2], ["بيّن نوعي أسباب الرزق.", "أسباب مادية كالعمل والزرع، وأسباب إيمانية كالتوكل على الله وتقواه", 1], ["استدل من السنة على أن التوكل الحق من أسباب الرزق.", "قوله ﷺ: «لو أنكم كنتم توكلون على الله حق توكله لرزقتم كما يرزق الطير، تغدو خماصًا وتروح بطانًا»", 2], ["ما معنى «كل ميسر لما خلق له»؟", "أن كل إنسان مهيأ بقدرات ومواهب تناسب ما قدّره الله له", 0], ["كيف وظّف يوسف عليه السلام هذه القاعدة؟", "عرف قدرته على الحفظ والعلم فطلب أن يكون على خزائن الأرض: ﴿اجعلني على خزائن الأرض إني حفيظ عليم﴾، فكان سببًا في إنقاذ مصر من المجاعة", 1], ["ما الخطأ في موقف من يرفض العمل في ورشة رغم مهارته خشية نظرة المجتمع؟", "أنه عطّل موهبة يسّرها الله له، والعمل الشريف لا ينقص من قدر صاحبه", 2], ["كيف تنصح من يريد اختيار المسار المهني نفسه لزميله دون النظر إلى قدراته؟", "أنصحه بأن يكتشف قدراته وميوله، ويختار ما يُيسَّر له، فكلٌّ ميسّر لما خُلق له", 1], ["ما واجب الإنسان تجاه مواهبه؟", "أن يكتشفها ويطورها وينميها لينفع نفسه ودينه وأمته", 2], ["أكمل الحديث: «أجملوا في طلب الدنيا...».", "«فإن كلًّا ميسر لما خلق له»", 0], ["أؤيد أم أعارض: «يجتهد في الدراسة ويهمل أداء الصلاة في أوقاتها»؟ علّل.", "أعارض؛ لأنه أخلّ بالتوازن وقدّم الدنيا على حق الله تعالى", 2], ["اكتب الحديث الشريف غيبًا.", "عن أبي حميد الساعدي رضي الله عنه قال: قال رسول الله ﷺ: «أجملوا في طلب الدنيا، فإن كلًّا ميسر لما خلق له»", 0], ["كيف تطبق قاعدة «أجملوا في طلب الدنيا» إذا نجحت في إنشاء مركز تجاري؟", "بالكسب الحلال وتجنب الغش والجشع، وإخراج الزكاة، وعدم الانشغال بالتجارة عن العبادة", 1], ["لماذا يُعد الادخار والتثمير من الإجمال في الطلب؟", "لأنهما تخطيط معتدل للمال يحقق الأهداف المستقبلية دون إسراف أو تكالب على الدنيا", 2]], "o": ["يقرأ الحديث الشريف قراءة صحيحة.", "يتعرف راوي الحديث أبا حميد الساعدي رضي الله عنه.", "يوضح مفهوم القاعدة النبوية «أجملوا في طلب الدنيا».", "يوقن بأن الرزق مقسوم مع وجوب الأخذ بالأسباب."]}, {"t": "المعطي المانع", "u": "الوحدة الأولى", "q": [["ما معنى اسم الله «المعطي»؟", "الذي يعطي من يشاء ما يشاء من خزائنه التي لا تنفد بحكمته", 0], ["لماذا لا يُدعى الله بالمانع وحده؟", "لأنهما من الصفات المتقابلة التي يُثنى على الله بهما معًا، والكمال في اجتماعهما", 1], ["ما أعظم عطاء من الله للإنسان؟ استدل.", "الإيمان والهداية، قال تعالى: ﴿ربنا الذي أعطى كل شيء خلقه ثم هدى﴾", 2], ["اذكر دليلًا على أن العطاء والمنع بيد الله وحده.", "دعاء النبي ﷺ: «اللهم لا مانع لما أعطيت، ولا معطي لما منعت»", 0], ["هل يعطي الله الدنيا لمن يحب فقط؟ وضّح بمثال.", "لا، يعطي الدنيا من يحب ومن لا يحب، فقد أعطى قارون الغنى الواسع، ولا يعطي الآخرة إلا لمن يحب", 2], ["اذكر حكمة واحدة من حكم المنع.", "قد يكون المنع أنفع للعبد، أو ابتلاءً يُختبر به، أو تنبيهًا ليتوب ويصحح مسيره", 0], ["ما الخطأ في الحكم على المريض بأن الله لا يحبه؟", "أن عطاء الدنيا ومنعها ليسا معيارًا لمحبة الله، فقد يبتلي أولياءه، قال تعالى: ﴿فأما الإنسان إذا ما ابتلاه ربه...﴾", 1], ["كيف يكون كفّ الأذى عن الناس عطاءً؟", "هو صدقة من المرء على نفسه كما قال ﷺ: «تكف شرك عن الناس فإنها صدقة منك على نفسك»", 2], ["ما أثر الإيمان بصفتي المعطي المانع في نفس المؤمن؟", "الطمأنينة والرضا، ونبذ الحسد، والتوكل على الله، وشكر النعم والصبر عند المنع", 0], ["علّل: يسرف بعض الناس في الإنفاق بحجة أن الله هو الرزاق المعطي، فما رأيك؟", "تصرف خاطئ؛ فالإيمان بأن الله المعطي يوجب شكر النعمة وحسن التصرف فيها لا الإسراف", 1], ["استدل بآية على أن المنع قد يكون خيرًا للعبد.", "قوله تعالى: ﴿وعسى أن تكرهوا شيئًا وهو خير لكم﴾", 2]], "o": ["يتعرف معنى العطاء والمنع من الله عز وجل.", "يدلل على عطاء الله ومنعه من النصوص الشرعية.", "يعلل عدم دعاء الله تعالى باسم المانع وحده.", "يشكر الله تعالى على عطاياه."]}, {"t": "صلح الحديبية", "u": "الوحدة الأولى", "q": [["ما السبب الذي دفع النبي ﷺ إلى الخروج إلى مكة؟", "رؤيا رآها أنهم يدخلون المسجد الحرام آمنين، فخرج معتمرًا معظمًا للبيت", 0], ["ما دلالة قول النبي ﷺ حين بركت ناقته: «حبسها حابس الفيل»؟", "أن الله منعها من دخول مكة كما منع الفيل، وفيه إشارة إلى عدم القتال وتعظيم حرمة البيت", 1], ["ما سبب بيعة الرضوان؟", "إشاعة مقتل عثمان رضي الله عنه حين احتبسته قريش", 2], ["في أي سنة كان صلح الحديبية؟ وكم كان عدد الصحابة تقريبًا؟", "في السنة السادسة للهجرة، وكانوا نحو ألف وأربعمائة", 0], ["رتّب الأحداث: بيعة الرضوان – بروك القصواء – الإحرام من ذي الحليفة – إرسال عثمان.", "الإحرام من ذي الحليفة، ثم بروك القصواء، ثم إرسال عثمان، ثم بيعة الرضوان", 1], ["لماذا كره النبي ﷺ الاصطدام بقريش في الحديبية؟", "تعظيمًا لحرمات مكة وحقنًا للدماء، ولأنه جاء معتمرًا لا مقاتلًا", 2], ["ما النتيجة المترتبة على بند وضع الحرب عشر سنين؟", "أمن الناس، وانتشار الدعوة، ودخول كثيرين في الإسلام", 1], ["ما المبدأ التفاوضي الذي ظهر في قبول النبي ﷺ حذف «رسول الله» من الوثيقة؟", "ضبط النفس والمرونة مع وضوح الهدف والنظر إلى المصلحة البعيدة", 2], ["من الذي أبرم الصلح مع المسلمين من قِبَل قريش؟", "سهيل بن عمرو", 0], ["ما الدور الذي قامت به أم المؤمنين أم سلمة رضي الله عنها في صلح الحديبية؟", "أشارت على النبي ﷺ أن يخرج فينحر هديه ويحلق، فلما فعل اقتدى به الصحابة", 1], ["علّل: وصف القرآن الكريم صلح الحديبية بالفتح المبين.", "لأنه حقق اعتراف قريش بالمسلمين، والأمن، وانتشار الإسلام، ومهّد لفتح مكة", 2]], "o": ["يبيّن سبب خروج النبي ﷺ إلى مكة وصلح الحديبية.", "يرتب أحداث الحديبية ترتيبًا زمنيًا.", "يوضح موقف النبي ﷺ وأصحابه من أحداث الحديبية.", "يقدّر حكمة النبي ﷺ في حقن الدماء وتعظيم الحرمات."]}, {"t": "الأمن النفسي", "u": "الوحدة الأولى", "q": [["عرّف الأمن النفسي.", "الطمأنينة والسكينة وانشراح الصدر، وهو ضد الخوف والقلق", 0], ["ما أول مطلب طلبه إبراهيم عليه السلام لمكة؟", "الأمن، قال تعالى: ﴿رب اجعل هذا بلدًا آمنًا﴾", 1], ["ما دلالة قول النبي ﷺ: «يا بلال، أقم الصلاة أرحنا بها»؟", "أن الصلاة مصدر للراحة والطمأنينة والأمن النفسي", 2], ["كيف اعتنى الإسلام بالأمن النفسي للأبناء؟", "بالتسمية الحسنة، وإظهار المحبة والرحمة، والتلطف في النصح، والنهي عن الضرب على الوجه والسب والتخويف", 1], ["علّل: نهى الإسلام عن ترويع المسلم ولو مازحًا.", "لأن الترويع يهدد أمنه النفسي ويدخل عليه الخوف والقلق", 2], ["ما المهدد الذي تشير إليه الآية: ﴿أم يحسدون الناس على ما آتاهم الله من فضله﴾؟ وما علاجه؟", "الحسد، وعلاجه الرضا بقسمة الله وتمني الخير للآخرين", 1], ["كيف يهدد التسويف في المذاكرة الأمن النفسي؟", "يجمع الضغط في ليلة الامتحان فيولد الخوف والتوتر وضعف التركيز", 2], ["صنّف النص: ﴿ألا بذكر الله تطمئن القلوب﴾", "أمن نفسي", 0, ["قلق نفسي"]], ["ما الضرر الناتج عن تعنيف الأب أبناءه باستمرار؟", "يعيشون في بيئة يسودها الخوف والتوتر، فيفقدون الثقة بالنفس والأمن النفسي", 1]], "o": ["يتعرف الأمن النفسي.", "يوضح أهمية الأمن النفسي في حياة الإنسان.", "يستدل على عناية الإسلام بالأمن النفسي من النصوص الشرعية.", "يستشعر أثر الإيمان في تحقيق الطمأنينة."]}, {"t": "التقاء الساكنين (1)", "u": "الوحدة الثانية", "q": [["عرّف التقاء الساكنين في كلمتين.", "التقاء حرفين ساكنين، الأول المنطوق في نهاية الكلمة الأولى، والثاني المنطوق في بداية الكلمة الثانية", 0], ["متى يُتخلص من التقاء الساكنين بالحذف؟", "إذا كان الساكن الأول حرف مد", 1], ["حدد الساكنين في ﴿قالوا ابنوا﴾، وبيّن كيفية التخلص.", "الساكن الأول واو المد في ﴿قالوا﴾، والثاني الباء في ﴿ابنوا﴾، وتحذف الواو لفظًا فتنطق: قالُ بْنوا", 2], ["لماذا يلجأ العرب إلى التخلص من التقاء الساكنين في كلامهم؟", "لأن العرب لا تجمع بين ساكنين في كلمتين لصعوبة النطق بهما", 0], ["كيف تُنطق ﴿اهدنا الصراط﴾ وصلًا؟", "بحذف الألف لفظًا: اهدِنَ صّراط", 1], ["هل يُحذف حرف المد رسمًا أيضًا؟ وضّح.", "لا، يحذف نطقًا في الوصل فقط ويبقى رسمًا، ويعود عند الوقف", 2], ["ما الأصل في التخلص من التقاء الساكنين بالتحريك؟", "التحريك بالكسر، والضم والفتح استثناء", 0], ["كيف تنطق ﴿ونادى نوح ابنه﴾ وصلًا؟", "تكسر نون التنوين: نوحُنِ ابنه", 1], ["في ﴿قل الروح من أمر ربي﴾ كيف ننطق الساكن الأول حال الوصل؟", "مكسورًا: قلِ الروح", 2], ["حدد طريقة التخلص في ﴿فقلنا اض مها وتحبيبها، ثم الأمر بها لسبع، ثم المتابعة والحزم تدريجيًا حتى تصبح عادة", 2]], "o": ["يتلو الآيات (105–111) من سورة الإسراء تلاوة صحيحة مراعيًا أحكام التجويد التي تعلمها.", "يتعرف معاني بعض المفردات والتراكيب الواردة في الآيات.", "يطبق قاعدة التقاء الساكنين في المواضع الواردة في الآيات.", "يعظّم القرآن الكريم ويخشع عند تلاوته."]}, {"t": "شعب الإيمان", "u": "الوحدة الثانية", "q": [["ما معنى «شعبة»؟", "خصلة", 0], ["ما معنى «بضع»؟", "الأعداد من ثلاثة إلى تسعة", 1], ["هل يدل قوله ﷺ «بضع وسبعون» على حصر شعب الإيمان؟ وضّح.", "لا، بل على الكثرة والمبالغة، فخصال الإيمان كثيرة، وهو من أساليب العرب", 2], ["من راوي حديث شعب الإيمان؟", "أبو هريرة رضي الله عنه", 0], ["ما أعلى شعب الإيمان وما أدناها؟", "أعلاها قول لا إله إلا الله، وأدناها إماطة الأذى عن الطريق", 1], ["ما الشعبة التي خصها الحديث بالذكر بعد بيان أعلى الشعب وأدناها؟", "الحياء", 2], ["علّل: كلمة «لا إله إلا الله» أعلى شعب الإيمان.", "لأنها كلمة التوحيد والإخلاص، وكلمة التقوى، ولا يصح إيمان إلا بها", 0], ["ما فضل إماطة الأذى عن الطريق؟ استدل.", "صدقة وسبب للمغفرة، قال ﷺ: «بينما رجل يمشي بطريق وجد غصن شوك على الطريق فأخره فشكر الله له فغفر له»", 1], ["اذكر نوعين من أنواع الحياء.", "الحياء من الله، والحياء من الناس، والحياء من النفس", 2], ["هل يكفي التلفظ بشهادة التوحيد لتحقيق الإيمان؟ وضّح.", "لا، بل لا بد من التصديق بها خالصًا والقيام بحقها سلوكًا عمليًا، فالإيمان ما وقر في القلب وصدقه العمل", 0], ["كيف يظهر الحياء من الله في سلوك الطالب؟", "بالمحافظة على الصلاة، والبعد عن الغيبة والكذب، وعدم النظر إلى الحرام، واستشعار أن الله يراه", 2], ["صنّف: ﴿ومن يتوكل على الله فهو حسبه﴾.", "شعبة اعتقادية", 0], ["صنّف: «لا يزال لسانك رطبًا من ذكر الله».", "شعبة قولية", 1], ["علّل: الحياء من شعب الإيمان القلبية مع ظهور آثاره على الجوارح.", "لأن منبعه القلب، وآثاره تظهر في القول والفعل، فشعب الإيمان مترابطة", 2], ["اكتب حديث شعب الإيمان غيبًا.", "«الإيمان بضع وسبعون أو بضع وستون شعبة، فأفضلها قول لا إله إلا الله، وأدناها إماطة الأذى عن الطريق، والحياء شعبة من الإيمان»", 0], ["قوّم موقف: «طالب لا يشارك في الصف حياءً».", "هذا حياء وية من دار الأرقم إلى المسجد النبوي.", "يحرص على حضور مجالس العلم والخير."]}, {"t": "سماحة المؤمن", "u": "الوحدة الثالثة", "q": [["عرّف السماحة.", "فضيلة ترتقي بالنفس إلى التحلي بالعفو وقبول الآخر واحترامه", 0], ["هل تعني السماحة قبول الإهانة والظلم؟ وضّح.", "لا، فالسماحة من شيم الكرام عن قدرة، وليست ذلًّا أو ضعفًا، «وما زاد الله عبدًا بعفو إلا عزًّا»", 2], ["ما ثمرة السماحة في قوله تعالى: ﴿فإذا الذي بينك وبينه عداوة كأنه ولي حميم﴾؟", "تحويل العداوة إلى صداقة ومودة", 0], ["بم وصف النبي ﷺ الدين الذي بعث به؟", "بالحنيفية السمحة، التي راعت التيسير والتخفيف وعدم المشقة في التكليف", 2], ["ما نوع التسامح في قوله تعالى: ﴿أفأنت تكره الناس حتى يكونوا مؤمنين﴾؟", "التسامح الديني", 1], ["هل أخذ مقتنيات الصاحب دون إذن بحجة سماحته من السماحة؟ علّل.", "لا، فهو تعدٍّ على حقه، والسماحة لا تبيح أخذ الحقوق دون إذن", 2], ["ما نوع التسامح في قوله تعالى: ﴿ولا تجادلوا أهل الكتاب إلا بالتي هي أحسن﴾؟", "التسامح الفكري (الحوار بالتي هي أحسن)", 0], ["أكمل: السماحة سبب لنجاح العلاقات الاجتماعية وتقوية ...", "أواصر الأخوة والمحبة", 1], ["كيف تتحلى بالسماحة إذا أساء إليك زميل ثم اعتذر؟", "أقبل اعتذاره، وأعفو عنه، ولا أذكّره بإساءته، وأحسن معاملته", 2]], "o": ["يتعرف السماحة.", "يستدل على السماحة من القرآن الكريم والسنة النبوية.", "يوضح ثمرات السماحة في حياة الفرد والمجتمع.", "يتخلق بالسماحة في تعامله مع الآخرين."]}, {"t": "سورة يوسف (94–101)", "u": "الوحدة الرابعة", "q": [["ما معنى ﴿العير﴾ و﴿تفندون﴾؟", "العير: القافلة، تفندون: تضعّفون عقلي", 0], ["كيف تنطق ﴿ولما فصلت العير﴾ وصلًا؟ ولماذا؟", "بكسر التاء: فصلتِ العير؛ تخلصًا من التقاء الساكنين لأن التاء حرف صحيح", 1], ["ماذا حدث ليعقوب عليه السلام حين ألقى البشير القميص على وجهه؟", "ارتد بصيرًا بإذن الله", 2], ["بم ردّ أهل يعقوب حين قال: ﴿إني لأجد ريح يوسف﴾؟", "قالوا: ﴿تالله إنك لفي ضلالك القديم﴾، أي في خطئك القديم من فرط محبتك ليوسف", 1], ["ماذا فعل إخوة يوسف عندما أحسوا بخطئهم؟", "اعترفوا بذنبهم وطلبوا من أبيهم أن يستغفر لهم: ﴿يا أبانا استغفر لنا ذنوبنا إنا كنا خاطئين﴾", 2], ["إلى من نسب يوسف عليه السلام ما حدث بينه وبين إخوته؟ وما دلالة ذلك؟", "إلى نزغ الشيطان، وفيه أدب رفيع وعفو وعدم لوم إخوته", 1], ["ما المطلب الذي سأله يوسف عليه السلام في دعائه؟", "أن يتوفاه الله مسلمًا ويلحقه بالصالحين", 2], ["كيف ينبغي أن تكون علاقة الأخوة؟", "قائمة على المحبة والتعاون والعفو، والحذر من وسوسة الشيطان، وحل الخلافات بالحوار", 0], ["ما دلالة رفع يوسف عليه السلام أبويه على العرش؟", "إكرام الوالدين وتوقيرهما وبرّهما مهما بلغت مكانة الابن", 2]], "o": ["يتلو الآيات (94–101) من سورة يوسف تلاوة صحيحة مراعيًا أحكام التجويد التي تعلمها.", "يبيّن معاني بعض المفردات والتراكيب الواردة في الآيات.", "يوضح المعنى الإجمالي للآيات (94–98).", "يحسن التعامل مع والديه ويقدّر مشاعرهما."]}, {"t": "المستظلون بظل الله", "u": "الوحدة الرابعة", "q": [["ما الصفة المشتركة بين الأصناف السبعة؟", "الإخلاص لله تعالى ومراقبته", 1], ["ما معنى «يوم لا ظل إلا ظله»؟", "يوم القيامة حين لا يجد الناس ما يقيهم من أهواله إلا ما يتفضل الله به من رحمته وحفظه", 2], ["أكمل: «سبعة يظلهم الله في ظله يوم لا ظل إلا ظله: إمام عادل، و...».", "«وشاب نشأ في عبادة الله عز وجل، ورجل متعلق قلبه بالمسجد إذا خرج حتى يعود إليه...»", 0], ["من الإمام العادل؟", "كل من ولي شيئًا من أمور المسلمين فعدل فيه، كالولاة والقضاة، ويدخل فيه العدل بين الأولاد", 1], ["ما الدليل في الحديث على فضل الصدقة الخفية؟", "قوله: «ورجل تصدق بصدقة فأخفاها حتى لا تعلم شماله ما أنفقت يمينه»", 2], ["ما دلالة ابتداء الحديث بالإمام العادل؟", "عظم دوره وعموم نفعه، فإذا صلح صلحت رعيته وانتفع الناس بعدله", 0], ["علّل: خص الحديث الشاب الذي نشأ في عبادة الله بالذكر.", "لأن الشباب مرحلة القوة ومظنة غلبة الهوى والصوارف، فملازمة العبادة فيها أشق وأعظم أجرًا", 1], ["ما المعين المستنتج من حديث «المرء على دين خليله»؟", "اختيار الرفيق الصالح", 2], ["متى يُظهر الإنسان صدقته؟", "إذا كان في إظهارها مصلحة كالاقتداء به وأمن على نفسه الرياء", 1], ["وجّه نصيحة لشاب يهجر المسجد ويتهاون في الصلاة فيه.", "أذكّره بأن المتعلق قلبه بالمسجد من السبعة الذين يظلهم الله، وأدعوه إلى صحبة الصالحين والمحافظة على صلاة الجماعة", 2]], "o": ["يقرأ الحديث الشريف قراءة صحيحة.", "يتعرف الأصناف السبعة الذين يظلهم الله يوم القيامة.", "يوضح الصفة المشتركة بين الأصناف السبعة.", "يستشعر عظيم ثواب الله للمؤمنين."]}, {"t": "دعوة إبراهيم عليه السلام", "u": "الوحدة الرابعة", "q": [["ما دلالة تكرار إبراهيم عليه السلام نداء ﴿يا أبت﴾؟", "التلطف والتوسل والاستعطاف، وإظهار الحب والحرص على هداية أبيه مع توقيره", 0], ["بم عاب إبراهيم عليه السلام أصنام أبيه؟", "أنها لا تسمع ولا تبصر ولا تغني عنه شيئًا", 1], ["ما الذي جعل إبراهيم عليه السلام يتبرأ من أبيه؟", "تبيّن له أنه عدو لله: ﴿فلما تبين له أنه عدو لله تبرأ منه﴾", 2], ["اذكر ثلاثًا من مميزات دعوة إبراهيم عليه السلام لأبيه.", "الرفق وحسن الأدب، والنداء بـ﴿يا أبت﴾، والسؤال عن سبب عبادة ما لا ينفع، وبيان العلم الذي أوتيه، والتحذير من عبادة الشيطان", 0], ["كيف نشأ إبراهيم عليه السلام؟", "نشأ في بيئة وثنية يعبد قومها الكواكب والأصنام، وآتاه الله رشده منذ صباه فرفض ذلك", 1], ["كيف تستفيد من أسلوب إبراهيم عليه السلام في نصح الآخرين؟", "بالرفق والأدب، واختيار الألفاظ اللطيفة، وتقديم الحجة، وإظهار الحرص على مصلحة المنصوح", 2], ["بم احتج إبراهيم عليه السلام على النمرود في المرة الثانية؟", "بالشمس: ﴿فإن الله يأتي بالشمس من المشرق فأت بها من المغرب﴾", 0], ["ما المبدأ الذي يمثله قول إبراهيم عن الكوكب: ﴿هذا ربي﴾؟", "مجاراة الخصم تمهيدًا لإقامة الحجة عليه", 1], ["ما الصفة المستخلصة من قوله تعالى: ﴿إن إبراهيم لحليم أواه منيب﴾؟", "الحلم والرحمة وكثرة التضرع والرجوع إلى الله", 2], ["صف منهج إبراهيم عليه السلام في مناظرة النمرود.", "بدأ الحوار بالإفهام وانتهى بالإفحام، وانتقل من دليل إلى دليل أقوى لا يمكن المغالطة فيه", 0], ["رتّب مبادئ التدرج في دعوة إبراهيم قومه عبدة الكواكب.", "مجاراة الخصم، ثم الاستدلال المنطقي، ثم تشكيك قومه في معتقداتهم، ثم الوصول إلى النتيجة وإعلان التوحيد", 1]], "o": ["يتعرف إبراهيم عليه السلام.", "يستخرج مميزات دعوة إبراهيم عليه السلام لأبيه من الآيات الكريمة.", "يطبق أسلوب إبراهيم عليه السلام في الحوار مع الآخرين.", "يقتدي بإبراهيم عليه السلام في الرفق والأدب مع الوالدين."]}, {"t": "الأَيمان", "u": "الوحدة الرابعة", "q": [["عرّف اليمين.", "الحلف بالله أو باسم من أسمائه أو صفة من صفاته لإثبات شيء أو نفيه", 0], ["استدل من القرآن على مشروعية اليمين.", "قوله تعالى: ﴿قل بلى وربي لتبعثن﴾", 1], ["اذكر صيغة من صيغ قسم النبي ﷺ.", "«والذي نفسي بيده»، أو «وايم الله»، أو «ورب الكعبة»", 2], ["ما خطورة التساهل في الحلف؟", "يقلل تعظيم الله في القلب، ويجر إلى الكذب، ويُذهب ثقة الناس، وهو من صفات المنافقين", 0], ["بم وصف الله كثير الحلف في قوله: ﴿ولا تطع كل حلاف مهين﴾؟", "بأنه مهين لا يُطاع", 1], ["كيف اتخذ المنافقون أيمانهم جُنّة؟", "جعلوا حلفهم الكاذب وقاية وسترًا يحمون به أنفسهم ويصدون عن سبيل الله", 2], ["ما حكم يمين اللغو؟", "لا إثم فيها ولا كفارة: ﴿لا يؤاخذكم الله باللغو في أيمانكم﴾", 0], ["لماذا سميت اليمين الغموس بهذا الاسم؟", "لأنها تغمس صاحبها في الإثم ثم في النار", 1], ["اذكر كفارة اليمين المنعقدة بالترتيب.", "إطعام عشرة مساكين أو كسوتهم أو تحرير رقبة، فمن لم يجد فصيام ثلاثة أيام", 2], ["حدد نوع اليمين: «أقسم بالله أنني أرسلت إيصال الدفع» وهو كاذب.", "يمين غموس", 0], ["ما حكم من كفّرت عن يمينها بصيام ثلاثة أيام مع قدرتها على الإطعام؟", "لا يجزئها الصيام؛ لأنه لا يُصار إليه إلا عند العجز عن الإطعام أو الكسوة أو تحرير الرقبة", 1], ["علّل: يحرم الحلف بغير الله تعالى.", "لأن الحلف تعظيم للمحلوف به، ولا يُعظَّم إلا الله، وقد قال ﷺ: «فمن كان حالفًا فليحلف بالله أو ليصمت»", 2]], "o": ["يتعرف الأيمان.", "يستدل على مشروعية الأيمان من القرآن الكريم والسنة النبوية.", "يبيّن خطورة التساهل في الحلف.", "يصون لسانه عن كثرة الحلف."]}, {"t": "القعقاع بن عمرو رضي الله عنه", "u": "الوحدة الرابعة", "q": [["متى أسلم القعقاع رضي الله عنه؟", "في عهد الرسول ﷺ حين وفد مع قومه في السنة التاسعة للهجرة", 0], ["بم أجاب القعقاع حين سأله النبي ﷺ: «ماذا أعددت للجهاد؟»", "طاعة الله ورسوله والخيل", 1], ["ما أول مشاركات القعقاع في الجهاد بعد وفاة النبي ﷺ؟", "حروب الردة في عهد أبي بكر الصديق رضي الله عنه", 2], ["من قائل: «لصوت القعقاع في الجيش خير من ألف رجل»؟", "أبو بكر الصديق رضي الله عنه", 0], ["اذكر صفتين من صفات القعقاع رضي الله عنه.", "الشجاعة والإقدام، والحنكة العسكرية، والقدرة على التخطيط، والثبات في المعارك", 1], ["ما أثر نشأة القعقاع في قبيلته على شخصيته؟", "نشأ في قبيلة تشتهر بالفروسية والرماية وفنون القتال، فاكتسب المهارات العسكرية والشجاعة", 2], ["ما الخطة التي اتبعها القعقاع في القادسية؟", "قسم جيشه إلى أعشار تصل متتابعة ليوهم الفرس بكثرة المدد، واستهدف الفيلة، فارتفعت معنويات المسلمين وانهزم الفرس", 0], ["ما المهمة التي أوكلها خالد بن الوليد إلى القعقاع في الحيرة؟", "إدارة عسكرية لحماية الحيرة من غارات الفرس، ثم صار أميرًا عليها ونائبًا لخالد", 1], ["ماذا يدل كون القعقاع أول من حارب ليلًا في تاريخ العرب؟", "على بسالته وإقدامه", 2], ["رتّب مشاركات القعقاع: القادسية، حروب الردة، اليرموك.", "حروب الردة، ثم اليرموك، ثم القادسية", 0], ["ما دلالة قول أبي بكر رضي الله عنه: «لا يُهزم جيش فيه مثل هذا»؟", "الثقة بشجاعة القعقاع وحنكته وأثره في رفع معنويات الجيش", 1], ["كيف تثمر مهاراتك في حياتك اقتداءً بالقعقاع رضي الله عنه؟", "بتوظيفها في خدمة الدين والوطن، وتطويرها بالتدريب، والإقدام في المواقف التي تحتاجها", 2]], "o": ["يتعرف القعقاع بن عمرو رضي الله عنه.", "يعدد صفات القعقاع رضي الله عنه.", "يستنتج من مواقف القعقاع سمات شخصيته القيادية.", "يقدّر جهود الصحابة في نصرة الإسلام."]}, {"t": "النزاهة", "u": "الوحدة الرابعة", "q": [["عرّف النزاهة.", "قيمة دينية مرتبطة بالأمانة، ترفع النفس عن الانحراف والمعصية، وتلزمها أداء الواجبات بصدق وإخلاص", 0], ["كيف تتحقق نزاهة المقاول؟", "بالالتزام بالمواصفات المتفق عليها، وعدم الغش في المواد، وإتقان العمل", 2], ["استدل بآية على التحذير من الاعتداء على المال العام.", "قوله تعالى: ﴿ومن يغلل يأت بما غل يوم القيامة﴾", 0], ["لماذا يُعد الاعتداء على المال العام أشد من الاعتداء على المال الخاص؟", "لأنه اعتداء على حقوق المجتمع بأكمله", 1], ["مما كان يستعيذ النبي ﷺ مما يتعلق بالنزاهة؟", "من الخيانة: «أعوذ بك من الخيانة»", 2], ["وجّه نصيحة لمن يستخدم سيارة العمل في مصالحه الشخصية.", "أن ممتلكات العمل أمانة لا تستخدم إلا في العمل، واستغلالها خيانة للأمانة", 2], ["ماذا تفهم من دعاء النبي ﷺ: «اللهم اكفني بحلالك عن حرامك»؟", "أن أسأل الله الرزق الحلال الذي يغنيني عن الحرام", 0], ["ما التوجيه في حديث «أعطوا الأجير أجره قبل أن يجف عرقه»؟", "المبادرة إلى أداء حقوق العاملين في وقتها، وهو من النزاهة", 1], ["كيف تؤثر النزاهة في نظرة الناس إلى صاحبها؟", "تكسبه ثقتهم واحترامهم، وتمنحه السمعة الطيبة", 2]], "
