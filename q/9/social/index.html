ل تعدد العملات الأجنبية المتداولة (الريالات الألمانية والنمساوية والإسبانية)", 2], ["إلى ماذا تحولت زنجبار في عهد السيد سعيد بن سلطان؟", "من ميناء صغير إلى أعظم ميناء في الأطراف الغربية للمحيط الهندي، ومستودع رئيس للتجارة الأفريقية والآسيوية", 0], ["علّل: أعفى السيد سعيد الصادرات من الضرائب.", "بهدف تنشيط حركة التجارة الخارجية", 1], ["كيف أسهمت زراعة القرنفل في بناء الدولة الكبيرة؟", "أصبحت الثروة الرئيسة للمنطقة وجعلت زنجبار أول مصدر عالمي له، فوفرت دخلًا كبيرًا دعم اقتصاد الدولة", 2], ["ما أهم طرق تجارة القوافل على الإطلاق؟", "الطريق الأوسط", 0], ["لماذا كان الطريق الشمالي محفوفًا بالمخاطر؟", "لتعرض القوافل التي ترتاده لهجمات قبائل الماساي", 1], ["علّل زيادة أهمية الطريق الأوسط ابتداءً من القرن التاسع عشر الميلادي.", "بسبب ارتفاع أسعار العاج عالميًا، ولأنه أكثر أمنًا إلى جانب عوائده التجارية", 2], ["من أين يبدأ الطريق الجنوبي؟ وإلى أين ينتهي؟", "يبدأ من كلوة عبر جنوبي تنجانيقا وشمالي موزمبيق وينتهي إلى بحيرة نياسا", 0], ["إلى أين يتفرع الطريق الأوسط من تابورا؟", "شمالًا إلى هضبة البحيرات الاستوائية، وجنوبًا إلى حوض نهر الكونغو", 1], ["ما أهم السلع وأثمنها في قائمة التبادل التجاري مع شرقي أفريقيا؟", "الذهب", 0], ["علّل: حمل العمانيون الأخشاب من شرقي أفريقيا إلى بلادهم.", "لصناعة السفن بصورة خاصة", 1], ["ما المخاطر الناجمة عن عدم معرفة البحارة بالشعب المرجانية؟", "اصطدام السفن بها وتحطمها أو جنوحها وغرقها، وتلف البضائع وتعريض البحارة للخطر", 2], ["اذكر سلعتين حملتهما المراكب العمانية من عُمان إلى شرقي أفريقيا.", "التمور، والفواكه، والحنطة، والشعير، والأرز، والزعفران، واللبان، والرياحين، والورد المجفف، والليمون", 0], ["لماذا اهتم التجار القادمون من الهند والصين بالعاج؟", "لأن ملوك تلك البلدان كانوا يستخدمونه للتزين وفي صناعة أدوات الشطرنج والآلات الموسيقية والتحف والهدايا والتماثيل", 1], ["في عهد أي سلطان تأسست المطبعة السلطانية في زنجبار؟", "في عهد السلطان برغش بن سعيد (1870–1888م)", 0], ["اذكر صحيفتين ظهرتا في شرقي أفريقيا.", "الفلق، والنهضة، والإصلاح", 1], ["ما النتيجة التي ترتبت على امتزاج الدم العربي بالدم الأفريقي؟", "نشأت ثقافة عربية أفريقية، وانتشرت اللغة العربية بين قطاعات مختلفة من السكان", 2], ["متى أصبحت زنجبار مركز إشعاع إسلامي؟", "منذ أن اتخذها السيد سعيد بن سلطان عاصمة له في شرقي أفريقيا", 0], ["ما المجالات التي استُخدمت فيها اللغة العربية في شرقي أفريقيا؟", "كانت لغة الصفوة المتعلمة والمستنيرة، ولغة التجارة والإدارة والحكم والأدب", 1], ["كيف أسهمت الصحف في الحفاظ على الهوية العربية الإسلامية لمسلمي شرقي أفريقيا؟", "بتوعيتهم بأمور دينهم ودنياهم والأوضاع السائدة، وبالمبادئ والقيم التي ينبغي التمسك بها، ودعم النهضة الأدبية والعلمية", 2], ["اذكر مجموعتين سكانيتين رئيستين في زنجبار.", "الأفارقة، والعرب، والهنود، والشيرازيون (من أصول إيرانية)", 0], ["كيف انعكست روح التسامح المذهبي على علاقات العلماء في زنجبار؟", "سادت صلات طيبة ووثيقة بين علماء المذهب الإباضي والمذهب الشافعي السائد في شرقي أفريقيا", 2], ["لماذا وفدت مجموعات أفريقية من داخل القارة إلى زنجبار وبمبا؟", "للعمل في مزارع القرنفل، وبعضهم للعمل في نقل البضائع والسلع في فترة تجارة القوافل", 0]], "o": ["يحدد موقع زنجبار ومكوناتها الجغرافية على الخريطة (الشكل 1).", "يصف الخصائص الطبيعية والبشرية لجزيرتي زنجبار وبمبا.", "يفسر الأهمية الاقتصادية للقرنفل وعدم زراعته في سلطنة عُمان (نشاط 1).", "يقدّر التنوع البيئي ودوره في تكامل الأنشطة الاقتصادية بين الشعوب."]}, {"t": "عُمان في محيطها الإسلامي", "u": "الوحدة الثالثة: عُمان في محيطها الإسلامي والعالمي", "q": [["أين تقع سلطنة عُمان بالنسبة لشبه الجزيرة العربية؟", "في أقصى الجنوب الشرقي لشبه الجزيرة العربية", 0], ["اذكر دولتين إسلاميتين غير عربيتين في آسيا، ودولة في أوروبا.", "في آسيا: إيران، باكستان، إندونيسيا، ماليزيا، تركيا. وفي أوروبا: ألبانيا", 1], ["كيف يؤدي التنوع المناخي بين دول العالم الإسلامي إلى التكامل الاقتصادي؟", "يتنوع الإنتاج الزراعي والطبيعي بتنوع المناخ، فتسد كل دولة حاجتها مما تنتجه الدول الأخرى عن طريق التبادل التجاري", 2], ["عرّف العالم الإسلامي.", "مجموعة الدول التي يشكل المسلمون فيها أكثر من 50% من جملة عدد السكان", 0], ["متى اعتنق العمانيون الإسلام؟ وكيف؟", "في عهد الرسول صلى الله عليه وسلم طواعية", 0], ["اذكر أسس السياسة الخارجية لسلطنة عُمان كما وردت في الدرس.", "حسن الجوار، وعدم التدخل في الشؤون الداخلية، وانتهاج سياسة عدم الانحياز، ودعم العلاقات مع الدول الشقيقة والصديقة", 1], ["استنتج أثر الالتزام بالمعاهدات والقوانين على العلاقات بين الدول.", "يبني الثقة ويحفظ الحقوق ويقلل النزاعات، ويؤدي إلى التفاهم الواعي والتعاون البناء من أجل الأمن والسلام", 2], ["في أي المناطق شارك العمانيون في الفتوحات الإسلامية برًا؟", "في العراق وفارس وبلاد السند", 0], ["ما موقف سلطنة عُمان من القضية الفلسطينية كما ورد في الدرس؟", "تدين استمرار احتلال إسرائيل للأراضي الفلسطينية والعربية الأخرى، وتدعو إلى تحرير الأراضي المحتلة واستعادة حقوق الشعب الفلسطيني", 1], ["كيف تخدم سياسة عدم التدخل في الشؤون الداخلية دور سلطنة عُمان الإقليمي؟", "تكسبها ثقة الأطراف المختلفة، فتصبح محورًا للتشاور والتنسيق، وتسهم في التقريب بين الدول وتعزيز السلام", 2], ["مع أي منظمة عقدت سلطنة عُمان مؤتمرات ثقافية شاركت فيها دول إسلامية؟", "المنظمة الإسلامية للتربية والعلوم والثقافة (الإيسيسكو)", 0], ["اذكر هدفين للتعاون الاقتصادي بين سلطنة عُمان والدول الإسلامية.", "زيادة فرص التجارة والاستثمار، والتوسع في تبادل السلع والخدمات، ونقل التكنولوجيا والخبرة الفنية، وإنشاء سوق إسلامية مشتركة", 1], ["لماذا يُعدّ إنشاء سوق إسلامية مشتركة خطوة مهمة؟", "لأنه يشجع المبادلات التجارية والاستثمارات والتنسيق بين الدول الإسلامية، ويعزز دورها في النظام الاقتصادي العالمي", 2], ["ما القيم الإسلامية التي تنطلق منها دعوة سلطنة عُمان إلى الحوار بين الثقافات؟", "التسامح، والعدل، والسلام", 0], ["كيف استفادت سلطنة عُمان من اتفاقياتها الاقتصادية مع الدول الإسلامية في بناء نهضتها؟", "زيادة الاستثمار بين الطرفين، واستقدام المختصين للمشاركة في بناء النهضة العمانية الحديثة في مختلف المجالات", 1], ["أين يقع مقر منظمة التعاون الإسلامي؟", "في مدينة جدة", 0], ["ما الحادثة التي أدت إلى نشأة منظمة التعاون الإسلامي؟", "حرق المتطرفين اليهود المسجد الأقصى في أغسطس عام 1969م، وما تلاه من عقد أول قمة إسلامية في الرباط", 1], ["ما الفرق بين هدف البنك الإسلامي للتنمية وتخصص الإيسيسكو؟", "البنك يساعد الدول الفقيرة بتنفيذ المشاريع التنموية، أما الإيسيسكو فمنظمة متخصصة في ميادين التربية والعلوم والثقافة والاتصال ومقرها الرباط", 2], ["متى انضمت سلطنة عُمان إلى منظمة التعاون الإسلامي؟ وكم عدد الدول الأعضاء؟", "عام 1972م، وتضم المنظمة سبعًا وخمسين دولة إسلامية", 0], ["أين يقع مقر مجمع الفقه الإسلامي؟", "في مكة المكرمة", 1], ["كيف تخدم عضوية سلطنة عُمان في منظمة التعاون الإسلامي قضايا العالم الإسلامي؟", "تتيح لها المشاركة في العمل الإسلامي المشترك وتأييد القضايا الإسلامية وفق قرارات المنظمة، والتعاون في التنمية والتربية والثقافة عبر منظماتها التابعة", 2], ["اذكر ثلاثة شعوب أو دول قدمت لها سلطنة عُمان مساعدات إنسانية.", "الشعب الفلسطيني، والشعب البوسني، ومسلمو كوسوفو، والشعب الأفغاني، وشعوب شرق أفريقيا، وإيران وتركيا، ودول جنوب شرق آسيا", 0], ["عرّف التسونامي.", "مصطلح ياباني يعني موجة الميناء، وهو موجة محيطية ضخمة على هيئة سلسلة واسعة من الأمواج والمد البحري تسببها الزلازل والبراكين", 1], ["ما الأسس التي انطلقت منها سلطنة عُمان في الاهتمام بنكبات الدول الأخرى؟", "التعاليم الإسلامية الداعية إلى التكافل والرحمة، والتضامن الإسلامي والإنساني، وحسن الجوار، والإسهام في تحقيق السلام والاستقرار", 2], ["في أي تاريخ ضربت موجة التسونامي سواحل دول جنوب شرق آسيا؟", "يوم 26/12/2004م", 0]], "o": ["يحدد موقع سلطنة عُمان بالنسبة للعالم الإسلامي على الخريطة (الشكل 1).", "يوضح دور الموقع الإستراتيجي في توطيد علاقات سلطنة عُمان بجيرانها وفي التواصل الحضاري.", "يستنتج أثر التنوع المناخي بين دول العالم الإسلامي على التكامل الاقتصادي (نشاط 1).", "يعتز بانتمائه لوطنه وللعالم الإسلامي."]}, {"t": "عُمان في محيطها العالمي", "u": "الوحدة الثالثة: عُمان في محيطها الإسلامي والعالمي", "q": [["اذكر ثلاثًا من الدول المؤسسة للرابطة إلى جانب سلطنة عُمان.", "موريشيوس، والهند، وجنوب أفريقيا، وأستراليا، وسنغافورة، وكينيا", 0], ["ما المجال الرئيس الذي تركز عليه أهداف الرابطة؟ ولماذا؟", "التعاون الاقتصادي؛ لأهميته في الحياة المعاصرة لتحقيق التكامل وزيادة فرص الاستثمار والتنمية الشاملة للدول الأعضاء", 1], ["أعط مثالين على آليات الرابطة لتحقيق أهدافها.", "مشروعات تسهيل التجارة، وتشجيع الاستثمار الأجنبي، والتبادل العلمي والتكنولوجي، والسياحة، وتطوير البنية الأساسية، وتنمية الموارد البشرية", 2], ["ما دور سلطنة عُمان في رابطة الدول المطلة على المحيط الهندي؟", "قامت بدور نشط في إنشائها، واستضافت الاجتماع الوزاري في مسقط في أبريل 2001م، وتولت رئاستها لمدة عامين (2001–2003م)", 0], ["كيف تسهم الروابط بين المعاهد والجامعات في الدول الأعضاء في تنمية الموارد البشرية؟", "تتيح تبادل الخبرات والبرامج التدريبية والبحث المشترك، فترتفع كفاءة الكوادر البشرية في الدول الأعضاء", 2], ["متى انضمت سلطنة عُمان إلى الأمم المتحدة؟", "في أكتوبر 1971م", 0], ["أين يقع مقر منظمة اليونسكو؟ وما أبرز أهدافها؟", "في باريس؛ وتهدف إلى المساهمة في صون السلم والأمن الدوليين، وتعزيز التفاهم بين الأمم، وتنشيط التربية، ونشر الثقافة، وحفظ المعرفة وتقدمها", 1], ["ما الفائدة التي تحصل عليها سلطنة عُمان من عضويتها في اليونسكو؟", "حضور فعاليات اللجان والمجالس والمشاركة في أنشطتها، والحصول على المعونة الفنية والمالية لتنفيذ المشروعات المتعلقة بالتربية والعلوم والثقافة والاتصال", 2], ["لماذا أُسست الأمم المتحدة عام 1945م؟", "لتحل محل عصبة الأمم وتعمل على إرساء الأمن والسلام في العالم بعد ويلات حربين عالميتين", 0], ["اذكر موقعين عُمانيين مدرجين في قائمة التراث العالمي.", "قلعة بهلاء، وموقع بات الأثري، ومدينة قلهات الأثرية", 1], ["ما أهداف انضمام سلطنة عُمان لشبكة المدارس المنتسبة لليونسكو؟", "زيادة المعرفة بمشكلات العالم، ودعم التعاون الدولي، وتنمية التفاهم بين الشعوب، وتنمية القدرة على الاتصال بالآخرين والتحاور معهم", 2], ["ما المنظمة المختصة بمراقبة تفشي الأمراض السارية والأوبئة ومكافحتها؟", "منظمة الصحة العالمية", 0], ["ما المنظمات المختصة بالمجالات الآتية: مراقبة تشغيل الأطفال، استحداث استزراع الأسماك، حل النزاعات بين الدول؟", "منظمة العمل الدولية، ومنظمة الأغذية والزراعة (الفاو)، ومجلس الأمن الدولي", 1], ["لماذا تحفظت سلطنة عُمان على بعض بنود اتفاقية حقوق الطفل رغم تصديقها عليها؟", "لأن هذه البنود لا تتفق مع أحكام الشريعة الإسلامية والتشريعات المعمول بها في سلطنة عُمان", 2], ["اذكر ثلاثة من مجالات عمل منظمة اليونيسيف.", "تخفيض نسبة وفيات الأمهات والأطفال دون الخامسة، والحد من سوء التغذية، وتوفير التعليم الأساسي للجميع، وتخفيض أمية الكبار، وتحسين حماية الأطفال", 0], ["ما اختصاصات مجلس الأمن الدولي؟ وما دلالة ترؤس سلطنة عُمان له؟", "حفظ الأمن والسلام الدوليين واستخدام القوة لإعادة السلم بين الدول؛ وترؤس سلطنة عُمان له مرتين (1994–1995م) دليل على الثقة الدولية بدورها في خدمة السلام", 1], ["صنّف بندي «التعليم المجاني» و«التعبير عن الرأي» ضمن محاور اتفاقية حقوق الطفل.", "التعليم المجاني: حقوق النمو والتطور. التعبير عن الرأي: حقوق المشاركة", 2], ["متى مُنح السلطان قابوس بن سعيد – طيب الله ثراه – جائزة السلام الدولية؟", "عام 1998م", 0], ["كيف تُمنح جائزة السلطان قابوس لصون البيئة؟", "تُمنح كل عامين من خلال برنامج الإنسان والمحيط الحيوي (الماب) في منظمة اليونسكو، تقديرًا للمساهمات المتميزة في مجال حماية البيئة", 1], ["ما الجهات التي منحت السلطان قابوس بن سعيد – طيب الله ثراه – جائزة السلام الدولية؟", "عشر جامعات أمريكية، إضافة إلى عدد كبير من مراكز البحوث والدراسات السياسية والإستراتيجية", 0], ["اذكر الأعمال الواجبة لتحقيق السلام العالمي كما عبر عنها الخطاب السامي في نشاط (9).", "محاربة الظلم والاستبداد، والتصدي لسياسات التطهير العرقي وامتهان كرامة الإنسان، ومحاربة احتلال أراضي الغير، والسعي إلى إقامة ميزان العدل", 1], ["متى وُقعت اتفاقية تنمية العلاقات التجارية والاستثمارية بين سلطنة عُمان والولايات المتحدة الأمريكية؟ وإلامَ مهدت؟", "في 7 يوليو 2004م، ومهدت لعقد اتفاقية التجارة الحرة بين البلدين عبر تشكيل مجلس أعمال عُماني أمريكي", 1], ["لماذا تحرص الحكومة على المحافظة على الحرف التقليدية وتطويرها في ظل العولمة؟", "لأنها إرث حضاري وأحد مقومات الهوية العمانية التي يجب الحفاظ عليها في خضم تداعيات العصر", 2], ["ما أثر اتفاقية التجارة الحرة بين الدول العربية على البضائع الواردة من بعض الدول العربية؟", "أُلغيت الرسوم الجمركية عنها", 1]], "o": ["يعدد الدول المؤسسة لرابطة الدول المطلة على المحيط الهندي ويبين دور سلطنة عُمان في إنشائها.", "يحلل أهداف الرابطة ويحدد مجالها الرئيس (نشاط 1).", "يحدد على الخريطة أهم الدول المطلة على المحيط الهندي (نشاط 3).", "يقدّر أهمية التكتلات الاقتصادية الإقليمية في تنمية الدول."]}]};</script>
